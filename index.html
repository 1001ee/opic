거든요.\n\n그런데 있잖아요, 그가 노래를 시작하는 순간 극장 전체가 조용해졌어요. 맨 앞줄에 앉아 있어서 아주 가까이서 그의 표정 하나하나까지 다 보였어요. 중간에는 관객들과 눈을 맞추면서 애드리브도 던졌는데, 극장 전체가 빵 터졌죠.\n\n마지막 장면쯤엔 온몸에 소름이 돋아 있었어요. 저만 그런 게 아니었는지, 관객들의 기립박수가 한참 이어졌어요. 아무 기대 없이 들어갔다가 완전히 감동해서 나왔기 때문에 더 기억에 남아요. 그 후로는 극장 크기로 공연을 판단하지 않게 됐어요.", "struct": [["1️⃣ 도입", "회상 시그널 + 기대 없었음"], ["2️⃣ 반전", "노래 시작하자 장내 침묵"], ["3️⃣ 디테일", "맨 앞줄 · 눈맞춤 · 애드리브"], ["4️⃣ 절정", "온몸에 소름 · 기립박수"], ["5️⃣ 마무리", "무기대→감동 + 교훈(Since then)"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["I didn't expect much", "큰 기대는 없었다"], ["guess what?", "그런데 있잖아요?"], ["the whole room went silent", "장내가 조용해졌다"], ["front row", "맨 앞줄"], ["eye contact / ad-libs", "눈맞춤 / 애드리브"], ["burst out laughing", "빵 터지다"], ["goosebumps all over", "온몸에 소름"], ["standing ovation", "기립박수"], ["zero expectations → blown away", "무기대 → 완전 감동"], ["Since then", "그 후로"]], "audio": "audio/1_서베이/1-031 6. 공연(Play)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-031 6. 공연(Play)_과거 경험.mp3"}, {"id": "1-032", "cat": "survey", "catName": "서베이 질문", "num": 6, "topic": "공연", "topicEn": "Play", "type": "비교", "badge": "32 비교", "enQ": "How has your taste in plays changed over the years? What kinds of performances did you enjoy in the past, and what do you prefer these days? Compare them for me.", "enA": "My taste in plays has definitely changed over the years. Back then — I mean, when I first started watching shows — it was all about the spectacle. I used to go for big licensed musicals with fancy sets, huge casts, and famous songs.\n\nTo be honest, back then I chose shows by name value. If it wasn't famous, I simply wasn't interested.\n\nThese days, my taste has matured, I guess. I prefer small original plays in Daehakro — simple stages, small casts, but stories that keep me thinking on the way home. The intimacy of a small theater beats the spectacle for me now. Funny enough, the shows I remember most are the little ones nobody knows. So yeah, compared to before, I've moved from big and flashy to small and deep — and honestly, I enjoy theater way more now.", "koQ": "시간이 지나며 당신의 공연 취향은 어떻게 변화했나요? 과거에는 어떤 공연을 즐겼고, 요즘에는 무엇을 선호하나요? 둘을 비교해주세요.", "koA": "제 공연 취향은 시간이 지나면서 확실히 변했어요. 그때는, 그러니까 공연을 처음 보기 시작했을 때는 스펙터클이 전부였어요. 화려한 무대 세트, 대규모 출연진, 유명한 노래가 나오는 대형 라이선스 뮤지컬만 골라 다녔죠.\n\n솔직히 그때는 공연을 이름값으로 골랐어요. 유명하지 않으면 아예 관심도 없었죠.\n\n요즘은 취향이 성숙해진 것 같아요. 대학로의 작은 창작극을 더 좋아하거든요. 단순한 무대, 적은 출연진이지만 집에 가는 길 내내 생각하게 만드는 이야기들이요. 이제 저한테는 소극장의 친밀함이 스펙터클을 이겨요. 재밌는 건, 가장 기억에 남는 공연들은 아무도 모르는 작은 작품들이라는 거예요. 네, 예전과 비교하면 크고 화려한 것에서 작고 깊은 것으로 옮겨 왔고, 솔직히 지금이 공연을 훨씬 더 즐기고 있어요.", "struct": [["1️⃣ 도입", "변화 인정 (definitely changed)"], ["2️⃣ 과거", "대형 뮤지컬 · 화려한 스펙터클"], ["3️⃣ 과거", "이름값으로 선택(name value)"], ["4️⃣ 현재", "대학로 창작극 · 깊은 이야기"], ["5️⃣ 마무리", "크고 화려함 → 작고 깊음 + way more"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["it was all about ~", "~이 전부였다"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["fancy sets", "화려한 무대 세트"], ["name value", "이름값"], ["taste has matured", "취향이 성숙해졌다"], ["keep me thinking", "계속 생각하게 만들다"], ["A beats B", "A가 B를 이긴다"], ["Funny enough", "재밌게도"], ["compared to ~", "~과 비교하면"], ["way more", "훨씬 더"]], "audio": "audio/1_서베이/1-032 6. 공연(Play)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-032 6. 공연(Play)_비교.mp3"}, {"id": "1-033", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "묘사", "badge": "33 묘사", "enQ": "Describe your favorite singer or musician. What does he or she look like on stage, and what style of music does this person perform? Tell me about this musician in detail.", "enA": "My favorite singer? That's easy — IU. She's one of the biggest artists in Korea, and honestly, I've been a fan for more than ten years.\n\nOn stage, she's fascinating to watch. She's quite petite, but the moment she starts singing, she owns the stage — calm, confident, and completely in control. Her voice is incredibly clear, and she hits the high notes like it's nothing. Between songs, she chats with fans like she's talking to old friends, which I love.\n\nAs for her style, she does everything from sweet ballads to upbeat pop, and she even writes her own songs. That's rare, and it's exactly why her music feels so personal. So yeah, that's pretty much my favorite musician — her voice never gets old.", "koQ": "가장 좋아하는 가수나 음악가를 묘사해주세요. 그 사람은 무대에서 어떤 모습이고, 어떤 스타일의 음악을 하나요? 이 음악가에 대해 자세히 말해주세요.", "koA": "제가 가장 좋아하는 가수요? 쉽네요. 아이유예요. 한국에서 가장 인기 많은 아티스트 중 한 명인데, 솔직히 저는 10년 넘게 팬이에요.\n\n무대 위의 그녀는 정말 매력적이에요. 체구는 아담한데, 노래를 시작하는 순간 무대를 완전히 장악해요. 차분하고, 자신감 있고, 완벽하게 컨트롤하죠. 목소리는 믿을 수 없이 맑고, 고음도 아무렇지 않게 소화해요. 노래 사이사이에는 오랜 친구와 이야기하듯 팬들과 수다를 떠는데, 그 모습도 정말 좋아요.\n\n스타일로 말하자면, 감미로운 발라드부터 신나는 팝까지 다 하고, 심지어 자기 노래를 직접 쓰기도 해요. 흔치 않은 일이죠. 그래서 그녀의 음악이 그렇게 개인적으로 느껴지는 거예요. 네, 이게 제 최애 음악가예요. 그 목소리는 아무리 들어도 질리지 않아요.", "struct": [["1️⃣ 도입", "아이유 + 10년 팬 어필"], ["2️⃣ 무대", "아담하지만 무대 장악(owns)"], ["3️⃣ 보컬", "맑은 목소리 · 쉬운 고음 처리"], ["4️⃣ 스타일", "발라드~팝 · 자작곡(rare!)"], ["5️⃣ 마무리", "개인적인 음악 + 정리 멘트"]], "expr": [["for more than ten years", "10년 넘게"], ["fascinating to watch", "보는 재미가 있는"], ["petite", "아담한 체구의"], ["own the stage", "무대를 장악하다"], ["completely in control", "완벽하게 컨트롤하는"], ["hit the high notes", "고음을 소화하다"], ["like it's nothing", "아무렇지 않게"], ["write her own songs", "자작곡을 쓰다"], ["feel so personal", "아주 개인적으로 느껴지다"], ["never gets old", "아무리 들어도 질리지 않는다"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-033 7. 음악감상(Music)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-033 7. 음악감상(Music)_묘사.mp3"}, {"id": "1-034", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "습관", "badge": "34 습관", "enQ": "Tell me about how you usually listen to music. What devices or apps do you use, and when and where do you normally listen? Describe your listening habits in detail.", "enA": "How do I listen to music? Well, like most people these days, everything happens on my smartphone. I use a streaming app with wireless earphones, so my entire music library is right in my pocket.\n\nAs for when and where — honestly, music is the background music of my day. I listen during my commute, while walking in the park, and when I get some work done at a cafe. I even have different playlists for different moods: an upbeat one for mornings, calm ballads for nighttime.\n\nOh, and one little habit of mine: before going to bed, I always play a quiet playlist with the lights off — it's the best way to wind down after a long day. So yeah, that's pretty much how I listen to music. Basically, my earphones and I are inseparable.", "koQ": "당신이 주로 음악을 듣는 방법에 대해 말해주세요. 어떤 기기나 앱을 사용하고, 보통 언제 어디서 듣나요? 당신의 음악 감상 습관을 자세히 설명해주세요.", "koA": "음악을 어떻게 듣냐고요? 음, 요즘 대부분의 사람들처럼 모든 게 스마트폰에서 이루어져요. 스트리밍 앱과 무선 이어폰을 쓰니까, 제 음악 라이브러리 전체가 주머니 속에 있는 셈이죠.\n\n언제 어디서 듣는지로 말하자면, 솔직히 음악은 제 하루의 배경음악이에요. 출퇴근길에 듣고, 공원을 걸으면서 듣고, 카페에서 일할 때도 들어요. 기분별 플레이리스트도 따로 있어요. 아침용 신나는 리스트, 밤용 잔잔한 발라드 리스트요.\n\n아, 그리고 제 작은 습관 하나. 자기 전에는 항상 불을 끄고 조용한 플레이리스트를 틀어요. 긴 하루 끝에 긴장을 푸는 최고의 방법이거든요. 네, 제가 음악을 듣는 방식은 대체로 이래요. 한마디로 이어폰과 저는 뗄 수 없는 사이예요.", "struct": [["1️⃣ 도입", "스마트폰 + 스트리밍 앱"], ["2️⃣ 기기", "무선 이어폰 · 주머니 속 음악"], ["3️⃣ 장소", "출퇴근 · 산책 · 카페 작업"], ["4️⃣ 방식", "기분별 플레이리스트"], ["5️⃣ 마무리", "자기 전 루틴 + 정리 멘트"]], "expr": [["streaming app", "스트리밍 앱"], ["wireless earphones", "무선 이어폰"], ["right in my pocket", "주머니 속에 그대로"], ["the background music of my day", "내 하루의 배경음악"], ["during my commute", "출퇴근길에"], ["get some work done", "일을 좀 하다"], ["playlists for different moods", "기분별 플레이리스트"], ["before going to bed", "자기 전에"], ["wind down", "긴장을 풀다"], ["inseparable", "뗄 수 없는"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-034 7. 음악감상(Music)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-034 7. 음악감상(Music)_습관.mp3"}, {"id": "1-035", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "취향", "badge": "35 취향", "enQ": "What genres of music do you like? Who is your favorite singer or composer, and why do you like that musician?", "enA": "If I had to choose, I'd say ballads and R&B are my go-to genres. For me, it's all about the melody and the lyrics — I want songs that actually say something, not just background noise.\n\nAnd as I mentioned, my favorite singer is IU. Why do I like her? Three reasons. First, her voice — clear and emotional at the same time. Second, she writes her own songs, so every album feels like her own story. And third, her lyrics — they're like poetry set to music. Some lines hit me so hard that I just stop and replay them.\n\nOf course, I listen to upbeat pop when I need energy, but at the end of the day, I always come back to her ballads. When it comes to music, nothing beats a song that understands your feelings. That's my taste in a nutshell.", "koQ": "어떤 장르의 음악을 좋아하나요? 가장 좋아하는 가수나 작곡가는 누구이고, 왜 그 음악가를 좋아하나요?", "koA": "굳이 골라야 한다면 발라드와 R&B가 제 단골 장르예요. 저한테는 멜로디와 가사가 전부거든요. 그냥 배경 소음이 아니라, 진짜 무언가를 말하는 노래를 원해요.\n\n그리고 말씀드렸듯이 제 최애 가수는 아이유예요. 왜 좋아하냐고요? 세 가지 이유가 있어요. 첫째, 목소리요. 맑으면서도 감정이 실려 있어요. 둘째, 자기 노래를 직접 써서 앨범마다 그녀만의 이야기처럼 느껴져요. 셋째, 가사요. 음악에 얹은 시 같거든요. 어떤 구절은 너무 와닿아서 멈추고 다시 듣게 돼요.\n\n물론 에너지가 필요할 땐 신나는 팝도 듣지만, 결국엔 항상 그녀의 발라드로 돌아와요. 음악에 관해서라면, 내 감정을 알아주는 노래만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 발라드·R&B"], ["2️⃣ 기준", "멜로디+가사(it's all about)"], ["3️⃣ 최애", "아이유 · 이유 3가지 나열"], ["4️⃣ 유연함", "팝도 듣지만 결국 발라드"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "expr": [["if I had to choose", "굳이 골라야 한다면"], ["go-to genres", "단골 장르"], ["it's all about ~", "~이 전부다/핵심이다"], ["say something", "(노래가) 무언가를 말하다"], ["Three reasons. First...", "이유는 세 가지예요"], ["write her own songs", "자작곡을 쓰다"], ["poetry set to music", "음악에 얹은 시"], ["hit me so hard", "너무 와닿다"], ["at the end of the day", "결국엔"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-035 7. 음악감상(Music)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-035 7. 음악감상(Music)_취향.mp3"}, {"id": "1-036", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "과거 경험", "badge": "36 과거 경험", "enQ": "How did you first start getting interested in music? What songs did you listen to when you were young, and what was your favorite one back then? Tell me the story.", "enA": "Let me tell you how I first got into music. It all started with my older sister's MP3 player when I was in elementary school. Back then, having your own music device was a huge deal, and I wasn't allowed to touch it.\n\nBut guess what? Whenever she was out, I would sneak into her room and listen to her playlist. It was full of K-pop idol songs, and I still remember the thrill of listening with one ear on the door. My favorite was an upbeat dance track — I must have played it hundreds of times.\n\nEventually, I saved up my allowance for months to buy my own MP3 player, and that's when music officially became my thing. Since then, music has been the one hobby that never left me. So yeah, that's the story of how it all began — with a borrowed playlist and a little brother's curiosity.", "koQ": "어떻게 처음 음악에 관심을 가지기 시작했나요? 어릴 때 어떤 노래들을 들었고, 그 당시 가장 좋아했던 노래는 무엇이었나요? 그 이야기를 들려주세요.", "koA": "제가 어떻게 음악에 빠지게 됐는지 말씀드릴게요. 모든 건 초등학생 때 누나의 MP3 플레이어에서 시작됐어요. 그때는 자기만의 음악 기기를 갖는 게 엄청난 일이었고, 저는 만지는 것도 금지였죠.\n\n그런데 있잖아요, 누나가 나갈 때마다 저는 방에 몰래 들어가서 플레이리스트를 들었어요. K-pop 아이돌 노래로 가득했는데, 한쪽 귀로는 문 쪽 소리를 살피며 듣던 그 스릴이 아직도 기억나요. 최애곡은 신나는 댄스곡이었는데, 수백 번은 들었을 거예요.\n\n결국 몇 달 동안 용돈을 모아서 제 MP3 플레이어를 샀고, 그때부터 음악이 공식적으로 제 취미가 됐어요. 그 후로 음악은 한 번도 저를 떠난 적 없는 유일한 취미예요. 네, 이게 모든 것의 시작이에요. 빌린 플레이리스트와 동생의 호기심에서요.", "struct": [["1️⃣ 도입", "초등학생 · 누나의 MP3"], ["2️⃣ 사건", "몰래 입장(sneak into) · 스릴"], ["3️⃣ 최애곡", "신나는 댄스곡 · 수백 번 재생"], ["4️⃣ 전환점", "용돈 모아 내 MP3 구입"], ["5️⃣ 마무리", "Since then + 시적인 정리"]], "expr": [["get into ~", "~에 빠지다/시작하다"], ["MP3 player", "MP3 플레이어"], ["a huge deal", "엄청난 일"], ["wasn't allowed to ~", "~하는 게 금지였다"], ["guess what?", "그런데 있잖아요?"], ["sneak into ~", "~에 몰래 들어가다"], ["hundreds of times", "수백 번"], ["save up my allowance", "용돈을 모으다"], ["become my thing", "내 취미/내 것이 되다"], ["Since then", "그 후로"], ["borrowed playlist", "빌린 플레이리스트"]], "audio": "audio/1_서베이/1-036 7. 음악감상(Music)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-036 7. 음악감상(Music)_과거 경험1.mp3"}, {"id": "1-037", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "과거 경험", "badge": "37 과거 경험", "enQ": "Please tell me about a special memory you have related to listening to music. Were you listening to your favorite song? When and where did it happen, and why is it so memorable to you?", "enA": "Oh, this reminds me of a night from a few years ago. I was on the last bus home after a really rough day at work — one of those days when nothing goes right, you know?\n\nI was just staring out the window with my earphones in, when out of nowhere, my favorite IU ballad came on shuffle. And the timing was unreal — the slow melody, the quiet bus, the city lights sliding past the window... it felt like the song was written just for that moment.\n\nI'm not kidding, I got a little teary — but in a good way. By the time I got off, I felt strangely comforted, like the song had patted me on the shoulder. It's so memorable because that's when I realized music isn't just entertainment — sometimes it's therapy. Since then, that song has been my go-to on hard days.", "koQ": "음악 감상과 관련된 특별한 기억에 대해 말해주세요. 가장 좋아하는 노래를 듣고 있었나요? 언제 어디서 있었던 일이고, 왜 그것이 기억에 남나요?", "koA": "아, 몇 년 전 어느 밤이 생각나네요. 회사에서 정말 힘든 하루를 보내고 막차를 타고 집에 가던 길이었어요. 아시죠, 뭘 해도 안 풀리는 그런 날이요.\n\n이어폰을 끼고 멍하니 창밖을 보고 있었는데, 난데없이 셔플로 제 최애 아이유 발라드가 나온 거예요. 타이밍이 비현실적이었어요. 잔잔한 멜로디, 조용한 버스, 창밖으로 스쳐 가는 도시의 불빛들. 마치 그 순간을 위해 쓰인 노래 같았어요.\n\n진짜예요, 눈물이 살짝 났어요. 근데 좋은 의미로요. 내릴 때쯤엔 이상하게 위로받은 기분이었어요. 노래가 어깨를 토닥여 준 것처럼요. 음악이 그냥 오락이 아니라 가끔은 치료라는 걸 그때 깨달았기 때문에 더 기억에 남아요. 그 후로 그 노래는 힘든 날마다 찾는 제 단골 곡이 됐어요.", "struct": [["1️⃣ 도입", "회상 시그널 + 힘든 날 막차"], ["2️⃣ 사건", "셔플로 최애곡(out of nowhere)"], ["3️⃣ 장면", "멜로디 · 조용한 버스 · 야경"], ["4️⃣ 감정", "눈물 · 위로(comforted)"], ["5️⃣ 마무리", "음악 = 치료 깨달음 + Since then"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["the last bus home", "집으로 가는 막차"], ["nothing goes right", "뭘 해도 안 풀리다"], ["out of nowhere", "난데없이, 갑자기"], ["come on shuffle", "셔플로 (노래가) 나오다"], ["city lights sliding past", "스쳐 가는 도시 불빛"], ["I'm not kidding", "진짜예요"], ["comforted", "위로받은"], ["pat me on the shoulder", "어깨를 토닥여 주다"], ["therapy", "치료, 힐링"], ["Since then", "그 후로"]], "audio": "audio/1_서베이/1-037 7. 음악감상(Music)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-037 7. 음악감상(Music)_과거 경험2.mp3"}, {"id": "1-038", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "비교", "badge": "38 비교", "enQ": "How has your taste in music changed over the years? What kind of music did you enjoy in the past, and what do you listen to now? Compare the two periods in detail.", "enA": "My music taste has changed a lot over the years. Back then, as I mentioned, it was all about K-pop idol songs — fast beats, catchy hooks, and cool dance moves. I used to follow the music charts religiously and knew every new release.\n\nHonestly, back then I didn't really listen to the lyrics. If the beat was good, I was happy.\n\nThese days, it's almost the opposite. I mostly listen to calm ballads and R&B, and now the lyrics matter more than the beat. I've also stopped following the charts — instead, I build my own playlists and dig into old songs I missed. Funny enough, some songs I ignored as a kid hit me so hard now that I'm older. So yeah, compared to the past, my taste has moved from fast and loud to slow and meaningful — my playlist basically grew up with me.", "koQ": "시간이 지나며 당신의 음악 취향은 어떻게 변화했나요? 과거에는 어떤 음악을 즐겼고, 지금은 무엇을 듣나요? 두 시기를 자세히 비교해주세요.", "koA": "제 음악 취향은 시간이 지나면서 많이 변했어요. 그때는, 말씀드렸듯이 K-pop 아이돌 노래가 전부였어요. 빠른 비트, 중독성 있는 후렴, 멋진 춤이요. 음악 차트를 광적으로 챙겨 보면서 신곡은 다 꿰고 있었죠.\n\n솔직히 그때는 가사를 제대로 듣지도 않았어요. 비트만 좋으면 만족했거든요.\n\n요즘은 거의 정반대예요. 주로 잔잔한 발라드와 R&B를 듣고, 이제는 비트보다 가사가 더 중요해요. 차트도 더 이상 안 따라가요. 대신 저만의 플레이리스트를 만들고, 놓쳤던 옛날 노래들을 찾아 들어요. 재밌는 건, 어릴 때 그냥 지나쳤던 노래들이 나이가 드니까 확 와닿는다는 거예요. 네, 과거와 비교하면 제 취향은 빠르고 시끄러운 것에서 느리고 의미 있는 것으로 옮겨 왔어요. 제 플레이리스트가 저와 함께 자란 셈이죠.", "struct": [["1️⃣ 도입", "변화 인정 (changed a lot)"], ["2️⃣ 과거", "아이돌 댄스곡 · 차트 신봉"], ["3️⃣ 과거", "가사 무관심 · 비트가 전부"], ["4️⃣ 현재", "발라드·R&B · 가사 > 비트"], ["5️⃣ 마무리", "compared to + 플레이리스트 성장"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["it was all about ~", "~이 전부였다"], ["catchy hooks", "중독성 있는 후렴"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["follow ~ religiously", "~을 광적으로 챙기다"], ["the opposite", "정반대"], ["lyrics matter more than the beat", "비트보다 가사가 중요하다"], ["dig into ~", "~을 파고들다"], ["Funny enough", "재밌게도"], ["hit me so hard", "너무 와닿다"], ["grew up with me", "나와 함께 자랐다"]], "audio": "audio/1_서베이/1-038 7. 음악감상(Music)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-038 7. 음악감상(Music)_비교.mp3"}, {"id": "1-039", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "묘사", "badge": "39 묘사", "enQ": "Describe a concert hall you often visit. Where is it, and what do you like about the venue? Tell me about a concert you saw there.", "enA": "The concert hall I visit most often is the big dome in Olympic Park, in the southeastern part of Seoul. It's right by the subway station, and since it's inside a huge park, you can enjoy a nice walk before the show — honestly, that's half the fun.\n\nWhat I like about the venue is the scale. It holds more than ten thousand people, but the sound system is amazing, and the huge screens mean there's really no bad seat in the house.\n\nThe best concert I saw there was an IU concert a couple of years ago. Even from my seat way up high, her live vocals were crystal clear, and the whole crowd waving light sticks looked like a galaxy. So yeah, that's pretty much my favorite concert hall — every show there feels like a festival.", "koQ": "자주 방문하는 콘서트장을 묘사해주세요. 어디에 있고, 그 장소의 어떤 점이 좋은가요? 그곳에서 본 콘서트에 대해 말해주세요.", "koA": "제가 가장 자주 가는 콘서트장은 서울 동남쪽 올림픽공원에 있는 큰 돔 공연장이에요. 지하철역 바로 옆이고, 거대한 공원 안에 있어서 공연 전에 산책도 즐길 수 있어요. 솔직히 그게 재미의 절반이죠.\n\n이 공연장에서 좋아하는 점은 스케일이에요. 만 명 넘게 수용하는데도 음향 시설이 훌륭하고, 대형 스크린이 있어서 사실상 나쁜 자리가 없어요.\n\n거기서 본 최고의 콘서트는 몇 년 전 아이유 콘서트였어요. 꽤 높은 자리였는데도 라이브 보컬이 수정처럼 선명했고, 응원봉을 흔드는 관중 전체가 마치 은하수 같았어요. 네, 이게 제 최애 콘서트장이에요. 그곳의 모든 공연은 축제처럼 느껴져요.", "struct": [["1️⃣ 도입", "올림픽공원 돔 · 역 바로 옆"], ["2️⃣ 보너스", "공연 전 공원 산책(half the fun)"], ["3️⃣ 장점", "1만 명 규모 · 음향 · 대형 스크린"], ["4️⃣ 경험", "아이유 콘서트 · 응원봉 은하수"], ["5️⃣ 마무리", "축제 같은 공연장 + 정리"]], "expr": [["right by the subway station", "지하철역 바로 옆"], ["that's half the fun", "그게 재미의 절반이다"], ["venue", "공연장, 행사장"], ["hold more than ten thousand people", "만 명 이상 수용하다"], ["no bad seat in the house", "나쁜 자리가 없다"], ["way up high", "꽤 높은 곳에"], ["crystal clear", "수정처럼 선명한"], ["light sticks", "응원봉"], ["look like a galaxy", "은하수처럼 보이다"], ["feel like a festival", "축제처럼 느껴지다"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-039 8. 콘서트(Concert)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-039 8. 콘서트(Concert)_묘사.mp3"}, {"id": "1-040", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "습관", "badge": "40 습관", "enQ": "What do you usually do when you go to a concert? Tell me about your routine before the show begins and after it ends, step by step.", "enA": "A concert day actually starts months earlier, so let me walk you through it step by step. First comes the ticketing war — tickets for popular artists sell out in minutes in Korea, so I set an alarm and battle for seats the second they open.\n\nOn the day, I arrive a couple of hours early. I pick up my merch — usually the official light stick — take photos in front of the venue, and soak up the pre-show excitement with other fans.\n\nAfterward, my routine never changes: I can't stop humming the songs on my way out, and on the subway home, I go through all the photos and videos I took. Then, for about a week, I listen to the setlist on repeat, reliving the night. So yeah, that's pretty much my concert routine — honestly, the afterglow is half the experience.", "koQ": "콘서트에 갈 때 주로 무엇을 하나요? 공연이 시작되기 전과 끝난 후의 루틴을 순서대로 말해주세요.", "koA": "콘서트 날은 사실 몇 달 전부터 시작돼요. 순서대로 차근차근 말씀드릴게요. 먼저 티켓팅 전쟁이에요. 한국에서 인기 가수 티켓은 몇 분 만에 매진되기 때문에, 알람을 맞춰 놓고 티켓이 열리는 순간 자리 쟁탈전을 벌여요.\n\n당일에는 두 시간쯤 일찍 도착해요. 굿즈를 사고요. 보통 공식 응원봉이죠. 공연장 앞에서 사진을 찍고, 다른 팬들과 함께 공연 전의 설렘을 만끽해요.\n\n끝난 후의 루틴은 절대 안 변해요. 나오는 길에 노래를 계속 흥얼거리고, 집에 가는 지하철에서 찍은 사진과 영상을 전부 돌려봐요. 그리고 일주일 정도는 셋리스트를 무한 반복으로 들으면서 그날 밤을 다시 사는 거죠. 네, 이게 제 콘서트 루틴이에요. 솔직히 여운이 경험의 절반이에요.", "struct": [["1️⃣ 도입", "몇 달 전 티켓팅 전쟁부터!"], ["2️⃣ 당일", "2시간 일찍 · 굿즈 · 응원봉"], ["3️⃣ 공연 전", "인증샷 · 팬들과 설렘 공유"], ["4️⃣ 공연 후", "흥얼거림 · 사진 정리"], ["5️⃣ 마무리", "셋리스트 무한 반복 = 여운"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["ticketing war", "티켓팅 전쟁"], ["sell out in minutes", "몇 분 만에 매진되다"], ["the second they open", "열리는 그 순간에"], ["arrive a couple of hours early", "두어 시간 일찍 도착하다"], ["merch", "굿즈"], ["light stick", "응원봉"], ["can't stop humming", "계속 흥얼거리게 되다"], ["setlist", "셋리스트"], ["relive the night", "그날 밤을 다시 살다"], ["afterglow", "여운"]], "audio": "audio/1_서베이/1-040 8. 콘서트(Concert)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-040 8. 콘서트(Concert)_습관.mp3"}, {"id": "1-041", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "취향", "badge": "41 취향", "enQ": "What kind of concerts do you enjoy the most, and why do you like them? Tell me in detail.", "enA": "If I had to choose, I'd go for solo concerts by artists I really love, rather than big festivals with dozens of performers. For me, it's all about depth over variety.\n\nHere's why: at a solo concert, every single song is one I know and love, so I can sing along from the first track to the encore. The artist tells personal stories between songs, and the whole venue feels connected — thousands of strangers singing with one voice. That moment always gives me goosebumps.\n\nFestivals are fun too, don't get me wrong — but you spend half the time walking between stages and waiting. At the end of the day, I'd rather spend three hours fully immersed in one artist's world. When it comes to concerts, nothing beats that. That's my taste in a nutshell.", "koQ": "어떤 종류의 콘서트를 가장 즐기고, 왜 좋아하나요? 자세히 말해주세요.", "koA": "굳이 골라야 한다면, 수십 팀이 나오는 대형 페스티벌보다는 제가 정말 사랑하는 아티스트의 단독 콘서트를 선택할 거예요. 저한테는 다양함보다 깊이가 전부거든요.\n\n이유는 이래요. 단독 콘서트에서는 모든 곡이 제가 알고 사랑하는 노래라서, 첫 곡부터 앙코르까지 따라 부를 수 있어요. 아티스트는 곡 사이사이에 개인적인 이야기를 들려주고, 공연장 전체가 연결된 느낌이 들죠. 수천 명의 낯선 사람들이 한목소리로 노래하는 순간이요. 그 순간은 항상 소름이 돋아요.\n\n오해는 마세요, 페스티벌도 재밌어요. 근데 시간의 절반을 무대 사이를 걸어 다니고 기다리는 데 쓰게 되잖아요. 결국엔 한 아티스트의 세계에 세 시간 동안 완전히 몰입하는 게 더 좋아요. 콘서트에 관해서라면 그것만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 단독 콘서트(solo)"], ["2️⃣ 기준", "다양함보다 깊이(depth)"], ["3️⃣ 이유", "전곡 떼창 · 한목소리 · 소름"], ["4️⃣ 비교", "페스티벌 = 이동·대기 절반"], ["5️⃣ 마무리", "몰입 3시간 + in a nutshell"]], "expr": [["if I had to choose", "굳이 골라야 한다면"], ["solo concerts", "단독 콘서트"], ["it's all about ~", "~이 전부다/핵심이다"], ["depth over variety", "다양함보다 깊이"], ["Here's why", "이유는 이래요"], ["sing along", "따라 부르다, 떼창하다"], ["sing with one voice", "한목소리로 노래하다"], ["give me goosebumps", "소름 돋게 하다"], ["don't get me wrong", "오해는 마세요"], ["fully immersed", "완전히 몰입한"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-041 8. 콘서트(Concert)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-041 8. 콘서트(Concert)_취향.mp3"}, {"id": "1-042", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "과거 경험", "badge": "42 과거 경험", "enQ": "Please tell me about the concert that impressed you the most. When and where was it held, and who performed? How did you feel during the concert? Give me as many details as you can.", "enA": "Oh, this reminds me of the IU concert I went to a couple of years ago — it was held at the big dome in Olympic Park, and it's still the best night of my life, concert-wise.\n\nI'd won the ticketing war after three failed attempts, so my expectations were sky-high — and she blew them all away. Her live vocals were even better than the recordings. But the best part came during the encore: she sang her most famous ballad, and the whole crowd sang along, ten thousand voices as one.\n\nI'm not kidding, I had goosebumps from head to toe, and I even got a little teary. For those three hours, I forgot about everything else — work, stress, all of it. In the end, I walked out with a sore throat and the biggest smile, and that afterglow lasted a whole week. So yeah, that's my most impressive concert.", "koQ": "가장 인상 깊었던 콘서트에 대해 말해주세요. 언제 어디서 열렸고, 누가 공연했나요? 콘서트를 보는 동안 어떤 기분이었나요? 가능한 많은 세부사항을 말해주세요.", "koA": "아, 몇 년 전에 갔던 아이유 콘서트가 생각나네요. 올림픽공원의 큰 돔에서 열렸는데, 콘서트로는 아직도 제 인생 최고의 밤이에요.\n\n세 번의 실패 끝에 티켓팅 전쟁에서 이기고 간 거라 기대치가 하늘을 찔렀는데, 그녀는 그 기대를 완전히 뛰어넘었어요. 라이브 보컬이 음원보다 좋았죠. 그런데 최고의 순간은 앙코르 때였어요. 그녀가 가장 유명한 발라드를 불렀는데, 관중 전체가 떼창을 한 거예요. 만 명의 목소리가 하나처럼요.\n\n진짜예요, 머리부터 발끝까지 소름이 돋았고 눈물까지 살짝 났어요. 그 세 시간 동안은 회사도, 스트레스도, 모든 걸 잊었어요. 결국 목이 쉬고 함박웃음을 지은 채로 나왔고, 그 여운이 일주일을 갔어요. 네, 이게 가장 인상 깊었던 콘서트예요.", "struct": [["1️⃣ 도입", "아이유 콘서트 · 올림픽공원 돔"], ["2️⃣ 배경", "티켓팅 3수 끝 성공 · 높은 기대"], ["3️⃣ 절정", "앙코르 떼창 · 만 명이 한목소리"], ["4️⃣ 감정", "전신 소름 · 눈물 · 현실 잊음"], ["5️⃣ 마무리", "쉰 목 + 함박웃음 + 일주일 여운"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["the best night of my life", "내 인생 최고의 밤"], ["ticketing war", "티켓팅 전쟁"], ["sky-high expectations", "하늘을 찌르는 기대"], ["blow ~ away", "~을 압도하다/기대 이상이다"], ["sing along", "떼창하다"], ["ten thousand voices as one", "만 명의 목소리가 하나로"], ["goosebumps from head to toe", "머리부터 발끝까지 소름"], ["forget about everything else", "다른 모든 것을 잊다"], ["sore throat", "쉰 목"], ["afterglow", "여운"]], "audio": "audio/1_서베이/1-042 8. 콘서트(Concert)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-042 8. 콘서트(Concert)_과거 경험.mp3"}, {"id": "1-043", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "비교", "badge": "43 비교", "enQ": "How has your interest in concerts changed over the past few years? What kinds of shows did you enjoy before, and what do you like now? Compare them.", "enA": "My interest in concerts has definitely grown over the past few years. Back then, going to a concert was a once-a-year event for me — I used to go to big music festivals with friends, mostly for the fun atmosphere rather than the music itself.\n\nTo be honest, back then the concert was just an excuse to hang out. Half the time, I didn't even know the artists on stage.\n\nThese days, it's a completely different story. I go to shows much more often, and I choose them carefully — mostly solo concerts of artists whose albums I already know by heart. I save up for good seats, study the setlist in advance, and treat each show like a special occasion. So yeah, compared to before, concerts have gone from a casual hangout to a serious passion — and honestly, I enjoy them way more now.", "koQ": "지난 몇 년간 콘서트에 대한 당신의 관심은 어떻게 변화했나요? 예전에는 어떤 공연을 즐겼고, 지금은 무엇을 좋아하나요? 둘을 비교해주세요.", "koA": "지난 몇 년간 콘서트에 대한 제 관심은 확실히 커졌어요. 그때는 콘서트가 일 년에 한 번 있을까 말까 한 행사였어요. 친구들이랑 대형 음악 페스티벌에 가곤 했는데, 사실 음악보다는 분위기를 즐기러 갔죠.\n\n솔직히 그때 콘서트는 그냥 놀기 위한 핑계였어요. 무대 위 아티스트를 모르는 경우도 절반은 됐으니까요.\n\n요즘은 완전히 다른 이야기예요. 공연을 훨씬 자주 가고, 신중하게 골라요. 주로 앨범을 통째로 외우고 있는 아티스트들의 단독 콘서트죠. 좋은 자리를 위해 돈을 모으고, 셋리스트를 미리 공부하고, 공연 하나하나를 특별한 행사처럼 대해요. 네, 예전과 비교하면 콘서트는 가벼운 놀거리에서 진지한 열정이 됐어요. 그리고 솔직히 지금이 훨씬 더 즐거워요.", "struct": [["1️⃣ 도입", "관심의 성장 (definitely grown)"], ["2️⃣ 과거", "연 1회 · 페스티벌 · 분위기용"], ["3️⃣ 과거", "노는 핑계 · 아티스트도 몰랐음"], ["4️⃣ 현재", "단독 콘서트 · 셋리스트 예습"], ["5️⃣ 마무리", "놀거리 → 열정 + way more"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["a once-a-year event", "일 년에 한 번뿐인 행사"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["an excuse to hang out", "놀기 위한 핑계"], ["it's a completely different story", "완전히 다른 이야기다"], ["know ~ by heart", "~을 통째로 외우다"], ["save up for ~", "~을 위해 돈을 모으다"], ["setlist", "셋리스트"], ["a special occasion", "특별한 행사"], ["compared to ~", "~과 비교하면"], ["a serious passion", "진지한 열정"]], "audio": "audio/1_서베이/1-043 8. 콘서트(Concert)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-043 8. 콘서트(Concert)_비교.mp3"}, {"id": "1-044", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "묘사", "badge": "44 묘사", "enQ": "Describe the kitchen in your home where you usually cook. What does it look like, and what cooking tools or appliances do you have there? Tell me in detail.", "enA": "My kitchen? Well, it's nothing fancy — it's a small kitchen right next to the living room, with an L-shaped counter. It's compact, but I keep it really well-organized, so everything I need is within arm's reach.\n\nAs for appliances, I've got the basics: an induction stove, a rice cooker, a microwave — and of course, an air fryer. Honestly, that thing is a game changer; I use it almost every day. My pots and pans hang on the wall, and my favorite item is a big wooden cutting board my mom gave me.\n\nWhat I love most about my kitchen is the window right above the sink. Doing the dishes while looking outside is weirdly relaxing. So yeah, it's small, but it's my happy place — that's pretty much my kitchen.", "koQ": "당신이 주로 요리하는 집의 주방을 묘사해주세요. 어떻게 생겼고, 그곳에는 어떤 조리 도구나 가전제품이 있나요? 자세히 말해주세요.", "koA": "제 주방이요? 음, 대단한 건 아니에요. 거실 바로 옆에 붙은 작은 주방인데, ㄱ자 모양 조리대가 있어요. 아담하지만 정리 정돈을 정말 잘해 놔서 필요한 건 전부 손 닿는 곳에 있어요.\n\n가전제품은 기본만 갖췄어요. 인덕션, 밥솥, 전자레인지, 그리고 당연히 에어프라이어요. 솔직히 에어프라이어는 게임 체인저예요. 거의 매일 쓰거든요. 냄비와 팬은 벽에 걸어 두고, 제일 아끼는 물건은 엄마가 주신 커다란 나무 도마예요.\n\n제 주방에서 가장 좋아하는 건 싱크대 바로 위의 창문이에요. 밖을 보면서 설거지하는 게 은근히 힐링이 되거든요. 네, 작지만 저의 행복한 공간이에요. 제 주방은 대체로 이런 모습이에요.", "struct": [["1️⃣ 도입", "작은 주방 · ㄱ자 조리대"], ["2️⃣ 특징", "정리 정돈 · 손 닿는 곳에"], ["3️⃣ 가전", "인덕션 · 밥솥 · 에어프라이어!"], ["4️⃣ 애장품", "엄마가 주신 나무 도마"], ["5️⃣ 마무리", "싱크대 위 창문 + happy place"]], "expr": [["nothing fancy", "대단한 건 아닌"], ["L-shaped counter", "ㄱ자 조리대"], ["well-organized", "정리가 잘된"], ["within arm's reach", "손 닿는 곳에"], ["induction stove", "인덕션"], ["air fryer", "에어프라이어"], ["a game changer", "게임 체인저, 혁신템"], ["cutting board", "도마"], ["weirdly relaxing", "은근히 힐링되는"], ["my happy place", "나의 행복한 공간"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-044 9. 요리(Cooking)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-044 9. 요리(Cooking)_묘사.mp3"}, {"id": "1-045", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "습관", "badge": "45 습관", "enQ": "What dishes do you usually cook, and do you have any special recipes? When and where do you normally cook? Walk me through your cooking process from start to finish.", "enA": "I usually cook simple Korean dishes at home, mostly on weekends when I have time. And yes, I do have a signature dish — my kimchi fried rice. Everyone who tries it asks for the recipe, so let me walk you through it.\n\nFirst things first: old, sour kimchi — that's the key. I chop it up and stir-fry it with a little butter. Butter is my secret ingredient, by the way. Then I add cold rice, a spoonful of kimchi juice, and mix everything over high heat. Finally, I top it off with a fried egg and some sesame seeds.\n\nThe whole thing takes fifteen minutes, tops, but it never fails. Cooking it on a Saturday afternoon, with music on — honestly, that's my kind of therapy. So yeah, that's pretty much my cooking routine, from start to finish.", "koQ": "주로 어떤 요리를 만들고, 특별한 레시피가 있나요? 보통 언제 어디서 요리하나요? 당신의 요리 과정을 처음부터 끝까지 순서대로 설명해주세요.", "koA": "저는 보통 집에서 간단한 한식을 만들어요. 주로 시간 여유가 있는 주말에요. 그리고 네, 저만의 시그니처 요리가 있어요. 바로 김치볶음밥이에요. 먹어 본 사람마다 레시피를 물어보거든요. 순서대로 차근차근 알려 드릴게요.\n\n뭐니 뭐니 해도 첫째는 잘 익은 신김치예요. 그게 핵심이거든요. 김치를 잘게 썰어서 버터를 약간 넣고 볶아요. 참고로 버터가 저의 비밀 재료예요. 그다음 찬밥과 김칫국물 한 숟갈을 넣고 센 불에서 전부 볶아요. 마지막으로 계란 프라이와 깨를 올리면 끝이에요.\n\n다 해서 길어야 15분인데, 실패한 적이 없어요. 토요일 오후에 음악을 틀어 놓고 요리하는 거, 솔직히 그게 저만의 힐링이에요. 네, 이게 처음부터 끝까지, 제 요리 루틴이에요.", "struct": [["1️⃣ 도입", "주말 요리 + 시그니처 소개"], ["2️⃣ 재료", "신김치 + 비밀 재료(버터)"], ["3️⃣ 과정", "볶기 → 밥 → 센 불 마무리"], ["4️⃣ 완성", "계란 프라이 + 깨 토핑"], ["5️⃣ 마무리", "15분 완성 · 요리 = 힐링"]], "expr": [["signature dish", "시그니처 요리"], ["kimchi fried rice", "김치볶음밥"], ["let me walk you through ~", "~을 차근차근 설명할게요"], ["First things first", "뭐니 뭐니 해도 첫째는"], ["stir-fry", "볶다"], ["secret ingredient", "비밀 재료"], ["top it off with ~", "마지막에 ~을 올리다"], ["fried egg", "계란 프라이"], ["fifteen minutes, tops", "길어야 15분"], ["it never fails", "실패한 적이 없다"], ["from start to finish", "처음부터 끝까지"]], "audio": "audio/1_서베이/1-045 9. 요리(Cooking)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-045 9. 요리(Cooking)_습관.mp3"}, {"id": "1-046", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "취향", "badge": "46 취향", "enQ": "What kind of food do you most enjoy cooking, and why? Do you prefer making Korean dishes or foreign dishes? Tell me why you like cooking that type of food.", "enA": "If I had to choose, I'd definitely go for Korean dishes — especially simple, homestyle ones like stews and fried rice. For me, it's all about comfort: simple over fancy, always.\n\nThere are practical reasons too. The ingredients are already in my fridge — kimchi, garlic, gochujang — so I can start cooking on a whim, without a special shopping trip. Plus, these are the flavors I grew up with, so I can tell by smell alone whether I'm doing it right.\n\nDon't get me wrong, foreign food is fun — I tried making pasta a few times, and it wasn't bad. But it feels like following a manual, while Korean cooking feels like instinct. At the end of the day, nothing beats a warm stew made in my own kitchen. That's my taste in a nutshell.", "koQ": "어떤 종류의 음식을 만드는 것을 가장 즐기고, 그 이유는 무엇인가요? 한식과 외국 요리 중 무엇을 만드는 것을 선호하나요? 왜 그런 음식을 요리하는 것을 좋아하는지 말해주세요.", "koA": "굳이 골라야 한다면, 저는 무조건 한식을 선택할 거예요. 특히 찌개나 볶음밥 같은 소박한 집밥 스타일이요. 저한테는 편안함이 전부거든요. 화려함보다는 소박함, 항상요.\n\n현실적인 이유도 있어요. 김치, 마늘, 고추장 같은 재료가 이미 냉장고에 있으니까, 장을 따로 보지 않아도 내킬 때 바로 요리를 시작할 수 있거든요. 게다가 제가 먹고 자란 맛이라서, 냄새만 맡아도 제대로 되고 있는지 알 수 있어요.\n\n오해는 마세요, 외국 요리도 재밌어요. 파스타를 몇 번 만들어 봤는데 나쁘지 않았어요. 근데 그건 설명서를 따라 하는 느낌이고, 한식은 본능으로 하는 느낌이에요. 결국엔 내 주방에서 끓인 따뜻한 찌개만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 한식 · 소박한 집밥"], ["2️⃣ 기준", "화려함보다 소박함(simple over)"], ["3️⃣ 이유", "냉장고 재료 · 익숙한 맛"], ["4️⃣ 비교", "외국 요리 = 설명서 느낌"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "expr": [["if I had to choose", "굳이 골라야 한다면"], ["go for ~", "~을 선택하다"], ["homestyle", "집밥 스타일의"], ["it's all about ~", "~이 전부다/핵심이다"], ["simple over fancy", "화려함보다 소박함"], ["on a whim", "내킬 때 바로, 즉흥적으로"], ["the flavors I grew up with", "먹고 자란 맛"], ["by smell alone", "냄새만으로"], ["Don't get me wrong", "오해는 마세요"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-046 9. 요리(Cooking)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-046 9. 요리(Cooking)_취향.mp3"}, {"id": "1-047", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "과거 경험", "badge": "47 과거 경험", "enQ": "Please share an interesting or unforgettable experience you had while cooking. What dish were you making, and what made the experience stick in your memory? Tell me everything.", "enA": "Oh, this reminds me of my mom's birthday two years ago. I decided to cook seaweed soup for her — you know, in Korea, we eat it on birthdays, and it's usually the mom who makes it. So I wanted to switch roles for once.\n\nTo be honest, it was my first time making it, so I was secretly video-calling my aunt for directions and double-checking the recipe every two minutes. The kitchen was a complete mess — but somehow, the soup turned out great.\n\nWhen my mom tasted it, she didn't say much... and then I saw her eyes getting red. She told me it was the first birthday soup anyone had ever cooked for her. I'm not kidding, we both ended up tearing up over a bowl of soup. That moment stuck in my memory forever — it taught me that food is really about love. Since then, cooking for her birthday has become our little tradition.", "koQ": "요리하면서 겪은 흥미롭거나 잊을 수 없는 경험을 공유해주세요. 어떤 요리를 만들고 있었고, 무엇이 그 경험을 기억에 남게 했나요? 모든 것을 말해주세요.", "koA": "아, 2년 전 엄마 생신이 생각나네요. 엄마를 위해 미역국을 끓이기로 했거든요. 아시다시피 한국에서는 생일에 미역국을 먹는데, 보통 끓여 주는 사람은 엄마잖아요. 그래서 한 번쯤은 역할을 바꿔 보고 싶었어요.\n\n솔직히 처음 만들어 보는 거라, 몰래 이모와 영상통화를 하면서 만드는 법을 물어보고, 2분마다 레시피를 다시 확인했어요. 주방은 완전 난장판이 됐죠. 그런데 신기하게도 국은 정말 잘 나왔어요.\n\n엄마가 국을 맛보시더니 별말씀이 없으셨어요. 그러다 눈시울이 붉어지는 게 보였어요. 누가 생일 미역국을 끓여 준 건 태어나서 처음이라고 하시더라고요. 진짜예요, 우리 둘 다 미역국 한 그릇을 앞에 두고 눈물이 그렁그렁해졌어요. 그 순간은 평생 기억에 남을 거예요. 음식은 결국 사랑이라는 걸 배웠거든요. 그 후로 엄마 생신에 요리하는 건 우리만의 작은 전통이 됐어요.", "struct": [["1️⃣ 도입", "엄마 생신 · 미역국 도전"], ["2️⃣ 배경", "역할 바꾸기(K-생일 문화 소개)"], ["3️⃣ 과정", "이모 영상통화 · 주방 난장판"], ["4️⃣ 절정", "엄마의 눈물 · 함께 뭉클"], ["5️⃣ 마무리", "음식 = 사랑 + 우리만의 전통"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["seaweed soup", "미역국"], ["switch roles", "역할을 바꾸다"], ["To be honest", "솔직히 말하면"], ["video-calling my aunt", "이모와 영상통화"], ["double-checking", "거듭 확인하며"], ["a complete mess", "완전 난장판"], ["turn out great", "결과가 잘 나오다"], ["tear up", "눈물이 그렁그렁해지다"], ["stick in my memory", "기억에 남다"], ["our little tradition", "우리만의 작은 전통"]], "audio": "audio/1_서베이/1-047 9. 요리(Cooking)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-047 9. 요리(Cooking)_과거 경험1.mp3"}, {"id": "1-048", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "과거 경험", "badge": "48 과거 경험", "enQ": "Sometimes things go wrong in the kitchen. Tell me about a problem you recently had while cooking. What was the issue, and how did you deal with it? Explain in detail.", "enA": "Oh, kitchen disasters? I've got plenty, but this reminds me of one from just last month. I was making kimchi stew for a friend who was visiting, and I wanted to show off a little.\n\nWhile chatting with her in the living room, I completely lost track of time — and guess what? The stew boiled down to almost nothing, and it was way too salty. To be honest, I was a little panicked, because she was hungry and it was already 8 p.m.\n\nBut instead of starting over, I improvised: I added water, a spoonful of sugar, and dropped in some tofu and an egg to tone down the saltiness. Five minutes later — honestly? It tasted even better than my usual version. We ended up laughing about it, and everything worked out fine. Since then, I've been setting a timer every single time I cook. Lesson learned!", "koQ": "주방에서는 가끔 일이 잘못되기도 합니다. 최근 요리하면서 겪은 문제에 대해 말해주세요. 무엇이 문제였고, 어떻게 대처했나요? 자세히 설명해주세요.", "koA": "아, 주방 사고요? 많죠. 그중에서도 바로 지난달 일이 생각나네요. 놀러 오는 친구를 위해 김치찌개를 끓이고 있었는데, 좀 멋진 모습을 보여 주고 싶었거든요.\n\n거실에서 친구랑 수다를 떨다가 시간 가는 걸 완전히 잊어버렸어요. 그런데 있잖아요, 찌개가 거의 다 졸아붙어서 짜도 너무 짜졌어요. 솔직히 좀 당황했어요. 친구는 배고파하고, 시간은 벌써 저녁 8시였거든요.\n\n그런데 처음부터 다시 하는 대신 임기응변을 발휘했어요. 물을 붓고, 설탕 한 숟갈을 넣고, 짠맛을 잡으려고 두부와 계란을 넣었죠. 5분 뒤에, 솔직히요? 평소보다 더 맛있었어요. 결국 둘 다 웃고 넘어갔고, 모든 게 잘 해결됐어요. 그 후로는 요리할 때마다 타이머를 꼭 맞춰요. 교훈 확실히 얻었죠!", "struct": [["1️⃣ 도입", "지난달 · 친구 위한 김치찌개"], ["2️⃣ 문제", "수다 → 졸아붙음 · 너무 짬"], ["3️⃣ 위기", "배고픈 친구 · 저녁 8시"], ["4️⃣ 해결", "물+설탕+두부 임기응변"], ["5️⃣ 마무리", "더 맛있어짐 + 타이머 교훈"]], "expr": [["kitchen disasters", "주방 사고"], ["show off", "멋진 모습을 보여 주다"], ["lose track of time", "시간 가는 줄 모르다"], ["boil down", "졸아붙다"], ["way too salty", "짜도 너무 짠"], ["a little panicked", "살짝 당황한"], ["improvise", "임기응변하다"], ["tone down ~", "(맛·강도를) 낮추다"], ["ended up laughing", "결국 웃고 넘어갔다"], ["everything worked out fine", "결국 다 잘 해결됐다"], ["Lesson learned!", "교훈 얻었어요!"]], "audio": "audio/1_서베이/1-048 9. 요리(Cooking)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-048 9. 요리(Cooking)_과거 경험2.mp3"}, {"id": "1-049", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "과거 경험", "badge": "49 과거 경험", "enQ": "Tell me the story of how you became interested in cooking. Who taught you to cook, or how did you learn? Who did you cook with in the beginning? Give me all the details.", "enA": "Let me tell you how I got into cooking. It started when I moved out and began living alone a few years ago. At first, I lived on delivery food — until I checked my card statement one month. That bill was a real wake-up call.\n\nMy first teacher was, honestly, YouTube. I started with the absolute basics — how to make rice, how to fry an egg. But my real teacher was my mom: every weekend, I would call her, and she would talk me through her recipes step by step. Her instructions were never exact — \"add a little of this, some of that\" — which drove me crazy at first!\n\nIn the beginning, I also cooked with my roommate... actually, my younger brother, when he visited. We made a lot of failed dishes together, but that was half the fun. Since then, cooking has grown on me — what started as a survival skill became a real hobby. So yeah, that's my cooking story.", "koQ": "요리에 관심을 가지게 된 이야기를 들려주세요. 누가 요리를 가르쳐줬나요, 아니면 어떻게 배웠나요? 처음에는 누구와 함께 요리했나요? 모든 세부사항을 말해주세요.", "koA": "제가 어떻게 요리에 빠지게 됐는지 말씀드릴게요. 몇 년 전에 독립해서 혼자 살기 시작하면서였어요. 처음에는 배달 음식으로 살았어요. 어느 달인가 카드 명세서를 확인하기 전까지는요. 그 금액이 진짜 정신이 번쩍 드는 계기였어요.\n\n첫 스승은, 솔직히 유튜브였어요. 밥 짓기, 계란 프라이 같은 완전 기초부터 시작했죠. 그런데 진짜 스승은 엄마였어요. 주말마다 전화하면 엄마가 레시피를 하나하나 차근차근 알려 주셨거든요. 근데 엄마의 설명은 절대 정확하지가 않아요. '이거 조금, 저거 적당히' — 처음엔 그것 때문에 미치는 줄 알았어요!\n\n처음에는 놀러 온 남동생과도 같이 요리했어요. 실패작을 많이 만들었지만 그것도 재미의 절반이었죠. 그 후로 요리에 점점 정이 들었고, 생존 기술로 시작한 게 진짜 취미가 됐어요. 네, 이게 제 요리 입문 스토리예요.", "struct": [["1️⃣ 도입", "독립 · 카드 명세서 충격"], ["2️⃣ 유튜브", "완전 기초부터 독학 시작"], ["3️⃣ 엄마", "주말 전화 레시피 과외"], ["4️⃣ 동료", "남동생과 실패작 제조"], ["5️⃣ 마무리", "생존 기술 → 진짜 취미"]], "expr": [["get into ~", "~에 빠지다/시작하다"], ["move out", "독립하다, 집을 나오다"], ["live on delivery food", "배달 음식으로 살다"], ["card statement", "카드 명세서"], ["wake-up call", "정신이 번쩍 든 계기"], ["talk me through ~", "~을 차근차근 알려 주다"], ["drove me crazy", "미치게 만들었다"], ["failed dishes", "실패작들"], ["grow on me", "점점 정이 들다"], ["a survival skill", "생존 기술"], ["Since then", "그 후로"]], "audio": "audio/1_서베이/1-049 9. 요리(Cooking)_과거 경험3.mp3", "label": "과거 경험 3", "qaudio": "audio_q/1_서베이/1-049 9. 요리(Cooking)_과거 경험3.mp3"}, {"id": "1-050", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "비교", "badge": "50 비교", "enQ": "Compare the dishes of your country with those of another country. How are they different? Are the main differences in the ingredients or in the way the food is prepared? Tell me in detail.", "enA": "That's an interesting question. Let me compare Korean food with Italian food, since pasta is the foreign dish I cook most often. The biggest difference, in my opinion, is in the base ingredients.\n\nKorean food is built on fermented ingredients — kimchi, soybean paste, gochujang. That's why our dishes have that deep, complex flavor. Italian food, on the other hand, relies on fresh basics: tomatoes, olive oil, cheese, and herbs.\n\nThe way we eat is different too. Korean meals are all about sharing — one stew in the middle and countless side dishes — while Italian meals come in courses, one plate per person. Cooking-wise, we simmer and ferment; they focus on timing, like cooking pasta al dente. So yeah, compared to Italian food, Korean food is deeper and more communal. My conclusion? Fusion is the answer!", "koQ": "당신 나라의 요리와 다른 나라의 요리를 비교해주세요. 어떻게 다른가요? 주된 차이점이 재료에 있나요, 아니면 조리 방식에 있나요? 자세히 말해주세요.", "koA": "흥미로운 질문이네요. 한식과 이탈리아 요리를 비교해 볼게요. 제가 가장 자주 만드는 외국 요리가 파스타거든요. 제 생각에 가장 큰 차이는 기본 재료에 있어요.\n\n한식은 발효 재료를 바탕으로 하는 요리예요. 김치, 된장, 고추장이요. 그래서 우리 음식에 그런 깊고 복합적인 맛이 있는 거죠. 반면 이탈리아 요리는 신선한 기본 재료에 의존해요. 토마토, 올리브유, 치즈, 허브요.\n\n먹는 방식도 달라요. 한식은 나눠 먹는 게 핵심이에요. 가운데 찌개 하나에 반찬도 셀 수 없이 많죠. 반면 이탈리아 요리는 코스로, 한 사람당 한 접시씩 나와요. 조리 방식으로는 우리는 끓이고 발효시키는 반면, 그쪽은 타이밍에 집중해요. 파스타를 알덴테로 삶는 것처럼요. 네, 이탈리아 요리와 비교하면 한식은 더 깊고 더 함께하는 음식이에요. 결론은? 퓨전이 답이에요!", "struct": [["1️⃣ 도입", "비교 대상 선정(한식 vs 이탈리아)"], ["2️⃣ 재료", "발효(장류) vs 신선 재료"], ["3️⃣ 식탁", "나눠 먹기·반찬 vs 코스"], ["4️⃣ 조리법", "끓이고 발효 vs 타이밍(알덴테)"], ["5️⃣ 마무리", "깊고 함께 먹는 한식 + 퓨전이 답!"]], "expr": [["The biggest difference is ~", "가장 큰 차이는 ~이다"], ["base ingredients", "기본 재료"], ["fermented ingredients", "발효 재료"], ["deep, complex flavor", "깊고 복합적인 맛"], ["on the other hand", "반면에"], ["all about sharing", "나눠 먹는 게 핵심"], ["side dishes", "반찬"], ["simmer and ferment", "끓이고 발효시키다"], ["al dente", "알덴테(살짝 단단하게)"], ["compared to ~", "~과 비교하면"], ["Fusion is the answer!", "퓨전이 답이다!"]], "audio": "audio/1_서베이/1-050 9. 요리(Cooking)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-050 9. 요리(Cooking)_비교.mp3"}, {"id": "1-051", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "묘사", "badge": "51 묘사", "enQ": "Tell me about the bar you visit most often. Where is it located, and what does the place look like inside? Describe that bar in as much detail as possible.", "enA": "The bar I visit most often is a small craft beer pub near my place. It's tucked away in a basement — you could easily walk past it without noticing — but that hidden feeling is exactly what makes it special.\n\nInside, it's got a really cozy, moody vibe: brick walls, dim warm lighting, wooden tables, and shelves lined with beer glasses from all over the world. There's always soft jazz or old pop playing, and the owner collects vinyl records, which are displayed along one wall. It's never too loud, so you can actually have a conversation.\n\nThey've got about ten kinds of craft beer on tap, and the owner always recommends something new based on your mood. So yeah, that's pretty much my favorite bar — it feels less like a bar and more like a friend's living room.", "koQ": "가장 자주 가는 술집에 대해 말해주세요. 어디에 위치해 있고, 내부는 어떻게 생겼나요? 그 술집을 가능한 자세히 묘사해주세요.", "koA": "제가 가장 자주 가는 술집은 집 근처의 작은 수제맥주 펍이에요. 지하에 숨어 있어서 모르면 그냥 지나치기 쉬운데, 그 숨어 있는 느낌이 바로 이 가게의 매력이에요.\n\n내부는 정말 아늑하고 무드 있는 분위기예요. 벽돌 벽, 은은하고 따뜻한 조명, 나무 테이블, 그리고 세계 각국의 맥주잔이 늘어선 선반들이요. 항상 잔잔한 재즈나 올드팝이 흐르고, 사장님이 LP를 수집하셔서 한쪽 벽에 쭉 진열되어 있어요. 시끄럽지 않아서 진짜 대화가 가능한 곳이죠.\n\n생맥주로 마실 수 있는 수제맥주가 열 종류쯤 있는데, 사장님이 항상 그날 기분에 맞춰 새로운 걸 추천해 주세요. 네, 이게 제 최애 술집이에요. 술집이라기보다는 친구네 거실 같은 곳이에요.", "struct": [["1️⃣ 도입", "집 근처 수제맥주 펍"], ["2️⃣ 위치", "지하에 숨은(tucked away) 매력"], ["3️⃣ 내부", "벽돌 · 조명 · LP · 재즈"], ["4️⃣ 특징", "대화 가능 · 사장님 추천"], ["5️⃣ 마무리", "친구네 거실 비유 + 정리"]], "expr": [["craft beer pub", "수제맥주 펍"], ["tucked away", "(지하에) 숨어 있는"], ["walk past it without noticing", "모르고 지나치다"], ["cozy, moody vibe", "아늑하고 무드 있는 분위기"], ["dim warm lighting", "은은하고 따뜻한 조명"], ["vinyl records", "LP판"], ["have a conversation", "대화를 나누다"], ["on tap", "생맥주로"], ["based on your mood", "그날 기분에 맞춰"], ["a friend's living room", "친구네 거실"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-051 10. 술집_바(Bars)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-051 10. 술집_바(Bars)_묘사.mp3"}, {"id": "1-052", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "습관", "badge": "52 습관", "enQ": "What do you usually do when you go to a bar? Who do you normally go with, and what do you like to order there? Describe your typical time at the bar in detail.", "enA": "I usually go to a bar on Friday nights, and my drinking buddy is almost always my best friend — the same one I go to movies with. It depends on the week, but we go maybe two or three times a month.\n\nOur order never changes: a couple of craft beers on tap and some fried chicken — you know, chimaek! It's the classic Korean combo of chicken and beer. Then we just talk for hours — work stuff, funny stories, life plans. We have one golden rule, though: no phones on the table. That way, we actually talk instead of scrolling.\n\nWe usually call it a night around midnight — we're not big drinkers, honestly. It's less about the alcohol and more about unwinding after a long week. So yeah, that's pretty much my typical night at the bar, and it never gets old.", "koQ": "술집에 갈 때 주로 무엇을 하나요? 보통 누구와 함께 가고, 그곳에서 무엇을 주문하는 것을 좋아하나요? 술집에서 보내는 일반적인 시간을 자세히 설명해주세요.", "koA": "저는 보통 금요일 밤에 술집에 가요. 술친구는 거의 항상 절친이에요. 영화도 같이 보러 가는 그 친구요. 주에 따라 다르긴 한데, 한 달에 두세 번쯤 가는 것 같아요.\n\n주문은 절대 안 바뀌어요. 생맥주로 나오는 수제맥주 몇 잔에 후라이드 치킨이요. 아시죠, 치맥! 치킨과 맥주라는 한국의 클래식 조합이요. 그러고는 몇 시간이고 수다를 떨어요. 회사 얘기, 웃긴 얘기, 인생 계획까지요. 근데 우리만의 황금 규칙이 하나 있어요. 테이블 위에 폰 올리지 않기. 그래야 폰만 들여다보지 않고 진짜 대화를 하거든요.\n\n보통 자정쯤 마무리해요. 솔직히 저희 둘 다 술을 많이 마시는 편은 아니에요. 술보다는 한 주의 피로를 푸는 게 목적이거든요. 네, 이게 제가 술집에서 보내는 일반적인 밤인데, 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "금요일 밤 · 절친과 월 2~3회"], ["2️⃣ 주문", "수제맥주 + 치킨 = 치맥!"], ["3️⃣ 활동", "몇 시간 수다(일·인생 얘기)"], ["4️⃣ 규칙", "테이블 위 폰 금지(golden rule)"], ["5️⃣ 마무리", "자정 귀가 · 술보다 힐링"]], "expr": [["drinking buddy", "술친구"], ["It depends on the week", "그 주마다 달라요"], ["craft beers on tap", "생맥주로 나오는 수제맥주"], ["chimaek", "치맥"], ["the classic Korean combo", "한국의 클래식 조합"], ["golden rule", "황금 규칙"], ["no phones on the table", "테이블 위 폰 금지"], ["instead of scrolling", "폰만 보는 대신"], ["call it a night", "(하루를) 마무리하다"], ["unwind after a long week", "한 주의 피로를 풀다"], ["it never gets old", "아무리 해도 질리지 않는다"]], "audio": "audio/1_서베이/1-052 10. 술집_바(Bars)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-052 10. 술집_바(Bars)_습관.mp3"}, {"id": "1-053", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "취향", "badge": "53 취향", "enQ": "What kind of bars do you prefer to go to, and why? Do you choose a bar for its drinks, food, music, or atmosphere? Tell me what you look for in a good bar.", "enA": "If I had to choose, I'd always go for quiet, cozy bars over loud, crowded ones. For me, it's all about one simple test: can we actually hear each other talk?\n\nOf course, good drinks matter — I love trying new craft beers — but drinks are only half the story. What really makes a good bar is the atmosphere: warm lighting, music at just the right volume, and seats where you can settle in for hours. That's why I avoid clubs and huge franchise pubs — shouting over the music all night just wears me out.\n\nDon't get me wrong, I enjoy a lively place once in a while, like when we're celebrating something. But my default is always somewhere calm. When it comes to bars, conversation over volume — that's my taste in a nutshell.", "koQ": "어떤 종류의 술집에 가는 것을 선호하고, 그 이유는 무엇인가요? 술, 음식, 음악, 분위기 중 무엇을 보고 술집을 고르나요? 좋은 술집의 기준이 무엇인지 말해주세요.", "koA": "굳이 골라야 한다면, 저는 항상 시끄럽고 붐비는 곳보다 조용하고 아늑한 술집을 선택해요. 저한테는 아주 간단한 기준이 전부거든요. 서로의 말소리가 진짜 들리는가?\n\n물론 술도 중요해요. 새로운 수제맥주를 시도하는 걸 좋아하니까요. 근데 술은 절반일 뿐이에요. 좋은 술집을 만드는 건 결국 분위기예요. 따뜻한 조명, 딱 적당한 볼륨의 음악, 그리고 몇 시간이고 눌러앉을 수 있는 자리요. 그래서 클럽이나 대형 프랜차이즈 호프집은 피해요. 밤새 음악 소리 너머로 소리 지르다 보면 진이 다 빠지거든요.\n\n오해는 마세요, 가끔은 신나는 곳도 좋아해요. 뭔가 축하할 일이 있을 때처럼요. 하지만 제 기본값은 항상 차분한 곳이에요. 술집에 관해서라면, 볼륨보다 대화. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 조용하고 아늑한 바"], ["2️⃣ 기준", "서로 말이 들리는가?(테스트)"], ["3️⃣ 이유", "분위기 = 조명·음악·좌석"], ["4️⃣ 비선호", "클럽·대형 호프(진 빠짐)"], ["5️⃣ 마무리", "conversation over volume!"]], "expr": [["if I had to choose", "굳이 골라야 한다면"], ["go for A over B", "B보다 A를 선택하다"], ["it's all about ~", "~이 전부다/핵심이다"], ["Can we hear each other talk?", "서로 말소리가 들리는가?"], ["only half the story", "절반일 뿐"], ["settle in for hours", "몇 시간이고 눌러앉다"], ["That's why ~", "그래서 ~한 거예요"], ["wear me out", "진을 빼다"], ["Don't get me wrong", "오해는 마세요"], ["conversation over volume", "볼륨보다 대화"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-053 10. 술집_바(Bars)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-053 10. 술집_바(Bars)_취향.mp3"}, {"id": "1-054", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "과거 경험", "badge": "54 과거 경험", "enQ": "Tell me about a memorable time you had at a bar. Was it a special occasion like a birthday party, or did something unexpected happen? Describe what made that night unforgettable.", "enA": "Oh, this reminds me of my birthday last year. My best friend asked me out for \"just a casual beer\" at our usual craft beer pub. I suspected nothing at all — that was my first mistake!\n\nWe were chatting as usual, when suddenly the lights dimmed. And guess what? The owner walked out with a cake, and from the corner table, five of my friends jumped up shouting \"Surprise!\" They'd been hiding there the whole time, pretending to be strangers. I was too shocked to even move — then I just burst out laughing.\n\nThe owner even played my favorite song and gave us a round on the house. To be honest, I'm not big on birthdays, but that night changed my mind. What made it unforgettable wasn't the party itself — it was realizing how much effort my friends had put in. Since then, that pub has been our spot.", "koQ": "술집에서 보낸 기억에 남는 시간에 대해 말해주세요. 생일파티 같은 특별한 날이었나요, 아니면 예상치 못한 일이 있었나요? 무엇이 그 밤을 잊을 수 없게 했는지 묘사해주세요.", "koA": "아, 작년 제 생일이 생각나네요. 절친이 늘 가던 수제맥주 펍에서 '그냥 가볍게 맥주 한잔' 하자고 불러냈어요. 저는 전혀 눈치채지 못했죠. 그게 첫 번째 실수였어요!\n\n여느 때처럼 수다를 떨고 있는데 갑자기 조명이 어두워졌어요. 그런데 있잖아요, 사장님이 케이크를 들고 나오시고, 구석 테이블에서 친구 다섯 명이 '서프라이즈!'를 외치며 벌떡 일어난 거예요. 걔네는 내내 거기 숨어서 모르는 사람인 척하고 있었던 거죠. 저는 놀라서 움직이지도 못하다가, 그냥 빵 터졌어요.\n\n사장님은 제가 좋아하는 노래까지 틀어 주시고 맥주 한 잔씩을 서비스로 주셨어요. 솔직히 저는 생일을 크게 챙기는 편이 아닌데, 그날 밤이 제 생각을 바꿔 놨어요. 잊을 수 없게 만든 건 파티 자체가 아니라, 친구들이 얼마나 정성을 들였는지를 깨달은 순간이었어요. 그 후로 그 펍은 우리의 아지트가 됐어요.", "struct": [["1️⃣ 도입", "생일 · '가볍게 한잔' 낚시"], ["2️⃣ 반전", "조명 어두워짐 → 서프라이즈!"], ["3️⃣ 디테일", "숨어 있던 친구들 · 케이크"], ["4️⃣ 감동", "최애곡 · 서비스 맥주 · 추억"], ["5️⃣ 마무리", "정성 깨달음 + our spot"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["ask me out for ~", "~하자고 불러내다"], ["suspect nothing at all", "전혀 눈치채지 못하다"], ["as usual", "여느 때처럼"], ["the lights dimmed", "조명이 어두워졌다"], ["guess what?", "그런데 있잖아요?"], ["too shocked to even move", "놀라서 움직이지도 못한"], ["burst out laughing", "빵 터지다"], ["on the house", "서비스로, 공짜로"], ["put in effort", "정성을 들이다"], ["our spot", "우리의 아지트"]], "audio": "audio/1_서베이/1-054 10. 술집_바(Bars)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-054 10. 술집_바(Bars)_과거 경험.mp3"}, {"id": "1-055", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "비교", "badge": "55 비교", "enQ": "Compare the bars people go to these days with the ones that were popular in the past. How have drinking places changed over time? Tell me about the differences.", "enA": "Drinking places in Korea have changed a lot. Back then — say, when I first became old enough to drink — the standard was big, noisy hof pubs: bright lights, plastic chairs, huge tables, and everyone drinking the same two things, soju or basic lager.\n\nDrinking itself was different too. It was often about drinking a lot — company dinners, endless toasts, staying out until late. People used to go to two or three places in one night, called \"rounds.\"\n\nThese days, it's a completely different story. Small, specialized bars are everywhere — craft beer pubs, wine bars, even quiet cocktail bars — each with its own personality. And the culture has shifted from drinking hard to drinking well: people care about taste and atmosphere, not quantity. So yeah, compared to the past, bars today are smaller, quieter, and way more about the experience — and honestly, I think that's a change for the better.", "koQ": "요즘 사람들이 가는 술집과 과거에 인기 있던 술집을 비교해주세요. 시간이 지나며 술집은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "한국의 술집은 정말 많이 변했어요. 그때는, 그러니까 제가 처음 술을 마실 수 있는 나이가 됐을 때는 크고 시끄러운 호프집이 기본이었어요. 환한 조명, 플라스틱 의자, 커다란 테이블, 그리고 모두가 소주 아니면 기본 라거, 둘 중 하나만 마셨죠.\n\n술 마시는 문화 자체도 달랐어요. 많이 마시는 게 중심이었죠. 회식, 끝없는 건배, 늦게까지 이어지는 술자리요. 사람들은 하룻밤에 두세 곳을 옮겨 다니곤 했어요. '차수'라고 부르면서요.\n\n요즘은 완전히 다른 이야기예요. 작고 전문화된 술집이 어디에나 있어요. 수제맥주 펍, 와인바, 조용한 칵테일바까지, 각자의 개성이 있죠. 문화도 '독하게 마시기'에서 '잘 마시기'로 바뀌었어요. 사람들은 이제 양이 아니라 맛과 분위기를 중요하게 생각해요. 네, 과거와 비교하면 요즘 술집은 더 작고, 더 조용하고, 훨씬 더 경험 중심이에요. 그리고 솔직히 좋은 변화라고 생각해요.", "struct": [["1️⃣ 도입", "변화 인정 (changed a lot)"], ["2️⃣ 과거", "호프집 · 소주 아니면 라거"], ["3️⃣ 과거", "많이 마시기 · 2~3차 문화"], ["4️⃣ 현재", "전문 바 다양화 · 잘 마시기"], ["5️⃣ 마무리", "compared to + 좋은 변화"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["old enough to drink", "술 마실 수 있는 나이"], ["hof pub", "호프집"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["endless toasts", "끝없는 건배"], ["called \"rounds\"", "'차수'라고 부르는"], ["it's a completely different story", "완전히 다른 이야기다"], ["personality", "(가게의) 개성"], ["from drinking hard to drinking well", "독하게 → 잘 마시기로"], ["compared to ~", "~과 비교하면"], ["a change for the better", "좋은 변화"]], "audio": "audio/1_서베이/1-055 10. 술집_바(Bars)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-055 10. 술집_바(Bars)_비교.mp3"}, {"id": "1-056", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "묘사", "badge": "56 묘사", "enQ": "Describe the place in your home where you spend most of your time during vacations. What does that space look like, and what do you have there? Tell me in detail.", "enA": "During vacations, I basically live in my living room — more specifically, on my couch. It's a big, deep gray couch by the window, and honestly, it's the heart of my home.\n\nEverything I need is within arm's reach: a soft blanket, a small side table for snacks and coffee, and the TV right in front. I've also got a floor lamp that gives the room a warm, orange glow in the evening — it makes all the difference. Next to the couch, there's a little pile of books I always plan to read... and mostly don't.\n\nWhat makes the space perfect is the big window. Sunlight pours in during the day, and I can people-watch the street below with a coffee in hand. So yeah, that's pretty much my vacation headquarters — small, warm, and exactly my kind of paradise.", "koQ": "휴가 동안 집에서 가장 많은 시간을 보내는 공간을 묘사해주세요. 그 공간은 어떻게 생겼고, 그곳에는 무엇이 있나요? 자세히 말해주세요.", "koA": "휴가 때 저는 사실상 거실에서 살아요. 더 정확히는 소파 위에서요. 창가에 놓인 크고 짙은 회색 소파인데, 솔직히 우리 집의 심장이에요.\n\n필요한 건 전부 손 닿는 곳에 있어요. 부드러운 담요, 간식과 커피를 놓는 작은 사이드 테이블, 그리고 바로 앞의 TV요. 저녁이면 방을 따뜻한 주황빛으로 물들이는 플로어 램프도 있는데, 이게 분위기를 완전히 바꿔 줘요. 소파 옆에는 항상 읽어야지 하고 쌓아 둔 책 더미가 있고요. 물론 거의 안 읽지만요.\n\n이 공간을 완벽하게 만드는 건 큰 창문이에요. 낮에는 햇살이 쏟아져 들어오고, 커피를 손에 들고 아래 거리의 사람들을 구경할 수 있거든요. 네, 이게 제 휴가 본부예요. 작고, 따뜻하고, 딱 제 취향의 천국이죠.", "struct": [["1️⃣ 도입", "거실 소파 = 우리 집의 심장"], ["2️⃣ 아이템", "담요 · 사이드 테이블 · TV"], ["3️⃣ 조명", "플로어 램프의 주황빛"], ["4️⃣ 유머", "안 읽는 책 더미 고백"], ["5️⃣ 마무리", "창문 햇살 + my paradise"]], "expr": [["the heart of my home", "우리 집의 심장"], ["within arm's reach", "손 닿는 곳에"], ["side table", "사이드 테이블"], ["floor lamp", "플로어 램프(장스탠드)"], ["warm, orange glow", "따뜻한 주황빛"], ["it makes all the difference", "그게 결정적 차이를 만든다"], ["plan to read... and mostly don't", "읽으려고만 하는"], ["pour in", "(햇살이) 쏟아져 들어오다"], ["people-watch", "사람 구경하다"], ["vacation headquarters", "휴가 본부"], ["my kind of paradise", "내 취향의 천국"]], "audio": "audio/1_서베이/1-056 11. 휴가·집(Vacation)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-056 11. 휴가·집(Vacation)_묘사.mp3"}, {"id": "1-057", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "습관", "badge": "57 습관", "enQ": "What do you usually do at home during a vacation? Who comes to visit you? Describe how you typically spend your time.", "enA": "My home vacations follow a very scientific schedule: no schedule at all! But let me walk you through a typical day anyway. It always starts with sleeping in — no alarms allowed, that's the golden rule.\n\nOnce I'm up, I make a slow brunch, then settle into my couch for a Netflix marathon or some gaming. Around sunset, I force myself out for a short walk in the park — you know, just to feel a little less guilty about all that lying around.\n\nAs for visitors — my best friend usually comes over at least once. We order chimaek, watch a movie, and talk for hours. My younger brother also drops by sometimes, mostly to raid my fridge. So yeah, that's pretty much my home vacation: lazy, cozy, and honestly, exactly what vacations are for. It never gets old.", "koQ": "휴가 동안 집에서 주로 무엇을 하나요? 누가 당신을 방문하러 오나요? 일반적으로 시간을 어떻게 보내는지 설명해주세요.", "koA": "제 집 휴가는 아주 과학적인 스케줄을 따라요. 바로 스케줄 없음이요! 그래도 일반적인 하루를 차근차근 말씀드릴게요. 시작은 항상 늦잠이에요. 알람 금지, 그게 황금 규칙이죠.\n\n일어나면 느긋하게 브런치를 만들고, 소파에 자리를 잡고 넷플릭스 정주행이나 게임을 해요. 해 질 무렵엔 억지로라도 공원에 나가서 잠깐 걸어요. 하루 종일 누워 있던 것에 대한 죄책감을 조금 덜려고요.\n\n방문객으로 말하자면, 절친이 보통 한 번은 놀러 와요. 치맥을 시키고, 영화를 보고, 몇 시간씩 수다를 떨죠. 남동생도 가끔 들르는데, 주로 제 냉장고를 털러 와요. 네, 이게 제 집 휴가예요. 게으르고, 아늑하고, 솔직히 휴가란 바로 이런 거죠. 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "스케줄 = 무계획! + 늦잠"], ["2️⃣ 낮", "브런치 · 넷플릭스 · 게임"], ["3️⃣ 저녁", "공원 산책(죄책감 해소용)"], ["4️⃣ 방문객", "절친 치맥 · 동생 냉장고 습격"], ["5️⃣ 마무리", "게으르고 아늑한 완벽 휴가"]], "expr": [["no schedule at all", "무계획"], ["let me walk you through ~", "~을 차근차근 설명할게요"], ["sleep in", "늦잠 자다"], ["the golden rule", "황금 규칙"], ["settle into ~", "~에 자리 잡다"], ["Netflix marathon", "넷플릭스 정주행"], ["feel less guilty", "죄책감을 덜다"], ["come over", "(우리 집에) 놀러 오다"], ["drop by", "잠깐 들르다"], ["raid my fridge", "냉장고를 털다"], ["it never gets old", "아무리 해도 질리지 않는다"]], "audio": "audio/1_서베이/1-057 11. 휴가·집(Vacation)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-057 11. 휴가·집(Vacation)_습관.mp3"}, {"id": "1-058", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "취향", "badge": "58 취향", "enQ": "While many people travel during vacations, you prefer staying home. What makes a vacation at home better for you? Tell me the reasons you enjoy it.", "enA": "Why do I prefer staying home? Simple: because a vacation should be about resting, and for me, travel is anything but restful. For me, it's all about zero stress — comfort over sightseeing, every time.\n\nThink about what travel involves: packing, airports, crowds, and checking maps every ten minutes. By the time you're back, you need a vacation from your vacation! At home, there's none of that. I sleep in my own bed, eat what I want, and answer to no one.\n\nAnd the best part? It costs almost nothing, so there's no post-vacation bill shock either. Don't get me wrong — I do enjoy traveling once in a while. But when I really need to recharge, nothing beats my own couch. That's my taste in a nutshell.", "koQ": "많은 사람들이 휴가 때 여행을 가지만, 당신은 집에 있는 것을 선호합니다. 집에서 보내는 휴가가 당신에게 더 좋은 이유는 무엇인가요? 그것을 즐기는 이유를 말해주세요.", "koA": "왜 집에 있는 걸 선호하냐고요? 간단해요. 휴가는 쉬는 게 목적인데, 저한테 여행은 전혀 쉬는 게 아니거든요. 저한테는 스트레스 제로가 전부예요. 관광보다 편안함, 언제나요.\n\n여행에 뭐가 따라오는지 생각해 보세요. 짐 싸기, 공항, 인파, 그리고 10분마다 지도 확인하기요. 돌아올 때쯤엔 휴가로부터의 휴가가 필요할 지경이잖아요! 집에는 그런 게 하나도 없어요. 내 침대에서 자고, 먹고 싶은 걸 먹고, 누구의 눈치도 안 봐요.\n\n그리고 제일 좋은 점이 뭔지 아세요? 돈이 거의 안 들어서 휴가 후 카드값 충격도 없다는 거예요. 오해는 마세요, 가끔은 여행도 즐겨요. 하지만 진짜 재충전이 필요할 때는 내 소파만 한 게 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "휴가 = 휴식, 여행 ≠ 휴식"], ["2️⃣ 근거", "짐·공항·인파·지도 스트레스"], ["3️⃣ 장점", "내 침대 · 내 맘대로 · 눈치 제로"], ["4️⃣ 보너스", "비용 제로(카드값 충격 없음)"], ["5️⃣ 마무리", "nothing beats my couch!"]], "expr": [["it's all about ~", "~이 전부다/핵심이다"], ["comfort over sightseeing", "관광보다 편안함"], ["anything but restful", "전혀 쉬는 게 아닌"], ["a vacation from your vacation", "휴가로부터의 휴가"], ["answer to no one", "누구 눈치도 안 보다"], ["And the best part?", "그리고 제일 좋은 점은?"], ["post-vacation bill shock", "휴가 후 카드값 충격"], ["Don't get me wrong", "오해는 마세요"], ["recharge", "재충전하다"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-058 11. 휴가·집(Vacation)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-058 11. 휴가·집(Vacation)_취향.mp3"}, {"id": "1-059", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "과거 경험", "badge": "59 과거 경험", "enQ": "Tell me about the most memorable vacation you spent at home. What did you do, and who was with you? What made that time so special?", "enA": "Oh, this reminds me of last summer. I had a five-day break, and my best friend's apartment was being renovated — so she just moved in with me for the whole vacation. We called it our \"home camping\" week.\n\nWe really went all in. We built a blanket fort in the living room — yes, like ten-year-olds — hung fairy lights, and had a movie marathon every night. During the day, we cooked together, mostly my kimchi fried rice, and one rainy afternoon we just sat by the window doing absolutely nothing. Out of nowhere, that turned into a three-hour talk about life.\n\nTo be honest, that deep talk is what made the week so special. We've been friends for fifteen years, but we'd never talked like that before. In the end, I didn't go anywhere that vacation, but I felt like I'd traveled somewhere really far. Since then, \"home camping\" has become our yearly tradition.", "koQ": "집에서 보낸 휴가 중 가장 기억에 남는 것을 말해주세요. 무엇을 했고, 누가 함께 있었나요? 무엇이 그 시간을 특별하게 만들었나요?", "koA": "아, 작년 여름이 생각나네요. 5일짜리 휴가가 있었는데, 마침 절친네 집이 인테리어 공사 중이라 걔가 아예 우리 집으로 들어와서 휴가 내내 같이 지냈어요. 우리는 그 주를 '홈캠핑' 주간이라고 불렀죠.\n\n우리는 정말 제대로 했어요. 거실에 담요 요새를 지었고요. 네, 열 살짜리들처럼요. 꼬마전구를 달고, 매일 밤 영화 정주행을 했어요. 낮에는 같이 요리했어요. 주로 제 김치볶음밥이었죠. 그리고 비 오던 어느 오후에는 그냥 창가에 앉아서 아무것도 안 했는데, 난데없이 그게 세 시간짜리 인생 이야기가 됐어요.\n\n솔직히 그 깊은 대화가 그 주를 특별하게 만든 거예요. 15년 지기인데 그렇게 이야기해 본 건 처음이었거든요. 결국 그 휴가 때 아무 데도 안 갔지만, 아주 먼 곳을 여행하고 온 기분이었어요. 그 후로 '홈캠핑'은 우리의 연례 전통이 됐어요.", "struct": [["1️⃣ 도입", "절친 입주 · '홈캠핑' 주간"], ["2️⃣ 활동", "담요 요새 · 조명 · 영화 정주행"], ["3️⃣ 낮", "같이 요리(김치볶음밥!)"], ["4️⃣ 절정", "비 오는 오후 3시간 인생 대화"], ["5️⃣ 마무리", "먼 여행 같았던 집 + 연례 전통"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["move in with ~", "~네 집에 들어와 살다"], ["home camping", "홈캠핑"], ["go all in", "제대로 하다, 올인하다"], ["blanket fort", "담요 요새"], ["fairy lights", "(꼬마전구) 조명"], ["out of nowhere", "난데없이"], ["a three-hour talk about life", "3시간짜리 인생 대화"], ["In the end", "결국"], ["felt like I'd traveled far", "먼 여행을 한 기분"], ["yearly tradition", "연례 전통"]], "audio": "audio/1_서베이/1-059 11. 휴가·집(Vacation)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-059 11. 휴가·집(Vacation)_과거 경험.mp3"}, {"id": "1-060", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "비교", "badge": "60 비교", "enQ": "Compare the vacations you spent at home recently with the ones you had in the past. How have your home vacations changed over the years? What is different now?", "enA": "My home vacations have changed quite a bit over the years. Back then — especially in my early twenties — staying home during a vacation felt like a failure. I used to think a \"real\" vacation meant going somewhere, so when I stayed home, I just killed time: random TV all day, phone in hand, feeling vaguely guilty.\n\nThere was no plan and no joy in it, honestly. It was rest without actually feeling rested.\n\nThese days, it's a completely different story — my home vacations are intentional. I plan little things to look forward to: a movie night with chimaek, a morning for cooking projects, an afternoon for a long walk. I even put my phone on do-not-disturb mode. Same couch, same house — but now it actually recharges me. So yeah, compared to the past, the change isn't the place; it's my mindset — home went from a failure to a luxury.", "koQ": "최근에 집에서 보낸 휴가와 과거의 휴가를 비교해주세요. 시간이 지나며 집에서 보내는 휴가는 어떻게 변화했나요? 지금은 무엇이 다른가요?", "koA": "제 집 휴가는 시간이 지나면서 꽤 많이 변했어요. 그때는, 특히 20대 초반에는 휴가 때 집에 있는 게 실패처럼 느껴졌어요. '진짜' 휴가는 어딘가로 떠나는 거라고 생각했으니까요. 그래서 집에 있게 되면 그냥 시간을 죽였어요. 하루 종일 아무 TV나 틀어 놓고, 손에는 폰을 쥐고, 막연한 죄책감을 느끼면서요.\n\n솔직히 계획도 없고 즐거움도 없었어요. 쉬긴 쉬는데 전혀 쉰 것 같지 않은 휴식이었죠.\n\n요즘은 완전히 다른 이야기예요. 제 집 휴가는 의도적이에요. 기대할 만한 작은 것들을 계획해요. 치맥과 함께하는 영화의 밤, 요리 프로젝트를 위한 아침, 긴 산책을 위한 오후요. 폰도 방해금지 모드로 해 놔요. 같은 소파, 같은 집인데 이제는 진짜 재충전이 돼요. 네, 과거와 비교하면 변한 건 장소가 아니라 마음가짐이에요. 집이 실패에서 사치가 된 거죠.", "struct": [["1️⃣ 도입", "변화 인정 (changed quite a bit)"], ["2️⃣ 과거", "집콕 = 실패 · 죄책감"], ["3️⃣ 과거", "무계획 · 쉰 것 같지 않은 휴식"], ["4️⃣ 현재", "의도적 휴가 · 방해금지 모드"], ["5️⃣ 마무리", "실패 → 사치(mindset 변화)"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["feel like a failure", "실패처럼 느껴지다"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["kill time", "시간을 죽이다"], ["vaguely guilty", "막연히 죄책감 드는"], ["rest without feeling rested", "쉰 것 같지 않은 휴식"], ["intentional", "의도적인"], ["things to look forward to", "기대할 거리"], ["do-not-disturb mode", "방해금지 모드"], ["it's my mindset", "마음가짐의 변화"], ["from a failure to a luxury", "실패에서 사치로"]], "audio": "audio/1_서베이/1-060 11. 휴가·집(Vacation)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-060 11. 휴가·집(Vacation)_비교.mp3"}, {"id": "1-061", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "묘사", "badge": "61 묘사", "enQ": "Describe your favorite travel destination in your country. What does the place look like, and what is special about it? Tell me about it in as much detail as possible.", "enA": "My favorite travel destination in Korea? That's easy — Gangneung, a small city on the east coast. It's only about two hours from Seoul by KTX, our high-speed train, so it's perfect for a quick getaway.\n\nThe scenery there is amazing. You've got a long sandy beach with unbelievably clear blue water, and right behind it, pine forests along the coast. The waves are pretty strong, so you can watch surfers all year round. In winter, the sea looks wild and moody — honestly, that's my favorite version of it.\n\nWhat makes it special is the coffee street right by the beach — a whole row of cafes overlooking the ocean. Drinking a warm latte while watching the waves? For a coffee person like me, it doesn't get better than that. So yeah, that's pretty much my favorite place in Korea — the sea and coffee, all in one place.", "koQ": "당신의 나라에서 가장 좋아하는 여행지를 묘사해주세요. 그 장소는 어떻게 생겼고, 어떤 특별한 점이 있나요? 가능한 자세히 말해주세요.", "koA": "한국에서 가장 좋아하는 여행지요? 쉽네요. 동해안의 작은 도시, 강릉이에요. 서울에서 고속열차인 KTX로 두 시간 정도밖에 안 걸려서, 짧은 여행에 딱이에요.\n\n그곳 풍경은 정말 멋져요. 믿을 수 없을 만큼 맑고 파란 바다와 긴 백사장이 있고, 바로 뒤로는 해안을 따라 소나무 숲이 이어져요. 파도가 꽤 세서 일 년 내내 서퍼들을 구경할 수 있어요. 겨울 바다는 거칠고 분위기 있어 보이는데, 솔직히 그게 제가 제일 좋아하는 모습이에요.\n\n특별한 점은 해변 바로 옆의 커피 거리예요. 바다가 내려다보이는 카페들이 쭉 늘어서 있거든요. 파도를 보면서 따뜻한 라떼를 마시는 거요? 저 같은 커피 애호가한테는 그보다 좋을 수 없죠. 네, 이게 한국에서 제가 제일 좋아하는 곳이에요. 바다와 커피가 한곳에 다 있으니까요.", "struct": [["1️⃣ 도입", "강릉 · KTX 2시간(getaway)"], ["2️⃣ 풍경", "백사장 · 소나무 숲 · 서퍼"], ["3️⃣ 계절", "겨울 바다의 분위기(moody)"], ["4️⃣ 특별함", "바다 보이는 커피 거리!"], ["5️⃣ 마무리", "바다+커피 all in one + 정리"]], "expr": [["travel destination", "여행지"], ["KTX, our high-speed train", "KTX(고속열차)"], ["a quick getaway", "짧은 여행, 도피"], ["clear blue water", "맑고 파란 바다"], ["all year round", "일 년 내내"], ["wild and moody", "거칠고 분위기 있는"], ["coffee street", "커피 거리"], ["overlooking the ocean", "바다가 내려다보이는"], ["it doesn't get better than that", "그보다 좋을 수 없다"], ["all in one place", "한곳에 전부"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-061 12. 국내여행(Travel)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-061 12. 국내여행(Travel)_묘사.mp3"}, {"id": "1-062", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "습관", "badge": "62 습관", "enQ": "What do you normally do to get ready before going on a trip? What do you pack in your bag, and what items do you always take with you? Describe your preparation process step by step.", "enA": "Let me walk you through my trip preparation, step by step. It starts a few days early: I book the train and the hotel, then check the weather forecast — that decides everything about what I pack.\n\nThe night before, I pack my bag, and my golden rule is simple: pack light. One backpack, that's it. Clothes for two days, a toiletry pouch, and my three must-haves: a phone charger, a portable battery, and earphones. Oh, and I always make a road-trip playlist the night before — for me, that's when the trip actually begins.\n\nOn the morning of the trip, I do one last idiot check — you know, passport, wallet, phone — okay, for domestic trips, just wallet and phone! Then I head out early to grab coffee at the station. So yeah, that's pretty much my routine, and packing light has never let me down.", "koQ": "여행을 떠나기 전에 준비를 위해 보통 무엇을 하나요? 가방에 무엇을 챙기고, 항상 가져가는 물건은 무엇인가요? 준비 과정을 단계별로 설명해주세요.", "koA": "제 여행 준비 과정을 단계별로 차근차근 말씀드릴게요. 준비는 며칠 전부터 시작돼요. 기차와 숙소를 예약하고, 일기예보를 확인해요. 뭘 챙길지는 날씨가 다 결정하거든요.\n\n전날 밤에는 가방을 싸는데, 제 황금 규칙은 간단해요. 가볍게 싸기. 배낭 하나, 끝이에요. 이틀 치 옷, 세면도구 파우치, 그리고 꼭 챙기는 세 가지. 충전기, 보조배터리, 이어폰이요. 아, 그리고 항상 전날 밤에 여행용 플레이리스트를 만들어요. 저한테는 그때부터가 진짜 여행의 시작이거든요.\n\n여행 당일 아침에는 마지막 점검을 해요. 여권, 지갑, 폰… 아, 국내 여행은 지갑이랑 폰만요! 그러고는 일찍 나가서 역에서 커피를 사요. 네, 이게 제 준비 루틴인데, 가볍게 싸기는 한 번도 저를 실망시킨 적이 없어요.", "struct": [["1️⃣ 도입", "며칠 전: 예약 + 일기예보"], ["2️⃣ 규칙", "가볍게 싸기(pack light)!"], ["3️⃣ 필수템", "충전기 · 보조배터리 · 이어폰"], ["4️⃣ 감성", "전날 밤 플레이리스트 제작"], ["5️⃣ 마무리", "최종 점검 + 역에서 커피"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["weather forecast", "일기예보"], ["golden rule", "황금 규칙"], ["pack light", "가볍게 싸다"], ["toiletry pouch", "세면도구 파우치"], ["must-haves", "필수템"], ["portable battery", "보조배터리"], ["road-trip playlist", "여행용 플레이리스트"], ["idiot check", "마지막 점검"], ["has never let me down", "실망시킨 적이 없다"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-062 12. 국내여행(Travel)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-062 12. 국내여행(Travel)_습관.mp3"}, {"id": "1-063", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "취향", "badge": "63 취향", "enQ": "Why do you like domestic trips? Which places do you love visiting the most, and what makes you keep going back there?", "enA": "Why do I like domestic trips? For me, it's all about how easy they are. No flights, no visas, no time difference — I can decide on Friday and be at the beach on Saturday morning. That kind of spontaneity is the whole charm: I can literally travel on a whim.\n\nThe places I love most are small seaside towns, especially on the east coast. And what keeps me coming back? Honestly, the sea itself. I spend all week in the city staring at screens, so standing in front of the ocean feels like someone hit the reset button on my brain.\n\nPlus, every region in Korea has its own famous food, so each trip is half sightseeing, half food tour. When it comes to recharging, a two-day trip to the sea beats a fancy overseas vacation for me — less planning, more resting. That's my taste in a nutshell.", "koQ": "왜 국내 여행을 좋아하나요? 어떤 장소를 방문하는 것을 가장 좋아하고, 무엇이 그곳을 계속 찾게 만드나요?", "koA": "왜 국내 여행을 좋아하냐고요? 저한테는 그 간편함이 전부예요. 비행기도, 비자도, 시차도 없잖아요. 금요일에 결정하고 토요일 아침에 바다에 도착할 수 있어요. 그 즉흥성이 진짜 매력이에요. 말 그대로 내킬 때 바로 떠날 수 있으니까요.\n\n제일 좋아하는 곳은 작은 바닷가 마을들이에요. 특히 동해안이요. 뭐가 저를 계속 가게 만드냐고요? 솔직히 바다 그 자체예요. 일주일 내내 도시에서 화면만 들여다보다가 바다 앞에 서면, 누가 제 머리의 리셋 버튼을 눌러 준 것 같거든요.\n\n게다가 한국은 지역마다 유명한 음식이 있어서, 모든 여행이 절반은 관광, 절반은 먹방 투어예요. 재충전에 관해서라면, 저한테는 1박 2일 바다 여행이 화려한 해외여행을 이겨요. 계획은 덜, 휴식은 더 많으니까요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "핵심 = 간편함 · 즉흥성"], ["2️⃣ 장소", "동해안 바닷가 마을"], ["3️⃣ 이유", "바다 = 리셋 버튼(reset)"], ["4️⃣ 보너스", "지역 음식 = 먹방 투어"], ["5️⃣ 마무리", "계획 덜, 휴식 더 + 정리"]], "expr": [["it's all about ~", "~이 전부다/핵심이다"], ["no flights, no visas, no time difference", "비행기·비자·시차 없음"], ["spontaneity", "즉흥성"], ["on a whim", "내킬 때 바로"], ["keeps me coming back", "계속 찾게 만든다"], ["hit the reset button", "리셋 버튼을 누르다"], ["staring at screens", "화면만 들여다보기"], ["food tour", "먹방 투어"], ["A beats B", "A가 B를 이긴다"], ["less planning, more resting", "계획은 덜, 휴식은 더"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-063 12. 국내여행(Travel)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-063 12. 국내여행(Travel)_취향.mp3"}, {"id": "1-064", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "과거 경험", "badge": "64 과거 경험", "enQ": "Tell me about the trip that you remember the most. Where did you go and when? What did you see and do there? Why is that trip unforgettable for you?", "enA": "Oh, this reminds me of a New Year's trip to Gangneung two years ago. My best friend and I decided, almost at the last minute, to go see the first sunrise of the year — it's a big tradition in Korea.\n\nWe took a night bus, arrived around 5 a.m., and the beach was already totally packed — thousands of people in the freezing cold. We stood there shivering, holding hot packs. Then the sky slowly turned pink, and when the sun finally broke through the clouds, the whole crowd cheered at once.\n\nI'm not kidding, I had goosebumps — partly from the cold, but mostly from the moment. We shouted our wishes at the sea like little kids: thousands of strangers, one sunrise, one shared hope. Since then, sunrise trips have become our little tradition.", "koQ": "가장 기억에 남는 여행에 대해 말해주세요. 언제 어디로 갔었나요? 그곳에서 무엇을 보고 무엇을 했나요? 왜 그 여행을 잊을 수 없나요?", "koA": "아, 2년 전 새해 강릉 여행이 생각나네요. 절친과 저는 거의 막판에 새해 첫 일출을 보러 가기로 결정했어요. 한국에서는 큰 전통이잖아요.\n\n밤 버스를 타고 새벽 5시쯤 도착했는데, 해변은 이미 사람들로 꽉 차 있었어요. 살을 에는 추위 속에 수천 명이 있었죠. 우리는 핫팩을 쥐고 덜덜 떨었어요. 그러다 하늘이 천천히 분홍빛으로 물들고, 마침내 해가 구름을 뚫고 나오는 순간, 모든 사람이 동시에 환호했어요.\n\n진짜예요, 소름이 돋았어요. 일부는 추위 때문이었지만, 대부분은 그 순간 때문이었죠. 우리는 어린애들처럼 바다에 대고 소원을 외쳤어요. 수천 명의 낯선 사람, 하나의 일출, 하나의 바람. 그래서 잊을 수가 없어요. 그 후로 일출 여행은 우리의 작은 전통이 됐어요.", "struct": [["1️⃣ 도입", "새해 강릉 · 막판 결정"], ["2️⃣ 상황", "밤 버스 · 새벽 5시 · 꽉 찬 해변"], ["3️⃣ 절정", "구름 뚫는 해 · 동시 환호"], ["4️⃣ 감정", "소름 · 소원 외치기"], ["5️⃣ 마무리", "낯선 이들과 하나 된 느낌 + 전통"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["at the last minute", "막판에, 마지막 순간에"], ["the first sunrise of the year", "새해 첫 일출"], ["totally packed", "사람들로 꽉 찬"], ["freezing cold", "살을 에는 추위"], ["shivering", "덜덜 떨며"], ["break through the clouds", "구름을 뚫고 나오다"], ["cheer at once", "동시에 환호하다"], ["goosebumps", "소름"], ["like little kids", "어린애들처럼"], ["our little tradition", "우리의 작은 전통"]], "audio": "audio/1_서베이/1-064 12. 국내여행(Travel)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-064 12. 국내여행(Travel)_과거 경험.mp3"}, {"id": "1-065", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "비교", "badge": "65 비교", "enQ": "How has traveling in your country changed compared to when you were young? What was it like back then, and how is it different today? Tell me about the changes.", "enA": "Traveling in Korea has changed so much since I was young. Back then, a trip meant the whole family piling into dad's car with a paper map book — no GPS! We used to stop at every highway rest stop, and honestly, the snacks there were half the fun of the trip.\n\nPlanning was a big deal too. My parents would call hotels directly to book rooms, and we relied on guidebooks to find restaurants.\n\nThese days, it's a completely different story. I book everything on my phone in ten minutes — KTX, hotel, even restaurant waiting lists. Solo trips are totally normal now, and people find hidden spots through social media. Travel became lighter and faster. So yeah, compared to my childhood, trips today are way more convenient — though I have to admit, I sometimes miss those rest-stop snacks.", "koQ": "국내 여행은 당신이 어렸을 때와 비교해 어떻게 변화했나요? 그때는 어땠고, 오늘날은 어떻게 다른가요? 그 변화에 대해 말해주세요.", "koA": "한국에서의 여행은 제가 어릴 때에 비해 정말 많이 변했어요. 그때 여행이란 온 가족이 아빠 차에 우르르 올라타는 거였어요. 종이 지도책과 함께요. GPS가 없었으니까요! 고속도로 휴게소마다 들르곤 했는데, 솔직히 휴게소 간식이 여행 재미의 절반이었어요.\n\n계획 세우기도 큰일이었어요. 부모님이 호텔에 직접 전화해서 방을 예약하셨고, 맛집은 가이드북에 의존해서 찾았죠.\n\n요즘은 완전히 다른 이야기예요. 저는 폰으로 10분이면 다 예약해요. KTX, 호텔, 심지어 식당 웨이팅까지요. 혼자 여행도 이제 아주 흔해졌고, 사람들은 SNS로 숨은 명소를 찾아요. 여행이 더 가볍고 빨라진 거죠. 네, 어린 시절과 비교하면 요즘 여행은 훨씬 편리해요. 그래도 인정할게요, 가끔은 휴게소 간식이 그리워요.", "struct": [["1️⃣ 도입", "변화 인정 (changed so much)"], ["2️⃣ 과거", "가족 차 · 지도책 · 휴게소"], ["3️⃣ 과거", "전화 예약 · 가이드북 의존"], ["4️⃣ 현재", "폰 10분 예약 · 혼행 · SNS"], ["5️⃣ 마무리", "compared to + 그리움 한 스푼"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["pile into ~", "(차에) 우르르 올라타다"], ["map book", "지도책"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["highway rest stop", "고속도로 휴게소"], ["half the fun", "재미의 절반"], ["it's a completely different story", "완전히 다른 이야기다"], ["solo trips", "혼자 여행, 혼행"], ["hidden spots", "숨은 명소"], ["I have to admit", "인정할게요"], ["compared to ~", "~과 비교하면"]], "audio": "audio/1_서베이/1-065 12. 국내여행(Travel)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-065 12. 국내여행(Travel)_비교.mp3"}, {"id": "1-066", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "묘사", "badge": "66 묘사", "enQ": "Tell me about a foreign city or country you have been to. Where was it, and what did it look like? What impression did the place leave on you?", "enA": "A foreign city I've been to? Let me tell you about Osaka, Japan — it was actually my first trip abroad, so it holds a special place in my heart.\n\nThe city itself is a fascinating mix. The famous Dotonbori area at night is pure sensory overload — giant neon signs, huge 3D billboards, canals reflecting all those lights, and food stalls everywhere. But then you turn into a side street, and suddenly it's quiet little alleys with tiny old restaurants that only seat five people.\n\nThe impression it left on me? Osaka taught me that traveling isn't really about sightseeing — it's about eating your way through a city! But seriously, what stuck with me was how a place so close to Korea could feel so different. It made the world feel bigger and smaller at the same time. So yeah, that's pretty much my Osaka story.", "koQ": "가본 적 있는 외국 도시나 나라에 대해 말해주세요. 어디였고, 어떤 모습이었나요? 그 장소는 당신에게 어떤 인상을 남겼나요?", "koA": "가 본 외국 도시요? 일본 오사카 이야기를 해 드릴게요. 사실 제 첫 해외여행지라서, 마음속에 특별한 자리를 차지하고 있는 곳이에요.\n\n도시 자체가 매혹적인 혼합체예요. 밤의 그 유명한 도톤보리 거리는 그야말로 감각의 과부하예요. 거대한 네온사인, 큼직한 3D 전광판, 그 불빛을 전부 반사하는 운하, 그리고 어디에나 있는 길거리 음식 가게들이요. 그런데 옆골목으로 들어서면, 갑자기 다섯 명만 앉을 수 있는 작고 오래된 식당들이 있는 조용한 골목이 나와요.\n\n남은 인상이요? 오사카는 여행이 관광이 아니라 도시를 먹으며 누비는 일이라는 걸 가르쳐 줬어요! 농담이고요, 진짜 마음에 남은 건 한국에서 이렇게 가까운 곳이 이렇게 다를 수 있다는 거였어요. 세상이 더 크게, 동시에 더 작게 느껴지게 했죠. 네, 이게 제 오사카 이야기예요.", "struct": [["1️⃣ 도입", "오사카 = 첫 해외여행"
