], ["2️⃣ 화려함", "도톤보리 네온 · 운하 · 포장마차"], ["3️⃣ 반전", "옆골목의 조용한 노포들"], ["4️⃣ 인상", "가깝지만 완전히 다른 세계"], ["5️⃣ 마무리", "세상이 크고도 작아짐 + 정리"]], "expr": [["first trip abroad", "첫 해외여행"], ["hold a special place in my heart", "마음속 특별한 자리를 차지하다"], ["a fascinating mix", "매혹적인 혼합"], ["sensory overload", "감각의 과부하"], ["neon signs", "네온사인"], ["side street / alleys", "옆골목 / 골목길"], ["eat your way through ~", "~을 먹으면서 여행하다"], ["stuck with me", "마음에 남았다"], ["at the same time", "동시에"], ["bigger and smaller at the same time", "더 크고도 작게"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-066 13. 해외여행(Overseas)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-066 13. 해외여행(Overseas)_묘사.mp3"}, {"id": "1-067", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "습관", "badge": "67 습관", "enQ": "How do you usually prepare for an overseas trip? What do you do beforehand, and what do you pack in your suitcase? Tell me everything you do before leaving in detail.", "enA": "Overseas trips need way more prep than domestic ones, so let me walk you through it. First things first: the paperwork. I check my passport expiration date — I learned that the hard way — then book flights, reserve hotels, and set up an eSIM for data.\n\nAbout a week before, I handle money: I exchange some cash and double-check that my cards work abroad. I also make a rough day-by-day plan — nothing strict, just the must-see spots.\n\nAs for my suitcase, here's my rule: I only fill it halfway. Why? Because the other half is for shopping and souvenirs on the way back — I know myself too well! Besides clothes, my must-haves are a universal adapter, basic medicine, and a document pouch. So yeah, that's pretty much my pre-trip routine — half planning, half daydreaming.", "koQ": "해외 여행을 어떻게 준비하나요? 미리 무엇을 하고, 캐리어에는 무엇을 챙기나요? 떠나기 전에 하는 모든 일을 자세히 말해주세요.", "koA": "해외여행은 국내 여행보다 준비할 게 훨씬 많아요. 차근차근 말씀드릴게요. 뭐니 뭐니 해도 첫째는 서류예요. 여권 만료일부터 확인하고요. 이건 한 번 고생하고 배웠어요. 그다음 항공권 예약, 호텔 예약, 데이터용 eSIM 준비까지 해요.\n\n일주일쯤 전에는 돈 문제를 처리해요. 현금을 약간 환전하고, 카드가 해외에서 되는지 다시 확인해요. 대략적인 일정표도 만들어요. 빡빡하게는 말고, 꼭 볼 곳 정도만요.\n\n캐리어로 말하자면, 저만의 규칙이 있어요. 절반만 채우기. 왜냐고요? 나머지 절반은 돌아올 때 쇼핑과 기념품을 위한 공간이거든요. 제가 저를 너무 잘 알아요! 옷 말고 필수템은 멀티 어댑터, 상비약, 그리고 서류 파우치예요. 네, 이게 제 여행 전 루틴이에요. 절반은 계획, 절반은 설렘이죠.", "struct": [["1️⃣ 도입", "서류부터! 여권 만료일 확인"], ["2️⃣ 예약", "항공 · 호텔 · eSIM"], ["3️⃣ 자금", "환전 · 카드 확인 · 일정표"], ["4️⃣ 캐리어", "절반만 채우기(쇼핑 공간!)"], ["5️⃣ 마무리", "필수템 3종 + 설렘 마무리"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["First things first", "뭐니 뭐니 해도 첫째는"], ["passport expiration date", "여권 만료일"], ["learn ~ the hard way", "고생하며 배우다"], ["eSIM", "eSIM(데이터)"], ["day-by-day plan", "일자별 일정표"], ["fill it halfway", "절반만 채우다"], ["shopping and souvenirs", "쇼핑과 기념품"], ["universal adapter", "멀티 어댑터"], ["I know myself too well", "내가 나를 너무 잘 알죠"], ["half planning, half daydreaming", "절반은 계획, 절반은 설렘"]], "audio": "audio/1_서베이/1-067 13. 해외여행(Overseas)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-067 13. 해외여행(Overseas)_습관.mp3"}, {"id": "1-068", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "취향", "badge": "68 취향", "enQ": "Which country would you most like to travel to, and why? What attracts you to that place - the food, the scenery, or the culture? Tell me the reasons in detail.", "enA": "The country at the top of my bucket list? Italy, without a second of hesitation. And if I had to choose one reason among food, scenery, and culture — it's all about the food for me.\n\nYou might remember I cook pasta at home — well, that's exactly why! I want to taste the real thing: fresh pasta in Rome, pizza in Naples, gelato... basically, I want to eat my way through the whole country. I've watched so many Italian food documentaries that I feel like I've already been there in spirit.\n\nOf course, the scenery and culture matter too — the old cities, the coast, the relaxed way of life where a meal takes three hours. Honestly, that unhurried culture is what my life is missing! So yeah, when it comes to dream destinations, nothing beats Italy for me. That's my taste in a nutshell.", "koQ": "가장 여행 가고 싶은 나라는 어디이고, 그 이유는 무엇인가요? 음식, 풍경, 문화 중 무엇이 그곳에 끌리게 하나요? 그 이유를 자세히 말해주세요.", "koA": "제 버킷리스트 1순위 나라요? 이탈리아요. 1초의 망설임도 없어요. 그리고 음식, 풍경, 문화 중 하나만 골라야 한다면, 저한테는 음식이 전부예요.\n\n제가 집에서 파스타를 만든다고 했던 거 기억하실 거예요. 바로 그게 이유예요! 진짜를 맛보고 싶거든요. 로마의 생면 파스타, 나폴리의 피자, 젤라토까지. 한마디로 나라 전체를 먹으면서 여행하고 싶어요. 이탈리아 음식 다큐멘터리를 하도 많이 봐서, 마음으로는 이미 다녀온 기분이에요.\n\n물론 풍경과 문화도 중요해요. 오래된 도시들, 해안, 그리고 식사 한 끼에 세 시간이 걸리는 그 여유로운 삶의 방식이요. 솔직히 그 서두르지 않는 문화가 제 삶에 없는 바로 그거예요! 네, 꿈의 여행지에 관해서라면 저한테는 이탈리아만 한 곳이 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "버킷리스트 1위 = 이탈리아"], ["2️⃣ 선택", "3개 중 음식(it's all about)"], ["3️⃣ 이유", "파스타 본토 맛(요리 편 연결!)"], ["4️⃣ 보조", "풍경 · 3시간 식사 문화"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "expr": [["bucket list", "버킷리스트"], ["without a second of hesitation", "1초의 망설임도 없이"], ["if I had to choose", "굳이 골라야 한다면"], ["it's all about the food", "음식이 전부다"], ["the real thing", "진짜, 본토의 것"], ["eat my way through ~", "~을 먹으면서 여행하다"], ["already been there in spirit", "마음으로는 이미 다녀온"], ["way of life", "삶의 방식"], ["what my life is missing", "내 삶에 없는 바로 그것"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-068 13. 해외여행(Overseas)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-068 13. 해외여행(Overseas)_취향.mp3"}, {"id": "1-069", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "과거 경험", "badge": "69 과거 경험", "enQ": "Tell me about an unforgettable experience from one of your trips abroad. Perhaps something funny, surprising, or embarrassing happened. What was it, and how did you handle it? Tell me the full story.", "enA": "Oh, this reminds me of an embarrassing moment from my Osaka trip. On the last night, my friend and I took the subway back to our hotel — or so we thought. Guess what? We'd taken the train going in the opposite direction.\n\nWe only realized it thirty minutes later, when the train reached the end of the line — some quiet suburban station we'd never heard of. It was almost midnight, our phone batteries were nearly dead, and neither of us spoke Japanese. To be honest, I was a little panicked.\n\nBut here's the thing: an old Japanese couple noticed us looking lost. Using a translation app and lots of hand gestures, they walked us to the right platform and even waited until our train came. We just kept bowing like crazy! In the end, everything worked out fine, and honestly, getting lost became my favorite memory of the whole trip. Since then, I always double-check the train direction — and I trust the kindness of strangers a lot more.", "koQ": "해외 여행 중 겪은 잊을 수 없는 경험에 대해 말해주세요. 웃기거나 놀랍거나 당황스러운 일이 있었을 수도 있습니다. 무슨 일이었고, 어떻게 대처했나요? 전체 이야기를 들려주세요.", "koA": "아, 오사카 여행에서 겪은 당황스러운 순간이 생각나네요. 마지막 날 밤, 친구와 저는 호텔로 돌아가는 지하철을 탔어요. 그런 줄 알았죠. 그런데 있잖아요, 우리는 반대 방향 열차를 탔던 거예요.\n\n30분이 지나서야 알아차렸어요. 열차가 종점에 도착했을 때요. 이름도 들어 본 적 없는 조용한 교외 역이었어요. 자정이 다 됐고, 폰 배터리는 거의 없고, 둘 다 일본어를 못 했어요. 솔직히 좀 당황했어요.\n\n그런데 반전이 있어요. 일본인 노부부가 길을 잃고 헤매는 우리를 알아챈 거예요. 번역 앱과 수많은 손짓을 동원해서 우리를 맞는 승강장까지 데려다주셨고, 심지어 우리 열차가 올 때까지 기다려 주셨어요. 우리는 미친 듯이 인사만 했죠! 결국 모든 게 잘 해결됐고, 솔직히 길을 잃은 게 그 여행 전체에서 제일 좋아하는 추억이 됐어요. 그 후로는 항상 열차 방향을 두 번 확인해요. 그리고 낯선 사람의 친절을 훨씬 더 믿게 됐어요.", "struct": [["1️⃣ 도입", "오사카 마지막 밤 · 지하철"], ["2️⃣ 문제", "반대 방향 → 종점 · 자정"], ["3️⃣ 위기", "배터리 부족 · 언어 장벽"], ["4️⃣ 반전", "노부부의 친절 · 번역 앱"], ["5️⃣ 마무리", "최애 추억 + 이중 교훈"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["or so we thought", "그런 줄 알았죠"], ["in the opposite direction", "반대 방향으로"], ["the end of the line", "종점"], ["nearly dead (battery)", "(배터리가) 거의 없는"], ["a little panicked", "살짝 당황한"], ["here's the thing", "그런데 반전이 있어요"], ["translation app / hand gestures", "번역 앱 / 손짓"], ["bow like crazy", "미친 듯이 인사하다"], ["everything worked out fine", "결국 다 잘 해결됐다"], ["the kindness of strangers", "낯선 사람들의 친절"]], "audio": "audio/1_서베이/1-069 13. 해외여행(Overseas)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-069 13. 해외여행(Overseas)_과거 경험.mp3"}, {"id": "1-070", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "비교", "badge": "70 비교", "enQ": "Compare traveling abroad with traveling in your own country. What are the biggest differences between the two? Which one do you find more enjoyable, and why?", "enA": "Interesting question, because I love both — but they're completely different experiences. The biggest difference, for me, is effort versus comfort.\n\nTraveling abroad takes real effort: flights, passports, currency, language barriers. But that effort buys you something priceless — everything feels brand new. Even a convenience store becomes an adventure! Domestic trips, on the other hand, are effortless. No planning stress, no jet lag — just pure rest. One is like an exciting movie; the other is like your favorite comfort food.\n\nSo which do I enjoy more? It depends on what I need. For inspiration, nothing beats going abroad — those trips stick with me for years. But when I need to recharge, I choose a Korean beach town. If I had to pick one, domestic wins — I can do it ten times more often. Quantity has a quality of its own, right?", "koQ": "해외 여행과 국내 여행을 비교해주세요. 둘 사이의 가장 큰 차이점은 무엇인가요? 어느 쪽이 더 즐겁고, 그 이유는 무엇인가요?", "koA": "흥미로운 질문이네요. 저는 둘 다 좋아하는데, 완전히 다른 경험이거든요. 저한테 가장 큰 차이는 '노력 대 편안함'이에요.\n\n해외여행은 진짜 노력이 들어가요. 비행기, 여권, 환전, 언어 장벽까지요. 하지만 그 노력이 값을 매길 수 없는 걸 안겨 줘요. 모든 게 완전히 새롭게 느껴진다는 거요. 편의점 가는 것도 모험이 되잖아요! 반면 국내 여행은 힘이 하나도 안 들어요. 계획 스트레스도, 시차도 없이 순수한 휴식만 있죠. 하나는 신나는 영화 같고, 다른 하나는 최애 컴포트 푸드 같아요.\n\n그래서 어느 쪽이 더 즐겁냐고요? 뭐가 필요하냐에 따라 달라요. 영감이 필요할 때는 해외만 한 게 없어요. 그런 여행은 몇 년씩 마음에 남거든요. 하지만 재충전이 필요할 때는 한국의 바닷가 마을을 선택해요. 굳이 하나만 골라야 한다면 국내 여행의 승리예요. 열 배는 더 자주 갈 수 있으니까요. 양도 그 자체로 질이 되는 법이잖아요?", "struct": [["1️⃣ 도입", "차이 = 노력 vs 편안함"], ["2️⃣ 해외", "노력 → 모든 게 새로움"], ["3️⃣ 국내", "무노력 · 순수한 휴식"], ["4️⃣ 비유", "신나는 영화 vs 컴포트 푸드"], ["5️⃣ 마무리", "상황별 답 + 최종 선택(국내)"]], "expr": [["The biggest difference is ~", "가장 큰 차이는 ~이다"], ["effort versus comfort", "노력 대 편안함"], ["language barriers", "언어 장벽"], ["everything feels brand new", "모든 게 완전히 새롭다"], ["on the other hand", "반면에"], ["comfort food", "컴포트 푸드(위안 음식)"], ["inspiration", "영감"], ["stick with me", "마음에 남다"], ["recharge", "재충전하다"], ["If I had to pick", "굳이 하나를 골라야 한다면"], ["Quantity has a quality of its own", "양도 그 자체로 질이 된다"]], "audio": "audio/1_서베이/1-070 13. 해외여행(Overseas)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-070 13. 해외여행(Overseas)_비교.mp3"}, {"id": "1-071", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "묘사", "badge": "71 묘사", "enQ": "Describe your home for me. What does it look like, and how many rooms are there? Tell me about your house in detail.", "enA": "I live in a two-bedroom apartment on the tenth floor — pretty typical for Korea, where most people live in apartment complexes. It's not huge, but it's just the right size for me.\n\nLet me give you a quick tour. When you walk in, the living room opens up right in front of you — that's the heart of my home, with my beloved gray couch by the window. The kitchen is connected to it, so I can watch shows while cooking. Then there are two rooms: my bedroom, and a smaller room I use as a bit of everything — part closet, part home office.\n\nMy favorite thing about this place is the natural light. It faces south, so on sunny days I don't even need the lights on. It's simple and small, but every corner is exactly the way I like it. So yeah, that's pretty much my home sweet home.", "koQ": "당신의 집을 묘사해주세요. 어떻게 생겼고, 방은 몇 개인가요? 당신의 집에 대해 자세히 말해주세요.", "koA": "저는 10층에 있는 방 두 개짜리 아파트에 살아요. 한국에서는 아주 전형적인 형태죠. 대부분 아파트 단지에 사니까요. 크진 않지만 저한테는 딱 맞는 크기예요.\n\n간단히 투어를 시켜 드릴게요. 들어서면 바로 앞에 거실이 펼쳐져요. 우리 집의 심장이죠. 창가에는 제가 아끼는 회색 소파가 있고요. 주방이 거실과 연결되어 있어서 요리하면서 방송도 볼 수 있어요. 그리고 방이 두 개 있는데, 하나는 침실이고, 작은 방은 반은 옷방, 반은 홈오피스인 만능 방으로 써요.\n\n이 집에서 제일 좋아하는 건 채광이에요. 남향이라 맑은 날에는 불을 켤 필요도 없어요. 소박하고 작지만, 구석구석이 정확히 제가 좋아하는 모습이에요. 네, 이게 저의 스위트홈이에요.", "struct": [["1️⃣ 도입", "10층 투룸 아파트 · 한국 전형"], ["2️⃣ 투어", "거실(소파!) + 연결된 주방"], ["3️⃣ 방", "침실 + 만능 방(옷방·오피스)"], ["4️⃣ 자랑", "남향 채광(natural light)"], ["5️⃣ 마무리", "home sweet home 정리"]], "expr": [["two-bedroom apartment", "방 두 개짜리 아파트"], ["apartment complexes", "아파트 단지"], ["just the right size", "딱 맞는 크기"], ["Let me give you a quick tour", "간단히 투어시켜 드릴게요"], ["the heart of my home", "우리 집의 심장"], ["a bit of everything", "만능(이것저것 다 하는)"], ["natural light", "자연 채광"], ["face south", "남향이다"], ["exactly the way I like it", "정확히 내 취향대로"], ["home sweet home", "즐거운 나의 집"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/1_서베이/1-071 14. 집(Home)_묘사1.mp3", "label": "묘사 1", "qaudio": "audio_q/1_서베이/1-071 14. 집(Home)_묘사1.mp3"}, {"id": "1-072", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "묘사", "badge": "72 묘사", "enQ": "Describe your bedroom for me. How is it decorated, and what things do you keep in there? Please explain what your bedroom looks like in detail.", "enA": "My bedroom? It's honestly the simplest room in my home — and that's by design. I keep it minimal on purpose, because for me, the bedroom is for one thing only: quality sleep.\n\nThe colors are all soft — white walls, wooden furniture, and beige bedding. The bed takes up most of the space, and I invested in a really good mattress — zero regrets there! I also have blackout curtains, which are a total game changer for sleeping in on weekends. On the bedside table, there's just a small lamp, a book, and my phone charger.\n\nThe one decoration I allowed myself is a photo wall — a little collage of pictures from my trips with friends. It's the last thing I see before I sleep. So yeah, that's pretty much my bedroom: nothing fancy, but exactly the way I like it.", "koQ": "당신의 침실을 묘사해주세요. 어떻게 꾸며져 있고, 그곳에 어떤 물건들을 두나요? 침실이 어떻게 생겼는지 자세히 설명해주세요.", "koA": "제 침실이요? 솔직히 우리 집에서 제일 단순한 방인데, 그건 의도된 거예요. 일부러 미니멀하게 유지하거든요. 저한테 침실은 오직 한 가지, 질 좋은 잠을 위한 공간이니까요.\n\n색은 전부 부드러운 톤이에요. 흰 벽, 원목 가구, 베이지색 침구요. 침대가 공간의 대부분을 차지하는데, 정말 좋은 매트리스에 투자했어요. 후회는 전혀 없어요! 암막커튼도 있는데, 주말 늦잠에는 완전 게임 체인저예요. 침대 옆 테이블에는 작은 램프, 책 한 권, 폰 충전기만 있어요.\n\n제가 허락한 유일한 장식은 사진 벽이에요. 친구들과의 여행 사진을 모아 붙인 작은 콜라주요. 잠들기 전 마지막으로 보는 게 그 사진들이에요. 네, 제 침실은 대체로 이래요. 대단할 건 없지만, 정확히 제 취향대로예요.", "struct": [["1️⃣ 도입", "미니멀 = 의도(by design)"], ["2️⃣ 색감", "흰 벽 · 원목 · 베이지 침구"], ["3️⃣ 투자", "좋은 매트리스 · 암막커튼"], ["4️⃣ 장식", "여행 사진 벽(photo wall)"], ["5️⃣ 마무리", "차분하고 조용한 내 취향"]], "expr": [["by design", "의도된 것"], ["minimal on purpose", "일부러 미니멀하게"], ["quality sleep", "질 좋은 잠"], ["wooden furniture", "원목 가구"], ["zero regrets", "후회 제로"], ["blackout curtains", "암막커튼"], ["game changer", "게임 체인저"], ["sleep in", "늦잠 자다"], ["bedside table", "침대 옆 테이블"], ["photo wall", "사진 벽"], ["the last thing I see before I sleep", "잠들기 전 마지막으로 보는 것"]], "audio": "audio/1_서베이/1-072 14. 집(Home)_묘사2.mp3", "label": "묘사 2", "qaudio": "audio_q/1_서베이/1-072 14. 집(Home)_묘사2.mp3"}, {"id": "1-073", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "습관", "badge": "73 습관", "enQ": "Tell me about what you usually do at home. How do your weekday activities differ from your weekend ones? Describe your daily routine at home.", "enA": "My life at home is a tale of two versions: weekday me and weekend me. Let me walk you through both.\n\nOn weekdays, home is basically my recharging station. I get back from work around seven, cook a simple dinner — usually something quick like fried rice — and eat while watching an episode. After that, I tidy up a bit, take a long shower, and wind down with quiet music. Nothing exciting, but that routine keeps me sane.\n\nWeekends are a completely different story. Saturday morning starts with a big cleaning session — laundry, vacuuming, the whole reset ritual. A clean house makes the weekend feel twice as long! Then the couch takes over: movies, snacks, sometimes friends coming over for chimaek. So yeah, weekdays are for surviving, weekends are for living.", "koQ": "집에서 주로 무엇을 하는지 말해주세요. 평일 활동과 주말 활동은 어떻게 다른가요? 집에서의 하루 일과를 설명해주세요.", "koA": "제 집 생활은 두 가지 버전의 이야기예요. 평일의 나와 주말의 나요. 둘 다 차근차근 말씀드릴게요.\n\n평일에 집은 기본적으로 저의 충전소예요. 7시쯤 퇴근해서 간단한 저녁을 만들어요. 보통 볶음밥처럼 빨리 되는 걸로요. 뭔가 한 편을 보면서 먹고요. 그 후엔 가볍게 정리하고, 오래 샤워하고, 잔잔한 음악으로 긴장을 풀어요. 신나는 건 없지만, 그 루틴이 저를 제정신으로 유지해 줘요.\n\n주말은 완전히 다른 이야기예요. 토요일 아침은 대청소로 시작해요. 빨래에 청소기 돌리기까지, 완전한 리셋 의식이죠. 집이 깨끗하면 주말이 두 배로 길게 느껴져요! 그다음은 소파가 접수해요. 영화, 간식, 가끔은 친구들이 치맥 하러 놀러 오고요. 네, 평일은 버티는 날, 주말은 사는 날이에요.", "struct": [["1️⃣ 도입", "평일의 나 vs 주말의 나"], ["2️⃣ 평일", "저녁 요리 · 한 편 시청 · 정리"], ["3️⃣ 밤", "샤워 · 음악으로 wind down"], ["4️⃣ 주말", "대청소 리셋 → 소파 점령"], ["5️⃣ 마무리", "버티기 vs 살기 + 정리 멘트"]], "expr": [["a tale of two versions", "두 가지 버전의 이야기"], ["let me walk you through ~", "~을 차근차근 설명할게요"], ["recharging station", "충전소"], ["tidy up", "정리하다"], ["wind down", "긴장을 풀다"], ["keep me sane", "제정신으로 유지해 주다"], ["a completely different story", "완전히 다른 이야기"], ["reset ritual", "리셋 의식"], ["twice as long", "두 배로 길게"], ["come over", "(우리 집에) 놀러 오다"], ["weekdays are for surviving, weekends are for living", "평일은 버티기, 주말은 살기"]], "audio": "audio/1_서베이/1-073 14. 집(Home)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-073 14. 집(Home)_습관.mp3"}, {"id": "1-074", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "취향", "badge": "74 취향", "enQ": "Which room in your house do you like the most, and why? What do you enjoy doing in that room? Tell me why that space is your favorite.", "enA": "If I had to choose, my favorite space is definitely the living room — no contest. You could say I don't really live in my apartment; I live in my living room!\n\nFor me, it's all about that couch by the window. Everything good happens there: movie nights, chimaek with friends, lazy Sunday naps, even my home vacations. The natural light pouring through the big window makes it the brightest, warmest spot in the house — my plants love it there too, by the way.\n\nBut the real reason it's my favorite? It's the only room with zero pressure. The bedroom says \"sleep,\" the kitchen says \"cook,\" my desk says \"work\" — but the living room doesn't ask me for anything. I can just be. When it comes to my home, nothing beats that couch by the window. That's my taste in a nutshell.", "koQ": "집에서 어떤 방을 가장 좋아하고, 그 이유는 무엇인가요? 그 방에서 무엇을 하는 것을 즐기나요? 왜 그 공간이 가장 좋은지 말해주세요.", "koA": "굳이 골라야 한다면, 제 최애 공간은 단연 거실이에요. 경쟁 상대가 없어요. 저는 아파트에 사는 게 아니라 거실에 산다고 해도 될 정도예요!\n\n저한테는 창가의 그 소파가 전부예요. 좋은 일은 전부 거기서 일어나거든요. 영화의 밤, 친구들과의 치맥, 게으른 일요일 낮잠, 심지어 집 휴가까지요. 큰 창으로 쏟아지는 햇살 덕분에 집에서 가장 밝고 따뜻한 자리이기도 해요. 참고로 제 식물들도 거기를 제일 좋아해요.\n\n그런데 진짜 좋아하는 이유요? 압박이 전혀 없는 유일한 방이라서예요. 침실은 '자라'고 하고, 주방은 '요리하라'고 하고, 책상은 '일하라'고 하잖아요. 근데 거실은 저한테 아무것도 요구하지 않아요. 그냥 존재해도 되는 곳이죠. 우리 집에 관해서라면, 창가의 그 소파만 한 게 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "최애 = 거실(no contest)"], ["2️⃣ 활동", "영화 · 치맥 · 낮잠 · 집 휴가"], ["3️⃣ 환경", "햇살 · 가장 따뜻한 자리"], ["4️⃣ 진짜 이유", "압박 제로 · 그냥 존재하기"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "expr": [["if I had to choose", "굳이 골라야 한다면"], ["no contest", "경쟁 상대가 없다"], ["I live in my living room", "거실에 산다"], ["it's all about ~", "~이 전부다/핵심이다"], ["natural light pouring through", "쏟아져 들어오는 햇살"], ["by the way", "참고로"], ["zero pressure", "압박 제로"], ["The bedroom says \"sleep\"", "침실은 자라고 말한다"], ["I can just be", "그냥 존재해도 된다"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-074 14. 집(Home)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-074 14. 집(Home)_취향.mp3"}, {"id": "1-075", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "과거 경험", "badge": "75 과거 경험", "enQ": "Have you had any problems at your house? Tell me what the problem was, how you dealt with it, and how everything turned out in the end. Give me as many details as possible.", "enA": "Oh yes — this reminds me of the boiler incident last winter. One morning in January, I woke up because my room was freezing cold. The floor heating — you know, Korean ondol — was completely dead, and so was the hot water.\n\nIt was the coldest week of the year, of course — these things always happen at the worst possible time! I called the maintenance office first, and they connected me with a repair technician. The bad news: he couldn't come until two days later because half the building had the same problem.\n\nSo for two days, I basically lived like a penguin — triple layers, thick blankets, and an electric pad that became my best friend. I also learned to boil water the old-fashioned way for washing. When the technician finally fixed it — a broken part in the boiler — taking a hot shower felt like pure luxury. In the end, everything worked out fine, and since then, I get the boiler checked every fall before winter comes. Lesson learned!", "koQ": "집에서 문제를 겪은 적이 있나요? 문제가 무엇이었고, 어떻게 대처했으며, 결국 어떻게 되었는지 말해주세요. 가능한 많은 세부사항을 말해주세요.", "koA": "아, 있죠. 작년 겨울 보일러 사건이 생각나네요. 1월의 어느 아침, 방이 너무 추워서 잠에서 깼어요. 바닥 난방이, 그러니까 한국의 온돌이요, 완전히 죽어 있었고 온수도 안 나왔어요.\n\n당연히 그 주가 그해 가장 추운 주였죠. 이런 일은 항상 최악의 타이밍에 일어나잖아요! 먼저 관리사무소에 전화했더니 수리 기사님을 연결해 줬어요. 나쁜 소식은, 건물 절반이 같은 문제를 겪고 있어서 이틀 뒤에나 올 수 있다는 거였어요.\n\n그래서 이틀 동안 저는 펭귄처럼 살았어요. 옷 세 겹, 두꺼운 담요, 그리고 제 절친이 된 전기장판이요. 씻을 물은 옛날 방식으로 끓이는 법도 배웠고요. 기사님이 마침내 고쳐 주셨을 때, 보일러 부품이 하나 고장 났던 거였는데, 뜨거운 샤워가 순수한 사치처럼 느껴졌어요. 결국 다 잘 해결됐고, 그 후로는 겨울이 오기 전 가을마다 보일러 점검을 받아요. 교훈 확실히 얻었죠!", "struct": [["1️⃣ 도입", "1월 아침 · 온돌+온수 사망"], ["2️⃣ 대처", "관리사무소 → 기사 연결"], ["3️⃣ 위기", "이틀 대기(최악의 타이밍)"], ["4️⃣ 생존", "3겹 옷 · 전기장판 · 물 끓이기"], ["5️⃣ 마무리", "수리 완료 + 가을 점검 교훈"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["freezing cold", "살을 에는 추위"], ["ondol (floor heating)", "온돌(바닥 난방)"], ["at the worst possible time", "최악의 타이밍에"], ["maintenance office", "관리사무소"], ["repair technician", "수리 기사"], ["live like a penguin", "펭귄처럼 살다"], ["became my best friend", "절친이 됐다"], ["the old-fashioned way", "옛날 방식으로"], ["pure luxury", "순수한 사치"], ["Lesson learned!", "교훈 얻었어요!"]], "audio": "audio/1_서베이/1-075 14. 집(Home)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-075 14. 집(Home)_과거 경험1.mp3"}, {"id": "1-076", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "과거 경험", "badge": "76 과거 경험", "enQ": "Tell me about a change you made to your home, such as buying new furniture or redecorating. Why did you decide to do it, and how did your home look afterward? Were you satisfied with the result?", "enA": "The biggest change I ever made to my home? Easy — buying my big gray couch two years ago. It might sound small, but trust me, it changed everything.\n\nHere's the backstory: for my first year in this apartment, I had no sofa at all. I sat on a cushion on the floor, Korean style, and my back was not a fan. One day, after a long week, I realized I didn't even want to stay home — my own house wasn't comfortable! That was the push I needed. I spent weeks comparing options — you know how I am with comparing prices — and finally picked a big, deep gray one.\n\nThe moment it arrived, the living room transformed — it suddenly looked like a real home. Friends started coming over more, my home vacations were born, and my back sent me a thank-you letter. Satisfied? It's the best money I've ever spent. One couch, whole new home.", "koQ": "새 가구를 사거나 인테리어를 바꾸는 것처럼 집에 준 변화에 대해 말해주세요. 왜 그렇게 하기로 결정했고, 그 후에 집은 어떻게 보였나요? 결과에 만족했나요?", "koA": "집에 준 가장 큰 변화요? 쉬워요. 2년 전에 그 큰 회색 소파를 산 거예요. 사소하게 들릴 수 있지만, 진짜 모든 걸 바꿔 놨어요.\n\n배경 이야기를 하자면, 이 아파트에서의 첫해에는 소파가 아예 없었어요. 한국식으로 바닥 방석에 앉아 지냈는데, 제 허리가 그걸 아주 싫어했죠. 어느 날, 힘든 한 주를 보내고 나서 집에 있기조차 싫다는 걸 깨달았어요. 내 집이 편하지 않았던 거예요! 그게 필요했던 결정타였어요. 몇 주 동안 이것저것 비교했고요. 제가 가격 비교에 진심인 거 아시잖아요. 마침내 크고 짙은 회색 소파를 골랐어요.\n\n소파가 도착한 순간, 거실이 완전히 변신했어요. 갑자기 진짜 집처럼 보이더라고요. 친구들이 더 자주 놀러 오기 시작했고, 제 집 휴가도 그때 탄생했고, 제 허리는 감사 편지를 보냈죠. 만족하냐고요? 솔직히 제 인생 최고의 지출이에요. 네, 소파 하나로 집이 새로 태어났어요.", "struct": [["1️⃣ 도입", "최대 변화 = 회색 소파 구입"], ["2️⃣ 배경", "소파 없는 1년 · 바닥 생활"], ["3️⃣ 계기", "내 집이 불편하다는 깨달음"], ["4️⃣ 변화", "거실 변신 · 친구 · 집 휴가 탄생"], ["5️⃣ 마무리", "인생 최고의 지출 + 만족!"]], "expr": [["changed everything", "모든 걸 바꿨다"], ["Here's the backstory", "배경 이야기를 하자면"], ["Korean style (on the floor)", "한국식 바닥 생활"], ["was not a fan", "아주 싫어했다"], ["the push I needed", "필요했던 결정타"], ["comparing prices", "가격 비교"], ["transform", "변신하다"], ["come over", "(우리 집에) 놀러 오다"], ["thank-you letter", "감사 편지"], ["the best money I've ever spent", "인생 최고의 지출"], ["one couch, whole new home", "소파 하나, 새집 완성"]], "audio": "audio/1_서베이/1-076 14. 집(Home)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-076 14. 집(Home)_과거 경험2.mp3"}, {"id": "1-077", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "비교", "badge": "77 비교", "enQ": "Compare your current home with the one you lived in before. What are the differences between the two houses, and why did you move? Tell me in detail.", "enA": "My current home and my old one? Night and day, honestly. Before this apartment, I lived in a tiny studio near my old job — my first place after moving out.\n\nThat studio was... let's say \"cozy,\" and by cozy I mean my bed, desk, and kitchen were all within arm's reach of each other — not in a good way! It was on the second floor facing another building, so it was dark all day, and in summer, the humidity was unbearable. Still, it was my first independent space, so I have a soft spot for it.\n\nI moved two years ago for two reasons: a new job with a longer commute, and the fact that I'd outgrown that studio. Compared to the old place, my apartment now is a different world — a real bedroom, a real kitchen for my cooking hobby, and that glorious south-facing light. The old studio taught me to survive; this home taught me to enjoy living. That's the biggest difference.", "koQ": "지금 사는 집과 이전에 살던 집을 비교해주세요. 두 집의 차이점은 무엇이고, 왜 이사를 했나요? 자세히 말해주세요.", "koA": "지금 집과 예전 집이요? 솔직히 하늘과 땅 차이예요. 이 아파트 전에는 예전 직장 근처의 아주 작은 원룸에 살았어요. 독립하고 처음 얻은 집이었죠.\n\n그 원룸은… '아늑했다'고 해 둘게요. 아늑하다는 건 침대, 책상, 주방이 전부 서로 손 닿는 거리에 있었다는 뜻이에요. 좋은 의미가 아니고요! 2층인 데다 다른 건물을 마주 보고 있어서 하루 종일 어두웠고, 여름엔 습기가 견딜 수 없을 정도였어요. 그래도 첫 독립 공간이라 애틋한 마음은 있어요.\n\n2년 전에 이사했는데, 이유는 두 가지였어요. 통근이 길어진 새 직장, 그리고 그 원룸이 저한테 작아졌다는 것. 예전 집과 비교하면 지금 집은 다른 세계예요. 진짜 침실, 요리 취미를 위한 진짜 주방, 그 눈부신 남향 햇살까지요. 예전 원룸은 버티는 법을, 이 집은 사는 걸 즐기는 법을 가르쳐 줬어요. 그게 가장 큰 차이예요.", "struct": [["1️⃣ 도입", "하늘과 땅 차이(night and day)"], ["2️⃣ 과거", "좁은 원룸 · 어두움 · 습기"], ["3️⃣ 애정", "그래도 첫 독립 공간(soft spot)"], ["4️⃣ 이사", "직장 이동 + 공간이 작아짐"], ["5️⃣ 마무리", "생존의 집 → 즐기는 집"]], "expr": [["night and day", "하늘과 땅 차이"], ["studio", "원룸"], ["moving out", "독립"], ["\"cozy,\" and by cozy I mean ~", "'아늑'의 재정의"], ["within arm's reach — not in a good way", "손 닿는 거리(나쁜 의미로)"], ["humidity", "습기"], ["have a soft spot for ~", "~에 애틋한 마음이 있다"], ["outgrow ~", "~이 작아지다(성장해서)"], ["south-facing", "남향의"], ["compared to ~", "~과 비교하면"], ["survive → enjoy living", "생존 → 삶을 즐기기"]], "audio": "audio/1_서베이/1-077 14. 집(Home)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-077 14. 집(Home)_비교.mp3"}, {"id": "1-078", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "묘사", "badge": "78 묘사", "enQ": "Tell me about the neighborhood you live in. What does the area look like, and where is it located? What facilities can be found near your house? Describe your neighborhood in detail.", "enA": "My neighborhood is a quiet residential area in the western part of Seoul — and its best feature, hands down, is that it's only ten minutes from Han River Park. Yes, that park again!\n\nThe area itself is a nice mix of old and new: apartments on the main street, and behind them, alleys full of restaurants and cozy cafes — including \"Moon,\" my go-to cafe. As for facilities, everything is within walking distance: a big supermarket, 24-hour convenience stores, a library, and a small gym.\n\nWhat I love most is the atmosphere: lively during the day, but it calms right down at night — no loud bars, just people walking their dogs. It's the kind of neighborhood where the bakery owner remembers your order — nothing flashy, but everything I need.", "koQ": "당신이 사는 동네에 대해 말해주세요. 그 지역은 어떤 모습이고, 어디에 위치해 있나요? 집 근처에는 어떤 시설들이 있나요? 당신의 동네를 자세히 묘사해주세요.", "koA": "저희 동네는 서울 서쪽의 조용한 주거 지역이에요. 최고의 장점은 두말할 것 없이 한강공원까지 10분밖에 안 걸린다는 거죠. 네, 또 그 공원이요!\n\n동네 자체는 옛것과 새것이 잘 섞여 있어요. 큰길에는 아파트가 있고, 그 뒤로는 식당과 아늑한 카페들로 가득한 골목들이 있어요. 제 단골 카페 '문(Moon)'도 거기 있고요. 시설은 걸어갈 수 있는 거리에 다 있어요. 큰 마트, 24시간 편의점, 도서관, 작은 헬스장까지요.\n\n제가 가장 좋아하는 건 분위기예요. 낮에는 활기차다가 밤이 되면 금세 차분해져요. 시끄러운 술집 없이, 강아지 산책시키는 사람들뿐이죠. 빵집 사장님이 단골 메뉴를 기억해 주는, 그런 동네예요. 화려하진 않지만 필요한 건 다 있어요.", "struct": [["1️⃣ 도입", "서울 서쪽 · 한강공원 10분!"], ["2️⃣ 모습", "큰길 아파트 + 문(Moon) 골목"], ["3️⃣ 시설", "마트 · 편의점 · 도서관 · 헬스장"], ["4️⃣ 분위기", "낮엔 활기 · 밤엔 차분"], ["5️⃣ 마무리", "빵집 사장님 디테일 + 정리"]], "expr": [["residential area", "주거 지역"], ["hands down", "두말할 것 없이"], ["a mix of old and new", "옛것과 새것의 조화"], ["facilities", "시설들"], ["within walking distance", "걸어갈 수 있는 거리에"], ["24-hour convenience store", "24시간 편의점"], ["calm right down", "금세 차분해지다"], ["people walking their dogs", "강아지 산책시키는 사람들"], ["the kind of neighborhood where ~", "~한 그런 동네"], ["nothing flashy", "화려하진 않은"], ["everything I need", "필요한 건 다 있는"]], "audio": "audio/1_서베이/1-078 15. 동네_이웃(Neighbors)_묘사1.mp3", "label": "묘사 1", "qaudio": "audio_q/1_서베이/1-078 15. 동네_이웃(Neighbors)_묘사1.mp3"}, {"id": "1-079", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "묘사", "badge": "79 묘사", "enQ": "Describe your neighbors for me. What kind of people are they, and how close are you to them? What do you usually do when you run into them?", "enA": "My neighbors? I'm lucky — they're genuinely nice people. Next door, there's a retired elderly couple. The grandmother is basically the guardian angel of our floor: she sometimes shares her homemade side dishes with me, and honestly, her kimchi is on another level!\n\nAcross the hall, there's a woman around my age with the world's friendliest dog. We're not super close — this is Korea, after all, where apartment neighbors keep a polite distance — but we're definitely on good terms.\n\nWhen I run into them, it's usually in the elevator. With the elderly couple, I bow and we exchange a bit of small talk — the weather, how busy I look these days. With the dog owner, I mostly talk to the dog first, then the human! It's not a deep friendship, but those small moments make the building feel like a community rather than just an address. So yeah, those are my neighbors.", "koQ": "당신의 이웃을 묘사해주세요. 그들은 어떤 사람들이고, 당신과 얼마나 친한가요? 그들과 마주쳤을 때 보통 무엇을 하나요?", "koA": "제 이웃들이요? 저는 운이 좋아요. 정말 좋은 분들이거든요. 옆집에는 은퇴하신 노부부가 사세요. 할머니는 사실상 우리 층의 수호천사예요. 가끔 직접 만든 반찬을 나눠 주시는데, 솔직히 할머니 김치는 차원이 달라요!\n\n복도 건너편에는 제 또래 여자분이 세상에서 제일 붙임성 좋은 강아지랑 살아요. 아주 친한 건 아니에요. 여긴 한국이잖아요. 아파트 이웃끼리는 예의 있는 거리를 유지하니까요. 그래도 확실히 좋은 사이예요.\n\n마주치는 건 보통 엘리베이터에서예요. 노부부를 만나면 인사드리고 짧은 스몰토크를 나눠요. 날씨 이야기, 요즘 바빠 보인다는 이야기요. 강아지 주인분을 만나면 대체로 강아지한테 먼저 말을 걸고, 그다음에 사람한테 말해요! 깊은 우정은 아니지만, 그런 작은 순간들이 이 건물을 그냥 주소가 아니라 공동체처럼 느끼게 해 줘요. 네, 이게 제 이웃들이에요.", "struct": [["1️⃣ 도입", "옆집 노부부 · 반찬 나눔"], ["2️⃣ 이웃 2", "또래 + 붙임성 좋은 강아지"], ["3️⃣ 거리감", "예의 있는 거리 · 좋은 사이"], ["4️⃣ 마주칠 때", "엘리베이터 스몰토크"], ["5️⃣ 마무리", "주소가 아닌 공동체 + 정리"]], "expr": [["next door / across the hall", "옆집 / 복도 건너편"], ["elderly couple", "노부부"], ["guardian angel", "수호천사"], ["side dishes", "반찬"], ["on another level", "차원이 다른"], ["polite distance", "예의 있는 거리"], ["on good terms", "좋은 사이인"], ["run into ~", "~와 우연히 마주치다"], ["small talk", "가벼운 대화"], ["talk to the dog first", "강아지한테 먼저 말 걸기"], ["a community rather than just an address", "주소가 아닌 공동체"]], "audio": "audio/1_서베이/1-079 15. 동네_이웃(Neighbors)_묘사2.mp3", "label": "묘사 2", "qaudio": "audio_q/1_서베이/1-079 15. 동네_이웃(Neighbors)_묘사2.mp3"}, {"id": "1-080", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "습관", "badge": "80 습관", "enQ": "What do you usually do in your neighborhood? Where do you often go, and what activities do you do around your area? Describe your typical routine in your neighborhood.", "enA": "Honestly, my whole life happens in my neighborhood, so let me walk you through a typical weekend there — that's when I really make the rounds.\n\nSaturday morning starts at the big supermarket — groceries for the week, always with a list, because without one, I come home with snacks and no actual food! On the way back, I stop by \"Moon,\" my go-to cafe, for an iced americano and an hour of people-watching. That part is non-negotiable.\n\nIn the evening, I walk to Han River Park for my usual riverside stroll — you know that part already! On weekdays, my radius is smaller: the convenience store, the gym twice a week, and the library to return books I actually finished... or mostly finished. So yeah, supermarket, cafe, park, repeat — that's pretty much my neighborhood routine, and it never gets old.", "koQ": "동네에서 주로 무엇을 하나요? 어디에 자주 가고, 동네 주변에서 어떤 활동을 하나요? 동네에서의 일반적인 일과를 설명해주세요.", "koA": "솔직히 제 삶 전체가 동네 안에서 일어나요. 그러니까 동네를 제대로 순회하는 주말 하루를 차근차근 말씀드릴게요.\n\n토요일 아침은 큰 마트에서 시작해요. 일주일 치 장을 보는데, 항상 목록을 들고 가요. 없으면 과자만 잔뜩 사 오고 정작 밥거리는 안 사 오거든요! 돌아오는 길에는 단골 카페 '문(Moon)'에 들러서 아이스 아메리카노를 마시며 한 시간쯤 사람 구경을 해요. 이건 협상 불가예요.\n\n저녁에는 한강공원까지 걸어가서 늘 하던 강변 산책을 해요. 이건 이미 아시는 부분이죠! 평일에는 반경이 더 좁아요. 편의점, 주 2회 헬스장, 그리고 다 읽은… 거의 다 읽은 책을 반납하러 도서관에 가요. 네, 마트, 카페, 공원, 반복. 이게 제 동네 루틴인데, 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "삶 전체가 동네 안! 주말 순회"], ["2️⃣ 아침", "마트 장보기(목록 필수!)"], ["3️⃣ 낮", "문(Moon) · 사람 구경 1시간"], ["4️⃣ 저녁", "한강공원 강변 산책"], ["5️⃣ 마무리", "평일 반경 + 반복해도 안 질림"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["make the rounds", "순회하다, 쭉 돌다"], ["groceries", "장보기, 식료품"], ["snacks and no actual food", "과자만 사고 밥거리는 없음"], ["stop by ~", "~에 잠깐 들르다"], ["non-negotiable", "협상 불가"], ["riverside stroll", "강변 산책"], ["you know that part already", "이미 아시는 부분이죠"], ["radius", "(활동) 반경"], ["or mostly finished", "거의 다 읽은"], ["it never gets old", "아무리 해도 질리지 않는다"]], "audio": "audio/1_서베이/1-080 15. 동네_이웃(Neighbors)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-080 15. 동네_이웃(Neighbors)_습관.mp3"}, {"id": "1-081", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "취향", "badge": "81 취향", "enQ": "What is your favorite place in your neighborhood, and why do you like it? What do you usually do there? Tell me what makes that spot special to you.", "enA": "You can probably guess this one — my favorite spot in the neighborhood is that little cafe called \"Moon.\" I've mentioned it before, but let me tell you why it wins, out of every place around here.\n\nSure, the cozy vibe and the coffee matter. But what really makes it special is that it's my third place — you know, not home, not work, but that third space where you can just breathe. When I'm there, nobody needs anything from me. I read, I people-watch, sometimes I just stare out the window doing absolutely nothing.\n\nAnd there's the owner, of course. After years of visits, she knows my order, my usual seat, even my mood — she can tell when I've had a rough week and quietly gives me an extra cookie. Honestly, where else can you get that? When it comes to my neighborhood, nothing beats that little corner of it. That's my taste in a nutshell.", "koQ": "동네에서 가장 좋아하는 장소는 어디이고, 왜 좋아하나요? 그곳에서 주로 무엇을 하나요? 무엇이 그곳을 특별하게 만드는지 말해주세요.", "koA": "이건 아마 짐작하실 거예요. 동네에서 제가 가장 좋아하는 곳은 '문(Moon)'이라는 그 작은 카페예요. 전에 언급했지만, 동네의 모든 장소 중에서 왜 그곳이 우승인지 말씀드릴게요.\n\n물론 아늑한 분위기와 커피도 중요해요. 하지만 진짜 특별한 이유는 그곳이 저의 '제3의 공간'이라는 거예요. 집도 아니고 회사도 아닌, 그냥 숨 쉴 수 있는 세 번째 공간이요. 거기 있으면 아무도 저한테 뭘 요구하지 않아요. 책을 읽고, 사람 구경을 하고, 가끔은 그냥 창밖만 바라보면서 아무것도 안 해요.\n\n그리고 당연히 사장님이 있죠. 몇 년을 다녔더니 제 메뉴, 제 단골 자리, 심지어 제 기분까지 아세요. 힘든 한 주를 보낸 게 보이면 조용히 쿠키 하나를 더 주시거든요. 솔직히 이런 걸 어디서 받을 수 있겠어요? 우리 동네에 관해서라면, 그 작은 구석만 한 곳이 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "짐작 가능! = 문(Moon)"], ["2️⃣ 개념", "제3의 공간(third place)"], ["3️⃣ 하는 일", "독서 · 사람 구경 · 멍때리기"], ["4️⃣ 특별함", "사장님의 쿠키(기분까지 아심)"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "expr": [["You can probably guess", "아마 짐작하실 거예요"], ["why it wins", "왜 그곳이 우승인지"], ["cozy vibe", "아늑한 분위기"], ["what really makes it special", "진짜 특별한 이유는"], ["third place", "제3의 공간"], ["just breathe", "그냥 숨 쉬다"], ["stare out the window", "창밖을 바라보다"], ["she can tell when ~", "~인 걸 알아차리신다"], ["an extra cookie", "쿠키 하나 더"], ["Where else can you get that?", "이런 걸 어디서 받겠어요?"], ["in a nutshell", "한마디로 요약하면"]], "audio": "audio/1_서베이/1-081 15. 동네_이웃(Neighbors)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-081 15. 동네_이웃(Neighbors)_취향.mp3"}, {"id": "1-082", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "과거 경험", "badge": "82 과거 경험", "enQ": "Tell me about something interesting or memorable that happened in your neighborhood. When and where did it take place, and why do you still remember it?", "enA": "Oh, this reminds me of a snowy morning two winters ago. We had the heaviest snowfall in years overnight — the whole neighborhood woke up buried in white, and cars couldn't even get out of the parking lot.\n\nThen something interesting happened. One by one, neighbors came out with shovels — people who had never said more than \"hello\" in the elevator. Before we knew it, about a dozen of us were clearing the paths together: the elderly couple directing traffic like generals, the dog running around supervising everyone, kids building a snowman with the leftover snow.\n\nThe best part? Afterward, the grandmother next door invited a few of us over for hot tea and rice cakes. We stood in the hallway chatting like old friends. It's memorable because that morning, our building actually felt like a village. Since then, we all greet each other by name, not just with a nod. Funny how it took a snowstorm to make that happen, right?", "koQ": "동네에서 있었던 흥미롭거나 기억에 남는 일에 대해 말해주세요. 언제 어디서 일어났고, 왜 아직도 그것을 기억하나요?", "koA": "아, 두 해 전 겨울의 눈 오는 아침이 생각나네요. 밤사이 몇 년 만의 기록적인 폭설이 내렸어요. 동네 전체가 하얗게 파묻힌 채 아침을 맞았고, 주차장에서는 차도 못 빠져나갈 정도였죠.\n\n그때 흥미로운 일이 벌어졌어요. 이웃들이 하나둘 삽을 들고 나온 거예요. 엘리베이터에서 '안녕하세요' 이상을 나눠 본 적 없는 사람들이요. 어느새 열댓 명이 함께 길을 치우고 있었어요. 노부부는 장군처럼 교통정리를 하시고, 그 강아지는 뛰어다니며 모두를 감독하고, 아이들은 남은 눈으로 눈사람을 만들고요.\n\n제일 좋았던 부분이요? 끝나고 나서 옆집 할머니가 우리 몇 명을 집으로 불러 따뜻한 차와 떡을 주셨어요. 우리는 복도에 서서 오랜 친구처럼 수다를 떨었죠. 그날 아침 우리 건물이 진짜 마을처럼 느껴졌기 때문에 기억에 남아요. 그 후로 우리는 서로 고개만 까딱하는 게 아니라 이름을 부르며 인사해요. 그렇게 되는 데 폭설이 필요했다는 게 재밌죠?", "struct": [["1️⃣ 도입", "몇 년 만의 폭설 아침"], ["2️⃣ 사건", "삽 들고 나온 이웃들"], ["3️⃣ 장면", "장군 노부부 · 감독 강아지"], ["4️⃣ 온기", "할머니의 차와 떡 초대"], ["5️⃣ 마무리", "건물 = 마을 + 이름 부르는 사이"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["the heaviest snowfall in years", "몇 년 만의 기록적 폭설"], ["buried in white", "하얗게 파묻힌"], ["one by one", "하나둘씩"], ["Before we knew it", "어느새"], ["clear the paths", "길을 치우다"], ["like generals / supervising", "장군처럼 / 감독하며"], ["invite ~ over", "~을 집에 초대하다"], ["felt like a village", "마을처럼 느껴졌다"], ["greet each other by name", "이름을 부르며 인사하다"], ["Funny how ~, right?", "~라는 게 재밌죠?"]], "audio": "audio/1_서베이/1-082 15. 동네_이웃(Neighbors)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-082 15. 동네_이웃(Neighbors)_과거 경험.mp3"}, {"id": "1-083", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "비교", "badge": "83 비교", "enQ": "How has your neighborhood changed or developed over the last ten years? What did it use to be like, and how does it look now? Tell me about the changes in detail.", "enA": "My neighborhood has changed a lot over the last ten years. Back then, this area was much older and quieter. The alleys used to be full of little family businesses: a tailor shop, an old stationery store, a video rental place.\n\nMost buildings were low, two or three stories, and to be honest, the area felt a bit left behind compared to the trendier parts of Seoul.\n\nThese days, it's totally transformed. Young cafe owners turned old houses into stylish cafes — that's how my beloved \"Moon\" was born! New apartments went up, the riverside park got a makeover, and our quiet area now makes \"hidden gem\" lists. Compared to ten years ago, it's brighter and more fun — though I have to admit, I miss that stationery store and my childhood treasures. Change always costs a little something.", "koQ": "지난 10년 동안 당신의 동네는 어떻게 변하고 발전했나요? 예전에는 어떤 모습이었고, 지금은 어떤가요? 그 변화에 대해 자세히 말해주세요.", "koA": "저희 동네는 지난 10년간 정말 많이 변했어요. 그때 이 동네는 훨씬 오래되고 조용했어요. 골목마다 작은 가족 가게들이 가득했죠. 양복점, 오래된 문방구, 비디오 대여점이요.\n\n건물들은 대부분 2~3층으로 낮았고, 솔직히 서울의 트렌디한 동네들에 비해 좀 뒤처진 느낌이었어요.\n\n요즘은 완전히 탈바꿈했어요. 젊은 카페 사장님들이 낡은 집들을 세련된 카페로 바꿨죠. 제가 아끼는 '문(Moon)'도 그렇게 태어났어요! 새 아파트들이 올라갔고, 강변 공원은 새 단장을 했고, 우리 조용한 동네가 이제 '숨은 명소' 리스트에 등장해요. 10년 전과 비교하면 더 밝고 더 재밌어요. 그래도 인정할게요, 그 문방구와 어린 시절 보물들이 그리워요. 변화에는 늘 작은 대가가 따르니까요.", "struct": [["1️⃣ 도입", "10년의 변화 관찰기"], ["2️⃣ 과거", "수선집 · 문방구 · 비디오 가게"], ["3️⃣ 과거", "낮은 건물 · 뒤처진 느낌"], ["4️⃣ 현재", "카페 골목(문(Moon) 탄생!) · 새 단장"], ["5️⃣ 마무리", "더 재밌지만, 문방구 그리움"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["family businesses", "가족 가게들"], ["video rental place", "비디오 대여점"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["left behind", "뒤처진"], ["transformed", "탈바꿈한"], ["makeover", "새 단장, 리모델링"], ["hidden gem", "숨은 명소"], ["I have to admit", "인정할게요"], ["childhood treasures", "어린 시절 보물들"], ["Change always costs a little something", "변화엔 작은 대가가 따른다"]], "audio": "audio/1_서베이/1-083 15. 동네_이웃(Neighbors)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-083 15. 동네_이웃(Neighbors)_비교.mp3"}, {"id": "2-001", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "묘사", "badge": "01 묘사", "enQ": "Tell me about the banks. What do they look like? Where are they located?", "enA": "Banks in Korea? Okay, that's actually an easy one, because I stop by my bank pretty often. Banks are literally everywhere in Korea — you can find major banks like KB or Shinhan on almost every corner. They're usually near subway stations, so they're super easy to get to. In my neighborhood alone, there are three or four branches within walking distance.\n\nWhen it comes to how they look, banks are pretty easy to spot. Most sit on the first floor, with big signs in the bank's colors. For example, KB uses yellow, so you can recognize it from a distance. Also, there's an ATM zone at the entrance, open 24/7.\n\nOnce you walk in, you take a number and wait for your turn. The tellers help with opening accounts or transferring money. To be honest, these days most people bank on their smartphones, so branches are much less crowded than they used to be. So yeah, that's pretty much what banks are like in Korea.", "koQ": "당신 나라의 은행에 대해 말해 주세요. 은행은 보통 어떻게 생겼고, 주로 어디에 위치해 있나요?", "koA": "한국의 은행이요? 아, 마침 쉬운 질문이네요. 제가 은행에 꽤 자주 들르거든요. 우선, 한국에는 은행이 말 그대로 어디에나 있어서 KB나 신한 같은 주요 은행을 거의 골목마다 찾을 수 있어요. 보통 지하철역 근처에 있어서 접근성이 정말 좋고요. 저희 동네만 해도 걸어갈 수 있는 거리에 지점이 서너 개나 있어요.\n\n생김새에 관해서라면, 은행은 눈에 잘 띄는 편이에요. 대부분 건물 1층에 있고, 은행 상징색이 들어간 큰 간판이 있죠. 예를 들어 KB는 노란색이라 멀리서도 바로 알아볼 수 있어요. 그리고 보통 입구에 24시간 운영되는 ATM 코너가 있어요.\n\n안으로 들어가면 번호표를 뽑고 차례를 기다려요. 은행원들은 계좌 개설이나 송금 같은 업무를 도와주죠. 그런데 솔직히 요즘은 대부분 스마트폰으로 은행 업무를 봐서, 지점이 예전보다 훨씬 한산해졌어요. 네, 한국의 은행은 대체로 이런 모습이에요.", "struct": [["1️⃣ 도입", "가벼운 리액션 (Banks in Korea?...)"], ["2️⃣ 위치", "어디에나 · 역 근처 · 우리 동네"], ["3️⃣ 외관", "1층 · 로고 색 간판 (KB 노랑)"], ["4️⃣ 내부", "번호표 · 계좌 개설 · 송금"], ["5️⃣ 마무리", "모바일 뱅킹 트렌드 + 정리 멘트"]], "expr": [["That's actually an easy one", "마침 쉬운 질문이네요"], ["stop by ~", "~에 잠깐 들르다"], ["literally everywhere", "말 그대로 어디에나"], ["on almost every corner", "거의 골목마다"], ["super easy to get to", "찾아가기 아주 쉬운"], ["within walking distance", "걸어갈 수 있는 거리에"], ["When it comes to ~", "~에 관해서라면"], ["easy to spot", "눈에 잘 띄는"], ["recognize ~ from a distance", "멀리서도 ~을 알아보다"], ["open 24/7", "24시간 연중무휴"], ["take a number & wait for my turn", "번호표 뽑고 기다리다"]], "audio": "audio/2_돌발/2-001 1. 은행(Bank)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-001 1. 은행(Bank)_묘사.mp3"}, {"id": "2-002", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "습관", "badge": "02 습관", "enQ": "What do you do from the moment you walk into the bank until you walk out? Tell me everything that goes on when you visit the bank.", "enA": "Okay, so let me walk you through what I usually do at the bank. Like I said, I stop by my bank pretty often, since it's within walking distance from my place. The first thing I do is use the ATM zone at the entrance — you know, it's open 24/7, so if I just need to withdraw some cash, I'm in and out in a minute.\n\nBut if I need to talk to a teller, I walk in, take a number, and wait for my turn in the waiting area. While I'm waiting, I usually kill time on my phone. When my number comes up on the screen, I go to the counter and take care of my business — usually something like transferring money or updating my bankbook.\n\nBefore I leave, I always double-check the receipt to make sure everything went through correctly. So yeah, that's pretty much my routine whenever I visit the bank.", "koQ": "은행에 들어서는 순간부터 나올 때까지 무엇을 하나요? 은행에 갈 때 일어나는 모든 일을 이야기해 주세요.", "koA": "네, 제가 은행에서 보통 뭘 하는지 차근차근 말씀드릴게요. 말씀드렸듯이 저는 은행에 꽤 자주 들르는데, 집에서 걸어갈 수 있는 거리에 있거든요. 가장 먼저 하는 일은 입구에 있는 ATM 코너를 이용하는 거예요. 24시간 운영돼서 현금만 뽑으면 될 때는 1분 만에 나올 수 있어요.\n\n하지만 창구 직원과 상담해야 할 때는 안으로 들어가서 번호표를 뽑고 대기 공간에서 차례를 기다려요. 기다리는 동안에는 보통 폰을 보면서 시간을 보내고요. 화면에 제 번호가 뜨면 창구로 가서 송금이나 통장 정리 같은 볼일을 봐요.\n\n나가기 전에는 항상 영수증을 다시 확인해서 제대로 처리됐는지 점검해요. 네, 이게 제가 은행에 갈 때마다 하는 루틴이에요.", "struct": [["1️⃣ 도입", "루틴 예고 멘트 (walk you through)"], ["2️⃣ 입장", "ATM 코너 이용 · 24시간"], ["3️⃣ 창구", "번호표 · 대기 중 폰 보기"], ["4️⃣ 업무", "송금 · 통장 정리"], ["5️⃣ 마무리", "영수증 확인 + 정리 멘트"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["stop by ~", "~에 잠깐 들르다"], ["within walking distance", "걸어갈 수 있는 거리에"], ["be in and out in a minute", "금방 볼일만 보고 나오다"], ["take a number & wait for my turn", "번호표 뽑고 기다리다"], ["kill time on my phone", "폰을 보며 시간을 때우다"], ["When my number comes up", "내 번호가 뜨면"], ["take care of my business", "볼일을 보다"], ["update my bankbook", "통장 정리를 하다"], ["double-check", "다시 한번 확인하다"], ["that's pretty much my routine", "이게 제 루틴의 전부예요"]], "audio": "audio/2_돌발/2-002 1. 은행(Bank)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-002 1. 은행(Bank)_습관.mp3"}, {"id": "2-003", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "취향", "badge": "03 취향", "enQ": "Do you prefer visiting a bank in person or using online banking? Why do you like that way of banking better? Tell me the reasons in detail.", "enA": "Oh, if I had to choose, it's online banking, no contest. For me, it's all about convenience: I can send money, check my balance, even open a savings account — all from my couch, in my pajamas.\n\nI'd pick the app over waiting in line any day. Think about it: branches close at four, but the app works at midnight, on weekends, even on holidays. Don't get me wrong — for big things like loans, I still visit a branch, because talking to a real person face to face just feels safer.\n\nBut for everything else? Nothing beats transferring money in ten seconds while lying on my sofa. In a nutshell, online banking saves my time and energy, and the branch is my backup for the big decisions.", "koQ": "은행에 직접 가는 것과 온라인 뱅킹 중 무엇을 선호하나요? 왜 그 방식이 더 좋은가요? 그 이유를 자세히 말해주세요.", "koA": "아, 하나를 골라야 한다면 온라인 뱅킹이요. 고민할 것도 없어요. 저한테는 편리함이 전부거든요. 송금, 잔액 확인, 심지어 적금 가입까지 전부 소파에서, 잠옷 차림으로 할 수 있으니까요.\n\n줄 서서 기다리는 것보다는 무조건 앱을 고를 거예요. 생각해 보세요. 지점은 4시에 닫지만, 앱은 자정에도, 주말에도, 심지어 명절에도 되잖아요. 오해는 마세요. 대출 같은 큰일은 여전히 지점에 가요. 실제 사람과 얼굴을 보고 이야기하는 게 더 안심되니까요.\n\n하지만 나머지 전부는요? 소파에 누워서 10초 만에 송금하는 것만 한 게 없죠. 한마디로, 온라인 뱅킹은 시간과 에너지를 아껴 주고, 지점은 큰 결정을 위한 백업인 셈이에요.", "struct": [["1️⃣ 선언", "온라인 뱅킹, no contest"], ["2️⃣ 이유", "소파에서 모든 업무 해결"], ["3️⃣ 대비", "4시 마감 vs 24시간 앱"], ["4️⃣ 예외", "대출 등 큰일은 대면 (안심)"], ["5️⃣ 마무리", "in a nutshell 정리"]], "expr": [["if I had to choose", "굳이 하나를 고르자면"], ["no contest", "고민할 것도 없이"], ["it's all about ~", "핵심은 ~이다"], ["check my balance", "잔액을 확인하다"], ["from my couch", "소파에서"], ["A over B", "B보다 A"], ["any day", "언제든, 두말없이"], ["Don't get me wrong", "오해는 마세요"], ["face to face", "얼굴을 마주하고"], ["Nothing beats ~", "~만 한 게 없다"], ["In a nutshell", "한마디로 정리하면"]], "audio": "audio/2_돌발/2-003 1. 은행(Bank)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-003 1. 은행(Bank)_취향.mp3"}, {"id": "2-004", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "과거 경험", "badge": "04 과거 경험", "enQ": "Sometimes problems can arise when you are at the bank. Tell me in detail about a problem you had that involved your bank. Maybe the bank was closed, or perhaps the bank might have made some kind of mistake. Tell me about how you solved the problem.", "enA": "Oh, this reminds me of something from about a year ago. I stopped by the bank to transfer my rent money, but that day, the line was incredibly long — the waiting area was totally packed. I took a number, and guess what? More than thirty people were ahead of me.\n\nSo I used the ATM zone instead. But in the middle of the transfer, the machine suddenly froze and my card got stuck inside. To be honest, I was a little panicked — the payment was due that day.\n\nLuckily, a teller came over right away, got my card out, and helped me finish the transfer at the counter. Everything worked out fine. Since then, I've been doing most of my banking on my smartphone, just in case. Probably my most memorable bank problem ever!", "koQ": "은행에서 겪었던 문제에 대해 자세히 말해 주세요. 은행이 문을 닫았거나 은행이 실수를 했을 수도 있죠. 그 문제를 어떻게 해결했는지 이야기해 주세요.", "koA": "아, 1년 전쯤 있었던 일이 생각나네요. 월세를 송금하려고 은행에 잠깐 들렀는데, 그날따라 줄이 엄청나게 길었어요. 대기 공간이 사람들로 꽉 차 있었죠. 번호표를 뽑았는데, 세상에, 제 앞에 서른 명이 넘게 있는 거예요.\n\n그래서 대신 ATM을 쓰기로 했어요. 그런데 송금을 하는 도중에 기계가 갑자기 멈추더니 카드가 안에 껴 버렸어요. 그날까지 꼭 보내야 하는 돈이라서 솔직히 좀 당황스러웠어요.\n\n다행히 은행원 한 분이 바로 와서 카드를 꺼내 주셨고, 창구에서 송금까지 도와주셨어요. 다 잘 해결됐죠. 그 후로는 혹시 몰라서 은행 업무를 대부분 스마트폰으로 하고 있어요. 아마 제가 겪은 가장 기억에 남는 은행 문제일 거예요!", "struct": [["1️⃣ 도입", "회상 시그널 (This reminds me of)"], ["2️⃣ 상황", "긴 줄 · 꽉 찬 대기 공간"], ["3️⃣ 문제", "ATM 멈춤(froze) · 카드 걸림"], ["4️⃣ 해결", "은행원 도움 (right away)"], ["5️⃣ 마무리", "해결 + 변화(Since then...)"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["stopped by the bank", "은행에 잠깐 들렀다"], ["totally packed", "사람들로 꽉 찬"], ["guess what?", "그런데 있잖아요?"], ["in the middle of ~", "~하는 도중에"], ["froze / got stuck", "(기계가) 멈췄다 / 껴 버렸다"], ["to be honest", "솔직히 말하면"], ["a little panicked", "살짝 당황한"], ["came over right away", "바로 다가왔다"], ["everything worked out fine", "결국 다 잘 해결됐다"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다"]], "audio": "audio/2_돌발/2-004 1. 은행(Bank)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-004 1. 은행(Bank)_과거 경험.mp3"}, {"id": "2-005", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "비교", "badge": "05 비교", "enQ": "Banks have definitely changed over time. Tell me about a bank you remember from your childhood. What did the bank look like? How was it different from banks today?", "enA": "Banks have changed a lot, actually. When I was little, I used to go to the bank with my mom, and I remember it was always totally packed. People had to take a number and wait forever — sometimes more than half an hour — and the tellers were busy stamping bankbooks by hand.\n\nBack then, everything was done on paper. There were no smart machines, just one or two old ATMs, and if you wanted to transfer money, you had no choice but to visit a branch in person.\n\nThese days, though, it's a completely different story. Branches are much less crowded than they used to be, because most people do their banking on their smartphones. Banks themselves have gotten smaller and more modern, with digital kiosks instead of long counters. So yeah, compared to the banks of my childhood, banks today are faster, quieter, and way more convenient.", "koQ": "은행은 시간이 지나며 확실히 변했죠. 어린 시절 기억나는 은행에 대해 말해 주세요. 그 은행은 어떻게 생겼었나요? 오늘날의 은행과는 어떻게 달랐나요?", "koA": "은행은 정말 많이 변했어요. 어릴 때 엄마를 따라 은행에 가곤 했는데, 항상 사람들로 꽉 차 있었던 게 기억나요. 다들 번호표를 뽑고 한참을 기다려야 했어요. 어떨 땐 30분도 넘게요. 은행원들은 손으로 통장을 찍어 주느라 정신이 없었죠.\n\n그때는 모든 게 종이로 처리됐어요. 스마트 기기는 없었고 낡은 ATM이 한두 대뿐이라서, 송금을 하려면 지점에 직접 갈 수밖에 없었어요.\n\n그런데 요즘은 완전히 다른 이야기죠. 대부분 스마트폰으로 은행 업무를 봐서 지점이 예전보다 훨씬 한산해요. 은행 자체도 더 작고 현대적으로 바뀌어서 긴 카운터 대신 디지털 키오스크가 있고요. 네, 어린 시절의 은행과 비교하면 요즘 은행은 더 빠르고, 조용하고, 훨씬 더 편리해요.", "struct": [["1️⃣ 도입", "변화 인정 멘트 (changed a lot)"], ["2️⃣ 과거", "used to + 꽉 찬 지점"], ["3️⃣ 불편", "종이 업무 · 낡은 ATM"], ["4️⃣ 현재", "모바일 뱅킹 · 한산 · 키오스크"], ["5️⃣ 마무리", "비교 + 형용사 3연속"]], "expr": [["used to + 동사원형", "예전엔 ~하곤 했다"], ["I remember -ing", "~했던 게 기억나요"], ["totally packed", "사람들로 꽉 찬"], ["take a number & wait forever", "번호표 뽑고 한참 기다리다"], ["Back then", "그 시절에는"], ["had no choice but to ~", "~할 수밖에 없었다"], ["These days", "요즘에는"], ["it's a completely different story", "완전히 다른 이야기다"], ["much less crowded than they used to be", "예전보다 훨씬 한산한"], ["compared to ~", "~과 비교하면"], ["way more convenient", "훨씬 더 편리한"]], "audio": "audio/2_돌발/2-005 1. 은행(Bank)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-005 1. 은행(Bank)_비교.mp3"}, {"id": "2-006", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "묘사", "badge": "06 묘사", "enQ": "Describe the hotels in your country. What are they like, and where are they usually located? Tell me in detail.", "enA": "Hotels in Korea come in all shapes and sizes. In big cities like Seoul, you'll find everything from five-star luxury hotels with fancy lounges to small business hotels tucked away near subway stations.\n\nLocation-wise, they follow a simple rule: luxury hotels sit in the city center or by the river with amazing night views, business hotels cluster around stations, and resort hotels line the beaches and mountains — Jeju and Gangneung are packed with ocean-view rooms. Prices vary a lot too, so there's something for every budget.\n\nOne thing I love about Korean hotels: the service is famously fast and kind. Also, most of them have amazing breakfast buffets — honestly, half the reason people book them! So yeah, that's pretty much hotels in Korea: something for everyone, wherever you go.", "koQ": "당신의 나라에 있는 호텔들을 묘사해주세요. 그곳들은 어떤 모습이고, 주로 어디에 위치해 있나요? 자세히 말해주세요.", "koA": "한국의 호텔은 정말 각양각색이에요. 서울 같은 대도시에는 화려한 라운지를 갖춘 5성급 럭셔리 호텔부터 지하철역 근처에 숨어 있는 작은 비즈니스호텔까지 다 있어요.\n\n위치로 보면 간단한 규칙이 있어요. 럭셔리 호텔은 도심이나 야경이 멋진 강변에, 비즈니스호텔은 역 주변에 모여 있고, 리조트 호텔은 해변과 산을 따라 늘어서 있죠. 제주와 강릉은 오션뷰 객실로 가득해요. 가격대도 다양해서 어떤 예산에도 맞는 곳이 있어요.\n\n한국 호텔에서 제가 좋아하는 점 하나요. 서비스가 빠르고 친절하기로 유명해요. 그리고 대부분 조식 뷔페가 엄청나요. 솔직히 사람들이 호텔을 예약하는 이유의 절반이죠! 네, 한국 호텔은 대체로 이래요. 어딜 가든 누구에게나 맞는 곳이 있어요.", "struct": [["1️⃣ 도입", "각양각색 (5성급~비즈니스)"], ["2️⃣ 위치", "도심 · 역 주변 · 해변 리조트"], ["3️⃣ 예시", "제주 · 강릉 오션뷰"], ["4️⃣ 특징", "빠른 서비스 + 조식 뷔페"], ["5️⃣ 마무리", "누구에게나 맞는 호텔"]], "expr": [["come in all shapes and sizes", "각양각색이다"], ["five-star luxury hotel", "5성급 럭셔리 호텔"], ["tucked away", "(골목에) 숨어 있는"], ["location-wise", "위치로 말하자면"], ["night view", "야경"], ["ocean-view room", "오션뷰 객실"], ["packed with ~", "~로 가득한"], ["something for every budget", "어떤 예산에도 맞는 것"], ["breakfast buffet", "조식 뷔페"], ["half the reason", "이유의 절반"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/2_돌발/2-006 2. 호텔(Hotel)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-006 2. 호텔(Hotel)_묘사.mp3"}, {"id": "2-007", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "습관", "badge": "07 습관", "enQ": "What do you usually do when you get to a hotel? What steps do you go through from check-in to settling into your room? Tell me everything in order.", "enA": "Oh, I have a whole hotel arrival ritual — let me walk you through it. First, check-in at the front desk: passport or ID, a quick signature, and the magic moment — getting the key card.\n\nThen, the second I enter the room, my golden rule kicks in: curtains first! I throw them open to check the view, because the view sets the mood for the whole stay. After that, I do a quick inspection: testing the bed with a little bounce, checking the bathroom, peeking into the mini fridge.\n\nThen I unpack the essentials, make a cup of the free coffee, and flop onto the bed like a starfish — hands down the best moment of any trip. It never gets old. After that little ritual, the vacation officially begins!", "koQ": "호텔에 도착하면 주로 무엇을 하나요? 체크인부터 방에 짐을 푸는 것까지 어떤 절차를 거치나요? 순서대로 모두 말해주세요.", "koA": "아, 저는 호텔 도착 의식이 완전히 정해져 있어요. 차근차근 설명해 드릴게요. 먼저 프런트에서 체크인이요. 여권이나 신분증, 간단한 서명, 그리고 마법의 순간, 키 카드 받기!\n\n그리고 방에 들어서는 순간 저의 황금률이 발동해요. 커튼부터! 커튼을 활짝 열고 전망을 확인해요. 전망이 숙박 전체의 분위기를 결정하거든요. 그다음엔 빠른 점검을 해요. 침대에 살짝 튕겨 보고, 욕실을 확인하고, 미니 냉장고를 슬쩍 들여다보죠.\n\n그러고 나서 꼭 필요한 것만 짐을 풀고, 무료 커피를 한 잔 내리고, 침대에 불가사리처럼 벌러덩 눕는 거예요. 두말할 것 없이 모든 여행 최고의 순간이죠. 해도 해도 질리지 않아요. 이 작은 의식이 끝나면 휴가가 공식적으로 시작되는 거예요!", "struct": [["1️⃣ 도입", "도착 의식 선언"], ["2️⃣ 절차", "체크인 → 키 카드"], ["3️⃣ 원칙", "커튼 오픈 → 전망 확인"], ["4️⃣ 점검", "침대 · 욕실 · 미니 냉장고"], ["5️⃣ 마무리", "불가사리 눕기 = 휴가 시작"]], "expr": [["arrival ritual", "도착 의식"], ["let me walk you through ~", "~을 차근차근 설명할게요"], ["check in at the front desk", "프런트에서 체크인하다"], ["key card", "키 카드"], ["golden rule", "황금률, 나만의 원칙"], ["throw open the curtains", "커튼을 활짝 열다"], ["set the mood", "분위기를 결정하다"], ["do a quick inspection", "빠르게 점검하다"], ["unpack the essentials", "필수품만 짐을 풀다"], ["flop onto the bed", "침대에 벌러덩 눕다"], ["It never gets old", "봐도 봐도 질리지 않는다"]], "audio": "audio/2_돌발/2-007 2. 호텔(Hotel)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-007 2. 호텔(Hotel)_습관.mp3"}, {"id": "2-008", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "취향", "badge": "08 취향", "enQ": "What kind of hotel do you prefer to stay at, and why? What do you consider the most when choosing a hotel - the location, price, or facilities?", "enA": "If I had to choose, I'm all about comfort-focused hotels — not the fanciest ones, but the ones with an amazing bed and a great breakfast. For me, it's all about how well I sleep and how happy I am at breakfast.\n\nSo between location, price, and facilities? Honestly, I'd pick facilities over location any day. Think about it — the whole point of a hotel is resting, and a stiff bed can ruin an entire trip. Don't get me wrong, I still check the price like crazy and hunt for deals — my shopping instincts never rest!\n\nBut nothing beats waking up on a cloud-like bed and heading straight to a breakfast buffet. Eggs, croissants, and that first coffee with a view — pure happiness. In a nutshell: good sleep and good breakfast first, everything else is a bonus.", "koQ": "어떤 종류의 호텔에 머무는 것을 선호하고, 그 이유는 무엇인가요? 호텔을 고를 때 위치, 가격, 시설 중 무엇을 가장 중요하게 생각하나요?", "koA": "굳이 고르자면 저는 편안함에 집중한 호텔이 좋아요. 제일 화려한 곳이 아니라, 침대가 끝내주고 조식이 훌륭한 곳이요. 저한테는 얼마나 잘 자고, 아침에 얼마나 행복한지가 전부거든요.\n\n그래서 위치, 가격, 시설 중에서요? 솔직히 저는 두말없이 위치보다 시설을 고를 거예요. 생각해 보세요. 호텔의 존재 이유는 쉬는 건데, 딱딱한 침대 하나가 여행 전체를 망칠 수도 있잖아요. 오해는 마세요. 가격도 엄청나게 확인하고 특가도 사냥해요. 제 쇼핑 본능은 쉬는 법이 없거든요!\n\n하지만 구름 같은 침대에서 눈을 떠서 곧장 조식 뷔페로 향하는 것만 한 게 없죠. 계란 요리, 크루아상, 그리고 전망과 함께하는 첫 커피. 순수한 행복이에요. 한마디로 좋은 잠과 좋은 아침이 먼저, 나머지는 전부 보너스예요.", "struct": [["1️⃣ 선언", "편안함 중심 호텔"], ["2️⃣ 선택", "시설 > 위치 (침대!)"], ["3️⃣ 예외", "가격 비교 + 특가 사냥"], ["4️⃣ 절정", "구름 침대 + 조식 뷔페"], ["5️⃣ 마무리", "잠·조식 먼저, 나머지 보너스"]], "expr": [["comfort-focused", "편안함 중심의"], ["If I had to choose", "굳이 하나를 고르자면"], ["it's all about ~", "핵심은 ~이다"], ["A over B any day", "두말없이 B보다 A"], ["the whole point of ~", "~의 존재 이유"], ["stiff bed", "딱딱한 침대"], ["Don't get me wrong", "오해는 마세요"], ["hunt for deals", "특가를 사냥하다"], ["Nothing beats ~", "~만 한 게 없다"], ["cloud-like bed", "구름 같은 침대"], ["In a nutshell", "한마디로 정리하면"]], "audio": "audio/2_돌발/2-008 2. 호텔(Hotel)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-008 2. 호텔(Hotel)_취향.mp3"}, {"id": "2-009", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "과거 경험", "badge": "09 과거 경험", "enQ": "Tell me about the last time you stayed at a hotel. Where was it, and why were you staying there? What did you do during your stay? Tell me the whole story.", "enA": "This reminds me of my best friend's birthday a few months ago. Instead of a regular dinner, we decided to do a hotel staycation in Seoul — you know, celebrating without going far.\n\nWe got a room on a high floor with an amazing city view. We spent the afternoon at the pool, then came back up, ordered chicken and beer — of course — and had our own little party with the night view. And guess what: when the front desk heard it was her birthday, they sent up a small cake, completely out of nowhere. We were so touched!\n\nThe next morning, we ate way too much at the breakfast buffet — zero regrets. Everything about that stay worked out perfectly, and since then, a birthday hotel night has become our little tradition. Honestly, best birthday plan ever.", "koQ": "마지막으로 호텔에 머물렀던 때에 대해 말해주세요. 어디였고, 왜 그곳에 머물렀나요? 머무는 동안 무엇을 했나요? 전체 이야기를 들려주세요.", "koA": "몇 달 전 절친의 생일이 생각나네요. 평범한 저녁 식사 대신, 우리는 서울에서 호텔 스테이케이션을 하기로 했어요. 멀리 가지 않고 기념하는 거죠.\n\n고층의 시티뷰가 끝내주는 방을 잡았어요. 오후엔 수영장에서 놀고, 방으로 올라와서 당연히 치킨과 맥주를 시키고, 야경과 함께 우리만의 작은 파티를 했죠. 그런데 있잖아요. 프런트에서 절친 생일이라는 걸 듣고는, 난데없이 작은 케이크를 올려 보내 준 거예요. 정말 감동했어요!\n\n다음 날 아침엔 조식 뷔페에서 과식했어요. 후회는 없어요. 그 숙박의 모든 게 완벽하게 흘러갔고, 그 후로 생일 호텔 파티는 우리의 작은 전통이 됐어요. 솔직히 역대 최고의 생일 계획이에요.", "struct": [["1️⃣ 도입", "절친 생일 · 호캉스 결정"], ["2️⃣ 낮", "고층 시티뷰 + 수영장"], ["3️⃣ 밤", "치맥 파티 + 깜짝 케이크"], ["4️⃣ 아침", "조식 뷔페 과식 (무후회)"], ["5️⃣ 마무리", "since then + 생일 전통"]], "expr": [["staycation", "스테이케이션, 호캉스"], ["This reminds me of ~", "~이 생각나네요"], ["without going far", "멀리 가지 않고"], ["a room on a high floor", "고층 객실"], ["chicken and beer", "치킨과 맥주, 치맥"], ["guess what", "글쎄, 그런데 있잖아요"], ["out of nowhere", "난데없이, 갑자기"], ["be touched", "감동하다"], ["zero regrets", "후회 제로"], ["work out perfectly", "완벽하게 흘러가다"], ["our little tradition", "우리의 작은 전통"]], "audio": "audio/2_돌발/2-009 2. 호텔(Hotel)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-009 2. 호텔(Hotel)_과거 경험.mp3"}, {"id": "2-010", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "비교", "badge": "10 비교", "enQ": "Compare hotels these days with the ones from the past. How have hotels and their services changed over time? Tell me about the differences.", "enA": "Hotels have changed a lot since I was a kid. Back then, booking a hotel meant calling the front desk directly — my parents used to do exactly that for our family trips, asking about rooms one by one.\n\nRooms were simpler too: a heavy metal key you had to leave at the desk, a small TV, and if you needed anything, you picked up the room phone and waited.\n\nThese days, it's a completely different story. I book a room on an app in minutes — photos, reviews, and price comparisons all in one place. Check-in is done by kiosk in some hotels, the key is a card or even my phone, and room service arrives after a few taps. Compared to the past, hotels are way more convenient and high-tech. Though I have to admit, that heavy room key had its own charm — it felt like holding the trip in your hand.", "koQ": "요즘 호텔과 과거의 호텔을 비교해주세요. 시간이 지나며 호텔과 그 서비스는 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "호텔은 제가 어릴 때에 비해 정말 많이 변했어요. 그때 호텔 예약이란 프런트에 직접 전화하는 거였죠. 저희 부모님이 가족 여행 때 딱 그렇게 하셨어요. 방 있는지 하나하나 물어보면서요.\n\n객실도 더 단순했어요. 나갈 때 프런트에 맡겨야 하는 묵직한 금속 열쇠, 작은 TV. 그리고 뭔가 필요하면 객실 전화를 들고 기다렸죠.\n\n요즘은 완전히 다른 이야기예요. 저는 앱에서 몇 분 만에 방을 예약해요. 사진, 리뷰, 가격 비교까지 전부 한곳에서요. 어떤 호텔은 키오스크로 체크인하고, 열쇠는 카드나 심지어 제 폰이고, 룸서비스는 몇 번 터치하면 와요. 과거와 비교하면 호텔은 훨씬 편리하고 하이테크해졌어요. 그래도 인정할게요. 그 묵직한 열쇠에는 나름의 매력이 있었어요. 여행을 손에 쥐고 있는 느낌이랄까요.", "struct": [["1️⃣ 도입", "많이 변한 호텔"], ["2️⃣ 과거", "전화 예약 · 금속 열쇠"], ["3️⃣ 현재", "앱 예약 · 키오스크 · 폰 키"], ["4️⃣ 대비", "way more 편리 + 하이테크"], ["5️⃣ 마무리", "열쇠의 낭만 한 스푼"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["call the front desk directly", "프런트에 직접 전화하다"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["one by one", "하나하나"], ["heavy metal key", "묵직한 금속 열쇠"], ["room service", "룸서비스"], ["it's a completely different story", "완전히 다른 이야기다"], ["all in one place", "전부 한곳에서"], ["self check-in kiosk", "셀프 체크인 키오스크"], ["compared to ~", "~과 비교하면"], ["have its own charm", "나름의 매력이 있다"]], "audio": "audio/2_돌발/2-010 2. 호텔(Hotel)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-010 2. 호텔(Hotel)_비교.mp3"}, {"id": "2-011", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "묘사", "badge": "11 묘사", "enQ": "Describe your favorite restaurant near your home. What does it look like, and what kind of food does it serve? How often do you eat there?", "enA": "My favorite restaurant is a tiny kimchi-jjigae place tucked away in the alley behind my street — the same alley as my cafe Moon, actually. It only has about six tables, but it's always cozy and spotless.\n\nThe owners are an older couple who have run it for over twenty years. Their menu is short and confident: kimchi stew, grilled fish, and giant rolled omelets. Everything comes with free refills of side dishes, which I love. And yes — the owner remembers my order. I basically don't even need to speak!\n\nI eat there about once a week, usually on Fridays when I don't feel like cooking. It's the kind of place where you walk in stressed and walk out happy. So yeah, that's pretty much my favorite spot: nothing flashy, but full of warmth.", "koQ": "집 근처에서 가장 좋아하는 식당을 묘사해주세요. 어떻게 생겼고, 어떤 음식을 파나요? 얼마나 자주 그곳에서 식사하나요?", "koA": "제가 가장 좋아하는 식당은 저희 집 뒷골목에 숨어 있는 작은 김치찌개집이에요. 사실 제 단골 카페 문(Moon)이 있는 그 골목이요. 테이블이 여섯 개 정도밖에 없지만, 항상 아늑하고 티 없이 깨끗해요.\n\n사장님은 20년 넘게 가게를 운영해 온 노부부세요. 메뉴는 짧고 자신감 넘쳐요. 김치찌개, 생선구이, 왕계란말이. 모든 메뉴에 반찬 무한리필이 되는데, 그게 정말 좋아요. 그리고 네, 사장님이 제 주문을 기억하세요. 사실상 말할 필요도 없어요!\n\n일주일에 한 번 정도 가요. 주로 요리하기 귀찮은 금요일에요. 스트레스받으며 들어가서 행복하게 걸어 나오는, 그런 곳이에요. 네, 제 최애 식당은 대체로 이래요. 화려하진 않지만 따뜻함이 가득한 곳이요.", "struct": [["1️⃣ 도입", "뒷골목 김치찌개집 (문(Moon) 골목!)"], ["2️⃣ 외관", "테이블 6개 · 아늑 · 깨끗"], ["3️⃣ 메뉴", "찌개 · 생선구이 · 왕계란말이"], ["4️⃣ 빈도", "주 1회 · 요리 귀찮은 금요일"], ["5️⃣ 마무리", "화려함 대신 따뜻함"]], "expr": [["tucked away", "(골목에) 숨어 있는"], ["cozy", "아늑한"], ["spotless", "티 없이 깨끗한"], ["run by an older couple", "노부부가 운영하는"], ["short and confident", "짧고 자신감 있는"], ["free refills", "무한리필"], ["remember my order", "내 주문을 기억하다"], ["once a week", "일주일에 한 번"], ["the kind of place where ~", "~한 그런 곳"], ["nothing flashy", "화려하진 않은"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/2_돌발/2-011 3. 식당(Restaurant)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-011 3. 식당(Restaurant)_묘사.mp3"}, {"id": "2-012", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "습관", "badge": "12 습관", "enQ": "How often do you eat out, and who do you usually go with? What do you normally do at a restaurant, from ordering to paying? Describe your routine.", "enA": "I eat out once or twice a week, usually with my best friend or my little brother. We have a whole restaurant routine, so let me walk you through it.\n\nFirst, ordering: these days it's mostly a tablet on the table, so we tap through the menu together. My golden rule: never order the same dish. We always pick different ones and share, so we get to taste twice as much! While we wait, we play a silly game: guessing which table gets their food first.\n\nAfter eating, we split the bill with a quick app transfer — my banking app doing its job! Then we usually wrap up with iced americanos nearby. Dinner first, coffee after — same reward formula as always. Simple routine, but it never gets old.", "koQ": "얼마나 자주 외식을 하고, 주로 누구와 함께 가나요? 식당에서 주문부터 계산까지 보통 무엇을 하나요? 당신의 루틴을 설명해주세요.", "koA": "저는 일주일에 한두 번 외식해요. 주로 절친이나 남동생과 함께요. 완전히 정해진 식당 루틴이 있는데, 차근차근 설명해 드릴게요.\n\n먼저 주문이요. 요즘은 대부분 테이블 위 태블릿이라, 같이 메뉴를 눌러 봐요. 저의 황금률은 절대 같은 메뉴를 시키지 않는 거예요. 항상 다른 걸 골라서 나눠 먹어요. 그러면 두 배로 맛볼 수 있으니까요! 기다리는 동안엔 실없는 게임을 해요. 어느 테이블 음식이 먼저 나올지 맞히기요.\n\n다 먹고 나면 앱 송금으로 더치페이를 해요. 제 은행 앱이 제 몫을 하는 거죠! 그러고는 근처에서 아이스 아메리카노로 마무리해요. 저녁 먼저, 커피는 나중에. 늘 같은 보상 공식이에요. 단순한 루틴이지만 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "주 1~2회 · 절친/남동생"], ["2️⃣ 주문", "태블릿 + 다른 메뉴 공유 원칙"], ["3️⃣ 대기", "음식 먼저 나오나 맞히기 게임"], ["4️⃣ 계산", "앱 송금 더치페이 (은행 연결)"], ["5️⃣ 마무리", "저녁 → 아아 보상 공식"]], "expr": [["once or twice a week", "일주일에 한두 번"], ["let me walk you through ~", "~을 차근차근 설명할게요"], ["golden rule", "황금률, 나만의 원칙"], ["share", "나눠 먹다"], ["twice as much", "두 배로 많이"], ["a silly game", "실없는 게임"], ["split the bill", "나눠 내다, 더치페이하다"], ["app transfer", "앱 송금"], ["wrap up with ~", "~로 마무리하다"], ["dinner first, coffee after", "저녁 먼저, 커피는 나중에"], ["it never gets old", "아무리 해도 질리지 않아요"]], "audio": "audio/2_돌발/2-012 3. 식당(Restaurant)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-012 3. 식당(Restaurant)_습관.mp3"}, {"id": "2-013", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "취향", "badge": "13 취향", "enQ": "What is your favorite dish at the restaurant you often go to? Why do you like that food? Tell me about it in as much detail as you can.", "enA": "If I had to choose, it's the kimchi-jjigae, no contest. For me, it's all about the broth: deep, spicy, just sour enough, simmered with big chunks of pork.\n\nI'd pick it over any fancy pasta any day. Don't get me wrong — I enjoy trying new food too. But when I'm tired or stressed, my brain just autocompletes to that stew. Fun fact: I'm a kimchi person through and through. My own signature dish at home is kimchi fried rice, so you could say this stew is the pro version of my cooking!\n\nNothing beats that first spoonful on a cold day — it warms you from the inside out. In a nutshell: one bowl, zero disappointment, one hundred percent comfort.", "koQ": "자주 가는 식당에서 가장 좋아하는 메뉴는 무엇인가요? 왜 그 음식을 좋아하나요? 가능한 자세히 말해주세요.", "koA": "굳이 고르자면 김치찌개요. 고민할 것도 없어요. 저한테는 국물이 전부거든요. 깊고, 얼큰하고, 딱 적당히 새콤하고, 큼직한 돼지고기가 들어가 있죠.\n\n화려한 파스타보다는 두말없이 김치찌개를 고를 거예요. 오해는 마세요. 저도 새로운 음식 도전을 좋아해요. 하지만 피곤하거나 스트레스받을 때면 머릿속에 자동 완성처럼 그 찌개가 떠올라요. 재밌는 사실 하나요. 저는 뼛속까지 김치인간이에요. 제 시그니처 집밥 요리가 김치볶음밥이니까, 이 찌개는 제 요리의 프로 버전인 셈이죠!\n\n추운 날 그 첫술만 한 게 없어요. 속부터 따뜻하게 데워 주거든요. 한마디로 한 그릇에 실망 제로, 위로 100%예요.", "struct": [["1️⃣ 선언", "김치찌개, no contest"], ["2️⃣ 이유", "국물: 깊고 얼큰, 새콤"], ["3️⃣ 예외", "새 음식도 OK, 지친 날은 찌개"], ["4️⃣ 연결", "김치볶음밥 = 내 요리 (요리 편)"], ["5️⃣ 마무리", "첫술 + 실망 제로 정리"]], "expr": [["If I had to choose", "굳이 하나를 고르자면"], ["no contest", "고민할 것도 없이"], ["it's all about the broth", "핵심은 국물이다"], ["just sour enough", "딱 적당히 새콤한"], ["A over B any day", "두말없이 B보다 A"], ["Don't get me wrong", "오해는 마세요"], ["through and through", "뼛속까지, 완전히"], ["signature dish", "시그니처 요리"], ["Nothing beats ~", "~만 한 게 없다"], ["warm you from the inside out", "속부터 데워 주다"], ["In a nutshell", "한마디로 정리하면"]], "audio": "audio/2_돌발/2-013 3. 식당(Restaurant)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-013 3. 식당(Restaurant)_취향.mp3"}, {"id": "2-014", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "과거 경험", "badge": "14 과거 경험", "enQ": "Tell me about the last time you ate out. Where did you go, who were you with, and what did you order? Describe what happened that day in detail.", "enA": "This reminds me of last Saturday. My little brother suddenly showed up at my place — fridge raid, as usual — so we decided to just go out and eat at my favorite kimchi-jjigae place instead.\n\nWe ordered the stew and a giant rolled omelet, our usual combo. Then, guess what: the owner brought us a plate of freshly grilled fish, completely out of nowhere — service, she said, because we looked hungry. In Korea, service means free food — the most beautiful word in any restaurant!\n\nWe ate until we couldn't move. Zero regrets, obviously. My brother even promised to do my dishes to say thanks... and then fell asleep on my sofa instead. Everything worked out deliciously, and since then, he asks for that place every single visit.", "koQ": "마지막으로 외식했던 때에 대해 말해주세요. 어디에 갔고, 누구와 함께였으며, 무엇을 주문했나요? 그날 있었던 일을 자세히 묘사해주세요.", "koA": "지난 토요일이 생각나네요. 남동생이 갑자기 저희 집에 나타났어요. 늘 그렇듯 냉장고 습격이었죠. 그래서 그냥 나가서 제 최애 김치찌개집에서 먹기로 했어요.\n\n찌개랑 왕계란말이를 시켰어요. 우리의 늘 먹던 조합이죠. 그런데 있잖아요. 사장님이 갓 구운 생선구이 한 접시를 들고 오신 거예요. 완전히 난데없이요. 우리가 배고파 보였다며 서비스래요. 한국에서 서비스는 공짜 음식이라는 뜻이잖아요. 모든 식당에서 가장 아름다운 단어죠!\n\n우리는 움직일 수 없을 때까지 먹었어요. 당연히 후회는 제로예요. 남동생은 고맙다고 설거지를 해 주겠다더니... 대신 제 소파에서 잠들었어요. 모든 게 맛있게 잘 흘러갔고, 그 후로 걔는 올 때마다 그 집에 가자고 해요.", "struct": [["1️⃣ 도입", "지난 토요일 · 동생 냉장고 습격"], ["2️⃣ 주문", "찌개 + 왕계란말이 콤보"], ["3️⃣ 반전", "사장님 깜짝 서비스 생선구이"], ["4️⃣ 결과", "과식 · 무후회 · 소파 취침"], ["5️⃣ 마무리", "since then + 동생 단골 등극"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["fridge raid", "냉장고 습격"], ["show up", "(불쑥) 나타나다"], ["our usual combo", "늘 먹던 조합"], ["guess what", "글쎄, 그런데 있잖아요"], ["out of nowhere", "난데없이, 갑자기"], ["free food", "공짜 음식"], ["eat until we couldn't move", "움직일 수 없을 때까지 먹다"], ["Zero regrets", "후회 제로"], ["worked out", "잘 흘러갔다, 잘 해결됐다"], ["since then", "그 후로"]], "audio": "audio/2_돌발/2-014 3. 식당(Restaurant)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-014 3. 식당(Restaurant)_과거 경험.mp3"}, {"id": "2-015", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "비교", "badge": "15 비교", "enQ": "Compare restaurants today with the ones you went to when you were young. How have the menus, the service, and the way people order changed? Tell me about the changes.", "enA": "Restaurants have changed a lot since I was young. Back then, everything was analog: paper menus, waving your hand to order, and paying in cash at the counter on the way out.\n\nMenus used to be simple and traditional too — Korean, Chinese, and maybe one pizza place in town. For us kids, jajangmyeon day was basically a national holiday!\n\nThese days, it's a completely different story. You order on a tablet or with a QR code, robots carry dishes in some places, and delivery apps bring the whole city to your sofa. Menus went global too: Thai, Vietnamese, Mexican — all in my neighborhood. Compared to the past, eating out is way more convenient and diverse. Though I have to admit, I miss ordering out loud and chatting with the owner. Tapping a screen just isn't as warm.", "koQ": "요즘 식당과 어렸을 때 가던 식당을 비교해주세요. 메뉴, 서비스, 주문 방식은 어떻게 변화했나요? 그 변화에 대해 말해주세요.", "koA": "식당은 제가 어릴 때에 비해 정말 많이 변했어요. 그때는 모든 게 아날로그였죠. 종이 메뉴판, 손을 흔들어 주문하기, 그리고 나가는 길에 카운터에서 현금 계산이요.\n\n메뉴도 예전엔 단순하고 전통적이었어요. 한식, 중식, 그리고 시내에 피자집 하나 정도요. 우리 애들한테는 짜장면 먹는 날이 사실상 국경일이었어요!\n\n요즘은 완전히 다른 이야기예요. 태블릿이나 QR코드로 주문하고, 어떤 곳은 로봇이 음식을 나르고, 배달 앱은 도시 전체를 소파 앞으로 가져다줘요. 메뉴도 글로벌해졌어요. 태국, 베트남, 멕시코 음식까지 다 저희 동네에 있죠. 과거와 비교하면 외식은 훨씬 편리하고 다양해졌어요. 그래도 인정할게요. 소리 내어 주문하고 사장님과 수다 떨던 게 그리워요. 화면을 두드리는 건 그만큼 따뜻하진 않으니까요.", "struct": [["1️⃣ 도입", "아날로그 시대 식당"], ["2️⃣ 과거", "종이 메뉴 · 현금 · 짜장면 국경일"], ["3️⃣ 현재", "태블릿 · 로봇 · 배달 앱"], ["4️⃣ 메뉴", "한중식 → 글로벌 (동네에서!)"], ["5️⃣ 마무리", "way more + 사장님 수다 그리움"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["paper menu", "종이 메뉴판"], ["pay in cash", "현금으로 계산하다"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["basically a national holiday", "사실상 국경일"], ["it's a completely different story", "완전히 다른 이야기다"], ["order on a tablet", "태블릿으로 주문하다"], ["delivery app", "배달 앱"], ["go global", "글로벌해지다"], ["compared to ~", "~과 비교하면"], ["I have to admit", "인정할게요"]], "audio": "audio/2_돌발/2-015 3. 식당(Restaurant)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-015 3. 식당(Restaurant)_비교.mp3"}, {"id": "2-016", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "묘사", "badge": "16 묘사", "enQ": "Who do you talk to on the phone most often, and what do you usually talk about? Describe your typical phone conversations in detail.", "enA": "The person I call most often? My best friend, hands down. We talk almost every day — quick check-ins after work — and my mom gets her regular call every Sunday evening.\n\nWith my best friend, the topics are basically our shared universe: which movie to see this weekend, new restaurants to try, IU's concert schedule, and planning our next trip. A typical call starts with nothing much, you? and somehow ends forty minutes later. With my mom, it's classic mom content: whether I'm eating well, plus neighborhood news — she always has updates about the old couple next door!\n\nSo yeah, that's pretty much my phone life: short daily calls for fun, one long Sunday call for family. Small talk, sure — but honestly, it's the glue of my relationships.", "koQ": "누구와 가장 자주 전화 통화를 하고, 주로 무슨 이야기를 하나요? 당신의 일반적인 전화 통화를 자세히 설명해주세요.", "koA": "제가 가장 자주 전화하는 사람이요? 두말할 것 없이 절친이에요. 거의 매일 통화해요. 퇴근 후 짧은 안부 확인이요. 그리고 엄마와는 매주 일요일 저녁마다 정기 통화를 하죠.\n\n절친과의 주제는 기본적으로 우리 둘의 공유 세계관이에요. 이번 주말에 볼 영화, 가 볼 새 식당, 아이유 콘서트 일정, 다음 여행 계획까지요. 보통 통화는 별일 없지? 로 시작해서 어쩌다 보니 40분 뒤에 끝나요. 엄마와는 클래식 엄마 콘텐츠죠. 밥은 잘 먹고 다니는지, 그리고 동네 소식이요. 엄마는 항상 옆집 노부부의 근황을 알고 계세요!\n\n네, 제 전화 생활은 대체로 이래요. 짧은 매일 통화는 재미로, 긴 일요일 통화는 가족을 위해서요. 잡담이긴 하지만, 솔직히 그게 제 인간관계의 접착제예요.", "struct": [["1️⃣ 도입", "절친 매일 + 엄마 일요일"], ["2️⃣ 절친", "영화 · 식당 · 아이유 · 여행"], ["3️⃣ 패턴", "별일 없지? → 40분 통화"], ["4️⃣ 엄마", "밥 걱정 + 옆집 노부부 근황"], ["5️⃣ 마무리", "잡담 = 관계의 접착제"]], "expr": [["hands down", "두말할 것 없이"], ["check-in", "안부 확인"], ["every Sunday evening", "매주 일요일 저녁"], ["our shared universe", "우리 둘의 공유 세계관"], ["nothing much, you?", "별일 없지?"], ["somehow ends forty minutes later", "어쩌다 보니 40분 뒤에 끝난다"], ["classic mom content", "클래식 엄마 콘텐츠"], ["the old couple next door", "옆집 노부부"], ["small talk", "잡담, 스몰토크"], ["the glue of ~", "~의 접착제"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/2_돌발/2-016 4. 전화(Phone Calls)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-016 4. 전화(Phone Calls)_묘사.mp3"}, {"id": "2-017", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "습관", "badge": "17 습관", "enQ": "When and where do you usually make phone calls, and how often do you talk on the phone? Tell me about your phone habits in detail.", "enA": "My phone habits are pretty consistent, so let me walk you through them. On weekdays, I make most of my calls in the evening — usually while walking along the riverside path near my place.\n\nThat's my golden rule: calls and walks go together. Walking makes conversations flow better, and my best friend says she can always tell when I'm on my walking course, because I sound happier! These short calls happen daily, about ten minutes each.\n\nWeekends are for the long ones: Sunday evening, me on my gray sofa, tea in hand, phone on speaker — mom time. Oh, and one more rule: no calls after eleven, because that's when my wind-down playlist takes over. A simple routine, but that daily rhythm of voices keeps me sane — and it never gets old.", "koQ": "보통 언제 어디서 전화를 걸고, 얼마나 자주 통화를 하나요? 당신의 전화 습관에 대해 자세히 말해주세요.", "koA": "제 전화 습관은 꽤 일정해요. 차근차근 설명해 드릴게요. 평일에는 대부분의 통화를 저녁에 해요. 주로 집 근처 강변 산책로를 걸으면서요.\n\n그게 저의 황금률이에요. 통화와 산책은 세트다. 걸으면 대화가 더 잘 흘러가요. 절친은 제가 산책 코스에 있을 때를 항상 알아챈대요. 목소리가 더 행복하게 들린다나요! 이런 짧은 통화는 매일, 한 번에 10분 정도예요.\n\n주말은 긴 통화의 시간이죠. 일요일 저녁, 회색 소파에 앉아 차 한 잔 들고 스피커폰으로. 엄마 타임이에요. 아, 규칙이 하나 더 있어요. 11시 이후엔 통화 금지. 그때부턴 제 윈드다운 플레이리스트가 넘겨받거든요. 단순한 루틴이지만, 매일 목소리를 듣는 그 리듬이 저를 제정신으로 유지해 줘요. 그리고 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "저녁 + 강변 산책로 통화"], ["2️⃣ 원칙", "통화와 산책은 세트!"], ["3️⃣ 빈도", "매일 10분 짧은 통화"], ["4️⃣ 주말", "소파 + 차 + 엄마 타임"], ["5️⃣ 마무리", "11시 컷 + keeps me sane"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["while walking", "걸으면서"], ["golden rule", "황금률, 나만의 원칙"], ["go together", "세트다, 잘 어울린다"], ["flow better", "더 잘 흘러가다"], ["sound happier", "더 행복하게 들리다"], ["mom time", "엄마 타임"], ["no calls after eleven", "11시 이후 통화 금지"], ["wind down", "긴장을 풀다"], ["keep me sane", "제정신으로 유지해 주다"], ["it never gets old", "아무리 해도 질리지 않아요"]], "audio": "audio/2_돌발/2-017 4. 전화(Phone Calls)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-017 4. 전화(Phone Calls)_습관.mp3"}, {"id": "2-018", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "취향", "badge": "18 취향", "enQ": "Do you prefer talking on the phone or sending text messages? Why do you like that way of communicating better? Tell me the reasons.", "enA": "If I had to choose, I'd say text messages — at least for daily life. For me, it's all about timing: texts let both of us reply whenever we're free, with zero pressure.\n\nI'd pick texting over calling for anything practical, any day: schedules, addresses, little reminders. Photos and links can say things words can't. Don't get me wrong, though — for the people I love, it's the complete opposite. Nothing beats actually hearing my best friend burst out laughing, and emojis can't hug you the way a warm voice can.\n\nSo my system is simple: texts for information, calls for hearts. In a nutshell, I text to manage my life — but I call to feel it.", "koQ": "전화 통화와 문자 메시지 중 무엇을 선호하나요? 왜 그 소통 방식이 더 좋은가요? 그 이유를 말해주세요.", "koA": "굳이 고르자면 문자 메시지요. 적어도 일상에서는요. 저한테는 타이밍이 전부거든요. 문자는 서로 시간이 될 때 답하면 되잖아요. 부담 제로로요.\n\n실용적인 건 뭐든 두말없이 통화보다 문자를 고를 거예요. 일정, 주소, 자잘한 리마인더요. 사진과 링크는 말로 못 하는 걸 전하기도 하고요. 하지만 오해는 마세요. 사랑하는 사람들에게는 완전히 반
