세요", "콘서트·요리 취향 편 재활용 🔁"], ["conversation over volume", "볼륨보다 대화", "A over B 마무리 선언, 재활용 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 10연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-053 10. 술집_바(Bars)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-053 10. 술집_바(Bars)_취향.mp3"}, {"id": "1-054", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "과거 경험", "badge": "54 과거 경험", "enQ": "Tell me about a memorable time you had at a bar. Was it a special occasion like a birthday party, or did something unexpected happen? Describe what made that night unforgettable.", "enA": "Oh, this reminds me of my birthday last year. My best friend asked me out for \"just a casual beer\" at our usual craft beer pub. I suspected nothing at all — that was my first mistake!\n\nWe were chatting as usual, when suddenly the lights dimmed. And guess what? The owner walked out with a cake, and from the corner table, five of my friends jumped up shouting \"Surprise!\" They'd been hiding there the whole time, pretending to be strangers. I was too shocked to even move — then I just burst out laughing.\n\nThe owner even played my favorite song and gave us a round on the house. To be honest, I'm not big on birthdays, but that night changed my mind. What made it unforgettable wasn't the party itself — it was realizing how much effort my friends had put in. Since then, that pub has been our spot.", "koQ": "술집에서 보낸 기억에 남는 시간에 대해 말해주세요. 생일파티 같은 특별한 날이었나요, 아니면 예상치 못한 일이 있었나요? 무엇이 그 밤을 잊을 수 없게 했는지 묘사해주세요.", "koA": "아, 작년 제 생일이 생각나네요. 절친이 늘 가던 수제맥주 펍에서 '그냥 가볍게 맥주 한잔' 하자고 불러냈어요. 저는 전혀 눈치채지 못했죠. 그게 첫 번째 실수였어요!\n\n여느 때처럼 수다를 떨고 있는데 갑자기 조명이 어두워졌어요. 그런데 있잖아요, 사장님이 케이크를 들고 나오시고, 구석 테이블에서 친구 다섯 명이 '서프라이즈!'를 외치며 벌떡 일어난 거예요. 걔네는 내내 거기 숨어서 모르는 사람인 척하고 있었던 거죠. 저는 놀라서 움직이지도 못하다가, 그냥 빵 터졌어요.\n\n사장님은 제가 좋아하는 노래까지 틀어 주시고 맥주 한 잔씩을 서비스로 주셨어요. 솔직히 저는 생일을 크게 챙기는 편이 아닌데, 그날 밤이 제 생각을 바꿔 놨어요. 잊을 수 없게 만든 건 파티 자체가 아니라, 친구들이 얼마나 정성을 들였는지를 깨달은 순간이었어요. 그 후로 그 펍은 우리의 아지트가 됐어요.", "struct": [["1️⃣ 도입", "생일 · '가볍게 한잔' 낚시"], ["2️⃣ 반전", "조명 어두워짐 → 서프라이즈!"], ["3️⃣ 디테일", "숨어 있던 친구들 · 케이크"], ["4️⃣ 감동", "최애곡 · 서비스 맥주 · 추억"], ["5️⃣ 마무리", "정성 깨달음 + our spot"]], "scoring": [["질문의 힌트 받기", "질문이 birthday party를 예시로 줬어요. 힌트를 그대로 살리되 서프라이즈라는 반전을 얹으면 완벽한 선택 ✅"], ["속은 자의 시점 유지", "\"눈치 못 챈 게 첫 번째 실수\"처럼 속은 내 시점에서 서술하면 반전의 재미가 두 배가 돼요 😶"], ["감동 포인트 지정", "파티가 아니라 친구들의 정성이 핵심이었다고 콕 집어 주면 what made it unforgettable에 정면으로 답하게 돼요 💕"], ["공간과 연결하며 마무리", "그 밤 이후 펍이 our spot이 됐다는 마무리가 묘사·습관 편과 이야기를 하나로 묶어 줘요 🔁"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["ask me out for ~", "~하자고 불러내다", "이야기의 시작을 여는 자연스러운 동사 🍺"], ["suspect nothing at all", "전혀 눈치채지 못하다", "서프라이즈 스토리의 필수 밑밥 😶"], ["as usual", "여느 때처럼", "카페·조깅 경험 편 재활용 🔁"], ["the lights dimmed", "조명이 어두워졌다", "반전 직전의 신호탄 장면 💡"], ["guess what?", "그런데 있잖아요?", "반전 필러, 시리즈 개근 🔁 😲"], ["too shocked to even move", "놀라서 움직이지도 못한", "공원 경험 편 재활용 🔁 too~to 구문"], ["burst out laughing", "빵 터지다", "감정 전환 표현, 시리즈 공통 🔁 😆"], ["on the house", "서비스로, 공짜로", "술집·식당 전용 원어민 표현! 🎁"], ["put in effort", "정성을 들이다", "'잊을 수 없는 이유'의 정답 표현 💕"], ["our spot", "우리의 아지트", "my go-to place의 우정 버전 마무리 🔁"]], "audio": "audio/1_서베이/1-054 10. 술집_바(Bars)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-054 10. 술집_바(Bars)_과거 경험.mp3"}, {"id": "1-055", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "비교", "badge": "55 비교", "enQ": "Compare the bars people go to these days with the ones that were popular in the past. How have drinking places changed over time? Tell me about the differences.", "enA": "Drinking places in Korea have changed a lot. Back then — say, when I first became old enough to drink — the standard was big, noisy hof pubs: bright lights, plastic chairs, huge tables, and everyone drinking the same two things, soju or basic lager.\n\nDrinking itself was different too. It was often about drinking a lot — company dinners, endless toasts, staying out until late. People used to go to two or three places in one night, called \"rounds.\"\n\nThese days, it's a completely different story. Small, specialized bars are everywhere — craft beer pubs, wine bars, even quiet cocktail bars — each with its own personality. And the culture has shifted from drinking hard to drinking well: people care about taste and atmosphere, not quantity. So yeah, compared to the past, bars today are smaller, quieter, and way more about the experience — and honestly, I think that's a change for the better.", "koQ": "요즘 사람들이 가는 술집과 과거에 인기 있던 술집을 비교해주세요. 시간이 지나며 술집은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "한국의 술집은 정말 많이 변했어요. 그때는, 그러니까 제가 처음 술을 마실 수 있는 나이가 됐을 때는 크고 시끄러운 호프집이 기본이었어요. 환한 조명, 플라스틱 의자, 커다란 테이블, 그리고 모두가 소주 아니면 기본 라거, 둘 중 하나만 마셨죠.\n\n술 마시는 문화 자체도 달랐어요. 많이 마시는 게 중심이었죠. 회식, 끝없는 건배, 늦게까지 이어지는 술자리요. 사람들은 하룻밤에 두세 곳을 옮겨 다니곤 했어요. '차수'라고 부르면서요.\n\n요즘은 완전히 다른 이야기예요. 작고 전문화된 술집이 어디에나 있어요. 수제맥주 펍, 와인바, 조용한 칵테일바까지, 각자의 개성이 있죠. 문화도 '독하게 마시기'에서 '잘 마시기'로 바뀌었어요. 사람들은 이제 양이 아니라 맛과 분위기를 중요하게 생각해요. 네, 과거와 비교하면 요즘 술집은 더 작고, 더 조용하고, 훨씬 더 경험 중심이에요. 그리고 솔직히 좋은 변화라고 생각해요.", "struct": [["1️⃣ 도입", "변화 인정 (changed a lot)"], ["2️⃣ 과거", "호프집 · 소주 아니면 라거"], ["3️⃣ 과거", "많이 마시기 · 2~3차 문화"], ["4️⃣ 현재", "전문 바 다양화 · 잘 마시기"], ["5️⃣ 마무리", "compared to + 좋은 변화"]], "scoring": [["장소 + 문화 두 축", "술집(호프→전문 바)과 음주 문화(양→질)를 나란히 비교하면 how have they changed에 입체적으로 답하게 돼요 📊"], ["한국어 그대로 소개", "hof, rounds(차수)처럼 한국 고유 표현을 설명과 함께 쓰면 문화 소개 점수가 따라와요 🇰🇷 치맥과 같은 기술 🔁"], ["from A to B 요약", "\"drinking hard → drinking well\"처럼 변화를 전치사구 하나로 요약하면 비교의 척추가 완성돼요 ✨"], ["의견으로 마무리", "\"좋은 변화라고 생각한다\"는 한 줄 평가가 사실 나열을 나의 관점이 있는 답변으로 바꿔 줘요 ✅"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 공통 시그널 🔁 🧩"], ["old enough to drink", "술 마실 수 있는 나이", "시점을 밝히는 세련된 표현 🎂"], ["hof pub", "호프집", "한국식 표현 그대로 소개 OK! 🍺"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 개근 표현 🔁 💓"], ["endless toasts", "끝없는 건배", "옛 회식 문화를 한 단어로 🥂"], ["called \"rounds\"", "'차수'라고 부르는", "2차 3차 문화 소개 디테일 🇰🇷"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 시리즈 공통 🔁 🎭"], ["personality", "(가게의) 개성", "요즘 가게들을 한 단어로 정리 ✨"], ["from drinking hard to drinking well", "독하게 → 잘 마시기로", "from A to B 변화 요약의 정석 📊"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁"], ["a change for the better", "좋은 변화", "비교 답변의 품격 있는 마침표 ✅"]], "audio": "audio/1_서베이/1-055 10. 술집_바(Bars)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-055 10. 술집_바(Bars)_비교.mp3"}, {"id": "1-056", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "묘사", "badge": "56 묘사", "enQ": "Describe the place in your home where you spend most of your time during vacations. What does that space look like, and what do you have there? Tell me in detail.", "enA": "During vacations, I basically live in my living room — more specifically, on my couch. It's a big, deep gray couch by the window, and honestly, it's the heart of my home.\n\nEverything I need is within arm's reach: a soft blanket, a small side table for snacks and coffee, and the TV right in front. I've also got a floor lamp that gives the room a warm, orange glow in the evening — it makes all the difference. Next to the couch, there's a little pile of books I always plan to read... and mostly don't.\n\nWhat makes the space perfect is the big window. Sunlight pours in during the day, and I can people-watch the street below with a coffee in hand. So yeah, that's pretty much my vacation headquarters — small, warm, and exactly my kind of paradise.", "koQ": "휴가 동안 집에서 가장 많은 시간을 보내는 공간을 묘사해주세요. 그 공간은 어떻게 생겼고, 그곳에는 무엇이 있나요? 자세히 말해주세요.", "koA": "휴가 때 저는 사실상 거실에서 살아요. 더 정확히는 소파 위에서요. 창가에 놓인 크고 짙은 회색 소파인데, 솔직히 우리 집의 심장이에요.\n\n필요한 건 전부 손 닿는 곳에 있어요. 부드러운 담요, 간식과 커피를 놓는 작은 사이드 테이블, 그리고 바로 앞의 TV요. 저녁이면 방을 따뜻한 주황빛으로 물들이는 플로어 램프도 있는데, 이게 분위기를 완전히 바꿔 줘요. 소파 옆에는 항상 읽어야지 하고 쌓아 둔 책 더미가 있고요. 물론 거의 안 읽지만요.\n\n이 공간을 완벽하게 만드는 건 큰 창문이에요. 낮에는 햇살이 쏟아져 들어오고, 커피를 손에 들고 아래 거리의 사람들을 구경할 수 있거든요. 네, 이게 제 휴가 본부예요. 작고, 따뜻하고, 딱 제 취향의 천국이죠.", "struct": [["1️⃣ 도입", "거실 소파 = 우리 집의 심장"], ["2️⃣ 아이템", "담요 · 사이드 테이블 · TV"], ["3️⃣ 조명", "플로어 램프의 주황빛"], ["4️⃣ 유머", "안 읽는 책 더미 고백"], ["5️⃣ 마무리", "창문 햇살 + my paradise"]], "scoring": [["공간 → 물건 → 빛 순서", "소파(중심) → 주변 아이템 → 조명과 햇살 순서로 카메라를 움직이듯 묘사하면 절대 꼬이지 않아요 🎥"], ["자기 고백 유머", "\"쌓아만 두고 안 읽는 책\" 같은 솔직한 고백 하나가 완벽한 묘사보다 훨씬 사람답게 들려요 😆"], ["빛으로 분위기 완성", "주황빛 램프(저녁)와 쏟아지는 햇살(낮) — 시간대별 빛 묘사는 공원 편 벚꽃·야경 기술의 실내 버전이에요 🔁 ☀️"], ["명명법으로 마무리", "vacation headquarters, my kind of paradise처럼 공간에 이름을 붙이면 애정이 저절로 전해져요 🏠"]], "expr": [["the heart of my home", "우리 집의 심장", "공간의 중요도를 비유로 선언! 💛"], ["within arm's reach", "손 닿는 곳에", "주방 묘사 편 재활용 🔁 게으름의 미학"], ["side table", "사이드 테이블", "아늑함을 그리는 가구 디테일 ☕"], ["floor lamp", "플로어 램프(장스탠드)", "조명 묘사 필수 아이템 💡"], ["warm, orange glow", "따뜻한 주황빛", "색+온도 조합의 감성 묘사 ✨"], ["it makes all the difference", "그게 결정적 차이를 만든다", "작은 디테일 강조 만능 표현 💯"], ["plan to read... and mostly don't", "읽으려고만 하는", "누구나 공감하는 자기 고백 유머 😆"], ["pour in", "(햇살이) 쏟아져 들어오다", "빛 묘사의 킬러 동사예요 ☀️"], ["people-watch", "사람 구경하다", "카페 습관 편 재활용 🔁 창가 필수 동사"], ["vacation headquarters", "휴가 본부", "소파를 본부로! 유쾌한 명명법 🏠"], ["my kind of paradise", "내 취향의 천국", "주방 편 happy place의 업그레이드 🔁 💕"]], "audio": "audio/1_서베이/1-056 11. 휴가·집(Vacation)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-056 11. 휴가·집(Vacation)_묘사.mp3"}, {"id": "1-057", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "습관", "badge": "57 습관", "enQ": "What do you usually do at home during a vacation? Who comes to visit you? Describe how you typically spend your time.", "enA": "My home vacations follow a very scientific schedule: no schedule at all! But let me walk you through a typical day anyway. It always starts with sleeping in — no alarms allowed, that's the golden rule.\n\nOnce I'm up, I make a slow brunch, then settle into my couch for a Netflix marathon or some gaming. Around sunset, I force myself out for a short walk in the park — you know, just to feel a little less guilty about all that lying around.\n\nAs for visitors — my best friend usually comes over at least once. We order chimaek, watch a movie, and talk for hours. My younger brother also drops by sometimes, mostly to raid my fridge. So yeah, that's pretty much my home vacation: lazy, cozy, and honestly, exactly what vacations are for. It never gets old.", "koQ": "휴가 동안 집에서 주로 무엇을 하나요? 누가 당신을 방문하러 오나요? 일반적으로 시간을 어떻게 보내는지 설명해주세요.", "koA": "제 집 휴가는 아주 과학적인 스케줄을 따라요. 바로 스케줄 없음이요! 그래도 일반적인 하루를 차근차근 말씀드릴게요. 시작은 항상 늦잠이에요. 알람 금지, 그게 황금 규칙이죠.\n\n일어나면 느긋하게 브런치를 만들고, 소파에 자리를 잡고 넷플릭스 정주행이나 게임을 해요. 해 질 무렵엔 억지로라도 공원에 나가서 잠깐 걸어요. 하루 종일 누워 있던 것에 대한 죄책감을 조금 덜려고요.\n\n방문객으로 말하자면, 절친이 보통 한 번은 놀러 와요. 치맥을 시키고, 영화를 보고, 몇 시간씩 수다를 떨죠. 남동생도 가끔 들르는데, 주로 제 냉장고를 털러 와요. 네, 이게 제 집 휴가예요. 게으르고, 아늑하고, 솔직히 휴가란 바로 이런 거죠. 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "스케줄 = 무계획! + 늦잠"], ["2️⃣ 낮", "브런치 · 넷플릭스 · 게임"], ["3️⃣ 저녁", "공원 산책(죄책감 해소용)"], ["4️⃣ 방문객", "절친 치맥 · 동생 냉장고 습격"], ["5️⃣ 마무리", "게으르고 아늑한 완벽 휴가"]], "scoring": [["무계획도 루틴이다", "\"스케줄 없음이 스케줄\"이라는 역설 오프닝이 집 휴가 질문의 완벽한 캐릭터 설정이에요 😆"], ["방문객 질문 챙기기", "Who comes to visit you?를 놓치지 마세요. 절친(치맥)과 동생(냉장고 습격)으로 캐릭터까지 살려 답했어요 ✅"], ["죄책감 산책 디테일", "\"덜 미안하려고 산책\" 같은 솔직함이 답변을 진짜 이야기로 만들어요 😅 공원 주제 연결은 덤 🔁"], ["당당한 마무리", "게으른 휴가를 부끄러워하지 말고 \"휴가란 이런 것\"이라고 당당하게 닫으세요 🛋️ 취향 편의 복선이 돼요!"]], "expr": [["no schedule at all", "무계획", "집 휴가의 정체성을 유머로 선언 😆"], ["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 시리즈 개근 🔁"], ["sleep in", "늦잠 자다", "휴가 루틴의 시작! oversleep과 구분 🛌"], ["the golden rule", "황금 규칙", "공연·술집 편 재활용 🔁 알람 금지!"], ["settle into ~", "~에 자리 잡다", "술집 편 settle in 재활용 🔁 🛋️"], ["Netflix marathon", "넷플릭스 정주행", "binge-watching과 세트로 암기 📺"], ["feel less guilty", "죄책감을 덜다", "산책 이유의 솔직 유머 디테일 😅"], ["come over", "(우리 집에) 놀러 오다", "visit 질문의 정답 구동사! 🏠"], ["drop by", "잠깐 들르다", "stop by의 사촌! 방문 표현 확장 🔁"], ["raid my fridge", "냉장고를 털다", "동생 캐릭터를 살리는 킬러 유머 😆"], ["it never gets old", "아무리 해도 질리지 않는다", "습관 마무리, 시리즈 공통 🔁"]], "audio": "audio/1_서베이/1-057 11. 휴가·집(Vacation)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-057 11. 휴가·집(Vacation)_습관.mp3"}, {"id": "1-058", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "취향", "badge": "58 취향", "enQ": "While many people travel during vacations, you prefer staying home. What makes a vacation at home better for you? Tell me the reasons you enjoy it.", "enA": "Why do I prefer staying home? Simple: because a vacation should be about resting, and for me, travel is anything but restful. For me, it's all about zero stress — comfort over sightseeing, every time.\n\nThink about what travel involves: packing, airports, crowds, and checking maps every ten minutes. By the time you're back, you need a vacation from your vacation! At home, there's none of that. I sleep in my own bed, eat what I want, and answer to no one.\n\nAnd the best part? It costs almost nothing, so there's no post-vacation bill shock either. Don't get me wrong — I do enjoy traveling once in a while. But when I really need to recharge, nothing beats my own couch. That's my taste in a nutshell.", "koQ": "많은 사람들이 휴가 때 여행을 가지만, 당신은 집에 있는 것을 선호합니다. 집에서 보내는 휴가가 당신에게 더 좋은 이유는 무엇인가요? 그것을 즐기는 이유를 말해주세요.", "koA": "왜 집에 있는 걸 선호하냐고요? 간단해요. 휴가는 쉬는 게 목적인데, 저한테 여행은 전혀 쉬는 게 아니거든요. 저한테는 스트레스 제로가 전부예요. 관광보다 편안함, 언제나요.\n\n여행에 뭐가 따라오는지 생각해 보세요. 짐 싸기, 공항, 인파, 그리고 10분마다 지도 확인하기요. 돌아올 때쯤엔 휴가로부터의 휴가가 필요할 지경이잖아요! 집에는 그런 게 하나도 없어요. 내 침대에서 자고, 먹고 싶은 걸 먹고, 누구의 눈치도 안 봐요.\n\n그리고 제일 좋은 점이 뭔지 아세요? 돈이 거의 안 들어서 휴가 후 카드값 충격도 없다는 거예요. 오해는 마세요, 가끔은 여행도 즐겨요. 하지만 진짜 재충전이 필요할 때는 내 소파만 한 게 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "휴가 = 휴식, 여행 ≠ 휴식"], ["2️⃣ 근거", "짐·공항·인파·지도 스트레스"], ["3️⃣ 장점", "내 침대 · 내 맘대로 · 눈치 제로"], ["4️⃣ 보너스", "비용 제로(카드값 충격 없음)"], ["5️⃣ 마무리", "nothing beats my couch!"]], "scoring": [["반대편 해부하기", "여행의 피곤함(짐·공항·인파)을 조목조목 나열하면 집 휴가의 장점을 따로 설명할 필요가 없어져요 🧳"], ["유머 명언 만들기", "\"a vacation from your vacation\"은 이 답변의 하이라이트예요 😆 이런 한 줄이 IH와 IM을 가릅니다!"], ["현실 장점 must", "돈 문제(카드값 충격 제로)는 누구나 공감하는 현실 장점이에요 💳 조깅 취향 편 공짜 논리 재활용 🔁"], ["취향 공식 완성", "반대편 해부 → 내 장점 → 예외 인정 → nothing beats. 11번째 취향 답변, 이제 완전히 몸에 뱄죠? 🎓 🔁"]], "expr": [["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 11연속 등장! 🔁 🎯"], ["comfort over sightseeing", "관광보다 편안함", "A over B 선언법, 시리즈 재활용 🔁 ✨"], ["anything but restful", "전혀 쉬는 게 아닌", "anything but = 결코 ~아닌. 고급 구문 💯"], ["a vacation from your vacation", "휴가로부터의 휴가", "여행 피로를 꼬집는 유머 명언 😆"], ["answer to no one", "누구 눈치도 안 보다", "집 휴가 자유의 결정타 표현 🙌"], ["And the best part?", "그리고 제일 좋은 점은?", "공원·조깅 취향 편 자문자답 재활용 🔁"], ["post-vacation bill shock", "휴가 후 카드값 충격", "요리 계기 편 명세서 유머와 세트 🔁 💳"], ["Don't get me wrong", "오해는 마세요", "취향 편 균형 필러, 재활용 🔁"], ["recharge", "재충전하다", "공원 취향 편 재활용 🔁 🔋"], ["nothing beats ~", "~만 한 게 없다", "취향 마무리, 시리즈 개근 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 11연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-058 11. 휴가·집(Vacation)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-058 11. 휴가·집(Vacation)_취향.mp3"}, {"id": "1-059", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "과거 경험", "badge": "59 과거 경험", "enQ": "Tell me about the most memorable vacation you spent at home. What did you do, and who was with you? What made that time so special?", "enA": "Oh, this reminds me of last summer. I had a five-day break, and my best friend's apartment was being renovated — so she just moved in with me for the whole vacation. We called it our \"home camping\" week.\n\nWe really went all in. We built a blanket fort in the living room — yes, like ten-year-olds — hung fairy lights, and had a movie marathon every night. During the day, we cooked together, mostly my kimchi fried rice, and one rainy afternoon we just sat by the window doing absolutely nothing. Out of nowhere, that turned into a three-hour talk about life.\n\nTo be honest, that deep talk is what made the week so special. We've been friends for fifteen years, but we'd never talked like that before. In the end, I didn't go anywhere that vacation, but I felt like I'd traveled somewhere really far. Since then, \"home camping\" has become our yearly tradition.", "koQ": "집에서 보낸 휴가 중 가장 기억에 남는 것을 말해주세요. 무엇을 했고, 누가 함께 있었나요? 무엇이 그 시간을 특별하게 만들었나요?", "koA": "아, 작년 여름이 생각나네요. 5일짜리 휴가가 있었는데, 마침 절친네 집이 인테리어 공사 중이라 걔가 아예 우리 집으로 들어와서 휴가 내내 같이 지냈어요. 우리는 그 주를 '홈캠핑' 주간이라고 불렀죠.\n\n우리는 정말 제대로 했어요. 거실에 담요 요새를 지었고요. 네, 열 살짜리들처럼요. 꼬마전구를 달고, 매일 밤 영화 정주행을 했어요. 낮에는 같이 요리했어요. 주로 제 김치볶음밥이었죠. 그리고 비 오던 어느 오후에는 그냥 창가에 앉아서 아무것도 안 했는데, 난데없이 그게 세 시간짜리 인생 이야기가 됐어요.\n\n솔직히 그 깊은 대화가 그 주를 특별하게 만든 거예요. 15년 지기인데 그렇게 이야기해 본 건 처음이었거든요. 결국 그 휴가 때 아무 데도 안 갔지만, 아주 먼 곳을 여행하고 온 기분이었어요. 그 후로 '홈캠핑'은 우리의 연례 전통이 됐어요.", "struct": [["1️⃣ 도입", "절친 입주 · '홈캠핑' 주간"], ["2️⃣ 활동", "담요 요새 · 조명 · 영화 정주행"], ["3️⃣ 낮", "같이 요리(김치볶음밥!)"], ["4️⃣ 절정", "비 오는 오후 3시간 인생 대화"], ["5️⃣ 마무리", "먼 여행 같았던 집 + 연례 전통"]], "scoring": [["이름 붙은 추억", "\"홈캠핑\"처럼 그 시간에 이름을 붙이면 평범한 집콕이 특별한 사건으로 바뀌어요 ⛺ 카페 문(Moon)과 같은 기술 🔁"], ["동심 디테일", "담요 요새, 꼬마전구 — 어른들이 아이처럼 논 디테일은 그 자체로 웃음과 낭만을 다 잡아요 😆"], ["특별한 이유 = 대화", "what made it special의 답을 활동이 아니라 3시간 인생 대화로 잡으면 이야기에 깊이가 생겨요 💬"], ["반전 명언 마무리", "\"아무 데도 안 갔지만 먼 여행을 한 기분\" — 집 휴가 경험담의 완벽한 마침표예요 ✈️ 전통 연결까지 🔁"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["move in with ~", "~네 집에 들어와 살다", "상황 설정을 한 구동사로 해결 🏠"], ["home camping", "홈캠핑", "우리만의 이름 붙이기! 특별함 UP ⛺"], ["go all in", "제대로 하다, 올인하다", "진심이었다는 걸 보여 주는 표현 💪"], ["blanket fort", "담요 요새", "동심 소환 킬러 디테일! 😆"], ["fairy lights", "(꼬마전구) 조명", "아늑한 장면을 완성하는 소품 ✨"], ["out of nowhere", "난데없이", "공원·음악 경험 편 재활용 🔁 💥"], ["a three-hour talk about life", "3시간짜리 인생 대화", "절정 장면을 숫자로 구체화 💬"], ["In the end", "결국", "정리 모드 전환 시그널, 재활용 🔁"], ["felt like I'd traveled far", "먼 여행을 한 기분", "집 휴가의 반전 명언 마무리 ✈️"], ["yearly tradition", "연례 전통", "요리 경험 편 tradition 재활용 🔁 💕"]], "audio": "audio/1_서베이/1-059 11. 휴가·집(Vacation)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-059 11. 휴가·집(Vacation)_과거 경험.mp3"}, {"id": "1-060", "cat": "survey", "catName": "서베이 질문", "num": 11, "topic": "휴가·집", "topicEn": "Vacation", "type": "비교", "badge": "60 비교", "enQ": "Compare the vacations you spent at home recently with the ones you had in the past. How have your home vacations changed over the years? What is different now?", "enA": "My home vacations have changed quite a bit over the years. Back then — especially in my early twenties — staying home during a vacation felt like a failure. I used to think a \"real\" vacation meant going somewhere, so when I stayed home, I just killed time: random TV all day, phone in hand, feeling vaguely guilty.\n\nThere was no plan and no joy in it, honestly. It was rest without actually feeling rested.\n\nThese days, it's a completely different story — my home vacations are intentional. I plan little things to look forward to: a movie night with chimaek, a morning for cooking projects, an afternoon for a long walk. I even put my phone on do-not-disturb mode. Same couch, same house — but now it actually recharges me. So yeah, compared to the past, the change isn't the place; it's my mindset — home went from a failure to a luxury.", "koQ": "최근에 집에서 보낸 휴가와 과거의 휴가를 비교해주세요. 시간이 지나며 집에서 보내는 휴가는 어떻게 변화했나요? 지금은 무엇이 다른가요?", "koA": "제 집 휴가는 시간이 지나면서 꽤 많이 변했어요. 그때는, 특히 20대 초반에는 휴가 때 집에 있는 게 실패처럼 느껴졌어요. '진짜' 휴가는 어딘가로 떠나는 거라고 생각했으니까요. 그래서 집에 있게 되면 그냥 시간을 죽였어요. 하루 종일 아무 TV나 틀어 놓고, 손에는 폰을 쥐고, 막연한 죄책감을 느끼면서요.\n\n솔직히 계획도 없고 즐거움도 없었어요. 쉬긴 쉬는데 전혀 쉰 것 같지 않은 휴식이었죠.\n\n요즘은 완전히 다른 이야기예요. 제 집 휴가는 의도적이에요. 기대할 만한 작은 것들을 계획해요. 치맥과 함께하는 영화의 밤, 요리 프로젝트를 위한 아침, 긴 산책을 위한 오후요. 폰도 방해금지 모드로 해 놔요. 같은 소파, 같은 집인데 이제는 진짜 재충전이 돼요. 네, 과거와 비교하면 변한 건 장소가 아니라 마음가짐이에요. 집이 실패에서 사치가 된 거죠.", "struct": [["1️⃣ 도입", "변화 인정 (changed quite a bit)"], ["2️⃣ 과거", "집콕 = 실패 · 죄책감"], ["3️⃣ 과거", "무계획 · 쉰 것 같지 않은 휴식"], ["4️⃣ 현재", "의도적 휴가 · 방해금지 모드"], ["5️⃣ 마무리", "실패 → 사치(mindset 변화)"]], "scoring": [["인식의 변화 축", "활동 비교를 넘어 \"집콕 = 실패 → 사치\"라는 인식의 변화를 축으로 잡으면 비교 답변의 차원이 달라져요 💡"], ["과거의 나 솔직하게", "죄책감, 무계획, 시간 죽이기 — 과거를 미화하지 않아야 현재의 변화가 극적으로 살아요 😔 콘서트 비교 편과 같은 기술 🔁"], ["같은 장소, 다른 마음", "\"같은 소파인데 이제는 재충전이 된다\"는 대비가 what is different now의 가장 세련된 답이에요 🛋️"], ["시리즈 대장정 마무리", "11개 주제의 비교 공식이 모두 같은 뼈대였다는 걸 느꼈다면, 이제 어떤 비교 문제도 두렵지 않을 거예요 🎓 🔁"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 최종 등판! 🔁 🧩"], ["feel like a failure", "실패처럼 느껴지다", "과거의 인식을 솔직하게 고백 😔"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 개근 마감! 🔁 💓"], ["kill time", "시간을 죽이다", "카페 경험 편 kill time 재활용 🔁 📱"], ["vaguely guilty", "막연히 죄책감 드는", "vaguely = 막연히. 감정의 해상도 UP ✨"], ["rest without feeling rested", "쉰 것 같지 않은 휴식", "역설 표현으로 과거를 한 줄 요약 😮‍💨"], ["intentional", "의도적인", "요즘 휴가 트렌드를 한 단어로! 🎯"], ["things to look forward to", "기대할 거리", "즐거운 계획을 표현하는 필수 구문 📅"], ["do-not-disturb mode", "방해금지 모드", "디지털 디톡스 디테일 📵"], ["it's my mindset", "마음가짐의 변화", "장소가 아니라 마음! 비교의 반전 축 💡"], ["from a failure to a luxury", "실패에서 사치로", "from A to B 요약, 술집 비교 편 재활용 🔁"]], "audio": "audio/1_서베이/1-060 11. 휴가·집(Vacation)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-060 11. 휴가·집(Vacation)_비교.mp3"}, {"id": "1-061", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "묘사", "badge": "61 묘사", "enQ": "Describe your favorite travel destination in your country. What does the place look like, and what is special about it? Tell me about it in as much detail as possible.", "enA": "My favorite travel destination in Korea? That's easy — Gangneung, a small city on the east coast. It's only about two hours from Seoul by KTX, our high-speed train, so it's perfect for a quick getaway.\n\nThe scenery there is amazing. You've got a long sandy beach with unbelievably clear blue water, and right behind it, pine forests along the coast. The waves are pretty strong, so you can watch surfers all year round. In winter, the sea looks wild and moody — honestly, that's my favorite version of it.\n\nWhat makes it special is the coffee street right by the beach — a whole row of cafes overlooking the ocean. Drinking a warm latte while watching the waves? For a coffee person like me, it doesn't get better than that. So yeah, that's pretty much my favorite place in Korea — the sea and coffee, all in one place.", "koQ": "당신의 나라에서 가장 좋아하는 여행지를 묘사해주세요. 그 장소는 어떻게 생겼고, 어떤 특별한 점이 있나요? 가능한 자세히 말해주세요.", "koA": "한국에서 가장 좋아하는 여행지요? 쉽네요. 동해안의 작은 도시, 강릉이에요. 서울에서 고속열차인 KTX로 두 시간 정도밖에 안 걸려서, 짧은 여행에 딱이에요.\n\n그곳 풍경은 정말 멋져요. 믿을 수 없을 만큼 맑고 파란 바다와 긴 백사장이 있고, 바로 뒤로는 해안을 따라 소나무 숲이 이어져요. 파도가 꽤 세서 일 년 내내 서퍼들을 구경할 수 있어요. 겨울 바다는 거칠고 분위기 있어 보이는데, 솔직히 그게 제가 제일 좋아하는 모습이에요.\n\n특별한 점은 해변 바로 옆의 커피 거리예요. 바다가 내려다보이는 카페들이 쭉 늘어서 있거든요. 파도를 보면서 따뜻한 라떼를 마시는 거요? 저 같은 커피 애호가한테는 그보다 좋을 수 없죠. 네, 이게 한국에서 제가 제일 좋아하는 곳이에요. 바다와 커피가 한곳에 다 있으니까요.", "struct": [["1️⃣ 도입", "강릉 · KTX 2시간(getaway)"], ["2️⃣ 풍경", "백사장 · 소나무 숲 · 서퍼"], ["3️⃣ 계절", "겨울 바다의 분위기(moody)"], ["4️⃣ 특별함", "바다 보이는 커피 거리!"], ["5️⃣ 마무리", "바다+커피 all in one + 정리"]], "scoring": [["접근성부터 말하기", "KTX로 2시간이라는 정보 하나로 위치·거리·교통을 한 번에 해결해요 🚄 여행지 묘사의 정석 오프닝!"], ["계절 버전 묘사", "여름 바다와 겨울 바다를 나눠 말하면 여러 번 가 본 사람의 묘사가 돼요 🌊 공원 편 벚꽃·야경 기술 재활용 🔁"], ["나와 연결된 특별함", "'커피 애호가라서 커피 거리가 특별하다'처럼 특별한 점을 내 정체성과 연결하면 답변이 하나로 묶여요 ☕"], ["콤보 소재 연결", "카페 편의 coffee person 설정이 여행지 선택 이유가 됐어요 🔁 주제가 달라도 나는 한 사람이라는 걸 보여 주세요!"]], "expr": [["travel destination", "여행지", "질문 단어 그대로 받아서 시작 🎯"], ["KTX, our high-speed train", "KTX(고속열차)", "고유명사 + 짧은 설명 = 완벽 소개 공식 🚄"], ["a quick getaway", "짧은 여행, 도피", "trip보다 감성 있는 여행 어휘 ✨"], ["clear blue water", "맑고 파란 바다", "색+상태로 그리는 풍경 기본기 🌊"], ["all year round", "일 년 내내", "빈도 표현의 여행 버전이에요 📅"], ["wild and moody", "거칠고 분위기 있는", "겨울 바다를 두 단어로! 감성 UP 🌫️"], ["coffee street", "커피 거리", "강릉 안목해변의 명물, 카페 편 연결 🔁 ☕"], ["overlooking the ocean", "바다가 내려다보이는", "전망 묘사 필수 분사구예요 👀"], ["it doesn't get better than that", "그보다 좋을 수 없다", "nothing beats의 사촌 표현 🔁 💯"], ["all in one place", "한곳에 전부", "공연 편 all in one show 재활용 🔁"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-061 12. 국내여행(Travel)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-061 12. 국내여행(Travel)_묘사.mp3"}, {"id": "1-062", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "습관", "badge": "62 습관", "enQ": "What do you normally do to get ready before going on a trip? What do you pack in your bag, and what items do you always take with you? Describe your preparation process step by step.", "enA": "Let me walk you through my trip preparation, step by step. It starts a few days early: I book the train and the hotel, then check the weather forecast — that decides everything about what I pack.\n\nThe night before, I pack my bag, and my golden rule is simple: pack light. One backpack, that's it. Clothes for two days, a toiletry pouch, and my three must-haves: a phone charger, a portable battery, and earphones. Oh, and I always make a road-trip playlist the night before — for me, that's when the trip actually begins.\n\nOn the morning of the trip, I do one last idiot check — you know, passport, wallet, phone — okay, for domestic trips, just wallet and phone! Then I head out early to grab coffee at the station. So yeah, that's pretty much my routine, and packing light has never let me down.", "koQ": "여행을 떠나기 전에 준비를 위해 보통 무엇을 하나요? 가방에 무엇을 챙기고, 항상 가져가는 물건은 무엇인가요? 준비 과정을 단계별로 설명해주세요.", "koA": "제 여행 준비 과정을 단계별로 차근차근 말씀드릴게요. 준비는 며칠 전부터 시작돼요. 기차와 숙소를 예약하고, 일기예보를 확인해요. 뭘 챙길지는 날씨가 다 결정하거든요.\n\n전날 밤에는 가방을 싸는데, 제 황금 규칙은 간단해요. 가볍게 싸기. 배낭 하나, 끝이에요. 이틀 치 옷, 세면도구 파우치, 그리고 꼭 챙기는 세 가지. 충전기, 보조배터리, 이어폰이요. 아, 그리고 항상 전날 밤에 여행용 플레이리스트를 만들어요. 저한테는 그때부터가 진짜 여행의 시작이거든요.\n\n여행 당일 아침에는 마지막 점검을 해요. 여권, 지갑, 폰… 아, 국내 여행은 지갑이랑 폰만요! 그러고는 일찍 나가서 역에서 커피를 사요. 네, 이게 제 준비 루틴인데, 가볍게 싸기는 한 번도 저를 실망시킨 적이 없어요.", "struct": [["1️⃣ 도입", "며칠 전: 예약 + 일기예보"], ["2️⃣ 규칙", "가볍게 싸기(pack light)!"], ["3️⃣ 필수템", "충전기 · 보조배터리 · 이어폰"], ["4️⃣ 감성", "전날 밤 플레이리스트 제작"], ["5️⃣ 마무리", "최종 점검 + 역에서 커피"]], "scoring": [["시간 순서 3단계", "며칠 전(예약) → 전날 밤(짐 싸기) → 당일 아침(점검). step by step 질문은 시간축만 잡으면 저절로 풀려요 ⏰"], ["필수템은 딱 3개", "가방 전체를 나열하지 말고 must-haves 3개만 콕 집으세요 ✅ what items do you always take의 정답 구조!"], ["감성 디테일 한 스푼", "플레이리스트를 만들 때부터 여행이 시작된다는 한 줄이 준비 루틴을 이야기로 만들어요 🎵"], ["idiot check 활용", "나가기 전 주머니 두드리며 하는 그 점검이 idiot check예요 😆 시험관이 웃는 고급 구어체!"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "step by step 질문의 정답 오프닝 🔁"], ["weather forecast", "일기예보", "준비 과정의 논리적 첫 단계 ⛅"], ["golden rule", "황금 규칙", "공연·술집·휴가 편 재활용 🔁 나만의 규칙!"], ["pack light", "가볍게 싸다", "여행 습관의 핵심 두 단어! 🎒"], ["toiletry pouch", "세면도구 파우치", "pack 질문의 필수 아이템 어휘 🧴"], ["must-haves", "필수템", "'항상 가져가는 것' 질문의 정답 단어 ✅"], ["portable battery", "보조배터리", "한국인 필수템! 공감 디테일 🔋"], ["road-trip playlist", "여행용 플레이리스트", "음악 편 플레이리스트 재활용 🔁 🎵"], ["idiot check", "마지막 점검", "재치 있는 원어민 관용구! 웃음 포인트 😆"], ["has never let me down", "실망시킨 적이 없다", "never fails의 사촌 표현 🔁 💯"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-062 12. 국내여행(Travel)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-062 12. 국내여행(Travel)_습관.mp3"}, {"id": "1-063", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "취향", "badge": "63 취향", "enQ": "Why do you like domestic trips? Which places do you love visiting the most, and what makes you keep going back there?", "enA": "Why do I like domestic trips? For me, it's all about how easy they are. No flights, no visas, no time difference — I can decide on Friday and be at the beach on Saturday morning. That kind of spontaneity is the whole charm: I can literally travel on a whim.\n\nThe places I love most are small seaside towns, especially on the east coast. And what keeps me coming back? Honestly, the sea itself. I spend all week in the city staring at screens, so standing in front of the ocean feels like someone hit the reset button on my brain.\n\nPlus, every region in Korea has its own famous food, so each trip is half sightseeing, half food tour. When it comes to recharging, a two-day trip to the sea beats a fancy overseas vacation for me — less planning, more resting. That's my taste in a nutshell.", "koQ": "왜 국내 여행을 좋아하나요? 어떤 장소를 방문하는 것을 가장 좋아하고, 무엇이 그곳을 계속 찾게 만드나요?", "koA": "왜 국내 여행을 좋아하냐고요? 저한테는 그 간편함이 전부예요. 비행기도, 비자도, 시차도 없잖아요. 금요일에 결정하고 토요일 아침에 바다에 도착할 수 있어요. 그 즉흥성이 진짜 매력이에요. 말 그대로 내킬 때 바로 떠날 수 있으니까요.\n\n제일 좋아하는 곳은 작은 바닷가 마을들이에요. 특히 동해안이요. 뭐가 저를 계속 가게 만드냐고요? 솔직히 바다 그 자체예요. 일주일 내내 도시에서 화면만 들여다보다가 바다 앞에 서면, 누가 제 머리의 리셋 버튼을 눌러 준 것 같거든요.\n\n게다가 한국은 지역마다 유명한 음식이 있어서, 모든 여행이 절반은 관광, 절반은 먹방 투어예요. 재충전에 관해서라면, 저한테는 1박 2일 바다 여행이 화려한 해외여행을 이겨요. 계획은 덜, 휴식은 더 많으니까요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "핵심 = 간편함 · 즉흥성"], ["2️⃣ 장소", "동해안 바닷가 마을"], ["3️⃣ 이유", "바다 = 리셋 버튼(reset)"], ["4️⃣ 보너스", "지역 음식 = 먹방 투어"], ["5️⃣ 마무리", "계획 덜, 휴식 더 + 정리"]], "scoring": [["No 3연타 오프닝", "no flights, no visas, no time difference처럼 없는 것 세 개를 나열하면 장점이 리듬을 타고 전달돼요 ✨"], ["질문 표현 받아치기", "질문의 keep going back을 keeps me coming back으로 그대로 받으면 정확한 청해력까지 어필돼요 🎯"], ["리셋 버튼 비유", "공원 취향 편의 recharge 논리에 hit the reset button 비유를 얹었어요 🔁 재충전 계열 질문 만능 재료!"], ["해외여행 편 복선", "\"해외보다 국내\"라는 마무리는 뒤에 나올 해외 vs 국내 비교 편의 예고편이 돼요 🔁 콤보 설계의 기술!"]], "expr": [["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 12연속 등장! 🔁 🎯"], ["no flights, no visas, no time difference", "비행기·비자·시차 없음", "no 3연타 리듬으로 장점 나열 ✨"], ["spontaneity", "즉흥성", "국내 여행 매력을 한 단어로! 💫"], ["on a whim", "내킬 때 바로", "요리 취향 편 재활용 🔁 즉흥 표현 정석"], ["keeps me coming back", "계속 찾게 만든다", "질문 표현 그대로 받아치기! 🔁 🎯"], ["hit the reset button", "리셋 버튼을 누르다", "재충전을 그림으로 보여 주는 비유 🔄"], ["staring at screens", "화면만 들여다보기", "공원 취향 편 재활용 🔁 현대인 공감"], ["food tour", "먹방 투어", "한국 여행의 정체성! 음식 디테일 🍜"], ["A beats B", "A가 B를 이긴다", "공연 비교 편 재활용 🔁 취향 선언"], ["less planning, more resting", "계획은 덜, 휴식은 더", "대구 표현으로 취향 요약 💬"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 12연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-063 12. 국내여행(Travel)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-063 12. 국내여행(Travel)_취향.mp3"}, {"id": "1-064", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "과거 경험", "badge": "64 과거 경험", "enQ": "Tell me about the trip that you remember the most. Where did you go and when? What did you see and do there? Why is that trip unforgettable for you?", "enA": "Oh, this reminds me of a New Year's trip to Gangneung two years ago. My best friend and I decided, almost at the last minute, to go see the first sunrise of the year — it's a big tradition in Korea.\n\nWe took a night bus, arrived around 5 a.m., and the beach was already totally packed — thousands of people in the freezing cold. We stood there shivering, holding hot packs. Then the sky slowly turned pink, and when the sun finally broke through the clouds, the whole crowd cheered at once.\n\nI'm not kidding, I had goosebumps — partly from the cold, but mostly from the moment. We shouted our wishes at the sea like little kids: thousands of strangers, one sunrise, one shared hope. Since then, sunrise trips have become our little tradition.", "koQ": "가장 기억에 남는 여행에 대해 말해주세요. 언제 어디로 갔었나요? 그곳에서 무엇을 보고 무엇을 했나요? 왜 그 여행을 잊을 수 없나요?", "koA": "아, 2년 전 새해 강릉 여행이 생각나네요. 절친과 저는 거의 막판에 새해 첫 일출을 보러 가기로 결정했어요. 한국에서는 큰 전통이잖아요.\n\n밤 버스를 타고 새벽 5시쯤 도착했는데, 해변은 이미 사람들로 꽉 차 있었어요. 살을 에는 추위 속에 수천 명이 있었죠. 우리는 핫팩을 쥐고 덜덜 떨었어요. 그러다 하늘이 천천히 분홍빛으로 물들고, 마침내 해가 구름을 뚫고 나오는 순간, 모든 사람이 동시에 환호했어요.\n\n진짜예요, 소름이 돋았어요. 일부는 추위 때문이었지만, 대부분은 그 순간 때문이었죠. 우리는 어린애들처럼 바다에 대고 소원을 외쳤어요. 수천 명의 낯선 사람, 하나의 일출, 하나의 바람. 그래서 잊을 수가 없어요. 그 후로 일출 여행은 우리의 작은 전통이 됐어요.", "struct": [["1️⃣ 도입", "새해 강릉 · 막판 결정"], ["2️⃣ 상황", "밤 버스 · 새벽 5시 · 꽉 찬 해변"], ["3️⃣ 절정", "구름 뚫는 해 · 동시 환호"], ["4️⃣ 감정", "소름 · 소원 외치기"], ["5️⃣ 마무리", "낯선 이들과 하나 된 느낌 + 전통"]], "scoring": [["질문 4요소 순서대로", "어디로·언제(도입) → 무엇을 봤나(일출) → 무엇을 했나(소원) → 왜 못 잊나(감정). 질문 순서가 곧 답변 개요예요 ✅"], ["고생 → 보상 구조", "새벽 추위에 떠는 고생을 먼저 그려야 일출의 감동이 배로 살아나요 🥶 콘서트 티켓팅 3수와 같은 원리 🔁"], ["군중과 하나 되기", "수천 명이 동시에 환호하는 장면은 콘서트 떼창 기술의 여행 버전이에요 🔁 감동 = 나 + 모두의 감정!"], ["전통으로 마무리", "일회성 여행을 our little tradition으로 닫는 것, 이제 세 번째죠? 🔁 경험담 마무리의 필승 패턴!"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["at the last minute", "막판에, 마지막 순간에", "즉흥 여행의 시작을 알리는 표현 ⏰"], ["the first sunrise of the year", "새해 첫 일출", "K-새해 문화 소개 만능 소재 🌅"], ["totally packed", "사람들로 꽉 찬", "상황 설정 단골, 시리즈 재활용 🔁"], ["freezing cold", "살을 에는 추위", "cold의 최상급 버전! 계절감 UP 🥶"], ["shivering", "덜덜 떨며", "몸의 반응으로 추위를 보여 줘요 🧊"], ["break through the clouds", "구름을 뚫고 나오다", "일출 장면의 결정적 동사 ☀️"], ["cheer at once", "동시에 환호하다", "군중 장면 묘사, 콘서트 편과 짝꿍 🔁"], ["goosebumps", "소름", "공연·콘서트 편 재활용 🔁 감동의 증거 🔥"], ["like little kids", "어린애들처럼", "동심 디테일, 휴가 편과 같은 기술 🔁 😆"], ["our little tradition", "우리의 작은 전통", "요리·휴가 편 재활용 🔁 마무리에 딱 💕"]], "audio": "audio/1_서베이/1-064 12. 국내여행(Travel)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-064 12. 국내여행(Travel)_과거 경험.mp3"}, {"id": "1-065", "cat": "survey", "catName": "서베이 질문", "num": 12, "topic": "국내여행", "topicEn": "Travel", "type": "비교", "badge": "65 비교", "enQ": "How has traveling in your country changed compared to when you were young? What was it like back then, and how is it different today? Tell me about the changes.", "enA": "Traveling in Korea has changed so much since I was young. Back then, a trip meant the whole family piling into dad's car with a paper map book — no GPS! We used to stop at every highway rest stop, and honestly, the snacks there were half the fun of the trip.\n\nPlanning was a big deal too. My parents would call hotels directly to book rooms, and we relied on guidebooks to find restaurants.\n\nThese days, it's a completely different story. I book everything on my phone in ten minutes — KTX, hotel, even restaurant waiting lists. Solo trips are totally normal now, and people find hidden spots through social media. Travel became lighter and faster. So yeah, compared to my childhood, trips today are way more convenient — though I have to admit, I sometimes miss those rest-stop snacks.", "koQ": "국내 여행은 당신이 어렸을 때와 비교해 어떻게 변화했나요? 그때는 어땠고, 오늘날은 어떻게 다른가요? 그 변화에 대해 말해주세요.", "koA": "한국에서의 여행은 제가 어릴 때에 비해 정말 많이 변했어요. 그때 여행이란 온 가족이 아빠 차에 우르르 올라타는 거였어요. 종이 지도책과 함께요. GPS가 없었으니까요! 고속도로 휴게소마다 들르곤 했는데, 솔직히 휴게소 간식이 여행 재미의 절반이었어요.\n\n계획 세우기도 큰일이었어요. 부모님이 호텔에 직접 전화해서 방을 예약하셨고, 맛집은 가이드북에 의존해서 찾았죠.\n\n요즘은 완전히 다른 이야기예요. 저는 폰으로 10분이면 다 예약해요. KTX, 호텔, 심지어 식당 웨이팅까지요. 혼자 여행도 이제 아주 흔해졌고, 사람들은 SNS로 숨은 명소를 찾아요. 여행이 더 가볍고 빨라진 거죠. 네, 어린 시절과 비교하면 요즘 여행은 훨씬 편리해요. 그래도 인정할게요, 가끔은 휴게소 간식이 그리워요.", "struct": [["1️⃣ 도입", "변화 인정 (changed so much)"], ["2️⃣ 과거", "가족 차 · 지도책 · 휴게소"], ["3️⃣ 과거", "전화 예약 · 가이드북 의존"], ["4️⃣ 현재", "폰 10분 예약 · 혼행 · SNS"], ["5️⃣ 마무리", "compared to + 그리움 한 스푼"]], "scoring": [["소품으로 시대 그리기", "지도책, 휴게소 간식 — 시대를 보여 주는 소품 두 개면 back then이 저절로 그려져요 🗺️ 음악 편 MP3와 같은 기술 🔁"], ["여행의 단위 변화", "가족 단체 여행 → 혼행이라는 변화는 시설이 아니라 문화의 변화라서 답변의 격을 올려 줘요 🎒"], ["예약 방식 대비", "전화+가이드북 vs 폰 10분. 준비 과정의 대비는 쇼핑 비교 편의 발품 논리와 같은 구조예요 🔁"], ["그리움 마무리", "편리함을 인정하면서도 휴게소 간식이 그립다는 한 줄, 이런 균형이 성숙한 비교의 마침표예요 😊"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 공통 시그널 🔁 🧩"], ["pile into ~", "(차에) 우르르 올라타다", "가족 여행 장면을 그리는 킬러 동사 🚗"], ["map book", "지도책", "GPS 이전 시대를 소환하는 소품 🗺️"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 개근 표현 🔁 💓"], ["highway rest stop", "고속도로 휴게소", "K-여행 문화 디테일! 호두과자 감성 🌰"], ["half the fun", "재미의 절반", "영화·콘서트 편 재활용 🔁 😊"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 시리즈 공통 🔁 🎭"], ["solo trips", "혼자 여행, 혼행", "요즘 여행 문화의 핵심 키워드 🎒"], ["hidden spots", "숨은 명소", "SNS 시대 여행 어휘! tucked away의 사촌 🔁"], ["I have to admit", "인정할게요", "반전 고백 앞에 붙이는 시그널 😊"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"]], "audio": "audio/1_서베이/1-065 12. 국내여행(Travel)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-065 12. 국내여행(Travel)_비교.mp3"}, {"id": "1-066", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "묘사", "badge": "66 묘사", "enQ": "Tell me about a foreign city or country you have been to. Where was it, and what did it look like? What impression did the place leave on you?", "enA": "A foreign city I've been to? Let me tell you about Osaka, Japan — it was actually my first trip abroad, so it holds a special place in my heart.\n\nThe city itself is a fascinating mix. The famous Dotonbori area at night is pure sensory overload — giant neon signs, huge 3D billboards, canals reflecting all those lights, and food stalls everywhere. But then you turn into a side street, and suddenly it's quiet little alleys with tiny old restaurants that only seat five people.\n\nThe impression it left on me? Osaka taught me that traveling isn't really about sightseeing — it's about eating your way through a city! But seriously, what stuck with me was how a place so close to Korea could feel so different. It made the world feel bigger and smaller at the same time. So yeah, that's pretty much my Osaka story.", "koQ": "가본 적 있는 외국 도시나 나라에 대해 말해주세요. 어디였고, 어떤 모습이었나요? 그 장소는 당신에게 어떤 인상을 남겼나요?", "koA": "가 본 외국 도시요? 일본 오사카 이야기를 해 드릴게요. 사실 제 첫 해외여행지라서, 마음속에 특별한 자리를 차지하고 있는 곳이에요.\n\n도시 자체가 매혹적인 혼합체예요. 밤의 그 유명한 도톤보리 거리는 그야말로 감각의 과부하예요. 거대한 네온사인, 큼직한 3D 전광판, 그 불빛을 전부 반사하는 운하, 그리고 어디에나 있는 길거리 음식 가게들이요. 그런데 옆골목으로 들어서면, 갑자기 다섯 명만 앉을 수 있는 작고 오래된 식당들이 있는 조용한 골목이 나와요.\n\n남은 인상이요? 오사카는 여행이 관광이 아니라 도시를 먹으며 누비는 일이라는 걸 가르쳐 줬어요! 농담이고요, 진짜 마음에 남은 건 한국에서 이렇게 가까운 곳이 이렇게 다를 수 있다는 거였어요. 세상이 더 크게, 동시에 더 작게 느껴지게 했죠. 네, 이게 제 오사카 이야기예요.", "struct": [["1️⃣ 도입", "오사카 = 첫 해외여행"], ["2️⃣ 화려함", "도톤보리 네온 · 운하 · 포장마차"], ["3️⃣ 반전", "옆골목의 조용한 노포들"], ["4️⃣ 인상", "가깝지만 완전히 다른 세계"], ["5️⃣ 마무리", "세상이 크고도 작아짐 + 정리"]], "scoring": [["화려함 ↔ 골목 대비", "네온 거리와 조용한 골목을 나란히 놓으면 도시 묘사가 입체적이 돼요 🌃 쇼핑 편 몰↔시장 대비와 같은 기술 🔁"], ["sensory overload 활용", "번화가 묘사는 이 한 단어로 끝나요 ✨ 명동, 홍대, 강남 어디에든 재활용 가능한 IH 어휘!"], ["유머 → 진심 순서", "\"여행 = 먹기\"라는 농담을 던진 뒤 진짜 인상을 말하면 마지막 문장에 무게가 실려요 😆"], ["인상 질문의 정답", "what impression 질문에는 물리적 묘사가 아니라 \"세상이 크고도 작아졌다\" 같은 내 안의 변화로 답하세요 🌏"]], "expr": [["first trip abroad", "첫 해외여행", "특별한 이유를 자동 완성하는 설정 ✈️"], ["hold a special place in my heart", "마음속 특별한 자리를 차지하다", "애정 표현의 최고급 관용구 💕"], ["a fascinating mix", "매혹적인 혼합", "도시의 양면성을 예고하는 오프닝 ✨"], ["sensory overload", "감각의 과부하", "번화가 묘사 킬러 표현! IH 어휘 🌃"], ["neon signs", "네온사인", "도톤보리 하면 이 단어! 시각 디테일 💡"], ["side street / alleys", "옆골목 / 골목길", "화려함 뒤의 반전 장면 전환 🏮"], ["eat your way through ~", "~을 먹으면서 여행하다", "먹방 여행의 유쾌한 관용구 🍜"], ["stuck with me", "마음에 남았다", "영화 경험 편 재활용 🔁 인상 질문 정답"], ["at the same time", "동시에", "모순된 감정을 묶는 연결어 🔗"], ["bigger and smaller at the same time", "더 크고도 작게", "여행 소감의 명언형 마무리 🌏"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-066 13. 해외여행(Overseas)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-066 13. 해외여행(Overseas)_묘사.mp3"}, {"id": "1-067", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "습관", "badge": "67 습관", "enQ": "How do you usually prepare for an overseas trip? What do you do beforehand, and what do you pack in your suitcase? Tell me everything you do before leaving in detail.", "enA": "Overseas trips need way more prep than domestic ones, so let me walk you through it. First things first: the paperwork. I check my passport expiration date — I learned that the hard way — then book flights, reserve hotels, and set up an eSIM for data.\n\nAbout a week before, I handle money: I exchange some cash and double-check that my cards work abroad. I also make a rough day-by-day plan — nothing strict, just the must-see spots.\n\nAs for my suitcase, here's my rule: I only fill it halfway. Why? Because the other half is for shopping and souvenirs on the way back — I know myself too well! Besides clothes, my must-haves are a universal adapter, basic medicine, and a document pouch. So yeah, that's pretty much my pre-trip routine — half planning, half daydreaming.", "koQ": "해외 여행을 어떻게 준비하나요? 미리 무엇을 하고, 캐리어에는 무엇을 챙기나요? 떠나기 전에 하는 모든 일을 자세히 말해주세요.", "koA": "해외여행은 국내 여행보다 준비할 게 훨씬 많아요. 차근차근 말씀드릴게요. 뭐니 뭐니 해도 첫째는 서류예요. 여권 만료일부터 확인하고요. 이건 한 번 고생하고 배웠어요. 그다음 항공권 예약, 호텔 예약, 데이터용 eSIM 준비까지 해요.\n\n일주일쯤 전에는 돈 문제를 처리해요. 현금을 약간 환전하고, 카드가 해외에서 되는지 다시 확인해요. 대략적인 일정표도 만들어요. 빡빡하게는 말고, 꼭 볼 곳 정도만요.\n\n캐리어로 말하자면, 저만의 규칙이 있어요. 절반만 채우기. 왜냐고요? 나머지 절반은 돌아올 때 쇼핑과 기념품을 위한 공간이거든요. 제가 저를 너무 잘 알아요! 옷 말고 필수템은 멀티 어댑터, 상비약, 그리고 서류 파우치예요. 네, 이게 제 여행 전 루틴이에요. 절반은 계획, 절반은 설렘이죠.", "struct": [["1️⃣ 도입", "서류부터! 여권 만료일 확인"], ["2️⃣ 예약", "항공 · 호텔 · eSIM"], ["3️⃣ 자금", "환전 · 카드 확인 · 일정표"], ["4️⃣ 캐리어", "절반만 채우기(쇼핑 공간!)"], ["5️⃣ 마무리", "필수템 3종 + 설렘 마무리"]], "scoring": [["서류 → 돈 → 짐 순서", "해외여행 준비는 이 3단 논리 순서면 절대 안 꼬여요 🛂 국내 편(시간 순서)과 다른 축을 쓰는 게 포인트!"], ["절반 캐리어 유머", "\"쇼핑 공간을 위해 절반만 채운다 + I know myself too well\" 콤보는 시험관이 반드시 웃는 조합이에요 😆"], ["국내 편과 차별화", "같은 준비 질문이라도 국내(가볍게)와 해외(꼼꼼하게)를 다르게 그리면 콤보에서 겹치지 않아요 🔁"], ["실수담 한 줄 삽입", "여권 만료일에 learned the hard way를 붙이면 과거 실수까지 암시돼요 😅 디테일에 역사가 생기는 기술!"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 시리즈 개근 🔁"], ["First things first", "뭐니 뭐니 해도 첫째는", "조깅·요리 편 재활용 🔁 우선순위!"], ["passport expiration date", "여권 만료일", "해외여행 준비의 넘버원 디테일 🛂"], ["learn ~ the hard way", "고생하며 배우다", "조깅 안전 편 재활용 🔁 경험자 인증 😅"], ["eSIM", "eSIM(데이터)", "요즘 여행 준비의 필수 신조어 📱"], ["day-by-day plan", "일자별 일정표", "day-by-day = 하루 단위. 계획 어휘 📅"], ["fill it halfway", "절반만 채우다", "캐리어 질문의 킬러 답변! 🧳"], ["shopping and souvenirs", "쇼핑과 기념품", "절반 비우는 이유 = 유머 포인트 😆"], ["universal adapter", "멀티 어댑터", "pack 질문 필수템 어휘 🔌"], ["I know myself too well", "내가 나를 너무 잘 알죠", "자기 인식 유머의 정석! 😆"], ["half planning, half daydreaming", "절반은 계획, 절반은 설렘", "대구 마무리, 여행 편 전용 ✨"]], "audio": "audio/1_서베이/1-067 13. 해외여행(Overseas)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-067 13. 해외여행(Overseas)_습관.mp3"}, {"id": "1-068", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "취향", "badge": "68 취향", "enQ": "Which country would you most like to travel to, and why? What attracts you to that place - the food, the scenery, or the culture? Tell me the reasons in detail.", "enA": "The country at the top of my bucket list? Italy, without a second of hesitation. And if I had to choose one reason among food, scenery, and culture — it's all about the food for me.\n\nYou might remember I cook pasta at home — well, that's exactly why! I want to taste the real thing: fresh pasta in Rome, pizza in Naples, gelato... basically, I want to eat my way through the whole country. I've watched so many Italian food documentaries that I feel like I've already been there in spirit.\n\nOf course, the scenery and culture matter too — the old cities, the coast, the relaxed way of life where a meal takes three hours. Honestly, that unhurried culture is what my life is missing! So yeah, when it comes to dream destinations, nothing beats Italy for me. That's my taste in a nutshell.", "koQ": "가장 여행 가고 싶은 나라는 어디이고, 그 이유는 무엇인가요? 음식, 풍경, 문화 중 무엇이 그곳에 끌리게 하나요? 그 이유를 자세히 말해주세요.", "koA": "제 버킷리스트 1순위 나라요? 이탈리아요. 1초의 망설임도 없어요. 그리고 음식, 풍경, 문화 중 하나만 골라야 한다면, 저한테는 음식이 전부예요.\n\n제가 집에서 파스타를 만든다고 했던 거 기억하실 거예요. 바로 그게 이유예요! 진짜를 맛보고 싶거든요. 로마의 생면 파스타, 나폴리의 피자, 젤라토까지. 한마디로 나라 전체를 먹으면서 여행하고 싶어요. 이탈리아 음식 다큐멘터리를 하도 많이 봐서, 마음으로는 이미 다녀온 기분이에요.\n\n물론 풍경과 문화도 중요해요. 오래된 도시들, 해안, 그리고 식사 한 끼에 세 시간이 걸리는 그 여유로운 삶의 방식이요. 솔직히 그 서두르지 않는 문화가 제 삶에 없는 바로 그거예요! 네, 꿈의 여행지에 관해서라면 저한테는 이탈리아만 한 곳이 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "버킷리스트 1위 = 이탈리아"], ["2️⃣ 선택", "3개 중 음식(it's all about)"], ["3️⃣ 이유", "파스타 본토 맛(요리 편 연결!)"], ["4️⃣ 보조", "풍경 · 3시간 식사 문화"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["요리 편과 연결", "\"집에서 파스타를 만든다고 했죠?\"라며 요리 편을 소환하면 시험 전체가 하나의 이야기가 돼요 🔁 콤보의 정점!"], ["3택 질문 공식", "음식·풍경·문화 중 하나를 고르되 나머지 둘도 스치는 구조, 카페 취향 편부터 이어 온 공식이에요 🔁 ✅"], ["도시별 음식 나열", "로마 파스타, 나폴리 피자처럼 도시+음식을 짝지으면 조사해 본 사람의 답변처럼 들려요 🍕"], ["부러운 문화 = 내 결핍", "\"3시간 식사 문화가 내 삶에 없는 것\"이라는 연결이 왜 끌리는지를 가장 깊게 설명해 줘요 💭"]], "expr": [["bucket list", "버킷리스트", "꿈의 여행지 질문 만능 오프닝 ✈️"], ["without a second of hesitation", "1초의 망설임도 없이", "확신을 보여 주는 강조 표현 💯"], ["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 🔁"], ["it's all about the food", "음식이 전부다", "질문의 3택 중 하나를 콕! 🔁 🎯"], ["the real thing", "진짜, 본토의 것", "조깅 경험 편 재활용 🔁 본토 맛 강조"], ["eat my way through ~", "~을 먹으면서 여행하다", "오사카 편 재활용 🔁 🍝"], ["already been there in spirit", "마음으로는 이미 다녀온", "덕후 인증 유머 표현 😆"], ["way of life", "삶의 방식", "문화를 이야기할 때의 격조 있는 어휘 ✨"], ["what my life is missing", "내 삶에 없는 바로 그것", "동경의 이유를 나와 연결하는 표현 💭"], ["nothing beats ~", "~만 한 게 없다", "취향 마무리, 시리즈 개근 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 13연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-068 13. 해외여행(Overseas)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-068 13. 해외여행(Overseas)_취향.mp3"}, {"id": "1-069", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "과거 경험", "badge": "69 과거 경험", "enQ": "Tell me about an unforgettable experience from one of your trips abroad. Perhaps something funny, surprising, or embarrassing happened. What was it, and how did you handle it? Tell me the full story.", "enA": "Oh, this reminds me of an embarrassing moment from my Osaka trip. On the last night, my friend and I took the subway back to our hotel — or so we thought. Guess what? We'd taken the train going in the opposite direction.\n\nWe only realized it thirty minutes later, when the train reached the end of the line — some quiet suburban station we'd never heard of. It was almost midnight, our phone batteries were nearly dead, and neither of us spoke Japanese. To be honest, I was a little panicked.\n\nBut here's the thing: an old Japanese couple noticed us looking lost. Using a translation app and lots of hand gestures, they walked us to the right platform and even waited until our train came. We just kept bowing like crazy! In the end, everything worked out fine, and honestly, getting lost became my favorite memory of the whole trip. Since then, I always double-check the train direction — and I trust the kindness of strangers a lot more.", "koQ": "해외 여행 중 겪은 잊을 수 없는 경험에 대해 말해주세요. 웃기거나 놀랍거나 당황스러운 일이 있었을 수도 있습니다. 무슨 일이었고, 어떻게 대처했나요? 전체 이야기를 들려주세요.", "koA": "아, 오사카 여행에서 겪은 당황스러운 순간이 생각나네요. 마지막 날 밤, 친구와 저는 호텔로 돌아가는 지하철을 탔어요. 그런 줄 알았죠. 그런데 있잖아요, 우리는 반대 방향 열차를 탔던 거예요.\n\n30분이 지나서야 알아차렸어요. 열차가 종점에 도착했을 때요. 이름도 들어 본 적 없는 조용한 교외 역이었어요. 자정이 다 됐고, 폰 배터리는 거의 없고, 둘 다 일본어를 못 했어요. 솔직히 좀 당황했어요.\n\n그런데 반전이 있어요. 일본인 노부부가 길을 잃고 헤매는 우리를 알아챈 거예요. 번역 앱과 수많은 손짓을 동원해서 우리를 맞는 승강장까지 데려다주셨고, 심지어 우리 열차가 올 때까지 기다려 주셨어요. 우리는 미친 듯이 인사만 했죠! 결국 모든 게 잘 해결됐고, 솔직히 길을 잃은 게 그 여행 전체에서 제일 좋아하는 추억이 됐어요. 그 후로는 항상 열차 방향을 두 번 확인해요. 그리고 낯선 사람의 친절을 훨씬 더 믿게 됐어요.", "struct": [["1️⃣ 도입", "오사카 마지막 밤 · 지하철"], ["2️⃣ 문제", "반대 방향 → 종점 · 자정"], ["3️⃣ 위기", "배터리 부족 · 언어 장벽"], ["4️⃣ 반전", "노부부의 친절 · 번역 앱"], ["5️⃣ 마무리", "최애 추억 + 이중 교훈"]], "scoring": [["위기 4종 쌓기", "종점+자정+배터리+언어 장벽까지, 위기를 겹겹이 쌓을수록 도움받는 장면의 감동이 커져요 🪫 쇼핑 경험 편 기술 🔁"], ["질문 힌트 그대로", "질문이 embarrassing을 예시로 줬으니 당황스러운 이야기로 받는 게 가장 안전한 선택이에요 ✅ 술집 편과 같은 전략 🔁"], ["사람으로 반전 만들기", "해결책이 앱이나 운이 아니라 노부부의 친절이라는 점이 이 이야기를 특별하게 만들어요 💕"], ["교훈 두 개로 마무리", "실용 교훈(방향 확인) + 마음 교훈(친절 신뢰)의 이중 마무리는 경험담 마침표의 최고급 버전이에요 ✅"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["or so we thought", "그런 줄 알았죠", "반전 예고의 세련된 한 마디 😏"], ["in the opposite direction", "반대 방향으로", "길 잃기 스토리의 필수 표현 🚇"], ["the end of the line", "종점", "상황의 심각성을 알리는 디테일 🛤️"], ["nearly dead (battery)", "(배터리가) 거의 없는", "위기 요소 쌓기의 현대적 디테일 🪫"], ["a little panicked", "살짝 당황한", "경험 편 감정 표현, 시리즈 개근 🔁 😅"], ["here's the thing", "그런데 반전이 있어요", "이야기의 방향을 트는 필러 ✨"], ["translation app / hand gestures", "번역 앱 / 손짓", "언어 장벽 해결의 현실 콤보 🙌"], ["bow like crazy", "미친 듯이 인사하다", "like crazy 재활용 🔁 감사 장면 유머 😆"], ["everything worked out fine", "결국 다 잘 해결됐다", "해피엔딩 공식, 시리즈 공통 🔁 ✨"], ["the kindness of strangers", "낯선 사람들의 친절", "여행 경험담의 최고급 마무리 주제 💕"]], "audio": "audio/1_서베이/1-069 13. 해외여행(Overseas)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-069 13. 해외여행(Overseas)_과거 경험.mp3"}, {"id": "1-070", "cat": "survey", "catName": "서베이 질문", "num": 13, "topic": "해외여행", "topicEn": "Overseas", "type": "비교", "badge": "70 비교", "enQ": "Compare traveling abroad with traveling in your own country. What are the biggest differences between the two? Which one do you find more enjoyable, and why?", "enA": "Interesting question, because I love both — but they're completely different experiences. The biggest difference, for me, is effort versus comfort.\n\nTraveling abroad takes real effort: flights, passports, currency, language barriers. But that effort buys you something priceless — everything feels brand new. Even a convenience store becomes an adventure! Domestic trips, on the other hand, are effortless. No planning stress, no jet lag — just pure rest. One is like an exciting movie; the other is like your favorite comfort food.\n\nSo which do I enjoy more? It depends on what I need. For inspiration, nothing beats going abroad — those trips stick with me for years. But when I need to recharge, I choose a Korean beach town. If I had to pick one, domestic wins — I can do it ten times more often. Quantity has a quality of its own, right?", "koQ": "해외 여행과 국내 여행을 비교해주세요. 둘 사이의 가장 큰 차이점은 무엇인가요? 어느 쪽이 더 즐겁고, 그 이유는 무엇인가요?", "koA": "흥미로운 질문이네요. 저는 둘 다 좋아하는데, 완전히 다른 경험이거든요. 저한테 가장 큰 차이는 '노력 대 편안함'이에요.\n\n해외여행은 진짜 노력이 들어가요. 비행기, 여권, 환전, 언어 장벽까지요. 하지만 그 노력이 값을 매길 수 없는 걸 안겨 줘요. 모든 게 완전히 새롭게 느껴진다는 거요. 편의점 가는 것도 모험이 되잖아요! 반면 국내 여행은 힘이 하나도 안 들어요. 계획 스트레스도, 시차도 없이 순수한 휴식만 있죠. 하나는 신나는 영화 같고, 다른 하나는 최애 컴포트 푸드 같아요.\n\n그래서 어느 쪽이 더 즐겁냐고요? 뭐가 필요하냐에 따라 달라요. 영감이 필요할 때는 해외만 한 게 없어요. 그런 여행은 몇 년씩 마음에 남거든요. 하지만 재충전이 필요할 때는 한국의 바닷가 마을을 선택해요. 굳이 하나만 골라야 한다면 국내 여행의 승리예요. 열 배는 더 자주 갈 수 있으니까요. 양도 그 자체로 질이 되는 법이잖아요?", "struct": [["1️⃣ 도입", "차이 = 노력 vs 편안함"], ["2️⃣ 해외", "노력 → 모든 게 새로움"], ["3️⃣ 국내", "무노력 · 순수한 휴식"], ["4️⃣ 비유", "신나는 영화 vs 컴포트 푸드"], ["5️⃣ 마무리", "상황별 답 + 최종 선택(국내)"]], "scoring": [["A vs B형 비교 주의", "이건 과거·현재가 아니라 대상 간 비교예요. Back then 대신 on the other hand 축을 쓰세요 🔄 요리 비교 편과 동일 🔁"], ["비유 한 쌍 준비", "\"신나는 영화 vs 컴포트 푸드\"처럼 비유를 쌍으로 만들면 차이가 감각적으로 전달돼요 🎬"], ["'어느 쪽?' 질문엔 답하기", "which one 질문에 \"둘 다 좋아요\"로 끝내면 감점 요인! 상황별로 나눈 뒤 최종 선택까지 해 주세요 ✅"], ["명언으로 마무리", "\"Quantity has a quality of its own\"처럼 재치 있는 인용 한 줄이면 IH다운 마침표가 완성돼요 😎"]], "expr": [["The biggest difference is ~", "가장 큰 차이는 ~이다", "요리 비교 편 재활용 🔁 A vs B 뼈대 🧩"], ["effort versus comfort", "노력 대 편안함", "비교 축을 세 단어로 선언! ✨"], ["language barriers", "언어 장벽", "해외여행 어려움의 대표 어휘 🗣️"], ["everything feels brand new", "모든 게 완전히 새롭다", "해외여행의 매력을 한 문장으로 🌏"], ["on the other hand", "반면에", "나라·대상 비교의 전환 시그널 🔁 🔄"], ["comfort food", "컴포트 푸드(위안 음식)", "국내 여행을 비유로! 영화 취향 편 사촌 🔁"], ["inspiration", "영감", "해외여행이 주는 것을 한 단어로 💡"], ["stick with me", "마음에 남다", "영화·오사카 편 재활용 🔁"], ["recharge", "재충전하다", "공원·휴가 편 재활용 🔁 🔋"], ["If I had to pick", "굳이 하나를 골라야 한다면", "if I had to choose의 변형 🔁"], ["Quantity has a quality of its own", "양도 그 자체로 질이 된다", "재치 있는 명언형 마무리! 😎"]], "audio": "audio/1_서베이/1-070 13. 해외여행(Overseas)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-070 13. 해외여행(Overseas)_비교.mp3"}, {"id": "1-071", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "묘사", "badge": "71 묘사", "enQ": "Describe your home for me. What does it look like, and how many rooms are there? Tell me about your house in detail.", "enA": "I live in a two-bedroom apartment on the tenth floor — pretty typical for Korea, where most people live in apartment complexes. It's not huge, but it's just the right size for me.\n\nLet me give you a quick tour. When you walk in, the living room opens up right in front of you — that's the heart of my home, with my beloved gray couch by the window. The kitchen is connected to it, so I can watch shows while cooking. Then there are two rooms: my bedroom, and a smaller room I use as a bit of everything — part closet, part home office.\n\nMy favorite thing about this place is the natural light. It faces south, so on sunny days I don't even need the lights on. It's simple and small, but every corner is exactly the way I like it. So yeah, that's pretty much my home sweet home.", "koQ": "당신의 집을 묘사해주세요. 어떻게 생겼고, 방은 몇 개인가요? 당신의 집에 대해 자세히 말해주세요.", "koA": "저는 10층에 있는 방 두 개짜리 아파트에 살아요. 한국에서는 아주 전형적인 형태죠. 대부분 아파트 단지에 사니까요. 크진 않지만 저한테는 딱 맞는 크기예요.\n\n간단히 투어를 시켜 드릴게요. 들어서면 바로 앞에 거실이 펼쳐져요. 우리 집의 심장이죠. 창가에는 제가 아끼는 회색 소파가 있고요. 주방이 거실과 연결되어 있어서 요리하면서 방송도 볼 수 있어요. 그리고 방이 두 개 있는데, 하나는 침실이고, 작은 방은 반은 옷방, 반은 홈오피스인 만능 방으로 써요.\n\n이 집에서 제일 좋아하는 건 채광이에요. 남향이라 맑은 날에는 불을 켤 필요도 없어요. 소박하고 작지만, 구석구석이 정확히 제가 좋아하는 모습이에요. 네, 이게 저의 스위트홈이에요.", "struct": [["1️⃣ 도입", "10층 투룸 아파트 · 한국 전형"], ["2️⃣ 투어", "거실(소파!) + 연결된 주방"], ["3️⃣ 방", "침실 + 만능 방(옷방·오피스)"], ["4️⃣ 자랑", "남향 채광(natural light)"], ["5️⃣ 마무리", "home sweet home 정리"]], "scoring": [["투어 형식으로 묘사", "\"Let me give you a quick tour\"로 현관→거실→방 순서로 걸으며 묘사하면 절대 길을 잃지 않아요 🚪 영화관 동선 기술 🔁"], ["방 개수 질문 정면 대응", "how many rooms를 물었으니 two-bedroom + 각 방의 용도까지 말해야 완전한 답이에요 ✅"], ["남향 문화 소개", "faces south는 한국인의 집 자랑 1순위죠 ☀️ 채광 이야기는 시험관에게도 신선한 K-디테일이에요!"], ["휴가 편과 연결", "회색 소파와 거실 = 휴가 편의 그 공간이에요 🔁 집 콤보에서 같은 집이 반복 등장하면 진짜처럼 들려요!"]], "expr": [["two-bedroom apartment", "방 두 개짜리 아파트", "집 구조를 한 단어로! 필수 표현 🏠"], ["apartment complexes", "아파트 단지", "K-주거 문화 소개 어휘예요 🏢"], ["just the right size", "딱 맞는 크기", "작음을 장점으로 뒤집는 표현 ✅"], ["Let me give you a quick tour", "간단히 투어시켜 드릴게요", "집 묘사의 만능 오프닝! 동선 예고 🚪"], ["the heart of my home", "우리 집의 심장", "휴가 묘사 편 재활용 🔁 💛"], ["a bit of everything", "만능(이것저것 다 하는)", "작은 방 소개의 재치 표현 😊"], ["natural light", "자연 채광", "집 자랑 1순위 어휘! ☀️"], ["face south", "남향이다", "K-부동산 최대 관심사를 영어로! 🧭"], ["exactly the way I like it", "정확히 내 취향대로", "애정을 담는 마무리 직전 표현 💕"], ["home sweet home", "즐거운 나의 집", "집 묘사 전용 클래식 마무리 🏡"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-071 14. 집(Home)_묘사1.mp3", "label": "묘사 1", "qaudio": "audio_q/1_서베이/1-071 14. 집(Home)_묘사1.mp3"}, {"id": "1-072", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "묘사", "badge": "72 묘사", "enQ": "Describe your bedroom for me. How is it decorated, and what things do you keep in there? Please explain what your bedroom looks like in detail.", "enA": "My bedroom? It's honestly the simplest room in my home — and that's by design. I keep it minimal on purpose, because for me, the bedroom is for one thing only: quality sleep.\n\nThe colors are all soft — white walls, wooden furniture, and beige bedding. The bed takes up most of the space, and I invested in a really good mattress — zero regrets there! I also have blackout curtains, which are a total game changer for sleeping in on weekends. On the bedside table, there's just a small lamp, a book, and my phone charger.\n\nThe one decoration I allowed myself is a photo wall — a little collage of pictures from my trips with friends. It's the last thing I see before I sleep. So yeah, that's pretty much my bedroom: nothing fancy, but exactly the way I like it.", "koQ": "당신의 침실을 묘사해주세요. 어떻게 꾸며져 있고, 그곳에 어떤 물건들을 두나요? 침실이 어떻게 생겼는지 자세히 설명해주세요.", "koA": "제 침실이요? 솔직히 우리 집에서 제일 단순한 방인데, 그건 의도된 거예요. 일부러 미니멀하게 유지하거든요. 저한테 침실은 오직 한 가지, 질 좋은 잠을 위한 공간이니까요.\n\n색은 전부 부드러운 톤이에요. 흰 벽, 원목 가구, 베이지색 침구요. 침대가 공간의 대부분을 차지하는데, 정말 좋은 매트리스에 투자했어요. 후회는 전혀 없어요! 암막커튼도 있는데, 주말 늦잠에는 완전 게임 체인저예요. 침대 옆 테이블에는 작은 램프, 책 한 권, 폰 충전기만 있어요.\n\n제가 허락한 유일한 장식은 사진 벽이에요. 친구들과의 여행 사진을 모아 붙인 작은 콜라주요. 잠들기 전 마지막으로 보는 게 그 사진들이에요. 네, 제 침실은 대체로 이래요. 대단할 건 없지만, 정확히 제 취향대로예요.", "struct": [["1️⃣ 도입", "미니멀 = 의도(by design)"], ["2️⃣ 색감", "흰 벽 · 원목 · 베이지 침구"], ["3️⃣ 투자", "좋은 매트리스 · 암막커튼"], ["4️⃣ 장식", "여행 사진 벽(photo wall)"], ["5️⃣ 마무리", "차분하고 조용한 내 취향"]], "scoring": [["미니멀에 이유 달기", "\"단순한 방\"으로 끝내지 말고 \"잠을 위해 의도적으로\"라는 철학을 붙이면 묘사에 관점이 생겨요 😴"], ["물건 3+1 구조", "기본 물건 셋(램프·책·충전기)에 특별한 하나(사진 벽)를 얹는 구조가 what things 질문의 정석이에요 ✅"], ["투자템 자랑하기", "매트리스 + zero regrets, 암막커튼 + game changer처럼 아이템마다 리액션을 붙이면 목록이 이야기가 돼요 💯"], ["사진 벽 스토리", "여행 사진 콜라주는 여행 편들과 연결되는 디테일이에요 🔁 잠들기 전 마지막 풍경이라는 감성까지!"]], "expr": [["by design", "의도된 것", "단순함 = 계획임을 알리는 반전 ✨"], ["minimal on purpose", "일부러 미니멀하게", "요즘 인테리어 감성 + 이유 제시 🤍"], ["quality sleep", "질 좋은 잠", "침실 철학을 두 단어로! 😴"], ["wooden furniture", "원목 가구", "색감 묘사의 기본 아이템 🪵"], ["zero regrets", "후회 제로", "투자 아이템 자랑 유머 표현 💯"], ["blackout curtains", "암막커튼", "수면 덕후 인증 디테일! 🌙"], ["game changer", "게임 체인저", "주방 묘사 편 재활용 🔁 최애템 강조"], ["sleep in", "늦잠 자다", "휴가 습관 편 재활용 🔁 🛌"], ["bedside table", "침대 옆 테이블", "침실 묘사 필수 가구 어휘 🛏️"], ["photo wall", "사진 벽", "물건에 이야기를 담는 킬러 장식 📸"], ["the last thing I see before I sleep", "잠들기 전 마지막으로 보는 것", "감성 마무리 문장 틀 💕"]], "audio": "audio/1_서베이/1-072 14. 집(Home)_묘사2.mp3", "label": "묘사 2", "qaudio": "audio_q/1_서베이/1-072 14. 집(Home)_묘사2.mp3"}, {"id": "1-073", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "습관", "badge": "73 습관", "enQ": "Tell me about what you usually do at home. How do your weekday activities differ from your weekend ones? Describe your daily routine at home.", "enA": "My life at home is a tale of two versions: weekday me and weekend me. Let me walk you through both.\n\nOn weekdays, home is basically my recharging station. I get back from work around seven, cook a simple dinner — usually something quick like fried rice — and eat while watching an episode. After that, I tidy up a bit, take a long shower, and wind down with quiet music. Nothing exciting, but that routine keeps me sane.\n\nWeekends are a completely different story. Saturday morning starts with a big cleaning session — laundry, vacuuming, the whole reset ritual. A clean house makes the weekend feel twice as long! Then the couch takes over: movies, snacks, sometimes friends coming over for chimaek. So yeah, weekdays are for surviving, weekends are for living.", "koQ": "집에서 주로 무엇을 하는지 말해주세요. 평일 활동과 주말 활동은 어떻게 다른가요? 집에서의 하루 일과를 설명해주세요.", "koA": "제 집 생활은 두 가지 버전의 이야기예요. 평일의 나와 주말의 나요. 둘 다 차근차근 말씀드릴게요.\n\n평일에 집은 기본적으로 저의 충전소예요. 7시쯤 퇴근해서 간단한 저녁을 만들어요. 보통 볶음밥처럼 빨리 되는 걸로요. 뭔가 한 편을 보면서 먹고요. 그 후엔 가볍게 정리하고, 오래 샤워하고, 잔잔한 음악으로 긴장을 풀어요. 신나는 건 없지만, 그 루틴이 저를 제정신으로 유지해 줘요.\n\n주말은 완전히 다른 이야기예요. 토요일 아침은 대청소로 시작해요. 빨래에 청소기 돌리기까지, 완전한 리셋 의식이죠. 집이 깨끗하면 주말이 두 배로 길게 느껴져요! 그다음은 소파가 접수해요. 영화, 간식, 가끔은 친구들이 치맥 하러 놀러 오고요. 네, 평일은 버티는 날, 주말은 사는 날이에요.", "struct": [["1️⃣ 도입", "평일의 나 vs 주말의 나"], ["2️⃣ 평일", "저녁 요리 · 한 편 시청 · 정리"], ["3️⃣ 밤", "샤워 · 음악으로 wind down"], ["4️⃣ 주말", "대청소 리셋 → 소파 점령"], ["5️⃣ 마무리", "버티기 vs 살기 + 정리 멘트"]], "scoring": [["두 버전 선언 오프닝", "\"weekday me and weekend me\"로 시작하면 평일·주말 차이 질문의 구조가 첫 문장에 완성돼요 📖"], ["평범함 + 자기 인식", "\"신나는 건 없지만 keeps me sane\"처럼 평범한 루틴을 자기 인식으로 포장하면 IH다워져요 😆"], ["청소 = 리셋 의식", "지루한 집안일도 reset ritual이라고 이름 붙이면 이야깃거리가 돼요 ✨ 조깅 편 little ritual 재활용 🔁"], ["대구 명언 마무리", "surviving vs living처럼 두 단어로 평일·주말을 정리하는 마무리, 통째로 외워 둘 가치가 있어요 💬"]], "expr": [["a tale of two versions", "두 가지 버전의 이야기", "평일↔주말 대비를 예고하는 오프닝 📖"], ["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 시리즈 개근 🔁"], ["recharging station", "충전소", "평일 집의 정체성을 비유로! 🔋"], ["tidy up", "정리하다", "clean보다 가벼운 정돈 뉘앙스 🧹"], ["wind down", "긴장을 풀다", "음악 습관 편 재활용 🔁 저녁 루틴 필수"], ["keep me sane", "제정신으로 유지해 주다", "루틴 예찬의 유머 표현 😆"], ["a completely different story", "완전히 다른 이야기", "비교 시그널을 습관에 활용 🔁 🎭"], ["reset ritual", "리셋 의식", "청소를 의식으로! 명명법 기술 🔁 ✨"], ["twice as long", "두 배로 길게", "배수 표현으로 효과 강조 📏"], ["come over", "(우리 집에) 놀러 오다", "휴가 습관 편 재활용 🔁 🏠"], ["weekdays are for surviving, weekends are for living", "평일은 버티기, 주말은 살기", "대구 명언 마무리! 💬"]], "audio": "audio/1_서베이/1-073 14. 집(Home)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-073 14. 집(Home)_습관.mp3"}, {"id": "1-074", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "취향", "badge": "74 취향", "enQ": "Which room in your house do you like the most, and why? What do you enjoy doing in that room? Tell me why that space is your favorite.", "enA": "If I had to choose, my favorite space is definitely the living room — no contest. You could say I don't really live in my apartment; I live in my living room!\n\nFor me, it's all about that couch by the window. Everything good happens there: movie nights, chimaek with friends, lazy Sunday naps, even my home vacations. The natural light pouring through the big window makes it the brightest, warmest spot in the house — my plants love it there too, by the way.\n\nBut the real reason it's my favorite? It's the only room with zero pressure. The bedroom says \"sleep,\" the kitchen says \"cook,\" my desk says \"work\" — but the living room doesn't ask me for anything. I can just be. When it comes to my home, nothing beats that couch by the window. That's my taste in a nutshell.", "koQ": "집에서 어떤 방을 가장 좋아하고, 그 이유는 무엇인가요? 그 방에서 무엇을 하는 것을 즐기나요? 왜 그 공간이 가장 좋은지 말해주세요.", "koA": "굳이 골라야 한다면, 제 최애 공간은 단연 거실이에요. 경쟁 상대가 없어요. 저는 아파트에 사는 게 아니라 거실에 산다고 해도 될 정도예요!\n\n저한테는 창가의 그 소파가 전부예요. 좋은 일은 전부 거기서 일어나거든요. 영화의 밤, 친구들과의 치맥, 게으른 일요일 낮잠, 심지어 집 휴가까지요. 큰 창으로 쏟아지는 햇살 덕분에 집에서 가장 밝고 따뜻한 자리이기도 해요. 참고로 제 식물들도 거기를 제일 좋아해요.\n\n그런데 진짜 좋아하는 이유요? 압박이 전혀 없는 유일한 방이라서예요. 침실은 '자라'고 하고, 주방은 '요리하라'고 하고, 책상은 '일하라'고 하잖아요. 근데 거실은 저한테 아무것도 요구하지 않아요. 그냥 존재해도 되는 곳이죠. 우리 집에 관해서라면, 창가의 그 소파만 한 게 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "최애 = 거실(no contest)"], ["2️⃣ 활동", "영화 · 치맥 · 낮잠 · 집 휴가"], ["3️⃣ 환경", "햇살 · 가장 따뜻한 자리"], ["4️⃣ 진짜 이유", "압박 제로 · 그냥 존재하기"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["활동 목록 = 시리즈 요약", "영화·치맥·낮잠·집 휴가 — 앞 주제들의 활동이 전부 거실로 모여요 🔁 콤보 전체를 한 방에 묶는 페이지!"], ["의인화 기술", "\"침실은 자라고, 주방은 요리하라고 말한다\"는 의인화가 이 답변의 하이라이트예요 🗣️ 어휘 점수 만점 기술!"], ["물리적 이유 + 철학적 이유", "햇살(물리) → 압박 제로(철학) 순서로 이유를 깊게 파고들면 why 질문의 모범 답안이 돼요 ✨"], ["식물 한 줄 디테일", "\"식물들도 거기를 좋아해요\" 같은 여담 한 줄이 답변에 숨을 불어넣어요 🌱 by the way로 자연스럽게!"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 🔁"], ["no contest", "경쟁 상대가 없다", "확신을 유머로 표현하는 한 마디 💯"], ["I live in my living room", "거실에 산다", "언어유희로 애정 강조! 😆"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 14연속 등장! 🔁 🎯"], ["natural light pouring through", "쏟아져 들어오는 햇살", "휴가 묘사 편 pour in 재활용 🔁 ☀️"], ["by the way", "참고로", "여담을 얹는 자연스러운 필러 🌱"], ["zero pressure", "압박 제로", "공간 취향의 철학적 이유! ✨"], ["The bedroom says \"sleep\"", "침실은 자라고 말한다", "방을 의인화하는 고급 기술 🗣️"], ["I can just be", "그냥 존재해도 된다", "휴식 철학의 결정타 문장 🧘"], ["nothing beats ~", "~만 한 게 없다", "취향 마무리, 시리즈 개근 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 14연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-074 14. 집(Home)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-074 14. 집(Home)_취향.mp3"}, {"id": "1-075", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "과거 경험", "badge": "75 과거 경험", "enQ": "Have you had any problems at your house? Tell me what the problem was, how you dealt with it, and how everything turned out in the end. Give me as many details as possible.", "enA": "Oh yes — this reminds me of the boiler incident last winter. One morning in January, I woke up because my room was freezing cold. The floor heating — you know, Korean ondol — was completely dead, and so was the hot water.\n\nIt was the coldest week of the year, of course — these things always happen at the worst possible time! I called the maintenance office first, and they connected me with a repair technician. The bad news: he couldn't come until two days later because half the building had the same problem.\n\nSo for two days, I basically lived like a penguin — triple layers, thick blankets, and an electric pad that became my best friend. I also learned to boil water the old-fashioned way for washing. When the technician finally fixed it — a broken part in the boiler — taking a hot shower felt like pure luxury. In the end, everything worked out fine, and since then, I get the boiler checked every fall before winter comes. Lesson learned!", "koQ": "집에서 문제를 겪은 적이 있나요? 문제가 무엇이었고, 어떻게 대처했으며, 결국 어떻게 되었는지 말해주세요. 가능한 많은 세부사항을 말해주세요.", "koA": "아, 있죠. 작년 겨울 보일러 사건이 생각나네요. 1월의 어느 아침, 방이 너무 추워서 잠에서 깼어요. 바닥 난방이, 그러니까 한국의 온돌이요, 완전히 죽어 있었고 온수도 안 나왔어요.\n\n당연히 그 주가 그해 가장 추운 주였죠. 이런 일은 항상 최악의 타이밍에 일어나잖아요! 먼저 관리사무소에 전화했더니 수리 기사님을 연결해 줬어요. 나쁜 소식은, 건물 절반이 같은 문제를 겪고 있어서 이틀 뒤에나 올 수 있다는 거였어요.\n\n그래서 이틀 동안 저는 펭귄처럼 살았어요. 옷 세 겹, 두꺼운 담요, 그리고 제 절친이 된 전기장판이요. 씻을 물은 옛날 방식으로 끓이는 법도 배웠고요. 기사님이 마침내 고쳐 주셨을 때, 보일러 부품이 하나 고장 났던 거였는데, 뜨거운 샤워가 순수한 사치처럼 느껴졌어요. 결국 다 잘 해결됐고, 그 후로는 겨울이 오기 전 가을마다 보일러 점검을 받아요. 교훈 확실히 얻었죠!", "struct": [["1️⃣ 도입", "1월 아침 · 온돌+온수 사망"], ["2️⃣ 대처", "관리사무소 → 기사 연결"], ["3️⃣ 위기", "이틀 대기(최악의 타이밍)"], ["4️⃣ 생존", "3겹 옷 · 전기장판 · 물 끓이기"], ["5️⃣ 마무리", "수리 완료 + 가을 점검 교훈"]], "scoring": [["질문 3단계 그대로", "문제(what) → 대처(how dealt) → 결말(turned out)을 질문이 순서대로 줬어요. 그 순서가 곧 목차예요 ✅"], ["온돌 문화 소개", "ondol이라는 단어를 그대로 소개하면 문제 상황 설명이 문화 소개 점수로 이어져요 🔥 치맥·다방과 같은 기술 🔁"], ["고생 = 유머로", "펭귄 생활, 절친이 된 전기장판 — 고생을 웃기게 그릴수록 이야기가 살아나요 🐧 요리 문제 편과 동일 원리 🔁"], ["예방 습관 마무리", "\"가을마다 점검받는다\"는 Since then 마무리는 문제 경험담의 표준 공식, 이제 자동이죠? 🔁 ✅"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["freezing cold", "살을 에는 추위", "국내여행 경험 편 재활용 🔁 🥶"], ["ondol (floor heating)", "온돌(바닥 난방)", "K-주거 문화 소개 필수 어휘! 🔥"], ["at the worst possible time", "최악의 타이밍에", "집 문제 이야기의 공감 포인트 ⏰"], ["maintenance office", "관리사무소", "housing problem 질문의 정답 기관 🏢"], ["repair technician", "수리 기사", "deal with 단계의 필수 등장인물 🔧"], ["live like a penguin", "펭귄처럼 살다", "고생을 유머로 그리는 비유 🐧"], ["became my best friend", "절친이 됐다", "물건 의인화 유머, 전기장판 헌정 😆"], ["the old-fashioned way", "옛날 방식으로", "공연 비교 편 old-fashioned 재활용 🔁"], ["pure luxury", "순수한 사치", "휴가 비교 편 luxury 재활용 🔁 ✨"], ["Lesson learned!", "교훈 얻었어요!", "요리 문제 편 재활용 🔁 마무리 한 방 ✅"]], "audio": "audio/1_서베이/1-075 14. 집(Home)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-075 14. 집(Home)_과거 경험1.mp3"}, {"id": "1-076", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "과거 경험", "badge": "76 과거 경험", "enQ": "Tell me about a change you made to your home, such as buying new furniture or redecorating. Why did you decide to do it, and how did your home look afterward? Were you satisfied with the result?", "enA": "The biggest change I ever made to my home? Easy — buying my big gray couch two years ago. It might sound small, but trust me, it changed everything.\n\nHere's the backstory: for my first year in this apartment, I had no sofa at all. I sat on a cushion on the floor, Korean style, and my back was not a fan. One day, after a long week, I realized I didn't even want to stay home — my own house wasn't comfortable! That was the push I needed. I spent weeks comparing options — you know how I am with comparing prices — and finally picked a big, deep gray one.\n\nThe moment it arrived, the living room transformed — it suddenly looked like a real home. Friends started coming over more, my home vacations were born, and my back sent me a thank-you letter. Satisfied? It's the best money I've ever spent. One couch, whole new home.", "koQ": "새 가구를 사거나 인테리어를 바꾸는 것처럼 집에 준 변화에 대해 말해주세요. 왜 그렇게 하기로 결정했고, 그 후에 집은 어떻게 보였나요? 결과에 만족했나요?", "koA": "집에 준 가장 큰 변화요? 쉬워요. 2년 전에 그 큰 회색 소파를 산 거예요. 사소하게 들릴 수 있지만, 진짜 모든 걸 바꿔 놨어요.\n\n배경 이야기를 하자면, 이 아파트에서의 첫해에는 소파가 아예 없었어요. 한국식으로 바닥 방석에 앉아 지냈는데, 제 허리가 그걸 아주 싫어했죠. 어느 날, 힘든 한 주를 보내고 나서 집에 있기조차 싫다는 걸 깨달았어요. 내 집이 편하지 않았던 거예요! 그게 필요했던 결정타였어요. 몇 주 동안 이것저것 비교했고요. 제가 가격 비교에 진심인 거 아시잖아요. 마침내 크고 짙은 회색 소파를 골랐어요.\n\n소파가 도착한 순간, 거실이 완전히 변신했어요. 갑자기 진짜 집처럼 보이더라고요. 친구들이 더 자주 놀러 오기 시작했고, 제 집 휴가도 그때 탄생했고, 제 허리는 감사 편지를 보냈죠. 만족하냐고요? 솔직히 제 인생 최고의 지출이에요. 네, 소파 하나로 집이 새로 태어났어요.", "struct": [["1️⃣ 도입", "최대 변화 = 회색 소파 구입"], ["2️⃣ 배경", "소파 없는 1년 · 바닥 생활"], ["3️⃣ 계기", "내 집이 불편하다는 깨달음"], ["4️⃣ 변화", "거실 변신 · 친구 · 집 휴가 탄생"], ["5️⃣ 마무리", "인생 최고의 지출 + 만족!"]], "scoring": [["Before를 충분히", "소파 없던 바닥 생활 1년을 먼저 그려야 변화의 크기가 실감 나요 🧘 조깅 계기 편 Before 기술 재활용 🔁"], ["시리즈의 기원 스토리", "이 소파가 휴가 편·취향 편의 그 소파예요 🔁 콤보 전체에 등장한 물건의 탄생 비화라는 점을 활용하세요!"], ["만족도 질문 정면 대응", "Were you satisfied?에는 the best money I've ever spent 한 문장이면 만점 대답이 돼요 💯"], ["의인화 유머 2연타", "허리가 싫어했다 → 감사 편지를 보냈다. 수미상관 유머는 이야기를 한 편의 콩트로 만들어요 😆"]], "expr": [["changed everything", "모든 걸 바꿨다", "작은 변화의 큰 효과 예고 문장 ✨"], ["Here's the backstory", "배경 이야기를 하자면", "과거로 돌아가는 스토리 시그널 📖"], ["Korean style (on the floor)", "한국식 바닥 생활", "좌식 문화 소개 디테일! 🧘"], ["was not a fan", "아주 싫어했다", "허리의 불만을 유머로 의인화 😆"], ["the push I needed", "필요했던 결정타", "wake-up call의 사촌 표현 🔁 ⏰"], ["comparing prices", "가격 비교", "쇼핑 습관 편 재활용 🔁 캐릭터 일관성!"], ["transform", "변신하다", "change보다 극적인 변화 동사 🎭"], ["come over", "(우리 집에) 놀러 오다", "휴가·집 습관 편 재활용 🔁"], ["thank-you letter", "감사 편지", "허리 의인화 유머의 완성 💌"], ["the best money I've ever spent", "인생 최고의 지출", "satisfied 질문의 만점 답변! 💯"], ["one couch, whole new home", "소파 하나, 새집 완성", "대구 마무리, 명언 스타일 💬"]], "audio": "audio/1_서베이/1-076 14. 집(Home)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-076 14. 집(Home)_과거 경험2.mp3"}, {"id": "1-077", "cat": "survey", "catName": "서베이 질문", "num": 14, "topic": "집", "topicEn": "Home", "type": "비교", "badge": "77 비교", "enQ": "Compare your current home with the one you lived in before. What are the differences between the two houses, and why did you move? Tell me in detail.", "enA": "My current home and my old one? Night and day, honestly. Before this apartment, I lived in a tiny studio near my old job — my first place after moving out.\n\nThat studio was... let's say \"cozy,\" and by cozy I mean my bed, desk, and kitchen were all within arm's reach of each other — not in a good way! It was on the second floor facing another building, so it was dark all day, and in summer, the humidity was unbearable. Still, it was my first independent space, so I have a soft spot for it.\n\nI moved two years ago for two reasons: a new job with a longer commute, and the fact that I'd outgrown that studio. Compared to the old place, my apartment now is a different world — a real bedroom, a real kitchen for my cooking hobby, and that glorious south-facing light. The old studio taught me to survive; this home taught me to enjoy living. That's the biggest difference.", "koQ": "지금 사는 집과 이전에 살던 집을 비교해주세요. 두 집의 차이점은 무엇이고, 왜 이사를 했나요? 자세히 말해주세요.", "koA": "지금 집과 예전 집이요? 솔직히 하늘과 땅 차이예요. 이 아파트 전에는 예전 직장 근처의 아주 작은 원룸에 살았어요. 독립하고 처음 얻은 집이었죠.\n\n그 원룸은… '아늑했다'고 해 둘게요. 아늑하다는 건 침대, 책상, 주방이 전부 서로 손 닿는 거리에 있었다는 뜻이에요. 좋은 의미가 아니고요! 2층인 데다 다른 건물을 마주 보고 있어서 하루 종일 어두웠고, 여름엔 습기가 견딜 수 없을 정도였어요. 그래도 첫 독립 공간이라 애틋한 마음은 있어요.\n\n2년 전에 이사했는데, 이유는 두 가지였어요. 통근이 길어진 새 직장, 그리고 그 원룸이 저한테 작아졌다는 것. 예전 집과 비교하면 지금 집은 다른 세계예요. 진짜 침실, 요리 취미를 위한 진짜 주방, 그 눈부신 남향 햇살까지요. 예전 원룸은 버티는 법을, 이 집은 사는 걸 즐기는 법을 가르쳐 줬어요. 그게 가장 큰 차이예요.", "struct": [["1️⃣ 도입", "하늘과 땅 차이(night and day)"], ["2️⃣ 과거", "좁은 원룸 · 어두움 · 습기"], ["3️⃣ 애정", "그래도 첫 독립 공간(soft spot)"], ["4️⃣ 이사", "직장 이동 + 공간이 작아짐"], ["5️⃣ 마무리", "생존의 집 → 즐기는 집"]], "scoring": [["cozy 반어법", "원룸을 \"cozy\"라고 한 뒤 뜻을 뒤집는 유머는 어휘 이해력까지 보여 주는 고급 기술이에요 😆"], ["험담 + soft spot", "옛집의 단점을 나열한 뒤 \"그래도 애틋하다\"를 붙이면 성숙한 비교가 돼요 💕 국내여행 비교의 그리움 기술 🔁"], ["이사 이유 질문 챙기기", "why did you move를 놓치지 마세요. 직장(현실) + outgrow(성장) 두 가지로 답하면 완벽해요 ✅"], ["의미 부여 마무리", "\"생존을 가르친 집 → 즐기는 법을 가르친 집\" — 물리적 비교를 성장 서사로 닫는 최고급 마무리예요 🌱"]], "expr": [["night and day", "하늘과 땅 차이", "비교 오프닝의 원어민 관용구! 🌗"], ["studio", "원룸", "one-room은 콩글리시! studio가 정답 🏠"], ["moving out", "독립", "요리 계기 편 재활용 🔁 스토리 연결!"], ["\"cozy,\" and by cozy I mean ~", "'아늑'의 재정의", "cozy를 반어법으로! 고급 유머 😆"], ["within arm's reach — not in a good way", "손 닿는 거리(나쁜 의미로)", "주방 편 표현을 반전 재활용 🔁"], ["humidity", "습기", "한국 여름 주거 문제의 필수 어휘 💧"], ["have a soft spot for ~", "~에 애틋한 마음이 있다", "비판 후 애정 표현! 균형의 기술 💕"], ["outgrow ~", "~이 작아지다(성장해서)", "이사 이유의 최고급 동사 🌱"], ["south-facing", "남향의", "집 묘사 편 재활용 🔁 ☀️"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["survive → enjoy living", "생존 → 삶을 즐기기", "두 집의 의미를 대구로 정리 💬"]], "audio": "audio/1_서베이/1-077 14. 집(Home)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-077 14. 집(Home)_비교.mp3"}, {"id": "1-078", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "묘사", "badge": "78 묘사", "enQ": "Tell me about the neighborhood you live in. What does the area look like, and where is it located? What facilities can be found near your house? Describe your neighborhood in detail.", "enA": "My neighborhood is a quiet residential area in the western part of Seoul — and its best feature, hands down, is that it's only ten minutes from Han River Park. Yes, that park again!\n\nThe area itself is a nice mix of old and new: apartments on the main street, and behind them, alleys full of restaurants and cozy cafes — including \"Moon,\" my go-to cafe. As for facilities, everything is within walking distance: a big supermarket, 24-hour convenience stores, a library, and a small gym.\n\nWhat I love most is the atmosphere: lively during the day, but it calms right down at night — no loud bars, just people walking their dogs. It's the kind of neighborhood where the bakery owner remembers your order — nothing flashy, but everything I need.", "koQ": "당신이 사는 동네에 대해 말해주세요. 그 지역은 어떤 모습이고, 어디에 위치해 있나요? 집 근처에는 어떤 시설들이 있나요? 당신의 동네를 자세히 묘사해주세요.", "koA": "저희 동네는 서울 서쪽의 조용한 주거 지역이에요. 최고의 장점은 두말할 것 없이 한강공원까지 10분밖에 안 걸린다는 거죠. 네, 또 그 공원이요!\n\n동네 자체는 옛것과 새것이 잘 섞여 있어요. 큰길에는 아파트가 있고, 그 뒤로는 식당과 아늑한 카페들로 가득한 골목들이 있어요. 제 단골 카페 '문(Moon)'도 거기 있고요. 시설은 걸어갈 수 있는 거리에 다 있어요. 큰 마트, 24시간 편의점, 도서관, 작은 헬스장까지요.\n\n제가 가장 좋아하는 건 분위기예요. 낮에는 활기차다가 밤이 되면 금세 차분해져요. 시끄러운 술집 없이, 강아지 산책시키는 사람들뿐이죠. 빵집 사장님이 단골 메뉴를 기억해 주는, 그런 동네예요. 화려하진 않지만 필요한 건 다 있어요.", "struct": [["1️⃣ 도입", "서울 서쪽 · 한강공원 10분!"], ["2️⃣ 모습", "큰길 아파트 + 문(Moon) 골목"], ["3️⃣ 시설", "마트 · 편의점 · 도서관 · 헬스장"], ["4️⃣ 분위기", "낮엔 활기 · 밤엔 차분"], ["5️⃣ 마무리", "빵집 사장님 디테일 + 정리"]], "scoring": [["시리즈 지도 완성", "한강공원 10분, 카페 문(Moon)까지 — 앞의 모든 장소가 이 동네에 모여요 🔁 마지막 주제다운 콤보 대통합!"], ["시설 질문 정면 대응", "facilities 질문에는 마트·편의점·도서관·헬스장처럼 4개 정도 나열이 딱 좋아요 ✅ 많을수록 좋은 게 아니에요!"], ["낮/밤 대비", "낮의 활기 ↔ 밤의 고요 대비는 공원·소파 편에서 쓴 시간대별 묘사 기술의 동네 버전이에요 🔁 🌙"], ["사람 디테일 마무리", "\"빵집 사장님이 단골 메뉴를 기억한다\"처럼 동네의 온도는 결국 사람으로 전해져요 💕 카페 사장님 기술 🔁"]], "expr": [["residential area", "주거 지역", "동네 묘사의 필수 첫 어휘 🏘️"], ["hands down", "두말할 것 없이", "최고를 강조하는 원어민 부사구 💯"], ["a mix of old and new", "옛것과 새것의 조화", "오사카 편 fascinating mix 재활용 🔁"], ["facilities", "시설들", "질문 단어 그대로 받아치기! 🎯"], ["within walking distance", "걸어갈 수 있는 거리에", "카페 편부터 개근한 위치 표현 🔁"], ["24-hour convenience store", "24시간 편의점", "K-동네 문화 대표 디테일! 🏪"], ["calm right down", "금세 차분해지다", "시간대별 분위기 전환 표현 🌙"], ["people walking their dogs", "강아지 산책시키는 사람들", "조깅 편 재활용 🔁 평화로운 장면 🐕"], ["the kind of neighborhood where ~", "~한 그런 동네", "카페 편 the kind of place 재활용 🔁"], ["nothing flashy", "화려하진 않은", "nothing fancy의 사촌! 겸손 마무리 🔁"], ["everything I need", "필요한 건 다 있는", "겸손하게 만족을 드러내는 마무리 ✅"]], "audio": "audio/1_서베이/1-078 15. 동네_이웃(Neighbors)_묘사1.mp3", "label": "묘사 1", "qaudio": "audio_q/1_서베이/1-078 15. 동네_이웃(Neighbors)_묘사1.mp3"}, {"id": "1-079", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "묘사", "badge": "79 묘사", "enQ": "Describe your neighbors for me. What kind of people are they, and how close are you to them? What do you usually do when you run into them?", "enA": "My neighbors? I'm lucky — they're genuinely nice people. Next door, there's a retired elderly couple. The grandmother is basically the guardian angel of our floor: she sometimes shares her homemade side dishes with me, and honestly, her kimchi is on another level!\n\nAcross the hall, there's a woman around my age with the world's friendliest dog. We're not super close — this is Korea, after all, where apartment neighbors keep a polite distance — but we're definitely on good terms.\n\nWhen I run into them, it's usually in the elevator. With the elderly couple, I bow and we exchange a bit of small talk — the weather, how busy I look these days. With the dog owner, I mostly talk to the dog first, then the human! It's not a deep friendship, but those small moments make the building feel like a community rather than just an address. So yeah, those are my neighbors.", "koQ": "당신의 이웃을 묘사해주세요. 그들은 어떤 사람들이고, 당신과 얼마나 친한가요? 그들과 마주쳤을 때 보통 무엇을 하나요?", "koA": "제 이웃들이요? 저는 운이 좋아요. 정말 좋은 분들이거든요. 옆집에는 은퇴하신 노부부가 사세요. 할머니는 사실상 우리 층의 수호천사예요. 가끔 직접 만든 반찬을 나눠 주시는데, 솔직히 할머니 김치는 차원이 달라요!\n\n복도 건너편에는 제 또래 여자분이 세상에서 제일 붙임성 좋은 강아지랑 살아요. 아주 친한 건 아니에요. 여긴 한국이잖아요. 아파트 이웃끼리는 예의 있는 거리를 유지하니까요. 그래도 확실히 좋은 사이예요.\n\n마주치는 건 보통 엘리베이터에서예요. 노부부를 만나면 인사드리고 짧은 스몰토크를 나눠요. 날씨 이야기, 요즘 바빠 보인다는 이야기요. 강아지 주인분을 만나면 대체로 강아지한테 먼저 말을 걸고, 그다음에 사람한테 말해요! 깊은 우정은 아니지만, 그런 작은 순간들이 이 건물을 그냥 주소가 아니라 공동체처럼 느끼게 해 줘요. 네, 이게 제 이웃들이에요.", "struct": [["1️⃣ 도입", "옆집 노부부 · 반찬 나눔"], ["2️⃣ 이웃 2", "또래 + 붙임성 좋은 강아지"], ["3️⃣ 거리감", "예의 있는 거리 · 좋은 사이"], ["4️⃣ 마주칠 때", "엘리베이터 스몰토크"], ["5️⃣ 마무리", "주소가 아닌 공동체 + 정리"]], "scoring": [["이웃은 두 명이면 충분", "노부부 + 강아지 이웃, 캐릭터 두 명이면 이웃 묘사는 완성이에요 ✅ 많이 나열할수록 얕아져요!"], ["친밀도 솔직하게", "\"아주 친하진 않지만 좋은 사이\"라는 polite distance 답변이 한국 아파트 현실이고, 그래서 더 진짜처럼 들려요 🤝"], ["강아지 유머", "\"강아지한테 먼저 인사\"는 전 세계 공통 공감 유머예요 🐕 시험관 미소 보장 디테일!"], ["반찬 나눔 문화", "할머니의 반찬 나눔은 정(情) 문화를 자연스럽게 소개하는 최고의 소재예요 💕 김치 칭찬까지 세트로!"]], "expr": [["next door / across the hall", "옆집 / 복도 건너편", "이웃 위치 표현 세트! 필수 암기 🚪"], ["elderly couple", "노부부", "이웃 묘사의 단골 등장인물 👵"], ["guardian angel", "수호천사", "고마운 이웃을 한 단어로! 💕"], ["side dishes", "반찬", "요리 비교 편 재활용 🔁 반찬 나눔 문화!"], ["on another level", "차원이 다른", "a whole different level의 사촌 🔁 💯"], ["polite distance", "예의 있는 거리", "K-아파트 문화를 정확히 짚는 표현 🇰🇷"], ["on good terms", "좋은 사이인", "close까지는 아닌 친밀도의 정답 어휘 🤝"], ["run into ~", "~와 우연히 마주치다", "질문 표현 그대로 받아치기! 🎯"], ["small talk", "가벼운 대화", "마주쳤을 때 하는 일의 정답 단어 💬"], ["talk to the dog first", "강아지한테 먼저 말 걸기", "누구나 공감하는 유머 디테일 🐕 😆"], ["a community rather than just an address", "주소가 아닌 공동체", "A rather than B 명언 마무리 💬"]], "audio": "audio/1_서베이/1-079 15. 동네_이웃(Neighbors)_묘사2.mp3", "label": "묘사 2", "qaudio": "audio_q/1_서베이/1-079 15. 동네_이웃(Neighbors)_묘사2.mp3"}, {"id": "1-080", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "습관", "badge": "80 습관", "enQ": "What do you usually do in your neighborhood? Where do you often go, and what activities do you do around your area? Describe your typical routine in your neighborhood.", "enA": "Honestly, my whole life happens in my neighborhood, so let me walk you through a typical weekend there — that's when I really make the rounds.\n\nSaturday morning starts at the big supermarket — groceries for the week, always with a list, because without one, I come home with snacks and no actual food! On the way back, I stop by \"Moon,\" my go-to cafe, for an iced americano and an hour of people-watching. That part is non-negotiable.\n\nIn the evening, I walk to Han River Park for my usual riverside stroll — you know that part already! On weekdays, my radius is smaller: the convenience store, the gym twice a week, and the library to return books I actually finished... or mostly finished. So yeah, supermarket, cafe, park, repeat — that's pretty much my neighborhood routine, and it never gets old.", "koQ": "동네에서 주로 무엇을 하나요? 어디에 자주 가고, 동네 주변에서 어떤 활동을 하나요? 동네에서의 일반적인 일과를 설명해주세요.", "koA": "솔직히 제 삶 전체가 동네 안에서 일어나요. 그러니까 동네를 제대로 순회하는 주말 하루를 차근차근 말씀드릴게요.\n\n토요일 아침은 큰 마트에서 시작해요. 일주일 치 장을 보는데, 항상 목록을 들고 가요. 없으면 과자만 잔뜩 사 오고 정작 밥거리는 안 사 오거든요! 돌아오는 길에는 단골 카페 '문(Moon)'에 들러서 아이스 아메리카노를 마시며 한 시간쯤 사람 구경을 해요. 이건 협상 불가예요.\n\n저녁에는 한강공원까지 걸어가서 늘 하던 강변 산책을 해요. 이건 이미 아시는 부분이죠! 평일에는 반경이 더 좁아요. 편의점, 주 2회 헬스장, 그리고 다 읽은… 거의 다 읽은 책을 반납하러 도서관에 가요. 네, 마트, 카페, 공원, 반복. 이게 제 동네 루틴인데, 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "삶 전체가 동네 안! 주말 순회"], ["2️⃣ 아침", "마트 장보기(목록 필수!)"], ["3️⃣ 낮", "문(Moon) · 사람 구경 1시간"], ["4️⃣ 저녁", "한강공원 강변 산책"], ["5️⃣ 마무리", "평일 반경 + 반복해도 안 질림"]], "scoring": [["장소 순회 구조", "마트 → 카페 → 공원 순서로 동네를 한 바퀴 돌면 where do you often go에 지도를 그리듯 답하게 돼요 🗺️"], ["시리즈 총결산 페이지", "카페 문(Moon), 한강 산책 등 앞 주제의 루틴이 다 모여요 🔁 \"이미 아시죠?\"라는 멘트로 연결을 즐기세요!"], ["자기 인식 유머 2연타", "목록 없으면 과자만, 거의 다 읽은 책 — 솔직한 유머 두 방이 루틴을 사람 이야기로 만들어요 😆"], ["평일·주말 반경 대비", "radius라는 단어 하나로 평일(좁게)과 주말(넓게)의 차이를 세련되게 정리할 수 있어요 📏"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 최종 개근상! 🔁 🏆"], ["make the rounds", "순회하다, 쭉 돌다", "동네 루틴 전용 고급 관용구 🔄"], ["groceries", "장보기, 식료품", "동네 활동 1순위 어휘 🛒"], ["snacks and no actual food", "과자만 사고 밥거리는 없음", "장보기 유머의 정석! 공감 백배 😆"], ["stop by ~", "~에 잠깐 들르다", "시리즈 최다 출연, 마지막 인사! 🔁"], ["non-negotiable", "협상 불가", "루틴의 확고함을 유머로! 💯"], ["riverside stroll", "강변 산책", "공원·조깅 편 재활용 🔁 🚶"], ["you know that part already", "이미 아시는 부분이죠", "시험관과의 유대 형성 멘트 😊"], ["radius", "(활동) 반경", "평일↔주말 규모 차이를 한 단어로 📏"], ["or mostly finished", "거의 다 읽은", "솔직 정정 유머, 휴가 편 책 재활용 🔁 😆"], ["it never gets old", "아무리 해도 질리지 않는다", "습관 마무리, 시리즈 공통 🔁"]], "audio": "audio/1_서베이/1-080 15. 동네_이웃(Neighbors)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-080 15. 동네_이웃(Neighbors)_습관.mp3"}, {"id": "1-081", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "취향", "badge": "81 취향", "enQ": "What is your favorite place in your neighborhood, and why do you like it? What do you usually do there? Tell me what makes that spot special to you.", "enA": "You can probably guess this one — my favorite spot in the neighborhood is that little cafe called \"Moon.\" I've mentioned it before, but let me tell you why it
