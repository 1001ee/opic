wins, out of every place around here.\n\nSure, the cozy vibe and the coffee matter. But what really makes it special is that it's my third place — you know, not home, not work, but that third space where you can just breathe. When I'm there, nobody needs anything from me. I read, I people-watch, sometimes I just stare out the window doing absolutely nothing.\n\nAnd there's the owner, of course. After years of visits, she knows my order, my usual seat, even my mood — she can tell when I've had a rough week and quietly gives me an extra cookie. Honestly, where else can you get that? When it comes to my neighborhood, nothing beats that little corner of it. That's my taste in a nutshell.", "koQ": "동네에서 가장 좋아하는 장소는 어디이고, 왜 좋아하나요? 그곳에서 주로 무엇을 하나요? 무엇이 그곳을 특별하게 만드는지 말해주세요.", "koA": "이건 아마 짐작하실 거예요. 동네에서 제가 가장 좋아하는 곳은 '문(Moon)'이라는 그 작은 카페예요. 전에 언급했지만, 동네의 모든 장소 중에서 왜 그곳이 우승인지 말씀드릴게요.\n\n물론 아늑한 분위기와 커피도 중요해요. 하지만 진짜 특별한 이유는 그곳이 저의 '제3의 공간'이라는 거예요. 집도 아니고 회사도 아닌, 그냥 숨 쉴 수 있는 세 번째 공간이요. 거기 있으면 아무도 저한테 뭘 요구하지 않아요. 책을 읽고, 사람 구경을 하고, 가끔은 그냥 창밖만 바라보면서 아무것도 안 해요.\n\n그리고 당연히 사장님이 있죠. 몇 년을 다녔더니 제 메뉴, 제 단골 자리, 심지어 제 기분까지 아세요. 힘든 한 주를 보낸 게 보이면 조용히 쿠키 하나를 더 주시거든요. 솔직히 이런 걸 어디서 받을 수 있겠어요? 우리 동네에 관해서라면, 그 작은 구석만 한 곳이 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "짐작 가능! = 문(Moon)"], ["2️⃣ 개념", "제3의 공간(third place)"], ["3️⃣ 하는 일", "독서 · 사람 구경 · 멍때리기"], ["4️⃣ 특별함", "사장님의 쿠키(기분까지 아심)"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["재등판 소재 활용법", "이미 소개한 카페를 다시 쓸 땐 \"짐작하시죠?\"라고 인정하고 새 관점(third place)을 더하면 돼요 🔁 반복이 아니라 심화!"], ["third place 개념", "집도 회사도 아닌 제3의 공간이라는 개념어 하나가 장소 취향 답변의 수준을 바꿔 줘요 ✨"], ["쿠키 디테일", "기분을 알아채고 건네는 쿠키 하나 — what makes it special의 답은 이런 관계의 증거예요 🍪"], ["취향 공식 완주", "15개 주제의 취향 공식이 오늘로 완주예요 🎓 이제 어떤 취향 질문이 와도 3초 만에 뼈대가 나올 거예요!"]], "expr": [["You can probably guess", "아마 짐작하실 거예요", "반복 소재를 세련되게 재등판시키는 멘트 😊"], ["why it wins", "왜 그곳이 우승인지", "비교 우위를 유쾌하게 선언 🏆"], ["cozy vibe", "아늑한 분위기", "카페 묘사 편부터 개근! 🔁"], ["what really makes it special", "진짜 특별한 이유는", "질문 표현 받아치기 + 심화 예고 🎯"], ["third place", "제3의 공간", "집·회사 밖 공간 이론! IH 개념 어휘 ✨"], ["just breathe", "그냥 숨 쉬다", "휴식 철학 표현, 거실 편 just be 사촌 🔁"], ["stare out the window", "창밖을 바라보다", "멍때리기의 영어 표현! 🪟"], ["she can tell when ~", "~인 걸 알아차리신다", "단골 관계의 깊이를 보여 주는 구문 💕"], ["an extra cookie", "쿠키 하나 더", "정(情)을 보여 주는 킬러 디테일 🍪"], ["Where else can you get that?", "이런 걸 어디서 받겠어요?", "수사 의문문으로 특별함 강조 💬"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 15연속 완주! 🔁 🎓"]], "audio": "audio/1_서베이/1-081 15. 동네_이웃(Neighbors)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-081 15. 동네_이웃(Neighbors)_취향.mp3"}, {"id": "1-082", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "과거 경험", "badge": "82 과거 경험", "enQ": "Tell me about something interesting or memorable that happened in your neighborhood. When and where did it take place, and why do you still remember it?", "enA": "Oh, this reminds me of a snowy morning two winters ago. We had the heaviest snowfall in years overnight — the whole neighborhood woke up buried in white, and cars couldn't even get out of the parking lot.\n\nThen something interesting happened. One by one, neighbors came out with shovels — people who had never said more than \"hello\" in the elevator. Before we knew it, about a dozen of us were clearing the paths together: the elderly couple directing traffic like generals, the dog running around supervising everyone, kids building a snowman with the leftover snow.\n\nThe best part? Afterward, the grandmother next door invited a few of us over for hot tea and rice cakes. We stood in the hallway chatting like old friends. It's memorable because that morning, our building actually felt like a village. Since then, we all greet each other by name, not just with a nod. Funny how it took a snowstorm to make that happen, right?", "koQ": "동네에서 있었던 흥미롭거나 기억에 남는 일에 대해 말해주세요. 언제 어디서 일어났고, 왜 아직도 그것을 기억하나요?", "koA": "아, 두 해 전 겨울의 눈 오는 아침이 생각나네요. 밤사이 몇 년 만의 기록적인 폭설이 내렸어요. 동네 전체가 하얗게 파묻힌 채 아침을 맞았고, 주차장에서는 차도 못 빠져나갈 정도였죠.\n\n그때 흥미로운 일이 벌어졌어요. 이웃들이 하나둘 삽을 들고 나온 거예요. 엘리베이터에서 '안녕하세요' 이상을 나눠 본 적 없는 사람들이요. 어느새 열댓 명이 함께 길을 치우고 있었어요. 노부부는 장군처럼 교통정리를 하시고, 그 강아지는 뛰어다니며 모두를 감독하고, 아이들은 남은 눈으로 눈사람을 만들고요.\n\n제일 좋았던 부분이요? 끝나고 나서 옆집 할머니가 우리 몇 명을 집으로 불러 따뜻한 차와 떡을 주셨어요. 우리는 복도에 서서 오랜 친구처럼 수다를 떨었죠. 그날 아침 우리 건물이 진짜 마을처럼 느껴졌기 때문에 기억에 남아요. 그 후로 우리는 서로 고개만 까딱하는 게 아니라 이름을 부르며 인사해요. 그렇게 되는 데 폭설이 필요했다는 게 재밌죠?", "struct": [["1️⃣ 도입", "몇 년 만의 폭설 아침"], ["2️⃣ 사건", "삽 들고 나온 이웃들"], ["3️⃣ 장면", "장군 노부부 · 감독 강아지"], ["4️⃣ 온기", "할머니의 차와 떡 초대"], ["5️⃣ 마무리", "건물 = 마을 + 이름 부르는 사이"]], "scoring": [["사건 없는 따뜻한 경험", "사고·문제가 아니라 폭설이 만든 따뜻한 아침이에요 ❄️ 조깅 첫눈 편처럼 감정이 움직인 순간이면 충분해요 🔁"], ["캐릭터 총출동", "이웃 묘사 편의 노부부와 강아지가 사건 속 캐릭터로 재등장해요 🔁 이웃 콤보가 하나의 드라마가 됩니다!"], ["장면을 살리는 유머", "장군처럼 지휘하는 노부부, 감독하는 강아지 — 각 인물에 동작 유머를 붙이면 장면이 영화처럼 살아나요 😆"], ["변화로 마무리", "\"고개 인사 → 이름 인사\"라는 작은 변화가 why do you still remember it의 가장 확실한 답이에요 💕"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 15주제 완주! 🔁 🎓"], ["the heaviest snowfall in years", "몇 년 만의 기록적 폭설", "사건의 스케일을 알리는 오프닝 ❄️"], ["buried in white", "하얗게 파묻힌", "폭설 아침을 그림으로 보여 줘요 🌨️"], ["one by one", "하나둘씩", "장면 전개의 리듬 표현 🚶"], ["Before we knew it", "어느새", "자연스러운 전개의 시그널 ⏰"], ["clear the paths", "길을 치우다", "눈 치우기 상황의 정답 동사 🧹"], ["like generals / supervising", "장군처럼 / 감독하며", "인물·강아지 유머 묘사 콤보 😆"], ["invite ~ over", "~을 집에 초대하다", "come over의 반대 방향! 세트 암기 🏠"], ["felt like a village", "마을처럼 느껴졌다", "'왜 기억하나'의 정답 문장 💕"], ["greet each other by name", "이름을 부르며 인사하다", "변화를 보여 주는 Since then 디테일 🔁"], ["Funny how ~, right?", "~라는 게 재밌죠?", "시험관에게 말 거는 마무리 수사법 💬"]], "audio": "audio/1_서베이/1-082 15. 동네_이웃(Neighbors)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-082 15. 동네_이웃(Neighbors)_과거 경험.mp3"}, {"id": "1-083", "cat": "survey", "catName": "서베이 질문", "num": 15, "topic": "동네/이웃", "topicEn": "Neighbors", "type": "비교", "badge": "83 비교", "enQ": "How has your neighborhood changed or developed over the last ten years? What did it use to be like, and how does it look now? Tell me about the changes in detail.", "enA": "My neighborhood has changed a lot over the last ten years. Back then, this area was much older and quieter. The alleys used to be full of little family businesses: a tailor shop, an old stationery store, a video rental place.\n\nMost buildings were low, two or three stories, and to be honest, the area felt a bit left behind compared to the trendier parts of Seoul.\n\nThese days, it's totally transformed. Young cafe owners turned old houses into stylish cafes — that's how my beloved \"Moon\" was born! New apartments went up, the riverside park got a makeover, and our quiet area now makes \"hidden gem\" lists. Compared to ten years ago, it's brighter and more fun — though I have to admit, I miss that stationery store and my childhood treasures. Change always costs a little something.", "koQ": "지난 10년 동안 당신의 동네는 어떻게 변하고 발전했나요? 예전에는 어떤 모습이었고, 지금은 어떤가요? 그 변화에 대해 자세히 말해주세요.", "koA": "저희 동네는 지난 10년간 정말 많이 변했어요. 그때 이 동네는 훨씬 오래되고 조용했어요. 골목마다 작은 가족 가게들이 가득했죠. 양복점, 오래된 문방구, 비디오 대여점이요.\n\n건물들은 대부분 2~3층으로 낮았고, 솔직히 서울의 트렌디한 동네들에 비해 좀 뒤처진 느낌이었어요.\n\n요즘은 완전히 탈바꿈했어요. 젊은 카페 사장님들이 낡은 집들을 세련된 카페로 바꿨죠. 제가 아끼는 '문(Moon)'도 그렇게 태어났어요! 새 아파트들이 올라갔고, 강변 공원은 새 단장을 했고, 우리 조용한 동네가 이제 '숨은 명소' 리스트에 등장해요. 10년 전과 비교하면 더 밝고 더 재밌어요. 그래도 인정할게요, 그 문방구와 어린 시절 보물들이 그리워요. 변화에는 늘 작은 대가가 따르니까요.", "struct": [["1️⃣ 도입", "10년의 변화 관찰기"], ["2️⃣ 과거", "수선집 · 문방구 · 비디오 가게"], ["3️⃣ 과거", "낮은 건물 · 뒤처진 느낌"], ["4️⃣ 현재", "카페 골목(문(Moon) 탄생!) · 새 단장"], ["5️⃣ 마무리", "더 재밌지만, 문방구 그리움"]], "scoring": [["사라진 가게 3종", "수선집·문방구·비디오 가게 — 사라진 가게 세 개면 10년 전 동네가 저절로 그려져요 📼 소품 기술의 완성형!"], ["문(Moon) 탄생 비화", "변화의 사례로 \"그렇게 문(Moon)이 태어났다\"를 넣으면 시리즈의 시작과 끝이 연결돼요 🔁 완벽한 수미상관!"], ["발전 + 상실 균형", "더 재밌어졌지만 문방구가 그립다 — 이 균형이 개발·변화 질문의 가장 성숙한 답변 구조예요 🕰️"], ["대장정 마무리", "15개 주제, 5가지 유형의 공식이 모두 끝났어요 🎓 이제 남은 건 소리 내어 연습하는 것뿐! 화이팅! 🔥"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 15주제 대장정 완주! 🔁 🎓"], ["family businesses", "가족 가게들", "옛 동네 감성을 한 단어로 🏪"], ["video rental place", "비디오 대여점", "시대를 소환하는 킬러 소품! 📼"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 마지막 등판 🔁 💓"], ["left behind", "뒤처진", "개발 전 동네를 표현하는 어휘 🕰️"], ["transformed", "탈바꿈한", "집 변화 편 재활용 🔁 극적 변화 동사 🎭"], ["makeover", "새 단장, 리모델링", "동네·공간 변화의 필수 명사 ✨"], ["hidden gem", "숨은 명소", "국내여행 hidden spots의 사촌 🔁 💎"], ["I have to admit", "인정할게요", "국내여행 비교 편 재활용 🔁 그리움 시그널"], ["childhood treasures", "어린 시절 보물들", "문방구 감성을 완성하는 표현 🧸"], ["Change always costs a little something", "변화엔 작은 대가가 따른다", "15주제 마지막 명언 마무리! 💬 🎓"]], "audio": "audio/1_서베이/1-083 15. 동네_이웃(Neighbors)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-083 15. 동네_이웃(Neighbors)_비교.mp3"}, {"id": "2-001", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "묘사", "badge": "01 묘사", "enQ": "Tell me about the banks. What do they look like? Where are they located?", "enA": "Banks in Korea? Okay, that's actually an easy one, because I stop by my bank pretty often. Banks are literally everywhere in Korea — you can find major banks like KB or Shinhan on almost every corner. They're usually near subway stations, so they're super easy to get to. In my neighborhood alone, there are three or four branches within walking distance.\n\nWhen it comes to how they look, banks are pretty easy to spot. Most sit on the first floor, with big signs in the bank's colors. For example, KB uses yellow, so you can recognize it from a distance. Also, there's an ATM zone at the entrance, open 24/7.\n\nOnce you walk in, you take a number and wait for your turn. The tellers help with opening accounts or transferring money. To be honest, these days most people bank on their smartphones, so branches are much less crowded than they used to be. So yeah, that's pretty much what banks are like in Korea.", "koQ": "당신 나라의 은행에 대해 말해 주세요. 은행은 보통 어떻게 생겼고, 주로 어디에 위치해 있나요?", "koA": "한국의 은행이요? 아, 마침 쉬운 질문이네요. 제가 은행에 꽤 자주 들르거든요. 우선, 한국에는 은행이 말 그대로 어디에나 있어서 KB나 신한 같은 주요 은행을 거의 골목마다 찾을 수 있어요. 보통 지하철역 근처에 있어서 접근성이 정말 좋고요. 저희 동네만 해도 걸어갈 수 있는 거리에 지점이 서너 개나 있어요.\n\n생김새에 관해서라면, 은행은 눈에 잘 띄는 편이에요. 대부분 건물 1층에 있고, 은행 상징색이 들어간 큰 간판이 있죠. 예를 들어 KB는 노란색이라 멀리서도 바로 알아볼 수 있어요. 그리고 보통 입구에 24시간 운영되는 ATM 코너가 있어요.\n\n안으로 들어가면 번호표를 뽑고 차례를 기다려요. 은행원들은 계좌 개설이나 송금 같은 업무를 도와주죠. 그런데 솔직히 요즘은 대부분 스마트폰으로 은행 업무를 봐서, 지점이 예전보다 훨씬 한산해졌어요. 네, 한국의 은행은 대체로 이런 모습이에요.", "struct": [["1️⃣ 도입", "가벼운 리액션 (Banks in Korea?...)"], ["2️⃣ 위치", "어디에나 · 역 근처 · 우리 동네"], ["3️⃣ 외관", "1층 · 로고 색 간판 (KB 노랑)"], ["4️⃣ 내부", "번호표 · 계좌 개설 · 송금"], ["5️⃣ 마무리", "모바일 뱅킹 트렌드 + 정리 멘트"]], "scoring": [["리액션 시작", "'Banks in Korea? Okay...'처럼 질문을 받아치는 리액션으로 시작하면 실제 대화처럼 들려요 😊 준비된 답변이라는 인상을 지우는 첫 포인트예요!"], ["나만의 디테일", "'In my neighborhood alone, three or four...'처럼 구체적인 숫자와 실제 브랜드 예시(KB·신한)가 답변의 진정성을 만들어요 🔑 뭉뚱그린 설명보다 숫자 하나가 힘이 세요"], ["시제 다양화", "현재형 묘사에 비교급(much less crowded)과 used to를 섞어 보세요. 시제와 문형의 다양성이 IM과 IH를 가르는 결정적인 차이가 돼요 💪 묘사에도 시간을 입히세요"], ["마무리 시그널", "'So yeah, that's pretty much...'로 답변의 끝을 명확하게 알려 주세요 ✅ 어색하게 뚝 끊기는 것보다 훨씬 안정적이고, 시험 내내 재사용할 수 있는 만능 마무리예요"]], "expr": [["That's actually an easy one", "마침 쉬운 질문이네요", "여유 있는 리액션 도입 — 암기 티 지우기 😊"], ["stop by ~", "~에 잠깐 들르다", "visit보다 구어체, 서베이 카페 편 재활용 🔁 ☕"], ["literally everywhere", "말 그대로 어디에나", "약간의 과장으로 생동감 🔥 편의점 묘사에도!"], ["on almost every corner", "거의 골목마다", "many를 대신하는 원어민식 빈도 표현 ✨"], ["super easy to get to", "찾아가기 아주 쉬운", "get to = 도달하다. 접근성 묘사 만능 ✅"], ["within walking distance", "걸어갈 수 있는 거리에", "서베이 동네 편 재활용 🔁 🏠"], ["When it comes to ~", "~에 관해서라면", "위치 → 외관 화제 전환 시그널 🔑"], ["easy to spot", "눈에 잘 띄는", "easy to find보다 한 단계 위 어휘 ✨"], ["recognize ~ from a distance", "멀리서도 ~을 알아보다", "로고·색깔 묘사와 짝지어 디테일 점수 UP 💪"], ["open 24/7", "24시간 연중무휴", "twenty-four seven 발음! ATM 묘사 필수 ⏰"], ["take a number & wait for my turn", "번호표 뽑고 기다리다", "은행·병원·관공서 내부 묘사 만능 콤보 🔁 ✅"]], "audio": "audio/2_돌발/2-001 1. 은행(Bank)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-001 1. 은행(Bank)_묘사.mp3"}, {"id": "2-002", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "습관", "badge": "02 습관", "enQ": "What do you do from the moment you walk into the bank until you walk out? Tell me everything that goes on when you visit the bank.", "enA": "Okay, so let me walk you through what I usually do at the bank. Like I said, I stop by my bank pretty often, since it's within walking distance from my place. The first thing I do is use the ATM zone at the entrance — you know, it's open 24/7, so if I just need to withdraw some cash, I'm in and out in a minute.\n\nBut if I need to talk to a teller, I walk in, take a number, and wait for my turn in the waiting area. While I'm waiting, I usually kill time on my phone. When my number comes up on the screen, I go to the counter and take care of my business — usually something like transferring money or updating my bankbook.\n\nBefore I leave, I always double-check the receipt to make sure everything went through correctly. So yeah, that's pretty much my routine whenever I visit the bank.", "koQ": "은행에 들어서는 순간부터 나올 때까지 무엇을 하나요? 은행에 갈 때 일어나는 모든 일을 이야기해 주세요.", "koA": "네, 제가 은행에서 보통 뭘 하는지 차근차근 말씀드릴게요. 말씀드렸듯이 저는 은행에 꽤 자주 들르는데, 집에서 걸어갈 수 있는 거리에 있거든요. 가장 먼저 하는 일은 입구에 있는 ATM 코너를 이용하는 거예요. 24시간 운영돼서 현금만 뽑으면 될 때는 1분 만에 나올 수 있어요.\n\n하지만 창구 직원과 상담해야 할 때는 안으로 들어가서 번호표를 뽑고 대기 공간에서 차례를 기다려요. 기다리는 동안에는 보통 폰을 보면서 시간을 보내고요. 화면에 제 번호가 뜨면 창구로 가서 송금이나 통장 정리 같은 볼일을 봐요.\n\n나가기 전에는 항상 영수증을 다시 확인해서 제대로 처리됐는지 점검해요. 네, 이게 제가 은행에 갈 때마다 하는 루틴이에요.", "struct": [["1️⃣ 도입", "루틴 예고 멘트 (walk you through)"], ["2️⃣ 입장", "ATM 코너 이용 · 24시간"], ["3️⃣ 창구", "번호표 · 대기 중 폰 보기"], ["4️⃣ 업무", "송금 · 통장 정리"], ["5️⃣ 마무리", "영수증 확인 + 정리 멘트"]], "scoring": [["순서 연결어", "'The first thing I do is... While I'm waiting...'처럼 시간 순서 연결어가 루틴 답변의 뼈대가 돼요 🧩 순서만 잡혀도 절반은 성공이에요"], ["조건 나누기", "'If I just need cash... / But if I need a teller...'처럼 상황을 둘로 나누면 문장 구조 다양성 점수를 챙길 수 있어요 💪 조건문은 습관 답변의 고급 양념이에요"], ["콤보 재활용", "묘사 편의 stop by, take a number를 그대로 이어 쓰면 연속 콤보 문제에서 답변이 한 세트처럼 연결돼요 🔁 같은 주제 안에서는 표현을 아끼지 말고 재활용하세요"], ["습관 시그널", "usually, always, sometimes 같은 빈도 부사를 답변 곳곳에 심어 주세요 ⏰ 습관을 묻는 질문에 정확히 답하고 있다는 신호가 되고, 문장마다 리듬도 생겨요"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 질문 만능 오프닝, 서베이 개근 🔁 🔑"], ["stop by ~", "~에 잠깐 들르다", "묘사 편 표현 그대로 재활용! 🔁 콤보 연결"], ["within walking distance", "걸어갈 수 있는 거리에", "묘사 편 위치 표현 살짝 끼워 넣기 🔁 😊"], ["be in and out in a minute", "금방 볼일만 보고 나오다", "짧은 용무 묘사에 딱! 생활감 UP ✨"], ["take a number & wait for my turn", "번호표 뽑고 기다리다", "묘사 편 만능 콤보 또 등장! 🔁 루틴의 뼈대"], ["kill time on my phone", "폰을 보며 시간을 때우다", "kill time = 시간 때우기. 대기 장면 단골 💬"], ["When my number comes up", "내 번호가 뜨면", "순서를 이어 주는 시간 표현 ⏰"], ["take care of my business", "볼일을 보다", "do my banking보다 자연스러운 구어체 💪"], ["update my bankbook", "통장 정리를 하다", "한국적 디테일! 답변이 생생해져요 ✨"], ["double-check", "다시 한번 확인하다", "꼼꼼한 성격까지 보여 주는 일석이조 표현 ✅"], ["that's pretty much my routine", "이게 제 루틴의 전부예요", "묘사 편 마무리 표현의 습관 버전 🔁"]], "audio": "audio/2_돌발/2-002 1. 은행(Bank)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-002 1. 은행(Bank)_습관.mp3"}, {"id": "2-003", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "취향", "badge": "03 취향", "enQ": "Do you prefer visiting a bank in person or using online banking? Why do you like that way of banking better? Tell me the reasons in detail.", "enA": "Oh, if I had to choose, it's online banking, no contest. For me, it's all about convenience: I can send money, check my balance, even open a savings account — all from my couch, in my pajamas.\n\nI'd pick the app over waiting in line any day. Think about it: branches close at four, but the app works at midnight, on weekends, even on holidays. Don't get me wrong — for big things like loans, I still visit a branch, because talking to a real person face to face just feels safer.\n\nBut for everything else? Nothing beats transferring money in ten seconds while lying on my sofa. In a nutshell, online banking saves my time and energy, and the branch is my backup for the big decisions.", "koQ": "은행에 직접 가는 것과 온라인 뱅킹 중 무엇을 선호하나요? 왜 그 방식이 더 좋은가요? 그 이유를 자세히 말해주세요.", "koA": "아, 하나를 골라야 한다면 온라인 뱅킹이요. 고민할 것도 없어요. 저한테는 편리함이 전부거든요. 송금, 잔액 확인, 심지어 적금 가입까지 전부 소파에서, 잠옷 차림으로 할 수 있으니까요.\n\n줄 서서 기다리는 것보다는 무조건 앱을 고를 거예요. 생각해 보세요. 지점은 4시에 닫지만, 앱은 자정에도, 주말에도, 심지어 명절에도 되잖아요. 오해는 마세요. 대출 같은 큰일은 여전히 지점에 가요. 실제 사람과 얼굴을 보고 이야기하는 게 더 안심되니까요.\n\n하지만 나머지 전부는요? 소파에 누워서 10초 만에 송금하는 것만 한 게 없죠. 한마디로, 온라인 뱅킹은 시간과 에너지를 아껴 주고, 지점은 큰 결정을 위한 백업인 셈이에요.", "struct": [["1️⃣ 선언", "온라인 뱅킹, no contest"], ["2️⃣ 이유", "소파에서 모든 업무 해결"], ["3️⃣ 대비", "4시 마감 vs 24시간 앱"], ["4️⃣ 예외", "대출 등 큰일은 대면 (안심)"], ["5️⃣ 마무리", "in a nutshell 정리"]], "scoring": [["선언 먼저", "어느 쪽이냐 묻는 질문엔 고민하는 척 없이 첫 문장에서 바로 답을 선언하세요 🔑 if I had to choose 공식이 가장 자연스러운 오프닝이에요"], ["편리함 구체화", "편리하다 한 마디로 끝내지 말고 잠옷 + 소파 + 10초 송금처럼 구체적인 장면으로 보여 주세요 🏠 서베이 취향 공식 그대로, 장면이 곧 근거예요 🔁"], ["예외 인정", "Don't get me wrong으로 반대편(대면 창구)의 장점도 한 번 인정해 주세요 😊 한쪽만 파는 답변보다 균형 잡힌 답변이 훨씬 IH답게 들려요"], ["공식 5종 세트", "choose → all about → over → nothing beats → in a nutshell. 서베이 취향 뼈대 그대로라서 이 페이지 하나로 취향 공식을 복습할 수 있어요 🔁 🎓"]], "expr": [["if I had to choose", "굳이 하나를 고르자면", "취향 오프닝, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "압도적 선호를 두 단어로 🔥"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식, 시리즈 공통 🔁 ✨"], ["check my balance", "잔액을 확인하다", "온라인 뱅킹 어휘 기본 💳"], ["from my couch", "소파에서", "서베이 휴가·집 편 소파 재활용 🔁 🏠"], ["A over B", "B보다 A", "비교 선호 공식, 서베이 공통 🔁 ✅"], ["any day", "언제든, 두말없이", "A over B 뒤에 붙이는 강조 부사 💪"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["face to face", "얼굴을 마주하고", "대면의 가치를 말할 때 필수 💬"], ["Nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 🔥"], ["In a nutshell", "한마디로 정리하면", "취향 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-003 1. 은행(Bank)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-003 1. 은행(Bank)_취향.mp3"}, {"id": "2-004", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "과거 경험", "badge": "04 과거 경험", "enQ": "Sometimes problems can arise when you are at the bank. Tell me in detail about a problem you had that involved your bank. Maybe the bank was closed, or perhaps the bank might have made some kind of mistake. Tell me about how you solved the problem.", "enA": "Oh, this reminds me of something from about a year ago. I stopped by the bank to transfer my rent money, but that day, the line was incredibly long — the waiting area was totally packed. I took a number, and guess what? More than thirty people were ahead of me.\n\nSo I used the ATM zone instead. But in the middle of the transfer, the machine suddenly froze and my card got stuck inside. To be honest, I was a little panicked — the payment was due that day.\n\nLuckily, a teller came over right away, got my card out, and helped me finish the transfer at the counter. Everything worked out fine. Since then, I've been doing most of my banking on my smartphone, just in case. Probably my most memorable bank problem ever!", "koQ": "은행에서 겪었던 문제에 대해 자세히 말해 주세요. 은행이 문을 닫았거나 은행이 실수를 했을 수도 있죠. 그 문제를 어떻게 해결했는지 이야기해 주세요.", "koA": "아, 1년 전쯤 있었던 일이 생각나네요. 월세를 송금하려고 은행에 잠깐 들렀는데, 그날따라 줄이 엄청나게 길었어요. 대기 공간이 사람들로 꽉 차 있었죠. 번호표를 뽑았는데, 세상에, 제 앞에 서른 명이 넘게 있는 거예요.\n\n그래서 대신 ATM을 쓰기로 했어요. 그런데 송금을 하는 도중에 기계가 갑자기 멈추더니 카드가 안에 껴 버렸어요. 그날까지 꼭 보내야 하는 돈이라서 솔직히 좀 당황스러웠어요.\n\n다행히 은행원 한 분이 바로 와서 카드를 꺼내 주셨고, 창구에서 송금까지 도와주셨어요. 다 잘 해결됐죠. 그 후로는 혹시 몰라서 은행 업무를 대부분 스마트폰으로 하고 있어요. 아마 제가 겪은 가장 기억에 남는 은행 문제일 거예요!", "struct": [["1️⃣ 도입", "회상 시그널 (This reminds me of)"], ["2️⃣ 상황", "긴 줄 · 꽉 찬 대기 공간"], ["3️⃣ 문제", "ATM 멈춤(froze) · 카드 걸림"], ["4️⃣ 해결", "은행원 도움 (right away)"], ["5️⃣ 마무리", "해결 + 변화(Since then...)"]], "scoring": [["과거 시제 일관", "stopped, took, froze, got stuck처럼 과거형 동사를 안정적으로 이어 가는 것이 경험 답변의 기본기예요 📖 시제가 흔들리면 이야기도 흔들려요"], ["기승전결 구성", "상황 → 문제 발생 → 해결 → 결과의 4단 구성만 지키면 어떤 경험 문제가 나와도 무너지지 않아요 🧩 구성이 잡히면 디테일은 자연스럽게 따라와요"], ["감정 리액션", "to be honest, a little panicked 같은 감정 표현이 들어가야 진짜 겪은 이야기처럼 들려요 😊 사건 자체보다 감정 리액션이 채점자가 가장 좋아하는 IH 포인트예요"], ["시제 레벨업", "'Since then, I've been doing...'처럼 현재완료로 마무리하면 과거의 사건을 현재의 습관으로 이으며 문법 다양성까지 보여 줄 수 있어요 📊"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝, 서베이 개근 🔁 🔑"], ["stopped by the bank", "은행에 잠깐 들렀다", "묘사·습관 편 stop by의 과거형 재활용 🔁"], ["totally packed", "사람들로 꽉 찬", "crowded 상위 호환 구어체! 서베이 공통 🔁 🔥"], ["guess what?", "그런데 있잖아요?", "듣는 이를 끌어들이는 스토리텔링 필러 🎭"], ["in the middle of ~", "~하는 도중에", "사건이 터지는 타이밍 묘사에 딱! ⏰"], ["froze / got stuck", "(기계가) 멈췄다 / 껴 버렸다", "기기 고장 단골 콤보 💪 테크 주제 재활용"], ["to be honest", "솔직히 말하면", "감정 고백 앞 필러, 서베이 개근 🔁 😊"], ["a little panicked", "살짝 당황한", "감정 표현은 IH의 필수 재료예요! 😆"], ["came over right away", "바로 다가왔다", "해결 장면의 스피드감을 살리는 표현 🏃"], ["everything worked out fine", "결국 다 잘 해결됐다", "문제 해결형 답변의 해피엔딩 공식 🔁 ✨"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다", "현재완료진행 마무리로 문법 점수 UP 📊"]], "audio": "audio/2_돌발/2-004 1. 은행(Bank)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-004 1. 은행(Bank)_과거 경험.mp3"}, {"id": "2-005", "cat": "unexpected", "catName": "돌발 질문", "num": 1, "topic": "은행", "topicEn": "Bank", "type": "비교", "badge": "05 비교", "enQ": "Banks have definitely changed over time. Tell me about a bank you remember from your childhood. What did the bank look like? How was it different from banks today?", "enA": "Banks have changed a lot, actually. When I was little, I used to go to the bank with my mom, and I remember it was always totally packed. People had to take a number and wait forever — sometimes more than half an hour — and the tellers were busy stamping bankbooks by hand.\n\nBack then, everything was done on paper. There were no smart machines, just one or two old ATMs, and if you wanted to transfer money, you had no choice but to visit a branch in person.\n\nThese days, though, it's a completely different story. Branches are much less crowded than they used to be, because most people do their banking on their smartphones. Banks themselves have gotten smaller and more modern, with digital kiosks instead of long counters. So yeah, compared to the banks of my childhood, banks today are faster, quieter, and way more convenient.", "koQ": "은행은 시간이 지나며 확실히 변했죠. 어린 시절 기억나는 은행에 대해 말해 주세요. 그 은행은 어떻게 생겼었나요? 오늘날의 은행과는 어떻게 달랐나요?", "koA": "은행은 정말 많이 변했어요. 어릴 때 엄마를 따라 은행에 가곤 했는데, 항상 사람들로 꽉 차 있었던 게 기억나요. 다들 번호표를 뽑고 한참을 기다려야 했어요. 어떨 땐 30분도 넘게요. 은행원들은 손으로 통장을 찍어 주느라 정신이 없었죠.\n\n그때는 모든 게 종이로 처리됐어요. 스마트 기기는 없었고 낡은 ATM이 한두 대뿐이라서, 송금을 하려면 지점에 직접 갈 수밖에 없었어요.\n\n그런데 요즘은 완전히 다른 이야기죠. 대부분 스마트폰으로 은행 업무를 봐서 지점이 예전보다 훨씬 한산해요. 은행 자체도 더 작고 현대적으로 바뀌어서 긴 카운터 대신 디지털 키오스크가 있고요. 네, 어린 시절의 은행과 비교하면 요즘 은행은 더 빠르고, 조용하고, 훨씬 더 편리해요.", "struct": [["1️⃣ 도입", "변화 인정 멘트 (changed a lot)"], ["2️⃣ 과거", "used to + 꽉 찬 지점"], ["3️⃣ 불편", "종이 업무 · 낡은 ATM"], ["4️⃣ 현재", "모바일 뱅킹 · 한산 · 키오스크"], ["5️⃣ 마무리", "비교 + 형용사 3연속"]], "scoring": [["과거·현재 이분", "Back then ↔ These days로 답변을 두 덩어리로 나눠 보세요 🧩 구조가 잡히면 비교 문제는 절반 이상 성공한 거예요"], ["used to 활용", "'I used to go...', 'less crowded than they used to be'처럼 used to를 반복 활용하면 과거 표현력이 확실하게 어필돼요 💪 비교 답변의 필수 문법이에요"], ["재활용 콤보", "묘사 편의 much less crowded, 습관 편의 take a number를 그대로 이어 쓰면 콤보 답변이 한 세트처럼 들려요 🔁 은행 다섯 문항이 하나의 이야기가 되죠"], ["형용사 3연속", "'faster, quieter, and way more convenient'처럼 형용사 세 개를 리듬감 있게 나열하며 끝내면 마무리가 깔끔해요 ✅ 셋 나열은 영어 리듬의 마법 숫자예요"]], "expr": [["used to + 동사원형", "예전엔 ~하곤 했다", "비교 문제의 심장, 서베이 개근 🔁 💓"], ["I remember -ing", "~했던 게 기억나요", "어린 시절 회상 만능 표현이에요 🎬"], ["totally packed", "사람들로 꽉 찬", "과거경험 편에서 재활용! 🔁 옛날 은행 묘사"], ["take a number & wait forever", "번호표 뽑고 한참 기다리다", "묘사·습관 콤보 + forever 과장 양념 😆"], ["Back then", "그 시절에는", "과거 파트 시작 시그널. These days와 짝꿍 ⏰"], ["had no choice but to ~", "~할 수밖에 없었다", "불편했던 과거를 강조하는 고급 구문 💪"], ["These days", "요즘에는", "현재 전환 시그널. Back then 다음 자동으로! 🔁"], ["it's a completely different story", "완전히 다른 이야기다", "과거→현재 전환을 극적으로! 서베이 공통 🔁 🎭"], ["much less crowded than they used to be", "예전보다 훨씬 한산한", "묘사 편 문장 재활용 🔁 비교급+used to"], ["compared to ~", "~과 비교하면", "비교 답변 마무리 공식 문구예요 🔁 📊"], ["way more convenient", "훨씬 더 편리한", "much 대신 way = 원어민 느낌, 서베이 개근 🔁 💪"]], "audio": "audio/2_돌발/2-005 1. 은행(Bank)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-005 1. 은행(Bank)_비교.mp3"}, {"id": "2-006", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "묘사", "badge": "06 묘사", "enQ": "Describe the hotels in your country. What are they like, and where are they usually located? Tell me in detail.", "enA": "Hotels in Korea come in all shapes and sizes. In big cities like Seoul, you'll find everything from five-star luxury hotels with fancy lounges to small business hotels tucked away near subway stations.\n\nLocation-wise, they follow a simple rule: luxury hotels sit in the city center or by the river with amazing night views, business hotels cluster around stations, and resort hotels line the beaches and mountains — Jeju and Gangneung are packed with ocean-view rooms. Prices vary a lot too, so there's something for every budget.\n\nOne thing I love about Korean hotels: the service is famously fast and kind. Also, most of them have amazing breakfast buffets — honestly, half the reason people book them! So yeah, that's pretty much hotels in Korea: something for everyone, wherever you go.", "koQ": "당신의 나라에 있는 호텔들을 묘사해주세요. 그곳들은 어떤 모습이고, 주로 어디에 위치해 있나요? 자세히 말해주세요.", "koA": "한국의 호텔은 정말 각양각색이에요. 서울 같은 대도시에는 화려한 라운지를 갖춘 5성급 럭셔리 호텔부터 지하철역 근처에 숨어 있는 작은 비즈니스호텔까지 다 있어요.\n\n위치로 보면 간단한 규칙이 있어요. 럭셔리 호텔은 도심이나 야경이 멋진 강변에, 비즈니스호텔은 역 주변에 모여 있고, 리조트 호텔은 해변과 산을 따라 늘어서 있죠. 제주와 강릉은 오션뷰 객실로 가득해요. 가격대도 다양해서 어떤 예산에도 맞는 곳이 있어요.\n\n한국 호텔에서 제가 좋아하는 점 하나요. 서비스가 빠르고 친절하기로 유명해요. 그리고 대부분 조식 뷔페가 엄청나요. 솔직히 사람들이 호텔을 예약하는 이유의 절반이죠! 네, 한국 호텔은 대체로 이래요. 어딜 가든 누구에게나 맞는 곳이 있어요.", "struct": [["1️⃣ 도입", "각양각색 (5성급~비즈니스)"], ["2️⃣ 위치", "도심 · 역 주변 · 해변 리조트"], ["3️⃣ 예시", "제주 · 강릉 오션뷰"], ["4️⃣ 특징", "빠른 서비스 + 조식 뷔페"], ["5️⃣ 마무리", "누구에게나 맞는 호텔"]], "scoring": [["종류→위치 구조", "질문의 두 축(어떤 모습 / 어디에)을 종류별 위치 규칙 하나로 묶어 답하면 깔끔해요 ✅ 두 질문을 한 문장으로 엮는 게 요령이에요"], ["세 그룹 정리", "럭셔리 · 비즈니스 · 리조트 3분류가 카테고리 묘사의 정석이에요 🔑 분류마다 위치 규칙(도심 / 역 근처 / 바닷가)을 짝지어 주면 개요가 저절로 완성돼요"], ["지명 디테일", "제주 · 강릉 같은 실제 지명이 들어가면 묘사에 현장감이 생겨요 🌅 서베이 국내여행 편과 자연스럽게 연결되는 디테일이라 일석이조예요 🔁"], ["조식 마무리", "호텔의 반은 조식이라는 half the reason 한 줄이 답변의 미소 포인트예요 😊 진지한 묘사 끝의 농담 반 스푼이 원어민 같은 여유를 보여 줘요"]], "expr": [["come in all shapes and sizes", "각양각색이다", "종류 묘사의 만능 오프닝 ✨"], ["five-star luxury hotel", "5성급 럭셔리 호텔", "호텔 등급 어휘 기본 ⭐"], ["tucked away", "(골목에) 숨어 있는", "서베이 카페 편 재활용 🔁 ☕"], ["location-wise", "위치로 말하자면", "-wise = ~로 보면. 전환 만능 🔑"], ["night view", "야경", "K-호텔 세일즈 포인트 🌙"], ["ocean-view room", "오션뷰 객실", "국내여행 강릉 편과 연결 🔁 🌅"], ["packed with ~", "~로 가득한", "totally packed의 사촌, 여행 편 🔁"], ["something for every budget", "어떤 예산에도 맞는 것", "다양성을 정리하는 표현 💳"], ["breakfast buffet", "조식 뷔페", "호텔의 꽃! 취향 편 예고 🔁 🍳"], ["half the reason", "이유의 절반", "half the fun 재활용, 서베이 공통 🔁 😊"], ["that's pretty much ~", "대체로 ~이다", "묘사 마무리 시그널, 시리즈 공통 🔁 ✅"]], "audio": "audio/2_돌발/2-006 2. 호텔(Hotel)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-006 2. 호텔(Hotel)_묘사.mp3"}, {"id": "2-007", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "습관", "badge": "07 습관", "enQ": "What do you usually do when you get to a hotel? What steps do you go through from check-in to settling into your room? Tell me everything in order.", "enA": "Oh, I have a whole hotel arrival ritual — let me walk you through it. First, check-in at the front desk: passport or ID, a quick signature, and the magic moment — getting the key card.\n\nThen, the second I enter the room, my golden rule kicks in: curtains first! I throw them open to check the view, because the view sets the mood for the whole stay. After that, I do a quick inspection: testing the bed with a little bounce, checking the bathroom, peeking into the mini fridge.\n\nThen I unpack the essentials, make a cup of the free coffee, and flop onto the bed like a starfish — hands down the best moment of any trip. It never gets old. After that little ritual, the vacation officially begins!", "koQ": "호텔에 도착하면 주로 무엇을 하나요? 체크인부터 방에 짐을 푸는 것까지 어떤 절차를 거치나요? 순서대로 모두 말해주세요.", "koA": "아, 저는 호텔 도착 의식이 완전히 정해져 있어요. 차근차근 설명해 드릴게요. 먼저 프런트에서 체크인이요. 여권이나 신분증, 간단한 서명, 그리고 마법의 순간, 키 카드 받기!\n\n그리고 방에 들어서는 순간 저의 황금률이 발동해요. 커튼부터! 커튼을 활짝 열고 전망을 확인해요. 전망이 숙박 전체의 분위기를 결정하거든요. 그다음엔 빠른 점검을 해요. 침대에 살짝 튕겨 보고, 욕실을 확인하고, 미니 냉장고를 슬쩍 들여다보죠.\n\n그러고 나서 꼭 필요한 것만 짐을 풀고, 무료 커피를 한 잔 내리고, 침대에 불가사리처럼 벌러덩 눕는 거예요. 두말할 것 없이 모든 여행 최고의 순간이죠. 해도 해도 질리지 않아요. 이 작은 의식이 끝나면 휴가가 공식적으로 시작되는 거예요!", "struct": [["1️⃣ 도입", "도착 의식 선언"], ["2️⃣ 절차", "체크인 → 키 카드"], ["3️⃣ 원칙", "커튼 오픈 → 전망 확인"], ["4️⃣ 점검", "침대 · 욕실 · 미니 냉장고"], ["5️⃣ 마무리", "불가사리 눕기 = 휴가 시작"]], "scoring": [["순서 접속사", "First → Then → After that로 절차 질문의 뼈대를 세우세요 ✅ 서베이 요리 편의 레시피 기술과 완전히 같은 공식이에요 🔁"], ["커튼 오픈 원칙", "체크인하면 커튼부터! 나만의 1순위 행동이 습관 답변의 개성 포인트예요 🔑 누구에게나 있는 자기만의 순서에 이름을 붙여 말해 보세요"], ["점검 투어 유머", "침대 튕겨 보기, 냉장고 엿보기 — 누구나 하는 행동에 점검 투어라는 이름을 붙이면 웃음이 나요 😆 유머는 과장이 아니라 이름 붙이기에서 나와요"], ["불가사리 마무리", "침대에 불가사리 자세로 눕는 한 장면으로 절차 설명이 이야기로 끝나요 🛌 서베이의 장면 마무리 공식 그대로, 마지막은 그림 한 장이 정답이에요 🔁"]], "expr": [["arrival ritual", "도착 의식", "루틴에 이름 붙이기, 서베이 기술 🔁 ✨"], ["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 서베이 개근 🔁 🔑"], ["check in at the front desk", "프런트에서 체크인하다", "호텔 절차 어휘 1번 ✅"], ["key card", "키 카드", "호텔 어휘 기본템 🔑"], ["golden rule", "황금률, 나만의 원칙", "서베이 습관 편 공통 뼈대 🔁 💪"], ["throw open the curtains", "커튼을 활짝 열다", "장면이 그려지는 동사구 🌅"], ["set the mood", "분위기를 결정하다", "음악·공연 편 재활용 🔁 🎵"], ["do a quick inspection", "빠르게 점검하다", "내 루틴을 격식어로 말하는 유머 😆"], ["unpack the essentials", "필수품만 짐을 풀다", "여행 습관 디테일 🎒"], ["flop onto the bed", "침대에 벌러덩 눕다", "휴가 편 소파 감성의 호텔 버전 🔁 🛌"], ["It never gets old", "봐도 봐도 질리지 않는다", "습관 마무리 공식, 서베이 개근 🔁 💕"]], "audio": "audio/2_돌발/2-007 2. 호텔(Hotel)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-007 2. 호텔(Hotel)_습관.mp3"}, {"id": "2-008", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "취향", "badge": "08 취향", "enQ": "What kind of hotel do you prefer to stay at, and why? What do you consider the most when choosing a hotel - the location, price, or facilities?", "enA": "If I had to choose, I'm all about comfort-focused hotels — not the fanciest ones, but the ones with an amazing bed and a great breakfast. For me, it's all about how well I sleep and how happy I am at breakfast.\n\nSo between location, price, and facilities? Honestly, I'd pick facilities over location any day. Think about it — the whole point of a hotel is resting, and a stiff bed can ruin an entire trip. Don't get me wrong, I still check the price like crazy and hunt for deals — my shopping instincts never rest!\n\nBut nothing beats waking up on a cloud-like bed and heading straight to a breakfast buffet. Eggs, croissants, and that first coffee with a view — pure happiness. In a nutshell: good sleep and good breakfast first, everything else is a bonus.", "koQ": "어떤 종류의 호텔에 머무는 것을 선호하고, 그 이유는 무엇인가요? 호텔을 고를 때 위치, 가격, 시설 중 무엇을 가장 중요하게 생각하나요?", "koA": "굳이 고르자면 저는 편안함에 집중한 호텔이 좋아요. 제일 화려한 곳이 아니라, 침대가 끝내주고 조식이 훌륭한 곳이요. 저한테는 얼마나 잘 자고, 아침에 얼마나 행복한지가 전부거든요.\n\n그래서 위치, 가격, 시설 중에서요? 솔직히 저는 두말없이 위치보다 시설을 고를 거예요. 생각해 보세요. 호텔의 존재 이유는 쉬는 건데, 딱딱한 침대 하나가 여행 전체를 망칠 수도 있잖아요. 오해는 마세요. 가격도 엄청나게 확인하고 특가도 사냥해요. 제 쇼핑 본능은 쉬는 법이 없거든요!\n\n하지만 구름 같은 침대에서 눈을 떠서 곧장 조식 뷔페로 향하는 것만 한 게 없죠. 계란 요리, 크루아상, 그리고 전망과 함께하는 첫 커피. 순수한 행복이에요. 한마디로 좋은 잠과 좋은 아침이 먼저, 나머지는 전부 보너스예요.", "struct": [["1️⃣ 선언", "편안함 중심 호텔"], ["2️⃣ 선택", "시설 > 위치 (침대!)"], ["3️⃣ 예외", "가격 비교 + 특가 사냥"], ["4️⃣ 절정", "구름 침대 + 조식 뷔페"], ["5️⃣ 마무리", "잠·조식 먼저, 나머지 보너스"]], "scoring": [["3지선다 공략", "위치 · 가격 · 시설을 셋 다 언급한 뒤 하나를 고르는 게 이 질문의 정석이에요 ✅ over 공식으로 선택을 선언하세요"], ["본질 논리", "호텔의 존재 이유 = 휴식이라는 본질 논리가 시설 선택에 설득력을 줘요 🤔 왜를 한 번 더 파고들면 답변의 격이 달라지는 IH 논리 포인트예요"], ["쇼핑 본능 연결", "가격 이야기엔 특가 사냥 한 줄로 서베이 쇼핑 편 캐릭터를 이어 주세요 🔁 시리즈 일관성이 쌓일수록 실전에서 자신감이 붙어요"], ["장면 절정", "구름 같은 침대 + 아침 조식 커피 장면이 nothing beats의 근거가 돼요 ☀️ 서베이 취향 공식의 절정 장면 기술을 그대로 쓴 페이지예요 🔁"]], "expr": [["comfort-focused", "편안함 중심의", "취향을 한 단어로 요약 ✨"], ["If I had to choose", "굳이 하나를 고르자면", "취향 오프닝, 서베이 개근 🔁 🔑"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식, 시리즈 공통 🔁 💕"], ["A over B any day", "두말없이 B보다 A", "3지선다 질문의 필승 선택 공식 🔁 ✅"], ["the whole point of ~", "~의 존재 이유", "본질을 짚는 IH 표현 🤔"], ["stiff bed", "딱딱한 침대", "반대 사례로 설득력 UP 🛌"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["hunt for deals", "특가를 사냥하다", "서베이 쇼핑 편 재활용 🔁 🔥"], ["Nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 ☀️"], ["cloud-like bed", "구름 같은 침대", "침실 편 매트리스 사랑 재활용 🔁 😴"], ["In a nutshell", "한마디로 정리하면", "취향 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-008 2. 호텔(Hotel)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-008 2. 호텔(Hotel)_취향.mp3"}, {"id": "2-009", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "과거 경험", "badge": "09 과거 경험", "enQ": "Tell me about the last time you stayed at a hotel. Where was it, and why were you staying there? What did you do during your stay? Tell me the whole story.", "enA": "This reminds me of my best friend's birthday a few months ago. Instead of a regular dinner, we decided to do a hotel staycation in Seoul — you know, celebrating without going far.\n\nWe got a room on a high floor with an amazing city view. We spent the afternoon at the pool, then came back up, ordered chicken and beer — of course — and had our own little party with the night view. And guess what: when the front desk heard it was her birthday, they sent up a small cake, completely out of nowhere. We were so touched!\n\nThe next morning, we ate way too much at the breakfast buffet — zero regrets. Everything about that stay worked out perfectly, and since then, a birthday hotel night has become our little tradition. Honestly, best birthday plan ever.", "koQ": "마지막으로 호텔에 머물렀던 때에 대해 말해주세요. 어디였고, 왜 그곳에 머물렀나요? 머무는 동안 무엇을 했나요? 전체 이야기를 들려주세요.", "koA": "몇 달 전 절친의 생일이 생각나네요. 평범한 저녁 식사 대신, 우리는 서울에서 호텔 스테이케이션을 하기로 했어요. 멀리 가지 않고 기념하는 거죠.\n\n고층의 시티뷰가 끝내주는 방을 잡았어요. 오후엔 수영장에서 놀고, 방으로 올라와서 당연히 치킨과 맥주를 시키고, 야경과 함께 우리만의 작은 파티를 했죠. 그런데 있잖아요. 프런트에서 절친 생일이라는 걸 듣고는, 난데없이 작은 케이크를 올려 보내 준 거예요. 정말 감동했어요!\n\n다음 날 아침엔 조식 뷔페에서 과식했어요. 후회는 없어요. 그 숙박의 모든 게 완벽하게 흘러갔고, 그 후로 생일 호텔 파티는 우리의 작은 전통이 됐어요. 솔직히 역대 최고의 생일 계획이에요.", "struct": [["1️⃣ 도입", "절친 생일 · 호캉스 결정"], ["2️⃣ 낮", "고층 시티뷰 + 수영장"], ["3️⃣ 밤", "치맥 파티 + 깜짝 케이크"], ["4️⃣ 아침", "조식 뷔페 과식 (무후회)"], ["5️⃣ 마무리", "since then + 생일 전통"]], "scoring": [["4W 커버", "어디(서울 호텔) · 왜(생일) · 무엇(수영장 · 치맥) — 질문의 요소를 시간 순으로 커버하세요 ✅ 요소만 다 담아도 절반은 성공이에요"], ["깜짝 사건", "out of nowhere 등장한 케이크가 이 경험담의 심장이에요 🎭 반전 없는 경험담은 심심하니, 작은 깜짝 사건 하나는 꼭 심어 두세요"], ["시리즈 연결", "치맥과 절친, 휴가 편 감성까지 — 서베이 페르소나가 그대로 이어지는 페이지예요 🔁 인물과 취향이 변하지 않아야 진짜 이야기처럼 들려요"], ["전통 마무리", "일회성 이벤트를 our little tradition으로 닫는 마무리, 서베이 필승 패턴 그대로예요 🔁 🎓 경험은 전통이 될 때 가장 IH다워져요"]], "expr": [["staycation", "스테이케이션, 호캉스", "서베이 휴가 편 감성 재활용 🔁 🏠"], ["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 서베이 개근 🔁 🔑"], ["without going far", "멀리 가지 않고", "호캉스의 본질을 한 구로 ✨"], ["a room on a high floor", "고층 객실", "호텔 경험담 필수 디테일 🌙"], ["chicken and beer", "치킨과 맥주, 치맥", "서베이 술집 편 치맥 재활용 🔁 🍺"], ["guess what", "글쎄, 그런데 있잖아요", "반전 시그널, 서베이 개근 🔁 🎭"], ["out of nowhere", "난데없이, 갑자기", "깜짝 사건 공식, 서베이 개근 🔁 🔥"], ["be touched", "감동하다", "감정 리액션 필수 표현 💕"], ["zero regrets", "후회 제로", "서베이 침실 편 재활용 🔁 💯"], ["work out perfectly", "완벽하게 흘러가다", "worked out fine의 업그레이드 ✅"], ["our little tradition", "우리의 작은 전통", "경험 마무리 공식, 서베이 개근 🔁 🎓"]], "audio": "audio/2_돌발/2-009 2. 호텔(Hotel)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-009 2. 호텔(Hotel)_과거 경험.mp3"}, {"id": "2-010", "cat": "unexpected", "catName": "돌발 질문", "num": 2, "topic": "호텔", "topicEn": "Hotel", "type": "비교", "badge": "10 비교", "enQ": "Compare hotels these days with the ones from the past. How have hotels and their services changed over time? Tell me about the differences.", "enA": "Hotels have changed a lot since I was a kid. Back then, booking a hotel meant calling the front desk directly — my parents used to do exactly that for our family trips, asking about rooms one by one.\n\nRooms were simpler too: a heavy metal key you had to leave at the desk, a small TV, and if you needed anything, you picked up the room phone and waited.\n\nThese days, it's a completely different story. I book a room on an app in minutes — photos, reviews, and price comparisons all in one place. Check-in is done by kiosk in some hotels, the key is a card or even my phone, and room service arrives after a few taps. Compared to the past, hotels are way more convenient and high-tech. Though I have to admit, that heavy room key had its own charm — it felt like holding the trip in your hand.", "koQ": "요즘 호텔과 과거의 호텔을 비교해주세요. 시간이 지나며 호텔과 그 서비스는 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "호텔은 제가 어릴 때에 비해 정말 많이 변했어요. 그때 호텔 예약이란 프런트에 직접 전화하는 거였죠. 저희 부모님이 가족 여행 때 딱 그렇게 하셨어요. 방 있는지 하나하나 물어보면서요.\n\n객실도 더 단순했어요. 나갈 때 프런트에 맡겨야 하는 묵직한 금속 열쇠, 작은 TV. 그리고 뭔가 필요하면 객실 전화를 들고 기다렸죠.\n\n요즘은 완전히 다른 이야기예요. 저는 앱에서 몇 분 만에 방을 예약해요. 사진, 리뷰, 가격 비교까지 전부 한곳에서요. 어떤 호텔은 키오스크로 체크인하고, 열쇠는 카드나 심지어 제 폰이고, 룸서비스는 몇 번 터치하면 와요. 과거와 비교하면 호텔은 훨씬 편리하고 하이테크해졌어요. 그래도 인정할게요. 그 묵직한 열쇠에는 나름의 매력이 있었어요. 여행을 손에 쥐고 있는 느낌이랄까요.", "struct": [["1️⃣ 도입", "많이 변한 호텔"], ["2️⃣ 과거", "전화 예약 · 금속 열쇠"], ["3️⃣ 현재", "앱 예약 · 키오스크 · 폰 키"], ["4️⃣ 대비", "way more 편리 + 하이테크"], ["5️⃣ 마무리", "열쇠의 낭만 한 스푼"]], "scoring": [["예약 방식 대비", "전화 한 통 vs 앱 몇 분. 국내여행 비교 편의 예약 논리를 호텔에 그대로 재활용하세요 🔁 ✅ 비교 축 하나는 예약이 정답이에요"], ["열쇠 소품 기술", "묵직한 금속 열쇠 vs 폰 속 디지털 키 — 소품 하나의 변화로 시대 전체가 보여요 🔑 물건이 시대를 말하게 하는 서베이 소품 공식이에요"], ["하이테크 나열", "셀프 체크인 키오스크 · 폰 키 · 터치스크린 룸서비스. 현재의 디테일 세 개면 변화가 구체적으로 증명돼요 📏 나열 셋은 언제나 옳아요"], ["낭만 마무리", "편리함을 인정하되 열쇠를 건네받던 낭만을 그리워하는 균형 마무리 — 비교 편의 공통 공식, 이제 완전히 몸에 익었죠? 🔁 🎓"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 서베이 공통 시그널 🔁 🧩"], ["call the front desk directly", "프런트에 직접 전화하다", "국내여행 비교 편 재활용 🔁 💬"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 서베이 개근 🔁 💓"], ["one by one", "하나하나", "수고로움을 보여 주는 부사구 ⏰"], ["heavy metal key", "묵직한 금속 열쇠", "시대를 소환하는 킬러 소품 🔑"], ["room service", "룸서비스", "호텔 서비스 어휘 기본 ✨"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 서베이 공통 🔁 🎭"], ["all in one place", "전부 한곳에서", "앱 시대의 편리함 요약 💪"], ["self check-in kiosk", "셀프 체크인 키오스크", "요즘 호텔의 디테일 어휘 ✅"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 서베이 공통 🔁 📊"], ["have its own charm", "나름의 매력이 있다", "I have to admit의 짝꿍 표현 🔁 😊"]], "audio": "audio/2_돌발/2-010 2. 호텔(Hotel)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-010 2. 호텔(Hotel)_비교.mp3"}, {"id": "2-011", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "묘사", "badge": "11 묘사", "enQ": "Describe your favorite restaurant near your home. What does it look like, and what kind of food does it serve? How often do you eat there?", "enA": "My favorite restaurant is a tiny kimchi-jjigae place tucked away in the alley behind my street — the same alley as my cafe Moon, actually. It only has about six tables, but it's always cozy and spotless.\n\nThe owners are an older couple who have run it for over twenty years. Their menu is short and confident: kimchi stew, grilled fish, and giant rolled omelets. Everything comes with free refills of side dishes, which I love. And yes — the owner remembers my order. I basically don't even need to speak!\n\nI eat there about once a week, usually on Fridays when I don't feel like cooking. It's the kind of place where you walk in stressed and walk out happy. So yeah, that's pretty much my favorite spot: nothing flashy, but full of warmth.", "koQ": "집 근처에서 가장 좋아하는 식당을 묘사해주세요. 어떻게 생겼고, 어떤 음식을 파나요? 얼마나 자주 그곳에서 식사하나요?", "koA": "제가 가장 좋아하는 식당은 저희 집 뒷골목에 숨어 있는 작은 김치찌개집이에요. 사실 제 단골 카페 문(Moon)이 있는 그 골목이요. 테이블이 여섯 개 정도밖에 없지만, 항상 아늑하고 티 없이 깨끗해요.\n\n사장님은 20년 넘게 가게를 운영해 온 노부부세요. 메뉴는 짧고 자신감 넘쳐요. 김치찌개, 생선구이, 왕계란말이. 모든 메뉴에 반찬 무한리필이 되는데, 그게 정말 좋아요. 그리고 네, 사장님이 제 주문을 기억하세요. 사실상 말할 필요도 없어요!\n\n일주일에 한 번 정도 가요. 주로 요리하기 귀찮은 금요일에요. 스트레스받으며 들어가서 행복하게 걸어 나오는, 그런 곳이에요. 네, 제 최애 식당은 대체로 이래요. 화려하진 않지만 따뜻함이 가득한 곳이요.", "struct": [["1️⃣ 도입", "뒷골목 김치찌개집 (문(Moon) 골목!)"], ["2️⃣ 외관", "테이블 6개 · 아늑 · 깨끗"], ["3️⃣ 메뉴", "찌개 · 생선구이 · 왕계란말이"], ["4️⃣ 빈도", "주 1회 · 요리 귀찮은 금요일"], ["5️⃣ 마무리", "화려함 대신 따뜻함"]], "scoring": [["3요소 순서대로", "생김새(작고 아늑) → 음식(메뉴 3종) → 빈도(주 1회) — 질문이 준 순서가 곧 답변의 개요예요 ✅ 순서만 따라가도 개요 완성!"], ["숫자 디테일", "테이블 6개, 20년 운영 같은 숫자가 묘사를 사진처럼 선명하게 만들어요 📏 형용사 열 개보다 숫자 두 개가 힘이 센 IH 디테일 기술이에요"], ["시리즈 지도 확장", "문(Moon) 카페와 같은 골목이라는 한 줄로 서베이 동네 지도에 식당이 추가돼요 🔁 🗺️ 내 동네가 구체적일수록 모든 답변이 진짜가 돼요"], ["온도 마무리", "스트레스를 안고 들어가서 행복을 들고 나온다 — 장소의 온도를 말하는 마무리가 묘사의 격을 한 단계 올려 줘요 💕 장소 묘사의 필살 마무리예요"]], "expr": [["tucked away", "(골목에) 숨어 있는", "서베이 카페 편 재활용 🔁 ☕"], ["cozy", "아늑한", "작은 가게 묘사 필수 형용사 🔁 🏠"], ["spotless", "티 없이 깨끗한", "서베이 카페·집 편 재활용 🔁 🧹"], ["run by an older couple", "노부부가 운영하는", "가게에 이야기를 입히는 디테일 💕"], ["short and confident", "짧고 자신감 있는", "메뉴판을 사람처럼 묘사하는 기술 ✨"], ["free refills", "무한리필", "K-식당 문화 소개 포인트 🍳"], ["remember my order", "내 주문을 기억하다", "서베이 동네 편 빵집 재활용 🔁 😊"], ["once a week", "일주일에 한 번", "how often 질문 필수 답 ⏰"], ["the kind of place where ~", "~한 그런 곳", "서베이 동네 편 공식 재활용 🔁 🔑"], ["nothing flashy", "화려하진 않은", "서베이 동네 편 마무리 재활용 🔁 ✅"], ["that's pretty much ~", "대체로 ~이다", "묘사 마무리 시그널, 시리즈 공통 🔁 ✅"]], "audio": "audio/2_돌발/2-011 3. 식당(Restaurant)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-011 3. 식당(Restaurant)_묘사.mp3"}, {"id": "2-012", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "습관", "badge": "12 습관", "enQ": "How often do you eat out, and who do you usually go with? What do you normally do at a restaurant, from ordering to paying? Describe your routine.", "enA": "I eat out once or twice a week, usually with my best friend or my little brother. We have a whole restaurant routine, so let me walk you through it.\n\nFirst, ordering: these days it's mostly a tablet on the table, so we tap through the menu together. My golden rule: never order the same dish. We always pick different ones and share, so we get to taste twice as much! While we wait, we play a silly game: guessing which table gets their food first.\n\nAfter eating, we split the bill with a quick app transfer — my banking app doing its job! Then we usually wrap up with iced americanos nearby. Dinner first, coffee after — same reward formula as always. Simple routine, but it never gets old.", "koQ": "얼마나 자주 외식을 하고, 주로 누구와 함께 가나요? 식당에서 주문부터 계산까지 보통 무엇을 하나요? 당신의 루틴을 설명해주세요.", "koA": "저는 일주일에 한두 번 외식해요. 주로 절친이나 남동생과 함께요. 완전히 정해진 식당 루틴이 있는데, 차근차근 설명해 드릴게요.\n\n먼저 주문이요. 요즘은 대부분 테이블 위 태블릿이라, 같이 메뉴를 눌러 봐요. 저의 황금률은 절대 같은 메뉴를 시키지 않는 거예요. 항상 다른 걸 골라서 나눠 먹어요. 그러면 두 배로 맛볼 수 있으니까요! 기다리는 동안엔 실없는 게임을 해요. 어느 테이블 음식이 먼저 나올지 맞히기요.\n\n다 먹고 나면 앱 송금으로 더치페이를 해요. 제 은행 앱이 제 몫을 하는 거죠! 그러고는 근처에서 아이스 아메리카노로 마무리해요. 저녁 먼저, 커피는 나중에. 늘 같은 보상 공식이에요. 단순한 루틴이지만 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "주 1~2회 · 절친/남동생"], ["2️⃣ 주문", "태블릿 + 다른 메뉴 공유 원칙"], ["3️⃣ 대기", "음식 먼저 나오나 맞히기 게임"], ["4️⃣ 계산", "앱 송금 더치페이 (은행 연결)"], ["5️⃣ 마무리", "저녁 → 아아 보상 공식"]], "scoring": [["세 질문 커버", "빈도(주 1~2회) → 동행(절친 · 남동생) → 절차(주문~계산). 질문 세 개를 순서대로 빠짐없이 답하세요 ✅"], ["공유 원칙", "같은 메뉴 금지 + 나눠 먹기 원칙이 습관 답변의 개성이자 K-문화 소개예요 🔑 나만의 원칙 하나가 평범한 루틴에 성격을 입혀 줘요"], ["대기 시간 유머", "어느 테이블 음식이 먼저 나올지 맞히는 게임처럼 사소한 행동 하나가 루틴을 이야기로 만들어요 😆 기다리는 시간까지 디테일이 되는 게 IH 습관 답변이에요"], ["시리즈 공식 연결", "앱 더치페이(은행 취향 편)와 아아 보상(서베이 습관 공통)으로 시리즈 연결이 이어져요 🔁 🎓 공식은 주제가 바뀌어도 그대로 통해요"]], "expr": [["once or twice a week", "일주일에 한두 번", "빈도 질문의 첫 문장 공식 ⏰"], ["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 서베이 개근 🔁 🔑"], ["golden rule", "황금률, 나만의 원칙", "서베이 습관 편 공통 뼈대 🔁 ✨"], ["share", "나눠 먹다", "K-식사 문화의 핵심 동사 🍳"], ["twice as much", "두 배로 많이", "서베이 집 편 twice as long 재활용 🔁 📏"], ["a silly game", "실없는 게임", "루틴에 유머 한 스푼 😆"], ["split the bill", "나눠 내다, 더치페이하다", "외식 마무리 필수 표현 💳"], ["app transfer", "앱 송금", "은행 취향 편과 연결되는 디테일 🔁 📊"], ["wrap up with ~", "~로 마무리하다", "finish보다 구어체다운 마무리 동사 ✅"], ["dinner first, coffee after", "저녁 먼저, 커피는 나중에", "나만의 규칙 대구 표현, 보상 공식 짝꿍 ☕"], ["it never gets old", "아무리 해도 질리지 않아요", "습관 마무리 공식, 서베이 개근 🔁 💕"]], "audio": "audio/2_돌발/2-012 3. 식당(Restaurant)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-012 3. 식당(Restaurant)_습관.mp3"}, {"id": "2-013", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "취향", "badge": "13 취향", "enQ": "What is your favorite dish at the restaurant you often go to? Why do you like that food? Tell me about it in as much detail as you can.", "enA": "If I had to choose, it's the kimchi-jjigae, no contest. For me, it's all about the broth: deep, spicy, just sour enough, simmered with big chunks of pork.\n\nI'd pick it over any fancy pasta any day. Don't get me wrong — I enjoy trying new food too. But when I'm tired or stressed, my brain just autocompletes to that stew. Fun fact: I'm a kimchi person through and through. My own signature dish at home is kimchi fried rice, so you could say this stew is the pro version of my cooking!\n\nNothing beats that first spoonful on a cold day — it warms you from the inside out. In a nutshell: one bowl, zero disappointment, one hundred percent comfort.", "koQ": "자주 가는 식당에서 가장 좋아하는 메뉴는 무엇인가요? 왜 그 음식을 좋아하나요? 가능한 자세히 말해주세요.", "koA": "굳이 고르자면 김치찌개요. 고민할 것도 없어요. 저한테는 국물이 전부거든요. 깊고, 얼큰하고, 딱 적당히 새콤하고, 큼직한 돼지고기가 들어가 있죠.\n\n화려한 파스타보다는 두말없이 김치찌개를 고를 거예요. 오해는 마세요. 저도 새로운 음식 도전을 좋아해요. 하지만 피곤하거나 스트레스받을 때면 머릿속에 자동 완성처럼 그 찌개가 떠올라요. 재밌는 사실 하나요. 저는 뼛속까지 김치인간이에요. 제 시그니처 집밥 요리가 김치볶음밥이니까, 이 찌개는 제 요리의 프로 버전인 셈이죠!\n\n추운 날 그 첫술만 한 게 없어요. 속부터 따뜻하게 데워 주거든요. 한마디로 한 그릇에 실망 제로, 위로 100%예요.", "struct": [["1️⃣ 선언", "김치찌개, no contest"], ["2️⃣ 이유", "국물: 깊고 얼큰, 새콤"], ["3️⃣ 예외", "새 음식도 OK, 지친 날은 찌개"], ["4️⃣ 연결", "김치볶음밥 = 내 요리 (요리 편)"], ["5️⃣ 마무리", "첫술 + 실망 제로 정리"]], "scoring": [["국물 집중 공략", "왜 좋은지엔 맛 요소 하나(국물)를 골라 깊게 파세요 🍳 얕게 여러 개를 나열하는 것보다 하나를 파는 쪽이 훨씬 강력해요"], ["오감 형용사", "deep, spicy, sour처럼 맛 형용사 3연타가 음식 묘사의 핵심 기술이에요 ✨ 혀로 느껴지는 단어들이 들어가야 음식 답변이 살아나요"], ["요리 편 수미상관", "내가 만드는 김치볶음밥 이야기와 이어 붙이면 서베이 요리 편 캐릭터가 살아나요 🔁 좋아하는 음식과 만드는 음식이 이어지는 일관성 포인트죠"], ["숫자 마무리", "실망 0% + 위로 100%. 숫자 대구로 닫는 마무리는 통째로 외워 둘 가치가 있어요 💯 어떤 최애 질문에도 응용할 수 있는 만능 마무리예요"]], "expr": [["If I had to choose", "굳이 하나를 고르자면", "취향 오프닝, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "은행 취향 편 재활용 🔁 🔥"], ["it's all about the broth", "핵심은 국물이다", "all about 공식의 음식 버전 🔁 🍳"], ["just sour enough", "딱 적당히 새콤한", "just ~ enough = 딱 좋은 정도 ✨"], ["A over B any day", "두말없이 B보다 A", "선호 공식, 서베이 공통 🔁 ✅"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["through and through", "뼛속까지, 완전히", "정체성 강조 관용구 💪"], ["signature dish", "시그니처 요리", "서베이 요리 편 김치볶음밥 재활용 🔁 🔥"], ["Nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 ☀️"], ["warm you from the inside out", "속부터 데워 주다", "음식 위로를 그리는 표현 💕"], ["In a nutshell", "한마디로 정리하면", "취향 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-013 3. 식당(Restaurant)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-013 3. 식당(Restaurant)_취향.mp3"}, {"id": "2-014", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "과거 경험", "badge": "14 과거 경험", "enQ": "Tell me about the last time you ate out. Where did you go, who were you with, and what did you order? Describe what happened that day in detail.", "enA": "This reminds me of last Saturday. My little brother suddenly showed up at my place — fridge raid, as usual — so we decided to just go out and eat at my favorite kimchi-jjigae place instead.\n\nWe ordered the stew and a giant rolled omelet, our usual combo. Then, guess what: the owner brought us a plate of freshly grilled fish, completely out of nowhere — service, she said, because we looked hungry. In Korea, service means free food — the most beautiful word in any restaurant!\n\nWe ate until we couldn't move. Zero regrets, obviously. My brother even promised to do my dishes to say thanks... and then fell asleep on my sofa instead. Everything worked out deliciously, and since then, he asks for that place every single visit.", "koQ": "마지막으로 외식했던 때에 대해 말해주세요. 어디에 갔고, 누구와 함께였으며, 무엇을 주문했나요? 그날 있었던 일을 자세히 묘사해주세요.", "koA": "지난 토요일이 생각나네요. 남동생이 갑자기 저희 집에 나타났어요. 늘 그렇듯 냉장고 습격이었죠. 그래서 그냥 나가서 제 최애 김치찌개집에서 먹기로 했어요.\n\n찌개랑 왕계란말이를 시켰어요. 우리의 늘 먹던 조합이죠. 그런데 있잖아요. 사장님이 갓 구운 생선구이 한 접시를 들고 오신 거예요. 완전히 난데없이요. 우리가 배고파 보였다며 서비스래요. 한국에서 서비스는 공짜 음식이라는 뜻이잖아요. 모든 식당에서 가장 아름다운 단어죠!\n\n우리는 움직일 수 없을 때까지 먹었어요. 당연히 후회는 제로예요. 남동생은 고맙다고 설거지를 해 주겠다더니... 대신 제 소파에서 잠들었어요. 모든 게 맛있게 잘 흘러갔고, 그 후로 걔는 올 때마다 그 집에 가자고 해요.", "struct": [["1️⃣ 도입", "지난 토요일 · 동생 냉장고 습격"], ["2️⃣ 주문", "찌개 + 왕계란말이 콤보"], ["3️⃣ 반전", "사장님 깜짝 서비스 생선구이"], ["4️⃣ 결과", "과식 · 무후회 · 소파 취침"], ["5️⃣ 마무리", "since then + 동생 단골 등극"]], "scoring": [["3W 순서대로", "어디(단골 찌개집) · 누구(남동생) · 무엇(찌개 + 계란말이) — 질문 요소부터 깔끔하게 커버하세요 ✅"], ["서비스 반전", "깜짝 생선구이 서비스가 이 경험담의 심장이에요 🎭 반전이 곧 K-서비스 문화 소개가 되니 보너스 득점까지 챙기는 셈이죠"], ["캐릭터 재활용", "냉장고 습격 남동생, 소파 취침 — 서베이 페르소나가 그대로 이어지는 페이지예요 🔁 인물이 일관될수록 이야기에 신뢰가 쌓여요"], ["현재로 연결", "그 후로 동생도 단골이 됐다는 마무리 — 과거의 경험을 현재로 잇는 필승 패턴이에요 🔁 🎓 경험담은 현재에 닿아야 비로소 완성돼요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 서베이 개근 🔁 🔑"], ["fridge raid", "냉장고 습격", "서베이 요리 편 남동생 재활용 🔁 😆"], ["show up", "(불쑥) 나타나다", "예고 없는 등장의 만능 동사 ✨"], ["our usual combo", "늘 먹던 조합", "단골 인증 표현 🍳"], ["guess what", "글쎄, 그런데 있잖아요", "반전 시그널, 서베이 개근 🔁 🎭"], ["out of nowhere", "난데없이, 갑자기", "깜짝 사건 공식, 서베이 개근 🔁 🔥"], ["free food", "공짜 음식", "K-서비스 문화 소개 찬스 😊"], ["eat until we couldn't move", "움직일 수 없을 때까지 먹다", "과식 유머 과장법 😆"], ["Zero regrets", "후회 제로", "서베이 침실·호텔 편 재활용 🔁 💯"], ["worked out", "잘 흘러갔다, 잘 해결됐다", "경험담 해피엔딩 공식 🔁 ✅"], ["since then", "그 후로", "경험 마무리 공식, 서베이 개근 🔁 💕"]], "audio": "audio/2_돌발/2-014 3. 식당(Restaurant)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-014 3. 식당(Restaurant)_과거 경험.mp3"}, {"id": "2-015", "cat": "unexpected", "catName": "돌발 질문", "num": 3, "topic": "식당", "topicEn": "Restaurant", "type": "비교", "badge": "15 비교", "enQ": "Compare restaurants today with the ones you went to when you were young. How have the menus, the service, and the way people order changed? Tell me about the changes.", "enA": "Restaurants have changed a lot since I was young. Back then, everything was analog: paper menus, waving your hand to order, and paying in cash at the counter on the way out.\n\nMenus used to be simple and traditional too — Korean, Chinese, and maybe one pizza place in town. For us kids, jajangmyeon day was basically a national holiday!\n\nThese days, it's a completely different story. You order on a tablet or with a QR code, robots carry dishes in some places, and delivery apps bring the whole city to your sofa. Menus went global too: Thai, Vietnamese, Mexican — all in my neighborhood. Compared to the past, eating out is way more convenient and diverse. Though I have to admit, I miss ordering out loud and chatting with the owner. Tapping a screen just isn't as warm.", "koQ": "요즘 식당과 어렸을 때 가던 식당을 비교해주세요. 메뉴, 서비스, 주문 방식은 어떻게 변화했나요? 그 변화에 대해 말해주세요.", "koA": "식당은 제가 어릴 때에 비해 정말 많이 변했어요. 그때는 모든 게 아날로그였죠. 종이 메뉴판, 손을 흔들어 주문하기, 그리고 나가는 길에 카운터에서 현금 계산이요.\n\n메뉴도 예전엔 단순하고 전통적이었어요. 한식, 중식, 그리고 시내에 피자집 하나 정도요. 우리 애들한테는 짜장면 먹는 날이 사실상 국경일이었어요!\n\n요즘은 완전히 다른 이야기예요. 태블릿이나 QR코드로 주문하고, 어떤 곳은 로봇이 음식을 나르고, 배달 앱은 도시 전체를 소파 앞으로 가져다줘요. 메뉴도 글로벌해졌어요. 태국, 베트남, 멕시코 음식까지 다 저희 동네에 있죠. 과거와 비교하면 외식은 훨씬 편리하고 다양해졌어요. 그래도 인정할게요. 소리 내어 주문하고 사장님과 수다 떨던 게 그리워요. 화면을 두드리는 건 그만큼 따뜻하진 않으니까요.", "struct": [["1️⃣ 도입", "아날로그 시대 식당"], ["2️⃣ 과거", "종이 메뉴 · 현금 · 짜장면 국경일"], ["3️⃣ 현재", "태블릿 · 로봇 · 배달 앱"], ["4️⃣ 메뉴", "한중식 → 글로벌 (동네에서!)"], ["5️⃣ 마무리", "way more + 사장님 수다 그리움"]], "scoring": [["3축 따라가기", "질문이 준 메뉴 · 서비스 · 주문 방식 3축을 그대로 비교의 틀로 쓰면 구조가 완성돼요 ✅ 질문이 곧 목차예요"], ["짜장면 국경일", "어린 시절 짜장면의 위상을 국경일급으로 과장하는 한 줄이 웃음 포인트예요 😆 과거 회상엔 그 시절 느꼈던 크기를 그대로 담아 말하세요"], ["현재 디테일 3종", "태블릿 주문 · 서빙 로봇 · 배달 앱 — 요즘 디테일 세 개면 변화가 구체적으로 증명돼요 📏 호텔 비교 편과 같은 나열 기술이에요 🔁"], ["온기 마무리", "편리함을 인정하되 사장님과의 수다가 그립다는 온기 마무리 — 서베이 비교 편의 균형 공식 그대로라 안정감 있게 닫을 수 있어요 🔁 😊"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 서베이 공통 시그널 🔁 🧩"], ["paper menu", "종이 메뉴판", "시대를 소환하는 소품 1호 📖"], ["pay in cash", "현금으로 계산하다", "과거 장면 필수 디테일 💳"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 서베이 개근 🔁 💓"], ["basically a national holiday", "사실상 국경일", "어린 시절 설렘의 과장 유머 😆"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 서베이 공통 🔁 🎭"], ["order on a tablet", "태블릿으로 주문하다", "요즘 식당 디테일 어휘 ✅"], ["delivery app", "배달 앱", "K-외식 문화의 현재를 한 단어로 📊"], ["go global", "글로벌해지다", "메뉴 다양화를 한 동사로 🗺️"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 서베이 공통 🔁 📊"], ["I have to admit", "인정할게요", "그리움 시그널, 서베이 비교 편 공통 🔁 😊"]], "audio": "audio/2_돌발/2-015 3. 식당(Restaurant)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-015 3. 식당(Restaurant)_비교.mp3"}, {"id": "2-016", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "묘사", "badge": "16 묘사", "enQ": "Who do you talk to on the phone most often, and what do you usually talk about? Describe your typical phone conversations in detail.", "enA": "The person I call most often? My best friend, hands down. We talk almost every day — quick check-ins after work — and my mom gets her regular call every Sunday evening.\n\nWith my best friend, the topics are basically our shared universe: which movie to see this weekend, new restaurants to try, IU's concert schedule, and planning our next trip. A typical call starts with nothing much, you? and somehow ends forty minutes later. With my mom, it's classic mom content: whether I'm eating well, plus neighborhood news — she always has updates about the old couple next door!\n\nSo yeah, that's pretty much my phone life: short daily calls for fun, one long Sunday call for family. Small talk, sure — but honestly, it's the glue of my relationships.", "koQ": "누구와 가장 자주 전화 통화를 하고, 주로 무슨 이야기를 하나요? 당신의 일반적인 전화 통화를 자세히 설명해주세요.", "koA": "제가 가장 자주 전화하는 사람이요? 두말할 것 없이 절친이에요. 거의 매일 통화해요. 퇴근 후 짧은 안부 확인이요. 그리고 엄마와는 매주 일요일 저녁마다 정기 통화를 하죠.\n\n절친과의 주제는 기본적으로 우리 둘의 공유 세계관이에요. 이번 주말에 볼 영화, 가 볼 새 식당, 아이유 콘서트 일정, 다음 여행 계획까지요. 보통 통화는 별일 없지? 로 시작해서 어쩌다 보니 40분 뒤에 끝나요. 엄마와는 클래식 엄마 콘텐츠죠. 밥은 잘 먹고 다니는지, 그리고 동네 소식이요. 엄마는 항상 옆집 노부부의 근황을 알고 계세요!\n\n네, 제 전화 생활은 대체로 이래요. 짧은 매일 통화는 재미로, 긴 일요일 통화는 가족을 위해서요. 잡담이긴 하지만, 솔직히 그게 제 인간관계의 접착제예요.", "struct": [["1️⃣ 도입", "절친 매일 + 엄마 일요일"], ["2️⃣ 절친", "영화 · 식당 · 아이유 · 여행"], ["3️⃣ 패턴", "별일 없지? → 40분 통화"], ["4️⃣ 엄마", "밥 걱정 + 옆집 노부부 근황"], ["5️⃣ 마무리", "잡담 = 관계의 접착제"]], "scoring": [["두 인물 구조", "절친(매일)과 엄마(일요일), 인물 두 명만 세우면 who와 what이 저절로 정리돼요 ✅ 인물이 곧 답변의 구조예요"], ["주제 = 시리즈 목차", "영화 · 식당 · 콘서트 · 여행 — 통화 주제가 곧 서베이 목차예요! 준비한 이야기들이 자연스럽게 재활용되는 종합 선물 세트 페이지죠 🔁 🎓"], ["리얼 대사 인용", "'별일 없지?'처럼 실제 대사 한 줄을 인용하면 통화 장면이 눈앞에서 살아나요 💬 설명 열 줄보다 대사 한 줄이 훨씬 생생해요"], ["비유 마무리", "잡담을 관계의 접착제로 정의하는 마무리 — 소재는 가벼워도 답변은 묵직해져요 🔑 사소한 주제일수록 의미 부여로 닫는 게 IH 기술이에요"]], "expr": [["hands down", "두말할 것 없이", "서베이 개근 최상급 표현 🔁 ✅"], ["check-in", "안부 확인", "짧은 연락을 한 단어로 💬"], ["every Sunday evening", "매주 일요일 저녁", "정기 루틴은 요일로 못 박기 ⏰"], ["our shared universe", "우리 둘의 공유 세계관", "친밀함을 그리는 비유 표현 ✨"], ["nothing much, you?", "별일 없지?", "전화 오프닝 리얼 구어체 😊"], ["somehow ends forty minutes later", "어쩌다 보니 40분 뒤에 끝난다", "수다 유머의 정석 😆"], ["classic mom content", "클래식 엄마 콘텐츠", "내용을 콘텐츠라 부르는 유머 💕"], ["the old couple next door", "옆집 노부부", "서베이 동네 편 이웃 재활용 🔁 🏠"], ["small talk", "잡담, 스몰토크", "일상 대화를 부르는 명칭 💬"], ["the glue of ~", "~의 접착제", "관계 표현 레벨업 비유 🔑"], ["that's pretty much ~", "대체로 ~이다", "묘사 마무리 시그널, 시리즈 공통 🔁 ✅"]], "audio": "audio/2_돌발/2-016 4. 전화(Phone Calls)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-016 4. 전화(Phone Calls)_묘사.mp3"}, {"id": "2-017", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "습관", "badge": "17 습관", "enQ": "When and where do you usually make phone calls, and how often do you talk on the phone? Tell me about your phone habits in detail.", "enA": "My phone habits are pretty consistent, so let me walk you through them. On weekdays, I make most of my calls in the evening — usually while walking along the riverside path near my place.\n\nThat's my golden rule: calls and walks go together. Walking makes conversations flow better, and my best friend says she can always tell when I'm on my walking course, because I sound happier! These short calls happen daily, about ten minutes each.\n\nWeekends are for the long ones: Sunday evening, me on my gray sofa, tea in hand, phone on speaker — mom time. Oh, and one more rule: no calls after eleven, because that's when my wind-down playlist takes over. A simple routine, but that daily rhythm of voices keeps me sane — and it never gets old.", "koQ": "보통 언제 어디서 전화를 걸고, 얼마나 자주 통화를 하나요? 당신의 전화 습관에 대해 자세히 말해주세요.", "koA": "제 전화 습관은 꽤 일정해요. 차근차근 설명해 드릴게요. 평일에는 대부분의 통화를 저녁에 해요. 주로 집 근처 강변 산책로를 걸으면서요.\n\n그게 저의 황금률이에요. 통화와 산책은 세트다. 걸으면 대화가 더 잘 흘러가요. 절친은 제가 산책 코스에 있을 때를 항상 알아챈대요. 목소리가 더 행복하게 들린다나요! 이런 짧은 통화는 매일, 한 번에 10분 정도예요.\n\n주말은 긴 통화의 시간이죠. 일요일 저녁, 회색 소파에 앉아 차 한 잔 들고 스피커폰으로. 엄마 타임이에요. 아, 규칙이 하나 더 있어요. 11시 이후엔 통화 금지. 그때부턴 제 윈드다운 플레이리스트가 넘겨받거든요. 단순한 루틴이지만, 매일 목소리를 듣는 그 리듬이 저를 제정신으로 유지해 줘요. 그리고 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "저녁 + 강변 산책로 통화"], ["2️⃣ 원칙", "통화와 산책은 세트!"], ["3️⃣ 빈도", "매일 10분 짧은 통화"], ["4️⃣ 주말", "소파 + 차 + 엄마 타임"], ["5️⃣ 마무리", "11시 컷 + keeps me sane"]], "scoring": [["언제·어디 한 방에", "저녁 + 강변 산책로 조합으로 when과 where를 한 장면에 담아 답하세요 ✅ 서베이 동네 지도를 그대로 재활용하는 페이지예요 🔁"], ["증인 세우기", "통화하면 목소리가 행복해진다는 절친의 증언이 내 습관에 신빙성을 더해요 😊 남의 입을 빌려 나를 설명하는 IH 고급 기술이에요"], ["요일 대비", "평일 10분 통화 vs 일요일 롱콜. 빈도를 묻는 질문은 이 대비 구조로 정리하면 깔끔해요 ⏰ 숫자까지 들어가면 더 구체적으로 들리죠"], ["컷오프 규칙", "11시 이후 통화 금지 같은 마이너스 규칙도 훌륭한 습관 디테일이에요 🌙 무엇을 안 하는지도 습관이라는 것 — 음악 편과 이어지는 포인트죠 🔁"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 서베이 개근 🔁 🔑"], ["while walking", "걸으면서", "서베이 공원·조깅 산책로 재활용 🔁 🏃"], ["golden rule", "황금률, 나만의 원칙", "서베이 습관 편 공통 뼈대 🔁 ✨"], ["go together", "세트다, 잘 어울린다", "두 습관을 묶는 만능 표현 ✅"], ["flow better", "더 잘 흘러가다", "대화·생각 묘사의 부드러운 동사 💬"], ["sound happier", "더 행복하게 들리다", "타인의 증언으로 습관 증명하기 😊"], ["mom time", "엄마 타임", "루틴에 이름 붙이기 기술 🔁 💕"], ["no calls after eleven", "11시 이후 통화 금지", "나만의 컷오프 규칙 ⏰"], ["wind down", "긴장을 풀다", "서베이 음악·집 편 재활용 🔁 🎵"], ["keep me sane", "제정신으로 유지해 주다", "서베이 집 편 재활용 🔁 😆"], ["it never gets old", "아무리 해도 질리지 않아요", "습관 마무리 공식, 서베이 개근 🔁 💕"]], "audio": "audio/2_돌발/2-017 4. 전화(Phone Calls)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-017 4. 전화(Phone Calls)_습관.mp3"}, {"id": "2-018", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "취향", "badge": "18 취향", "enQ": "Do you prefer talking on the phone or sending text messages? Why do you like that way of communicating better? Tell me the reasons.", "enA": "If I had to choose, I'd say text messages — at least for daily life. For me, it's all about timing: texts let both of us reply whenever we're free, with zero pressure.\n\nI'd pick texting over calling for anything practical, any day: schedules, addresses, little reminders. Photos and links can say things words can't. Don't get me wrong, though — for the people I love, it's the complete opposite. Nothing beats actually hearing my best friend burst out laughing, and emojis can't hug you the way a warm voice can.\n\nSo my system is simple: texts for information, calls for hearts. In a nutshell, I text to manage my life — but I call to feel it.", "koQ": "전화 통화와 문자 메시지 중 무엇을 선호하나요? 왜 그 소통 방식이 더 좋은가요? 그 이유를 말해주세요.", "koA": "굳이 고르자면 문자 메시지요. 적어도 일상에서는요. 저한테는 타이밍이 전부거든요. 문자는 서로 시간이 될 때 답하면 되잖아요. 부담 제로로요.\n\n실용적인 건 뭐든 두말없이 통화보다 문자를 고를 거예요. 일정, 주소, 자잘한 리마인더요. 사진과 링크는 말로 못 하는 걸 전하기도 하고요. 하지만 오해는 마세요. 사랑하는 사람들에게는 완전히 반대예요. 절친이 빵 터지는 소리를 실제로 듣는 것만 한 게 없죠. 이모지는 따뜻한 목소리처럼 안아 줄 수 없으니까요.\n\n그래서 제 시스템은 단순해요. 정보는 문자로, 마음은 전화로. 한마디로 저는 삶을 관리하려고 문자하고, 삶을 느끼려고 전화해요.", "struct": [["1️⃣ 선언", "일상은 문자 (타이밍 자유)"], ["2️⃣ 이유", "일정 · 주소 · 사진 · 링크"], ["3️⃣ 예외", "사랑하는 사람은 통화!"], ["4️⃣ 근거", "웃음소리 > 이모지"], ["5️⃣ 마무리", "정보는 문자, 마음은 전화"]], "scoring": [["반반 전략", "문자 선호를 선언하되 통화의 가치도 인정하는 균형이 이 질문의 정답 구조예요 ✅ 한쪽만 편들면 이유가 금방 바닥나요"], ["용도 분리", "실용적인 것 = 문자, 감정적인 것 = 전화로 용도를 나누면 이유가 저절로 두 배가 돼요 🔑 나누는 기준 자체가 논리력 어필이 되죠"], ["감각 근거", "빵 터지는 웃음소리 vs 화면 속 이모지. 감각적인 대비 하나가 백 마디 설명을 이겨요 😆 귀로 들리는 근거를 만들어 보세요"], ["대구 명언", "texts for information, calls for hearts — 서베이 집 편 surviving/living 명언의 전화 버전이에요 🔁 💬 대구 명언은 시리즈의 전통이죠"]], "expr": [["If I had to choose", "굳이 하나를 고르자면", "취향 오프닝, 서베이 개근 🔁 🔑"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식, 시리즈 공통 🔁 ✨"], ["whenever we're free", "서로 시간 될 때", "문자의 장점을 한 구로 ⏰"], ["zero pressure", "부담 제로", "zero regrets의 사촌 표현 🔁 💯"], ["A over B any day", "두말없이 B보다 A", "선호 공식, 서베이 공통 🔁 ✅"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["the complete opposite", "완전히 반대", "예외를 강하게 뒤집는 표현 🎭"], ["Nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 🔥"], ["burst out laughing", "빵 터지다", "감정 동사 레벨업 아이템 😆"], ["texts for information, calls for hearts", "정보는 문자, 마음은 전화", "대구 명언, 통째로 암기 💬"], ["In a nutshell", "한마디로 정리하면", "취향 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-018 4. 전화(Phone Calls)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-018 4. 전화(Phone Calls)_취향.mp3"}, {"id": "2-019", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "과거 경험", "badge": "19 과거 경험", "enQ": "Tell me about a phone conversation you still remember. When was it, and who were you talking to? Was there anything interesting about it?", "enA": "This reminds me of a call I'll never forget: the famous midnight call from my best friend, two years ago. I was already in bed when my phone rang out of nowhere.\n\nShe skipped hello completely and just yelled: Gangneung! First sunrise! The night bus leaves in two hours! I thought she was joking. She was not. Guess what — forty minutes later I was packing a bag, half asleep, laughing at how crazy we were.\n\nThat call turned into the sunrise trip I always talk about: the freezing beach, thousands of strangers, goosebumps at dawn. Everything worked out perfectly. Since then, whenever my phone rings late at night, I get a little excited — it might be another adventure calling. Best call of my life, honestly.", "koQ": "아직도 기억나는 전화 통화에 대해 말해주세요. 언제였고, 누구와 통화하고 있었나요? 어떤 흥미로운 점이 있었나요?", "koA": "절대 못 잊을 통화가 생각나네요. 2년 전 절친의 그 유명한 자정 전화요. 저는 이미 침대에 누워 있었는데, 폰이 난데없이 울린 거예요.\n\n걔는 인사를 완전히 건너뛰고 그냥 소리쳤어요. 강릉! 새해 첫 일출! 밤 버스 두 시간 뒤 출발! 농담인 줄 알았어요. 아니었어요. 그런데 있잖아요. 40분 뒤에 저는 반쯤 잠든 채로 가방을 싸며, 우리가 얼마나 미쳤는지 웃고 있었어요.\n\n그 전화가 제가 늘 이야기하는 그 일출 여행이 됐어요. 살을 에는 해변, 수천 명의 낯선 사람들, 새벽의 소름까지요. 모든 게 완벽하게 흘러갔죠. 그 후로 밤늦게 폰이 울리면 살짝 설레요. 또 다른 모험이 걸려 오는 걸지도 모르니까요. 솔직히 제 인생 최고의 전화예요.", "struct": [["1️⃣ 도입", "2년 전 절친의 자정 전화"], ["2️⃣ 대사", "강릉! 일출! 버스 2시간 뒤!"], ["3️⃣ 행동", "40분 만에 가방 싸기"], ["4️⃣ 결과", "그 유명한 일출 여행으로"], ["5️⃣ 마무리", "밤 전화 = 모험의 설렘"]], "scoring": [["수미상관 기술", "서베이 국내여행 편 일출 여행의 시작이 바로 이 전화예요! 같은 경험을 다른 각도로 재활용하는 최고의 기술이죠 🔁 🎓"], ["대사 인용", "강릉! 일출! 버스! — 실제 대사를 그대로 외치면 그날 밤의 급박함과 설렘이 그대로 살아나요 💬 대사 인용은 경험담의 특수효과예요"], ["시간 압축", "자정 전화 → 40분 뒤 가방 완성. 시간 디테일이 이야기의 속도감을 만들어요 ⏰ 숫자 두 개로 무모함과 우정이 동시에 증명되죠"], ["설렘 마무리", "그 뒤로 밤 전화가 설렘이 됐다는 현재형 마무리 — Since then 패턴의 감성 버전이에요 🔁 💕 사건이 감정의 변화로 남을 때 이야기가 완성돼요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 서베이 개근 🔁 🔑"], ["midnight call", "자정 전화", "사건에 이름 붙이기 기술 🔁 🌙"], ["out of nowhere", "난데없이, 갑자기", "깜짝 사건 공식, 서베이 개근 🔁 🔥"], ["skip hello completely", "인사를 완전히 건너뛰다", "다급함을 그리는 디테일 🎭"], ["She was not.", "아니었어요.", "짧은 문장의 반전 펀치 😆"], ["Guess what", "글쎄, 그런데 있잖아요", "반전 시그널, 서베이 개근 🔁 🎭"], ["half asleep", "반쯤 잠든 채로", "상태 묘사 디테일 표현 😴"], ["goosebumps", "소름", "서베이 콘서트·국내여행 재활용 🔁 ✨"], ["worked out perfectly", "완벽하게 흘러갔다", "경험담 해피엔딩 공식 🔁 ✅"], ["Since then", "그 후로", "경험 마무리 공식, 서베이 개근 🔁 💕"], ["best call of my life", "인생 최고의 전화", "경험담 마침표 최상급 표현 💯"]], "audio": "audio/2_돌발/2-019 4. 전화(Phone Calls)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-019 4. 전화(Phone Calls)_과거 경험.mp3"}, {"id": "2-020", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "비교", "badge": "20 비교", "enQ": "Compare the way people talk on the phone today with the past. How have phone conversations changed since you were young? Tell me about the differences.", "enA": "Phone calls have changed completely since I was young. Back then, the phone was a family object: one landline in the living room, with an actual cord. I used to memorize my friends' numbers by heart, and calling a friend meant getting past the scariest gatekeeper — their dad picking up first!\n\nCalls were precious too. Phone bills were a real thing, so my mom would knock on the wall if I talked too long.\n\nThese days, it's a completely different story. Everyone carries their own phone, so we call people, not houses. Video calls are the default with my family, and earbuds let calls happen anywhere — walking, shopping, even jogging. Compared to the past, calling is way freer and more casual. Though I have to admit, I miss knowing numbers by heart. These days I remember exactly two: my mom's and my best friend's.", "koQ": "오늘날 사람들이 전화하는 방식과 과거를 비교해주세요. 당신이 어렸을 때 이후로 전화 통화는 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "전화는 제가 어릴 때에 비해 완전히 달라졌어요. 그때 전화기는 가족의 물건이었죠. 거실에 유선 전화기 한 대, 진짜 전화선이 달린 거요. 저는 친구들 번호를 통째로 외우고 다녔고, 친구에게 전화한다는 건 가장 무서운 문지기를 통과하는 일이었어요. 친구 아빠가 먼저 받는 거요!\n\n통화는 귀한 것이기도 했어요. 전화 요금이 진짜 무서웠거든요. 제가 너무 오래 통화하면 엄마가 벽을 두드리셨어요.\n\n요즘은 완전히 다른 이야기예요. 모두가 자기 폰을 들고 다니니까, 우리는 집이 아니라 사람에게 전화하죠. 가족과는 영상통화가 기본이고, 이어폰 덕분에 어디서든 통화해요. 걸으면서, 쇼핑하면서, 심지어 조깅하면서도요. 과거와 비교하면 통화는 훨씬 자유롭고 가벼워졌어요. 그래도 인정할게요. 번호를 외우던 시절이 그리워요. 요즘 제가 외우는 번호는 딱 두 개예요. 엄마, 그리고 절친이요.", "struct": [["1️⃣ 도입", "가족의 물건이던 전화기"], ["2️⃣ 과거", "거실 유선전화 · 번호 암기 · 아빠 문지기"], ["3️⃣ 요금", "전화비 공포 · 엄마의 벽 노크"], ["4️⃣ 현재", "1인 1폰 · 영상통화 · 이어폰"], ["5️⃣ 마무리", "way more + 외운 번호 두 개"]], "scoring": [["문지기 유머", "친구 아빠가 먼저 받던 공포의 문지기 시절 — 세대 공감 유머가 과거 장면을 단숨에 살려요 😆"], ["본질 한 줄", "옛날엔 집에 전화했지만 지금은 사람에게 전화한다 — 이 한 줄이 비교의 철학 포인트예요 💬 기술 변화를 관계의 언어로 번역한 IH 인사이트죠"], ["장소 나열", "걷고, 쇼핑하고, 조깅하며 — 서베이 산책로 · 쇼핑 편을 스치는 나열로 어디서든 통화하는 자유를 증명해요 🔁 나열에도 시리즈 지도를 쓰세요"], ["숫자 마무리", "외우는 번호가 단 두 개뿐이라는 구체적인 숫자로 닫는 그리움 마무리가 긴 여운을 남겨요 📏 😊 숫자는 감성 마무리에도 통해요"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 서베이 공통 시그널 🔁 🧩"], ["landline", "유선 전화", "시대를 소환하는 킬러 소품 📖"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 서베이 개근 🔁 💓"], ["memorize ~ by heart", "~을 통째로 외우다", "아날로그 시대의 능력 표현 🔑"], ["gatekeeper", "문지기", "친구 아빠 유머의 핵심 단어 😆"], ["phone bill", "전화 요금", "과거의 제약을 보여 주는 디테일 💳"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 서베이 공통 🔁 🎭"], ["people, not houses", "집이 아니라 사람에게", "변화의 본질을 꿰뚫는 대구 💬"], ["video call", "영상통화", "요즘 통화의 기본값 어휘 ✅"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 서베이 공통 🔁 📊"], ["I have to admit", "인정할게요", "그리움 시그널, 서베이 비교 편 공통 🔁 😊"]], "audio": "audio/2_돌발/2-020 4. 전화(Phone Calls)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-020 4. 전화(Phone Calls)_비교.mp3"}, {"id": "2-021", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "묘사", "badge": "21 묘사", "enQ": "Do you remember your first cell phone? What did it look like, and what features did it have? Describe your first phone in as much detail as possible.", "enA": "Oh, my first cell phone! I got it in middle school, and I still remember everything about it. It was a folder phone — you know, the kind you flip open — in a shiny pearl-white color.\n\nThe screen was tiny, with actual buttons below, and my thumbs got seriously fast on them. The features were, by today's standards, adorable: text messages, a camera that made everything look like a potato, and downloadable ringtones. I saved up my allowance to buy an IU song as my ringtone — of course I did! And the best part: a little phone charm hanging from it, a gift from my best friend.\n\nIt had almost no internet, but honestly, I loved that phone more than any phone since. Snapping it shut after a call — that click was pure satisfaction. Nothing flashy, but it was my first little piece of freedom.", "koQ": "첫 휴대폰을 기억하나요? 어떻게 생겼고, 어떤 기능이 있었나요? 당신의 첫 휴대폰을 가능한 자세히 묘사해주세요.", "koA": "아, 제 첫 휴대폰이요! 중학생 때 받았는데, 아직도 전부 기억나요. 폴더폰이었어요. 왜, 젖혀서 여는 그런 거요. 반짝이는 진주 흰색이었죠.\n\n화면은 조그맣고 아래엔 진짜 버튼들이 있었는데, 제 엄지손가락이 거기서 엄청나게 빨라졌어요. 기능은 요즘 기준으로 보면 귀여운 수준이었어요. 문자 메시지, 모든 걸 감자처럼 찍는 카메라, 그리고 다운로드 벨소리요. 용돈을 모아서 아이유 노래를 벨소리로 샀어요. 당연히 그랬죠! 그리고 최고는, 폰에 달려 있던 작은 폰 줄이에요. 절친이 준 선물이었거든요.\n\n인터넷은 거의 안 됐지만, 솔직히 그 이후 어떤 폰보다 그 폰을 사랑했어요. 통화 끝나고 딱 접는 그 소리, 순수한 만족감이었죠. 화려하진 않았지만, 제 첫 번째 작은 자유였어요.", "struct": [["1️⃣ 도입", "중학생 · 진주색 폴더폰"], ["2️⃣ 외관", "작은 화면 + 진짜 버튼"], ["3️⃣ 기능", "문자 · 감자 카메라 · 벨소리"], ["4️⃣ 애착", "아이유 벨소리 + 절친 폰 줄"], ["5️⃣ 마무리", "딱 접는 소리 = 첫 자유"]], "scoring": [["과거 물건 묘사법", "'요즘 기준으로 보면' 전제를 깔면 옛 물건 묘사가 자연스럽게 유머가 돼요 🔑 촌스러움이 추억으로 바뀌는 마법의 한 줄이에요"], ["감자 카메라", "potato camera는 저화질을 표현하는 만국 공통 유머예요 🥔 시험관도 웃는 표현이죠. 감자 하나로 옛 폰 카메라 설명이 끝나요"], ["애착 디테일", "아이유 벨소리(음악 편)와 절친의 폰 줄 — 물건에 사람과 이야기를 붙이세요 🔁 💕 물건 자체보다 얽힌 이야기가 묘사를 특별하게 만들어요"], ["감각 마무리", "딱 접는 소리 하나로 폰 전체의 감성이 정리돼요 🔥 은행 비교 편 통장 도장과 같은 소품 기술 — 소리 · 촉감 디테일은 언제나 옳아요 🔁"]], "expr": [["folder phone", "폴더폰", "K-추억 소품의 왕! 시대 소환 📖"], ["flip open", "젖혀서 열다", "폴더폰 동작의 필수 동사 ✨"], ["pearl-white", "진주 흰색의", "색 디테일, 서베이 묘사 공식 🔁 🎬"], ["actual buttons", "진짜 버튼들", "actual = 요즘엔 없는 것 강조 😆"], ["by today's standards", "요즘 기준으로 보면", "과거 물건 묘사의 필수 전제 🔑"], ["look like a potato", "감자처럼 나오다", "저화질 유머의 국제 공용어 🥔"], ["save up", "(돈을) 모으다", "목표 저축의 기본 동사, 용돈 시절 감성 💳"], ["phone charm", "폰 줄, 폰 참", "물건에 이야기를 다는 디테일 💕"], ["snap it shut", "딱 소리 나게 접다", "폴더폰 감성의 절정 동사 🔥"], ["pure satisfaction", "순수한 만족감", "호텔 편 pure happiness 사촌 🔁 😊"], ["nothing flashy", "화려하진 않은", "서베이 동네 편 마무리 재활용 🔁 ✅"]], "audio": "audio/2_돌발/2-021 5. 휴대폰(Cell Phone)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-021 5. 휴대폰(Cell Phone)_묘사.mp3"}, {"id": "2-022", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "습관", "badge": "22 습관", "enQ": "What do you usually do with your cell phone during the day? Which apps do you use the most, and when do you use your phone most often? Describe your phone habits.", "enA": "Honestly, my phone is glued to my hand all day, so let me walk you through a typical day. It starts as my alarm clock, and while I'm still in bed, I check messages and the weather.\n\nDuring my commute, it's news and YouTube time. My top three apps? The messenger app for everything social, YouTube for everything else, and my music app — my IU playlist powers my evening jogs along the river. My banking app gets a daily tap too: checking my Italy fund never gets old!\n\nEvening is peak phone time: calls during my walk, then streaming something on the sofa. My one golden rule: after eleven, the phone goes face-down and my wind-down playlist takes over. Without that rule, I'd scroll until sunrise. So yeah, that's pretty much my phone day — from alarm to lullaby.", "koQ": "하루 동안 휴대폰으로 주로 무엇을 하나요? 어떤 앱을 가장 많이 사용하고, 언제 휴대폰을 가장 자주 사용하나요? 당신의 휴대폰 사용 습관을 설명해주세요.", "koA": "솔직히 제 폰은 하루 종일 손에 딱 붙어 있어요. 평범한 하루를 차근차근 설명해 드릴게요. 폰은 알람 시계로 하루를 시작하고, 침대에 누운 채로 메시지랑 날씨를 확인해요.\n\n출퇴근길엔 뉴스와 유튜브 시간이에요. 제 톱3 앱이요? 소셜은 전부 메신저 앱, 나머지는 전부 유튜브, 그리고 음악 앱이요. 아이유 플레이리스트가 저녁 강변 조깅의 동력이거든요. 은행 앱도 매일 한 번씩 열어요. 이탈리아 자금 확인은 봐도 봐도 질리지 않아요!\n\n저녁은 폰 사용의 피크 타임이에요. 산책하며 통화하고, 소파에서 뭔가를 스트리밍하죠. 단 하나의 황금률은, 11시 이후엔 폰을 뒤집어 놓고 윈드다운 플레이리스트가 넘겨받는 거예요. 그 규칙이 없으면 해 뜰 때까지 스크롤할 테니까요. 네, 제 폰 하루는 대체로 이래요. 알람에서 자장가까지요.", "struct": [["1️⃣ 아침", "알람 → 침대에서 메시지·날씨"], ["2️⃣ 낮", "출퇴근 뉴스 · 유튜브"], ["3️⃣ 앱", "메신저 · 유튜브 · 음악 (톱3)"], ["4️⃣ 저녁", "산책 통화 + 소파 스트리밍"], ["5️⃣ 마무리", "11시 뒤집기 룰 + 자장가"]], "scoring": [["시간축 구조", "아침 → 출퇴근 → 저녁 → 밤. 하루 시간축이 이 질문의 가장 깔끔한 뼈대예요 ✅ 축만 세우면 나머지는 채우기만 하면 되죠"], ["앱 랭킹", "which apps에는 톱3 랭킹으로! 각 앱에 용도 한 줄씩 붙이면 완성이에요 🔑 랭킹 형식은 단순 나열보다 구조적으로 들려서 어떤 목록 질문에도 통해요"], ["시리즈 총집합", "조깅 플레이리스트, 은행 앱, 소파 스트리밍 — 시리즈 페르소나가 폰 안에 다 있어요 🔁 🎓 새로 만들 것 없이 기존 소재를 폰이라는 그릇에 담기만 하면 돼요"], ["절제 룰 마무리", "11시 face-down 룰처럼 폰 습관 질문엔 절제 규칙 하나가 성숙한 마무리가 돼요 🌙 종일 쓴다로 끝나면 아쉬워요. 멈추는 규칙이 답변의 균형을 잡아 주죠"]], "expr": [["glued to my hand", "손에 딱 붙어 있는", "폰 중독 유머의 정석 표현 😆"], ["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 서베이 개근 🔁 🔑"], ["alarm clock", "알람 시계", "하루의 시작을 여는 소품 ⏰"], ["top three apps", "톱3 앱", "which apps 질문은 랭킹으로 답하기 ✅"], ["power my evening jogs", "저녁 조깅의 동력이 되다", "서베이 조깅·음악 편 재활용 🔁 🎵"], ["banking app", "은행 앱", "은행 편 모바일 뱅킹 트렌드 연결 🔁 💳"], ["peak phone time", "폰 사용 피크 타임", "시간대 묘사에 이름 붙이기 🔥"], ["face-down", "(화면을) 뒤집어 놓은", "디지털 절제 룰의 디테일 🌙"], ["wind down", "긴장을 풀다", "서베이 음악·집 편 재활용 🔁 😴"], ["scroll until sunrise", "해 뜰 때까지 스크롤하다", "과장 유머로 규칙의 이유 설명 😆"], ["from alarm to lullaby", "알람에서 자장가까지", "하루 요약 대구 마무리 💬"]], "audio": "audio/2_돌발/2-022 5. 휴대폰(Cell Phone)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-022 5. 휴대폰(Cell Phone)_습관.mp3"}, {"id": "2-023", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "취향", "badge": "23 취향", "enQ": "What do you consider the most when choosing a new cell phone - the design, the camera, or the price? Why is that important to you? Tell me in detail.", "enA": "Between design, camera, and price? If I had to choose, the camera wins, no contest. For me, it's all about the memories: trips, concerts, food — my phone is basically my life's photographer.\n\nI'd pick a great camera over a pretty design any day. Think about it: the design disappears into a case on day one, but photos last forever. My Gangneung sunrise shots and my concert videos? All thanks to a good camera. Don't get me wrong — I still hunt for deals like a pro when I actually buy one. My shopping instincts never rest!\n\nBut nothing beats zooming into a night-view photo that came out perfectly clear. In a nutshell: the price matters for a month, the design for a year — but the camera matters forever.", "koQ": "새 휴대폰을 고를 때 디자인, 카메라, 가격 중 무엇을 가장 중요하게 생각하나요? 왜 그것이 중요한가요? 자세히 말해주세요.", "koA": "디자인, 카메라, 가격 중에서요? 굳이 고르자면 카메라 승이에요. 고민할 것도 없어요. 저한테는 추억이 전부거든요. 여행, 콘서트, 음식까지. 제 폰은 사실상 제 인생의 사진사예요.\n\n예쁜 디자인보다는 두말없이 좋은 카메라를 고를 거예요. 생각해 보세요. 디자인은 첫날 케이스 속으로 사라지지만, 사진은 영원히 남잖아요. 제 강릉 일출 사진들과 콘서트 영상들이요? 전부 좋은 카메라 덕분이죠. 오해는 마세요. 실제로 살 때는 여전히 프로처럼 특가를 사냥해요. 제 쇼핑 본능은 쉬는 법이 없거든요!\n\n하지만 야경 사진을 확대했는데 완벽하게 선명할 때, 그것만 한 게 없어요. 한마디로 가격은 한 달, 디자인은 일 년, 하지만 카메라는 영원히 중요해요.", "struct": [["1️⃣ 선언", "카메라 승, no contest"], ["2️⃣ 이유", "추억 = 여행 · 콘서트 · 음식"], ["3️⃣ 논리", "디자인은 케이스 속으로"], ["4️⃣ 예외", "가격은 특가 사냥으로 해결"], ["5️⃣ 마무리", "한 달 · 일 년 · 영원히"]], "scoring": [["3지선다 공략", "호텔 취향 편과 똑같은 3지선다 구조예요! 셋 다 언급한 뒤 하나를 고르는 공식을 그대로 가져오면 돼요 🔁 ✅"], ["시간 논리", "예쁜 디자인도 첫날 케이스 속으로 사라진다는 시간의 논리가 카메라 선택에 설득력을 줘요 🤔 반대 선택지를 지우는 방식의 IH 논리 기술이에요"], ["추억 증거", "강릉 일출 사진, 콘서트 영상 — 서베이의 경험들이 카메라 선택의 증거가 돼요 🔁 📸 취향의 이유를 과거 경험에서 꺼내 오는 게 가장 설득력 있어요"], ["명언 마무리", "가격은 한 달, 디자인은 일 년, 카메라는 영원히. 시간 3단 대구 마무리는 통째로 외울 가치가 있어요 💬 🎓 리듬까지 완벽한 취향 명언이에요"]], "expr": [["If I had to choose", "굳이 하나를 고르자면", "취향 오프닝, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "은행 취향 편 재활용 🔁 🔥"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식, 시리즈 공통 🔁 ✨"], ["my life's photographer", "내 인생의 사진사", "폰을 사람처럼 부르는 비유 📸"], ["A over B any day", "두말없이 B보다 A", "3지선다 필승 선택 공식 🔁 ✅"], ["on day one", "첫날부터", "즉시성을 강조하는 부사구 ⏰"], ["photos last forever", "사진은 영원히 남는다", "카메라 선택의 핵심 논리 💕"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["hunt for deals", "특가를 사냥하다", "서베이 쇼핑 + 호텔 취향 재활용 🔁 🔥"], ["Nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 ☀️"], ["In a nutshell", "한마디로 정리하면", "취향 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-023 5. 휴대폰(Cell Phone)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-023 5. 휴대폰(Cell Phone)_취향.mp3"}, {"id": "2-024", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "과거 경험", "badge": "24 과거 경험", "enQ": "Tell me about a memorable phone conversation you have had. When was it, and who were you talking to? What made it so special? Give me many details.", "enA": "This reminds me of the most dramatic call of my life: the day I finally won the ticket war for IU's concert last year. It had taken me three tries over three years, so this was a huge deal.\n\nThe second the payment screen said success, I called my best friend with shaking hands. She picked up. I said nothing — I just screamed. Guess what: she screamed right back. No words at all, just two people screaming at each other for a solid thirty seconds. The neighbors probably worried about us!\n\nWhen we finally calmed down, we spent an hour planning everything: outfits, lightsticks, dinner near the dome. Everything about that call was pure joy, and since then, the screaming call has become our code word for great news. What made it special? Happiness is louder when it's shared.", "koQ": "기억에 남는 전화 통화에 대해 말해주세요. 언제였고, 누구와 통화하고 있었나요? 무엇이 그것을 특별하게 만들었나요? 많은 세부사항을 말해주세요.", "koA": "제 인생 가장 드라마틱한 통화가 생각나네요. 작년에 드디어 아이유 콘서트 티켓팅 전쟁에서 승리한 날이요. 3년간 3번의 도전 끝이었으니, 정말 엄청난 일이었죠.\n\n결제 화면에 성공이 뜬 순간, 떨리는 손으로 절친에게 전화했어요. 걔가 받았고, 저는 아무 말도 안 했어요. 그냥 소리를 질렀죠. 그런데 있잖아요. 걔도 바로 같이 소리를 질러 줬어요. 말은 하나도 없이, 두 사람이 30초 동안 서로에게 소리만 지른 거예요. 이웃들이 아마 걱정했을 거예요!\n\n겨우 진정하고 나서는 한 시간 동안 모든 걸 계획했어요. 옷, 응원봉, 돔 근처 저녁 식사까지요. 그 통화의 모든 게 순수한 기쁨이었고, 그 후로 소리 지르는 전화는 좋은 소식을 뜻하는 우리만의 암호가 됐어요. 뭐가 특별했냐고요? 행복은 나눌 때 더 커지니까요.", "struct": [["1️⃣ 도입", "작년 · 티켓팅 3수 성공의 날"], ["2️⃣ 절정", "말 없이 30초 비명 듀엣"], ["3️⃣ 계획", "옷 · 응원봉 · 돔 근처 저녁"], ["4️⃣ 감정", "pure joy"], ["5️⃣ 마무리", "비명 전화 = 좋은 소식 암호"]], "scoring": [["감정 절정 장면", "말 없는 30초 비명 듀엣 — 대사 없이 소리로만 그리는 절정이 이 답변의 심장이에요 🎭 감정은 설명보다 장면으로 전하세요"], ["콘서트 편 연결", "티켓팅 3수, 응원봉, 돔까지 서베이 콘서트 편 재활용 종합 세트예요 🔁 🎵 같은 사건도 질문의 각도가 바뀌면 새 이야기가 되니 아껴 쓸 필요 없어요"], ["what made it special", "왜 기억에 남느냐고 물으면 마지막에 명언 한 줄로 답하세요 💬 나눈 기쁨은 두 배가 된다는 공유된 행복 공식이 이 페이지의 정답이에요"], ["전화 편과 차별화", "전화 편 자정 모험 vs 휴대폰 편 비명 기쁨 — 같은 소재도 각도를 바꿔 재활용해요 🔁 🎓 절친 통화 소재의 세 번째 변신인 셈이죠"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 서베이 개근 🔁 🔑"], ["win the ticket war", "티켓팅 전쟁에서 이기다", "서베이 콘서트 편 3수 재활용 🔁 🔥"], ["three tries over three years", "3년간 3번의 도전", "숫자로 노력을 증명하기 📏"], ["a huge deal", "엄청난 일", "중요성을 구어체로 강조 💪"], ["with shaking hands", "떨리는 손으로", "흥분을 몸으로 보여 주는 묘사 🎭"], ["scream", "소리 지르다", "감정 절정의 동사, 콘서트 편 짝꿍 🔁 😆"], ["Guess what", "글쎄, 그런데 있잖아요", "반전 시그널, 서베이 개근 🔁 🎭"], ["a solid thirty seconds", "꼬박 30초", "solid = 꽉 채운. 시간 강조 ⏰"], ["pure joy", "순수한 기쁨", "호텔 pure happiness 계열 재활용 🔁 💕"], ["code word", "암호, 우리만의 신호", "관계의 역사를 만드는 단어 🔑"], ["Happiness is louder when it's shared", "행복은 나눌 때 더 커진다", "경험담 명언 마무리 💬 🎓"]], "audio": "audio/2_돌발/2-024 5. 휴대폰(Cell Phone)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-024 5. 휴대폰(Cell Phone)_과거 경험.mp3"}, {"id": "2-025", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "비교", "badge": "25 비교", "enQ": "Compare your first cell phone with the one you use now. How are they different? Tell me about the changes in as much detail as possible.", "enA": "Comparing my first phone with my current one is like comparing a bicycle with a spaceship. Back then, my pearl-white folder phone could call, text, and take potato-quality photos — and that was basically it. I used to type on buttons, download one song at a time, and snap it shut with that satisfying click.\n\nMy current phone? It's my camera, wallet, bank, cinema, and jukebox — my entire life in one slab of glass. The photos are crystal clear, and I stream any song instantly instead of saving my allowance for one ringtone.\n\nThese days, it's a completely different story — compared to the folder phone, my smartphone is way more powerful. But I have to admit: no smartphone will ever match the joy of snapping a folder phone shut after a call. Some clicks are just irreplaceable.", "koQ": "첫 휴대폰과 지금 사용하는 휴대폰을 비교해주세요. 둘은 어떻게 다른가요? 그 변화에 대해 가능한 자세히 말해주세요.", "koA": "제 첫 폰과 지금 폰을 비교하는 건 자전거와 우주선을 비교하는 것 같아요. 그때 제 진주색 폴더폰은 전화, 문자, 화질이 엉망인 사진이 할 수 있는 것의 전부였어요. 버튼으로 타자를 치고, 노래를 한 곡씩 다운받고, 그 만족스러운 딸깍 소리와 함께 딱 접곤 했죠.\n\n지금 제 폰이요? 카메라이자 지갑이고, 은행이고, 영화관이고, 주크박스예요. 유리판 한 장에 담긴 제 인생 전부죠. 사진은 수정처럼 선명하고, 벨소리 한 곡을 위해 용돈을 모으는 대신 아무 노래나 즉시 스트리밍해요.\n\n요즘은 완전히 다른 이야기예요. 폴더폰과 비교하면 스마트폰은 훨씬 강력하죠. 하지만 인정할게요. 통화 끝나고 폴더폰을 딱 접던 그 기쁨은 어떤 스마트폰도 못 따라와요. 어떤 딸깍임은 그냥 대체 불가능하거든요.", "struct": [["1️⃣ 도입", "자전거 vs 우주선 비유"], ["2️⃣ 과거", "전화 · 문자 · 감자 화질 사진뿐"], ["3️⃣ 현재", "지갑 · 은행 · 영화관 · 주크박스"], ["4️⃣ 대비", "용돈 벨소리 vs 즉시 스트리밍"], ["5️⃣ 마무리", "딸깍의 낭만은 대체 불가"]], "scoring": [["비유 오프닝", "자전거 vs 우주선 비유 하나로 변화의 크기가 첫 문장에 담겨요 ✨ 비교 답변은 오프닝이 절반이에요"], ["역할 나열", "지갑 · 은행 · 영화관 · 주크박스 — 폰의 역할 나열이 현재를 증명하는 가장 쉬운 방법이에요 ✅ 과거의 폰이 못 하던 일들이라 대비까지 저절로 생겨요"], ["묘사 편 재활용", "감자 카메라, 딸깍 소리, 용돈 벨소리 — 묘사 편 소재를 그대로 비교의 재료로 쓰세요 🔁 🎓 한 번 만든 디테일은 주제 안에서 두세 번 우려내는 게 정석이에요"], ["딸깍 마무리", "편리함 인정 + 대체 불가능한 딸깍. 돌발 비교 편 공통의 그리움 마무리 공식이에요 🔁 😊 이 공식 하나면 어떤 비교 질문도 따뜻하게 닫을 수 있어요"]], "expr": [["like comparing A with B", "A와 B를 비교하는 것 같다", "비유로 여는 비교 오프닝 ✨"], ["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 서베이 공통 시그널 🔁 🧩"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 서베이 개근 🔁 💓"], ["that was basically it", "그게 사실상 전부였다", "과거의 한계를 정리하는 한 줄 ✅"], ["one song at a time", "노래 한 곡씩", "다운로드 시대의 디테일 🎵"], ["a slab of glass", "유리판 한 장", "스마트폰을 시적으로 부르기 🔑"], ["crystal clear", "수정처럼 선명한", "potato의 정반대! 화질 대비 📸"], ["it's a comple
