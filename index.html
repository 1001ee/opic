 and ask you to act it out. Your friend just got a new cell phone. Call your friend, mention that you are considering buying a new phone yourself, and ask three or four questions to learn more about the phone.", "enA": "Hey, it's me! Do you have a minute? I heard you finally got a new phone — congrats! Here's the thing: my phone is almost four years old, and the battery is on its last legs. So I'm thinking about upgrading too. Can I ask you a few questions?\n\nFirst of all, which one did you go for? ... Oh, that one? I've been eyeing it too. And how's the camera? I take a lot of photos. ... Wait, it's that good in low light? That's a huge selling point for me.\n\nOkay, one more thing — does the battery last a full day? ... Only half a day? Hmm, that's a bit disappointing. And how much did you pay with the carrier plan? ... That's not bad at all. Thanks a ton — talk to you later!", "koQ": "친구가 새 휴대폰을 샀습니다. 전화해서 당신도 새 폰 구매를 고민 중이라고 설명하고, 그 폰에 대해 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 잠깐 시간 돼? 너 드디어 새 폰 샀다며, 축하해! 실은 말이야, 내 폰이 이제 거의 4년 됐는데 배터리가 거의 수명이 다했거든. 그래서 나도 바꿀까 고민 중이야. 몇 가지만 물어봐도 될까?\n\n우선, 어떤 걸로 샀어? ... 아, 그거? 나도 눈여겨보고 있었어. 그리고 카메라는 어때? 내가 사진을 많이 찍거든. ... 잠깐, 어두운 데서도 그렇게 잘 나와? 나한테는 그게 진짜 큰 장점인데.\n\n좋아, 하나만 더. 배터리는 하루 종일 가? ... 반나절밖에 못 가? 음, 그건 좀 아쉽네. 그리고 통신사 요금제까지 하면 얼마 냈어? ... 그 정도면 나쁘지 않네. 정말 고마워, 나중에 또 통화하자!", "struct": [["1️⃣ 인사", "축하 인사 + 교체 고민 설명"], ["2️⃣ 질문", "① 모델 → 아는 척 리액션"], ["3️⃣ 질문", "② 카메라 → 강한 긍정 리액션"], ["4️⃣ 질문", "③ 배터리 → 부정 리액션(아쉽)"], ["5️⃣ 마무리", "④ 가격 + 감사 인사"]], "scoring": [["내 상황 먼저", "나도 새 폰을 고민 중이라고 밝히라는 조건이 문제에 들어 있어요. Here's the thing으로 내 상황을 먼저 깔아야 질문이 자연스러워집니다 🔑"], ["리액션은 짧게", "'Oh, that one?' 'That's not bad at all.'처럼 한두 마디로 받아 주세요 ⏰ 리액션이 길어지면 질문 개수를 못 채웁니다"], ["긍정·부정 섞기", "카메라엔 강한 긍정(that good in low light?), 배터리엔 부정(Only half a day?) 😆 리액션 색깔을 섞어야 진짜 통화처럼 들려요"], ["되묻기 리액션", "상대 대답을 의문문으로 되받으면(Only half a day?) 알아들었다는 신호가 되고 문장 수도 자연스럽게 늘어요 📊"]], "expr": [["Do you have a minute?", "잠깐 시간 돼?", "오프닝 변형(second/minute) 💬"], ["Here's the thing", "실은 말이야", "내 상황을 꺼내는 신호탄 🔑"], ["on its last legs", "수명이 다한", "노후 기기 묘사 고급 표현 🔋"], ["upgrade", "(기기를) 바꾸다", "change보다 자연스러운 동사 ✨"], ["Can I ask you a few questions?", "몇 가지 물어봐도 돼?", "질문 시작을 알리는 신호 🔑"], ["Oh, that one?", "아, 그거?", "대답을 받아 주는 짧은 리액션 💬"], ["eye ~", "~을 눈여겨보다", "구매 고민을 드러내는 동사 📸"], ["in low light", "어두운 곳에서", "카메라 성능 묘사 필수 표현 📸"], ["a huge selling point", "아주 큰 장점", "강한 긍정 리액션에 딱 🔥"], ["Only half a day?", "반나절밖에?", "아쉬움을 담은 부정 리액션 😆"], ["That's not bad at all.", "그 정도면 괜찮네.", "가격에 쓰는 온건한 리액션 ✅"]], "audio": "audio/3_롤플레이/3-007 3. 휴대폰(Cell Phone)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-007 3. 휴대폰(Cell Phone)_정보 요청.mp3"}, {"id": "3-008", "cat": "roleplay", "catName": "롤플레이 질문", "num": 3, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "문제 해결", "badge": "08 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You received a document from your friend, but it will not open on your cell phone. Call your friend, describe the problem, and propose two or three different ways to get or view the document.", "enA": "Hey, it's me. I'm having trouble with the file you sent me this morning. I tapped it a few times, but my phone just says 'unsupported format' and won't open it. I think it's because it's a Hangul file and my phone doesn't have that app.\n\nSo here's what I'm thinking. First, could you save it as a PDF and send it again? PDFs open on any phone, so that would solve it in one shot. Or, if that's a hassle, just email it to me — I can open it on my laptop tonight.\n\nAnd if all else fails, could you take a screenshot of the important parts? I only need the schedule on the second page. Whichever is easiest for you is totally fine. Sorry to bother you — thanks a lot!", "koQ": "친구가 보낸 문서가 당신의 휴대폰에서 열리지 않습니다. 전화해서 문제를 설명하고, 그 문서를 받거나 열어 볼 방법 2~3가지를 제안해 보세요.", "koA": "안녕, 나야. 오늘 아침에 네가 보낸 파일 때문에 전화했어. 몇 번이나 눌러 봤는데 내 폰에서는 지원하지 않는 형식이라고만 뜨고 열리지가 않아. 한글 파일인데 내 폰에 그 앱이 없어서 그런 것 같아.\n\n그래서 내 생각은 이래. 첫째, 그 파일을 PDF로 저장해서 다시 보내 줄 수 있을까? PDF는 어떤 폰에서든 열리니까 그러면 한 번에 해결될 거야. 아니면 그게 번거로우면 그냥 이메일로 보내 줘. 오늘 밤에 노트북으로 열어 볼게.\n\n그리고 그것도 다 안 되면, 중요한 부분만 캡처해서 보내 줄 수 있을까? 나는 두 번째 장의 일정표만 있으면 되거든. 너한테 제일 편한 방법이면 다 괜찮아. 번거롭게 해서 미안하고, 정말 고마워!", "struct": [["1️⃣ 상황", "파일이 안 열림 (형식 오류)"], ["2️⃣ 원인", "한글 파일 · 전용 앱 없음"], ["3️⃣ 제안", "① PDF로 변환해 재전송"], ["4️⃣ 제안", "② 이메일 → 노트북에서 열기"], ["5️⃣ 마무리", "③ 캡처 전송 + 선택권 넘기기"]], "scoring": [["증상 구체화", "안 열려요 한 마디로 끝내지 말고 지원하지 않는 형식이라고 뜬다처럼 화면 문구까지 말해 주세요 📏 구체성이 곧 점수예요"], ["원인 추측", "I think it's because ~로 원인을 짚으면 문장이 하나 더 늘고 문제 해결형 답변의 논리가 살아나요 🧩"], ["대안 난이도 순", "제일 쉬운 것(PDF 재전송) → 그다음(이메일) → 최후(캡처) 순서로 배치하면 제안에 설득력이 생겨요 ✅"], ["부담 줄이기", "Whichever is easiest for you처럼 상대의 부담을 덜어 주는 한 마디로 닫으면 태도 점수가 올라가요 😊"]], "expr": [["I'm having trouble with ~", "~때문에 곤란해", "문제 상황 오프닝 1순위 💬"], ["unsupported format", "지원하지 않는 형식", "화면 문구를 그대로 인용 📏"], ["won't open", "열리지가 않아", "won't = 거부의 뉘앙스 🔑"], ["I think it's because ~", "~때문인 것 같아", "원인 추측 한 문장 추가 🧩"], ["Here's what I'm thinking", "내 생각은 이래", "대안 나열 직전의 신호탄 🔁"], ["save it as a PDF", "PDF로 저장하다", "파일 형식 제안 필수 표현 ✅"], ["in one shot", "한 번에", "대안의 장점을 압축한 표현 ✨"], ["if that's a hassle", "번거롭다면", "대안 2로 넘어가는 완충 장치 😊"], ["if all else fails", "다 안 되면", "최후의 대안을 여는 연결어 🔑"], ["Whichever is easiest for you", "편한 쪽으로", "선택권을 넘기는 마무리 ✅"], ["Sorry to bother you", "번거롭게 해서 미안해", "부탁 뒤에 얹는 예의 한 줄 💕"]], "audio": "audio/3_롤플레이/3-008 3. 휴대폰(Cell Phone)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-008 3. 휴대폰(Cell Phone)_문제 해결.mp3"}, {"id": "3-009", "cat": "roleplay", "catName": "롤플레이 질문", "num": 3, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "과거 경험", "badge": "09 과거 경험", "enQ": "That's the end of the situation. Have you ever run into trouble with your cell phone? What was wrong, and how did you get it fixed? Tell me the whole story from start to finish in detail.", "enA": "Oh, this reminds me of the worst timing ever. Remember the concert tickets I finally won after three years of trying? On the day of the show, I was standing in line at the gate, and out of nowhere my phone just froze — completely stuck on the loading screen.\n\nAnd my ticket was a QR code on that phone. My heart dropped. The line kept moving, and I had no way to get in. I tried closing the app, I even plugged it into my battery pack — no luck.\n\nThen it hit me — a force restart. I held the power and volume buttons for about ten seconds, and guess what? It came back to life with the QR code right there. I made it in with two minutes to spare. Since then, I always screenshot my tickets the night before.", "koQ": "휴대폰을 쓰다가 문제를 겪은 적이 있나요? 무엇이 문제였고 어떻게 해결했는지 처음부터 끝까지 자세히 말해 주세요.", "koA": "아, 이건 정말 역대급 최악의 타이밍이었어요. 3년 만에 드디어 티켓팅에 성공한 그 콘서트 기억나시죠? 공연 당일에 입장 줄에 서 있었는데, 난데없이 폰이 그냥 멈춰 버렸어요. 로딩 화면에서 꼼짝도 안 하더라고요.\n\n그런데 제 티켓이 그 폰 안의 QR 코드였어요. 심장이 철렁했죠. 줄은 계속 줄어드는데 들어갈 방법이 없었으니까요. 앱도 꺼 보고 보조배터리에도 꽂아 봤는데 소용없었어요.\n\n그때 강제 재부팅이 떠올랐어요. 전원 버튼과 볼륨 버튼을 10초쯤 누르고 있었더니, 글쎄 폰이 다시 살아나면서 QR 코드가 그대로 떠 있는 거예요. 2분 남기고 겨우 입장했죠. 그 후로는 티켓을 항상 전날 밤에 캡처해 둡니다.", "struct": [["1️⃣ 도입", "회상 시그널 + 최악의 타이밍"], ["2️⃣ 상황", "콘서트 입장 줄 · 폰 멈춤"], ["3️⃣ 문제", "티켓이 QR 코드 · 입장 불가"], ["4️⃣ 해결", "강제 재부팅 → 2분 남기고 입장"], ["5️⃣ 마무리", "전날 밤 캡처 습관"]], "scoring": [["최악의 타이밍", "사건은 언제 터졌느냐가 절반이에요. 하필 콘서트 입장 줄이라는 설정 하나로 이야기의 긴장이 완성돼요 🎭"], ["감정 한 문장", "My heart dropped처럼 감정을 문장 하나로 박아 주세요 😆 앞 편의 a little panicked와 번갈아 쓰면 표현이 겹치지 않아요 🔁"], ["시도–실패 나열", "앱 종료 → 보조배터리 → no luck 순으로 나열하면 문제의 크기가 저절로 전달돼요 💪"], ["시리즈 연결", "돌발 휴대폰 편의 3년 티켓팅 이야기를 이어 쓴 에피소드예요 🔁 같은 세계관을 쓰면 답변이 한 사람의 이야기로 들려요"]], "expr": [["the worst timing ever", "역대급 최악의 타이밍", "사건 도입을 강화하는 한 마디 🔥"], ["out of nowhere", "난데없이", "사건 발생 신호, 돌발 편 개근 🔁"], ["freeze", "(화면이) 멈추다", "돌발 기술 편 재활용 🔁"], ["stuck on the loading screen", "로딩 화면에서 멈춘", "증상 묘사를 구체화 📏"], ["My heart dropped.", "심장이 철렁했어요.", "감정 표현 상급 버전 😆"], ["no way to get in", "들어갈 방법이 없는", "위기 상황을 압축한 표현 🧩"], ["no luck", "소용없었다", "nothing worked의 짧은 변형 🔁"], ["Then it hit me", "그때 문득 떠올랐다", "해결책 등장 신호 🔑"], ["force restart", "강제 재부팅", "폰 문제 해결 필수 명사 ✅"], ["with two minutes to spare", "2분 남기고", "돌발 기술 편 재활용 🔁 ⏰"], ["Since then, I always ~", "그 후로 항상 ~한다", "습관 변화 마무리 📊"]], "audio": "audio/3_롤플레이/3-009 3. 휴대폰(Cell Phone)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-009 3. 휴대폰(Cell Phone)_과거 경험.mp3"}, {"id": "3-010", "cat": "roleplay", "catName": "롤플레이 질문", "num": 4, "topic": "카페", "topicEn": "Cafe", "type": "정보 요청", "badge": "10 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are thinking of checking out a new cafe this weekend. Call your friend and ask three or four questions to figure out which cafe to visit and what to order there.", "enA": "Hey, it's me! Are you free for a second? I'm planning to check out a new cafe this weekend, and you always know the good spots. Can I pick your brain for a minute?\n\nSo, first things first — do you know any new places around the station? ... Oh, the one with the rooftop? I've walked past it a hundred times. And what's the vibe like — is it quiet enough to actually talk? ... Perfect, that's exactly what I want.\n\nAnd what should I order there? I'm an iced Americano person, but I'll go out of my comfort zone for a good signature drink. ... A salted cream latte? Now you've got me curious. One last thing — does it get packed on weekends? ... Right, I'll go early then. Thanks — talk to you later!", "koQ": "이번 주말에 새로운 카페에 가 볼 계획입니다. 친구에게 전화해 어디로 갈지, 무엇을 마실지 정하기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 잠깐 시간 괜찮아? 이번 주말에 새로운 카페에 가 볼까 하는데, 너는 항상 좋은 데를 잘 알잖아. 잠깐만 물어봐도 될까?\n\n자, 우선 중요한 것부터. 역 근처에 새로 생긴 데 아는 곳 있어? ... 아, 루프탑 있는 그 집? 그 앞을 백 번은 지나다녔는데. 그리고 분위기는 어때? 대화할 수 있을 만큼 조용해? ... 완벽해, 내가 딱 원하던 거야.\n\n그리고 거기서 뭘 시키면 좋을까? 나는 아이스 아메리카노파인데, 시그니처가 괜찮다면 한번 벗어나 볼 생각이야. ... 솔티드 크림 라떼? 오, 궁금해지는데. 마지막으로 하나만, 주말엔 많이 붐벼? ... 그렇구나, 그럼 일찍 가야겠다. 고마워, 나중에 또 통화하자!", "struct": [["1️⃣ 인사", "전화 오프닝 + 계획 설명"], ["2️⃣ 질문", "① 추천 장소 → 아는 척 리액션"], ["3️⃣ 질문", "② 분위기 → 만족 리액션"], ["4️⃣ 질문", "③ 추천 메뉴 → 호기심 리액션"], ["5️⃣ 마무리", "④ 주말 혼잡 + 계획 정리"]], "scoring": [["질문 + 리액션", "정보 요청은 질문 → 상대 대답 → 리액션의 반복이에요 💬 대답을 되받는 리액션 하나가 답변을 대화로 바꿔 줍니다"], ["내 취향 한 줄", "나는 아이스 아메리카노파야처럼 취향을 한 줄 깔면 추천을 묻는 이유가 분명해져요 ☕ 서베이 카페 편 설정을 그대로 재활용했어요 🔁"], ["리액션 다양화", "아는 척(Oh, the one with…) → 만족(Perfect) → 호기심(got me curious) → 수긍(Right) 😆 네 번 다 다르게 반응해 보세요"], ["계획으로 닫기", "그럼 일찍 가야겠다처럼 얻은 정보로 계획을 정리하며 끝내면 통화가 자연스럽게 닫혀요 ✅"]], "expr": [["Are you free for a second?", "잠깐 시간 괜찮아?", "전화 오프닝 변형 💬"], ["check out ~", "~에 가 보다", "새 장소 방문 만능 동사 ✨"], ["know the good spots", "좋은 데를 잘 알다", "부탁 앞에 얹는 칭찬 한 줄 💕"], ["pick your brain", "네 의견 좀 듣다", "정보 요청 고급 관용구 🔑"], ["first things first", "우선 중요한 것부터", "서베이 카페·요리 편 재활용 🔁"], ["the one with ~", "~있는 그 집", "아는 척 리액션의 공식 💬"], ["What's the vibe like?", "분위기는 어때?", "서베이 카페 편 vibe 재활용 🔁"], ["quiet enough to ~", "~할 만큼 조용한", "형용사 + enough to 구문 📊"], ["an iced Americano person", "아이스 아메리카노파", "서베이 카페 편 취향 재활용 🔁 ☕"], ["go out of my comfort zone", "익숙한 것에서 벗어나다", "도전 의사를 밝히는 관용구 🔥"], ["Now you've got me curious.", "궁금해지는데.", "추천을 받은 뒤 호기심 리액션 😆"]], "audio": "audio/3_롤플레이/3-010 4. 카페(Cafe)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-010 4. 카페(Cafe)_정보 요청.mp3"}, {"id": "3-011", "cat": "roleplay", "catName": "롤플레이 질문", "num": 4, "topic": "카페", "topicEn": "Cafe", "type": "문제 해결", "badge": "11 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You are at a cafe and have just noticed that you left your wallet at home. Talk to the staff, describe your situation, and offer two or three ideas for how they could help you.", "enA": "Excuse me, I'm so sorry to bother you, but I've got a bit of a situation. I just ordered the iced Americano, and when I reached for my wallet, I realized I left it at home. I have no cash and no cards on me right now.\n\nHere's what I can do. First, my banking app is on my phone, so if the shop has an account number, I can transfer the money right now. It takes about ten seconds, and you would have it before my drink is even ready.\n\nOr, my place is only a ten-minute walk from here. I can run home, grab my wallet, and be back before the ice melts. And if neither works, I'm happy to leave my bag as a deposit. Whichever is easiest for you — again, I'm really sorry about this.", "koQ": "카페에 있는데 지갑을 집에 두고 온 걸 알았습니다. 직원에게 상황을 설명하고, 도와줄 수 있는 방법 2~3가지를 제안해 보세요.", "koA": "저기요, 번거롭게 해서 정말 죄송한데, 상황이 좀 생겼어요. 방금 아이스 아메리카노를 주문했는데, 지갑을 꺼내려다가 집에 두고 온 걸 알았어요. 지금 현금도 카드도 하나도 없어요.\n\n제가 할 수 있는 건 이래요. 우선, 폰에 은행 앱이 있어서 매장 계좌번호만 알려 주시면 지금 바로 송금할 수 있어요. 10초면 되고, 음료가 나오기도 전에 입금이 확인되실 거예요.\n\n아니면 저희 집이 여기서 걸어서 10분밖에 안 걸려요. 뛰어가서 지갑을 가져오면 얼음이 녹기도 전에 돌아올 수 있어요. 그것도 어려우면 가방을 맡겨 두고 가도 괜찮고요. 편하신 쪽으로 해 주세요. 다시 한번 정말 죄송합니다.", "struct": [["1️⃣ 양해", "정중한 사과 + 상황 예고"], ["2️⃣ 상황", "주문 후 지갑 없음을 인지"], ["3️⃣ 제안", "① 모바일 뱅킹 즉시 송금"], ["4️⃣ 제안", "② 집이 10분 · 지갑 가져오기"], ["5️⃣ 마무리", "③ 가방 맡기기 + 선택권"]], "scoring": [["상대가 직원", "친구가 아니라 직원과의 대화예요. Excuse me와 I'm so sorry로 톤을 한 단계 올리면 상황 파악 점수가 붙어요 💬"], ["상황은 짧게", "변명은 길수록 불리해요. 주문했다 → 지갑이 없다 두 문장이면 충분하고, 남는 시간은 대안에 쓰세요 ⏰"], ["대안에 숫자", "10초면 된다, 10분 거리다처럼 숫자를 붙이면 제안이 현실적으로 들려요 📏 돌발 은행 편 모바일 뱅킹 설정 재활용 🔁"], ["선택권 넘기기", "Whichever is easiest for you로 결정권을 넘기고 마지막에 사과를 한 번 더 얹으면 깔끔하게 닫혀요 😊"]], "expr": [["sorry to bother you", "번거롭게 해 죄송해요", "직원 대상 정중한 오프닝 💬"], ["a bit of a situation", "좀 곤란한 상황", "문제를 부드럽게 꺼내는 말 ✨"], ["reach for ~", "~을 꺼내려 손을 뻗다", "상황 묘사를 살리는 동사 💪"], ["leave ~ at home", "~을 집에 두고 오다", "물건 분실 유형 필수 표현 🔑"], ["no cash and no cards", "현금도 카드도 없다", "상태를 압축한 한 마디 💳"], ["Here's what I can do", "제가 할 수 있는 건", "대안 나열 직전의 신호탄 🔁"], ["transfer the money", "송금하다", "돌발 은행 편 재활용 🔁 💳"], ["a ten-minute walk", "걸어서 10분 거리", "서베이 동네 편 재활용 🔁 🏠"], ["be back before ~", "~하기 전에 돌아오다", "속도를 보장하는 표현 ⏰"], ["leave ~ as a deposit", "~을 담보로 맡기다", "최후의 대안에 딱 ✅"], ["Whichever is easiest for you", "편하신 쪽으로", "롤플레이 문제해결 공통 마무리 🔁"]], "audio": "audio/3_롤플레이/3-011 4. 카페(Cafe)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-011 4. 카페(Cafe)_문제 해결.mp3"}, {"id": "3-012", "cat": "roleplay", "catName": "롤플레이 질문", "num": 4, "topic": "카페", "topicEn": "Cafe", "type": "과거 경험", "badge": "12 과거 경험", "enQ": "That's the end of the situation. Have you ever visited a cafe where the drinks or the service let you down? What exactly happened, and how did you handle it? Share everything you remember about that visit.", "enA": "Oh, this reminds me of a cafe I tried last summer. It had just opened near my office, and the photos online looked gorgeous, so my expectations were sky-high. I ordered their signature latte and grabbed a seat by the window.\n\nBut the first sip was a letdown. It was lukewarm, and way too sweet — it tasted more like dessert than coffee. On top of that, the staff were chatting behind the counter while three people waited to order. Not a great first impression.\n\nTo be honest, I almost just left. But I decided to speak up politely and said the latte had come out cold. The manager apologized right away, remade it, and even gave me a free drink coupon. Funny enough, I've been back twice since. Now I always say something instead of quietly walking out.", "koQ": "카페에 갔다가 음료나 서비스에 실망한 적이 있나요? 정확히 무슨 일이 있었고 어떻게 대처했는지 기억나는 대로 말해 주세요.", "koA": "아, 작년 여름에 가 봤던 카페가 생각나네요. 회사 근처에 막 문을 연 곳이었는데, 인터넷 사진이 정말 근사해서 기대가 하늘을 찔렀어요. 시그니처 라떼를 시키고 창가 자리를 잡았죠.\n\n그런데 첫 모금부터 실망이었어요. 미지근한 데다 너무 달아서, 커피라기보다 디저트 맛이었거든요. 게다가 주문하려고 세 명이나 기다리는데 직원들은 카운터 뒤에서 수다를 떨고 있었어요. 첫인상이 좋을 수가 없었죠.\n\n솔직히 그냥 나올까 했어요. 그런데 정중하게 말해 보기로 했죠. 라떼가 식은 채로 나왔다고요. 매니저분이 바로 사과하고 새로 만들어 주셨고, 무료 음료 쿠폰까지 주셨어요. 웃기게도 그 후로 두 번이나 다시 갔어요. 이제는 조용히 나와 버리는 대신 꼭 말을 해요.", "struct": [["1️⃣ 도입", "회상 시그널 + 높은 기대치"], ["2️⃣ 문제", "미지근 · 과한 단맛 (첫 모금)"], ["3️⃣ 문제", "직원 잡담 · 방치된 대기 줄"], ["4️⃣ 해결", "정중히 말함 → 재제조 · 쿠폰"], ["5️⃣ 마무리", "재방문 + 달라진 내 태도"]], "scoring": [["기대치 먼저", "sky-high로 기대를 먼저 올려 두면 실망이 훨씬 크게 들려요 📊 기대 → 실망의 낙차가 이야기의 힘이에요"], ["실망은 두 갈래", "음료(미지근·단맛)와 서비스(직원 잡담)로 나누면 문제가 요구한 drinks or service를 모두 답하게 돼요 ✅"], ["대처 행동", "unhappy로 끝내지 말고 speak up처럼 내가 한 행동을 말하세요 💪 대처가 있어야 how did you handle it에 답이 됩니다"], ["태도 변화 마무리", "Now I always ~로 그 경험이 나를 어떻게 바꿨는지 붙이면 답변이 한 단계 올라가요 🔁 Since then 마무리의 변형이에요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["sky-high", "하늘을 찌르는", "서베이 콘서트 편 재활용 🔁"], ["grab a seat by the window", "창가 자리를 잡다", "서베이 카페 편 재활용 🔁 ☕"], ["The first sip was a letdown", "첫 모금부터 실망", "실망을 압축한 한 문장 😆"], ["lukewarm", "미지근한", "음료 불만의 핵심 형용사 ☕"], ["way too sweet", "너무 단", "way too = 과함 강조 🔥"], ["On top of that", "게다가", "불만을 하나 더 얹는 연결어 🔑"], ["Not a great first impression", "첫인상이 별로인", "완곡하게 깎는 부정 표현 ✨"], ["speak up", "목소리를 내다", "대처 행동을 나타내는 동사 💪"], ["Funny enough", "웃기게도", "서베이 영화·동네 편 재활용 🔁"], ["Now I always ~", "이제는 항상 ~해요", "태도 변화 마무리 📊"]], "audio": "audio/3_롤플레이/3-012 4. 카페(Cafe)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-012 4. 카페(Cafe)_과거 경험.mp3"}, {"id": "3-013", "cat": "roleplay", "catName": "롤플레이 질문", "num": 5, "topic": "음식", "topicEn": "Food", "type": "정보 요청", "badge": "13 정보 요청", "enQ": "I'd like to give you a situation to act it out. There is a new restaurant in your city you would like to try, but you do not know what kind of food they offer. Call the restaurant and ask three or four questions to find out more.", "enA": "Hi, is this the new restaurant near the station? I walked past it last week and I've been curious ever since, but the menu wasn't posted outside. I'm calling to ask a few quick questions before I stop by this weekend — do you have a minute?\n\nGreat. First, what kind of food do you have? ... Oh, modern Korean fusion? That sounds interesting. And is there a signature dish you'd recommend for first-timers? ... Braised short ribs? Now I'm hungry already.\n\nTwo more things. What's the price range for dinner? ... Around thirty thousand won a person? That's pretty reasonable for a full course. And do you take reservations on weekends? ... Walk-ins only? Good to know — I'll come early then. Thanks for your help!", "koQ": "도시에 새로 생긴 식당에 가 보고 싶은데 어떤 음식을 파는지 모릅니다. 식당에 전화해 정보를 얻기 위한 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 근처에 새로 생긴 식당 맞나요? 지난주에 앞을 지나가다 보고 계속 궁금했는데, 바깥에 메뉴판이 없더라고요. 이번 주말에 가 보기 전에 몇 가지만 여쭤보려고 전화드렸어요. 잠깐 시간 괜찮으실까요?\n\n좋아요. 우선, 어떤 종류의 음식을 하시나요? ... 아, 모던 한식 퓨전이요? 정말 흥미롭네요. 그리고 처음 가는 사람에게 추천하시는 대표 메뉴가 있을까요? ... 갈비찜이요? 벌써 배가 고파지는데요.\n\n두 가지만 더요. 저녁 가격대는 어느 정도인가요? ... 한 사람당 3만 원 정도요? 코스 치고는 꽤 합리적이네요. 그리고 주말에 예약도 받으시나요? ... 예약 없이 방문만 가능하군요. 알아 둘게요, 그럼 일찍 가 보겠습니다. 도움 주셔서 감사합니다!", "struct": [["1️⃣ 인사", "가게 확인 + 전화 목적 밝히기"], ["2️⃣ 질문", "① 음식 종류 → 흥미 리액션"], ["3️⃣ 질문", "② 대표 메뉴 → 식욕 리액션"], ["4️⃣ 질문", "③ 가격대 → 수긍 리액션"], ["5️⃣ 마무리", "④ 예약 여부 + 감사 인사"]], "scoring": [["상대가 가게", "친구가 아니라 식당 직원이에요. Hi, is this ~?로 확인하고 I'm calling to ask로 목적을 밝히면 상황 설정 점수가 붙어요 💬"], ["리액션은 짧게", "'Oh, modern Korean fusion?' 한 마디면 충분해요 ⏰ 리액션이 길어지면 정작 질문 개수를 못 채웁니다"], ["되묻기 리액션", "상대 대답을 의문문으로 되받으면(Braised short ribs?) 알아들었다는 신호가 되고 문장 수도 늘어요 📊"], ["정중한 마무리", "가게에 건 전화는 Thanks for your help!로 닫아 주세요 ✅ 친구 통화의 Talk to you later!와 구분해 외워 두면 좋아요 🔁"]], "expr": [["Hi, is this ~?", "혹시 ~ 맞나요?", "가게에 거는 전화 오프닝 💬"], ["I'm calling to ask ~", "~하려고 전화했어요", "전화 목적을 밝히는 공식 🔑"], ["curious ever since", "그때부터 계속 궁금한", "방문 동기를 살리는 표현 ✨"], ["What kind of food do you have?", "어떤 음식을 하시나요?", "식당 문의 1번 질문 🍳"], ["That sounds interesting.", "흥미롭네요.", "무난하게 받아 주는 리액션 💬"], ["a signature dish", "대표 메뉴", "돌발 식당 편 재활용 🔁 🍳"], ["Now I'm hungry already.", "벌써 배고파지는데요.", "식욕을 드러내는 리액션 😆"], ["What's the price range?", "가격대가 어떻게 되나요?", "예산 질문 기본형 💳"], ["pretty reasonable", "꽤 합리적인", "가격에 쓰는 긍정 리액션 ✅"], ["take reservations", "예약을 받다", "롤플레이 예약 유형 필수 🔑"], ["Thanks for your help!", "도움 감사합니다!", "가게 통화 종료 시그널 ✅"]], "audio": "audio/3_롤플레이/3-013 5. 음식(Food)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-013 5. 음식(Food)_정보 요청.mp3"}, {"id": "3-014", "cat": "roleplay", "catName": "롤플레이 질문", "num": 5, "topic": "음식", "topicEn": "Food", "type": "문제 해결", "badge": "14 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. The takeout you ordered for a party turned out to be the wrong food when it was delivered. Call the restaurant, describe what happened, and offer two or three ideas to fix the problem.", "enA": "Hello, I placed a takeout order about an hour ago — two large fried chickens and a jokbal set for a party. But the delivery just arrived, and it's completely the wrong order. I got three pizzas instead. I think the orders got mixed up somewhere.\n\nHere's the thing — I have eight people at my place waiting to eat, so I really need this sorted out quickly. First, could you send the correct order right away? I'll keep the pizzas so your driver doesn't have to make two trips.\n\nIf that takes too long, could you at least send the chicken first and the jokbal later? Or, if neither is possible, I'd like a full refund so I can order somewhere else tonight. Whichever you can do fastest — I'd really appreciate it.", "koQ": "파티용으로 주문한 포장 음식이 다른 음식으로 배달됐습니다. 식당에 전화해 상황을 설명하고, 해결 방법 2~3가지를 제안해 보세요.", "koA": "안녕하세요, 한 시간쯤 전에 파티용으로 포장 주문을 했는데요. 후라이드 치킨 큰 거 두 마리랑 족발 세트였어요. 그런데 방금 배달이 왔는데 완전히 다른 주문이에요. 피자 세 판이 왔어요. 주문이 어딘가에서 섞인 것 같아요.\n\n문제는 지금 저희 집에 여덟 명이 밥을 기다리고 있다는 거예요. 그래서 빨리 해결해야 하는 상황이에요. 우선, 제대로 된 주문을 지금 바로 보내 주실 수 있을까요? 피자는 제가 받아 둘게요. 기사님이 두 번 오실 필요 없게요.\n\n그게 너무 오래 걸린다면, 최소한 치킨만 먼저 보내 주시고 족발은 나중에 주셔도 괜찮아요. 아니면 둘 다 어려우시면 전액 환불해 주세요. 오늘 밤에 다른 데서 시켜야 하니까요. 가장 빨리 되는 방법으로 해 주시면 정말 감사하겠습니다.", "struct": [["1️⃣ 확인", "주문 내역 + 도착한 음식 대조"], ["2️⃣ 상황", "8명 대기 중 · 시간 촉박"], ["3️⃣ 제안", "① 올바른 주문 즉시 재배송"], ["4️⃣ 제안", "② 치킨 먼저 · 족발은 나중"], ["5️⃣ 마무리", "③ 전액 환불 + 속도 요청"]], "scoring": [["주문부터 특정", "언제 무엇을 시켰는지 먼저 말해야 직원이 확인할 수 있어요 📏 클레임은 사실 확인부터 시작합니다"], ["급한 이유", "여덟 명이 기다린다는 한 줄이 왜 빨리 해결해야 하는지를 설명해 줘요 💪 이유가 있어야 요구가 무례하게 들리지 않아요"], ["상대 배려", "피자는 제가 받아 둘게요처럼 상대의 부담을 덜어 주는 제안 하나가 IH의 성숙한 태도 점수예요 😊"], ["속도로 닫기", "Whichever you can do fastest로 닫으면 흩어진 대안이 하나의 요구로 정리돼요 ⏰"]], "expr": [["place a takeout order", "포장 주문을 하다", "배달·포장 유형 필수 동사 🍳"], ["the wrong order", "잘못된 주문", "문제를 한 마디로 규정 🔑"], ["get mixed up", "뒤섞이다", "원인 추측에 쓰는 구동사 🧩"], ["Here's the thing", "문제는 이거예요", "사정을 꺼내는 신호탄 🔁"], ["sort ~ out", "~을 해결하다", "resolve의 구어체 버전 ✅"], ["right away", "지금 바로", "속도를 요구하는 부사구 ⏰"], ["make two trips", "두 번 오가다", "상대 배려를 드러내는 표현 💕"], ["If that takes too long", "그게 오래 걸린다면", "대안 2로 넘어가는 완충 장치 😊"], ["at least", "최소한", "요구 수준을 낮추는 한 마디 ✨"], ["a full refund", "전액 환불", "최후의 대안 필수 명사 💳"], ["Whichever you can do fastest", "가장 빠른 방법으로", "속도로 닫는 마무리 ⏰"]], "audio": "audio/3_롤플레이/3-014 5. 음식(Food)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-014 5. 음식(Food)_문제 해결.mp3"}, {"id": "3-015", "cat": "roleplay", "catName": "롤플레이 질문", "num": 5, "topic": "음식", "topicEn": "Food", "type": "과거 경험", "badge": "15 과거 경험", "enQ": "That's the end of the situation. Have you ever attempted a new recipe and realized it was far more difficult than you thought? What went wrong, and what did that experience teach you?", "enA": "Oh, this reminds me of my best friend's birthday two years ago. I decided to bake her a cake from scratch — a real one, with whipped cream and strawberries. The recipe said 'easy, forty minutes.' Famous last words.\n\nIf it could go wrong, it did. I over-whipped the cream until it turned into butter, and the sponge came out of the oven and sank in the middle. Four hours in, my kitchen looked like a crime scene and I was close to giving up.\n\nSo I improvised. I cut the sponge into cubes, layered them in glasses with cream and strawberries, and called it a 'deconstructed cake.' Guess what? She loved it. What I learned is that recipe times are a lie, and anything new needs a rehearsal. Now I always do a test run a week before.", "koQ": "새로운 레시피에 도전했다가 생각보다 훨씬 어려웠던 적이 있나요? 무엇이 잘못되었고, 그 경험에서 무엇을 배웠나요?", "koA": "아, 2년 전 절친 생일이 생각나네요. 제가 직접 케이크를 굽기로 했어요. 생크림에 딸기까지 올린 진짜 케이크로요. 레시피에는 쉬움, 40분이라고 적혀 있었죠. 그 말을 믿은 게 실수였어요.\n\n잘못될 수 있는 건 다 잘못됐어요. 생크림을 너무 오래 저어서 버터가 돼 버렸고, 시트는 오븐에서 꺼내자마자 가운데가 푹 주저앉았어요. 네 시간이 지났을 때 제 주방은 완전히 아수라장이었고, 저는 포기 직전이었죠.\n\n그래서 즉흥적으로 해결했어요. 시트를 깍둑 썰어서 유리컵에 크림, 딸기와 켜켜이 담고는 해체한 케이크라고 불렀죠. 그런데 있잖아요, 친구가 엄청 좋아했어요. 그때 배운 건 레시피의 시간은 거짓말이라는 것, 그리고 처음 하는 요리엔 예행연습이 필요하다는 거예요. 이제는 꼭 일주일 전에 한 번 만들어 봐요.", "struct": [["1️⃣ 도입", "절친 생일 · 직접 케이크 도전"], ["2️⃣ 복선", "레시피 왈 쉬움 40분"], ["3️⃣ 문제", "생크림 버터화 · 시트 주저앉음"], ["4️⃣ 해결", "컵에 담아 해체 케이크로 변신"], ["5️⃣ 마무리", "배운 점 + 예행연습 습관"]], "scoring": [["복선 깔기", "레시피에 쉬움 40분이라 적혀 있었다 → Famous last words. 복선 한 줄이 실패를 훨씬 재미있게 만들어요 🎭"], ["실패는 두 가지", "생크림과 시트, 두 군데가 무너졌다고 나누면 문제가 훨씬 구체적으로 들려요 📏 하나만 말하면 심심해요"], ["배운 점 필수", "문제가 what did that experience teach you를 직접 묻고 있어요. What I learned is ~로 반드시 답하세요 ✅"], ["습관으로 연결", "Now I always do a test run으로 닫으면 실패담이 성장담이 돼요 📊 서베이 요리 편 Lesson learned!의 상위 버전이에요 🔁"]], "expr": [["from scratch", "처음부터 직접", "요리·제작 만능 표현 🍳"], ["Famous last words.", "그 말을 믿은 게 실수", "돌발 패션·집안일 편 재활용 🔁"], ["If it could go wrong, it did", "잘못될 건 다 잘못됐다", "실패담을 압축한 한 문장 😆"], ["over-whip the cream", "생크림을 너무 젓다", "조리 실패 원인 동사 🍳"], ["turn into butter", "버터가 되어 버리다", "실패 결과를 살리는 표현 😆"], ["sink in the middle", "가운데가 주저앉다", "베이킹 실패 단골 표현 📏"], ["a crime scene", "아수라장", "과장으로 웃음 주는 표현 🔥"], ["close to giving up", "포기 직전인", "감정 고조를 담은 표현 💪"], ["improvise", "즉흥적으로 해내다", "서베이 요리 편 재활용 🔁"], ["What I learned is ~", "제가 배운 건 ~예요", "교훈 질문에 답하는 문형 ✅"], ["do a test run", "예행연습을 하다", "습관 변화 마무리 📊"]], "audio": "audio/3_롤플레이/3-015 5. 음식(Food)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-015 5. 음식(Food)_과거 경험.mp3"}, {"id": "3-016", "cat": "roleplay", "catName": "롤플레이 질문", "num": 6, "topic": "공원", "topicEn": "Park", "type": "정보 요청", "badge": "16 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your friend is planning to visit a park this weekend and has asked you to come along. Call your friend and ask three or four questions about the plan to learn the details of the outing.", "enA": "Hey, it's me! I got your message about the park this weekend — count me in! It sounds perfect, honestly. I just have a few things to check before Saturday. Do you have a minute?\n\nFirst of all, which park are we going to? ... Oh, the riverside one? That's my favorite — it's within walking distance from my place. And what time should I be there? ... Ten in the morning? That's early for a weekend! But fine, I'll set an alarm.\n\nAnd are we going to have a picnic, or should I eat before I go? ... Oh, you're bringing food? Then I'll bring a picnic blanket and some fruit. One last thing — is anyone else coming? ... Just the two of us? Even better. See you Saturday!", "koQ": "친구가 이번 주말에 공원에 가자고 초대했습니다. 친구에게 전화해 약속의 세부 내용을 알기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 이번 주말에 공원 가자는 메시지 봤어. 나도 갈게! 진짜 딱 좋은 것 같아. 그런데 토요일 전에 몇 가지만 확인하고 싶어서. 잠깐 시간 돼?\n\n우선, 어느 공원으로 갈 거야? ... 아, 강변에 있는 그 공원? 거기 내가 제일 좋아하는 데야. 우리 집에서 걸어갈 수 있는 거리거든. 그리고 몇 시까지 가면 돼? ... 아침 10시? 와, 주말치고는 이르네! 그래도 괜찮아, 알람 맞춰 놓을게.\n\n그리고 우리 돗자리 펴고 도시락 먹는 거야, 아니면 먹고 가는 게 나아? ... 아, 음식 싸 온다고? 그럼 나는 돗자리랑 과일 좀 챙겨 갈게. 마지막으로 하나만, 다른 사람도 와? ... 우리 둘만? 더 좋지. 토요일에 보자!", "struct": [["1️⃣ 인사", "초대 수락 (Count me in!)"], ["2️⃣ 질문", "① 장소 → 반가움 리액션"], ["3️⃣ 질문", "② 시간 → 놀람 리액션"], ["4️⃣ 질문", "③ 식사 → 준비물 제안"], ["5️⃣ 마무리", "④ 참석자 + 약속 확인"]], "scoring": [["수락이 먼저", "Count me in!으로 초대를 먼저 받아 주면 통화의 온도가 올라가요 😊 질문은 그다음이에요"], ["리액션 + 행동", "10시? 알람 맞춰 놓을게 / 음식 싸 온다고? 그럼 돗자리 챙길게처럼 리액션 뒤에 내 행동을 붙이면 문장이 두 배가 돼요 💪"], ["서베이 재활용", "riverside, within walking distance, picnic blanket 모두 서베이 공원 편에서 쓴 표현이에요 🔁 롤플레이에서 그대로 재사용하세요"], ["약속 확인 마무리", "See you Saturday!처럼 요일을 넣어 닫으면 계획이 확정된 느낌으로 통화가 끝나요 ⏰"]], "expr": [["Count me in!", "나도 갈게!", "초대 수락 1순위 표현 🔥"], ["a few things to check", "확인할 게 몇 가지", "질문을 예고하는 신호 🔑"], ["the riverside one", "강변에 있는 그 공원", "서베이 공원 편 재활용 🔁"], ["within walking distance", "걸어갈 수 있는 거리", "서베이 동네 편 재활용 🔁 🏠"], ["That's early for a weekend", "주말치고 이르네", "시간에 쓰는 놀람 리액션 😆"], ["set an alarm", "알람을 맞추다", "리액션 뒤에 붙이는 행동 ⏰"], ["have a picnic", "소풍을 즐기다", "서베이 공원 편 재활용 🔁"], ["a picnic blanket", "돗자리", "준비물 제안에 딱 ✨"], ["One last thing", "마지막으로 하나만", "마지막 질문을 여는 장치 🔑"], ["Just the two of us?", "우리 둘만?", "인원 확인 리액션 💬"], ["See you Saturday!", "토요일에 보자!", "약속 확정형 종료 시그널 ✅"]], "audio": "audio/3_롤플레이/3-016 6. 공원(Park)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-016 6. 공원(Park)_정보 요청.mp3"}, {"id": "3-017", "cat": "roleplay", "catName": "롤플레이 질문", "num": 6, "topic": "공원", "topicEn": "Park", "type": "문제 해결", "badge": "17 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You have just learned that the park you and your friend planned to visit this weekend will be shut down. Call your friend, describe the situation, and offer two or three other options.", "enA": "Hey, it's me. I've got some bad news about Saturday. I just checked the park's website, and it's closed all week for maintenance. I even called the office to make sure — they confirmed it. So our picnic is off, at least at that park.\n\nBut don't cancel your plans yet — here's what I'm thinking. First, there's another park two subway stops away. It's smaller, but it has a riverside trail and plenty of grassy spots, so the picnic still works.\n\nOr, if you'd rather skip the trip, we can just have the picnic at my place — I have a rooftop, and I'll handle the food. And if the weather turns bad anyway, let's move it to next Saturday. Let me know which one works and I'll set it up.", "koQ": "함께 가기로 한 공원이 이번 주에 문을 닫는다는 것을 알았습니다. 친구에게 연락해 상황을 설명하고, 대안 2~3가지를 제시해 보세요.", "koA": "안녕, 나야. 토요일 관련해서 안 좋은 소식이 있어. 방금 공원 홈페이지를 봤는데, 정비 때문에 이번 주 내내 문을 닫는대. 확실히 하려고 사무실에 전화까지 해 봤는데 맞다고 하더라고. 그래서 우리 소풍은 적어도 그 공원에서는 못 하게 됐어.\n\n그렇다고 계획을 취소하지는 말고, 내 생각은 이래. 첫째, 지하철로 두 정거장 거리에 다른 공원이 있어. 조금 작긴 한데 강변 산책로도 있고 잔디밭도 넉넉해서 소풍은 충분히 할 수 있어.\n\n아니면 차라리 나가는 게 번거로우면 그냥 우리 집에서 해도 돼. 옥상이 있거든. 음식은 내가 준비할게. 그리고 어차피 날씨가 안 좋아지면 다음 주 토요일로 미루자. 어떤 게 좋은지 알려 주면 내가 다 준비할게.", "struct": [["1️⃣ 소식", "나쁜 소식 예고 + 폐쇄 사실"], ["2️⃣ 확인", "홈페이지 · 사무실 전화로 확인"], ["3️⃣ 제안", "① 두 정거장 거리 다른 공원"], ["4️⃣ 제안", "② 우리 집 옥상 + 음식 준비"], ["5️⃣ 마무리", "③ 다음 주로 연기 + 선택 요청"]], "scoring": [["근거 대기", "홈페이지 확인 + 사무실 전화라는 근거를 붙이면 나쁜 소식이 신뢰를 얻어요 📏 확인했다는 사실 자체가 성의예요"], ["불안 달래기", "Don't cancel your plans yet 한 줄로 상대를 먼저 안심시키고 대안으로 넘어가세요 😊"], ["대안 성격 구분", "다른 장소 / 우리 집 / 날짜 연기. 성격이 다른 세 갈래여야 제안이 입체적으로 들려요 ✅"], ["내가 맡기", "I'll handle the food, I'll set it up처럼 내가 하겠다는 말이 들어가면 태도 점수가 올라가요 💪"]], "expr": [["I've got some bad news", "안 좋은 소식이 있어", "문제해결 오프닝 1순위 🔁 💬"], ["closed for maintenance", "정비로 문을 닫은", "시설 폐쇄 필수 표현 🔑"], ["make sure", "확실히 해 두다", "확인 과정을 보여 주는 표현 ✅"], ["They confirmed it.", "맞다고 하더라고.", "근거를 못 박는 한 문장 📏"], ["be off", "무산되다", "계획 취소를 뜻하는 구어 😆"], ["Don't cancel ~ yet", "아직 ~하지는 마", "상대를 안심시키는 완충 장치 😊"], ["two subway stops away", "지하철 두 정거장 거리", "거리 안내 만능 표현 ⏰"], ["a riverside trail", "강변 산책로", "서베이 공원 편 재활용 🔁"], ["if you'd rather ~", "차라리 ~하고 싶다면", "선택지 제시 고급 구문 🔁 💯"], ["handle the food", "음식은 내가 맡다", "책임을 가져오는 표현 💪"], ["Let me know which one works", "어느 게 좋은지 알려 줘", "선택권을 넘기는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-017 6. 공원(Park)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-017 6. 공원(Park)_문제 해결.mp3"}, {"id": "3-018", "cat": "roleplay", "catName": "롤플레이 질문", "num": 6, "topic": "공원", "topicEn": "Park", "type": "과거 경험", "badge": "18 과거 경험", "enQ": "That's the end of the situation. Do you have a park visit that you still remember? Perhaps something fun, interesting, or unexpected took place. What made it stand out? What happened, and how did you respond to the situation?", "enA": "Oh, this reminds me of an evening at the riverside park last autumn. I was sitting on a bench after my jog, just catching my breath, when out of nowhere a small white dog came running at me and sat right on my foot.\n\nIt had a collar but no owner in sight. I'm not kidding — it looked up at me like we had known each other for years. So I picked it up and started asking everyone on the trail, and before I knew it, four or five strangers were searching with me.\n\nAbout thirty minutes later, a woman came sprinting down the path, completely out of breath, and the dog lost its mind with joy. Everyone around us cheered. What made it special is how quickly strangers became a team. Since then, that bench has been my favorite spot in the whole park.", "koQ": "공원에서 겪은 기억에 남는 경험이 있나요? 무슨 일이 있었고, 왜 특별한가요? 그 상황에 어떻게 대처했는지 말해 주세요.", "koA": "아, 작년 가을 강변 공원에서의 어느 저녁이 생각나네요. 조깅을 마치고 벤치에 앉아 숨을 고르고 있었는데, 난데없이 하얀 강아지 한 마리가 저한테 곧장 달려오더니 제 발 위에 앉는 거예요.\n\n목줄은 있는데 주인은 보이지 않았어요. 진짜예요, 몇 년은 알고 지낸 사이처럼 저를 올려다보더라고요. 그래서 강아지를 안고 산책로에 있는 사람들한테 물어보기 시작했는데, 어느새 낯선 사람 네댓 명이 저와 함께 주인을 찾고 있었어요.\n\n30분쯤 뒤에 한 여성분이 숨이 턱까지 차서 산책로를 달려왔고, 강아지는 기뻐서 어쩔 줄을 몰랐어요. 주변 사람들이 다 환호했죠. 그 경험이 특별했던 건 낯선 사람들이 그렇게 빨리 한 팀이 됐다는 점이에요. 그 후로 그 벤치는 공원에서 제가 가장 좋아하는 자리가 됐어요.", "struct": [["1️⃣ 도입", "조깅 후 강변 공원 벤치"], ["2️⃣ 사건", "난데없이 달려온 하얀 강아지"], ["3️⃣ 전개", "주인 없음 → 낯선 사람들 합류"], ["4️⃣ 절정", "30분 뒤 달려온 주인 · 환호"], ["5️⃣ 마무리", "특별한 이유 + 내 최애 자리"]], "scoring": [["특별한 이유", "문제가 What made it stand out을 직접 물어요. What made it special is ~로 반드시 한 문장 답하세요 ✅"], ["등장인물 늘리기", "강아지 → 나 → 낯선 사람들 → 주인. 인물이 늘어날수록 이야기가 풍성해지고 쓸 수 있는 동사도 많아져요 💪"], ["시간 표시", "About thirty minutes later처럼 시간을 박아 주면 사건의 흐름이 분명해져요 ⏰"], ["장소로 마무리", "그 벤치가 최애 자리가 됐다처럼 사건을 장소에 묶어 두면 공원 주제 답변으로 깔끔하게 닫혀요 🔁"]], "expr": [["catch my breath", "숨을 고르다", "서베이 조깅 편 재활용 🔁 🏃"], ["out of nowhere", "난데없이", "사건 발생 신호, 전 편 개근 🔁"], ["come running at ~", "~에게 달려오다", "장면을 살리는 동사 💪"], ["a collar but no owner", "주인 없는 목줄", "상황을 압축한 대비 🔑"], ["I'm not kidding", "진짜예요", "서베이 공원 편 재활용 🔁 😆"], ["before I knew it", "어느새", "전개를 빠르게 넘기는 표현 ⏰"], ["search with me", "나와 함께 찾다", "인물을 늘리는 동사 🧩"], ["completely out of breath", "숨이 턱까지 찬", "절정 장면 묘사 🏃"], ["lose its mind (with joy)", "기뻐서 어쩔 줄 모르다", "감정을 과장하는 관용구 🔥"], ["What made it special is ~", "특별했던 건 ~예요", "문제 요구에 직접 답하는 문형 ✅"], ["my favorite spot", "가장 좋아하는 자리", "장소로 닫는 마무리 🏠"]], "audio": "audio/3_롤플레이/3-018 6. 공원(Park)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-018 6. 공원(Park)_과거 경험.mp3"}, {"id": "3-019", "cat": "roleplay", "catName": "롤플레이 질문", "num": 7, "topic": "여가", "topicEn": "Free Time", "type": "정보 요청", "badge": "19 정보 요청", "enQ": "I'd like to give you a situation to act it out. You have come to a local community center to look for new activities to try in your free time. Speak with the staff and ask three or four questions to gather some ideas.", "enA": "Hi, excuse me — is this the right place to ask about your programs? I work weekdays, so I've been looking for something to do in my free time, and a friend told me you run classes here. Do you have a moment?\n\nFirst of all, what kinds of classes do you offer? ... Pottery, guitar, and cooking? That's a bigger list than I expected. And do any of them run in the evening? I can't get here before seven. ... Weekdays at seven thirty? That works perfectly.\n\nTwo more things. How much is it for one term? ... Fifty thousand won for eight weeks? That's cheaper than I thought. And is it okay for complete beginners? ... There's a trial class this Saturday? Sign me up — thank you so much!", "koQ": "여가 시간에 할 새로운 활동을 찾아 지역 커뮤니티 센터에 왔습니다. 직원과 이야기하며 아이디어를 얻기 위한 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 실례합니다. 프로그램 문의는 여기서 하면 될까요? 제가 평일에 일을 해서 여가 시간에 할 만한 걸 찾고 있었는데, 친구가 여기서 수업을 한다고 알려 줬거든요. 잠깐 시간 괜찮으실까요?\n\n우선, 어떤 종류의 수업들이 있나요? ... 도예랑 기타랑 요리까지요? 생각보다 종류가 많네요. 그리고 혹시 저녁에 하는 수업도 있나요? 제가 7시 전에는 못 오거든요. ... 평일 7시 30분이요? 딱 좋네요.\n\n두 가지만 더요. 한 학기에 수강료가 얼마인가요? ... 8주에 5만 원이요? 생각보다 저렴하네요. 그리고 완전 초보자도 괜찮을까요? ... 이번 주 토요일에 체험 수업이 있다고요? 저 신청할게요. 정말 감사합니다!", "struct": [["1️⃣ 인사", "현장 문의 + 방문 목적 설명"], ["2️⃣ 질문", "① 수업 종류 → 놀람 리액션"], ["3️⃣ 질문", "② 저녁 시간대 → 만족 리액션"], ["4️⃣ 질문", "③ 수강료 → 긍정 리액션"], ["5️⃣ 마무리", "④ 초보 가능? + 체험 신청"]], "scoring": [["현장 대면 톤", "전화가 아니라 센터에 직접 간 상황이에요. Hi, excuse me로 시작하면 채점자가 장면을 바로 그립니다 💬"], ["내 조건 깔기", "평일에 일한다, 7시 전엔 못 온다처럼 조건을 깔면 질문이 구체적이고 자연스러워져요 💪"], ["리액션은 짧게", "That's cheaper than I thought. 한 마디면 충분해요 ⏰ 리액션이 길어지면 정작 질문 개수를 못 채웁니다"], ["행동으로 마무리", "Sign me up!처럼 얻은 정보로 바로 행동을 결정하면 대화가 깔끔하게 닫혀요 ✅"]], "expr": [["Is this the right place to ~?", "여기서 ~하면 되나요?", "현장 문의 오프닝 💬"], ["in my free time", "여가 시간에", "돌발 여가 편 재활용 🔁"], ["Do you have a moment?", "잠깐 시간 괜찮으세요?", "정중한 오프닝 변형 😊"], ["What kinds of classes ~?", "어떤 수업들이 있나요?", "프로그램 문의 1번 질문 🎓"], ["a bigger list than I expected", "생각보다 종류가 많은", "가짓수에 놀라는 리액션 😆"], ["run in the evening", "저녁에 열리다", "시간대 확인 필수 표현 ⏰"], ["That works perfectly.", "딱 좋네요.", "조건이 맞을 때의 리액션 ✅"], ["one term", "한 학기", "수강 기간 단위 명사 🎓"], ["cheaper than I thought", "생각보다 저렴한", "가격에 쓰는 긍정 리액션 💳"], ["complete beginners", "완전 초보자", "수강 자격 확인 표현 📖"], ["Sign me up!", "저 신청할게요!", "행동으로 닫는 마무리 🔥"]], "audio": "audio/3_롤플레이/3-019 7. 여가(Free Time)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-019 7. 여가(Free Time)_정보 요청.mp3"}, {"id": "3-020", "cat": "roleplay", "catName": "롤플레이 질문", "num": 7, "topic": "여가", "topicEn": "Free Time", "type": "문제 해결", "badge": "20 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. The painting class you planned to take in your free time has been called off. Speak with the instructor, express how disappointed you are, and propose two or three other activities you could try instead.", "enA": "Hi, I just heard the painting class has been called off, and honestly, I'm really disappointed. I'd been looking forward to it for weeks — I even bought brushes and a sketchbook last Sunday. It was the one thing I had planned this month.\n\nSo I was wondering if there's anything else I could do instead. First, is the pottery class still running? It's also hands-on, so it would scratch the same itch for me.\n\nOr, if that one is full, could you put me on a waiting list for next term? I'd take it in a heartbeat. And if neither works, is there an open studio where I could practice on my own? Any of those would work — thanks!", "koQ": "여가 시간에 들으려던 그림 수업이 취소되었습니다. 강사에게 아쉬움을 표현하고, 대신 할 수 있는 활동 2~3가지를 제안해 보세요.", "koA": "안녕하세요, 그림 수업이 취소됐다고 방금 들었는데요. 솔직히 정말 아쉬워요. 몇 주 전부터 기다리고 있었거든요. 지난 일요일에 붓이랑 스케치북까지 샀어요. 이번 달에 계획해 둔 게 그거 하나였거든요.\n\n그래서 혹시 대신 할 수 있는 게 있을까 해서요. 우선, 도예 수업은 아직 열리나요? 그것도 직접 손으로 만드는 거라서 저한테는 비슷한 만족감이 있을 것 같아요.\n\n아니면 그 수업도 자리가 다 찼으면, 다음 학기 대기자 명단에 올려 주실 수 있을까요? 그러면 두말없이 바로 신청할게요. 둘 다 어려우면, 혼자 연습할 수 있는 개방 작업실 같은 건 없을까요? 어느 쪽이든 괜찮습니다. 감사합니다.", "struct": [["1️⃣ 소식", "취소 확인 + 아쉬움 표현"], ["2️⃣ 근거", "붓·스케치북 구입 · 한 달 계획"], ["3️⃣ 제안", "① 도예 수업으로 대체"], ["4️⃣ 제안", "② 다음 학기 대기자 등록"], ["5️⃣ 마무리", "③ 개방 작업실 + 감사 인사"]], "scoring": [["아쉬움 표현", "문제가 express how disappointed you are를 직접 요구해요. I'm really disappointed를 반드시 넣으세요 ✅"], ["아쉬움에 근거", "붓과 스케치북까지 샀다는 한 줄이 아쉬움을 말이 아니라 사실로 보여 줘요 📏"], ["대안의 공통점", "도예도 손으로 만드는 활동이라 같은 만족을 준다처럼 왜 그 대안인지를 붙이면 설득력이 생겨요 🧩"], ["미래 예약", "대기자 명단은 지금이 아니라 다음을 위한 대안이에요 ⏰ 시간축이 다른 제안을 섞으면 답변이 입체적으로 들려요"]], "expr": [["call off", "취소하다", "cancel의 구어체 구동사 🔑"], ["I'm really disappointed", "정말 아쉬워요", "문제 요구에 직접 답하는 문장 ✅"], ["look forward to ~", "~을 기대하다", "아쉬움의 근거를 만드는 표현 💕"], ["the one thing I had planned", "유일하게 계획한 것", "아쉬움을 극대화하는 표현 😆"], ["So I was wondering ~", "그래서 혹시 말인데요", "대안 제안 앞 완충 장치 🔁 😊"], ["hands-on", "직접 손으로 하는", "활동 성격을 묘사하는 형용사 🧩"], ["scratch the same itch", "비슷한 만족을 주다", "대안의 공통점 설명 관용구 ✨"], ["a waiting list", "대기자 명단", "예약형 대안 필수 명사 ⏰"], ["in a heartbeat", "두말없이 바로", "강한 의사를 담은 관용구 🔥"], ["an open studio", "개방 작업실", "최후의 대안 명사 🎓"], ["Any of those would work", "어느 쪽이든 괜찮아요", "선택권을 넘기는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-020 7. 여가(Free Time)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-020 7. 여가(Free Time)_문제 해결.mp3"}, {"id": "3-021", "cat": "roleplay", "catName": "롤플레이 질문", "num": 7, "topic": "여가", "topicEn": "Free Time", "type": "과거 경험", "badge": "21 과거 경험", "enQ": "That's the end of the situation. Have you ever taken up something that looked fun in your free time, only to find it was different from what you imagined? What was it, and how did you feel about it?", "enA": "Oh, this reminds me of the guitar I bought three years ago. I'd seen so many people playing beautifully online, and I thought, how hard can it be? So I bought one on a whim and signed up for a beginner class.\n\nReality hit fast. The first month was nothing but sore fingertips and one chord I just couldn't get — the F chord. I'm not exaggerating: I practiced it for three weeks and it still sounded like a dying cat.\n\nTo be honest, I felt a little defeated. The guitar ended up as furniture in the corner of my room. But looking back, it wasn't a total waste — ever since then, I listen to music differently. I hear the guitar lines in my favorite songs now. Not the hobby I expected, but not nothing either.", "koQ": "여가 시간에 재미있어 보이는 것을 시작했는데 기대와 달랐던 적이 있나요? 그것은 무엇이었고, 그 경험에 대해 어떻게 느꼈나요?", "koA": "아, 3년 전에 샀던 기타가 생각나네요. 인터넷에서 멋지게 연주하는 사람들을 하도 많이 봐서, 이게 얼마나 어렵겠어 싶었거든요. 그래서 충동적으로 한 대 사고 초보자 수업까지 등록했어요.\n\n현실은 금방 찾아왔어요. 첫 달은 손끝이 아픈 것과 도저히 안 잡히는 코드 하나가 전부였어요. 바로 F 코드요. 과장이 아니라, 3주를 연습했는데도 소리가 여전히 고양이 울음 같았어요.\n\n솔직히 좀 좌절했어요. 결국 기타는 방 구석의 가구가 되어 버렸죠. 그런데 돌아보면 완전히 헛된 건 아니었어요. 그때 이후로 음악을 듣는 귀가 달라졌거든요. 이제는 좋아하는 노래에서 기타 소리가 들려요. 기대했던 취미는 아니었지만, 아무것도 아니었던 것도 아니에요.", "struct": [["1️⃣ 도입", "3년 전 충동적 기타 구매"], ["2️⃣ 기대", "얼마나 어렵겠어 (착각)"], ["3️⃣ 현실", "아픈 손끝 · 안 잡히는 F코드"], ["4️⃣ 감정", "좌절 → 방 구석 가구 신세"], ["5️⃣ 마무리", "그래도 남은 것 (듣는 귀)"]], "scoring": [["기대 vs 현실", "How hard can it be? → Reality hit fast. 두 문장을 마주 놓는 것만으로 문제가 요구한 기대와 달랐다가 완성돼요 ✅"], ["감정 답하기", "문제가 how did you feel about it을 물어요. defeated처럼 감정 단어를 반드시 하나 박아 주세요 😆"], ["유머 한 스푼", "고양이 울음 같은 소리 같은 과장 비유 하나면 실패담이 훨씬 듣기 좋아져요 🎭 앞 편들에서 계속 쓰는 기법이에요 🔁"], ["소득으로 닫기", "실패로 끝내지 말고 그래도 남은 것을 붙이면 답변이 성숙하게 마무리돼요 📊 서베이 음악감상 편과도 이어집니다 🔁"]], "expr": [["How hard can it be?", "얼마나 어렵겠어?", "만만하게 본 심리를 압축 😆"], ["on a whim", "충동적으로", "서베이 요리·여행 편 재활용 🔁"], ["Reality hit fast.", "현실은 금방 왔죠.", "기대 → 현실 전환 신호 🔑"], ["sore fingertips", "아픈 손끝", "고생을 구체화하는 명사 📏"], ["I just couldn't get ~", "도저히 ~이 안 됐다", "실패를 담담하게 표현 💪"], ["I'm not exaggerating", "과장이 아니라", "I'm not kidding의 짝꿍 🔁"], ["sound like a dying cat", "소리가 엉망이다", "과장으로 웃음 주는 비유 🎭"], ["defeated", "좌절한", "감정 질문의 정답 단어 😆"], ["end up as ~", "결국 ~이 되어 버리다", "결말을 요약하는 구동사 ✨"], ["looking back", "돌아보면", "회고 시점으로 전환 📖"], ["ever since then", "그때 이후로 쭉", "현재로 잇는 마무리 📊"]], "audio": "audio/3_롤플레이/3-021 7. 여가(Free Time)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-021 7. 여가(Free Time)_과거 경험.mp3"}, {"id": "3-022", "cat": "roleplay", "catName": "롤플레이 질문", "num": 8, "topic": "헬스장", "topicEn": "Gym", "type": "정보 요청", "badge": "22 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are considering signing up at a gym. Call the gym, describe what you are looking for, and ask three or four questions about membership plans, facilities, or classes before deciding to join.", "enA": "Hi, is this the gym near the subway station? I'm calling to ask about joining. I jog outside most evenings, but it's getting too cold, so I need somewhere to train through the winter. Can I ask a few questions?\n\nFirst, what membership plans do you have? ... Three months, six, and a year? Is there a monthly option as well? ... There is? Good. I'd rather start short and see how it goes.\n\nSecond, what's in the facility? I mainly need treadmills and a shower room. ... Twenty treadmills and a sauna? Nice. And one last thing — do you run group classes in the evening? I want a schedule so I actually show up. ... Spinning at eight? That's perfect for me. Thanks for your help!", "koQ": "헬스장 등록을 고민 중입니다. 헬스장에 전화해 상황을 설명하고, 회원권·시설·수업에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 지하철역 근처 헬스장 맞나요? 등록 관련해서 여쭤보려고 전화드렸어요. 저녁마다 밖에서 조깅을 하는데, 날이 추워져서 겨울 동안 운동할 곳을 찾고 있거든요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 회원권은 어떤 종류가 있나요? ... 3개월, 6개월, 1년이요? 혹시 한 달짜리도 있나요? ... 있다고요? 다행이네요. 저는 짧게 시작해서 어떤지 보고 싶거든요.\n\n두 번째로, 시설은 어떻게 되나요? 러닝머신이랑 샤워실만 있으면 되거든요. ... 러닝머신 20대에 사우나까지요? 좋네요. 마지막으로 하나만, 저녁에 하는 그룹 수업도 있나요? 시간표가 있어야 제가 진짜로 나갈 것 같아서요. ... 8시에 스피닝이요? 저한테 딱이네요. 감사합니다!", "struct": [["1️⃣ 인사", "전화 목적 + 등록 고민 설명"], ["2️⃣ 질문", "① 회원권 → 한 달권 확인"], ["3️⃣ 질문", "② 시설 → 만족 리액션"], ["4️⃣ 질문", "③ 그룹 수업 → 시간 확인"], ["5️⃣ 마무리", "스피닝 확정 + 감사 인사"]], "scoring": [["문제 조건 확인", "회원권·시설·수업 세 가지를 물으라고 문제가 지정했어요 ✅ 지정 항목은 반드시 하나씩 짚고 넘어가세요"], ["내 상황 설명", "겨울이라 밖에서 못 뛴다는 한 줄이 질문 전체의 이유가 돼요 💪 돌발 건강 편 조깅 설정을 그대로 재활용했어요 🔁"], ["조건 붙이기", "시간표가 있어야 진짜 나갈 것 같아서요처럼 조건을 덧붙이면 질문이 사람 말이 돼요 😆"], ["되묻기 리액션", "상대 대답을 의문문으로 되받으면(Spinning at eight?) 알아들었다는 신호가 되고 문장 수도 늘어요 📊"]], "expr": [["Is this ~?", "혹시 ~ 맞나요?", "가게에 거는 전화 오프닝 🔁 💬"], ["I'm calling to ask about ~", "~관련해 전화했어요", "전화 목적을 밝히는 공식 🔁 🔑"], ["It's getting too cold", "날이 너무 추워져서", "등록 이유를 만드는 한 줄 ✨"], ["membership plans", "회원권 종류", "헬스장 문의 필수 명사 🔑"], ["a monthly option", "한 달 단위 옵션", "조건을 좁히는 후속 질문 ⏰"], ["start short", "짧게 시작하다", "신중한 태도를 보여 주는 표현 💪"], ["What's in the facility?", "시설은 어떤가요?", "시설 질문 기본형 📏"], ["treadmill", "러닝머신", "돌발 건강 편 재활용 🔁 🏃"], ["group classes", "그룹 수업", "수업 질문 필수 명사 🎓"], ["so I actually show up", "진짜로 나가게", "조건을 붙이는 구어체 😆"], ["That's perfect for me.", "저한테 딱이네요.", "만족 리액션 ✅"]], "audio": "audio/3_롤플레이/3-022 8. 헬스장(Gym)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-022 8. 헬스장(Gym)_정보 요청.mp3"}, {"id": "3-023", "cat": "roleplay", "catName": "롤플레이 질문", "num": 8, "topic": "헬스장", "topicEn": "Gym", "type": "문제 해결", "badge": "23 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You joined a gym, but after your first visit, it fell short of what you expected. Call the gym, describe what you are unhappy about, and propose two or three ways to cancel your membership or get a refund.", "enA": "Hello, I signed up last Friday and went for the first time yesterday. To be honest, it wasn't what I expected. The treadmill area was so crowded that I waited twenty minutes, two machines had out-of-order signs, and the shower room only had cold water.\n\nI understand that things break, but that's not what I paid for. So here's what I'd like to ask. First, could I cancel my membership and get a refund for the unused months? I used it once, so it should be straightforward.\n\nIf a full refund isn't possible, could you put my membership on hold until the machines and hot water are fixed? Or, I'd accept a transfer to your branch near my office. Let me know what you can do this week.", "koQ": "등록한 헬스장이 첫 방문에서 기대와 달랐습니다. 전화해 불만을 설명하고, 취소나 환불을 위한 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 제가 지난 금요일에 등록했는데 어제 처음 가 봤거든요. 솔직히 말씀드리면 기대했던 것과 달랐어요. 러닝머신 쪽이 너무 붐벼서 20분을 기다렸고, 기구 두 대에는 고장 안내문이 붙어 있었어요. 그리고 샤워실에는 찬물만 나왔고요.\n\n기계는 고장 날 수 있다는 걸 이해해요. 하지만 제가 돈을 낸 건 이런 게 아니잖아요. 그래서 이렇게 여쭤보고 싶어요. 우선, 회원권을 취소하고 쓰지 않은 개월 수만큼 환불받을 수 있을까요? 한 번밖에 이용하지 않았으니 간단할 것 같은데요.\n\n전액 환불이 어렵다면, 기구랑 온수가 고쳐질 때까지 회원권을 일시 정지해 주실 수 있을까요? 아니면 회사 근처에 있는 다른 지점으로 옮기는 것도 괜찮습니다. 가능한 방법을 알려 주세요. 이번 주 안에 정리하고 싶어요.", "struct": [["1️⃣ 확인", "등록일 + 첫 방문 사실"], ["2️⃣ 불만", "대기 20분 · 고장 기구 · 찬물"], ["3️⃣ 요구", "① 취소 + 미사용분 환불"], ["4️⃣ 대안", "② 회원권 일시 정지"], ["5️⃣ 마무리", "③ 다른 지점 이전 + 기한"]], "scoring": [["불만은 세 개", "붐빔·고장·찬물처럼 구체적인 불만 세 가지를 나열하면 요구의 근거가 탄탄해져요 📏 뭉뚱그리면 설득력이 없어요"], ["감정 대신 사실", "화내지 말고 20분, 두 대, 찬물 같은 사실을 대세요 💪 That's not what I paid for 한 문장이면 감정은 충분해요"], ["요구 → 차선책", "전액 환불 → 일시 정지 → 지점 이전. 상대가 받아들이기 쉬운 쪽으로 단계를 낮추면 협상이 됩니다 ✅"], ["기한 정하기", "이번 주 안에 정리하고 싶다고 기한을 못 박으면 요구가 흐지부지되지 않아요 ⏰"]], "expr": [["sign up", "(회원으로) 등록하다", "헬스장·수업 유형 필수 동사 🔑"], ["It wasn't what I expected", "기대와 달랐어요", "불만을 여는 완곡한 한 문장 💬"], ["an out-of-order sign", "고장 안내문", "불만을 구체화하는 명사 📏"], ["That's not what I paid for", "이러려고 낸 돈이 아님", "감정 대신 논리로 말하기 💪"], ["cancel my membership", "회원권을 취소하다", "문제 요구 핵심 표현 ✅"], ["a refund for ~", "~에 대한 환불", "롤플레이 환불 유형 필수 💳"], ["unused months", "쓰지 않은 개월 수", "환불 범위를 특정하는 표현 📏"], ["straightforward", "간단한", "요구를 부드럽게 만드는 형용사 ✨"], ["put ~ on hold", "~을 일시 정지하다", "차선책 제시 구동사 ⏰"], ["a transfer to ~", "~로의 이전", "세 번째 대안 명사 🔁"], ["Let me know what you can do", "가능한 방법 알려 주세요", "선택권을 넘기는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-023 8. 헬스장(Gym)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-023 8. 헬스장(Gym)_문제 해결.mp3"}, {"id": "3-024", "cat": "roleplay", "catName": "롤플레이 질문", "num": 8, "topic": "헬스장", "topicEn": "Gym", "type": "과거 경험", "badge": "24 과거 경험", "enQ": "That's the end of the situation. Have you ever run into problems after joining a gym? What issues came up, and how did you resolve them? Walk me through the entire experience from start to finish in detail.", "enA": "Oh, this reminds me of my very first gym membership, years ago. The staff talked me into a one-year plan because it was half the monthly price. I paid the whole year in installments. I felt so smart that day.\n\nFast forward two months — I showed up on a Monday evening and the door was locked, with a single printed notice taped to the glass. The gym had closed down overnight. No call, no email, nothing. I was furious, and honestly, a little embarrassed.\n\nSo the next morning I called my credit card company, explained everything, and they stopped the remaining installments. It took three weeks of phone calls, but I got most of my money back. Since then, I never sign up for anything longer than three months.", "koQ": "헬스장에 등록한 후 문제를 겪은 적이 있나요? 어떤 문제였고 어떻게 해결했는지 처음부터 끝까지 자세히 설명해 주세요.", "koA": "아, 제 첫 헬스장 회원권이 생각나네요. 몇 년 전인데, 직원분이 1년 회원권을 하라고 저를 설득했어요. 월 단위로 끊는 것의 절반 가격이라면서요. 그래서 1년 치를 카드 할부로 결제했죠. 그날은 제가 정말 똑똑하다고 느꼈어요.\n\n그런데 두 달 뒤, 어느 월요일 저녁에 갔더니 문이 잠겨 있고 유리문에 안내문 한 장이 붙어 있는 거예요. 헬스장이 하룻밤 사이에 문을 닫았더라고요. 전화도, 메일도, 아무 연락도 없었어요. 정말 화가 났고, 솔직히 좀 창피하기도 했어요.\n\n그래서 다음 날 아침에 카드사에 전화해서 상황을 다 설명했더니, 남은 할부금을 멈춰 줬어요. 전화를 3주 정도 붙잡고 있어야 했지만 결국 돈은 대부분 돌려받았어요. 그 후로는 3개월보다 긴 회원권은 절대 끊지 않아요.", "struct": [["1️⃣ 도입", "첫 헬스장 · 1년 회원권 결제"], ["2️⃣ 복선", "반값이라는 말에 할부 결제"], ["3️⃣ 사건", "두 달 뒤 하룻밤 사이 폐업"], ["4️⃣ 해결", "카드사 연락 → 할부 정지"], ["5️⃣ 마무리", "3개월 초과 회원권 금지 규칙"]], "scoring": [["처음부터 끝까지", "문제가 from start to finish를 요구해요. 결제 → 폐업 → 해결 → 규칙, 네 칸을 순서대로 채우면 됩니다 ✅"], ["복선 깔기", "반값이라는 말에 넘어갔다는 한 줄이 뒤에 올 사건을 예고해 줘요 🎭 음식 편에서도 쓴 기법이에요 🔁"], ["감정 두 겹", "furious와 embarrassed, 감정을 두 겹으로 쌓으면 훨씬 진짜 같아요 😆 화났다 하나로 끝내지 마세요"], ["시간과 결과", "3주가 걸렸다, 대부분 돌려받았다처럼 해결의 시간과 결과를 숫자로 말하면 이야기가 완결돼요 📊"]], "expr": [["talk me into ~", "~하도록 설득하다", "후회 서사를 여는 동사 😆"], ["a one-year plan", "1년 회원권", "장기 등록 필수 명사 🔑"], ["half the monthly price", "월 단위의 절반 가격", "복선을 까는 비교 표현 💳"], ["in installments", "할부로", "결제 방식 필수 표현 💳"], ["Fast forward two months", "두 달 뒤로 감으면", "시간 점프 고급 표현 ⏰"], ["a single printed notice", "안내문 한 장", "허탈함을 살리는 디테일 📏"], ["close down overnight", "하룻밤 새 폐업하다", "사건을 압축한 표현 🔥"], ["I was furious", "정말 화가 났어요", "강한 감정 표현 😆"], ["stop the installments", "할부를 중단하다", "해결 장면 핵심 동사 ✅"], ["get my money back", "돈을 돌려받다", "결과를 알리는 표현 💳"], ["never longer than ~", "절대 ~보다 길게는", "규칙으로 닫는 마무리 📊"]], "audio": "audio/3_롤플레이/3-024 8. 헬스장(Gym)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-024 8. 헬스장(Gym)_과거 경험.mp3"}, {"id": "3-025", "cat": "roleplay", "catName": "롤플레이 질문", "num": 9, "topic": "공연", "topicEn": "Performance", "type": "정보 요청", "badge": "25 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your friend would like to watch a performance with you. Call your friend and ask three or four questions about the show and your friend's plan.", "enA": "Hey, it's me! I got your text about seeing a show together — count me in. You know I'm always up for anything in the theater district. But before we lock in the date, can I ask you a few things?\n\nFirst things first, what exactly are we seeing — a play or a musical? ... Oh, that one? I've heard about it. Is it at that small theater in Daehakro? ... Good, I love the intimate vibe there. And when is it, a weekend matinee or an evening show?\n\nSecond, have you booked the tickets already, or should I? Those shows sell out fast. ... You did? You're the best. Just send me your account number. One last thing — are we grabbing a quick bite before, or eating after? ... After works for me. See you Saturday!", "koQ": "친구가 당신과 공연을 보러 가고 싶어 합니다. 친구에게 전화해 공연과 친구의 계획에 대해 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 같이 공연 보자는 문자 봤어. 나도 갈게. 나 대학로 쪽은 뭐든 좋아하는 거 알잖아. 근데 날짜 정하기 전에 몇 가지만 물어봐도 돼?\n\n우선 제일 중요한 것부터. 정확히 뭘 보는 거야, 연극이야 뮤지컬이야? ... 아, 그거? 나도 들어 봤어. 대학로에 있는 그 작은 극장에서 하는 거 맞지? ... 좋다, 나 거기 아늑한 분위기 진짜 좋아해. 그리고 언제야? 주말 낮 공연이야, 저녁 공연이야?\n\n두 번째로, 표는 벌써 예매한 거야, 아니면 내가 할까? 그런 공연은 금방 매진되잖아. ... 이미 했다고? 너 최고다. 계좌번호만 보내 줘. 마지막으로 하나만, 보기 전에 간단히 뭐 좀 먹을까 아니면 끝나고 먹을까? ... 끝나고가 나도 좋아. 토요일에 보자!", "struct": [["1️⃣ 인사", "초대 수락 + 질문 예고"], ["2️⃣ 질문", "① 어떤 공연인지 → 극장 확인"], ["3️⃣ 질문", "② 날짜와 시간대 확인"], ["4️⃣ 질문", "③ 예매 여부 → 정산 방법"], ["5️⃣ 마무리", "④ 식사 계획 + 약속 확정"]], "scoring": [["질문 네 칸", "문제가 질문 3~4개를 요구해요. 공연 종류·날짜·예매·식사 네 칸으로 미리 나눠 두면 개수를 세지 않아도 자연스럽게 채워집니다 ✅"], ["아는 척 리액션", "Oh, that one? 처럼 상대 대답을 받아 주면 통화가 진짜 대화처럼 들려요 💬 질문만 네 개 던지면 면접이 되니까, 대답마다 짧은 리액션을 한 번씩 얹어 주세요"], ["서베이 소재 회수", "대학로 소극장과 intimate vibe는 서베이 공연 편에서 그대로 가져왔어요 🔁 🎭 이미 외운 표현을 롤플레이에 다시 쓰면 준비 시간이 절반으로 줄어듭니다"], ["약속 확정 마무리", "See you Saturday! 처럼 날짜로 닫으면 롤플레이가 깔끔하게 끝나요 ⏰ 감사 인사만 하고 끊으면 상황이 해결됐는지 채점자가 알 수 없으니 결론을 꼭 말해 주세요"]], "expr": [["Count me in!", "나도 갈게!", "초대 수락 1순위, 공원 편 재활용 🔁 🔥"], ["the theater district", "공연 거리, 극장가", "서베이 공연 편 재활용 🔁 🎭"], ["Can I ask you a few things?", "몇 가지 물어봐도 돼?", "질문 시작을 알리는 신호의 변형 🔑"], ["first things first", "우선 중요한 것부터", "롤플레이 질문 오프너, 시리즈 개근 🔁"], ["Oh, that one?", "아, 그거?", "대답을 받아 주는 짧은 리액션 🔁 💬"], ["intimate vibe", "아늑하고 친밀한 분위기", "서베이 공연 편 재활용 🔁 ✨"], ["a weekend matinee", "주말 낮 공연", "공연 시간대 필수 어휘 ⏰"], ["book the tickets", "표를 예매하다", "공연·콘서트 롤플레이 핵심 동사 🎭"], ["sell out fast", "금방 매진되다", "서베이 공연 편 재활용 🔁 🔥"], ["One last thing", "마지막으로 하나만", "마지막 질문을 여는 장치 🔁 🔑"], ["grab a quick bite", "간단히 요기하다", "서베이 영화·공연 편 재활용 🔁 🍳"]], "audio": "audio/3_롤플레이/3-025 9. 공연(Performance)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-025 9. 공연(Performance)_정보 요청.mp3"}, {"id": "3-026", "cat": "roleplay", "catName": "롤플레이 질문", "num": 9, "topic": "공연", "topicEn": "Performance", "type": "문제 해결", "badge": "26 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You planned to see the performance with your friend today, but you are so sick that you cannot even get out of bed. Call your friend, describe your condition, and offer two or three ideas to handle the situation.", "enA": "Hey, it's me. I hate to do this to you, but I've got bad news about tonight. I came down with something yesterday, and this morning I couldn't even get out of bed. My head is pounding, and the fever hasn't broken. I'm so sorry — I know you've been looking forward to this.\n\nHere's what I'm thinking. First, please go anyway. My brother lives ten minutes from the theater, so you could take him — I'll transfer the ticket to your phone right now.\n\nIf you'd rather not, could you call the box office and ask to exchange them for next weekend? Small theaters are usually flexible. And either way, the tickets are on me this time, and dinner too, once I can stand up. Just let me know which one works.", "koQ": "오늘 친구와 공연을 보기로 했는데 침대에서 일어나지 못할 만큼 아픕니다. 친구에게 전화해 상태를 설명하고, 2~3가지 대안을 제시해 보세요.", "koA": "안녕, 나야. 이런 말 하기 정말 미안한데, 오늘 저녁 일로 안 좋은 소식이 있어. 어제부터 몸살이 나더니 오늘 아침엔 침대에서 일어나지도 못하겠더라고. 머리는 지끈거리고 열도 안 떨어졌어. 정말 미안해. 네가 이거 얼마나 기다렸는지 아는데.\n\n내 생각은 이래. 우선, 너는 그냥 가. 우리 동생이 극장에서 10분 거리에 살거든. 걔를 데려가면 되잖아. 내 표는 지금 바로 네 폰으로 넘겨 줄게.\n\n그게 별로면, 매표소에 전화해서 다음 주말 회차로 바꿔 달라고 해 볼래? 소극장은 보통 유연하게 해 주더라고. 그리고 어느 쪽이든 이번 표값은 내가 낼게. 내가 일어날 수 있게 되면 저녁도 내가 살고. 어느 쪽이 좋은지 알려만 줘.", "struct": [["1️⃣ 사과", "취소 통보 + 미안한 마음"], ["2️⃣ 상태", "몸살 · 두통 · 못 일어남"], ["3️⃣ 대안", "① 동생과 대신 관람"], ["4️⃣ 대안", "② 다음 주말로 날짜 변경"], ["5️⃣ 마무리", "③ 표값 부담 + 선택권 넘기기"]], "scoring": [["증상은 세 개", "몸살·두통·못 일어남처럼 증상을 세 개 나열하면 취소 사유가 납득돼요 📏 아프다는 말 한 마디로 끝내면 문장 수도 설득력도 모자랍니다"], ["미안함 한 줄", "You have been looking forward to this 한 문장이면 사과가 진심으로 들려요 💕 미안하다는 말을 세 번 반복하기보다 상대 입장을 한 번 짚어 주는 쪽이 훨씬 세요"], ["대안 두 갈래", "그대로 가기와 날짜 바꾸기. 성격이 다른 두 갈래를 주면 상대가 고르기 쉬워요 ✅ 비슷한 대안 세 개보다 방향이 다른 대안 두 개가 점수에 유리합니다"], ["보상으로 닫기", "표값과 저녁을 부담하겠다는 마무리가 문제해결 유형의 만점 포인트예요 💳 사과 → 대안 → 보상까지 가야 상황을 끝까지 책임진 답변이 됩니다"]], "expr": [["I hate to do this to you", "이런 말 하기 정말 미안해", "취소 통보 오프닝 최상급 💬"], ["come down with something", "몸살이 나다", "아프다를 자연스럽게 말하는 구동사 🔑"], ["can't get out of bed", "침대에서 못 일어나다", "문제 속 표현을 그대로 회수 ✅"], ["pounding (head)", "지끈거리는", "돌발 약속 편 재활용 🔁 🎭"], ["look forward to ~", "~을 기대하다", "여가 편 재활용, 미안함의 근거 🔁 💕"], ["Here's what I'm thinking", "내 생각은 이래", "대안 나열 직전의 신호탄 🔁 🔑"], ["transfer the ticket", "티켓을 양도하다", "공연·콘서트 롤플레이 핵심 동사 🎭"], ["exchange them for ~", "~로 교환하다", "날짜 변경 요청 필수 표현 ⏰"], ["either way", "어느 쪽이든", "두 대안을 묶는 연결어 🔁 ✅"], ["It's on me", "내가 낼게", "서베이 술집 편 on the house의 짝 🔁 💳"], ["Just let me know", "알려만 줘", "선택권을 넘기는 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-026 9. 공연(Performance)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-026 9. 공연(Performance)_문제 해결.mp3"}, {"id": "3-027", "cat": "roleplay", "catName": "롤플레이 질문", "num": 9, "topic": "공연", "topicEn": "Performance", "type": "과거 경험", "badge": "27 과거 경험", "enQ": "That's the end of the situation. Have you ever had to call off a plan or break a promise because you were sick or something urgent came up? When did it happen, and what did you do to sort out the problem?", "enA": "Oh, this reminds me of a night I still feel bad about. I had booked two tickets for a musical in Daehakro a month in advance, and my best friend and I had been counting down to it all month.\n\nThat evening I got home to change, and guess what — water was dripping from my ceiling. The washing machine upstairs had flooded, and half my living room floor was already soaked. Out of nowhere, I was standing there holding towels instead of a ticket.\n\nSo I called her from the middle of the mess, apologized, and sent her my ticket so she could take her sister. Then I called the building office, and a plumber was there within an hour. In the end it worked out fine — the theater let me swap my seat for the next weekend. Since then, I only buy tickets that can be transferred.", "koQ": "아프거나 급한 일이 생겨서 약속을 취소해야 했던 경험이 있나요? 언제 있었던 일이고, 문제를 해결하기 위해 무엇을 했는지 말해주세요.", "koA": "아, 지금도 미안한 마음이 남아 있는 저녁이 하나 생각나네요. 대학로 뮤지컬 표를 한 달 전에 두 장 예매해 뒀고, 절친이랑 저는 그날만 손꼽아 기다리고 있었어요.\n\n그날 저녁, 옷 갈아입으려고 집에 들어갔는데, 글쎄 천장에서 물이 뚝뚝 떨어지고 있는 거예요. 윗집 세탁기가 넘쳐서 거실 바닥 절반이 이미 흠뻑 젖어 있었고요. 난데없이 저는 티켓 대신 수건을 들고 서 있게 됐죠.\n\n그래서 그 난리통 속에서 친구에게 전화해 사과하고, 제 표를 보내 줘서 걔 동생이랑 가라고 했어요. 그다음 관리사무소에 전화했더니 한 시간 안에 설비 기사님이 오셨고요. 결국엔 잘 풀렸어요. 극장에서 다음 주말 회차로 자리를 바꿔 줬거든요. 그 후로 저는 양도가 되는 표만 예매해요.", "struct": [["1️⃣ 도입", "한 달 전 예매 · 손꼽아 기다림"], ["2️⃣ 사건", "귀가 직후 천장 누수 발견"], ["3️⃣ 절정", "거실 물바다 · 티켓 대신 수건"], ["4️⃣ 해결", "표 양도 + 관리사무소 연락"], ["5️⃣ 마무리", "양도 가능한 표만 예매하는 규칙"]], "scoring": [["언제인지 먼저", "When did it happen을 묻고 있어요. 한 달 전 예매라는 시점부터 깔고 시작하면 질문 요구를 첫 문장에서 해결합니다 ⏰"], ["아픔 말고 사건", "이 문제는 아픔과 급한 일 중 하나를 고르게 해요. 돌발 약속 편이 감기였으니 여기는 누수 사고로 짝을 맞췄어요 🔁 같은 소재를 두 번 쓰면 덱 전체가 밋밋해집니다"], ["장면 하나만", "수건을 들고 서 있는 장면 하나면 설명 열 문장보다 강해요 🎭 사건을 요약하지 말고 그때 내 손에 뭐가 들려 있었는지를 말하면 채점자 머릿속에 그림이 그려집니다"], ["절차로 답하기", "양도 → 관리사무소 → 날짜 변경. 해결을 절차로 말하면 what did you do에 정확히 답하게 돼요 ✅ 잘 해결됐다는 결론만 말하면 가장 중요한 질문을 놓칩니다"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["a month in advance", "한 달 전에 미리", "돌발 약속 편 in advance 재활용 🔁 ⏰"], ["count down to ~", "~을 손꼽아 기다리다", "기대감을 그리는 동사 💕"], ["guess what", "그런데 있잖아요", "반전 필러, 시리즈 개근 🔁 🎭"], ["drip from the ceiling", "천장에서 물이 새다", "누수 사고 묘사의 정답 표현 📏"], ["flood", "물이 넘치다", "사건 규모를 한 단어로 🔥"], ["soaked", "흠뻑 젖은", "wet의 상위 호환 형용사 ✨"], ["out of nowhere", "난데없이", "사건 발생 신호, 전 편 개근 🔁"], ["within an hour", "한 시간 안에", "해결 속도를 숫자로 보여 주기 📊"], ["it worked out fine", "잘 풀렸어요", "돌발 약속 편 재활용 🔁 ✅"], ["can be transferred", "양도가 되는", "교훈 마무리의 핵심 표현 🔑"]], "audio": "audio/3_롤플레이/3-027 9. 공연(Performance)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-027 9. 공연(Performance)_과거 경험.mp3"}, {"id": "3-028", "cat": "roleplay", "catName": "롤플레이 질문", "num": 10, "topic": "콘서트", "topicEn": "Concert", "type": "정보 요청", "badge": "28 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to purchase two concert tickets. Call the venue and ask three or four questions about how to buy the tickets.", "enA": "Hi, is this the box office at the dome in Olympic Park? I'm calling about the concert next month. I'd like to get two tickets, but I've never bought them through this venue before. Can I ask a few questions?\n\nFirst, how does it work? Online only, or can I buy them at the counter too? ... Online first, and whatever is left at the door? Good to know. And when do they go on sale? ... Eight p.m. sharp on Friday? I'll set an alarm.\n\nSecond, what are the seating options and the price range? ... Floor, first tier, and second tier? And is there a limit per person? ... Four? Then two is no problem. One last thing — do I get a mobile ticket, or do I pick them up at the venue? ... Mobile? That's perfect for me. Thanks for your help!", "koQ": "콘서트 티켓 2장을 사고 싶습니다. 공연장에 전화해 티켓 구매 방법에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 올림픽공원 돔 매표소 맞나요? 다음 달 콘서트 때문에 전화드렸어요. 티켓을 두 장 사고 싶은데, 이 공연장에서 예매해 본 적이 없어서요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 어떻게 진행되나요? 온라인으로만 파나요, 아니면 창구에서도 살 수 있나요? ... 온라인 먼저 열고, 남는 표를 현장에서 판다고요? 알아 둘게요. 그리고 판매는 언제 시작하나요? ... 금요일 저녁 8시 정각이요? 알람을 맞춰 놔야겠네요.\n\n두 번째로, 좌석 종류랑 가격대는 어떻게 되나요? ... 플로어석, 1층, 2층이요? 그리고 1인당 구매 한도가 있나요? ... 네 장이요? 그럼 두 장은 문제없겠네요. 마지막으로 하나만, 모바일 티켓으로 받나요, 아니면 공연장에서 수령하나요? ... 모바일이요? 저한테 딱이네요. 감사합니다!", "struct": [["1️⃣ 인사", "공연장 확인 + 두 장 구매 의사"], ["2️⃣ 질문", "① 구매 방법(온라인 · 현장)"], ["3️⃣ 질문", "② 판매 시작 시각 확인"], ["4️⃣ 질문", "③ 좌석·가격 → 1인 한도"], ["5️⃣ 마무리", "④ 수령 방법 + 감사 인사"]], "scoring": [["두 장 못 박기", "문제가 티켓 두 장을 지정했어요. 첫 단락에서 two tickets를 말해 두면 조건을 놓치지 않습니다 ✅"], ["질문 네 칸", "구매 방법 · 판매 시각 · 좌석 · 수령. 네 칸으로 나누면 3~4개 요구가 저절로 채워져요 📏 낯선 상황일수록 미리 짜 둔 칸이 있어야 말이 막히지 않습니다"], ["되묻기 리액션", "Eight p.m. sharp? 처럼 상대 답을 되받으면 알아들었다는 신호가 되고 문장 수도 늘어요 💬 전화 롤플레이는 상대 대사가 들리지 않으니 이 되묻기가 대화를 증명합니다"], ["티켓팅 정서", "알람을 맞추겠다는 한 줄이 서베이 콘서트 편 티켓팅 전쟁과 자연스럽게 이어져요 🔁 🎵 사실 확인만 하지 말고 내 사정을 한 스푼 얹으면 답변에 사람 냄새가 납니다"]], "expr": [["Is this ~?", "혹시 ~ 맞나요?", "가게에 거는 전화 오프닝 🔁 💬"], ["the box office", "매표소", "공연장 문의 필수 명사 🎭"], ["venue", "공연장", "서베이 콘서트 편 재활용 🔁 🎵"], ["Can I ask a few questions?", "몇 가지 여쭤봐도 될까요?", "질문 시작을 알리는 신호 🔁 🔑"], ["go on sale", "판매가 시작되다", "티켓 오픈 시점을 묻는 정답 동사 ⏰"], ["eight p.m. sharp", "저녁 8시 정각에", "정각을 강조하는 부사 sharp ✅"], ["set an alarm", "알람을 맞추다", "서베이 콘서트 편 티켓팅 전쟁 연결 🔁 ⏰"], ["seating options", "좌석 종류", "좌석 질문 기본 명사 📏"], ["the price range", "가격대", "롤플레이 음식 편 재활용 🔁 💳"], ["a limit per person", "1인 구매 한도", "티켓팅 문의 필수 어휘 🔑"], ["a mobile ticket", "모바일 티켓", "수령 방법 질문의 정답 명사 ✨"]], "audio": "audio/3_롤플레이/3-028 10. 콘서트(Concert)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-028 10. 콘서트(Concert)_정보 요청.mp3"}, {"id": "3-029", "cat": "roleplay", "catName": "롤플레이 질문", "num": 10, "topic": "콘서트", "topicEn": "Concert", "type": "문제 해결", "badge": "29 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You bought concert tickets and planned to attend with your friend, but right before the show, you became very sick. Call your friend, describe the situation, and offer two or three alternatives.", "enA": "Hey, it's me. Please don't hate me — I'm in bad shape. I've had chills and a fever since this afternoon, and the show starts in three hours. There's no way I can stand in a crowd tonight. And I'm the one holding both tickets, so let me sort this out.\n\nHere's what I can do. First, I'll send both tickets to your phone right now, and you take someone else — my brother would go in a heartbeat. You shouldn't lose the night because of me.\n\nIf you'd rather skip it, I'll call the venue and ask whether they take returns before six. Either way, grab a light stick or some merch for me, and we'll watch the fan clips together this weekend. Whichever works for you — just tell me before six.", "koQ": "콘서트 티켓을 사서 친구와 가기로 했는데, 공연 직전에 몸이 많이 아픕니다. 친구에게 전화해 상황을 설명하고 2~3가지 대안을 제시해 보세요.", "koA": "안녕, 나야. 나 미워하지 말아 줘. 상태가 말이 아니야. 오늘 오후부터 오한이 들고 열이 나는데, 공연은 세 시간 뒤 시작이잖아. 오늘 사람들 틈에 서 있는 건 도저히 못 하겠어. 게다가 티켓 두 장을 내가 다 갖고 있으니까, 이건 내가 정리할게.\n\n내가 할 수 있는 건 이래. 우선, 지금 바로 티켓 두 장을 네 폰으로 보낼게. 다른 사람이랑 가. 우리 동생은 두말없이 갈걸. 나 때문에 너까지 오늘 밤을 날릴 수는 없잖아.\n\n그냥 안 가는 게 낫다면, 내가 공연장에 전화해서 6시 전까지 취소를 받아 주는지 물어볼게. 어느 쪽이든 나 대신 응원봉이나 굿즈 하나만 사다 줘. 그리고 이번 주말에 팬들이 올린 영상 같이 보자. 편한 쪽으로 해. 6시 전에만 알려 줘.", "struct": [["1️⃣ 사과", "미안함 + 상태 예고"], ["2️⃣ 상태", "오한 · 열 + 공연 세 시간 전"], ["3️⃣ 대안", "① 티켓 두 장 전송 → 대체 동행"], ["4️⃣ 대안", "② 공연장에 취소 가능 여부 확인"], ["5️⃣ 마무리", "③ 굿즈 부탁 + 시간 못 박기"]], "scoring": [["시간 못 박기", "공연 세 시간 전, 여섯 시 전까지처럼 시간을 두 번 넣으면 급박함이 저절로 살아나요 ⏰ 문제해결 유형의 숨은 채점 포인트예요"], ["상황 먼저 정리", "티켓을 내가 다 갖고 있다는 사실을 먼저 밝혀야 뒤에 오는 대안이 설득력을 얻어요 💪 상황 설명 없이 대안부터 쏟아내면 채점자가 그림을 그리지 못합니다"], ["상대 손해 줄이기", "나 때문에 너까지 못 가게 할 수는 없다는 태도가 문제해결 유형의 만점 포인트예요 💕 내 사정만 늘어놓는 답변과 상대를 챙기는 답변은 길이가 같아도 인상이 달라요"], ["다음 약속 만들기", "굿즈 부탁과 주말 영상 시청이 관계를 이어 주는 마무리가 돼요 🎵 못 가서 미안하다로 끝내지 말고 다음에 함께할 일을 하나 심어 두면 답변이 열린 채로 끝납니다"]], "expr": [["Please don't hate me", "미워하지 말아 줘", "미안함을 담은 캐주얼 오프닝 😆"], ["in bad shape", "상태가 말이 아닌", "컨디션 난조를 말하는 관용구 🔑"], ["chills and a fever", "오한과 열", "증상 두 개를 묶는 정답 조합 📏"], ["There's no way ~", "도저히 ~할 수 없다", "불가능을 강조하는 구어체 💪"], ["Here's what I can do", "내가 할 수 있는 건", "롤플레이 카페 편 재활용 🔁 🔑"], ["send ~ to your phone", "~을 네 폰으로 보내다", "모바일 티켓 양도 필수 표현 ✨"], ["in a heartbeat", "두말없이 바로", "롤플레이 여가 편 재활용 🔁 🔥"], ["take returns", "취소를 받아 주다", "환불 가능 여부를 묻는 표현 💳"], ["a light stick / merch", "응원봉 / 굿즈", "서베이 콘서트 편 재활용 🔁 🎵"], ["either way", "어느 쪽이든", "두 대안을 묶는 연결어 🔁 ✅"], ["Whichever works for you", "편한 쪽으로", "롤플레이 문제해결 공통 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-029 10. 콘서트(Concert)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-029 10. 콘서트(Concert)_문제 해결.mp3"}, {"id": "3-030", "cat": "roleplay", "catName": "롤플레이 질문", "num": 10, "topic": "콘서트", "topicEn": "Concert", "type": "과거 경험", "badge": "30 과거 경험", "enQ": "That's the end of the situation. Have you ever bought tickets or made plans and then had to call them off at the last moment because something came up? What was the problem, and how did you sort it out? Tell me the story in detail.", "enA": "Oh, this reminds me of the concert I never got to see. I had finally won a fierce ticketing war — two floor seats for the show I'd waited a whole year for. I was on cloud nine for about two weeks.\n\nThen, ten days before, my company announced a two-day workshop — same weekend, out of town, and no way out of it. I just sat there staring at the tickets. Honestly, I almost cried.\n\nSo I posted them in a fan group at face value, no markup, and guess who messaged me first — my best friend. She went with her sister, sent me thirty videos from the floor, and screamed into the phone during the encore. In the end, I caught the next tour's opening show. Since then, I check my work calendar before the ticket opens, not after.", "koQ": "티켓을 사거나 약속을 잡았다가 무슨 일이 생겨 막판에 취소해야 했던 경험이 있나요? 문제가 무엇이었고 어떻게 해결했는지 자세히 말해주세요.", "koA": "아, 끝내 못 본 콘서트가 하나 생각나네요. 치열한 티켓팅 전쟁에서 드디어 이겨서, 일 년을 기다린 공연의 플로어석을 두 장이나 잡았거든요. 한 2주 동안은 하늘을 나는 기분이었어요.\n\n그런데 공연 열흘 전에 회사에서 1박 2일 워크숍을 공지했어요. 하필 같은 주말에, 지방에서, 빠질 방법도 없이요. 저는 그냥 앉아서 티켓만 들여다봤어요. 솔직히 울 뻔했어요.\n\n그래서 팬 커뮤니티에 정가로, 웃돈 하나 없이 양도 글을 올렸는데, 제일 먼저 연락한 사람이 누구였는지 아세요? 제 절친이었어요. 걔는 자기 동생이랑 가서 플로어에서 찍은 영상을 서른 개나 보내 줬고, 앙코르 때는 전화에 대고 소리를 질렀죠. 결국 저는 다음 투어 첫 공연을 잡았어요. 그 후로는 티켓 오픈 전에 회사 일정부터 확인해요. 끝난 뒤가 아니라요.", "struct": [["1️⃣ 도입", "티켓팅 전쟁 승리 · 플로어석"], ["2️⃣ 사건", "열흘 전 회사 워크숍 공지"], ["3️⃣ 감정", "빠질 수 없음 · 울 뻔함"], ["4️⃣ 해결", "정가 양도 → 절친이 구매"], ["5️⃣ 마무리", "다음 투어 + 일정 확인 규칙"]], "scoring": [["취소 이유 한 줄", "What was the problem을 묻고 있어요. 워크숍이라는 이유를 한 문장으로 못 박아야 이야기가 흔들리지 않습니다 ✅"], ["기대와 상실", "전쟁 승리 → 열흘 뒤 공지. 높이 올렸다가 떨어뜨려야 이야기가 살아요 📊 감정 곡선이 평평한 경험담은 아무리 길어도 기억에 남지 않습니다"], ["해결은 행동으로", "정가 양도라는 구체적 행동이 how did you sort it out에 대한 정확한 답이에요 💳 아쉬웠다는 감상만 말하면 질문의 절반을 비워 두는 셈입니다"], ["반전 한 스푼", "표를 사 간 사람이 절친이었다는 반전이 이야기를 기억에 남게 만들어요 🎭 과거경험 유형은 사실 나열보다 예상을 살짝 비트는 한 줄에서 점수가 갈립니다"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["win the ticketing war", "티켓팅 전쟁에서 이기다", "서베이 콘서트 편 재활용 🔁 🎵"], ["on cloud nine", "하늘을 나는 기분인", "최고조의 기분을 그리는 관용구 🔥"], ["no way out of it", "도저히 빠질 수 없는", "강제 상황을 압축한 표현 💪"], ["I almost cried", "울 뻔했어요", "감정 표현의 솔직한 최상급 😆"], ["at face value", "정가에", "양도 매너를 보여 주는 표현 💳"], ["guess who", "누구였는지 아세요?", "guess what의 사람 버전 🔁 🎭"], ["scream into the phone", "전화에 대고 소리 지르다", "서베이 콘서트 편 떼창 정서 연결 🔁 🎵"], ["the next tour's opening show", "다음 투어 첫 공연", "회복을 보여 주는 명사구 ✨"], ["In the end", "결국에는", "결말로 넘어가는 전환 시그널 ✅"], ["before, not after", "나중이 아니라 먼저", "대구로 닫는 교훈 마무리 📊"]], "audio": "audio/3_롤플레이/3-030 10. 콘서트(Concert)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-030 10. 콘서트(Concert)_과거 경험.mp3"}, {"id": "3-031", "cat": "roleplay", "catName": "롤플레이 질문", "num": 11, "topic": "영화", "topicEn": "Movies", "type": "정보 요청", "badge": "31 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to see a movie with your friend. Call the theater and ask three or four questions to get the information you need before buying tickets.", "enA": "Hi, is this the cinema next to the station? I'd like to catch a movie with a friend tonight, but I'd rather check a few things before I book. Do you have a minute?\n\nFirst, what's showing this evening after seven? ... The new mystery one? That's exactly what we wanted. And is it the subtitled version or dubbed? ... Subtitled? That works for us.\n\nSecond, are there two seats together left, ideally in the middle row? ... Only the front left? Then what about the nine o'clock show? ... Much better. And how much is a ticket on a weekday? ... Fourteen thousand each? Cheaper than I thought. One last thing — if we're running late, can we still get in after it starts? ... Ten minutes? Good to know. Thanks!", "koQ": "친구와 영화를 보고 싶습니다. 영화관에 전화해 티켓을 사기 전에 필요한 정보를 얻기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 옆에 있는 영화관 맞나요? 오늘 저녁에 친구랑 영화를 보려고 하는데, 예매하기 전에 몇 가지만 확인하고 싶어서요. 잠깐 시간 괜찮으세요?\n\n우선, 오늘 저녁 7시 이후에는 어떤 영화가 상영되나요? ... 새로 나온 미스터리 영화요? 저희가 보고 싶던 게 딱 그거예요. 그리고 그건 자막판인가요, 더빙판인가요? ... 자막이요? 저희한테 딱 좋네요.\n\n두 번째로, 붙어 있는 두 자리가 남아 있나요? 가운데 열이면 더 좋고요. ... 앞쪽 왼편만 남았다고요? 그러면 9시 회차는 어떤가요? ... 훨씬 낫네요. 그리고 평일에는 티켓이 얼마인가요? ... 한 장에 만 사천 원이요? 생각보다 저렴하네요. 마지막으로 하나만, 늦으면 시작한 뒤에도 입장할 수 있나요? ... 10분까지요? 알아 둘게요. 감사합니다!", "struct": [["1️⃣ 인사", "극장 확인 + 오늘 밤 관람 의사"], ["2️⃣ 질문", "① 상영작 → 자막 여부 확인"], ["3️⃣ 질문", "② 붙은 두 자리 → 회차 변경"], ["4️⃣ 질문", "③ 평일 저녁 티켓 가격"], ["5️⃣ 마무리", "④ 지각 시 입장 가능 여부 + 감사"]], "scoring": [["예매 전 질문", "문제가 티켓을 사기 전에 필요한 정보를 물으라고 했어요. 상영작·좌석·가격·입장 규정처럼 예매를 좌우하는 것만 골라 물으세요 ✅"], ["조건 좁히기", "가운데 붙은 두 자리처럼 조건을 붙여 물으면 질문 하나가 두 문장이 돼요 📏 앞자리뿐이라는 답에 다음 회차로 옮기는 흐름까지 만들면 대화가 길어집니다"], ["상영 정보 어휘", "showing · subtitled version · the nine o’clock show는 영화관 문의 3종 세트예요 🎬 서베이 영화 편에서 익힌 극장 어휘를 그대로 실전에 옮기면 됩니다"], ["실전형 질문", "늦으면 들어갈 수 있냐는 질문은 실제로 나올 법해서 점수가 잘 나와요 🔑 교과서 같은 질문 네 개보다 현실감 있는 질문 하나가 더 강하게 먹힙니다"]], "expr": [["catch a movie", "영화를 보다", "see보다 가벼운 구어체 동사 🎬"], ["Do you have a minute?", "잠깐 시간 괜찮으세요?", "롤플레이 휴대폰 편 재활용 🔁 💬"], ["What's showing this evening?", "오늘 저녁엔 뭘 상영하나요?", "영화관 문의 1번 질문 🎬"], ["the subtitled version", "자막판", "더빙과 대비되는 필수 어휘 📖"], ["That works for us.", "저희한테 딱 좋네요.", "조건이 맞을 때의 리액션 ✅"], ["two seats together", "붙어 있는 두 자리", "좌석 요청 필수 표현 📏"], ["in the middle row", "가운데 열에", "선호 좌석을 특정하는 표현 ✨"], ["the nine o'clock show", "9시 회차", "회차를 부르는 정답 명사 ⏰"], ["How much is a ticket?", "티켓은 얼마인가요?", "가격 질문 기본형 💳"], ["Cheaper than I thought.", "생각보다 저렴하네요.", "롤플레이 여가 편 재활용 🔁 😊"], ["Can we still get in?", "그래도 입장 되나요?", "지각을 대비한 실전형 질문 🔑"]], "audio": "audio/3_롤플레이/3-031 11. 영화(Movies)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-031 11. 영화(Movies)_정보 요청.mp3"}, {"id": "3-032", "cat": "roleplay", "catName": "롤플레이 질문", "num": 11, "topic": "영화", "topicEn": "Movies", "type": "문제 해결", "badge": "32 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You have just gotten to the theater and discovered that the tickets they sold you are the wrong ones. Go to the ticket booth, describe the situation, and offer two or three ways to fix the problem.", "enA": "Excuse me, I'm sorry to bother you, but there's a problem with our tickets. I bought two here about twenty minutes ago for the eight o'clock mystery film, but the ones you printed are for the animation in theater four. You can see it right here on the receipt.\n\nI don't want to argue about it — I just want to see the movie we paid for. Here's what I'd suggest. First, could you simply swap them for the right screening? It starts in fifteen minutes, so there should still be time.\n\nIf that one is sold out, could you move us to the ten o'clock show instead? We'd be fine with that. And if neither works, we'd like a full refund, plus a voucher for another day. Whichever you can do fastest — the lights are about to go down.", "koQ": "영화관에 도착했는데 잘못된 티켓을 판매했다는 것을 알았습니다. 매표소에 가서 상황을 설명하고, 문제를 해결할 2~3가지 방법을 제안해 보세요.", "koA": "실례합니다, 번거롭게 해서 죄송한데 저희 티켓에 문제가 있어요. 20분쯤 전에 여기서 8시 미스터리 영화로 두 장을 샀는데, 발권해 주신 건 4관 애니메이션 표예요. 여기 영수증에 그대로 나와 있고요.\n\n따지려는 게 아니에요. 저희가 돈을 낸 영화를 보고 싶을 뿐이에요. 이렇게 하면 어떨까요. 우선, 제대로 된 회차로 그냥 바꿔 주실 수 있을까요? 15분 뒤 시작이니까 아직 시간이 있을 것 같은데요.\n\n그 회차가 매진이라면, 10시 회차로 옮겨 주실 수 있나요? 저희는 그것도 괜찮아요. 둘 다 안 된다면 전액 환불을 받고, 가능하면 다른 날 쓸 수 있는 교환권도 하나 받고 싶어요. 가장 빠르게 되는 방법으로 해 주세요. 곧 불이 꺼질 것 같아서요.", "struct": [["1️⃣ 접근", "정중한 오프닝 + 문제 선언"], ["2️⃣ 사실", "구매 시각 · 영화 · 영수증"], ["3️⃣ 요구", "① 제 회차로 교환"], ["4️⃣ 대안", "② 10시 회차 ③ 환불 + 교환권"], ["5️⃣ 마무리", "가장 빠른 방법 + 시간 압박"]], "scoring": [["감정 대신 사실", "산 시각·영화 제목·영수증처럼 확인 가능한 사실부터 대면 목소리를 높이지 않아도 요구가 통합니다 📏 헬스장 편과 같은 전략이에요 🔁"], ["상대 탓 안 하기", "the ones you printed처럼 주어를 사람이 아니라 티켓에 두면 훨씬 덜 공격적으로 들려요 ✨ 현장 컴플레인 유형은 태도에서 점수가 갈립니다"], ["요구 → 차선책", "교환 → 다음 회차 → 환불과 교환권. 상대가 받아들이기 쉬운 쪽으로 단계를 낮추면 협상이 돼요 ✅ 세 대안의 난이도를 다르게 두는 게 핵심입니다"], ["시간으로 닫기", "곧 불이 꺼진다는 한 줄이 가장 빠른 방법을 달라는 요구에 힘을 실어 줘요 ⏰ 현장형 문제해결은 시간 압박을 마무리에 넣으면 완성됩니다"]], "expr": [["I'm sorry to bother you", "번거롭게 해 죄송해요", "롤플레이 카페 편 재활용 🔁 💬"], ["There's a problem with ~", "~에 문제가 있어요", "현장 컴플레인 오프닝 1순위 🔑"], ["the ones you printed", "발권해 주신 것", "상대 실수를 부드럽게 지목 ✨"], ["on the receipt", "영수증에", "근거를 제시하는 한 마디 📏"], ["I don't want to argue", "따지려는 게 아니에요", "감정 대신 목적을 앞세우는 문장 💪"], ["Here's what I'd suggest", "이렇게 하면 어떨까요", "대안 나열 직전의 신호탄 🔁 🔑"], ["swap A for B", "A를 B로 바꾸다", "exchange의 구어체 버전 🔁"], ["the right screening", "제대로 된 회차", "요구를 한 마디로 규정 🎬"], ["sold out", "매진된", "서베이 공연 편 sell out의 형용사형 🔁 🔥"], ["a voucher", "교환권, 쿠폰", "보상 요구를 한 단계 확장 💳"], ["Whichever you can do fastest", "가장 빠르게 되는 방법으로", "롤플레이 음식 편 재활용 🔁 ⏰"]], "audio": "audio/3_롤플레이/3-032 11. 영화(Movies)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-032 11. 영화(Movies)_문제 해결.mp3"}, {"id": "3-033", "cat": "roleplay", "catName": "롤플레이 질문", "num": 11, "topic": "영화", "topicEn": "Movies", "type": "과거 경험", "badge": "33 과거 경험", "enQ": "That's the end of the situation. Have you ever made a reservation or bought tickets, only to have something go wrong? What was the issue, when did it happen, and how did you resolve it?", "enA": "Oh, this reminds me of a movie night last winter. I had booked two tickets on the theater's app a week earlier, for a film my best friend had been dying to see.\n\nWe met at the Hongdae branch, bought popcorn, and walked up to the gate — and the staff member told us our tickets were for the Gangnam branch. I had tapped the wrong location in the app without noticing. My heart dropped. Gangnam was forty minutes away.\n\nBut she was great about it. She told me the app allows cancellation up to thirty minutes before the show, and we had four minutes left. I cancelled right there, and we bought two seats for the next screening at the counter. We missed the trailers, but we saw the film. Since then, I always screenshot the branch name after I book.", "koQ": "예약을 하거나 티켓을 샀는데 무언가 잘못된 적이 있나요? 문제가 무엇이었고, 언제 일어난 일이며, 어떻게 해결했는지 말해주세요.", "koA": "아, 지난겨울 영화 보러 갔던 날이 생각나네요. 일주일 전에 영화관 앱으로 표를 두 장 예매해 뒀었어요. 절친이 정말 보고 싶어 하던 영화였거든요.\n\n홍대점에서 만나서 팝콘을 사고 입구까지 걸어갔는데, 직원분이 저희 표는 강남점 거라고 하시는 거예요. 제가 앱에서 지점을 잘못 누른 걸 모르고 있었던 거죠. 심장이 철렁했어요. 강남은 40분 거리였거든요.\n\n그런데 그 직원분이 정말 친절하셨어요. 앱에서 상영 30분 전까지는 취소가 된다고 알려 주셨는데, 마침 4분이 남아 있었어요. 바로 그 자리에서 취소하고, 카운터에서 다음 회차 두 자리를 샀죠. 예고편은 놓쳤지만 영화는 봤어요. 그 후로는 예매하면 꼭 지점 이름을 캡처해 둬요.", "struct": [["1️⃣ 도입", "일주일 전 앱으로 예매"], ["2️⃣ 사건", "입구에서 지점이 다름을 확인"], ["3️⃣ 감정", "심장 철렁 · 40분 거리"], ["4️⃣ 해결", "30분 규정 → 4분 남기고 취소"], ["5️⃣ 마무리", "다음 회차 관람 + 캡처 습관"]], "scoring": [["세 질문 회수", "무엇이 문제였나, 언제였나, 어떻게 해결했나를 한꺼번에 물어요. 단락마다 하나씩 답하면 빠짐없이 채워집니다 ✅"], ["내 실수도 소재", "내가 앱에서 지점을 잘못 눌렀다는 고백이 이야기를 솔직하고 사람답게 만들어 줘요 😆 남 탓으로만 끝나는 경험담은 듣는 사람에게 밋밋하게 들립니다"], ["숫자로 긴장", "30분 규정과 4분 남았다는 숫자 두 개가 해결 장면의 긴장을 만들어요 📊 아슬아슬했다는 형용사 하나보다 숫자 두 개가 훨씬 세게 들립니다"], ["습관으로 닫기", "예매 후 지점명을 캡처한다는 마무리가 Since then 공식을 자연스럽게 완성해요 📸 교훈은 다짐이 아니라 지금도 하고 있는 행동으로 말하세요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["be dying to see ~", "~을 몹시 보고 싶어 하다", "기대감을 강하게 그리는 표현 🔥"], ["walk up to the gate", "입구까지 걸어가다", "장면을 진행시키는 동사 💪"], ["tap the wrong location", "지점을 잘못 누르다", "요즘 예매 실수의 필수 동사 ✨"], ["without noticing", "모르는 사이에", "실수를 자연스럽게 설명하는 부사구 🧩"], ["My heart dropped.", "심장이 철렁했어요.", "롤플레이 휴대폰 편 재활용 🔁 😆"], ["allow cancellation up to ~", "~까지 취소가 되다", "예매 규정 설명 필수 구문 ⏰"], ["with four minutes left", "4분 남기고", "아슬아슬함을 숫자로 📊"], ["the next screening", "다음 회차", "해결 장면의 핵심 명사 🎬"], ["miss the trailers", "예고편을 놓치다", "서베이 영화 편 재활용 🔁 🎬"], ["screenshot ~", "~을 캡처해 두다", "습관 마무리의 행동 동사 📸"]], "audio": "audio/3_롤플레이/3-033 11. 영화(Movies)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-033 11. 영화(Movies)_과거 경험.mp3"}, {"id": "3-034", "cat": "roleplay", "catName": "롤플레이 질문", "num": 12, "topic": "음악", "topicEn": "Music", "type": "정보 요청", "badge": "34 정보 요청", "enQ": "I'd like to give you a situation to act it out. You would like to get new headphones for listening to music, but you cannot decide which type to buy. Call an electronics store and ask three or four questions about the different headphones they carry.", "enA": "Hi, is this the electronics store in the mall by the station? I'm calling to ask about headphones. I listen to music during my commute and while I work, but I honestly can't decide which type to go for.\n\nFirst, what do you carry — over-ear or in-ear? ... Both? Then which one do people usually pick for a crowded subway? ... Over-ear with noise cancelling? That makes sense.\n\nSecond, how long does the battery last on those? ... Thirty hours? That's more than enough for me. And what's the price range? ... Under two hundred thousand won for the basic model? That's not bad at all. One last thing — can I try them on in the store first? ... I can? Great, I'll stop by this weekend. Thank you!", "koQ": "음악 감상용 새 헤드폰을 사고 싶은데 어떤 종류를 골라야 할지 모르겠습니다. 전자제품 매장에 전화해 여러 헤드폰에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 옆 쇼핑몰에 있는 전자제품 매장 맞나요? 헤드폰 관련해서 전화드렸어요. 출퇴근길이랑 일할 때 음악을 듣는데, 솔직히 어떤 종류를 골라야 할지 모르겠더라고요.\n\n우선, 어떤 걸 취급하시나요? 오버이어인가요, 인이어인가요? ... 둘 다요? 그럼 사람 많은 지하철에서는 보통 어떤 걸 많이 고르나요? ... 노이즈 캔슬링 되는 오버이어요? 그럴 만하네요.\n\n두 번째로, 그건 배터리가 얼마나 가나요? ... 30시간이요? 저한테는 차고 넘치네요. 그리고 가격대는 어떻게 되나요? ... 기본형이 20만 원 아래요? 그 정도면 괜찮네요. 마지막으로 하나만, 매장에서 먼저 써 볼 수 있나요? ... 된다고요? 좋아요, 이번 주말에 들를게요. 감사합니다!", "struct": [["1️⃣ 인사", "매장 확인 + 사용 상황 설명"], ["2️⃣ 질문", "① 종류 → 지하철용 추천"], ["3️⃣ 질문", "② 배터리 지속 시간"], ["4️⃣ 질문", "③ 가격대 확인"], ["5️⃣ 마무리", "④ 매장 청음 가능 여부 + 방문 예고"]], "scoring": [["못 고르는 이유", "어떤 종류를 살지 모르겠다는 문제 설정을 첫 단락에 그대로 심어 두면 뒤따르는 질문이 전부 자연스러워집니다 🤔"], ["사용 상황 먼저", "출퇴근길과 업무 중이라는 사용 상황을 깔아 두면 직원이 추천해 줄 근거가 생겨요 🎵 조건 없이 던지는 질문은 돌아오는 답도 두루뭉술해집니다"], ["추천 유도하기", "사람들이 뭘 고르냐고 물으면 상대가 길게 답하고 나는 리액션만 하면 돼요 💬 정보요청 유형에서 말 분량을 버는 가장 쉬운 기술입니다"], ["시리즈 어휘 회수", "price range와 That’s not bad at all은 롤플레이 음식·휴대폰 편에서 이미 쓴 표현이에요 🔁 💳 한 번 외운 문장은 주제만 바꿔 계속 재활용하세요"]], "expr": [["I'm calling to ask about ~", "~관련해 전화했어요", "전화 목적을 밝히는 공식 🔁 🔑"], ["during my commute", "출퇴근길에", "서베이 음악감상 편 재활용 🔁 🎵"], ["which type to go for", "어떤 종류를 고를지", "고민을 그대로 드러내는 구문 🤔"], ["over-ear / in-ear", "오버이어 / 인이어", "헤드폰 문의 필수 어휘 ✨"], ["noise cancelling", "노이즈 캔슬링", "지하철 사용 조건의 정답 명사 🔑"], ["That makes sense.", "그럴 만하네요.", "설명을 납득하는 리액션 💬"], ["How long does it last?", "얼마나 가나요?", "배터리 질문 기본형 🔋"], ["more than enough", "차고 넘치는", "만족을 표현하는 짧은 리액션 ✅"], ["What's the price range?", "가격대가 어떻게 되나요?", "롤플레이 음식·콘서트 편 재활용 🔁 💳"], ["That's not bad at all.", "그 정도면 괜찮네요.", "롤플레이 휴대폰 편 재활용 🔁 😊"], ["try them on in the store", "매장에서 착용해 보다", "구매 전 확인 질문 📏"]], "audio": "audio/3_롤플레이/3-034 12. 음악(Music)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-034 12. 음악(Music)_정보 요청.mp3"}, {"id": "3-035", "cat": "roleplay", "catName": "롤플레이 질문", "num": 12, "topic": "음악", "topicEn": "Music", "type": "문제 해결", "badge": "35 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. While you are listening to music at home, your speakers suddenly go dead, and friends are coming over shortly to enjoy music with you. Call an electronics store, describe the situation, and ask about two o
