tely different story", "완전히 다른 이야기다", "전환 시그널, 서베이 공통 🔁 🎭"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 서베이 공통 🔁 📊"], ["way more powerful", "훨씬 더 강력한", "way = much의 구어체, 서베이 개근 🔁 💪"], ["irreplaceable", "대체 불가능한", "그리움 마무리의 최상급 단어 💕"]], "audio": "audio/2_돌발/2-025 5. 휴대폰(Cell Phone)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-025 5. 휴대폰(Cell Phone)_비교.mp3"}, {"id": "2-026", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "묘사", "badge": "26 묘사", "enQ": "Which website do you visit the most? What does the site offer, and what can people do there? Describe your favorite website in detail.", "enA": "The website I visit the most? YouTube, hands down — I'm there every single day. Simply put, it offers videos on literally everything: music, cooking, travel, news, you name it.\n\nWhat can people do there? Watch, of course, but also leave comments, build playlists, and follow their favorite creators. And the famous algorithm keeps recommending things you might like — honestly, it knows me too well. One cooking video, and my whole feed turns into a kitchen!\n\nFor me, YouTube is basically my TV, my radio, and my cooking teacher all in one. I watch IU's concert clips, follow recipe channels — that's how I learned my kimchi fried rice! — and end the day with calm vlogs. So yeah, that's pretty much my favorite corner of the internet.", "koQ": "가장 자주 방문하는 웹사이트는 무엇인가요? 그 사이트는 무엇을 제공하고, 사람들은 그곳에서 무엇을 할 수 있나요? 가장 좋아하는 웹사이트를 자세히 설명해주세요.", "koA": "제가 가장 자주 방문하는 웹사이트요? 두말할 것 없이 유튜브예요. 매일같이 들어가 있거든요. 간단히 말해, 유튜브는 말 그대로 모든 것에 대한 영상을 제공해요. 음악, 요리, 여행, 뉴스, 뭐든지요.\n\n사람들이 거기서 뭘 할 수 있냐고요? 당연히 시청이죠. 그런데 댓글도 남기고, 재생목록도 만들고, 좋아하는 크리에이터를 구독할 수도 있어요. 그리고 그 유명한 알고리즘이 취향에 맞을 만한 걸 계속 추천해 주죠. 솔직히 저를 너무 잘 알아요. 요리 영상 하나 봤더니 피드 전체가 주방이 됐다니까요!\n\n저한테 유튜브는 TV이자 라디오이자 요리 선생님이에요. 아이유 콘서트 영상을 보고, 레시피 채널을 챙겨 보고 (제 김치볶음밥도 그렇게 배웠어요!) 잔잔한 브이로그로 하루를 마무리하죠. 네, 인터넷에서 제가 가장 좋아하는 구석은 대체로 이래요.", "struct": [["1️⃣ 선언", "유튜브, hands down · 매일 접속"], ["2️⃣ 제공", "모든 것에 대한 영상"], ["3️⃣ 활동", "시청 · 댓글 · 재생목록 · 구독"], ["4️⃣ 특징", "알고리즘 추천 (나를 잘 앎)"], ["5️⃣ 마무리", "TV+라디오+요리 선생님"]], "scoring": [["선언 먼저", "어떤 사이트냐는 질문엔 첫 문장에서 바로 답을 선언하세요 🔑 hands down 확신까지 붙이면 진짜 최애처럼 들려요"], ["질문 두 축 커버", "무엇을 제공하나(모든 영상) → 무엇을 할 수 있나(시청 · 댓글 · 구독) 순서로 답하면 개요 완성이에요 ✅ 질문 속 의문사에 하나씩 답하는 구조라 빠뜨릴 게 없어요"], ["알고리즘 유머", "요리 영상 하나 봤다가 피드가 주방이 됐다는 한 줄이 이 답변의 미소 포인트예요 😆 알고리즘은 전 세계가 공감하는 소재라 웃음이 보장되죠"], ["시리즈 총집합", "아이유 영상, 레시피 채널, 브이로그 — 서베이 페르소나가 유튜브 안에 다 모여요 🔁 🎓 취향 총집합 페이지니 시리즈 복습이라 생각하면 돼요"]], "expr": [["hands down", "두말할 것 없이", "서베이 개근 최상급 표현 🔁 ✅"], ["every single day", "매일같이", "every day의 강조 버전 ⏰"], ["simply put", "간단히 말해", "설명 시작 전환 시그널 🔑"], ["videos on literally everything", "말 그대로 모든 것의 영상", "은행 편 literally 재활용 🔁 🔥"], ["you name it", "뭐든지요", "나열 마무리 만능 구어체 ✨"], ["creator", "크리에이터", "요즘 인터넷 문화 필수 어휘 🎬"], ["algorithm", "알고리즘", "유튜브 묘사의 핵심 소재 💬"], ["it knows me too well", "나를 너무 잘 안다", "알고리즘 유머의 정석 표현 😆"], ["my TV, my radio, and my cooking teacher", "TV이자 라디오이자 요리 선생님", "3연속 비유 정리 기술 💪"], ["recipe channel", "레시피 채널", "서베이 요리 편 유튜브 스승 재활용 🔁 🍳"], ["that's pretty much ~", "대체로 ~이다", "묘사 마무리 시그널, 시리즈 공통 🔁 ✅"]], "audio": "audio/2_돌발/2-026 6. 인터넷(Internet)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-026 6. 인터넷(Internet)_묘사.mp3"}, {"id": "2-027", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "습관", "badge": "27 습관", "enQ": "What devices do you usually use to surf the internet? When and where do you usually go online? Tell me about your internet habits in detail.", "enA": "My internet setup is simple, so let me walk you through it. Nine times out of ten, I go online with my smartphone — it's glued to my hand anyway. For bigger things, like booking hotels or watching something long, I switch to my laptop for the big screen.\n\nAs for when and where: I'm online in little pieces all day — news during my commute, quick searches at lunch, music streaming on my evening jog. But my main session is at night, on my gray sofa, laptop open, tea in hand.\n\nAnd I have one golden rule, same as my phone rule: after eleven, screens off, no exceptions — otherwise I'd scroll until sunrise! So yeah, that's pretty much my internet routine: phone for the small stuff, laptop for the big stuff, and a firm bedtime for both.", "koQ": "인터넷을 할 때 주로 어떤 기기를 사용하나요? 보통 언제 어디서 인터넷에 접속하나요? 당신의 인터넷 사용 습관을 자세히 말해주세요.", "koA": "제 인터넷 사용은 단순해요. 차근차근 설명해 드릴게요. 열에 아홉은 스마트폰으로 접속해요. 어차피 손에 딱 붙어 있으니까요. 호텔 예약이나 긴 영상 시청처럼 큰일을 할 때는 큰 화면을 위해 노트북으로 갈아타요.\n\n언제 어디서 하냐면, 저는 하루 종일 조각조각 온라인이에요. 출퇴근길엔 뉴스, 점심엔 빠른 검색, 저녁 조깅 때는 음악 스트리밍이요. 하지만 메인 세션은 밤이에요. 회색 소파에서 노트북을 펴고, 차 한 잔 들고요.\n\n그리고 폰 규칙과 똑같은 황금률이 하나 있어요. 11시 이후엔 화면 끄기, 예외 없음이요. 안 그러면 해 뜰 때까지 스크롤할 테니까요! 네, 제 인터넷 루틴은 대체로 이래요. 작은 일은 폰, 큰일은 노트북, 그리고 둘 다 확실한 취침 시간이 있어요.", "struct": [["1️⃣ 기기", "폰 90% + 큰일은 노트북"], ["2️⃣ 낮", "출퇴근 뉴스 · 점심 검색"], ["3️⃣ 저녁", "조깅 스트리밍 (음악 편)"], ["4️⃣ 밤", "소파 + 노트북 메인 세션"], ["5️⃣ 마무리", "11시 화면 오프 룰"]], "scoring": [["기기 → 시간 순서", "질문의 두 축(기기 / 언제 · 어디)을 그대로 답변 순서로 쓰면 구조가 저절로 잡혀요 ✅ 질문이 곧 목차예요"], ["숫자 빈도", "nine times out of ten처럼 빈도를 숫자로 말하면 usually보다 한 수 위로 들려요 📏 숫자 빈도 표현은 습관 답변의 어휘력 보너스 포인트예요"], ["장면 대비", "낮에는 조각조각 vs 밤에는 메인 세션 — 대비 구조 하나가 흩어진 습관을 깔끔하게 정리해 줘요 🔑 시간 대비는 습관 답변의 만능 틀이에요"], ["휴대폰 편 콤보", "glued to my hand, 11시 룰, 회색 소파 — 휴대폰 습관 편과 한 세트로 연결되는 페이지예요 🔁 🎓 기기 주제들은 서로가 서로의 복습이 되죠"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 오프닝, 서베이 개근 🔁 🔑"], ["nine times out of ten", "열에 아홉은", "usually의 숫자 버전! 빈도 표현 UP 📏"], ["glued to my hand", "손에 딱 붙어 있는", "휴대폰 습관 편 재활용 🔁 😆"], ["switch to ~", "~로 갈아타다", "기기 전환을 그리는 동사 ✅"], ["for the big screen", "큰 화면을 위해", "노트북 선택의 이유 한 구 🎬"], ["in little pieces all day", "하루 종일 조각조각", "스마트폰 시대 사용 패턴 묘사 ✨"], ["main session", "메인 세션", "루틴에 이름 붙이기 기술 🔁 🔥"], ["golden rule", "황금률, 나만의 원칙", "서베이 습관 편 공통 뼈대 🔁 💪"], ["no exceptions", "예외 없음", "규칙의 단호함을 두 단어로 ⏰"], ["scroll until sunrise", "해 뜰 때까지 스크롤하다", "휴대폰 습관 편 재활용 🔁 😆"], ["that's pretty much ~", "대체로 ~이다", "습관 마무리 시그널, 시리즈 공통 🔁 ✅"]], "audio": "audio/2_돌발/2-027 6. 인터넷(Internet)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-027 6. 인터넷(Internet)_습관.mp3"}, {"id": "2-028", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "취향", "badge": "28 취향", "enQ": "What do you most enjoy doing on the internet - watching videos, shopping, or reading news? Why do you enjoy that activity? Tell me the reasons.", "enA": "Between videos, shopping, and news? If I had to choose, watching videos wins, no contest. For me, it's all about switching my brain off: after a long day, videos ask nothing of me — I just press play and relax.\n\nI'd pick videos over the other two any day. News is useful, but honestly, it's homework for my brain. And shopping? Don't get me wrong — I love hunting for deals, but that's a mission, not relaxation. My wallet also prefers me watching videos!\n\nNothing beats lying on my sofa while a travel vlog takes me to Italy for free. In a nutshell: news feeds my head, shopping feeds my closet, but videos feed my soul — and the soul wins every time.", "koQ": "인터넷에서 영상 시청, 쇼핑, 뉴스 읽기 중 어떤 것을 가장 즐기나요? 왜 그 활동을 즐기나요? 그 이유를 말해주세요.", "koA": "영상, 쇼핑, 뉴스 중에서요? 굳이 고르자면 영상 시청 승이에요. 고민할 것도 없어요. 저한테는 머리 끄기가 전부거든요. 긴 하루 끝에 영상은 저한테 아무것도 요구하지 않아요. 그냥 재생 버튼만 누르고 쉬면 되니까요.\n\n나머지 둘보다는 두말없이 영상을 고를 거예요. 뉴스는 유용하지만 솔직히 머리한테는 숙제잖아요. 그리고 쇼핑이요? 오해는 마세요. 특가 사냥은 정말 좋아해요. 하지만 그건 미션이지 휴식이 아니죠. 제 지갑도 제가 영상 보는 쪽을 선호하고요!\n\n소파에 누워서 여행 브이로그로 공짜 이탈리아 여행을 떠나는 것만 한 게 없어요. 한마디로 뉴스는 머리를 채우고, 쇼핑은 옷장을 채우지만, 영상은 마음을 채워요. 그리고 마음이 매번 이기죠.", "struct": [["1️⃣ 선언", "영상 승, no contest"], ["2️⃣ 이유", "머리 끄기 · 무조건 휴식"], ["3️⃣ 비교", "뉴스 = 숙제 · 쇼핑 = 미션"], ["4️⃣ 절정", "소파 + 공짜 이탈리아 여행"], ["5️⃣ 마무리", "머리·옷장·마음 3단 대구"]], "scoring": [["3지선다 공략", "호텔 · 휴대폰 취향 편과 같은 3지선다예요! 셋 다 언급한 뒤 하나를 고르는 공식 그대로 가져오면 돼요 🔁 ✅"], ["비유 이유", "뉴스 = 두뇌의 숙제, 쇼핑 = 미션처럼 비유 하나면 긴 설명 없이 이유가 전달돼요 😆 세 선택지에 각각 별명을 붙여 보는 게 요령이에요"], ["여행 로망 연결", "브이로그 속 공짜 이탈리아 여행 — 서베이 해외여행 편의 로망이 취향의 근거가 돼요 🔁 ✈️ 로망 하나를 시리즈 내내 우려먹는 게 요령이에요"], ["3단 대구 마무리", "머리를 채우고, 옷장을 채우고, 마음을 채운다는 3단 대구 — 통째로 외워 둘 가치가 있는 마무리예요 💬 🎓 대구 명언은 취향 편의 전통이죠"]], "expr": [["If I had to choose", "굳이 하나를 고르자면", "취향 오프닝, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "은행 취향 편 재활용 🔁 🔥"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식, 시리즈 공통 🔁 ✨"], ["switch my brain off", "머리를 끄다", "휴식형 취향의 킬러 표현 😴"], ["ask nothing of me", "내게 아무것도 요구하지 않다", "편안함을 그리는 고급 표현 💕"], ["A over B any day", "두말없이 B보다 A", "3지선다 필승 선택 공식 🔁 ✅"], ["homework for my brain", "머리한테는 숙제", "비유로 이유 만들기 기술 😆"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["hunt for deals", "특가를 사냥하다", "서베이 쇼핑·휴대폰 취향 재활용 🔁 🔥"], ["Nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 ☀️"], ["In a nutshell", "한마디로 정리하면", "취향 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-028 6. 인터넷(Internet)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-028 6. 인터넷(Internet)_취향.mp3"}, {"id": "2-029", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "과거 경험", "badge": "29 과거 경험", "enQ": "Tell me about the first time you used the internet. When was it, and what did you do online? What impression did it leave on you?", "enA": "Oh, this reminds me of our first family computer, back in elementary school. My first internet experience came with a soundtrack: the screeching sound of the dial-up modem. Beep, buzz, static — it sounded like a robot orchestra!\n\nWhat did I do? I searched for pictures of my favorite cartoon characters, and guess what — one single photo took a few minutes to load, appearing line by line, top to bottom. And in the middle of it, my mom picked up the phone and the connection died instantly. We both screamed!\n\nStill, the impression it left was huge: it felt like a magic window to the whole world, right there on our desk. I was completely hooked, and honestly, I've been online ever since. That noisy little modem started it all.", "koQ": "처음 인터넷을 사용했던 때에 대해 말해주세요. 언제였고, 온라인에서 무엇을 했나요? 그것은 당신에게 어떤 인상을 남겼나요?", "koA": "아, 초등학생 때 우리 집 첫 컴퓨터가 생각나네요. 제 첫 인터넷 경험에는 배경음악이 있었어요. 전화선 모뎀의 끼익거리는 소리요. 삐, 지직, 치익. 로봇 오케스트라 같았죠!\n\n뭘 했냐고요? 좋아하는 만화 캐릭터 사진을 검색했는데, 글쎄, 사진 한 장 뜨는 데 몇 분이 걸렸어요. 위에서 아래로 한 줄 한 줄 나타나면서요. 그리고 그 도중에 엄마가 전화기를 드는 순간 연결이 뚝 끊겼어요. 둘 다 소리를 질렀죠!\n\n그래도 그게 남긴 인상은 엄청났어요. 책상 위에 온 세상으로 통하는 마법의 창문이 생긴 느낌이었거든요. 저는 완전히 빠져 버렸고, 솔직히 그 후로 지금까지 쭉 온라인이에요. 그 시끄러운 작은 모뎀이 모든 것의 시작이었어요.", "struct": [["1️⃣ 도입", "초등학교 · 집 첫 컴퓨터"], ["2️⃣ 소리", "모뎀 소리 = 로봇 오케스트라"], ["3️⃣ 사건", "사진 몇 분 로딩 + 전화 끊김"], ["4️⃣ 인상", "온 세상 마법의 창문"], ["5️⃣ 마무리", "hooked + ever since"]], "scoring": [["소리로 열기", "끼익거리는 모뎀 소리로 시작하면 첫 문장부터 시대가 그려져요 🎵 감각 디테일로 여는 오프닝은 IH의 필수 기술이에요"], ["전화 끊김 사건", "엄마의 전화 한 통에 끊기던 인터넷 — 세대 공감 반전이 이 경험담의 심장이에요 🎭 전화 비교 편과 이어지는 시대 소재라 재활용 효과도 커요 🔁"], ["인상 = 비유로", "인상(impression)을 물으면 magic window처럼 비유 하나로 답하세요 ✨ 형용사 나열보다 비유 한 개가 훨씬 오래 기억에 남아요"], ["계기형 마무리", "hooked → ever since로 첫 경험을 현재 습관까지 잇는 계기형 공식 마무리예요 🔁 🎓 첫 경험 질문은 계기형 공식이 언제나 정답이에요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 서베이 개근 🔁 🔑"], ["dial-up modem", "전화선 모뎀", "시대를 소환하는 킬러 소품 📖"], ["screeching sound", "끼익거리는 소리", "소리 디테일, 은행 통장 기술 재활용 🔁 🎵"], ["a robot orchestra", "로봇 오케스트라", "소리를 비유로 그리는 유머 😆"], ["guess what", "글쎄, 그런데 있잖아요", "반전 시그널, 서베이 개근 🔁 🎭"], ["line by line", "한 줄 한 줄", "느린 로딩을 그리는 디테일 ⏰"], ["in the middle of ~", "~하는 도중에", "은행 경험 편 재활용 🔁 사건 타이밍!"], ["the connection died", "연결이 끊겼다", "전화 인터넷 시대의 필수 표현 💬"], ["a magic window", "마법의 창문", "impression 질문의 비유 답변 ✨"], ["hooked", "푹 빠진", "계기 경험의 필수 감정 표현 🔥"], ["I've been online ever since", "그 후로 쭉 온라인이다", "Since then의 현재완료 버전 🔁 📊"]], "audio": "audio/2_돌발/2-029 6. 인터넷(Internet)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-029 6. 인터넷(Internet)_과거 경험.mp3"}, {"id": "2-030", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "비교", "badge": "30 비교", "enQ": "Compare the internet today with the internet when you first started using it. How have the speed, the content, and the way people use it changed? Tell me in detail.", "enA": "The internet has changed beyond recognition. Back then, in the dial-up days, going online was an event: I used to wait minutes for one photo, and the phone line was occupied the whole time — my mom was not a fan!\n\nContent was mostly text and tiny pictures: simple message boards, basic homepages. Watching a video online? That was science fiction.\n\nThese days, it's a completely different story. With Wi-Fi and 5G, everything loads in the blink of an eye — I stream concerts in 4K on my phone while jogging! Content exploded too: streaming, shorts, live shopping. And the biggest change? We don't sit down to go online anymore. The internet is just always with us, in our pockets. Compared to the modem days, it's way more convenient. Though I have to admit, waiting made things feel special — that photo loading line by line was pure suspense!", "koQ": "오늘날의 인터넷과 처음 사용하기 시작했을 때의 인터넷을 비교해주세요. 속도, 콘텐츠, 사용 방식은 어떻게 변화했나요? 자세히 말해주세요.", "koA": "인터넷은 못 알아볼 만큼 변했어요. 그때, 그러니까 모뎀 시절에는 인터넷 접속이 하나의 이벤트였어요. 사진 한 장에 몇 분씩 기다리곤 했고, 그동안 전화선은 계속 통화 중이었죠. 엄마는 전혀 반기지 않으셨어요!\n\n콘텐츠도 대부분 글과 작은 사진이었어요. 간단한 게시판, 기본적인 홈페이지 정도요. 온라인으로 영상을 본다? 그건 공상과학이었죠.\n\n요즘은 완전히 다른 이야기예요. 와이파이와 5G로 모든 게 눈 깜짝할 사이에 열려요. 저는 조깅하면서 폰으로 콘서트를 4K로 스트리밍한다니까요! 콘텐츠도 폭발했어요. 스트리밍, 쇼츠, 라이브 쇼핑까지요. 그리고 가장 큰 변화요? 이제 우리는 인터넷을 하러 앉지 않아요. 인터넷이 그냥 항상 주머니 속에 함께 있죠. 모뎀 시절과 비교하면 훨씬 편리해요. 그래도 인정할게요. 기다림이 모든 걸 특별하게 만들었어요. 한 줄 한 줄 뜨던 그 사진은 순수한 서스펜스였다니까요!", "struct": [["1️⃣ 도입", "못 알아볼 만큼 변한 인터넷"], ["2️⃣ 과거", "접속 = 이벤트 · 전화선 점령"], ["3️⃣ 과거", "글 + 작은 사진 · 게시판"], ["4️⃣ 현재", "5G · 4K 스트리밍 · 주머니 속"], ["5️⃣ 마무리", "way more + 기다림의 낭만"]], "scoring": [["3축 따라가기", "질문이 준 속도 · 콘텐츠 · 사용 방식 3축을 그대로 비교 틀로 쓰세요 ✅ 식당 비교 편과 같은 기술이에요 🔁"], ["경험 편 재활용", "모뎀 소리, 한 줄 로딩, 전화 끊김 — 경험 편 소재가 그대로 비교의 재료가 돼요 🔁 🎓 어제 만든 이야기가 오늘 답변의 재료가 되는 구조죠"], ["본질 한 줄", "'이제 인터넷을 하러 앉지 않는다'는 한 줄이 이 비교의 철학 포인트예요 💬 전화 비교 편의 사람에게 전화한다와 짝꿍인 인사이트죠"], ["낭만 마무리", "편리함 인정 + 기다림의 서스펜스 그리움. 시리즈 공통의 그리움 마무리 공식이에요 🔁 😊 비교의 끝은 언제나 온기 한 스푼이죠"]], "expr": [["beyond recognition", "못 알아볼 만큼", "큰 변화를 한 구로 요약 🔥"], ["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 서베이 공통 시그널 🔁 🧩"], ["going online was an event", "접속이 하나의 이벤트였다", "과거의 무게를 그리는 한 줄 ✨"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 서베이 개근 🔁 💓"], ["occupied", "(전화선이) 통화 중인", "모뎀 시대 필수 디테일 어휘 💬"], ["That was science fiction.", "그건 공상과학이었다.", "짧은 문장 유머 펀치 😆"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 서베이 공통 🔁 🎭"], ["in the blink of an eye", "눈 깜짝할 사이에", "속도 대비의 관용구 ⏰"], ["sit down to ~", "~하러 자리에 앉다", "사용 방식 변화의 핵심 동사구 ✅"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 서베이 공통 🔁 📊"], ["I have to admit", "인정할게요", "그리움 시그널, 서베이 비교 편 공통 🔁 😊"]], "audio": "audio/2_돌발/2-030 6. 인터넷(Internet)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-030 6. 인터넷(Internet)_비교.mp3"}, {"id": "2-031", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "묘사", "badge": "31 묘사", "enQ": "What piece of technology do you use the most - your computer, your cell phone, or another device? Describe what it is and why you use it so often.", "enA": "That's an easy one — my smartphone, hands down. My laptop is great for big screens and long videos, but my phone is basically glued to my hand from morning to night.\n\nWhy so often? Because it's all-in-one. It's my alarm clock in the morning, my music player on my evening jog, and my wallet at the convenience store. I even do my banking on it — ever since my card got stuck in an ATM, the KB app handles everything for me.\n\nHonestly, it's like a Swiss Army knife: camera, map, TV, everything packed into one little device. My whole day basically runs on this phone, so yeah — that's pretty much why it never leaves my side.", "koQ": "컴퓨터, 휴대폰, 또는 다른 기기 중 어떤 기술 제품을 가장 많이 사용하나요? 그것이 무엇이고 왜 그렇게 자주 사용하는지 설명해주세요.", "koA": "쉬운 질문이네요. 두말할 것 없이 스마트폰이에요. 노트북도 큰 화면으로 긴 영상을 볼 때 좋지만, 폰은 아침부터 밤까지 사실상 손에 붙어 있거든요.\n\n왜 그렇게 자주 쓰냐고요? 올인원이니까요. 아침엔 알람 시계, 저녁 조깅 땐 음악 플레이어, 편의점에선 지갑이 돼요. 은행 업무도 폰으로 해요. ATM에 카드가 낀 사건 이후로는 KB 앱이 다 처리해주거든요.\n\n솔직히 스위스 군용 칼 같아요. 카메라, 지도, TV까지 작은 기기 하나에 다 들어 있죠. 제 하루가 사실상 이 폰으로 돌아가요. 그래서 폰이 제 곁을 떠날 일이 없는 거예요.", "struct": [["1️⃣ 선언", "스마트폰, hands down 선언"], ["2️⃣ 근거", "아침부터 밤까지 손에 붙은 폰"], ["3️⃣ 역할", "알람 · 조깅 DJ · 지갑 · KB 뱅킹"], ["4️⃣ 비유", "스위스 군용 칼 = 만능 기기"], ["5️⃣ 마무리", "하루가 폰으로 돌아간다 + 애착"]], "scoring": [["첫 문장 선언", "어떤 기기를 가장 많이 쓰나 같은 3지선다 질문은 고민하는 척 없이 첫 문장에서 바로 선언하세요. hands down이 확신까지 얹어줘요 🔁 🔑"], ["역할 3종 세트", "알람 시계→조깅 음악 플레이어→편의점 지갑→KB 뱅킹. 하루 시간 순서로 역할을 나열하면 왜 자주 쓰는지가 설명이 아니라 증명이 돼요. 나열형 답변의 정석이에요 ✅"], ["시리즈 연결", "ATM에 카드가 낀 사건 이후 KB 앱으로 갈아탔다는 이야기는 돌발 은행 편 소재 그대로예요. 같은 사건을 다른 질문의 근거로 재활용하면 시험 내내 일관성이 생겨요 🔁 🎓"], ["비유 한 방", "카메라, 지도, TV를 나열한 뒤 스위스 군용 칼 비유로 묶으면 폰의 만능함이 그림 한 장으로 정리돼요 ✨ 묘사 답변의 마지막은 비유 한 방이 정답이에요!"]], "expr": [["hands down", "두말할 것 없이", "최상급 확신 표현, 시리즈 개근 🔁 🔑"], ["glued to my hand", "손에 붙어 있는", "폰 중독 유머, 인터넷 습관 편 재활용 🔁 😆"], ["all-in-one", "올인원, 만능", "폰 묘사 만능 키워드, 역할 나열 예고편 ✅"], ["run on ~", "~으로 돌아가다", "내 하루가 폰으로 돌아간다는 재치 동사 🔥"], ["Swiss Army knife", "스위스 군용 칼", "다재다능 비유의 정석, IH 그림 그리기 ✨"], ["packed into", "~에 꽉 담긴", "작은 기기 + 많은 기능의 대비 묘사 📏"], ["get stuck", "끼이다, 걸리다", "돌발 은행 편 ATM 사건 재활용 🔁 💳"], ["handle everything", "다 처리하다", "앱 하나면 끝 — 신뢰를 담은 동사 💳"], ["from morning to night", "아침부터 밤까지", "빈도 강조 부사구, 자주 쓰는 이유 뒷받침 ⏰"], ["never leaves my side", "곁을 안 떠난다", "폰을 사람처럼 부르는 애착 마무리 💕"], ["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"]], "audio": "audio/2_돌발/2-031 7. 기술(Technology)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-031 7. 기술(Technology)_묘사.mp3"}, {"id": "2-032", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "습관", "badge": "32 습관", "enQ": "Tell me about the technology you use the most these days, such as your smartphone or computer. What is it, and what do you usually do with it?", "enA": "These days it's still my smartphone, so let me walk you through a typical day with it. It starts as my alarm at seven, and on my commute it turns into a newsstand — I scroll the headlines and check the group chat.\n\nThen in the evening, it becomes my personal DJ: I put on my IU playlist for my jog along the riverside trail. After that, I usually watch YouTube on the sofa — mostly recipe channels. On weekends, I switch to my laptop for hotel bookings or anything with serious typing.\n\nAnd of course, my golden rule: at eleven, the phone goes face-down and the screen goes off, no exceptions. A phone that does everything, and one rule that stops it — that's pretty much my tech routine, and it never gets old.", "koQ": "요즘 가장 많이 사용하는 스마트폰이나 컴퓨터 같은 기술에 대해 말해주세요. 그것은 무엇이고, 주로 무엇을 하는 데 사용하나요?", "koA": "요즘도 역시 스마트폰이에요. 폰과 함께하는 하루를 차근차근 보여드릴게요. 아침 7시엔 알람으로 시작하고, 출근길엔 신문 가판대로 변신해요. 헤드라인을 훑고 단톡방을 확인하죠.\n\n그리고 저녁이 되면 폰은 제 전용 DJ가 돼요. 강변 산책로 조깅엔 아이유 플레이리스트를 틀죠. 그다음엔 보통 소파에서 유튜브를 봐요. 주로 레시피 채널이요. 주말엔 호텔 예약이나 본격적인 타이핑이 필요한 일은 노트북으로 갈아타요.\n\n그리고 물론 저의 황금률이 있죠. 11시가 되면 폰은 뒤집어 놓고 화면은 꺼요. 예외는 없어요. 모든 걸 다 하는 폰, 그리고 그걸 멈추는 규칙 하나. 그게 제 기술 루틴이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "차근차근 하루 루틴 예고"], ["2️⃣ 아침", "7시 알람 → 출근길 뉴스 · 단톡"], ["3️⃣ 저녁", "조깅 DJ → 소파 유튜브 레시피"], ["4️⃣ 주말", "예약 · 타이핑은 노트북 전환"], ["5️⃣ 규칙", "11시 face-down, 예외 없음"]], "scoring": [["시간 순서 뼈대", "아침 알람→출근길 뉴스→저녁 조깅→주말 노트북. 하루 시간축만 따라가도 습관 답변의 뼈대가 저절로 완성돼요. 습관 질문의 만능 설계도예요 ✅"], ["변신 스토리", "알람 시계→신문 가판대→전용 DJ. 폰이 시간대마다 다른 물건으로 변신한다는 프레임이 단순한 기능 나열을 하나의 이야기로 바꿔줘요 ✨ turn into 동사가 핵심이에요"], ["룰 재활용", "11시 face-down 룰은 돌발 휴대폰 습관 편에서 그대로 가져온 규칙이에요. 어떤 주제에서 물어도 같은 규칙으로 답하는 일관성이 IH 신뢰 포인트가 돼요 🔁 🌙"], ["마무리 공식", "다 하는 폰 + 멈추는 규칙 하나라는 대구로 요약한 뒤, that's pretty much와 it never gets old로 닫으면 습관 마무리 공식이 완성돼요 🔁 ✅"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 답변 도입 공식, 서베이 개근 🔁 🔑"], ["turn into ~", "~으로 변신하다", "폰 변신 프레임의 핵심 동사 🎭"], ["newsstand", "신문 가판대", "출근길 폰을 그리는 비유 소품 ✨"], ["personal DJ", "전용 DJ", "저녁 조깅 폰 비유, 음악 편 연결 🔁 🎵"], ["switch to ~", "~으로 갈아타다", "기기 전환 동사, 인터넷 습관 편 재활용 🔁 ✅"], ["serious typing", "본격적인 타이핑", "노트북이 필요한 이유 한 방 정리 😆"], ["golden rule", "황금률", "절제 규칙에 이름 붙이기, 습관 개근 🔁 🔑"], ["face-down", "뒤집어 놓은", "돌발 휴대폰 편 밤 루틴 재활용 🔁 🌙"], ["no exceptions", "예외 없이", "규칙의 단호함을 더하는 한 마디 💪"], ["that's pretty much ~", "그게 대충 ~예요", "하루 요약 정리 마무리 공식 🔁 ✅"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식, 서베이 개근 🔁 😊"]], "audio": "audio/2_돌발/2-032 7. 기술(Technology)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-032 7. 기술(Technology)_습관.mp3"}, {"id": "2-033", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "취향", "badge": "33 취향", "enQ": "What is your favorite piece of technology, and why do you like it? How does it make your life easier? Tell me the reasons in detail.", "enA": "If I had to choose my favorite, it's my wireless earbuds — no contest. My phone is the most used, sure, but the earbuds are the ones I love. For me, it's all about having my own little world, anywhere.\n\nHow do they make life easier? They cut the cords out of my life, literally. Music for my evening jog, hands-free calls with my mom while I walk, and noise cancelling that turns a packed subway into a quiet room. I'd take earbuds over any fancy gadget any day. Don't get me wrong — big TVs and smart watches are cool, but they don't follow me around.\n\nNothing beats popping them in on the riverside trail with an IU playlist. In a nutshell: my phone runs my day, but my earbuds save it.", "koQ": "가장 좋아하는 기술 제품은 무엇이고, 왜 좋아하나요? 그것이 당신의 삶을 어떻게 편하게 만들어주나요? 그 이유를 자세히 말해주세요.", "koA": "최애를 골라야 한다면 무선 이어폰이에요. 고민할 것도 없죠. 폰이 제일 많이 쓰는 기기인 건 맞지만, 사랑하는 쪽은 이어폰이거든요. 저한테는 어디서든 나만의 작은 세계를 갖는 게 핵심이에요.\n\n어떻게 삶을 편하게 해주냐고요? 말 그대로 제 삶에서 선을 잘라냈어요. 저녁 조깅엔 음악, 걸으면서 엄마랑 핸즈프리 통화, 노이즈 캔슬링은 꽉 찬 지하철을 조용한 방으로 바꿔주죠. 어떤 신상 기기보다 이어폰이 먼저예요. 오해는 마세요. 큰 TV도 스마트워치도 멋지지만, 절 따라다녀 주진 않잖아요.\n\n강변 산책로에서 아이유 플레이리스트 틀고 이어폰 꽂는 순간은 무엇과도 못 바꿔요. 한마디로, 폰은 제 하루를 굴리고, 이어폰은 제 하루를 구해줘요.", "struct": [["1️⃣ 선택", "최애는 무선 이어폰, no contest"], ["2️⃣ 핵심", "어디서든 나만의 작은 세계"], ["3️⃣ 근거", "조깅 음악 · 엄마 통화 · 노캔"], ["4️⃣ 양보", "TV · 워치 인정 후 재강조"], ["5️⃣ 명언", "폰은 굴리고, 이어폰은 구한다"]], "scoring": [["반전 선택", "가장 많이 쓰는 폰 대신 가장 사랑하는 이어폰을 고르는 반전이 답변을 신선하게 만들어요 ✨ 최다 사용과 최애를 구분하는 순간 이유도 풍성해져요"], ["감각 그림", "꽉 찬 지하철이 조용한 방으로 바뀐다는 장면 전환 하나로 노이즈 캔슬링의 효과가 설명 없이 전달돼요 🎵 기능은 말로 하지 말고 장면으로 보여주세요"], ["공식 풀세트", "no contest 선언 → over any day 비교 → Don't get me wrong 양보 → nothing beats 절정. 이 한 페이지에 취향 공식 네 개가 순서대로 다 들어 있어요 🔁 ✅"], ["대구 마무리", "폰은 하루를 굴리고(runs) 이어폰은 하루를 구한다(saves) — 동사 두 개로 만드는 대구 명언은 통째로 외워서 어떤 취향 질문에든 응용할 가치가 있어요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "취향 답변 도입 공식, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "hands down의 자매 확신 표현 🔁 🔥"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식, 시리즈 공통 🔁 ✨"], ["cut the cords", "선을 잘라내다", "무선의 장점을 한 방에 그리는 동사 💪"], ["hands-free", "손을 쓰지 않는", "걸으며 엄마와 통화하는 디테일 💕"], ["packed", "꽉 찬, 만원인", "만원 지하철 묘사 필수 형용사 📏"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 🔥"], ["in a nutshell", "한마디로", "요약 마무리 공식, 서베이 개근 🔁 ✅"], ["save my day", "하루를 구하다", "runs vs saves 대구 명언의 재료 💬"]], "audio": "audio/2_돌발/2-033 7. 기술(Technology)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-033 7. 기술(Technology)_취향.mp3"}, {"id": "2-034", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "과거 경험", "badge": "34 과거 경험", "enQ": "Tell me about a problem you have had with a piece of technology. What went wrong, and how did you solve it? Describe the experience in detail.", "enA": "Oh, this reminds me of the scariest five minutes of my life — IU concert ticketing day. I was on my laptop, fingers ready, heart pounding. The clock hit eight, I grabbed my seats, and then — out of nowhere — the payment page froze. Completely.\n\nI clicked, I refreshed... nothing. My tickets were sitting in the cart with a countdown timer! So I made a split-second decision: I grabbed my phone, opened the app, logged in, and guess what — my seats were still there. I paid on mobile with about forty seconds to spare.\n\nWhen it went through, I screamed so loud my best friend heard it through the phone. It all worked out fine, and I learned my lesson: since then, I never do ticketing without a backup device. One screen is never enough!", "koQ": "기술 제품을 사용하면서 겪은 문제에 대해 말해주세요. 무엇이 잘못되었고, 어떻게 해결했나요? 그 경험을 자세히 묘사해주세요.", "koA": "아, 제 인생 가장 무서웠던 5분이 떠오르네요. 아이유 콘서트 티켓팅 날이었어요. 노트북 앞에서 손가락 풀고 심장은 쿵쾅쿵쾅. 8시 정각, 좌석을 잡았는데, 그때 난데없이 결제 페이지가 완전히 멈춰버린 거예요.\n\n클릭하고 새로고침해도... 아무 반응이 없었어요. 티켓은 카운트다운 타이머와 함께 장바구니에 갇혀 있었죠! 그래서 순간적으로 결단을 내렸어요. 폰을 집어 앱을 열고 로그인했는데, 세상에, 제 좌석이 그대로 있는 거예요. 40초 정도를 남기고 모바일로 결제했어요.\n\n결제가 되는 순간 너무 크게 소리를 질러서 절친이 전화 너머로 들었을 정도예요. 결국 다 잘 풀렸고, 확실한 교훈도 얻었죠. 그 뒤로는 백업 기기 없이는 절대 티켓팅을 안 해요. 화면 하나로는 부족하거든요!", "struct": [["1️⃣ 도입", "인생 가장 무서웠던 5분"], ["2️⃣ 상황", "8시 정각, 결제 창 멈춤"], ["3️⃣ 반전", "폰 앱으로 40초 남기고 결제"], ["4️⃣ 감정", "비명 → 전화 너머 절친까지"], ["5️⃣ 교훈", "백업 기기 룰 + since then"]], "scoring": [["공식 5단계", "this reminds me of 도입→out of nowhere 반전→해결→감정 폭발→since then 교훈. 경험 공식 다섯 단계가 순서대로 담긴 풀코스 페이지예요 🔁 ✅"], ["숫자 디테일", "인생 가장 무서웠던 5분, 8시 정각, 40초 남기고 결제 — 숫자 세 개가 긴박감을 만들어요. 시간 숫자는 이야기를 진짜처럼 들리게 하는 가장 값싼 특수효과예요 📊"], ["시리즈 연결", "아이유 티켓팅 3수와 절친 비명 통화는 서베이 콘서트 편 소재예요. 같은 사건을 기쁨의 순간에서 기술 사고의 순간으로 각도만 바꿔 재활용했어요 🔁 🎵"], ["교훈 마무리", "단순 해프닝으로 끝내지 말고 백업 기기 없이는 티켓팅 안 한다는 나만의 룰로 승화하세요. 교훈 한 줄이 경험 답변의 격을 한 단계 올려줘요 🎓 🔑"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 답변 도입 공식, 서베이 개근 🔁 🔑"], ["out of nowhere", "난데없이", "반전 신호탄, 서베이 개근 🔁 🎭"], ["freeze", "(화면이) 멈추다", "기술 문제의 필수 동사, 화면 정지 🔥"], ["countdown timer", "카운트다운 타이머", "긴박감을 만드는 소품 디테일 ⏰"], ["split-second decision", "순간적인 결단", "위기 대응의 하이라이트 표현 💪"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["with ~ to spare", "~을 남겨두고", "40초 남기고 — 숫자 디테일 완성 📊"], ["go through", "(결제가) 되다", "결제 성공 순간의 필수 동사 💳"], ["work out fine", "잘 풀리다", "경험 마무리 공식, 서베이 개근 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식, 서베이 개근 🔁 🔑"], ["backup device", "백업 기기", "교훈을 한 단어로 만든 키워드 🎓"]], "audio": "audio/2_돌발/2-034 7. 기술(Technology)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-034 7. 기술(Technology)_과거 경험.mp3"}, {"id": "2-035", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "비교", "badge": "35 비교", "enQ": "Compare the technology of today with the technology of the past. What are the differences, and how has technology affected people's lives over time?", "enA": "Back then, when I was in elementary school, technology used to live in one corner of the house. We had one family computer with that screeching dial-up modem, and my first phone was a pearl-colored folder phone that closed with a satisfying clack.\n\nThese days, it's a completely different story. Technology doesn't live in a corner anymore — it lives in our pockets. Compared to that one shared computer, now every person carries a faster one everywhere. Everything is instant: no waiting, no photos loading line by line.\n\nThe biggest effect? Technology removed waiting from our lives — we got way more speed and convenience. But I have to admit, waiting had its own charm. That little clack felt warmer than any silent touchscreen, if you ask me.", "koQ": "오늘날의 기술과 과거의 기술을 비교해주세요. 어떤 차이점이 있고, 시간이 지나며 기술은 사람들의 삶에 어떤 영향을 미쳤나요?", "koA": "그때, 그러니까 제가 초등학생일 때 기술은 집 한구석에 살았어요. 끼익 소리를 내는 전화선 모뎀이 달린 가족 공용 컴퓨터 한 대가 있었고, 제 첫 폰은 딸깍 소리가 경쾌한 진주색 폴더폰이었죠.\n\n요즘은 완전히 다른 이야기예요. 기술은 더 이상 구석에 살지 않아요. 우리 주머니 속에 살죠. 온 가족이 나눠 쓰던 컴퓨터 한 대와 비교하면, 이제는 모두가 더 빠른 컴퓨터를 하나씩 들고 다녀요. 모든 게 즉시죠. 기다림도, 한 줄씩 뜨는 사진 로딩도 없어요.\n\n가장 큰 영향이요? 기술은 우리 삶에서 기다림을 없앴어요. 속도와 편리함은 훨씬 커졌죠. 하지만 인정할 건 인정해야죠. 기다림엔 나름의 매력이 있었어요. 그 작은 딸깍 소리가 소리 없는 터치스크린보다 따뜻했거든요.", "struct": [["1️⃣ 과거", "집 한구석 · 모뎀 · 폴더폰"], ["2️⃣ 현재", "주머니 속 · 모든 게 즉시"], ["3️⃣ 대비", "가족 공용 1대 vs 1인 1대"], ["4️⃣ 영향", "기다림의 실종 = 최대 변화"], ["5️⃣ 마무리", "딸깍의 온기, 그리움 한 스푼"]], "scoring": [["장소 프레임", "기술이 집 한구석에 살다가 주머니 속으로 이사했다는 공간 프레임 하나로 과거와 현재의 비교 축이 저절로 세워져요 ✨ 비유가 답변의 목차 역할을 해요"], ["소재 총동원", "끼익거리는 모뎀 소리는 인터넷 경험 편, 폴더폰 딸깍은 휴대폰 비교 편 소재예요. 이미 만든 이야기를 비교의 재료로 다시 쓰면 준비 부담이 절반으로 줄어요 🔁 🎓"], ["영향 한 줄", "삶에 미친 영향(affected)이라는 큰 질문에는 기술이 우리 삶에서 기다림을 없앴다는 한 줄로 정조준하세요 🔑 거창한 분석보다 철학 한 줄이 IH다워요"], ["낭만 마무리", "way more로 편리함을 인정한 뒤 딸깍 소리가 터치스크린보다 따뜻했다는 그리움을 한 스푼 얹으면 돌발 비교 편 공통 마무리 공식이 완성돼요 🔁 😊"]], "expr": [["back then", "그때는", "비교 답변 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법, 비교 뼈대 🔁 ✅"], ["screeching", "끼익거리는", "돌발 인터넷 경험 편 모뎀 재활용 🔁 🔥"], ["clack", "딸깍 (소리)", "돌발 휴대폰 편 딸깍 감성 재활용 🔁 💕"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 시그널 🔁 📊"], ["line by line", "한 줄씩", "한 줄씩 뜨던 사진 — 모뎀 시절 요약 📸"], ["instant", "즉각적인", "요즘 기술을 한 단어로 정리 ⏰"], ["way more ~", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식, 비교 개근 🔁 😊"], ["if you ask me", "제 생각엔", "개인 의견을 살짝 얹는 마무리 양념 💬"]], "audio": "audio/2_돌발/2-035 7. 기술(Technology)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-035 7. 기술(Technology)_비교.mp3"}, {"id": "2-036", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "묘사", "badge": "36 묘사", "enQ": "What kinds of appointments do you usually make with the people around you? Describe the typical appointments in your life in detail.", "enA": "That's an easy one — most of my appointments are the happy kind: catching up with people over food and coffee. The regulars on my calendar? Coffee at my favorite cafe Moon with my best friend, and chimaek — chicken and beer — at the craft beer pub with my coworkers.\n\nThere are also standing appointments: every Sunday evening, I call my mom — same time every week, like clockwork. And of course the grown-up stuff: a haircut about once a month, the dentist twice a year — booked by app, needless to say.\n\nOh, and one special one: my best friend and I celebrate our birthdays with a hotel staycation every year — basically a fixed national holiday for us two. So yeah, that's pretty much my appointment lineup: food, family, and one fancy tradition.", "koQ": "주변 사람들과 주로 어떤 종류의 약속을 하나요? 당신의 일상 속 일반적인 약속들을 자세히 설명해주세요.", "koA": "쉬운 질문이네요. 제 약속은 대부분 행복한 종류예요. 음식과 커피를 사이에 두고 사람들과 회포를 푸는 거요. 달력의 단골손님들이요? 절친과는 최애 카페 문(Moon)에서 커피, 회사 동료들과는 수제맥주 펍에서 치맥이죠.\n\n고정 약속들도 있어요. 매주 일요일 저녁엔 엄마한테 전화해요. 매주 같은 시간, 시계처럼 정확하게요. 어른의 일정도 물론 있죠. 미용실은 한 달에 한 번, 치과는 일 년에 두 번. 말할 것도 없이 앱으로 예약해요.\n\n아, 특별한 약속이 하나 있어요. 절친과 저는 매년 생일을 호캉스로 기념해요. 우리 둘만의 고정 국경일 같은 거죠. 네, 이게 제 약속 라인업이에요. 음식, 가족, 그리고 근사한 전통 하나!", "struct": [["1️⃣ 분류", "약속 = 대부분 행복한 종류"], ["2️⃣ 단골", "문(Moon) 커피 · 동료와 펍 치맥"], ["3️⃣ 고정", "일요일 엄마 통화, 시계처럼"], ["4️⃣ 일정", "미용실 · 치과는 앱 예약"], ["5️⃣ 특별", "절친 생일 호캉스 전통"]], "scoring": [["분류가 반", "친목 약속 · 고정 통화 · 앱 예약 · 생일 전통. 네 갈래로 분류해서 답하면 흩어진 일상이 저절로 정리돼요 ✅ 묘사 질문은 분류가 반이에요"], ["단골 활용", "문(Moon) 카페 커피와 수제맥주 펍 치맥은 서베이 카페 · 술집 편의 단골 무대 그대로예요. 약속 장소를 물어도 늘 같은 가게가 나오는 일관성이 진짜처럼 들려요 🔁 🍺"], ["리듬 표현", "standing appointment(고정 약속), like clockwork(시계처럼 정확하게) — 정기적인 리듬을 그리는 고급 어휘 두 개가 이 페이지의 IH 어휘력 포인트예요 🔑"], ["전통 카드", "절친과의 생일 호캉스는 시리즈 전체의 시그니처 전통이에요. 물건이 아니라 사람과 전통으로 마무리하면 묘사 답변에 온도가 생겨요 💕 🎓"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["catch up (with)", "회포를 풀다", "만남 약속의 만능 표현, 근황 나누기 🔥"], ["the regulars", "단골손님들", "달력의 단골손님 — 의인화 재치 ✨"], ["chimaek", "치맥", "한국 문화 소개 + 영어 설명 콤보 🍺"], ["standing appointment", "고정 약속", "정기 약속을 뜻하는 고급 어휘 🔑"], ["like clockwork", "시계처럼 정확하게", "규칙성 강조, 엄마 통화 디테일 ⏰"], ["needless to say", "말할 것도 없이", "당연함을 얹는 부사구 한 스푼 ✅"], ["staycation", "호캉스", "호텔 + 휴가 합성어, 호캉스 그 자체 ✨"], ["fixed national holiday", "고정 국경일", "둘만의 국경일 — 과장 유머 포인트 😆"], ["lineup", "라인업, 구성", "요약을 세련되게 만드는 명사 🧩"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식, 서베이 개근 🔁 ✅"]], "audio": "audio/2_돌발/2-036 8. 약속(Appointment)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-036 8. 약속(Appointment)_묘사.mp3"}, {"id": "2-037", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "습관", "badge": "37 습관", "enQ": "What steps do you take when you make an appointment? What do you consider first, and how do you decide the time and place? Tell me in detail.", "enA": "I have a whole system, so let me walk you through it. First, everything starts in the group chat — I throw out a few dates and see what sticks. Before that, though, I always check my calendar app; double-booking is my nightmare.\n\nThen comes the time: weekday evenings after work, or Saturday afternoons — those are the sweet spots. As for the place? Honestly, food decides everything. If we want to talk, it's the kimchi stew place in my alley; if we want to laugh, it's chimaek at the pub.\n\nAnd my golden rule: I always send a quick reminder the day before — just 'see you tomorrow!' It saves everyone from the awkward 'wait, was that today?' moment. Simple system, zero drama — it never gets old.", "koQ": "약속을 잡을 때 어떤 단계를 거치나요? 무엇을 먼저 고려하고, 시간과 장소는 어떻게 정하나요? 자세히 말해주세요.", "koA": "저만의 시스템이 있어요. 차근차근 알려드릴게요. 먼저, 모든 건 단톡방에서 시작해요. 날짜 몇 개를 던져놓고 어떤 게 통하는지 보죠. 근데 그 전에 캘린더 앱부터 확인해요. 약속이 겹치는 건 악몽이니까요.\n\n다음은 시간이에요. 평일 퇴근 후 저녁이나 토요일 오후, 그게 최적의 지점이죠. 장소는요? 솔직히 음식이 다 정해요. 이야기를 하고 싶으면 우리 골목 김치찌개집, 웃고 싶으면 펍에서 치맥이에요.\n\n그리고 저의 황금률. 하루 전에 꼭 짧은 리마인더를 보내요. 내일 봐! 한 마디면 돼요. 잠깐, 그게 오늘이었나? 하는 어색한 순간에서 모두를 구해주죠. 단순한 시스템, 드라마 제로. 전혀 질리지 않아요.", "struct": [["1️⃣ 시작", "단톡방에 날짜 몇 개 투척"], ["2️⃣ 확인", "캘린더 앱, 더블부킹 방지"], ["3️⃣ 시간", "평일 저녁 · 토요일 오후"], ["4️⃣ 장소", "수다 = 찌개집, 웃음 = 펍"], ["5️⃣ 규칙", "하루 전 리마인더 골든룰"]], "scoring": [["단계 동사", "First 단톡방 → Then 시간 · 장소 → And 리마인더. 단계(steps)를 묻는 질문에는 순서 신호어 세 개만 세우면 뼈대가 완성돼요 ✅"], ["기준 제시", "무엇을 먼저 고려하나(consider first)에는 더블부킹 방지를 콕 집어 답하세요 🔑 질문 속 의문사마다 답을 하나씩 배치하는 게 고득점 요령이에요"], ["장소 공식", "음식이 다 정해요(Food decides everything) 한 줄로 웃기고, 수다는 김치찌개집 · 웃음은 치맥 펍으로 나눠 답해요. 식당 편 단골 무대 재활용이에요 🔁 🍺"], ["습관 마무리", "하루 전 리마인더라는 golden rule로 절제된 어른의 습관을 보여주고, zero drama + it never gets old로 닫으면 습관 공식 그대로예요 🔁 ✅"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["throw out (dates)", "(안을) 던져보다", "단톡방에 안을 던지는 캐주얼 동사 💬"], ["see what sticks", "뭐가 통하나 보다", "뭐가 통하나 보기 — 원어민 감각 표현 ✨"], ["double-booking", "약속 겹치기", "캘린더부터 여는 이유, 악몽 유머 😆"], ["sweet spot", "최적의 지점", "최적 시간대를 부르는 만능 어휘 🔥"], ["Food decides everything.", "음식이 다 정한다", "장소 질문을 유머로 정리하는 한 줄 🎭"], ["golden rule", "황금률", "절제 규칙 이름 붙이기, 습관 개근 🔁 🔑"], ["reminder", "리마인더", "하루 전 확인 문자, 습관의 화룡점정 ⏰"], ["save ~ from ...", "~을 …에서 구하다", "리마인더의 효용을 그리는 구문 ✅"], ["zero drama", "문제 하나 없이", "무사고 마무리의 캐주얼 표현 💬"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식, 서베이 개근 🔁 😊"]], "audio": "audio/2_돌발/2-037 8. 약속(Appointment)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-037 8. 약속(Appointment)_습관.mp3"}, {"id": "2-038", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "취향", "badge": "38 취향", "enQ": "Do you prefer making appointments by phone call or through a mobile app? Why do you prefer that way? Tell me the reasons.", "enA": "If I had to choose, apps win, no contest. For me, it's all about pressure-free booking: with an app, I can compare times, change my mind five times, and book at midnight in my pajamas — no small talk required.\n\nI'd pick an app over a phone call any day. Calls put me on the spot: someone's waiting while I check my schedule, and I always hang up and realize I forgot to ask something. Apps keep everything in writing — time, place, confirmation — so there's no 'did I say Tuesday or Thursday?' panic.\n\nDon't get me wrong — my rule is 'texts for information, calls for hearts', so feelings still get a phone call. But for appointments? Nothing beats three quiet taps. In a nutshell: I book with my thumbs and save my voice for the people I love.", "koQ": "전화로 약속(예약)을 잡는 것과 모바일 앱으로 잡는 것 중 무엇을 선호하나요? 왜 그 방식을 선호하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 앱 승리예요. 고민할 것도 없죠. 저한테 핵심은 부담 없는 예약이에요. 앱이면 시간대를 비교하고, 마음을 다섯 번 바꾸고, 자정에 잠옷 차림으로도 예약할 수 있어요. 스몰토크도 필요 없고요.\n\n전화보다는 무조건 앱이에요. 전화는 절 곤란하게 만들거든요. 제가 일정을 확인하는 동안 상대는 기다리고 있고, 끊고 나면 꼭 뭘 안 물어봤다는 걸 깨달아요. 앱은 모든 게 글로 남아요. 시간, 장소, 확정까지요. 화요일이랬나 목요일이랬나 하는 패닉이 없죠.\n\n오해는 마세요. 제 원칙은 문자는 정보, 전화는 마음이라서, 감정은 여전히 전화 몫이에요. 하지만 약속은요? 조용한 터치 세 번만 한 게 없어요. 한마디로, 예약은 엄지로 하고 목소리는 사랑하는 사람들을 위해 아껴둬요.", "struct": [["1️⃣ 선택", "앱으로 예약, no contest"], ["2️⃣ 근거", "자정 잠옷 차림 예약 가능"], ["3️⃣ 대비", "전화는 날 코너로 몬다"], ["4️⃣ 양보", "마음 전할 땐 여전히 전화"], ["5️⃣ 명언", "엄지로 예약, 목소리는 아낌"]], "scoring": [["기록 논리", "앱 선호의 근거를 in writing(기록이 남는다)으로 세우면 화요일이랬나 목요일이랬나 패닉 예시까지 자연스럽게 이어져요 🔑"], ["장면 유머", "자정에 잠옷 차림으로 예약 완료 — 구체적인 장면 하나가 편리하다는 말 열 번보다 힘이 세요 😆 취향의 이유는 장면으로 보여주세요"], ["모토 재활용", "문자는 정보, 전화는 마음이라는 돌발 전화 취향 편의 모토가 여기서는 양보 단계에 다시 등장해요. 모토 하나로 두 주제를 꿰는 고급 재활용이에요 🔁 💬"], ["대구 마무리", "엄지로 예약하고 목소리는 사랑하는 사람들을 위해 아껴둔다 — 실용과 감성을 한 문장에 담는 대구 마무리는 취향 편 명언 공식의 정석이에요 💬 🎓"]], "expr": [["no contest", "고민할 것도 없이", "취향 선언 공식, 시리즈 개근 🔁 🔑"], ["pressure-free", "부담 없는", "앱 예약의 장점을 압축한 형용사 ✨"], ["no ~ required", "~이 필요 없는", "no small talk required 응용 만능틀 ✅"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 🔥"], ["put ~ on the spot", "~을 곤란하게 하다", "전화의 단점을 그리는 고급 표현 🎭"], ["hang up", "전화를 끊다", "돌발 전화 편 필수 동사 재활용 🔁 💬"], ["in writing", "글로, 기록으로", "기록이 남는다 — 앱 선호 핵심 논리 🔥"], ["Don't get me wrong", "오해는 마세요", "예외 인정 시그널, 서베이 개근 🔁 😊"], ["calls for hearts", "전화는 마음", "전화 취향 편 모토의 절반, 짝꿍 표현 🔁 💕"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식, 서베이 개근 🔁 ✅"], ["in a nutshell", "한마디로", "요약 마무리 공식, 서베이 개근 🔁 💬"]], "audio": "audio/2_돌발/2-038 8. 약속(Appointment)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-038 8. 약속(Appointment)_취향.mp3"}, {"id": "2-039", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "과거 경험", "badge": "39 과거 경험", "enQ": "Tell me about a time when you had to cancel an appointment. What was the reason, and how did you deal with the situation? Give me as many details as you can.", "enA": "This reminds me of a movie night that never happened. A few months ago, my best friend and I had a long-awaited date for a new mystery movie at the mall theater. But that morning, I woke up with a terrible cold — pounding head, sore throat, the full package.\n\nI felt awful — we had booked the tickets in advance — but I texted her right away, apologized, and offered to cover the cancellation fee. And guess what: an hour later, out of nowhere, my doorbell rang. She was standing there with a container of warm porridge!\n\nIn the end it worked out fine — we watched the movie the next weekend, and it was even better with her popcorn commentary. Since then, we have a little rule: cancel early, no guilt, and the one who cancels buys dessert next time.", "koQ": "약속을 취소해야 했던 때에 대해 말해주세요. 이유가 무엇이었고, 그 상황을 어떻게 해결했나요? 가능한 많은 세부사항을 말해주세요.", "koA": "성사되지 못한 영화의 밤이 떠오르네요. 몇 달 전에 절친과 쇼핑몰 영화관에서 신작 미스터리 영화를 보기로 한, 오래 기다린 약속이 있었어요. 그런데 그날 아침, 지독한 감기에 걸린 채 일어났죠. 지끈거리는 머리, 아픈 목, 풀패키지였어요.\n\n티켓도 미리 예매해둔 터라 너무 미안했어요. 바로 문자로 사과하고 취소 수수료는 제가 내겠다고 했죠. 그런데 있잖아요, 한 시간 뒤에 난데없이 초인종이 울렸어요. 절친이 따뜻한 죽 한 통을 들고 서 있는 거예요!\n\n결국엔 다 잘 풀렸어요. 다음 주말에 그 영화를 봤는데, 절친의 팝콘 중계 덕분에 오히려 더 재밌었죠. 그 뒤로 우리만의 작은 룰이 생겼어요. 취소는 빨리, 죄책감은 금지, 그리고 취소한 사람이 다음에 디저트 사기!", "struct": [["1️⃣ 도입", "성사 못 한 영화의 밤"], ["2️⃣ 이유", "아침부터 감기 풀패키지"], ["3️⃣ 해결", "즉시 문자 사과 + 수수료 제안"], ["4️⃣ 반전", "한 시간 뒤, 절친이 죽 배달"], ["5️⃣ 교훈", "취소는 빨리, 죄책감 금지 룰"]], "scoring": [["해결 강조", "어떻게 해결했나(deal with)가 질문의 핵심이에요. 즉시 문자 사과 + 수수료 부담 제안, 사건보다 태도를 보여주는 게 진짜 답이에요 🔑"], ["반전 온도", "guess what 뒤의 반전이 사고가 아니라 절친의 죽 배달이라는 감동인 것도 전략이에요 💕 경험담이 꼭 큰일일 필요는 없어요. 따뜻한 반전도 훌륭한 이야기예요"], ["소재 연결", "쇼핑몰 영화관은 서베이 영화 편의 무대, 절친은 시리즈 단골 주인공이에요. 무대와 인물이 그대로라 새 이야기인데도 이미 아는 세계처럼 들려요 🔁 🎬"], ["룰 마무리", "취소는 빨리, 죄책감은 금지, 취소한 사람이 디저트 사기 — 교훈을 둘만의 귀여운 룰로 만들면 since then 마무리가 한층 사랑스러워져요 😊 🎓"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["long-awaited", "오래 기다린", "약속의 무게를 더하는 형용사 ✨"], ["pounding (head)", "지끈거리는", "감기 증상을 생생하게 그리는 묘사 🎭"], ["the full package", "풀패키지, 종합 세트", "증상 나열 뒤 유머 마무리 한 방 😆"], ["in advance", "미리", "미리 예매한 상황 설명 필수 부사 ⏰"], ["cover (the fee)", "(비용을) 부담하다", "수수료 부담 — 해결 태도의 동사 🔑"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 🎭"], ["out of nowhere", "난데없이", "난데없는 초인종 — 반전 공식 🔁 ✨"], ["work out fine", "잘 풀리다", "경험 마무리 공식, 서베이 개근 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식, 서베이 개근 🔁 💕"], ["no guilt", "죄책감 금지", "둘만의 룰을 만든 핵심 키워드 😊"]], "audio": "audio/2_돌발/2-039 8. 약속(Appointment)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-039 8. 약속(Appointment)_과거 경험.mp3"}, {"id": "2-040", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "비교", "badge": "40 비교", "enQ": "Compare the way people make appointments now with the way they did in the past. What has changed with the development of smartphones? Tell me about the differences.", "enA": "Back then, before smartphones, an appointment was a promise carved in stone. People used to call a landline, fix one time and one place — say, five o'clock in front of the station clock — and that was it. If someone was late, you just stood there, waiting and wondering.\n\nThese days, it's a completely different story. Plans live in the group chat, and they stay flexible until the last minute: 'running ten minutes late!', a pin drop with the exact location, sometimes moving the whole thing with one message. Compared to the old days, everything is way more convenient — nobody waits blindly anymore.\n\nBut I have to admit: showing up on time back then meant something — you couldn't fix it with a quick text. There was a little more weight in every promise, and honestly, I kind of miss that.", "koQ": "지금 사람들이 약속을 잡는 방식과 과거의 방식을 비교해주세요. 스마트폰의 발전으로 무엇이 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 스마트폰 이전에 약속은 돌에 새긴 맹세였어요. 사람들은 집 전화로 전화를 걸어 시간과 장소를 하나로 못 박았죠. 이를테면 5시, 역 시계탑 앞. 그게 끝이었어요. 상대가 늦으면 그냥 서서 기다리며 궁금해하는 수밖에요.\n\n요즘은 완전히 다른 이야기죠. 약속은 단톡방에 살고, 마지막 순간까지 유연해요. 10분 늦어! 정확한 위치 핀 공유, 심지어 메시지 하나로 약속 전체를 옮기기도 하죠. 예전과 비교하면 모든 게 훨씬 편해요. 이제 아무도 무작정 기다리지 않으니까요.\n\n하지만 인정할 건 인정해야죠. 그 시절의 정시 도착은 의미가 있었어요. 문자 한 통으로 수습할 수 없었으니까요. 약속 하나하나에 조금 더 무게가 있었달까요. 솔직히 그게 조금 그립기도 해요.", "struct": [["1️⃣ 과거", "약속 = 돌에 새긴 맹세"], ["2️⃣ 장면", "역 시계탑 앞, 무작정 대기"], ["3️⃣ 현재", "단톡방 · 늦어 문자 · 핀 공유"], ["4️⃣ 대비", "훨씬 편리, 기다림은 실종"], ["5️⃣ 마무리", "약속의 무게, 그리움 한 스푼"]], "scoring": [["비유 오프닝", "약속은 돌에 새긴 맹세였다(carved in stone) — 첫 문장의 비유 하나로 과거 방식 전체가 요약돼요 ✨ 비교 답변의 오프닝 기술이에요"], ["장면 대비", "시계탑 앞에서 무작정 기다리던 장면 vs 10분 늦어! 문자와 위치 핀 공유 — 설명 대신 장면 대 장면으로 붙이면 비교가 그림처럼 살아나요 🎬"], ["질문 정조준", "스마트폰으로 무엇이 변했나(what has changed)에는 마지막 순간까지의 유연함(flexible) 한 단어로 정조준하고 예시를 붙이세요 🔑"], ["낭만 마무리", "way more로 편리함을 인정하되 정시 도착의 무게(weight)가 그립다는 한 스푼으로 닫으면 시리즈 공통 비교 마무리 공식 그대로예요 🔁 😊"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["carved in stone", "돌에 새긴, 확정된", "과거 약속을 한 방에 그리는 비유 ✨"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법, 비교 뼈대 🔁 ✅"], ["landline", "집 전화, 유선 전화", "돌발 전화 비교 편 소품 재활용 🔁 💬"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["flexible", "유연한", "스마트폰이 바꾼 것의 핵심 단어 🔑"], ["pin drop", "위치 핀 공유", "요즘 약속을 그리는 디테일 소품 🗺️"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 시그널 🔁 📊"], ["way more ~", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식, 비교 개근 🔁 😊"], ["weight", "무게, 진중함", "약속의 무게 — 철학 마무리 포인트 💬"]], "audio": "audio/2_돌발/2-040 8. 약속(Appointment)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-040 8. 약속(Appointment)_비교.mp3"}, {"id": "2-041", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "묘사", "badge": "41 묘사", "enQ": "What do people in your country usually wear? How do their clothes differ between work and home? Describe the fashion in your country in detail.", "enA": "That's an interesting one — Korean fashion is famous for moving fast. Whatever is trending, you'll see it on the streets of Seoul within a week. But the real answer is: it depends on where we are.\n\nAt work, most people go with business casual — neat shirts, slacks, nothing too flashy. The moment we get home, though, it's a complete transformation: hoodies, old t-shirts, and those baggy sweatpants with stretched-out knees that everyone owns but nobody shows.\n\nSo I'd say Koreans are two people in one closet: polished from nine to six, and wrapped in a blanket of comfort after seven. That's pretty much the fashion here — fast trends outside, pure comfort at home.", "koQ": "당신의 나라 사람들은 보통 어떤 옷을 입나요? 직장에서 입는 옷과 집에서 입는 옷은 어떻게 다른가요? 당신의 나라의 패션을 자세히 묘사해주세요.", "koA": "흥미로운 질문이네요. 한국 패션은 빨리 움직이기로 유명해요. 뭐든 유행하면 일주일 안에 서울 거리에서 볼 수 있죠. 근데 진짜 답은, 어디에 있느냐에 따라 달라요.\n\n직장에서는 대부분 비즈니스 캐주얼이에요. 깔끔한 셔츠에 슬랙스, 너무 화려하지 않게요. 그런데 집에 오는 순간 완전한 변신이 일어나죠. 후드티, 오래된 티셔츠, 그리고 무릎이 늘어난 헐렁한 트레이닝 바지요. 다들 갖고 있지만 아무도 안 보여주는 그 바지요.\n\n그러니까 한국인은 옷장 하나에 두 사람이 사는 셈이에요. 9시부터 6시까지는 말끔하게, 7시 이후에는 편안함의 이불을 두르고 있죠. 이게 한국 패션이에요. 밖에서는 빠른 유행, 집에서는 완전한 편안함!", "struct": [["1️⃣ 도입", "한국 패션 = 빠른 유행"], ["2️⃣ 회사", "비즈니스 캐주얼, 깔끔"], ["3️⃣ 집", "후드티 · 늘어난 트레이닝"], ["4️⃣ 대비", "옷장 하나에 두 사람"], ["5️⃣ 마무리", "밖은 유행, 집은 편안함"]], "scoring": [["대비 프레임", "직장 옷과 집 옷을 묻는 질문 자체가 이미 대비 구조예요 ✅ 9시~6시와 7시 이후로 시간을 나누면 답변의 목차가 저절로 완성되죠"], ["국민 공감 소품", "무릎 늘어난 트레이닝 바지는 전 세계가 공감하는 집 패션 소품이에요 😆 다들 있지만 아무도 안 보여준다는 한 줄이 웃음 포인트죠"], ["비유 한 방", "옷장 하나에 두 사람(two people in one closet) — 나라 전체의 패션을 비유 하나로 요약해요 ✨ 큰 질문일수록 비유가 무기예요"], ["수미상관", "빠른 유행으로 열고 밖은 유행, 집은 편안함으로 닫는 수미상관 구성이에요 🔑 첫 문장과 끝 문장이 짝을 이루면 답변이 단단해 보여요"]], "expr": [["That's an interesting one", "흥미로운 질문이네요", "리액션 도입 공식의 변주 🔁 😊"], ["trending", "유행 중인", "패션 주제 필수 단어 🔥"], ["business casual", "비즈니스 캐주얼", "직장 복장 만능 표현 ✅"], ["flashy", "화려한, 튀는", "nothing too flashy로 활용 ✨"], ["complete transformation", "완전한 변신", "회사 ↔ 집 대비의 신호탄 🎭"], ["sweatpants", "트레이닝 바지", "집 패션의 상징 소품 😆"], ["stretched-out", "늘어난", "무릎 나온 바지 디테일 묘사 📏"], ["two people in one closet", "옷장 속 두 사람", "이 페이지의 시그니처 비유 ✨"], ["polished", "말끔한, 다듬어진", "출근 복장 한 단어 요약 🔑"], ["wrapped in a blanket", "이불을 두른", "편안함의 감각 비유 💕"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-041 9. 패션(Fashion)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-041 9. 패션(Fashion)_묘사.mp3"}, {"id": "2-042", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "습관", "badge": "42 습관", "enQ": "How do you usually choose what to wear every day? Where do you normally buy your clothes, and how often do you go clothes shopping? Tell me about your habits.", "enA": "My system is simple, so let me walk you through it. Everything starts the night before: right before my eleven o'clock phone rule kicks in, I check the weather app and set out tomorrow's clothes. Morning-me is not a decision maker!\n\nChoosing is easy anyway, because I have a uniform: a plain t-shirt, jeans, and white sneakers — my everyday armor. As for shopping, I usually hit the SPA brands at the mall near the station, once a season or so. And I do what I always do there: hunt for deals on the sale rack first.\n\nMy golden rule: never buy something just because it's cheap — it has to match the uniform. Simple closet, zero morning stress — that's pretty much my clothing routine, and it never gets old.", "koQ": "매일 입을 옷을 보통 어떻게 고르나요? 옷은 주로 어디에서 사고, 얼마나 자주 옷 쇼핑을 하러 가나요? 당신의 습관에 대해 말해주세요.", "koA": "제 시스템은 단순해요. 차근차근 알려드릴게요. 모든 건 전날 밤에 시작돼요. 11시 폰 규칙이 시작되기 직전에 날씨 앱을 확인하고 내일 입을 옷을 꺼내두죠. 아침의 저는 결정을 내릴 수 있는 사람이 아니거든요!\n\n고르는 건 어차피 쉬워요. 저만의 유니폼이 있거든요. 무지 티셔츠, 청바지, 흰 스니커즈. 저의 일상 갑옷이죠. 쇼핑은 보통 역 근처 쇼핑몰의 SPA 브랜드에 가요. 계절에 한 번 정도요. 그리고 거기서도 늘 하던 대로 세일 매대부터 특가 사냥을 하죠.\n\n저의 황금률은, 싸다고 사지 않기예요. 유니폼과 어울려야만 사요. 단순한 옷장, 아침 스트레스 제로. 이게 제 옷 루틴이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 준비", "전날 밤 날씨 앱 + 옷 준비"], ["2️⃣ 시스템", "유니폼 = 티 · 청바지 · 흰 신발"], ["3️⃣ 쇼핑", "역 쇼핑몰 SPA, 계절 1회"], ["4️⃣ 사냥", "세일 매대 특가 사냥 먼저"], ["5️⃣ 규칙", "싸도 유니폼과 안 맞으면 패스"]], "scoring": [["전날 밤 전략", "어떻게 고르나에는 전날 밤 준비로 답하세요 🔑 11시 폰 룰 직전이라는 디테일로 돌발 휴대폰 편 루틴과도 자연스럽게 이어져요 🔁"], ["유니폼 개념", "매일 뭘 입을지 고민하는 대신 유니폼 하나로 답하는 발상이 신선해요 ✨ 아침의 나는 결정을 못 한다는 유머가 이유까지 설명해 주죠"], ["세 질문 커버", "어떻게 고르나(전날 밤) → 어디서 사나(역 쇼핑몰 SPA) → 얼마나 자주(계절 1회). 질문 세 개에 하나씩 정확히 답하는 구조예요 ✅"], ["쇼핑 편 연결", "세일 매대 특가 사냥은 서베이 쇼핑 편의 시그니처 소재 그대로예요 🔁 🎓 주제가 바뀌어도 캐릭터의 습관은 변하지 않아야 진짜죠"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["the night before", "전날 밤에", "준비 습관의 시간 배경 ⏰"], ["kick in", "시작되다, 발동하다", "11시 룰과 연결되는 동사 🔁 🌙"], ["set out", "꺼내 놓다", "옷 미리 준비하는 동사 ✅"], ["Morning-me", "아침의 나", "나를 둘로 나누는 유머 😆"], ["uniform", "유니폼, 고정 조합", "매일 옷 고민 끝내는 개념 🔑"], ["armor", "갑옷", "일상 갑옷 = 옷 비유 ✨"], ["once a season", "계절에 한 번", "쇼핑 빈도 답변 표현 ⏰"], ["hunt for deals", "특가를 사냥하다", "서베이 쇼핑 편 재활용 🔁 🔥"], ["golden rule", "황금률", "습관 공식 단골 🔁"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-042 9. 패션(Fashion)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-042 9. 패션(Fashion)_습관.mp3"}, {"id": "2-043", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "취향", "badge": "43 취향", "enQ": "What style of clothes do you like to wear, and why? Do you prefer comfortable casual clothes or more formal outfits? Tell me about your fashion taste.", "enA": "If I had to choose, comfortable casual wins, no contest. For me, it's all about how clothes feel, not how they look. My style in three words? Simple, soft, and stress-free.\n\nI'd pick a hoodie over a blazer any day. Formal clothes always feel like a costume to me — I spend the whole evening checking my collar instead of enjoying myself. Don't get me wrong — I clean up for weddings and big days, and honestly it feels great for about an hour. Then all I can think about is my sweatpants waiting at home!\n\nNothing beats changing into a soft hoodie after a long day — it's like a hug you can wear. In a nutshell: formal clothes impress other people, but comfortable clothes take care of me.", "koQ": "어떤 스타일의 옷을 즐겨 입고, 그 이유는 무엇인가요? 편한 캐주얼 옷과 격식 있는 옷 중 무엇을 선호하나요? 당신의 패션 취향에 대해 말해주세요.", "koA": "골라야 한다면 편한 캐주얼 승리예요. 고민할 것도 없죠. 저한테 옷의 핵심은 어떻게 보이느냐가 아니라 어떤 느낌이냐거든요. 제 스타일을 세 단어로요? 심플, 부드러움, 스트레스 프리!\n\n블레이저보다는 무조건 후드티예요. 격식 있는 옷은 저한테 늘 무대 의상처럼 느껴져요. 즐기기는커녕 저녁 내내 옷깃만 확인하게 되거든요. 오해는 마세요. 결혼식이나 큰 행사 땐 저도 갖춰 입고, 솔직히 한 시간 정도는 기분도 좋아요. 그다음부터는 집에서 기다리는 트레이닝 바지 생각뿐이지만요!\n\n긴 하루 끝에 부드러운 후드티로 갈아입는 순간만 한 게 없어요. 입을 수 있는 포옹 같달까요. 한마디로, 격식 있는 옷은 남에게 잘 보이고, 편한 옷은 나를 돌봐줘요.", "struct": [["1️⃣ 선택", "편한 캐주얼, no contest"], ["2️⃣ 핵심", "옷은 느낌 — 심플 · 소프트"], ["3️⃣ 대비", "격식 옷 = 무대 의상"], ["4️⃣ 양보", "결혼식 땐 한 시간만 멋짐"], ["5️⃣ 명언", "격식은 남을, 편함은 나를"]], "scoring": [["3단어 요약", "스타일을 심플 · 소프트 · 스트레스 프리 세 단어로 요약하며 시작하면 취향이 또렷하게 들려요 ✅ 셋 나열은 언제나 옳아요"], ["감각 비유", "입을 수 있는 포옹(a hug you can wear) — 후드티의 편안함을 감각 비유 하나로 전달해요 💕 형용사 열 개보다 비유 하나가 강력하죠"], ["양보의 기술", "결혼식 땐 한 시간 정도 기분 좋다는 솔직한 양보가 답변의 균형을 잡아요 😆 그다음은 트레이닝 바지 생각뿐이라는 반전 유머까지!"], ["대구 마무리", "격식 있는 옷은 남을 위해, 편한 옷은 나를 위해 — 대구 명언 마무리는 취향 편의 전통이에요 💬 🎓 통째로 외워서 응용하세요"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식 🔁 ✨"], ["stress-free", "스트레스 없는", "스타일 3단어 요약의 마무리 ✅"], ["A over B any day", "B보다 무조건 A", "후드티 vs 블레이저 취향 공식 🔁"], ["costume", "무대 의상", "격식 옷의 어색함 비유 🎭"], ["clean up", "갖춰 입다", "격식 차림의 캐주얼 표현 🔑"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["a hug you can wear", "입을 수 있는 포옹", "후드티의 시그니처 비유 💕"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-043 9. 패션(Fashion)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-043 9. 패션(Fashion)_취향.mp3"}, {"id": "2-044", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "과거 경험", "badge": "44 과거 경험", "enQ": "Tell me about the last time you went shopping for clothes. Where did you go, and what did you end up buying? Describe that day in detail.", "enA": "This reminds me of last month, when my best friend and I went to the mall near the station. My mission was simple: one pair of jeans, in and out, thirty minutes. Famous last words!\n\nRight at the entrance, out of nowhere, we ran into a seventy-percent-off winter sale. My deal-hunting instinct just took over. I tried on coats for almost an hour, and guess what — I ended up with a long gray coat I absolutely love... and completely forgot the jeans. My friend still laughs about it — I remembered them on the bus home!\n\nStill, it worked out fine: that coat became my favorite thing in my closet, and I got the jeans online that night. Since then, I always write a shopping list in my phone before entering the mall. Not that I always follow it!", "koQ": "마지막으로 옷을 사러 갔던 때에 대해 말해주세요. 어디에 갔고, 결국 무엇을 샀나요? 그날에 대해 자세히 묘사해주세요.", "koA": "지난달이 떠오르네요. 절친과 역 근처 쇼핑몰에 갔어요. 미션은 단순했죠. 청바지 한 벌, 들어갔다 바로 나오기, 30분 컷. 그 말이 무색해질 줄은 몰랐지만요!\n\n입구에서부터 난데없이 겨울 옷 70% 세일과 마주쳤어요. 특가 사냥 본능이 저를 지배해버렸죠. 거의 한 시간 동안 코트를 입어봤는데, 세상에, 결국 완전 마음에 드는 롱 그레이 코트를 들고 나왔어요... 그리고 청바지는 완전히 까먹었죠. 절친은 아직도 그 얘기로 웃어요. 집 가는 버스에서야 생각났거든요!\n\n그래도 결국 다 잘 풀렸어요. 그 코트는 제 옷장 최애가 됐고, 청바지는 그날 밤 온라인으로 샀죠. 그 뒤로는 쇼핑몰에 들어가기 전에 꼭 폰 메모에 쇼핑 리스트를 적어요. 물론 항상 지키는 건 아니지만요!", "struct": [["1️⃣ 도입", "지난달, 미션은 청바지"], ["2️⃣ 반전", "입구에서 70% 세일 조우"], ["3️⃣ 결과", "코트 득템, 청바지 까먹음"], ["4️⃣ 감정", "절친은 아직도 웃는 중"], ["5️⃣ 교훈", "쇼핑 전 폰 메모 리스트"]], "scoring": [["계획 붕괴 유머", "30분 컷 계획 → 한 시간 코트 시착. 계획이 무너지는 구조 자체가 웃음 포인트예요 😆 Famous last words가 예고편 역할을 하죠"], ["본능 의인화", "특가 사냥 본능이 저를 지배했다는 의인화 한 줄로 세일 앞의 심리가 생생해져요 🔥 서베이 쇼핑 편 캐릭터의 재등장이기도 해요 🔁"], ["질문 표현 회수", "질문의 end up buying을 답변에서 ended up with로 되받으면 질문을 정확히 들었다는 신호가 돼요 ✅ 은근한 고득점 기술이에요"], ["가벼운 교훈", "쇼핑 리스트 룰로 닫되 항상 지키진 않는다는 솔직함을 한 스푼 — 교훈이 너무 비장하지 않아야 이야기가 사랑스러워요 😊"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["in and out", "들어갔다 바로 나오기", "빠른 쇼핑 계획 표현 ⏰"], ["Famous last words!", "그 말이 무색하게!", "계획 붕괴 예고 유머 😆"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["run into ~", "~과 마주치다", "우연한 발견의 동사 ✨"], ["take over", "지배하다, 장악하다", "특가 본능이 나를 지배 🔥"], ["deal-hunting", "특가 사냥", "서베이 쇼핑 편 재활용 🔁 💳"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["end up with ~", "결국 ~을 갖게 되다", "질문 속 표현 그대로 회수 ✅"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식 🔁 🔑"]], "audio": "audio/2_돌발/2-044 9. 패션(Fashion)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-044 9. 패션(Fashion)_과거 경험.mp3"}, {"id": "2-045", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "비교", "badge": "45 비교", "enQ": "Compare the fashion of the past with the fashion of today. What styles were popular when you were young, and what do people wear now? Tell me about the changes.", "enA": "Back then, when I was in school, fashion was all about matching everyone else. We used to wear the same brand of padded jackets — in winter, the whole classroom looked like a penguin colony! If one item was trendy, literally everyone had it.\n\nThese days, it's a completely different story. People dress to stand out, not to fit in: vintage shops, online brands, personal color tests — everyone builds their own style. Compared to my school days, fashion now is way more diverse, and comfort finally matters as much as looks.\n\nBut I have to admit, there was something sweet about those identical padded jackets. Wearing the same thing as your friends felt like being on one team — a little silly, but warm, if you ask me.", "koQ": "과거의 패션과 오늘날의 패션을 비교해주세요. 당신이 어렸을 때는 어떤 스타일이 유행했고, 지금 사람들은 무엇을 입나요? 그 변화에 대해 말해주세요.", "koA": "그때, 그러니까 제가 학생일 때 패션의 핵심은 남들과 맞추기였어요. 다들 같은 브랜드 패딩을 입곤 했죠. 겨울이면 교실 전체가 펭귄 무리처럼 보였어요! 아이템 하나가 유행하면 말 그대로 전원이 갖고 있었죠.\n\n요즘은 완전히 다른 이야기예요. 사람들은 묻어가려고가 아니라 돋보이려고 입어요. 빈티지 숍, 온라인 브랜드, 퍼스널 컬러 테스트까지. 모두가 자기만의 스타일을 만들죠. 학창 시절과 비교하면 지금 패션은 훨씬 다양하고, 드디어 편안함도 외모만큼 중요해졌어요.\n\n하지만 인정할 건 인정해야죠. 그 똑같은 패딩에는 뭔가 따뜻한 게 있었어요. 친구들과 같은 옷을 입는 건 한 팀이 된 기분이었거든요. 조금 우습지만, 제 생각엔 따뜻했어요.", "struct": [["1️⃣ 과거", "전원 같은 브랜드 패딩"], ["2️⃣ 장면", "겨울 교실 = 펭귄 무리"], ["3️⃣ 현재", "빈티지 · 퍼스널 컬러 · 개성"], ["4️⃣ 대비", "맞추기 vs 돋보이기"], ["5️⃣ 마무리", "같은 패딩의 소속감 그리움"]], "scoring": [["펭귄 한 방", "겨울 교실이 펭귄 무리 같았다는 비유 하나로 그 시절 유행이 그림처럼 전달돼요 😆 비교의 과거 장면은 비유로 여세요"], ["반대말 콤보", "fit in(묻어가기) vs stand out(돋보이기) — 반대말 한 쌍이 과거와 현재의 차이를 한 줄로 요약해요 🔑 어휘력 어필 포인트!"], ["변화 축 두 개", "획일 → 개성, 외모 → 편안함. 변화의 축을 두 개로 정리하면 그 변화(changes)에 구조적으로 답할 수 있어요 ✅"], ["소속감 마무리", "똑같은 패딩 = 한 팀의 소속감이라는 그리움 마무리 — 우습지만 따뜻했다는 균형이 시리즈 공통 공식이에요 🔁 😊"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["penguin colony", "펭귄 무리", "교실 패딩 시절 비유 😆"], ["literally", "말 그대로", "과장 강조 구어체 부사 🔥"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["stand out", "돋보이다", "fit in의 반대말 세트 🔑"], ["fit in", "어울리다, 묻어가다", "stand out과 대비 콤보 🔑"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["way more ~", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"], ["being on one team", "한 팀이 된 기분", "소속감을 그리는 마무리 표현 💕"]], "audio": "audio/2_돌발/2-045 9. 패션(Fashion)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-045 9. 패션(Fashion)_비교.mp3"}, {"id": "2-046", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "묘사", "badge": "46 묘사", "enQ": "You indicated in the survey that you are looking for a job. What kind of job are you preparing for? What does that job involve? Tell me in detail.", "enA": "Yes, that's right — I'm preparing for my next chapter. I have an office job now, but I'm working toward moving into content marketing. Simply put, it's about telling a brand's story so well that people actually want to listen.\n\nWhat does it involve? Quite a lot, actually: planning social media posts, writing copy — the short, catchy lines you see in ads — and reading the data to see what people love. It's a job where you create something in the morning and get feedback from the world by evening.\n\nWhy this job? Honestly, it started with my YouTube habit: I kept analyzing why certain videos hook people. One day I realized — I don't just enjoy this stuff, I want to make it. So I'm moving in that direction, one evening at a time. That's the goal.", "koQ": "당신은 설문조사에서 구직 중이라고 답했습니다. 어떤 직업을 준비하고 있나요? 그 직업은 어떤 일을 하나요? 자세히 말해주세요.", "koA": "네, 맞아요. 저는 지금 저의 다음 챕터를 준비하고 있어요. 지금도 사무직으로 일하고 있지만, 콘텐츠 마케팅 쪽으로 옮기려고 준비 중이거든요. 간단히 말해, 사람들이 정말 듣고 싶어지게 브랜드의 이야기를 들려주는 일이에요.\n\n무슨 일을 하냐고요? 생각보다 많아요. SNS 게시물 기획, 광고에서 보이는 짧고 착 붙는 문구인 카피 쓰기, 그리고 사람들이 뭘 좋아하는지 데이터 읽기까지요. 아침에 만든 걸 저녁이면 세상의 반응으로 확인하는 일이죠.\n\n왜 이 직업이냐고요? 솔직히 유튜브 습관에서 시작됐어요. 어떤 영상이 왜 사람들을 사로잡는지 자꾸 분석하고 있더라고요. 어느 날 깨달았죠. 나는 이걸 즐기는 게 아니라 만들고 싶어 하는구나. 그래서 매일 저녁 조금씩, 그 방향으로 나아가고 있어요. 그게 제 목표예요.", "struct": [["1️⃣ 선언", "다음 챕터 = 콘텐츠 마케팅"], ["2️⃣ 정의", "브랜드 이야기 들려주기"], ["3️⃣ 업무", "SNS 기획 · 카피 · 데이터"], ["4️⃣ 계기", "유튜브 분석 습관에서 출발"], ["5️⃣ 마무리", "매일 저녁 조금씩 전진"]], "scoring": [["설문 회수", "질문의 설문에서 구직 중이라 답했다를 Yes, that's right로 받으며 시작하면 자연스러워요 ✅ 설문 언급형 질문의 정석 오프닝이죠"], ["직업 정의 한 줄", "콘텐츠 마케팅을 브랜드 이야기를 듣고 싶게 들려주는 일로 정의해요 🔑 전문 용어보다 쉬운 한 줄 정의가 훨씬 IH답게 들려요"], ["업무 3종 세트", "SNS 기획 · 카피 쓰기 · 데이터 읽기. involve 질문에는 업무 세 개 나열이 정답 구조예요 ✅ 카피처럼 용어엔 짧은 설명을 붙이세요"], ["계기 스토리", "유튜브를 즐기다가 만들고 싶어졌다는 계기 — 시리즈의 유튜브 최애 설정이 직업 선택의 근거로 변신해요 🔁 🎓"]], "expr": [["next chapter", "다음 챕터", "이직 준비를 긍정적으로 표현 ✨"], ["work toward ~", "~을 향해 나아가다", "준비 중을 세련되게 말하기 🔑"], ["content marketing", "콘텐츠 마케팅", "준비 중인 직업 키워드 ✅"], ["simply put", "간단히 말해", "어려운 개념 설명 시작 신호 💬"], ["involve", "(일이) ~을 수반하다", "질문 속 동사 그대로 회수 ✅"], ["copy", "광고 문구, 카피", "직무 설명 전문 용어 🔑"], ["catchy", "착 붙는, 귀에 남는", "카피의 성질 한 단어 🔥"], ["get feedback", "반응을 얻다", "일의 매력 설명 표현 📊"], ["hook", "사로잡다", "유튜브 알고리즘 소재 연결 🔁 🎵"], ["one evening at a time", "하루 저녁씩 차근차근", "꾸준함을 그리는 마무리 💪"], ["That's the goal.", "그게 목표예요", "묘사 마무리의 담백한 선언 ✅"]], "audio": "audio/2_돌발/2-046 10. 직업(Jobs)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-046 10. 직업(Jobs)_묘사.mp3"}, {"id": "2-047", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "습관", "badge": "47 습관", "enQ": "Describe your typical day while preparing for a job. What do you usually do to get ready - studying, writing resumes, or preparing for interviews? Tell me about your daily routine.", "enA": "Since I work during the day, my job prep lives in the evenings — let me walk you through it. After my jog and dinner, I sit on my gray sofa and take a thirty-minute online course on marketing. Short, but every single day.\n\nAbout twice a week comes the real work: updating my portfolio. I practice writing catchy copy for products I love — like my favorite earbuds. And weekend mornings are for the heavy stuff: I take my laptop to Moon, my favorite cafe, order an iced americano, and polish my resume there. Somehow it feels less painful with good coffee!\n\nMy golden rule is 'one line a day': even on my laziest day, I add at least one line to something. Small steps, but they add up — that's pretty much my prep routine, and it never gets old.", "koQ": "취업을 준비하는 일반적인 하루를 설명해주세요. 공부, 이력서 작성, 면접 준비 중 주로 무엇을 하며 준비하나요? 당신의 하루 루틴에 대해 말해주세요.", "koA": "낮에는 일을 하니까 취업 준비는 저녁에 살아요. 차근차근 보여드릴게요. 조깅과 저녁 식사 후에 회색 소파에 앉아 30분짜리 마케팅 온라인 강의를 들어요. 짧지만, 하루도 빠짐없이요.\n\n일주일에 두 번 정도는 진짜 작업을 해요. 포트폴리오 업데이트요. 최애 이어폰처럼 제가 좋아하는 제품의 착 붙는 카피를 직접 써보는 연습이죠. 그리고 주말 아침은 무거운 일 담당이에요. 노트북을 들고 최애 카페 문(Moon)에 가서 아아를 시키고 이력서를 다듬어요. 좋은 커피와 함께라면 왠지 덜 고통스럽거든요!\n\n저의 황금률은 하루에 한 줄이에요. 가장 게으른 날에도 뭐라도 한 줄은 더해요. 작은 걸음이지만 쌓이거든요. 이게 제 준비 루틴이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "준비는 저녁에 산다"], ["2️⃣ 평일", "소파에서 30분 강의 매일"], ["3️⃣ 주중", "주 2회 포트폴리오 카피 연습"], ["4️⃣ 주말", "문(Moon) 카페에서 이력서"], ["5️⃣ 규칙", "하루에 한 줄 골든룰"]], "scoring": [["시간대 분배", "평일 저녁 30분 강의 → 주 2회 포트폴리오 → 주말 카페 이력서. 시간대별 분배가 루틴 질문의 정석 구조예요 ✅"], ["질문 3종 회수", "질문이 준 공부 · 이력서 · 면접 준비 중 공부(강의)와 이력서(카페)를 콕 집어 답하니 빠짐이 없어요 🔑 선택지는 회수하라고 주는 거예요"], ["무대 재활용", "회색 소파, 조깅 후 저녁, 문(Moon) 카페 아아 — 시리즈의 무대에서 취업 준비까지 하는 셈이에요 🔁 🎓 새 주제도 아는 장소에서 벌어지죠"], ["룰 네이밍", "하루에 한 줄(one line a day)처럼 나만의 룰에 이름을 붙이면 평범한 꾸준함도 특별하게 들려요 ✨ 습관 답변의 마무리 감초예요"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["every single day", "하루도 빠짐없이", "꾸준함 강조 표현 💪"], ["portfolio", "포트폴리오", "취업 준비 필수 어휘 ✅"], ["catchy copy", "착 붙는 카피", "직업 묘사 편 직무와 연결 🔁"], ["the heavy stuff", "무거운 일", "주말 몫 작업 캐주얼 표현 😆"], ["polish", "다듬다", "이력서 수정의 고급 동사 🔑"], ["less painful", "덜 고통스러운", "커피 + 이력서 유머 ☕"], ["golden rule", "황금률", "습관 공식 단골 🔁"], ["one line a day", "하루에 한 줄", "나만의 룰 네이밍 ✨"], ["add up", "쌓이다", "작은 노력의 축적 동사 📊"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-047 10. 직업(Jobs)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-047 10. 직업(Jobs)_습관.mp3"}, {"id": "2-048", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "취향", "badge": "48 취향", "enQ": "What kind of company or job do you want to work for, and why? What is the most important thing to you when choosing a job - the salary, the work-life balance, or the work itself? Tell me the reasons.", "enA": "If I had to choose among the three, work-life balance wins — no contest. Of course I want a good salary and interesting work, but for me, it's all about having a life outside the office.\n\nI'd pick balance over a bigger paycheck any day. Here's my logic: my evening jog, cooking, calls with my mom — those little routines are what keep me sane and happy. A job that eats my evenings basically eats me. Don't get me wrong — the work itself matters too; that's exactly why I'm preparing for a job I'd actually enjoy. But even a dream job needs to leave room for dinner!\n\nSo my ideal company? One that believes rested people do better work. In a nutshell: salary fills my wallet, but balance fills my life.", "koQ": "어떤 회사나 직업에서 일하고 싶고, 그 이유는 무엇인가요? 직업을 고를 때 연봉, 워라밸, 일 자체 중 무엇이 가장 중요한가요? 그 이유를 말해주세요.", "koA": "셋 중에 골라야 한다면 워라밸 승리예요. 고민할 것도 없죠. 물론 좋은 연봉도 재미있는 일도 원하지만, 저한테 핵심은 회사 밖의 삶이 있느냐거든요.\n\n더 큰 월급보다는 무조건 균형이에요. 제 논리는 이래요. 저녁 조깅, 요리, 엄마와의 통화. 그 작은 루틴들이 절 제정신으로, 행복하게 지켜주거든요. 제 저녁을 잡아먹는 직장은 결국 저를 잡아먹는 거예요. 오해는 마세요. 일 자체도 중요해요. 그래서 진짜 즐길 수 있는 일을 준비하는 거고요. 하지만 꿈의 직장도 저녁 먹을 자리는 남겨줘야죠!\n\n그래서 제 이상적인 회사요? 잘 쉰 사람이 일도 잘한다고 믿는 곳이요. 한마디로, 연봉은 지갑을 채우지만 균형은 삶을 채워요.", "struct": [["1️⃣ 선택", "워라밸 승리, no contest"], ["2️⃣ 핵심", "회사 밖의 삶이 있느냐"], ["3️⃣ 논리", "저녁을 먹으면 나를 먹는다"], ["4️⃣ 양보", "일 자체도 중요 — 그래서 이직"], ["5️⃣ 명언", "연봉은 지갑, 균형은 삶"]], "scoring": [["3지선다 정석", "연봉 · 워라밸 · 일 자체를 셋 다 언급한 뒤 하나를 고르는 공식 — 호텔 · 인터넷 취향 편과 같은 구조예요 🔁 ✅"], ["근거 = 루틴", "조깅 · 요리 · 엄마 통화 등 시리즈의 저녁 루틴 전체가 워라밸 선택의 근거로 총출동해요 🔁 🎓 페르소나가 논리가 되는 순간이죠"], ["재치 동사", "저녁을 잡아먹는 직장은 나를 잡아먹는다(eat my evenings) — 동사 하나를 비틀면 야근 이야기도 재치 있게 들려요 🎭"], ["대구 마무리", "연봉은 지갑을 채우고 균형은 삶을 채운다(fills my wallet / fills my life) — 취향 편 전통의 대구 명언 마무리예요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "3지선다 취향 도입 공식 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["work-life balance", "워라밸", "직업 취향 필수 어휘 ✅"], ["paycheck", "월급", "salary의 구어체 짝꿍 💳"], ["keep me sane", "제정신으로 지켜주다", "습관 공식 단골 표현 재활용 🔁 😆"], ["eat my evenings", "저녁을 잡아먹다", "야근을 그리는 재치 동사 🎭"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["leave room for ~", "~할 여지를 남기다", "꿈의 직장도 저녁은 남겨야 ✨"], ["rested", "잘 쉰", "이상적 회사관 키워드 🔑"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 💬"]], "audio": "audio/2_돌발/2-048 10. 직업(Jobs)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-048 10. 직업(Jobs)_취향.mp3"}, {"id": "2-049", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "과거 경험", "badge": "49 과거 경험", "enQ": "Tell me about a memorable experience you had while looking for a job. Was it a job interview or a part-time job you tried? What happened, and how did you feel?", "enA": "This reminds me of my very first job interview — a part-time position at a coffee shop back in my university days. I was so nervous that morning: I rehearsed answers on the bus, and my hands were shaking at the door.\n\nThe interview started stiff — until, out of nowhere, the owner closed my resume and asked: 'So, what's YOUR favorite coffee?' And guess what — I completely lit up. I gave a passionate three-minute speech about iced americanos, and she burst out laughing. I got a call that same evening: I was hired.\n\nThat day taught me something I still believe: an interview isn't a test, it's a conversation. It all worked out fine, and since then, whenever I get nervous before something big, I just remember — they don't want perfect answers. They want me.", "koQ": "구직 활동을 하면서 겪은 기억에 남는 경험에 대해 말해주세요. 면접이었나요, 아니면 해봤던 아르바이트였나요? 무슨 일이 있었고, 어떤 기분이 들었나요?", "koA": "제 생애 첫 면접이 떠오르네요. 대학 시절 커피숍 아르바이트 면접이었어요. 그날 아침 얼마나 긴장했는지, 버스에서 답변을 리허설하고 문 앞에서는 손이 떨리고 있었죠.\n\n면접은 딱딱하게 시작됐어요. 그런데 난데없이 사장님이 제 이력서를 덮더니 물으셨죠. 그래서, 본인이 제일 좋아하는 커피는 뭐예요? 그리고 있잖아요, 저는 완전히 살아났어요. 아이스 아메리카노에 대해 3분짜리 열변을 토했고, 사장님은 빵 터지셨죠. 그날 저녁 바로 전화가 왔어요. 합격이었죠.\n\n그날 배운 걸 지금도 믿어요. 면접은 시험이 아니라 대화라는 거요. 결국 다 잘 풀렸고, 그 뒤로는 큰일을 앞두고 긴장될 때마다 떠올려요. 그들이 원하는 건 완벽한 답이 아니라 나라는 사람이라는 걸요.", "struct": [["1️⃣ 도입", "생애 첫 알바 면접"], ["2️⃣ 긴장", "버스 리허설 · 떨리는 손"], ["3️⃣ 반전", "최애 커피가 뭐예요?"], ["4️⃣ 절정", "아아 3분 열변 → 합격 전화"], ["5️⃣ 교훈", "면접은 시험 아닌 대화"]], "scoring": [["선택지 활용", "면접이냐 알바냐 묻는 질문엔 알바 면접으로 답하면 두 선택지를 한 번에 커버해요 ✅ 질문의 or는 합쳐도 된다는 힌트예요"], ["감정 곡선", "떨리는 손 → 완전히 살아남 → 빵 터진 웃음 → 합격 전화. 감정의 오르내림이 how did you feel의 진짜 정답이에요 💓"], ["아아 재활용", "아이스 아메리카노 열변은 시리즈 최애 음료 설정 그대로예요 🔁 ☕ 취향 하나가 면접 합격의 열쇠가 되는 구성이 사랑스럽죠"], ["교훈 명언", "면접은 시험이 아니라 대화 — 구직 경험의 교훈을 명언 한 줄로 승화하면 since then 마무리의 격이 올라가요 💬 🎓"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["rehearse", "리허설하다", "면접 긴장 묘사 동사 🎭"], ["shaking", "떨리는", "긴장을 몸으로 보여주기 💓"], ["stiff", "딱딱한, 경직된", "면접 초반 분위기 한 단어 ✅"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["light up", "(표정이) 환해지다", "긴장 → 신남 전환 동사 ✨"], ["burst out laughing", "빵 터지다", "웃음 장면 필수 표현 😆"], ["hired", "채용된", "합격 소식 한 단어 ✅"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식 🔁 🔑"]], "audio": "audio/2_돌발/2-049 10. 직업(Jobs)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-049 10. 직업(Jobs)_과거 경험.mp3"}, {"id": "2-050", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "비교", "badge": "50 비교", "enQ": "Compare looking for a job these days with the past. How has the way people find jobs changed over the years? What are the biggest differences?", "enA": "Back then — I mean, in my parents' generation — job hunting used to be a paper business. People circled listings in newspapers, printed resumes, and mailed them one by one. My mom says she once waited three weeks just to hear back from one company!\n\nThese days, it's a completely different story. Everything happens online: job platforms, one-click applications, even video interviews from your living room. Compared to the paper days, finding openings is way more convenient — you can apply to ten companies in one evening. And your portfolio matters as much as your diploma now.\n\nBut I have to admit, faster isn't always easier — more clicks also means more competition. Still, one thing never changed, if you ask me: in the end, someone across the table has to like who you are.", "koQ": "요즘의 구직 활동과 과거를 비교해주세요. 시간이 지나며 사람들이 일자리를 찾는 방식은 어떻게 변화했나요? 가장 큰 차이점은 무엇인가요?", "koA": "그때는, 그러니까 부모님 세대에는 구직 활동이 종이의 일이었어요. 신문 구인란에 동그라미를 치고, 이력서를 인쇄해서 한 통씩 우편으로 보냈죠. 엄마 말로는 회사 한 곳의 답을 듣는 데 3주를 기다린 적도 있대요!\n\n요즘은 완전히 다른 이야기죠. 모든 게 온라인에서 일어나요. 채용 플랫폼, 클릭 한 번 지원, 심지어 거실에서 보는 화상 면접까지요. 종이 시절과 비교하면 공고 찾기가 훨씬 편해요. 하루 저녁에 열 군데도 지원할 수 있으니까요. 그리고 이젠 졸업장만큼 포트폴리오가 중요해졌어요.\n\n하지만 인정할 건 인정해야죠. 빨라졌다고 쉬워진 건 아니에요. 클릭이 늘어난 만큼 경쟁도 늘었으니까요. 그래도 제 생각에 변하지 않은 게 하나 있어요. 결국엔 테이블 건너편의 누군가가 나라는 사람을 좋아해줘야 한다는 거요.", "struct": [["1️⃣ 과거", "신문 동그라미 · 우편 지원"], ["2️⃣ 장면", "엄마의 3주 기다림"], ["3️⃣ 현재", "플랫폼 · 원클릭 · 화상 면접"], ["4️⃣ 대비", "빨라진 만큼 경쟁도 증가"], ["5️⃣ 마무리", "변하지 않은 건 사람"]], "scoring": [["세대 프레임", "내가 모르는 과거는 부모님 세대 이야기로 여세요 ✅ 엄마의 3주 기다림처럼 들은 이야기도 훌륭한 비교 재료가 돼요"], ["소품 대비", "신문 동그라미 · 우편 이력서 vs 원클릭 · 화상 면접 — 소품 대 소품으로 붙이면 변화가 그림처럼 보여요 🔑 비교의 정석 기술이죠"], ["반전 인정", "빨라졌지만 경쟁도 늘었다는 한 줄이 단순 찬양을 균형 잡힌 분석으로 바꿔요 📊 가장 큰 차이 질문에 깊이를 더하는 포인트예요"], ["본질 마무리", "변하지 않은 건 결국 사람이 사람을 뽑는다는 것 — 기술 변화 비교를 본질 한 줄로 닫는 시리즈 공통 철학 마무리예요 💬 🎓"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["job hunting", "구직 활동", "looking for a job 동의어 🔑"], ["hear back from ~", "~에게서 답을 듣다", "지원 후 연락 표현 ⏰"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["one-click application", "원클릭 지원", "요즘 구직 디테일 소품 ✅"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["way more ~", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["opening", "공석, 채용 공고", "구직 주제 필수 명사 🔑"], ["I have to admit", "인정할 수밖에 없다", "균형 마무리 공식 🔁 😊"], ["across the table", "테이블 건너편의", "결국 사람이라는 마무리 무대 💬"]], "audio": "audio/2_돌발/2-050 10. 직업(Jobs)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-050 10. 직업(Jobs)_비교.mp3"}, {"id": "2-051", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "묘사", "badge": "51 묘사", "enQ": "Describe the place where you usually spend your free time. Where is it, and what does it look like? Why do you spend time there? Tell me in detail.", "enA": "That's an easy one — my free time lives at the riverside trail by the Han River, about ten minutes from my place. It's a long walking path with a jogging track, benches under the trees, and that wide-open view of the water.\n\nWhat does it look like? Picture this: joggers gliding by, couples with picnic mats, someone practicing guitar badly but happily. In the evening the city lights reflect on the river, and honestly, it turns into a free movie screen.\n\nWhy there? Because it's my all-in-one spot: I jog there, take my mom's calls there, and sort out my thoughts there. Ten minutes from my door, zero admission fee, new sky every day — that's pretty much my favorite place on Earth.", "koQ": "여가 시간을 주로 보내는 장소를 묘사해주세요. 어디에 있고, 어떻게 생겼나요? 왜 그곳에서 시간을 보내나요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 제 여가 시간은 집에서 10분 거리인 한강 강변 산책로에 살아요. 조깅 트랙이 있는 긴 산책길인데, 나무 아래 벤치들, 그리고 탁 트인 강 전망이 있죠.\n\n어떻게 생겼냐면, 상상해보세요. 미끄러지듯 달리는 조깅하는 사람들, 돗자리 편 커플들, 기타를 서툴지만 행복하게 연습하는 누군가요. 저녁이면 도시의 불빛이 강에 반사되는데, 솔직히 공짜 영화 스크린이 따로 없어요.\n\n왜 거기냐고요? 저의 올인원 장소거든요. 거기서 조깅하고, 엄마 전화도 받고, 생각도 정리해요. 집에서 10분, 입장료 0원, 매일 새로운 하늘. 이게 제가 지구에서 제일 좋아하는 장소예요.", "struct": [["1️⃣ 선언", "한강 강변 산책로, 10분"], ["2️⃣ 묘사", "트랙 · 벤치 · 탁 트인 강"], ["3️⃣ 장면", "조깅 · 돗자리 · 기타 연습"], ["4️⃣ 이유", "조깅 + 통화 + 생각 정리"], ["5️⃣ 마무리", "입장료 0원, 매일 새 하늘"]], "scoring": [["질문 3축 커버", "어디에(집에서 10분) → 어떻게 생겼나(트랙 · 벤치 · 강) → 왜(조깅 · 통화 · 생각 정리). 질문의 세 의문사에 하나씩 답하는 구조예요 ✅"], ["장면 스케치", "Picture this 뒤에 조깅하는 사람 · 돗자리 커플 · 기타 연습을 나열하면 장소가 사진처럼 살아나요 ✨ 사람이 장소를 그려줘요"], ["무대 재활용", "강변 산책로는 조깅 · 통화 · 이어폰 편까지 시리즈 최다 출연 무대예요 🔁 🎓 여가 장소 질문의 답으로 이보다 자연스러울 수 없죠"], ["숫자 마무리", "10분 · 0원 · 매일 새 하늘 — 숫자와 리듬으로 닫는 마무리가 애정을 증명해요 💕 장소 묘사의 필살 마무리 기술이에요"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["riverside trail", "강변 산책로", "시리즈 단골 무대 그 자체 🔁 🗺️"], ["Picture this:", "상상해보세요", "묘사를 여는 마법의 한 마디 ✨"], ["glide by", "미끄러지듯 지나가다", "조깅 장면을 그리는 동사 🏃"], ["reflect on ~", "~에 반사되다", "저녁 강 풍경 묘사 🌙"], ["free movie screen", "공짜 영화 스크린", "야경을 그리는 비유 🎬"], ["all-in-one spot", "올인원 장소", "기술 편 all-in-one 재활용 🔁 ✅"], ["sort out my thoughts", "생각을 정리하다", "장소의 정서적 효용 표현 🔑"], ["admission fee", "입장료", "입장료 0원 유머 재료 💳"], ["wide-open", "탁 트인", "전망 묘사 필수 형용사 ✅"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-051 11. 여가(Free Time)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-051 11. 여가(Free Time)_묘사.mp3"}, {"id": "2-052", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "습관", "badge": "52 습관", "enQ": "What do you usually do when you have free time? How do your weekday evenings differ from your weekends? Describe how you typically spend your free time.", "enA": "Sure — let me walk you through my free time. On weekday evenings, it's all about recharging alone: a jog along the river, a simple dinner I cook myself, then YouTube on my gray sofa. Quiet, simple, sacred.\n\nWeekends are a different animal: that's when people enter the picture. Saturday is usually for my best friend — coffee at Moon or chimaek at the pub — and Sunday evening always ends with my mom's call. And once in a while, a lazy hotel staycation resets everything.\n\nSo the pattern is simple: weekdays recharge my battery, weekends fill my heart. Two different modes, one happy me — that's pretty much it, and it never gets old.", "koQ": "여가 시간이 생기면 주로 무엇을 하나요? 평일 저녁과 주말은 어떻게 다른가요? 일반적으로 여가 시간을 어떻게 보내는지 설명해주세요.", "koA": "네, 제 여가 시간을 차근차근 보여드릴게요. 평일 저녁의 핵심은 혼자 재충전하기예요. 강변 조깅, 직접 만드는 간단한 저녁, 그리고 회색 소파에서 유튜브. 조용하고, 단순하고, 신성하죠.\n\n주말은 완전히 다른 동물이에요. 사람들이 등장하는 시간이거든요. 토요일은 보통 절친 몫이에요. 문(Moon)에서 커피를 마시거나 펍에서 치맥을 하죠. 그리고 일요일 저녁은 늘 엄마의 전화로 끝나요. 가끔은 게으른 호캉스가 모든 걸 리셋해주고요.\n\n그러니까 패턴은 단순해요. 평일은 배터리를 충전하고, 주말은 마음을 채워요. 두 개의 모드, 한 명의 행복한 나. 그게 다예요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "차근차근 예고 오프닝"], ["2️⃣ 평일", "조깅 · 요리 · 소파 유튜브"], ["3️⃣ 주말", "절친 토요일 · 엄마 일요일"], ["4️⃣ 가끔", "호캉스로 전체 리셋"], ["5️⃣ 마무리", "평일 충전, 주말 채움"]], "scoring": [["질문 대비 구조", "평일 저녁과 주말이 어떻게 다른가 — 질문이 준 대비를 혼자 vs 사람들로 번역하면 구조가 저절로 완성돼요 ✅"], ["모드 프레임", "재충전 모드와 마음 채우기 모드, 두 모드로 여가를 정리하면 흩어진 활동들이 하나의 시스템이 돼요 🔑 배터리 비유가 접착제예요"], ["시리즈 총집합", "조깅 · 요리 · 유튜브 · 문(Moon) · 치맥 · 엄마 통화 · 호캉스 — 시리즈 소재 총출동 페이지라 복습용으로도 최고예요 🔁 🎓"], ["대구 마무리", "평일은 배터리를 충전하고 주말은 마음을 채운다 — recharge와 fill의 대구가 습관 답변을 명언으로 닫아줘요 💬"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["recharge", "재충전하다", "혼자 시간의 목적 동사 🔋"], ["sacred", "신성한", "평일 저녁 루틴의 무게 ✨"], ["a different animal", "완전히 다른 것", "평일 vs 주말 전환 표현 🔥"], ["enter the picture", "등장하다", "사람들이 등장하는 주말 🎭"], ["chimaek", "치맥", "약속 편에 이어 문화 소개 🔁 🍺"], ["staycation", "호캉스", "약속 묘사 편 재활용 🔁 ✨"], ["reset", "리셋하다", "호캉스의 효용 한 단어 ✅"], ["fill my heart", "마음을 채우다", "battery와 대구 짝꿍 💕"], ["two different modes", "두 개의 모드", "평일 · 주말 요약 프레임 🧩"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-052 11. 여가(Free Time)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-052 11. 여가(Free Time)_습관.mp3"}, {"id": "2-053", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "취향", "badge": "53 취향", "enQ": "What is your favorite free-time activity, and why do you enjoy it? How did you come to like it? Tell me the reasons in detail.", "enA": "If I had to choose, it's my evening jog along the river — no contest. For me, it's all about that one hour when nobody needs me: just my sneakers, my playlist, and the water.\n\nHow did I get into it? A few years ago, I was out of shape and always tired — climbing the subway stairs left me breathless, and that was my wake-up call. The first week was rough: I couldn't run for even ten minutes! But I kept showing up, and slowly it became my thing. Now my legs start itching around seven.\n\nWhy do I love it? It clears my head better than anything else — problems shrink with every kilometer. Ever since that first breathless week, jogging has been my happy hour. In a nutshell: some people end the day with a drink; I end mine with a run.", "koQ": "가장 좋아하는 여가 활동은 무엇이고, 왜 그것을 즐기나요? 어떻게 그것을 좋아하게 되었나요? 그 이유를 자세히 말해주세요.", "koA": "골라야 한다면 강변 저녁 조깅이에요. 고민할 것도 없죠. 저한테 핵심은 아무도 절 찾지 않는 그 한 시간이에요. 운동화, 플레이리스트, 그리고 강물만 있으면 되죠.\n\n어떻게 좋아하게 됐냐고요? 몇 년 전에 체력이 바닥이라 늘 피곤했어요. 지하철 계단만 올라도 숨이 차더라고요. 그게 저의 경고음이었죠. 첫 주는 혹독했어요. 10분도 못 뛰었다니까요! 그래도 계속 나갔더니 어느새 저의 것이 됐어요. 이제는 7시쯤 되면 다리가 근질거려요.\n\n왜 좋아하냐고요? 뭐보다 머리가 맑아져요. 1km마다 고민이 작아지거든요. 그 숨차던 첫 주 이후로 조깅은 제 해피 아워예요. 한마디로, 어떤 사람들은 술 한잔으로 하루를 닫지만, 저는 달리기로 닫아요.", "struct": [["1️⃣ 선택", "저녁 강변 조깅, no contest"], ["2️⃣ 핵심", "아무도 날 찾지 않는 1시간"], ["3️⃣ 계기", "지하철 계단 wake-up call"], ["4️⃣ 성장", "10분도 못 뛰다 → 근질근질"], ["5️⃣ 명언", "술 대신 달리기로 하루 마감"]], "scoring": [["계기형 공식", "how did you come to like it가 보이면 계기형 문제예요 🔑 get into → wake-up call → become my thing 공식을 그대로 쓰세요 🔁"], ["바닥에서 시작", "10분도 못 뛰던 첫 주를 솔직하게 보여주면 지금의 애정이 훨씬 설득력 있어요 💪 취향의 역사는 낮은 곳에서 시작할수록 좋아요"], ["몸의 신호", "7시쯤 다리가 근질거린다 — 습관이 몸에 새겨졌다는 디테일이 좋아하는 이유를 증명해요 😆 말보다 몸이 정직하죠"], ["대구 마무리", "누군가는 술로, 나는 달리기로 하루를 닫는다 — 취향 편 전통의 대구 명언 마무리예요 💬 🎓 통째로 외워 둘 가치가 있어요"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식 🔁 ✨"], ["get into ~", "~에 빠지다", "계기형 공식 시작 동사 🔁"], ["out of shape", "체력이 바닥인", "운동 계기 단골 표현 💪"], ["breathless", "숨이 찬", "계단 장면의 감각 디테일 🏃"], ["wake-up call", "경고음, 각성 계기", "계기형 공식의 심장 🔁 ⏰"], ["become my thing", "나의 것이 되다", "계기형 공식 마무리 🔁 ✅"], ["legs start itching", "다리가 근질거리다", "습관이 된 몸의 신호 😆"], ["clear my head", "머리를 맑게 하다", "조깅의 효용 한 방 🔑"], ["ever since", "그 이후로 쭉", "계기형 연결 공식 🔁"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 💬"]], "audio": "audio/2_돌발/2-053 11. 여가(Free Time)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-053 11. 여가(Free Time)_취향.mp3"}, {"id": "2-054", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "과거 경험", "badge": "54 과거 경험", "enQ": "Tell me about a memorable time you had during your free time recently. What did you do, and who were you with? What made it special?", "enA": "This reminds me of two weekends ago. My best friend texted me at noon: 'River. Ramyeon. Thirty minutes.' No plan, no reservation — just a sunny Saturday and two lazy people deciding not to waste it.\n\nWe grabbed a mat, cooked instant noodles at the convenience store by the park, and camped by the water all afternoon. Then, out of nowhere, it started to pour! We sprinted under a bridge, soaked and laughing like kids. Guess what — that became the best part: we sat there under one umbrella, watching the rain hit the river, saying absolutely nothing.\n\nIt all worked out fine — the sun returned for a perfect sunset. What made it special? Zero planning. Since then, our motto is: the best plan is no plan. That rainy photo is still pinned in our group chat!", "koQ": "최근 여가 시간에 보낸 기억에 남는 시간에 대해 말해주세요. 무엇을 했고, 누구와 함께였나요? 무엇이 그것을 특별하게 만들었나요?", "koA": "2주 전 주말이 떠오르네요. 절친이 정오에 문자를 보냈어요. 강. 라면. 30분 뒤. 계획도 예약도 없이, 그냥 화창한 토요일과 그걸 낭비하지 않기로 한 게으른 두 사람이었죠.\n\n돗자리를 챙겨서 공원 옆 편의점에서 라면을 끓여 물가에서 오후 내내 놀았어요. 그런데 난데없이 비가 쏟아지기 시작한 거예요! 우리는 다리 밑으로 전력 질주했고, 쫄딱 젖은 채 애들처럼 웃었죠. 그런데 있잖아요, 그게 최고의 순간이 됐어요. 우산 하나를 나눠 쓰고 앉아서, 강에 떨어지는 비를 보면서, 아무 말도 안 했거든요.\n\n결국 다 잘 풀렸어요. 해가 돌아와서 완벽한 노을까지 봤죠. 뭐가 특별했냐고요? 계획이 없었다는 거요. 그 뒤로 우리의 모토는, 최고의 계획은 무계획이에요. 그 비 오는 날 사진은 아직도 단톡방에 고정되어 있어요!", "struct": [["1️⃣ 도입", "정오의 문자 — 강. 라면."], ["2️⃣ 전개", "돗자리 · 편의점 라면 · 물가"], ["3️⃣ 반전", "소나기 → 다리 밑 질주"], ["4️⃣ 절정", "우산 하나, 말 없는 빗소리"], ["5️⃣ 교훈", "최고의 계획은 무계획"]], "scoring": [["즉흥의 미학", "무엇이 특별했나 → 계획이 없었다는 것. 특별함의 이유를 반대로 뒤집는 답이 신선해요 ✨ 즉흥 이야기는 여가 편의 보석이죠"], ["반전의 온도", "소나기라는 사고가 우산 하나의 최고 장면으로 바뀌는 구조 — 나쁜 일이 최고가 되는 반전이 경험담의 정석이에요 🔁 🎭"], ["침묵 디테일", "아무 말 없이 비를 봤다는 디테일이 우정의 깊이를 설명 없이 증명해요 💕 가까운 사이일수록 침묵이 편하다는 만국 공감 포인트!"], ["모토 마무리", "최고의 계획은 무계획 — 교훈을 둘만의 모토로 만들면 since then
