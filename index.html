/1_서베이/1-025 5. 영화(Movies)_취향.mp3"}, {"id": "1-026", "cat": "survey", "catName": "서베이 질문", "num": 5, "topic": "영화", "topicEn": "Movies", "type": "과거 경험", "badge": "26 과거 경험", "enQ": "Tell me about a movie that left a strong impression on you. What was the story about, and who starred in it? How did you feel while watching it? Describe it in detail.", "enA": "A movie that left a strong impression on me? Oh, that would be a Korean film called \"Miracle in Cell No. 7.\" I watched it years ago, but I still remember it like it was yesterday.\n\nThe story is about a father with a mental disability who is wrongly accused of a crime, and his little daughter who never stops believing in him. The lead actor, Ryu Seung-ryong, was incredible — one moment he made me burst out laughing, and the next moment I was in tears.\n\nTo be honest, I'm not someone who cries easily, but that movie completely caught me off guard — by the ending, I was a total mess, and so was everyone else in the theater. It made me think about how much I love my own family. Since then, it's been my number-one answer whenever someone asks about a memorable movie. It really stuck with me.", "koQ": "당신에게 강한 인상을 남긴 영화에 대해 말해주세요. 어떤 내용이었고, 누가 주연이었나요? 영화를 보는 동안 어떤 기분이 들었나요? 자세히 묘사해주세요.", "koA": "강한 인상을 남긴 영화요? 아, 그건 '7번방의 선물'이라는 한국 영화예요. 몇 년 전에 봤는데 아직도 어제 일처럼 생생하게 기억나요.\n\n지적 장애가 있는 아버지가 억울하게 누명을 쓰고, 어린 딸이 끝까지 아빠를 믿어 주는 이야기예요. 주연 배우 류승룡의 연기가 정말 대단했어요. 한순간은 저를 빵 터지게 만들었다가, 다음 순간엔 눈물을 흘리게 했거든요.\n\n솔직히 저는 잘 우는 사람이 아닌데, 그 영화는 완전히 허를 찔렀어요. 엔딩쯤엔 저는 눈물범벅이 됐고, 극장 안의 다른 사람들도 다 마찬가지였어요. 제 가족을 얼마나 사랑하는지 다시 생각하게 됐죠. 그 후로 기억에 남는 영화를 물으면 항상 1순위로 답하는 영화예요. 정말 마음에 깊이 남았어요.", "struct": [["1️⃣ 도입", "영화 제목 소개('7번방의 선물')"], ["2️⃣ 줄거리", "아빠의 누명 · 딸의 믿음 (2문장!)"], ["3️⃣ 배우", "류승룡 · 웃음과 눈물 사이"], ["4️⃣ 감정", "허 찔림 · 극장 전체가 눈물바다"], ["5️⃣ 마무리", "가족 생각 + 1순위 인생 영화"]], "scoring": [["줄거리는 2문장", "줄거리를 길게 말하면 길을 잃어요. The story is about ~ 한두 문장으로 요약하고 바로 내 감정으로 넘어가는 게 IH 전략! ✅"], ["질문 3요소 커버", "내용(story)·주연(starred)·감정(feel)을 질문이 콕 집었어요. 문단 하나씩 배치해 빠짐없이 답했습니다 🎬"], ["감정 대비 만들기", "one moment 웃음, the next moment 눈물 — 감정의 낙차가 클수록 강한 인상이라는 게 저절로 전달돼요 🎢"], ["나의 변화로 마무리", "영화 감상이 \"가족 생각\"으로 이어지는 마무리는 단순 리뷰를 나의 이야기로 바꿔 줘요 💕 경험 유형 만능 기술!"]], "expr": [["like it was yesterday", "어제 일처럼 생생하게", "오래된 기억을 소환하는 필수 표현 🎞️"], ["The story is about ~", "~에 관한 이야기예요", "줄거리 요약의 안전한 시작 공식 ✅"], ["wrongly accused", "억울하게 누명을 쓴", "드라마 줄거리 필수 어휘예요 ⚖️"], ["never stops believing in ~", "~을 끝까지 믿다", "감동 포인트를 콕 짚어 주는 표현 💕"], ["one moment ~, the next moment ...", "한순간은 ~, 다음 순간은 …", "감정 롤러코스터를 한 문장에! 🎢"], ["burst out laughing", "빵 터지다", "공원 경험 편 재활용 🔁 😆"], ["catch ~ off guard", "~의 허를 찌르다", "예상 못 한 감동의 정석 표현 🎯"], ["a total mess", "(눈물로) 완전 엉망", "많이 울었다는 걸 재치 있게! 😭"], ["To be honest", "솔직히 말하면", "감정 고백 전 필러, 시리즈 재활용 🔁"], ["Since then", "그 후로", "경험 마무리 시그널, 시리즈 공통 🔁"], ["stick with me", "마음에 깊이 남다", "impressive의 원어민식 표현! 암기 필수 💯"]], "audio": "audio/1_서베이/1-026 5. 영화(Movies)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-026 5. 영화(Movies)_과거 경험.mp3"}, {"id": "1-027", "cat": "survey", "catName": "서베이 질문", "num": 5, "topic": "영화", "topicEn": "Movies", "type": "비교", "badge": "27 비교", "enQ": "Think about a movie you enjoyed when you were a child. What was it? How has your taste in movies changed since then? Compare the movies you liked in the past with the ones you enjoy today.", "enA": "A movie I enjoyed as a child? That's easy — Disney animations. I used to watch my favorite ones over and over on video, to the point where I practically knew every scene.\n\nBack then, it was all about fun — bright colors, catchy songs, and happy endings. I honestly didn't care about the deeper meaning of the story at all.\n\nThese days, my taste has matured, I guess. I still enjoy animations, but now I prefer films with realistic stories and complex characters — dramas and thrillers that keep me thinking even after the credits roll. Funny enough, when I rewatched my childhood favorites as an adult, I noticed themes I had completely missed as a kid. So yeah, compared to the past, I've moved from just having fun to looking for meaning — though a good animation still keeps me coming back sometimes.", "koQ": "어릴 때 즐겨 봤던 영화를 떠올려 보세요. 무엇이었나요? 그 이후로 영화 취향은 어떻게 변화했나요? 과거에 좋아했던 영화와 요즘 즐기는 영화를 비교해주세요.", "koA": "어릴 때 즐겨 봤던 영화요? 쉽네요. 디즈니 애니메이션이에요. 좋아하는 작품은 비디오로 보고 또 봐서, 거의 모든 장면을 외울 정도였어요.\n\n그때는 재미가 전부였어요. 화려한 색감, 신나는 노래, 그리고 해피엔딩이요. 솔직히 이야기의 깊은 의미 같은 건 전혀 신경 쓰지 않았죠.\n\n요즘은 취향이 성숙해진 것 같아요. 여전히 애니메이션도 즐기지만, 이제는 현실적인 이야기와 입체적인 인물이 나오는 영화를 더 좋아해요. 엔딩 크레딧이 올라간 후에도 계속 생각하게 만드는 드라마나 스릴러요. 재밌는 건, 어른이 돼서 어릴 적 최애 영화를 다시 봤더니 그때는 완전히 놓쳤던 주제들이 보이더라고요. 네, 과거와 비교하면 저는 단순한 재미에서 의미를 찾는 쪽으로 옮겨 왔어요. 물론 좋은 애니메이션은 여전히 가끔 다시 찾게 되지만요.", "struct": [["1️⃣ 도입", "어린 시절 = 디즈니 애니메이션"], ["2️⃣ 과거", "반복 시청 · 재미가 전부"], ["3️⃣ 현재", "현실적 스토리 · 입체적 인물"], ["4️⃣ 발견", "다시 보니 새로운 주제(재발견)"], ["5️⃣ 마무리", "재미 → 의미 + 여전히 애니 사랑"]], "scoring": [["변화 = 성장 서사", "재미(fun) → 의미(meaning)라는 한 줄 요약이 이 답변의 척추예요 📈 비교 유형은 변화의 방향을 한 단어로 잡고 시작하세요!"], ["재발견 에피소드", "\"다시 보니 새로운 주제가 보였다\"는 재발견 이야기는 과거와 현재를 한 장면에서 비교하는 최고급 기술이에요 🎬"], ["부드러운 마무리", "\"그래도 여전히 애니는 좋아해요\"라는 여운을 남기면 흑백논리가 아닌 성숙한 답변이 돼요 😊"], ["시리즈 총정리", "이 페이지가 다섯 번째 비교예요. used to, Back then, compared to가 자동으로 나온다면 비교 유형은 졸업입니다! 🎓 🔁"]], "expr": [["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 시리즈 개근 마지막 인사! 🔁 💓"], ["over and over", "보고 또 보고", "어린 시절 덕질을 한 마디로 😊"], ["to the point where ~", "~할 정도로", "정도를 강조하는 고급 구문이에요 📈"], ["it was all about ~", "~이 전부였다", "취향 구문 it's all about의 과거형 응용 🔁"], ["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 공통 시그널 🔁 🧩"], ["taste has matured", "취향이 성숙해졌다", "changed보다 격이 높은 변화 표현 ✨"], ["keep me thinking", "계속 생각하게 만들다", "요즘 취향을 설명하는 킬러 표현 🧠"], ["after the credits roll", "엔딩 크레딧이 올라간 후", "영화 주제 전용 세련된 시간 표현 🎬"], ["Funny enough", "재밌게도", "흥미로운 반전 앞에 붙이는 시그널 😊"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["keeps me coming back", "자꾸 다시 찾게 만든다", "카페 묘사 편 재활용 🔁 수미상관 마무리!"]], "audio": "audio/1_서베이/1-027 5. 영화(Movies)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-027 5. 영화(Movies)_비교.mp3"}, {"id": "1-028", "cat": "survey", "catName": "서베이 질문", "num": 6, "topic": "공연", "topicEn": "Play", "type": "묘사", "badge": "28 묘사", "enQ": "Describe the theater you go to most often. Where is it located, and what does it look like? How often do you visit, and what kinds of performances are usually held there?", "enA": "The theater I go to most often is a small one in Daehakro — you know, it's the theater district of Seoul, so the whole area is packed with small stages. It's right next to the subway station, so it's super easy to get to.\n\nIt's not a fancy place at all. It's a cozy underground theater with maybe a hundred seats, and the stage is so close that you can see the actors' facial expressions. Honestly, that intimate vibe is exactly why I love it.\n\nI'd say I go there two or three times a year, usually with my best friend. They mostly put on small plays and comedies — nothing huge, but the quality is surprisingly good. So yeah, that's pretty much my favorite theater. It never disappoints.", "koQ": "가장 자주 가는 공연장을 묘사해주세요. 어디에 위치해 있고, 어떻게 생겼나요? 얼마나 자주 방문하고, 그곳에서는 주로 어떤 공연이 열리나요?", "koA": "제가 가장 자주 가는 공연장은 대학로에 있는 작은 극장이에요. 아시다시피 대학로는 서울의 공연 거리라서, 동네 전체가 소극장으로 가득하거든요. 지하철역 바로 옆이라 찾아가기도 아주 쉬워요.\n\n화려한 곳은 전혀 아니에요. 좌석이 100석쯤 되는 아늑한 지하 소극장인데, 무대가 너무 가까워서 배우들의 표정까지 다 보여요. 솔직히 그 친밀한 분위기가 제가 그곳을 좋아하는 이유예요.\n\n일 년에 두세 번 정도 가는 것 같아요. 보통 절친이랑 같이요. 주로 소규모 연극이나 코미디를 올리는데, 대작은 아니어도 퀄리티가 놀랄 만큼 좋아요. 네, 이게 제 최애 공연장이에요. 한 번도 실망시킨 적이 없죠.", "struct": [["1️⃣ 도입", "대학로 소극장 · 역 바로 옆"], ["2️⃣ 외관", "지하 소극장 · 100석 규모"], ["3️⃣ 매력", "가까운 무대 · 친밀한 분위기"], ["4️⃣ 빈도", "연 2~3회 · 절친과 함께"], ["5️⃣ 마무리", "연극·코미디 위주 + 정리 멘트"]], "scoring": [["동네 전체 → 극장 소개", "대학로라는 동네 특성부터 소개하면 배경지식 없는 시험관도 바로 이해해요 🎭 한국 문화 소개 점수는 덤!"], ["작아서 좋은 점 찾기", "크고 화려함 대신 \"표정이 보일 만큼 가까운 무대\"라는 소극장만의 매력을 짚으면 묘사에 관점이 생겨요 🎯"], ["질문 네 가지 커버", "위치·생김새·빈도·공연 종류까지, 이 질문은 네 가지를 물어요. 문단 순서대로 하나씩 배치했어요 ✅"], ["한 줄 평가로 마무리", "\"It never disappoints\"처럼 애정 담긴 한 줄 평가로 끝내면 단골이라는 게 저절로 전해져요 💯"]], "expr": [["theater district", "공연 거리/극장가", "대학로를 영어로 소개하는 정답 표현 🎭"], ["super easy to get to", "찾아가기 아주 쉬운", "쇼핑·영화 편 재활용 🔁 접근성 만능"], ["cozy", "아늑한", "카페 편 개근 형용사, 공연장에도! 🔁"], ["a hundred seats", "100석 규모", "숫자 하나로 규모가 그려져요 📏"], ["see the actors' facial expressions", "배우들의 표정까지 보이다", "소극장의 매력을 한 문장으로 🎯"], ["intimate vibe", "친밀한 분위기", "vibe 시리즈 확장판! 소극장 전용 🔁 ✨"], ["I'd say ~", "음, ~인 것 같아요", "빈도 질문 쿠션 표현, 재활용 🔁"], ["put on (a play)", "(공연을) 올리다", "perform보다 공연계 느낌 나는 동사 🎬"], ["nothing huge, but ~", "대단하진 않지만 ~", "겸손+반전의 세련된 평가 구문 😊"], ["It never disappoints", "실망시킨 적이 없다", "단골 장소 마무리 킬러 멘트 💯"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-028 6. 공연(Play)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-028 6. 공연(Play)_묘사.mp3"}, {"id": "1-029", "cat": "survey", "catName": "서베이 질문", "num": 6, "topic": "공연", "topicEn": "Play", "type": "습관", "badge": "29 습관", "enQ": "Describe a typical day when you go to see a play. What do you usually do before the performance starts, and what do you do afterward? Tell me about your routine in detail.", "enA": "A theater day? Oh, that's one of my favorite kinds of days. Let me walk you through it. It usually starts way earlier — I always book tickets in advance, because good seats in small theaters sell out fast.\n\nOn the day, my friend and I head to Daehakro about two hours early. We grab a quick bite nearby, then wander around the area checking out posters for other shows. About twenty minutes before the show, we go in, find our seats, and turn off our phones — that's the golden rule!\n\nAfterward, we always stop by a cafe for our after-show chat — we talk about the actors, our favorite scenes, and which play to see next. Honestly, that chat is half the fun. So yeah, that's pretty much my theater-day routine, and it never gets old.", "koQ": "공연을 보러 가는 일반적인 하루를 설명해주세요. 공연이 시작되기 전에 주로 무엇을 하고, 끝난 후에는 무엇을 하나요? 당신의 루틴에 대해 자세히 말해주세요.", "koA": "공연 보는 날이요? 아, 제가 가장 좋아하는 종류의 하루예요. 차근차근 말씀드릴게요. 사실 그날은 훨씬 전부터 시작돼요. 저는 항상 표를 미리 예매하거든요. 소극장 좋은 자리는 금방 매진되니까요.\n\n당일에는 친구랑 두 시간쯤 일찍 대학로로 가요. 근처에서 간단히 요기하고, 동네를 돌아다니면서 다른 공연 포스터들을 구경해요. 공연 20분 전쯤 입장해서 자리를 찾고, 폰을 꺼요. 그게 황금 규칙이죠!\n\n끝나고 나면 항상 카페에 들러서 '공연 후 수다'를 떨어요. 배우들 얘기, 최고의 장면, 다음에 볼 공연까지요. 솔직히 그 수다가 재미의 절반이에요. 네, 이게 제 공연 날 루틴인데, 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "사전 예매(book in advance)부터!"], ["2️⃣ 당일", "2시간 일찍 · 간단히 요기"], ["3️⃣ 입장 전", "포스터 구경 · 20분 전 입장"], ["4️⃣ 관람 후", "카페 수다(after-show chat)"], ["5️⃣ 마무리", "never gets old + 정리 멘트"]], "scoring": [["당일 전부터 시작", "루틴을 예매(며칠 전)부터 시작하면 a typical day가 훨씬 입체적으로 그려져요 🎫 시간축을 넓히는 게 포인트!"], ["before/after 정확히", "질문이 before와 afterward를 콕 집었어요. 요기·포스터 구경(전) / 카페 수다(후)로 나눠 정확히 답했습니다 ✅"], ["매너 디테일 넣기", "\"폰 끄기가 황금 규칙\" 같은 관람 매너 한 줄이 진짜 공연 애호가처럼 들리게 해 줘요 📵"], ["루틴 공식 재활용", "영화 습관 편과 같은 전-중-후 구조에 after-show chat까지, 표현만 갈아 끼우면 콤보 대비 완성이에요 🔁"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 만능 오프닝, 이제 6번째! 🔁"], ["book tickets in advance", "표를 미리 예매하다", "공연·콘서트 습관의 필수 첫 단계 🎫"], ["sell out fast", "금방 매진되다", "예매 이유까지 설명해 주는 표현 🔥"], ["head to ~", "~로 향하다", "쇼핑 습관 편 재활용 🔁 🚶"], ["grab a quick bite", "간단히 요기하다", "영화 습관 편 재활용 🔁 🍔"], ["wander around", "어슬렁거리며 돌아다니다", "여유로운 시간을 그리는 동사 ✨"], ["turn off our phones", "폰을 끄다", "공연 관람 매너 디테일! 📵"], ["that's the golden rule", "그게 황금 규칙이죠", "나만의 규칙 시그널, 조깅 편 응용 🔁"], ["stop by ~", "~에 잠깐 들르다", "시리즈 개근! 공연 후 카페 연결 🔁"], ["after-show chat", "공연 후 수다", "영화 편 after-movie chat의 공연 버전 🔁 💬"], ["it never gets old", "아무리 해도 질리지 않는다", "공원·영화 습관 마무리 재활용 🔁 😊"]], "audio": "audio/1_서베이/1-029 6. 공연(Play)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-029 6. 공연(Play)_습관.mp3"}, {"id": "1-030", "cat": "survey", "catName": "서베이 질문", "num": 6, "topic": "공연", "topicEn": "Play", "type": "취향", "badge": "30 취향", "enQ": "What type of performance do you like best? Who is your favorite performer, and what plays has he or she appeared in?", "enA": "If I had to choose, I'd go for musicals — they've got everything: acting, singing, and dancing all in one show. For me, it's all about that live energy you just can't get from a screen.\n\nMy favorite performer is Jo Seung-woo. He's actually a famous movie actor too, but on stage, he's on a whole different level. He's appeared in big musicals like \"Hedwig\" and \"Man of La Mancha,\" and his singing gives me goosebumps every single time.\n\nWhat I admire most is that he never seems to phone it in — even after hundreds of shows, he performs like it's opening night. That's why I always try to catch his shows whenever tickets open. When it comes to stage performances, nothing beats watching him live. That's my taste in a nutshell.", "koQ": "어떤 종류의 공연을 가장 좋아하나요? 가장 좋아하는 배우는 누구이고, 그 사람은 어떤 공연에 출연했나요?", "koA": "굳이 골라야 한다면 저는 뮤지컬을 선택할 거예요. 연기, 노래, 춤이 한 공연에 다 들어 있잖아요. 저한테는 화면으로는 절대 느낄 수 없는 그 라이브 에너지가 전부거든요.\n\n제가 가장 좋아하는 배우는 조승우예요. 사실 유명한 영화배우이기도 한데, 무대 위에서는 차원이 달라요. '헤드윅', '맨 오브 라만차' 같은 대작 뮤지컬에 출연했는데, 그의 노래는 매번 소름이 돋게 해요.\n\n제가 가장 존경하는 점은 절대 대충 하는 법이 없다는 거예요. 수백 번을 공연해도 마치 첫 공연처럼 무대에 서거든요. 그래서 티켓이 열릴 때마다 항상 그의 공연을 챙겨 보려고 해요. 무대 공연에 관해서라면 그의 라이브만 한 게 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 뮤지컬(all in one show)"], ["2️⃣ 이유", "라이브 에너지(it's all about)"], ["3️⃣ 최애", "조승우 · 대표작 2개 언급"], ["4️⃣ 존경", "수백 번째도 첫 공연처럼"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["공연+배우 두 질문", "이 질문은 좋아하는 공연 종류와 배우를 둘 다 물어요. 뮤지컬(장르) → 조승우(배우) → 출연작 순서로 빠짐없이! ✅"], ["실존 인물 활용", "실제 배우와 실제 작품명을 대면 답변의 신뢰도가 확 올라가요 🎭 이름+대표작 2개면 충분합니다!"], ["존경 이유 구체화", "\"노래를 잘해서\"보다 \"수백 번째 공연도 첫 공연처럼\"이 훨씬 강력해요 💯 phone it in 같은 관용구로 어휘 점수까지!"], ["3종 표현 암기", "give me goosebumps는 이어지는 음악·콘서트 주제에서도 계속 쓸 3종 세트 공통 표현이에요 🔁 지금 외워 두세요!"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 표현 🔁"], ["go for ~", "~을 선택하다", "취향 시리즈 단골 동사 🔁 👍"], ["all in one show", "한 공연에 전부", "뮤지컬의 매력을 한 구문으로! ✨"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 6연속 등장! 🔁 🎯"], ["a whole different level", "차원이 다른 수준", "공원·조깅 비교 편 재활용 🔁 🆙"], ["appear in ~", "~에 출연하다", "'어떤 공연에 나왔나' 질문의 정답 동사 🎬"], ["give me goosebumps", "소름 돋게 하다", "공연·음악·콘서트 3종 공통 킬러 표현! 🔥"], ["phone it in", "대충 하다, 설렁설렁 하다", "고급 관용구! 존경 이유가 살아나요 💯"], ["That's why ~", "그래서 ~한 거예요", "이유 연결 시그널, 재활용 🔁 🔗"], ["nothing beats ~", "~만 한 게 없다", "취향 마무리 표현, 시리즈 개근 🔁"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 6연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-030 6. 공연(Play)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-030 6. 공연(Play)_취향.mp3"}, {"id": "1-031", "cat": "survey", "catName": "서베이 질문", "num": 6, "topic": "공연", "topicEn": "Play", "type": "과거 경험", "badge": "31 과거 경험", "enQ": "Tell me about the most impressive play you have ever watched. What was the performance, and who was the main actor? What made it so memorable, and how did you feel while watching it?", "enA": "Oh, this reminds me of a small musical I saw in Daehakro a couple of years ago. To be honest, I didn't expect much — it was a tiny theater, and I'd never heard of the lead actor before.\n\nBut guess what? The moment he started singing, the whole room went silent. I was sitting in the front row, so close that I could see every expression on his face. At one point, he even made eye contact with the audience and threw in some ad-libs — the whole theater burst out laughing.\n\nBy the final scene, I had goosebumps all over, and I wasn't the only one — the audience gave a standing ovation that lasted forever. It was so memorable because I walked in with zero expectations and walked out completely blown away. Since then, I never judge a show by the size of its theater.", "koQ": "지금까지 본 것 중 가장 인상 깊었던 공연에 대해 말해주세요. 어떤 공연이었고, 누가 주연이었나요? 무엇이 그것을 기억에 남게 했고, 보는 동안 어떤 기분이 들었나요?", "koA": "아, 몇 년 전에 대학로에서 본 작은 뮤지컬이 생각나네요. 솔직히 큰 기대는 없었어요. 아주 작은 극장이었고, 주연 배우 이름도 처음 들어봤거든요.\n\n그런데 있잖아요, 그가 노래를 시작하는 순간 극장 전체가 조용해졌어요. 맨 앞줄에 앉아 있어서 아주 가까이서 그의 표정 하나하나까지 다 보였어요. 중간에는 관객들과 눈을 맞추면서 애드리브도 던졌는데, 극장 전체가 빵 터졌죠.\n\n마지막 장면쯤엔 온몸에 소름이 돋아 있었어요. 저만 그런 게 아니었는지, 관객들의 기립박수가 한참 이어졌어요. 아무 기대 없이 들어갔다가 완전히 감동해서 나왔기 때문에 더 기억에 남아요. 그 후로는 극장 크기로 공연을 판단하지 않게 됐어요.", "struct": [["1️⃣ 도입", "회상 시그널 + 기대 없었음"], ["2️⃣ 반전", "노래 시작하자 장내 침묵"], ["3️⃣ 디테일", "맨 앞줄 · 눈맞춤 · 애드리브"], ["4️⃣ 절정", "온몸에 소름 · 기립박수"], ["5️⃣ 마무리", "무기대→감동 + 교훈(Since then)"]], "scoring": [["무기대 → 감동", "\"기대 없이 갔다가 감동받았다\"는 낙차 구조가 인상 깊은 이유를 저절로 설명해 줘요 🎢 memorable 질문의 만능 공식!"], ["현장감 디테일 3종", "맨 앞줄, 눈맞춤, 애드리브 — 그 자리에 있어야만 아는 디테일이 이야기를 진짜로 만들어요 🎭"], ["관객 반응 활용", "내 감정(소름)에 관객 반응(침묵→웃음→기립박수)을 겹치면 감동의 크기가 객관적으로 전달돼요 👏"], ["질문 4요소 커버", "공연·주연·기억에 남는 이유·감정까지, 질문의 네 가지를 문단 순서대로 배치해 빠짐없이 답했어요 ✅"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["I didn't expect much", "큰 기대는 없었다", "반전을 위한 밑밥 깔기 문장 🎬"], ["guess what?", "그런데 있잖아요?", "반전 필러, 시리즈 재활용 🔁 😲"], ["the whole room went silent", "장내가 조용해졌다", "몰입의 순간을 그리는 명장면 표현 🤫"], ["front row", "맨 앞줄", "현장감을 살리는 좌석 디테일 💺"], ["eye contact / ad-libs", "눈맞춤 / 애드리브", "소극장 경험만의 킬러 디테일 🎭"], ["burst out laughing", "빵 터지다", "공원·영화 편 재활용 🔁 😆"], ["goosebumps all over", "온몸에 소름", "취향 편 goosebumps의 강화판 🔁 🔥"], ["standing ovation", "기립박수", "공연 경험담의 피날레 필수 어휘 👏"], ["zero expectations → blown away", "무기대 → 완전 감동", "조깅 경험 편 blown away 재활용 🔁"], ["Since then", "그 후로", "교훈 마무리 시그널, 시리즈 공통 🔁"]], "audio": "audio/1_서베이/1-031 6. 공연(Play)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-031 6. 공연(Play)_과거 경험.mp3"}, {"id": "1-032", "cat": "survey", "catName": "서베이 질문", "num": 6, "topic": "공연", "topicEn": "Play", "type": "비교", "badge": "32 비교", "enQ": "How has your taste in plays changed over the years? What kinds of performances did you enjoy in the past, and what do you prefer these days? Compare them for me.", "enA": "My taste in plays has definitely changed over the years. Back then — I mean, when I first started watching shows — it was all about the spectacle. I used to go for big licensed musicals with fancy sets, huge casts, and famous songs.\n\nTo be honest, back then I chose shows by name value. If it wasn't famous, I simply wasn't interested.\n\nThese days, my taste has matured, I guess. I prefer small original plays in Daehakro — simple stages, small casts, but stories that keep me thinking on the way home. The intimacy of a small theater beats the spectacle for me now. Funny enough, the shows I remember most are the little ones nobody knows. So yeah, compared to before, I've moved from big and flashy to small and deep — and honestly, I enjoy theater way more now.", "koQ": "시간이 지나며 당신의 공연 취향은 어떻게 변화했나요? 과거에는 어떤 공연을 즐겼고, 요즘에는 무엇을 선호하나요? 둘을 비교해주세요.", "koA": "제 공연 취향은 시간이 지나면서 확실히 변했어요. 그때는, 그러니까 공연을 처음 보기 시작했을 때는 스펙터클이 전부였어요. 화려한 무대 세트, 대규모 출연진, 유명한 노래가 나오는 대형 라이선스 뮤지컬만 골라 다녔죠.\n\n솔직히 그때는 공연을 이름값으로 골랐어요. 유명하지 않으면 아예 관심도 없었죠.\n\n요즘은 취향이 성숙해진 것 같아요. 대학로의 작은 창작극을 더 좋아하거든요. 단순한 무대, 적은 출연진이지만 집에 가는 길 내내 생각하게 만드는 이야기들이요. 이제 저한테는 소극장의 친밀함이 스펙터클을 이겨요. 재밌는 건, 가장 기억에 남는 공연들은 아무도 모르는 작은 작품들이라는 거예요. 네, 예전과 비교하면 크고 화려한 것에서 작고 깊은 것으로 옮겨 왔고, 솔직히 지금이 공연을 훨씬 더 즐기고 있어요.", "struct": [["1️⃣ 도입", "변화 인정 (definitely changed)"], ["2️⃣ 과거", "대형 뮤지컬 · 화려한 스펙터클"], ["3️⃣ 과거", "이름값으로 선택(name value)"], ["4️⃣ 현재", "대학로 창작극 · 깊은 이야기"], ["5️⃣ 마무리", "크고 화려함 → 작고 깊음 + way more"]], "scoring": [["변화의 방향 한 줄", "\"big and flashy → small and deep\"처럼 변화를 대구로 요약하면 비교 답변의 척추가 완성돼요 📈 영화 편과 같은 기술!"], ["선택 기준의 변화", "공연 종류만 비교하지 말고 \"이름값으로 → 이야기로\"처럼 고르는 기준의 변화까지 넣으면 깊이가 달라져요 🎯"], ["묘사·취향 편과 연결", "현재 취향(대학로 소극장)이 묘사 편의 단골 극장과 이어지면 콤보 답변 전체가 한 사람의 이야기가 돼요 🔁"], ["영화 비교와 같은 공식", "취향 변화 비교는 영화 편에서 이미 연습했죠? taste has matured, Funny enough까지 뼈대가 완전히 같아요 🔁 🎓"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 공통 시그널 🔁 🧩"], ["it was all about ~", "~이 전부였다", "취향 구문의 과거형, 영화 비교 편 재활용 🔁"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 개근 표현 🔁 💓"], ["fancy sets", "화려한 무대 세트", "대형 공연을 한 단어로 그리는 디테일 ✨"], ["name value", "이름값", "과거의 선택 기준을 솔직하게! 😅"], ["taste has matured", "취향이 성숙해졌다", "영화 비교 편 재활용 🔁 고급 변화 표현"], ["keep me thinking", "계속 생각하게 만들다", "영화 비교 편 재활용 🔁 🧠"], ["A beats B", "A가 B를 이긴다", "nothing beats의 변형 활용법 🔁 💪"], ["Funny enough", "재밌게도", "영화 비교 편 반전 시그널 재활용 🔁 😊"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["way more", "훨씬 더", "비교 마무리 강조, 개근 표현 🔁 🆙"]], "audio": "audio/1_서베이/1-032 6. 공연(Play)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-032 6. 공연(Play)_비교.mp3"}, {"id": "1-033", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "묘사", "badge": "33 묘사", "enQ": "Describe your favorite singer or musician. What does he or she look like on stage, and what style of music does this person perform? Tell me about this musician in detail.", "enA": "My favorite singer? That's easy — IU. She's one of the biggest artists in Korea, and honestly, I've been a fan for more than ten years.\n\nOn stage, she's fascinating to watch. She's quite petite, but the moment she starts singing, she owns the stage — calm, confident, and completely in control. Her voice is incredibly clear, and she hits the high notes like it's nothing. Between songs, she chats with fans like she's talking to old friends, which I love.\n\nAs for her style, she does everything from sweet ballads to upbeat pop, and she even writes her own songs. That's rare, and it's exactly why her music feels so personal. So yeah, that's pretty much my favorite musician — her voice never gets old.", "koQ": "가장 좋아하는 가수나 음악가를 묘사해주세요. 그 사람은 무대에서 어떤 모습이고, 어떤 스타일의 음악을 하나요? 이 음악가에 대해 자세히 말해주세요.", "koA": "제가 가장 좋아하는 가수요? 쉽네요. 아이유예요. 한국에서 가장 인기 많은 아티스트 중 한 명인데, 솔직히 저는 10년 넘게 팬이에요.\n\n무대 위의 그녀는 정말 매력적이에요. 체구는 아담한데, 노래를 시작하는 순간 무대를 완전히 장악해요. 차분하고, 자신감 있고, 완벽하게 컨트롤하죠. 목소리는 믿을 수 없이 맑고, 고음도 아무렇지 않게 소화해요. 노래 사이사이에는 오랜 친구와 이야기하듯 팬들과 수다를 떠는데, 그 모습도 정말 좋아요.\n\n스타일로 말하자면, 감미로운 발라드부터 신나는 팝까지 다 하고, 심지어 자기 노래를 직접 쓰기도 해요. 흔치 않은 일이죠. 그래서 그녀의 음악이 그렇게 개인적으로 느껴지는 거예요. 네, 이게 제 최애 음악가예요. 그 목소리는 아무리 들어도 질리지 않아요.", "struct": [["1️⃣ 도입", "아이유 + 10년 팬 어필"], ["2️⃣ 무대", "아담하지만 무대 장악(owns)"], ["3️⃣ 보컬", "맑은 목소리 · 쉬운 고음 처리"], ["4️⃣ 스타일", "발라드~팝 · 자작곡(rare!)"], ["5️⃣ 마무리", "개인적인 음악 + 정리 멘트"]], "scoring": [["반전 매력 구조", "\"아담한 체구 ↔ 무대 장악\"처럼 대비를 만들면 인물 묘사가 밋밋하지 않아요 🎤 what does she look like의 정답 구조!"], ["무대 밖 모습도 한 줄", "팬들과 수다 떠는 모습 같은 노래 밖 디테일이 인물을 입체적으로 만들어요 😊"], ["스타일 질문 챙기기", "질문이 style of music을 콕 집었어요. 장르 범위(발라드~팝)+자작곡 팩트로 정확히 답했습니다 ✅"], ["실존 가수 자신 있게", "실제 가수 이름과 사실만으로 충분해요. 팬 경력, 자작곡 같은 팩트가 외운 티를 지워 줍니다 💯"]], "expr": [["for more than ten years", "10년 넘게", "팬 경력 숫자로 애정의 깊이 증명 📅"], ["fascinating to watch", "보는 재미가 있는", "interesting의 상위 호환 형용사 ✨"], ["petite", "아담한 체구의", "small보다 세련된 외모 묘사 단어 😊"], ["own the stage", "무대를 장악하다", "무대 묘사 킬러 표현! 콘서트 편 재등장 🔁"], ["completely in control", "완벽하게 컨트롤하는", "반전 매력을 완성하는 구문 💪"], ["hit the high notes", "고음을 소화하다", "보컬 칭찬의 필수 표현이에요 🎤"], ["like it's nothing", "아무렇지 않게", "실력 강조 만능 부사구! 어디든 활용 🙌"], ["write her own songs", "자작곡을 쓰다", "싱어송라이터 어필 정답 표현 ✍️"], ["feel so personal", "아주 개인적으로 느껴지다", "좋아하는 이유의 격을 올려 줘요 💕"], ["never gets old", "아무리 들어도 질리지 않는다", "공원·영화 편 재활용 🔁 마무리에 딱"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-033 7. 음악감상(Music)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-033 7. 음악감상(Music)_묘사.mp3"}, {"id": "1-034", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "습관", "badge": "34 습관", "enQ": "Tell me about how you usually listen to music. What devices or apps do you use, and when and where do you normally listen? Describe your listening habits in detail.", "enA": "How do I listen to music? Well, like most people these days, everything happens on my smartphone. I use a streaming app with wireless earphones, so my entire music library is right in my pocket.\n\nAs for when and where — honestly, music is the background music of my day. I listen during my commute, while walking in the park, and when I get some work done at a cafe. I even have different playlists for different moods: an upbeat one for mornings, calm ballads for nighttime.\n\nOh, and one little habit of mine: before going to bed, I always play a quiet playlist with the lights off — it's the best way to wind down after a long day. So yeah, that's pretty much how I listen to music. Basically, my earphones and I are inseparable.", "koQ": "당신이 주로 음악을 듣는 방법에 대해 말해주세요. 어떤 기기나 앱을 사용하고, 보통 언제 어디서 듣나요? 당신의 음악 감상 습관을 자세히 설명해주세요.", "koA": "음악을 어떻게 듣냐고요? 음, 요즘 대부분의 사람들처럼 모든 게 스마트폰에서 이루어져요. 스트리밍 앱과 무선 이어폰을 쓰니까, 제 음악 라이브러리 전체가 주머니 속에 있는 셈이죠.\n\n언제 어디서 듣는지로 말하자면, 솔직히 음악은 제 하루의 배경음악이에요. 출퇴근길에 듣고, 공원을 걸으면서 듣고, 카페에서 일할 때도 들어요. 기분별 플레이리스트도 따로 있어요. 아침용 신나는 리스트, 밤용 잔잔한 발라드 리스트요.\n\n아, 그리고 제 작은 습관 하나. 자기 전에는 항상 불을 끄고 조용한 플레이리스트를 틀어요. 긴 하루 끝에 긴장을 푸는 최고의 방법이거든요. 네, 제가 음악을 듣는 방식은 대체로 이래요. 한마디로 이어폰과 저는 뗄 수 없는 사이예요.", "struct": [["1️⃣ 도입", "스마트폰 + 스트리밍 앱"], ["2️⃣ 기기", "무선 이어폰 · 주머니 속 음악"], ["3️⃣ 장소", "출퇴근 · 산책 · 카페 작업"], ["4️⃣ 방식", "기분별 플레이리스트"], ["5️⃣ 마무리", "자기 전 루틴 + 정리 멘트"]], "scoring": [["기기 → 때/장소 → 습관", "질문이 묻는 순서(devices → when/where → habits) 그대로 따라가면 개요 짜기가 저절로 끝나요 ✅"], ["장소를 시리즈와 연결", "공원 산책, 카페 작업 등 앞 주제의 장소들이 그대로 등장하면 콤보 답변에 일관성이 생겨요 🔁"], ["기분별 리스트 디테일", "아침엔 신나게, 밤엔 잔잔하게 — 시간대별 대비 하나로 in detail 요청에 답이 돼요 🎵"], ["비유로 마무리 강화", "\"하루의 배경음악\", \"이어폰과 뗄 수 없는 사이\" 같은 비유가 평범한 습관 답변을 특별하게 만들어요 😆"]], "expr": [["streaming app", "스트리밍 앱", "요즘 음악 감상의 기본 디테일 📱"], ["wireless earphones", "무선 이어폰", "기기(device) 질문의 정답 아이템 🎧"], ["right in my pocket", "주머니 속에 그대로", "스마트폰 시대를 한 구문으로! ✨"], ["the background music of my day", "내 하루의 배경음악", "음악 사랑을 비유로 표현하는 킬러 문장 🎵"], ["during my commute", "출퇴근길에", "언제(when) 질문의 단골 답변 🚇"], ["get some work done", "일을 좀 하다", "카페 편 재활용 🔁 장소 연결 고리!"], ["playlists for different moods", "기분별 플레이리스트", "나만의 감상 습관 디테일 💯"], ["before going to bed", "자기 전에", "루틴의 마지막 단계 시간 표현 🌙"], ["wind down", "긴장을 풀다", "relax의 상위 호환! 저녁 루틴 필수 어휘 😌"], ["inseparable", "뗄 수 없는", "유머러스한 마무리 한 방 단어 😆"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-034 7. 음악감상(Music)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-034 7. 음악감상(Music)_습관.mp3"}, {"id": "1-035", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "취향", "badge": "35 취향", "enQ": "What genres of music do you like? Who is your favorite singer or composer, and why do you like that musician?", "enA": "If I had to choose, I'd say ballads and R&B are my go-to genres. For me, it's all about the melody and the lyrics — I want songs that actually say something, not just background noise.\n\nAnd as I mentioned, my favorite singer is IU. Why do I like her? Three reasons. First, her voice — clear and emotional at the same time. Second, she writes her own songs, so every album feels like her own story. And third, her lyrics — they're like poetry set to music. Some lines hit me so hard that I just stop and replay them.\n\nOf course, I listen to upbeat pop when I need energy, but at the end of the day, I always come back to her ballads. When it comes to music, nothing beats a song that understands your feelings. That's my taste in a nutshell.", "koQ": "어떤 장르의 음악을 좋아하나요? 가장 좋아하는 가수나 작곡가는 누구이고, 왜 그 음악가를 좋아하나요?", "koA": "굳이 골라야 한다면 발라드와 R&B가 제 단골 장르예요. 저한테는 멜로디와 가사가 전부거든요. 그냥 배경 소음이 아니라, 진짜 무언가를 말하는 노래를 원해요.\n\n그리고 말씀드렸듯이 제 최애 가수는 아이유예요. 왜 좋아하냐고요? 세 가지 이유가 있어요. 첫째, 목소리요. 맑으면서도 감정이 실려 있어요. 둘째, 자기 노래를 직접 써서 앨범마다 그녀만의 이야기처럼 느껴져요. 셋째, 가사요. 음악에 얹은 시 같거든요. 어떤 구절은 너무 와닿아서 멈추고 다시 듣게 돼요.\n\n물론 에너지가 필요할 땐 신나는 팝도 듣지만, 결국엔 항상 그녀의 발라드로 돌아와요. 음악에 관해서라면, 내 감정을 알아주는 노래만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 발라드·R&B"], ["2️⃣ 기준", "멜로디+가사(it's all about)"], ["3️⃣ 최애", "아이유 · 이유 3가지 나열"], ["4️⃣ 유연함", "팝도 듣지만 결국 발라드"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["이유 3가지 나열법", "First, Second, Third로 이유를 세 개 나열하는 건 why 질문의 만능 구조예요 ✅ 각 이유는 한두 문장이면 충분!"], ["묘사 편과 일관성", "묘사 편에서 소개한 아이유가 취향에서도 이어지면 답변 전체가 진짜 팬의 이야기가 돼요 🔁 콤보의 핵심!"], ["비유 한 방 준비", "\"poetry set to music\" 같은 비유 한 줄이 취향 답변의 어휘 점수를 결정해요 ✨ 통째로 외워 두세요!"], ["유연함 + 회귀", "\"팝도 듣지만 결국 발라드로\"처럼 열린 취향을 보여 주고 원점으로 돌아오면 자연스러움과 확고함을 다 잡아요 🔄"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 🔁"], ["go-to genres", "단골 장르", "go-to의 장르 버전! 활용 무한 🔁 🎵"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 7연속 등장! 🔁 🎯"], ["say something", "(노래가) 무언가를 말하다", "가사파 취향을 한 구문으로 💬"], ["Three reasons. First...", "이유는 세 가지예요", "이유 나열의 정석 구조! 만능 틀 ✅"], ["write her own songs", "자작곡을 쓰다", "묘사 편 재활용 🔁 일관성 UP"], ["poetry set to music", "음악에 얹은 시", "가사 칭찬의 최고급 비유예요 ✨"], ["hit me so hard", "너무 와닿다", "감정을 세게 표현하는 구어체 💘"], ["at the end of the day", "결국엔", "유연함 뒤 원점 회귀 시그널 🔄"], ["nothing beats ~", "~만 한 게 없다", "취향 마무리, 시리즈 개근 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 7연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-035 7. 음악감상(Music)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-035 7. 음악감상(Music)_취향.mp3"}, {"id": "1-036", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "과거 경험", "badge": "36 과거 경험", "enQ": "How did you first start getting interested in music? What songs did you listen to when you were young, and what was your favorite one back then? Tell me the story.", "enA": "Let me tell you how I first got into music. It all started with my older sister's MP3 player when I was in elementary school. Back then, having your own music device was a huge deal, and I wasn't allowed to touch it.\n\nBut guess what? Whenever she was out, I would sneak into her room and listen to her playlist. It was full of K-pop idol songs, and I still remember the thrill of listening with one ear on the door. My favorite was an upbeat dance track — I must have played it hundreds of times.\n\nEventually, I saved up my allowance for months to buy my own MP3 player, and that's when music officially became my thing. Since then, music has been the one hobby that never left me. So yeah, that's the story of how it all began — with a borrowed playlist and a little brother's curiosity.", "koQ": "어떻게 처음 음악에 관심을 가지기 시작했나요? 어릴 때 어떤 노래들을 들었고, 그 당시 가장 좋아했던 노래는 무엇이었나요? 그 이야기를 들려주세요.", "koA": "제가 어떻게 음악에 빠지게 됐는지 말씀드릴게요. 모든 건 초등학생 때 누나의 MP3 플레이어에서 시작됐어요. 그때는 자기만의 음악 기기를 갖는 게 엄청난 일이었고, 저는 만지는 것도 금지였죠.\n\n그런데 있잖아요, 누나가 나갈 때마다 저는 방에 몰래 들어가서 플레이리스트를 들었어요. K-pop 아이돌 노래로 가득했는데, 한쪽 귀로는 문 쪽 소리를 살피며 듣던 그 스릴이 아직도 기억나요. 최애곡은 신나는 댄스곡이었는데, 수백 번은 들었을 거예요.\n\n결국 몇 달 동안 용돈을 모아서 제 MP3 플레이어를 샀고, 그때부터 음악이 공식적으로 제 취미가 됐어요. 그 후로 음악은 한 번도 저를 떠난 적 없는 유일한 취미예요. 네, 이게 모든 것의 시작이에요. 빌린 플레이리스트와 동생의 호기심에서요.", "struct": [["1️⃣ 도입", "초등학생 · 누나의 MP3"], ["2️⃣ 사건", "몰래 입장(sneak into) · 스릴"], ["3️⃣ 최애곡", "신나는 댄스곡 · 수백 번 재생"], ["4️⃣ 전환점", "용돈 모아 내 MP3 구입"], ["5️⃣ 마무리", "Since then + 시적인 정리"]], "scoring": [["소품으로 시대 그리기", "MP3 플레이어 하나로 '그 시절'이 저절로 그려져요 🎧 계기 이야기에는 시대를 보여 주는 소품 하나가 필수!"], ["금지 → 몰래 구조", "\"만지면 안 되는 걸 몰래\"라는 구조는 어떤 계기 이야기든 재미있게 만들어 줘요 🤫 스릴 = 스토리 점수!"], ["노력의 증거 넣기", "용돈을 몇 달 모았다는 디테일이 진짜 좋아했다는 최고의 증거가 돼요 💰 감정보다 행동으로 보여 주세요!"], ["계기 공식 재활용", "배경 → 계기 → 몰입 → 전환점 → 현재. 조깅 계기 편과 같은 공식이에요 🔁 주제만 바꾸면 끝!"]], "expr": [["get into ~", "~에 빠지다/시작하다", "조깅 계기 편 재활용 🔁 계기 질문 정답"], ["MP3 player", "MP3 플레이어", "세대 공감 소품! 시대 배경이 저절로 🎧"], ["a huge deal", "엄청난 일", "important의 구어체 상위 호환 ✨"], ["wasn't allowed to ~", "~하는 게 금지였다", "어린 시절 규칙 묘사 필수 구문 🚫"], ["guess what?", "그런데 있잖아요?", "반전 필러, 시리즈 개근 🔁 😲"], ["sneak into ~", "~에 몰래 들어가다", "이야기에 스릴을 더하는 동사 🤫"], ["hundreds of times", "수백 번", "애정의 크기를 숫자로! 과장 양념 🔁 😆"], ["save up my allowance", "용돈을 모으다", "어린 시절 노력의 킬러 디테일 💰"], ["become my thing", "내 취미/내 것이 되다", "a thing 표현의 활용형, 재활용 🔁"], ["Since then", "그 후로", "경험 마무리 시그널, 시리즈 공통 🔁"], ["borrowed playlist", "빌린 플레이리스트", "이야기를 한 구절로 요약하는 마무리 ✨"]], "audio": "audio/1_서베이/1-036 7. 음악감상(Music)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-036 7. 음악감상(Music)_과거 경험1.mp3"}, {"id": "1-037", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "과거 경험", "badge": "37 과거 경험", "enQ": "Please tell me about a special memory you have related to listening to music. Were you listening to your favorite song? When and where did it happen, and why is it so memorable to you?", "enA": "Oh, this reminds me of a night from a few years ago. I was on the last bus home after a really rough day at work — one of those days when nothing goes right, you know?\n\nI was just staring out the window with my earphones in, when out of nowhere, my favorite IU ballad came on shuffle. And the timing was unreal — the slow melody, the quiet bus, the city lights sliding past the window... it felt like the song was written just for that moment.\n\nI'm not kidding, I got a little teary — but in a good way. By the time I got off, I felt strangely comforted, like the song had patted me on the shoulder. It's so memorable because that's when I realized music isn't just entertainment — sometimes it's therapy. Since then, that song has been my go-to on hard days.", "koQ": "음악 감상과 관련된 특별한 기억에 대해 말해주세요. 가장 좋아하는 노래를 듣고 있었나요? 언제 어디서 있었던 일이고, 왜 그것이 기억에 남나요?", "koA": "아, 몇 년 전 어느 밤이 생각나네요. 회사에서 정말 힘든 하루를 보내고 막차를 타고 집에 가던 길이었어요. 아시죠, 뭘 해도 안 풀리는 그런 날이요.\n\n이어폰을 끼고 멍하니 창밖을 보고 있었는데, 난데없이 셔플로 제 최애 아이유 발라드가 나온 거예요. 타이밍이 비현실적이었어요. 잔잔한 멜로디, 조용한 버스, 창밖으로 스쳐 가는 도시의 불빛들. 마치 그 순간을 위해 쓰인 노래 같았어요.\n\n진짜예요, 눈물이 살짝 났어요. 근데 좋은 의미로요. 내릴 때쯤엔 이상하게 위로받은 기분이었어요. 노래가 어깨를 토닥여 준 것처럼요. 음악이 그냥 오락이 아니라 가끔은 치료라는 걸 그때 깨달았기 때문에 더 기억에 남아요. 그 후로 그 노래는 힘든 날마다 찾는 제 단골 곡이 됐어요.", "struct": [["1️⃣ 도입", "회상 시그널 + 힘든 날 막차"], ["2️⃣ 사건", "셔플로 최애곡(out of nowhere)"], ["3️⃣ 장면", "멜로디 · 조용한 버스 · 야경"], ["4️⃣ 감정", "눈물 · 위로(comforted)"], ["5️⃣ 마무리", "음악 = 치료 깨달음 + Since then"]], "scoring": [["장면 하나에 집중", "사건이 없어도 괜찮아요. 막차+최애곡+야경이라는 장면 하나를 영화처럼 그리는 게 이 유형의 정답이에요 🎬"], ["타이밍의 마법 강조", "\"그 순간을 위해 쓰인 노래 같았다\"처럼 우연의 타이밍을 강조하면 특별한 이유가 저절로 설명돼요 ✨"], ["감정 → 깨달음 마무리", "위로받았다(감정)에서 음악은 치료다(깨달음)로 올라가면 why memorable에 대한 최고급 답변이 돼요 💕"], ["취향 편과 수미상관", "취향 편에서 말한 \"감정을 알아주는 노래\"가 여기서 실화로 증명되면 콤보 전체가 완성돼요 🔁"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["the last bus home", "집으로 가는 막차", "감성 스토리의 완벽한 무대 세팅 🚌"], ["nothing goes right", "뭘 해도 안 풀리다", "힘든 하루를 한 구문으로! 공감 UP 😮‍💨"], ["out of nowhere", "난데없이, 갑자기", "공원·조깅 경험 편 재활용 🔁 💥"], ["come on shuffle", "셔플로 (노래가) 나오다", "음악 감상 세대의 디테일 표현 🎧"], ["city lights sliding past", "스쳐 가는 도시 불빛", "공원 묘사 city lights의 동사 확장판 🔁 ✨"], ["I'm not kidding", "진짜예요", "공원·조깅 편 재활용 🔁 진정성 부여"], ["comforted", "위로받은", "감정 어휘 레벨업! happy보다 깊어요 💕"], ["pat me on the shoulder", "어깨를 토닥여 주다", "위로를 그림으로 보여 주는 비유 🫂"], ["therapy", "치료, 힐링", "공원 취향 편 비유 재활용 🔁 깨달음 표현"], ["Since then", "그 후로", "경험 마무리 시그널, 시리즈 공통 🔁"]], "audio": "audio/1_서베이/1-037 7. 음악감상(Music)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-037 7. 음악감상(Music)_과거 경험2.mp3"}, {"id": "1-038", "cat": "survey", "catName": "서베이 질문", "num": 7, "topic": "음악감상", "topicEn": "Music", "type": "비교", "badge": "38 비교", "enQ": "How has your taste in music changed over the years? What kind of music did you enjoy in the past, and what do you listen to now? Compare the two periods in detail.", "enA": "My music taste has changed a lot over the years. Back then, as I mentioned, it was all about K-pop idol songs — fast beats, catchy hooks, and cool dance moves. I used to follow the music charts religiously and knew every new release.\n\nHonestly, back then I didn't really listen to the lyrics. If the beat was good, I was happy.\n\nThese days, it's almost the opposite. I mostly listen to calm ballads and R&B, and now the lyrics matter more than the beat. I've also stopped following the charts — instead, I build my own playlists and dig into old songs I missed. Funny enough, some songs I ignored as a kid hit me so hard now that I'm older. So yeah, compared to the past, my taste has moved from fast and loud to slow and meaningful — my playlist basically grew up with me.", "koQ": "시간이 지나며 당신의 음악 취향은 어떻게 변화했나요? 과거에는 어떤 음악을 즐겼고, 지금은 무엇을 듣나요? 두 시기를 자세히 비교해주세요.", "koA": "제 음악 취향은 시간이 지나면서 많이 변했어요. 그때는, 말씀드렸듯이 K-pop 아이돌 노래가 전부였어요. 빠른 비트, 중독성 있는 후렴, 멋진 춤이요. 음악 차트를 광적으로 챙겨 보면서 신곡은 다 꿰고 있었죠.\n\n솔직히 그때는 가사를 제대로 듣지도 않았어요. 비트만 좋으면 만족했거든요.\n\n요즘은 거의 정반대예요. 주로 잔잔한 발라드와 R&B를 듣고, 이제는 비트보다 가사가 더 중요해요. 차트도 더 이상 안 따라가요. 대신 저만의 플레이리스트를 만들고, 놓쳤던 옛날 노래들을 찾아 들어요. 재밌는 건, 어릴 때 그냥 지나쳤던 노래들이 나이가 드니까 확 와닿는다는 거예요. 네, 과거와 비교하면 제 취향은 빠르고 시끄러운 것에서 느리고 의미 있는 것으로 옮겨 왔어요. 제 플레이리스트가 저와 함께 자란 셈이죠.", "struct": [["1️⃣ 도입", "변화 인정 (changed a lot)"], ["2️⃣ 과거", "아이돌 댄스곡 · 차트 신봉"], ["3️⃣ 과거", "가사 무관심 · 비트가 전부"], ["4️⃣ 현재", "발라드·R&B · 가사 > 비트"], ["5️⃣ 마무리", "compared to + 플레이리스트 성장"]], "scoring": [["기준의 변화 짚기", "장르 변화(댄스→발라드)에 그치지 말고 \"비트→가사\"라는 듣는 기준의 변화까지 넣어야 in detail 비교가 돼요 📊"], ["습관의 변화도 한 줄", "차트 따라가기 → 내 플레이리스트 만들기. 듣는 방식의 변화가 비교를 입체적으로 만들어요 🎵"], ["재발견 에피소드", "\"어릴 땐 지나친 노래가 지금은 와닿는다\"는 영화 비교 편의 재발견 기술과 같아요 🔁 비교 유형 만능 재료!"], ["성장 비유 마무리", "\"플레이리스트가 나와 함께 자랐다\"처럼 변화를 성장 비유로 닫으면 취향 비교의 격이 달라져요 🌱"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 공통 시그널 🔁 🧩"], ["it was all about ~", "~이 전부였다", "영화·공연 비교 편 재활용 🔁"], ["catchy hooks", "중독성 있는 후렴", "아이돌 음악을 한 단어로! 🎵"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 개근 표현 🔁 💓"], ["follow ~ religiously", "~을 광적으로 챙기다", "religiously = 아주 철저히! 고급 부사 ✨"], ["the opposite", "정반대", "변화의 크기를 한 단어로 보여 줘요 🔄"], ["lyrics matter more than the beat", "비트보다 가사가 중요하다", "A more than B 비교 구문의 정석 📊"], ["dig into ~", "~을 파고들다", "덕질 감성의 구어체 동사 ⛏️"], ["Funny enough", "재밌게도", "영화·공연 비교 편 재활용 🔁 😊"], ["hit me so hard", "너무 와닿다", "취향 편 재활용 🔁 감정 강조"], ["grew up with me", "나와 함께 자랐다", "비교 답변 최고급 마무리 비유! 🌱"]], "audio": "audio/1_서베이/1-038 7. 음악감상(Music)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-038 7. 음악감상(Music)_비교.mp3"}, {"id": "1-039", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "묘사", "badge": "39 묘사", "enQ": "Describe a concert hall you often visit. Where is it, and what do you like about the venue? Tell me about a concert you saw there.", "enA": "The concert hall I visit most often is the big dome in Olympic Park, in the southeastern part of Seoul. It's right by the subway station, and since it's inside a huge park, you can enjoy a nice walk before the show — honestly, that's half the fun.\n\nWhat I like about the venue is the scale. It holds more than ten thousand people, but the sound system is amazing, and the huge screens mean there's really no bad seat in the house.\n\nThe best concert I saw there was an IU concert a couple of years ago. Even from my seat way up high, her live vocals were crystal clear, and the whole crowd waving light sticks looked like a galaxy. So yeah, that's pretty much my favorite concert hall — every show there feels like a festival.", "koQ": "자주 방문하는 콘서트장을 묘사해주세요. 어디에 있고, 그 장소의 어떤 점이 좋은가요? 그곳에서 본 콘서트에 대해 말해주세요.", "koA": "제가 가장 자주 가는 콘서트장은 서울 동남쪽 올림픽공원에 있는 큰 돔 공연장이에요. 지하철역 바로 옆이고, 거대한 공원 안에 있어서 공연 전에 산책도 즐길 수 있어요. 솔직히 그게 재미의 절반이죠.\n\n이 공연장에서 좋아하는 점은 스케일이에요. 만 명 넘게 수용하는데도 음향 시설이 훌륭하고, 대형 스크린이 있어서 사실상 나쁜 자리가 없어요.\n\n거기서 본 최고의 콘서트는 몇 년 전 아이유 콘서트였어요. 꽤 높은 자리였는데도 라이브 보컬이 수정처럼 선명했고, 응원봉을 흔드는 관중 전체가 마치 은하수 같았어요. 네, 이게 제 최애 콘서트장이에요. 그곳의 모든 공연은 축제처럼 느껴져요.", "struct": [["1️⃣ 도입", "올림픽공원 돔 · 역 바로 옆"], ["2️⃣ 보너스", "공연 전 공원 산책(half the fun)"], ["3️⃣ 장점", "1만 명 규모 · 음향 · 대형 스크린"], ["4️⃣ 경험", "아이유 콘서트 · 응원봉 은하수"], ["5️⃣ 마무리", "축제 같은 공연장 + 정리"]], "scoring": [["장소+경험 세트 질문", "이 질문은 공연장 묘사와 거기서 본 콘서트를 둘 다 물어요. 장소(1~2문단) → 경험(3문단)으로 나눠 다 챙기세요 ✅"], ["스케일은 숫자로", "만 명 수용 같은 숫자 하나가 \"크다\"는 열 마디보다 강력해요 📏 공연장 묘사의 기본기!"], ["은하수 비유 활용", "응원봉 물결 = 은하수. 이 비유 하나로 콘서트장 풍경 묘사는 끝이에요 🌌 경험 편에서도 재활용 가능!"], ["음악 주제와 연결", "음악감상 편의 아이유가 콘서트 주제에도 이어지면 서베이 콤보 전체가 하나의 이야기가 돼요 🔁"]], "expr": [["right by the subway station", "지하철역 바로 옆", "접근성 묘사, 시리즈 공통 패턴 🔁 🚇"], ["that's half the fun", "그게 재미의 절반이다", "영화 묘사 편 half the reason 재활용 🔁 😊"], ["venue", "공연장, 행사장", "질문 속 단어 그대로 받아치기! 🎯"], ["hold more than ten thousand people", "만 명 이상 수용하다", "규모를 숫자로! 묘사의 기본기 📏"], ["no bad seat in the house", "나쁜 자리가 없다", "공연장 칭찬 원어민 관용구 💺"], ["way up high", "꽤 높은 곳에", "좌석 위치를 생생하게 그려 줘요 🎫"], ["crystal clear", "수정처럼 선명한", "clear의 최상급 버전! 음향 칭찬 필수 ✨"], ["light sticks", "응원봉", "K-콘서트 문화 필수 디테일! 🌟"], ["look like a galaxy", "은하수처럼 보이다", "콘서트장 풍경 최고의 비유 🌌"], ["feel like a festival", "축제처럼 느껴지다", "분위기를 요약하는 마무리 비유 🎉"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-039 8. 콘서트(Concert)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-039 8. 콘서트(Concert)_묘사.mp3"}, {"id": "1-040", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "습관", "badge": "40 습관", "enQ": "What do you usually do when you go to a concert? Tell me about your routine before the show begins and after it ends, step by step.", "enA": "A concert day actually starts months earlier, so let me walk you through it step by step. First comes the ticketing war — tickets for popular artists sell out in minutes in Korea, so I set an alarm and battle for seats the second they open.\n\nOn the day, I arrive a couple of hours early. I pick up my merch — usually the official light stick — take photos in front of the venue, and soak up the pre-show excitement with other fans.\n\nAfterward, my routine never changes: I can't stop humming the songs on my way out, and on the subway home, I go through all the photos and videos I took. Then, for about a week, I listen to the setlist on repeat, reliving the night. So yeah, that's pretty much my concert routine — honestly, the afterglow is half the experience.", "koQ": "콘서트에 갈 때 주로 무엇을 하나요? 공연이 시작되기 전과 끝난 후의 루틴을 순서대로 말해주세요.", "koA": "콘서트 날은 사실 몇 달 전부터 시작돼요. 순서대로 차근차근 말씀드릴게요. 먼저 티켓팅 전쟁이에요. 한국에서 인기 가수 티켓은 몇 분 만에 매진되기 때문에, 알람을 맞춰 놓고 티켓이 열리는 순간 자리 쟁탈전을 벌여요.\n\n당일에는 두 시간쯤 일찍 도착해요. 굿즈를 사고요. 보통 공식 응원봉이죠. 공연장 앞에서 사진을 찍고, 다른 팬들과 함께 공연 전의 설렘을 만끽해요.\n\n끝난 후의 루틴은 절대 안 변해요. 나오는 길에 노래를 계속 흥얼거리고, 집에 가는 지하철에서 찍은 사진과 영상을 전부 돌려봐요. 그리고 일주일 정도는 셋리스트를 무한 반복으로 들으면서 그날 밤을 다시 사는 거죠. 네, 이게 제 콘서트 루틴이에요. 솔직히 여운이 경험의 절반이에요.", "struct": [["1️⃣ 도입", "몇 달 전 티켓팅 전쟁부터!"], ["2️⃣ 당일", "2시간 일찍 · 굿즈 · 응원봉"], ["3️⃣ 공연 전", "인증샷 · 팬들과 설렘 공유"], ["4️⃣ 공연 후", "흥얼거림 · 사진 정리"], ["5️⃣ 마무리", "셋리스트 무한 반복 = 여운"]], "scoring": [["루틴의 시간축 넓히기", "공연 습관 편처럼 당일이 아니라 티켓팅(몇 달 전)부터 여운(일주일 후)까지 넓히면 루틴이 훨씬 풍성해져요 🔁 ⏰"], ["한국 콘서트 문화 소개", "티켓팅 전쟁, 응원봉, 굿즈 줄서기 — 시험관에게 신기한 K-문화 디테일은 최고의 소재예요 ⚔️"], ["before/after 정확히", "질문이 before와 after를 콕 집었어요. 굿즈·인증샷(전) / 흥얼거림·사진 정리·셋리스트(후)로 나눠 답했습니다 ✅"], ["여운으로 마무리", "\"afterglow is half the experience\"처럼 공연 후 감정까지 루틴에 포함하면 진짜 팬의 답변이 돼요 🌅"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "step by step 질문의 정답 오프닝 🔁"], ["ticketing war", "티켓팅 전쟁", "K-콘서트 문화 킬러 디테일! ⚔️"], ["sell out in minutes", "몇 분 만에 매진되다", "공연 습관 편 sell out fast 강화판 🔁 🔥"], ["the second they open", "열리는 그 순간에", "as soon as의 상위 호환 표현 ⏰"], ["arrive a couple of hours early", "두어 시간 일찍 도착하다", "영화·공연 편 arrive early 재활용 🔁"], ["merch", "굿즈", "goods는 콩글리시! merch가 정답 🛍️"], ["light stick", "응원봉", "묘사 편에 이어 재등장 🔁 🌟"], ["can't stop humming", "계속 흥얼거리게 되다", "공연 직후의 상태를 완벽 묘사 🎵"], ["setlist", "셋리스트", "콘서트 팬 인증 어휘예요 📃"], ["relive the night", "그날 밤을 다시 살다", "여운을 표현하는 최고급 동사 ✨"], ["afterglow", "여운", "이 단어 하나면 IH 어휘 점수 확보! 🌅"]], "audio": "audio/1_서베이/1-040 8. 콘서트(Concert)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-040 8. 콘서트(Concert)_습관.mp3"}, {"id": "1-041", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "취향", "badge": "41 취향", "enQ": "What kind of concerts do you enjoy the most, and why do you like them? Tell me in detail.", "enA": "If I had to choose, I'd go for solo concerts by artists I really love, rather than big festivals with dozens of performers. For me, it's all about depth over variety.\n\nHere's why: at a solo concert, every single song is one I know and love, so I can sing along from the first track to the encore. The artist tells personal stories between songs, and the whole venue feels connected — thousands of strangers singing with one voice. That moment always gives me goosebumps.\n\nFestivals are fun too, don't get me wrong — but you spend half the time walking between stages and waiting. At the end of the day, I'd rather spend three hours fully immersed in one artist's world. When it comes to concerts, nothing beats that. That's my taste in a nutshell.", "koQ": "어떤 종류의 콘서트를 가장 즐기고, 왜 좋아하나요? 자세히 말해주세요.", "koA": "굳이 골라야 한다면, 수십 팀이 나오는 대형 페스티벌보다는 제가 정말 사랑하는 아티스트의 단독 콘서트를 선택할 거예요. 저한테는 다양함보다 깊이가 전부거든요.\n\n이유는 이래요. 단독 콘서트에서는 모든 곡이 제가 알고 사랑하는 노래라서, 첫 곡부터 앙코르까지 따라 부를 수 있어요. 아티스트는 곡 사이사이에 개인적인 이야기를 들려주고, 공연장 전체가 연결된 느낌이 들죠. 수천 명의 낯선 사람들이 한목소리로 노래하는 순간이요. 그 순간은 항상 소름이 돋아요.\n\n오해는 마세요, 페스티벌도 재밌어요. 근데 시간의 절반을 무대 사이를 걸어 다니고 기다리는 데 쓰게 되잖아요. 결국엔 한 아티스트의 세계에 세 시간 동안 완전히 몰입하는 게 더 좋아요. 콘서트에 관해서라면 그것만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 단독 콘서트(solo)"], ["2️⃣ 기준", "다양함보다 깊이(depth)"], ["3️⃣ 이유", "전곡 떼창 · 한목소리 · 소름"], ["4️⃣ 비교", "페스티벌 = 이동·대기 절반"], ["5️⃣ 마무리", "몰입 3시간 + in a nutshell"]], "scoring": [["A over B 선언법", "\"depth over variety\"처럼 취향을 세 단어로 선언하고 시작하면 나머지는 그 증명이 돼요 ✨ 취향 유형 최고급 오프닝!"], ["감각으로 이유 증명", "떼창, 한목소리, 소름 — 추상적인 \"좋아요\"가 아니라 몸으로 느끼는 장면으로 이유를 증명하세요 🎶"], ["don't get me wrong 활용", "반대편(페스티벌)을 깎기 전에 이 필러를 붙이면 균형 잡힌 사람으로 들려요 🗣️ 쇼핑 취향 That said와 같은 기술 🔁"], ["취향 공식 졸업", "이제 취향 유형 8번째! if I had to choose → it's all about → in a nutshell 공식은 완전히 자동이죠? 🎓 🔁"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 🔁"], ["solo concerts", "단독 콘서트", "festival과 대비되는 선택지 어휘 🎤"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 8연속 등장! 🔁 🎯"], ["depth over variety", "다양함보다 깊이", "A over B = 간결한 취향 선언! ✨"], ["Here's why", "이유는 이래요", "이유 설명 예고 시그널, 리듬 UP ✅"], ["sing along", "따라 부르다, 떼창하다", "콘서트 취향 필수 동사! 경험 편 재등장 🔁"], ["sing with one voice", "한목소리로 노래하다", "떼창의 감동을 그리는 표현 🎶"], ["give me goosebumps", "소름 돋게 하다", "공연 취향 편 재활용 🔁 3종 공통 🔥"], ["don't get me wrong", "오해는 마세요", "반대편 배려 필러, 원어민 필수 🗣️"], ["fully immersed", "완전히 몰입한", "경험의 질을 설명하는 고급 형용사 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 8연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-041 8. 콘서트(Concert)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-041 8. 콘서트(Concert)_취향.mp3"}, {"id": "1-042", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "과거 경험", "badge": "42 과거 경험", "enQ": "Please tell me about the concert that impressed you the most. When and where was it held, and who performed? How did you feel during the concert? Give me as many details as you can.", "enA": "Oh, this reminds me of the IU concert I went to a couple of years ago — it was held at the big dome in Olympic Park, and it's still the best night of my life, concert-wise.\n\nI'd won the ticketing war after three failed attempts, so my expectations were sky-high — and she blew them all away. Her live vocals were even better than the recordings. But the best part came during the encore: she sang her most famous ballad, and the whole crowd sang along, ten thousand voices as one.\n\nI'm not kidding, I had goosebumps from head to toe, and I even got a little teary. For those three hours, I forgot about everything else — work, stress, all of it. In the end, I walked out with a sore throat and the biggest smile, and that afterglow lasted a whole week. So yeah, that's my most impressive concert.", "koQ": "가장 인상 깊었던 콘서트에 대해 말해주세요. 언제 어디서 열렸고, 누가 공연했나요? 콘서트를 보는 동안 어떤 기분이었나요? 가능한 많은 세부사항을 말해주세요.", "koA": "아, 몇 년 전에 갔던 아이유 콘서트가 생각나네요. 올림픽공원의 큰 돔에서 열렸는데, 콘서트로는 아직도 제 인생 최고의 밤이에요.\n\n세 번의 실패 끝에 티켓팅 전쟁에서 이기고 간 거라 기대치가 하늘을 찔렀는데, 그녀는 그 기대를 완전히 뛰어넘었어요. 라이브 보컬이 음원보다 좋았죠. 그런데 최고의 순간은 앙코르 때였어요. 그녀가 가장 유명한 발라드를 불렀는데, 관중 전체가 떼창을 한 거예요. 만 명의 목소리가 하나처럼요.\n\n진짜예요, 머리부터 발끝까지 소름이 돋았고 눈물까지 살짝 났어요. 그 세 시간 동안은 회사도, 스트레스도, 모든 걸 잊었어요. 결국 목이 쉬고 함박웃음을 지은 채로 나왔고, 그 여운이 일주일을 갔어요. 네, 이게 가장 인상 깊었던 콘서트예요.", "struct": [["1️⃣ 도입", "아이유 콘서트 · 올림픽공원 돔"], ["2️⃣ 배경", "티켓팅 3수 끝 성공 · 높은 기대"], ["3️⃣ 절정", "앙코르 떼창 · 만 명이 한목소리"], ["4️⃣ 감정", "전신 소름 · 눈물 · 현실 잊음"], ["5️⃣ 마무리", "쉰 목 + 함박웃음 + 일주일 여운"]], "scoring": [["배경 스토리 깔기", "티켓팅 3수 끝의 성공이라는 배경이 콘서트의 감동을 두 배로 만들어요 ⚔️ 고생한 만큼 감동도 커 보이거든요!"], ["절정 장면 하나 고르기", "3시간을 다 말하려 하지 말고 앙코르 떼창이라는 한 장면에 집중하세요 🎶 as many details의 정답은 선택과 집중!"], ["몸의 반응으로 증명", "소름, 눈물, 쉰 목 — 감정을 몸의 반응으로 표현하면 how did you feel에 대한 최고의 답이 돼요 🔥"], ["시리즈 표현 총출동", "ticketing war, sing along, goosebumps, afterglow까지 콘서트 콤보의 표현들이 경험담에서 다 모여요 🔁 🎓"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 마지막까지 개근! 🔁 🔑"], ["the best night of my life", "내 인생 최고의 밤", "최상급 선언으로 기대감 조성 🌙"], ["ticketing war", "티켓팅 전쟁", "습관 편 재활용 🔁 배경 스토리로!"], ["sky-high expectations", "하늘을 찌르는 기대", "기대치 묘사 관용 표현 📈"], ["blow ~ away", "~을 압도하다/기대 이상이다", "조깅·공연 편 blown away 재활용 🔁 💥"], ["sing along", "떼창하다", "취향 편에 이어 재등장 🔁 🎶"], ["ten thousand voices as one", "만 명의 목소리가 하나로", "떼창 장면의 결정적 한 문장 ✨"], ["goosebumps from head to toe", "머리부터 발끝까지 소름", "goosebumps 시리즈 최종 진화형 🔁 🔥"], ["forget about everything else", "다른 모든 것을 잊다", "몰입의 크기를 보여 주는 표현 🎪"], ["sore throat", "쉰 목", "떼창의 물적 증거! 유머 디테일 😆"], ["afterglow", "여운", "습관 편 재활용 🔁 마무리에 딱 🌅"]], "audio": "audio/1_서베이/1-042 8. 콘서트(Concert)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-042 8. 콘서트(Concert)_과거 경험.mp3"}, {"id": "1-043", "cat": "survey", "catName": "서베이 질문", "num": 8, "topic": "콘서트", "topicEn": "Concert", "type": "비교", "badge": "43 비교", "enQ": "How has your interest in concerts changed over the past few years? What kinds of shows did you enjoy before, and what do you like now? Compare them.", "enA": "My interest in concerts has definitely grown over the past few years. Back then, going to a concert was a once-a-year event for me — I used to go to big music festivals with friends, mostly for the fun atmosphere rather than the music itself.\n\nTo be honest, back then the concert was just an excuse to hang out. Half the time, I didn't even know the artists on stage.\n\nThese days, it's a completely different story. I go to shows much more often, and I choose them carefully — mostly solo concerts of artists whose albums I already know by heart. I save up for good seats, study the setlist in advance, and treat each show like a special occasion. So yeah, compared to before, concerts have gone from a casual hangout to a serious passion — and honestly, I enjoy them way more now.", "koQ": "지난 몇 년간 콘서트에 대한 당신의 관심은 어떻게 변화했나요? 예전에는 어떤 공연을 즐겼고, 지금은 무엇을 좋아하나요? 둘을 비교해주세요.", "koA": "지난 몇 년간 콘서트에 대한 제 관심은 확실히 커졌어요. 그때는 콘서트가 일 년에 한 번 있을까 말까 한 행사였어요. 친구들이랑 대형 음악 페스티벌에 가곤 했는데, 사실 음악보다는 분위기를 즐기러 갔죠.\n\n솔직히 그때 콘서트는 그냥 놀기 위한 핑계였어요. 무대 위 아티스트를 모르는 경우도 절반은 됐으니까요.\n\n요즘은 완전히 다른 이야기예요. 공연을 훨씬 자주 가고, 신중하게 골라요. 주로 앨범을 통째로 외우고 있는 아티스트들의 단독 콘서트죠. 좋은 자리를 위해 돈을 모으고, 셋리스트를 미리 공부하고, 공연 하나하나를 특별한 행사처럼 대해요. 네, 예전과 비교하면 콘서트는 가벼운 놀거리에서 진지한 열정이 됐어요. 그리고 솔직히 지금이 훨씬 더 즐거워요.", "struct": [["1️⃣ 도입", "관심의 성장 (definitely grown)"], ["2️⃣ 과거", "연 1회 · 페스티벌 · 분위기용"], ["3️⃣ 과거", "노는 핑계 · 아티스트도 몰랐음"], ["4️⃣ 현재", "단독 콘서트 · 셋리스트 예습"], ["5️⃣ 마무리", "놀거리 → 열정 + way more"]], "scoring": [["관심의 크기 비교", "이 질문은 취향보다 관심(interest)의 변화를 물어요. 빈도(연 1회→자주)와 태도(핑계→열정)로 답하는 게 정확해요 ✅"], ["솔직한 과거 고백", "\"아티스트도 몰랐다\"는 솔직한 고백이 현재의 진지함을 더 극적으로 만들어요 😅 비교의 낙차 만들기!"], ["행동의 변화 나열", "돈 모으기, 셋리스트 예습, 신중한 선택 — 열정을 말이 아니라 행동 목록으로 증명하세요 💰"], ["서베이 콤보 완주", "공연·음악·콘서트 3종 세트의 표현들이 서로 연결된 걸 느꼈나요? 이 흐름 그대로 실전에서 콤보를 격파하세요! 🎓 🔁"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 마지막 인사! 🔁 🧩"], ["a once-a-year event", "일 년에 한 번뿐인 행사", "빈도를 명사로 표현하는 고급 기술 📅"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 완전 정착! 🔁 💓"], ["an excuse to hang out", "놀기 위한 핑계", "과거의 나를 솔직하게 고백 😅"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 시리즈 공통 🔁 🎭"], ["know ~ by heart", "~을 통째로 외우다", "팬심의 크기를 보여 주는 관용구 💕"], ["save up for ~", "~을 위해 돈을 모으다", "음악 계기 편 save up 재활용 🔁 💰"], ["setlist", "셋리스트", "습관 편 재활용 🔁 예습 디테일 📃"], ["a special occasion", "특별한 행사", "요즘의 진지함을 한 단어로 ✨"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["a serious passion", "진지한 열정", "변화의 도착점을 선언하는 마무리 🎯"]], "audio": "audio/1_서베이/1-043 8. 콘서트(Concert)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-043 8. 콘서트(Concert)_비교.mp3"}, {"id": "1-044", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "묘사", "badge": "44 묘사", "enQ": "Describe the kitchen in your home where you usually cook. What does it look like, and what cooking tools or appliances do you have there? Tell me in detail.", "enA": "My kitchen? Well, it's nothing fancy — it's a small kitchen right next to the living room, with an L-shaped counter. It's compact, but I keep it really well-organized, so everything I need is within arm's reach.\n\nAs for appliances, I've got the basics: an induction stove, a rice cooker, a microwave — and of course, an air fryer. Honestly, that thing is a game changer; I use it almost every day. My pots and pans hang on the wall, and my favorite item is a big wooden cutting board my mom gave me.\n\nWhat I love most about my kitchen is the window right above the sink. Doing the dishes while looking outside is weirdly relaxing. So yeah, it's small, but it's my happy place — that's pretty much my kitchen.", "koQ": "당신이 주로 요리하는 집의 주방을 묘사해주세요. 어떻게 생겼고, 그곳에는 어떤 조리 도구나 가전제품이 있나요? 자세히 말해주세요.", "koA": "제 주방이요? 음, 대단한 건 아니에요. 거실 바로 옆에 붙은 작은 주방인데, ㄱ자 모양 조리대가 있어요. 아담하지만 정리 정돈을 정말 잘해 놔서 필요한 건 전부 손 닿는 곳에 있어요.\n\n가전제품은 기본만 갖췄어요. 인덕션, 밥솥, 전자레인지, 그리고 당연히 에어프라이어요. 솔직히 에어프라이어는 게임 체인저예요. 거의 매일 쓰거든요. 냄비와 팬은 벽에 걸어 두고, 제일 아끼는 물건은 엄마가 주신 커다란 나무 도마예요.\n\n제 주방에서 가장 좋아하는 건 싱크대 바로 위의 창문이에요. 밖을 보면서 설거지하는 게 은근히 힐링이 되거든요. 네, 작지만 저의 행복한 공간이에요. 제 주방은 대체로 이런 모습이에요.", "struct": [["1️⃣ 도입", "작은 주방 · ㄱ자 조리대"], ["2️⃣ 특징", "정리 정돈 · 손 닿는 곳에"], ["3️⃣ 가전", "인덕션 · 밥솥 · 에어프라이어!"], ["4️⃣ 애장품", "엄마가 주신 나무 도마"], ["5️⃣ 마무리", "싱크대 위 창문 + happy place"]], "scoring": [["작아도 당당하게", "\"nothing fancy, but well-organized\"처럼 작은 주방을 숨기지 말고 장점으로 뒤집으세요 😊 진짜 내 공간처럼 들려요!"], ["가전 + 도구 다 답하기", "질문이 tools와 appliances를 둘 다 물어요. 가전 3~4개 + 도마 같은 도구 하나로 균형 있게 답하세요 ✅"], ["스토리 있는 물건", "\"엄마가 주신 도마\"처럼 사연 있는 물건 하나가 주방 묘사를 나만의 이야기로 만들어요 💕"], ["의외의 최애 장소", "싱크대 위 창문처럼 사소한 최애 포인트로 마무리하면 관찰력과 애정이 동시에 전해져요 🪟"]], "expr": [["nothing fancy", "대단한 건 아닌", "겸손하게 시작하는 묘사 오프닝 😊"], ["L-shaped counter", "ㄱ자 조리대", "모양을 알파벳으로! 묘사 치트키 📐"], ["well-organized", "정리가 잘된", "작은 공간의 장점을 살리는 형용사 ✅"], ["within arm's reach", "손 닿는 곳에", "공간 활용을 그림처럼 보여 줘요 🖐️"], ["induction stove", "인덕션", "한국 주방 필수 가전 어휘 🔥"], ["air fryer", "에어프라이어", "K-주방 대표 아이템! 발음 그대로 OK 🍟"], ["a game changer", "게임 체인저, 혁신템", "최애 아이템 강조 만능 표현 💯"], ["cutting board", "도마", "조리 도구(tools) 질문의 정답 아이템 🔪"], ["weirdly relaxing", "은근히 힐링되는", "카페 습관 편 재활용 🔁 😊"], ["my happy place", "나의 행복한 공간", "공간 애정을 한 마디로! 마무리에 딱 💕"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-044 9. 요리(Cooking)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-044 9. 요리(Cooking)_묘사.mp3"}, {"id": "1-045", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "습관", "badge": "45 습관", "enQ": "What dishes do you usually cook, and do you have any special recipes? When and where do you normally cook? Walk me through your cooking process from start to finish.", "enA": "I usually cook simple Korean dishes at home, mostly on weekends when I have time. And yes, I do have a signature dish — my kimchi fried rice. Everyone who tries it asks for the recipe, so let me walk you through it.\n\nFirst things first: old, sour kimchi — that's the key. I chop it up and stir-fry it with a little butter. Butter is my secret ingredient, by the way. Then I add cold rice, a spoonful of kimchi juice, and mix everything over high heat. Finally, I top it off with a fried egg and some sesame seeds.\n\nThe whole thing takes fifteen minutes, tops, but it never fails. Cooking it on a Saturday afternoon, with music on — honestly, that's my kind of therapy. So yeah, that's pretty much my cooking routine, from start to finish.", "koQ": "주로 어떤 요리를 만들고, 특별한 레시피가 있나요? 보통 언제 어디서 요리하나요? 당신의 요리 과정을 처음부터 끝까지 순서대로 설명해주세요.", "koA": "저는 보통 집에서 간단한 한식을 만들어요. 주로 시간 여유가 있는 주말에요. 그리고 네, 저만의 시그니처 요리가 있어요. 바로 김치볶음밥이에요. 먹어 본 사람마다 레시피를 물어보거든요. 순서대로 차근차근 알려 드릴게요.\n\n뭐니 뭐니 해도 첫째는 잘 익은 신김치예요. 그게 핵심이거든요. 김치를 잘게 썰어서 버터를 약간 넣고 볶아요. 참고로 버터가 저의 비밀 재료예요. 그다음 찬밥과 김칫국물 한 숟갈을 넣고 센 불에서 전부 볶아요. 마지막으로 계란 프라이와 깨를 올리면 끝이에요.\n\n다 해서 길어야 15분인데, 실패한 적이 없어요. 토요일 오후에 음악을 틀어 놓고 요리하는 거, 솔직히 그게 저만의 힐링이에요. 네, 이게 처음부터 끝까지, 제 요리 루틴이에요.", "struct": [["1️⃣ 도입", "주말 요리 + 시그니처 소개"], ["2️⃣ 재료", "신김치 + 비밀 재료(버터)"], ["3️⃣ 과정", "볶기 → 밥 → 센 불 마무리"], ["4️⃣ 완성", "계란 프라이 + 깨 토핑"], ["5️⃣ 마무리", "15분 완성 · 요리 = 힐링"]], "scoring": [["요리 하나에 집중", "여러 요리를 나열하지 말고 시그니처 하나를 골라 깊게 설명하세요 🍳 walk me through 질문의 정답은 선택과 집중!"], ["순서 동사 3종 세트", "chop → stir-fry → top it off처럼 조리 동사를 순서대로 쓰면 과정 설명이 저절로 정리돼요 ✅"], ["비밀 재료 스토리", "\"버터가 비밀 재료\" 같은 나만의 팁 하나가 레시피를 암기한 목록이 아니라 진짜 경험담으로 만들어요 🤫"], ["요리 = 힐링 마무리", "과정 설명 후 \"그게 저만의 힐링\"으로 닫으면 습관과 애정을 동시에 전할 수 있어요 😊 공원 취향 편의 therapy 재활용 🔁"]], "expr": [["signature dish", "시그니처 요리", "요리 습관 질문의 만능 소재 선언! 🍳"], ["kimchi fried rice", "김치볶음밥", "설명하기 쉬운 K-푸드 대표 메뉴 🇰🇷"], ["let me walk you through ~", "~을 차근차근 설명할게요", "walk me through 질문 그대로 받아치기 🔁 🎯"], ["First things first", "뭐니 뭐니 해도 첫째는", "조깅 안전 편 재활용 🔁 재료 소개에 딱"], ["stir-fry", "볶다", "한식 조리 동사 1순위! 필수 암기 🔥"], ["secret ingredient", "비밀 재료", "레시피에 스토리를 더하는 킬러 표현 🤫"], ["top it off with ~", "마지막에 ~을 올리다", "요리 마무리 전용 구동사예요 🍳"], ["fried egg", "계란 프라이", "완성 장면을 그리는 비주얼 디테일 ✨"], ["fifteen minutes, tops", "길어야 15분", "tops = 최대. 원어민 느낌 시간 표현 ⏱️"], ["it never fails", "실패한 적이 없다", "자신감 어필! never disappoints의 짝꿍 🔁"], ["from start to finish", "처음부터 끝까지", "질문 표현 받아치기로 마무리 🎯"]], "audio": "audio/1_서베이/1-045 9. 요리(Cooking)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-045 9. 요리(Cooking)_습관.mp3"}, {"id": "1-046", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "취향", "badge": "46 취향", "enQ": "What kind of food do you most enjoy cooking, and why? Do you prefer making Korean dishes or foreign dishes? Tell me why you like cooking that type of food.", "enA": "If I had to choose, I'd definitely go for Korean dishes — especially simple, homestyle ones like stews and fried rice. For me, it's all about comfort: simple over fancy, always.\n\nThere are practical reasons too. The ingredients are already in my fridge — kimchi, garlic, gochujang — so I can start cooking on a whim, without a special shopping trip. Plus, these are the flavors I grew up with, so I can tell by smell alone whether I'm doing it right.\n\nDon't get me wrong, foreign food is fun — I tried making pasta a few times, and it wasn't bad. But it feels like following a manual, while Korean cooking feels like instinct. At the end of the day, nothing beats a warm stew made in my own kitchen. That's my taste in a nutshell.", "koQ": "어떤 종류의 음식을 만드는 것을 가장 즐기고, 그 이유는 무엇인가요? 한식과 외국 요리 중 무엇을 만드는 것을 선호하나요? 왜 그런 음식을 요리하는 것을 좋아하는지 말해주세요.", "koA": "굳이 골라야 한다면, 저는 무조건 한식을 선택할 거예요. 특히 찌개나 볶음밥 같은 소박한 집밥 스타일이요. 저한테는 편안함이 전부거든요. 화려함보다는 소박함, 항상요.\n\n현실적인 이유도 있어요. 김치, 마늘, 고추장 같은 재료가 이미 냉장고에 있으니까, 장을 따로 보지 않아도 내킬 때 바로 요리를 시작할 수 있거든요. 게다가 제가 먹고 자란 맛이라서, 냄새만 맡아도 제대로 되고 있는지 알 수 있어요.\n\n오해는 마세요, 외국 요리도 재밌어요. 파스타를 몇 번 만들어 봤는데 나쁘지 않았어요. 근데 그건 설명서를 따라 하는 느낌이고, 한식은 본능으로 하는 느낌이에요. 결국엔 내 주방에서 끓인 따뜻한 찌개만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 한식 · 소박한 집밥"], ["2️⃣ 기준", "화려함보다 소박함(simple over)"], ["3️⃣ 이유", "냉장고 재료 · 익숙한 맛"], ["4️⃣ 비교", "외국 요리 = 설명서 느낌"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["둘 중 선택 질문 공식", "한식 vs 외국 요리처럼 양자택일 질문은 하나를 고르고, 반대편도 한 번 해 봤다고 언급하는 게 완벽한 구성이에요 ✅"], ["현실 이유 + 감성 이유", "냉장고 재료(현실)와 먹고 자란 맛(감성)을 함께 대면 이유가 입체적으로 들려요 🎯 조깅 취향 편과 같은 기술 🔁"], ["비유로 대비하기", "\"외국 요리는 설명서, 한식은 본능\" 같은 비유 대비가 취향 답변의 어휘 점수를 결정해요 ✨"], ["취향 공식 자동화", "if I had to choose → it's all about → in a nutshell, 9번째 반복이에요 🔁 이제 어떤 취향 질문도 3초 안에 개요가 나오죠? 🎓"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 🔁"], ["go for ~", "~을 선택하다", "취향 단골 동사, 재활용 🔁 👍"], ["homestyle", "집밥 스타일의", "소박한 요리 취향을 한 단어로 🍲"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 9연속 등장! 🔁 🎯"], ["simple over fancy", "화려함보다 소박함", "A over B 선언법, 콘서트 편 재활용 🔁 ✨"], ["on a whim", "내킬 때 바로, 즉흥적으로", "고급 관용구! 즉흥성 표현의 정석 💫"], ["the flavors I grew up with", "먹고 자란 맛", "한식 선호 이유의 결정타 문장 💕"], ["by smell alone", "냄새만으로", "오감 디테일, 카페 편 후각 기술 재활용 🔁"], ["Don't get me wrong", "오해는 마세요", "콘서트 취향 편 재활용 🔁 균형 잡기"], ["nothing beats ~", "~만 한 게 없다", "취향 마무리, 시리즈 개근 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 9연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-046 9. 요리(Cooking)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-046 9. 요리(Cooking)_취향.mp3"}, {"id": "1-047", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "과거 경험", "badge": "47 과거 경험", "enQ": "Please share an interesting or unforgettable experience you had while cooking. What dish were you making, and what made the experience stick in your memory? Tell me everything.", "enA": "Oh, this reminds me of my mom's birthday two years ago. I decided to cook seaweed soup for her — you know, in Korea, we eat it on birthdays, and it's usually the mom who makes it. So I wanted to switch roles for once.\n\nTo be honest, it was my first time making it, so I was secretly video-calling my aunt for directions and double-checking the recipe every two minutes. The kitchen was a complete mess — but somehow, the soup turned out great.\n\nWhen my mom tasted it, she didn't say much... and then I saw her eyes getting red. She told me it was the first birthday soup anyone had ever cooked for her. I'm not kidding, we both ended up tearing up over a bowl of soup. That moment stuck in my memory forever — it taught me that food is really about love. Since then, cooking for her birthday has become our little tradition.", "koQ": "요리하면서 겪은 흥미롭거나 잊을 수 없는 경험을 공유해주세요. 어떤 요리를 만들고 있었고, 무엇이 그 경험을 기억에 남게 했나요? 모든 것을 말해주세요.", "koA": "아, 2년 전 엄마 생신이 생각나네요. 엄마를 위해 미역국을 끓이기로 했거든요. 아시다시피 한국에서는 생일에 미역국을 먹는데, 보통 끓여 주는 사람은 엄마잖아요. 그래서 한 번쯤은 역할을 바꿔 보고 싶었어요.\n\n솔직히 처음 만들어 보는 거라, 몰래 이모와 영상통화를 하면서 만드는 법을 물어보고, 2분마다 레시피를 다시 확인했어요. 주방은 완전 난장판이 됐죠. 그런데 신기하게도 국은 정말 잘 나왔어요.\n\n엄마가 국을 맛보시더니 별말씀이 없으셨어요. 그러다 눈시울이 붉어지는 게 보였어요. 누가 생일 미역국을 끓여 준 건 태어나서 처음이라고 하시더라고요. 진짜예요, 우리 둘 다 미역국 한 그릇을 앞에 두고 눈물이 그렁그렁해졌어요. 그 순간은 평생 기억에 남을 거예요. 음식은 결국 사랑이라는 걸 배웠거든요. 그 후로 엄마 생신에 요리하는 건 우리만의 작은 전통이 됐어요.", "struct": [["1️⃣ 도입", "엄마 생신 · 미역국 도전"], ["2️⃣ 배경", "역할 바꾸기(K-생일 문화 소개)"], ["3️⃣ 과정", "이모 영상통화 · 주방 난장판"], ["4️⃣ 절정", "엄마의 눈물 · 함께 뭉클"], ["5️⃣ 마무리", "음식 = 사랑 + 우리만의 전통"]], "scoring": [["문화 + 감동 콤보", "미역국이라는 K-생일 문화를 소개하면서 가족 감동 이야기까지 — 시험관이 가장 좋아하는 조합이에요 🎂"], ["서툰 과정 = 웃음 포인트", "이모 영상통화, 난장판 주방 같은 서툰 디테일이 웃음을 주고, 뒤의 감동을 두 배로 만들어요 😆"], ["감정의 절정은 짧게", "\"눈시울이 붉어졌다\" — 절정 장면은 길게 설명하지 말고 장면 하나로 보여 주세요 🥲 그게 더 강력해요!"], ["전통으로 마무리", "일회성 경험을 \"매년 하는 전통\"으로 연결하면 Since then 마무리가 한 단계 업그레이드돼요 🔁 💕"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 시리즈 개근! 🔁 🔑"], ["seaweed soup", "미역국", "K-생일 문화 소개까지 되는 만능 소재 🎂"], ["switch roles", "역할을 바꾸다", "이야기의 동기를 한 마디로 설명 🔄"], ["To be honest", "솔직히 말하면", "고백 전 필러, 시리즈 재활용 🔁"], ["video-calling my aunt", "이모와 영상통화", "초보 요리사의 현실 디테일 😆 📞"], ["double-checking", "거듭 확인하며", "카페·쇼핑 편 double-check 재활용 🔁 ✅"], ["a complete mess", "완전 난장판", "카페 경험 total mess의 주방 버전 🔁 😅"], ["turn out great", "결과가 잘 나오다", "반전 결과를 알리는 필수 구동사 ✨"], ["tear up", "눈물이 그렁그렁해지다", "cry보다 섬세한 감정 어휘예요 🥲"], ["stick in my memory", "기억에 남다", "질문 표현 그대로 받아치기! 🎯"], ["our little tradition", "우리만의 작은 전통", "경험 → 전통으로 마무리하는 킬러 표현 💕"]], "audio": "audio/1_서베이/1-047 9. 요리(Cooking)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-047 9. 요리(Cooking)_과거 경험1.mp3"}, {"id": "1-048", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "과거 경험", "badge": "48 과거 경험", "enQ": "Sometimes things go wrong in the kitchen. Tell me about a problem you recently had while cooking. What was the issue, and how did you deal with it? Explain in detail.", "enA": "Oh, kitchen disasters? I've got plenty, but this reminds me of one from just last month. I was making kimchi stew for a friend who was visiting, and I wanted to show off a little.\n\nWhile chatting with her in the living room, I completely lost track of time — and guess what? The stew boiled down to almost nothing, and it was way too salty. To be honest, I was a little panicked, because she was hungry and it was already 8 p.m.\n\nBut instead of starting over, I improvised: I added water, a spoonful of sugar, and dropped in some tofu and an egg to tone down the saltiness. Five minutes later — honestly? It tasted even better than my usual version. We ended up laughing about it, and everything worked out fine. Since then, I've been setting a timer every single time I cook. Lesson learned!", "koQ": "주방에서는 가끔 일이 잘못되기도 합니다. 최근 요리하면서 겪은 문제에 대해 말해주세요. 무엇이 문제였고, 어떻게 대처했나요? 자세히 설명해주세요.", "koA": "아, 주방 사고요? 많죠. 그중에서도 바로 지난달 일이 생각나네요. 놀러 오는 친구를 위해 김치찌개를 끓이고 있었는데, 좀 멋진 모습을 보여 주고 싶었거든요.\n\n거실에서 친구랑 수다를 떨다가 시간 가는 걸 완전히 잊어버렸어요. 그런데 있잖아요, 찌개가 거의 다 졸아붙어서 짜도 너무 짜졌어요. 솔직히 좀 당황했어요. 친구는 배고파하고, 시간은 벌써 저녁 8시였거든요.\n\n그런데 처음부터 다시 하는 대신 임기응변을 발휘했어요. 물을 붓고, 설탕 한 숟갈을 넣고, 짠맛을 잡으려고 두부와 계란을 넣었죠. 5분 뒤에, 솔직히요? 평소보다 더 맛있었어요. 결국 둘 다 웃고 넘어갔고, 모든 게 잘 해결됐어요. 그 후로는 요리할 때마다 타이머를 꼭 맞춰요. 교훈 확실히 얻었죠!", "struct": [["1️⃣ 도입", "지난달 · 친구 위한 김치찌개"], ["2️⃣ 문제", "수다 → 졸아붙음 · 너무 짬"], ["3️⃣ 위기", "배고픈 친구 · 저녁 8시"], ["4️⃣ 해결", "물+설탕+두부 임기응변"], ["5️⃣ 마무리", "더 맛있어짐 + 타이머 교훈"]], "scoring": [["문제 유형 만능 구조", "원인(방심) → 문제(졸아붙음+짠맛) → 해결(임기응변) → 교훈(타이머). 카페·쇼핑 경험 편에서 이어 온 4단 공식 그대로예요 🔁 🧱"], ["구체적인 해결책", "\"어떻게든 해결했다\"가 아니라 물+설탕+두부처럼 구체적인 조치를 나열해야 how did you deal with it의 정답이 돼요 ✅"], ["전화위복 반전", "\"오히려 더 맛있어졌다\"는 반전이 실수담을 최고의 이야기로 바꿔 줘요 😆 실패담일수록 끝은 밝게!"], ["Lesson learned 마무리", "Since then + 새 습관 + \"Lesson learned!\"까지 붙이면 교훈 마무리의 완성형이에요 🔁 🎯"]], "expr": [["kitchen disasters", "주방 사고", "'문제' 질문을 유머로 받는 오프닝 😆"], ["show off", "멋진 모습을 보여 주다", "사건의 동기 = 허세! 공감 백배 😎"], ["lose track of time", "시간 가는 줄 모르다", "사고 원인 설명의 만능 표현 ⏰"], ["boil down", "졸아붙다", "요리 사고 전용 구동사예요 🍲"], ["way too salty", "짜도 너무 짠", "way too = 심하게. 강조 표현 재활용 🔁"], ["a little panicked", "살짝 당황한", "경험 편 감정 표현, 시리즈 개근 🔁 😅"], ["improvise", "임기응변하다", "문제 해결형 답변의 격을 올리는 동사 💡"], ["tone down ~", "(맛·강도를) 낮추다", "요리 조절 표현의 정석! 🎚️"], ["ended up laughing", "결국 웃고 넘어갔다", "카페·공원 경험 편 재활용 🔁 😆"], ["everything worked out fine", "결국 다 잘 해결됐다", "해피엔딩 공식, 시리즈 공통 🔁 ✨"], ["Lesson learned!", "교훈 얻었어요!", "Since then과 세트인 한 방 마무리 ✅"]], "audio": "audio/1_서베이/1-048 9. 요리(Cooking)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-048 9. 요리(Cooking)_과거 경험2.mp3"}, {"id": "1-049", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "과거 경험", "badge": "49 과거 경험", "enQ": "Tell me the story of how you became interested in cooking. Who taught you to cook, or how did you learn? Who did you cook with in the beginning? Give me all the details.", "enA": "Let me tell you how I got into cooking. It started when I moved out and began living alone a few years ago. At first, I lived on delivery food — until I checked my card statement one month. That bill was a real wake-up call.\n\nMy first teacher was, honestly, YouTube. I started with the absolute basics — how to make rice, how to fry an egg. But my real teacher was my mom: every weekend, I would call her, and she would talk me through her recipes step by step. Her instructions were never exact — \"add a little of this, some of that\" — which drove me crazy at first!\n\nIn the beginning, I also cooked with my roommate... actually, my younger brother, when he visited. We made a lot of failed dishes together, but that was half the fun. Since then, cooking has grown on me — what started as a survival skill became a real hobby. So yeah, that's my cooking story.", "koQ": "요리에 관심을 가지게 된 이야기를 들려주세요. 누가 요리를 가르쳐줬나요, 아니면 어떻게 배웠나요? 처음에는 누구와 함께 요리했나요? 모든 세부사항을 말해주세요.", "koA": "제가 어떻게 요리에 빠지게 됐는지 말씀드릴게요. 몇 년 전에 독립해서 혼자 살기 시작하면서였어요. 처음에는 배달 음식으로 살았어요. 어느 달인가 카드 명세서를 확인하기 전까지는요. 그 금액이 진짜 정신이 번쩍 드는 계기였어요.\n\n첫 스승은, 솔직히 유튜브였어요. 밥 짓기, 계란 프라이 같은 완전 기초부터 시작했죠. 그런데 진짜 스승은 엄마였어요. 주말마다 전화하면 엄마가 레시피를 하나하나 차근차근 알려 주셨거든요. 근데 엄마의 설명은 절대 정확하지가 않아요. '이거 조금, 저거 적당히' — 처음엔 그것 때문에 미치는 줄 알았어요!\n\n처음에는 놀러 온 남동생과도 같이 요리했어요. 실패작을 많이 만들었지만 그것도 재미의 절반이었죠. 그 후로 요리에 점점 정이 들었고, 생존 기술로 시작한 게 진짜 취미가 됐어요. 네, 이게 제 요리 입문 스토리예요.", "struct": [["1️⃣ 도입", "독립 · 카드 명세서 충격"], ["2️⃣ 유튜브", "완전 기초부터 독학 시작"], ["3️⃣ 엄마", "주말 전화 레시피 과외"], ["4️⃣ 동료", "남동생과 실패작 제조"], ["5️⃣ 마무리", "생존 기술 → 진짜 취미"]], "scoring": [["질문 3요소 배치", "계기(명세서) · 스승(유튜브+엄마) · 초기 동료(남동생)까지, 질문이 물은 세 가지를 문단별로 배치했어요 ✅"], ["엄마표 '적당히' 유머", "\"이거 조금, 저거 적당히\"는 전 세계 공통 엄마 레시피 유머예요 😆 시험관도 웃는 만능 디테일!"], ["생존 → 취미 변화 축", "a survival skill became a hobby처럼 시작과 현재를 한 문장으로 이으면 계기 스토리의 척추가 완성돼요 📈"], ["계기 공식 3번째", "배경 → wake-up call → 배움 → 현재. 조깅·음악 계기 편과 같은 공식이에요 🔁 계기 유형도 이제 졸업! 🎓"]], "expr": [["get into ~", "~에 빠지다/시작하다", "계기 질문 정답 동사, 3번째 등장 🔁 🎯"], ["move out", "독립하다, 집을 나오다", "계기 이야기의 단골 출발점 🏠"], ["live on delivery food", "배달 음식으로 살다", "독립 초반의 현실 공감 디테일 🛵"], ["card statement", "카드 명세서", "충격의 물증! 숫자 없이도 실감나요 💳"], ["wake-up call", "정신이 번쩍 든 계기", "조깅 계기 편 재활용 🔁 ⏰"], ["talk me through ~", "~을 차근차근 알려 주다", "walk you through의 전화 버전! 🔁 📞"], ["drove me crazy", "미치게 만들었다", "엄마표 '적당히' 레시피 유머 포인트 😆"], ["failed dishes", "실패작들", "서툰 시작을 웃음으로 소화하기 🍳"], ["grow on me", "점점 정이 들다", "천천히 좋아졌다는 고급 표현이에요 🌱"], ["a survival skill", "생존 기술", "시작과 끝을 잇는 반전 키워드 💪"], ["Since then", "그 후로", "경험 마무리 시그널, 시리즈 공통 🔁"]], "audio": "audio/1_서베이/1-049 9. 요리(Cooking)_과거 경험3.mp3", "label": "과거 경험 3", "qaudio": "audio_q/1_서베이/1-049 9. 요리(Cooking)_과거 경험3.mp3"}, {"id": "1-050", "cat": "survey", "catName": "서베이 질문", "num": 9, "topic": "요리", "topicEn": "Cooking", "type": "비교", "badge": "50 비교", "enQ": "Compare the dishes of your country with those of another country. How are they different? Are the main differences in the ingredients or in the way the food is prepared? Tell me in detail.", "enA": "That's an interesting question. Let me compare Korean food with Italian food, since pasta is the foreign dish I cook most often. The biggest difference, in my opinion, is in the base ingredients.\n\nKorean food is built on fermented ingredients — kimchi, soybean paste, gochujang. That's why our dishes have that deep, complex flavor. Italian food, on the other hand, relies on fresh basics: tomatoes, olive oil, cheese, and herbs.\n\nThe way we eat is different too. Korean meals are all about sharing — one stew in the middle and countless side dishes — while Italian meals come in courses, one plate per person. Cooking-wise, we simmer and ferment; they focus on timing, like cooking pasta al dente. So yeah, compared to Italian food, Korean food is deeper and more communal. My conclusion? Fusion is the answer!", "koQ": "당신 나라의 요리와 다른 나라의 요리를 비교해주세요. 어떻게 다른가요? 주된 차이점이 재료에 있나요, 아니면 조리 방식에 있나요? 자세히 말해주세요.", "koA": "흥미로운 질문이네요. 한식과 이탈리아 요리를 비교해 볼게요. 제가 가장 자주 만드는 외국 요리가 파스타거든요. 제 생각에 가장 큰 차이는 기본 재료에 있어요.\n\n한식은 발효 재료를 바탕으로 하는 요리예요. 김치, 된장, 고추장이요. 그래서 우리 음식에 그런 깊고 복합적인 맛이 있는 거죠. 반면 이탈리아 요리는 신선한 기본 재료에 의존해요. 토마토, 올리브유, 치즈, 허브요.\n\n먹는 방식도 달라요. 한식은 나눠 먹는 게 핵심이에요. 가운데 찌개 하나에 반찬도 셀 수 없이 많죠. 반면 이탈리아 요리는 코스로, 한 사람당 한 접시씩 나와요. 조리 방식으로는 우리는 끓이고 발효시키는 반면, 그쪽은 타이밍에 집중해요. 파스타를 알덴테로 삶는 것처럼요. 네, 이탈리아 요리와 비교하면 한식은 더 깊고 더 함께하는 음식이에요. 결론은? 퓨전이 답이에요!", "struct": [["1️⃣ 도입", "비교 대상 선정(한식 vs 이탈리아)"], ["2️⃣ 재료", "발효(장류) vs 신선 재료"], ["3️⃣ 식탁", "나눠 먹기·반찬 vs 코스"], ["4️⃣ 조리법", "끓이고 발효 vs 타이밍(알덴테)"], ["5️⃣ 마무리", "깊고 함께 먹는 한식 + 퓨전이 답!"]], "scoring": [["과거·현재형 비교 아님!", "이 문제는 나라 간 비교라서 Back then이 아니라 on the other hand로 축을 잡아요 🔄 비교 유형의 변형에 주의!"], ["질문의 힌트 활용", "질문이 재료냐 조리 방식이냐고 힌트를 줬어요. 재료 → 먹는 법 → 조리법 순서로 그 힌트를 그대로 목차로 쓰세요 ✅"], ["아는 요리로 비교", "직접 만들어 본 파스타를 비교 대상으로 고르면 요리 콤보 전체(취향·경험)와 자연스럽게 이어져요 🔁 🍝"], ["중립 + 유머 마무리", "한쪽을 깎지 말고 \"둘 다 사랑, 퓨전이 답\"처럼 유쾌하게 닫으면 문화 비교 질문의 모범 답안이 돼요 😆"]], "expr": [["The biggest difference is ~", "가장 큰 차이는 ~이다", "나라 비교 질문의 뼈대 문장! 🧩"], ["base ingredients", "기본 재료", "질문의 ingredients 그대로 받아치기 🎯"], ["fermented ingredients", "발효 재료", "한식 설명의 핵심 어휘! 필수 암기 🏺"], ["deep, complex flavor", "깊고 복합적인 맛", "발효의 맛을 형용사 2연타로 ✨"], ["on the other hand", "반면에", "비교 전환 시그널의 정석이에요 🔄"], ["all about sharing", "나눠 먹는 게 핵심", "it's all about의 식문화 버전 🔁 🥘"], ["side dishes", "반찬", "K-식탁 설명 필수 단어! banchan도 OK 🍚"], ["simmer and ferment", "끓이고 발효시키다", "조리 방식(way) 질문의 정답 동사 🍲"], ["al dente", "알덴테(살짝 단단하게)", "외국 요리 지식 어필 디테일 🍝"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["Fusion is the answer!", "퓨전이 답이다!", "나라 비교를 유쾌하게 닫는 한 방 😆"]], "audio": "audio/1_서베이/1-050 9. 요리(Cooking)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-050 9. 요리(Cooking)_비교.mp3"}, {"id": "1-051", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "묘사", "badge": "51 묘사", "enQ": "Tell me about the bar you visit most often. Where is it located, and what does the place look like inside? Describe that bar in as much detail as possible.", "enA": "The bar I visit most often is a small craft beer pub near my place. It's tucked away in a basement — you could easily walk past it without noticing — but that hidden feeling is exactly what makes it special.\n\nInside, it's got a really cozy, moody vibe: brick walls, dim warm lighting, wooden tables, and shelves lined with beer glasses from all over the world. There's always soft jazz or old pop playing, and the owner collects vinyl records, which are displayed along one wall. It's never too loud, so you can actually have a conversation.\n\nThey've got about ten kinds of craft beer on tap, and the owner always recommends something new based on your mood. So yeah, that's pretty much my favorite bar — it feels less like a bar and more like a friend's living room.", "koQ": "가장 자주 가는 술집에 대해 말해주세요. 어디에 위치해 있고, 내부는 어떻게 생겼나요? 그 술집을 가능한 자세히 묘사해주세요.", "koA": "제가 가장 자주 가는 술집은 집 근처의 작은 수제맥주 펍이에요. 지하에 숨어 있어서 모르면 그냥 지나치기 쉬운데, 그 숨어 있는 느낌이 바로 이 가게의 매력이에요.\n\n내부는 정말 아늑하고 무드 있는 분위기예요. 벽돌 벽, 은은하고 따뜻한 조명, 나무 테이블, 그리고 세계 각국의 맥주잔이 늘어선 선반들이요. 항상 잔잔한 재즈나 올드팝이 흐르고, 사장님이 LP를 수집하셔서 한쪽 벽에 쭉 진열되어 있어요. 시끄럽지 않아서 진짜 대화가 가능한 곳이죠.\n\n생맥주로 마실 수 있는 수제맥주가 열 종류쯤 있는데, 사장님이 항상 그날 기분에 맞춰 새로운 걸 추천해 주세요. 네, 이게 제 최애 술집이에요. 술집이라기보다는 친구네 거실 같은 곳이에요.", "struct": [["1️⃣ 도입", "집 근처 수제맥주 펍"], ["2️⃣ 위치", "지하에 숨은(tucked away) 매력"], ["3️⃣ 내부", "벽돌 · 조명 · LP · 재즈"], ["4️⃣ 특징", "대화 가능 · 사장님 추천"], ["5️⃣ 마무리", "친구네 거실 비유 + 정리"]], "scoring": [["숨은 가게 스토리", "\"모르면 지나치는 지하 펍\"이라는 설정 자체가 이야기가 돼요 🚶 흔한 체인점보다 훨씬 기억에 남는 소재!"], ["오감 총동원", "눈(조명·LP), 귀(재즈), 입(수제맥주)까지 — 술집은 오감 묘사 연습에 최적의 주제예요 🎧 카페 편 기술 재활용 🔁"], ["사람 디테일 넣기", "기분 따라 추천해 주는 사장님 한 명이 공간 묘사에 온기를 더해요 😊 카페 묘사 편과 같은 원리 🔁"], ["비유로 마무리", "\"친구네 거실 같은 곳\" — 카페의 second living room처럼 공간 비유 마무리는 묘사의 격을 올려 줘요 🔁 🛋️"]], "expr": [["craft beer pub", "수제맥주 펍", "요즘 술집 묘사의 대표 소재 🍺"], ["tucked away", "(지하에) 숨어 있는", "카페 묘사 편 재활용 🔁 히든 플레이스 감성"], ["walk past it without noticing", "모르고 지나치다", "숨은 가게 묘사의 킬러 문장 🚶"], ["cozy, moody vibe", "아늑하고 무드 있는 분위기", "cozy+vibe 콤보의 확장판 🔁 ✨"], ["dim warm lighting", "은은하고 따뜻한 조명", "술집 분위기 묘사 1순위 디테일 💡"], ["vinyl records", "LP판", "감성 술집 인증 소품! 🎵"], ["have a conversation", "대화를 나누다", "조용한 술집의 장점 = 취향 편 복선 🔁"], ["on tap", "생맥주로", "맥주 주제 전문 표현! 어휘 점수 UP 🍻"], ["based on your mood", "그날 기분에 맞춰", "사장님 추천 디테일로 단골 인증 😊"], ["a friend's living room", "친구네 거실", "분위기를 한 방에 요약하는 비유 🛋️"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-051 10. 술집_바(Bars)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-051 10. 술집_바(Bars)_묘사.mp3"}, {"id": "1-052", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "습관", "badge": "52 습관", "enQ": "What do you usually do when you go to a bar? Who do you normally go with, and what do you like to order there? Describe your typical time at the bar in detail.", "enA": "I usually go to a bar on Friday nights, and my drinking buddy is almost always my best friend — the same one I go to movies with. It depends on the week, but we go maybe two or three times a month.\n\nOur order never changes: a couple of craft beers on tap and some fried chicken — you know, chimaek! It's the classic Korean combo of chicken and beer. Then we just talk for hours — work stuff, funny stories, life plans. We have one golden rule, though: no phones on the table. That way, we actually talk instead of scrolling.\n\nWe usually call it a night around midnight — we're not big drinkers, honestly. It's less about the alcohol and more about unwinding after a long week. So yeah, that's pretty much my typical night at the bar, and it never gets old.", "koQ": "술집에 갈 때 주로 무엇을 하나요? 보통 누구와 함께 가고, 그곳에서 무엇을 주문하는 것을 좋아하나요? 술집에서 보내는 일반적인 시간을 자세히 설명해주세요.", "koA": "저는 보통 금요일 밤에 술집에 가요. 술친구는 거의 항상 절친이에요. 영화도 같이 보러 가는 그 친구요. 주에 따라 다르긴 한데, 한 달에 두세 번쯤 가는 것 같아요.\n\n주문은 절대 안 바뀌어요. 생맥주로 나오는 수제맥주 몇 잔에 후라이드 치킨이요. 아시죠, 치맥! 치킨과 맥주라는 한국의 클래식 조합이요. 그러고는 몇 시간이고 수다를 떨어요. 회사 얘기, 웃긴 얘기, 인생 계획까지요. 근데 우리만의 황금 규칙이 하나 있어요. 테이블 위에 폰 올리지 않기. 그래야 폰만 들여다보지 않고 진짜 대화를 하거든요.\n\n보통 자정쯤 마무리해요. 솔직히 저희 둘 다 술을 많이 마시는 편은 아니에요. 술보다는 한 주의 피로를 푸는 게 목적이거든요. 네, 이게 제가 술집에서 보내는 일반적인 밤인데, 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "금요일 밤 · 절친과 월 2~3회"], ["2️⃣ 주문", "수제맥주 + 치킨 = 치맥!"], ["3️⃣ 활동", "몇 시간 수다(일·인생 얘기)"], ["4️⃣ 규칙", "테이블 위 폰 금지(golden rule)"], ["5️⃣ 마무리", "자정 귀가 · 술보다 힐링"]], "scoring": [["치맥 문화 소개", "chimaek이라는 단어를 그대로 소개하고 뜻을 풀어 주면 문화 설명 점수를 통째로 가져와요 🍗 콘서트 편 티켓팅 전쟁과 같은 기술 🔁"], ["질문 3요소 커버", "무엇을(수다)·누구와(절친)·주문(치맥)까지 질문의 세 가지를 순서대로 배치했어요 ✅"], ["폰 금지 규칙 디테일", "\"no phones on the table\" 규칙 하나가 우리 우정의 깊이까지 보여 줘요 📵 golden rule 패턴 재활용 🔁"], ["건강한 음주 마무리", "\"술보다 힐링이 목적\"이라는 마무리는 균형 잡힌 인상을 주는 안전하고 세련된 마무리예요 😌"]], "expr": [["drinking buddy", "술친구", "동행 소개를 한 단어로! 유쾌한 어휘 🍻"], ["It depends on the week", "그 주마다 달라요", "it depends 패턴의 변형, 재활용 🔁 ⏳"], ["craft beers on tap", "생맥주로 나오는 수제맥주", "묘사 편 on tap 재활용 🔁 🍺"], ["chimaek", "치맥", "치킨+맥주! 그대로 소개하는 K-문화 🍗"], ["the classic Korean combo", "한국의 클래식 조합", "문화 소개를 세련되게 포장하는 구문 🇰🇷"], ["golden rule", "황금 규칙", "공연 습관 편 재활용 🔁 나만의 규칙!"], ["no phones on the table", "테이블 위 폰 금지", "요즘 감성 디테일! 대화 중시 어필 📵"], ["instead of scrolling", "폰만 보는 대신", "scroll = SNS 넘겨보기. 현대인 공감 📱"], ["call it a night", "(하루를) 마무리하다", "술자리 마무리 원어민 필수 표현 🌙"], ["unwind after a long week", "한 주의 피로를 풀다", "wind down의 짝꿍, 음악 편 재활용 🔁 😌"], ["it never gets old", "아무리 해도 질리지 않는다", "습관 마무리 표현, 시리즈 공통 🔁"]], "audio": "audio/1_서베이/1-052 10. 술집_바(Bars)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-052 10. 술집_바(Bars)_습관.mp3"}, {"id": "1-053", "cat": "survey", "catName": "서베이 질문", "num": 10, "topic": "술집/바", "topicEn": "Bars", "type": "취향", "badge": "53 취향", "enQ": "What kind of bars do you prefer to go to, and why? Do you choose a bar for its drinks, food, music, or atmosphere? Tell me what you look for in a good bar.", "enA": "If I had to choose, I'd always go for quiet, cozy bars over loud, crowded ones. For me, it's all about one simple test: can we actually hear each other talk?\n\nOf course, good drinks matter — I love trying new craft beers — but drinks are only half the story. What really makes a good bar is the atmosphere: warm lighting, music at just the right volume, and seats where you can settle in for hours. That's why I avoid clubs and huge franchise pubs — shouting over the music all night just wears me out.\n\nDon't get me wrong, I enjoy a lively place once in a while, like when we're celebrating something. But my default is always somewhere calm. When it comes to bars, conversation over volume — that's my taste in a nutshell.", "koQ": "어떤 종류의 술집에 가는 것을 선호하고, 그 이유는 무엇인가요? 술, 음식, 음악, 분위기 중 무엇을 보고 술집을 고르나요? 좋은 술집의 기준이 무엇인지 말해주세요.", "koA": "굳이 골라야 한다면, 저는 항상 시끄럽고 붐비는 곳보다 조용하고 아늑한 술집을 선택해요. 저한테는 아주 간단한 기준이 전부거든요. 서로의 말소리가 진짜 들리는가?\n\n물론 술도 중요해요. 새로운 수제맥주를 시도하는 걸 좋아하니까요. 근데 술은 절반일 뿐이에요. 좋은 술집을 만드는 건 결국 분위기예요. 따뜻한 조명, 딱 적당한 볼륨의 음악, 그리고 몇 시간이고 눌러앉을 수 있는 자리요. 그래서 클럽이나 대형 프랜차이즈 호프집은 피해요. 밤새 음악 소리 너머로 소리 지르다 보면 진이 다 빠지거든요.\n\n오해는 마세요, 가끔은 신나는 곳도 좋아해요. 뭔가 축하할 일이 있을 때처럼요. 하지만 제 기본값은 항상 차분한 곳이에요. 술집에 관해서라면, 볼륨보다 대화. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 조용하고 아늑한 바"], ["2️⃣ 기준", "서로 말이 들리는가?(테스트)"], ["3️⃣ 이유", "분위기 = 조명·음악·좌석"], ["4️⃣ 비선호", "클럽·대형 호프(진 빠짐)"], ["5️⃣ 마무리", "conversation over volume!"]], "scoring": [["나만의 테스트 제시", "\"서로 말이 들리는가?\"라는 기준 하나를 질문 형태로 던지면 what you look for에 대한 가장 선명한 답이 돼요 💬"], ["질문의 4요소 정리", "술·음식·음악·분위기 중 고르라는 질문이에요. 술은 절반, 분위기가 결정타라고 순위를 매기면 완벽한 구성 ✅"], ["예외 상황 인정", "축하할 땐 신나는 곳도 OK — 예외 하나가 답변을 유연하고 현실적으로 만들어요 🔁 쇼핑 취향 That said와 같은 기술!"], ["A over B 마무리", "conversation over volume처럼 세 단어 선언으로 끝내면 취향이 슬로건처럼 각인돼요 💯 콘서트 편 재활용 🔁"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 시리즈 개근 🔁"], ["go for A over B", "B보다 A를 선택하다", "go for + over 결합형! 한 단계 진화 🔁 ✨"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 10연속 등장! 🔁 🎯"], ["Can we hear each other talk?", "서로 말소리가 들리는가?", "나만의 기준을 질문으로 던지기! 💬"], ["only half the story", "절반일 뿐", "영화 편 half the reason의 사촌 🔁 😊"], ["settle in for hours", "몇 시간이고 눌러앉다", "편안함을 그리는 고급 구동사 🛋️"], ["That's why ~", "그래서 ~한 거예요", "이유 연결 시그널, 재활용 🔁 🔗"], ["wear me out", "진을 빼다", "tired의 구어체 상위 호환! 😮‍💨"], ["Don't get me wrong", "오해는 마
