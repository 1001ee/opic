로 삼키다", "깊은 소파 과장 묘사 😆"], ["stand guard", "보초를 서다", "지형 편 재활용, 테이블 의인화 🔁 ✨"], ["landing moment", "착지의 순간", "하루의 끝 감각 표현 💕"], ["sink into ~", "~에 푹 가라앉다", "소파 착지 필수 동사 ✅"], ["memorize my shape", "내 모양을 외우다", "단골 자리 애정 유머 😆"], ["host", "받아주다, 열어주다", "소파의 역할 동사 🔑"], ["less A, more B", "A라기보단 B", "지형 편 재활용 구문 🔁 ✅"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 💬"]], "audio": "audio/2_돌발/2-083 17. 가구(Furniture)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-083 17. 가구(Furniture)_취향.mp3"}, {"id": "2-084", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "과거 경험", "badge": "84 과거 경험", "enQ": "Tell me about a problem you have had with your furniture. Was it broken or damaged? What happened, and how did you solve it? Tell me from beginning to end.", "enA": "This reminds me of the great sofa crisis of last year. It started small: a tiny creak whenever I sat down. I ignored it for weeks — classic mistake — until one evening, I did my usual happy landing and the whole left side tilted with a loud crack. One of the legs had given up on me!\n\nMy emergency fix was not my proudest moment: I slid a stack of old books under the corner and lived like that for three days. But then I did what I always do — I opened YouTube, typed 'sofa leg repair', and found a five-minute video. Guess what: one new leg, one screwdriver, and thirty careful minutes later, my sofa stood proud again.\n\nIt worked out fine, and the repair cost less than a chicken dinner! Since then, two things changed: I have a real toolbox now, and I never ignore a creak — furniture whispers before it breaks down, you know.", "koQ": "가구와 관련해 겪은 문제에 대해 말해주세요. 부러졌거나 손상되었나요? 무슨 일이 있었고, 어떻게 해결했나요? 처음부터 끝까지 말해주세요.", "koA": "작년의 대소파 위기가 떠오르네요. 시작은 사소했어요. 앉을 때마다 나는 작은 삐걱 소리요. 몇 주를 무시했죠. 전형적인 실수예요. 그러다 어느 저녁, 여느 때처럼 행복한 착지를 했는데 왼쪽 전체가 큰 소리와 함께 기울어졌어요. 다리 하나가 저를 포기해버린 거죠!\n\n제 응급 처치는 자랑스러운 순간은 아니었어요. 구석에 헌 책 더미를 밀어 넣고 사흘을 그렇게 살았거든요. 그러다 늘 하던 대로 했죠. 유튜브를 열고 소파 다리 수리를 검색했더니 5분짜리 영상이 나왔어요. 있잖아요, 새 다리 하나, 드라이버 하나, 그리고 조심스러운 30분 뒤에 제 소파는 다시 당당하게 섰어요.\n\n결국 다 잘 풀렸고, 수리비는 치킨 한 마리보다 쌌어요! 그 뒤로 두 가지가 변했어요. 이제 진짜 공구함이 생겼고, 삐걱 소리를 절대 무시하지 않아요. 가구는 무너지기 전에 속삭이거든요.", "struct": [["1️⃣ 발단", "무시한 작은 삐걱 소리"], ["2️⃣ 위기", "착지 순간 왼쪽 붕괴"], ["3️⃣ 응급", "책 더미 받침 사흘"], ["4️⃣ 해결", "유튜브 5분 영상 + 드라이버"], ["5️⃣ 교훈", "가구는 무너지기 전 속삭인다"]], "scoring": [["처음부터 끝까지", "삐걱 → 무시 → 붕괴 → 책 받침 → 유튜브 수리 — from beginning to end 요청에 5단계 타임라인으로 답해요 ✅"], ["유튜브 해결사", "수리법도 유튜브에서 — 시리즈의 유튜브 최애 설정이 문제 해결 능력으로 변신하는 페이지예요 🔁 🎓"], ["치킨 환산법", "수리비가 치킨 한 마리보다 쌌다 — 비용을 치킨으로 환산하는 한국식 유머가 성취감을 재치 있게 전해요 😆 💳"], ["속삭임 명언", "가구는 무너지기 전에 속삭인다 — 작은 신호를 무시하지 말라는 교훈을 의인화 명언으로 닫아요 💬 🎓"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["creak", "삐걱 (소리)", "가구 문제의 첫 신호 소리 🎵"], ["tilt", "기울다", "소파 붕괴 순간 동사 🎭"], ["give up on me", "나를 포기하다", "다리 의인화 유머 😆"], ["emergency fix", "응급 처치", "책 더미 받침 표현 ✅"], ["not my proudest moment", "자랑스럽진 않은 순간", "자기 유머 관용구 😆"], ["screwdriver", "드라이버", "수리 장면 필수 소품 💪"], ["stand proud", "당당하게 서다", "수리 성공 의인화 ✨"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😊"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["break down", "고장 나다, 무너지다", "교훈 명언의 핵심 동사 🔑"]], "audio": "audio/2_돌발/2-084 17. 가구(Furniture)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-084 17. 가구(Furniture)_과거 경험.mp3"}, {"id": "2-085", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "비교", "badge": "85 비교", "enQ": "Compare the furniture in your home now with the furniture from your childhood home. How have furniture styles and materials changed? Tell me in detail.", "enA": "Back then, furniture used to be heavy — physically and emotionally! Our home had a huge dark-wood wardrobe, my mom's pride, decorated with mother-of-pearl. Moving it took three adults, so nobody ever moved it. Furniture was bought once and kept for life.\n\nThese days, it's a completely different story. My furniture is light in every sense: pale wood, soft fabric, slim metal legs. Half of it arrived in flat boxes I assembled myself, hex key in hand. Compared to my mom's wardrobe, my bookshelf is basically paper — but I can rearrange my whole room in one afternoon, alone.\n\nI have to admit, though: her wardrobe outlived three of my bookshelves and still looks royal. We traded permanence for freedom, I guess. My furniture moves with me — hers was the house itself, if you ask me.", "koQ": "지금 집에 있는 가구와 어린 시절 집에 있던 가구를 비교해주세요. 가구의 스타일과 소재는 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 가구가 무거웠어요. 물리적으로도 정서적으로도요! 우리 집엔 엄마의 자랑이던 거대한 짙은 원목 장롱이 있었는데, 자개로 장식되어 있었죠. 옮기려면 어른 셋이 필요해서 아무도 절대 안 옮겼어요. 그 시절 가구는 한 번 사서 평생 쓰는 거였죠.\n\n요즘은 완전히 다른 이야기예요. 제 가구는 모든 의미에서 가벼워요. 밝은 원목, 부드러운 패브릭, 가느다란 금속 다리. 절반은 납작한 박스로 도착해서 제가 작은 육각 렌치로 직접 조립했어요. 엄마의 장롱과 비교하면 제 책장은 사실상 종이죠. 근데 저는 오후 한나절이면 혼자서 방 전체를 재배치할 수 있어요.\n\n그래도 인정할 건 인정해야죠. 엄마의 장롱은 제 책장 세 개보다 오래 살았고 여전히 위엄이 넘쳐요. 우리는 영속성을 자유와 맞바꾼 것 같아요. 제 가구는 저와 함께 움직이지만, 제 생각엔 엄마의 가구는 집 그 자체였어요.", "struct": [["1️⃣ 과거", "자개 장롱, 어른 셋의 무게"], ["2️⃣ 상징", "한 번 사서 평생 쓰기"], ["3️⃣ 현재", "밝은 원목 · 조립식 · 경량"], ["4️⃣ 대비", "영속성 vs 자유"], ["5️⃣ 마무리", "내 가구는 나와 움직인다"]], "scoring": [["무게 프레임", "물리적으로도 정서적으로도 무거웠다 — 무게라는 한 단어로 스타일과 소재 변화를 동시에 여는 프레임이에요 🔑 ✨"], ["자개장 카드", "엄마의 자개 장롱은 K-가구의 대표 소품 — 어른 셋, 아무도 안 옮김 같은 디테일이 시대를 통째로 소환해요 😆 🎓"], ["맞바꿈 명언", "영속성을 자유와 맞바꿨다(traded permanence for freedom) — 가구 비교를 가치의 언어로 올리는 한 줄이에요 💬 🎓"], ["집 그 자체", "내 가구는 나와 움직이고, 엄마의 가구는 집 그 자체였다 — 이동성 대비로 닫는 마무리가 긴 여운을 남겨요 💕 😊"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["wardrobe", "장롱, 옷장", "옛집 가구 대표 명사 ✅"], ["mother-of-pearl", "자개", "K-가구 시그니처 디테일 ✨"], ["for life", "평생 쓰는", "옛 가구의 철학 한 마디 🔑"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["flat box", "납작한 박스", "조립식 가구 시대 소품 📏"], ["hex key", "육각 렌치", "셀프 조립 디테일 소품 💪"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["outlive", "~보다 오래 살다", "장롱의 위엄 증명 동사 🔑"], ["trade A for B", "A를 B와 맞바꾸다", "영속성 vs 자유 명언 뼈대 💬"]], "audio": "audio/2_돌발/2-085 17. 가구(Furniture)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-085 17. 가구(Furniture)_비교.mp3"}, {"id": "2-086", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "묘사", "badge": "86 묘사", "enQ": "What kinds of chores do you have at home? Tell me about the housework you are responsible for in detail.", "enA": "Well, I live alone, so here's the funny truth: I'm responsible for everything — I'm the cook, the cleaner, the laundry staff, and the recycling department, all in one person. A one-person company, basically!\n\nPicture this as my weekly lineup: cooking almost every evening — that's the fun department. Dishes right after dinner, because my golden rule says a sink should sleep empty. Laundry twice a week, and every Saturday morning, my dust patrol across the shelves and my gray sofa. And of course, Tuesday is recycling night — sorted, rinsed, and carried out on my way to jog.\n\nThe hardest part isn't any single chore — it's that nobody else is coming! But honestly, keeping my small home running smoothly gives me a quiet kind of pride. That's pretty much my job list as the CEO of this apartment.", "koQ": "집에서 맡고 있는 집안일에는 어떤 것들이 있나요? 당신이 담당하는 집안일에 대해 자세히 말해주세요.", "koA": "음, 저는 혼자 살아서 재미있는 진실이 하나 있어요. 제가 모든 걸 담당해요. 요리사, 청소부, 세탁 담당, 재활용 부서까지 전부 한 사람이죠. 한마디로 1인 기업이에요!\n\n제 주간 라인업을 상상해보세요. 요리는 거의 매일 저녁이에요. 그건 즐거운 부서죠. 설거지는 저녁 직후예요. 싱크대는 비운 채 재워야 한다는 저의 황금률 때문에요. 빨래는 주 2회, 그리고 토요일 아침마다 선반과 회색 소파를 도는 먼지 순찰. 물론 화요일은 재활용의 밤이에요. 분류하고, 헹구고, 조깅 가는 길에 들고 나가죠.\n\n가장 힘든 부분은 어떤 특정 집안일이 아니라, 아무도 대신 와주지 않는다는 거예요! 그래도 솔직히, 제 작은 집이 매끄럽게 돌아가게 하는 건 조용한 자부심을 줘요. 이게 이 아파트의 CEO로서 제 업무 목록이에요.", "struct": [["1️⃣ 선언", "1인 가구 = 전 부서 담당"], ["2️⃣ 요리", "매일 저녁, 즐거운 부서"], ["3️⃣ 규칙", "싱크대는 비운 채 재우기"], ["4️⃣ 주간", "빨래 주 2회 · 토요 순찰"], ["5️⃣ 마무리", "아파트의 CEO 자부심"]], "scoring": [["1인 기업 프레임", "혼자 사니까 전부 내 담당 — 요리사 · 청소부 · 세탁 담당 · 재활용 부서로 직함을 나누면 나열이 유머가 돼요 😆 ✅"], ["요일 라인업", "매일(요리 · 설거지) · 주 2회(빨래) · 토요일(먼지 순찰) · 화요일(재활용) — 빈도표가 담당 집안일의 증거예요 📊"], ["시리즈 총집합", "먼지 순찰은 가구 편, 화요일 배출은 재활용 편 그대로 — 집안일 주제는 앞 주제들의 루틴 종합 세트예요 🔁 🎓"], ["자부심 마무리", "아무도 대신 안 와준다는 투정 뒤에 조용한 자부심으로 닫기 — 불평을 애정으로 뒤집는 마무리가 IH다워요 💕 💬"]], "expr": [["be responsible for ~", "~을 담당하다", "질문 속 표현 그대로 회수 ✅"], ["one-person company", "1인 기업", "자취 집안일 한 방 비유 😆"], ["Picture this:", "상상해보세요", "묘사 오프너, 여가 편 재활용 🔁 ✨"], ["lineup", "라인업", "약속 편에 이어 재등장 🔁 🧩"], ["golden rule", "황금률", "습관 공식 단골 🔁 🔑"], ["A sink should sleep empty.", "싱크대는 비워 재운다", "설거지 룰 명언 💬"], ["dust patrol", "먼지 순찰", "가구 습관 편 재활용 🔁 😆"], ["on my way to jog", "조깅 가는 길에", "재활용 편 동선 재활용 🔁 🏃"], ["run smoothly", "매끄럽게 돌아가다", "집 관리의 목표 동사 ✅"], ["CEO of this apartment", "이 아파트의 CEO", "1인 기업 비유의 마무리 💪"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-086 18. 집안일(Chores)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-086 18. 집안일(Chores)_묘사.mp3"}, {"id": "2-087", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "습관", "badge": "87 습관", "enQ": "How does your family divide the housework? Which chores is each family member in charge of, and how do they usually do them?", "enA": "Fun fact: I belong to two households, so let me walk you through both systems. In my own place, the division is simple — me, me, and me. I split chores by day instead of by person: dishes daily, laundry midweek, cleaning on Saturdays.\n\nBut when I visit my mom's home, the old family system kicks in automatically. Mom is the head chef — nobody touches her kitchen! My job has been the same for twenty years: washing dishes and folding laundry while watching TV. And my little brother? He's the muscle team: taking out the trash, carrying anything heavy, and — his true talent — emptying the fridge.\n\nThe best part is how naturally we slip back into our old roles: mom cooks, I wash, he carries. Nobody assigns anything anymore — the system just runs itself. That's pretty much our family choreography, and it never gets old.", "koQ": "당신의 가족은 집안일을 어떻게 나누나요? 각 가족 구성원은 어떤 집안일을 담당하고, 보통 어떻게 하나요?", "koA": "재미있는 사실 하나. 저는 두 가정에 속해 있어요. 그래서 두 시스템을 차근차근 보여드릴게요. 제 집에서 분담은 간단해요. 나, 나, 그리고 나요. 대신 사람이 아니라 요일로 나눠요. 설거지는 매일, 빨래는 주중, 청소는 토요일이죠.\n\n그런데 엄마 집에 가면 옛날 가족 시스템이 자동으로 발동돼요. 엄마는 총괄 셰프예요. 아무도 엄마 주방엔 손 못 대요! 제 담당은 20년째 똑같아요. 설거지, 그리고 TV 보면서 빨래 개기죠. 남동생은요? 힘쓰기 팀이에요. 쓰레기 버리기, 무거운 거 나르기, 그리고 그의 진짜 재능인 냉장고 비우기요.\n\n제일 좋은 건 우리가 얼마나 자연스럽게 옛 역할로 돌아가느냐예요. 엄마는 요리하고, 나는 씻고, 동생은 나르고. 이제 아무도 역할을 정해주지 않아요. 시스템이 알아서 굴러가죠. 이게 우리 가족의 안무예요. 전혀 질리지 않아요.", "struct": [["1️⃣ 반전", "두 가정, 두 시스템"], ["2️⃣ 내 집", "나 · 나 · 나, 요일로 분담"], ["3️⃣ 본가", "엄마 셰프 · 나 설거지"], ["4️⃣ 동생", "힘쓰기 팀 + 냉장고 비우기"], ["5️⃣ 마무리", "알아서 굴러가는 안무"]], "scoring": [["두 가정 해법", "혼자 사는데 가족 분담을 물으면 두 가정에 속해 있다로 여세요 🔑 자취 설정과 가족 질문을 동시에 살리는 프레임이에요"], ["직함 부여", "총괄 셰프 · 힘쓰기 팀 — 가족 구성원마다 직함을 붙이면 who is in charge of가 캐릭터 소개로 변해요 😆 🎭"], ["캐논 재활용", "냉장고 비우기가 동생의 진짜 재능 — 냉장고 습격 남동생 설정이 집안일 분담표에 그대로 들어와요 🔁 🎓"], ["무언의 시스템", "아무도 정해주지 않아도 알아서 굴러간다 — 20년 된 분담의 자연스러움이 how do they do them의 진짜 답이에요 💕 💬"]], "expr": [["Fun fact:", "재미있는 사실은", "오프닝 리액션 변주 😊"], ["two households", "두 가정", "자취생의 가족 질문 해법 🔑"], ["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["me, me, and me", "나, 나, 그리고 나", "1인 분담 유머 3연타 😆"], ["head chef", "총괄 셰프", "엄마 주방 권력 비유 🍳"], ["muscle team", "힘쓰기 팀", "남동생 역할 별명 💪"], ["empty the fridge", "냉장고를 비우다", "냉장고 습격 캐논 재활용 🔁 😆"], ["slip back into ~", "~으로 자연스레 돌아가다", "옛 역할 복귀 고급 동사 ✨"], ["run itself", "알아서 굴러가다", "오래된 시스템의 증명 ✅"], ["choreography", "안무", "가족 팀워크 마무리 비유 🎭"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-087 18. 집안일(Chores)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-087 18. 집안일(Chores)_습관.mp3"}, {"id": "2-088", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "취향", "badge": "88 취향", "enQ": "Which chore do you like the most, and which one do you dislike? Why do you feel that way about them? Tell me the reasons.", "enA": "Easy question, strong opinions! My favorite is cooking, no contest — because it's the only chore that ends with a reward you can eat. For me, it's all about that creative moment: same fridge, different dinner every night.\n\nAnd my least favorite? Folding laundry — I'd take a full sink of dishes over a laundry basket any day. Here's why: dishes have a clear finish line, but folding is an endless loop. Worst of all is the sock hunt: somehow the washing machine always eats exactly one sock! Don't get me wrong, I love the smell of fresh laundry. I just wish it folded itself.\n\nSo my system is simple: I fold in front of my cooking show, so the fun cancels out the boring. In a nutshell: cooking feeds my body, and TV makes folding bearable — teamwork!", "koQ": "어떤 집안일을 가장 좋아하고, 어떤 것을 싫어하나요? 왜 그렇게 느끼나요? 그 이유를 말해주세요.", "koA": "쉬운 질문, 강한 의견! 최애는 요리예요. 고민할 것도 없죠. 먹을 수 있는 보상으로 끝나는 유일한 집안일이니까요. 저한테 핵심은 그 창작의 순간이에요. 같은 냉장고인데 매일 저녁이 달라지거든요.\n\n가장 싫어하는 건요? 빨래 개기요. 빨래 바구니보다는 무조건 설거지 가득한 싱크대를 고르겠어요. 이유는 이래요. 설거지엔 명확한 결승선이 있는데, 빨래 개기는 끝없는 루프예요. 최악은 양말 사냥이에요. 세탁기가 어떻게든 꼭 한 짝만 먹어버리거든요! 오해는 마세요. 갓 마른 빨래 냄새는 사랑해요. 그냥 스스로 개졌으면 좋겠을 뿐이에요.\n\n그래서 제 시스템은 간단해요. 요리 쇼를 틀어놓고 개는 거죠. 재미가 지루함을 상쇄하니까요. 한마디로, 요리는 몸을 채우고, TV는 빨래 개기를 견딜 만하게 해줘요. 팀워크죠!", "struct": [["1️⃣ 최애", "요리 — 먹을 수 있는 보상"], ["2️⃣ 이유", "같은 냉장고, 다른 저녁"], ["3️⃣ 최악", "빨래 개기 = 끝없는 루프"], ["4️⃣ 유머", "세탁기의 양말 한 짝 식사"], ["5️⃣ 해법", "요리 쇼 틀고 개기"]], "scoring": [["두 축 정확히", "최애(요리)와 최악(빨래 개기)을 하나씩 명확히 — like와 dislike를 모두 묻는 질문은 절반만 답하면 감점이에요 ✅"], ["결승선 논리", "설거지엔 결승선이 있고 빨래 개기는 끝없는 루프 — 호불호의 이유를 구조의 차이로 설명하는 게 IH 논리예요 🔑"], ["양말 유머", "세탁기가 꼭 한 짝만 먹는다는 양말 사냥 — 전 세계 공감 유머라 웃음이 보장되는 안전 카드예요 😆 ✨"], ["해법 마무리", "싫은 일은 좋아하는 것과 묶는다(요리 쇼 + 빨래 개기) — 불평으로 끝내지 않고 해법으로 닫는 마무리예요 💬 ✅"]], "expr": [["strong opinions", "강한 의견", "취향 질문 리액션 오프너 😆"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["a reward you can eat", "먹을 수 있는 보상", "요리 최애 이유 한 방 🍳"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식 🔁 ✨"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["finish line", "결승선", "설거지 vs 빨래 대비 축 🏃"], ["endless loop", "끝없는 루프", "빨래 개기 한 단어 요약 🔥"], ["sock hunt", "양말 사냥", "세탁기 유머의 키워드 😆"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["cancel out", "상쇄하다", "TV + 빨래 해법 동사 ✅"], ["bearable", "견딜 만한", "싫은 일 관리 형용사 🔑"]], "audio": "audio/2_돌발/2-088 18. 집안일(Chores)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-088 18. 집안일(Chores)_취향.mp3"}, {"id": "2-089", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "과거 경험", "badge": "89 과거 경험", "enQ": "Tell me about a time when you could not finish your housework. What was the reason, and what happened as a result? Explain in detail.", "enA": "This reminds me of my great closet cleanup that never happened. One Sunday, I declared war on my closet: everything out, sort, donate, reorganize. A solid three-hour plan. Famous last words, again!\n\nAbout twenty minutes in, out of nowhere, I found a box of old treasures: my pearl folder phone, the phone strap my best friend gave me, ticket stubs, old photos. And guess what — the cleanup turned into a three-hour memory trip. I sat on the floor clicking that folder phone open and shut, texting my friend photos of everything. The result? By evening, my room looked worse than before — a total explosion of stuff!\n\nI stuffed everything back and surrendered. But it worked out fine: the next weekend I finished the job with a new rule — memories last, cleaning first! Boxes get opened only after the closet is done.", "koQ": "집안일을 끝내지 못했던 때에 대해 말해주세요. 이유가 무엇이었고, 그 결과 어떻게 되었나요? 자세히 설명해주세요.", "koA": "성사되지 못한 옷장 대청소가 떠오르네요. 어느 일요일, 저는 옷장에 전쟁을 선포했어요. 전부 꺼내고, 분류하고, 기부하고, 재정리하기. 견고한 3시간짜리 계획이었죠. 또다시, 그 말이 무색해질 줄이야!\n\n20분쯤 지났을 때, 난데없이 오래된 보물 상자를 발견했어요. 진주색 폴더폰, 절친이 준 폰줄, 티켓 조각들, 옛날 사진들. 그리고 있잖아요, 대청소가 3시간짜리 추억 여행으로 변해버렸어요. 바닥에 앉아서 폴더폰을 딸깍딸깍 여닫고, 절친한테 하나하나 사진 찍어 보내면서요. 결과요? 저녁이 되자 제 방은 청소 전보다 더 심해졌어요. 완전한 물건 폭발 현장이었죠!\n\n전부 도로 쑤셔 넣고 항복했어요. 그래도 결국 다 잘 풀렸어요. 다음 주말에 새 규칙과 함께 일을 끝냈거든요. 추억은 나중에, 청소가 먼저! 상자는 옷장이 끝난 뒤에만 열 수 있어요.", "struct": [["1️⃣ 선포", "옷장에 3시간 전쟁 선포"], ["2️⃣ 반전", "20분 만에 보물 상자 발견"], ["3️⃣ 탈선", "폴더폰 딸깍 추억 여행"], ["4️⃣ 결과", "방은 청소 전보다 폭발"], ["5️⃣ 교훈", "추억은 나중에, 청소 먼저"]], "scoring": [["질문 결과 회수", "이유(보물 상자)와 결과(방이 더 폭발) — what happened as a result에 정직하고 웃긴 답을 준비하는 게 핵심이에요 ✅ 😆"], ["캐논 보물함", "폴더폰 딸깍, 절친의 폰줄 — 시리즈의 추억 소품들이 청소 실패의 원인으로 총출동해요 🔁 🎓 소품에 역사가 있으니 진짜 같죠"], ["실패 → 룰", "항복으로 끝내지 않고 다음 주말 + 새 룰로 마무리 — 실패담은 회복까지 말해야 완성이에요 💪 ✅"], ["룰 네이밍", "추억은 나중에, 청소 먼저(memories last, cleaning first) — 대구로 만든 룰 이름이 교훈을 기억에 남게 해요 💬 🎓"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["declare war on ~", "~에 전쟁을 선포하다", "대청소 과장 오프닝 💪"], ["Famous last words!", "그 말이 무색하게!", "패션 경험 편 재활용 🔁 😆"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["memory trip", "추억 여행", "청소 탈선의 핵심 명사 💕"], ["open and shut", "여닫다", "폴더폰 딸깍 캐논 재활용 🔁 ✨"], ["worse than before", "전보다 더 심한", "결과 질문의 정직한 답 😆"], ["surrender", "항복하다", "그날의 마무리 동사 🎭"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😊"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["Memories last, cleaning first.", "추억은 나중에, 청소 먼저", "이 페이지의 교훈 룰 💬"]], "audio": "audio/2_돌발/2-089 18. 집안일(Chores)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-089 18. 집안일(Chores)_과거 경험.mp3"}, {"id": "2-090", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "비교", "badge": "90 비교", "enQ": "Compare doing housework today with the past. How have chores changed with machines like robot vacuums and dishwashers? Tell me about the differences.", "enA": "Back then, in my childhood home, housework used to be a full-body, full-family event. Cleaning day meant everyone on their knees with rags, my mom hand-washing the big blankets, and the vacuum — a roaring monster you dragged around by its tail.\n\nThese days, it's a completely different story: the machines joined the family. My mom now owns a robot vacuum, and honestly she treats it like a third child — it even has a name! Dishwashers, dryers, air purifiers... Compared to the old days, chores went from doing everything to managing everything. We became supervisors: press a button, and the little robot does the kneeling for us.\n\nI have to admit, though — those all-family cleaning days had something the machines can't copy: four people, loud music, and jokes over the noise. The house got cleaner back then... and so did our mood, if you ask me.", "koQ": "오늘날의 집안일과 과거의 집안일을 비교해주세요. 로봇청소기나 식기세척기 같은 기계로 인해 집안일은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 어린 시절 집에서 집안일은 온몸으로, 온 가족이 하는 행사였어요. 청소하는 날이면 모두가 걸레를 들고 무릎을 꿇었고, 엄마는 큰 이불을 손빨래했고, 청소기는 꼬리를 잡고 끌고 다니는 으르렁거리는 괴물이었죠.\n\n요즘은 완전히 다른 이야기예요. 기계들이 가족에 합류했거든요. 엄마는 이제 로봇청소기를 갖고 계신데, 솔직히 셋째 자식처럼 대하세요. 이름까지 있다니까요! 식기세척기, 건조기, 공기청정기까지. 예전과 비교하면 집안일은 다 하는 것에서 다 관리하는 것으로 변했어요. 우리는 감독관이 된 거죠. 버튼을 누르면, 작은 로봇이 우리 대신 무릎을 꿇어요.\n\n그래도 인정할 건 인정해야죠. 그 온 가족 청소의 날엔 기계가 못 베끼는 게 있었어요. 네 사람, 시끄러운 음악, 소음 너머로 주고받던 농담이요. 그때는 집이 더 깨끗해졌고... 제 생각엔 기분도 같이 깨끗해졌어요.", "struct": [["1️⃣ 과거", "온 가족 무릎 꿇는 행사"], ["2️⃣ 소품", "으르렁대는 괴물 청소기"], ["3️⃣ 현재", "기계 가족 + 엄마의 셋째"], ["4️⃣ 대비", "다 하기 → 다 관리하기"], ["5️⃣ 마무리", "기계가 못 베끼는 농담"]], "scoring": [["질문 기계 회수", "질문이 준 로봇청소기와 식기세척기를 답변의 주인공으로 — 예시를 회수하면 질문을 정확히 들었다는 신호예요 ✅"], ["셋째 자식 유머", "엄마가 로봇청소기를 셋째처럼 대하고 이름까지 지었다 — 기계 시대를 가족 유머로 그리는 한 장면이에요 😆 💕"], ["동사 전환 축", "다 하기(doing)에서 다 관리하기(managing)로 — 동사 하나의 교체로 집안일 역사가 정리돼요 🔑 감독관 직함까지!"], ["소음 속 농담", "기계가 못 베끼는 건 소음 너머의 농담 — 편리함 인정 + 사람의 온기 그리움, 시리즈 공통 마무리예요 🔁 💬"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["full-body, full-family", "온몸 · 온 가족의", "과거 집안일 한 줄 요약 💪"], ["on their knees", "무릎을 꿇고", "걸레질 시대의 자세 묘사 📏"], ["roaring monster", "으르렁대는 괴물", "옛 청소기 의인화 비유 😆"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["third child", "셋째 자식", "엄마와 로봇청소기 유머 💕"], ["from doing to managing", "하기에서 관리하기로", "변화의 축 한 문장 🔑"], ["supervisor", "감독관", "버튼 누르는 우리의 직함 😆"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-090 18. 집안일(Chores)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-090 18. 집안일(Chores)_비교.mp3"}, {"id": "2-091", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "묘사", "badge": "91 묘사", "enQ": "Tell me about the holidays in your country. Which ones are the most important, and how do people celebrate them? Describe them in detail.", "enA": "That's an easy one — Korea runs on two giant holidays: Seollal, the Lunar New Year, and Chuseok, our harvest festival in the fall. Everything else is a day off; these two are events.\n\nHow do we celebrate? Both start the same way: the great migration. Millions of cars head to hometowns, and highways turn into parking lots — it's practically a national tradition itself! Then comes the food: for Seollal, rice cake soup, which officially makes everyone one year older, plus New Year's bows to elders. For Chuseok, half-moon rice cakes and giving thanks for the harvest under the full moon.\n\nBut if you ask me what these holidays are really about, it's simple: the whole country pressing pause at the same time to eat too much with family. That's pretty much Korean holidays in one sentence!", "koQ": "당신의 나라의 명절에 대해 말해주세요. 어떤 명절이 가장 중요하고, 사람들은 그것을 어떻게 기념하나요? 자세히 설명해주세요.", "koA": "쉬운 질문이네요. 한국은 두 개의 거대한 명절로 돌아가요. 음력 새해인 설날, 그리고 가을의 추수 명절인 추석이죠. 다른 날들은 그냥 휴일이지만, 이 둘은 행사예요.\n\n어떻게 기념하냐고요? 둘 다 똑같이 시작해요. 대이동으로요. 수백만 대의 차가 고향으로 향하고, 고속도로는 주차장이 되죠. 그것 자체가 사실상 국가 전통이에요! 그다음은 음식이에요. 설날엔 떡국인데, 먹으면 공식적으로 모두 한 살을 더 먹어요. 어른들께 드리는 세배도 있고요. 추석엔 반달 모양의 송편을 빚고, 보름달 아래서 수확에 감사하죠.\n\n근데 이 명절들이 진짜 뭐냐고 물으신다면, 간단해요. 온 나라가 동시에 일시정지 버튼을 누르고 가족과 과식하는 날이에요. 이게 한 문장으로 정리한 한국의 명절이에요!", "struct": [["1️⃣ 선언", "설날 · 추석 2대 명절"], ["2️⃣ 이동", "민족 대이동 = 국가 전통"], ["3️⃣ 설날", "떡국 한 살 + 세배"], ["4️⃣ 추석", "송편 + 보름달 감사"], ["5️⃣ 마무리", "온 나라의 일시정지"]], "scoring": [["2대 명절 선언", "어떤 명절이 중요한가 → 설날과 추석 둘로 즉답하고 나머지는 그냥 휴일로 정리 — 선택과 집중이 묘사의 뼈대예요 ✅"], ["문화 번역 3종", "떡국 = 한 살, 세배 = 새해 인사, 송편 = 반달 떡 — 고유 문화마다 짧은 영어 풀이를 붙이는 게 고득점 기술이에요 🔑 🎓"], ["대이동 유머", "고속도로가 주차장이 된다, 그것 자체가 전통 — 명절 풍경을 자학 유머로 그리면 생생함과 웃음을 동시에 잡아요 😆 🗺️"], ["일시정지 마무리", "온 나라가 동시에 pause를 누른다 — 명절의 본질을 버튼 하나로 요약하는 비유 마무리예요 💬 ✨"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["Seollal", "설날", "음력 새해, 고유명사 소개 ✅"], ["Chuseok", "추석", "harvest festival로 풀이 ✅"], ["the great migration", "민족 대이동", "명절 풍경 시그니처 표현 🗺️"], ["turn into parking lots", "주차장이 되다", "고속도로 유머 비유 😆"], ["rice cake soup", "떡국", "설날 음식 필수 번역 🍳"], ["one year older", "한 살 더 먹는", "떡국 문화 설명 포인트 🎓"], ["New Year's bow", "세배", "설날 인사 문화 소개 🔑"], ["half-moon rice cake", "송편", "추석 음식 번역 ✨"], ["press pause", "일시정지를 누르다", "명절의 본질 비유 💬"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-091 19. 휴일(Holidays)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-091 19. 휴일(Holidays)_묘사.mp3"}, {"id": "2-092", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "습관", "badge": "92 습관", "enQ": "What do you and your family usually do during the biggest holiday in your country? What activities do people typically enjoy? Tell me in detail.", "enA": "For my family, the biggest one is Seollal — so let me walk you through our version. Everyone gathers at my mom's place the night before, and the kitchen turns into a factory: mom commanding the soup pot, me and my brother on dumpling duty, folding side by side like we've done since we were kids.\n\nNew Year's morning has a fixed program: rice cake soup first — one bowl, one year older — then the bows to elders, and yes, the kids still line up for their lucky money envelopes! After that comes my favorite part: the whole family around the board game. Our yut matches get so loud the neighbors probably know who's winning.\n\nAs for the rest of the country, it's similar everywhere: food, family, card games, and holiday movies on TV. Loud kitchen, louder games, full stomachs — that's pretty much our Seollal, and it never gets old.", "koQ": "당신의 나라에서 가장 큰 명절에 당신과 가족은 주로 무엇을 하나요? 사람들은 일반적으로 어떤 활동을 즐기나요? 자세히 말해주세요.", "koA": "우리 가족에게 가장 큰 명절은 설날이에요. 우리 버전을 차근차근 보여드릴게요. 전날 밤 모두 엄마 집에 모이고, 주방은 공장으로 변해요. 엄마는 국 냄비를 지휘하시고, 저와 남동생은 만두 담당이에요. 어릴 때부터 해온 것처럼 나란히 앉아 빚죠.\n\n설날 아침엔 고정 프로그램이 있어요. 먼저 떡국. 한 그릇에 한 살이죠. 그다음은 어른들께 세배, 그리고 네, 애들은 여전히 세뱃돈 봉투를 받으려고 줄을 서요! 그다음이 제 최애 순서예요. 온 가족이 윷판에 둘러앉는 거요. 우리 윷놀이는 어찌나 시끄러운지 이웃들도 누가 이기고 있는지 알걸요.\n\n나라 전체로 보면 어디나 비슷해요. 음식, 가족, 카드 게임, 그리고 TV 명절 특선 영화죠. 시끄러운 주방, 더 시끄러운 게임, 그리고 가득 찬 배. 이게 우리 설날이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 전야", "엄마 집 집합, 주방 공장"], ["2️⃣ 담당", "남동생과 만두 듀오"], ["3️⃣ 아침", "떡국 → 세배 → 세뱃돈"], ["4️⃣ 절정", "이웃도 아는 윷놀이 소음"], ["5️⃣ 마무리", "음식 · 가족 · 특선 영화"]], "scoring": [["두 질문 분리", "우리 가족(만두 듀오 · 윷놀이)과 사람들 일반(음식 · 카드 게임 · 특선 영화)을 나눠 답해요 — 질문이 두 개라는 걸 놓치지 마세요 ✅"], ["공장 주방", "엄마는 국 냄비 지휘, 남매는 만두 담당 — 집안일 습관 편의 가족 분담 시스템이 명절 버전으로 재등장해요 🔁 🎓"], ["소음 증거", "이웃도 누가 이기는지 안다는 윷놀이 소음 — 즐거움을 소리 크기로 증명하는 과장 유머예요 😆 🎵"], ["3종 마무리", "시끄러운 주방, 더 시끄러운 게임, 가득 찬 배 — 비교급으로 쌓는 3종 나열 마무리가 리듬을 만들어요 💬 ✨"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["gather at ~", "~에 모이다", "명절 전야 필수 동사 ✅"], ["turn into a factory", "공장으로 변하다", "명절 주방 비유 🍳"], ["dumpling duty", "만두 담당", "남매 팀 캐논 확장 🔁 😆"], ["fixed program", "고정 프로그램", "명절 아침 루틴 명사 ⏰"], ["line up", "줄을 서다", "세뱃돈 장면 유머 💳"], ["lucky money", "세뱃돈", "설날 문화 필수 번역 🔑"], ["yut", "윷놀이", "전통 놀이 고유명사 소개 🧩"], ["know who's winning", "누가 이기는지 알다", "윷놀이 소음 과장 유머 😆"], ["full stomachs", "가득 찬 배", "명절 마무리 3종의 마침표 😊"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-092 19. 휴일(Holidays)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-092 19. 휴일(Holidays)_습관.mp3"}, {"id": "2-093", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "취향", "badge": "93 취향", "enQ": "Which holiday do you like the most, and why? What do you enjoy doing on that day? Tell me the reasons in detail.", "enA": "If I had to choose, Seollal wins — no contest. Chuseok has better weather, sure, but for me, it's all about that fresh-start feeling: new year, new luck, and one warm bowl of rice cake soup that resets everything.\n\nWhat do I enjoy most? The kitchen hours, honestly. Folding dumplings next to my brother while mom conducts the pots — we tease each other about whose dumplings look worse, exactly like twenty years ago. I'd take that noisy kitchen over any fancy vacation any day. Don't get me wrong — I love that Chuseok moon too. But autumn thanks the past, while Seollal opens the future, and I'm a fresh-start person.\n\nNothing beats that first spoonful of mom's soup while everyone argues over the yut board. In a nutshell: Chuseok fills the table, but Seollal resets the heart.", "koQ": "어떤 명절(휴일)을 가장 좋아하고, 그 이유는 무엇인가요? 그날 무엇을 하는 것을 즐기나요? 그 이유를 자세히 말해주세요.", "koA": "골라야 한다면 설날 승리예요. 고민할 것도 없죠. 추석이 날씨는 더 좋아요. 근데 저한테 핵심은 그 새 출발의 기분이에요. 새해, 새 운, 그리고 모든 걸 리셋해주는 따뜻한 떡국 한 그릇이요.\n\n뭘 제일 즐기냐고요? 솔직히 주방의 시간들이에요. 엄마가 냄비들을 지휘하시는 동안 동생 옆에서 만두를 빚는 거요. 누구 만두가 더 못생겼는지 서로 놀리는데, 20년 전과 똑같아요. 어떤 근사한 휴가보다도 그 시끄러운 주방을 고르겠어요. 오해는 마세요. 추석 보름달도 사랑해요. 근데 가을은 지난 것에 감사하고, 설날은 미래를 열잖아요. 저는 새 출발형 인간이거든요.\n\n온 가족이 윷판을 두고 옥신각신하는 동안 뜨는 엄마 떡국의 첫 숟갈만 한 게 없어요. 한마디로, 추석은 식탁을 채우지만, 설날은 마음을 리셋해요.", "struct": [["1️⃣ 선택", "설날 승리, no contest"], ["2️⃣ 핵심", "새해 · 새 운 · 새 출발"], ["3️⃣ 활동", "못생긴 만두 콘테스트"], ["4️⃣ 양보", "추석 달도 좋지만 과거형"], ["5️⃣ 명언", "추석은 식탁, 설날은 마음"]], "scoring": [["시제 논리", "가을은 과거에 감사하고 설날은 미래를 연다 — 두 명절의 차이를 시제로 가르는 논리가 이 답변의 등뼈예요 🔑 ✨"], ["만두 콘테스트", "누구 만두가 더 못생겼는지 20년째 놀리기 — 습관 편 만두 듀오가 취향의 이유로 이어지는 콤보예요 🔁 😆"], ["자기 정의", "나는 새 출발형 인간(fresh-start person) — 취향의 이유를 자기 정의 한 단어로 묶으면 설득력이 완성돼요 🔑 💪"], ["대구 마무리", "추석은 식탁을 채우고 설날은 마음을 리셋한다 — fills와 resets의 대구 명언, 통째로 외울 가치가 있어요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["fresh-start feeling", "새 출발의 기분", "설날 선택의 핵심 이유 ✨"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식 🔁 ✅"], ["conduct the pots", "냄비들을 지휘하다", "엄마 셰프 의인화 재활용 🔁 🍳"], ["whose dumplings look worse", "누구 만두가 더 못생겼나", "남매 만두 콘테스트 유머 😆"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["fresh-start person", "새 출발형 인간", "나를 한 단어로 정의 🔑"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 💬"]], "audio": "audio/2_돌발/2-093 19. 휴일(Holidays)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-093 19. 휴일(Holidays)_취향.mp3"}, {"id": "2-094", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "과거 경험", "badge": "94 과거 경험", "enQ": "Tell me about a holiday memory from your childhood that you cannot forget. Where were you, who were you with, and what did you do?", "enA": "This reminds me of a Seollal at my grandmother's countryside house when I was about eight. The whole clan was there — aunts, uncles, and a small army of cousins packed into one warm house that smelled like rice cake soup all day.\n\nThat morning, after the bows and the lucky money, it started snowing — hard. And guess what: every cousin ran outside at once. We had the loudest snowball war in family history, while grandma yelled that the soup was getting cold. Out of nowhere, even my uncles joined, ties and all! We came back soaked, frozen, and ridiculously happy — and grandma's hot soup never tasted better.\n\nI still can't forget the sound of that day: snow, screaming cousins, and grandma's laugh from the kitchen door. Lucky money gets spent, but that soundtrack stayed — my definition of a perfect holiday.", "koQ": "잊을 수 없는 어린 시절의 명절 기억에 대해 말해주세요. 어디에 있었고, 누구와 함께였으며, 무엇을 했나요?", "koA": "여덟 살쯤의 설날, 시골 할머니 댁이 떠오르네요. 온 친척이 다 모였어요. 이모, 삼촌들, 그리고 사촌들 소부대까지. 하루 종일 떡국 냄새가 나는 따뜻한 집 한 채에 꽉꽉 들어찼죠.\n\n그날 아침, 세배와 세뱃돈이 끝나고 눈이 내리기 시작했어요. 그것도 펑펑요. 그리고 있잖아요, 사촌 전원이 동시에 밖으로 뛰쳐나갔어요. 우리는 가족 역사상 가장 시끄러운 눈싸움 전쟁을 벌였죠. 할머니가 떡국 식는다고 소리치시는 동안에요. 난데없이 삼촌들까지 넥타이 차림 그대로 참전했어요! 우리는 쫄딱 젖고, 꽁꽁 얼고, 터무니없이 행복한 채로 돌아왔어요. 그리고 할머니의 뜨거운 떡국은 그 어느 때보다 맛있었죠.\n\n지금도 그날의 소리를 잊을 수가 없어요. 눈, 소리 지르는 사촌들, 부엌문에서 들리던 할머니의 웃음소리. 세뱃돈은 다 써버렸지만, 그 사운드트랙은 남았어요. 그게 저의 완벽한 명절의 정의죠.", "struct": [["1️⃣ 배경", "여덟 살, 시골 할머니 댁"], ["2️⃣ 인물", "사촌 소부대 + 삼촌들"], ["3️⃣ 절정", "마당 눈싸움 대전쟁"], ["4️⃣ 반전", "넥타이 삼촌들의 참전"], ["5️⃣ 마무리", "세뱃돈은 가도 소리는 남아"]], "scoring": [["3W 즉답", "어디(할머니 시골집) · 누구(사촌 소부대 · 삼촌들) · 무엇(눈싸움 전쟁) — 질문의 세 축을 서두에 다 심어두는 구조예요 ✅"], ["어른 참전 반전", "넥타이 차림 삼촌들의 눈싸움 참전 — 어른이 아이가 되는 순간이 명절 기억의 최고 반전이에요 🎭 😆"], ["감각 기억", "눈 · 사촌들의 비명 · 부엌문 할머니 웃음 — 잊을 수 없는 이유를 소리 세 겹으로 증명해요 🎵 💕"], ["대비 마무리", "세뱃돈은 다 썼지만 사운드트랙은 남았다 — 사라진 것과 남은 것의 대비가 여운을 만들어요 💬 🎓"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["the whole clan", "온 친척", "대가족 집결 한 단어 ✅"], ["a small army of cousins", "사촌 소부대", "아이들 스케일 과장 유머 😆"], ["packed into ~", "~에 꽉 들어찬", "기술 편 재활용, 명절 집 버전 🔁 📏"], ["snowball war", "눈싸움 전쟁", "이 기억의 심장 장면 ✨"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["ties and all", "넥타이 차림 그대로", "삼촌 참전 디테일 😆"], ["soaked, frozen, and happy", "젖고 얼고 행복한", "형용사 3연타 감정 묘사 💕"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😊"], ["That soundtrack stayed.", "그 소리는 남았다", "해변 비교 편 소리 기술 재활용 🔁 🎵"], ["definition of ~", "~의 정의", "기억의 격을 올리는 마무리 🔑"]], "audio": "audio/2_돌발/2-094 19. 휴일(Holidays)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-094 19. 휴일(Holidays)_과거 경험.mp3"}, {"id": "2-095", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "비교", "badge": "95 비교", "enQ": "Compare the way people spend holidays now with the way they did in the past. How have holiday traditions changed over the years? Tell me about the differences.", "enA": "Back then, holidays used to mean one thing: the big house. The whole clan converged on grandma's place, the women cooked for two days straight, kids slept five to a room, and the New Year's bow was a full ceremony — hanbok, order of age, the works.\n\nThese days, it's a completely different story. Families celebrate in smaller circles, and many simply travel instead — airports are as crowded as highways now! The food comes ready-made from stores, video calls stand in for visits, and lucky money often arrives by bank app. Compared to the past, holidays are way more relaxed — less labor, fewer arguments, more actual rest.\n\nI have to admit, the change is fair — someone always paid for that big house magic with two days at the stove. Still, I miss the crowded floor and the noise. Holidays got easier, but maybe a little quieter than they should be, if you ask me.", "koQ": "지금 사람들이 명절을 보내는 방식과 과거의 방식을 비교해주세요. 시간이 지나며 명절 풍습은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때는 명절이 곧 하나를 의미했어요. 큰집이요. 온 친척이 할머니 댁으로 집결했고, 여자들은 이틀 내내 요리했고, 아이들은 한 방에 다섯 명씩 잤고, 세배는 완전한 의식이었어요. 한복, 나이 순서, 격식 전부요.\n\n요즘은 완전히 다른 이야기예요. 가족들은 더 작은 단위로 명절을 보내고, 아예 여행을 떠나는 사람도 많아요. 이제 공항이 고속도로만큼 붐빈다니까요! 음식은 매장에서 완제품으로 사 오고, 영상통화가 방문을 대신하고, 세뱃돈은 은행 앱으로 도착하는 경우도 많죠. 과거와 비교하면 명절이 훨씬 여유로워졌어요. 노동은 줄고, 다툼도 줄고, 진짜 휴식은 늘었죠.\n\n인정할 건 인정해야죠. 이 변화는 공정해요. 그 큰집의 마법은 누군가가 이틀의 가스레인지 앞으로 값을 치렀으니까요. 그래도 저는 그 꽉 찬 방바닥과 소음이 그리워요. 제 생각엔, 명절이 편해진 만큼 조금은 너무 조용해진 것 같아요.", "struct": [["1️⃣ 과거", "큰집 집결 · 이틀의 요리"], ["2️⃣ 의식", "한복 · 나이 순서 세배"], ["3️⃣ 현재", "소규모 · 여행 · 앱 세뱃돈"], ["4️⃣ 평가", "변화는 공정하다 인정"], ["5️⃣ 마무리", "편해진 만큼 조용해짐"]], "scoring": [["소품 대 소품", "한복 세배 vs 영상통화, 현금 봉투 vs 은행 앱 — 풍습 변화를 소품 교체로 보여주는 비교의 정석이에요 🔑 ✅"], ["공정한 시선", "큰집의 마법은 누군가의 이틀 노동으로 만들어졌다 — 그리움만 말하지 않는 균형 감각이 이 답변의 격이에요 📊 💬"], ["공항 유머", "이제 공항이 고속도로만큼 붐빈다 — 묘사 편 대이동 유머가 여행 명절 시대 버전으로 진화했어요 🔁 😆"], ["여운 마무리", "편해진 만큼 조금은 너무 조용해졌다 — 편리함 인정 + 소음 그리움, 시리즈 공통 마무리의 명절 버전이에요 🔁 💬"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["converge on ~", "~으로 집결하다", "민족 대이동 고급 동사 🗺️"], ["the works", "격식 전부", "한복 · 순서까지 다 관용구 🔑"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["ready-made", "완제품의", "명절 음식 변화 키워드 🍳"], ["stand in for ~", "~을 대신하다", "영상통화 세배 시대 동사 ✨"], ["by bank app", "은행 앱으로", "앱 세뱃돈, 은행 편 연결 🔁 💳"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["way more ~", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-095 19. 휴일(Holidays)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-095 19. 휴일(Holidays)_비교.mp3"}, {"id": "2-096", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "묘사", "badge": "96 묘사", "enQ": "Describe a healthy person you know. What is he or she like, and what does that person do to stay in shape? Why do you consider that person healthy?", "enA": "That's an easy one — the healthiest person I know is the elderly gentleman next door, my recycling mentor. He must be over seventy, but he walks with a straighter back than most of my coworkers!\n\nWhat does he do to stay in shape? The answer is boring and brilliant: the same things, every single day. A morning walk up the neighborhood mountain — rain or shine — simple home-cooked meals with his wife, and early lights-out. No gym, no supplements, no drama. Just clockwork.\n\nWhy do I consider him healthy? Not just the walking — it's his energy. He out-walks me on Tuesdays with his recycling cart, laughs loudly, and remembers everyone's name in the building. If you ask me, that's the real definition of healthy: a strong body carrying a sunny mind. My retirement role model, honestly!", "koQ": "당신이 아는 건강한 사람을 묘사해주세요. 그 사람은 어떤 사람이고, 건강을 유지하기 위해 무엇을 하나요? 왜 그 사람이 건강하다고 생각하나요?", "koA": "쉬운 질문이네요. 제가 아는 가장 건강한 사람은 옆집 할아버지, 저의 분리수거 사부님이에요. 일흔은 넘으셨을 텐데, 제 회사 동료들 대부분보다 허리가 꼿꼿하시다니까요!\n\n건강 유지를 위해 뭘 하시냐고요? 답은 지루하고도 훌륭해요. 같은 일을, 매일, 하루도 빠짐없이요. 비가 오나 눈이 오나 아침마다 동네 뒷산 산책, 사모님과 함께하는 소박한 집밥, 그리고 이른 소등. 헬스장도, 영양제도, 유난도 없어요. 그냥 시계처럼요.\n\n왜 건강하다고 생각하냐고요? 걷기 때문만은 아니에요. 그분의 에너지 때문이죠. 화요일마다 분리수거 카트를 끌고 저보다 빨리 걸으시고, 크게 웃으시고, 건물 사람들 이름을 다 기억하세요. 제 생각에 그게 건강의 진짜 정의예요. 밝은 마음을 싣고 다니는 튼튼한 몸이요. 솔직히 저의 노후 롤모델이에요!", "struct": [["1️⃣ 선언", "옆집 할아버지 = 최고 건강인"], ["2️⃣ 증거", "일흔 넘어 꼿꼿한 허리"], ["3️⃣ 비결", "뒷산 · 집밥 · 이른 소등"], ["4️⃣ 핵심", "몸 + 밝은 마음의 에너지"], ["5️⃣ 마무리", "나의 노후 롤모델 선언"]], "scoring": [["인물 재활용", "재활용 편의 분리수거 사부 할아버지가 건강 묘사의 주인공으로 승격 — 인물의 역사가 쌓일수록 이야기가 진짜가 돼요 🔁 🎓"], ["지루한 비결", "비결은 지루하고도 훌륭하다(boring and brilliant) — 특별한 비법 대신 꾸준함을 답하는 게 오히려 신선해요 ✨ 🔑"], ["에너지 증거", "카트 끌고 나를 앞지르고, 크게 웃고, 이름을 다 기억한다 — 건강하다고 생각하는 이유를 장면 셋으로 증명해요 💪 ✅"], ["정의 마무리", "건강 = 밝은 마음을 싣고 다니는 튼튼한 몸 — why 질문엔 나만의 정의 한 줄로 닫는 게 최고급 마무리예요 💬 🎓"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["mentor", "사부님", "재활용 편 마스터클래스 연결 🔁 🎓"], ["straighter back", "더 꼿꼿한 허리", "건강 묘사 비교급 디테일 💪"], ["stay in shape", "건강을 유지하다", "질문 속 표현 그대로 회수 ✅"], ["rain or shine", "비가 오나 눈이 오나", "꾸준함 관용구 필수템 🔁 ⏰"], ["boring and brilliant", "지루하고도 훌륭한", "비결 요약 형용사 대구 ✨"], ["clockwork", "시계 장치 같은 규칙", "약속 편 like clockwork 재활용 🔁 ✅"], ["out-walk", "~보다 잘 걷다", "out- 접두 동사 어휘력 🔑"], ["definition of ~", "~의 정의", "지형 편 재활용 마무리 🔁 💬"], ["role model", "롤모델", "존경 마무리 명사 💕"], ["sunny mind", "밝은 마음", "건강 = 몸+마음 핵심 표현 😊"]], "audio": "audio/2_돌발/2-096 20. 건강(Health)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-096 20. 건강(Health)_묘사.mp3"}, {"id": "2-097", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "습관", "badge": "97 습관", "enQ": "What do you do to take care of your health? Do you exercise regularly or watch what you eat? Describe your health routine in detail.", "enA": "Both, actually — let me walk you through my three-legged system: move, eat, sleep. Leg one is my evening jog by the river, three or four times a week. It started as a health project years ago; now it's just the best part of my day.\n\nLeg two: I watch what I eat the lazy-smart way — by cooking at home. When you make dinner yourself, the salt, the oil, the portions... everything calms down naturally. No strict diet, just fewer delivery apps! And leg three is my favorite: non-negotiable sleep. Screens off at eleven, no exceptions — my golden rule since forever.\n\nNothing fancy, right? But here's what I've learned: health isn't a project you finish, it's housekeeping for the body — small, boring, daily. Three legs, zero drama — that's pretty much my routine, and it never gets old.", "koQ": "건강을 관리하기 위해 무엇을 하나요? 규칙적으로 운동을 하거나 식단에 신경을 쓰나요? 당신의 건강 관리 루틴을 자세히 설명해주세요.", "koA": "사실 둘 다예요. 저의 세 다리 시스템을 차근차근 보여드릴게요. 움직이기, 먹기, 자기. 첫째 다리는 주 3~4회 강변 저녁 조깅이에요. 몇 년 전엔 건강 프로젝트로 시작했는데, 이젠 그냥 하루 중 가장 좋은 시간이 됐죠.\n\n둘째 다리, 식단은 게으르지만 똑똑한 방법으로 신경 써요. 집에서 요리하는 거예요. 저녁을 직접 만들면 소금, 기름, 양까지 모든 게 자연스럽게 차분해지거든요. 엄격한 다이어트는 없어요. 그냥 배달 앱을 줄일 뿐이죠! 그리고 셋째 다리는 제 최애, 타협 불가의 수면이에요. 11시엔 화면 끄기, 예외 없음. 아주 오래된 저의 황금률이죠.\n\n별거 없죠? 근데 제가 배운 게 있어요. 건강은 끝내는 프로젝트가 아니라 몸을 위한 살림이에요. 작고, 지루하고, 매일인 거요. 세 다리, 드라마 제로. 이게 제 루틴이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 구조", "세 다리 — 움직·먹·자기"], ["2️⃣ 운동", "주 3~4회 강변 조깅"], ["3️⃣ 식단", "집밥 = 게으른 똑똑함"], ["4️⃣ 수면", "11시 스크린 오프 룰"], ["5️⃣ 마무리", "건강 = 몸을 위한 살림"]], "scoring": [["질문 or 격파", "운동이냐 식단이냐 묻는 or 질문엔 Both, actually로 받고 둘 다 답하는 게 정석이에요 ✅ 수면까지 얹으면 보너스!"], ["세 다리 구조", "움직이기 · 먹기 · 자기 — 루틴을 세 다리 시스템으로 이름 붙이면 흩어진 습관이 하나의 설계가 돼요 🧩 🔑"], ["룰 총집합", "강변 조깅, 집밥 요리, 11시 스크린 오프 — 시리즈의 대표 루틴 세 개가 건강이라는 한 지붕 아래 모여요 🔁 🎓"], ["살림 명언", "건강은 끝내는 프로젝트가 아니라 몸을 위한 살림 — 작고 지루하고 매일인 것. 통째로 외울 마무리예요 💬 🎓"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["three-legged system", "세 다리 시스템", "루틴을 구조로 만드는 비유 🧩"], ["watch what I eat", "식단에 신경 쓰다", "질문 속 표현 그대로 회수 ✅"], ["lazy-smart", "게으르지만 똑똑한", "집밥 전략 자기 유머 😆"], ["calm down", "차분해지다", "소금 · 기름 의인화 표현 ✨"], ["fewer delivery apps", "배달 앱 줄이기", "경험 편 예고 디테일 🔁 💳"], ["non-negotiable", "타협 불가의", "해변 습관 편 재활용 🔁 🔑"], ["no exceptions", "예외 없이", "11시 룰, 시리즈 개근 🔁 🌙"], ["housekeeping for the body", "몸을 위한 살림", "이 페이지의 시그니처 비유 💬"], ["zero drama", "드라마 제로", "약속 습관 편 재활용 🔁 ✅"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-097 20. 건강(Health)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-097 20. 건강(Health)_습관.mp3"}, {"id": "2-098", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "취향", "badge": "98 취향", "enQ": "What is your favorite way to stay healthy, and why do you prefer it? Do you enjoy working out at the gym, or do you prefer outdoor activities? Tell me the reasons.", "enA": "If I had to choose, outdoor wins — no contest. My favorite way to stay healthy is, surprise surprise, my river jog. For me, it's all about getting two things for one effort: a workout for my body and fresh air for my brain.\n\nI'd pick the riverside over the gym any day. Here's my honest reason: on a treadmill, I feel like a hamster with a membership card — running hard, going nowhere, staring at a wall of screens. By the river, the scenery moves with me: water, sky, dogs chasing pigeons. Don't get me wrong — gyms are great for rainy weeks, and I respect the iron! But machines count my steps; the river counts my worries away.\n\nNothing beats finishing a run just as the sunset hits the water. In a nutshell: the gym builds your body, but the riverside rebuilds your day.", "koQ": "건강을 유지하는 방법 중 가장 좋아하는 것은 무엇이고, 왜 그것을 선호하나요? 헬스장에서 운동하는 것을 즐기나요, 아니면 야외 활동을 선호하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 야외 승리예요. 고민할 것도 없죠. 제가 가장 좋아하는 건강 유지법은, 놀랍지도 않겠지만, 강변 조깅이에요. 저한테 핵심은 한 번의 노력으로 두 가지를 얻는 거예요. 몸을 위한 운동, 그리고 뇌를 위한 바깥 공기요.\n\n헬스장보다는 무조건 강변이에요. 솔직한 이유는 이래요. 러닝머신 위에선 제가 회원권 가진 햄스터 같거든요. 열심히 달리는데 아무 데도 못 가고, 스크린 벽만 바라보면서요. 강변에선 풍경이 저와 함께 움직여요. 물, 하늘, 비둘기를 쫓는 강아지들까지요. 오해는 마세요. 비 오는 주간엔 헬스장이 최고고, 쇠질도 존중해요! 근데 기계는 제 걸음 수를 세지만, 강은 제 걱정을 씻어내며 세어줘요.\n\n노을이 물에 닿는 순간 달리기를 끝내는 것만 한 게 없어요. 한마디로, 헬스장은 몸을 만들지만, 강변은 하루를 다시 만들어요.", "struct": [["1️⃣ 선택", "야외 승리, no contest"], ["2️⃣ 핵심", "운동 + 바깥 공기 일석이조"], ["3️⃣ 대비", "러닝머신 = 회원권 햄스터"], ["4️⃣ 양보", "비 오는 주엔 헬스장 존중"], ["5️⃣ 명언", "몸은 헬스장, 하루는 강변"]], "scoring": [["햄스터 한 방", "회원권 가진 햄스터 — 러닝머신의 답답함을 비유 하나로 끝내요 😆 탈락 사유는 논리보다 그림이 강해요"], ["움직이는 풍경", "기계 위 스크린 벽 vs 나와 함께 움직이는 물 · 하늘 · 강아지 — 두 장면의 대비가 선호의 근거 그 자체예요 ✨ 🗺️"], ["걸음 vs 걱정", "기계는 걸음을 세고 강은 걱정을 씻어내며 세어준다 — counts의 이중 활용이 어휘력 하이라이트예요 🔑 💬"], ["대구 마무리", "헬스장은 몸을 만들고 강변은 하루를 다시 만든다(builds vs rebuilds) — 취향 편 전통의 대구 명언 마무리예요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["surprise surprise", "놀랍지도 않겠지만", "뻔한 답 자기 유머 😆"], ["fresh air for my brain", "뇌를 위한 공기", "야외 선호 이유 한 방 ✨"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["treadmill", "러닝머신", "헬스장 대표 소품 ✅"], ["a hamster with a membership card", "회원권 햄스터", "이 페이지의 시그니처 유머 😆"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["respect the iron", "쇠질을 존중하다", "헬스 문화 캐주얼 표현 💪"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 💬"]], "audio": "audio/2_돌발/2-098 20. 건강(Health)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-098 20. 건강(Health)_취향.mp3"}, {"id": "2-099", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "과거 경험", "badge": "99 과거 경험", "enQ": "Tell me about something you did to improve your health. Did you start a new exercise or change your diet? What was the result? Give me as many details as you can.", "enA": "This reminds me of my great diet reform a few years ago. Back then, my kitchen had one appliance: the delivery app! Fried chicken, burgers, midnight snacks — my body felt heavy, my wallet felt light, and one day the delivery guy greeted me like an old friend. That was my wake-up call.\n\nSo I declared a one-week challenge: no delivery, cook everything myself. Day one was a disaster — burnt rice, sad eggs. But guess what: on day four, I followed a YouTube recipe and made kimchi fried rice with a secret spoon of butter... and it was life-changing. Better than delivery, honestly!\n\nThe results piled up quietly: lighter body, calmer stomach, fatter wallet — and a brand-new hobby. Since then, cooking has been my thing, and that one-week challenge never really ended. Best health decision I ever made, hands down.", "koQ": "건강을 개선하기 위해 했던 일에 대해 말해주세요. 새로운 운동을 시작했거나 식단을 바꿨나요? 결과는 어땠나요? 가능한 많은 세부사항을 말해주세요.", "koA": "몇 년 전의 대식단 개혁이 떠오르네요. 그때 제 주방엔 가전이 딱 하나 있었어요. 배달 앱이요! 치킨, 버거, 야식. 몸은 무겁고 지갑은 가벼웠는데, 어느 날 배달 기사님이 절 오랜 친구처럼 반겨주시더라고요. 그게 저의 경고음이었죠.\n\n그래서 일주일 챌린지를 선언했어요. 배달 금지, 전부 직접 요리하기. 첫날은 재앙이었어요. 탄 밥에 슬픈 계란이요. 근데 있잖아요, 4일째에 유튜브 레시피를 따라 버터 한 스푼의 비밀이 담긴 김치볶음밥을 만들었는데... 인생이 바뀌었어요. 솔직히 배달보다 맛있었다니까요!\n\n결과는 조용히 쌓여갔어요. 가벼워진 몸, 편안해진 속, 두둑해진 지갑, 그리고 완전히 새로운 취미까지요. 그 뒤로 요리는 저의 것이 됐고, 그 일주일 챌린지는 사실 아직도 안 끝났어요. 두말할 것 없이, 제 인생 최고의 건강 결정이었죠.", "struct": [["1️⃣ 과거", "주방의 유일한 가전 = 배달 앱"], ["2️⃣ 계기", "기사님의 오랜 친구 인사"], ["3️⃣ 도전", "배달 금지 일주일 챌린지"], ["4️⃣ 반전", "4일째 김치볶음밥 탄생"], ["5️⃣ 결과", "몸 · 속 · 지갑 + 새 취미"]], "scoring": [["기원 스토리", "시리즈 최애 요리 김치볶음밥(버터 · 유튜브 레시피)의 탄생 비화 — 캐논의 기원을 채우는 완성형 재활용이에요 🔁 🎓"], ["유머 계기", "배달 기사님이 오랜 친구처럼 인사한 날 — wake-up call을 웃기고 아프게 그리는 최고의 장면이에요 😆 ⏰"], ["결과 3+1", "몸 · 속 · 지갑 세 가지 개선에 새 취미까지 — what was the result에 숫자로 답하고 보너스로 닫아요 📊 ✅"], ["안 끝난 챌린지", "그 일주일 챌린지는 아직도 안 끝났다 — 일회성 시도를 현재의 습관으로 잇는 since then의 정석이에요 🔁 💬"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["diet reform", "식단 개혁", "건강 개선을 개혁으로 격상 💪"], ["like an old friend", "오랜 친구처럼", "배달 중독 증명 유머 😆"], ["wake-up call", "경고음, 각성 계기", "계기형 공식의 심장 🔁 ⏰"], ["one-week challenge", "일주일 챌린지", "변화 시도의 구체적 틀 ✅"], ["burnt rice, sad eggs", "탄 밥, 슬픈 계란", "첫날 실패 형용사 유머 😆"], ["life-changing", "인생을 바꾸는", "김치볶음밥 탄생의 순간 ✨"], ["pile up", "쌓이다", "결과 질문의 핵심 동사 📊"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😊"], ["since then", "그 이후로", "교훈 연결 공식 🔁 ✅"], ["hands down", "두말할 것 없이", "최상급 확신, 시리즈 개근 🔁 🔥"]], "audio": "audio/2_돌발/2-099 20. 건강(Health)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-099 20. 건강(Health)_과거 경험.mp3"}, {"id": "2-100", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "비교", "badge": "100 비교", "enQ": "Compare the way people manage their health today with the past. How have people's ideas about health and exercise changed over time? Tell me in detail.", "enA": "Back then, health used to be something you thought about only when you lost it. People saw a doctor when they were sick, and that was the whole plan! Exercise was for athletes — regular folks just... worked, ate, and hoped for the best.\n\nThese days, it's a completely different story: health became a lifestyle, almost a hobby. Running crews fill the riverside every evening, smartwatches nag us about steps, zero-sugar drinks own half the convenience store, and gym selfies are a whole genre. Compared to the past, the biggest shift is in thinking: from treatment to prevention — we stopped waiting for the alarm and started maintaining the machine.\n\nI have to admit, sometimes it's a bit much — even resting is a program now! But of all the trends we've followed, taking care of ourselves is a pretty good one, if you ask me.", "koQ": "오늘날 사람들이 건강을 관리하는 방식과 과거를 비교해주세요. 시간이 지나며 건강과 운동에 대한 사람들의 생각은 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 건강이 잃고 나서야 생각하는 것이었어요. 사람들은 아프면 병원에 갔고, 그게 계획의 전부였죠! 운동은 선수들의 것이었어요. 보통 사람들은 그냥... 일하고, 먹고, 잘되길 바랐죠.\n\n요즘은 완전히 다른 이야기예요. 건강이 라이프스타일, 거의 취미가 됐거든요. 매일 저녁 러닝 크루가 강변을 채우고, 스마트워치는 걸음 수로 잔소리하고, 제로 음료가 편의점 절반을 차지하고, 헬스장 셀카는 하나의 장르가 됐어요. 과거와 비교하면 가장 큰 변화는 생각이에요. 치료에서 예방으로요. 우리는 경보를 기다리는 걸 멈추고, 기계를 정비하기 시작한 거죠.\n\n인정할 건 인정해야죠. 가끔은 좀 과해요. 이젠 쉬는 것까지 프로그램이 됐으니까요! 그래도 우리가 따라온 유행 중에, 스스로를 돌보는 유행은 꽤 괜찮은 유행이에요. 제 생각엔요.", "struct": [["1️⃣ 과거", "아프면 병원, 그게 전부"], ["2️⃣ 현재", "러닝 크루 · 워치 · 제로 음료"], ["3️⃣ 핵심", "치료 → 예방으로 전환"], ["4️⃣ 비유", "경보 대기 → 기계 정비"], ["5️⃣ 마무리", "꽤 괜찮은 유행이다"]], "scoring": [["생각의 축", "질문이 ideas의 변화를 물으니 답도 생각의 축으로 — 치료에서 예방으로 한 줄이 이 답변의 등뼈예요 🔑 ✅"], ["풍경 4종", "러닝 크루 · 워치 잔소리 · 제로 음료 · 헬스장 셀카 — 요즘 건강 문화를 장면 넷으로 스케치해요 🏃 📸"], ["기계 비유", "경보를 기다리다 → 기계를 정비하다 — 예방이라는 추상어를 정비라는 그림으로 번역하는 기술이에요 ✨ 💬"], ["유행 마무리", "쉬는 것도 프로그램이 됐다는 투정 + 그래도 꽤 괜찮은 유행이라는 긍정 — 균형 마무리의 건강 버전이에요 🔁 😊"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["hope for the best", "잘되길 바라다", "과거식 건강 관리 유머 😆"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["running crew", "러닝 크루", "요즘 운동 문화 디테일 🏃"], ["nag", "잔소리하다", "스마트워치 의인화 동사 😆"], ["a whole genre", "하나의 장르", "헬스장 셀카 과장 유머 📸"], ["from treatment to prevention", "치료에서 예방으로", "생각 변화의 축 한 줄 🔑"], ["maintain the machine", "기계를 정비하다", "몸 관리 비유, 예방의 그림 ✨"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["I have to admit", "인정할 수밖에 없다", "균형 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-100 20. 건강(Health)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-100 20. 건강(Health)_비교.mp3"}, {"id": "2-101", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "묘사", "badge": "101 묘사", "enQ": "Describe the public transportation in your country. What kinds of transportation do people use to get around, and what are they like? Tell me in detail.", "enA": "Oh, this is Korea's bragging corner — our public transportation is honestly world-class. The two pillars are the subway and the buses, and one little card rules them all.\n\nThe subway first: it's the veins of the city — fast, clean, air-conditioned, with full phone signal even underground. Trains arrive on the dot, and screen doors keep every platform safe. Then the buses: color-coded by route type, running in their own dedicated lanes, so they often beat cars through rush hour! And the magic part is the transfer system — subway to bus, one tap, one fare. The card does all the math.\n\nWhat are they like day to day? Quiet, punctual, and everywhere — you can cross the whole city for less than the price of a coffee. That's pretty much our transportation: the one thing every Korean takes for granted until they travel abroad!", "koQ": "당신의 나라의 대중교통을 묘사해주세요. 사람들은 이동할 때 어떤 교통수단을 이용하고, 그것들은 어떤가요? 자세히 말해주세요.", "koA": "오, 이건 한국의 자랑 코너예요. 우리 대중교통은 솔직히 세계 최고 수준이거든요. 두 기둥은 지하철과 버스인데, 작은 카드 한 장이 그 모든 걸 지배해요.\n\n먼저 지하철요. 도시의 혈관이에요. 빠르고, 깨끗하고, 에어컨 나오고, 지하에서도 폰이 빵빵 터져요. 열차는 정각에 도착하고, 스크린도어가 모든 승강장을 안전하게 지켜주죠. 그다음 버스요. 노선 종류별로 색이 다르고, 전용차로로 달려서 러시아워엔 승용차를 이기는 경우도 많아요! 그리고 마법 같은 부분은 환승 시스템이에요. 지하철에서 버스로, 한 번의 태그, 하나의 요금. 계산은 카드가 다 해줘요.\n\n평소엔 어떠냐고요? 조용하고, 정확하고, 어디에나 있어요. 커피 한 잔 값도 안 되는 돈으로 도시 전체를 가로지를 수 있죠. 이게 우리 대중교통이에요. 모든 한국인이 해외여행 가기 전까진 당연하게 여기는 바로 그것요!", "struct": [["1️⃣ 선언", "자랑 코너 — 세계 최고급"], ["2️⃣ 지하철", "도시의 혈관, 정각 도착"], ["3️⃣ 버스", "색깔 노선 + 전용차로"], ["4️⃣ 마법", "한 번의 태그 환승 시스템"], ["5️⃣ 마무리", "해외 가면 그리운 당연함"]], "scoring": [["두 기둥 구조", "지하철 → 버스 → 환승 시스템 순서로 — what kinds와 what are they like를 기둥별로 묶어 답하는 구조예요 ✅ 🧩"], ["혈관 비유", "지하철은 도시의 혈관 — 나라 규모 묘사는 비유 하나로 열어야 그림이 잡혀요 💓 지형 편 산 왕국과 같은 기술이죠 🔁"], ["숫자 없는 숫자", "커피 한 잔 값보다 싸다 — 정확한 요금 대신 비교 가격으로 말하면 외우기 쉽고 더 생생해요 💳 🔑"], ["당연함 반전", "해외 가기 전까진 당연하게 여긴다 — 자랑을 겸손한 반전으로 닫는 마무리가 과시 없이 설득력을 줘요 😊 💬"]], "expr": [["bragging corner", "자랑 코너", "국가 자랑 주제 오프너 😆"], ["two pillars", "두 기둥", "지하철 · 버스 구조 명사 🧩"], ["rule them all", "모든 걸 지배하다", "교통카드 한 장 과장 표현 ✨"], ["veins of the city", "도시의 혈관", "지하철 시그니처 비유 💓"], ["on the dot", "정각에", "정시성 관용구 ⏰"], ["screen doors", "스크린도어", "안전 디테일 어휘 ✅"], ["dedicated lane", "전용차로", "버스 강점 핵심 어휘 🔑"], ["transfer system", "환승 시스템", "K-교통 자랑 포인트 ✅"], ["The card does all the math.", "계산은 카드가 다 한다", "환승 요금 재치 표현 💳"], ["take ~ for granted", "~을 당연하게 여기다", "마무리 반전의 핵심 구문 🔑"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-101 21. 교통(Transport)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-101 21. 교통(Transport)_묘사.mp3"}, {"id": "2-102", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "습관", "badge": "102 습관", "enQ": "How do you usually get around? Which transportation do you take to work or school, and how long does it take? Describe your typical commute in detail.", "enA": "My commute is a simple three-act play — let me walk you through it. Act one: a seven-minute walk to the station, which doubles as my morning warm-up. Act two: the subway, about twenty-five minutes, no transfers — honestly a blessed line!\n\nNow, those twenty-five minutes are sacred. Earbuds in, noise cancelling on, and the packed train becomes my private reading room: news scrolling, playlists, sometimes just staring out as the city slides by. Act three is the final five-minute walk to the office. Door to door, about forty minutes — and the evening version has a bonus scene: on nice days, I hop off one station early and walk the rest along the river.\n\nWeekends are simpler: anything far by subway, anything near on foot. So that's my formula — feet for the short, rails for the long — and honestly, it never gets old.", "koQ": "당신은 보통 어떻게 이동하나요? 직장이나 학교에 갈 때 어떤 교통수단을 타고, 얼마나 걸리나요? 당신의 일반적인 통근 과정을 자세히 설명해주세요.", "koA": "제 통근은 단순한 3막 연극이에요. 차근차근 보여드릴게요. 1막, 역까지 7분 도보. 아침 워밍업을 겸하죠. 2막, 지하철 약 25분, 환승 없음. 솔직히 축복받은 노선이에요!\n\n그 25분은 신성한 시간이에요. 이어폰 꽂고, 노이즈 캔슬링 켜면, 만원 열차가 저만의 독서실이 되거든요. 뉴스 스크롤, 플레이리스트, 가끔은 그냥 흘러가는 도시 구경까지요. 3막은 회사까지 마지막 5분 도보예요. 문에서 문까지 약 40분. 그리고 저녁 버전엔 보너스 장면이 있어요. 날씨 좋은 날엔 한 정거장 먼저 내려서 강변을 따라 걷거든요.\n\n주말은 더 단순해요. 먼 곳은 지하철, 가까운 곳은 도보죠. 그러니까 제 공식은, 짧은 거리는 두 발로, 긴 거리는 레일로예요. 솔직히 전혀 질리지 않아요.", "struct": [["1️⃣ 구조", "통근 = 3막 연극"], ["2️⃣ 1막", "역까지 7분 = 워밍업"], ["3️⃣ 2막", "25분 무환승 독서실"], ["4️⃣ 3막", "5분 도보, 총 40분"], ["5️⃣ 보너스", "한 정거장 먼저 내리기"]], "scoring": [["3막 구조", "도보 7분 → 지하철 25분 → 도보 5분, 문에서 문까지 40분 — how long에 구간별 숫자로 답하는 완벽 구조예요 ✅ ⏰"], ["신성한 25분", "만원 열차가 노캔과 함께 나만의 독서실로 — 이어폰 편의 조용한 방 기술이 통근 버전으로 진화했어요 🔁 🎵"], ["보너스 장면", "한 정거장 먼저 내려 강변 걷기 — 통근에 낭만 한 스푼을 얹는 디테일이 답변의 개성이에요 ✨ 🏃"], ["공식 마무리", "짧은 거리는 두 발로, 긴 거리는 레일로 — 이동 습관을 대구 공식으로 닫는 정석 마무리예요 💬 🎓"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["three-act play", "3막 연극", "통근을 극으로 만드는 비유 🎭"], ["double as ~", "~을 겸하다", "도보 = 워밍업 재치 동사 🏃"], ["a blessed line", "축복받은 노선", "무환승 감사 유머 😊"], ["packed", "만원인", "기술 취향 편 재활용 🔁 📏"], ["private reading room", "나만의 독서실", "노캔 지하철 비유, 이어폰 편 🔁 🎵"], ["door to door", "문에서 문까지", "소요 시간 필수 관용구 ⏰"], ["hop off", "뛰어내리다", "한 정거장 일찍 하차 동사 ✅"], ["bonus scene", "보너스 장면", "3막 연극 비유의 연장 🎬"], ["feet for the short, rails for the long", "짧은 건 발, 긴 건 레일", "이동 공식 대구 마무리 💬"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-102 21. 교통(Transport)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-102 21. 교통(Transport)_습관.mp3"}, {"id": "2-103", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "취향", "badge": "103 취향", "enQ": "Which do you prefer - taking public transportation or driving your own car? Why do you prefer that way of getting around? Tell me the reasons.", "enA": "If I had to choose, public transportation wins — no contest. Small confession: I do have a driver's license... it just lives peacefully in my drawer! For me, it's all about what I get to do while moving.\n\nA driver's hands are stuck at ten and two; mine are free — music, reading, texting my mom back. I'd take the subway over the wheel any day. Driving means watching the road; riding means the time is all mine. And parking in this city? That's a horror genre! Don't get me wrong — cars are unbeatable for beach trips with big bags. That's why my best friend drives and I run the playlist — perfect teamwork!\n\nNothing beats dozing off for exactly one station and waking up refreshed. In a nutshell: a car moves your body, but the subway gives you your time back.", "koQ": "대중교통을 타는 것과 자가용을 운전하는 것 중 무엇을 선호하나요? 왜 그 이동 방식을 선호하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 대중교통 승리예요. 고민할 것도 없죠. 작은 고백 하나 할게요. 저 운전면허 있어요... 서랍 속에서 평화롭게 살고 있을 뿐이에요! 저한테 핵심은 이동하는 동안 뭘 할 수 있느냐예요.\n\n운전자의 손은 핸들 10시와 2시에 묶여 있지만, 제 손은 자유로워요. 음악, 독서, 엄마 문자 답장까지요. 핸들보다는 무조건 지하철이에요. 운전은 도로만 봐야 하지만, 타는 동안엔 그 시간이 온전히 제 것이 되니까요. 그리고 이 도시에서 주차요? 그건 공포 장르예요! 오해는 마세요. 짐 많은 바다 여행엔 차가 무적이죠. 그래서 절친이 운전하고 제가 플레이리스트를 담당하는 거예요. 완벽한 팀워크죠!\n\n딱 한 정거장만 졸고 개운하게 깨어나는 것만 한 게 없어요. 한마디로, 차는 몸을 옮기지만, 지하철은 시간을 돌려줘요.", "struct": [["1️⃣ 선택", "대중교통, no contest"], ["2️⃣ 고백", "서랍 속 평화로운 면허증"], ["3️⃣ 핵심", "이동 중 손과 시간의 자유"], ["4️⃣ 양보", "여행 땐 차 — 절친 운전"], ["5️⃣ 명언", "차는 몸을, 지하철은 시간을"]], "scoring": [["장롱면허 유머", "면허는 서랍 속에서 평화롭게 산다 — 자기 폭로 유머 오프닝이 선택 이유를 궁금하게 만들어요 😆 패션 편 물장구와 같은 기술 🔁"], ["손의 논리", "운전자의 손은 10시 2시에 묶이고 내 손은 자유롭다 — 선호 이유를 손 하나로 그려내는 구체화 기술이에요 🔑 ✨"], ["역할 분담", "바다 여행엔 절친이 운전, 나는 플레이리스트 — 양보 단계에서도 시리즈 인물의 팀워크가 살아 있어요 🔁 💕"], ["시간 명언", "차는 몸을 옮기고 지하철은 시간을 돌려준다 — 이동 취향을 시간의 언어로 닫는 대구 마무리예요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["small confession", "작은 고백", "장롱면허 유머 오프너 😆"], ["lives peacefully in my drawer", "서랍 속 평화로운 삶", "장롱면허 의인화 유머 😆"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식 🔁 ✨"], ["stuck at ten and two", "10시 2시에 묶인", "운전자 손 위치 디테일 🔑"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["a horror genre", "공포 장르", "도심 주차 과장 비유 🎭"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["run the playlist", "플레이리스트를 담당하다", "절친 여행 역할 분담 🔁 🎵"], ["doze off", "깜빡 졸다", "지하철 쪽잠의 낭만 😴"], ["give you your time back", "시간을 돌려주다", "이 페이지의 명언 뼈대 💬"]], "audio": "audio/2_돌발/2-103 21. 교통(Transport)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-103 21. 교통(Transport)_취향.mp3"}, {"id": "2-104", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "과거 경험", "badge": "104 과거 경험", "enQ": "Tell me about a problem you have had while using transportation. Was there a traffic jam, or did something uncomfortable happen? How did you deal with it?", "enA": "This reminds me of my most embarrassing subway ride. It was the morning of a big work presentation — suit on, notes memorized, coffee in hand. I marched confidently onto the train, opened my phone... and guess what: three stations later, the announcement woke me from my scrolling. I was going the wrong way!\n\nOut of nowhere, my forty-minute cushion shrank to almost nothing. But panic solves zero problems, so I made a quick plan: jump off, sprint across the platform, and text my teammate the honest truth — 'took the wrong train, there in twenty!' No excuses, just facts.\n\nI slid in five minutes early, sweaty but alive, and the presentation went off without a hitch. It worked out fine — and since then, I have a sacred rule: check the platform sign twice, phone stays in the pocket until the doors close!", "koQ": "교통수단을 이용하면서 겪은 문제에 대해 말해주세요. 교통체증이 있었거나 불편한 일이 있었나요? 어떻게 대처했나요?", "koA": "제 인생 가장 민망했던 지하철 탑승이 떠오르네요. 회사 중요 발표가 있던 날 아침이었어요. 정장 입고, 발표 내용 다 외우고, 커피까지 들고요. 자신만만하게 열차에 올라 폰을 열었는데... 있잖아요, 세 정거장 뒤에 안내 방송이 절 스크롤에서 깨웠어요. 반대 방향으로 가고 있던 거예요!\n\n난데없이 40분의 여유가 거의 0으로 쪼그라들었죠. 근데 패닉은 아무 문제도 못 풀잖아요. 그래서 빠르게 계획을 세웠어요. 뛰어내리고, 승강장 건너편으로 전력 질주하고, 팀 동료에게 정직한 진실을 문자로 보냈어요. 반대 열차 탔어, 20분 안에 도착! 변명 없이, 사실만요.\n\n저는 5분 일찍, 땀범벅이었지만 무사히 미끄러져 들어갔고, 발표는 아무 문제 없이 진행됐어요. 결국 다 잘 풀렸죠. 그리고 그 뒤로 신성한 룰이 생겼어요. 승강장 표지판 두 번 확인, 폰은 문이 닫힐 때까지 주머니에!", "struct": [["1️⃣ 배경", "발표 날 아침, 완벽 준비"], ["2️⃣ 반전", "세 정거장 뒤 반대 방향"], ["3️⃣ 대처", "전력 질주 + 정직한 문자"], ["4️⃣ 결말", "5분 일찍, 발표 무사"], ["5️⃣ 교훈", "표지판 2번, 폰은 주머니"]], "scoring": [["자신감 낙차", "정장 · 암기 · 커피의 완벽한 아침 → 반대 방향 — 자신감이 높을수록 반전의 낙차가 웃음을 만들어요 🎭 😆"], ["대처 3단", "뛰어내리기 → 건너편 질주 → 정직한 문자. how did you deal with it에 행동 셋으로 답해요 ✅ 변명 없이 사실만이 포인트!"], ["패닉 명언", "패닉은 아무 문제도 못 푼다(Panic solves zero problems) — 위기 대처의 태도를 명언 한 줄로 보여줘요 🔑 💬"], ["룰 마무리", "표지판 두 번, 폰은 주머니에 — 기술 편 백업 기기 룰처럼 사건을 구체적 룰로 승화하는 마무리예요 🔁 🎓"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["embarrassing", "민망한", "문제 경험 감정 형용사 😆"], ["march confidently", "자신만만하게 행진하다", "반전 전의 자신감 묘사 🎭"], ["the wrong way", "반대 방향", "이 사건의 핵심 세 단어 🔥"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["cushion", "여유 (시간)", "40분 쿠션 표현 ⏰"], ["Panic solves zero problems.", "패닉은 0문제 해결", "대처의 철학 한 줄 🔑"], ["go off without a hitch", "아무 문제 없이 진행되다", "결말 필수 관용구 ✅"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😊"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["stay in the pocket", "주머니에 머물다", "새 룰의 핵심 구문 🔁 🌙"]], "audio": "audio/2_돌발/2-104 21. 교통(Transport)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-104 21. 교통(Transport)_과거 경험.mp3"}, {"id": "2-105", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "비교", "badge": "105 비교", "enQ": "Compare the transportation system of today with the one from your childhood. What has changed and improved over the years? Tell me about the differences.", "enA": "Back then, the bus stop was a place of pure mystery. You never knew when the bus would come — you just stood there, squinting down the road like a sailor watching the horizon! Buses were loud and bumpy, and the subway had no screen doors, so the wind hit your face with every arriving train.\n\nThese days, it's a completely different story. My app tells me the bus is four minutes away — and it actually is! Screen doors made platforms safe and quiet, buses glide along, electric and quiet, and my phone taps me through every gate. Compared to my childhood, the biggest improvement: the guesswork is gone. Transportation stopped being an adventure and became a service.\n\nI have to admit, my inner child misses that little victory dance when your bus finally appeared down the road. These days the app spoils the ending, if you ask me!", "koQ": "오늘날의 교통 시스템과 어린 시절의 교통 시스템을 비교해주세요. 시간이 지나며 무엇이 변화하고 개선되었나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 제가 어릴 때 버스 정류장은 순수한 미스터리의 공간이었어요. 버스가 언제 올지 절대 알 수 없었죠. 그냥 서서, 수평선을 바라보는 선원처럼 도로 끝을 실눈 뜨고 노려보는 거예요! 버스는 덜컹거렸고, 지하철엔 스크린도어가 없어서 열차가 들어올 때마다 바람이 얼굴을 때렸어요.\n\n요즘은 완전히 다른 이야기예요. 앱이 버스가 4분 뒤에 온다고 알려주는데, 진짜로 4분 뒤에 와요! 스크린도어가 승강장을 안전하고 조용하게 만들었고, 버스는 전기로, 조용하게 미끄러지듯 달리고, 폰 태그 한 번이면 모든 개찰구가 열려요. 어린 시절과 비교하면 가장 큰 개선은 추측이 사라진 거예요. 교통이 모험이기를 멈추고 서비스가 된 거죠.\n\n그래도 인정할 건 인정해야죠. 제 안의 어린이가 그리워하는 게 있어요. 저 멀리 드디어 내 버스가 나타났을 때의 그 작은 승리의 춤이요. 제 생각엔, 요즘은 앱이 결말을 스포해버려요!", "struct": [["1️⃣ 과거", "정류장 = 미스터리 공간"], ["2️⃣ 장면", "선원처럼 도로 끝 응시"], ["3️⃣ 현재", "앱 4분 예고 · 스크린도어"], ["4️⃣ 핵심", "추측의 실종, 모험 → 서비스"], ["5️⃣ 마무리", "앱이 스포하는 승리의 춤"]], "scoring": [["선원 한 방", "도로 끝을 실눈 뜨고 보는 선원 — 버스 기다림의 시대를 직유 하나로 소환해요 😆 비교의 과거는 장면으로 여는 게 정석이죠 🔁"], ["개선 3종", "실시간 앱 · 스크린도어 · 전기 버스 — what has improved에 구체물 셋으로 답하면 증명 끝이에요 ✅ 📊"], ["추측의 실종", "가장 큰 개선은 추측이 사라진 것, 모험 → 서비스 — 기술 · 약속 비교 편의 기다림 테마와 이어지는 시리즈 철학이에요 🔁 💬"], ["스포 마무리", "앱이 승리의 춤 결말을 스포한다 — 편리함 인정 + 기다림의 낭만, 시리즈 대미를 장식하는 그리움 마무리예요 🔁 😊"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["pure mystery", "순수한 미스터리", "옛 정류장 한 방 요약 ✨"], ["squint down the road", "도로 끝을 실눈 뜨고 보다", "기다림의 자세 묘사 😆"], ["like a sailor", "선원처럼", "버스 기다림 직유 유머 🗺️"], ["bumpy", "덜컹거리는", "옛 버스 감각 형용사 ✅"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["glide", "미끄러지듯 달리다", "여가 편 재활용, 전기버스 버전 🔁 ✨"], ["guesswork", "추측, 어림짐작", "가장 큰 개선의 핵심 명사 🔑"], ["from adventure to service", "모험에서 서비스로", "변화의 축 한 문장 💬"], ["victory dance", "승리의 춤", "내 버스 등장의 기쁨 유머 😆"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-105 21. 교통(Transport)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-105 21. 교통(Transport)_비교.mp3"}, {"id": "3-001", "cat": "roleplay", "catName": "롤플레이 질문", "num": 1, "topic": "MP3 구매", "topicEn": "Buying", "type": "정보 요청", "badge": "01 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are thinking of getting an MP3 player, and your friend recently purchased one. Before buying it, call your friend and ask three or four questions about his or her MP3 player to gather some information.", "enA": "Hey, it's me! Do you have a second? You know I jog by the river every evening, right? Well, I'm finally picking up an MP3 player, and you got one just last month. Perfect timing! Can I ask you a few questions?\n\nOkay, first things first — which model did you go for? ... Oh, that one? I've seen it online, actually. And how much did it set you back? ... Ouch, that much? That's a little over my budget. Is there any chance it goes on sale?\n\nAlright, one more thing — how's the battery? I jog for almost an hour. ... A whole week on one charge? That's exactly what I wanted to hear! Oh, and does it connect to wireless earphones? ... Perfect. Could you text me the model name? Thanks a ton — talk to you later!", "koQ": "당신은 MP3 플레이어 구매를 고민 중입니다. 최근에 하나 산 친구에게 전화해, 정보를 얻기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 잠깐 시간 돼? 나 매일 저녁에 강변에서 조깅하는 거 알지? 드디어 MP3 플레이어를 하나 장만하려고. 너 바로 지난달에 샀잖아. 타이밍 딱이네! 몇 가지만 물어봐도 될까?\n\n자, 우선 중요한 것부터. 어떤 모델로 샀어? ... 아, 그거? 나도 인터넷에서 본 적 있어. 그리고 얼마나 들었어? ... 헉, 그렇게나? 내 예산을 좀 넘는데. 혹시 세일할 가능성은 있어?\n\n좋아, 하나만 더. 배터리는 어때? 나는 거의 한 시간씩 뛰거든. ... 한 번 충전으로 일주일? 그거 딱 듣고 싶던 말이야! 아, 그리고 무선 이어폰이랑 연결은 잘 돼? ... 완벽해. 모델명 좀 문자로 보내 줄래? 정말 고마워, 나중에 또 통화하자!", "struct": [["1️⃣ 인사", "전화 오프닝 + 상황 · 질문 예고"], ["2️⃣ 질문", "① 모델 → 아는 척 리액션"], ["3️⃣ 질문", "② 가격 → 부정 리액션(비싸!)"], ["4️⃣ 질문", "③ 배터리 → 강한 긍정 리액션"], ["5️⃣ 마무리", "④ 이어폰 연결 + 모델명 · 인사"]], "scoring": [["질문 + 리액션", "정보 요청의 공식은 질문 → 상대 대답 → 리액션의 반복이에요 💬 질문만 나열하면 설문지 읽기처럼 들리고, 리액션이 붙는 순간 진짜 통화가 됩니다"], ["리액션은 짧게", "'Oh, that one?' 'Perfect.'처럼 한두 마디면 충분해요 ⏰ 리액션이 길어지면 어색해지고 질문 개수를 못 채웁니다"], ["긍정·부정 섞기", "가격엔 부정(Ouch, that much?), 배터리엔 긍정(exactly what I wanted to hear). 리액션 색깔을 섞어야 진짜 대화처럼 들려요 😆"], ["연기 톤 유지", "'...' 자리는 상대가 대답하는 순간이에요 🎭 실제 시험에서는 아주 짧게 쉬었다가 리액션으로 이어 가면서 강약을 살려 연기하듯 말하세요"]], "expr": [["Hey, it's me!", "안녕, 나야!", "롤플레이 전화 오프닝 1순위 💬"], ["Can I ask you a few questions?", "몇 가지 물어봐도 돼?", "질문 시작을 알리는 신호 🔑"], ["Perfect timing!", "타이밍 딱이네!", "상황을 받아치는 첫 리액션 🔥"], ["first things first", "우선 중요한 것부터", "서베이 카페·요리 편 재활용 🔁"], ["Oh, that one?", "아, 그거?", "대답을 받아 주는 짧은 리액션 💬"], ["How much did it set you back?", "얼마나 들었어?", "How much was it?의 상위 버전 💯"], ["Ouch, that much?", "헉, 그렇게나?", "가격에 쓰는 부정 리액션 😆"], ["over my budget", "예산을 넘는", "부담을 밝히는 한 마디 💳"], ["Is there any chance ~?", "혹시 ~할 수 있어?", "조심스럽게 얹는 추가 질문 ✨"], ["one more thing", "하나만 더", "3·4번째 질문을 여는 장치 🔑"], ["exactly what I wanted to hear", "딱 듣고 싶던 말", "가장 강한 긍정 리액션 🔥"]], "audio": "audio/3_롤플레이/3-001 1. MP3 구매(Buying)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-001 1. MP3 구매(Buying)_정보 요청.mp3"}, {"id": "3-002", "cat": "roleplay", "catName": "롤플레이 질문", "num": 1, "topic": "MP3 구매", "topicEn": "Buying", "type": "문제 해결", "badge": "02 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You broke the MP3 player that you borrowed from your friend. Call your friend, describe what happened, and offer two or three ideas to get your friend a working MP3 player as soon as possible.", "enA": "Hey, it's me. I've got some bad news, and I'm really sorry. You know the MP3 player you lent me last week? I was jogging by the river last night, and it slipped out of my pocket and hit the ground. The screen looks fine, but it won't turn on at all.\n\nHere's what I'm thinking. First, I can take it to the service center tomorrow morning — I already called them, and a battery replacement only takes a day. Or, if it's not worth fixing, I'll just get you a brand-new one, the exact same model.\n\nAnd in the meantime, please take mine. My old player still works fine, so you won't be without music for a single day. Just let me know which option works best for you. Again, I'm so sorry — I'll make this right, I promise.", "koQ": "친구에게 빌린 MP3 플레이어를 고장 냈습니다. 전화해서 상황을 설명하고, 빨리 해결할 방법 2~3가지를 제안해 보세요.", "koA": "안녕, 나야. 안 좋은 소식이 있어서 전화했어. 정말 미안해. 지난주에 빌려준 MP3 플레이어 있잖아. 어젯밤에 강변에서 조깅하다가 주머니에서 미끄러져 나와 바닥에 떨어졌어. 화면은 멀쩡해 보이는데 전원이 아예 안 켜져.\n\n내 생각은 이래. 첫째, 내일 아침에 서비스 센터에 맡길게. 이미 전화해 봤는데 배터리 교체는 하루면 된대. 아니면 수리가 애매하다 싶으면 완전히 같은 모델로 새 걸 사 줄게.\n\n그리고 그동안은 내 걸 써. 예전에 쓰던 게 아직 멀쩡해서 하루도 음악 없이 지낼 일은 없을 거야. 어떤 방법이 제일 좋은지 알려만 줘. 다시 한번 미안해. 꼭 제대로 해결할게, 약속해.", "struct": [["1️⃣ 사과", "나쁜 소식 예고 + 진심 사과"], ["2️⃣ 상황", "조깅 중 낙하 · 전원 안 켜짐"], ["3️⃣ 제안", "① 서비스 센터 수리 (하루)"], ["4️⃣ 제안", "② 같은 모델 새 제품 구매"], ["5️⃣ 마무리", "③ 내 것 대여 + 선택 요청"]], "scoring": [["사과가 먼저", "문제 해결 유형의 첫 문장은 해명이 아니라 사과예요. I'm really sorry를 먼저 던지고 상황을 설명하면 태도 점수부터 달라져요 😊"], ["대안은 3개", "2~3개를 요구해도 3개를 준비하세요. 수리 → 새 제품 → 임시 대여처럼 성격이 다른 대안이어야 설득력이 생겨요 ✅"], ["대안 번호 붙이기", "First / Or / And in the meantime으로 끊어 주면 몇 개를 말했는지 채점자가 세기 쉬워요 🔑 나열은 반드시 신호어와 함께"], ["책임지는 마무리", "'I'll make this right, I promise.' 한 문장이면 사과–대안–약속 구조가 깔끔하게 완성돼요 💪"]], "expr": [["I've got some bad news", "안 좋은 소식이 있어", "문제 해결 유형 오프닝 1순위 💬"], ["lend ↔ borrow", "빌려주다 ↔ 빌리다", "방향이 반대! 시험 단골 함정 🔑"], ["slip out of ~", "~에서 미끄러져 나오다", "사고 경위 묘사 만능 동사 💪"], ["it won't turn on", "전원이 안 켜져", "고장 상태 설명 기본형 🔋"], ["Here's what I'm thinking", "내 생각은 이래", "대안 나열 직전의 신호탄 🔑"], ["service center", "서비스 센터", "A/S는 콩글리시예요! ✅"], ["battery replacement", "배터리 교체", "수리 제안을 구체화하는 명사 🔋"], ["brand-new", "완전히 새것인", "new보다 한 단계 위 어휘 ✨"], ["in the meantime", "그동안에는", "임시 대안을 얹는 연결어 ⏰"], ["Just let me know", "알려만 줘", "선택권을 넘기는 마무리 ✅"], ["I'll make this right", "꼭 제대로 해결할게", "책임을 약속하는 한 문장 💪"]], "audio": "audio/3_롤플레이/3-002 1. MP3 구매(Buying)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-002 1. MP3 구매(Buying)_문제 해결.mp3"}, {"id": "3-003", "cat": "roleplay", "catName": "롤플레이 질문", "num": 1, "topic": "MP3 구매", "topicEn": "Buying", "type": "과거 경험", "badge": "03 과거 경험", "enQ": "That's the end of the situation. Have you ever had a device that broke down or stopped working properly? What exactly was wrong, and how did you deal with it? Give me as many details as you can.", "enA": "Oh, this reminds me of something that happened last spring. I was jogging along the river with my wireless earphones, like I do every evening. About twenty minutes in, out of nowhere, the right side just went dead. Total silence on one ear.\n\nTo be honest, I was more annoyed than worried — my running playlist is half the reason I jog. I tried everything: putting it back in the case, resetting it, you name it. Nothing worked. Guess what the real problem was? The charging contact was covered in dust.\n\nSo I found a repair video on YouTube — my algorithm knows me too well — and cleaned it with a cotton swab. It came back to life in about two minutes. Since then, I've been wiping the case every weekend. Lesson learned: sometimes it's not broken, it's just dirty!", "koQ": "어떤 기기가 고장 나거나 제대로 작동하지 않았던 경험이 있나요? 무엇이 문제였고 어떻게 해결했는지 자세히 말해 주세요.", "koA": "아, 작년 봄에 있었던 일이 생각나네요. 여느 저녁처럼 무선 이어폰을 끼고 강변에서 조깅을 하고 있었어요. 한 20분쯤 지났을까, 난데없이 오른쪽이 그냥 먹통이 됐어요. 한쪽 귀만 완전히 무음이었죠.\n\n솔직히 걱정보다는 짜증이 났어요. 조깅을 하는 이유의 절반이 러닝 플레이리스트거든요. 케이스에 다시 넣어 보고, 초기화도 해 보고, 안 해 본 게 없었어요. 그런데 진짜 원인이 뭐였는지 아세요? 충전 단자가 먼지로 덮여 있었던 거예요.\n\n그래서 유튜브에서 수리 영상을 찾았는데, 제 알고리즘이 저를 너무 잘 알더라고요. 면봉으로 닦았더니 2분 만에 다시 살아났어요. 그 후로는 주말마다 케이스를 닦고 있어요. 교훈이라면, 고장이 아니라 그냥 더러운 걸 수도 있다는 거죠!", "struct": [["1️⃣ 도입", "회상 시그널 (This reminds me of)"], ["2️⃣ 상황", "저녁 강변 조깅 · 무선 이어폰"], ["3️⃣ 문제", "갑자기 한쪽 먹통 (went dead)"], ["4️⃣ 해결", "유튜브 영상 + 면봉 청소"], ["5️⃣ 마무리", "주말 청소 습관 + 교훈 한 줄"]], "scoring": [["과거 시제 유지", "was, went, tried, worked처럼 과거형을 안정적으로 이어 가는 것이 경험 답변의 기본기예요 📖 시제가 흔들리면 이야기도 흔들려요"], ["반전 장치", "out of nowhere로 사건을 터뜨리고 Guess what으로 원인을 공개하면 밋밋한 이야기에 굴곡이 생겨요 🎭 돌발 편에서 쓰던 콤보 그대로예요 🔁"], ["감정 리액션", "more annoyed than worried처럼 감정을 한 단계 정교하게 비교하면 진짜 겪은 이야기처럼 들려요 😊"], ["교훈 마무리", "Lesson learned로 닫으면 사건이 깨달음으로 정리돼요 ✅ 서베이 요리 편에서 쓴 마무리를 그대로 재활용했어요 🔁"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["out of nowhere", "난데없이", "사건 발생 신호, 돌발 편 개근 🔁"], ["go dead", "(기기가) 먹통이 되다", "전원·배터리 고장 표현 🔋"], ["to be honest", "솔직히 말하면", "감정 고백 앞 필러 🔁 😊"], ["more A than B", "B라기보다 A한", "감정을 한 단계 정교하게 💪"], ["you name it", "뭐든 다요", "나열을 닫는 원어민식 마무리 ✨"], ["nothing worked", "아무것도 안 통했다", "시도–실패 나열의 마침표 💪"], ["Guess what ~?", "그런데 있잖아요?", "원인 공개 직전의 필러 🎭"], ["covered in dust", "먼지로 덮인", "고장 원인을 구체화하는 디테일 📏"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다", "현재완료진행 마무리 📊"], ["Lesson learned!", "교훈을 얻었죠!", "서베이 요리 편 재활용 🔁 ✅"]], "audio": "audio/3_롤플레이/3-003 1. MP3 구매(Buying)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-003 1. MP3 구매(Buying)_과거 경험.mp3"}, {"id": "3-004", "cat": "roleplay", "catName": "롤플레이 질문", "num": 2, "topic": "MP3 대여", "topicEn": "Borrowing", "type": "정보 요청", "badge": "04 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to borrow the MP3 player that your friend has. Call your friend, explain why you need it, and ask three or four questions so you can borrow it.", "enA": "Hey, it's me! Are you free to talk? I have a favor to ask. I'm going to Gangneung this weekend for the sunrise — it's a four-hour night bus ride, and my phone battery never survives that long. Could I possibly borrow your MP3 player?\n\n... Really? You're the best! Okay, just a few questions. Are you using it this weekend? ... Oh, good. I didn't want to leave you without music. And does it come with the charger and the case? ... Both? Perfect.\n\nOne last thing — is there anything I should watch out for? ... Ah, the battery drains fast in the cold? Good to know — I'll keep it in my inside pocket. I'll pick it up Friday evening and bring it back Monday, in one piece, I promise. You're a lifesaver — see you Friday!", "koQ": "친구의 MP3 플레이어를 빌리고 싶습니다. 전화해서 왜 필요한지 설명하고, 빌리기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 통화 괜찮아? 부탁이 하나 있어서. 이번 주말에 일출 보러 강릉에 가는데, 야간 버스로 네 시간이나 걸리거든. 내 폰 배터리는 그렇게 오래 못 버텨. 혹시 네 MP3 플레이어 좀 빌려도 될까?\n\n... 정말? 너 최고다! 좋아, 몇 가지만 물어볼게. 이번 주말에 너도 쓸 일 있어? ... 아, 다행이다. 너를 음악 없이 지내게 하고 싶진 않았거든. 그리고 충전기랑 케이스도 같이 와? ... 둘 다? 완벽해.\n\n마지막으로 하나만. 혹시 조심해야 할 게 있을까? ... 아, 추우면 배터리가 빨리 닳는다고? 알아 둘게. 안주머니에 넣고 다닐게. 금요일 저녁에 가지러 가서 월요일에 멀쩡한 상태로 돌려줄게, 약속해. 너 완전 은인이다. 금요일에 보자!", "struct": [["1️⃣ 인사", "전화 오프닝 + 부탁 예고"], ["2️⃣ 이유", "강릉 일출 · 야간 버스 4시간"], ["3️⃣ 질문", "① 주말 사용? → 안도 리액션"], ["4️⃣ 질문", "② 구성품 → 긍정 리액션"], ["5️⃣ 마무리", "③ 주의사항 + 반납 약속 · 인사"]], "scoring": [["질문 + 리액션", "부탁형도 공식은 같아요. 질문 → 상대 대답 → 리액션 💬 특히 승낙 직후의 You are the best! 한 마디가 답변 전체의 온도를 올려 줍니다"], ["이유 구체화", "강릉 일출, 야간 버스 네 시간처럼 이유가 구체적일수록 부탁이 설득력을 얻어요 💪 서베이 국내여행 편 소재를 그대로 재활용했어요 🔁"], ["대답 되받기", "'Ah, the battery drains fast in the cold?'처럼 상대 대답을 되받아 말하면 알아들었다는 신호가 되고 문장 수도 자연스럽게 늘어요 📊"], ["날짜로 닫기", "가져갈 날짜와 돌려줄 날짜를 못 박으면 답변이 깔끔하게 닫혀요 ⏰ 요일·기간은 채점자가 좋아하는 디테일이에요"]], "expr": [["Are you free to talk?", "통화 괜찮아?", "전화 오프닝 변형 💬"], ["a favor to ask", "부탁할 게 있어", "부탁형 롤플레이 1순위 🔑"], ["night bus", "야간 버스", "서베이 국내여행 편 재활용 🔁 🌅"], ["never survive ~", "~를 못 버티다", "배터리 부족을 살리는 과장 🔋"], ["Could I possibly ~?", "혹시 ~해도 될까?", "가장 공손한 부탁 구문 😊"], ["Really? You're the best!", "정말? 너 최고다!", "승낙 직후 짧은 긍정 리액션 🔥"], ["come with ~", "~이 딸려 오다", "구성품 확인 만능 표현 ✨"], ["watch out for ~", "~을 조심하다", "주의사항 묻기 기본형 ✅"], ["Good to know.", "알아 둘게.", "정보를 받는 짧은 리액션 💬"], ["in one piece", "멀쩡한 상태로", "반납 약속에 쓰는 관용구 💯"], ["You're a lifesaver!", "너 완전 은인이다!", "감사 리액션 최상급 ⭐"]], "audio": "audio/3_롤플레이/3-004 2. MP3 대여(Borrowing)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-004 2. MP3 대여(Borrowing)_정보 요청.mp3"}, {"id": "3-005", "cat": "roleplay", "catName": "롤플레이 질문", "num": 2, "topic": "MP3 대여", "topicEn": "Borrowing", "type": "문제 해결", "badge": "05 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. Unfortunately, you accidentally broke the MP3 player you borrowed from your friend. Contact your friend, explain how it got damaged and what condition it is in now, and offer two or three ways to make up for it.", "enA": "Hey, it's me. I have to come clean about something. Remember the MP3 player I borrowed for my Gangneung trip? On the night bus, I fell asleep with it on my lap, and when I stood up, it fell onto the floor and someone stepped on it. I feel terrible.\n\nAs for the condition, the good news is that it still plays music. But there's a crack across the screen, and the volume button is stuck. So it works, but it doesn't look — or feel — the same as before.\n\nHere's how I'd like to make up for it. I'll pay for a full repair. I already called the center, and they said about two days. If you'd rather have a new one, I'll replace it this week, same model. Either way, dinner is on me. You decide, and I'll take care of the rest.", "koQ": "빌린 MP3 플레이어를 실수로 망가뜨렸습니다. 어쩌다 그렇게 됐고 지금 상태가 어떤지 설명하고, 보상 방법 2~3가지를 제안해 보세요.", "koA": "안녕, 나야. 솔직하게 털어놓을 게 있어. 강릉 갈 때 빌려 간 MP3 플레이어 기억나지? 야간 버스에서 무릎에 올려놓고 잠들었는데, 일어설 때 바닥에 떨어졌고 누가 밟았어. 정말 미안한 마음이야.\n\n지금 상태를 말하자면, 다행인 건 음악은 나온다는 거야. 그런데 화면을 가로지르는 금이 하나 갔고, 볼륨 버튼이 눌린 채로 안 돌아와. 작동은 하는데 예전 같지는 않아.\n\n이렇게 보상하고 싶어. 수리비는 내가 전부 낼게. 이미 센터에 전화해 봤는데 이틀 정도면 된대. 아니면 차라리 새 걸 받고 싶으면 이번 주 안에 같은 모델로 바꿔 줄게. 어느 쪽이든 저녁은 내가 살게. 네가 정해 줘, 나머지는 내가 처리할게.", "struct": [["1️⃣ 고백", "솔직한 사과 (come clean)"], ["2️⃣ 경위", "버스에서 낙하 · 밟힘"], ["3️⃣ 상태", "재생 O · 액정 금 · 버튼 눌림"], ["4️⃣ 보상", "① 수리비 전액 ② 새 제품"], ["5️⃣ 마무리", "저녁 대접 + 선택권 넘기기"]], "scoring": [["경위는 시간순", "잠들었다 → 일어섰다 → 떨어졌다 → 밟혔다처럼 순서대로 풀면 짧은 사고도 한 편의 장면이 돼요 📖"], ["상태는 두 갈래", "the good news is로 되는 것부터, But으로 안 되는 것을 말하면 상태 설명이 정리돼요 ✅ 문제 해결 유형에서 자주 요구되는 항목이에요"], ["보상 선택지", "수리 / 교체 두 갈래에 저녁 대접을 얹으면 2~3가지 요구를 여유 있게 채울 수 있어요 💪"], ["결정권 넘기기", "You decide로 상대에게 선택권을 넘기면 답변이 자연스럽게 끝나고 태도 점수도 올라가요 😊"]], "expr": [["come clean", "솔직히 털어놓다", "사과형 오프닝 상위 버전 💬"], ["fall onto the floor", "바닥에 떨어지다", "사고 경위 기본 동사 📏"], ["step on ~", "~을 밟다", "파손 원인 묘사에 딱 💪"], ["As for the condition", "상태를 말하자면", "화제 전환 시그널 🔑"], ["The good news is ~", "다행인 건 ~이야", "나쁜 소식 앞 완충 장치 ✨"], ["a crack across ~", "~을 가로지르는 금", "파손 상태를 구체화 📏"], ["be stuck", "눌린 채 안 돌아오다", "돌발 은행 편 재활용 🔁"], ["make up for ~", "~을 보상하다", "문제 해결 유형 핵심 동사 🔑"], ["If you'd rather ~", "차라리 ~하고 싶다면", "선택지 제시 고급 구문 💯"], ["Either way", "어느 쪽이든", "두 대안을 묶는 마무리 ✅"], ["Dinner is on me", "저녁은 내가 살게", "서베이 술집 편 on the house 짝 🔁"]], "audio": "audio/3_롤플레이/3-005 2. MP3 대여(Borrowing)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-005 2. MP3 대여(Borrowing)_문제 해결.mp3"}, {"id": "3-006", "cat": "roleplay", "catName": "롤플레이 질문", "num": 2, "topic": "MP3 대여", "topicEn": "Borrowing", "type": "과거 경험", "badge": "06 과거 경험", "enQ": "That's the end of the situation. Have you ever run into trouble with an electronic device? What exactly was the problem, and how did you fix it? Tell me everything in detail.", "enA": "Oh, I remember this one clearly. It was the night before my Gangneung trip, and I was packing. I plugged my phone in, but the cable wouldn't go in. No matter how hard I pushed, the charging icon never showed up. My battery was at eight percent.\n\nI was a little panicked, honestly. A four-hour night bus with a dead phone? No way. I tried three different cables, I even borrowed my brother's charger, but nothing worked. Guess what the real problem was? Lint — my pocket lint had packed itself into the charging port.\n\nSo at midnight, I watched a YouTube video and dug it out with a toothpick. The moment I plugged it in, the charging icon popped right up. I almost cheered. Since then, I've made it a rule to check my port every month. Best five minutes I've ever spent!", "koQ": "전자기기를 쓰다가 문제를 겪은 적이 있나요? 정확히 무엇이 문제였고 어떻게 해결했는지 자세히 말해 주세요.", "koA": "아, 이건 아직도 생생하게 기억나요. 강릉 여행 전날 밤, 짐을 싸는 중이었어요. 휴대폰을 충전기에 꽂았는데 케이블이 제대로 안 들어가는 거예요. 아무리 밀어 넣어도 충전 표시가 끝내 뜨지 않았어요. 배터리는 8%였고요.\n\n솔직히 좀 당황했어요. 네 시간짜리 야간 버스를 폰도 없이 탄다고요? 그건 안 되죠. 케이블을 세 개나 바꿔 보고 동생 충전기까지 빌렸는데 아무것도 안 통했어요. 진짜 원인이 뭐였는지 아세요? 주머니 먼지가 충전 단자 안에 꽉 차 있었던 거예요.\n\n그래서 자정에 유튜브 영상을 보며 이쑤시개로 조심스럽게 파냈어요. 다시 꽂는 순간 충전 표시가 바로 떴죠. 그 후로는 한 달에 한 번 충전 단자를 확인하는 걸 규칙으로 삼았어요. 제 인생에서 가장 값진 5분이었어요!", "struct": [["1️⃣ 도입", "생생한 회상 (remember clearly)"], ["2️⃣ 상황", "강릉 여행 전날 밤 짐 싸기"], ["3️⃣ 문제", "케이블 안 들어감 · 배터리 8%"], ["4️⃣ 해결", "유튜브 + 이쑤시개로 먼지 제거"], ["5️⃣ 마무리", "월 1회 점검 규칙 + 한 줄 정리"]], "scoring": [["긴장감 조성", "배터리 8%, 네 시간 버스처럼 숫자로 조건을 걸면 사건이 급해 보여요 📊 숫자 하나가 긴장감을 만듭니다"], ["시도–실패 나열", "케이블 세 개, 동생 충전기까지 나열한 뒤 nothing worked로 닫으면 문제의 크기가 저절로 전달돼요 💪"], ["원인 공개", "Guess what으로 한 박자 쉬고 원인을 공개하면 듣는 사람이 이야기에 끌려 들어와요 🎭 돌발 편에서 검증된 장치예요 🔁"], ["규칙 마무리", "'I've made it a rule to ~'는 Since then 마무리의 상위 버전이에요 📊 현재완료 + to부정사로 문법 점수까지 챙기세요"]], "expr": [["I remember this clearly", "아직도 생생해요", "This reminds me of의 변형 🔁"], ["the night before ~", "~하기 전날 밤", "돌발 패션 편 재활용 🔁 ⏰"], ["wouldn't go in", "안 들어가더라고요", "won't/wouldn't = 거부의 뉘앙스 🔑"], ["No matter how ~", "아무리 ~해도", "양보절로 문법 점수 UP 📊"], ["never show up", "끝내 뜨지 않다", "화면·표시 묘사에 유용 ✨"], ["No way.", "그건 안 되죠.", "짧은 리액션으로 리듬 주기 🎭"], ["a little panicked", "살짝 당황한", "돌발 은행 편 재활용 🔁 😆"], ["nothing worked", "아무것도 안 통했다", "시도–실패 나열의 마침표 💪"], ["dig ~ out", "~을 파내다", "해결 장면의 구체적 동사 📏"], ["pop right up", "바로 뜨다", "성공 순간의 경쾌한 동사 🔥"], ["I've made it a rule to ~", "~하기를 규칙으로 삼다", "현재완료 마무리 고급형 📊"]], "audio": "audio/3_롤플레이/3-006 2. MP3 대여(Borrowing)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-006 2. MP3 대여(Borrowing)_과거 경험.mp3"}, {"id": "3-007", "cat": "roleplay", "catName": "롤플레이 질문", "num": 3, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "정보 요청", "badge": "07 정보 요청", "enQ": "I'd like to give you a situation
