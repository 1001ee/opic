n근데 이 명절들이 진짜 뭐냐고 물으신다면, 간단해요. 온 나라가 동시에 일시정지 버튼을 누르고 가족과 과식하는 날이에요. 이게 한 문장으로 정리한 한국의 명절이에요!", "struct": [["1️⃣ 선언", "설날 · 추석 2대 명절"], ["2️⃣ 이동", "민족 대이동 = 국가 전통"], ["3️⃣ 설날", "떡국 한 살 + 세배"], ["4️⃣ 추석", "송편 + 보름달 감사"], ["5️⃣ 마무리", "온 나라의 일시정지"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["Seollal", "설날"], ["Chuseok", "추석"], ["the great migration", "민족 대이동"], ["turn into parking lots", "주차장이 되다"], ["rice cake soup", "떡국"], ["one year older", "한 살 더 먹는"], ["New Year's bow", "세배"], ["half-moon rice cake", "송편"], ["press pause", "일시정지를 누르다"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-091 19. 휴일(Holidays)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-091 19. 휴일(Holidays)_묘사.mp3"}, {"id": "2-092", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "습관", "badge": "92 습관", "enQ": "What do you and your family usually do during the biggest holiday in your country? What activities do people typically enjoy? Tell me in detail.", "enA": "For my family, the biggest one is Seollal — so let me walk you through our version. Everyone gathers at my mom's place the night before, and the kitchen turns into a factory: mom commanding the soup pot, me and my brother on dumpling duty, folding side by side like we've done since we were kids.\n\nNew Year's morning has a fixed program: rice cake soup first — one bowl, one year older — then the bows to elders, and yes, the kids still line up for their lucky money envelopes! After that comes my favorite part: the whole family around the board game. Our yut matches get so loud the neighbors probably know who's winning.\n\nAs for the rest of the country, it's similar everywhere: food, family, card games, and holiday movies on TV. Loud kitchen, louder games, full stomachs — that's pretty much our Seollal, and it never gets old.", "koQ": "당신의 나라에서 가장 큰 명절에 당신과 가족은 주로 무엇을 하나요? 사람들은 일반적으로 어떤 활동을 즐기나요? 자세히 말해주세요.", "koA": "우리 가족에게 가장 큰 명절은 설날이에요. 우리 버전을 차근차근 보여드릴게요. 전날 밤 모두 엄마 집에 모이고, 주방은 공장으로 변해요. 엄마는 국 냄비를 지휘하시고, 저와 남동생은 만두 담당이에요. 어릴 때부터 해온 것처럼 나란히 앉아 빚죠.\n\n설날 아침엔 고정 프로그램이 있어요. 먼저 떡국. 한 그릇에 한 살이죠. 그다음은 어른들께 세배, 그리고 네, 애들은 여전히 세뱃돈 봉투를 받으려고 줄을 서요! 그다음이 제 최애 순서예요. 온 가족이 윷판에 둘러앉는 거요. 우리 윷놀이는 어찌나 시끄러운지 이웃들도 누가 이기고 있는지 알걸요.\n\n나라 전체로 보면 어디나 비슷해요. 음식, 가족, 카드 게임, 그리고 TV 명절 특선 영화죠. 시끄러운 주방, 더 시끄러운 게임, 그리고 가득 찬 배. 이게 우리 설날이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 전야", "엄마 집 집합, 주방 공장"], ["2️⃣ 담당", "남동생과 만두 듀오"], ["3️⃣ 아침", "떡국 → 세배 → 세뱃돈"], ["4️⃣ 절정", "이웃도 아는 윷놀이 소음"], ["5️⃣ 마무리", "음식 · 가족 · 특선 영화"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["gather at ~", "~에 모이다"], ["turn into a factory", "공장으로 변하다"], ["dumpling duty", "만두 담당"], ["fixed program", "고정 프로그램"], ["line up", "줄을 서다"], ["lucky money", "세뱃돈"], ["yut", "윷놀이"], ["know who's winning", "누가 이기는지 알다"], ["full stomachs", "가득 찬 배"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-092 19. 휴일(Holidays)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-092 19. 휴일(Holidays)_습관.mp3"}, {"id": "2-093", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "취향", "badge": "93 취향", "enQ": "Which holiday do you like the most, and why? What do you enjoy doing on that day? Tell me the reasons in detail.", "enA": "If I had to choose, Seollal wins — no contest. Chuseok has better weather, sure, but for me, it's all about that fresh-start feeling: new year, new luck, and one warm bowl of rice cake soup that resets everything.\n\nWhat do I enjoy most? The kitchen hours, honestly. Folding dumplings next to my brother while mom conducts the pots — we tease each other about whose dumplings look worse, exactly like twenty years ago. I'd take that noisy kitchen over any fancy vacation any day. Don't get me wrong — I love that Chuseok moon too. But autumn thanks the past, while Seollal opens the future, and I'm a fresh-start person.\n\nNothing beats that first spoonful of mom's soup while everyone argues over the yut board. In a nutshell: Chuseok fills the table, but Seollal resets the heart.", "koQ": "어떤 명절(휴일)을 가장 좋아하고, 그 이유는 무엇인가요? 그날 무엇을 하는 것을 즐기나요? 그 이유를 자세히 말해주세요.", "koA": "골라야 한다면 설날 승리예요. 고민할 것도 없죠. 추석이 날씨는 더 좋아요. 근데 저한테 핵심은 그 새 출발의 기분이에요. 새해, 새 운, 그리고 모든 걸 리셋해주는 따뜻한 떡국 한 그릇이요.\n\n뭘 제일 즐기냐고요? 솔직히 주방의 시간들이에요. 엄마가 냄비들을 지휘하시는 동안 동생 옆에서 만두를 빚는 거요. 누구 만두가 더 못생겼는지 서로 놀리는데, 20년 전과 똑같아요. 어떤 근사한 휴가보다도 그 시끄러운 주방을 고르겠어요. 오해는 마세요. 추석 보름달도 사랑해요. 근데 가을은 지난 것에 감사하고, 설날은 미래를 열잖아요. 저는 새 출발형 인간이거든요.\n\n온 가족이 윷판을 두고 옥신각신하는 동안 뜨는 엄마 떡국의 첫 숟갈만 한 게 없어요. 한마디로, 추석은 식탁을 채우지만, 설날은 마음을 리셋해요.", "struct": [["1️⃣ 선택", "설날 승리, no contest"], ["2️⃣ 핵심", "새해 · 새 운 · 새 출발"], ["3️⃣ 활동", "못생긴 만두 콘테스트"], ["4️⃣ 양보", "추석 달도 좋지만 과거형"], ["5️⃣ 명언", "추석은 식탁, 설날은 마음"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["fresh-start feeling", "새 출발의 기분"], ["it's all about ~", "핵심은 ~이다"], ["conduct the pots", "냄비들을 지휘하다"], ["whose dumplings look worse", "누구 만두가 더 못생겼나"], ["A over B any day", "B보다 무조건 A"], ["Don't get me wrong", "오해는 마세요"], ["fresh-start person", "새 출발형 인간"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-093 19. 휴일(Holidays)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-093 19. 휴일(Holidays)_취향.mp3"}, {"id": "2-094", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "과거 경험", "badge": "94 과거 경험", "enQ": "Tell me about a holiday memory from your childhood that you cannot forget. Where were you, who were you with, and what did you do?", "enA": "This reminds me of a Seollal at my grandmother's countryside house when I was about eight. The whole clan was there — aunts, uncles, and a small army of cousins packed into one warm house that smelled like rice cake soup all day.\n\nThat morning, after the bows and the lucky money, it started snowing — hard. And guess what: every cousin ran outside at once. We had the loudest snowball war in family history, while grandma yelled that the soup was getting cold. Out of nowhere, even my uncles joined, ties and all! We came back soaked, frozen, and ridiculously happy — and grandma's hot soup never tasted better.\n\nI still can't forget the sound of that day: snow, screaming cousins, and grandma's laugh from the kitchen door. Lucky money gets spent, but that soundtrack stayed — my definition of a perfect holiday.", "koQ": "잊을 수 없는 어린 시절의 명절 기억에 대해 말해주세요. 어디에 있었고, 누구와 함께였으며, 무엇을 했나요?", "koA": "여덟 살쯤의 설날, 시골 할머니 댁이 떠오르네요. 온 친척이 다 모였어요. 이모, 삼촌들, 그리고 사촌들 소부대까지. 하루 종일 떡국 냄새가 나는 따뜻한 집 한 채에 꽉꽉 들어찼죠.\n\n그날 아침, 세배와 세뱃돈이 끝나고 눈이 내리기 시작했어요. 그것도 펑펑요. 그리고 있잖아요, 사촌 전원이 동시에 밖으로 뛰쳐나갔어요. 우리는 가족 역사상 가장 시끄러운 눈싸움 전쟁을 벌였죠. 할머니가 떡국 식는다고 소리치시는 동안에요. 난데없이 삼촌들까지 넥타이 차림 그대로 참전했어요! 우리는 쫄딱 젖고, 꽁꽁 얼고, 터무니없이 행복한 채로 돌아왔어요. 그리고 할머니의 뜨거운 떡국은 그 어느 때보다 맛있었죠.\n\n지금도 그날의 소리를 잊을 수가 없어요. 눈, 소리 지르는 사촌들, 부엌문에서 들리던 할머니의 웃음소리. 세뱃돈은 다 써버렸지만, 그 사운드트랙은 남았어요. 그게 저의 완벽한 명절의 정의죠.", "struct": [["1️⃣ 배경", "여덟 살, 시골 할머니 댁"], ["2️⃣ 인물", "사촌 소부대 + 삼촌들"], ["3️⃣ 절정", "마당 눈싸움 대전쟁"], ["4️⃣ 반전", "넥타이 삼촌들의 참전"], ["5️⃣ 마무리", "세뱃돈은 가도 소리는 남아"]], "expr": [["this reminds me of", "~이 떠오르다"], ["the whole clan", "온 친척"], ["a small army of cousins", "사촌 소부대"], ["packed into ~", "~에 꽉 들어찬"], ["snowball war", "눈싸움 전쟁"], ["out of nowhere", "난데없이"], ["ties and all", "넥타이 차림 그대로"], ["soaked, frozen, and happy", "젖고 얼고 행복한"], ["guess what", "있잖아요, 세상에"], ["That soundtrack stayed.", "그 소리는 남았다"], ["definition of ~", "~의 정의"]], "audio": "audio/2_돌발/2-094 19. 휴일(Holidays)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-094 19. 휴일(Holidays)_과거 경험.mp3"}, {"id": "2-095", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "비교", "badge": "95 비교", "enQ": "Compare the way people spend holidays now with the way they did in the past. How have holiday traditions changed over the years? Tell me about the differences.", "enA": "Back then, holidays used to mean one thing: the big house. The whole clan converged on grandma's place, the women cooked for two days straight, kids slept five to a room, and the New Year's bow was a full ceremony — hanbok, order of age, the works.\n\nThese days, it's a completely different story. Families celebrate in smaller circles, and many simply travel instead — airports are as crowded as highways now! The food comes ready-made from stores, video calls stand in for visits, and lucky money often arrives by bank app. Compared to the past, holidays are way more relaxed — less labor, fewer arguments, more actual rest.\n\nI have to admit, the change is fair — someone always paid for that big house magic with two days at the stove. Still, I miss the crowded floor and the noise. Holidays got easier, but maybe a little quieter than they should be, if you ask me.", "koQ": "지금 사람들이 명절을 보내는 방식과 과거의 방식을 비교해주세요. 시간이 지나며 명절 풍습은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때는 명절이 곧 하나를 의미했어요. 큰집이요. 온 친척이 할머니 댁으로 집결했고, 여자들은 이틀 내내 요리했고, 아이들은 한 방에 다섯 명씩 잤고, 세배는 완전한 의식이었어요. 한복, 나이 순서, 격식 전부요.\n\n요즘은 완전히 다른 이야기예요. 가족들은 더 작은 단위로 명절을 보내고, 아예 여행을 떠나는 사람도 많아요. 이제 공항이 고속도로만큼 붐빈다니까요! 음식은 매장에서 완제품으로 사 오고, 영상통화가 방문을 대신하고, 세뱃돈은 은행 앱으로 도착하는 경우도 많죠. 과거와 비교하면 명절이 훨씬 여유로워졌어요. 노동은 줄고, 다툼도 줄고, 진짜 휴식은 늘었죠.\n\n인정할 건 인정해야죠. 이 변화는 공정해요. 그 큰집의 마법은 누군가가 이틀의 가스레인지 앞으로 값을 치렀으니까요. 그래도 저는 그 꽉 찬 방바닥과 소음이 그리워요. 제 생각엔, 명절이 편해진 만큼 조금은 너무 조용해진 것 같아요.", "struct": [["1️⃣ 과거", "큰집 집결 · 이틀의 요리"], ["2️⃣ 의식", "한복 · 나이 순서 세배"], ["3️⃣ 현재", "소규모 · 여행 · 앱 세뱃돈"], ["4️⃣ 평가", "변화는 공정하다 인정"], ["5️⃣ 마무리", "편해진 만큼 조용해짐"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["converge on ~", "~으로 집결하다"], ["the works", "격식 전부"], ["completely different story", "완전히 다른 이야기"], ["ready-made", "완제품의"], ["stand in for ~", "~을 대신하다"], ["by bank app", "은행 앱으로"], ["compared to ~", "~과 비교하면"], ["way more ~", "훨씬 더 ~"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-095 19. 휴일(Holidays)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-095 19. 휴일(Holidays)_비교.mp3"}, {"id": "2-096", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "묘사", "badge": "96 묘사", "enQ": "Describe a healthy person you know. What is he or she like, and what does that person do to stay in shape? Why do you consider that person healthy?", "enA": "That's an easy one — the healthiest person I know is the elderly gentleman next door, my recycling mentor. He must be over seventy, but he walks with a straighter back than most of my coworkers!\n\nWhat does he do to stay in shape? The answer is boring and brilliant: the same things, every single day. A morning walk up the neighborhood mountain — rain or shine — simple home-cooked meals with his wife, and early lights-out. No gym, no supplements, no drama. Just clockwork.\n\nWhy do I consider him healthy? Not just the walking — it's his energy. He out-walks me on Tuesdays with his recycling cart, laughs loudly, and remembers everyone's name in the building. If you ask me, that's the real definition of healthy: a strong body carrying a sunny mind. My retirement role model, honestly!", "koQ": "당신이 아는 건강한 사람을 묘사해주세요. 그 사람은 어떤 사람이고, 건강을 유지하기 위해 무엇을 하나요? 왜 그 사람이 건강하다고 생각하나요?", "koA": "쉬운 질문이네요. 제가 아는 가장 건강한 사람은 옆집 할아버지, 저의 분리수거 사부님이에요. 일흔은 넘으셨을 텐데, 제 회사 동료들 대부분보다 허리가 꼿꼿하시다니까요!\n\n건강 유지를 위해 뭘 하시냐고요? 답은 지루하고도 훌륭해요. 같은 일을, 매일, 하루도 빠짐없이요. 비가 오나 눈이 오나 아침마다 동네 뒷산 산책, 사모님과 함께하는 소박한 집밥, 그리고 이른 소등. 헬스장도, 영양제도, 유난도 없어요. 그냥 시계처럼요.\n\n왜 건강하다고 생각하냐고요? 걷기 때문만은 아니에요. 그분의 에너지 때문이죠. 화요일마다 분리수거 카트를 끌고 저보다 빨리 걸으시고, 크게 웃으시고, 건물 사람들 이름을 다 기억하세요. 제 생각에 그게 건강의 진짜 정의예요. 밝은 마음을 싣고 다니는 튼튼한 몸이요. 솔직히 저의 노후 롤모델이에요!", "struct": [["1️⃣ 선언", "옆집 할아버지 = 최고 건강인"], ["2️⃣ 증거", "일흔 넘어 꼿꼿한 허리"], ["3️⃣ 비결", "뒷산 · 집밥 · 이른 소등"], ["4️⃣ 핵심", "몸 + 밝은 마음의 에너지"], ["5️⃣ 마무리", "나의 노후 롤모델 선언"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["mentor", "사부님"], ["straighter back", "더 꼿꼿한 허리"], ["stay in shape", "건강을 유지하다"], ["rain or shine", "비가 오나 눈이 오나"], ["boring and brilliant", "지루하고도 훌륭한"], ["clockwork", "시계 장치 같은 규칙"], ["out-walk", "~보다 잘 걷다"], ["definition of ~", "~의 정의"], ["role model", "롤모델"], ["sunny mind", "밝은 마음"]], "audio": "audio/2_돌발/2-096 20. 건강(Health)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-096 20. 건강(Health)_묘사.mp3"}, {"id": "2-097", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "습관", "badge": "97 습관", "enQ": "What do you do to take care of your health? Do you exercise regularly or watch what you eat? Describe your health routine in detail.", "enA": "Both, actually — let me walk you through my three-legged system: move, eat, sleep. Leg one is my evening jog by the river, three or four times a week. It started as a health project years ago; now it's just the best part of my day.\n\nLeg two: I watch what I eat the lazy-smart way — by cooking at home. When you make dinner yourself, the salt, the oil, the portions... everything calms down naturally. No strict diet, just fewer delivery apps! And leg three is my favorite: non-negotiable sleep. Screens off at eleven, no exceptions — my golden rule since forever.\n\nNothing fancy, right? But here's what I've learned: health isn't a project you finish, it's housekeeping for the body — small, boring, daily. Three legs, zero drama — that's pretty much my routine, and it never gets old.", "koQ": "건강을 관리하기 위해 무엇을 하나요? 규칙적으로 운동을 하거나 식단에 신경을 쓰나요? 당신의 건강 관리 루틴을 자세히 설명해주세요.", "koA": "사실 둘 다예요. 저의 세 다리 시스템을 차근차근 보여드릴게요. 움직이기, 먹기, 자기. 첫째 다리는 주 3~4회 강변 저녁 조깅이에요. 몇 년 전엔 건강 프로젝트로 시작했는데, 이젠 그냥 하루 중 가장 좋은 시간이 됐죠.\n\n둘째 다리, 식단은 게으르지만 똑똑한 방법으로 신경 써요. 집에서 요리하는 거예요. 저녁을 직접 만들면 소금, 기름, 양까지 모든 게 자연스럽게 차분해지거든요. 엄격한 다이어트는 없어요. 그냥 배달 앱을 줄일 뿐이죠! 그리고 셋째 다리는 제 최애, 타협 불가의 수면이에요. 11시엔 화면 끄기, 예외 없음. 아주 오래된 저의 황금률이죠.\n\n별거 없죠? 근데 제가 배운 게 있어요. 건강은 끝내는 프로젝트가 아니라 몸을 위한 살림이에요. 작고, 지루하고, 매일인 거요. 세 다리, 드라마 제로. 이게 제 루틴이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 구조", "세 다리 — 움직·먹·자기"], ["2️⃣ 운동", "주 3~4회 강변 조깅"], ["3️⃣ 식단", "집밥 = 게으른 똑똑함"], ["4️⃣ 수면", "11시 스크린 오프 룰"], ["5️⃣ 마무리", "건강 = 몸을 위한 살림"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["three-legged system", "세 다리 시스템"], ["watch what I eat", "식단에 신경 쓰다"], ["lazy-smart", "게으르지만 똑똑한"], ["calm down", "차분해지다"], ["fewer delivery apps", "배달 앱 줄이기"], ["non-negotiable", "타협 불가의"], ["no exceptions", "예외 없이"], ["housekeeping for the body", "몸을 위한 살림"], ["zero drama", "드라마 제로"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-097 20. 건강(Health)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-097 20. 건강(Health)_습관.mp3"}, {"id": "2-098", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "취향", "badge": "98 취향", "enQ": "What is your favorite way to stay healthy, and why do you prefer it? Do you enjoy working out at the gym, or do you prefer outdoor activities? Tell me the reasons.", "enA": "If I had to choose, outdoor wins — no contest. My favorite way to stay healthy is, surprise surprise, my river jog. For me, it's all about getting two things for one effort: a workout for my body and fresh air for my brain.\n\nI'd pick the riverside over the gym any day. Here's my honest reason: on a treadmill, I feel like a hamster with a membership card — running hard, going nowhere, staring at a wall of screens. By the river, the scenery moves with me: water, sky, dogs chasing pigeons. Don't get me wrong — gyms are great for rainy weeks, and I respect the iron! But machines count my steps; the river counts my worries away.\n\nNothing beats finishing a run just as the sunset hits the water. In a nutshell: the gym builds your body, but the riverside rebuilds your day.", "koQ": "건강을 유지하는 방법 중 가장 좋아하는 것은 무엇이고, 왜 그것을 선호하나요? 헬스장에서 운동하는 것을 즐기나요, 아니면 야외 활동을 선호하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 야외 승리예요. 고민할 것도 없죠. 제가 가장 좋아하는 건강 유지법은, 놀랍지도 않겠지만, 강변 조깅이에요. 저한테 핵심은 한 번의 노력으로 두 가지를 얻는 거예요. 몸을 위한 운동, 그리고 뇌를 위한 바깥 공기요.\n\n헬스장보다는 무조건 강변이에요. 솔직한 이유는 이래요. 러닝머신 위에선 제가 회원권 가진 햄스터 같거든요. 열심히 달리는데 아무 데도 못 가고, 스크린 벽만 바라보면서요. 강변에선 풍경이 저와 함께 움직여요. 물, 하늘, 비둘기를 쫓는 강아지들까지요. 오해는 마세요. 비 오는 주간엔 헬스장이 최고고, 쇠질도 존중해요! 근데 기계는 제 걸음 수를 세지만, 강은 제 걱정을 씻어내며 세어줘요.\n\n노을이 물에 닿는 순간 달리기를 끝내는 것만 한 게 없어요. 한마디로, 헬스장은 몸을 만들지만, 강변은 하루를 다시 만들어요.", "struct": [["1️⃣ 선택", "야외 승리, no contest"], ["2️⃣ 핵심", "운동 + 바깥 공기 일석이조"], ["3️⃣ 대비", "러닝머신 = 회원권 햄스터"], ["4️⃣ 양보", "비 오는 주엔 헬스장 존중"], ["5️⃣ 명언", "몸은 헬스장, 하루는 강변"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["surprise surprise", "놀랍지도 않겠지만"], ["fresh air for my brain", "뇌를 위한 공기"], ["A over B any day", "B보다 무조건 A"], ["treadmill", "러닝머신"], ["a hamster with a membership card", "회원권 햄스터"], ["Don't get me wrong", "오해는 마세요"], ["respect the iron", "쇠질을 존중하다"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-098 20. 건강(Health)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-098 20. 건강(Health)_취향.mp3"}, {"id": "2-099", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "과거 경험", "badge": "99 과거 경험", "enQ": "Tell me about something you did to improve your health. Did you start a new exercise or change your diet? What was the result? Give me as many details as you can.", "enA": "This reminds me of my great diet reform a few years ago. Back then, my kitchen had one appliance: the delivery app! Fried chicken, burgers, midnight snacks — my body felt heavy, my wallet felt light, and one day the delivery guy greeted me like an old friend. That was my wake-up call.\n\nSo I declared a one-week challenge: no delivery, cook everything myself. Day one was a disaster — burnt rice, sad eggs. But guess what: on day four, I followed a YouTube recipe and made kimchi fried rice with a secret spoon of butter... and it was life-changing. Better than delivery, honestly!\n\nThe results piled up quietly: lighter body, calmer stomach, fatter wallet — and a brand-new hobby. Since then, cooking has been my thing, and that one-week challenge never really ended. Best health decision I ever made, hands down.", "koQ": "건강을 개선하기 위해 했던 일에 대해 말해주세요. 새로운 운동을 시작했거나 식단을 바꿨나요? 결과는 어땠나요? 가능한 많은 세부사항을 말해주세요.", "koA": "몇 년 전의 대식단 개혁이 떠오르네요. 그때 제 주방엔 가전이 딱 하나 있었어요. 배달 앱이요! 치킨, 버거, 야식. 몸은 무겁고 지갑은 가벼웠는데, 어느 날 배달 기사님이 절 오랜 친구처럼 반겨주시더라고요. 그게 저의 경고음이었죠.\n\n그래서 일주일 챌린지를 선언했어요. 배달 금지, 전부 직접 요리하기. 첫날은 재앙이었어요. 탄 밥에 슬픈 계란이요. 근데 있잖아요, 4일째에 유튜브 레시피를 따라 버터 한 스푼의 비밀이 담긴 김치볶음밥을 만들었는데... 인생이 바뀌었어요. 솔직히 배달보다 맛있었다니까요!\n\n결과는 조용히 쌓여갔어요. 가벼워진 몸, 편안해진 속, 두둑해진 지갑, 그리고 완전히 새로운 취미까지요. 그 뒤로 요리는 저의 것이 됐고, 그 일주일 챌린지는 사실 아직도 안 끝났어요. 두말할 것 없이, 제 인생 최고의 건강 결정이었죠.", "struct": [["1️⃣ 과거", "주방의 유일한 가전 = 배달 앱"], ["2️⃣ 계기", "기사님의 오랜 친구 인사"], ["3️⃣ 도전", "배달 금지 일주일 챌린지"], ["4️⃣ 반전", "4일째 김치볶음밥 탄생"], ["5️⃣ 결과", "몸 · 속 · 지갑 + 새 취미"]], "expr": [["this reminds me of", "~이 떠오르다"], ["diet reform", "식단 개혁"], ["like an old friend", "오랜 친구처럼"], ["wake-up call", "경고음, 각성 계기"], ["one-week challenge", "일주일 챌린지"], ["burnt rice, sad eggs", "탄 밥, 슬픈 계란"], ["life-changing", "인생을 바꾸는"], ["pile up", "쌓이다"], ["guess what", "있잖아요, 세상에"], ["since then", "그 이후로"], ["hands down", "두말할 것 없이"]], "audio": "audio/2_돌발/2-099 20. 건강(Health)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-099 20. 건강(Health)_과거 경험.mp3"}, {"id": "2-100", "cat": "unexpected", "catName": "돌발 질문", "num": 20, "topic": "건강", "topicEn": "Health", "type": "비교", "badge": "100 비교", "enQ": "Compare the way people manage their health today with the past. How have people's ideas about health and exercise changed over time? Tell me in detail.", "enA": "Back then, health used to be something you thought about only when you lost it. People saw a doctor when they were sick, and that was the whole plan! Exercise was for athletes — regular folks just... worked, ate, and hoped for the best.\n\nThese days, it's a completely different story: health became a lifestyle, almost a hobby. Running crews fill the riverside every evening, smartwatches nag us about steps, zero-sugar drinks own half the convenience store, and gym selfies are a whole genre. Compared to the past, the biggest shift is in thinking: from treatment to prevention — we stopped waiting for the alarm and started maintaining the machine.\n\nI have to admit, sometimes it's a bit much — even resting is a program now! But of all the trends we've followed, taking care of ourselves is a pretty good one, if you ask me.", "koQ": "오늘날 사람들이 건강을 관리하는 방식과 과거를 비교해주세요. 시간이 지나며 건강과 운동에 대한 사람들의 생각은 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 건강이 잃고 나서야 생각하는 것이었어요. 사람들은 아프면 병원에 갔고, 그게 계획의 전부였죠! 운동은 선수들의 것이었어요. 보통 사람들은 그냥... 일하고, 먹고, 잘되길 바랐죠.\n\n요즘은 완전히 다른 이야기예요. 건강이 라이프스타일, 거의 취미가 됐거든요. 매일 저녁 러닝 크루가 강변을 채우고, 스마트워치는 걸음 수로 잔소리하고, 제로 음료가 편의점 절반을 차지하고, 헬스장 셀카는 하나의 장르가 됐어요. 과거와 비교하면 가장 큰 변화는 생각이에요. 치료에서 예방으로요. 우리는 경보를 기다리는 걸 멈추고, 기계를 정비하기 시작한 거죠.\n\n인정할 건 인정해야죠. 가끔은 좀 과해요. 이젠 쉬는 것까지 프로그램이 됐으니까요! 그래도 우리가 따라온 유행 중에, 스스로를 돌보는 유행은 꽤 괜찮은 유행이에요. 제 생각엔요.", "struct": [["1️⃣ 과거", "아프면 병원, 그게 전부"], ["2️⃣ 현재", "러닝 크루 · 워치 · 제로 음료"], ["3️⃣ 핵심", "치료 → 예방으로 전환"], ["4️⃣ 비유", "경보 대기 → 기계 정비"], ["5️⃣ 마무리", "꽤 괜찮은 유행이다"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["hope for the best", "잘되길 바라다"], ["completely different story", "완전히 다른 이야기"], ["running crew", "러닝 크루"], ["nag", "잔소리하다"], ["a whole genre", "하나의 장르"], ["from treatment to prevention", "치료에서 예방으로"], ["maintain the machine", "기계를 정비하다"], ["compared to ~", "~과 비교하면"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-100 20. 건강(Health)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-100 20. 건강(Health)_비교.mp3"}, {"id": "2-101", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "묘사", "badge": "101 묘사", "enQ": "Describe the public transportation in your country. What kinds of transportation do people use to get around, and what are they like? Tell me in detail.", "enA": "Oh, this is Korea's bragging corner — our public transportation is honestly world-class. The two pillars are the subway and the buses, and one little card rules them all.\n\nThe subway first: it's the veins of the city — fast, clean, air-conditioned, with full phone signal even underground. Trains arrive on the dot, and screen doors keep every platform safe. Then the buses: color-coded by route type, running in their own dedicated lanes, so they often beat cars through rush hour! And the magic part is the transfer system — subway to bus, one tap, one fare. The card does all the math.\n\nWhat are they like day to day? Quiet, punctual, and everywhere — you can cross the whole city for less than the price of a coffee. That's pretty much our transportation: the one thing every Korean takes for granted until they travel abroad!", "koQ": "당신의 나라의 대중교통을 묘사해주세요. 사람들은 이동할 때 어떤 교통수단을 이용하고, 그것들은 어떤가요? 자세히 말해주세요.", "koA": "오, 이건 한국의 자랑 코너예요. 우리 대중교통은 솔직히 세계 최고 수준이거든요. 두 기둥은 지하철과 버스인데, 작은 카드 한 장이 그 모든 걸 지배해요.\n\n먼저 지하철요. 도시의 혈관이에요. 빠르고, 깨끗하고, 에어컨 나오고, 지하에서도 폰이 빵빵 터져요. 열차는 정각에 도착하고, 스크린도어가 모든 승강장을 안전하게 지켜주죠. 그다음 버스요. 노선 종류별로 색이 다르고, 전용차로로 달려서 러시아워엔 승용차를 이기는 경우도 많아요! 그리고 마법 같은 부분은 환승 시스템이에요. 지하철에서 버스로, 한 번의 태그, 하나의 요금. 계산은 카드가 다 해줘요.\n\n평소엔 어떠냐고요? 조용하고, 정확하고, 어디에나 있어요. 커피 한 잔 값도 안 되는 돈으로 도시 전체를 가로지를 수 있죠. 이게 우리 대중교통이에요. 모든 한국인이 해외여행 가기 전까진 당연하게 여기는 바로 그것요!", "struct": [["1️⃣ 선언", "자랑 코너 — 세계 최고급"], ["2️⃣ 지하철", "도시의 혈관, 정각 도착"], ["3️⃣ 버스", "색깔 노선 + 전용차로"], ["4️⃣ 마법", "한 번의 태그 환승 시스템"], ["5️⃣ 마무리", "해외 가면 그리운 당연함"]], "expr": [["bragging corner", "자랑 코너"], ["two pillars", "두 기둥"], ["rule them all", "모든 걸 지배하다"], ["veins of the city", "도시의 혈관"], ["on the dot", "정각에"], ["screen doors", "스크린도어"], ["dedicated lane", "전용차로"], ["transfer system", "환승 시스템"], ["The card does all the math.", "계산은 카드가 다 한다"], ["take ~ for granted", "~을 당연하게 여기다"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-101 21. 교통(Transport)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-101 21. 교통(Transport)_묘사.mp3"}, {"id": "2-102", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "습관", "badge": "102 습관", "enQ": "How do you usually get around? Which transportation do you take to work or school, and how long does it take? Describe your typical commute in detail.", "enA": "My commute is a simple three-act play — let me walk you through it. Act one: a seven-minute walk to the station, which doubles as my morning warm-up. Act two: the subway, about twenty-five minutes, no transfers — honestly a blessed line!\n\nNow, those twenty-five minutes are sacred. Earbuds in, noise cancelling on, and the packed train becomes my private reading room: news scrolling, playlists, sometimes just staring out as the city slides by. Act three is the final five-minute walk to the office. Door to door, about forty minutes — and the evening version has a bonus scene: on nice days, I hop off one station early and walk the rest along the river.\n\nWeekends are simpler: anything far by subway, anything near on foot. So that's my formula — feet for the short, rails for the long — and honestly, it never gets old.", "koQ": "당신은 보통 어떻게 이동하나요? 직장이나 학교에 갈 때 어떤 교통수단을 타고, 얼마나 걸리나요? 당신의 일반적인 통근 과정을 자세히 설명해주세요.", "koA": "제 통근은 단순한 3막 연극이에요. 차근차근 보여드릴게요. 1막, 역까지 7분 도보. 아침 워밍업을 겸하죠. 2막, 지하철 약 25분, 환승 없음. 솔직히 축복받은 노선이에요!\n\n그 25분은 신성한 시간이에요. 이어폰 꽂고, 노이즈 캔슬링 켜면, 만원 열차가 저만의 독서실이 되거든요. 뉴스 스크롤, 플레이리스트, 가끔은 그냥 흘러가는 도시 구경까지요. 3막은 회사까지 마지막 5분 도보예요. 문에서 문까지 약 40분. 그리고 저녁 버전엔 보너스 장면이 있어요. 날씨 좋은 날엔 한 정거장 먼저 내려서 강변을 따라 걷거든요.\n\n주말은 더 단순해요. 먼 곳은 지하철, 가까운 곳은 도보죠. 그러니까 제 공식은, 짧은 거리는 두 발로, 긴 거리는 레일로예요. 솔직히 전혀 질리지 않아요.", "struct": [["1️⃣ 구조", "통근 = 3막 연극"], ["2️⃣ 1막", "역까지 7분 = 워밍업"], ["3️⃣ 2막", "25분 무환승 독서실"], ["4️⃣ 3막", "5분 도보, 총 40분"], ["5️⃣ 보너스", "한 정거장 먼저 내리기"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["three-act play", "3막 연극"], ["double as ~", "~을 겸하다"], ["a blessed line", "축복받은 노선"], ["packed", "만원인"], ["private reading room", "나만의 독서실"], ["door to door", "문에서 문까지"], ["hop off", "뛰어내리다"], ["bonus scene", "보너스 장면"], ["feet for the short, rails for the long", "짧은 건 발, 긴 건 레일"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-102 21. 교통(Transport)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-102 21. 교통(Transport)_습관.mp3"}, {"id": "2-103", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "취향", "badge": "103 취향", "enQ": "Which do you prefer - taking public transportation or driving your own car? Why do you prefer that way of getting around? Tell me the reasons.", "enA": "If I had to choose, public transportation wins — no contest. Small confession: I do have a driver's license... it just lives peacefully in my drawer! For me, it's all about what I get to do while moving.\n\nA driver's hands are stuck at ten and two; mine are free — music, reading, texting my mom back. I'd take the subway over the wheel any day. Driving means watching the road; riding means the time is all mine. And parking in this city? That's a horror genre! Don't get me wrong — cars are unbeatable for beach trips with big bags. That's why my best friend drives and I run the playlist — perfect teamwork!\n\nNothing beats dozing off for exactly one station and waking up refreshed. In a nutshell: a car moves your body, but the subway gives you your time back.", "koQ": "대중교통을 타는 것과 자가용을 운전하는 것 중 무엇을 선호하나요? 왜 그 이동 방식을 선호하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 대중교통 승리예요. 고민할 것도 없죠. 작은 고백 하나 할게요. 저 운전면허 있어요... 서랍 속에서 평화롭게 살고 있을 뿐이에요! 저한테 핵심은 이동하는 동안 뭘 할 수 있느냐예요.\n\n운전자의 손은 핸들 10시와 2시에 묶여 있지만, 제 손은 자유로워요. 음악, 독서, 엄마 문자 답장까지요. 핸들보다는 무조건 지하철이에요. 운전은 도로만 봐야 하지만, 타는 동안엔 그 시간이 온전히 제 것이 되니까요. 그리고 이 도시에서 주차요? 그건 공포 장르예요! 오해는 마세요. 짐 많은 바다 여행엔 차가 무적이죠. 그래서 절친이 운전하고 제가 플레이리스트를 담당하는 거예요. 완벽한 팀워크죠!\n\n딱 한 정거장만 졸고 개운하게 깨어나는 것만 한 게 없어요. 한마디로, 차는 몸을 옮기지만, 지하철은 시간을 돌려줘요.", "struct": [["1️⃣ 선택", "대중교통, no contest"], ["2️⃣ 고백", "서랍 속 평화로운 면허증"], ["3️⃣ 핵심", "이동 중 손과 시간의 자유"], ["4️⃣ 양보", "여행 땐 차 — 절친 운전"], ["5️⃣ 명언", "차는 몸을, 지하철은 시간을"]], "expr": [["if I had to choose", "골라야 한다면"], ["small confession", "작은 고백"], ["lives peacefully in my drawer", "서랍 속 평화로운 삶"], ["it's all about ~", "핵심은 ~이다"], ["stuck at ten and two", "10시 2시에 묶인"], ["A over B any day", "B보다 무조건 A"], ["a horror genre", "공포 장르"], ["Don't get me wrong", "오해는 마세요"], ["run the playlist", "플레이리스트를 담당하다"], ["doze off", "깜빡 졸다"], ["give you your time back", "시간을 돌려주다"]], "audio": "audio/2_돌발/2-103 21. 교통(Transport)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-103 21. 교통(Transport)_취향.mp3"}, {"id": "2-104", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "과거 경험", "badge": "104 과거 경험", "enQ": "Tell me about a problem you have had while using transportation. Was there a traffic jam, or did something uncomfortable happen? How did you deal with it?", "enA": "This reminds me of my most embarrassing subway ride. It was the morning of a big work presentation — suit on, notes memorized, coffee in hand. I marched confidently onto the train, opened my phone... and guess what: three stations later, the announcement woke me from my scrolling. I was going the wrong way!\n\nOut of nowhere, my forty-minute cushion shrank to almost nothing. But panic solves zero problems, so I made a quick plan: jump off, sprint across the platform, and text my teammate the honest truth — 'took the wrong train, there in twenty!' No excuses, just facts.\n\nI slid in five minutes early, sweaty but alive, and the presentation went off without a hitch. It worked out fine — and since then, I have a sacred rule: check the platform sign twice, phone stays in the pocket until the doors close!", "koQ": "교통수단을 이용하면서 겪은 문제에 대해 말해주세요. 교통체증이 있었거나 불편한 일이 있었나요? 어떻게 대처했나요?", "koA": "제 인생 가장 민망했던 지하철 탑승이 떠오르네요. 회사 중요 발표가 있던 날 아침이었어요. 정장 입고, 발표 내용 다 외우고, 커피까지 들고요. 자신만만하게 열차에 올라 폰을 열었는데... 있잖아요, 세 정거장 뒤에 안내 방송이 절 스크롤에서 깨웠어요. 반대 방향으로 가고 있던 거예요!\n\n난데없이 40분의 여유가 거의 0으로 쪼그라들었죠. 근데 패닉은 아무 문제도 못 풀잖아요. 그래서 빠르게 계획을 세웠어요. 뛰어내리고, 승강장 건너편으로 전력 질주하고, 팀 동료에게 정직한 진실을 문자로 보냈어요. 반대 열차 탔어, 20분 안에 도착! 변명 없이, 사실만요.\n\n저는 5분 일찍, 땀범벅이었지만 무사히 미끄러져 들어갔고, 발표는 아무 문제 없이 진행됐어요. 결국 다 잘 풀렸죠. 그리고 그 뒤로 신성한 룰이 생겼어요. 승강장 표지판 두 번 확인, 폰은 문이 닫힐 때까지 주머니에!", "struct": [["1️⃣ 배경", "발표 날 아침, 완벽 준비"], ["2️⃣ 반전", "세 정거장 뒤 반대 방향"], ["3️⃣ 대처", "전력 질주 + 정직한 문자"], ["4️⃣ 결말", "5분 일찍, 발표 무사"], ["5️⃣ 교훈", "표지판 2번, 폰은 주머니"]], "expr": [["this reminds me of", "~이 떠오르다"], ["embarrassing", "민망한"], ["march confidently", "자신만만하게 행진하다"], ["the wrong way", "반대 방향"], ["out of nowhere", "난데없이"], ["cushion", "여유 (시간)"], ["Panic solves zero problems.", "패닉은 0문제 해결"], ["go off without a hitch", "아무 문제 없이 진행되다"], ["guess what", "있잖아요, 세상에"], ["work out fine", "잘 풀리다"], ["stay in the pocket", "주머니에 머물다"]], "audio": "audio/2_돌발/2-104 21. 교통(Transport)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-104 21. 교통(Transport)_과거 경험.mp3"}, {"id": "2-105", "cat": "unexpected", "catName": "돌발 질문", "num": 21, "topic": "교통", "topicEn": "Transport", "type": "비교", "badge": "105 비교", "enQ": "Compare the transportation system of today with the one from your childhood. What has changed and improved over the years? Tell me about the differences.", "enA": "Back then, the bus stop was a place of pure mystery. You never knew when the bus would come — you just stood there, squinting down the road like a sailor watching the horizon! Buses were loud and bumpy, and the subway had no screen doors, so the wind hit your face with every arriving train.\n\nThese days, it's a completely different story. My app tells me the bus is four minutes away — and it actually is! Screen doors made platforms safe and quiet, buses glide along, electric and quiet, and my phone taps me through every gate. Compared to my childhood, the biggest improvement: the guesswork is gone. Transportation stopped being an adventure and became a service.\n\nI have to admit, my inner child misses that little victory dance when your bus finally appeared down the road. These days the app spoils the ending, if you ask me!", "koQ": "오늘날의 교통 시스템과 어린 시절의 교통 시스템을 비교해주세요. 시간이 지나며 무엇이 변화하고 개선되었나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 제가 어릴 때 버스 정류장은 순수한 미스터리의 공간이었어요. 버스가 언제 올지 절대 알 수 없었죠. 그냥 서서, 수평선을 바라보는 선원처럼 도로 끝을 실눈 뜨고 노려보는 거예요! 버스는 덜컹거렸고, 지하철엔 스크린도어가 없어서 열차가 들어올 때마다 바람이 얼굴을 때렸어요.\n\n요즘은 완전히 다른 이야기예요. 앱이 버스가 4분 뒤에 온다고 알려주는데, 진짜로 4분 뒤에 와요! 스크린도어가 승강장을 안전하고 조용하게 만들었고, 버스는 전기로, 조용하게 미끄러지듯 달리고, 폰 태그 한 번이면 모든 개찰구가 열려요. 어린 시절과 비교하면 가장 큰 개선은 추측이 사라진 거예요. 교통이 모험이기를 멈추고 서비스가 된 거죠.\n\n그래도 인정할 건 인정해야죠. 제 안의 어린이가 그리워하는 게 있어요. 저 멀리 드디어 내 버스가 나타났을 때의 그 작은 승리의 춤이요. 제 생각엔, 요즘은 앱이 결말을 스포해버려요!", "struct": [["1️⃣ 과거", "정류장 = 미스터리 공간"], ["2️⃣ 장면", "선원처럼 도로 끝 응시"], ["3️⃣ 현재", "앱 4분 예고 · 스크린도어"], ["4️⃣ 핵심", "추측의 실종, 모험 → 서비스"], ["5️⃣ 마무리", "앱이 스포하는 승리의 춤"]], "expr": [["back then", "그때는"], ["pure mystery", "순수한 미스터리"], ["squint down the road", "도로 끝을 실눈 뜨고 보다"], ["like a sailor", "선원처럼"], ["bumpy", "덜컹거리는"], ["completely different story", "완전히 다른 이야기"], ["glide", "미끄러지듯 달리다"], ["guesswork", "추측, 어림짐작"], ["from adventure to service", "모험에서 서비스로"], ["victory dance", "승리의 춤"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-105 21. 교통(Transport)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-105 21. 교통(Transport)_비교.mp3"}, {"id": "3-001", "cat": "roleplay", "catName": "롤플레이 질문", "num": 1, "topic": "MP3 구매", "topicEn": "Buying", "type": "정보 요청", "badge": "01 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are thinking of getting an MP3 player, and your friend recently purchased one. Before buying it, call your friend and ask three or four questions about his or her MP3 player to gather some information.", "enA": "Hey, it's me! Do you have a second? You know I jog by the river every evening, right? Well, I'm finally picking up an MP3 player, and you got one just last month. Perfect timing! Can I ask you a few questions?\n\nOkay, first things first — which model did you go for? ... Oh, that one? I've seen it online, actually. And how much did it set you back? ... Ouch, that much? That's a little over my budget. Is there any chance it goes on sale?\n\nAlright, one more thing — how's the battery? I jog for almost an hour. ... A whole week on one charge? That's exactly what I wanted to hear! Oh, and does it connect to wireless earphones? ... Perfect. Could you text me the model name? Thanks a ton — talk to you later!", "koQ": "당신은 MP3 플레이어 구매를 고민 중입니다. 최근에 하나 산 친구에게 전화해, 정보를 얻기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 잠깐 시간 돼? 나 매일 저녁에 강변에서 조깅하는 거 알지? 드디어 MP3 플레이어를 하나 장만하려고. 너 바로 지난달에 샀잖아. 타이밍 딱이네! 몇 가지만 물어봐도 될까?\n\n자, 우선 중요한 것부터. 어떤 모델로 샀어? ... 아, 그거? 나도 인터넷에서 본 적 있어. 그리고 얼마나 들었어? ... 헉, 그렇게나? 내 예산을 좀 넘는데. 혹시 세일할 가능성은 있어?\n\n좋아, 하나만 더. 배터리는 어때? 나는 거의 한 시간씩 뛰거든. ... 한 번 충전으로 일주일? 그거 딱 듣고 싶던 말이야! 아, 그리고 무선 이어폰이랑 연결은 잘 돼? ... 완벽해. 모델명 좀 문자로 보내 줄래? 정말 고마워, 나중에 또 통화하자!", "struct": [["1️⃣ 인사", "전화 오프닝 + 상황 · 질문 예고"], ["2️⃣ 질문", "① 모델 → 아는 척 리액션"], ["3️⃣ 질문", "② 가격 → 부정 리액션(비싸!)"], ["4️⃣ 질문", "③ 배터리 → 강한 긍정 리액션"], ["5️⃣ 마무리", "④ 이어폰 연결 + 모델명 · 인사"]], "expr": [["Hey, it's me!", "안녕, 나야!"], ["Can I ask you a few questions?", "몇 가지 물어봐도 돼?"], ["Perfect timing!", "타이밍 딱이네!"], ["first things first", "우선 중요한 것부터"], ["Oh, that one?", "아, 그거?"], ["How much did it set you back?", "얼마나 들었어?"], ["Ouch, that much?", "헉, 그렇게나?"], ["over my budget", "예산을 넘는"], ["Is there any chance ~?", "혹시 ~할 수 있어?"], ["one more thing", "하나만 더"], ["exactly what I wanted to hear", "딱 듣고 싶던 말"]], "audio": "audio/3_롤플레이/3-001 1. MP3 구매(Buying)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-001 1. MP3 구매(Buying)_정보 요청.mp3"}, {"id": "3-002", "cat": "roleplay", "catName": "롤플레이 질문", "num": 1, "topic": "MP3 구매", "topicEn": "Buying", "type": "문제 해결", "badge": "02 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You broke the MP3 player that you borrowed from your friend. Call your friend, describe what happened, and offer two or three ideas to get your friend a working MP3 player as soon as possible.", "enA": "Hey, it's me. I've got some bad news, and I'm really sorry. You know the MP3 player you lent me last week? I was jogging by the river last night, and it slipped out of my pocket and hit the ground. The screen looks fine, but it won't turn on at all.\n\nHere's what I'm thinking. First, I can take it to the service center tomorrow morning — I already called them, and a battery replacement only takes a day. Or, if it's not worth fixing, I'll just get you a brand-new one, the exact same model.\n\nAnd in the meantime, please take mine. My old player still works fine, so you won't be without music for a single day. Just let me know which option works best for you. Again, I'm so sorry — I'll make this right, I promise.", "koQ": "친구에게 빌린 MP3 플레이어를 고장 냈습니다. 전화해서 상황을 설명하고, 빨리 해결할 방법 2~3가지를 제안해 보세요.", "koA": "안녕, 나야. 안 좋은 소식이 있어서 전화했어. 정말 미안해. 지난주에 빌려준 MP3 플레이어 있잖아. 어젯밤에 강변에서 조깅하다가 주머니에서 미끄러져 나와 바닥에 떨어졌어. 화면은 멀쩡해 보이는데 전원이 아예 안 켜져.\n\n내 생각은 이래. 첫째, 내일 아침에 서비스 센터에 맡길게. 이미 전화해 봤는데 배터리 교체는 하루면 된대. 아니면 수리가 애매하다 싶으면 완전히 같은 모델로 새 걸 사 줄게.\n\n그리고 그동안은 내 걸 써. 예전에 쓰던 게 아직 멀쩡해서 하루도 음악 없이 지낼 일은 없을 거야. 어떤 방법이 제일 좋은지 알려만 줘. 다시 한번 미안해. 꼭 제대로 해결할게, 약속해.", "struct": [["1️⃣ 사과", "나쁜 소식 예고 + 진심 사과"], ["2️⃣ 상황", "조깅 중 낙하 · 전원 안 켜짐"], ["3️⃣ 제안", "① 서비스 센터 수리 (하루)"], ["4️⃣ 제안", "② 같은 모델 새 제품 구매"], ["5️⃣ 마무리", "③ 내 것 대여 + 선택 요청"]], "expr": [["I've got some bad news", "안 좋은 소식이 있어"], ["lend ↔ borrow", "빌려주다 ↔ 빌리다"], ["slip out of ~", "~에서 미끄러져 나오다"], ["it won't turn on", "전원이 안 켜져"], ["Here's what I'm thinking", "내 생각은 이래"], ["service center", "서비스 센터"], ["battery replacement", "배터리 교체"], ["brand-new", "완전히 새것인"], ["in the meantime", "그동안에는"], ["Just let me know", "알려만 줘"], ["I'll make this right", "꼭 제대로 해결할게"]], "audio": "audio/3_롤플레이/3-002 1. MP3 구매(Buying)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-002 1. MP3 구매(Buying)_문제 해결.mp3"}, {"id": "3-003", "cat": "roleplay", "catName": "롤플레이 질문", "num": 1, "topic": "MP3 구매", "topicEn": "Buying", "type": "과거 경험", "badge": "03 과거 경험", "enQ": "That's the end of the situation. Have you ever had a device that broke down or stopped working properly? What exactly was wrong, and how did you deal with it? Give me as many details as you can.", "enA": "Oh, this reminds me of something that happened last spring. I was jogging along the river with my wireless earphones, like I do every evening. About twenty minutes in, out of nowhere, the right side just went dead. Total silence on one ear.\n\nTo be honest, I was more annoyed than worried — my running playlist is half the reason I jog. I tried everything: putting it back in the case, resetting it, you name it. Nothing worked. Guess what the real problem was? The charging contact was covered in dust.\n\nSo I found a repair video on YouTube — my algorithm knows me too well — and cleaned it with a cotton swab. It came back to life in about two minutes. Since then, I've been wiping the case every weekend. Lesson learned: sometimes it's not broken, it's just dirty!", "koQ": "어떤 기기가 고장 나거나 제대로 작동하지 않았던 경험이 있나요? 무엇이 문제였고 어떻게 해결했는지 자세히 말해 주세요.", "koA": "아, 작년 봄에 있었던 일이 생각나네요. 여느 저녁처럼 무선 이어폰을 끼고 강변에서 조깅을 하고 있었어요. 한 20분쯤 지났을까, 난데없이 오른쪽이 그냥 먹통이 됐어요. 한쪽 귀만 완전히 무음이었죠.\n\n솔직히 걱정보다는 짜증이 났어요. 조깅을 하는 이유의 절반이 러닝 플레이리스트거든요. 케이스에 다시 넣어 보고, 초기화도 해 보고, 안 해 본 게 없었어요. 그런데 진짜 원인이 뭐였는지 아세요? 충전 단자가 먼지로 덮여 있었던 거예요.\n\n그래서 유튜브에서 수리 영상을 찾았는데, 제 알고리즘이 저를 너무 잘 알더라고요. 면봉으로 닦았더니 2분 만에 다시 살아났어요. 그 후로는 주말마다 케이스를 닦고 있어요. 교훈이라면, 고장이 아니라 그냥 더러운 걸 수도 있다는 거죠!", "struct": [["1️⃣ 도입", "회상 시그널 (This reminds me of)"], ["2️⃣ 상황", "저녁 강변 조깅 · 무선 이어폰"], ["3️⃣ 문제", "갑자기 한쪽 먹통 (went dead)"], ["4️⃣ 해결", "유튜브 영상 + 면봉 청소"], ["5️⃣ 마무리", "주말 청소 습관 + 교훈 한 줄"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["out of nowhere", "난데없이"], ["go dead", "(기기가) 먹통이 되다"], ["to be honest", "솔직히 말하면"], ["more A than B", "B라기보다 A한"], ["you name it", "뭐든 다요"], ["nothing worked", "아무것도 안 통했다"], ["Guess what ~?", "그런데 있잖아요?"], ["covered in dust", "먼지로 덮인"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다"], ["Lesson learned!", "교훈을 얻었죠!"]], "audio": "audio/3_롤플레이/3-003 1. MP3 구매(Buying)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-003 1. MP3 구매(Buying)_과거 경험.mp3"}, {"id": "3-004", "cat": "roleplay", "catName": "롤플레이 질문", "num": 2, "topic": "MP3 대여", "topicEn": "Borrowing", "type": "정보 요청", "badge": "04 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to borrow the MP3 player that your friend has. Call your friend, explain why you need it, and ask three or four questions so you can borrow it.", "enA": "Hey, it's me! Are you free to talk? I have a favor to ask. I'm going to Gangneung this weekend for the sunrise — it's a four-hour night bus ride, and my phone battery never survives that long. Could I possibly borrow your MP3 player?\n\n... Really? You're the best! Okay, just a few questions. Are you using it this weekend? ... Oh, good. I didn't want to leave you without music. And does it come with the charger and the case? ... Both? Perfect.\n\nOne last thing — is there anything I should watch out for? ... Ah, the battery drains fast in the cold? Good to know — I'll keep it in my inside pocket. I'll pick it up Friday evening and bring it back Monday, in one piece, I promise. You're a lifesaver — see you Friday!", "koQ": "친구의 MP3 플레이어를 빌리고 싶습니다. 전화해서 왜 필요한지 설명하고, 빌리기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 통화 괜찮아? 부탁이 하나 있어서. 이번 주말에 일출 보러 강릉에 가는데, 야간 버스로 네 시간이나 걸리거든. 내 폰 배터리는 그렇게 오래 못 버텨. 혹시 네 MP3 플레이어 좀 빌려도 될까?\n\n... 정말? 너 최고다! 좋아, 몇 가지만 물어볼게. 이번 주말에 너도 쓸 일 있어? ... 아, 다행이다. 너를 음악 없이 지내게 하고 싶진 않았거든. 그리고 충전기랑 케이스도 같이 와? ... 둘 다? 완벽해.\n\n마지막으로 하나만. 혹시 조심해야 할 게 있을까? ... 아, 추우면 배터리가 빨리 닳는다고? 알아 둘게. 안주머니에 넣고 다닐게. 금요일 저녁에 가지러 가서 월요일에 멀쩡한 상태로 돌려줄게, 약속해. 너 완전 은인이다. 금요일에 보자!", "struct": [["1️⃣ 인사", "전화 오프닝 + 부탁 예고"], ["2️⃣ 이유", "강릉 일출 · 야간 버스 4시간"], ["3️⃣ 질문", "① 주말 사용? → 안도 리액션"], ["4️⃣ 질문", "② 구성품 → 긍정 리액션"], ["5️⃣ 마무리", "③ 주의사항 + 반납 약속 · 인사"]], "expr": [["Are you free to talk?", "통화 괜찮아?"], ["a favor to ask", "부탁할 게 있어"], ["night bus", "야간 버스"], ["never survive ~", "~를 못 버티다"], ["Could I possibly ~?", "혹시 ~해도 될까?"], ["Really? You're the best!", "정말? 너 최고다!"], ["come with ~", "~이 딸려 오다"], ["watch out for ~", "~을 조심하다"], ["Good to know.", "알아 둘게."], ["in one piece", "멀쩡한 상태로"], ["You're a lifesaver!", "너 완전 은인이다!"]], "audio": "audio/3_롤플레이/3-004 2. MP3 대여(Borrowing)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-004 2. MP3 대여(Borrowing)_정보 요청.mp3"}, {"id": "3-005", "cat": "roleplay", "catName": "롤플레이 질문", "num": 2, "topic": "MP3 대여", "topicEn": "Borrowing", "type": "문제 해결", "badge": "05 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. Unfortunately, you accidentally broke the MP3 player you borrowed from your friend. Contact your friend, explain how it got damaged and what condition it is in now, and offer two or three ways to make up for it.", "enA": "Hey, it's me. I have to come clean about something. Remember the MP3 player I borrowed for my Gangneung trip? On the night bus, I fell asleep with it on my lap, and when I stood up, it fell onto the floor and someone stepped on it. I feel terrible.\n\nAs for the condition, the good news is that it still plays music. But there's a crack across the screen, and the volume button is stuck. So it works, but it doesn't look — or feel — the same as before.\n\nHere's how I'd like to make up for it. I'll pay for a full repair. I already called the center, and they said about two days. If you'd rather have a new one, I'll replace it this week, same model. Either way, dinner is on me. You decide, and I'll take care of the rest.", "koQ": "빌린 MP3 플레이어를 실수로 망가뜨렸습니다. 어쩌다 그렇게 됐고 지금 상태가 어떤지 설명하고, 보상 방법 2~3가지를 제안해 보세요.", "koA": "안녕, 나야. 솔직하게 털어놓을 게 있어. 강릉 갈 때 빌려 간 MP3 플레이어 기억나지? 야간 버스에서 무릎에 올려놓고 잠들었는데, 일어설 때 바닥에 떨어졌고 누가 밟았어. 정말 미안한 마음이야.\n\n지금 상태를 말하자면, 다행인 건 음악은 나온다는 거야. 그런데 화면을 가로지르는 금이 하나 갔고, 볼륨 버튼이 눌린 채로 안 돌아와. 작동은 하는데 예전 같지는 않아.\n\n이렇게 보상하고 싶어. 수리비는 내가 전부 낼게. 이미 센터에 전화해 봤는데 이틀 정도면 된대. 아니면 차라리 새 걸 받고 싶으면 이번 주 안에 같은 모델로 바꿔 줄게. 어느 쪽이든 저녁은 내가 살게. 네가 정해 줘, 나머지는 내가 처리할게.", "struct": [["1️⃣ 고백", "솔직한 사과 (come clean)"], ["2️⃣ 경위", "버스에서 낙하 · 밟힘"], ["3️⃣ 상태", "재생 O · 액정 금 · 버튼 눌림"], ["4️⃣ 보상", "① 수리비 전액 ② 새 제품"], ["5️⃣ 마무리", "저녁 대접 + 선택권 넘기기"]], "expr": [["come clean", "솔직히 털어놓다"], ["fall onto the floor", "바닥에 떨어지다"], ["step on ~", "~을 밟다"], ["As for the condition", "상태를 말하자면"], ["The good news is ~", "다행인 건 ~이야"], ["a crack across ~", "~을 가로지르는 금"], ["be stuck", "눌린 채 안 돌아오다"], ["make up for ~", "~을 보상하다"], ["If you'd rather ~", "차라리 ~하고 싶다면"], ["Either way", "어느 쪽이든"], ["Dinner is on me", "저녁은 내가 살게"]], "audio": "audio/3_롤플레이/3-005 2. MP3 대여(Borrowing)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-005 2. MP3 대여(Borrowing)_문제 해결.mp3"}, {"id": "3-006", "cat": "roleplay", "catName": "롤플레이 질문", "num": 2, "topic": "MP3 대여", "topicEn": "Borrowing", "type": "과거 경험", "badge": "06 과거 경험", "enQ": "That's the end of the situation. Have you ever run into trouble with an electronic device? What exactly was the problem, and how did you fix it? Tell me everything in detail.", "enA": "Oh, I remember this one clearly. It was the night before my Gangneung trip, and I was packing. I plugged my phone in, but the cable wouldn't go in. No matter how hard I pushed, the charging icon never showed up. My battery was at eight percent.\n\nI was a little panicked, honestly. A four-hour night bus with a dead phone? No way. I tried three different cables, I even borrowed my brother's charger, but nothing worked. Guess what the real problem was? Lint — my pocket lint had packed itself into the charging port.\n\nSo at midnight, I watched a YouTube video and dug it out with a toothpick. The moment I plugged it in, the charging icon popped right up. I almost cheered. Since then, I've made it a rule to check my port every month. Best five minutes I've ever spent!", "koQ": "전자기기를 쓰다가 문제를 겪은 적이 있나요? 정확히 무엇이 문제였고 어떻게 해결했는지 자세히 말해 주세요.", "koA": "아, 이건 아직도 생생하게 기억나요. 강릉 여행 전날 밤, 짐을 싸는 중이었어요. 휴대폰을 충전기에 꽂았는데 케이블이 제대로 안 들어가는 거예요. 아무리 밀어 넣어도 충전 표시가 끝내 뜨지 않았어요. 배터리는 8%였고요.\n\n솔직히 좀 당황했어요. 네 시간짜리 야간 버스를 폰도 없이 탄다고요? 그건 안 되죠. 케이블을 세 개나 바꿔 보고 동생 충전기까지 빌렸는데 아무것도 안 통했어요. 진짜 원인이 뭐였는지 아세요? 주머니 먼지가 충전 단자 안에 꽉 차 있었던 거예요.\n\n그래서 자정에 유튜브 영상을 보며 이쑤시개로 조심스럽게 파냈어요. 다시 꽂는 순간 충전 표시가 바로 떴죠. 그 후로는 한 달에 한 번 충전 단자를 확인하는 걸 규칙으로 삼았어요. 제 인생에서 가장 값진 5분이었어요!", "struct": [["1️⃣ 도입", "생생한 회상 (remember clearly)"], ["2️⃣ 상황", "강릉 여행 전날 밤 짐 싸기"], ["3️⃣ 문제", "케이블 안 들어감 · 배터리 8%"], ["4️⃣ 해결", "유튜브 + 이쑤시개로 먼지 제거"], ["5️⃣ 마무리", "월 1회 점검 규칙 + 한 줄 정리"]], "expr": [["I remember this clearly", "아직도 생생해요"], ["the night before ~", "~하기 전날 밤"], ["wouldn't go in", "안 들어가더라고요"], ["No matter how ~", "아무리 ~해도"], ["never show up", "끝내 뜨지 않다"], ["No way.", "그건 안 되죠."], ["a little panicked", "살짝 당황한"], ["nothing worked", "아무것도 안 통했다"], ["dig ~ out", "~을 파내다"], ["pop right up", "바로 뜨다"], ["I've made it a rule to ~", "~하기를 규칙으로 삼다"]], "audio": "audio/3_롤플레이/3-006 2. MP3 대여(Borrowing)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-006 2. MP3 대여(Borrowing)_과거 경험.mp3"}, {"id": "3-007", "cat": "roleplay", "catName": "롤플레이 질문", "num": 3, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "정보 요청", "badge": "07 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your friend just got a new cell phone. Call your friend, mention that you are considering buying a new phone yourself, and ask three or four questions to learn more about the phone.", "enA": "Hey, it's me! Do you have a minute? I heard you finally got a new phone — congrats! Here's the thing: my phone is almost four years old, and the battery is on its last legs. So I'm thinking about upgrading too. Can I ask you a few questions?\n\nFirst of all, which one did you go for? ... Oh, that one? I've been eyeing it too. And how's the camera? I take a lot of photos. ... Wait, it's that good in low light? That's a huge selling point for me.\n\nOkay, one more thing — does the battery last a full day? ... Only half a day? Hmm, that's a bit disappointing. And how much did you pay with the carrier plan? ... That's not bad at all. Thanks a ton — talk to you later!", "koQ": "친구가 새 휴대폰을 샀습니다. 전화해서 당신도 새 폰 구매를 고민 중이라고 설명하고, 그 폰에 대해 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 잠깐 시간 돼? 너 드디어 새 폰 샀다며, 축하해! 실은 말이야, 내 폰이 이제 거의 4년 됐는데 배터리가 거의 수명이 다했거든. 그래서 나도 바꿀까 고민 중이야. 몇 가지만 물어봐도 될까?\n\n우선, 어떤 걸로 샀어? ... 아, 그거? 나도 눈여겨보고 있었어. 그리고 카메라는 어때? 내가 사진을 많이 찍거든. ... 잠깐, 어두운 데서도 그렇게 잘 나와? 나한테는 그게 진짜 큰 장점인데.\n\n좋아, 하나만 더. 배터리는 하루 종일 가? ... 반나절밖에 못 가? 음, 그건 좀 아쉽네. 그리고 통신사 요금제까지 하면 얼마 냈어? ... 그 정도면 나쁘지 않네. 정말 고마워, 나중에 또 통화하자!", "struct": [["1️⃣ 인사", "축하 인사 + 교체 고민 설명"], ["2️⃣ 질문", "① 모델 → 아는 척 리액션"], ["3️⃣ 질문", "② 카메라 → 강한 긍정 리액션"], ["4️⃣ 질문", "③ 배터리 → 부정 리액션(아쉽)"], ["5️⃣ 마무리", "④ 가격 + 감사 인사"]], "expr": [["Do you have a minute?", "잠깐 시간 돼?"], ["Here's the thing", "실은 말이야"], ["on its last legs", "수명이 다한"], ["upgrade", "(기기를) 바꾸다"], ["Can I ask you a few questions?", "몇 가지 물어봐도 돼?"], ["Oh, that one?", "아, 그거?"], ["eye ~", "~을 눈여겨보다"], ["in low light", "어두운 곳에서"], ["a huge selling point", "아주 큰 장점"], ["Only half a day?", "반나절밖에?"], ["That's not bad at all.", "그 정도면 괜찮네."]], "audio": "audio/3_롤플레이/3-007 3. 휴대폰(Cell Phone)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-007 3. 휴대폰(Cell Phone)_정보 요청.mp3"}, {"id": "3-008", "cat": "roleplay", "catName": "롤플레이 질문", "num": 3, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "문제 해결", "badge": "08 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You received a document from your friend, but it will not open on your cell phone. Call your friend, describe the problem, and propose two or three different ways to get or view the document.", "enA": "Hey, it's me. I'm having trouble with the file you sent me this morning. I tapped it a few times, but my phone just says 'unsupported format' and won't open it. I think it's because it's a Hangul file and my phone doesn't have that app.\n\nSo here's what I'm thinking. First, could you save it as a PDF and send it again? PDFs open on any phone, so that would solve it in one shot. Or, if that's a hassle, just email it to me — I can open it on my laptop tonight.\n\nAnd if all else fails, could you take a screenshot of the important parts? I only need the schedule on the second page. Whichever is easiest for you is totally fine. Sorry to bother you — thanks a lot!", "koQ": "친구가 보낸 문서가 당신의 휴대폰에서 열리지 않습니다. 전화해서 문제를 설명하고, 그 문서를 받거나 열어 볼 방법 2~3가지를 제안해 보세요.", "koA": "안녕, 나야. 오늘 아침에 네가 보낸 파일 때문에 전화했어. 몇 번이나 눌러 봤는데 내 폰에서는 지원하지 않는 형식이라고만 뜨고 열리지가 않아. 한글 파일인데 내 폰에 그 앱이 없어서 그런 것 같아.\n\n그래서 내 생각은 이래. 첫째, 그 파일을 PDF로 저장해서 다시 보내 줄 수 있을까? PDF는 어떤 폰에서든 열리니까 그러면 한 번에 해결될 거야. 아니면 그게 번거로우면 그냥 이메일로 보내 줘. 오늘 밤에 노트북으로 열어 볼게.\n\n그리고 그것도 다 안 되면, 중요한 부분만 캡처해서 보내 줄 수 있을까? 나는 두 번째 장의 일정표만 있으면 되거든. 너한테 제일 편한 방법이면 다 괜찮아. 번거롭게 해서 미안하고, 정말 고마워!", "struct": [["1️⃣ 상황", "파일이 안 열림 (형식 오류)"], ["2️⃣ 원인", "한글 파일 · 전용 앱 없음"], ["3️⃣ 제안", "① PDF로 변환해 재전송"], ["4️⃣ 제안", "② 이메일 → 노트북에서 열기"], ["5️⃣ 마무리", "③ 캡처 전송 + 선택권 넘기기"]], "expr": [["I'm having trouble with ~", "~때문에 곤란해"], ["unsupported format", "지원하지 않는 형식"], ["won't open", "열리지가 않아"], ["I think it's because ~", "~때문인 것 같아"], ["Here's what I'm thinking", "내 생각은 이래"], ["save it as a PDF", "PDF로 저장하다"], ["in one shot", "한 번에"], ["if that's a hassle", "번거롭다면"], ["if all else fails", "다 안 되면"], ["Whichever is easiest for you", "편한 쪽으로"], ["Sorry to bother you", "번거롭게 해서 미안해"]], "audio": "audio/3_롤플레이/3-008 3. 휴대폰(Cell Phone)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-008 3. 휴대폰(Cell Phone)_문제 해결.mp3"}, {"id": "3-009", "cat": "roleplay", "catName": "롤플레이 질문", "num": 3, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "과거 경험", "badge": "09 과거 경험", "enQ": "That's the end of the situation. Have you ever run into trouble with your cell phone? What was wrong, and how did you get it fixed? Tell me the whole story from start to finish in detail.", "enA": "Oh, this reminds me of the worst timing ever. Remember the concert tickets I finally won after three years of trying? On the day of the show, I was standing in line at the gate, and out of nowhere my phone just froze — completely stuck on the loading screen.\n\nAnd my ticket was a QR code on that phone. My heart dropped. The line kept moving, and I had no way to get in. I tried closing the app, I even plugged it into my battery pack — no luck.\n\nThen it hit me — a force restart. I held the power and volume buttons for about ten seconds, and guess what? It came back to life with the QR code right there. I made it in with two minutes to spare. Since then, I always screenshot my tickets the night before.", "koQ": "휴대폰을 쓰다가 문제를 겪은 적이 있나요? 무엇이 문제였고 어떻게 해결했는지 처음부터 끝까지 자세히 말해 주세요.", "koA": "아, 이건 정말 역대급 최악의 타이밍이었어요. 3년 만에 드디어 티켓팅에 성공한 그 콘서트 기억나시죠? 공연 당일에 입장 줄에 서 있었는데, 난데없이 폰이 그냥 멈춰 버렸어요. 로딩 화면에서 꼼짝도 안 하더라고요.\n\n그런데 제 티켓이 그 폰 안의 QR 코드였어요. 심장이 철렁했죠. 줄은 계속 줄어드는데 들어갈 방법이 없었으니까요. 앱도 꺼 보고 보조배터리에도 꽂아 봤는데 소용없었어요.\n\n그때 강제 재부팅이 떠올랐어요. 전원 버튼과 볼륨 버튼을 10초쯤 누르고 있었더니, 글쎄 폰이 다시 살아나면서 QR 코드가 그대로 떠 있는 거예요. 2분 남기고 겨우 입장했죠. 그 후로는 티켓을 항상 전날 밤에 캡처해 둡니다.", "struct": [["1️⃣ 도입", "회상 시그널 + 최악의 타이밍"], ["2️⃣ 상황", "콘서트 입장 줄 · 폰 멈춤"], ["3️⃣ 문제", "티켓이 QR 코드 · 입장 불가"], ["4️⃣ 해결", "강제 재부팅 → 2분 남기고 입장"], ["5️⃣ 마무리", "전날 밤 캡처 습관"]], "expr": [["the worst timing ever", "역대급 최악의 타이밍"], ["out of nowhere", "난데없이"], ["freeze", "(화면이) 멈추다"], ["stuck on the loading screen", "로딩 화면에서 멈춘"], ["My heart dropped.", "심장이 철렁했어요."], ["no way to get in", "들어갈 방법이 없는"], ["no luck", "소용없었다"], ["Then it hit me", "그때 문득 떠올랐다"], ["force restart", "강제 재부팅"], ["with two minutes to spare", "2분 남기고"], ["Since then, I always ~", "그 후로 항상 ~한다"]], "audio": "audio/3_롤플레이/3-009 3. 휴대폰(Cell Phone)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-009 3. 휴대폰(Cell Phone)_과거 경험.mp3"}, {"id": "3-010", "cat": "roleplay", "catName": "롤플레이 질문", "num": 4, "topic": "카페", "topicEn": "Cafe", "type": "정보 요청", "badge": "10 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are thinking of checking out a new cafe this weekend. Call your friend and ask three or four questions to figure out which cafe to visit and what to order there.", "enA": "Hey, it's me! Are you free for a second? I'm planning to check out a new cafe this weekend, and you always know the good spots. Can I pick your brain for a minute?\n\nSo, first things first — do you know any new places around the station? ... Oh, the one with the rooftop? I've walked past it a hundred times. And what's the vibe like — is it quiet enough to actually talk? ... Perfect, that's exactly what I want.\n\nAnd what should I order there? I'm an iced Americano person, but I'll go out of my comfort zone for a good signature drink. ... A salted cream latte? Now you've got me curious. One last thing — does it get packed on weekends? ... Right, I'll go early then. Thanks — talk to you later!", "koQ": "이번 주말에 새로운 카페에 가 볼 계획입니다. 친구에게 전화해 어디로 갈지, 무엇을 마실지 정하기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 잠깐 시간 괜찮아? 이번 주말에 새로운 카페에 가 볼까 하는데, 너는 항상 좋은 데를 잘 알잖아. 잠깐만 물어봐도 될까?\n\n자, 우선 중요한 것부터. 역 근처에 새로 생긴 데 아는 곳 있어? ... 아, 루프탑 있는 그 집? 그 앞을 백 번은 지나다녔는데. 그리고 분위기는 어때? 대화할 수 있을 만큼 조용해? ... 완벽해, 내가 딱 원하던 거야.\n\n그리고 거기서 뭘 시키면 좋을까? 나는 아이스 아메리카노파인데, 시그니처가 괜찮다면 한번 벗어나 볼 생각이야. ... 솔티드 크림 라떼? 오, 궁금해지는데. 마지막으로 하나만, 주말엔 많이 붐벼? ... 그렇구나, 그럼 일찍 가야겠다. 고마워, 나중에 또 통화하자!", "struct": [["1️⃣ 인사", "전화 오프닝 + 계획 설명"], ["2️⃣ 질문", "① 추천 장소 → 아는 척 리액션"], ["3️⃣ 질문", "② 분위기 → 만족 리액션"], ["4️⃣ 질문", "③ 추천 메뉴 → 호기심 리액션"], ["5️⃣ 마무리", "④ 주말 혼잡 + 계획 정리"]], "expr": [["Are you free for a second?", "잠깐 시간 괜찮아?"], ["check out ~", "~에 가 보다"], ["know the good spots", "좋은 데를 잘 알다"], ["pick your brain", "네 의견 좀 듣다"], ["first things first", "우선 중요한 것부터"], ["the one with ~", "~있는 그 집"], ["What's the vibe like?", "분위기는 어때?"], ["quiet enough to ~", "~할 만큼 조용한"], ["an iced Americano person", "아이스 아메리카노파"], ["go out of my comfort zone", "익숙한 것에서 벗어나다"], ["Now you've got me curious.", "궁금해지는데."]], "audio": "audio/3_롤플레이/3-010 4. 카페(Cafe)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-010 4. 카페(Cafe)_정보 요청.mp3"}, {"id": "3-011", "cat": "roleplay", "catName": "롤플레이 질문", "num": 4, "topic": "카페", "topicEn": "Cafe", "type": "문제 해결", "badge": "11 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You are at a cafe and have just noticed that you left your wallet at home. Talk to the staff, describe your situation, and offer two or three ideas for how they could help you.", "enA": "Excuse me, I'm so sorry to bother you, but I've got a bit of a situation. I just ordered the iced Americano, and when I reached for my wallet, I realized I left it at home. I have no cash and no cards on me right now.\n\nHere's what I can do. First, my banking app is on my phone, so if the shop has an account number, I can transfer the money right now. It takes about ten seconds, and you would have it before my drink is even ready.\n\nOr, my place is only a ten-minute walk from here. I can run home, grab my wallet, and be back before the ice melts. And if neither works, I'm happy to leave my bag as a deposit. Whichever is easiest for you — again, I'm really sorry about this.", "koQ": "카페에 있는데 지갑을 집에 두고 온 걸 알았습니다. 직원에게 상황을 설명하고, 도와줄 수 있는 방법 2~3가지를 제안해 보세요.", "koA": "저기요, 번거롭게 해서 정말 죄송한데, 상황이 좀 생겼어요. 방금 아이스 아메리카노를 주문했는데, 지갑을 꺼내려다가 집에 두고 온 걸 알았어요. 지금 현금도 카드도 하나도 없어요.\n\n제가 할 수 있는 건 이래요. 우선, 폰에 은행 앱이 있어서 매장 계좌번호만 알려 주시면 지금 바로 송금할 수 있어요. 10초면 되고, 음료가 나오기도 전에 입금이 확인되실 거예요.\n\n아니면 저희 집이 여기서 걸어서 10분밖에 안 걸려요. 뛰어가서 지갑을 가져오면 얼음이 녹기도 전에 돌아올 수 있어요. 그것도 어려우면 가방을 맡겨 두고 가도 괜찮고요. 편하신 쪽으로 해 주세요. 다시 한번 정말 죄송합니다.", "struct": [["1️⃣ 양해", "정중한 사과 + 상황 예고"], ["2️⃣ 상황", "주문 후 지갑 없음을 인지"], ["3️⃣ 제안", "① 모바일 뱅킹 즉시 송금"], ["4️⃣ 제안", "② 집이 10분 · 지갑 가져오기"], ["5️⃣ 마무리", "③ 가방 맡기기 + 선택권"]], "expr": [["sorry to bother you", "번거롭게 해 죄송해요"], ["a bit of a situation", "좀 곤란한 상황"], ["reach for ~", "~을 꺼내려 손을 뻗다"], ["leave ~ at home", "~을 집에 두고 오다"], ["no cash and no cards", "현금도 카드도 없다"], ["Here's what I can do", "제가 할 수 있는 건"], ["transfer the money", "송금하다"], ["a ten-minute walk", "걸어서 10분 거리"], ["be back before ~", "~하기 전에 돌아오다"], ["leave ~ as a deposit", "~을 담보로 맡기다"], ["Whichever is easiest for you", "편하신 쪽으로"]], "audio": "audio/3_롤플레이/3-011 4. 카페(Cafe)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-011 4. 카페(Cafe)_문제 해결.mp3"}, {"id": "3-012", "cat": "roleplay", "catName": "롤플레이 질문", "num": 4, "topic": "카페", "topicEn": "Cafe", "type": "과거 경험", "badge": "12 과거 경험", "enQ": "That's the end of the situation. Have you ever visited a cafe where the drinks or the service let you down? What exactly happened, and how did you handle it? Share everything you remember about that visit.", "enA": "Oh, this reminds me of a cafe I tried last summer. It had just opened near my office, and the photos online looked gorgeous, so my expectations were sky-high. I ordered their signature latte and grabbed a seat by the window.\n\nBut the first sip was a letdown. It was lukewarm, and way too sweet — it tasted more like dessert than coffee. On top of that, the staff were chatting behind the counter while three people waited to order. Not a great first impression.\n\nTo be honest, I almost just left. But I decided to speak up politely and said the latte had come out cold. The manager apologized right away, remade it, and even gave me a free drink coupon. Funny enough, I've been back twice since. Now I always say something instead of quietly walking out.", "koQ": "카페에 갔다가 음료나 서비스에 실망한 적이 있나요? 정확히 무슨 일이 있었고 어떻게 대처했는지 기억나는 대로 말해 주세요.", "koA": "아, 작년 여름에 가 봤던 카페가 생각나네요. 회사 근처에 막 문을 연 곳이었는데, 인터넷 사진이 정말 근사해서 기대가 하늘을 찔렀어요. 시그니처 라떼를 시키고 창가 자리를 잡았죠.\n\n그런데 첫 모금부터 실망이었어요. 미지근한 데다 너무 달아서, 커피라기보다 디저트 맛이었거든요. 게다가 주문하려고 세 명이나 기다리는데 직원들은 카운터 뒤에서 수다를 떨고 있었어요. 첫인상이 좋을 수가 없었죠.\n\n솔직히 그냥 나올까 했어요. 그런데 정중하게 말해 보기로 했죠. 라떼가 식은 채로 나왔다고요. 매니저분이 바로 사과하고 새로 만들어 주셨고, 무료 음료 쿠폰까지 주셨어요. 웃기게도 그 후로 두 번이나 다시 갔어요. 이제는 조용히 나와 버리는 대신 꼭 말을 해요.", "struct": [["1️⃣ 도입", "회상 시그널 + 높은 기대치"], ["2️⃣ 문제", "미지근 · 과한 단맛 (첫 모금)"], ["3️⃣ 문제", "직원 잡담 · 방치된 대기 줄"], ["4️⃣ 해결", "정중히 말함 → 재제조 · 쿠폰"], ["5️⃣ 마무리", "재방문 + 달라진 내 태도"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["sky-high", "하늘을 찌르는"], ["grab a seat by the window", "창가 자리를 잡다"], ["The first sip was a letdown", "첫 모금부터 실망"], ["lukewarm", "미지근한"], ["way too sweet", "너무 단"], ["On top of that", "게다가"], ["Not a great first impression", "첫인상이 별로인"], ["speak up", "목소리를 내다"], ["Funny enough", "웃기게도"], ["Now I always ~", "이제는 항상 ~해요"]], "audio": "audio/3_롤플레이/3-012 4. 카페(Cafe)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-012 4. 카페(Cafe)_과거 경험.mp3"}, {"id": "3-013", "cat": "roleplay", "catName": "롤플레이 질문", "num": 5, "topic": "음식", "topicEn": "Food", "type": "정보 요청", "badge": "13 정보 요청", "enQ": "I'd like to give you a situation to act it out. There is a new restaurant in your city you would like to try, but you do not know what kind of food they offer. Call the restaurant and ask three or four questions to find out more.", "enA": "Hi, is this the new restaurant near the station? I walked past it last week and I've been curious ever since, but the menu wasn't posted outside. I'm calling to ask a few quick questions before I stop by this weekend — do you have a minute?\n\nGreat. First, what kind of food do you have? ... Oh, modern Korean fusion? That sounds interesting. And is there a signature dish you'd recommend for first-timers? ... Braised short ribs? Now I'm hungry already.\n\nTwo more things. What's the price range for dinner? ... Around thirty thousand won a person? That's pretty reasonable for a full course. And do you take reservations on weekends? ... Walk-ins only? Good to know — I'll come early then. Thanks for your help!", "koQ": "도시에 새로 생긴 식당에 가 보고 싶은데 어떤 음식을 파는지 모릅니다. 식당에 전화해 정보를 얻기 위한 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 근처에 새로 생긴 식당 맞나요? 지난주에 앞을 지나가다 보고 계속 궁금했는데, 바깥에 메뉴판이 없더라고요. 이번 주말에 가 보기 전에 몇 가지만 여쭤보려고 전화드렸어요. 잠깐 시간 괜찮으실까요?\n\n좋아요. 우선, 어떤 종류의 음식을 하시나요? ... 아, 모던 한식 퓨전이요? 정말 흥미롭네요. 그리고 처음 가는 사람에게 추천하시는 대표 메뉴가 있을까요? ... 갈비찜이요? 벌써 배가 고파지는데요.\n\n두 가지만 더요. 저녁 가격대는 어느 정도인가요? ... 한 사람당 3만 원 정도요? 코스 치고는 꽤 합리적이네요. 그리고 주말에 예약도 받으시나요? ... 예약 없이 방문만 가능하군요. 알아 둘게요, 그럼 일찍 가 보겠습니다. 도움 주셔서 감사합니다!", "struct": [["1️⃣ 인사", "가게 확인 + 전화 목적 밝히기"], ["2️⃣ 질문", "① 음식 종류 → 흥미 리액션"], ["3️⃣ 질문", "② 대표 메뉴 → 식욕 리액션"], ["4️⃣ 질문", "③ 가격대 → 수긍 리액션"], ["5️⃣ 마무리", "④ 예약 여부 + 감사 인사"]], "expr": [["Hi, is this ~?", "혹시 ~ 맞나요?"], ["I'm calling to ask ~", "~하려고 전화했어요"], ["curious ever since", "그때부터 계속 궁금한"], ["What kind of food do you have?", "어떤 음식을 하시나요?"], ["That sounds interesting.", "흥미롭네요."], ["a signature dish", "대표 메뉴"], ["Now I'm hungry already.", "벌써 배고파지는데요."], ["What's the price range?", "가격대가 어떻게 되나요?"], ["pretty reasonable", "꽤 합리적인"], ["take reservations", "예약을 받다"], ["Thanks for your help!", "도움 감사합니다!"]], "audio": "audio/3_롤플레이/3-013 5. 음식(Food)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-013 5. 음식(Food)_정보 요청.mp3"}, {"id": "3-014", "cat": "roleplay", "catName": "롤플레이 질문", "num": 5, "topic": "음식", "topicEn": "Food", "type": "문제 해결", "badge": "14 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. The takeout you ordered for a party turned out to be the wrong food when it was delivered. Call the restaurant, describe what happened, and offer two or three ideas to fix the problem.", "enA": "Hello, I placed a takeout order about an hour ago — two large fried chickens and a jokbal set for a party. But the delivery just arrived, and it's completely the wrong order. I got three pizzas instead. I think the orders got mixed up somewhere.\n\nHere's the thing — I have eight people at my place waiting to eat, so I really need this sorted out quickly. First, could you send the correct order right away? I'll keep the pizzas so your driver doesn't have to make two trips.\n\nIf that takes too long, could you at least send the chicken first and the jokbal later? Or, if neither is possible, I'd like a full refund so I can order somewhere else tonight. Whichever you can do fastest — I'd really appreciate it.", "koQ": "파티용으로 주문한 포장 음식이 다른 음식으로 배달됐습니다. 식당에 전화해 상황을 설명하고, 해결 방법 2~3가지를 제안해 보세요.", "koA": "안녕하세요, 한 시간쯤 전에 파티용으로 포장 주문을 했는데요. 후라이드 치킨 큰 거 두 마리랑 족발 세트였어요. 그런데 방금 배달이 왔는데 완전히 다른 주문이에요. 피자 세 판이 왔어요. 주문이 어딘가에서 섞인 것 같아요.\n\n문제는 지금 저희 집에 여덟 명이 밥을 기다리고 있다는 거예요. 그래서 빨리 해결해야 하는 상황이에요. 우선, 제대로 된 주문을 지금 바로 보내 주실 수 있을까요? 피자는 제가 받아 둘게요. 기사님이 두 번 오실 필요 없게요.\n\n그게 너무 오래 걸린다면, 최소한 치킨만 먼저 보내 주시고 족발은 나중에 주셔도 괜찮아요. 아니면 둘 다 어려우시면 전액 환불해 주세요. 오늘 밤에 다른 데서 시켜야 하니까요. 가장 빨리 되는 방법으로 해 주시면 정말 감사하겠습니다.", "struct": [["1️⃣ 확인", "주문 내역 + 도착한 음식 대조"], ["2️⃣ 상황", "8명 대기 중 · 시간 촉박"], ["3️⃣ 제안", "① 올바른 주문 즉시 재배송"], ["4️⃣ 제안", "② 치킨 먼저 · 족발은 나중"], ["5️⃣ 마무리", "③ 전액 환불 + 속도 요청"]], "expr": [["place a takeout order", "포장 주문을 하다"], ["the wrong order", "잘못된 주문"], ["get mixed up", "뒤섞이다"], ["Here's the thing", "문제는 이거예요"], ["sort ~ out", "~을 해결하다"], ["right away", "지금 바로"], ["make two trips", "두 번 오가다"], ["If that takes too long", "그게 오래 걸린다면"], ["at least", "최소한"], ["a full refund", "전액 환불"], ["Whichever you can do fastest", "가장 빠른 방법으로"]], "audio": "audio/3_롤플레이/3-014 5. 음식(Food)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-014 5. 음식(Food)_문제 해결.mp3"}, {"id": "3-015", "cat": "roleplay", "catName": "롤플레이 질문", "num": 5, "topic": "음식", "topicEn": "Food", "type": "과거 경험", "badge": "15 과거 경험", "enQ": "That's the end of the situation. Have you ever attempted a new recipe and realized it was far more difficult than you thought? What went wrong, and what did that experience teach you?", "enA": "Oh, this reminds me of my best friend's birthday two years ago. I decided to bake her a cake from scratch — a real one, with whipped cream and strawberries. The recipe said 'easy, forty minutes.' Famous last words.\n\nIf it could go wrong, it did. I over-whipped the cream until it turned into butter, and the sponge came out of the oven and sank in the middle. Four hours in, my kitchen looked like a crime scene and I was close to giving up.\n\nSo I improvised. I cut the sponge into cubes, layered them in glasses with cream and strawberries, and called it a 'deconstructed cake.' Guess what? She loved it. What I learned is that recipe times are a lie, and anything new needs a rehearsal. Now I always do a test run a week before.", "koQ": "새로운 레시피에 도전했다가 생각보다 훨씬 어려웠던 적이 있나요? 무엇이 잘못되었고, 그 경험에서 무엇을 배웠나요?", "koA": "아, 2년 전 절친 생일이 생각나네요. 제가 직접 케이크를 굽기로 했어요. 생크림에 딸기까지 올린 진짜 케이크로요. 레시피에는 쉬움, 40분이라고 적혀 있었죠. 그 말을 믿은 게 실수였어요.\n\n잘못될 수 있는 건 다 잘못됐어요. 생크림을 너무 오래 저어서 버터가 돼 버렸고, 시트는 오븐에서 꺼내자마자 가운데가 푹 주저앉았어요. 네 시간이 지났을 때 제 주방은 완전히 아수라장이었고, 저는 포기 직전이었죠.\n\n그래서 즉흥적으로 해결했어요. 시트를 깍둑 썰어서 유리컵에 크림, 딸기와 켜켜이 담고는 해체한 케이크라고 불렀죠. 그런데 있잖아요, 친구가 엄청 좋아했어요. 그때 배운 건 레시피의 시간은 거짓말이라는 것, 그리고 처음 하는 요리엔 예행연습이 필요하다는 거예요. 이제는 꼭 일주일 전에 한 번 만들어 봐요.", "struct": [["1️⃣ 도입", "절친 생일 · 직접 케이크 도전"], ["2️⃣ 복선", "레시피 왈 쉬움 40분"], ["3️⃣ 문제", "생크림 버터화 · 시트 주저앉음"], ["4️⃣ 해결", "컵에 담아 해체 케이크로 변신"], ["5️⃣ 마무리", "배운 점 + 예행연습 습관"]], "expr": [["from scratch", "처음부터 직접"], ["Famous last words.", "그 말을 믿은 게 실수"], ["If it could go wrong, it did", "잘못될 건 다 잘못됐다"], ["over-whip the cream", "생크림을 너무 젓다"], ["turn into butter", "버터가 되어 버리다"], ["sink in the middle", "가운데가 주저앉다"], ["a crime scene", "아수라장"], ["close to giving up", "포기 직전인"], ["improvise", "즉흥적으로 해내다"], ["What I learned is ~", "제가 배운 건 ~예요"], ["do a test run", "예행연습을 하다"]], "audio": "audio/3_롤플레이/3-015 5. 음식(Food)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-015 5. 음식(Food)_과거 경험.mp3"}, {"id": "3-016", "cat": "roleplay", "catName": "롤플레이 질문", "num": 6, "topic": "공원", "topicEn": "Park", "type": "정보 요청", "badge": "16 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your friend is planning to visit a park this weekend and has asked you to come along. Call your friend and ask three or four questions about the plan to learn the details of the outing.", "enA": "Hey, it's me! I got your message about the park this weekend — count me in! It sounds perfect, honestly. I just have a few things to check before Saturday. Do you have a minute?\n\nFirst of all, which park are we going to? ... Oh, the riverside one? That's my favorite — it's within walking distance from my place. And what time should I be there? ... Ten in the morning? That's early for a weekend! But fine, I'll set an alarm.\n\nAnd are we going to have a picnic, or should I eat before I go? ... Oh, you're bringing food? Then I'll bring a picnic blanket and some fruit. One last thing — is anyone else coming? ... Just the two of us? Even better. See you Saturday!", "koQ": "친구가 이번 주말에 공원에 가자고 초대했습니다. 친구에게 전화해 약속의 세부 내용을 알기 위한 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 이번 주말에 공원 가자는 메시지 봤어. 나도 갈게! 진짜 딱 좋은 것 같아. 그런데 토요일 전에 몇 가지만 확인하고 싶어서. 잠깐 시간 돼?\n\n우선, 어느 공원으로 갈 거야? ... 아, 강변에 있는 그 공원? 거기 내가 제일 좋아하는 데야. 우리 집에서 걸어갈 수 있는 거리거든. 그리고 몇 시까지 가면 돼? ... 아침 10시? 와, 주말치고는 이르네! 그래도 괜찮아, 알람 맞춰 놓을게.\n\n그리고 우리 돗자리 펴고 도시락 먹는 거야, 아니면 먹고 가는 게 나아? ... 아, 음식 싸 온다고? 그럼 나는 돗자리랑 과일 좀 챙겨 갈게. 마지막으로 하나만, 다른 사람도 와? ... 우리 둘만? 더 좋지. 토요일에 보자!", "struct": [["1️⃣ 인사", "초대 수락 (Count me in!)"], ["2️⃣ 질문", "① 장소 → 반가움 리액션"], ["3️⃣ 질문", "② 시간 → 놀람 리액션"], ["4️⃣ 질문", "③ 식사 → 준비물 제안"], ["5️⃣ 마무리", "④ 참석자 + 약속 확인"]], "expr": [["Count me in!", "나도 갈게!"], ["a few things to check", "확인할 게 몇 가지"], ["the riverside one", "강변에 있는 그 공원"], ["within walking distance", "걸어갈 수 있는 거리"], ["That's early for a weekend", "주말치고 이르네"], ["set an alarm", "알람을 맞추다"], ["have a picnic", "소풍을 즐기다"], ["a picnic blanket", "돗자리"], ["One last thing", "마지막으로 하나만"], ["Just the two of us?", "우리 둘만?"], ["See you Saturday!", "토요일에 보자!"]], "audio": "audio/3_롤플레이/3-016 6. 공원(Park)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-016 6. 공원(Park)_정보 요청.mp3"}, {"id": "3-017", "cat": "roleplay", "catName": "롤플레이 질문", "num": 6, "topic": "공원", "topicEn": "Park", "type": "문제 해결", "badge": "17 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You have just learned that the park you and your friend planned to visit this weekend will be shut down. Call your friend, describe the situation, and offer two or three other options.", "enA": "Hey, it's me. I've got some bad news about Saturday. I just checked the park's website, and it's closed all week for maintenance. I even called the office to make sure — they confirmed it. So our picnic is off, at least at that park.\n\nBut don't cancel your plans yet — here's what I'm thinking. First, there's another park two subway stops away. It's smaller, but it has a riverside trail and plenty of grassy spots, so the picnic still works.\n\nOr, if you'd rather skip the trip, we can just have the picnic at my place — I have a rooftop, and I'll handle the food. And if the weather turns bad anyway, let's move it to next Saturday. Let me know which one works and I'll set it up.", "koQ": "함께 가기로 한 공원이 이번 주에 문을 닫는다는 것을 알았습니다. 친구에게 연락해 상황을 설명하고, 대안 2~3가지를 제시해 보세요.", "koA": "안녕, 나야. 토요일 관련해서 안 좋은 소식이 있어. 방금 공원 홈페이지를 봤는데, 정비 때문에 이번 주 내내 문을 닫는대. 확실히 하려고 사무실에 전화까지 해 봤는데 맞다고 하더라고. 그래서 우리 소풍은 적어도 그 공원에서는 못 하게 됐어.\n\n그렇다고 계획을 취소하지는 말고, 내 생각은 이래. 첫째, 지하철로 두 정거장 거리에 다른 공원이 있어. 조금 작긴 한데 강변 산책로도 있고 잔디밭도 넉넉해서 소풍은 충분히 할 수 있어.\n\n아니면 차라리 나가는 게 번거로우면 그냥 우리 집에서 해도 돼. 옥상이 있거든. 음식은 내가 준비할게. 그리고 어차피 날씨가 안 좋아지면 다음 주 토요일로 미루자. 어떤 게 좋은지 알려 주면 내가 다 준비할게.", "struct": [["1️⃣ 소식", "나쁜 소식 예고 + 폐쇄 사실"], ["2️⃣ 확인", "홈페이지 · 사무실 전화로 확인"], ["3️⃣ 제안", "① 두 정거장 거리 다른 공원"], ["4️⃣ 제안", "② 우리 집 옥상 + 음식 준비"], ["5️⃣ 마무리", "③ 다음 주로 연기 + 선택 요청"]], "expr": [["I've got some bad news", "안 좋은 소식이 있어"], ["closed for maintenance", "정비로 문을 닫은"], ["make sure", "확실히 해 두다"], ["They confirmed it.", "맞다고 하더라고."], ["be off", "무산되다"], ["Don't cancel ~ yet", "아직 ~하지는 마"], ["two subway stops away", "지하철 두 정거장 거리"], ["a riverside trail", "강변 산책로"], ["if you'd rather ~", "차라리 ~하고 싶다면"], ["handle the food", "음식은 내가 맡다"], ["Let me know which one works", "어느 게 좋은지 알려 줘"]], "audio": "audio/3_롤플레이/3-017 6. 공원(Park)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-017 6. 공원(Park)_문제 해결.mp3"}, {"id": "3-018", "cat": "roleplay", "catName": "롤플레이 질문", "num": 6, "topic": "공원", "topicEn": "Park", "type": "과거 경험", "badge": "18 과거 경험", "enQ": "That's the end of the situation. Do you have a park visit that you still remember? Perhaps something fun, interesting, or unexpected took place. What made it stand out? What happened, and how did you respond to the situation?", "enA": "Oh, this reminds me of an evening at the riverside park last autumn. I was sitting on a bench after my jog, just catching my breath, when out of nowhere a small white dog came running at me and sat right on my foot.\n\nIt had a collar but no owner in sight. I'm not kidding — it looked up at me like we had known each other for years. So I picked it up and started asking everyone on the trail, and before I knew it, four or five strangers were searching with me.\n\nAbout thirty minutes later, a woman came sprinting down the path, completely out of breath, and the dog lost its mind with joy. Everyone around us cheered. What made it special is how quickly strangers became a team. Since then, that bench has been my favorite spot in the whole park.", "koQ": "공원에서 겪은 기억에 남는 경험이 있나요? 무슨 일이 있었고, 왜 특별한가요? 그 상황에 어떻게 대처했는지 말해 주세요.", "koA": "아, 작년 가을 강변 공원에서의 어느 저녁이 생각나네요. 조깅을 마치고 벤치에 앉아 숨을 고르고 있었는데, 난데없이 하얀 강아지 한 마리가 저한테 곧장 달려오더니 제 발 위에 앉는 거예요.\n\n목줄은 있는데 주인은 보이지 않았어요. 진짜예요, 몇 년은 알고 지낸 사이처럼 저를 올려다보더라고요. 그래서 강아지를 안고 산책로에 있는 사람들한테 물어보기 시작했는데, 어느새 낯선 사람 네댓 명이 저와 함께 주인을 찾고 있었어요.\n\n30분쯤 뒤에 한 여성분이 숨이 턱까지 차서 산책로를 달려왔고, 강아지는 기뻐서 어쩔 줄을 몰랐어요. 주변 사람들이 다 환호했죠. 그 경험이 특별했던 건 낯선 사람들이 그렇게 빨리 한 팀이 됐다는 점이에요. 그 후로 그 벤치는 공원에서 제가 가장 좋아하는 자리가 됐어요.", "struct": [["1️⃣ 도입", "조깅 후 강변 공원 벤치"], ["2️⃣ 사건", "난데없이 달려온 하얀 강아지"], ["3️⃣ 전개", "주인 없음 → 낯선 사람들 합류"], ["4️⃣ 절정", "30분 뒤 달려온 주인 · 환호"], ["5️⃣ 마무리", "특별한 이유 + 내 최애 자리"]], "expr": [["catch my breath", "숨을 고르다"], ["out of nowhere", "난데없이"], ["come running at ~", "~에게 달려오다"], ["a collar but no owner", "주인 없는 목줄"], ["I'm not kidding", "진짜예요"], ["before I knew it", "어느새"], ["search with me", "나와 함께 찾다"], ["completely out of breath", "숨이 턱까지 찬"], ["lose its mind (with joy)", "기뻐서 어쩔 줄 모르다"], ["What made it special is ~", "특별했던 건 ~예요"], ["my favorite spot", "가장 좋아하는 자리"]], "audio": "audio/3_롤플레이/3-018 6. 공원(Park)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-018 6. 공원(Park)_과거 경험.mp3"}, {"id": "3-019", "cat": "roleplay", "catName": "롤플레이 질문", "num": 7, "topic": "여가", "topicEn": "Free Time", "type": "정보 요청", "badge": "19 정보 요청", "enQ": "I'd like to give you a situation to act it out. You have come to a local community center to look for new activities to try in your free time. Speak with the staff and ask three or four questions to gather some ideas.", "enA": "Hi, excuse me — is this the right place to ask about your programs? I work weekdays, so I've been looking for something to do in my free time, and a friend told me you run classes here. Do you have a moment?\n\nFirst of all, what kinds of classes do you offer? ... Pottery, guitar, and cooking? That's a bigger list than I expected. And do any of them run in the evening? I can't get here before seven. ... Weekdays at seven thirty? That works perfectly.\n\nTwo more things. How much is it for one term? ... Fifty thousand won for eight weeks? That's cheaper than I thought. And is it okay for complete beginners? ... There's a trial class this Saturday? Sign me up — thank you so much!", "koQ": "여가 시간에 할 새로운 활동을 찾아 지역 커뮤니티 센터에 왔습니다. 직원과 이야기하며 아이디어를 얻기 위한 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 실례합니다. 프로그램 문의는 여기서 하면 될까요? 제가 평일에 일을 해서 여가 시간에 할 만한 걸 찾고 있었는데, 친구가 여기서 수업을 한다고 알려 줬거든요. 잠깐 시간 괜찮으실까요?\n\n우선, 어떤 종류의 수업들이 있나요? ... 도예랑 기타랑 요리까지요? 생각보다 종류가 많네요. 그리고 혹시 저녁에 하는 수업도 있나요? 제가 7시 전에는 못 오거든요. ... 평일 7시 30분이요? 딱 좋네요.\n\n두 가지만 더요. 한 학기에 수강료가 얼마인가요? ... 8주에 5만 원이요? 생각보다 저렴하네요. 그리고 완전 초보자도 괜찮을까요? ... 이번 주 토요일에 체험 수업이 있다고요? 저 신청할게요. 정말 감사합니다!", "struct": [["1️⃣ 인사", "현장 문의 + 방문 목적 설명"], ["2️⃣ 질문", "① 수업 종류 → 놀람 리액션"], ["3️⃣ 질문", "② 저녁 시간대 → 만족 리액션"], ["4️⃣ 질문", "③ 수강료 → 긍정 리액션"], ["5️⃣ 마무리", "④ 초보 가능? + 체험 신청"]], "expr": [["Is this the right place to ~?", "여기서 ~하면 되나요?"], ["in my free time", "여가 시간에"], ["Do you have a moment?", "잠깐 시간 괜찮으세요?"], ["What kinds of classes ~?", "어떤 수업들이 있나요?"], ["a bigger list than I expected", "생각보다 종류가 많은"], ["run in the evening", "저녁에 열리다"], ["That works perfectly.", "딱 좋네요."], ["one term", "한 학기"], ["cheaper than I thought", "생각보다 저렴한"], ["complete beginners", "완전 초보자"], ["Sign me up!", "저 신청할게요!"]], "audio": "audio/3_롤플레이/3-019 7. 여가(Free Time)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-019 7. 여가(Free Time)_정보 요청.mp3"}, {"id": "3-020", "cat": "roleplay", "catName": "롤플레이 질문", "num": 7, "topic": "여가", "topicEn": "Free Time", "type": "문제 해결", "badge": "20 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. The painting class you planned to take in your free time has been called off. Speak with the instructor, express how disappointed you are, and propose two or three other activities you could try instead.", "enA": "Hi, I just heard the painting class has been called off, and honestly, I'm really disappointed. I'd been looking forward to it for weeks — I even bought brushes and a sketchbook last Sunday. It was the one thing I had planned this month.\n\nSo I was wondering if there's anything else I could do instead. First, is the pottery class still running? It's also hands-on, so it would scratch the same itch for me.\n\nOr, if that one is full, could you put me on a waiting list for next term? I'd take it in a heartbeat. And if neither works, is there an open studio where I could practice on my own? Any of those would work — thanks!", "koQ": "여가 시간에 들으려던 그림 수업이 취소되었습니다. 강사에게 아쉬움을 표현하고, 대신 할 수 있는 활동 2~3가지를 제안해 보세요.", "koA": "안녕하세요, 그림 수업이 취소됐다고 방금 들었는데요. 솔직히 정말 아쉬워요. 몇 주 전부터 기다리고 있었거든요. 지난 일요일에 붓이랑 스케치북까지 샀어요. 이번 달에 계획해 둔 게 그거 하나였거든요.\n\n그래서 혹시 대신 할 수 있는 게 있을까 해서요. 우선, 도예 수업은 아직 열리나요? 그것도 직접 손으로 만드는 거라서 저한테는 비슷한 만족감이 있을 것 같아요.\n\n아니면 그 수업도 자리가 다 찼으면, 다음 학기 대기자 명단에 올려 주실 수 있을까요? 그러면 두말없이 바로 신청할게요. 둘 다 어려우면, 혼자 연습할 수 있는 개방 작업실 같은 건 없을까요? 어느 쪽이든 괜찮습니다. 감사합니다.", "struct": [["1️⃣ 소식", "취소 확인 + 아쉬움 표현"], ["2️⃣ 근거", "붓·스케치북 구입 · 한 달 계획"], ["3️⃣ 제안", "① 도예 수업으로 대체"], ["4️⃣ 제안", "② 다음 학기 대기자 등록"], ["5️⃣ 마무리", "③ 개방 작업실 + 감사 인사"]], "expr": [["call off", "취소하다"], ["I'm really disappointed", "정말 아쉬워요"], ["look forward to ~", "~을 기대하다"], ["the one thing I had planned", "유일하게 계획한 것"], ["So I was wondering ~", "그래서 혹시 말인데요"], ["hands-on", "직접 손으로 하는"], ["scratch the same itch", "비슷한 만족을 주다"], ["a waiting list", "대기자 명단"], ["in a heartbeat", "두말없이 바로"], ["an open studio", "개방 작업실"], ["Any of those would work", "어느 쪽이든 괜찮아요"]], "audio": "audio/3_롤플레이/3-020 7. 여가(Free Time)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-020 7. 여가(Free Time)_문제 해결.mp3"}, {"id": "3-021", "cat": "roleplay", "catName": "롤플레이 질문", "num": 7, "topic": "여가", "topicEn": "Free Time", "type": "과거 경험", "badge": "21 과거 경험", "enQ": "That's the end of the situation. Have you ever taken up something that looked fun in your free time, only to find it was different from what you imagined? What was it, and how did you feel about it?", "enA": "Oh, this reminds me of the guitar I bought three years ago. I'd seen so many people playing beautifully online, and I thought, how hard can it be? So I bought one on a whim and signed up for a beginner class.\n\nReality hit fast. The first month was nothing but sore fingertips and one chord I just couldn't get — the F chord. I'm not exaggerating: I practiced it for three weeks and it still sounded like a dying cat.\n\nTo be honest, I felt a little defeated. The guitar ended up as furniture in the corner of my room. But looking back, it wasn't a total waste — ever since then, I listen to music differently. I hear the guitar lines in my favorite songs now. Not the hobby I expected, but not nothing either.", "koQ": "여가 시간에 재미있어 보이는 것을 시작했는데 기대와 달랐던 적이 있나요? 그것은 무엇이었고, 그 경험에 대해 어떻게 느꼈나요?", "koA": "아, 3년 전에 샀던 기타가 생각나네요. 인터넷에서 멋지게 연주하는 사람들을 하도 많이 봐서, 이게 얼마나 어렵겠어 싶었거든요. 그래서 충동적으로 한 대 사고 초보자 수업까지 등록했어요.\n\n현실은 금방 찾아왔어요. 첫 달은 손끝이 아픈 것과 도저히 안 잡히는 코드 하나가 전부였어요. 바로 F 코드요. 과장이 아니라, 3주를 연습했는데도 소리가 여전히 고양이 울음 같았어요.\n\n솔직히 좀 좌절했어요. 결국 기타는 방 구석의 가구가 되어 버렸죠. 그런데 돌아보면 완전히 헛된 건 아니었어요. 그때 이후로 음악을 듣는 귀가 달라졌거든요. 이제는 좋아하는 노래에서 기타 소리가 들려요. 기대했던 취미는 아니었지만, 아무것도 아니었던 것도 아니에요.", "struct": [["1️⃣ 도입", "3년 전 충동적 기타 구매"], ["2️⃣ 기대", "얼마나 어렵겠어 (착각)"], ["3️⃣ 현실", "아픈 손끝 · 안 잡히는 F코드"], ["4️⃣ 감정", "좌절 → 방 구석 가구 신세"], ["5️⃣ 마무리", "그래도 남은 것 (듣는 귀)"]], "expr": [["How hard can it be?", "얼마나 어렵겠어?"], ["on a whim", "충동적으로"], ["Reality hit fast.", "현실은 금방 왔죠."], ["sore fingertips", "아픈 손끝"], ["I just couldn't get ~", "도저히 ~이 안 됐다"]
