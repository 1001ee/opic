 관련 문제를 말해 주세요. 언론은 뭐라고 하고, 당신 생각은 어떤가요? 환경에는 어떤 영향이 있나요?", "koA": "계속 돌아오는 이야기는 실제로 재활용되는 비율이 얼마나 낮은가예요. 우리는 꼼꼼히 분리하는데 상당 부분이 결국 태워지거나 묻혀요. 대개는 더러운 용기 하나면 그 묶음 전체를 망치기에 충분하기 때문이고요.\n\n언론은 두 진영으로 갈려요. 한쪽은 가정을 탓해요. 헹궈라, 찌그러뜨려라, 라벨을 봐라 하고요. 다른 쪽은 그 포장재가 애초에 재활용될 수 없는 물건이었다고 해요. 우리가 손대기도 전에 이미 정해져 있었다는 거죠.\n\n개인적으로는 두 번째 쪽이에요. 세 가지 재질을 붙여 만든 용기는 아무리 헹궈도 답이 없거든요. 환경으로 보면 비용은 매번 같은 곳으로 가요. 더 많은 소각, 더 꽉 찬 매립지, 그리고 주워 담기엔 너무 작게 부서진 플라스틱이요.", "struct": [["1️⃣ 이슈", "실제 재활용 비율이 낮다는 보도"], ["2️⃣ 원인", "더러운 용기 하나가 묶음을 망친다"], ["3️⃣ 언론", "가정 탓 vs 포장재 설계 탓 두 진영"], ["4️⃣ 의견", "세 재질을 붙였으면 헹궈도 소용없다"], ["5️⃣ 환경", "소각 · 매립 · 잘게 부서진 조각 ⭐"]], "expr": [["keep coming back", "계속 돌아오다"], ["actually get recycled", "실제로 재활용되다"], ["be burned or buried", "태워지거나 묻히다"], ["ruin the whole batch", "묶음 전체를 망치다"], ["split into two camps", "두 진영으로 갈리다"], ["blame the household", "가정을 탓하다"], ["never recyclable to begin with", "애초에 재활용 불가인"], ["before we touched it", "우리가 손대기 전에"], ["three materials glued together", "세 재질을 붙인"], ["the cost lands in ~", "비용은 ~으로 떨어진다"], ["break down into pieces", "잘게 부서지다"]], "audio": "audio/4_고난도/4-042 21. 재활용(Recycling)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-042 21. 재활용(Recycling)_이슈.mp3"}, {"id": "4-043", "cat": "advanced", "catName": "고난도 질문", "num": 22, "topic": "산업", "topicEn": "Industry", "type": "비교", "badge": "43 비교", "enQ": "Tell me about a rising industry in your country. Which industry do people talk about these days, and what is it about? How has it changed over the years compared to what it was before?", "enA": "The one everybody talks about is content — drama, film, music and webtoons. I'm preparing to move into the marketing side of it, so I get to watch the whole thing change from fairly close up.\n\nBack then it was a domestic business. Shows were made for the audience here, a few broadcasters decided what got made, and selling abroad was a bonus that happened a year later, if it happened at all.\n\nThese days it is a completely different story. A series is planned for everywhere at once, streaming releases it the same night in every country, and webtoons feed the whole pipeline with stories that already have readers. Budgets are several times bigger than they were ten years ago. The trade-off is that everything now rides on a few big titles each year.", "koQ": "당신 나라에서 떠오르는 산업에 대해 말해 주세요. 요즘 사람들은 어떤 산업을 이야기하고, 예전과 어떻게 달라졌나요?", "koA": "다들 이야기하는 건 콘텐츠예요. 드라마, 영화, 음악, 웹툰이요. 제가 그쪽 마케팅으로 옮기려고 준비 중이라 전체가 변해 가는 걸 꽤 가까이에서 지켜보는 편이고요.\n\n예전엔 내수 사업이었어요. 여기 시청자를 보고 만들었고, 방송사 몇 곳이 뭘 만들지를 정했고, 해외 판매는 1년쯤 뒤에 따라오는 덤이었죠. 그나마도 될 때만요.\n\n요즘은 완전히 다른 이야기예요. 시리즈를 처음부터 전 세계를 보고 기획하고, 스트리밍이 모든 나라에 같은 밤에 공개하고, 웹툰이 이미 독자가 있는 이야기로 파이프라인 전체를 채워요. 제작비는 10년 전보다 몇 배가 됐고요. 대신 잃은 건, 이제 한 해 전체가 몇 편의 대형 작품에 걸려 있다는 거예요.", "struct": [["1️⃣ 산업", "다들 말하는 건 결국 콘텐츠 산업 🎬"], ["2️⃣ 위치", "그쪽으로 옮길 준비 중이라 가까이 본다"], ["3️⃣ 과거", "내수용 · 방송사 몇 곳이 편성 결정"], ["4️⃣ 현재", "전 세계 동시 공개 · 웹툰이 원작"], ["5️⃣ 마무리", "제작비는 몇 배 · 대형작에 쏠려 ⭐"]], "expr": [["the one everybody talks about", "다들 이야기하는 건"], ["the marketing side of it", "그쪽 마케팅 분야"], ["a domestic business", "내수 사업"], ["decide what got made", "뭘 만들지를 정하다"], ["be a bonus", "덤이었다"], ["for everywhere at once", "처음부터 전 세계를 보고"], ["the same night in every country", "모든 나라에 같은 밤"], ["feed the pipeline", "파이프라인을 채우다"], ["several times bigger", "몇 배가 된"], ["The trade-off is ~", "대신 잃는 건 ~이다"], ["ride on a few big titles", "몇 편에 걸려 있다"]], "audio": "audio/4_고난도/4-043 22. 산업(Industry)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-043 22. 산업(Industry)_비교.mp3"}, {"id": "4-044", "cat": "advanced", "catName": "고난도 질문", "num": 22, "topic": "산업", "topicEn": "Industry", "type": "이슈", "badge": "44 이슈", "enQ": "Has the industry you mentioned ever released a new product that failed to meet people's expectations? What was the product, and why were people disappointed? How did people respond to the issue?", "enA": "The clearest example is the second season of a series half the country watched. People waited two years, the cast was all still there, and expectations could not have been higher.\n\nWhy people were disappointed is that it repeated the first one. The budget was visibly bigger, but the surprise was gone. Season one worked because nobody was watching yet, so it could take risks; season two played it safe because everybody was.\n\nHow people responded was loud and then quiet. Viewing numbers broke records in week one, the review scores dropped by half, and by week three nobody was talking about it. The studio answered by announcing a third season anyway. The numbers were fine; the conversation was not.", "koQ": "그 산업에서 사람들의 기대에 못 미친 신제품이 있었나요? 무엇이었고 왜 실망했으며 사람들은 어떻게 반응했나요?", "koA": "가장 분명한 예는 이 나라 절반이 본 시리즈의 두 번째 시즌이에요. 사람들이 2년을 기다렸고 배우도 그대로였으니까, 기대가 더 높을 수가 없었죠.\n\n왜 실망했냐면 첫 시즌을 반복했거든요. 제작비는 눈에 띄게 커졌는데 놀라움이 사라졌어요. 시즌 1은 아직 아무도 안 보고 있었으니까 모험을 할 수 있었고, 시즌 2는 다들 보고 있으니까 안전하게 간 거예요.\n\n반응은 요란했다가 조용해졌어요. 첫 주 시청 수치는 기록을 깼고, 리뷰 점수는 반토막이 났고, 3주째엔 아무도 그 얘길 안 하더라고요. 제작사는 시즌 3 발표로 답했고요. 숫자는 괜찮았어요. 대화가 안 괜찮았던 거죠.", "struct": [["1️⃣ 대상", "나라 절반이 본 시리즈의 시즌 2 🎬"], ["2️⃣ 기대", "2년을 기다렸고 배우도 그대로였다"], ["3️⃣ 이유", "제작비는 커졌는데 놀라움이 사라져"], ["4️⃣ 구조", "시즌 1은 모험 · 시즌 2는 안전하게"], ["5️⃣ 반응", "수치는 기록 · 3주 뒤엔 조용 ⭐"]], "expr": [["half the country watched", "나라 절반이 본"], ["the cast was all still there", "배우가 그대로였다"], ["could not have been higher", "더 높을 수가 없었다"], ["repeat the first one", "첫 편을 반복하다"], ["the surprise was gone", "놀라움이 사라졌다"], ["nobody was watching yet", "아무도 안 보고 있었다"], ["play it safe", "안전하게 가다"], ["break records", "기록을 깨다"], ["drop by half", "반토막이 나다"], ["nobody was talking about it", "아무도 얘기하지 않았다"], ["The numbers were fine.", "숫자는 괜찮았어요"]], "audio": "audio/4_고난도/4-044 22. 산업(Industry)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-044 22. 산업(Industry)_이슈.mp3"}]</script>
<script>
(function(){
"use strict";
const D = JSON.parse(document.getElementById('data').textContent);
const CATS = [
  {id:'survey', name:'서베이 질문'}, {id:'unexpected', name:'돌발 질문'},
  {id:'roleplay', name:'롤플레이 질문'}, {id:'advanced', name:'고난도 질문'}];
const TYPE_ORDER = ['묘사','습관','취향','과거 경험','비교','정보 요청','문제 해결','이슈'];
const byId = Object.fromEntries(D.map(x=>[x.id,x]));

/* ---------- 저장 (이 브라우저에만) ---------- */
const KEY='opic-study-v1';
let S = {mem:{}, star:{}, speed:1, last:null, cat:'survey', fs:17, mode:'full', hl:true, ko:true, follow:true};
try{ Object.assign(S, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const st = {cat:S.cat||'survey', topic:'all', type:'all', view:'all', q:'', id:null};
const avail = {};        // id -> 음성 파일 있음 true/false
const TIMING = {};       // id -> {arr, kind}  (timing.js 파일에서 로드)

const $ = s=>document.querySelector(s);
const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catColor = id=>`var(--c-${id})`;
const audioURL = x => x.audio.split('/').map(encodeURIComponent).join('/');
const timingURL = x => audioURL(x).replace(/\.mp3$/i,'.timing.js');

/* ---------- 필터 ---------- */
function inCat(){ return D.filter(x=>x.cat===st.cat); }
function filtered(){
  const q = st.q.trim().toLowerCase();
  return inCat().filter(x=>
    (st.topic==='all' || String(x.num)===st.topic) &&
    (st.type==='all' || x.type===st.type) &&
    (st.view==='all' || (st.view==='star'&&S.star[x.id]) || (st.view==='todo'&&!S.mem[x.id]) || (st.view==='mem'&&S.mem[x.id]) || (st.view==='audio'&&avail[x.id]===true)) &&
    (!q || (x.enA+' '+x.enQ+' '+x.koA+' '+x.koQ+' '+x.topic+' '+x.topicEn).toLowerCase().includes(q))
  );
}

/* ---------- 상단 ---------- */
function renderStats(){
  const total=D.length, au=D.filter(x=>avail[x.id]===true).length, mem=D.filter(x=>S.mem[x.id]).length, star=D.filter(x=>S.star[x.id]).length;
  $('#stats').innerHTML = `<span class="stat">스크립트 <b>${total}</b></span><span class="stat">음성 연결 <b>${au}</b></span><span class="stat">외움 <b>${mem}</b> / ${total}</span><span class="stat">★ <b>${star}</b></span>`;
}
function renderTabs(){
  $('#tabs').innerHTML = CATS.map(c=>{
    const n=D.filter(x=>x.cat===c.id).length, m=D.filter(x=>x.cat===c.id&&S.mem[x.id]).length;
    return `<button class="tab" role="tab" style="--cc:${catColor(c.id)}" aria-selected="${c.id===st.cat}" data-cat="${c.id}">${c.name}<span class="cnt">${m}/${n}</span></button>`;
  }).join('');
}
function renderFilters(){
  document.documentElement.style.setProperty('--cc', catColor(st.cat));
  const items=inCat();
  const topics=[]; const seen=new Set();
  items.forEach(x=>{ if(!seen.has(x.num)){seen.add(x.num); topics.push(x);} });
  $('#topics').innerHTML = `<button class="chip" aria-pressed="${st.topic==='all'}" data-topic="all">전체</button>` +
    topics.map(t=>`<button class="chip" aria-pressed="${st.topic===String(t.num)}" data-topic="${t.num}">${esc(t.topic)}<span class="n">${items.filter(x=>x.num===t.num).length}</span></button>`).join('');
  const types=TYPE_ORDER.filter(t=>items.some(x=>x.type===t));
  $('#types').innerHTML = `<button class="chip" aria-pressed="${st.type==='all'}" data-type="all">전체</button>` +
    types.map((t,i)=>`<button class="chip" aria-pressed="${st.type===t}" data-type="${esc(t)}">${i+1}. ${esc(t)}<span class="n">${items.filter(x=>x.type===t&&(st.topic==='all'||String(x.num)===st.topic)).length}</span></button>`).join('');
  const V=[['all','모두'],['todo','안 외운 것'],['mem','외운 것'],['star','★ 즐겨찾기'],['audio','🔊 음성 있는 것']];
  $('#views').innerHTML = V.map(([k,l])=>`<button class="chip" style="--cc:var(--ink)" aria-pressed="${st.view===k}" data-view="${k}">${l}</button>`).join('');
}

/* ---------- 목록 ---------- */
function renderList(){
  const L=filtered();
  if(st.id && !L.some(x=>x.id===st.id)) st.id = L[0]?L[0].id:null;
  if(!st.id && L[0]) st.id=L[0].id;
  $('#list').innerHTML = `<div class="listhead"><span>${L.length}개 스크립트</span><span><span class="dot on"></span> 음성 &nbsp;<span class="dot off"></span> 준비 중</span></div>` +
    (L.length? L.map(x=>`<button class="item" data-id="${x.id}" aria-current="${x.id===st.id}">
      <span class="no">${x.id.slice(2)}</span>
      <span class="t">${esc(x.topic)}</span>
      <span class="marks">${S.star[x.id]?'<span style="color:var(--star)">★</span>':''}${S.mem[x.id]?'<span style="color:var(--ok)">✓</span>':''}<span class="dot ${avail[x.id]===true?'on':avail[x.id]===false?'off':''}" data-dot="${x.id}"></span></span>
      <span class="ty">${esc(x.label)}</span></button>`).join('') : `<div class="empty">조건에 맞는 스크립트가 없어요.</div>`);
  const cur=$('#list .item[aria-current=true]'); if(cur) cur.scrollIntoView({block:'nearest'});
}

/* ---------- 대본 텍스트 ---------- */
function exprPatterns(x){
  const out=[];
  x.expr.forEach(r=>{
    (r[0]||'').split(/\s*[\/·,]\s*|\s+or\s+/).forEach(p=>{
      p=p.replace(/~|…|\.\.\./g,' ').replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim();
      if(p.length>=3) out.push(p);
    });
  });
  return out.sort((a,b)=>b.length-a.length);
}
function highlight(text, pats){
  let html=esc(text);
  pats.forEach(p=>{
    const src=esc(p).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['’]");
    try{ html=html.replace(new RegExp('(?<![\\w>])('+src+')(?![\\w<])','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return html;
}
function initials(text){ return esc(text).replace(/([A-Za-z])([A-Za-z'’]+)/g,(m,a,b)=>a+b.replace(/[A-Za-z]/g,'_')); }
function paras(t){ return t.split(/\n/).map(s=>s.trim()).filter(Boolean); }
/* 문장 나누기 — tts.py 의 sentences() 와 같은 규칙 */
function splitSent(p){ return p.split(/(?<=[.!?])\s+/).filter(s=>s.trim()); }
function sentencesOf(t){ return paras(t).flatMap(splitSent); }
function words(t){ return (t.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length; }
function fmt(s){ if(!isFinite(s)) return '0:00'; s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* ---------- 상세 ---------- */
const P = $('#player');
let cur = {x:null, sents:[], starts:null, idx:-1, lock:-1};

function renderDetail(){
  const x = byId[st.id];

/* ---------- 문장 타이밍 ---------- */
window.OPIC_T = function(id, arr, kind){ TIMING[id]={arr, kind}; if(cur.x && cur.x.id===id) computeStarts(); };
function loadTiming(x){
  if(TIMING[x.id]) return;
  const old=document.getElementById('timingjs'); if(old) old.remove();
  const s=document.createElement('script'); s.id='timingjs'; s.src=timingURL(x);
  s.onerror=()=>{}; document.head.appendChild(s);
}
function computeStarts(){
  const x=cur.x; if(!x) return;
  const n=cur.sents.length, t=TIMING[x.id];
  const syncEl=$('#sync');
  if(t && t.arr.length===n){
    cur.starts=t.arr;
    if(syncEl) syncEl.textContent = t.kind==='exact' ? '문장 싱크: 정밀' : '문장 싱크: 자동 맞춤';
  } else if(P.duration){
    // 타이밍 파일이 없으면 글자 수 비율로 추정
    const w=cur.sents.map(s=>s.length+8), tot=w.reduce((a,b)=>a+b,0);
    let acc=0; cur.starts=w.map(v=>{ const s=acc/tot*P.duration; acc+=v; return s; });
    if(syncEl) syncEl.textContent='문장 싱크: 추정';
  }
}
function sentEls(){ return document.querySelectorAll('#en .s'); }
function setNow(i){
  if(i===cur.idx) return;
  const els=sentEls();
  if(els[cur.idx]) els[cur.idx].classList.remove('now');
  cur.idx=i;
  const el=els[i]; if(!el) return;
  el.classList.add('now');
  if(S.follow && !P.paused){
    const r=el.getBoundingClientRect(), top=($('#pcard')?.getBoundingClientRect().bottom||0)+10;
    if(r.top<top || r.bottom>window.innerHeight-40) window.scrollBy({top:r.top-top-window.innerHeight*0.25,behavior:'smooth'});
  }
}
function idxAt(t){
  const a=cur.starts; if(!a) return -1;
  let i=0; for(let k=0;k<a.length;k++){ if(a[k]<=t+0.08) i=k; else break; } return i;
}
function tick(){
  if(cur.starts){
    if(cur.lock>=0){
      const end = cur.starts[cur.lock+1] ?? P.duration;
      if(P.currentTime>=end-0.05 || P.currentTime<cur.starts[cur.lock]-0.3){ P.currentTime=cur.starts[cur.lock]; }
    }
    setNow(idxAt(P.currentTime));
  }
  if($('#fill')){ $('#fill').style.width=(P.duration?P.currentTime/P.duration*100:0)+'%'; $('#cur').textContent=fmt(P.currentTime); }
  if(!P.paused) requestAnimationFrame(tick);
}
function seekSent(i, play=true){
  if(!cur.starts || i<0 || i>=cur.starts.length) return;
  P.currentTime=cur.starts[i]+0.01; setNow(i);
  if(cur.lock>=0){ setLock(i); }
  if(play) P.play();
}
function setLock(i){
  const els=sentEls();
  els.forEach(e=>e.classList.remove('lock'));
  cur.lock=i;
  if(i>=0 && els[i]) els[i].classList.add('lock');
  const b=$('#slock'); if(b) b.classList.toggle('on-ok', i>=0);
}
function toggleLock(){
  if(!cur.starts) return;
  if(cur.lock>=0) setLock(-1);
  else { const i=cur.idx>=0?cur.idx:0; setLock(i); if(P.paused) seekSent(i); }
}

/* ---------- 오디오 ---------- */
function setPlayIcon(playing){
  const b=$('#play'); if(!b) return;
  b.innerHTML = playing ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function loadAudio(x){
  P.pause(); P.loop=false; P.dataset.id=x.id; stopQuestion();
  P.src=audioURL(x); P.playbackRate=S.speed; P.load();
  loadTiming(x);
}
P.addEventListener('loadedmetadata',()=>{
  markAvail(P.dataset.id,true);
  const b=$('#play'); if(b) b.disabled=false;
  if($('#dur')) $('#dur').textContent=fmt(P.duration);
  P.playbackRate=S.speed; computeStarts();
});
P.addEventListener('error',()=>{
  const id=P.dataset.id; if(!id) return; markAvail(id,false);
  const m=$('#pmsg'); if(m){ m.style.display='block'; m.innerHTML='<div class="notice">🔈 아직 이 스크립트의 음성 파일이 없어요. TTS 변환 후 이 페이지를 새로고침(F5)하면 자동으로 연결돼요.</div>'; }
  ['#play','#back5','#loop','#slock'].forEach(s=>{ const e=$(s); if(e) e.disabled=true; });
});
P.addEventListener('play',()=>{ if(!qChain) stopQuestion(); setPlayIcon(true); requestAnimationFrame(tick); });
P.addEventListener('pause',()=>setPlayIcon(false));
P.addEventListener('seeked',()=>{ if(P.paused) tick(); });
P.addEventListener('ended',()=>{ setPlayIcon(false); });
function togglePlay(){ if(!$('#play')||$('#play').disabled) return; P.paused?P.play():P.pause(); }

function markAvail(id,v){
  if(avail[id]===v) return; avail[id]=v;
  const d=document.querySelector(`[data-dot="${id}"]`); if(d) d.className='dot '+(v?'on':'off');
  renderStats();
}
/* 음성 파일이 있는지 백그라운드로 확인 */
function probeAll(){
  const q=D.filter(x=>avail[x.id]===undefined).sort((a,b)=>(a.cat===st.cat?0:1)-(b.cat===st.cat?0:1));
  let active=0;
  function next(){
    while(active<4 && q.length){
      const x=q.shift(); if(avail[x.id]!==undefined) continue; active++;
      const a=new Audio(); a.preload='metadata'; let done=false;
      const fin=v=>{ if(done) return; done=true; active--; markAvail(x.id,v); a.removeAttribute('src'); next(); };
      a.addEventListener('loadedmetadata',()=>fin(true)); a.addEventListener('error',()=>fin(false));
      setTimeout(()=>fin(false),8000);
      a.src=audioURL(x);
    }
  }
  next();
}

/* ---------- 녹음 ---------- */
let rec=null, recChunks=[], recStart=0, recTimer=null, recURL=null;
async function toggleRec(){
  const b=$('#recBtn');
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream); recChunks=[];
    rec.ondataavailable=e=>recChunks.push(e.data);
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop()); clearInterval(recTimer);
      if(recURL) URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(recChunks,{type:rec.mimeType||'audio/webm'}));
      const o=$('#recOut'); if(o) o.innerHTML=`<audio controls src="${recURL}"></audio>`;
      if(b){ b.textContent='다시 녹음'; b.classList.remove('rec'); }
    };
    rec.start(); recStart=Date.now(); P.pause();
    b.textContent='■ 녹음 끝내기'; b.classList.add('rec');
    recTimer=setInterval(()=>{ const t=$('#recT'); if(t) t.textContent=fmt((Date.now()-recStart)/1000); },250);
  }catch(e){
    const o=$('#recOut'); if(o) o.innerHTML='<span class="meta">마이크를 쓸 수 없어요. 주소창 왼쪽 아이콘에서 마이크를 허용해 주세요 (Chrome·Edge 권장).</span>';
  }
}

/* ---------- 질문 듣기 (브라우저 내장 음성) ---------- */
const Q = new Audio(); Q.preload='none';
let qChain=false, qToken=0;
const qURL = x => (x.qaudio||'').split('/').map(encodeURIComponent).join('/');
function qBox(on){ const b=$('#enQ'); if(b) b.classList.toggle('speaking',on); const t=$('#sayQ'); if(t) t.textContent=on?'■ 멈추기':'🔊 질문 듣기'; }
function stopQuestion(){ qToken++; qChain=false; Q.pause(); if('speechSynthesis' in window) speechSynthesis.cancel(); qBox(false); }
function afterQuestion(x, chain){
  qBox(false);
  if(chain && P.dataset.id===x.id && avail[x.id]!==false){
    setTimeout(()=>{ if(qChain && P.dataset.id===x.id){ qChain=false; P.currentTime=0; P.play(); } else qChain=false; }, 1200);
  } else qChain=false;
}
/* 질문 재생: TTS 질문 음성 파일 → 없으면 브라우저 내장 음성 */
function playQuestion(x, chain){
  const playing = $('#enQ') && $('#enQ').classList.contains('speaking');
  stopQuestion(); if(playing && !chain) return;
  P.pause(); qChain=!!chain; const tok=++qToken; let fell=false;
  const fallback=()=>{ if(fell||tok!==qToken) return; fell=true; sayQuestion(x.enQ, ()=>{ if(tok===qToken) afterQuestion(x, qChain); }); };
  Q.onended=()=>{ if(tok===qToken) afterQuestion(x, qChain); };
  Q.onerror=fallback;
  qBox(true);
  if(!x.qaudio){ fallback(); return; }
  Q.src=qURL(x); Q.playbackRate=1;
  Q.play().catch(err=>{ if(err && err.name==='NotAllowedError') { qBox(false); qChain=false; } else fallback(); });
}
function sayQuestion(text, done){
  if(!('speechSynthesis' in window)){ done&&done(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.95;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/en-US/i.test(v.lang)&&/natural|aria|jenny|guy|google/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang));
  if(v) u.voice=v;
  u.onend=()=>{ done&&done(); };
  speechSynthesis.speak(u);
}

/* ---------- 이벤트 ---------- */
function bindDetail(x,L,i){
  $('#prev').onclick=()=>go(L[i-1]); $('#next').onclick=()=>go(L[i+1]);
  $('#star').onclick=()=>{ S.star[x.id]=!S.star[x.id]; if(!S.star[x.id]) delete S.star[x.id]; save(); refresh(false); };
  $('#mem').onclick=()=>toggleMem(x.id);
  $('#play').onclick=togglePlay;
  $('#back5').onclick=()=>{ P.currentTime=Math.max(0,P.currentTime-5); };
  $('#loop').onclick=toggleLoop;
  $('#slock').onclick=toggleLock;
  $('#follow').onclick=()=>{ S.follow=!S.follow; save(); $('#follow').classList.toggle('on-ok',S.follow); };
  $('#bar').onclick=e=>{ if(!P.duration) return; const r=e.currentTarget.getBoundingClientRect(); P.currentTime=(e.clientX-r.left)/r.width*P.duration; };
  $('#speed').onclick=e=>{ const r=e.target.dataset.rate; if(!r) return; S.speed=+r; P.playbackRate=S.speed; save(); $('#speed').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.rate==r)); };
  $('#mode').onclick=e=>{ const m=e.target.dataset.mode; if(!m) return; S.mode=m; save(); keepAudio(()=>renderDetail()); };
  $('#hl').onclick=()=>{ S.hl=!S.hl; save(); $('#en').classList.toggle('nohl',!S.hl); $('#hl').textContent=S.hl?'형광펜 켜짐':'형광펜 꺼짐'; };
  $('#fsm').onclick=()=>setFs(-1); $('#fsp').onclick=()=>setFs(1);
  $('#koT').onclick=()=>{ S.ko=!S.ko; save(); $('#koBox').style.display=S.ko?'':'none'; $('#koT').textContent=S.ko?'접기':'펼치기'; };
  $('#sayQ').onclick=()=>playQuestion(x,false);
  $('#qa').onclick=()=>playQuestion(x,true);
  $('#recBtn').onclick=toggleRec;
  $('#en').onclick=e=>{
    if(S.mode==='hide'){ const p=e.target.closest('p'); if(p) p.classList.toggle('rev'); return; }
    const s=e.target.closest('.s'); if(s && avail[x.id]!==false) seekSent(+s.dataset.i);
  };
}
function keepAudio(fn){
  const t=P.currentTime, playing=!P.paused, id=P.dataset.id, lock=cur.lock;
  fn();
  if(P.dataset.id===id){ P.addEventListener('loadedmetadata',()=>{ P.currentTime=t; if(lock>=0) setLock(lock); if(playing) P.play(); else tick(); },{once:true}); }
}
function setFs(d){ S.fs=Math.min(24,Math.max(14,S.fs+d)); save(); $('#en').querySelectorAll('p').forEach(p=>p.style.fontSize=S.fs+'px'); }
function toggleLoop(){ P.loop=!P.loop; const b=$('#loop'); if(b) b.classList.toggle('on-ok',P.loop); }
function toggleMem(id){ S.mem[id]=!S.mem[id]; if(!S.mem[id]) delete S.mem[id]; save(); refresh(false); }
function go(x){ if(!x) return; st.id=x.id; refresh(true); window.scrollTo({top:0,behavior:'smooth'}); }
function refresh(withDetail){
  renderStats(); renderTabs(); renderFilters(); renderList();
  if(withDetail) renderDetail();
  else { const x=byId[st.id]; const s=$('#star'), m=$('#mem');
    if(s){ s.className='btn '+(S.star[x.id]?'on-star':''); s.textContent=(S.star[x.id]?'★':'☆')+' 즐겨찾기'; }
    if(m){ m.className='btn '+(S.mem[x.id]?'on-ok':''); m.textContent=S.mem[x.id]?'✓ 외웠어요':'외웠어요'; } }
  measure();
}

$('#topics').onclick=e=>{ const b=e.target.closest('[data-topic]'); if(!b) return; st.topic=b.dataset.topic; st.id=null; refresh(true); };

document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey) return;
  const L=filtered(), i=L.findIndex(y=>y.id===st.id);
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.key==='ArrowRight'){ go(L[i+1]); }
  else if(e.key==='ArrowLeft'){ go(L[i-1]); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); seekSent(Math.max(0,cur.idx)+1, !P.paused); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); seekSent(Math.max(0,cur.idx-1), !P.paused); }
  else if(e.key==='s'||e.key==='S'){ toggleLock(); }
  else if(e.key==='h'||e.key==='H'){ S.mode=S.mode==='hide'?'full':'hide'; save(); keepAudio(()=>renderDetail()); }
  else if(e.key==='r'||e.key==='R'){ toggleLoop(); }
  else if(e.key==='m'||e.key==='M'){ if(st.id) toggleMem(st.id); }
  else if(e.key==='q'||e.key==='Q'){ if(st.id) playQuestion(byId[st.id],false); }
});
function measure(){}

/* 시작 */
if(S.last && byId[S.last]){ st.cat=byId[S.last].cat; st.id=S.last; }
refresh(true); probeAll();
if('speechSynthesis' in window) speechSynthesis.getVoices();
})();
</script>
