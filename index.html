는 무엇인가요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 5~6년 전 대학 시절에 여가는 곧 밖으로 나가는 거였어요. 친구들과 밤늦게까지 시내를 쏘다니곤 했죠. 밤샘 영화 마라톤, 목소리가 죽을 때까지 노래방, 그리고 새벽 3시의 라면까지요.\n\n요즘은 완전히 다른 이야기예요. 제 여가는 안쪽으로 방향을 틀었어요. 조깅, 요리, 소파에서 유튜브, 자정 전 소등. 그 격렬했던 시절과 비교하면 지금 저녁은 훨씬 조용해요. 그리고 그 조용함을 보물처럼 지키죠. 뭐가 변했냐면, 에너지가 태우는 게 아니라 아껴 쓰는 예산이 됐어요.\n\n하지만 인정할 건 인정해야죠. 가끔은 그 새벽 3시의 무모함이 그리워요. 그때는 에너지는 있는데 돈이 없었고, 지금은 돈은 좀 있는데 에너지가 없죠. 제 생각엔, 인생 참 웃겨요.", "struct": [["1️⃣ 과거", "밤샘 영화 · 노래방 · 새벽 라면"], ["2️⃣ 현재", "조깅 · 요리 · 자정 전 소등"], ["3️⃣ 대비", "밖으로 vs 안으로"], ["4️⃣ 이유", "에너지 = 태움 → 예산"], ["5️⃣ 마무리", "에너지와 돈의 아이러니"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["roam", "쏘다니다"], ["all-night", "밤샘의"], ["until our voices died", "목소리가 죽을 때까지"], ["turn inward", "안으로 향하다"], ["completely different story", "완전히 다른 이야기"], ["budget", "예산처럼 아껴 쓰다"], ["way + 비교급", "훨씬 더 ~"], ["recklessness", "무모함"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-055 11. 여가(Free Time)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-055 11. 여가(Free Time)_비교.mp3"}, {"id": "2-056", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "묘사", "badge": "56 묘사", "enQ": "Tell me about your favorite TV program. What kind of show is it, and what is it about? Why do you enjoy watching it? Describe it in detail.", "enA": "My favorite TV program? Hands down, it's a cooking survival show where chefs battle with surprise ingredients. Each round, they open a mystery box and have to create a dish on the spot — total chaos, total fun.\n\nWhy do I enjoy it? For starters, the tension is unreal: timers beeping, pans flying, judges with poker faces. But my favorite part is the ideas — I steal little tricks for my own kitchen. My egg rolls finally stopped falling apart thanks to a heat-control tip from one episode!\n\nAnd honestly, the show taught me that cooking is thinking on your feet, not just following recipes. It's the one program I never skip — that's pretty much my TV happy place.", "koQ": "가장 좋아하는 TV 프로그램에 대해 말해주세요. 어떤 종류의 프로그램이고, 무엇에 관한 내용인가요? 왜 그것을 즐겨 보나요? 자세히 묘사해주세요.", "koA": "제가 가장 좋아하는 TV 프로그램이요? 두말할 것 없이 요리 서바이벌 쇼예요. 셰프들이 깜짝 재료로 대결하는 프로그램이죠. 매 라운드 미스터리 박스를 열고 그 자리에서 요리를 만들어내야 해요. 완전한 혼돈, 완전한 재미죠.\n\n왜 즐겨 보냐고요? 우선 긴장감이 장난이 아니에요. 삑삑거리는 타이머, 날아다니는 팬, 포커페이스 심사위원들. 그런데 제 최애 포인트는 아이디어예요. 제 주방을 위해 작은 기술들을 훔치거든요. 어느 에피소드의 불 조절 팁 덕분에 제 계란말이가 드디어 안 부서지게 됐다니까요!\n\n그리고 솔직히 이 쇼가 가르쳐줬어요. 요리는 레시피를 따라가는 게 아니라 순발력이라는 걸요. 절대 건너뛰지 않는 유일한 프로그램이에요. 이게 제 TV 힐링 스팟이죠.", "struct": [["1️⃣ 선언", "요리 서바이벌, hands down"], ["2️⃣ 소개", "미스터리 박스 즉석 대결"], ["3️⃣ 재미", "타이머 · 팬 · 포커페이스"], ["4️⃣ 효용", "주방 꿀팁 훔치기"], ["5️⃣ 마무리", "요리 = 순발력 배움"]], "expr": [["hands down", "두말할 것 없이"], ["battle", "대결하다"], ["on the spot", "그 자리에서, 즉석에서"], ["for starters", "우선, 첫째로"], ["unreal", "장난 아닌"], ["poker face", "포커페이스"], ["steal tricks", "기술을 훔치다"], ["thinking on your feet", "순발력"], ["never skip", "절대 건너뛰지 않다"], ["happy place", "힐링 스팟"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-056 12. TV(Television)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-056 12. TV(Television)_묘사.mp3"}, {"id": "2-057", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "습관", "badge": "57 습관", "enQ": "When and where do you usually watch TV, and how often do you watch it? What do you normally do while watching? Describe your TV watching habits.", "enA": "Truth time: my 'TV' is really a tag team of screens. On weekday evenings I mostly watch YouTube on the sofa, but real TV gets its moment on weekend evenings — that's when I binge my cooking show, usually two episodes back to back.\n\nWhere? Always the same spot: my gray sofa, lights half down, dinner tray on my lap. What do I do while watching? Eat, obviously — and during the boring parts I stretch, fold laundry, or reply in the group chat. Multitasking at its finest!\n\nHow often? Maybe four or five hours a week in total — and my golden rule applies here too: screens off at eleven, no exceptions. Good shows deserve fresh eyes, if you ask me. That's pretty much my TV routine.", "koQ": "보통 언제 어디서 TV를 보고, 얼마나 자주 시청하나요? TV를 보면서 주로 무엇을 하나요? 당신의 TV 시청 습관을 설명해주세요.", "koA": "솔직히 말하면 제 TV는 사실 화면들의 태그팀이에요. 평일 저녁엔 주로 소파에서 유튜브를 보지만, 진짜 TV는 주말 저녁에 등판해요. 그때 요리 쇼를 몰아보거든요. 보통 두 에피소드 연속으로요.\n\n어디서냐고요? 늘 같은 자리죠. 회색 소파, 반쯤 낮춘 조명, 무릎 위 저녁 쟁반. 보면서 뭘 하냐면, 당연히 먹고요. 지루한 부분에선 스트레칭하거나 빨래를 개거나 단톡방에 답장해요. 멀티태스킹의 정석이죠!\n\n얼마나 자주냐면, 다 합쳐서 일주일에 4~5시간쯤이에요. 여기에도 저의 황금률이 적용돼요. 11시엔 화면 끄기, 예외 없음. 제 생각에 좋은 쇼는 맑은 눈으로 봐야 하거든요. 이게 제 TV 루틴이에요.", "struct": [["1️⃣ 구분", "평일 유튜브, 주말 TV"], ["2️⃣ 장소", "소파 · 조명 · 저녁 쟁반"], ["3️⃣ 동시", "스트레칭 · 빨래 · 단톡"], ["4️⃣ 빈도", "주 4~5시간 총량제"], ["5️⃣ 규칙", "11시 스크린 오프 룰"]], "expr": [["tag team", "태그팀"], ["binge", "몰아보다"], ["back to back", "연속으로"], ["lights half down", "반쯤 낮춘 조명"], ["dinner tray", "저녁 쟁반"], ["multitasking", "멀티태스킹"], ["at its finest", "정석의, 최고봉의"], ["golden rule", "황금률"], ["no exceptions", "예외 없이"], ["fresh eyes", "맑은 눈"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-057 12. TV(Television)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-057 12. TV(Television)_습관.mp3"}, {"id": "2-058", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "취향", "badge": "58 취향", "enQ": "What kinds of TV programs do you prefer - dramas, variety shows, or documentaries? Why do you like that type of program? Tell me the reasons.", "enA": "If I had to choose, variety shows win, no contest. After a long day, it's all about switching my brain off, and nothing does that like people being hilariously silly on screen.\n\nHere's my problem with dramas: one episode is never one episode. The cliffhanger grabs me, and suddenly it's 2 a.m. — a direct attack on my eleven o'clock rule! And documentaries? Don't get me wrong, they're brilliant — but after work, they feel like night school. I'd take laughing over learning any day... at least on weeknights.\n\nNothing beats laughing out loud with a bowl of ramyeon after a rough Monday. In a nutshell: dramas steal my sleep, documentaries feed my brain, but variety shows heal my soul.", "koQ": "드라마, 예능, 다큐멘터리 중 어떤 TV 프로그램을 선호하나요? 왜 그런 프로그램을 좋아하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 예능 승리예요. 고민할 것도 없죠. 긴 하루 끝엔 뇌 스위치 끄기가 핵심인데, 화면 속에서 사람들이 우스꽝스럽게 노는 것만큼 그걸 잘하는 게 없거든요.\n\n드라마의 문제는 이거예요. 한 편이 절대 한 편으로 안 끝나요. 클리프행어에 붙잡히면 어느새 새벽 2시죠. 저의 11시 룰에 대한 직접 공격이에요! 다큐멘터리요? 오해는 마세요. 훌륭하죠. 근데 퇴근 후엔 야간 학교처럼 느껴져요. 적어도 평일 밤엔 배움보다 웃음이 무조건 먼저예요.\n\n힘든 월요일 끝에 라면 한 그릇 들고 큰 소리로 웃는 것만 한 게 없어요. 한마디로, 드라마는 제 잠을 훔치고, 다큐는 제 뇌를 채우고, 예능은 제 영혼을 치유해요.", "struct": [["1️⃣ 선택", "예능 승리, no contest"], ["2️⃣ 핵심", "뇌 스위치 끄기"], ["3️⃣ 대비", "드라마 = 11시 룰 공격"], ["4️⃣ 양보", "다큐 훌륭, 그러나 야간 학교"], ["5️⃣ 명언", "잠 · 뇌 · 영혼 3단 대구"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["switch my brain off", "뇌 스위치를 끄다"], ["hilariously silly", "우스꽝스럽게 웃긴"], ["cliffhanger", "클리프행어, 궁금증 엔딩"], ["a direct attack on ~", "~에 대한 직접 공격"], ["night school", "야간 학교"], ["Don't get me wrong", "오해는 마세요"], ["A over B any day", "B보다 무조건 A"], ["nothing beats ~", "~만 한 게 없다"], ["heal my soul", "영혼을 치유하다"]], "audio": "audio/2_돌발/2-058 12. TV(Television)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-058 12. TV(Television)_취향.mp3"}, {"id": "2-059", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "과거 경험", "badge": "59 과거 경험", "enQ": "Tell me about a TV program you enjoyed watching when you were young. What was it about, and who did you watch it with? Why do you remember it?", "enA": "This reminds me of Sunday mornings when I was little. There was a cartoon block at nine, and my younger brother and I used to wake up early just for it — the only day we didn't need an alarm!\n\nBut here's the real memory: the weekly remote control war. He wanted robots, I wanted adventures, and we had exactly one TV. We'd wrestle over the remote, yell, negotiate — and guess what: we always ended up watching both, squeezed under one blanket, sharing a bowl of cereal. Mom's 'homework first!' from the kitchen was our closing credits.\n\nWhy do I remember it? Honestly, the cartoons were just okay. What I really remember is the warmth: the fighting, the blanket, the cereal. TV was just the excuse — the memory is us. We still tease each other about that remote!", "koQ": "어렸을 때 즐겨 봤던 TV 프로그램에 대해 말해주세요. 어떤 내용이었고, 누구와 함께 봤나요? 왜 그것이 기억에 남나요?", "koA": "어릴 적 일요일 아침이 떠오르네요. 9시에 만화 블록이 있었는데, 남동생과 저는 그것만을 위해 일찍 일어나곤 했어요. 알람이 필요 없는 유일한 날이었죠!\n\n근데 진짜 기억은 이거예요. 매주 벌어진 리모컨 전쟁이요. 동생은 로봇, 저는 모험물을 원했는데 TV는 딱 한 대였거든요. 리모컨을 두고 몸싸움하고, 소리 지르고, 협상했죠. 그런데 있잖아요, 결국엔 늘 둘 다 봤어요. 담요 하나에 껴 앉아서 시리얼 한 그릇을 나눠 먹으면서요. 부엌에서 들려오는 엄마의 숙제 먼저! 가 우리의 엔딩 크레딧이었죠.\n\n왜 기억에 남냐고요? 솔직히 만화는 그냥 그랬어요. 진짜 기억나는 건 온기예요. 싸움, 담요, 시리얼. TV는 핑계였고, 추억은 우리 남매죠. 지금도 그 리모컨 얘기로 서로 놀려요!", "struct": [["1️⃣ 도입", "일요일 9시 만화 블록"], ["2️⃣ 갈등", "로봇 vs 모험, TV 한 대"], ["3️⃣ 반전", "결국 담요 속 둘 다 시청"], ["4️⃣ 배경", "엄마의 숙제 먼저! 소리"], ["5️⃣ 마무리", "TV는 핑계, 추억은 남매"]], "expr": [["this reminds me of", "~이 떠오르다"], ["cartoon block", "만화 편성 블록"], ["used to ~", "~하곤 했다"], ["remote control war", "리모컨 전쟁"], ["wrestle over ~", "~을 두고 몸싸움하다"], ["end up ~ing", "결국 ~하게 되다"], ["squeezed under one blanket", "담요 하나에 껴 앉아"], ["closing credits", "엔딩 크레딧"], ["guess what", "있잖아요, 세상에"], ["warmth", "온기"], ["tease", "놀리다"]], "audio": "audio/2_돌발/2-059 12. TV(Television)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-059 12. TV(Television)_과거 경험.mp3"}, {"id": "2-060", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "비교", "badge": "60 비교", "enQ": "Compare the way people watch TV today with the past. How have TV programs and watching habits changed with services like YouTube and Netflix? Tell me in detail.", "enA": "Back then, TV had a schedule and we obeyed it. Miss your show at eight? Gone — see you next week! The whole family gathered in the living room, we fought over the remote, and sat through every commercial like it was a national duty.\n\nThese days, it's a completely different story. With YouTube and Netflix, the schedule is us: we watch what we want, when we want, on whatever screen is closest. Binge-watching killed the weekly wait, algorithms replaced channel surfing, and 'did you watch it yet?' replaced 'did you see it last night?' Compared to the old days, it's way freer — but everyone watches alone now.\n\nI have to admit, I miss the living room crowd: one show, one couch, five opinions. TV got smarter, if you ask me — but watching got lonelier.", "koQ": "오늘날 사람들이 TV를 보는 방식과 과거를 비교해주세요. 유튜브나 넷플릭스 같은 서비스로 인해 TV 프로그램과 시청 습관은 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 TV에 편성표가 있었고 우리는 그걸 따랐어요. 8시 프로그램을 놓치면? 끝. 다음 주에 만나요! 온 가족이 거실에 모였고, 리모컨을 두고 싸웠고, 광고까지 국민 의무처럼 전부 앉아서 봤죠.\n\n요즘은 완전히 다른 이야기예요. 유튜브와 넷플릭스 덕분에 편성표는 우리 자신이 됐어요. 보고 싶은 걸, 보고 싶을 때, 제일 가까운 화면으로 보죠. 몰아보기가 일주일의 기다림을 없앴고, 알고리즘이 채널 돌리기를 대체했고, 어젯밤 그거 봤어?는 너 그거 아직 안 봤어?로 바뀌었어요. 예전과 비교하면 훨씬 자유롭죠. 다만 이제 모두가 혼자 봐요.\n\n인정할 건 인정해야죠. 거실의 북적임이 그리워요. 쇼 하나, 소파 하나, 의견 다섯. 제 생각에 TV는 더 똑똑해졌는데, 보는 일은 더 외로워졌어요.", "struct": [["1️⃣ 과거", "편성표 순종 · 거실 집합"], ["2️⃣ 장면", "광고까지 국민 의무 시청"], ["3️⃣ 현재", "유튜브 · 넷플릭스 · 몰아보기"], ["4️⃣ 대비", "자유로워진 만큼 혼자"], ["5️⃣ 마무리", "TV는 똑똑, 시청은 외로움"]], "expr": [["back then", "그때는"], ["obey the schedule", "편성표를 따르다"], ["fight over ~", "~을 두고 싸우다"], ["sit through ~", "~을 끝까지 보다"], ["national duty", "국민 의무"], ["completely different story", "완전히 다른 이야기"], ["binge-watching", "몰아보기"], ["channel surfing", "채널 돌리기"], ["compared to ~", "~과 비교하면"], ["way + 비교급", "훨씬 더 ~"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-060 12. TV(Television)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-060 12. TV(Television)_비교.mp3"}, {"id": "2-061", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "묘사", "badge": "61 묘사", "enQ": "Describe the seasons in your country. What is the weather like in each season, and how clearly do the seasons change? Tell me in detail.", "enA": "That's an easy one — Korea is famous for its four distinct seasons, and trust me, they don't change quietly. Spring is short and sweet: cherry blossoms everywhere for about two weeks. Summer is hot, humid, and comes with a serious rainy season.\n\nThen comes my favorite: fall, with crisp air and an impossibly blue sky. And winter? Cold, dry, and windy — the season when the whole country zips up the same padded jackets. How clearly do they change? Honestly, my closet answers that question: I swap my entire wardrobe four times a year!\n\nThese days, for example, it's early fall — cool mornings, warm afternoons, perfect jogging weather. In short, Korean seasons are like four completely different countries taking turns — and that's pretty much the weather here.", "koQ": "당신의 나라의 계절을 묘사해주세요. 각 계절의 날씨는 어떻고, 계절 변화는 얼마나 뚜렷한가요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 한국은 뚜렷한 사계절로 유명한데, 정말이지 계절이 조용히 바뀌지 않아요. 봄은 짧고 달콤해요. 2주 정도 벚꽃이 사방에 피죠. 여름은 덥고 습하고, 본격적인 장마까지 함께 와요.\n\n그다음이 제 최애, 가을이에요. 바삭한 공기에 믿기 힘들 만큼 파란 하늘이죠. 겨울은요? 춥고 건조하고 바람 부는, 온 나라가 똑같은 패딩의 지퍼를 올리는 계절이에요. 계절 변화가 얼마나 뚜렷하냐고요? 솔직히 제 옷장이 그 질문에 답해요. 일 년에 네 번 옷장을 통째로 갈아엎거든요!\n\n예를 들어 요즘은 초가을이에요. 서늘한 아침, 따뜻한 오후, 완벽한 조깅 날씨죠. 요컨대 한국의 계절은 완전히 다른 네 나라가 번갈아 오는 것 같아요. 이게 한국 날씨예요.", "struct": [["1️⃣ 선언", "사계절, 조용히 안 바뀜"], ["2️⃣ 묘사", "벚꽃 봄 · 장마 여름"], ["3️⃣ 묘사2", "파란 가을 · 패딩 겨울"], ["4️⃣ 증거", "옷장 연 4회 갈아엎기"], ["5️⃣ 마무리", "네 나라가 번갈아 온다"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["four distinct seasons", "뚜렷한 사계절"], ["humid", "습한"], ["rainy season", "장마"], ["crisp", "바삭한, 상쾌한"], ["zip up", "지퍼를 올리다"], ["My closet answers that.", "옷장이 답해준다"], ["swap", "갈아엎다, 교체하다"], ["in short", "요컨대"], ["take turns", "번갈아 오다"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-061 13. 날씨(Weather)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-061 13. 날씨(Weather)_묘사.mp3"}, {"id": "2-062", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "습관", "badge": "62 습관", "enQ": "How does the weather affect what you do? What do you usually do on rainy days or very hot days? Tell me how your daily routine changes with the weather.", "enA": "Honestly, the weather is my daily schedule manager — let me walk you through it. Every morning starts with the weather app, even before my first coffee. Sunny and cool? Everything goes as planned: evening jog, riverside walk, the usual.\n\nRainy days flip the script: the jog is cancelled, and by Korean law — well, almost — rain means kimchi pancakes! So I cook to the sound of rain and watch YouTube on my sofa. On very hot days, I become nocturnal: I hide indoors with iced americanos all day, and push my jog to a late-night walk by the river.\n\nBut here's my golden rule: weather can reschedule my plans, but it can't cancel them. Rain or heat, I just switch modes — indoor me, night me. That's pretty much how the sky runs my calendar, and it never gets old.", "koQ": "날씨는 당신이 하는 일에 어떤 영향을 주나요? 비 오는 날이나 아주 더운 날에는 주로 무엇을 하나요? 날씨에 따라 일과가 어떻게 달라지는지 말해주세요.", "koA": "솔직히 날씨는 제 일과 매니저예요. 차근차근 설명해드릴게요. 매일 아침은 첫 커피보다도 먼저 날씨 앱으로 시작해요. 맑고 선선하면 모든 게 계획대로죠. 저녁 조깅, 강변 산책, 늘 하던 대로요.\n\n비 오는 날엔 대본이 뒤집혀요. 조깅은 취소되고, 한국의 법칙상 — 뭐, 거의 법이죠 — 비는 곧 김치전이에요! 그래서 빗소리를 들으며 요리하고 소파에서 유튜브를 봐요. 아주 더운 날엔 저는 야행성이 돼요. 하루 종일 아아와 함께 실내에 숨어 있다가, 조깅을 늦은 밤 강변 산책으로 바꾸죠.\n\n그런데 저의 황금률이 있어요. 날씨는 제 계획을 미룰 수는 있지만 취소할 수는 없다는 거예요. 비가 오든 덥든 저는 모드만 바꿔요. 실내의 나, 밤의 나로요. 이게 하늘이 제 달력을 운영하는 방식이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "날씨 = 내 일과 매니저"], ["2️⃣ 맑음", "계획대로 — 조깅 · 산책"], ["3️⃣ 비", "조깅 취소 → 김치전 국룰"], ["4️⃣ 더위", "야행성 모드, 밤 산책 전환"], ["5️⃣ 규칙", "미루되 취소는 없다"]], "expr": [["schedule manager", "일과 매니저"], ["let me walk you through", "차근차근 설명하다"], ["as planned", "계획대로"], ["flip the script", "대본을 뒤집다"], ["kimchi pancakes", "김치전"], ["nocturnal", "야행성의"], ["push A to B", "A를 B로 미루다"], ["golden rule", "황금률"], ["reschedule", "일정을 다시 잡다"], ["switch modes", "모드를 바꾸다"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-062 13. 날씨(Weather)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-062 13. 날씨(Weather)_습관.mp3"}, {"id": "2-063", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "취향", "badge": "63 취향", "enQ": "Which season do you like the most, and why? What do you enjoy doing during that season? Tell me the reasons in detail.", "enA": "If I had to choose, fall wins — no contest. For me, it's all about that crisp air and the impossibly blue sky. Honestly, I think fall is the season the sky shows off.\n\nWhat do I enjoy? Everything I already love, but in its best version: jogging along the river without melting or freezing, picnics with my best friend under the changing leaves, and iced americano weather that finally makes sense. I'd take October over August any day. Don't get me wrong — summer has the beach and winter has that first-snow magic. But fall asks for nothing and gives everything.\n\nNothing beats an evening run through the golden trees with my playlist on. In a nutshell: spring is pretty, summer is exciting, winter is cozy — but fall is breathable. And breathing well is my favorite hobby!", "koQ": "어떤 계절을 가장 좋아하고, 그 이유는 무엇인가요? 그 계절에 무엇을 하는 것을 즐기나요? 그 이유를 자세히 말해주세요.", "koA": "골라야 한다면 가을 승리예요. 고민할 것도 없죠. 저한테 핵심은 그 바삭한 공기와 믿기 힘들 만큼 파란 하늘이에요. 솔직히 가을은 하늘이 실력 자랑하는 계절 같아요.\n\n뭘 즐기냐고요? 제가 이미 사랑하는 모든 것들의 최고 버전이요. 녹지도 얼지도 않고 강변을 조깅하고, 물드는 나뭇잎 아래서 절친과 피크닉을 하고, 드디어 아아가 어울리는 날씨죠. 8월보다는 무조건 10월이에요. 오해는 마세요. 여름엔 바다가 있고 겨울엔 첫눈의 마법이 있죠. 근데 가을은 아무것도 요구하지 않으면서 전부 다 줘요.\n\n플레이리스트 틀고 황금빛 나무 사이를 달리는 저녁 조깅만 한 게 없어요. 한마디로, 봄은 예쁘고 여름은 신나고 겨울은 포근하지만, 가을은 숨쉬기 좋아요. 그리고 숨 잘 쉬는 게 제 최애 취미거든요!", "struct": [["1️⃣ 선택", "가을 승리, no contest"], ["2️⃣ 핵심", "바삭한 공기 · 파란 하늘"], ["3️⃣ 활동", "조깅 · 피크닉 최고 버전"], ["4️⃣ 양보", "여름 바다 · 겨울 첫눈 인정"], ["5️⃣ 명언", "가을은 숨쉬기 좋은 계절"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["show off", "실력 자랑하다"], ["best version", "최고 버전"], ["without melting or freezing", "녹지도 얼지도 않고"], ["A over B any day", "B보다 무조건 A"], ["Don't get me wrong", "오해는 마세요"], ["asks for nothing, gives everything", "요구 없이 다 준다"], ["nothing beats ~", "~만 한 게 없다"], ["breathable", "숨쉬기 좋은"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-063 13. 날씨(Weather)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-063 13. 날씨(Weather)_취향.mp3"}, {"id": "2-064", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "과거 경험", "badge": "64 과거 경험", "enQ": "Tell me about a memorable experience you had because of severe weather. What was the situation, and how did you handle it?", "enA": "This reminds me of last winter's snowstorm. I left work at six as usual, and out of nowhere, the snow got so heavy that my bus simply... never came. The app said 'delayed' for forty minutes straight, and the taxi lines were hopeless.\n\nSo I made a decision: I zipped up my padded jacket and just walked — a full hour to my place. And guess what: somewhere along the way, the annoyance melted. The whole neighborhood had turned into a snow globe — quiet streets, orange lamps, my footsteps making that perfect crunch. I even called my mom just to describe it!\n\nHow did I handle it? Warm clothes, slow steps, and a change of attitude — that's all it took. It worked out fine, and since then, I secretly hope for one big snow every winter. Some delays are gifts, honestly.", "koQ": "궂은 날씨 때문에 겪은 기억에 남는 경험에 대해 말해주세요. 어떤 상황이었고, 어떻게 대처했나요?", "koA": "작년 겨울 폭설이 떠오르네요. 여느 때처럼 6시에 퇴근했는데, 난데없이 눈이 너무 심해져서 버스가 그냥... 안 왔어요. 앱은 40분 내내 지연이라고만 떠 있고, 택시 줄은 가망이 없었죠.\n\n그래서 결단을 내렸어요. 패딩 지퍼를 끝까지 올리고 그냥 걸었어요. 집까지 꼬박 한 시간을요. 그런데 있잖아요, 걷다 보니 어느 순간 짜증이 녹아버렸어요. 온 동네가 스노우볼로 변해 있었거든요. 조용한 거리, 주황빛 가로등, 뽀드득 소리를 내는 제 발자국까지요. 이 풍경을 설명하려고 엄마한테 전화까지 걸었다니까요!\n\n어떻게 대처했냐고요? 따뜻한 옷, 느린 걸음, 그리고 태도 바꾸기. 그게 전부였어요. 결국 다 잘 풀렸고, 그 뒤로는 매년 겨울 큰 눈 한 번을 남몰래 기다려요. 어떤 지연은 선물이더라고요, 진짜로.", "struct": [["1️⃣ 상황", "폭설, 버스 실종 40분"], ["2️⃣ 결단", "패딩 지퍼 올리고 도보 1시간"], ["3️⃣ 반전", "짜증 → 동네가 스노우볼"], ["4️⃣ 감정", "엄마에게 풍경 중계 전화"], ["5️⃣ 교훈", "어떤 지연은 선물이다"]], "expr": [["this reminds me of", "~이 떠오르다"], ["snowstorm", "폭설"], ["out of nowhere", "난데없이"], ["hopeless", "가망 없는"], ["zip up", "지퍼를 올리다"], ["guess what", "있잖아요, 세상에"], ["snow globe", "스노우볼"], ["crunch", "뽀드득 (소리)"], ["a change of attitude", "태도 바꾸기"], ["work out fine", "잘 풀리다"], ["Some delays are gifts.", "어떤 지연은 선물"]], "audio": "audio/2_돌발/2-064 13. 날씨(Weather)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-064 13. 날씨(Weather)_과거 경험.mp3"}, {"id": "2-065", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "비교", "badge": "65 비교", "enQ": "Compare the weather of your childhood with the weather these days. How has the climate in your country changed over time? Tell me about the differences.", "enA": "Back then, when I was a kid, the four seasons used to arrive like clockwork — each one got a fair three months. Spring meant long picnic weeks, and winter meant real snow: my brother and I built snowmen that survived for days.\n\nThese days, it's a completely different story. Spring and fall feel like guest appearances — blink and they're gone. Summer has become the main character: longer, hotter, with monsoon rains that fall all at once instead of softly. Compared to my childhood, the seasons are way more extreme, and honestly, that first snow feels rarer every year.\n\nI have to admit, this is one comparison where the past simply wins. We used to have four seasons taking turns; now it feels like two seasons fighting. I really miss those three-day snowmen, if you ask me.", "koQ": "어린 시절의 날씨와 요즘 날씨를 비교해주세요. 시간이 지나며 당신의 나라의 기후는 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 제가 어릴 땐 사계절이 시계처럼 정확하게 도착하곤 했어요. 각자 공평하게 석 달씩 가졌죠. 봄은 긴 소풍의 계절이었고, 겨울엔 진짜 눈이 왔어요. 남동생과 제가 만든 눈사람이 며칠씩 살아남았다니까요.\n\n요즘은 완전히 다른 이야기예요. 봄과 가을은 카메오 출연 같아요. 눈 깜빡하면 사라지죠. 여름이 주인공이 됐어요. 더 길고, 더 덥고, 부드럽게 내리는 대신 한꺼번에 쏟아지는 장마와 함께요. 어린 시절과 비교하면 계절이 훨씬 극단적이에요. 그리고 솔직히 첫눈이 해마다 더 귀해지는 느낌이에요.\n\n인정할 건 인정해야죠. 이건 과거가 그냥 이기는 비교예요. 예전엔 네 계절이 번갈아 왔는데, 지금은 두 계절이 싸우는 것 같아요. 제 생각엔, 그 3일짜리 눈사람이 정말 그리워요.", "struct": [["1️⃣ 과거", "시계처럼 공평한 사계절"], ["2️⃣ 장면", "며칠 살아남던 눈사람"], ["3️⃣ 현재", "봄가을 카메오 · 여름 주인공"], ["4️⃣ 대비", "넷의 순환 vs 둘의 싸움"], ["5️⃣ 마무리", "3일짜리 눈사람 그리움"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["like clockwork", "시계처럼 정확하게"], ["guest appearance", "카메오 출연"], ["main character", "주인공"], ["monsoon rains", "장마"], ["completely different story", "완전히 다른 이야기"], ["compared to ~", "~과 비교하면"], ["way more ~", "훨씬 더 ~"], ["I have to admit", "인정할 수밖에 없다"], ["the past simply wins", "과거의 완승"]], "audio": "audio/2_돌발/2-065 13. 날씨(Weather)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-065 13. 날씨(Weather)_비교.mp3"}, {"id": "2-066", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "묘사", "badge": "66 묘사", "enQ": "Describe the geography of your country. Are there many mountains, rivers, or beaches? What does the land look like? Tell me in detail.", "enA": "That's an easy one — Korea is basically a mountain kingdom by the sea. About seventy percent of the land is mountains, and the country is a peninsula, so we're surrounded by water on three sides. Talk about having it all!\n\nPicture this: no matter where you stand in Seoul, you can see a mountain somewhere on the horizon. Rivers cut right through our biggest cities — the Han River in Seoul is so wide it feels like a sea. And the coasts? Each one has its own personality: the east has deep blue water and sunrises, the west has mudflats and sunsets.\n\nThat's why weekend hiking is practically a national sport here — grandmas in hiking gear will pass you on any trail, trust me. In short: mountains behind you, a river beside you, the sea around you — that's pretty much Korea.", "koQ": "당신의 나라의 지형을 묘사해주세요. 산, 강, 해변이 많이 있나요? 국토는 어떤 모습인가요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 한국은 한마디로 바다 옆의 산 왕국이에요. 국토의 70% 정도가 산이고, 반도라서 삼면이 물로 둘러싸여 있죠. 다 가진 나라랄까요!\n\n상상해보세요. 서울 어디에 서 있든 지평선 어딘가엔 산이 보여요. 강은 대도시 한가운데를 가로지르죠. 서울의 한강은 얼마나 넓은지 바다처럼 느껴질 정도예요. 해안은요? 저마다 성격이 있어요. 동쪽은 짙푸른 물과 일출, 서쪽은 갯벌과 노을이죠.\n\n그래서 주말 등산이 여기선 사실상 국민 스포츠예요. 어느 등산로에서든 등산 장비를 갖춘 할머니들이 저를 앞질러 가신다니까요, 진짜로요. 요컨대, 뒤에는 산, 옆에는 강, 주위엔 바다. 이게 한국이에요.", "struct": [["1️⃣ 선언", "바다 옆의 산 왕국"], ["2️⃣ 숫자", "산 70% · 삼면이 바다"], ["3️⃣ 묘사", "어디서든 산 · 바다 같은 한강"], ["4️⃣ 디테일", "동해 일출 vs 서해 노을"], ["5️⃣ 마무리", "산 · 강 · 바다 삼종 세트"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["mountain kingdom", "산 왕국"], ["peninsula", "반도"], ["surrounded by ~", "~으로 둘러싸인"], ["Talk about ~!", "~이 따로 없다!"], ["Picture this:", "상상해보세요"], ["cut through ~", "~을 가로지르다"], ["personality", "성격, 개성"], ["mudflat", "갯벌"], ["national sport", "국민 스포츠"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-066 14. 지형(Terrain)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-066 14. 지형(Terrain)_묘사.mp3"}, {"id": "2-067", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "습관", "badge": "67 습관", "enQ": "What activities do you personally enjoy that are related to the geography around you? Do you go hiking or visit a nearby river or park? Tell me what you usually do.", "enA": "I'm lucky — my geography is basically my gym. Let me walk you through it. My go-to is the Han River, ten minutes away: evening jogs on weekdays, and on good weekends, long walks with coffee in hand. The river handles about ninety percent of my outdoor life!\n\nThe other ten percent belongs to the small mountain behind my neighborhood. Once or twice a month, usually on Sunday mornings, I take the gentle trail up — it's less hiking, more walking with a reward: the city view from the top never disappoints. I always send a photo to my mom from up there.\n\nAnd every season or so, I make a run for the east coast to see the actual sea. So river weekly, mountain monthly, sea quarterly — my golden rule of geography! That's pretty much my routine, and it never gets old.", "koQ": "주변 지형과 관련해 당신이 즐기는 활동은 무엇인가요? 하이킹을 가거나 근처 강이나 공원에 가나요? 주로 무엇을 하는지 말해주세요.", "koA": "전 운이 좋아요. 주변 지형이 사실상 제 헬스장이거든요. 차근차근 보여드릴게요. 제 단골은 10분 거리의 한강이에요. 평일엔 저녁 조깅, 날 좋은 주말엔 커피 들고 긴 산책을 하죠. 제 야외 생활의 90%는 강이 책임져요!\n\n나머지 10%는 동네 뒷산 몫이에요. 한 달에 한두 번, 주로 일요일 아침에 완만한 등산로로 올라가요. 등산이라기보단 보상이 있는 산책이죠. 정상에서 보는 도시 뷰는 절대 실망시키지 않거든요. 거기서 엄마한테 꼭 사진을 보내요.\n\n그리고 계절에 한 번쯤은 진짜 바다를 보러 동해안으로 달려가요. 그러니까 강은 매주, 산은 매달, 바다는 분기별. 저의 지형 황금률이에요! 이게 제 루틴이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 선언", "지형 = 나의 헬스장"], ["2️⃣ 강", "한강 90% — 조깅 · 산책"], ["3️⃣ 산", "뒷산 10% — 보상 산책"], ["4️⃣ 바다", "분기별 동해안 원정"], ["5️⃣ 마무리", "매주 · 매달 · 분기 공식"]], "expr": [["My geography is my gym.", "지형이 곧 헬스장"], ["let me walk you through", "차근차근 설명하다"], ["go-to", "단골, 최우선 선택"], ["handle", "책임지다, 담당하다"], ["gentle trail", "완만한 등산로"], ["less A, more B", "A라기보단 B"], ["never disappoints", "절대 실망시키지 않는다"], ["make a run for ~", "~으로 달려가다"], ["quarterly", "분기마다"], ["golden rule", "황금률"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-067 14. 지형(Terrain)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-067 14. 지형(Terrain)_습관.mp3"}, {"id": "2-068", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "취향", "badge": "68 취향", "enQ": "Which type of place do you prefer to visit - the mountains, the sea, or the city? Why do you like that kind of place? Tell me the reasons.", "enA": "If I had to choose among the three, the sea wins — no contest. For me, it's all about that first moment when the horizon opens up: my shoulders drop, my breath slows, and my problems suddenly look very, very small.\n\nI'd pick the sea over the other two any day. Here's my logic: the city is where I live, so it can't be an escape. And mountains? Don't get me wrong — the view from the top is amazing, but the sea gives me the reward without the uphill invoice! Plus, waves are nature's noise cancelling — better than my earbuds, and I love my earbuds.\n\nNothing beats standing on an empty winter beach, coffee in hand, with that endless blue in front of me. In a nutshell: you climb the mountains, you survive the city — but the sea just hugs you back.", "koQ": "산, 바다, 도시 중 어떤 곳에 가는 것을 선호하나요? 왜 그런 장소를 좋아하나요? 그 이유를 말해주세요.", "koA": "셋 중에 골라야 한다면 바다 승리예요. 고민할 것도 없죠. 저한테 핵심은 수평선이 탁 열리는 그 첫 순간이에요. 어깨가 내려가고, 숨이 느려지고, 제 고민들이 갑자기 아주아주 작아 보이거든요.\n\n다른 둘보다는 무조건 바다예요. 제 논리는 이래요. 도시는 제가 사는 곳이라 탈출이 될 수 없어요. 그리고 산은요? 오해는 마세요. 정상에서 보는 풍경은 굉장하죠. 근데 바다는 오르막 청구서 없이 보상을 주잖아요! 게다가 파도는 자연의 노이즈 캔슬링이에요. 제 이어폰보다 나아요. 저 이어폰 사랑하는 사람인데도요.\n\n텅 빈 겨울 바다에 커피 들고 서서 끝없는 파랑을 마주하는 것만 한 게 없어요. 한마디로, 산은 올라가고 도시는 견디는 거지만, 바다는 그냥 안아줘요.", "struct": [["1️⃣ 선택", "바다 승리, no contest"], ["2️⃣ 핵심", "수평선에 작아지는 고민"], ["3️⃣ 논리", "도시 = 일상, 산 = 오르막"], ["4️⃣ 비유", "파도 = 자연의 노캔"], ["5️⃣ 명언", "바다는 그냥 안아준다"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["the horizon opens up", "수평선이 열리다"], ["my shoulders drop", "어깨가 내려가다"], ["A over B any day", "B보다 무조건 A"], ["Don't get me wrong", "오해는 마세요"], ["without the uphill invoice", "오르막 청구서 없이"], ["nature's noise cancelling", "자연의 노캔"], ["nothing beats ~", "~만 한 게 없다"], ["hug you back", "안아주다"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-068 14. 지형(Terrain)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-068 14. 지형(Terrain)_취향.mp3"}, {"id": "2-069", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "과거 경험", "badge": "69 과거 경험", "enQ": "Tell me about a special landscape you have seen in your country. Where was it, and what did it look like? Describe a memorable visit to that place.", "enA": "This reminds me of the most special landscape I've ever seen: the New Year sunrise at Gangneung, on the east coast. It was that famous midnight trip — my best friend called at twelve, and by dawn we were standing on a freezing beach with thousands of strangers.\n\nThe landscape itself? Unforgettable. The horizon was a straight, endless line between dark water and pale sky. Then, out of nowhere, this tiny orange dot appeared — and the whole beach held its breath. In two minutes, the sea turned from black to silver to gold. People counted down like it was midnight again, and someone's grandma shouted 'Happy New Year!' to the ocean.\n\nI've seen prettier photos, honestly — but no photo does justice to that moment. It worked out to be the best spontaneous decision of my life, and since then, the east sea horizon is my definition of 'special landscape'.", "koQ": "당신의 나라에서 본 특별한 지형에 대해 말해주세요. 어디였고, 어떤 모습이었나요? 그곳을 방문했던 기억에 남는 일을 묘사해주세요.", "koA": "제가 본 가장 특별한 지형이 떠오르네요. 동해안 강릉의 새해 일출이에요. 그 유명한 자정 여행이었죠. 절친이 12시에 전화했고, 동틀 무렵 우리는 수천 명의 낯선 사람들과 함께 꽁꽁 언 해변에 서 있었어요.\n\n풍경 자체는요? 잊을 수가 없어요. 수평선이 어두운 물과 옅은 하늘 사이의 곧고 끝없는 선이었어요. 그런데 난데없이 작은 주황 점이 나타났고, 해변 전체가 숨을 죽였죠. 2분 만에 바다가 검정에서 은빛으로, 금빛으로 변했어요. 사람들은 자정처럼 카운트다운을 했고, 어느 할머니는 바다를 향해 새해 복 많이 받으라고 외치셨어요.\n\n솔직히 더 예쁜 사진은 많이 봤어요. 근데 어떤 사진도 그 순간을 담아내진 못해요. 제 인생 최고의 즉흥 결정이 됐고, 그 뒤로 동해 수평선은 저에게 특별한 지형의 정의가 됐어요.", "struct": [["1️⃣ 선언", "강릉 새해 일출 수평선"], ["2️⃣ 배경", "자정 전화 → 새벽 해변"], ["3️⃣ 절정", "주황 점 → 검정 · 은 · 금"], ["4️⃣ 장면", "카운트다운 · 할머니 외침"], ["5️⃣ 마무리", "사진이 못 담는 순간"]], "expr": [["this reminds me of", "~이 떠오르다"], ["unforgettable", "잊을 수 없는"], ["horizon", "수평선"], ["out of nowhere", "난데없이"], ["hold its breath", "숨을 죽이다"], ["black to silver to gold", "검정 → 은 → 금"], ["count down", "카운트다운하다"], ["do justice to ~", "~을 제대로 담아내다"], ["spontaneous", "즉흥적인"], ["work out", "~한 결과가 되다"], ["since then", "그 이후로"]], "audio": "audio/2_돌발/2-069 14. 지형(Terrain)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-069 14. 지형(Terrain)_과거 경험.mp3"}, {"id": "2-070", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "비교", "badge": "70 비교", "enQ": "Compare two different regions of your country. How are their geographical features different, and how do people live differently in each area? Tell me in detail.", "enA": "Let me compare the two regions I know best: Seoul and Gangneung. Seoul, where I live, is a basin city — a river cutting through the middle, mountains standing guard around it, and every square meter packed with buildings and people.\n\nGangneung, my favorite escape on the east coast, is a completely different story: the mountains suddenly end, and the land opens flat into the sea. Compared to Seoul's skyline, Gangneung's horizon is just... a line. And the lifestyle follows the land: Seoul people move fast, always checking the subway timer; Gangneung people move with the weather — surfers wait for waves, cafe owners chat with strangers, and nobody seems to run.\n\nI have to admit, each one fixes the other. When Seoul wears me out, Gangneung recharges me. My friend and I have a saying: Seoul runs on schedules, Gangneung runs on sunrises. Two lands, two clocks — one country.", "koQ": "당신의 나라의 서로 다른 두 지역을 비교해주세요. 지형적 특징이 어떻게 다르고, 각 지역 사람들의 생활은 어떻게 다른가요? 자세히 말해주세요.", "koA": "제가 가장 잘 아는 두 지역을 비교해볼게요. 서울과 강릉이요. 제가 사는 서울은 분지 도시예요. 강이 한가운데를 가로지르고, 산들이 주위를 지키고 서 있고, 1평방미터마다 건물과 사람이 꽉 차 있죠.\n\n제 최애 탈출지인 동해안의 강릉은 완전히 다른 이야기예요. 산이 갑자기 끝나면서 땅이 바다를 향해 평평하게 열려요. 서울의 스카이라인과 비교하면 강릉의 수평선은 그냥... 선 하나예요. 그리고 생활은 땅을 따라가요. 서울 사람들은 지하철 시간을 확인하며 빠르게 움직이고, 강릉 사람들은 날씨와 함께 움직여요. 서퍼들은 파도를 기다리고, 카페 사장님들은 낯선 이와 수다를 떨고, 아무도 뛰지 않는 것 같아요.\n\n인정할 건 인정해야죠. 둘은 서로를 고쳐줘요. 서울이 절 지치게 하면 강릉이 충전해주죠. 절친과 저에겐 이런 말이 있어요. 서울은 일정으로 돌아가고, 강릉은 일출로 돌아간다. 두 개의 땅, 두 개의 시계, 하나의 나라예요.", "struct": [["1️⃣ 선택", "서울 vs 강릉, 아는 두 곳"], ["2️⃣ 서울", "분지 · 한강 · 빽빽함"], ["3️⃣ 강릉", "산 끝 · 평지 · 수평선"], ["4️⃣ 생활", "지하철 시계 vs 파도 시계"], ["5️⃣ 마무리", "일정으로 vs 일출로"]], "expr": [["basin", "분지"], ["stand guard", "지키고 서 있다"], ["packed with ~", "~으로 꽉 찬"], ["completely different story", "완전히 다른 이야기"], ["open flat into ~", "~을 향해 평평하게 열리다"], ["compared to ~", "~과 비교하면"], ["The lifestyle follows the land.", "생활은 땅을 따라간다"], ["wear out", "지치게 하다"], ["recharge", "재충전하다"], ["run on ~", "~으로 돌아가다"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-070 14. 지형(Terrain)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-070 14. 지형(Terrain)_비교.mp3"}, {"id": "2-071", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "묘사", "badge": "71 묘사", "enQ": "Describe a beach you often go to or know well. Where is it located, and what does it look like? What can you see and do there? Tell me in detail.", "enA": "That's an easy one — my beach is in Gangneung, on the east coast, about two and a half hours from Seoul. It's my favorite escape, and by now I know it like my own neighborhood.\n\nWhat does it look like? A long stretch of pale sand, a pine forest standing right behind it like a green wall, and that famous deep blue East Sea water. The best part is the coffee street along the shore — Gangneung is Korea's coffee city, so you can literally hold a fresh hand-drip while your feet touch the sand.\n\nWhat can you do? Everything slow: sunrise watching, long walks with the waves chasing your shoes, fresh seafood at the market — and my personal ritual, beach ramyeon! In short, it's a beach that pairs the sea with coffee — that's pretty much my happy place by the water.", "koQ": "자주 가거나 잘 아는 해변을 묘사해주세요. 어디에 위치해 있고, 어떻게 생겼나요? 그곳에서 무엇을 보고 무엇을 할 수 있나요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 제 해변은 동해안 강릉에 있어요. 서울에서 두 시간 반 정도 거리죠. 제 최애 탈출지라서 이젠 우리 동네만큼 잘 알아요.\n\n어떻게 생겼냐면, 길게 뻗은 하얀 모래사장, 그 바로 뒤에 초록 벽처럼 서 있는 소나무 숲, 그리고 그 유명한 짙푸른 동해 바닷물이에요. 최고의 포인트는 해변을 따라 이어지는 커피 거리예요. 강릉은 한국의 커피 도시라서, 말 그대로 발은 모래에 닿은 채로 갓 내린 핸드드립을 들고 있을 수 있어요.\n\n뭘 할 수 있냐고요? 느린 것들 전부요. 일출 보기, 파도가 신발을 쫓아오는 긴 산책, 시장의 신선한 해산물, 그리고 저의 개인 의식인 해변 라면까지! 요컨대 바다와 커피를 페어링한 해변이에요. 이게 물가의 제 힐링 스팟이죠.", "struct": [["1️⃣ 선언", "강릉 해변, 2시간 반"], ["2️⃣ 묘사", "모래 · 소나무 벽 · 짙푸른 물"], ["3️⃣ 특색", "해변 커피 거리 페어링"], ["4️⃣ 활동", "일출 · 산책 · 해변 라면"], ["5️⃣ 마무리", "바다 + 커피 힐링 스팟"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["escape", "탈출지"], ["a long stretch of ~", "길게 뻗은 ~"], ["pine forest", "소나무 숲"], ["like a green wall", "초록 벽처럼"], ["coffee street", "커피 거리"], ["hand-drip", "핸드드립"], ["waves chasing your shoes", "신발을 쫓는 파도"], ["personal ritual", "개인 의식"], ["pair A with B", "A와 B를 페어링하다"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-071 15. 해변(Beach)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-071 15. 해변(Beach)_묘사.mp3"}, {"id": "2-072", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "습관", "badge": "72 습관", "enQ": "What do you usually do when you go to the beach? Who do you go with, and what do you bring? Describe a typical day at the beach from arrival to leaving.", "enA": "Beach days are best-friend days — we go once or twice a year, and we have a whole system. Let me walk you through it. Packing is minimal: a blanket, wireless earbuds, snacks, and sunscreen — which she always forgets and I always pack double!\n\nFirst stop on arrival: coffee from the beach cafe street — rules are rules in Gangneung. Then the long walk: one full hour along the water, talking about everything and nothing. After that comes my favorite part, which we call sea-gazing: we just sit on the blanket and stare at the waves like two grandmas. Deeply, deeply healing.\n\nLunch is seafood at the market or beach ramyeon if we're lazy. And before leaving, our non-negotiable ritual: one sunset photo, same pose every year. Coffee, walk, gaze, eat, photo — that's pretty much our beach formula, and it never gets old.", "koQ": "해변에 가면 주로 무엇을 하나요? 누구와 함께 가고, 무엇을 챙겨 가나요? 도착부터 떠날 때까지 해변에서의 일반적인 하루를 설명해주세요.", "koA": "해변 가는 날은 곧 절친의 날이에요. 일 년에 한두 번 가는데, 우리만의 시스템이 다 있어요. 차근차근 보여드릴게요. 짐은 최소한이에요. 담요, 무선 이어폰, 간식, 그리고 선크림. 선크림은 절친이 늘 까먹어서 제가 늘 두 개 챙기죠!\n\n도착하면 첫 코스는 해변 카페 거리의 커피예요. 강릉에선 규칙은 규칙이니까요. 그다음은 긴 산책이에요. 물가를 따라 꼬박 한 시간, 온갖 얘기와 아무 얘기도 아닌 얘기를 하면서요. 그다음이 제 최애 코스인데, 우리는 바다멍이라고 불러요. 담요에 앉아서 할머니 두 명처럼 파도만 바라보는 거예요. 깊이, 아주 깊이 힐링되죠.\n\n점심은 시장 해산물이나, 게으른 날엔 해변 라면이에요. 그리고 떠나기 전 타협 불가 의식이 있어요. 노을 사진 한 장, 매년 같은 포즈로요. 커피, 산책, 바다멍, 먹기, 사진. 이게 우리의 해변 공식이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 동행", "절친과 연 1~2회 시스템"], ["2️⃣ 준비", "담요 · 이어폰 · 선크림 2개"], ["3️⃣ 순서", "커피 → 1시간 산책 → 바다멍"], ["4️⃣ 식사", "시장 해산물 or 해변 라면"], ["5️⃣ 의식", "매년 같은 포즈 노을 사진"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["pack double", "두 개 챙기다"], ["sunscreen", "선크림"], ["First stop:", "첫 코스는"], ["Rules are rules.", "규칙은 규칙"], ["sea-gazing", "바다멍"], ["like two grandmas", "할머니 두 명처럼"], ["deeply healing", "깊이 힐링되는"], ["non-negotiable", "타협 불가의"], ["formula", "공식"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-072 15. 해변(Beach)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-072 15. 해변(Beach)_습관.mp3"}, {"id": "2-073", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "취향", "badge": "73 취향", "enQ": "Why do you like going to the beach? What do you enjoy the most there - swimming, the scenery, or the food? Tell me the reasons in detail.", "enA": "If I had to choose among the three, the scenery wins — no contest. Full disclosure: my swimming is closer to organized splashing, so that one's out early! For me, it's all about what the sea does to my head.\n\nHere's the thing: the horizon is the only place my eyes can rest. In the city, everything is close — screens, buildings, faces. At the beach, I finally look at something endless, and my brain quietly unclenches. The sound helps too: waves are the one playlist I never skip. Don't get me wrong — beach food is glorious, and I take my seafood very seriously. But food I can find in Seoul; that horizon, I can't.\n\nNothing beats that first deep breath when the sea comes into view. In a nutshell: I don't go to the beach to do something — I go there to finally do nothing.", "koQ": "왜 해변에 가는 것을 좋아하나요? 수영, 풍경, 음식 중 그곳에서 무엇을 가장 즐기나요? 그 이유를 자세히 말해주세요.", "koA": "셋 중에 골라야 한다면 풍경 승리예요. 고민할 것도 없죠. 솔직히 고백하면 제 수영 실력은 조직적인 물장구에 가까워서, 수영은 일찌감치 탈락이에요! 저한테 핵심은 바다가 제 머릿속에 해주는 일이에요.\n\n이런 거예요. 수평선은 제 눈이 쉴 수 있는 유일한 곳이에요. 도시에선 모든 게 가까워요. 화면, 건물, 얼굴들. 해변에선 드디어 끝없는 걸 바라보게 되고, 그러면 뇌가 조용히 긴장을 풀어요. 소리도 한몫하죠. 파도는 제가 절대 건너뛰지 않는 유일한 플레이리스트거든요. 오해는 마세요. 해변 음식은 찬란하고, 저는 해산물을 아주 진지하게 대하는 사람이에요. 근데 음식은 서울에서도 찾을 수 있지만, 그 수평선은 못 찾잖아요.\n\n바다가 시야에 들어오는 순간의 그 첫 심호흡만 한 게 없어요. 한마디로, 저는 해변에 뭔가를 하러 가는 게 아니라, 드디어 아무것도 안 하러 가요.", "struct": [["1️⃣ 선택", "풍경 승리, no contest"], ["2️⃣ 탈락", "수영 = 조직적인 물장구"], ["3️⃣ 논리", "수평선 = 눈이 쉬는 곳"], ["4️⃣ 양보", "음식은 서울에도 있다"], ["5️⃣ 명언", "아무것도 안 하러 간다"]], "expr": [["if I had to choose", "골라야 한다면"], ["Full disclosure:", "솔직히 고백하면"], ["organized splashing", "조직적인 물장구"], ["it's all about ~", "핵심은 ~이다"], ["rest my eyes", "눈을 쉬게 하다"], ["endless", "끝없는"], ["unclench", "긴장을 풀다"], ["the one playlist I never skip", "절대 안 넘기는 플레이리스트"], ["Don't get me wrong", "오해는 마세요"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-073 15. 해변(Beach)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-073 15. 해변(Beach)_취향.mp3"}, {"id": "2-074", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "과거 경험", "badge": "74 과거 경험", "enQ": "Tell me about a memorable experience you had at the beach. When and where was it, and who were you with? What happened? Tell me the whole story.", "enA": "This reminds me of a family beach trip when I was about ten — the east coast, midsummer, with my mom and my little brother. That day, my brother and I decided to build not a sandcastle, but a sand empire: walls, towers, even a moat. We worked on it all afternoon like two little engineers.\n\nThen, out of nowhere, one big wave came in and — you can guess what happened — thirty seconds, empire gone. My brother just stood there, and then came the loudest crying on that entire beach. But my mom saved the day with one line: 'The sea just checked your homework — it says build a bigger one.'\n\nSo we did — closer to the pines this time, twice as big, and it survived until sunset. It all worked out fine, and since then, that line is our family motto for every setback: rebuild it bigger. Honestly, the wave taught us more than the castle did.", "koQ": "해변에서 겪은 기억에 남는 경험에 대해 말해주세요. 언제 어디서였고, 누구와 함께였나요? 무슨 일이 있었나요? 전체 이야기를 들려주세요.", "koA": "열 살쯤의 가족 해변 여행이 떠오르네요. 동해안, 한여름, 엄마와 남동생과 함께였죠. 그날 동생과 저는 모래성이 아니라 모래 제국을 짓기로 했어요. 성벽, 탑, 심지어 해자까지요. 꼬마 엔지니어 둘처럼 오후 내내 작업했죠.\n\n그런데 난데없이 큰 파도 하나가 들어왔고, 무슨 일이 일어났을지 아시겠죠. 30초 만에 제국이 사라졌어요. 동생은 멍하니 서 있다가, 그 해변 전체에서 가장 큰 울음을 터뜨렸죠. 근데 엄마가 한 마디로 그날을 구하셨어요. 바다가 방금 너희 숙제 검사한 거야. 더 크게 지으라는 뜻이래.\n\n그래서 그렇게 했어요. 이번엔 소나무 쪽에 더 가까이, 두 배 더 크게요. 그리고 그 성은 노을까지 살아남았죠. 결국 다 잘 풀렸고, 그 뒤로 그 말은 모든 좌절에 대한 우리 가족의 모토가 됐어요. 더 크게 다시 지어라. 솔직히 성보다 파도가 더 많은 걸 가르쳐줬어요.", "struct": [["1️⃣ 배경", "열 살, 가족 동해 여행"], ["2️⃣ 전개", "모래성 아닌 모래 제국"], ["3️⃣ 반전", "파도 30초, 제국 소멸"], ["4️⃣ 절정", "엄마의 숙제 검사 한 마디"], ["5️⃣ 교훈", "더 크게 다시 지어라"]], "expr": [["this reminds me of", "~이 떠오르다"], ["sand empire", "모래 제국"], ["moat", "해자"], ["like two little engineers", "꼬마 엔지니어처럼"], ["out of nowhere", "난데없이"], ["guess what", "있잖아요, 세상에"], ["save the day", "그날을 구하다"], ["check your homework", "숙제를 검사하다"], ["setback", "좌절, 차질"], ["work out fine", "잘 풀리다"], ["since then", "그 이후로"]], "audio": "audio/2_돌발/2-074 15. 해변(Beach)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-074 15. 해변(Beach)_과거 경험.mp3"}, {"id": "2-075", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "비교", "badge": "75 비교", "enQ": "Compare the beaches you visited as a child with the beaches these days. How have the facilities, the visitors, and the activities changed? Tell me in detail.", "enA": "Back then, the beach used to be beautifully simple. Facilities meant a rented parasol, a tube, and one snack stand selling everything. Visitors were families like mine — kids with sand empires, parents dozing under umbrellas. The main activity? Swimming until your lips turned blue.\n\nThese days, it's a completely different story. The parasols turned into beach cafes with ocean-view seats, and surfing schools stand where the tube rentals were. Compared to the old days, the visitors changed too: fewer screaming kids, way more couples hunting for the perfect photo. Honestly, half the beach comes for the camera now — swimming is almost optional!\n\nI have to admit, today's beaches are prettier and far more comfortable — I do love my beachside hand-drip. But sometimes I miss the old soundtrack: less shutter clicks, more kids screaming at the waves, if you ask me.", "koQ": "어렸을 때 갔던 해변과 요즘 해변을 비교해주세요. 시설, 방문객, 즐길 거리는 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 해변이 아름답게 단순했어요. 시설이라곤 빌린 파라솔, 튜브, 그리고 없는 게 없는 매점 하나가 전부였죠. 방문객은 우리 같은 가족들이었어요. 모래 제국을 짓는 아이들, 파라솔 아래서 조는 부모들이요. 주된 즐길 거리요? 입술이 파래질 때까지 수영하는 거였죠.\n\n요즘은 완전히 다른 이야기예요. 파라솔은 오션뷰 좌석의 해변 카페로 변했고, 튜브 대여점 자리엔 서핑 스쿨이 서 있어요. 예전과 비교하면 방문객도 달라졌어요. 소리 지르는 아이들은 줄고, 완벽한 사진을 사냥하는 커플들이 훨씬 많아졌죠. 솔직히 이젠 해변의 절반은 카메라 때문에 와요. 수영은 거의 선택 사항이에요!\n\n인정할 건 인정해야죠. 요즘 해변이 더 예쁘고 훨씬 편해요. 저도 해변 핸드드립을 사랑하고요. 근데 가끔은 옛날 사운드트랙이 그리워요. 제 생각엔, 셔터 소리는 줄고 파도에 소리 지르는 아이들이 더 많던 그 소리요.", "struct": [["1️⃣ 과거", "파라솔 · 튜브 · 매점 하나"], ["2️⃣ 장면", "입술 파래지는 수영"], ["3️⃣ 현재", "해변 카페 · 서핑 스쿨"], ["4️⃣ 방문객", "아이들 → 사진 커플"], ["5️⃣ 마무리", "옛 사운드트랙 그리움"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["parasol", "파라솔"], ["doze", "졸다"], ["until your lips turned blue", "입술이 파래질 때까지"], ["completely different story", "완전히 다른 이야기"], ["surfing school", "서핑 스쿨"], ["hunt for the perfect photo", "인생샷 사냥"], ["optional", "선택 사항인"], ["soundtrack", "사운드트랙"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-075 15. 해변(Beach)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-075 15. 해변(Beach)_비교.mp3"}, {"id": "2-076", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "묘사", "badge": "76 묘사", "enQ": "Describe how the recycling system works in your country. What items do people recycle, and what is special about the system? Tell me in detail.", "enA": "Oh, you picked the right country — Korea takes recycling very seriously. It's not a suggestion here; it's practically a civic duty, and honestly, a bit of a national talent.\n\nSo how does it work? We sort everything: paper, plastic, glass, cans — each into its own bin. Food waste gets its own special bag, and general trash goes into pay-per-volume bags, so the more you throw away, the more you pay. Smart, right? The newest rule is my favorite: clear plastic bottles get their own bin, labels peeled off, caps separate.\n\nWhat's special? The peer pressure — I mean, the teamwork! Every apartment has a recycling station, neighbors sort side by side, and newcomers learn fast. As we like to joke: when you move to Korea, your first exam is trash day. That's pretty much our system!", "koQ": "당신의 나라의 재활용 시스템이 어떻게 운영되는지 설명해주세요. 사람들은 어떤 물품을 재활용하고, 그 시스템의 특별한 점은 무엇인가요? 자세히 말해주세요.", "koA": "오, 나라 하나는 제대로 고르셨네요. 한국은 재활용을 아주 진지하게 대하거든요. 여기서 재활용은 권유가 아니라 사실상 시민의 의무예요. 그리고 솔직히, 약간의 국가적 재능이기도 하죠.\n\n어떻게 운영되냐면, 우리는 전부 다 분류해요. 종이, 플라스틱, 유리, 캔을 각자의 수거함에요. 음식물 쓰레기는 전용 봉투가 따로 있고, 일반 쓰레기는 종량제 봉투에 담아요. 많이 버릴수록 많이 내는 거죠. 똑똑하지 않나요? 최신 규칙이 제 최애예요. 투명 페트병은 라벨을 떼고 뚜껑을 분리해서 전용 수거함에 넣거든요.\n\n특별한 점이요? 동료 압박 — 아니, 팀워크요! 아파트마다 분리수거장이 있어서 이웃들이 나란히 서서 분류하고, 새 이웃은 빠르게 배우게 돼요. 우리끼리 하는 농담처럼, 한국에 이사 오면 첫 시험은 분리수거 날이에요. 이게 우리 시스템이에요!", "struct": [["1️⃣ 선언", "재활용 = 시민의 의무"], ["2️⃣ 품목", "종이 · 플라스틱 · 유리 · 캔"], ["3️⃣ 특징", "종량제 + 음식물 전용 봉투"], ["4️⃣ 최신", "투명 페트 라벨 · 뚜껑 분리"], ["5️⃣ 마무리", "첫 시험은 분리수거 날"]], "expr": [["take ~ seriously", "~을 진지하게 대하다"], ["civic duty", "시민의 의무"], ["sort", "분류하다"], ["pay-per-volume", "종량제"], ["peel off", "떼어내다"], ["peer pressure", "동료 압박"], ["side by side", "나란히"], ["newcomer", "새로 온 사람"], ["trash day", "분리수거 날"], ["national talent", "국가적 재능"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-076 16. 재활용(Recycling)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-076 16. 재활용(Recycling)_묘사.mp3"}, {"id": "2-077", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "습관", "badge": "77 습관", "enQ": "How do you recycle at home? How often do you take out the recyclables, and where do you put them? Describe each step of your recycling routine.", "enA": "I have a whole assembly line at home — let me walk you through it. Step one happens at the sink: every bottle and container gets a quick rinse right after use. My golden rule: if it's dirty, it's not recycling, it's just trash in disguise!\n\nStep two is my four-bin corner next to the fridge: paper, plastic, cans-and-glass, and a special little box for clear bottles — labels peeled, caps off, bodies crushed flat. Then comes step three: every Tuesday evening, I carry everything down to the recycling station on my way out for my jog. Two birds, one stone!\n\nThe whole trip takes ten minutes, and I always come back with empty hands and a light heart. Sort, rinse, Tuesday — that's pretty much my system, and weirdly enough, it never gets old.", "koQ": "집에서 어떻게 재활용을 하나요? 얼마나 자주 재활용품을 내놓고, 어디에 버리나요? 재활용 루틴의 각 단계를 설명해주세요.", "koA": "저희 집엔 조립 라인이 하나 있어요. 차근차근 보여드릴게요. 1단계는 싱크대에서 일어나요. 모든 병과 용기는 쓰자마자 바로 헹궈요. 저의 황금률은, 더러우면 재활용이 아니라 변장한 쓰레기다예요!\n\n2단계는 냉장고 옆 4칸 코너예요. 종이, 플라스틱, 캔과 유리, 그리고 투명 페트병 전용 작은 상자죠. 라벨 떼고, 뚜껑 빼고, 몸통은 납작하게 찌그러뜨려서요. 그리고 3단계. 매주 화요일 저녁, 조깅하러 나가는 길에 전부 들고 내려가서 분리수거장에 버려요. 일석이조죠!\n\n전체 과정은 10분이면 끝나고, 저는 늘 빈손과 가벼운 마음으로 돌아와요. 분류, 헹굼, 화요일. 이게 제 시스템이고, 이상하게도 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "집안의 조립 라인 비유"], ["2️⃣ 1단계", "쓰자마자 싱크대 헹굼"], ["3️⃣ 2단계", "냉장고 옆 4칸 분리 코너"], ["4️⃣ 3단계", "화요일 조깅길에 배출"], ["5️⃣ 마무리", "분류 · 헹굼 · 화요일"]], "expr": [["assembly line", "조립 라인"], ["let me walk you through", "차근차근 설명하다"], ["rinse", "헹구다"], ["golden rule", "황금률"], ["trash in disguise", "변장한 쓰레기"], ["crush flat", "납작하게 찌그러뜨리다"], ["on my way out", "나가는 길에"], ["Two birds, one stone!", "일석이조"], ["empty hands, light heart", "빈손과 가벼운 마음"], ["weirdly enough", "이상하게도"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-077 16. 재활용(Recycling)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-077 16. 재활용(Recycling)_습관.mp3"}, {"id": "2-078", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "취향", "badge": "78 취향", "enQ": "Which items do you pay the most attention to when recycling, and why? What do you think is the most important part of recycling? Tell me your thoughts.", "enA": "If I had to choose, clear plastic bottles get my full attention — no contest. My water and soda bottles go through a whole spa routine: label peeled, cap off, body rinsed and crushed. It's a three-step ceremony!\n\nWhy them? Because clear plastic is the star student of recycling — it can actually become new bottles, even clothing fiber. Don't get me wrong, I sort everything carefully. But with clear bottles, one lazy label can ruin the whole batch, so the small steps really matter. That's exactly why I think the most important part of recycling isn't the sorting — it's the prep: a quick rinse before anything goes in the bin.\n\nMy little philosophy? Recycling isn't throwing away — it's sending things back to work. In a nutshell: a clean bottle gets a second life; a dirty one just gets a funeral.", "koQ": "재활용할 때 어떤 품목에 가장 신경을 쓰고, 그 이유는 무엇인가요? 재활용에서 가장 중요한 부분이 무엇이라고 생각하나요? 당신의 생각을 말해주세요.", "koA": "골라야 한다면 투명 페트병에 제일 신경 써요. 고민할 것도 없죠. 제 물병과 음료수병은 스파 코스를 통째로 거쳐요. 라벨 떼고, 뚜껑 빼고, 몸통 헹구고 찌그러뜨리고. 3단계 의식이라니까요!\n\n왜 페트병이냐고요? 투명 플라스틱은 재활용계의 모범생이거든요. 진짜로 새 병이 되고, 심지어 옷의 섬유도 될 수 있어요. 오해는 마세요. 저는 전부 다 신경 써서 분류해요. 근데 투명 페트는 게으른 라벨 하나가 전체를 망칠 수 있어서, 작은 단계들이 정말 중요해요. 그래서 저는 재활용에서 가장 중요한 부분이 분류가 아니라 준비라고 생각해요. 수거함에 넣기 전의 재빠른 헹굼이요.\n\n저의 작은 철학이요? 재활용은 버리기가 아니라 다시 일하러 보내기예요. 한마디로, 깨끗한 병은 두 번째 삶을 얻고, 더러운 병은 그냥 장례식을 치러요.", "struct": [["1️⃣ 선택", "투명 페트병, no contest"], ["2️⃣ 의식", "라벨 · 뚜껑 · 헹굼 · 압착"], ["3️⃣ 이유", "새 병 · 옷 섬유가 되는 모범생"], ["4️⃣ 핵심", "중요한 건 분류보다 준비"], ["5️⃣ 명언", "버리기 아닌 돌려보내기"]], "expr": [["if I had to choose", "골라야 한다면"], ["pay attention to ~", "~에 신경 쓰다"], ["spa routine", "스파 코스"], ["star student", "모범생"], ["clothing fiber", "옷 섬유"], ["Don't get me wrong", "오해는 마세요"], ["ruin the whole batch", "전체를 망치다"], ["prep", "준비, 사전 작업"], ["send things back to work", "다시 일하러 보내다"], ["second life", "두 번째 삶"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-078 16. 재활용(Recycling)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-078 16. 재활용(Recycling)_취향.mp3"}, {"id": "2-079", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "과거 경험", "badge": "79 과거 경험", "enQ": "Tell me about a memorable experience you had while recycling. What happened, and how did you deal with it? Why was it special?", "enA": "This reminds me of my very first trash day after moving into my current place. I walked down to the recycling station feeling confident — and froze. Six different bins, signs everywhere, and my bag of mixed-up recyclables suddenly felt like a failed exam.\n\nWhile I stood there panicking, out of nowhere, the elderly gentleman from next door appeared with his perfectly sorted cart. Without a word, he gave me a full demonstration: bottle caps here, labels there, boxes flattened just so. A complete masterclass! I followed along like a nervous student, and guess what — I passed.\n\nHow did I deal with it? I simply accepted the help and said thank you about ten times. It worked out fine — and it was special because that's how I met my neighbors. Since then, Tuesdays mean a little chat with the old couple next door!", "koQ": "재활용을 하면서 겪은 기억에 남는 경험에 대해 말해주세요. 무슨 일이 있었고, 어떻게 대처했나요? 왜 그것이 특별했나요?", "koA": "지금 집으로 이사 온 뒤 첫 분리수거 날이 떠오르네요. 자신만만하게 분리수거장으로 내려갔다가, 그대로 얼어붙었어요. 수거함이 여섯 개에, 사방이 안내문이고, 뒤죽박죽 섞인 제 재활용품 봉투가 갑자기 낙제한 시험지처럼 느껴지더라고요.\n\n제가 서서 허둥대고 있는데, 난데없이 옆집 할아버지가 완벽하게 분류된 카트를 끌고 나타나셨어요. 그리고 말없이 풀코스 시범을 보여주셨죠. 병뚜껑은 여기, 라벨은 저기, 상자는 이렇게 납작하게. 완전한 마스터클래스였어요! 저는 긴장한 학생처럼 따라 했고, 있잖아요, 합격했어요.\n\n어떻게 대처했냐고요? 그냥 도움을 받아들이고 감사하다는 말을 열 번쯤 했어요. 결국 다 잘 풀렸고, 특별했던 이유는 그렇게 이웃을 만났기 때문이에요. 그 뒤로 화요일은 옆집 노부부와의 짧은 수다 시간이 됐어요!", "struct": [["1️⃣ 상황", "이사 후 첫 분리수거 날"], ["2️⃣ 위기", "수거함 6개 앞에서 얼음"], ["3️⃣ 반전", "옆집 할아버지의 시범"], ["4️⃣ 대처", "도움 수용 + 감사 열 번"], ["5️⃣ 특별", "재활용이 맺어준 이웃"]], "expr": [["this reminds me of", "~이 떠오르다"], ["freeze", "얼어붙다"], ["mixed-up", "뒤죽박죽인"], ["failed exam", "낙제한 시험지"], ["out of nowhere", "난데없이"], ["demonstration", "시범"], ["flattened", "납작해진"], ["masterclass", "마스터클래스"], ["guess what", "있잖아요, 세상에"], ["work out fine", "잘 풀리다"], ["since then", "그 이후로"]], "audio": "audio/2_돌발/2-079 16. 재활용(Recycling)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-079 16. 재활용(Recycling)_과거 경험.mp3"}, {"id": "2-080", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "비교", "badge": "80 비교", "enQ": "Compare recycling today with recycling in the past. How have the rules and the items people recycle changed over the years? Tell me about the differences.", "enA": "Back then, when I was little, recycling used to be beautifully simple — maybe too simple. Newspapers in one pile, bottles in another, and honestly, plenty of things just went into one big bag, no questions asked.\n\nThese days, it's a completely different story. The rules got serious: clear bottles separate from colored ones, labels off, caps off, food containers rinsed. The item list keeps growing too — batteries, light bulbs, even small electronics have their own boxes now. Compared to the old days, recycling went from a rough sport to an exact science — and the referees are your neighbors!\n\nI have to admit, the old way was easier on lazy days. But here's what I genuinely like: the kids downstairs sort better than adults did twenty years ago. The rules got stricter — and honestly, so did our conscience. That's progress, if you ask me.", "koQ": "오늘날의 재활용과 과거의 재활용을 비교해주세요. 시간이 지나며 규칙과 재활용 품목은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 제가 어릴 때 재활용은 아름답게 단순했어요. 어쩌면 너무 단순했죠. 신문은 이쪽 더미, 병은 저쪽 더미. 그리고 솔직히 많은 것들이 아무 질문 없이 큰 봉투 하나에 들어갔어요.\n\n요즘은 완전히 다른 이야기예요. 규칙이 진지해졌죠. 투명 병은 색깔 병과 분리하고, 라벨 떼고, 뚜껑 빼고, 음식 용기는 헹구고요. 품목 목록도 계속 늘어나요. 건전지, 전구, 심지어 소형 가전까지 이제 전용 수거함이 있어요. 예전과 비교하면 재활용은 거친 스포츠에서 정밀 과학이 됐어요. 그리고 심판은 이웃들이죠!\n\n인정할 건 인정해야죠. 게으른 날엔 옛날 방식이 편했어요. 근데 진심으로 좋아하는 점이 있어요. 아랫집 아이들이 20년 전 어른들보다 분류를 잘해요. 규칙이 엄격해진 만큼 양심도 엄격해졌죠. 제 생각엔 그게 발전이에요.", "struct": [["1️⃣ 과거", "큰 봉투 하나, 질문 없음"], ["2️⃣ 현재", "투명 분리 · 라벨 · 전용함"], ["3️⃣ 비유", "거친 스포츠 → 정밀 과학"], ["4️⃣ 장면", "아이들이 어른보다 잘함"], ["5️⃣ 마무리", "규칙과 양심이 함께 성장"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["no questions asked", "아무 질문 없이"], ["completely different story", "완전히 다른 이야기"], ["get serious", "진지해지다"], ["compared to ~", "~과 비교하면"], ["rough sport → exact science", "스포츠 → 과학"], ["referee", "심판"], ["conscience", "양심"], ["progress", "발전"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-080 16. 재활용(Recycling)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-080 16. 재활용(Recycling)_비교.mp3"}, {"id": "2-081", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "묘사", "badge": "81 묘사", "enQ": "Describe a piece of furniture you bought recently. What does it look like, and where did you buy it? Why did you get it?", "enA": "That's an easy one — a couple of months ago, I finally bought a small wooden side table for my gray sofa. It's a simple round one, about knee-high, in a warm walnut color with slim little legs. Nothing fancy, but it looks like it was born to stand next to that sofa.\n\nWhere did I get it? At the furniture floor of the mall near the station — I went in for jeans, and guess what, I came out with a table instead. Classic me! It was on display right at the entrance, and honestly, it was love at first sight.\n\nWhy did I get it? Pure necessity: my sofa evenings run on tea, books, and my phone, and they all used to live on the floor. Now everything has a home within arm's reach. Small table, big upgrade — that's pretty much my latest furniture story.", "koQ": "최근에 산 가구를 묘사해주세요. 어떻게 생겼고, 어디에서 샀나요? 왜 그것을 구매했나요?", "koA": "쉬운 질문이네요. 두어 달 전에 드디어 회색 소파 옆에 둘 작은 원목 사이드 테이블을 샀어요. 무릎 높이쯤 오는 심플한 원형인데, 따뜻한 월넛 색에 가느다란 다리가 달렸어요. 화려할 건 없지만, 그 소파 옆에 서 있으려고 태어난 것처럼 생겼죠.\n\n어디서 샀냐고요? 역 근처 쇼핑몰 가구 층에서요. 청바지 사러 들어갔다가, 있잖아요, 테이블을 들고 나왔어요. 정말 저다운 일이죠! 입구 바로 앞에 진열되어 있었는데, 솔직히 첫눈에 반했어요.\n\n왜 샀냐고요? 순수한 필요 때문이에요. 제 소파 저녁은 차, 책, 폰으로 돌아가는데, 그것들이 전부 바닥에 살고 있었거든요. 이제는 모든 게 팔 뻗으면 닿는 곳에 자기 집이 생겼어요. 작은 테이블, 큰 업그레이드. 이게 저의 최신 가구 이야기예요.", "struct": [["1️⃣ 선언", "소파 옆 원목 사이드 테이블"], ["2️⃣ 묘사", "원형 · 무릎 높이 · 월넛"], ["3️⃣ 장소", "역 쇼핑몰, 청바지 대신"], ["4️⃣ 이유", "차 · 책 · 폰의 새 집"], ["5️⃣ 마무리", "작은 테이블, 큰 업그레이드"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["side table", "사이드 테이블"], ["knee-high", "무릎 높이의"], ["walnut", "월넛 (색)"], ["born to stand next to ~", "~ 옆에 서려고 태어난"], ["guess what", "있잖아요, 세상에"], ["Classic me!", "정말 저다운 일!"], ["love at first sight", "첫눈에 반함"], ["within arm's reach", "팔 뻗으면 닿는"], ["run on ~", "~으로 돌아가다"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-081 17. 가구(Furniture)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-081 17. 가구(Furniture)_묘사.mp3"}, {"id": "2-082", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "습관", "badge": "82 습관", "enQ": "How do you usually take care of the furniture in your home? How often do you clean or rearrange it? Tell me about your furniture care routine.", "enA": "My furniture care is simple but loyal — let me walk you through it. Every Saturday morning, before my coffee gets cold, I do a quick dust patrol: shelves, the TV stand, and my new side table all get a wipe-down. Ten minutes, done.\n\nThe sofa gets special treatment, of course — it's the family VIP. Once a week I flip and fluff the cushions so it doesn't develop a permanent dent shaped exactly like me! And my golden rule for the wooden table: any spill gets wiped on the spot — tea rings are tattoos, they never leave.\n\nAs for rearranging, twice a year: every spring and fall, I shift the sofa angle and move some small things around. It costs nothing, but the whole room feels brand-new. Dust weekly, flip weekly, rearrange seasonally — that's pretty much it, and it never gets old.", "koQ": "집에 있는 가구를 보통 어떻게 관리하나요? 얼마나 자주 닦거나 재배치하나요? 당신의 가구 관리 루틴에 대해 말해주세요.", "koA": "제 가구 관리는 단순하지만 충직해요. 차근차근 보여드릴게요. 매주 토요일 아침, 커피가 식기 전에 재빠른 먼지 순찰을 돌아요. 선반, TV 장식장, 그리고 새 사이드 테이블까지 전부 닦아줘요. 10분이면 끝나죠.\n\n소파는 물론 특별 대우예요. 우리 집 VIP니까요. 일주일에 한 번 쿠션을 뒤집고 두들겨서, 정확히 제 모양으로 파인 영구 자국이 생기지 않게 해요! 그리고 원목 테이블에 대한 저의 황금률은, 흘린 건 그 자리에서 바로 닦기예요. 찻잔 자국은 문신이거든요. 절대 안 지워져요.\n\n재배치는 일 년에 두 번이에요. 봄가을마다 소파 각도를 바꾸고 작은 것들을 옮겨요. 돈 한 푼 안 들지만 방 전체가 새것처럼 느껴지죠. 먼지는 매주, 쿠션도 매주, 재배치는 계절마다. 이게 다예요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "단순하지만 충직한 관리"], ["2️⃣ 매주", "토요일 아침 먼지 순찰"], ["3️⃣ 소파", "VIP — 쿠션 뒤집기"], ["4️⃣ 규칙", "흘리면 그 자리에서 닦기"], ["5️⃣ 계절", "봄가을 배치 바꾸기"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["dust patrol", "먼지 순찰"], ["wipe-down", "닦아내기"], ["flip and fluff", "뒤집고 두들기다"], ["permanent dent", "영구 자국"], ["golden rule", "황금률"], ["on the spot", "그 자리에서 바로"], ["Tea rings are tattoos.", "찻잔 자국은 문신"], ["brand-new", "새것 같은"], ["seasonally", "계절마다"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-082 17. 가구(Furniture)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-082 17. 가구(Furniture)_습관.mp3"}, {"id": "2-083", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "취향", "badge": "83 취향", "enQ": "What is your favorite piece of furniture at home, and why do you like it? Tell me about it in detail.", "enA": "If I had to choose, it's my gray sofa — no contest. If my home were a movie, that sofa would be the lead actor: three seats wide, soft fabric, deep enough to swallow you whole. It sits right across from the TV, with my new side table standing guard beside it.\n\nWhy do I love it? Because everything good in my day ends there. For me, it's all about that landing moment: after the jog, after the shower, I sink into my spot — the left corner, of course, which by now has memorized my shape. YouTube, my cooking show, naps, long calls with my best friend — that sofa hosts them all.\n\nHonestly, it's less furniture and more family. Nothing beats that first sink after a long day. In a nutshell: chairs are for sitting, beds are for sleeping — but my sofa is for living.", "koQ": "집에서 가장 좋아하는 가구는 무엇이고, 왜 그것을 좋아하나요? 그것에 대해 자세히 말해주세요.", "koA": "골라야 한다면 회색 소파예요. 고민할 것도 없죠. 우리 집이 영화라면 그 소파가 주연 배우예요. 3인용 너비에, 부드러운 패브릭, 사람을 통째로 삼킬 만큼 깊숙하죠. TV 정면에 자리 잡고 있고, 옆엔 새 사이드 테이블이 보초를 서요.\n\n왜 좋아하냐고요? 제 하루의 좋은 것들이 전부 거기서 끝나거든요. 저한테 핵심은 그 착지의 순간이에요. 조깅 후에, 샤워 후에, 제 자리에 푹 가라앉는 순간이요. 당연히 왼쪽 구석 자리인데, 이젠 제 모양을 다 외웠을 정도예요. 유튜브, 요리 쇼, 낮잠, 절친과의 긴 통화까지. 그 소파가 다 받아줘요.\n\n솔직히 가구라기보단 가족에 가까워요. 긴 하루 끝의 그 첫 착지만 한 게 없죠. 한마디로, 의자는 앉는 곳이고 침대는 자는 곳이지만, 제 소파는 사는 곳이에요.", "struct": [["1️⃣ 선택", "회색 소파, no contest"], ["2️⃣ 묘사", "3인용 · 패브릭 · TV 정면"], ["3️⃣ 핵심", "하루가 착지하는 자리"], ["4️⃣ 디테일", "내 모양 외운 왼쪽 구석"], ["5️⃣ 명언", "소파는 사는 곳이다"]], "expr": [["if I had to choose", "골라야 한다면"], ["lead actor", "주연 배우"], ["swallow you whole", "통째로 삼키다"], ["stand guard", "보초를 서다"], ["landing moment", "착지의 순간"], ["sink into ~", "~에 푹 가라앉다"], ["memorize my shape", "내 모양을 외우다"], ["host", "받아주다, 열어주다"], ["less A, more B", "A라기보단 B"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-083 17. 가구(Furniture)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-083 17. 가구(Furniture)_취향.mp3"}, {"id": "2-084", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "과거 경험", "badge": "84 과거 경험", "enQ": "Tell me about a problem you have had with your furniture. Was it broken or damaged? What happened, and how did you solve it? Tell me from beginning to end.", "enA": "This reminds me of the great sofa crisis of last year. It started small: a tiny creak whenever I sat down. I ignored it for weeks — classic mistake — until one evening, I did my usual happy landing and the whole left side tilted with a loud crack. One of the legs had given up on me!\n\nMy emergency fix was not my proudest moment: I slid a stack of old books under the corner and lived like that for three days. But then I did what I always do — I opened YouTube, typed 'sofa leg repair', and found a five-minute video. Guess what: one new leg, one screwdriver, and thirty careful minutes later, my sofa stood proud again.\n\nIt worked out fine, and the repair cost less than a chicken dinner! Since then, two things changed: I have a real toolbox now, and I never ignore a creak — furniture whispers before it breaks down, you know.", "koQ": "가구와 관련해 겪은 문제에 대해 말해주세요. 부러졌거나 손상되었나요? 무슨 일이 있었고, 어떻게 해결했나요? 처음부터 끝까지 말해주세요.", "koA": "작년의 대소파 위기가 떠오르네요. 시작은 사소했어요. 앉을 때마다 나는 작은 삐걱 소리요. 몇 주를 무시했죠. 전형적인 실수예요. 그러다 어느 저녁, 여느 때처럼 행복한 착지를 했는데 왼쪽 전체가 큰 소리와 함께 기울어졌어요. 다리 하나가 저를 포기해버린 거죠!\n\n제 응급 처치는 자랑스러운 순간은 아니었어요. 구석에 헌 책 더미를 밀어 넣고 사흘을 그렇게 살았거든요. 그러다 늘 하던 대로 했죠. 유튜브를 열고 소파 다리 수리를 검색했더니 5분짜리 영상이 나왔어요. 있잖아요, 새 다리 하나, 드라이버 하나, 그리고 조심스러운 30분 뒤에 제 소파는 다시 당당하게 섰어요.\n\n결국 다 잘 풀렸고, 수리비는 치킨 한 마리보다 쌌어요! 그 뒤로 두 가지가 변했어요. 이제 진짜 공구함이 생겼고, 삐걱 소리를 절대 무시하지 않아요. 가구는 무너지기 전에 속삭이거든요.", "struct": [["1️⃣ 발단", "무시한 작은 삐걱 소리"], ["2️⃣ 위기", "착지 순간 왼쪽 붕괴"], ["3️⃣ 응급", "책 더미 받침 사흘"], ["4️⃣ 해결", "유튜브 5분 영상 + 드라이버"], ["5️⃣ 교훈", "가구는 무너지기 전 속삭인다"]], "expr": [["this reminds me of", "~이 떠오르다"], ["creak", "삐걱 (소리)"], ["tilt", "기울다"], ["give up on me", "나를 포기하다"], ["emergency fix", "응급 처치"], ["not my proudest moment", "자랑스럽진 않은 순간"], ["screwdriver", "드라이버"], ["stand proud", "당당하게 서다"], ["guess what", "있잖아요, 세상에"], ["work out fine", "잘 풀리다"], ["break down", "고장 나다, 무너지다"]], "audio": "audio/2_돌발/2-084 17. 가구(Furniture)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-084 17. 가구(Furniture)_과거 경험.mp3"}, {"id": "2-085", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "비교", "badge": "85 비교", "enQ": "Compare the furniture in your home now with the furniture from your childhood home. How have furniture styles and materials changed? Tell me in detail.", "enA": "Back then, furniture used to be heavy — physically and emotionally! Our home had a huge dark-wood wardrobe, my mom's pride, decorated with mother-of-pearl. Moving it took three adults, so nobody ever moved it. Furniture was bought once and kept for life.\n\nThese days, it's a completely different story. My furniture is light in every sense: pale wood, soft fabric, slim metal legs. Half of it arrived in flat boxes I assembled myself, hex key in hand. Compared to my mom's wardrobe, my bookshelf is basically paper — but I can rearrange my whole room in one afternoon, alone.\n\nI have to admit, though: her wardrobe outlived three of my bookshelves and still looks royal. We traded permanence for freedom, I guess. My furniture moves with me — hers was the house itself, if you ask me.", "koQ": "지금 집에 있는 가구와 어린 시절 집에 있던 가구를 비교해주세요. 가구의 스타일과 소재는 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 가구가 무거웠어요. 물리적으로도 정서적으로도요! 우리 집엔 엄마의 자랑이던 거대한 짙은 원목 장롱이 있었는데, 자개로 장식되어 있었죠. 옮기려면 어른 셋이 필요해서 아무도 절대 안 옮겼어요. 그 시절 가구는 한 번 사서 평생 쓰는 거였죠.\n\n요즘은 완전히 다른 이야기예요. 제 가구는 모든 의미에서 가벼워요. 밝은 원목, 부드러운 패브릭, 가느다란 금속 다리. 절반은 납작한 박스로 도착해서 제가 작은 육각 렌치로 직접 조립했어요. 엄마의 장롱과 비교하면 제 책장은 사실상 종이죠. 근데 저는 오후 한나절이면 혼자서 방 전체를 재배치할 수 있어요.\n\n그래도 인정할 건 인정해야죠. 엄마의 장롱은 제 책장 세 개보다 오래 살았고 여전히 위엄이 넘쳐요. 우리는 영속성을 자유와 맞바꾼 것 같아요. 제 가구는 저와 함께 움직이지만, 제 생각엔 엄마의 가구는 집 그 자체였어요.", "struct": [["1️⃣ 과거", "자개 장롱, 어른 셋의 무게"], ["2️⃣ 상징", "한 번 사서 평생 쓰기"], ["3️⃣ 현재", "밝은 원목 · 조립식 · 경량"], ["4️⃣ 대비", "영속성 vs 자유"], ["5️⃣ 마무리", "내 가구는 나와 움직인다"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["wardrobe", "장롱, 옷장"], ["mother-of-pearl", "자개"], ["for life", "평생 쓰는"], ["completely different story", "완전히 다른 이야기"], ["flat box", "납작한 박스"], ["hex key", "육각 렌치"], ["compared to ~", "~과 비교하면"], ["outlive", "~보다 오래 살다"], ["trade A for B", "A를 B와 맞바꾸다"]], "audio": "audio/2_돌발/2-085 17. 가구(Furniture)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-085 17. 가구(Furniture)_비교.mp3"}, {"id": "2-086", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "묘사", "badge": "86 묘사", "enQ": "What kinds of chores do you have at home? Tell me about the housework you are responsible for in detail.", "enA": "Well, I live alone, so here's the funny truth: I'm responsible for everything — I'm the cook, the cleaner, the laundry staff, and the recycling department, all in one person. A one-person company, basically!\n\nPicture this as my weekly lineup: cooking almost every evening — that's the fun department. Dishes right after dinner, because my golden rule says a sink should sleep empty. Laundry twice a week, and every Saturday morning, my dust patrol across the shelves and my gray sofa. And of course, Tuesday is recycling night — sorted, rinsed, and carried out on my way to jog.\n\nThe hardest part isn't any single chore — it's that nobody else is coming! But honestly, keeping my small home running smoothly gives me a quiet kind of pride. That's pretty much my job list as the CEO of this apartment.", "koQ": "집에서 맡고 있는 집안일에는 어떤 것들이 있나요? 당신이 담당하는 집안일에 대해 자세히 말해주세요.", "koA": "음, 저는 혼자 살아서 재미있는 진실이 하나 있어요. 제가 모든 걸 담당해요. 요리사, 청소부, 세탁 담당, 재활용 부서까지 전부 한 사람이죠. 한마디로 1인 기업이에요!\n\n제 주간 라인업을 상상해보세요. 요리는 거의 매일 저녁이에요. 그건 즐거운 부서죠. 설거지는 저녁 직후예요. 싱크대는 비운 채 재워야 한다는 저의 황금률 때문에요. 빨래는 주 2회, 그리고 토요일 아침마다 선반과 회색 소파를 도는 먼지 순찰. 물론 화요일은 재활용의 밤이에요. 분류하고, 헹구고, 조깅 가는 길에 들고 나가죠.\n\n가장 힘든 부분은 어떤 특정 집안일이 아니라, 아무도 대신 와주지 않는다는 거예요! 그래도 솔직히, 제 작은 집이 매끄럽게 돌아가게 하는 건 조용한 자부심을 줘요. 이게 이 아파트의 CEO로서 제 업무 목록이에요.", "struct": [["1️⃣ 선언", "1인 가구 = 전 부서 담당"], ["2️⃣ 요리", "매일 저녁, 즐거운 부서"], ["3️⃣ 규칙", "싱크대는 비운 채 재우기"], ["4️⃣ 주간", "빨래 주 2회 · 토요 순찰"], ["5️⃣ 마무리", "아파트의 CEO 자부심"]], "expr": [["be responsible for ~", "~을 담당하다"], ["one-person company", "1인 기업"], ["Picture this:", "상상해보세요"], ["lineup", "라인업"], ["golden rule", "황금률"], ["A sink should sleep empty.", "싱크대는 비워 재운다"], ["dust patrol", "먼지 순찰"], ["on my way to jog", "조깅 가는 길에"], ["run smoothly", "매끄럽게 돌아가다"], ["CEO of this apartment", "이 아파트의 CEO"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-086 18. 집안일(Chores)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-086 18. 집안일(Chores)_묘사.mp3"}, {"id": "2-087", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "습관", "badge": "87 습관", "enQ": "How does your family divide the housework? Which chores is each family member in charge of, and how do they usually do them?", "enA": "Fun fact: I belong to two households, so let me walk you through both systems. In my own place, the division is simple — me, me, and me. I split chores by day instead of by person: dishes daily, laundry midweek, cleaning on Saturdays.\n\nBut when I visit my mom's home, the old family system kicks in automatically. Mom is the head chef — nobody touches her kitchen! My job has been the same for twenty years: washing dishes and folding laundry while watching TV. And my little brother? He's the muscle team: taking out the trash, carrying anything heavy, and — his true talent — emptying the fridge.\n\nThe best part is how naturally we slip back into our old roles: mom cooks, I wash, he carries. Nobody assigns anything anymore — the system just runs itself. That's pretty much our family choreography, and it never gets old.", "koQ": "당신의 가족은 집안일을 어떻게 나누나요? 각 가족 구성원은 어떤 집안일을 담당하고, 보통 어떻게 하나요?", "koA": "재미있는 사실 하나. 저는 두 가정에 속해 있어요. 그래서 두 시스템을 차근차근 보여드릴게요. 제 집에서 분담은 간단해요. 나, 나, 그리고 나요. 대신 사람이 아니라 요일로 나눠요. 설거지는 매일, 빨래는 주중, 청소는 토요일이죠.\n\n그런데 엄마 집에 가면 옛날 가족 시스템이 자동으로 발동돼요. 엄마는 총괄 셰프예요. 아무도 엄마 주방엔 손 못 대요! 제 담당은 20년째 똑같아요. 설거지, 그리고 TV 보면서 빨래 개기죠. 남동생은요? 힘쓰기 팀이에요. 쓰레기 버리기, 무거운 거 나르기, 그리고 그의 진짜 재능인 냉장고 비우기요.\n\n제일 좋은 건 우리가 얼마나 자연스럽게 옛 역할로 돌아가느냐예요. 엄마는 요리하고, 나는 씻고, 동생은 나르고. 이제 아무도 역할을 정해주지 않아요. 시스템이 알아서 굴러가죠. 이게 우리 가족의 안무예요. 전혀 질리지 않아요.", "struct": [["1️⃣ 반전", "두 가정, 두 시스템"], ["2️⃣ 내 집", "나 · 나 · 나, 요일로 분담"], ["3️⃣ 본가", "엄마 셰프 · 나 설거지"], ["4️⃣ 동생", "힘쓰기 팀 + 냉장고 비우기"], ["5️⃣ 마무리", "알아서 굴러가는 안무"]], "expr": [["Fun fact:", "재미있는 사실은"], ["two households", "두 가정"], ["let me walk you through", "차근차근 설명하다"], ["me, me, and me", "나, 나, 그리고 나"], ["head chef", "총괄 셰프"], ["muscle team", "힘쓰기 팀"], ["empty the fridge", "냉장고를 비우다"], ["slip back into ~", "~으로 자연스레 돌아가다"], ["run itself", "알아서 굴러가다"], ["choreography", "안무"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-087 18. 집안일(Chores)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-087 18. 집안일(Chores)_습관.mp3"}, {"id": "2-088", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "취향", "badge": "88 취향", "enQ": "Which chore do you like the most, and which one do you dislike? Why do you feel that way about them? Tell me the reasons.", "enA": "Easy question, strong opinions! My favorite is cooking, no contest — because it's the only chore that ends with a reward you can eat. For me, it's all about that creative moment: same fridge, different dinner every night.\n\nAnd my least favorite? Folding laundry — I'd take a full sink of dishes over a laundry basket any day. Here's why: dishes have a clear finish line, but folding is an endless loop. Worst of all is the sock hunt: somehow the washing machine always eats exactly one sock! Don't get me wrong, I love the smell of fresh laundry. I just wish it folded itself.\n\nSo my system is simple: I fold in front of my cooking show, so the fun cancels out the boring. In a nutshell: cooking feeds my body, and TV makes folding bearable — teamwork!", "koQ": "어떤 집안일을 가장 좋아하고, 어떤 것을 싫어하나요? 왜 그렇게 느끼나요? 그 이유를 말해주세요.", "koA": "쉬운 질문, 강한 의견! 최애는 요리예요. 고민할 것도 없죠. 먹을 수 있는 보상으로 끝나는 유일한 집안일이니까요. 저한테 핵심은 그 창작의 순간이에요. 같은 냉장고인데 매일 저녁이 달라지거든요.\n\n가장 싫어하는 건요? 빨래 개기요. 빨래 바구니보다는 무조건 설거지 가득한 싱크대를 고르겠어요. 이유는 이래요. 설거지엔 명확한 결승선이 있는데, 빨래 개기는 끝없는 루프예요. 최악은 양말 사냥이에요. 세탁기가 어떻게든 꼭 한 짝만 먹어버리거든요! 오해는 마세요. 갓 마른 빨래 냄새는 사랑해요. 그냥 스스로 개졌으면 좋겠을 뿐이에요.\n\n그래서 제 시스템은 간단해요. 요리 쇼를 틀어놓고 개는 거죠. 재미가 지루함을 상쇄하니까요. 한마디로, 요리는 몸을 채우고, TV는 빨래 개기를 견딜 만하게 해줘요. 팀워크죠!", "struct": [["1️⃣ 최애", "요리 — 먹을 수 있는 보상"], ["2️⃣ 이유", "같은 냉장고, 다른 저녁"], ["3️⃣ 최악", "빨래 개기 = 끝없는 루프"], ["4️⃣ 유머", "세탁기의 양말 한 짝 식사"], ["5️⃣ 해법", "요리 쇼 틀고 개기"]], "expr": [["strong opinions", "강한 의견"], ["no contest", "고민할 것도 없이"], ["a reward you can eat", "먹을 수 있는 보상"], ["it's all about ~", "핵심은 ~이다"], ["A over B any day", "B보다 무조건 A"], ["finish line", "결승선"], ["endless loop", "끝없는 루프"], ["sock hunt", "양말 사냥"], ["Don't get me wrong", "오해는 마세요"], ["cancel out", "상쇄하다"], ["bearable", "견딜 만한"]], "audio": "audio/2_돌발/2-088 18. 집안일(Chores)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-088 18. 집안일(Chores)_취향.mp3"}, {"id": "2-089", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "과거 경험", "badge": "89 과거 경험", "enQ": "Tell me about a time when you could not finish your housework. What was the reason, and what happened as a result? Explain in detail.", "enA": "This reminds me of my great closet cleanup that never happened. One Sunday, I declared war on my closet: everything out, sort, donate, reorganize. A solid three-hour plan. Famous last words, again!\n\nAbout twenty minutes in, out of nowhere, I found a box of old treasures: my pearl folder phone, the phone strap my best friend gave me, ticket stubs, old photos. And guess what — the cleanup turned into a three-hour memory trip. I sat on the floor clicking that folder phone open and shut, texting my friend photos of everything. The result? By evening, my room looked worse than before — a total explosion of stuff!\n\nI stuffed everything back and surrendered. But it worked out fine: the next weekend I finished the job with a new rule — memories last, cleaning first! Boxes get opened only after the closet is done.", "koQ": "집안일을 끝내지 못했던 때에 대해 말해주세요. 이유가 무엇이었고, 그 결과 어떻게 되었나요? 자세히 설명해주세요.", "koA": "성사되지 못한 옷장 대청소가 떠오르네요. 어느 일요일, 저는 옷장에 전쟁을 선포했어요. 전부 꺼내고, 분류하고, 기부하고, 재정리하기. 견고한 3시간짜리 계획이었죠. 또다시, 그 말이 무색해질 줄이야!\n\n20분쯤 지났을 때, 난데없이 오래된 보물 상자를 발견했어요. 진주색 폴더폰, 절친이 준 폰줄, 티켓 조각들, 옛날 사진들. 그리고 있잖아요, 대청소가 3시간짜리 추억 여행으로 변해버렸어요. 바닥에 앉아서 폴더폰을 딸깍딸깍 여닫고, 절친한테 하나하나 사진 찍어 보내면서요. 결과요? 저녁이 되자 제 방은 청소 전보다 더 심해졌어요. 완전한 물건 폭발 현장이었죠!\n\n전부 도로 쑤셔 넣고 항복했어요. 그래도 결국 다 잘 풀렸어요. 다음 주말에 새 규칙과 함께 일을 끝냈거든요. 추억은 나중에, 청소가 먼저! 상자는 옷장이 끝난 뒤에만 열 수 있어요.", "struct": [["1️⃣ 선포", "옷장에 3시간 전쟁 선포"], ["2️⃣ 반전", "20분 만에 보물 상자 발견"], ["3️⃣ 탈선", "폴더폰 딸깍 추억 여행"], ["4️⃣ 결과", "방은 청소 전보다 폭발"], ["5️⃣ 교훈", "추억은 나중에, 청소 먼저"]], "expr": [["this reminds me of", "~이 떠오르다"], ["declare war on ~", "~에 전쟁을 선포하다"], ["Famous last words!", "그 말이 무색하게!"], ["out of nowhere", "난데없이"], ["memory trip", "추억 여행"], ["open and shut", "여닫다"], ["worse than before", "전보다 더 심한"], ["surrender", "항복하다"], ["guess what", "있잖아요, 세상에"], ["work out fine", "잘 풀리다"], ["Memories last, cleaning first.", "추억은 나중에, 청소 먼저"]], "audio": "audio/2_돌발/2-089 18. 집안일(Chores)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-089 18. 집안일(Chores)_과거 경험.mp3"}, {"id": "2-090", "cat": "unexpected", "catName": "돌발 질문", "num": 18, "topic": "집안일", "topicEn": "Chores", "type": "비교", "badge": "90 비교", "enQ": "Compare doing housework today with the past. How have chores changed with machines like robot vacuums and dishwashers? Tell me about the differences.", "enA": "Back then, in my childhood home, housework used to be a full-body, full-family event. Cleaning day meant everyone on their knees with rags, my mom hand-washing the big blankets, and the vacuum — a roaring monster you dragged around by its tail.\n\nThese days, it's a completely different story: the machines joined the family. My mom now owns a robot vacuum, and honestly she treats it like a third child — it even has a name! Dishwashers, dryers, air purifiers... Compared to the old days, chores went from doing everything to managing everything. We became supervisors: press a button, and the little robot does the kneeling for us.\n\nI have to admit, though — those all-family cleaning days had something the machines can't copy: four people, loud music, and jokes over the noise. The house got cleaner back then... and so did our mood, if you ask me.", "koQ": "오늘날의 집안일과 과거의 집안일을 비교해주세요. 로봇청소기나 식기세척기 같은 기계로 인해 집안일은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 어린 시절 집에서 집안일은 온몸으로, 온 가족이 하는 행사였어요. 청소하는 날이면 모두가 걸레를 들고 무릎을 꿇었고, 엄마는 큰 이불을 손빨래했고, 청소기는 꼬리를 잡고 끌고 다니는 으르렁거리는 괴물이었죠.\n\n요즘은 완전히 다른 이야기예요. 기계들이 가족에 합류했거든요. 엄마는 이제 로봇청소기를 갖고 계신데, 솔직히 셋째 자식처럼 대하세요. 이름까지 있다니까요! 식기세척기, 건조기, 공기청정기까지. 예전과 비교하면 집안일은 다 하는 것에서 다 관리하는 것으로 변했어요. 우리는 감독관이 된 거죠. 버튼을 누르면, 작은 로봇이 우리 대신 무릎을 꿇어요.\n\n그래도 인정할 건 인정해야죠. 그 온 가족 청소의 날엔 기계가 못 베끼는 게 있었어요. 네 사람, 시끄러운 음악, 소음 너머로 주고받던 농담이요. 그때는 집이 더 깨끗해졌고... 제 생각엔 기분도 같이 깨끗해졌어요.", "struct": [["1️⃣ 과거", "온 가족 무릎 꿇는 행사"], ["2️⃣ 소품", "으르렁대는 괴물 청소기"], ["3️⃣ 현재", "기계 가족 + 엄마의 셋째"], ["4️⃣ 대비", "다 하기 → 다 관리하기"], ["5️⃣ 마무리", "기계가 못 베끼는 농담"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["full-body, full-family", "온몸 · 온 가족의"], ["on their knees", "무릎을 꿇고"], ["roaring monster", "으르렁대는 괴물"], ["completely different story", "완전히 다른 이야기"], ["third child", "셋째 자식"], ["from doing to managing", "하기에서 관리하기로"], ["supervisor", "감독관"], ["compared to ~", "~과 비교하면"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/2_돌발/2-090 18. 집안일(Chores)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-090 18. 집안일(Chores)_비교.mp3"}, {"id": "2-091", "cat": "unexpected", "catName": "돌발 질문", "num": 19, "topic": "휴일", "topicEn": "Holidays", "type": "묘사", "badge": "91 묘사", "enQ": "Tell me about the holidays in your country. Which ones are the most important, and how do people celebrate them? Describe them in detail.", "enA": "That's an easy one — Korea runs on two giant holidays: Seollal, the Lunar New Year, and Chuseok, our harvest festival in the fall. Everything else is a day off; these two are events.\n\nHow do we celebrate? Both start the same way: the great migration. Millions of cars head to hometowns, and highways turn into parking lots — it's practically a national tradition itself! Then comes the food: for Seollal, rice cake soup, which officially makes everyone one year older, plus New Year's bows to elders. For Chuseok, half-moon rice cakes and giving thanks for the harvest under the full moon.\n\nBut if you ask me what these holidays are really about, it's simple: the whole country pressing pause at the same time to eat too much with family. That's pretty much Korean holidays in one sentence!", "koQ": "당신의 나라의 명절에 대해 말해주세요. 어떤 명절이 가장 중요하고, 사람들은 그것을 어떻게 기념하나요? 자세히 설명해주세요.", "koA": "쉬운 질문이네요. 한국은 두 개의 거대한 명절로 돌아가요. 음력 새해인 설날, 그리고 가을의 추수 명절인 추석이죠. 다른 날들은 그냥 휴일이지만, 이 둘은 행사예요.\n\n어떻게 기념하냐고요? 둘 다 똑같이 시작해요. 대이동으로요. 수백만 대의 차가 고향으로 향하고, 고속도로는 주차장이 되죠. 그것 자체가 사실상 국가 전통이에요! 그다음은 음식이에요. 설날엔 떡국인데, 먹으면 공식적으로 모두 한 살을 더 먹어요. 어른들께 드리는 세배도 있고요. 추석엔 반달 모양의 송편을 빚고, 보름달 아래서 수확에 감사하죠.\n\
