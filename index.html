<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오픽 스크립트 학습</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --bg:#f6f5f2; --surface:#ffffff; --surface2:#f1efea; --line:#e4e1da; --ink:#1d1c1a; --ink2:#5d5a53; --ink3:#8e8a81;
  --accent:#2f5bd3; --accent-soft:#e8eefc; --ok:#1f8a5b; --ok-soft:#e3f4ec; --warn:#b7791f; --warn-soft:#fbf1df;
  --star:#e0a100; --mark:#fff1b8; --now:#cfe0ff; --now-line:#2f5bd3; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  --c-survey:#2f5bd3; --c-unexpected:#c2410c; --c-roleplay:#0f8a6a; --c-advanced:#7c3aed;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#151513; --surface:#1e1e1b; --surface2:#262622; --line:#34332e; --ink:#eceae4; --ink2:#b3afa6; --ink3:#857f74;
    --accent:#7b9bff; --accent-soft:#232c45; --ok:#4cc38a; --ok-soft:#1c3328; --warn:#e3a94a; --warn-soft:#352a17;
    --star:#f5c542; --mark:#5a4a12; --now:#2c3f73; --now-line:#7b9bff; --shadow:none;
    --c-survey:#7b9bff; --c-unexpected:#fb8a5a; --c-roleplay:#3fd0a8; --c-advanced:#b394ff; }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
.wrap{max-width:1280px;margin:0 auto;padding:0 20px}

header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:14px;padding:14px 0 10px;flex-wrap:wrap}
.brand h1{font-size:19px;margin:0;font-weight:800;letter-spacing:-.02em}
.brand .sub{color:var(--ink3);font-size:13px}
.stats{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.stat{background:var(--surface2);border-radius:999px;padding:3px 11px;font-size:12.5px;color:var(--ink2);white-space:nowrap}
.stat b{color:var(--ink);font-weight:700}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.tab{border:0;background:none;padding:10px 14px 11px;font-weight:600;color:var(--ink3);border-bottom:3px solid transparent;white-space:nowrap}
.tab .cnt{font-size:12px;font-weight:500;margin-left:4px;opacity:.8}
.tab[aria-selected=true]{color:var(--ink);border-bottom-color:var(--cc)}
.filters{border-top:1px solid var(--line);padding:10px 0 12px;display:grid;grid-template-columns:52px 1fr;gap:8px 10px;align-items:start}
.flabel{font-size:12.5px;color:var(--ink3);font-weight:600;padding-top:5px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:3px 11px;font-size:13px;color:var(--ink2);line-height:1.5}
.chip:hover{border-color:var(--ink3)}
.chip[aria-pressed=true]{background:var(--cc,var(--accent));border-color:var(--cc,var(--accent));color:#fff}
.chip .n{opacity:.65;font-size:11.5px;margin-left:3px}
.topics.collapsed{max-height:31px;overflow:hidden}
.more{border:0;background:none;color:var(--accent);font-size:12.5px;padding:3px 4px}
.tools{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.search{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:4px 10px;min-width:200px;flex:1;max-width:340px}

main{display:grid;grid-template-columns:300px 1fr;gap:20px;padding-top:18px;padding-bottom:60px}
aside.list{position:sticky;top:12px;align-self:start;max-height:calc(100vh - 24px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.listhead{padding:10px 14px;font-size:12.5px;color:var(--ink3);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);display:flex;justify-content:space-between;z-index:1}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:2px 10px;align-items:center;width:100%;text-align:left;border:0;background:none;padding:9px 14px;border-bottom:1px solid var(--line)}
.item:hover{background:var(--surface2)}
.item[aria-current=true]{background:var(--accent-soft)}
.item .no{font-variant-numeric:tabular-nums;font-size:12px;color:var(--ink3);grid-row:span 2}
.item .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .ty{font-size:12px;color:var(--ink2)}
.item .marks{grid-row:span 2;display:flex;gap:5px;align-items:center;font-size:12px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--line);display:inline-block}
.dot.on{background:var(--ok)} .dot.off{background:transparent;border:1.5px solid var(--ink3)}
.empty{padding:30px 16px;color:var(--ink3);text-align:center;font-size:14px}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:20px 22px;margin-bottom:16px}
.dhead{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.crumbs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
.pill{font-size:12px;font-weight:600;border-radius:6px;padding:2px 8px;background:var(--surface2);color:var(--ink2)}
.pill.cat{background:var(--cc);color:#fff}
.dtitle{font-size:24px;font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.3}
.dtitle small{font-size:15px;color:var(--ink3);font-weight:500;margin-left:6px}
.dact{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;font-size:13.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px;line-height:1.3}
.btn:hover{border-color:var(--ink3)}
.btn.on-star{color:var(--star);border-color:var(--star)}
.btn.on-ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.rec{background:#d93b3b;border-color:#d93b3b;color:#fff}

/* sticky player */
#pcard{position:sticky;top:8px;z-index:5}
.player{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.play{width:52px;height:52px;border-radius:50%;border:0;background:var(--accent);color:#fff;display:grid;place-items:center}
.play:disabled{background:var(--ink3);cursor:not-allowed}
.play svg{width:22px;height:22px}
.prow{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--ink3);font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;border-radius:3px;background:var(--surface2);position:relative;cursor:pointer}
.bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:3px;width:0}
.pctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:4px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.notice{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:500}
.recrow{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px;display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--ink2)}
.recrow audio{height:34px;max-width:100%}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)}
.sync{font-size:11.5px;color:var(--ink3)}

.sec-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.sec-h h2{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink3);margin:0;font-weight:700}
.sec-h .right{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.q{background:var(--surface2);border-left:4px solid var(--cc);border-radius:8px;padding:12px 16px;font-size:15.5px;margin:0 0 18px}
.q{transition:background-color .2s, box-shadow .2s}
.q.speaking{background:var(--now);box-shadow:0 0 0 2px var(--now-line)}
.q .qh{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--ink3);font-weight:700;margin-bottom:4px}
.script p{margin:0 0 14px;font-size:17px;line-height:1.9}
.script.ko p{font-size:15.5px;line-height:1.8;color:var(--ink2)}
.script mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 2px}
.script.nohl mark{background:none;padding:0}
.s{border-radius:5px;padding:2px 1px;transition:background-color .18s, box-shadow .18s;cursor:pointer;-webkit-box-decoration-break:clone;box-decoration-break:clone}
.s:hover{background:var(--surface2)}
.s.now{background:var(--now);box-shadow:0 0 0 2px var(--now)}
.s.now mark{background:transparent;text-decoration:underline 2px var(--warn);text-underline-offset:3px}
.s.lock{box-shadow:0 0 0 2px var(--now-line)}
.script.hidden p{filter:blur(6px);user-select:none;transition:filter .15s}
.script.hidden p.rev{filter:none}
.meta{font-size:12.5px;color:var(--ink3)}
.fs button{min-width:30px}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.steps li{display:grid;grid-template-columns:76px 1fr;gap:10px;font-size:14px;align-items:baseline}
.steps .k{font-weight:700;color:var(--cc)}
.points{display:grid;gap:12px}
.points div b{display:block;font-size:14px}
.points div span{font-size:13.5px;color:var(--ink2)}
table.expr{width:100%;border-collapse:collapse;font-size:14px}
table.expr th{text-align:left;font-size:12px;color:var(--ink3);font-weight:700;padding:6px 10px;border-bottom:1px solid var(--line)}
table.expr td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:top}
table.expr td:first-child{font-weight:700;white-space:nowrap}
table.expr td:last-child{color:var(--ink2);font-size:13.5px}
.help{font-size:12.5px;color:var(--ink3);line-height:1.9}
kbd{font-family:inherit;font-size:11.5px;border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}

@media (max-width:900px){
  main{grid-template-columns:1fr}
  aside.list{position:static;max-height:300px}
  .grid2{grid-template-columns:1fr}
  .filters{grid-template-columns:1fr}
  .flabel{padding-top:0}
  #pcard{top:0}
}
@media (max-width:520px){
  .wrap{padding:0 16px}
  .card{padding:16px}
  .dtitle{font-size:20px}
  .script p{font-size:16px}
  table.expr td:first-child{white-space:normal}
  .steps li{grid-template-columns:64px 1fr}
}
</style>
</head>
<body>
<header class="top" id="top">
  <div class="wrap">
    <div class="brand">
      <h1>오픽 IH 실전 스크립트</h1><span class="sub">듣고 · 따라 말하고 · 외우기</span>

  <div class="wrap">
    <div class="filters">
      <div class="flabel">주제</div>
      <div><div class="chips topics collapsed" id="topics"></div><button class="more" id="moreTopics">주제 모두 보기 ▾</button></div>
      <div class="flabel">유형</div>
      <div class="chips" id="types"></div>
      <div class="flabel">보기</div>

        <input class="search" id="search" type="search" placeholder="영어·한글 검색 (예: stop by, 단골)">

      </div>
    </div>
  </div>
</header>

<main class="wrap">
  <aside class="list" id="list"></aside>
  <section id="detail"></section>
</main>

를 만나나요, 아니면 일을 하나요? 도착부터 나올 때까지의 루틴을 설명해주세요.", "koA": "네, 제 카페 루틴을 차근차근 말씀드릴게요. 도착하자마자 항상 똑같은 메뉴, 아이스 아메리카노를 주문하고 창가 자리를 잡아요. 뭐든 순서가 있는 법이잖아요?\n\n혼자일 때는 보통 책을 읽거나 노트북으로 한두 시간 일을 해요. 가끔은 폰을 치워 두고 그냥 사람 구경만 하기도 하는데, 이게 은근히 힐링이 돼요. 친구들과 만날 때는 커피 한 잔으로 몇 시간씩 수다를 떨고요.\n\n나가기 전에는 항상 테이블을 정리하고, 다른 일정이 있으면 테이크아웃 커피를 한 잔 사서 나가요. 네, 도착부터 나갈 때까지, 제 카페 루틴은 대체로 이래요.", "struct": [["1️⃣ 도입", "루틴 예고 멘트(walk you through...)"], ["2️⃣ 도착", "같은 메뉴 주문 · 창가 자리"], ["3️⃣ 혼자", "독서 · 노트북 · 사람 구경"], ["4️⃣ 친구", "수다(hang out) · 커피 한 잔으로"], ["5️⃣ 마무리", "테이블 정리 · 테이크아웃 + 정리"]], "scoring": [["도착 → 나가기 순서", "질문이 from arrival to leaving을 콕 집었어요. As soon as I get there → Before I leave 구조로 그대로 따라가 주세요 ✅"], ["혼자·친구 상황 나누기", "If I'm alone... / when I meet up with friends... 두 갈래로 나누는 건 모든 습관 문제에 통하는 필승 구조예요 🧩"], ["질문 표현 받아치기", "질문에 나온 get some work done을 답변에 그대로 쓰면 질문을 정확히 이해했다는 신호가 돼요 🎯"], ["습관 시그널 주기", "always, usually, sometimes 빈도 부사 3종 세트는 습관 답변의 기본 양념! 곳곳에 뿌려 주세요 ⏰"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요", "습관 질문 만능 오프닝! 루틴 질문은 이 표현으로 시작하세요"], ["order the same thing", "항상 같은 걸 시키다", "항상 같은 메뉴 = 루틴 느낌을 살리는 디테일 😊"], ["First things first", "순서대로 해야죠", "루틴 답변에 리듬을 주는 한마디 😊"], ["grab a seat by the window", "창가 자리를 잡다", "grab = 잡다/사다, 카페 최다 활용 동사 ✨"], ["get some work done", "일을 좀 하다", "질문에 나온 표현 그대로 받아치기! 🔁 🎯"], ["people-watch", "사람 구경하다", "카페 루틴의 킬러 디테일! 시험관도 미소 지어요 😊"], ["weirdly relaxing", "은근히 힐링되는", "weirdly = 묘하게. 원어민 느낌 UP! 😊"], ["meet up", "만나다", "meet보다 약속하고 만나는 뉘앙스가 살아요 🤝"], ["hang out for hours", "몇 시간씩 어울리다", "묘사 편 hang out의 확장판이에요 🔁"], ["a coffee to go", "테이크아웃 커피", "to go = 포장! takeout보다 원어민스러워요 🥤"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-002 1. 카페(Cafe)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-002 1. 카페(Cafe)_습관.mp3"}, {"id": "1-003", "cat": "survey", "catName": "서베이 질문", "num": 1, "topic": "카페", "topicEn": "Cafe", "type": "취향", "badge": "03 취향", "enQ": "There are many kinds of cafes these days. What kind of cafe do you prefer to visit, and why? Do you choose a cafe for its coffee, atmosphere, or location? Tell me why you like that type of cafe.", "enA": "Hmm, that's a good question. These days there are so many kinds of cafes in Korea — big franchises, study cafes, even themed cafes with cats or books. But if I had to choose, I'd definitely go for small, quiet, cozy local cafes.\n\nFor me, it's all about the atmosphere. Honestly, the coffee itself tastes similar everywhere. What really matters is whether I can relax — warm lighting, soft music, and not too many people. That's why I avoid crowded franchise cafes, especially on weekends when they're totally packed.\n\nOf course, location matters too, but I'd happily walk a bit farther for a place with a good vibe. So yeah, when it comes to cafes, I care about the mood more than the menu — that's my taste in a nutshell.", "koQ": "요즘에는 다양한 종류의 카페가 있습니다. 어떤 종류의 카페를 선호하고, 그 이유는 무엇인가요? 커피, 분위기, 위치 중 무엇을 보고 카페를 고르나요? 왜 그런 카페를 좋아하는지 말해주세요.", "koA": "음, 좋은 질문이네요. 요즘 한국에는 카페 종류가 정말 많아요. 대형 프랜차이즈, 스터디 카페, 심지어 고양이나 책 테마 카페까지요. 그래도 굳이 골라야 한다면, 저는 무조건 작고 조용하고 아늑한 동네 카페를 선택할 거예요.\n\n저한테는 분위기가 전부거든요. 솔직히 커피 맛은 어딜 가나 비슷하잖아요. 정말 중요한 건 제가 쉴 수 있느냐예요. 따뜻한 조명, 잔잔한 음악, 그리고 사람이 너무 많지 않은 곳이요. 그래서 특히 주말에 사람이 꽉 차는 프랜차이즈 카페는 피하는 편이에요.\n\n물론 위치도 중요하죠. 하지만 분위기 좋은 곳이라면 기꺼이 조금 더 걸어갈 수 있어요. 네, 카페에 관해서라면 저는 메뉴보다 분위기를 보는 사람이에요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "다양한 카페 인정 + 선택 예고"], ["2️⃣ 선택", "작고 조용한 로컬 카페(go for)"], ["3️⃣ 이유", "분위기가 전부(it's all about)"], ["4️⃣ 비선호", "꽉 찬 프랜차이즈(totally packed)"], ["5️⃣ 마무리", "위치 언급 + in a nutshell 정리"]], "scoring": [["선택 + 이유 구조", "취향 질문은 \"if I had to choose → 선택 → 이유\"의 3단만 지키면 절대 길을 잃지 않아요 🧩 오픽 취향 유형의 만능 공식!"], ["반대편도 언급하기", "좋아하는 것만 말하지 말고 \"프랜차이즈는 피해요\"처럼 반대편을 살짝 깎아 주면 취향이 훨씬 선명해져요 🎯"], ["질문 3요소 모두 터치", "질문이 커피·분위기·위치를 나열했죠? 세 가지를 다 언급하면서 하나를 고르면 완벽한 답변 구성이에요 ✅"], ["한 줄 요약 마무리", "\"that's my taste in a nutshell\"처럼 취향을 한 문장으로 정리하며 끝내면 마무리 시그널까지 자동 해결 😊"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 질문 만능 시작! 고민하는 척 여유도 UP 😊"], ["go for ~", "~을 선택하다", "choose보다 캐주얼한 구어체 동사 👍"], ["it's all about ~", "~이 전부다/핵심이다", "취향의 핵심을 한 방에 요약하는 구문 🎯"], ["atmosphere / vibe", "분위기", "묘사 편 vibe 재활용 🔁 격식/캐주얼 짝꿍"], ["That's why ~", "그래서 ~한 거예요", "이유 설명 후 결론 연결 시그널 🔗"], ["totally packed", "사람들로 꽉 찬", "'꽉 찬' 상황 단골 표현! 경험 편에서 또 나와요 🔥"], ["cozy", "아늑한", "묘사 편 cozy 재활용 🔁 😊"], ["themed cafes", "테마 카페", "다양성 언급에 딱! 비교 편에서 또 나와요 🐱"], ["happily walk a bit farther", "기꺼이 좀 더 걷다", "취향의 진심을 보여 주는 디테일 💯"], ["when it comes to ~", "~에 관해서라면", "화제 전환 만능 시그널! 어떤 주제에도 통해요"], ["in a nutshell", "한마디로 요약하면", "취향 답변 마무리 공식! 깔끔하게 끝내요 ✅"]], "audio": "audio/1_서베이/1-003 1. 카페(Cafe)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-003 1. 카페(Cafe)_취향.mp3"}, {"id": "1-004", "cat": "survey", "catName": "서베이 질문", "num": 1, "topic": "카페", "topicEn": "Cafe", "type": "과거 경험", "badge": "04 과거경험", "enQ": "Unexpected things sometimes happen at cafes. Tell me about a memorable incident you experienced at a cafe. What exactly happened, who was involved, and how did you handle it? Give me all the details.", "enA": "Oh, this reminds me of a funny incident from a few months ago. The cafe near my office was totally packed — it was a Friday afternoon. I ordered my usual iced americano and waited by the pickup counter, killing time on my phone.\n\nWhen a drink came out, I grabbed it and took a big sip — and guess what? It wasn't mine. It was someone's super-sweet caramel latte — and its owner was standing right there, watching me. I was so embarrassed, and to be honest, a little panicked too.\n\nThankfully, the staff came over right away, apologized and remade both drinks for free. We ended up laughing about it, and everything worked out fine. Since then, I've been double-checking the name on the cup every time. So yeah, that's my most memorable cafe incident.", "koQ": "카페에서는 가끔 예상치 못한 일이 일어납니다. 카페에서 겪은 기억에 남는 사건에 대해 말해주세요. 무슨 일이 있었고, 누가 연관되었으며, 어떻게 대처했나요? 모든 세부사항을 말해주세요.", "koA": "아, 몇 달 전에 있었던 웃긴 사건이 생각나네요. 회사 근처 카페였는데, 금요일 오후라 사람들로 꽉 차 있었어요. 평소처럼 아이스 아메리카노를 주문하고 픽업대 옆에서 폰을 보며 기다리고 있었죠.\n\n음료가 나와서 집어 들고 크게 한 모금 마셨는데, 세상에, 제 게 아니었어요. 어떤 분의 달디단 캐러멜 라떼였고, 그 주인분이 바로 옆에서 절 보고 계셨던 거예요. 너무 민망했고, 솔직히 살짝 당황하기도 했어요.\n\n다행히 직원분이 바로 오셔서 사과하고 두 음료를 모두 무료로 새로 만들어 주셨어요. 결국 다 같이 웃고 넘어갔고, 모든 게 잘 해결됐죠. 그 후로는 매번 컵에 적힌 이름을 꼭 확인해요. 네, 이게 제가 카페에서 겪은 가장 기억에 남는 사건이에요.", "struct": [["1️⃣ 도입", "회상 시그널 (This reminds me of...)"], ["2️⃣ 상황", "꽉 찬 카페 · 픽업 대기(killing time)"], ["3️⃣ 사건", "남의 음료 마심 · 민망(embarrassed)"], ["4️⃣ 해결", "직원 사과 · 무료 리메이크"], ["5️⃣ 마무리", "교훈(double-check) + 정리 멘트"]], "scoring": [["실수담이 최고 소재", "남의 음료를 마신 것 같은 작고 웃긴 실수담이 오픽에서는 최고의 소재예요 😆 거창한 사건보다 진짜 같은 이야기가 이깁니다!"], ["감정 롤러코스터", "embarrassed → panicked → laughing으로 감정이 움직이는 게 보여야 해요 🎢 감정 변화가 곧 스토리텔링 점수!"], ["질문 3요소 챙기기", "무슨 일(what) · 누구(who) · 대처(how)를 질문이 콕 집었어요. 음료 주인분과 직원까지 등장시켜 who를 채워 주세요 ✅"], ["교훈으로 마무리", "\"Since then, I've been double-checking...\"처럼 사건 이후의 변화로 끝내면 교훈까지 전해지는 필승 마무리예요 ✅"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 질문 만능 오프닝! 회상 모드 스위치예요 🔑"], ["totally packed", "사람들로 꽉 찬", "취향 편에 이어 재활용 🔁 상황 설정 단골"], ["kill time on my phone", "폰 보며 시간을 때우다", "대기 장면 단골 표현! 생활감을 더해 줘요 📱"], ["take a big sip", "크게 한 모금 마시다", "사건 직전의 디테일로 긴장감 UP 😆"], ["guess what?", "그런데 있잖아요?", "반전 직전에 던지는 스토리텔링 필러 😲"], ["so embarrassed", "너무 민망한", "실수담의 필수 감정 표현이에요 😅"], ["a little panicked", "살짝 당황한", "감정 표현은 IH의 필수 재료예요! 😅"], ["came over right away", "바로 다가왔다", "해결 장면의 스피드감을 살리는 표현 🏃"], ["end up -ing", "결국 ~하게 되다", "이야기의 결말을 만드는 만능 패턴 ✨"], ["everything worked out fine", "결국 다 잘 해결됐다", "문제 해결 답변의 해피엔딩 공식이에요 ✨"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다", "교훈 마무리 문법! 문법 다양성 점수 UP 📈"]], "audio": "audio/1_서베이/1-004 1. 카페(Cafe)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-004 1. 카페(Cafe)_과거 경험.mp3"}, {"id": "1-005", "cat": "survey", "catName": "서베이 질문", "num": 1, "topic": "카페", "topicEn": "Cafe", "type": "비교", "badge": "05 비교", "enQ": "Compare cafes today with the ones you went to when you were younger. How have coffee shops changed over the years? What are the biggest differences between then and now?", "enA": "Cafes have changed so much since I was younger. Back then, cafes weren't really a thing in Korea — there were just a few old-fashioned coffee shops, and they were mostly for adults. As a kid, I used to think of them as places where grown-ups talked for hours.\n\nAlso, the menu was super simple back then — basically just coffee. If you wanted dessert or a nice place to study, you had no choice but to go somewhere else.\n\nThese days, though, it's a completely different story. Cafes are literally everywhere, the menus are endless — from desserts to brunch — and people treat cafes like a second living room: studying, working, even going on dates there. So yeah, compared to the past, today's cafes are bigger, fancier, and way more than just a place for coffee.", "koQ": "요즘 카페와 어렸을 때 가던 카페를 비교해주세요. 시간이 지나며 커피숍은 어떻게 변화했나요? 과거와 현재의 가장 큰 차이점은 무엇인가요?", "koA": "카페는 제가 어릴 때에 비해 정말 많이 변했어요. 그때는 카페라는 게 한국에서 흔하지 않았어요. 옛날식 커피숍이 몇 군데 있었을 뿐이고, 주로 어른들을 위한 곳이었죠. 어릴 땐 카페가 어른들이 몇 시간씩 이야기하는 곳이라고 생각했어요.\n\n그리고 그때는 메뉴도 아주 단순했어요. 사실상 커피뿐이었죠. 디저트를 먹거나 공부할 곳이 필요하면 다른 곳에 갈 수밖에 없었어요.\n\n그런데 요즘은 완전히 다른 이야기예요. 카페는 말 그대로 어디에나 있고, 메뉴도 디저트부터 브런치까지 끝이 없어요. 사람들은 카페를 제2의 거실처럼 써요. 공부하고, 일하고, 심지어 데이트도 하죠. 네, 과거와 비교하면 요즘 카페는 더 크고, 더 화려하고, 단순한 커피 가게 그 이상이에요.", "struct": [["1️⃣ 도입", "변화 인정 멘트 (changed so much)"], ["2️⃣ 과거", "옛날 커피숍 · 어른들의 공간"], ["3️⃣ 과거", "단순한 메뉴(no choice but to)"], ["4️⃣ 현재", "어디에나 · 제2의 거실 · 데이트"], ["5️⃣ 마무리", "compared to + 형용사 3연속"]], "scoring": [["뼈대 통째로 재활용", "Back then → These days → compared to 뼈대만 외워 두면 어떤 주제의 비교 문제든 표현만 갈아 끼우면 됩니다! 🔁"], ["어린 시절 시점 살리기", "\"As a kid, I used to think...\"처럼 어린 나의 시선을 넣으면 when you were younger라는 질문 조건에 정확히 답하게 돼요 ✅"], ["과거는 두 덩어리로", "과거를 공간(어른들의 곳)과 메뉴(커피뿐) 두 덩어리로 나누면 비교 파트가 훨씬 풍성해져요 🧩"], ["3연속 형용사 마무리", "bigger, fancier, way more...로 끝내는 리듬감 있는 마무리는 비교 유형의 필승 패턴이에요 🎯"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 답변의 뼈대 시그널! 통째로 외워 두세요 🧩"], ["weren't really a thing", "흔한 게 아니었다", "be a thing = 유행이다! 요즘 감성 구어체 ✨"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교 문제의 심장! 과거 파트는 used to로 여세요 💓"], ["old-fashioned", "옛날식의", "과거 묘사에 딱 한 단어로 그림 완성 🎞️"], ["had no choice but to ~", "~할 수밖에 없었다", "불편했던 과거를 강조하는 고급 구문 💪"], ["it's a completely different story", "완전히 다른 이야기다", "과거→현재 전환을 극적으로 만드는 시그널 🎭"], ["literally everywhere", "말 그대로 어디에나", "장소 묘사 만능 과장 표현이에요 ✨"], ["a second living room", "제2의 거실", "한국 카페 문화를 한 방에 설명하는 비유 🛋️"], ["go on dates", "데이트하다", "현재 카페의 다양한 쓰임 디테일 💬"], ["compared to ~", "~과 비교하면", "비교 답변 마무리 공식 문구예요 📊"], ["way more than just ~", "단순한 ~ 그 이상", "way 강조로 원어민 느낌 마무리 🆙"]], "audio": "audio/1_서베이/1-005 1. 카페(Cafe)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-005 1. 카페(Cafe)_비교.mp3"}, {"id": "1-006", "cat": "survey", "catName": "서베이 질문", "num": 2, "topic": "공원", "topicEn": "Park", "type": "묘사", "badge": "06 묘사", "enQ": "Please describe the park you visit most often. Where is it located, and what can you see there? Who do you normally go there with? Describe it in as much detail as possible.", "enA": "The park I visit most often is Han River Park — probably the most famous park in Korea. Luckily, it's just ten minutes from my place by bike, so I stop by whenever I want to get some fresh air.\n\nThere's honestly so much to see there. There's a long riverside trail for walking and biking, wide grassy fields where people have picnics, and even food trucks and convenience stores. In spring, the cherry blossoms are amazing, and at night you get a beautiful view of the city lights across the river.\n\nI usually go there alone to clear my head, but on weekends I sometimes hang out there with friends — we grab some snacks and just chill on a picnic blanket. So yeah, that's pretty much my go-to park.", "koQ": "가장 자주 방문하는 공원을 묘사해주세요. 어디에 위치해 있고, 그곳에서 무엇을 볼 수 있나요? 보통 누구와 함께 가나요? 가능한 자세히 묘사해주세요.", "koA": "제가 가장 자주 가는 공원은 한강공원이에요. 아마 한국에서 제일 유명한 공원일 거예요. 다행히 집에서 자전거로 10분 거리라서, 바람 쐬고 싶을 때마다 들르곤 해요.\n\n그곳엔 볼거리가 정말 많아요. 걷거나 자전거를 탈 수 있는 긴 강변 산책로가 있고, 사람들이 피크닉을 즐기는 넓은 잔디밭도 있고, 심지어 푸드트럭과 편의점도 있어요. 봄에는 벚꽃이 정말 예쁘고, 밤에는 강 건너 도시의 야경이 한눈에 들어와요.\n\n저는 보통 머리를 식히러 혼자 가지만, 주말에는 가끔 친구들과 함께 가요. 간식을 사서 돗자리에 앉아 그냥 쉬는 거죠. 네, 이게 제 단골 공원이에요.", "struct": [["1️⃣ 도입", "한강공원 + 자전거 10분 거리"], ["2️⃣ 볼거리", "강변 산책로 · 잔디밭 · 푸드트럭"], ["3️⃣ 계절", "봄 벚꽃 · 밤 야경(city lights)"], ["4️⃣ 동행", "혼자 힐링 ↔ 주말엔 친구들과"], ["5️⃣ 마무리", "my go-to park 정리 멘트"]], "scoring": [["유명 장소 활용하기", "한강공원처럼 유명한 장소를 고르면 소재 걱정이 없어요 🙌 벚꽃, 야경, 푸드트럭까지 이야깃거리가 저절로 나옵니다!"], ["There is/are로 나열", "볼거리를 나열할 땐 There's a trail..., There are fields... 패턴이 가장 안전하고 자연스러워요 ✅"], ["누구와 가는지 답하기", "질문이 who와 함께 가는지 물었어요. 혼자 갈 때와 친구랑 갈 때를 나눠 답하면 디테일 점수까지 챙겨요 🧩"], ["계절·시간 디테일", "봄의 벚꽃, 밤의 야경처럼 시간대별 장면을 넣으면 묘사가 입체적으로 살아나요 🌸 IH 묘사의 비밀 무기!"]], "expr": [["get some fresh air", "바람을 쐬다", "공원 시리즈의 심장 표현! 습관·취향 편에도 등장 🔁"], ["clear my head", "머리를 식히다", "공원 가는 이유를 한 방에 설명해요 🧠✨"], ["stop by ~", "~에 잠깐 들르다", "카페 편 개근 표현, 공원에서도! 🔁"], ["riverside trail", "강변 산책로", "한강공원 묘사 필수 디테일 🚲"], ["grassy fields", "잔디밭", "grass에 -y만 붙이면 고급 형용사 완성 😊"], ["have a picnic", "피크닉을 하다", "공원 활동 대표 표현, 경험 편에서 재등장 🔁"], ["cherry blossoms", "벚꽃", "봄 묘사 치트키! 발음은 [체리 블라썸즈] 🌸"], ["city lights", "도시 야경", "밤 풍경 디테일로 그림 완성 ✨"], ["hang out", "어울려 놀다", "카페 편 만능 동사, 공원에서도 재활용 🔁"], ["chill on a picnic blanket", "돗자리에서 쉬다", "chill = 쉬다. 여유로운 분위기 연출 😊"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-006 2. 공원(Park)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-006 2. 공원(Park)_묘사.mp3"}, {"id": "1-007", "cat": "survey", "catName": "서베이 질문", "num": 2, "topic": "공원", "topicEn": "Park", "type": "습관", "badge": "07 습관", "enQ": "How often do you visit the park? Tell me about the activities you usually do there. Walk me through a typical visit, from the time you get to the park until you head home.", "enA": "I'd say I go to the park two or three times a week, usually in the evening after work. Let me walk you through a typical visit. First, I change into comfortable clothes and walk over — it takes about ten minutes.\n\nOnce I get there, I start with some light stretching, and then I take a stroll along the river for about half an hour. While walking, I listen to music or podcasts, and honestly, that's when I clear my head the best. If I feel good, I sometimes go for a light run too.\n\nOn my way back, I stop by the convenience store in the park and grab something to drink — that's my little reward. Then I head home and take a shower. So yeah, that's pretty much my park routine, and honestly, it never gets old.", "koQ": "공원에 얼마나 자주 가시나요? 그곳에서 주로 하는 활동들을 말해주세요. 공원에 도착해서 집으로 돌아갈 때까지의 일반적인 방문 과정을 순서대로 설명해주세요.", "koA": "음, 일주일에 두세 번은 공원에 가는 것 같아요. 보통 퇴근 후 저녁에요. 일반적인 방문 과정을 차근차근 말씀드릴게요. 먼저 편한 옷으로 갈아입고 걸어가요. 10분 정도 걸려요.\n\n도착하면 가벼운 스트레칭으로 시작하고, 그다음 30분 정도 강을 따라 산책해요. 걸으면서 음악이나 팟캐스트를 듣는데, 솔직히 그때 머리가 제일 잘 식는 것 같아요. 컨디션이 좋으면 가볍게 뛰기도 해요.\n\n돌아오는 길엔 공원 안 편의점에 들러 마실 걸 하나 사요. 그게 저만의 작은 보상이거든요. 그러고 집에 와서 샤워하면 끝이에요. 네, 이게 제 공원 루틴인데, 솔직히 아무리 반복해도 질리지가 않아요.", "struct": [["1️⃣ 도입", "주 2~3회 · 퇴근 후 저녁(빈도 먼저!)"], ["2️⃣ 준비", "편한 옷(change into) · 도보 10분"], ["3️⃣ 활동", "스트레칭 · 강변 산책 · 음악"], ["4️⃣ 리워드", "편의점 음료(my little reward)"], ["5️⃣ 마무리", "귀가 · 샤워 + 정리 멘트"]], "scoring": [["빈도부터 답하기", "질문 첫마디가 How often이에요. \"two or three times a week\"처럼 숫자로 시작해야 질문에 정면으로 답하는 거예요 ✅"], ["시간 순서 연결어", "First → Once I get there → On my way back 흐름은 카페 습관 편과 같은 뼈대예요 🔁 walk me through 질문의 정석!"], ["나만의 리워드 넣기", "\"that's my little reward\" 같은 개인 디테일 하나가 루틴 답변을 특별하게 만들어요 💯 진짜 습관처럼 들리는 비결!"], ["애정 표현 마무리", "\"it never gets old\"로 끝내면 이 루틴을 진심으로 즐긴다는 게 전해져요 😊 단순 나열보다 훨씬 IH다운 마무리!"]], "expr": [["I'd say ~", "음, ~인 것 같아요", "숫자 질문에 여유 있게 답하는 쿠션 표현 😊"], ["let me walk you through ~", "~을 차근차근 설명할게요", "카페 습관 편에 이어 또 등장! 🔁 이제 자동이죠?"], ["change into comfortable clothes", "편한 옷으로 갈아입다", "루틴의 시작을 여는 생활 디테일 👕"], ["take a stroll", "산책하다", "walk보다 여유로운 뉘앙스의 고급 동사 ✨"], ["clear my head", "머리를 식히다", "묘사 편 재활용 🔁 공원 시리즈 핵심 표현"], ["go for a light run", "가볍게 뛰다", "go for a run/walk/swim 만능 패턴 🏃"], ["on my way back", "돌아오는 길에", "루틴의 마지막 단계 연결 시그널 🔗"], ["stop by ~", "~에 잠깐 들르다", "카페 편 단골 표현, 여기서도! 🔁"], ["my little reward", "나만의 작은 보상", "루틴에 애정을 더하는 킬러 디테일 💯"], ["it never gets old", "아무리 해도 질리지 않는다", "루틴 사랑을 보여 주는 원어민 마무리 😊"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-007 2. 공원(Park)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-007 2. 공원(Park)_습관.mp3"}, {"id": "1-008", "cat": "survey", "catName": "서베이 질문", "num": 2, "topic": "공원", "topicEn": "Park", "type": "취향", "badge": "08 취향", "enQ": "What do you like most about going to parks? Why do you enjoy spending time there instead of other places? Tell me what makes parks attractive to you.", "enA": "What I like most about parks? Hmm, for me, it's all about the feeling of freedom. Unlike cafes or shopping malls, parks are wide open — no walls, no noise, just trees, sky, and fresh air.\n\nI spend most of my day staring at screens, so being surrounded by nature really helps me recharge. Even a short stroll under the trees can completely change my mood. That's why whenever I feel stressed out, my feet just naturally take me to the park.\n\nAnd the best part? It's completely free! You don't have to buy anything or make a reservation — you just show up and enjoy. So yeah, when it comes to relaxing, nothing beats a park for me. That's my taste in a nutshell.", "koQ": "공원에 가는 것에서 가장 좋아하는 점은 무엇인가요? 왜 다른 장소가 아닌 공원에서 시간을 보내는 것을 즐기나요? 공원의 어떤 점이 매력적인가요?", "koA": "공원에서 가장 좋아하는 점이요? 음, 저한테는 자유로운 느낌이 전부예요. 카페나 쇼핑몰과 달리 공원은 탁 트여 있잖아요. 벽도 없고, 소음도 없고, 그저 나무와 하늘과 맑은 공기뿐이죠.\n\n저는 하루 대부분을 화면만 보면서 지내다 보니, 자연에 둘러싸이는 것만으로도 정말 재충전이 돼요. 나무 아래를 잠깐 걷는 것만으로도 기분이 완전히 달라져요. 그래서 스트레스를 받을 때면 발걸음이 자연스럽게 공원으로 향하는 거예요.\n\n그리고 제일 좋은 점이 뭔지 아세요? 완전히 공짜라는 거예요! 뭘 사거나 예약할 필요 없이 그냥 가서 즐기면 되잖아요. 네, 휴식에 관해서라면 저에겐 공원만 한 곳이 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "핵심 = 자유로움(it's all about)"], ["2️⃣ 대비", "카페·쇼핑몰과 달리 탁 트임(unlike)"], ["3️⃣ 이유", "화면 피로 → 자연에서 재충전"], ["4️⃣ 보너스", "공짜!(And the best part?)"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["다른 장소와 대비하기", "질문이 instead of other places를 콕 집었어요. \"Unlike cafes or malls...\"처럼 다른 장소를 직접 언급하며 대비해 주세요 ✅"], ["내 일상과 연결하기", "\"하루 종일 화면만 봐서 자연이 필요하다\"처럼 나의 일상과 연결하면 이유에 설득력이 확 생겨요 🎯 만능 논리니 꼭 챙기세요!"], ["자문자답 리듬 주기", "\"And the best part? It's free!\"처럼 스스로 묻고 답하면 혼자 말해도 대화처럼 들려요 😊 오픽 최고급 스킬!"], ["취향 공식 재활용", "it's all about → That's why → in a nutshell 흐름은 카페 취향 편과 같은 공식이에요 🔁 취향 유형은 이 틀 하나면 끝!"]], "expr": [["it's all about ~", "~이 전부다/핵심이다", "카페 취향 편 핵심 구문 그대로 재활용 🔁 🎯"], ["wide open", "탁 트인", "공원 매력을 한 단어로! 개방감 묘사 ✨"], ["fresh air", "맑은 공기", "묘사 편 get some fresh air의 짝꿍 🔁"], ["stare at screens", "화면만 들여다보다", "현대인 공감 디테일로 이유에 설득력 UP 📱"], ["recharge", "재충전하다", "휴식 주제 만능 동사, 배터리 비유 🔋"], ["take a stroll", "산책하다", "습관 편 재활용 🔁 여유로운 뉘앙스"], ["That's why ~", "그래서 ~한 거예요", "카페 취향 편 연결 시그널 재활용 🔁 🔗"], ["stressed out", "스트레스가 쌓인", "stressed보다 꽉 찬 느낌의 구어체 😅"], ["And the best part?", "그리고 제일 좋은 점은?", "스스로 묻고 답하며 리듬 만들기 😊"], ["nothing beats ~", "~만 한 게 없다", "강력 추천 표현! 취향 마무리에 딱 💯"], ["in a nutshell", "한마디로 요약하면", "카페 취향 편 마무리 공식 재활용 🔁 ✅"]], "audio": "audio/1_서베이/1-008 2. 공원(Park)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-008 2. 공원(Park)_취향.mp3"}, {"id": "1-009", "cat": "survey", "catName": "서베이 질문", "num": 2, "topic": "공원", "topicEn": "Park", "type": "과거 경험", "badge": "09 과거 경험", "enQ": "Please tell me about an unforgettable experience you had at a park. Who was with you, and what were you doing? Did something special or unexpected take place? Explain the whole story in detail.", "enA": "Oh, this reminds me of something that happened last spring. My friends and I went to Han River Park for a picnic — you know, cherry blossom season, so the park was totally packed. We found a nice spot, spread out our picnic blanket, and ordered some fried chicken.\n\nWe were having a great time — and then, out of nowhere, guess what? A whole flock of pigeons swooped down on our food the second we looked away. I'm not kidding — they went straight for the chicken! We were too shocked to even move at first.\n\nBut after a few seconds, we all just burst out laughing. We ended up taking turns guarding the food, and that made the picnic even more fun. In the end, everything worked out fine, and it's still the story we bring up whenever we meet. So yeah, that's my most unforgettable park moment.", "koQ": "공원에서 겪은 잊을 수 없는 경험에 대해 말해주세요. 누구와 함께 있었고, 무엇을 하고 있었나요? 특별하거나 예상치 못한 일이 있었나요? 전체 이야기를 자세히 설명해주세요.", "koA": "아, 지난봄에 있었던 일이 생각나네요. 친구들과 피크닉을 하러 한강공원에 갔는데, 벚꽃 시즌이라 공원이 사람들로 꽉 차 있었어요. 좋은 자리를 찾아 돗자리를 펴고 치킨을 시켰죠.\n\n한창 즐거운 시간을 보내고 있었는데, 갑자기, 세상에, 우리가 한눈판 사이에 비둘기 떼가 음식으로 확 내려온 거예요. 진짜예요. 걔네는 곧장 치킨으로 직행했어요! 우리는 처음엔 너무 놀라서 움직이지도 못했어요.\n\n그런데 몇 초 뒤에 다 같이 빵 터졌어요. 결국 돌아가며 음식을 지키게 됐는데, 그래서 피크닉이 더 재밌어졌어요. 결국 모든 게 잘 마무리됐고, 지금도 친구들을 만날 때마다 꺼내는 이야기예요. 네, 이게 공원에서 겪은 가장 잊을 수 없는 순간이에요.", "struct": [["1️⃣ 도입", "회상 시그널 + 벚꽃 피크닉"], ["2️⃣ 상황", "꽉 찬 공원 · 돗자리 · 치킨"], ["3️⃣ 사건", "비둘기 습격(out of nowhere)"], ["4️⃣ 반전", "빵 터짐 · 교대로 음식 경비"], ["5️⃣ 마무리", "worked out fine + 단골 이야기"]], "scoring": [["유머 소재 대환영", "비둘기 치킨 습격 같은 웃긴 이야기는 오픽 최고의 소재예요 😆 시험관도 사람이라 재밌는 답변에 후해집니다!"], ["평화 → 반전 구조", "having a great time으로 평화를 그린 뒤 out of nowhere로 뒤집으세요 💥 반전의 낙차가 클수록 스토리 점수 UP!"], ["감정 변화 보여 주기", "shocked → laughing의 감정 전환이 이 답변의 심장이에요 🎢 카페 경험 편과 같은 원리 🔁"], ["질문 요소 다 챙기기", "who(친구들) · doing(피크닉) · unexpected(비둘기)를 질문 순서대로 배치하면 빠짐없는 답변 완성 ✅"]], "expr": [["This reminds me of ~", "~이 생각나네요", "카페 경험 편에 이어 또 등장! 🔁 이제 자동이죠? 🔑"], ["totally packed", "사람들로 꽉 찬", "벚꽃 시즌 한강 = 이 표현 쓸 최적 타이밍 🔁 🌸"], ["spread out a picnic blanket", "돗자리를 펴다", "묘사 편 picnic blanket의 동사 확장판 🔁"], ["have a great time", "즐거운 시간을 보내다", "사건 직전의 평화로운 장면 만들기 😊"], ["out of nowhere", "난데없이, 갑자기", "suddenly의 상위 호환! 반전의 시그널 💥"], ["guess what?", "그런데 있잖아요?", "카페 경험 편 필러 재활용 🔁 😲"], ["I'm not kidding", "진짜예요, 농담 아니에요", "믿기 힘든 장면에 진정성 부여 🙌"], ["too shocked to even move", "놀라서 움직이지도 못한", "too ~ to 구문으로 문법 점수까지 ✨"], ["burst out laughing", "빵 터지다", "감정 반전 장면의 필수 표현 😆"], ["everything worked out fine", "결국 다 잘 해결됐다", "카페 경험 편에 이어 해피엔딩 공식 🔁"], ["bring up (a story)", "(이야기를) 꺼내다", "추억이 됐다는 세련된 마무리 💬"]], "audio": "audio/1_서베이/1-009 2. 공원(Park)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-009 2. 공원(Park)_과거 경험.mp3"}, {"id": "1-010", "cat": "survey", "catName": "서베이 질문", "num": 2, "topic": "공원", "topicEn": "Park", "type": "비교", "badge": "10 비교", "enQ": "Think about the parks you went to as a child and the parks you visit now. How have parks changed over the years? What is different about their facilities and the people who use them?", "enA": "Parks have changed a lot since I was a kid. Back then, the park near my house was really simple — just a sandy playground, a few swings, and some benches. I used to play there all day with the neighborhood kids until it got dark.\n\nThe facilities were pretty basic, to be honest. There were no exercise machines, no nice bathrooms, and definitely no cafes nearby. But nobody cared — we were just happy running around.\n\nThese days, parks are on a whole different level. They have rubber-floored playgrounds, free outdoor gym equipment, walking trails, even small libraries in some parks. And it's not just kids anymore — you see everyone from toddlers to grandparents working out there. So yeah, compared to the parks of my childhood, today's parks are safer, fancier, and way more for everyone.", "koQ": "어릴 때 가던 공원과 지금 방문하는 공원을 떠올려 보세요. 시간이 지나며 공원은 어떻게 변화했나요? 시설과 이용하는 사람들 면에서 무엇이 달라졌나요?", "koA": "공원은 제가 어릴 때에 비해 정말 많이 변했어요. 그때는 집 근처 공원이 정말 단순했어요. 모래 놀이터와 그네 몇 개, 벤치 몇 개가 전부였죠. 저는 동네 아이들과 해가 질 때까지 하루 종일 거기서 놀곤 했어요.\n\n솔직히 시설은 꽤 기본적이었어요. 운동 기구도 없었고, 깨끗한 화장실도 없었고, 근처에 카페 같은 건 당연히 없었죠. 그래도 아무도 신경 안 썼어요. 우리는 그냥 뛰어다니는 것만으로 행복했으니까요.\n\n요즘 공원은 차원이 달라요. 바닥이 푹신한 놀이터, 무료 야외 운동 기구, 산책로, 심지어 작은 도서관이 있는 공원도 있어요. 그리고 이제는 아이들만이 아니에요. 유아부터 어르신까지 모두가 그곳에서 운동하는 걸 볼 수 있죠. 네, 어린 시절의 공원과 비교하면 요즘 공원은 더 안전하고, 더 세련되고, 훨씬 더 모두를 위한 공간이 됐어요.", "struct": [["1️⃣ 도입", "변화 인정 멘트 (changed a lot)"], ["2️⃣ 과거", "모래 놀이터 · 그네 · 해질 때까지"], ["3️⃣ 과거", "기본 시설 · 그래도 행복했음"], ["4️⃣ 현재", "운동 기구 · 산책로 · 모든 세대"], ["5️⃣ 마무리", "compared to + 형용사 3연속"]], "scoring": [["시설+사람 다 답하기", "질문이 facilities와 people을 콕 집었어요. 과거·현재 각각에서 시설과 사람을 모두 언급해야 완전한 답변이에요 ✅"], ["어린 시절 그림 그리기", "\"until it got dark\"처럼 장면이 떠오르는 표현 하나가 밋밋한 비교를 추억담으로 바꿔 줘요 🎞️"], ["감성 반전 넣기", "\"시설은 없었지만 nobody cared, 우리는 행복했다\"는 반전이 과거 파트에 온기를 더해요 😊 단순 불평보다 훨씬 고급!"], ["비교 공식 재활용", "Back then → These days → compared to + 형용사 3연속. 카페 비교 편과 같은 공식이에요 🔁 이제 눈 감고도 되죠?"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "카페 비교 편과 공통인 뼈대 시그널 🔁 🧩"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교 문제의 심장, 이번에도! 🔁 💓"], ["sandy playground", "모래 놀이터", "어린 시절 공원을 한 단어로 소환 🎞️"], ["until it got dark", "해가 질 때까지", "어린 시절의 그림이 그려지는 시간 표현 ✨"], ["pretty basic", "꽤 기본적인/단순한", "과거 시설 요약! simple의 구어체 짝꿍 👍"], ["nobody cared", "아무도 신경 안 썼다", "그 시절 감성을 살리는 반전 한마디 😊"], ["a whole different level", "차원이 다른 수준", "completely different story의 변형 🔁 🆙"], ["outdoor gym equipment", "야외 운동 기구", "한국 공원 특유의 디테일! 시설 질문 정답 ✅"], ["work out", "운동하다", "exercise보다 자연스러운 구어체 💪"], ["compared to ~", "~과 비교하면", "카페 비교 편과 같은 마무리 공식 🔁 📊"], ["way more for everyone", "훨씬 더 모두를 위한", "way 강조 마무리, 카페 비교 편 재활용 🔁"]], "audio": "audio/1_서베이/1-010 2. 공원(Park)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-010 2. 공원(Park)_비교.mp3"}, {"id": "1-011", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "묘사", "badge": "11 묘사", "enQ": "Describe the place where you usually go jogging or walking. What does the route look like? What can you see around you while you are walking? Tell me in detail.", "enA": "The place I usually go jogging is the riverside trail near my house — actually, the same park I always talk about. The course is about three kilometers long, flat, and really well-maintained, so it's perfect for beginners like me.\n\nThe route itself is really scenic. On one side you have the river, and on the other side there are trees and grassy fields. While walking, you can see people walking their dogs, riding bikes, and working out at the outdoor gym. At night, the whole path is well-lit, so it feels safe too.\n\nMy favorite part is the halfway point — there's a small bridge where I always stop to catch my breath and enjoy the view. Honestly, just being there helps me clear my head. So yeah, that's pretty much my go-to jogging spot.", "koQ": "당신이 주로 조깅이나 걷기를 하는 장소를 묘사해주세요. 그 코스는 어떻게 생겼나요? 걷는 동안 주변에서 무엇을 볼 수 있나요? 자세히 말해주세요.", "koA": "제가 주로 조깅하는 곳은 집 근처 강변 산책로예요. 사실 제가 늘 이야기하는 그 공원이죠. 코스는 3km 정도로 평평하고 관리가 정말 잘돼 있어서, 저 같은 초보자에게 딱이에요.\n\n코스 자체가 풍경이 정말 좋아요. 한쪽에는 강이 있고 반대쪽에는 나무와 잔디밭이 있죠. 걷다 보면 강아지를 산책시키는 사람들, 자전거 타는 사람들, 야외 운동 기구에서 운동하는 사람들을 볼 수 있어요. 밤에는 길 전체에 조명이 잘 켜져 있어서 안전한 느낌도 들고요.\n\n제가 제일 좋아하는 곳은 중간 지점이에요. 작은 다리가 하나 있는데, 항상 거기 멈춰서 숨을 고르며 풍경을 감상하거든요. 솔직히 거기 있는 것만으로도 머리가 맑아져요. 네, 이게 제 단골 조깅 코스예요.", "struct": [["1️⃣ 도입", "강변 산책로 · 3km 코스 소개"], ["2️⃣ 코스", "평평(flat) · 관리 잘됨 · 초보자용"], ["3️⃣ 풍경", "강 · 잔디밭 · 반려견 · 운동 기구"], ["4️⃣ 야간", "조명(well-lit) · 안전한 느낌"], ["5️⃣ 마무리", "다리 위 풍경(halfway point) + 정리"]], "scoring": [["소재 연결 전략", "\"actually, the same park I always talk about\"처럼 공원 편과 같은 장소를 쓰면 준비 부담이 확 줄어요 🔁 오픽은 소재 재활용이 합법입니다!"], ["숫자로 그리는 코스", "3km, halfway point처럼 숫자와 지점을 짚어 주면 코스가 머릿속에 지도처럼 그려져요 📍 What does the route look like의 정답!"], ["보이는 것 나열하기", "'무엇을 볼 수 있나'는 you can see people -ing 패턴으로! 강아지 산책, 자전거, 운동까지 세 가지면 충분해요 ✅"], ["안전 디테일 넣기", "well-lit, feels safe 같은 안전 디테일은 안전 습관 편과도 연결되는 만능 소재예요 💡"]], "expr": [["riverside trail", "강변 산책로", "공원 편 재활용 🔁 같은 장소로 소재 연결!"], ["well-maintained", "관리가 잘된", "시설 묘사 만능 형용사예요 ✅"], ["perfect for beginners", "초보자에게 딱인", "나의 수준까지 슬쩍 알려 주는 표현 😊"], ["scenic", "경치가 좋은", "beautiful보다 한 단계 위 어휘! ✨"], ["walk one's dog", "반려견을 산책시키다", "공원·산책로 풍경 묘사 단골 🐕"], ["work out", "운동하다", "공원 비교 편 재활용 🔁 구어체 동사"], ["well-lit", "조명이 잘 켜진", "밤 풍경 + 안전을 한 단어로 💡"], ["halfway point", "중간 지점", "코스 묘사에 구조를 만들어 줘요 📍"], ["catch my breath", "숨을 고르다", "운동 주제 필수 표현! 경험 편에도 활용 OK"], ["clear my head", "머리를 식히다", "공원 시리즈 핵심 표현 또 등장 🔁"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널! 모든 답변의 공통 엔딩이에요"]], "audio": "audio/1_서베이/1-011 3. 조깅_걷기(Jogging)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-011 3. 조깅_걷기(Jogging)_묘사.mp3"}, {"id": "1-012", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "습관", "badge": "12 습관", "enQ": "How many times a week do you go walking, and where do you usually go? Describe your walking routine from start to finish.", "enA": "I'd say I go walking three or four times a week, mostly in the evening. My usual spot is the riverside trail near my house. Let me walk you through my routine from start to finish.\n\nFirst, I change into comfortable clothes, put on my running shoes, and do some light stretching. Then I walk for about forty minutes at my own pace — not too fast, not too slow — while listening to my favorite playlist. Around the halfway point, I usually pick up the pace a little and work up a sweat.\n\nOn my way back, I slow down to cool down, and when I get home, I take a quick shower. That's my little ritual, and honestly, it never gets old. So yeah, that's pretty much my walking routine.", "koQ": "일주일에 몇 번 걷기를 하러 가고, 주로 어디로 가나요? 당신의 걷기 루틴을 처음부터 끝까지 설명해주세요.", "koA": "음, 일주일에 서너 번은 걷는 것 같아요. 주로 저녁에요. 단골 장소는 집 근처 강변 산책로고요. 제 루틴을 처음부터 끝까지 차근차근 말씀드릴게요.\n\n먼저 편한 옷으로 갈아입고, 러닝화를 신고, 가볍게 스트레칭을 해요. 그다음 40분 정도 제 페이스대로 걸어요. 너무 빠르지도, 너무 느리지도 않게요. 좋아하는 플레이리스트를 들으면서요. 중간 지점쯤에서는 보통 속도를 조금 올려서 땀을 좀 내요.\n\n돌아오는 길에는 속도를 늦추면서 정리 운동을 하고, 집에 오면 바로 샤워를 해요. 이게 저만의 작은 의식인데, 솔직히 아무리 반복해도 질리지 않아요. 네, 이게 제 걷기 루틴이에요.", "struct": [["1️⃣ 도입", "주 3~4회 · 저녁 · 강변 산책로"], ["2️⃣ 준비", "편한 옷 · 러닝화 · 스트레칭"], ["3️⃣ 걷기", "40분 · 내 페이스 · 플레이리스트"], ["4️⃣ 마무리 운동", "속도 올리기 → 쿨다운(cool down)"], ["5️⃣ 마무리", "샤워 · 나만의 의식 + 정리 멘트"]], "scoring": [["빈도 → 장소 → 루틴 순서", "질문이 묻는 순서 그대로 답하세요: 주 3~4회(빈도) → 강변(장소) → 루틴 설명. 질문 구조가 곧 답변 개요예요 ✅"], ["from start to finish 공식", "First → Then → On my way back → when I get home. 공원 습관 편과 같은 시간 순서 뼈대예요 🔁 어떤 루틴 질문에도 통해요!"], ["강약 리듬 넣기", "그냥 걷기만 하면 밋밋해요. pick up the pace → work up a sweat → cool down처럼 강약 변화를 넣으면 루틴이 살아나요 💦"], ["나만의 의식 만들기", "'that's my little ritual'처럼 루틴에 이름을 붙이면 진짜 습관처럼 들려요 😊 공원 편의 my little reward와 같은 원리 🔁"]], "expr": [["I'd say ~", "음, ~인 것 같아요", "공원 습관 편 쿠션 표현 재활용 🔁 ⏳"], ["let me walk you through ~", "~을 차근차근 설명할게요", "습관 만능 오프닝! walk 주제라 더 찰떡 🔁"], ["put on my running shoes", "러닝화를 신다", "루틴의 시작 신호! 안전 편에도 등장해요"], ["stretching", "스트레칭", "운동 루틴 필수 단계, 발음 그대로 OK 🙆"], ["at my own pace", "내 페이스대로", "운동 주제 킬러 표현! 취향 편에서 재등장 🔁"], ["pick up the pace", "속도를 올리다", "루틴에 변화를 주는 디테일 📈"], ["work up a sweat", "땀을 좀 내다", "운동한 티가 나는 생생한 표현이에요 💦"], ["cool down", "정리 운동을 하다", "warm up과 세트! 안전 편에도 나와요 🔁"], ["on my way back", "돌아오는 길에", "공원 습관 편 연결 시그널 재활용 🔁"], ["it never gets old", "아무리 해도 질리지 않는다", "공원 습관 편 마무리 감성 그대로 🔁 😊"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-012 3. 조깅_걷기(Jogging)_습관1.mp3", "label": "습관 1", "qaudio": "audio_q/1_서베이/1-012 3. 조깅_걷기(Jogging)_습관1.mp3"}, {"id": "1-013", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "습관", "badge": "13 습관", "enQ": "Safety matters when exercising. What do you wear or carry with you when you go jogging? What do you do to prevent injuries? Tell me about your safety gear and habits in detail.", "enA": "Oh, safety — that's actually something I care about a lot. First things first: shoes. I always wear proper running shoes with good cushioning, because they protect your knees and ankles. Trust me, I learned that the hard way.\n\nAs for what I carry, I keep it simple — my phone, a small bottle of water, and wireless earphones. But here's my rule: I always keep the volume low, so I can hear bikes coming up behind me. And since I usually walk in the evening, I wear bright-colored clothes so riders can spot me easily.\n\nTo prevent injuries, I never skip warming up before I start, and I always cool down after. Thanks to these habits, I've never had a serious injury — knock on wood! So yeah, those are my safety habits.", "koQ": "운동할 때 안전은 중요합니다. 조깅하러 갈 때 무엇을 착용하거나 가지고 가나요? 부상을 예방하기 위해 무엇을 하나요? 안전 용품과 습관을 말해주세요.", "koA": "아, 안전이요. 사실 제가 정말 신경 쓰는 부분이에요. 뭐니 뭐니 해도 첫째는 신발이죠. 저는 항상 쿠션이 좋은 제대로 된 러닝화를 신어요. 무릎과 발목을 보호해 주거든요. 저도 한 번 고생하고 나서 배웠어요.\n\n가지고 다니는 것들은 간단해요. 폰, 작은 물병, 무선 이어폰 정도요. 그런데 저만의 규칙이 하나 있어요. 항상 볼륨을 낮게 유지하는 거예요. 뒤에서 오는 자전거 소리를 들어야 하니까요. 그리고 주로 저녁에 걷기 때문에, 자전거 타는 분들 눈에 잘 띄게 밝은색 옷을 입어요.\n\n부상을 예방하기 위해서는 시작 전 준비 운동을 절대 거르지 않고, 끝나고 나서는 꼭 정리 운동을 해요. 이 습관들 덕분에 심하게 다친 적이 한 번도 없어요. 계속 그러길 바라야죠! 네, 이게 제 안전 습관이에요.", "struct": [["1️⃣ 도입", "안전 중시 어필 + 신발부터!"], ["2️⃣ 착용", "쿠션 러닝화 · 무릎/발목 보호"], ["3️⃣ 소지품", "폰 · 물병 · 이어폰(볼륨 낮게)"], ["4️⃣ 예방", "밝은 옷 · 준비/정리 운동 필수"], ["5️⃣ 마무리", "무부상 기록 + knock on wood!"]], "scoring": [["질문 두 덩어리로", "이 질문은 착용/소지품(what)과 예방 습관(how)을 물어요. As for로 파트를 나눠 두 가지 모두 답해 주세요 ✅"], ["이유 붙여 말하기", "\"쿠션화 → 무릎 보호\", \"볼륨 낮게 → 자전거 소리\"처럼 모든 아이템에 because를 붙이면 습관에 설득력이 생겨요 🎯"], ["나만의 규칙 강조", "\"here's my rule\"로 나만의 안전 수칙을 소개하면 외운 목록이 아니라 진짜 습관처럼 들려요 💡"], ["원어민 감탄사 활용", "knock on wood(부정 타지 않기를!)는 무부상 자랑 뒤에 붙이는 원어민 필수 리액션이에요 😊 IH 감별 포인트!"]], "expr": [["First things first", "뭐니 뭐니 해도 첫째는", "카페 습관 편 재활용 🔁 우선순위 시그널"], ["running shoes with good cushioning", "쿠션 좋은 러닝화", "안전 질문 1순위 답변 아이템 👟"], ["protect your knees and ankles", "무릎과 발목을 보호하다", "이유까지 설명하면 디테일 점수 UP ✅"], ["learn ~ the hard way", "고생하며 배우다", "경험에서 나온 조언처럼 들리게 해 줘요 😅"], ["As for ~", "~에 관해서는", "항목 전환 시그널! 착용→소지품 연결 🔗"], ["keep the volume low", "볼륨을 낮게 유지하다", "나만의 안전 규칙 디테일 🎧"], ["bright-colored clothes", "밝은색 옷", "야간 운동 안전의 정석 답변이에요 💡"], ["prevent injuries", "부상을 예방하다", "질문 속 표현 그대로 받아치기! 🎯"], ["never skip ~", "~을 절대 거르지 않다", "always보다 강한 습관 표현 💪"], ["warm up ↔ cool down", "준비 운동 ↔ 정리 운동", "운동 안전 세트 표현, 루틴 편 연결 🔁"], ["knock on wood!", "계속 그러길! (부정 타지 않게)", "원어민 감탄 표현! 시험관 미소 보장 😊"]], "audio": "audio/1_서베이/1-013 3. 조깅_걷기(Jogging)_습관2.mp3", "label": "습관 2", "qaudio": "audio_q/1_서베이/1-013 3. 조깅_걷기(Jogging)_습관2.mp3"}, {"id": "1-014", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "취향", "badge": "14 취향", "enQ": "Why do you prefer jogging or walking over other types of exercise? What do you like about it the most? Tell me what makes this activity enjoyable for you.", "enA": "Why walking over other exercise? Hmm, for me, it's all about simplicity. You don't need a gym membership, fancy equipment, or a trainer — you just put on your shoes and go. And the best part? It's completely free.\n\nI've tried other workouts before, but honestly, they felt like homework. Walking is different. I can go at my own pace, enjoy the fresh air, and clear my head at the same time. It's exercise and therapy in one.\n\nAlso, it's really easy to stick to. Even on busy days, I can squeeze in a quick thirty-minute walk. So yeah, when it comes to exercise, nothing beats walking for me — that's my taste in a nutshell.", "koQ": "왜 다른 운동보다 조깅이나 걷기를 선호하나요? 그것의 어떤 점이 가장 좋은가요? 이 활동이 왜 즐거운지 말해주세요.", "koA": "왜 다른 운동보다 걷기냐고요? 음, 저한테는 단순함이 전부예요. 헬스장 회원권도, 비싼 장비도, 트레이너도 필요 없잖아요. 그냥 신발만 신고 나가면 돼요. 그리고 제일 좋은 점이 뭔지 아세요? 완전히 공짜라는 거예요.\n\n다른 운동도 해 봤는데, 솔직히 숙제처럼 느껴졌어요. 걷기는 달라요. 제 페이스대로 갈 수 있고, 맑은 공기를 즐기면서 동시에 머리도 식힐 수 있죠. 운동과 힐링이 하나로 합쳐진 거예요.\n\n그리고 꾸준히 하기가 정말 쉬워요. 바쁜 날에도 30분 걷기 정도는 끼워 넣을 수 있거든요. 네, 운동에 관해서라면 저에겐 걷기만 한 게 없어요. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "핵심 = 단순함(it's all about)"], ["2️⃣ 보너스", "장비 불필요 · 공짜!(best part)"], ["3️⃣ 대비", "다른 운동 = 숙제(homework)"], ["4️⃣ 이유", "내 페이스 · 운동+힐링 동시에"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["취향 공식 3연속 적용", "it's all about → That's why/대비 → in a nutshell. 카페·공원 취향 편과 같은 공식이에요 🔁 이제 취향 유형은 자동이죠?"], ["비교 대상 깎아 주기", "\"다른 운동은 숙제 같았다\"처럼 반대편을 재치 있게 깎으면 over other types of exercise라는 질문 조건에 정확히 답하게 돼요 🎯"], ["일석이조 패턴", "exercise and therapy in one처럼 두 가지 장점을 하나로 묶으면 좋아하는 이유가 훨씬 임팩트 있어요 ✨"], ["현실적인 장점 넣기", "공짜(free), 시간 끼워 넣기(squeeze in) 같은 현실 장점은 누구나 공감해요 💰 거창한 이유보다 강력합니다!"]], "expr": [["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 카페·공원 편 재활용 🔁 🎯"], ["put on your shoes and go", "신발만 신고 나가면 된다", "단순함을 그림처럼 보여 주는 문장 👟"], ["And the best part?", "그리고 제일 좋은 점은?", "공원 취향 편 자문자답 리듬 재활용 🔁 😊"], ["felt like homework", "숙제처럼 느껴졌다", "다른 운동을 깎아내리는 재치 있는 비유 😆"], ["at my own pace", "내 페이스대로", "루틴 편에 이어 재등장 🔁 운동 킬러 표현"], ["fresh air", "맑은 공기", "공원 시리즈 개근 표현이죠 🔁"], ["exercise and therapy in one", "운동과 힐링을 하나로", "A and B in one = 일석이조 패턴 ✨"], ["easy to stick to", "꾸준히 하기 쉬운", "stick to = 지속하다. 습관 주제 만능 💪"], ["squeeze in ~", "(시간을) 끼워 넣다", "바쁜 일상 어필 + 고급 구동사 📅"], ["nothing beats ~", "~만 한 게 없다", "공원 취향 편 마무리 표현 재활용 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 시리즈 3연속! 🔁 ✅"]], "audio": "audio/1_서베이/1-014 3. 조깅_걷기(Jogging)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-014 3. 조깅_걷기(Jogging)_취향.mp3"}, {"id": "1-015", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "과거 경험", "badge": "15 과거 경험", "enQ": "Tell me how you first got into walking. When did you begin doing it regularly, and what made you start? Explain the story of how you became interested in it.", "enA": "Let me tell you how I first got into walking. It started about two years ago. Back then, I was working from home, sitting all day, and I started feeling heavy and tired all the time.\n\nTo be honest, the real wake-up call was when I found myself out of breath just from climbing the subway stairs. Guess what? That very evening, I put on some old sneakers and walked around the neighborhood for thirty minutes.\n\nAnd surprisingly, I loved it. My head felt clearer, and I slept so much better that night. So I kept doing it, and within a month, it became a daily habit. Since then, I've been walking almost every evening, and it has changed my life in small but real ways. So yeah, that's how I got into walking.", "koQ": "어떻게 처음 걷기를 시작하게 되었는지 말해주세요. 언제부터 규칙적으로 하기 시작했고, 무엇이 시작하게 만들었나요? 걷기에 관심을 가지게 된 이야기를 설명해주세요.", "koA": "제가 어떻게 걷기를 시작했는지 말씀드릴게요. 2년 전쯤이었어요. 그때 저는 재택근무 중이라 하루 종일 앉아 있었고, 늘 몸이 무겁고 피곤했어요.\n\n솔직히 정신이 번쩍 든 계기는 지하철 계단을 오르는 것만으로 숨이 차는 저를 발견했을 때였어요. 그런데 있잖아요, 바로 그날 저녁에 낡은 운동화를 신고 동네를 30분 걸었어요.\n\n그리고 놀랍게도, 너무 좋았어요. 머리가 맑아지고 그날 밤 잠도 훨씬 잘 잤거든요. 그래서 계속했고, 한 달 만에 매일 하는 습관이 됐어요. 그 후로 거의 매일 저녁 걷고 있는데, 작지만 확실하게 제 삶을 바꿔 놨어요. 네, 이게 제가 걷기를 시작하게 된 이야기예요.", "struct": [["1️⃣ 도입", "2년 전 · 재택근무 배경 설명"], ["2️⃣ 계기", "계단에서 숨참(wake-up call)"], ["3️⃣ 시작", "그날 저녁 바로 30분 걷기"], ["4️⃣ 변화", "머리 맑아짐 · 꿀잠 · 습관화"], ["5️⃣ 마무리", "Since then + 삶의 변화 정리"]], "scoring": [["'계기' 질문의 공식", "시작 전 상태(문제) → 계기(wake-up call) → 첫 시도 → 변화의 4단 구성이면 어떤 계기 질문도 무너지지 않아요 🧱"], ["Before를 먼저 그리기", "몸이 무겁고 숨이 찼던 과거의 나를 먼저 보여 줘야 걷기가 가져온 변화가 극적으로 살아나요 🎬"], ["즉시 행동 디테일", "that very evening처럼 계기와 첫 실행 사이를 좁히면 이야기에 추진력이 생겨요 🏃 미루다 시작한 이야기보다 훨씬 인상적!"], ["현재완료로 연결하기", "Since then, I've been walking으로 과거의 계기를 현재의 습관과 연결하세요 🔁 카페·공원 경험 편과 같은 마무리 문법!"]], "expr": [["get into ~", "~에 빠지다/시작하다", "계기 질문 핵심 동사! 질문 표현 받아치기 🎯"], ["work from home", "재택근무하다", "시대 공감 배경 설정 디테일 💻"], ["feel heavy and tired", "몸이 무겁고 피곤하다", "'시작 전'의 나를 그리는 표현 😪"], ["wake-up call", "정신이 번쩍 든 계기", "계기 질문의 정답 단어! 통째로 암기 ⏰"], ["out of breath", "숨이 찬", "운동 주제 필수 표현, 비교 편 재등장 🔁"], ["guess what?", "그런데 있잖아요?", "카페 경험 편 필러 재활용 🔁 😲"], ["that very evening", "바로 그날 저녁", "very로 실행력 강조! 스토리 속도감 UP 🏃"], ["become a daily habit", "매일 하는 습관이 되다", "계기 → 습관화 과정의 마침표 ✅"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다", "경험 마무리 문법, 시리즈 개근 🔁 📈"], ["in small but real ways", "작지만 확실하게", "변화를 담백하게 요약하는 세련된 표현 ✨"], ["That’s how I ~", "그렇게 ~하게 됐어요", "계기 스토리 전용 마무리 멘트예요 😊"]], "audio": "audio/1_서베이/1-015 3. 조깅_걷기(Jogging)_과거 경험1.mp3", "label": "과거 경험 1", "qaudio": "audio_q/1_서베이/1-015 3. 조깅_걷기(Jogging)_과거 경험1.mp3"}, {"id": "1-016", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "과거 경험", "badge": "16 과거 경험", "enQ": "Please share a particularly memorable moment you had while jogging or walking. When and where was it, and who were you with? What happened, and how did it make you feel? Tell me the whole story.", "enA": "Oh, this reminds me of a moment from last winter. I was walking along the river alone in the evening, as usual. It was freezing that day, so the trail was almost empty.\n\nThen, right when I reached the halfway bridge, out of nowhere, it started snowing — the first snow of the year. I'm not kidding — the whole river and the city lights across it were slowly covered in falling snow. I just stood there for ten minutes, completely blown away.\n\nI even forgot how cold it was. I took some photos, but they couldn't capture the real thing. Walking home through the snow, I felt so peaceful and, weirdly, really grateful. In the end, it became my favorite walking memory — I still bring up that scene every winter. So yeah, that's my most memorable moment.", "koQ": "조깅이나 걷기를 하면서 겪은 특별히 기억에 남는 순간을 공유해주세요. 언제 어디서였고, 누구와 함께였나요? 무슨 일이 있었고, 어떤 기분이 들었나요? 전체 이야기를 들려주세요.", "koA": "아, 작년 겨울의 한 순간이 생각나네요. 여느 때처럼 저녁에 혼자 강변을 걷고 있었어요. 그날은 정말 추워서 산책로가 거의 텅 비어 있었죠.\n\n그러다 중간 지점 다리에 딱 도착했을 때, 난데없이 눈이 내리기 시작했어요. 그해 첫눈이었죠. 진짜예요. 강 전체와 강 건너 도시의 불빛들이 천천히 내리는 눈에 덮여 갔어요. 저는 그냥 10분 동안 거기 서 있었어요. 완전히 넋을 잃고요.\n\n추운 것도 잊어버렸어요. 사진을 몇 장 찍었지만 실물을 담아내지는 못하더라고요. 눈을 맞으며 집에 걸어오는데 마음이 정말 평화로웠고, 묘하게 감사한 기분까지 들었어요. 결국 그날은 제 최고의 걷기 추억이 됐고, 지금도 겨울마다 그 장면 이야기를 꺼내요. 네, 이게 가장 기억에 남는 순간이에요.", "struct": [["1️⃣ 도입", "회상 시그널 + 작년 겨울 저녁"], ["2️⃣ 상황", "혼자 · 강추위 · 텅 빈 산책로"], ["3️⃣ 사건", "다리 위에서 첫눈(out of nowhere)"], ["4️⃣ 감정", "넋 잃음(blown away) · 평화 · 감사"], ["5️⃣ 마무리", "최고의 추억 + 겨울마다 회상"]], "scoring": [["사건 없어도 OK", "꼭 사고가 나야 경험담이 아니에요. 첫눈처럼 감정이 크게 움직인 순간이면 충분합니다 🌨️ 오히려 감정 묘사 점수는 더 커요!"], ["감정을 겹겹이 쌓기", "blown away → peaceful → grateful처럼 감정을 세 겹으로 쌓으면 how did it make you feel에 완벽하게 답하게 돼요 🎢"], ["조용한 반전 만들기", "텅 빈 산책로(almost empty)를 먼저 깔아 두면 첫눈이라는 반전이 더 극적으로 살아나요 💥 공원 경험 편과 같은 원리 🔁"], ["질문 요소 체크", "언제(작년 겨울)·어디(강변 다리)·누구와(혼자)·무슨 일(첫눈)·기분까지, 질문의 다섯 가지를 순서대로 채웠어요 ✅"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝, 이제 5번째! 완전 자동이죠 🔁 🔑"], ["as usual", "여느 때처럼", "카페 경험 편 재활용 🔁 루틴과 연결해 줘요"], ["almost empty", "거의 텅 빈", "totally packed의 반대말! 세트로 암기 🔁"], ["out of nowhere", "난데없이, 갑자기", "공원 경험 편 반전 시그널 재활용 🔁 💥"], ["the first snow of the year", "그해 첫눈", "한국 감성 디테일! 낭만 점수 UP 🌨️"], ["I'm not kidding", "진짜예요", "공원 경험 편 재활용 🔁 믿기 힘든 장면 앞에!"], ["blown away", "넋을 잃은, 감동한", "surprised의 최상급 감정 표현이에요 🤩"], ["couldn't capture the real thing", "실물을 담지 못했다", "사진보다 좋았다 = 최고의 풍경 묘사 📸"], ["weirdly", "묘하게", "카페 습관 편 weirdly relaxing 재활용 🔁"], ["In the end", "결국", "이야기를 정리 모드로 전환하는 시그널 ✅"], ["bring up (a story)", "(이야기를) 꺼내다", "공원 경험 편 마무리 표현 재활용 🔁 💬"]], "audio": "audio/1_서베이/1-016 3. 조깅_걷기(Jogging)_과거 경험2.mp3", "label": "과거 경험 2", "qaudio": "audio_q/1_서베이/1-016 3. 조깅_걷기(Jogging)_과거 경험2.mp3"}, {"id": "1-017", "cat": "survey", "catName": "서베이 질문", "num": 3, "topic": "조깅/걷기", "topicEn": "Jogging", "type": "비교", "badge": "17 비교", "enQ": "Compare your walking or jogging routine now with when you first started. What has changed - the places you go, the distance, or the way you exercise? Tell me about the differences in detail.", "enA": "My walking routine has changed a lot since I first started. Back then, I could barely walk for twenty minutes without getting out of breath. I only walked around my block, and honestly, it felt more like a chore than a hobby.\n\nI didn't have any gear either — just old sneakers and cotton T-shirts. And I used to check my phone every five minutes, literally counting down the time.\n\nThese days, it's a whole different level. I walk for over an hour along the riverside trail, sometimes mixing in light jogging. I've got proper running shoes, and instead of watching the clock, I actually enjoy every minute. So yeah, compared to when I started, I go farther, feel stronger, and enjoy it way more.", "koQ": "지금의 걷기/조깅 루틴과 처음 시작했을 때를 비교해주세요. 가는 장소, 거리, 운동 방식 중 무엇이 변화했나요? 그 차이점들을 자세히 말해주세요.", "koA": "제 걷기 루틴은 처음 시작했을 때와 비교하면 정말 많이 변했어요. 그때는 숨이 차지 않고 20분을 걷는 것도 힘들었어요. 동네 한 바퀴가 전부였고, 솔직히 취미라기보다는 숙제 같았죠.\n\n장비도 하나도 없었어요. 낡은 운동화에 면 티셔츠가 전부였죠. 그리고 5분마다 폰을 확인하면서 말 그대로 남은 시간을 세고 있었어요.\n\n요즘은 차원이 달라요. 강변 산책로를 한 시간 넘게 걷고, 가끔은 가벼운 조깅도 섞어요. 제대로 된 러닝화도 생겼고, 시계를 보는 대신 매 순간을 즐기고 있어요. 네, 처음과 비교하면 더 멀리 가고, 더 튼튼해졌고, 훨씬 더 즐기고 있어요.", "struct": [["1️⃣ 도입", "변화 인정 멘트 (changed a lot)"], ["2️⃣ 과거", "20분도 숨참 · 동네 한 바퀴"], ["3️⃣ 과거", "장비 없음 · 시간만 확인"], ["4️⃣ 현재", "1시간+ · 조깅 섞기 · 러닝화"], ["5️⃣ 마무리", "compared to + 3연속 마무리"]], "scoring": [["나의 성장 스토리로", "장소·거리·방식 비교에 그치지 말고 \"겨우 20분 → 1시간 이상\"처럼 성장 서사로 만들면 답변에 감동이 생겨요 📈"], ["질문의 세 가지 커버", "질문이 장소·거리·방식을 콕 집었어요. 동네→강변(장소), 20분→1시간(거리), 걷기→조깅 믹스(방식)로 다 채웠습니다 ✅"], ["마음가짐 변화 넣기", "시간 세기 → 매 순간 즐기기처럼 태도의 변화까지 넣으면 단순 비교가 아니라 이야기가 돼요 😊"], ["비교 공식 재활용", "Back then → These days → compared to + 3연속 마무리. 카페·공원 비교 편과 같은 공식, 이제 완전히 몸에 뱄죠? 🔁"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대 시그널, 시리즈 공통 🔁 🧩"], ["could barely ~", "겨우/간신히 ~했다", "초라했던 시작을 그리는 필수 표현 😅"], ["out of breath", "숨이 찬", "계기 편과 연결되는 재활용 표현 🔁"], ["more like a chore than a hobby", "취미보다는 숙제 같은", "취향 편 homework 비유의 비교 버전 🔁"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교 문제의 심장, 이번에도! 🔁 💓"], ["count down the time", "남은 시간을 세다", "억지로 하던 시절의 킬러 디테일 ⏱️"], ["a whole different level", "차원이 다른 수준", "공원 비교 편 업그레이드 표현 재활용 🔁 🆙"], ["mix in ~", "~을 섞다", "루틴의 발전을 보여 주는 동사 🏃"], ["instead of watching the clock", "시계를 보는 대신", "과거와 현재를 한 문장에서 대비 🎯"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["way more", "훨씬 더", "카페·공원 비교 편 마무리 강조 재활용 🔁"]], "audio": "audio/1_서베이/1-017 3. 조깅_걷기(Jogging)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-017 3. 조깅_걷기(Jogging)_비교.mp3"}, {"id": "1-018", "cat": "survey", "catName": "서베이 질문", "num": 4, "topic": "쇼핑", "topicEn": "Shopping", "type": "묘사", "badge": "18 묘사", "enQ": "Describe the stores or shopping malls in your country. What do they look like, and where are they located? What kinds of products do they sell? Is there a store you visit regularly?", "enA": "Shopping places in Korea? Oh, there's a huge variety. In every big city, you'll find massive shopping malls — with department stores, movie theaters, and food courts all under one roof. They're usually connected to big subway stations, so they're super easy to get to.\n\nBesides the malls, every neighborhood has its own local shops and traditional markets, where you can buy fresh food and daily necessities at lower prices. The malls are modern and shiny with floor-to-ceiling glass, while the markets are noisy, colorful, and full of energy.\n\nAs for me, I regularly visit the mall near my station — it's basically my go-to place for clothes and gifts, and I stop by about twice a month. So yeah, that's pretty much what shopping places are like in Korea.", "koQ": "당신의 나라에 있는 상점이나 쇼핑몰을 묘사해주세요. 어떻게 생겼고, 어디에 위치해 있나요? 어떤 상품을 판매하나요? 정기적으로 방문하는 가게가 있나요?", "koA": "한국의 쇼핑 장소요? 아, 종류가 정말 다양해요. 큰 도시마다 초대형 쇼핑몰이 있는데, 백화점, 영화관, 푸드코트까지 한 지붕 아래 다 모여 있어요. 보통 큰 지하철역과 연결되어 있어서 찾아가기도 아주 쉽죠.\n\n쇼핑몰 말고도 동네마다 동네 가게들과 전통시장이 있어서, 신선한 식재료나 생필품을 더 저렴하게 살 수 있어요. 쇼핑몰이 통유리로 된 현대적이고 반짝이는 느낌이라면, 시장은 시끌벅적하고 알록달록하고 에너지가 넘치는 곳이에요.\n\n저로 말하자면, 역 근처 쇼핑몰에 정기적으로 가요. 옷이나 선물을 살 때 가는 저의 단골 장소인데, 한 달에 두 번 정도 들르죠. 네, 한국의 쇼핑 장소는 대체로 이런 모습이에요.", "struct": [["1️⃣ 도입", "다양성 강조(a huge variety)"], ["2️⃣ 쇼핑몰", "한 지붕 아래 · 역과 연결"], ["3️⃣ 시장", "동네 가게 · 생필품 · 활기"], ["4️⃣ 대비", "현대적 몰 ↔ 시끌벅적 시장"], ["5️⃣ 마무리", "나의 단골 몰(go-to) + 정리"]], "scoring": [["몰 ↔ 시장 대비 구조", "현대적인 몰과 활기찬 시장을 대비시키면 나라 전체 묘사가 저절로 풍성해져요 🎨 while로 연결하는 게 포인트!"], ["질문 네 가지 다 답하기", "생김새·위치·판매 상품·단골 가게까지, 이 질문은 네 가지를 물어요. As for me로 마지막 질문을 챙기세요 ✅"], ["형용사 3연속 활용", "noisy, colorful, and full of energy처럼 형용사를 세 개 묶으면 묘사가 리듬을 타요 🎵 비교 편 마무리와 같은 기술!"], ["일반 → 나의 이야기", "나라 전체 이야기로 시작해 내 단골 가게로 좁히면 묘사 유형의 정석 흐름이 완성돼요 🔍 카페 묘사 편과 같은 원리 🔁"]], "expr": [["a huge variety", "아주 다양한 종류", "나라 단위 묘사의 안전한 첫 문장이에요 ✅"], ["all under one roof", "한 지붕 아래 다 모인", "한국 쇼핑몰 특징을 한 방에! 🏢"], ["super easy to get to", "찾아가기 아주 쉬운", "접근성 묘사 만능 표현, 영화 편에도 등장 🔁"], ["local shops", "동네 가게들", "몰과 대비되는 짝꿍 소재예요 🏪"], ["daily necessities", "생필품", "things we need보다 한 단계 위 어휘 📦"], ["floor-to-ceiling glass", "통유리", "카페 묘사 편 표현의 응용 버전 🔁 ✨"], ["noisy, colorful, and full of energy", "시끌벅적, 알록달록, 활기찬", "형용사 3연속으로 시장 분위기 완성 🎨"], ["As for me", "저로 말하자면", "일반 설명 → 내 이야기 전환 시그널 🔗"], ["my go-to place", "나의 단골 장소", "카페 묘사 편 재활용 🔁 단골 질문 정답!"], ["stop by ~", "~에 잠깐 들르다", "시리즈 개근 표현, 쇼핑에서도! 🔁"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-018 4. 쇼핑(Shopping)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-018 4. 쇼핑(Shopping)_묘사.mp3"}, {"id": "1-019", "cat": "survey", "catName": "서베이 질문", "num": 4, "topic": "쇼핑", "topicEn": "Shopping", "type": "습관", "badge": "19 습관", "enQ": "Many people enjoy shopping. Where do you normally shop, and how often do you go? Who do you usually shop with, and what do you typically buy? Give me as many details as possible.", "enA": "Where do I usually shop? Well, it depends on what I'm buying. For everyday stuff like groceries, I go to the supermarket near my house once or twice a week. For clothes or gifts, I head to the big mall near my station — maybe twice a month.\n\nI usually shop with my mom or my best friend, because honestly, I'm terrible at making decisions — I always need a second opinion! When we go to the mall, we usually make a day of it: we shop around, grab a coffee, and catch up while walking from store to store.\n\nOh, and one thing about me: I always compare prices on my phone before buying anything. I hate finding out later that I paid more, you know? So yeah, that's pretty much my shopping style.", "koQ": "많은 사람들이 쇼핑을 즐깁니다. 보통 어디에서 쇼핑을 하고, 얼마나 자주 가나요? 주로 누구와 함께 쇼핑하고, 일반적으로 무엇을 구매하나요? 가능한 많은 세부사항을 말해주세요.", "koA": "보통 어디서 쇼핑하냐고요? 음, 뭘 사느냐에 따라 달라요. 장보기 같은 일상 쇼핑은 집 근처 마트에서 일주일에 한두 번 하고요. 옷이나 선물은 역 근처 큰 쇼핑몰로 가요. 한 달에 두 번 정도요.\n\n쇼핑은 주로 엄마나 절친이랑 같이 해요. 솔직히 제가 결정을 정말 못 하거든요. 항상 다른 사람 의견이 필요해요! 쇼핑몰에 가면 보통 하루를 통째로 써요. 가게들을 둘러보고, 커피도 마시고, 이 가게 저 가게 다니면서 밀린 수다를 떨죠.\n\n아, 그리고 저만의 특징 하나. 뭘 사기 전에 항상 폰으로 가격을 비교해요. 나중에 더 비싸게 산 걸 알게 되는 게 정말 싫거든요. 네, 제 쇼핑 스타일은 대체로 이래요.", "struct": [["1️⃣ 도입", "품목별로 나누기(depends on)"], ["2️⃣ 장소", "마트(주 1~2회) · 몰(월 2회)"], ["3️⃣ 동행", "엄마·절친(second opinion)"], ["4️⃣ 루틴", "둘러보기 · 커피 · 수다"], ["5️⃣ 마무리", "가격 비교 습관 + 정리 멘트"]], "scoring": [["품목별로 나누기", "\"장보기는 마트, 옷은 몰\"처럼 품목 기준으로 나누면 장소와 빈도 질문에 한 번에 답할 수 있어요 🧩 습관 유형 필승 구조!"], ["동행에 이유 붙이기", "누구와 가는지만 말하지 말고 \"결정을 못 해서 second opinion이 필요하다\"처럼 이유를 붙이면 유머와 진정성을 다 잡아요 😆"], ["질문 네 가지 커버", "어디서·얼마나 자주·누구와·무엇을, 네 가지가 다 들어갔는지 꼭 확인하세요 ✅ 하나라도 빠지면 감점 포인트!"], ["나만의 습관 한 스푼", "가격 비교 습관 같은 개인 디테일이 as many details as possible이라는 요청에 대한 최고의 답이에요 💯"]], "expr": [["it depends on ~", "~에 따라 달라요", "카페 습관 편 오프닝 재활용 🔁 ⏳"], ["everyday stuff", "일상용품, 늘 사는 것들", "daily necessities의 구어체 버전 🔁"], ["head to ~", "~로 향하다", "go to보다 목적지 느낌이 사는 동사 🚶"], ["second opinion", "다른 사람의 의견", "결정장애 어필 + 유머까지 한 번에 😆"], ["make a day of it", "하루를 통째로 즐기다", "쇼핑 루틴의 스케일을 키우는 표현 🗓️"], ["shop around", "여기저기 둘러보다", "shopping 질문에서 무조건 쓰게 되는 동사 🛍️"], ["grab a coffee", "커피를 마시다", "카페 묘사 편 재활용 🔁 루틴 연결 고리!"], ["catch up", "밀린 수다를 떨다", "친구 동행 디테일의 필수 표현 🤝"], ["compare prices", "가격을 비교하다", "나만의 습관 킬러 디테일! 취향 편 재등장 🔁"], ["you know?", "있잖아요?", "공감 구하는 필러로 자연스러움 UP 🗣️"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-019 4. 쇼핑(Shopping)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-019 4. 쇼핑(Shopping)_습관.mp3"}, {"id": "1-020", "cat": "survey", "catName": "서베이 질문", "num": 4, "topic": "쇼핑", "topicEn": "Shopping", "type": "취향", "badge": "20 취향", "enQ": "Do you prefer shopping at big malls, small local shops, or online? Why do you like shopping that way? Tell me about your favorite way of shopping and the reasons.", "enA": "Malls, local shops, or online? Honestly, if I had to choose, I'd go for online shopping — like most Koreans these days, I guess.\n\nFor me, it's all about convenience. You can compare prices in seconds, read honest reviews from real buyers, and the delivery here is unbelievably fast — sometimes your order arrives the very next morning. That's why it's hard to go back to offline shopping once you get used to it.\n\nThat said, for clothes and shoes, I still prefer the mall, because you never know if things will fit until you try them on. So I guess I'm a hybrid shopper — online for most things, offline for fashion. That's my taste in a nutshell.", "koQ": "대형 쇼핑몰, 작은 동네 가게, 온라인 쇼핑 중 무엇을 선호하나요? 왜 그런 방식의 쇼핑을 좋아하나요? 가장 좋아하는 쇼핑 방식과 그 이유를 말해주세요.", "koA": "쇼핑몰, 동네 가게, 온라인 중에서요? 솔직히 굳이 골라야 한다면 저는 온라인 쇼핑을 선택할 거예요. 요즘 대부분의 한국인들처럼요.\n\n저한테는 편리함이 전부예요. 몇 초 만에 가격을 비교할 수 있고, 실제 구매자들의 솔직한 리뷰도 읽을 수 있고, 한국은 배송이 믿기 힘들 만큼 빨라요. 어떨 땐 주문한 게 바로 다음 날 아침에 도착하거든요. 그래서 한번 익숙해지면 오프라인 쇼핑으로 돌아가기가 힘든 거예요.\n\n그렇긴 해도, 옷이랑 신발은 여전히 쇼핑몰에 가서 사요. 입어 보기 전까지는 맞을지 알 수 없으니까요. 그러니까 저는 하이브리드 쇼퍼인 셈이에요. 대부분은 온라인, 패션은 오프라인. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 온라인(if I had to choose)"], ["2️⃣ 이유", "편리함이 전부(it's all about)"], ["3️⃣ 근거", "가격 비교 · 리뷰 · 초고속 배송"], ["4️⃣ 예외", "옷·신발은 오프라인(try on)"], ["5️⃣ 마무리", "hybrid shopper + in a nutshell"]], "scoring": [["세 선택지 다 언급", "질문이 몰·동네 가게·온라인 세 가지를 제시했어요. 하나를 고르되 나머지도 스쳐 줘야 완전한 답변이에요 ✅"], ["That said로 반전 주기", "\"그래도 옷은 오프라인\"이라는 예외 하나가 답변을 훨씬 현실적으로 만들어요 ✨ 100% 단정보다 진짜 같거든요!"], ["한국 문화 자랑하기", "초고속 배송(the very next morning)은 시험관에게 한국을 소개하는 재미 포인트예요 🚚 문화 디테일 = 기억에 남는 답변!"], ["신조어로 마무리", "hybrid shopper처럼 나를 한 단어로 정의하면 in a nutshell 마무리와 완벽한 세트가 돼요 😎"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 카페 취향 편 재활용 🔁"], ["go for ~", "~을 선택하다", "카페 취향 편 재활용 🔁 캐주얼 동사"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 시리즈 4연속! 🔁 🎯"], ["honest reviews", "솔직한 리뷰", "온라인 쇼핑 장점의 필수 어휘 ⭐"], ["the very next morning", "바로 다음 날 아침", "한국 배송 문화 자랑 디테일! 🚚"], ["That's why ~", "그래서 ~한 거예요", "이유 → 결론 연결 시그널 재활용 🔁 🔗"], ["get used to ~", "~에 익숙해지다", "변화 묘사 만능 패턴이에요 ✅"], ["That said", "그렇긴 해도", "예외를 꺼낼 때 쓰는 고급 전환 시그널 ✨"], ["try ~ on", "~을 입어 보다", "오프라인 쇼핑의 존재 이유! 👕"], ["hybrid shopper", "하이브리드 쇼퍼", "나만의 신조어로 취향을 요약 😎"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 시리즈 개근 🔁 ✅"]], "audio": "audio/1_서베이/1-020 4. 쇼핑(Shopping)_취향.mp3", "label": "취향", "qaudio": "audio_q/1_서베이/1-020 4. 쇼핑(Shopping)_취향.mp3"}, {"id": "1-021", "cat": "survey", "catName": "서베이 질문", "num": 4, "topic": "쇼핑", "topicEn": "Shopping", "type": "과거 경험", "badge": "21 과거 경험", "enQ": "Tell me about an unforgettable experience you had while shopping. What happened, and what were you trying to buy? Why do you still remember that experience?", "enA": "Oh, this reminds me of something that happened last year, right before my mom's birthday. I went to the mall to buy her a scarf she'd been wanting — and of course, the mall was totally packed because it was a holiday weekend.\n\nAfter thirty minutes of searching, I finally found the last one in stock. But guess what? At the counter, I realized I'd left my wallet at home. To be honest, I was a little panicked — it was the last one, and another customer was already eyeing it.\n\nLuckily, the clerk kindly offered to set it aside for me. I rushed home, grabbed my wallet, and made it back just in time. In the end, everything worked out fine, and my mom loved the gift. Since then, I've been double-checking my wallet before leaving home. So yeah, that's my most unforgettable shopping story.", "koQ": "쇼핑하면서 겪은 잊을 수 없는 경험에 대해 말해주세요. 무슨 일이 있었고, 무엇을 사려고 했었나요? 왜 아직도 그 경험을 기억하나요?", "koA": "아, 작년에 엄마 생신 직전에 있었던 일이 생각나네요. 엄마가 갖고 싶어 하시던 스카프를 사러 쇼핑몰에 갔는데, 하필 연휴 주말이라 쇼핑몰이 사람들로 꽉 차 있었어요.\n\n30분을 뒤진 끝에 드디어 마지막 남은 재고 하나를 찾았어요. 그런데 있잖아요, 계산대에서 지갑을 집에 두고 온 걸 알게 된 거예요. 솔직히 좀 당황했어요. 마지막 하나인데 다른 손님이 벌써 눈독을 들이고 있었거든요.\n\n다행히 점원분이 친절하게 따로 빼놓아 주겠다고 하셨어요. 집까지 달려가서 지갑을 들고 아슬아슬하게 시간 안에 돌아왔죠. 결국 다 잘 해결됐고, 엄마도 선물을 정말 좋아하셨어요. 그 후로는 집을 나서기 전에 지갑을 꼭 두 번씩 확인해요. 네, 이게 가장 잊을 수 없는 쇼핑 이야기예요.", "struct": [["1️⃣ 도입", "회상 시그널 + 엄마 생신 선물"], ["2️⃣ 상황", "꽉 찬 몰 · 마지막 재고 발견"], ["3️⃣ 문제", "지갑 놓고 옴 · 눈독 들이는 손님"], ["4️⃣ 해결", "점원이 따로 보관 · 극적 복귀"], ["5️⃣ 마무리", "해피엔딩 + 교훈(double-check)"]], "scoring": [["물건에 의미 부여하기", "그냥 스카프가 아니라 \"엄마 생신 선물, 마지막 재고\"예요 🎁 물건에 사연이 붙는 순간 긴장감이 저절로 생겨요!"], ["긴장 장치 이중으로", "지갑 없음 + 눈독 들이는 손님, 위기를 두 겹으로 쌓으면 해결의 카타르시스가 커져요 😱 스토리텔링 레벨 UP!"], ["'왜 기억하나' 답하기", "질문의 마지막 요소를 놓치지 마세요. 엄마가 좋아하셨다 + 교훈이 생겼다, 두 가지로 답하면 완벽해요 ✅"], ["경험 공식 재활용", "상황 → 문제 → 해결 → 교훈. 카페 경험 편과 같은 4단 공식이에요 🔁 주제가 바뀌어도 뼈대는 그대로!"]], "expr": [["This reminds me of ~", "~이 생각나네요", "경험 오프닝 6연속! 이제 반사 신경이죠 🔁 🔑"], ["totally packed", "사람들로 꽉 찬", "상황 설정 단골, 시리즈 재활용 🔁"], ["the last one in stock", "마지막 남은 재고", "긴장감을 만드는 쇼핑 전용 디테일 😱"], ["left my wallet at home", "지갑을 집에 두고 왔다", "누구나 공감하는 사건의 시작 💳"], ["guess what?", "그런데 있잖아요?", "반전 필러, 시리즈 재활용 🔁 😲"], ["a little panicked", "살짝 당황한", "카페 경험 편 감정 표현 재활용 🔁 😅"], ["eye ~", "~에 눈독 들이다", "경쟁자 등장! 긴장감 두 배로 👀"], ["set ~ aside", "~을 따로 빼놓다", "쇼핑 상황 필수 구동사예요 🛍️"], ["make it back just in time", "아슬아슬하게 돌아오다", "클라이맥스를 만드는 시간 표현 ⏰"], ["everything worked out fine", "결국 다 잘 해결됐다", "해피엔딩 공식, 시리즈 공통 🔁 ✨"], ["Since then, I've been -ing", "그 후로 쭉 ~하고 있다", "교훈 마무리 문법, 카페 경험 편 그대로 🔁"]], "audio": "audio/1_서베이/1-021 4. 쇼핑(Shopping)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/1_서베이/1-021 4. 쇼핑(Shopping)_과거 경험.mp3"}, {"id": "1-022", "cat": "survey", "catName": "서베이 질문", "num": 4, "topic": "쇼핑", "topicEn": "Shopping", "type": "비교", "badge": "22 비교", "enQ": "How has shopping changed compared to the past? What was shopping like when you were young, and how do people shop these days? Tell me about the differences.", "enA": "Shopping has changed completely since I was young. Back then, shopping meant actually going somewhere — my family used to drive to the market or a department store on weekends, and it was a whole family event.\n\nIf something wasn't available nearby, you had no choice but to wait or just give up. And comparing prices? You literally had to walk from store to store.\n\nThese days, it's a completely different story. People shop on their phones anytime, anywhere — on the subway or even lying in bed. Delivery takes a day, sometimes just hours. Malls are still popular, but now they're more about experiences than just buying things — eating, watching movies, hanging out. So yeah, compared to the past, shopping today is faster, easier, and way more convenient.", "koQ": "쇼핑은 과거와 비교해 어떻게 변화했나요? 당신이 어렸을 때 쇼핑은 어땠고, 요즘 사람들은 어떻게 쇼핑을 하나요? 그 차이점에 대해 말해주세요.", "koA": "쇼핑은 제가 어렸을 때와 비교하면 완전히 달라졌어요. 그때는 쇼핑이 곧 어딘가로 가는 일이었어요. 저희 가족은 주말마다 차를 타고 시장이나 백화점에 가곤 했는데, 그건 온 가족의 행사였죠.\n\n근처에서 구할 수 없는 물건이면 기다리거나 포기할 수밖에 없었어요. 가격 비교요? 말 그대로 가게에서 가게로 걸어 다녀야 했죠.\n\n요즘은 완전히 다른 이야기예요. 사람들은 언제 어디서나 폰으로 쇼핑해요. 지하철에서도, 심지어 침대에 누워서도요. 배송은 하루, 빠르면 몇 시간이면 오죠. 쇼핑몰도 여전히 인기지만, 이제는 물건을 사는 곳이라기보다 먹고, 영화 보고, 노는 경험의 공간이 됐어요. 네, 과거와 비교하면 요즘 쇼핑은 더 빠르고, 더 쉽고, 훨씬 더 편리해요.", "struct": [["1️⃣ 도입", "변화 인정 (changed completely)"], ["2️⃣ 과거", "주말 가족 행사 · 백화점 나들이"], ["3️⃣ 과거", "없으면 포기 · 발품 가격 비교"], ["4️⃣ 현재", "폰 쇼핑 · 당일 배송 · 체험 공간"], ["5️⃣ 마무리", "compared to + 3연속 마무리"]], "scoring": [["가족 추억으로 시작", "\"주말마다 온 가족이 백화점에\" 같은 어린 시절 장면이 when you were young이라는 질문 조건에 정확히 답해 줘요 🎞️"], ["불편함 구체화하기", "\"없으면 포기, 가격 비교는 발품\"처럼 과거의 불편을 구체적으로 그려야 현재의 편리함이 극적으로 보여요 🚶"], ["쇼핑몰의 역할 변화", "요즘 몰은 buying보다 experience의 공간이라는 관찰 한 줄이 답변의 격을 올려 줘요 💬 카페 비교 편의 공간 이야기와 같은 기술!"], ["비교 공식 재활용", "이제 다섯 번째 비교 문제! Back then → These days → compared to 공식이 완전히 자동화됐을 거예요 🔁 🎯"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔", "비교 뼈대, 시리즈 공통 시그널 🔁 🧩"], ["used to + 동사원형", "예전엔 ~하곤 했다", "비교의 심장, 개근 표현! 🔁 💓"], ["a whole family event", "온 가족의 행사", "그 시절 쇼핑의 감성을 한 방에 🎞️"], ["had no choice but to ~", "~할 수밖에 없었다", "카페 비교 편 고급 구문 재활용 🔁 💪"], ["from store to store", "가게에서 가게로", "발품 팔던 시절의 킬러 디테일 🚶"], ["it's a completely different story", "완전히 다른 이야기다", "전환 시그널, 카페 비교 편 재활용 🔁 🎭"], ["anytime, anywhere", "언제 어디서나", "리듬감 있는 대구 표현이에요 📱"], ["lying in bed", "침대에 누워서", "요즘 쇼핑을 그림으로 보여 주는 디테일 🛏️"], ["more about A than B", "B보다 A가 핵심인", "카페 비교 편 마무리 구문의 응용 🔁 💬"], ["compared to ~", "~과 비교하면", "비교 마무리 공식, 시리즈 공통 🔁 📊"], ["way more convenient", "훨씬 더 편리한", "카페 비교 편 마무리 그대로 재활용 🔁 🆙"]], "audio": "audio/1_서베이/1-022 4. 쇼핑(Shopping)_비교.mp3", "label": "비교", "qaudio": "audio_q/1_서베이/1-022 4. 쇼핑(Shopping)_비교.mp3"}, {"id": "1-023", "cat": "survey", "catName": "서베이 질문", "num": 5, "topic": "영화", "topicEn": "Movies", "type": "묘사", "badge": "23 묘사", "enQ": "Describe the movie theater you visit most often. Where is it, and what does it look like inside? Why do you like going to that theater?", "enA": "The movie theater I go to most often is the one inside the mall near my station. It's super easy to get to — just one subway stop from my place — so I stop by whenever a movie I've been waiting for comes out.\n\nInside, it's pretty modern. There's a big lobby with self-service kiosks, and the smell of freshly popped popcorn hits you the moment you walk in — honestly, that's half the reason I go. The seats are comfortable recliner-style ones, and the screen and sound system are top-notch.\n\nWhat I like most is how convenient everything is: I book my seat on my phone, pick up my popcorn, and walk straight in — no stress at all. So yeah, that's pretty much my favorite theater. It's basically my go-to place for weekend fun.", "koQ": "가장 자주 가는 영화관을 묘사해주세요. 어디에 있고, 내부는 어떻게 생겼나요? 왜 그 영화관에 가는 것을 좋아하나요?", "koA": "제가 가장 자주 가는 영화관은 역 근처 쇼핑몰 안에 있는 곳이에요. 집에서 지하철 한 정거장이라 찾아가기 아주 쉬워서, 기다리던 영화가 개봉하면 바로 들르죠.\n\n내부는 꽤 현대적이에요. 넓은 로비에 셀프 키오스크가 있고, 들어서는 순간 갓 튀긴 팝콘 냄새가 확 풍겨요. 솔직히 그게 영화관에 가는 이유의 절반이에요. 좌석은 편안한 리클라이너 스타일이고, 스크린과 음향 시설도 최고 수준이죠.\n\n제일 좋은 점은 모든 게 편리하다는 거예요. 폰으로 좌석을 예매하고, 팝콘을 픽업하고, 바로 들어가면 끝. 스트레스가 하나도 없어요. 네, 이게 제 최애 영화관이에요. 주말 나들이의 단골 장소죠.", "struct": [["1️⃣ 도입", "몰 안 영화관 · 지하철 한 정거장"], ["2️⃣ 로비", "키오스크 · 팝콘 냄새(후각!)"], ["3️⃣ 상영관", "리클라이너 좌석 · 최고 음향"], ["4️⃣ 좋은 점", "폰 예매 · 노 스트레스 동선"], ["5️⃣ 마무리", "주말 단골 장소(go-to) + 정리"]], "scoring": [["동선 따라 묘사하기", "로비(키오스크·팝콘) → 상영관(좌석·음향) 순서로, 실제로 걸어 들어가는 동선을 따라 묘사하면 절대 꼬이지 않아요 🚶"], ["후각 디테일 또 활용", "팝콘 냄새는 카페 편의 원두 향과 같은 기술이에요 🔁 🍿 장소 묘사마다 냄새 하나씩 넣는 습관을 들여 보세요!"], ["'왜 좋아하나' 챙기기", "이 질문은 Why까지 물어요. 편리함(폰 예매, 노 스트레스)을 이유로 콕 집어 답해 주세요 ✅"], ["재치 표현 한 스푼", "\"that's half the reason I go\"처럼 능청스러운 한마디가 암기 티를 지우고 대화 느낌을 살려 줘요 😊"]], "expr": [["super easy to get to", "찾아가기 아주 쉬운", "쇼핑 묘사 편 재활용 🔁 접근성 만능 표현"], ["stop by ~", "~에 잠깐 들르다", "시리즈 개근 동사, 영화관에서도! 🔁"], ["self-service kiosks", "셀프 키오스크", "한국 영화관 풍경의 필수 디테일 🎫"], ["freshly popped popcorn", "갓 튀긴 팝콘", "카페 편 원두 향처럼 후각 디테일! 🔁 🍿"], ["that's half the reason ~", "그게 이유의 절반이다", "재치 있게 애정을 표현하는 구문 😊"], ["recliner-style seats", "리클라이너 좌석", "요즘 영화관 묘사의 핵심 어휘 💺"], ["top-notch", "최고 수준의", "very good의 상위 호환! 짧고 강력해요 ✨"], ["book my seat on my phone", "폰으로 좌석을 예매하다", "디지털 라이프 디테일 📱"], ["walk straight in", "바로 들어가다", "편리한 동선을 그림처럼 보여 줘요 🚶"], ["my go-to place", "나의 단골 장소", "카페·쇼핑 편 재활용 🔁 단골 표현 3연속!"], ["that's pretty much ~", "대체로 ~이다", "마무리 시그널, 모든 편 공통 🔁"]], "audio": "audio/1_서베이/1-023 5. 영화(Movies)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/1_서베이/1-023 5. 영화(Movies)_묘사.mp3"}, {"id": "1-024", "cat": "survey", "catName": "서베이 질문", "num": 5, "topic": "영화", "topicEn": "Movies", "type": "습관", "badge": "24 습관", "enQ": "Who do you usually watch movies with, and is there a reason you go with that person? What do you normally do together before heading to the theater and after the movie ends?", "enA": "I usually watch movies with my best friend. The reason is simple: we have exactly the same taste in movies, so we never argue about what to watch. Plus, she's the perfect person to talk to after the movie.\n\nBefore heading to the theater, we always grab a quick bite nearby — usually something simple like burgers. And we have a little rule: we arrive early enough to get popcorn and watch the trailers, because for us, trailers are part of the fun.\n\nAfter the movie ends, we stop by a cafe and talk about it over a cup of coffee — what we loved, what disappointed us, our favorite scenes. Honestly, that after-movie chat is sometimes better than the movie itself. So yeah, that's pretty much our movie routine, and it never gets old.", "koQ": "주로 누구와 영화를 보고, 그 사람과 함께 가는 이유가 있나요? 영화관에 가기 전과 영화가 끝난 후에 보통 함께 무엇을 하나요?", "koA": "저는 주로 절친이랑 영화를 봐요. 이유는 간단해요. 영화 취향이 완전히 똑같아서 뭘 볼지 싸울 일이 없거든요. 게다가 영화 끝나고 이야기 나누기에 최고의 상대이기도 하고요.\n\n영화관에 가기 전에는 항상 근처에서 간단히 요기를 해요. 보통 햄버거 같은 간단한 걸로요. 그리고 우리만의 작은 규칙이 있는데, 팝콘을 사고 예고편까지 볼 수 있게 일찍 도착하는 거예요. 우리한테는 예고편도 재미의 일부거든요.\n\n영화가 끝나면 카페에 들러서 커피 한 잔을 마시며 영화 이야기를 해요. 뭐가 좋았는지, 뭐가 아쉬웠는지, 최고의 장면은 뭐였는지요. 솔직히 그 영화 후 수다가 가끔은 영화 자체보다 더 재밌어요. 네, 이게 우리의 영화 루틴인데, 아무리 반복해도 질리지 않아요.", "struct": [["1️⃣ 도입", "절친 + 이유(같은 취향)"], ["2️⃣ 관람전", "간단히 요기(quick bite)"], ["3️⃣ 입장", "일찍 도착 · 팝콘 · 예고편"], ["4️⃣ 관람 후", "카페 수다(after-movie chat)"], ["5️⃣ 마무리", "never gets old + 정리 멘트"]], "scoring": [["전-중-후 시간 구조", "질문이 before와 after를 콕 집었어요. 관람 전(요기) → 입장(팝콘·예고편) → 관람 후(카페 수다)로 나누면 완벽한 구조예요 ✅"], ["사람 + 이유 세트로", "누구와 보는지엔 반드시 이유를 붙이세요. \"취향이 같아서 안 싸운다\"는 간단하지만 누구나 공감하는 최고의 이유예요 🤝"], ["우리만의 규칙 넣기", "\"예고편까지 보는 게 규칙\" 같은 둘만의 약속이 루틴 답변을 특별하게 만들어요 🎬 공원 편 리워드와 같은 기술 🔁"], ["유머 반전 마무리", "\"수다가 영화보다 재밌다\"는 반전 한 줄로 웃음까지 챙기면 IH다운 여유가 완성돼요 😆"]], "expr": [["The reason is simple", "이유는 간단해요", "'왜?' 질문에 자신감 있게 답하는 오프닝 ✅"], ["have the same taste", "취향이 같다", "동행 이유의 만능 답변이에요 🤝"], ["Before heading to ~", "~로 가기 전에", "질문 표현 그대로 받아치기! 🎯"], ["grab a quick bite", "간단히 요기하다", "grab 시리즈 3탄! coffee→bite 확장 🔁 🍔"], ["arrive early", "일찍 도착하다", "루틴의 디테일을 살리는 기본 동사 ⏰"], ["trailers are part of the fun", "예고편도 재미의 일부", "영화 덕후 인증 킬러 디테일 🎬"], ["stop by ~", "~에 잠깐 들르다", "시리즈 개근! 영화 후 카페 연결 🔁"], ["over a cup of coffee", "커피 한 잔을 하면서", "카페 습관 편 over 패턴 재활용 🔁 ☕"], ["after-movie chat", "영화 후 수다", "나만의 합성어로 루틴에 이름 붙이기 💬"], ["better than the movie itself", "영화 자체보다 나은", "반전 유머로 마무리 직전 웃음 포인트 😆"], ["it never gets old", "아무리 해도 질리지 않는다", "공원·영화 습관 공통 마무리 🔁 😊"]], "audio": "audio/1_서베이/1-024 5. 영화(Movies)_습관.mp3", "label": "습관", "qaudio": "audio_q/1_서베이/1-024 5. 영화(Movies)_습관.mp3"}, {"id": "1-025", "cat": "survey", "catName": "서베이 질문", "num": 5, "topic": "영화", "topicEn": "Movies", "type": "취향", "badge": "25 취향", "enQ": "What genre of movies do you enjoy the most, and why? Tell me about the kinds of films you prefer in detail.", "enA": "If I had to choose one genre, I'd definitely go for comedies. Life is stressful enough, you know? When I watch a movie, it's all about switching my brain off and just laughing.\n\nI especially like comedies with warm stories — the kind that makes you laugh out loud but also leaves you with a warm feeling at the end. On the other hand, I'm not a big fan of horror movies. To be honest, I can't even watch them with my eyes open!\n\nMy taste can be flexible, though — if a movie has great reviews, I'll give it a try no matter the genre. But when it comes to my comfort pick for a Friday night, nothing beats a good comedy. That's my taste in a nutshell.", "koQ": "어떤 장르의 영화를 가장 즐겨 보고, 그 이유는 무엇인가요? 당신이 선호하는 영화 종류에 대해 자세히 말해주세요.", "koA": "장르를 하나만 골라야 한다면, 저는 무조건 코미디를 선택할 거예요. 사는 것만으로도 충분히 스트레스잖아요? 영화를 볼 때만큼은 머리를 끄고 그냥 웃는 게 전부예요.\n\n특히 따뜻한 이야기가 있는 코미디를 좋아해요. 큰 소리로 웃게 만들면서도 마지막엔 마음이 따뜻해지는, 그런 영화요. 반대로 공포 영화는 별로 안 좋아해요. 솔직히 눈 뜨고는 못 봐요!\n\n그래도 제 취향이 유연한 편이긴 해요. 평이 좋은 영화라면 장르 불문하고 한번 시도해 보거든요. 하지만 금요일 밤에 편하게 볼 영화라면, 좋은 코미디만 한 게 없죠. 한마디로 그게 제 취향이에요.", "struct": [["1️⃣ 도입", "선택 = 코미디(if I had to choose)"], ["2️⃣ 이유", "스트레스 해소 · 뇌 끄고 웃기"], ["3️⃣ 세부 취향", "웃음 + 따뜻한 결말 콤보"], ["4️⃣ 비선호", "공포 영화(눈 뜨고 못 봄!)"], ["5️⃣ 마무리", "nothing beats + in a nutshell"]], "scoring": [["취향 공식 완전 정착", "카페부터 영화까지, if I had to choose → it's all about → in a nutshell 공식이 다섯 번째예요 🔁 취향 유형은 이제 눈 감고도!"], ["세부 취향으로 깊이", "그냥 코미디가 아니라 \"웃기면서 따뜻한 코미디\"처럼 한 단계 더 들어가면 in detail 요청에 정확히 답하게 돼요 🎬"], ["비선호 + 유머", "\"공포는 눈 뜨고 못 봐요!\" 같은 자기 비하 유머는 취향을 선명하게 하면서 웃음까지 챙기는 일석이조예요 😱"], ["유연함 한 줄 넣기", "\"평 좋으면 장르 불문 시도\"라는 한 줄이 외골수가 아닌 자연스러운 사람으로 보이게 해 줘요 🙆"]], "expr": [["if I had to choose", "굳이 골라야 한다면", "취향 오프닝, 쇼핑 취향 편 재활용 🔁"], ["go for ~", "~을 선택하다", "취향 시리즈 단골 동사 🔁 👍"], ["it's all about ~", "~이 전부다/핵심이다", "취향 핵심 구문, 5연속 등장! 🔁 🎯"], ["switch my brain off", "머리를 끄다", "힐링 무비 취향을 한 방에 설명 🧠"], ["laugh out loud", "큰 소리로 웃다", "LOL의 원형! 코미디 취향 필수 표현 😂"], ["leave ~ with a warm feeling", "~을 따뜻한 기분으로 남기다", "결말 취향까지 말하면 디테일 만점 🎬"], ["not a big fan of ~", "~을 별로 안 좋아하는", "hate보다 부드러운 비선호 표현 ✅"], ["with my eyes open", "눈을 뜨고", "can't watch와 세트로 유머 완성 😱"], ["give it a try", "한번 시도해 보다", "유연한 취향 어필의 만능 표현 🙆"], ["nothing beats ~", "~만 한 게 없다", "공원·조깅 취향 편 재활용 🔁 💯"], ["in a nutshell", "한마디로 요약하면", "취향 마무리 공식, 5연속 개근! 🔁 ✅"]], "audio": "audio/1_서베이/1-025 5. 영화(Movies)_취향.mp3", "label": "취향", "qaudio": "audio_q
