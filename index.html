대예요. 절친이 빵 터지는 소리를 실제로 듣는 것만 한 게 없죠. 이모지는 따뜻한 목소리처럼 안아 줄 수 없으니까요.\n\n그래서 제 시스템은 단순해요. 정보는 문자로, 마음은 전화로. 한마디로 저는 삶을 관리하려고 문자하고, 삶을 느끼려고 전화해요.", "struct": [["1️⃣ 선언", "일상은 문자 (타이밍 자유)"], ["2️⃣ 이유", "일정 · 주소 · 사진 · 링크"], ["3️⃣ 예외", "사랑하는 사람은 통화!"], ["4️⃣ 근거", "웃음소리 > 이모지"], ["5️⃣ 마무리", "정보는 문자, 마음은 전화"]], "expr": [["If I had to choose", "굳이 하나를 고르자면"], ["it's all about ~", "핵심은 ~이다"], ["whenever we're free", "서로 시간 될 때"], ["zero pressure", "부담 제로"], ["A over B any day", "두말없이 B보다 A"], ["Don't get me wrong", "오해는 마세요"], ["the complete opposite", "완전히 반대"], ["Nothing beats ~", "~만 한 게 없다"], ["burst out laughing", "빵 터지다"], ["texts for information, calls for hearts", "정보는 문자, 마음은 전화"], ["In a nutshell", "한마디로 정리하면"]], "audio": "audio/2_돌발/2-018 4. 전화(Phone Calls)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-018 4. 전화(Phone Calls)_취향.mp3"}, {"id": "2-019", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "과거 경험", "badge": "19 과거 경험", "enQ": "Tell me about a phone conversation you still remember. When was it, and who were you talking to? Was there anything interesting about it?", "enA": "This reminds me of a call I'll never forget: the famous midnight call from my best friend, two years ago. I was already in bed when my phone rang out of nowhere.\n\nShe skipped hello completely and just yelled: Gangneung! First sunrise! The night bus leaves in two hours! I thought she was joking. She was not. Guess what — forty minutes later I was packing a bag, half asleep, laughing at how crazy we were.\n\nThat call turned into the sunrise trip I always talk about: the freezing beach, thousands of strangers, goosebumps at dawn. Everything worked out perfectly. Since then, whenever my phone rings late at night, I get a little excited — it might be another adventure calling. Best call of my life, honestly.", "koQ": "아직도 기억나는 전화 통화에 대해 말해주세요. 언제였고, 누구와 통화하고 있었나요? 어떤 흥미로운 점이 있었나요?", "koA": "절대 못 잊을 통화가 생각나네요. 2년 전 절친의 그 유명한 자정 전화요. 저는 이미 침대에 누워 있었는데, 폰이 난데없이 울린 거예요.\n\n걔는 인사를 완전히 건너뛰고 그냥 소리쳤어요. 강릉! 새해 첫 일출! 밤 버스 두 시간 뒤 출발! 농담인 줄 알았어요. 아니었어요. 그런데 있잖아요. 40분 뒤에 저는 반쯤 잠든 채로 가방을 싸며, 우리가 얼마나 미쳤는지 웃고 있었어요.\n\n그 전화가 제가 늘 이야기하는 그 일출 여행이 됐어요. 살을 에는 해변, 수천 명의 낯선 사람들, 새벽의 소름까지요. 모든 게 완벽하게 흘러갔죠. 그 후로 밤늦게 폰이 울리면 살짝 설레요. 또 다른 모험이 걸려 오는 걸지도 모르니까요. 솔직히 제 인생 최고의 전화예요.", "struct": [["1️⃣ 도입", "2년 전 절친의 자정 전화"], ["2️⃣ 대사", "강릉! 일출! 버스 2시간 뒤!"], ["3️⃣ 행동", "40분 만에 가방 싸기"], ["4️⃣ 결과", "그 유명한 일출 여행으로"], ["5️⃣ 마무리", "밤 전화 = 모험의 설렘"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["midnight call", "자정 전화"], ["out of nowhere", "난데없이, 갑자기"], ["skip hello completely", "인사를 완전히 건너뛰다"], ["She was not.", "아니었어요."], ["Guess what", "글쎄, 그런데 있잖아요"], ["half asleep", "반쯤 잠든 채로"], ["goosebumps", "소름"], ["worked out perfectly", "완벽하게 흘러갔다"], ["Since then", "그 후로"], ["best call of my life", "인생 최고의 전화"]], "audio": "audio/2_돌발/2-019 4. 전화(Phone Calls)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-019 4. 전화(Phone Calls)_과거 경험.mp3"}, {"id": "2-020", "cat": "unexpected", "catName": "돌발 질문", "num": 4, "topic": "전화", "topicEn": "Phone Calls", "type": "비교", "badge": "20 비교", "enQ": "Compare the way people talk on the phone today with the past. How have phone conversations changed since you were young? Tell me about the differences.", "enA": "Phone calls have changed completely since I was young. Back then, the phone was a family object: one landline in the living room, with an actual cord. I used to memorize my friends' numbers by heart, and calling a friend meant getting past the scariest gatekeeper — their dad picking up first!\n\nCalls were precious too. Phone bills were a real thing, so my mom would knock on the wall if I talked too long.\n\nThese days, it's a completely different story. Everyone carries their own phone, so we call people, not houses. Video calls are the default with my family, and earbuds let calls happen anywhere — walking, shopping, even jogging. Compared to the past, calling is way freer and more casual. Though I have to admit, I miss knowing numbers by heart. These days I remember exactly two: my mom's and my best friend's.", "koQ": "오늘날 사람들이 전화하는 방식과 과거를 비교해주세요. 당신이 어렸을 때 이후로 전화 통화는 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "전화는 제가 어릴 때에 비해 완전히 달라졌어요. 그때 전화기는 가족의 물건이었죠. 거실에 유선 전화기 한 대, 진짜 전화선이 달린 거요. 저는 친구들 번호를 통째로 외우고 다녔고, 친구에게 전화한다는 건 가장 무서운 문지기를 통과하는 일이었어요. 친구 아빠가 먼저 받는 거요!\n\n통화는 귀한 것이기도 했어요. 전화 요금이 진짜 무서웠거든요. 제가 너무 오래 통화하면 엄마가 벽을 두드리셨어요.\n\n요즘은 완전히 다른 이야기예요. 모두가 자기 폰을 들고 다니니까, 우리는 집이 아니라 사람에게 전화하죠. 가족과는 영상통화가 기본이고, 이어폰 덕분에 어디서든 통화해요. 걸으면서, 쇼핑하면서, 심지어 조깅하면서도요. 과거와 비교하면 통화는 훨씬 자유롭고 가벼워졌어요. 그래도 인정할게요. 번호를 외우던 시절이 그리워요. 요즘 제가 외우는 번호는 딱 두 개예요. 엄마, 그리고 절친이요.", "struct": [["1️⃣ 도입", "가족의 물건이던 전화기"], ["2️⃣ 과거", "거실 유선전화 · 번호 암기 · 아빠 문지기"], ["3️⃣ 요금", "전화비 공포 · 엄마의 벽 노크"], ["4️⃣ 현재", "1인 1폰 · 영상통화 · 이어폰"], ["5️⃣ 마무리", "way more + 외운 번호 두 개"]], "expr": [["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["landline", "유선 전화"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["memorize ~ by heart", "~을 통째로 외우다"], ["gatekeeper", "문지기"], ["phone bill", "전화 요금"], ["it's a completely different story", "완전히 다른 이야기다"], ["people, not houses", "집이 아니라 사람에게"], ["video call", "영상통화"], ["compared to ~", "~과 비교하면"], ["I have to admit", "인정할게요"]], "audio": "audio/2_돌발/2-020 4. 전화(Phone Calls)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-020 4. 전화(Phone Calls)_비교.mp3"}, {"id": "2-021", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "묘사", "badge": "21 묘사", "enQ": "Do you remember your first cell phone? What did it look like, and what features did it have? Describe your first phone in as much detail as possible.", "enA": "Oh, my first cell phone! I got it in middle school, and I still remember everything about it. It was a folder phone — you know, the kind you flip open — in a shiny pearl-white color.\n\nThe screen was tiny, with actual buttons below, and my thumbs got seriously fast on them. The features were, by today's standards, adorable: text messages, a camera that made everything look like a potato, and downloadable ringtones. I saved up my allowance to buy an IU song as my ringtone — of course I did! And the best part: a little phone charm hanging from it, a gift from my best friend.\n\nIt had almost no internet, but honestly, I loved that phone more than any phone since. Snapping it shut after a call — that click was pure satisfaction. Nothing flashy, but it was my first little piece of freedom.", "koQ": "첫 휴대폰을 기억하나요? 어떻게 생겼고, 어떤 기능이 있었나요? 당신의 첫 휴대폰을 가능한 자세히 묘사해주세요.", "koA": "아, 제 첫 휴대폰이요! 중학생 때 받았는데, 아직도 전부 기억나요. 폴더폰이었어요. 왜, 젖혀서 여는 그런 거요. 반짝이는 진주 흰색이었죠.\n\n화면은 조그맣고 아래엔 진짜 버튼들이 있었는데, 제 엄지손가락이 거기서 엄청나게 빨라졌어요. 기능은 요즘 기준으로 보면 귀여운 수준이었어요. 문자 메시지, 모든 걸 감자처럼 찍는 카메라, 그리고 다운로드 벨소리요. 용돈을 모아서 아이유 노래를 벨소리로 샀어요. 당연히 그랬죠! 그리고 최고는, 폰에 달려 있던 작은 폰 줄이에요. 절친이 준 선물이었거든요.\n\n인터넷은 거의 안 됐지만, 솔직히 그 이후 어떤 폰보다 그 폰을 사랑했어요. 통화 끝나고 딱 접는 그 소리, 순수한 만족감이었죠. 화려하진 않았지만, 제 첫 번째 작은 자유였어요.", "struct": [["1️⃣ 도입", "중학생 · 진주색 폴더폰"], ["2️⃣ 외관", "작은 화면 + 진짜 버튼"], ["3️⃣ 기능", "문자 · 감자 카메라 · 벨소리"], ["4️⃣ 애착", "아이유 벨소리 + 절친 폰 줄"], ["5️⃣ 마무리", "딱 접는 소리 = 첫 자유"]], "expr": [["folder phone", "폴더폰"], ["flip open", "젖혀서 열다"], ["pearl-white", "진주 흰색의"], ["actual buttons", "진짜 버튼들"], ["by today's standards", "요즘 기준으로 보면"], ["look like a potato", "감자처럼 나오다"], ["save up", "(돈을) 모으다"], ["phone charm", "폰 줄, 폰 참"], ["snap it shut", "딱 소리 나게 접다"], ["pure satisfaction", "순수한 만족감"], ["nothing flashy", "화려하진 않은"]], "audio": "audio/2_돌발/2-021 5. 휴대폰(Cell Phone)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-021 5. 휴대폰(Cell Phone)_묘사.mp3"}, {"id": "2-022", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "습관", "badge": "22 습관", "enQ": "What do you usually do with your cell phone during the day? Which apps do you use the most, and when do you use your phone most often? Describe your phone habits.", "enA": "Honestly, my phone is glued to my hand all day, so let me walk you through a typical day. It starts as my alarm clock, and while I'm still in bed, I check messages and the weather.\n\nDuring my commute, it's news and YouTube time. My top three apps? The messenger app for everything social, YouTube for everything else, and my music app — my IU playlist powers my evening jogs along the river. My banking app gets a daily tap too: checking my Italy fund never gets old!\n\nEvening is peak phone time: calls during my walk, then streaming something on the sofa. My one golden rule: after eleven, the phone goes face-down and my wind-down playlist takes over. Without that rule, I'd scroll until sunrise. So yeah, that's pretty much my phone day — from alarm to lullaby.", "koQ": "하루 동안 휴대폰으로 주로 무엇을 하나요? 어떤 앱을 가장 많이 사용하고, 언제 휴대폰을 가장 자주 사용하나요? 당신의 휴대폰 사용 습관을 설명해주세요.", "koA": "솔직히 제 폰은 하루 종일 손에 딱 붙어 있어요. 평범한 하루를 차근차근 설명해 드릴게요. 폰은 알람 시계로 하루를 시작하고, 침대에 누운 채로 메시지랑 날씨를 확인해요.\n\n출퇴근길엔 뉴스와 유튜브 시간이에요. 제 톱3 앱이요? 소셜은 전부 메신저 앱, 나머지는 전부 유튜브, 그리고 음악 앱이요. 아이유 플레이리스트가 저녁 강변 조깅의 동력이거든요. 은행 앱도 매일 한 번씩 열어요. 이탈리아 자금 확인은 봐도 봐도 질리지 않아요!\n\n저녁은 폰 사용의 피크 타임이에요. 산책하며 통화하고, 소파에서 뭔가를 스트리밍하죠. 단 하나의 황금률은, 11시 이후엔 폰을 뒤집어 놓고 윈드다운 플레이리스트가 넘겨받는 거예요. 그 규칙이 없으면 해 뜰 때까지 스크롤할 테니까요. 네, 제 폰 하루는 대체로 이래요. 알람에서 자장가까지요.", "struct": [["1️⃣ 아침", "알람 → 침대에서 메시지·날씨"], ["2️⃣ 낮", "출퇴근 뉴스 · 유튜브"], ["3️⃣ 앱", "메신저 · 유튜브 · 음악 (톱3)"], ["4️⃣ 저녁", "산책 통화 + 소파 스트리밍"], ["5️⃣ 마무리", "11시 뒤집기 룰 + 자장가"]], "expr": [["glued to my hand", "손에 딱 붙어 있는"], ["let me walk you through ~", "~을 차근차근 설명할게요"], ["alarm clock", "알람 시계"], ["top three apps", "톱3 앱"], ["power my evening jogs", "저녁 조깅의 동력이 되다"], ["banking app", "은행 앱"], ["peak phone time", "폰 사용 피크 타임"], ["face-down", "(화면을) 뒤집어 놓은"], ["wind down", "긴장을 풀다"], ["scroll until sunrise", "해 뜰 때까지 스크롤하다"], ["from alarm to lullaby", "알람에서 자장가까지"]], "audio": "audio/2_돌발/2-022 5. 휴대폰(Cell Phone)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-022 5. 휴대폰(Cell Phone)_습관.mp3"}, {"id": "2-023", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "취향", "badge": "23 취향", "enQ": "What do you consider the most when choosing a new cell phone - the design, the camera, or the price? Why is that important to you? Tell me in detail.", "enA": "Between design, camera, and price? If I had to choose, the camera wins, no contest. For me, it's all about the memories: trips, concerts, food — my phone is basically my life's photographer.\n\nI'd pick a great camera over a pretty design any day. Think about it: the design disappears into a case on day one, but photos last forever. My Gangneung sunrise shots and my concert videos? All thanks to a good camera. Don't get me wrong — I still hunt for deals like a pro when I actually buy one. My shopping instincts never rest!\n\nBut nothing beats zooming into a night-view photo that came out perfectly clear. In a nutshell: the price matters for a month, the design for a year — but the camera matters forever.", "koQ": "새 휴대폰을 고를 때 디자인, 카메라, 가격 중 무엇을 가장 중요하게 생각하나요? 왜 그것이 중요한가요? 자세히 말해주세요.", "koA": "디자인, 카메라, 가격 중에서요? 굳이 고르자면 카메라 승이에요. 고민할 것도 없어요. 저한테는 추억이 전부거든요. 여행, 콘서트, 음식까지. 제 폰은 사실상 제 인생의 사진사예요.\n\n예쁜 디자인보다는 두말없이 좋은 카메라를 고를 거예요. 생각해 보세요. 디자인은 첫날 케이스 속으로 사라지지만, 사진은 영원히 남잖아요. 제 강릉 일출 사진들과 콘서트 영상들이요? 전부 좋은 카메라 덕분이죠. 오해는 마세요. 실제로 살 때는 여전히 프로처럼 특가를 사냥해요. 제 쇼핑 본능은 쉬는 법이 없거든요!\n\n하지만 야경 사진을 확대했는데 완벽하게 선명할 때, 그것만 한 게 없어요. 한마디로 가격은 한 달, 디자인은 일 년, 하지만 카메라는 영원히 중요해요.", "struct": [["1️⃣ 선언", "카메라 승, no contest"], ["2️⃣ 이유", "추억 = 여행 · 콘서트 · 음식"], ["3️⃣ 논리", "디자인은 케이스 속으로"], ["4️⃣ 예외", "가격은 특가 사냥으로 해결"], ["5️⃣ 마무리", "한 달 · 일 년 · 영원히"]], "expr": [["If I had to choose", "굳이 하나를 고르자면"], ["no contest", "고민할 것도 없이"], ["it's all about ~", "핵심은 ~이다"], ["my life's photographer", "내 인생의 사진사"], ["A over B any day", "두말없이 B보다 A"], ["on day one", "첫날부터"], ["photos last forever", "사진은 영원히 남는다"], ["Don't get me wrong", "오해는 마세요"], ["hunt for deals", "특가를 사냥하다"], ["Nothing beats ~", "~만 한 게 없다"], ["In a nutshell", "한마디로 정리하면"]], "audio": "audio/2_돌발/2-023 5. 휴대폰(Cell Phone)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-023 5. 휴대폰(Cell Phone)_취향.mp3"}, {"id": "2-024", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "과거 경험", "badge": "24 과거 경험", "enQ": "Tell me about a memorable phone conversation you have had. When was it, and who were you talking to? What made it so special? Give me many details.", "enA": "This reminds me of the most dramatic call of my life: the day I finally won the ticket war for IU's concert last year. It had taken me three tries over three years, so this was a huge deal.\n\nThe second the payment screen said success, I called my best friend with shaking hands. She picked up. I said nothing — I just screamed. Guess what: she screamed right back. No words at all, just two people screaming at each other for a solid thirty seconds. The neighbors probably worried about us!\n\nWhen we finally calmed down, we spent an hour planning everything: outfits, lightsticks, dinner near the dome. Everything about that call was pure joy, and since then, the screaming call has become our code word for great news. What made it special? Happiness is louder when it's shared.", "koQ": "기억에 남는 전화 통화에 대해 말해주세요. 언제였고, 누구와 통화하고 있었나요? 무엇이 그것을 특별하게 만들었나요? 많은 세부사항을 말해주세요.", "koA": "제 인생 가장 드라마틱한 통화가 생각나네요. 작년에 드디어 아이유 콘서트 티켓팅 전쟁에서 승리한 날이요. 3년간 3번의 도전 끝이었으니, 정말 엄청난 일이었죠.\n\n결제 화면에 성공이 뜬 순간, 떨리는 손으로 절친에게 전화했어요. 걔가 받았고, 저는 아무 말도 안 했어요. 그냥 소리를 질렀죠. 그런데 있잖아요. 걔도 바로 같이 소리를 질러 줬어요. 말은 하나도 없이, 두 사람이 30초 동안 서로에게 소리만 지른 거예요. 이웃들이 아마 걱정했을 거예요!\n\n겨우 진정하고 나서는 한 시간 동안 모든 걸 계획했어요. 옷, 응원봉, 돔 근처 저녁 식사까지요. 그 통화의 모든 게 순수한 기쁨이었고, 그 후로 소리 지르는 전화는 좋은 소식을 뜻하는 우리만의 암호가 됐어요. 뭐가 특별했냐고요? 행복은 나눌 때 더 커지니까요.", "struct": [["1️⃣ 도입", "작년 · 티켓팅 3수 성공의 날"], ["2️⃣ 절정", "말 없이 30초 비명 듀엣"], ["3️⃣ 계획", "옷 · 응원봉 · 돔 근처 저녁"], ["4️⃣ 감정", "pure joy"], ["5️⃣ 마무리", "비명 전화 = 좋은 소식 암호"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["win the ticket war", "티켓팅 전쟁에서 이기다"], ["three tries over three years", "3년간 3번의 도전"], ["a huge deal", "엄청난 일"], ["with shaking hands", "떨리는 손으로"], ["scream", "소리 지르다"], ["Guess what", "글쎄, 그런데 있잖아요"], ["a solid thirty seconds", "꼬박 30초"], ["pure joy", "순수한 기쁨"], ["code word", "암호, 우리만의 신호"], ["Happiness is louder when it's shared", "행복은 나눌 때 더 커진다"]], "audio": "audio/2_돌발/2-024 5. 휴대폰(Cell Phone)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-024 5. 휴대폰(Cell Phone)_과거 경험.mp3"}, {"id": "2-025", "cat": "unexpected", "catName": "돌발 질문", "num": 5, "topic": "휴대폰", "topicEn": "Cell Phone", "type": "비교", "badge": "25 비교", "enQ": "Compare your first cell phone with the one you use now. How are they different? Tell me about the changes in as much detail as possible.", "enA": "Comparing my first phone with my current one is like comparing a bicycle with a spaceship. Back then, my pearl-white folder phone could call, text, and take potato-quality photos — and that was basically it. I used to type on buttons, download one song at a time, and snap it shut with that satisfying click.\n\nMy current phone? It's my camera, wallet, bank, cinema, and jukebox — my entire life in one slab of glass. The photos are crystal clear, and I stream any song instantly instead of saving my allowance for one ringtone.\n\nThese days, it's a completely different story — compared to the folder phone, my smartphone is way more powerful. But I have to admit: no smartphone will ever match the joy of snapping a folder phone shut after a call. Some clicks are just irreplaceable.", "koQ": "첫 휴대폰과 지금 사용하는 휴대폰을 비교해주세요. 둘은 어떻게 다른가요? 그 변화에 대해 가능한 자세히 말해주세요.", "koA": "제 첫 폰과 지금 폰을 비교하는 건 자전거와 우주선을 비교하는 것 같아요. 그때 제 진주색 폴더폰은 전화, 문자, 화질이 엉망인 사진이 할 수 있는 것의 전부였어요. 버튼으로 타자를 치고, 노래를 한 곡씩 다운받고, 그 만족스러운 딸깍 소리와 함께 딱 접곤 했죠.\n\n지금 제 폰이요? 카메라이자 지갑이고, 은행이고, 영화관이고, 주크박스예요. 유리판 한 장에 담긴 제 인생 전부죠. 사진은 수정처럼 선명하고, 벨소리 한 곡을 위해 용돈을 모으는 대신 아무 노래나 즉시 스트리밍해요.\n\n요즘은 완전히 다른 이야기예요. 폴더폰과 비교하면 스마트폰은 훨씬 강력하죠. 하지만 인정할게요. 통화 끝나고 폴더폰을 딱 접던 그 기쁨은 어떤 스마트폰도 못 따라와요. 어떤 딸깍임은 그냥 대체 불가능하거든요.", "struct": [["1️⃣ 도입", "자전거 vs 우주선 비유"], ["2️⃣ 과거", "전화 · 문자 · 감자 화질 사진뿐"], ["3️⃣ 현재", "지갑 · 은행 · 영화관 · 주크박스"], ["4️⃣ 대비", "용돈 벨소리 vs 즉시 스트리밍"], ["5️⃣ 마무리", "딸깍의 낭만은 대체 불가"]], "expr": [["like comparing A with B", "A와 B를 비교하는 것 같다"], ["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["that was basically it", "그게 사실상 전부였다"], ["one song at a time", "노래 한 곡씩"], ["a slab of glass", "유리판 한 장"], ["crystal clear", "수정처럼 선명한"], ["it's a completely different story", "완전히 다른 이야기다"], ["compared to ~", "~과 비교하면"], ["way more powerful", "훨씬 더 강력한"], ["irreplaceable", "대체 불가능한"]], "audio": "audio/2_돌발/2-025 5. 휴대폰(Cell Phone)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-025 5. 휴대폰(Cell Phone)_비교.mp3"}, {"id": "2-026", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "묘사", "badge": "26 묘사", "enQ": "Which website do you visit the most? What does the site offer, and what can people do there? Describe your favorite website in detail.", "enA": "The website I visit the most? YouTube, hands down — I'm there every single day. Simply put, it offers videos on literally everything: music, cooking, travel, news, you name it.\n\nWhat can people do there? Watch, of course, but also leave comments, build playlists, and follow their favorite creators. And the famous algorithm keeps recommending things you might like — honestly, it knows me too well. One cooking video, and my whole feed turns into a kitchen!\n\nFor me, YouTube is basically my TV, my radio, and my cooking teacher all in one. I watch IU's concert clips, follow recipe channels — that's how I learned my kimchi fried rice! — and end the day with calm vlogs. So yeah, that's pretty much my favorite corner of the internet.", "koQ": "가장 자주 방문하는 웹사이트는 무엇인가요? 그 사이트는 무엇을 제공하고, 사람들은 그곳에서 무엇을 할 수 있나요? 가장 좋아하는 웹사이트를 자세히 설명해주세요.", "koA": "제가 가장 자주 방문하는 웹사이트요? 두말할 것 없이 유튜브예요. 매일같이 들어가 있거든요. 간단히 말해, 유튜브는 말 그대로 모든 것에 대한 영상을 제공해요. 음악, 요리, 여행, 뉴스, 뭐든지요.\n\n사람들이 거기서 뭘 할 수 있냐고요? 당연히 시청이죠. 그런데 댓글도 남기고, 재생목록도 만들고, 좋아하는 크리에이터를 구독할 수도 있어요. 그리고 그 유명한 알고리즘이 취향에 맞을 만한 걸 계속 추천해 주죠. 솔직히 저를 너무 잘 알아요. 요리 영상 하나 봤더니 피드 전체가 주방이 됐다니까요!\n\n저한테 유튜브는 TV이자 라디오이자 요리 선생님이에요. 아이유 콘서트 영상을 보고, 레시피 채널을 챙겨 보고 (제 김치볶음밥도 그렇게 배웠어요!) 잔잔한 브이로그로 하루를 마무리하죠. 네, 인터넷에서 제가 가장 좋아하는 구석은 대체로 이래요.", "struct": [["1️⃣ 선언", "유튜브, hands down · 매일 접속"], ["2️⃣ 제공", "모든 것에 대한 영상"], ["3️⃣ 활동", "시청 · 댓글 · 재생목록 · 구독"], ["4️⃣ 특징", "알고리즘 추천 (나를 잘 앎)"], ["5️⃣ 마무리", "TV+라디오+요리 선생님"]], "expr": [["hands down", "두말할 것 없이"], ["every single day", "매일같이"], ["simply put", "간단히 말해"], ["videos on literally everything", "말 그대로 모든 것의 영상"], ["you name it", "뭐든지요"], ["creator", "크리에이터"], ["algorithm", "알고리즘"], ["it knows me too well", "나를 너무 잘 안다"], ["my TV, my radio, and my cooking teacher", "TV이자 라디오이자 요리 선생님"], ["recipe channel", "레시피 채널"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/2_돌발/2-026 6. 인터넷(Internet)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-026 6. 인터넷(Internet)_묘사.mp3"}, {"id": "2-027", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "습관", "badge": "27 습관", "enQ": "What devices do you usually use to surf the internet? When and where do you usually go online? Tell me about your internet habits in detail.", "enA": "My internet setup is simple, so let me walk you through it. Nine times out of ten, I go online with my smartphone — it's glued to my hand anyway. For bigger things, like booking hotels or watching something long, I switch to my laptop for the big screen.\n\nAs for when and where: I'm online in little pieces all day — news during my commute, quick searches at lunch, music streaming on my evening jog. But my main session is at night, on my gray sofa, laptop open, tea in hand.\n\nAnd I have one golden rule, same as my phone rule: after eleven, screens off, no exceptions — otherwise I'd scroll until sunrise! So yeah, that's pretty much my internet routine: phone for the small stuff, laptop for the big stuff, and a firm bedtime for both.", "koQ": "인터넷을 할 때 주로 어떤 기기를 사용하나요? 보통 언제 어디서 인터넷에 접속하나요? 당신의 인터넷 사용 습관을 자세히 말해주세요.", "koA": "제 인터넷 사용은 단순해요. 차근차근 설명해 드릴게요. 열에 아홉은 스마트폰으로 접속해요. 어차피 손에 딱 붙어 있으니까요. 호텔 예약이나 긴 영상 시청처럼 큰일을 할 때는 큰 화면을 위해 노트북으로 갈아타요.\n\n언제 어디서 하냐면, 저는 하루 종일 조각조각 온라인이에요. 출퇴근길엔 뉴스, 점심엔 빠른 검색, 저녁 조깅 때는 음악 스트리밍이요. 하지만 메인 세션은 밤이에요. 회색 소파에서 노트북을 펴고, 차 한 잔 들고요.\n\n그리고 폰 규칙과 똑같은 황금률이 하나 있어요. 11시 이후엔 화면 끄기, 예외 없음이요. 안 그러면 해 뜰 때까지 스크롤할 테니까요! 네, 제 인터넷 루틴은 대체로 이래요. 작은 일은 폰, 큰일은 노트북, 그리고 둘 다 확실한 취침 시간이 있어요.", "struct": [["1️⃣ 기기", "폰 90% + 큰일은 노트북"], ["2️⃣ 낮", "출퇴근 뉴스 · 점심 검색"], ["3️⃣ 저녁", "조깅 스트리밍 (음악 편)"], ["4️⃣ 밤", "소파 + 노트북 메인 세션"], ["5️⃣ 마무리", "11시 화면 오프 룰"]], "expr": [["let me walk you through ~", "~을 차근차근 설명할게요"], ["nine times out of ten", "열에 아홉은"], ["glued to my hand", "손에 딱 붙어 있는"], ["switch to ~", "~로 갈아타다"], ["for the big screen", "큰 화면을 위해"], ["in little pieces all day", "하루 종일 조각조각"], ["main session", "메인 세션"], ["golden rule", "황금률, 나만의 원칙"], ["no exceptions", "예외 없음"], ["scroll until sunrise", "해 뜰 때까지 스크롤하다"], ["that's pretty much ~", "대체로 ~이다"]], "audio": "audio/2_돌발/2-027 6. 인터넷(Internet)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-027 6. 인터넷(Internet)_습관.mp3"}, {"id": "2-028", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "취향", "badge": "28 취향", "enQ": "What do you most enjoy doing on the internet - watching videos, shopping, or reading news? Why do you enjoy that activity? Tell me the reasons.", "enA": "Between videos, shopping, and news? If I had to choose, watching videos wins, no contest. For me, it's all about switching my brain off: after a long day, videos ask nothing of me — I just press play and relax.\n\nI'd pick videos over the other two any day. News is useful, but honestly, it's homework for my brain. And shopping? Don't get me wrong — I love hunting for deals, but that's a mission, not relaxation. My wallet also prefers me watching videos!\n\nNothing beats lying on my sofa while a travel vlog takes me to Italy for free. In a nutshell: news feeds my head, shopping feeds my closet, but videos feed my soul — and the soul wins every time.", "koQ": "인터넷에서 영상 시청, 쇼핑, 뉴스 읽기 중 어떤 것을 가장 즐기나요? 왜 그 활동을 즐기나요? 그 이유를 말해주세요.", "koA": "영상, 쇼핑, 뉴스 중에서요? 굳이 고르자면 영상 시청 승이에요. 고민할 것도 없어요. 저한테는 머리 끄기가 전부거든요. 긴 하루 끝에 영상은 저한테 아무것도 요구하지 않아요. 그냥 재생 버튼만 누르고 쉬면 되니까요.\n\n나머지 둘보다는 두말없이 영상을 고를 거예요. 뉴스는 유용하지만 솔직히 머리한테는 숙제잖아요. 그리고 쇼핑이요? 오해는 마세요. 특가 사냥은 정말 좋아해요. 하지만 그건 미션이지 휴식이 아니죠. 제 지갑도 제가 영상 보는 쪽을 선호하고요!\n\n소파에 누워서 여행 브이로그로 공짜 이탈리아 여행을 떠나는 것만 한 게 없어요. 한마디로 뉴스는 머리를 채우고, 쇼핑은 옷장을 채우지만, 영상은 마음을 채워요. 그리고 마음이 매번 이기죠.", "struct": [["1️⃣ 선언", "영상 승, no contest"], ["2️⃣ 이유", "머리 끄기 · 무조건 휴식"], ["3️⃣ 비교", "뉴스 = 숙제 · 쇼핑 = 미션"], ["4️⃣ 절정", "소파 + 공짜 이탈리아 여행"], ["5️⃣ 마무리", "머리·옷장·마음 3단 대구"]], "expr": [["If I had to choose", "굳이 하나를 고르자면"], ["no contest", "고민할 것도 없이"], ["it's all about ~", "핵심은 ~이다"], ["switch my brain off", "머리를 끄다"], ["ask nothing of me", "내게 아무것도 요구하지 않다"], ["A over B any day", "두말없이 B보다 A"], ["homework for my brain", "머리한테는 숙제"], ["Don't get me wrong", "오해는 마세요"], ["hunt for deals", "특가를 사냥하다"], ["Nothing beats ~", "~만 한 게 없다"], ["In a nutshell", "한마디로 정리하면"]], "audio": "audio/2_돌발/2-028 6. 인터넷(Internet)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-028 6. 인터넷(Internet)_취향.mp3"}, {"id": "2-029", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "과거 경험", "badge": "29 과거 경험", "enQ": "Tell me about the first time you used the internet. When was it, and what did you do online? What impression did it leave on you?", "enA": "Oh, this reminds me of our first family computer, back in elementary school. My first internet experience came with a soundtrack: the screeching sound of the dial-up modem. Beep, buzz, static — it sounded like a robot orchestra!\n\nWhat did I do? I searched for pictures of my favorite cartoon characters, and guess what — one single photo took a few minutes to load, appearing line by line, top to bottom. And in the middle of it, my mom picked up the phone and the connection died instantly. We both screamed!\n\nStill, the impression it left was huge: it felt like a magic window to the whole world, right there on our desk. I was completely hooked, and honestly, I've been online ever since. That noisy little modem started it all.", "koQ": "처음 인터넷을 사용했던 때에 대해 말해주세요. 언제였고, 온라인에서 무엇을 했나요? 그것은 당신에게 어떤 인상을 남겼나요?", "koA": "아, 초등학생 때 우리 집 첫 컴퓨터가 생각나네요. 제 첫 인터넷 경험에는 배경음악이 있었어요. 전화선 모뎀의 끼익거리는 소리요. 삐, 지직, 치익. 로봇 오케스트라 같았죠!\n\n뭘 했냐고요? 좋아하는 만화 캐릭터 사진을 검색했는데, 글쎄, 사진 한 장 뜨는 데 몇 분이 걸렸어요. 위에서 아래로 한 줄 한 줄 나타나면서요. 그리고 그 도중에 엄마가 전화기를 드는 순간 연결이 뚝 끊겼어요. 둘 다 소리를 질렀죠!\n\n그래도 그게 남긴 인상은 엄청났어요. 책상 위에 온 세상으로 통하는 마법의 창문이 생긴 느낌이었거든요. 저는 완전히 빠져 버렸고, 솔직히 그 후로 지금까지 쭉 온라인이에요. 그 시끄러운 작은 모뎀이 모든 것의 시작이었어요.", "struct": [["1️⃣ 도입", "초등학교 · 집 첫 컴퓨터"], ["2️⃣ 소리", "모뎀 소리 = 로봇 오케스트라"], ["3️⃣ 사건", "사진 몇 분 로딩 + 전화 끊김"], ["4️⃣ 인상", "온 세상 마법의 창문"], ["5️⃣ 마무리", "hooked + ever since"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["dial-up modem", "전화선 모뎀"], ["screeching sound", "끼익거리는 소리"], ["a robot orchestra", "로봇 오케스트라"], ["guess what", "글쎄, 그런데 있잖아요"], ["line by line", "한 줄 한 줄"], ["in the middle of ~", "~하는 도중에"], ["the connection died", "연결이 끊겼다"], ["a magic window", "마법의 창문"], ["hooked", "푹 빠진"], ["I've been online ever since", "그 후로 쭉 온라인이다"]], "audio": "audio/2_돌발/2-029 6. 인터넷(Internet)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-029 6. 인터넷(Internet)_과거 경험.mp3"}, {"id": "2-030", "cat": "unexpected", "catName": "돌발 질문", "num": 6, "topic": "인터넷", "topicEn": "Internet", "type": "비교", "badge": "30 비교", "enQ": "Compare the internet today with the internet when you first started using it. How have the speed, the content, and the way people use it changed? Tell me in detail.", "enA": "The internet has changed beyond recognition. Back then, in the dial-up days, going online was an event: I used to wait minutes for one photo, and the phone line was occupied the whole time — my mom was not a fan!\n\nContent was mostly text and tiny pictures: simple message boards, basic homepages. Watching a video online? That was science fiction.\n\nThese days, it's a completely different story. With Wi-Fi and 5G, everything loads in the blink of an eye — I stream concerts in 4K on my phone while jogging! Content exploded too: streaming, shorts, live shopping. And the biggest change? We don't sit down to go online anymore. The internet is just always with us, in our pockets. Compared to the modem days, it's way more convenient. Though I have to admit, waiting made things feel special — that photo loading line by line was pure suspense!", "koQ": "오늘날의 인터넷과 처음 사용하기 시작했을 때의 인터넷을 비교해주세요. 속도, 콘텐츠, 사용 방식은 어떻게 변화했나요? 자세히 말해주세요.", "koA": "인터넷은 못 알아볼 만큼 변했어요. 그때, 그러니까 모뎀 시절에는 인터넷 접속이 하나의 이벤트였어요. 사진 한 장에 몇 분씩 기다리곤 했고, 그동안 전화선은 계속 통화 중이었죠. 엄마는 전혀 반기지 않으셨어요!\n\n콘텐츠도 대부분 글과 작은 사진이었어요. 간단한 게시판, 기본적인 홈페이지 정도요. 온라인으로 영상을 본다? 그건 공상과학이었죠.\n\n요즘은 완전히 다른 이야기예요. 와이파이와 5G로 모든 게 눈 깜짝할 사이에 열려요. 저는 조깅하면서 폰으로 콘서트를 4K로 스트리밍한다니까요! 콘텐츠도 폭발했어요. 스트리밍, 쇼츠, 라이브 쇼핑까지요. 그리고 가장 큰 변화요? 이제 우리는 인터넷을 하러 앉지 않아요. 인터넷이 그냥 항상 주머니 속에 함께 있죠. 모뎀 시절과 비교하면 훨씬 편리해요. 그래도 인정할게요. 기다림이 모든 걸 특별하게 만들었어요. 한 줄 한 줄 뜨던 그 사진은 순수한 서스펜스였다니까요!", "struct": [["1️⃣ 도입", "못 알아볼 만큼 변한 인터넷"], ["2️⃣ 과거", "접속 = 이벤트 · 전화선 점령"], ["3️⃣ 과거", "글 + 작은 사진 · 게시판"], ["4️⃣ 현재", "5G · 4K 스트리밍 · 주머니 속"], ["5️⃣ 마무리", "way more + 기다림의 낭만"]], "expr": [["beyond recognition", "못 알아볼 만큼"], ["Back then ↔ These days", "그 시절엔 ↔ 요즘엔"], ["going online was an event", "접속이 하나의 이벤트였다"], ["used to + 동사원형", "예전엔 ~하곤 했다"], ["occupied", "(전화선이) 통화 중인"], ["That was science fiction.", "그건 공상과학이었다."], ["it's a completely different story", "완전히 다른 이야기다"], ["in the blink of an eye", "눈 깜짝할 사이에"], ["sit down to ~", "~하러 자리에 앉다"], ["compared to ~", "~과 비교하면"], ["I have to admit", "인정할게요"]], "audio": "audio/2_돌발/2-030 6. 인터넷(Internet)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-030 6. 인터넷(Internet)_비교.mp3"}, {"id": "2-031", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "묘사", "badge": "31 묘사", "enQ": "What piece of technology do you use the most - your computer, your cell phone, or another device? Describe what it is and why you use it so often.", "enA": "That's an easy one — my smartphone, hands down. My laptop is great for big screens and long videos, but my phone is basically glued to my hand from morning to night.\n\nWhy so often? Because it's all-in-one. It's my alarm clock in the morning, my music player on my evening jog, and my wallet at the convenience store. I even do my banking on it — ever since my card got stuck in an ATM, the KB app handles everything for me.\n\nHonestly, it's like a Swiss Army knife: camera, map, TV, everything packed into one little device. My whole day basically runs on this phone, so yeah — that's pretty much why it never leaves my side.", "koQ": "컴퓨터, 휴대폰, 또는 다른 기기 중 어떤 기술 제품을 가장 많이 사용하나요? 그것이 무엇이고 왜 그렇게 자주 사용하는지 설명해주세요.", "koA": "쉬운 질문이네요. 두말할 것 없이 스마트폰이에요. 노트북도 큰 화면으로 긴 영상을 볼 때 좋지만, 폰은 아침부터 밤까지 사실상 손에 붙어 있거든요.\n\n왜 그렇게 자주 쓰냐고요? 올인원이니까요. 아침엔 알람 시계, 저녁 조깅 땐 음악 플레이어, 편의점에선 지갑이 돼요. 은행 업무도 폰으로 해요. ATM에 카드가 낀 사건 이후로는 KB 앱이 다 처리해주거든요.\n\n솔직히 스위스 군용 칼 같아요. 카메라, 지도, TV까지 작은 기기 하나에 다 들어 있죠. 제 하루가 사실상 이 폰으로 돌아가요. 그래서 폰이 제 곁을 떠날 일이 없는 거예요.", "struct": [["1️⃣ 선언", "스마트폰, hands down 선언"], ["2️⃣ 근거", "아침부터 밤까지 손에 붙은 폰"], ["3️⃣ 역할", "알람 · 조깅 DJ · 지갑 · KB 뱅킹"], ["4️⃣ 비유", "스위스 군용 칼 = 만능 기기"], ["5️⃣ 마무리", "하루가 폰으로 돌아간다 + 애착"]], "expr": [["hands down", "두말할 것 없이"], ["glued to my hand", "손에 붙어 있는"], ["all-in-one", "올인원, 만능"], ["run on ~", "~으로 돌아가다"], ["Swiss Army knife", "스위스 군용 칼"], ["packed into", "~에 꽉 담긴"], ["get stuck", "끼이다, 걸리다"], ["handle everything", "다 처리하다"], ["from morning to night", "아침부터 밤까지"], ["never leaves my side", "곁을 안 떠난다"], ["That's an easy one", "쉬운 질문이네요"]], "audio": "audio/2_돌발/2-031 7. 기술(Technology)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-031 7. 기술(Technology)_묘사.mp3"}, {"id": "2-032", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "습관", "badge": "32 습관", "enQ": "Tell me about the technology you use the most these days, such as your smartphone or computer. What is it, and what do you usually do with it?", "enA": "These days it's still my smartphone, so let me walk you through a typical day with it. It starts as my alarm at seven, and on my commute it turns into a newsstand — I scroll the headlines and check the group chat.\n\nThen in the evening, it becomes my personal DJ: I put on my IU playlist for my jog along the riverside trail. After that, I usually watch YouTube on the sofa — mostly recipe channels. On weekends, I switch to my laptop for hotel bookings or anything with serious typing.\n\nAnd of course, my golden rule: at eleven, the phone goes face-down and the screen goes off, no exceptions. A phone that does everything, and one rule that stops it — that's pretty much my tech routine, and it never gets old.", "koQ": "요즘 가장 많이 사용하는 스마트폰이나 컴퓨터 같은 기술에 대해 말해주세요. 그것은 무엇이고, 주로 무엇을 하는 데 사용하나요?", "koA": "요즘도 역시 스마트폰이에요. 폰과 함께하는 하루를 차근차근 보여드릴게요. 아침 7시엔 알람으로 시작하고, 출근길엔 신문 가판대로 변신해요. 헤드라인을 훑고 단톡방을 확인하죠.\n\n그리고 저녁이 되면 폰은 제 전용 DJ가 돼요. 강변 산책로 조깅엔 아이유 플레이리스트를 틀죠. 그다음엔 보통 소파에서 유튜브를 봐요. 주로 레시피 채널이요. 주말엔 호텔 예약이나 본격적인 타이핑이 필요한 일은 노트북으로 갈아타요.\n\n그리고 물론 저의 황금률이 있죠. 11시가 되면 폰은 뒤집어 놓고 화면은 꺼요. 예외는 없어요. 모든 걸 다 하는 폰, 그리고 그걸 멈추는 규칙 하나. 그게 제 기술 루틴이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "차근차근 하루 루틴 예고"], ["2️⃣ 아침", "7시 알람 → 출근길 뉴스 · 단톡"], ["3️⃣ 저녁", "조깅 DJ → 소파 유튜브 레시피"], ["4️⃣ 주말", "예약 · 타이핑은 노트북 전환"], ["5️⃣ 규칙", "11시 face-down, 예외 없음"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["turn into ~", "~으로 변신하다"], ["newsstand", "신문 가판대"], ["personal DJ", "전용 DJ"], ["switch to ~", "~으로 갈아타다"], ["serious typing", "본격적인 타이핑"], ["golden rule", "황금률"], ["face-down", "뒤집어 놓은"], ["no exceptions", "예외 없이"], ["that's pretty much ~", "그게 대충 ~예요"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-032 7. 기술(Technology)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-032 7. 기술(Technology)_습관.mp3"}, {"id": "2-033", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "취향", "badge": "33 취향", "enQ": "What is your favorite piece of technology, and why do you like it? How does it make your life easier? Tell me the reasons in detail.", "enA": "If I had to choose my favorite, it's my wireless earbuds — no contest. My phone is the most used, sure, but the earbuds are the ones I love. For me, it's all about having my own little world, anywhere.\n\nHow do they make life easier? They cut the cords out of my life, literally. Music for my evening jog, hands-free calls with my mom while I walk, and noise cancelling that turns a packed subway into a quiet room. I'd take earbuds over any fancy gadget any day. Don't get me wrong — big TVs and smart watches are cool, but they don't follow me around.\n\nNothing beats popping them in on the riverside trail with an IU playlist. In a nutshell: my phone runs my day, but my earbuds save it.", "koQ": "가장 좋아하는 기술 제품은 무엇이고, 왜 좋아하나요? 그것이 당신의 삶을 어떻게 편하게 만들어주나요? 그 이유를 자세히 말해주세요.", "koA": "최애를 골라야 한다면 무선 이어폰이에요. 고민할 것도 없죠. 폰이 제일 많이 쓰는 기기인 건 맞지만, 사랑하는 쪽은 이어폰이거든요. 저한테는 어디서든 나만의 작은 세계를 갖는 게 핵심이에요.\n\n어떻게 삶을 편하게 해주냐고요? 말 그대로 제 삶에서 선을 잘라냈어요. 저녁 조깅엔 음악, 걸으면서 엄마랑 핸즈프리 통화, 노이즈 캔슬링은 꽉 찬 지하철을 조용한 방으로 바꿔주죠. 어떤 신상 기기보다 이어폰이 먼저예요. 오해는 마세요. 큰 TV도 스마트워치도 멋지지만, 절 따라다녀 주진 않잖아요.\n\n강변 산책로에서 아이유 플레이리스트 틀고 이어폰 꽂는 순간은 무엇과도 못 바꿔요. 한마디로, 폰은 제 하루를 굴리고, 이어폰은 제 하루를 구해줘요.", "struct": [["1️⃣ 선택", "최애는 무선 이어폰, no contest"], ["2️⃣ 핵심", "어디서든 나만의 작은 세계"], ["3️⃣ 근거", "조깅 음악 · 엄마 통화 · 노캔"], ["4️⃣ 양보", "TV · 워치 인정 후 재강조"], ["5️⃣ 명언", "폰은 굴리고, 이어폰은 구한다"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["it's all about ~", "핵심은 ~이다"], ["cut the cords", "선을 잘라내다"], ["hands-free", "손을 쓰지 않는"], ["packed", "꽉 찬, 만원인"], ["A over B any day", "B보다 무조건 A"], ["Don't get me wrong", "오해는 마세요"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로"], ["save my day", "하루를 구하다"]], "audio": "audio/2_돌발/2-033 7. 기술(Technology)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-033 7. 기술(Technology)_취향.mp3"}, {"id": "2-034", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "과거 경험", "badge": "34 과거 경험", "enQ": "Tell me about a problem you have had with a piece of technology. What went wrong, and how did you solve it? Describe the experience in detail.", "enA": "Oh, this reminds me of the scariest five minutes of my life — IU concert ticketing day. I was on my laptop, fingers ready, heart pounding. The clock hit eight, I grabbed my seats, and then — out of nowhere — the payment page froze. Completely.\n\nI clicked, I refreshed... nothing. My tickets were sitting in the cart with a countdown timer! So I made a split-second decision: I grabbed my phone, opened the app, logged in, and guess what — my seats were still there. I paid on mobile with about forty seconds to spare.\n\nWhen it went through, I screamed so loud my best friend heard it through the phone. It all worked out fine, and I learned my lesson: since then, I never do ticketing without a backup device. One screen is never enough!", "koQ": "기술 제품을 사용하면서 겪은 문제에 대해 말해주세요. 무엇이 잘못되었고, 어떻게 해결했나요? 그 경험을 자세히 묘사해주세요.", "koA": "아, 제 인생 가장 무서웠던 5분이 떠오르네요. 아이유 콘서트 티켓팅 날이었어요. 노트북 앞에서 손가락 풀고 심장은 쿵쾅쿵쾅. 8시 정각, 좌석을 잡았는데, 그때 난데없이 결제 페이지가 완전히 멈춰버린 거예요.\n\n클릭하고 새로고침해도... 아무 반응이 없었어요. 티켓은 카운트다운 타이머와 함께 장바구니에 갇혀 있었죠! 그래서 순간적으로 결단을 내렸어요. 폰을 집어 앱을 열고 로그인했는데, 세상에, 제 좌석이 그대로 있는 거예요. 40초 정도를 남기고 모바일로 결제했어요.\n\n결제가 되는 순간 너무 크게 소리를 질러서 절친이 전화 너머로 들었을 정도예요. 결국 다 잘 풀렸고, 확실한 교훈도 얻었죠. 그 뒤로는 백업 기기 없이는 절대 티켓팅을 안 해요. 화면 하나로는 부족하거든요!", "struct": [["1️⃣ 도입", "인생 가장 무서웠던 5분"], ["2️⃣ 상황", "8시 정각, 결제 창 멈춤"], ["3️⃣ 반전", "폰 앱으로 40초 남기고 결제"], ["4️⃣ 감정", "비명 → 전화 너머 절친까지"], ["5️⃣ 교훈", "백업 기기 룰 + since then"]], "expr": [["this reminds me of", "~이 떠오르다"], ["out of nowhere", "난데없이"], ["freeze", "(화면이) 멈추다"], ["countdown timer", "카운트다운 타이머"], ["split-second decision", "순간적인 결단"], ["guess what", "있잖아요, 세상에"], ["with ~ to spare", "~을 남겨두고"], ["go through", "(결제가) 되다"], ["work out fine", "잘 풀리다"], ["since then", "그 이후로"], ["backup device", "백업 기기"]], "audio": "audio/2_돌발/2-034 7. 기술(Technology)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-034 7. 기술(Technology)_과거 경험.mp3"}, {"id": "2-035", "cat": "unexpected", "catName": "돌발 질문", "num": 7, "topic": "기술", "topicEn": "Technology", "type": "비교", "badge": "35 비교", "enQ": "Compare the technology of today with the technology of the past. What are the differences, and how has technology affected people's lives over time?", "enA": "Back then, when I was in elementary school, technology used to live in one corner of the house. We had one family computer with that screeching dial-up modem, and my first phone was a pearl-colored folder phone that closed with a satisfying clack.\n\nThese days, it's a completely different story. Technology doesn't live in a corner anymore — it lives in our pockets. Compared to that one shared computer, now every person carries a faster one everywhere. Everything is instant: no waiting, no photos loading line by line.\n\nThe biggest effect? Technology removed waiting from our lives — we got way more speed and convenience. But I have to admit, waiting had its own charm. That little clack felt warmer than any silent touchscreen, if you ask me.", "koQ": "오늘날의 기술과 과거의 기술을 비교해주세요. 어떤 차이점이 있고, 시간이 지나며 기술은 사람들의 삶에 어떤 영향을 미쳤나요?", "koA": "그때, 그러니까 제가 초등학생일 때 기술은 집 한구석에 살았어요. 끼익 소리를 내는 전화선 모뎀이 달린 가족 공용 컴퓨터 한 대가 있었고, 제 첫 폰은 딸깍 소리가 경쾌한 진주색 폴더폰이었죠.\n\n요즘은 완전히 다른 이야기예요. 기술은 더 이상 구석에 살지 않아요. 우리 주머니 속에 살죠. 온 가족이 나눠 쓰던 컴퓨터 한 대와 비교하면, 이제는 모두가 더 빠른 컴퓨터를 하나씩 들고 다녀요. 모든 게 즉시죠. 기다림도, 한 줄씩 뜨는 사진 로딩도 없어요.\n\n가장 큰 영향이요? 기술은 우리 삶에서 기다림을 없앴어요. 속도와 편리함은 훨씬 커졌죠. 하지만 인정할 건 인정해야죠. 기다림엔 나름의 매력이 있었어요. 그 작은 딸깍 소리가 소리 없는 터치스크린보다 따뜻했거든요.", "struct": [["1️⃣ 과거", "집 한구석 · 모뎀 · 폴더폰"], ["2️⃣ 현재", "주머니 속 · 모든 게 즉시"], ["3️⃣ 대비", "가족 공용 1대 vs 1인 1대"], ["4️⃣ 영향", "기다림의 실종 = 최대 변화"], ["5️⃣ 마무리", "딸깍의 온기, 그리움 한 스푼"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["screeching", "끼익거리는"], ["clack", "딸깍 (소리)"], ["completely different story", "완전히 다른 이야기"], ["compared to ~", "~과 비교하면"], ["line by line", "한 줄씩"], ["instant", "즉각적인"], ["way more ~", "훨씬 더 ~"], ["I have to admit", "인정할 수밖에 없다"], ["if you ask me", "제 생각엔"]], "audio": "audio/2_돌발/2-035 7. 기술(Technology)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-035 7. 기술(Technology)_비교.mp3"}, {"id": "2-036", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "묘사", "badge": "36 묘사", "enQ": "What kinds of appointments do you usually make with the people around you? Describe the typical appointments in your life in detail.", "enA": "That's an easy one — most of my appointments are the happy kind: catching up with people over food and coffee. The regulars on my calendar? Coffee at my favorite cafe Moon with my best friend, and chimaek — chicken and beer — at the craft beer pub with my coworkers.\n\nThere are also standing appointments: every Sunday evening, I call my mom — same time every week, like clockwork. And of course the grown-up stuff: a haircut about once a month, the dentist twice a year — booked by app, needless to say.\n\nOh, and one special one: my best friend and I celebrate our birthdays with a hotel staycation every year — basically a fixed national holiday for us two. So yeah, that's pretty much my appointment lineup: food, family, and one fancy tradition.", "koQ": "주변 사람들과 주로 어떤 종류의 약속을 하나요? 당신의 일상 속 일반적인 약속들을 자세히 설명해주세요.", "koA": "쉬운 질문이네요. 제 약속은 대부분 행복한 종류예요. 음식과 커피를 사이에 두고 사람들과 회포를 푸는 거요. 달력의 단골손님들이요? 절친과는 최애 카페 문(Moon)에서 커피, 회사 동료들과는 수제맥주 펍에서 치맥이죠.\n\n고정 약속들도 있어요. 매주 일요일 저녁엔 엄마한테 전화해요. 매주 같은 시간, 시계처럼 정확하게요. 어른의 일정도 물론 있죠. 미용실은 한 달에 한 번, 치과는 일 년에 두 번. 말할 것도 없이 앱으로 예약해요.\n\n아, 특별한 약속이 하나 있어요. 절친과 저는 매년 생일을 호캉스로 기념해요. 우리 둘만의 고정 국경일 같은 거죠. 네, 이게 제 약속 라인업이에요. 음식, 가족, 그리고 근사한 전통 하나!", "struct": [["1️⃣ 분류", "약속 = 대부분 행복한 종류"], ["2️⃣ 단골", "문(Moon) 커피 · 동료와 펍 치맥"], ["3️⃣ 고정", "일요일 엄마 통화, 시계처럼"], ["4️⃣ 일정", "미용실 · 치과는 앱 예약"], ["5️⃣ 특별", "절친 생일 호캉스 전통"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["catch up (with)", "회포를 풀다"], ["the regulars", "단골손님들"], ["chimaek", "치맥"], ["standing appointment", "고정 약속"], ["like clockwork", "시계처럼 정확하게"], ["needless to say", "말할 것도 없이"], ["staycation", "호캉스"], ["fixed national holiday", "고정 국경일"], ["lineup", "라인업, 구성"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-036 8. 약속(Appointment)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-036 8. 약속(Appointment)_묘사.mp3"}, {"id": "2-037", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "습관", "badge": "37 습관", "enQ": "What steps do you take when you make an appointment? What do you consider first, and how do you decide the time and place? Tell me in detail.", "enA": "I have a whole system, so let me walk you through it. First, everything starts in the group chat — I throw out a few dates and see what sticks. Before that, though, I always check my calendar app; double-booking is my nightmare.\n\nThen comes the time: weekday evenings after work, or Saturday afternoons — those are the sweet spots. As for the place? Honestly, food decides everything. If we want to talk, it's the kimchi stew place in my alley; if we want to laugh, it's chimaek at the pub.\n\nAnd my golden rule: I always send a quick reminder the day before — just 'see you tomorrow!' It saves everyone from the awkward 'wait, was that today?' moment. Simple system, zero drama — it never gets old.", "koQ": "약속을 잡을 때 어떤 단계를 거치나요? 무엇을 먼저 고려하고, 시간과 장소는 어떻게 정하나요? 자세히 말해주세요.", "koA": "저만의 시스템이 있어요. 차근차근 알려드릴게요. 먼저, 모든 건 단톡방에서 시작해요. 날짜 몇 개를 던져놓고 어떤 게 통하는지 보죠. 근데 그 전에 캘린더 앱부터 확인해요. 약속이 겹치는 건 악몽이니까요.\n\n다음은 시간이에요. 평일 퇴근 후 저녁이나 토요일 오후, 그게 최적의 지점이죠. 장소는요? 솔직히 음식이 다 정해요. 이야기를 하고 싶으면 우리 골목 김치찌개집, 웃고 싶으면 펍에서 치맥이에요.\n\n그리고 저의 황금률. 하루 전에 꼭 짧은 리마인더를 보내요. 내일 봐! 한 마디면 돼요. 잠깐, 그게 오늘이었나? 하는 어색한 순간에서 모두를 구해주죠. 단순한 시스템, 드라마 제로. 전혀 질리지 않아요.", "struct": [["1️⃣ 시작", "단톡방에 날짜 몇 개 투척"], ["2️⃣ 확인", "캘린더 앱, 더블부킹 방지"], ["3️⃣ 시간", "평일 저녁 · 토요일 오후"], ["4️⃣ 장소", "수다 = 찌개집, 웃음 = 펍"], ["5️⃣ 규칙", "하루 전 리마인더 골든룰"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["throw out (dates)", "(안을) 던져보다"], ["see what sticks", "뭐가 통하나 보다"], ["double-booking", "약속 겹치기"], ["sweet spot", "최적의 지점"], ["Food decides everything.", "음식이 다 정한다"], ["golden rule", "황금률"], ["reminder", "리마인더"], ["save ~ from ...", "~을 …에서 구하다"], ["zero drama", "문제 하나 없이"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-037 8. 약속(Appointment)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-037 8. 약속(Appointment)_습관.mp3"}, {"id": "2-038", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "취향", "badge": "38 취향", "enQ": "Do you prefer making appointments by phone call or through a mobile app? Why do you prefer that way? Tell me the reasons.", "enA": "If I had to choose, apps win, no contest. For me, it's all about pressure-free booking: with an app, I can compare times, change my mind five times, and book at midnight in my pajamas — no small talk required.\n\nI'd pick an app over a phone call any day. Calls put me on the spot: someone's waiting while I check my schedule, and I always hang up and realize I forgot to ask something. Apps keep everything in writing — time, place, confirmation — so there's no 'did I say Tuesday or Thursday?' panic.\n\nDon't get me wrong — my rule is 'texts for information, calls for hearts', so feelings still get a phone call. But for appointments? Nothing beats three quiet taps. In a nutshell: I book with my thumbs and save my voice for the people I love.", "koQ": "전화로 약속(예약)을 잡는 것과 모바일 앱으로 잡는 것 중 무엇을 선호하나요? 왜 그 방식을 선호하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 앱 승리예요. 고민할 것도 없죠. 저한테 핵심은 부담 없는 예약이에요. 앱이면 시간대를 비교하고, 마음을 다섯 번 바꾸고, 자정에 잠옷 차림으로도 예약할 수 있어요. 스몰토크도 필요 없고요.\n\n전화보다는 무조건 앱이에요. 전화는 절 곤란하게 만들거든요. 제가 일정을 확인하는 동안 상대는 기다리고 있고, 끊고 나면 꼭 뭘 안 물어봤다는 걸 깨달아요. 앱은 모든 게 글로 남아요. 시간, 장소, 확정까지요. 화요일이랬나 목요일이랬나 하는 패닉이 없죠.\n\n오해는 마세요. 제 원칙은 문자는 정보, 전화는 마음이라서, 감정은 여전히 전화 몫이에요. 하지만 약속은요? 조용한 터치 세 번만 한 게 없어요. 한마디로, 예약은 엄지로 하고 목소리는 사랑하는 사람들을 위해 아껴둬요.", "struct": [["1️⃣ 선택", "앱으로 예약, no contest"], ["2️⃣ 근거", "자정 잠옷 차림 예약 가능"], ["3️⃣ 대비", "전화는 날 코너로 몬다"], ["4️⃣ 양보", "마음 전할 땐 여전히 전화"], ["5️⃣ 명언", "엄지로 예약, 목소리는 아낌"]], "expr": [["no contest", "고민할 것도 없이"], ["pressure-free", "부담 없는"], ["no ~ required", "~이 필요 없는"], ["A over B any day", "B보다 무조건 A"], ["put ~ on the spot", "~을 곤란하게 하다"], ["hang up", "전화를 끊다"], ["in writing", "글로, 기록으로"], ["Don't get me wrong", "오해는 마세요"], ["calls for hearts", "전화는 마음"], ["nothing beats ~", "~만 한 게 없다"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-038 8. 약속(Appointment)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-038 8. 약속(Appointment)_취향.mp3"}, {"id": "2-039", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "과거 경험", "badge": "39 과거 경험", "enQ": "Tell me about a time when you had to cancel an appointment. What was the reason, and how did you deal with the situation? Give me as many details as you can.", "enA": "This reminds me of a movie night that never happened. A few months ago, my best friend and I had a long-awaited date for a new mystery movie at the mall theater. But that morning, I woke up with a terrible cold — pounding head, sore throat, the full package.\n\nI felt awful — we had booked the tickets in advance — but I texted her right away, apologized, and offered to cover the cancellation fee. And guess what: an hour later, out of nowhere, my doorbell rang. She was standing there with a container of warm porridge!\n\nIn the end it worked out fine — we watched the movie the next weekend, and it was even better with her popcorn commentary. Since then, we have a little rule: cancel early, no guilt, and the one who cancels buys dessert next time.", "koQ": "약속을 취소해야 했던 때에 대해 말해주세요. 이유가 무엇이었고, 그 상황을 어떻게 해결했나요? 가능한 많은 세부사항을 말해주세요.", "koA": "성사되지 못한 영화의 밤이 떠오르네요. 몇 달 전에 절친과 쇼핑몰 영화관에서 신작 미스터리 영화를 보기로 한, 오래 기다린 약속이 있었어요. 그런데 그날 아침, 지독한 감기에 걸린 채 일어났죠. 지끈거리는 머리, 아픈 목, 풀패키지였어요.\n\n티켓도 미리 예매해둔 터라 너무 미안했어요. 바로 문자로 사과하고 취소 수수료는 제가 내겠다고 했죠. 그런데 있잖아요, 한 시간 뒤에 난데없이 초인종이 울렸어요. 절친이 따뜻한 죽 한 통을 들고 서 있는 거예요!\n\n결국엔 다 잘 풀렸어요. 다음 주말에 그 영화를 봤는데, 절친의 팝콘 중계 덕분에 오히려 더 재밌었죠. 그 뒤로 우리만의 작은 룰이 생겼어요. 취소는 빨리, 죄책감은 금지, 그리고 취소한 사람이 다음에 디저트 사기!", "struct": [["1️⃣ 도입", "성사 못 한 영화의 밤"], ["2️⃣ 이유", "아침부터 감기 풀패키지"], ["3️⃣ 해결", "즉시 문자 사과 + 수수료 제안"], ["4️⃣ 반전", "한 시간 뒤, 절친이 죽 배달"], ["5️⃣ 교훈", "취소는 빨리, 죄책감 금지 룰"]], "expr": [["this reminds me of", "~이 떠오르다"], ["long-awaited", "오래 기다린"], ["pounding (head)", "지끈거리는"], ["the full package", "풀패키지, 종합 세트"], ["in advance", "미리"], ["cover (the fee)", "(비용을) 부담하다"], ["guess what", "있잖아요, 세상에"], ["out of nowhere", "난데없이"], ["work out fine", "잘 풀리다"], ["since then", "그 이후로"], ["no guilt", "죄책감 금지"]], "audio": "audio/2_돌발/2-039 8. 약속(Appointment)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-039 8. 약속(Appointment)_과거 경험.mp3"}, {"id": "2-040", "cat": "unexpected", "catName": "돌발 질문", "num": 8, "topic": "약속", "topicEn": "Appointment", "type": "비교", "badge": "40 비교", "enQ": "Compare the way people make appointments now with the way they did in the past. What has changed with the development of smartphones? Tell me about the differences.", "enA": "Back then, before smartphones, an appointment was a promise carved in stone. People used to call a landline, fix one time and one place — say, five o'clock in front of the station clock — and that was it. If someone was late, you just stood there, waiting and wondering.\n\nThese days, it's a completely different story. Plans live in the group chat, and they stay flexible until the last minute: 'running ten minutes late!', a pin drop with the exact location, sometimes moving the whole thing with one message. Compared to the old days, everything is way more convenient — nobody waits blindly anymore.\n\nBut I have to admit: showing up on time back then meant something — you couldn't fix it with a quick text. There was a little more weight in every promise, and honestly, I kind of miss that.", "koQ": "지금 사람들이 약속을 잡는 방식과 과거의 방식을 비교해주세요. 스마트폰의 발전으로 무엇이 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 스마트폰 이전에 약속은 돌에 새긴 맹세였어요. 사람들은 집 전화로 전화를 걸어 시간과 장소를 하나로 못 박았죠. 이를테면 5시, 역 시계탑 앞. 그게 끝이었어요. 상대가 늦으면 그냥 서서 기다리며 궁금해하는 수밖에요.\n\n요즘은 완전히 다른 이야기죠. 약속은 단톡방에 살고, 마지막 순간까지 유연해요. 10분 늦어! 정확한 위치 핀 공유, 심지어 메시지 하나로 약속 전체를 옮기기도 하죠. 예전과 비교하면 모든 게 훨씬 편해요. 이제 아무도 무작정 기다리지 않으니까요.\n\n하지만 인정할 건 인정해야죠. 그 시절의 정시 도착은 의미가 있었어요. 문자 한 통으로 수습할 수 없었으니까요. 약속 하나하나에 조금 더 무게가 있었달까요. 솔직히 그게 조금 그립기도 해요.", "struct": [["1️⃣ 과거", "약속 = 돌에 새긴 맹세"], ["2️⃣ 장면", "역 시계탑 앞, 무작정 대기"], ["3️⃣ 현재", "단톡방 · 늦어 문자 · 핀 공유"], ["4️⃣ 대비", "훨씬 편리, 기다림은 실종"], ["5️⃣ 마무리", "약속의 무게, 그리움 한 스푼"]], "expr": [["back then", "그때는"], ["carved in stone", "돌에 새긴, 확정된"], ["used to ~", "~하곤 했다"], ["landline", "집 전화, 유선 전화"], ["completely different story", "완전히 다른 이야기"], ["flexible", "유연한"], ["pin drop", "위치 핀 공유"], ["compared to ~", "~과 비교하면"], ["way more ~", "훨씬 더 ~"], ["I have to admit", "인정할 수밖에 없다"], ["weight", "무게, 진중함"]], "audio": "audio/2_돌발/2-040 8. 약속(Appointment)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-040 8. 약속(Appointment)_비교.mp3"}, {"id": "2-041", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "묘사", "badge": "41 묘사", "enQ": "What do people in your country usually wear? How do their clothes differ between work and home? Describe the fashion in your country in detail.", "enA": "That's an interesting one — Korean fashion is famous for moving fast. Whatever is trending, you'll see it on the streets of Seoul within a week. But the real answer is: it depends on where we are.\n\nAt work, most people go with business casual — neat shirts, slacks, nothing too flashy. The moment we get home, though, it's a complete transformation: hoodies, old t-shirts, and those baggy sweatpants with stretched-out knees that everyone owns but nobody shows.\n\nSo I'd say Koreans are two people in one closet: polished from nine to six, and wrapped in a blanket of comfort after seven. That's pretty much the fashion here — fast trends outside, pure comfort at home.", "koQ": "당신의 나라 사람들은 보통 어떤 옷을 입나요? 직장에서 입는 옷과 집에서 입는 옷은 어떻게 다른가요? 당신의 나라의 패션을 자세히 묘사해주세요.", "koA": "흥미로운 질문이네요. 한국 패션은 빨리 움직이기로 유명해요. 뭐든 유행하면 일주일 안에 서울 거리에서 볼 수 있죠. 근데 진짜 답은, 어디에 있느냐에 따라 달라요.\n\n직장에서는 대부분 비즈니스 캐주얼이에요. 깔끔한 셔츠에 슬랙스, 너무 화려하지 않게요. 그런데 집에 오는 순간 완전한 변신이 일어나죠. 후드티, 오래된 티셔츠, 그리고 무릎이 늘어난 헐렁한 트레이닝 바지요. 다들 갖고 있지만 아무도 안 보여주는 그 바지요.\n\n그러니까 한국인은 옷장 하나에 두 사람이 사는 셈이에요. 9시부터 6시까지는 말끔하게, 7시 이후에는 편안함의 이불을 두르고 있죠. 이게 한국 패션이에요. 밖에서는 빠른 유행, 집에서는 완전한 편안함!", "struct": [["1️⃣ 도입", "한국 패션 = 빠른 유행"], ["2️⃣ 회사", "비즈니스 캐주얼, 깔끔"], ["3️⃣ 집", "후드티 · 늘어난 트레이닝"], ["4️⃣ 대비", "옷장 하나에 두 사람"], ["5️⃣ 마무리", "밖은 유행, 집은 편안함"]], "expr": [["That's an interesting one", "흥미로운 질문이네요"], ["trending", "유행 중인"], ["business casual", "비즈니스 캐주얼"], ["flashy", "화려한, 튀는"], ["complete transformation", "완전한 변신"], ["sweatpants", "트레이닝 바지"], ["stretched-out", "늘어난"], ["two people in one closet", "옷장 속 두 사람"], ["polished", "말끔한, 다듬어진"], ["wrapped in a blanket", "이불을 두른"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-041 9. 패션(Fashion)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-041 9. 패션(Fashion)_묘사.mp3"}, {"id": "2-042", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "습관", "badge": "42 습관", "enQ": "How do you usually choose what to wear every day? Where do you normally buy your clothes, and how often do you go clothes shopping? Tell me about your habits.", "enA": "My system is simple, so let me walk you through it. Everything starts the night before: right before my eleven o'clock phone rule kicks in, I check the weather app and set out tomorrow's clothes. Morning-me is not a decision maker!\n\nChoosing is easy anyway, because I have a uniform: a plain t-shirt, jeans, and white sneakers — my everyday armor. As for shopping, I usually hit the SPA brands at the mall near the station, once a season or so. And I do what I always do there: hunt for deals on the sale rack first.\n\nMy golden rule: never buy something just because it's cheap — it has to match the uniform. Simple closet, zero morning stress — that's pretty much my clothing routine, and it never gets old.", "koQ": "매일 입을 옷을 보통 어떻게 고르나요? 옷은 주로 어디에서 사고, 얼마나 자주 옷 쇼핑을 하러 가나요? 당신의 습관에 대해 말해주세요.", "koA": "제 시스템은 단순해요. 차근차근 알려드릴게요. 모든 건 전날 밤에 시작돼요. 11시 폰 규칙이 시작되기 직전에 날씨 앱을 확인하고 내일 입을 옷을 꺼내두죠. 아침의 저는 결정을 내릴 수 있는 사람이 아니거든요!\n\n고르는 건 어차피 쉬워요. 저만의 유니폼이 있거든요. 무지 티셔츠, 청바지, 흰 스니커즈. 저의 일상 갑옷이죠. 쇼핑은 보통 역 근처 쇼핑몰의 SPA 브랜드에 가요. 계절에 한 번 정도요. 그리고 거기서도 늘 하던 대로 세일 매대부터 특가 사냥을 하죠.\n\n저의 황금률은, 싸다고 사지 않기예요. 유니폼과 어울려야만 사요. 단순한 옷장, 아침 스트레스 제로. 이게 제 옷 루틴이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 준비", "전날 밤 날씨 앱 + 옷 준비"], ["2️⃣ 시스템", "유니폼 = 티 · 청바지 · 흰 신발"], ["3️⃣ 쇼핑", "역 쇼핑몰 SPA, 계절 1회"], ["4️⃣ 사냥", "세일 매대 특가 사냥 먼저"], ["5️⃣ 규칙", "싸도 유니폼과 안 맞으면 패스"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["the night before", "전날 밤에"], ["kick in", "시작되다, 발동하다"], ["set out", "꺼내 놓다"], ["Morning-me", "아침의 나"], ["uniform", "유니폼, 고정 조합"], ["armor", "갑옷"], ["once a season", "계절에 한 번"], ["hunt for deals", "특가를 사냥하다"], ["golden rule", "황금률"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-042 9. 패션(Fashion)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-042 9. 패션(Fashion)_습관.mp3"}, {"id": "2-043", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "취향", "badge": "43 취향", "enQ": "What style of clothes do you like to wear, and why? Do you prefer comfortable casual clothes or more formal outfits? Tell me about your fashion taste.", "enA": "If I had to choose, comfortable casual wins, no contest. For me, it's all about how clothes feel, not how they look. My style in three words? Simple, soft, and stress-free.\n\nI'd pick a hoodie over a blazer any day. Formal clothes always feel like a costume to me — I spend the whole evening checking my collar instead of enjoying myself. Don't get me wrong — I clean up for weddings and big days, and honestly it feels great for about an hour. Then all I can think about is my sweatpants waiting at home!\n\nNothing beats changing into a soft hoodie after a long day — it's like a hug you can wear. In a nutshell: formal clothes impress other people, but comfortable clothes take care of me.", "koQ": "어떤 스타일의 옷을 즐겨 입고, 그 이유는 무엇인가요? 편한 캐주얼 옷과 격식 있는 옷 중 무엇을 선호하나요? 당신의 패션 취향에 대해 말해주세요.", "koA": "골라야 한다면 편한 캐주얼 승리예요. 고민할 것도 없죠. 저한테 옷의 핵심은 어떻게 보이느냐가 아니라 어떤 느낌이냐거든요. 제 스타일을 세 단어로요? 심플, 부드러움, 스트레스 프리!\n\n블레이저보다는 무조건 후드티예요. 격식 있는 옷은 저한테 늘 무대 의상처럼 느껴져요. 즐기기는커녕 저녁 내내 옷깃만 확인하게 되거든요. 오해는 마세요. 결혼식이나 큰 행사 땐 저도 갖춰 입고, 솔직히 한 시간 정도는 기분도 좋아요. 그다음부터는 집에서 기다리는 트레이닝 바지 생각뿐이지만요!\n\n긴 하루 끝에 부드러운 후드티로 갈아입는 순간만 한 게 없어요. 입을 수 있는 포옹 같달까요. 한마디로, 격식 있는 옷은 남에게 잘 보이고, 편한 옷은 나를 돌봐줘요.", "struct": [["1️⃣ 선택", "편한 캐주얼, no contest"], ["2️⃣ 핵심", "옷은 느낌 — 심플 · 소프트"], ["3️⃣ 대비", "격식 옷 = 무대 의상"], ["4️⃣ 양보", "결혼식 땐 한 시간만 멋짐"], ["5️⃣ 명언", "격식은 남을, 편함은 나를"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["it's all about ~", "핵심은 ~이다"], ["stress-free", "스트레스 없는"], ["A over B any day", "B보다 무조건 A"], ["costume", "무대 의상"], ["clean up", "갖춰 입다"], ["Don't get me wrong", "오해는 마세요"], ["nothing beats ~", "~만 한 게 없다"], ["a hug you can wear", "입을 수 있는 포옹"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-043 9. 패션(Fashion)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-043 9. 패션(Fashion)_취향.mp3"}, {"id": "2-044", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "과거 경험", "badge": "44 과거 경험", "enQ": "Tell me about the last time you went shopping for clothes. Where did you go, and what did you end up buying? Describe that day in detail.", "enA": "This reminds me of last month, when my best friend and I went to the mall near the station. My mission was simple: one pair of jeans, in and out, thirty minutes. Famous last words!\n\nRight at the entrance, out of nowhere, we ran into a seventy-percent-off winter sale. My deal-hunting instinct just took over. I tried on coats for almost an hour, and guess what — I ended up with a long gray coat I absolutely love... and completely forgot the jeans. My friend still laughs about it — I remembered them on the bus home!\n\nStill, it worked out fine: that coat became my favorite thing in my closet, and I got the jeans online that night. Since then, I always write a shopping list in my phone before entering the mall. Not that I always follow it!", "koQ": "마지막으로 옷을 사러 갔던 때에 대해 말해주세요. 어디에 갔고, 결국 무엇을 샀나요? 그날에 대해 자세히 묘사해주세요.", "koA": "지난달이 떠오르네요. 절친과 역 근처 쇼핑몰에 갔어요. 미션은 단순했죠. 청바지 한 벌, 들어갔다 바로 나오기, 30분 컷. 그 말이 무색해질 줄은 몰랐지만요!\n\n입구에서부터 난데없이 겨울 옷 70% 세일과 마주쳤어요. 특가 사냥 본능이 저를 지배해버렸죠. 거의 한 시간 동안 코트를 입어봤는데, 세상에, 결국 완전 마음에 드는 롱 그레이 코트를 들고 나왔어요... 그리고 청바지는 완전히 까먹었죠. 절친은 아직도 그 얘기로 웃어요. 집 가는 버스에서야 생각났거든요!\n\n그래도 결국 다 잘 풀렸어요. 그 코트는 제 옷장 최애가 됐고, 청바지는 그날 밤 온라인으로 샀죠. 그 뒤로는 쇼핑몰에 들어가기 전에 꼭 폰 메모에 쇼핑 리스트를 적어요. 물론 항상 지키는 건 아니지만요!", "struct": [["1️⃣ 도입", "지난달, 미션은 청바지"], ["2️⃣ 반전", "입구에서 70% 세일 조우"], ["3️⃣ 결과", "코트 득템, 청바지 까먹음"], ["4️⃣ 감정", "절친은 아직도 웃는 중"], ["5️⃣ 교훈", "쇼핑 전 폰 메모 리스트"]], "expr": [["this reminds me of", "~이 떠오르다"], ["in and out", "들어갔다 바로 나오기"], ["Famous last words!", "그 말이 무색하게!"], ["out of nowhere", "난데없이"], ["run into ~", "~과 마주치다"], ["take over", "지배하다, 장악하다"], ["deal-hunting", "특가 사냥"], ["guess what", "있잖아요, 세상에"], ["end up with ~", "결국 ~을 갖게 되다"], ["work out fine", "잘 풀리다"], ["since then", "그 이후로"]], "audio": "audio/2_돌발/2-044 9. 패션(Fashion)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-044 9. 패션(Fashion)_과거 경험.mp3"}, {"id": "2-045", "cat": "unexpected", "catName": "돌발 질문", "num": 9, "topic": "패션", "topicEn": "Fashion", "type": "비교", "badge": "45 비교", "enQ": "Compare the fashion of the past with the fashion of today. What styles were popular when you were young, and what do people wear now? Tell me about the changes.", "enA": "Back then, when I was in school, fashion was all about matching everyone else. We used to wear the same brand of padded jackets — in winter, the whole classroom looked like a penguin colony! If one item was trendy, literally everyone had it.\n\nThese days, it's a completely different story. People dress to stand out, not to fit in: vintage shops, online brands, personal color tests — everyone builds their own style. Compared to my school days, fashion now is way more diverse, and comfort finally matters as much as looks.\n\nBut I have to admit, there was something sweet about those identical padded jackets. Wearing the same thing as your friends felt like being on one team — a little silly, but warm, if you ask me.", "koQ": "과거의 패션과 오늘날의 패션을 비교해주세요. 당신이 어렸을 때는 어떤 스타일이 유행했고, 지금 사람들은 무엇을 입나요? 그 변화에 대해 말해주세요.", "koA": "그때, 그러니까 제가 학생일 때 패션의 핵심은 남들과 맞추기였어요. 다들 같은 브랜드 패딩을 입곤 했죠. 겨울이면 교실 전체가 펭귄 무리처럼 보였어요! 아이템 하나가 유행하면 말 그대로 전원이 갖고 있었죠.\n\n요즘은 완전히 다른 이야기예요. 사람들은 묻어가려고가 아니라 돋보이려고 입어요. 빈티지 숍, 온라인 브랜드, 퍼스널 컬러 테스트까지. 모두가 자기만의 스타일을 만들죠. 학창 시절과 비교하면 지금 패션은 훨씬 다양하고, 드디어 편안함도 외모만큼 중요해졌어요.\n\n하지만 인정할 건 인정해야죠. 그 똑같은 패딩에는 뭔가 따뜻한 게 있었어요. 친구들과 같은 옷을 입는 건 한 팀이 된 기분이었거든요. 조금 우습지만, 제 생각엔 따뜻했어요.", "struct": [["1️⃣ 과거", "전원 같은 브랜드 패딩"], ["2️⃣ 장면", "겨울 교실 = 펭귄 무리"], ["3️⃣ 현재", "빈티지 · 퍼스널 컬러 · 개성"], ["4️⃣ 대비", "맞추기 vs 돋보이기"], ["5️⃣ 마무리", "같은 패딩의 소속감 그리움"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["penguin colony", "펭귄 무리"], ["literally", "말 그대로"], ["completely different story", "완전히 다른 이야기"], ["stand out", "돋보이다"], ["fit in", "어울리다, 묻어가다"], ["compared to ~", "~과 비교하면"], ["way more ~", "훨씬 더 ~"], ["I have to admit", "인정할 수밖에 없다"], ["being on one team", "한 팀이 된 기분"]], "audio": "audio/2_돌발/2-045 9. 패션(Fashion)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-045 9. 패션(Fashion)_비교.mp3"}, {"id": "2-046", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "묘사", "badge": "46 묘사", "enQ": "You indicated in the survey that you are looking for a job. What kind of job are you preparing for? What does that job involve? Tell me in detail.", "enA": "Yes, that's right — I'm preparing for my next chapter. I have an office job now, but I'm working toward moving into content marketing. Simply put, it's about telling a brand's story so well that people actually want to listen.\n\nWhat does it involve? Quite a lot, actually: planning social media posts, writing copy — the short, catchy lines you see in ads — and reading the data to see what people love. It's a job where you create something in the morning and get feedback from the world by evening.\n\nWhy this job? Honestly, it started with my YouTube habit: I kept analyzing why certain videos hook people. One day I realized — I don't just enjoy this stuff, I want to make it. So I'm moving in that direction, one evening at a time. That's the goal.", "koQ": "당신은 설문조사에서 구직 중이라고 답했습니다. 어떤 직업을 준비하고 있나요? 그 직업은 어떤 일을 하나요? 자세히 말해주세요.", "koA": "네, 맞아요. 저는 지금 저의 다음 챕터를 준비하고 있어요. 지금도 사무직으로 일하고 있지만, 콘텐츠 마케팅 쪽으로 옮기려고 준비 중이거든요. 간단히 말해, 사람들이 정말 듣고 싶어지게 브랜드의 이야기를 들려주는 일이에요.\n\n무슨 일을 하냐고요? 생각보다 많아요. SNS 게시물 기획, 광고에서 보이는 짧고 착 붙는 문구인 카피 쓰기, 그리고 사람들이 뭘 좋아하는지 데이터 읽기까지요. 아침에 만든 걸 저녁이면 세상의 반응으로 확인하는 일이죠.\n\n왜 이 직업이냐고요? 솔직히 유튜브 습관에서 시작됐어요. 어떤 영상이 왜 사람들을 사로잡는지 자꾸 분석하고 있더라고요. 어느 날 깨달았죠. 나는 이걸 즐기는 게 아니라 만들고 싶어 하는구나. 그래서 매일 저녁 조금씩, 그 방향으로 나아가고 있어요. 그게 제 목표예요.", "struct": [["1️⃣ 선언", "다음 챕터 = 콘텐츠 마케팅"], ["2️⃣ 정의", "브랜드 이야기 들려주기"], ["3️⃣ 업무", "SNS 기획 · 카피 · 데이터"], ["4️⃣ 계기", "유튜브 분석 습관에서 출발"], ["5️⃣ 마무리", "매일 저녁 조금씩 전진"]], "expr": [["next chapter", "다음 챕터"], ["work toward ~", "~을 향해 나아가다"], ["content marketing", "콘텐츠 마케팅"], ["simply put", "간단히 말해"], ["involve", "(일이) ~을 수반하다"], ["copy", "광고 문구, 카피"], ["catchy", "착 붙는, 귀에 남는"], ["get feedback", "반응을 얻다"], ["hook", "사로잡다"], ["one evening at a time", "하루 저녁씩 차근차근"], ["That's the goal.", "그게 목표예요"]], "audio": "audio/2_돌발/2-046 10. 직업(Jobs)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-046 10. 직업(Jobs)_묘사.mp3"}, {"id": "2-047", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "습관", "badge": "47 습관", "enQ": "Describe your typical day while preparing for a job. What do you usually do to get ready - studying, writing resumes, or preparing for interviews? Tell me about your daily routine.", "enA": "Since I work during the day, my job prep lives in the evenings — let me walk you through it. After my jog and dinner, I sit on my gray sofa and take a thirty-minute online course on marketing. Short, but every single day.\n\nAbout twice a week comes the real work: updating my portfolio. I practice writing catchy copy for products I love — like my favorite earbuds. And weekend mornings are for the heavy stuff: I take my laptop to Moon, my favorite cafe, order an iced americano, and polish my resume there. Somehow it feels less painful with good coffee!\n\nMy golden rule is 'one line a day': even on my laziest day, I add at least one line to something. Small steps, but they add up — that's pretty much my prep routine, and it never gets old.", "koQ": "취업을 준비하는 일반적인 하루를 설명해주세요. 공부, 이력서 작성, 면접 준비 중 주로 무엇을 하며 준비하나요? 당신의 하루 루틴에 대해 말해주세요.", "koA": "낮에는 일을 하니까 취업 준비는 저녁에 살아요. 차근차근 보여드릴게요. 조깅과 저녁 식사 후에 회색 소파에 앉아 30분짜리 마케팅 온라인 강의를 들어요. 짧지만, 하루도 빠짐없이요.\n\n일주일에 두 번 정도는 진짜 작업을 해요. 포트폴리오 업데이트요. 최애 이어폰처럼 제가 좋아하는 제품의 착 붙는 카피를 직접 써보는 연습이죠. 그리고 주말 아침은 무거운 일 담당이에요. 노트북을 들고 최애 카페 문(Moon)에 가서 아아를 시키고 이력서를 다듬어요. 좋은 커피와 함께라면 왠지 덜 고통스럽거든요!\n\n저의 황금률은 하루에 한 줄이에요. 가장 게으른 날에도 뭐라도 한 줄은 더해요. 작은 걸음이지만 쌓이거든요. 이게 제 준비 루틴이에요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "준비는 저녁에 산다"], ["2️⃣ 평일", "소파에서 30분 강의 매일"], ["3️⃣ 주중", "주 2회 포트폴리오 카피 연습"], ["4️⃣ 주말", "문(Moon) 카페에서 이력서"], ["5️⃣ 규칙", "하루에 한 줄 골든룰"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["every single day", "하루도 빠짐없이"], ["portfolio", "포트폴리오"], ["catchy copy", "착 붙는 카피"], ["the heavy stuff", "무거운 일"], ["polish", "다듬다"], ["less painful", "덜 고통스러운"], ["golden rule", "황금률"], ["one line a day", "하루에 한 줄"], ["add up", "쌓이다"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-047 10. 직업(Jobs)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-047 10. 직업(Jobs)_습관.mp3"}, {"id": "2-048", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "취향", "badge": "48 취향", "enQ": "What kind of company or job do you want to work for, and why? What is the most important thing to you when choosing a job - the salary, the work-life balance, or the work itself? Tell me the reasons.", "enA": "If I had to choose among the three, work-life balance wins — no contest. Of course I want a good salary and interesting work, but for me, it's all about having a life outside the office.\n\nI'd pick balance over a bigger paycheck any day. Here's my logic: my evening jog, cooking, calls with my mom — those little routines are what keep me sane and happy. A job that eats my evenings basically eats me. Don't get me wrong — the work itself matters too; that's exactly why I'm preparing for a job I'd actually enjoy. But even a dream job needs to leave room for dinner!\n\nSo my ideal company? One that believes rested people do better work. In a nutshell: salary fills my wallet, but balance fills my life.", "koQ": "어떤 회사나 직업에서 일하고 싶고, 그 이유는 무엇인가요? 직업을 고를 때 연봉, 워라밸, 일 자체 중 무엇이 가장 중요한가요? 그 이유를 말해주세요.", "koA": "셋 중에 골라야 한다면 워라밸 승리예요. 고민할 것도 없죠. 물론 좋은 연봉도 재미있는 일도 원하지만, 저한테 핵심은 회사 밖의 삶이 있느냐거든요.\n\n더 큰 월급보다는 무조건 균형이에요. 제 논리는 이래요. 저녁 조깅, 요리, 엄마와의 통화. 그 작은 루틴들이 절 제정신으로, 행복하게 지켜주거든요. 제 저녁을 잡아먹는 직장은 결국 저를 잡아먹는 거예요. 오해는 마세요. 일 자체도 중요해요. 그래서 진짜 즐길 수 있는 일을 준비하는 거고요. 하지만 꿈의 직장도 저녁 먹을 자리는 남겨줘야죠!\n\n그래서 제 이상적인 회사요? 잘 쉰 사람이 일도 잘한다고 믿는 곳이요. 한마디로, 연봉은 지갑을 채우지만 균형은 삶을 채워요.", "struct": [["1️⃣ 선택", "워라밸 승리, no contest"], ["2️⃣ 핵심", "회사 밖의 삶이 있느냐"], ["3️⃣ 논리", "저녁을 먹으면 나를 먹는다"], ["4️⃣ 양보", "일 자체도 중요 — 그래서 이직"], ["5️⃣ 명언", "연봉은 지갑, 균형은 삶"]], "expr": [["if I had to choose", "골라야 한다면"], ["no contest", "고민할 것도 없이"], ["work-life balance", "워라밸"], ["paycheck", "월급"], ["keep me sane", "제정신으로 지켜주다"], ["eat my evenings", "저녁을 잡아먹다"], ["Don't get me wrong", "오해는 마세요"], ["leave room for ~", "~할 여지를 남기다"], ["rested", "잘 쉰"], ["A over B any day", "B보다 무조건 A"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-048 10. 직업(Jobs)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-048 10. 직업(Jobs)_취향.mp3"}, {"id": "2-049", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "과거 경험", "badge": "49 과거 경험", "enQ": "Tell me about a memorable experience you had while looking for a job. Was it a job interview or a part-time job you tried? What happened, and how did you feel?", "enA": "This reminds me of my very first job interview — a part-time position at a coffee shop back in my university days. I was so nervous that morning: I rehearsed answers on the bus, and my hands were shaking at the door.\n\nThe interview started stiff — until, out of nowhere, the owner closed my resume and asked: 'So, what's YOUR favorite coffee?' And guess what — I completely lit up. I gave a passionate three-minute speech about iced americanos, and she burst out laughing. I got a call that same evening: I was hired.\n\nThat day taught me something I still believe: an interview isn't a test, it's a conversation. It all worked out fine, and since then, whenever I get nervous before something big, I just remember — they don't want perfect answers. They want me.", "koQ": "구직 활동을 하면서 겪은 기억에 남는 경험에 대해 말해주세요. 면접이었나요, 아니면 해봤던 아르바이트였나요? 무슨 일이 있었고, 어떤 기분이 들었나요?", "koA": "제 생애 첫 면접이 떠오르네요. 대학 시절 커피숍 아르바이트 면접이었어요. 그날 아침 얼마나 긴장했는지, 버스에서 답변을 리허설하고 문 앞에서는 손이 떨리고 있었죠.\n\n면접은 딱딱하게 시작됐어요. 그런데 난데없이 사장님이 제 이력서를 덮더니 물으셨죠. 그래서, 본인이 제일 좋아하는 커피는 뭐예요? 그리고 있잖아요, 저는 완전히 살아났어요. 아이스 아메리카노에 대해 3분짜리 열변을 토했고, 사장님은 빵 터지셨죠. 그날 저녁 바로 전화가 왔어요. 합격이었죠.\n\n그날 배운 걸 지금도 믿어요. 면접은 시험이 아니라 대화라는 거요. 결국 다 잘 풀렸고, 그 뒤로는 큰일을 앞두고 긴장될 때마다 떠올려요. 그들이 원하는 건 완벽한 답이 아니라 나라는 사람이라는 걸요.", "struct": [["1️⃣ 도입", "생애 첫 알바 면접"], ["2️⃣ 긴장", "버스 리허설 · 떨리는 손"], ["3️⃣ 반전", "최애 커피가 뭐예요?"], ["4️⃣ 절정", "아아 3분 열변 → 합격 전화"], ["5️⃣ 교훈", "면접은 시험 아닌 대화"]], "expr": [["this reminds me of", "~이 떠오르다"], ["rehearse", "리허설하다"], ["shaking", "떨리는"], ["stiff", "딱딱한, 경직된"], ["out of nowhere", "난데없이"], ["light up", "(표정이) 환해지다"], ["burst out laughing", "빵 터지다"], ["hired", "채용된"], ["guess what", "있잖아요, 세상에"], ["work out fine", "잘 풀리다"], ["since then", "그 이후로"]], "audio": "audio/2_돌발/2-049 10. 직업(Jobs)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-049 10. 직업(Jobs)_과거 경험.mp3"}, {"id": "2-050", "cat": "unexpected", "catName": "돌발 질문", "num": 10, "topic": "직업", "topicEn": "Jobs", "type": "비교", "badge": "50 비교", "enQ": "Compare looking for a job these days with the past. How has the way people find jobs changed over the years? What are the biggest differences?", "enA": "Back then — I mean, in my parents' generation — job hunting used to be a paper business. People circled listings in newspapers, printed resumes, and mailed them one by one. My mom says she once waited three weeks just to hear back from one company!\n\nThese days, it's a completely different story. Everything happens online: job platforms, one-click applications, even video interviews from your living room. Compared to the paper days, finding openings is way more convenient — you can apply to ten companies in one evening. And your portfolio matters as much as your diploma now.\n\nBut I have to admit, faster isn't always easier — more clicks also means more competition. Still, one thing never changed, if you ask me: in the end, someone across the table has to like who you are.", "koQ": "요즘의 구직 활동과 과거를 비교해주세요. 시간이 지나며 사람들이 일자리를 찾는 방식은 어떻게 변화했나요? 가장 큰 차이점은 무엇인가요?", "koA": "그때는, 그러니까 부모님 세대에는 구직 활동이 종이의 일이었어요. 신문 구인란에 동그라미를 치고, 이력서를 인쇄해서 한 통씩 우편으로 보냈죠. 엄마 말로는 회사 한 곳의 답을 듣는 데 3주를 기다린 적도 있대요!\n\n요즘은 완전히 다른 이야기죠. 모든 게 온라인에서 일어나요. 채용 플랫폼, 클릭 한 번 지원, 심지어 거실에서 보는 화상 면접까지요. 종이 시절과 비교하면 공고 찾기가 훨씬 편해요. 하루 저녁에 열 군데도 지원할 수 있으니까요. 그리고 이젠 졸업장만큼 포트폴리오가 중요해졌어요.\n\n하지만 인정할 건 인정해야죠. 빨라졌다고 쉬워진 건 아니에요. 클릭이 늘어난 만큼 경쟁도 늘었으니까요. 그래도 제 생각에 변하지 않은 게 하나 있어요. 결국엔 테이블 건너편의 누군가가 나라는 사람을 좋아해줘야 한다는 거요.", "struct": [["1️⃣ 과거", "신문 동그라미 · 우편 지원"], ["2️⃣ 장면", "엄마의 3주 기다림"], ["3️⃣ 현재", "플랫폼 · 원클릭 · 화상 면접"], ["4️⃣ 대비", "빨라진 만큼 경쟁도 증가"], ["5️⃣ 마무리", "변하지 않은 건 사람"]], "expr": [["back then", "그때는"], ["used to ~", "~하곤 했다"], ["job hunting", "구직 활동"], ["hear back from ~", "~에게서 답을 듣다"], ["completely different story", "완전히 다른 이야기"], ["one-click application", "원클릭 지원"], ["compared to ~", "~과 비교하면"], ["way more ~", "훨씬 더 ~"], ["opening", "공석, 채용 공고"], ["I have to admit", "인정할 수밖에 없다"], ["across the table", "테이블 건너편의"]], "audio": "audio/2_돌발/2-050 10. 직업(Jobs)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-050 10. 직업(Jobs)_비교.mp3"}, {"id": "2-051", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "묘사", "badge": "51 묘사", "enQ": "Describe the place where you usually spend your free time. Where is it, and what does it look like? Why do you spend time there? Tell me in detail.", "enA": "That's an easy one — my free time lives at the riverside trail by the Han River, about ten minutes from my place. It's a long walking path with a jogging track, benches under the trees, and that wide-open view of the water.\n\nWhat does it look like? Picture this: joggers gliding by, couples with picnic mats, someone practicing guitar badly but happily. In the evening the city lights reflect on the river, and honestly, it turns into a free movie screen.\n\nWhy there? Because it's my all-in-one spot: I jog there, take my mom's calls there, and sort out my thoughts there. Ten minutes from my door, zero admission fee, new sky every day — that's pretty much my favorite place on Earth.", "koQ": "여가 시간을 주로 보내는 장소를 묘사해주세요. 어디에 있고, 어떻게 생겼나요? 왜 그곳에서 시간을 보내나요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 제 여가 시간은 집에서 10분 거리인 한강 강변 산책로에 살아요. 조깅 트랙이 있는 긴 산책길인데, 나무 아래 벤치들, 그리고 탁 트인 강 전망이 있죠.\n\n어떻게 생겼냐면, 상상해보세요. 미끄러지듯 달리는 조깅하는 사람들, 돗자리 편 커플들, 기타를 서툴지만 행복하게 연습하는 누군가요. 저녁이면 도시의 불빛이 강에 반사되는데, 솔직히 공짜 영화 스크린이 따로 없어요.\n\n왜 거기냐고요? 저의 올인원 장소거든요. 거기서 조깅하고, 엄마 전화도 받고, 생각도 정리해요. 집에서 10분, 입장료 0원, 매일 새로운 하늘. 이게 제가 지구에서 제일 좋아하는 장소예요.", "struct": [["1️⃣ 선언", "한강 강변 산책로, 10분"], ["2️⃣ 묘사", "트랙 · 벤치 · 탁 트인 강"], ["3️⃣ 장면", "조깅 · 돗자리 · 기타 연습"], ["4️⃣ 이유", "조깅 + 통화 + 생각 정리"], ["5️⃣ 마무리", "입장료 0원, 매일 새 하늘"]], "expr": [["That's an easy one", "쉬운 질문이네요"], ["riverside trail", "강변 산책로"], ["Picture this:", "상상해보세요"], ["glide by", "미끄러지듯 지나가다"], ["reflect on ~", "~에 반사되다"], ["free movie screen", "공짜 영화 스크린"], ["all-in-one spot", "올인원 장소"], ["sort out my thoughts", "생각을 정리하다"], ["admission fee", "입장료"], ["wide-open", "탁 트인"], ["that's pretty much ~", "그게 대충 ~예요"]], "audio": "audio/2_돌발/2-051 11. 여가(Free Time)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-051 11. 여가(Free Time)_묘사.mp3"}, {"id": "2-052", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "습관", "badge": "52 습관", "enQ": "What do you usually do when you have free time? How do your weekday evenings differ from your weekends? Describe how you typically spend your free time.", "enA": "Sure — let me walk you through my free time. On weekday evenings, it's all about recharging alone: a jog along the river, a simple dinner I cook myself, then YouTube on my gray sofa. Quiet, simple, sacred.\n\nWeekends are a different animal: that's when people enter the picture. Saturday is usually for my best friend — coffee at Moon or chimaek at the pub — and Sunday evening always ends with my mom's call. And once in a while, a lazy hotel staycation resets everything.\n\nSo the pattern is simple: weekdays recharge my battery, weekends fill my heart. Two different modes, one happy me — that's pretty much it, and it never gets old.", "koQ": "여가 시간이 생기면 주로 무엇을 하나요? 평일 저녁과 주말은 어떻게 다른가요? 일반적으로 여가 시간을 어떻게 보내는지 설명해주세요.", "koA": "네, 제 여가 시간을 차근차근 보여드릴게요. 평일 저녁의 핵심은 혼자 재충전하기예요. 강변 조깅, 직접 만드는 간단한 저녁, 그리고 회색 소파에서 유튜브. 조용하고, 단순하고, 신성하죠.\n\n주말은 완전히 다른 동물이에요. 사람들이 등장하는 시간이거든요. 토요일은 보통 절친 몫이에요. 문(Moon)에서 커피를 마시거나 펍에서 치맥을 하죠. 그리고 일요일 저녁은 늘 엄마의 전화로 끝나요. 가끔은 게으른 호캉스가 모든 걸 리셋해주고요.\n\n그러니까 패턴은 단순해요. 평일은 배터리를 충전하고, 주말은 마음을 채워요. 두 개의 모드, 한 명의 행복한 나. 그게 다예요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "차근차근 예고 오프닝"], ["2️⃣ 평일", "조깅 · 요리 · 소파 유튜브"], ["3️⃣ 주말", "절친 토요일 · 엄마 일요일"], ["4️⃣ 가끔", "호캉스로 전체 리셋"], ["5️⃣ 마무리", "평일 충전, 주말 채움"]], "expr": [["let me walk you through", "차근차근 설명하다"], ["recharge", "재충전하다"], ["sacred", "신성한"], ["a different animal", "완전히 다른 것"], ["enter the picture", "등장하다"], ["chimaek", "치맥"], ["staycation", "호캉스"], ["reset", "리셋하다"], ["fill my heart", "마음을 채우다"], ["two different modes", "두 개의 모드"], ["it never gets old", "전혀 질리지 않아요"]], "audio": "audio/2_돌발/2-052 11. 여가(Free Time)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-052 11. 여가(Free Time)_습관.mp3"}, {"id": "2-053", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "취향", "badge": "53 취향", "enQ": "What is your favorite free-time activity, and why do you enjoy it? How did you come to like it? Tell me the reasons in detail.", "enA": "If I had to choose, it's my evening jog along the river — no contest. For me, it's all about that one hour when nobody needs me: just my sneakers, my playlist, and the water.\n\nHow did I get into it? A few years ago, I was out of shape and always tired — climbing the subway stairs left me breathless, and that was my wake-up call. The first week was rough: I couldn't run for even ten minutes! But I kept showing up, and slowly it became my thing. Now my legs start itching around seven.\n\nWhy do I love it? It clears my head better than anything else — problems shrink with every kilometer. Ever since that first breathless week, jogging has been my happy hour. In a nutshell: some people end the day with a drink; I end mine with a run.", "koQ": "가장 좋아하는 여가 활동은 무엇이고, 왜 그것을 즐기나요? 어떻게 그것을 좋아하게 되었나요? 그 이유를 자세히 말해주세요.", "koA": "골라야 한다면 강변 저녁 조깅이에요. 고민할 것도 없죠. 저한테 핵심은 아무도 절 찾지 않는 그 한 시간이에요. 운동화, 플레이리스트, 그리고 강물만 있으면 되죠.\n\n어떻게 좋아하게 됐냐고요? 몇 년 전에 체력이 바닥이라 늘 피곤했어요. 지하철 계단만 올라도 숨이 차더라고요. 그게 저의 경고음이었죠. 첫 주는 혹독했어요. 10분도 못 뛰었다니까요! 그래도 계속 나갔더니 어느새 저의 것이 됐어요. 이제는 7시쯤 되면 다리가 근질거려요.\n\n왜 좋아하냐고요? 뭐보다 머리가 맑아져요. 1km마다 고민이 작아지거든요. 그 숨차던 첫 주 이후로 조깅은 제 해피 아워예요. 한마디로, 어떤 사람들은 술 한잔으로 하루를 닫지만, 저는 달리기로 닫아요.", "struct": [["1️⃣ 선택", "저녁 강변 조깅, no contest"], ["2️⃣ 핵심", "아무도 날 찾지 않는 1시간"], ["3️⃣ 계기", "지하철 계단 wake-up call"], ["4️⃣ 성장", "10분도 못 뛰다 → 근질근질"], ["5️⃣ 명언", "술 대신 달리기로 하루 마감"]], "expr": [["if I had to choose", "골라야 한다면"], ["it's all about ~", "핵심은 ~이다"], ["get into ~", "~에 빠지다"], ["out of shape", "체력이 바닥인"], ["breathless", "숨이 찬"], ["wake-up call", "경고음, 각성 계기"], ["become my thing", "나의 것이 되다"], ["legs start itching", "다리가 근질거리다"], ["clear my head", "머리를 맑게 하다"], ["ever since", "그 이후로 쭉"], ["in a nutshell", "한마디로"]], "audio": "audio/2_돌발/2-053 11. 여가(Free Time)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-053 11. 여가(Free Time)_취향.mp3"}, {"id": "2-054", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "과거 경험", "badge": "54 과거 경험", "enQ": "Tell me about a memorable time you had during your free time recently. What did you do, and who were you with? What made it special?", "enA": "This reminds me of two weekends ago. My best friend texted me at noon: 'River. Ramyeon. Thirty minutes.' No plan, no reservation — just a sunny Saturday and two lazy people deciding not to waste it.\n\nWe grabbed a mat, cooked instant noodles at the convenience store by the park, and camped by the water all afternoon. Then, out of nowhere, it started to pour! We sprinted under a bridge, soaked and laughing like kids. Guess what — that became the best part: we sat there under one umbrella, watching the rain hit the river, saying absolutely nothing.\n\nIt all worked out fine — the sun returned for a perfect sunset. What made it special? Zero planning. Since then, our motto is: the best plan is no plan. That rainy photo is still pinned in our group chat!", "koQ": "최근 여가 시간에 보낸 기억에 남는 시간에 대해 말해주세요. 무엇을 했고, 누구와 함께였나요? 무엇이 그것을 특별하게 만들었나요?", "koA": "2주 전 주말이 떠오르네요. 절친이 정오에 문자를 보냈어요. 강. 라면. 30분 뒤. 계획도 예약도 없이, 그냥 화창한 토요일과 그걸 낭비하지 않기로 한 게으른 두 사람이었죠.\n\n돗자리를 챙겨서 공원 옆 편의점에서 라면을 끓여 물가에서 오후 내내 놀았어요. 그런데 난데없이 비가 쏟아지기 시작한 거예요! 우리는 다리 밑으로 전력 질주했고, 쫄딱 젖은 채 애들처럼 웃었죠. 그런데 있잖아요, 그게 최고의 순간이 됐어요. 우산 하나를 나눠 쓰고 앉아서, 강에 떨어지는 비를 보면서, 아무 말도 안 했거든요.\n\n결국 다 잘 풀렸어요. 해가 돌아와서 완벽한 노을까지 봤죠. 뭐가 특별했냐고요? 계획이 없었다는 거요. 그 뒤로 우리의 모토는, 최고의 계획은 무계획이에요. 그 비 오는 날 사진은 아직도 단톡방에 고정되어 있어요!", "struct": [["1️⃣ 도입", "정오의 문자 — 강. 라면."], ["2️⃣ 전개", "돗자리 · 편의점 라면 · 물가"], ["3️⃣ 반전", "소나기 → 다리 밑 질주"], ["4️⃣ 절정", "우산 하나, 말 없는 빗소리"], ["5️⃣ 교훈", "최고의 계획은 무계획"]], "expr": [["this reminds me of", "~이 떠오르다"], ["no plan, no reservation", "무계획 · 무예약"], ["camp by ~", "~ 옆에 자리 잡다"], ["out of nowhere", "난데없이"], ["pour", "(비가) 쏟아지다"], ["sprint", "전력 질주하다"], ["soaked", "쫄딱 젖은"], ["guess what", "있잖아요, 세상에"], ["saying absolutely nothing", "아무 말 없이"], ["work out fine", "잘 풀리다"], ["The best plan is no plan.", "최고의 계획은 무계획"]], "audio": "audio/2_돌발/2-054 11. 여가(Free Time)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-054 11. 여가(Free Time)_과거 경험.mp3"}, {"id": "2-055", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "비교", "badge": "55 비교", "enQ": "Compare how you spend your free time now with how you spent it five or ten years ago. What has changed, and why? Tell me about the differences.", "enA": "Back then — five or six years ago, in my university days — free time meant going out. My friends and I used to roam the city until late: all-night movie marathons, karaoke until our voices died, and instant noodles at 3 a.m.\n\nThese days, it's a completely different story. My free time turned inward: jogging, cooking, YouTube on the sofa, lights out before midnight. Compared to those wild days, my evenings are way quieter — and I protect that quiet like treasure. What changed? My energy became something I budget, not something I burn.\n\nBut I have to admit, I miss that 3 a.m. recklessness sometimes. Back then we had energy but no money; now I have some money but no energy. Life is funny like that, if you ask me.", "koQ": "지금 여가 시간을 보내는 방식과 5년, 10년 전의 방식을 비교해주세요. 무엇이 변화했고, 그 이유
