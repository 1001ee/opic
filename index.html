r three possible fixes.", "enA": "Hello, I bought a Bluetooth speaker from your store last year, and it just went dead while I was playing music. No light, no sound, nothing. And here's the tricky part — friends are coming over in two hours to listen to music together.\n\nI've already tried the obvious things. I swapped the cable, plugged it into another outlet, and held the power button for ten seconds. Nothing worked.\n\nSo could you tell me what else I can try over the phone? And if it's really broken, do you have the same model in stock today? I could pick it up on my way home. Or if that's a hassle, could I rent something small just for tonight? Any of those would save me.", "koQ": "집에서 음악을 듣고 있는데 스피커가 갑자기 작동하지 않습니다. 곧 친구들이 음악을 들으러 옵니다. 전자제품 매장에 전화해 상황을 설명하고 2~3가지 해결 방법을 물어보세요.", "koA": "안녕하세요, 작년에 그 매장에서 블루투스 스피커를 샀는데요. 음악을 틀어 놓고 있는데 갑자기 먹통이 됐어요. 불도 안 들어오고, 소리도 없고, 아무 반응이 없어요. 그리고 곤란한 건 이거예요. 두 시간 뒤에 친구들이 음악 들으러 오기로 했거든요.\n\n기본적인 건 이미 다 해 봤어요. 케이블도 바꿔 보고, 다른 콘센트에도 꽂아 보고, 전원 버튼도 10초 동안 눌러 봤어요. 아무것도 안 되더라고요.\n\n그래서 전화로 또 뭘 해 볼 수 있는지 알려 주실 수 있을까요? 그리고 정말 고장이라면, 오늘 같은 모델 재고가 있나요? 퇴근길에 제가 찾아갈 수 있거든요. 아니면 그게 번거로우면, 오늘 하룻밤만 작은 걸 대여할 수는 없을까요? 어느 쪽이든 저한테는 큰 도움이 될 것 같아요.", "struct": [["1️⃣ 상황", "구매처 + 갑작스러운 고장"], ["2️⃣ 압박", "두 시간 뒤 친구들 방문"], ["3️⃣ 시도", "케이블 · 콘센트 · 전원 버튼"], ["4️⃣ 질문", "① 추가 점검 ② 당일 재고"], ["5️⃣ 마무리", "③ 하룻밤 대여 + 도움 요청"]], "scoring": [["마감 시간 깔기", "두 시간 뒤 친구들이 온다는 한 줄이 이 통화 전체의 긴박함을 만들어 줍니다 ⏰ 급한 이유가 없으면 재촉할 명분도 사라져요"], ["시도 먼저 말하기", "케이블·콘센트·전원 버튼을 이미 해 봤다고 말하면 직원이 같은 말을 반복하지 않아요 🔑 문제해결 유형에서 대화를 한 단계 앞으로 보내는 장치입니다"], ["묻는 유형 구분", "이 문제는 대안을 제안하라가 아니라 해결 방법을 물어보라고 했어요 ✅ 세 가지를 모두 의문문으로 만들어야 요구에 정확히 맞아떨어집니다"], ["난이도 낮추기", "전화 점검 → 당일 재고 → 하룻밤 대여. 상대 부담이 작은 쪽으로 내려가면 셋 중 하나는 걸려요 💪 하나가 거절돼도 대화가 끊기지 않습니다"]], "expr": [["go dead", "먹통이 되다", "롤플레이 MP3 편 재활용 🔁 🔋"], ["Here's the tricky part", "곤란한 건 이거예요", "문제의 핵심을 여는 신호탄 🔑"], ["come over", "(집에) 놀러 오다", "서베이 음악감상 편 상황 재활용 🔁 🎵"], ["the obvious things", "기본적인 것들", "이미 해 본 것을 묶는 표현 ✨"], ["swap the cable", "케이블을 바꿔 보다", "기기 점검 필수 동사 🔁 🔑"], ["hold the power button", "전원 버튼을 길게 누르다", "초기화 시도의 정답 표현 🔋"], ["Nothing worked.", "아무것도 안 되더라고요.", "시도–실패 나열의 마침표 🔁 💪"], ["What else can I try?", "또 뭘 해 볼까요?", "문제 속 요구를 그대로 회수 ✅"], ["in stock", "재고가 있는", "매장 문의 필수 표현 💳"], ["pick it up", "직접 찾아가다", "배송 대신 고르는 빠른 선택지 ⏰"], ["if that's a hassle", "그게 번거로우면", "롤플레이 휴대폰 편 재활용 🔁 😊"]], "audio": "audio/3_롤플레이/3-035 12. 음악(Music)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-035 12. 음악(Music)_문제 해결.mp3"}, {"id": "3-036", "cat": "roleplay", "catName": "롤플레이 질문", "num": 12, "topic": "음악", "topicEn": "Music", "type": "과거 경험", "badge": "36 과거 경험", "enQ": "That's the end of the situation. Have you ever run into an unexpected problem at a concert? What took place, and how did you handle it? How did the experience make you feel?", "enA": "Oh, this reminds me of a concert two summers ago. I got to the venue an hour early, feeling great, and then — the app wouldn't load. My mobile ticket simply would not open at the gate.\n\nOut of nowhere, ten thousand people were on the same network and my data crawled. The staff said a screenshot wouldn't be accepted. I restarted the app, turned airplane mode on and off — no luck. Honestly, I started to panic, because I could already hear the opening song from outside.\n\nThen it hit me — the box office. I ran over, showed my ID and the card I'd paid with, and they looked up my booking and printed a paper ticket. I missed two songs, but I got in. I felt like crying and laughing at the same time. Since then, I always download the ticket the night before.", "koQ": "콘서트에 갔다가 예상치 못한 문제를 겪은 적이 있나요? 무슨 일이 있었고 어떻게 대처했나요? 그 경험에 대해 어떻게 느꼈나요?", "koA": "아, 재작년 여름 콘서트가 하나 생각나네요. 기분 좋게 한 시간이나 일찍 공연장에 도착했는데, 하필 앱이 안 열리는 거예요. 입구에서 모바일 티켓이 도무지 안 떴어요.\n\n난데없이 만 명이 같은 통신망에 몰리니까 데이터가 기어가더라고요. 직원분은 캡처는 인정이 안 된다고 하셨고요. 앱도 다시 켜 보고, 비행기 모드도 껐다 켜 봤는데 소용없었어요. 솔직히 당황하기 시작했어요. 밖에서 벌써 오프닝 곡이 들렸거든요.\n\n그때 문득 매표소가 떠올랐어요. 달려가서 신분증이랑 결제한 카드를 보여 드렸더니, 예매 내역을 조회해서 종이 티켓을 뽑아 주셨어요. 두 곡은 놓쳤지만 들어가긴 했죠. 울고 싶으면서 동시에 웃음이 나는 기분이었어요. 그 후로는 꼭 전날 밤에 티켓을 미리 받아 둬요.", "struct": [["1️⃣ 도입", "한 시간 일찍 도착 · 기분 최고"], ["2️⃣ 사건", "입구에서 모바일 티켓 안 열림"], ["3️⃣ 절정", "데이터 먹통 · 캡처 불가 · 오프닝 소리"], ["4️⃣ 해결", "매표소에서 신분증 + 카드 조회"], ["5️⃣ 마무리", "두 곡 놓침 + 전날 다운로드 규칙"]], "scoring": [["감정까지 답하기", "기분이 어땠는지도 묻고 있어요. 울고 싶으면서 웃음이 났다는 한 줄을 꼭 넣어야 세 가지 요구가 다 채워집니다 ✅"], ["감각 디테일", "밖에서 오프닝 곡이 들렸다는 한 줄이 초조함을 설명 없이 전달해요 🎵 감정을 말하기 전에 그 순간 들린 소리를 먼저 놓아 보세요"], ["시도 세 개", "앱 재시작 · 비행기 모드 · 캡처 제시. 실패한 시도를 세 개 나열해야 해결이 값져 보여요 💪 바로 매표소로 달려가면 이야기가 밋밋해집니다"], ["소재 겹치지 않게", "서베이 콘서트 편은 최고의 밤, 롤플레이 콘서트 편은 티켓 양도였으니 여기는 입장 사고로 갈랐어요 🔁 같은 소재는 덱 전체에서 한 번만 씁니다"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["wouldn't load", "열리지가 않았다", "wouldn't = 거부의 뉘앙스 🔁 🔑"], ["a mobile ticket", "모바일 티켓", "롤플레이 콘서트 편 재활용 🔁 ✨"], ["out of nowhere", "난데없이", "사건 발생 신호, 전 편 개근 🔁"], ["my data crawled", "데이터가 기어갔다", "느린 속도를 그리는 동사 😆"], ["wouldn't be accepted", "인정이 안 된다", "규정을 전하는 수동태 표현 📏"], ["no luck", "소용없었어요", "롤플레이 휴대폰 편 재활용 🔁 💪"], ["I started to panic", "당황하기 시작했어요", "감정 고조의 정직한 표현 😆"], ["Then it hit me", "그때 문득 떠올랐어요", "롤플레이 휴대폰 편 재활용 🔁 🔑"], ["look up my booking", "예매 내역을 조회하다", "해결 장면의 핵심 동사 ✅"], ["the night before", "전날 밤에", "돌발 패션 편 재활용 🔁 🌙"]], "audio": "audio/3_롤플레이/3-036 12. 음악(Music)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-036 12. 음악(Music)_과거 경험.mp3"}, {"id": "3-037", "cat": "roleplay", "catName": "롤플레이 질문", "num": 13, "topic": "세일", "topicEn": "Sale", "type": "정보 요청", "badge": "37 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your favorite store is holding a big sale, and you would like to learn more about it. Call the store and leave a message with three or four questions to get more details about the sale.", "enA": "Hi, this is Ryan. I'm a regular at your store — I was in last weekend. I just heard you're having a big sale next month, and I've got a few questions. It's after hours, so I'll leave them on the machine and you can get back to me.\n\nFirst, when does the sale start and end? I'd like to plan around it. Second, is it store-wide, or only selected items? I'm mostly after winter coats.\n\nThird, how big is the discount — is it a flat thirty percent, or does it depend on the item? And one last thing: do you hold items for regular customers before the sale opens? You have my number from my last order, so give me a call back whenever it's convenient. Thank you!", "koQ": "가장 좋아하는 가게에서 큰 세일을 합니다. 가게에 전화해 메시지를 남기고, 세일에 대해 더 알기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 저는 라이언이라고 합니다. 그 가게 단골이에요. 지난 주말에도 들렀고요. 다음 달에 큰 세일을 하신다고 들어서 몇 가지 여쭤보려고요. 영업시간이 끝난 시간이라 자동응답기에 질문을 남겨 둘게요. 편하실 때 연락 주세요.\n\n우선, 세일이 언제 시작해서 언제 끝나나요? 일정을 맞춰 보려고요. 두 번째로, 매장 전체 세일인가요, 아니면 일부 품목만인가요? 저는 주로 겨울 코트를 보고 있거든요.\n\n세 번째로, 할인 폭이 어느 정도인가요? 일괄 30퍼센트인가요, 아니면 품목마다 다른가요? 그리고 마지막으로 하나만, 세일이 열리기 전에 단골손님을 위해 물건을 빼 두기도 하시나요? 지난 주문 때 제 번호가 남아 있을 테니, 편하실 때 회신 전화 주세요. 감사합니다!", "struct": [["1️⃣ 인사", "이름 + 단골 소개 + 메시지 이유"], ["2️⃣ 질문", "① 세일 시작·종료 시점"], ["3️⃣ 질문", "② 전 품목인지 일부 품목인지"], ["4️⃣ 질문", "③ 할인 폭 확인"], ["5️⃣ 마무리", "④ 상품 예약 + 회신 요청"]], "scoring": [["메시지 유형", "leave a message는 상대가 없는 유형이에요. 되묻기 리액션을 쓰면 안 되고 처음부터 끝까지 혼자 말해야 합니다 🔑"], ["이름부터 밝히기", "음성 메시지는 내가 누구인지 모르면 회신이 오지 않아요. this is ~로 시작하고 단골이라는 점까지 붙이면 완벽합니다 💬 전화 유형과 결정적으로 다른 지점이에요"], ["순번으로 나누기", "First · Second · Third · One last thing으로 번호를 붙이면 듣는 사람이 질문 개수를 셀 수 있어요 📏 리액션이 없는 만큼 구조가 유일한 길잡이입니다"], ["회신 요청 마무리", "give me a call back으로 닫아야 메시지가 완결돼요 ✅ 질문만 늘어놓고 끊으면 상황이 해결되지 않은 답변으로 남습니다"]], "expr": [["This is ~ (on the phone)", "(전화상) ~입니다", "음성 메시지 필수 오프닝 💬"], ["a regular", "단골손님", "돌발 약속 편 the regulars 재활용 🔁 🏠"], ["after hours", "영업시간이 끝난 뒤", "메시지를 남기는 이유 한 줄 ⏰"], ["leave ~ on the machine", "자동응답기에 남기다", "이 유형의 핵심 표현 🔑"], ["When does it start and end?", "언제 시작하고 끝나나요?", "기간 질문 기본형 ⏰"], ["store-wide", "매장 전체의", "세일 범위 질문 필수 어휘 🔑"], ["selected items", "일부 품목", "store-wide의 짝꿍 표현 ✨"], ["a flat thirty percent", "일괄 30퍼센트", "할인율을 묻는 고급 표현 💳"], ["be after ~", "~을 노리다, 찾고 있다", "목적을 밝히는 구어체 동사 📏"], ["hold items", "물건을 빼 두다", "단골 특전을 묻는 표현 ✅"], ["give me a call back", "회신 전화 주세요", "메시지 마무리 공식 💬"]], "audio": "audio/3_롤플레이/3-037 13. 세일(Sale)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-037 13. 세일(Sale)_정보 요청.mp3"}, {"id": "3-038", "cat": "roleplay", "catName": "롤플레이 질문", "num": 13, "topic": "세일", "topicEn": "Sale", "type": "문제 해결", "badge": "38 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. After getting home with the clothes you purchased, you notice you were not charged the sale price. Call the store, describe what happened, and offer two or three ways to fix the problem.", "enA": "Hi, is this the clothing store in the mall? I bought two sweaters there about an hour ago, and when I got home I checked the receipt — I was charged the full price. The sign on the rack said thirty percent off, but it wasn't applied at the register.\n\nHere's what I'm thinking. The simplest fix would be to refund the difference to my card. I still have the receipt, the tags are on, and the transaction number is right here if you need it.\n\nIf you can't do that over the phone, I could come back tomorrow after work — though I'd rather not make the trip twice. Or, if it's easier for you, store credit for the difference would be fine too. Let me know which one works — I'll be home all evening.", "koQ": "구매한 옷을 가지고 집에 온 뒤, 세일 가격으로 계산되지 않은 것을 알았습니다. 매장에 전화해 상황을 설명하고, 문제를 해결할 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 혹시 쇼핑몰에 있는 옷 가게 맞나요? 한 시간쯤 전에 거기서 스웨터를 두 장 샀는데요, 집에 와서 영수증을 확인해 보니 정가로 결제가 됐더라고요. 진열대에는 30퍼센트 할인이라고 붙어 있었는데, 계산대에서 적용이 안 된 것 같아요.\n\n제 생각은 이래요. 제일 간단한 건 차액을 제 카드로 환불해 주시는 거예요. 영수증도 그대로 있고, 택도 안 뗐고, 거래 번호도 여기 있어요. 필요하시면 불러 드릴게요.\n\n전화로 처리가 어려우시면 제가 내일 퇴근하고 다시 갈 수는 있어요. 다만 같은 길을 두 번 가는 건 좀 그렇네요. 아니면 그쪽이 더 편하시다면 차액만큼 매장 적립금으로 주셔도 괜찮아요. 어느 쪽이 되는지 알려 주세요. 저녁 내내 집에 있을 거예요.", "struct": [["1️⃣ 확인", "매장 확인 + 한 시간 전 구매"], ["2️⃣ 문제", "정가 결제 · 30% 표시 미적용"], ["3️⃣ 요구", "① 카드로 차액 환불"], ["4️⃣ 대안", "② 내일 방문 ③ 매장 적립금"], ["5️⃣ 마무리", "선택권 넘기기 + 통화 가능 시간"]], "scoring": [["증거 세 가지", "영수증·택·거래 번호. 손에 쥔 증거를 세 개 대면 전화만으로도 요구가 통합니다 📏 세일가 분쟁은 결국 증거 싸움이에요"], ["가장 쉬운 요구", "카드로 차액만 돌려 달라는 요구가 상대에게 가장 부담이 없어요 💳 첫 대안은 언제나 실현 가능성이 높은 쪽으로 두는 게 정석입니다"], ["내 수고 드러내기", "같은 길을 두 번 가기는 번거롭다는 한 줄이 전화 처리를 요청할 근거가 돼요 ⏰ 불평이 아니라 이유로 들리게 말하는 것이 요령입니다"], ["통화 가능 시간", "저녁 내내 집에 있다는 마무리가 회신을 받을 통로를 열어 둡니다 ✅ 문제해결 유형은 다음 연락까지 설계해야 완성돼요"]], "expr": [["check the receipt", "영수증을 확인하다", "롤플레이 영화 편 재활용 🔁 📏"], ["be charged the full price", "정가로 결제되다", "이 문제의 핵심 수동태 🔑"], ["thirty percent off", "30퍼센트 할인", "세일 표기 필수 표현 💳"], ["it wasn't applied", "적용이 안 됐어요", "상대 탓 없이 사실만 말하기 ✨"], ["Here's what I'm thinking", "제 생각은 이래요", "대안 나열 직전의 신호탄 🔁 🔑"], ["refund the difference", "차액을 환불하다", "세일 유형의 핵심 요구 💳"], ["the tags are on", "택이 그대로 있어요", "반품·교환 자격을 증명 ✅"], ["the transaction number", "거래 번호", "근거를 구체화하는 명사 📏"], ["come back tomorrow", "내일 다시 가다", "차선책으로 제시하는 표현 ⏰"], ["store credit", "매장 적립금", "세 번째 대안 명사 💳"], ["Let me know which one works", "어느 쪽이 되는지 알려 주세요", "선택권을 넘기는 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-038 13. 세일(Sale)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-038 13. 세일(Sale)_문제 해결.mp3"}, {"id": "3-039", "cat": "roleplay", "catName": "롤플레이 질문", "num": 13, "topic": "세일", "topicEn": "Sale", "type": "과거 경험", "badge": "39 과거 경험", "enQ": "That's the end of the situation. Think back to a time you purchased something. What did you buy, and what happened with it? How did you manage the situation? Walk me through the steps you took to solve the problem.", "enA": "Oh, this reminds me of a monitor I bought during a year-end sale. It was half price, so I ordered it the night the sale opened.\n\nThe problem was the box. It came badly dented on one corner, and the driver had already left. I opened it anyway, plugged it in, and there it was — a bright patch of light bleeding out of that corner. My heart sank, because sale items usually mean no returns.\n\nSo here's what I did. I took photos of the box and the screen and filed a claim on the seller's page that night. They said it was the courier's fault, but I pointed out the damage was visible before I opened it. In the end they sent a replacement first and collected the old one. Since then, I open every box while the driver is still there.", "koQ": "무언가를 구매했던 때를 떠올려 보세요. 무엇을 샀고 그것과 무슨 일이 있었나요? 그 상황을 어떻게 해결했는지 절차를 하나씩 설명해 주세요.", "koA": "아, 연말 세일 때 샀던 모니터가 생각나네요. 반값이길래 세일이 열리는 날 밤에 바로 주문했어요.\n\n문제는 박스였어요. 한쪽 모서리가 심하게 찌그러진 채로 왔는데, 기사님은 이미 가신 뒤였죠. 그래도 열어서 전원을 켜 봤더니, 바로 그 모서리에서 빛이 밝게 새어 나오는 거예요. 마음이 내려앉았어요. 세일 상품은 보통 반품이 안 되니까요.\n\n그래서 이렇게 했어요. 박스랑 화면을 사진으로 찍어 두고 그날 밤에 판매처 페이지에 클레임을 접수했어요. 택배사 과실이라고 하시길래, 개봉 전부터 보이던 손상이라고 짚어 드렸죠. 결국 새 제품을 먼저 보내 주고 기존 것을 회수해 갔어요. 그 후로는 기사님이 계실 때 박스를 열어 봐요.", "struct": [["1️⃣ 도입", "연말 세일 · 반값 모니터 주문"], ["2️⃣ 사건", "찌그러진 박스 · 화면 빛 번짐"], ["3️⃣ 감정", "세일 상품 반품 불가 걱정"], ["4️⃣ 해결", "사진 → 클레임 접수 → 근거 반박"], ["5️⃣ 마무리", "선교환 + 기사님 앞 개봉 습관"]], "scoring": [["절차로 답하기", "문제가 steps you took을 물어요. 사진 → 접수 → 반박 → 선교환, 네 단계를 순서대로 말하면 그대로 정답이 됩니다 ✅"], ["무엇을 샀는지", "What did you buy도 질문의 일부예요. 연말 세일에 반값으로 산 모니터라고 첫 문장에서 못 박아야 요구를 빠뜨리지 않습니다 💳"], ["근거로 반박하기", "택배사 과실이라는 답에 개봉 전부터 보였다고 되받는 장면이 이 이야기의 절정이에요 🧩 해결을 운이 아니라 내 행동으로 만들어 줍니다"], ["행동으로 닫기", "기사님이 계실 때 박스를 연다는 마무리가 이야기를 지금의 습관으로 이어 줘요 ⏰ 다시는 그러지 않겠다는 다짐보다 행동 하나가 훨씬 세게 들립니다"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["a year-end sale", "연말 세일", "구매 시점을 특정하는 명사 💳"], ["half price", "반값", "세일 폭을 말하는 기본 표현 ✨"], ["badly dented", "심하게 찌그러진", "포장 파손 묘사 형용사 📏"], ["a bright patch of light", "밝게 새어 나오는 빛", "화면 하자를 그리는 표현 🔑"], ["My heart sank.", "마음이 내려앉았어요.", "영화 편 heart dropped의 짝꿍 🔁 😆"], ["no returns", "반품 불가", "세일 상품의 함정 표현 💳"], ["file a claim", "클레임을 접수하다", "해결 절차의 핵심 동사 ✅"], ["the courier's fault", "택배사 과실", "책임 공방을 한 마디로 🧩"], ["send a replacement first", "새 제품을 먼저 보내 주다", "가장 좋은 결말을 알리는 표현 🔥"], ["while the driver is still there", "기사님이 계실 때", "습관 마무리의 행동 ⏰"]], "audio": "audio/3_롤플레이/3-039 13. 세일(Sale)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-039 13. 세일(Sale)_과거 경험.mp3"}, {"id": "3-040", "cat": "roleplay", "catName": "롤플레이 질문", "num": 14, "topic": "가구", "topicEn": "Furniture", "type": "정보 요청", "badge": "40 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are looking to buy some new furniture. Call a furniture store, tell the salesperson what you have in mind, and ask three or four questions about the pieces you want.", "enA": "Hi, is this the furniture store on the main road? I'm in the market for a two-seater sofa for my living room, and I'd like to ask a few things before I come by.\n\nFirst, what do you have in stock in fabric rather than leather? ... You do? Good. My living room is small, so it has to be under a hundred and sixty centimeters wide. Do you carry that size? ... A few models? Great.\n\nSecond, is delivery included, and would you take the old one away? ... For a small fee? That's fine. And one last thing — how long is the wait if I order today? ... Two weeks? That works for me. I'll come by on Saturday and sit on a few. Thanks for your help!", "koQ": "새 가구를 사려고 합니다. 가구점에 전화해 어떤 가구를 찾는지 점원에게 설명하고, 원하는 가구에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 큰길에 있는 가구점 맞나요? 거실에 놓을 2인용 소파를 알아보고 있는데, 방문하기 전에 몇 가지만 여쭤보려고요.\n\n우선, 가죽 말고 패브릭으로는 어떤 재고가 있나요? ... 있다고요? 좋네요. 저희 거실이 좁아서 폭이 160센티 미만이어야 하거든요. 그 정도 사이즈도 취급하시나요? ... 몇 가지 있다고요? 잘됐네요.\n\n두 번째로, 배송은 포함인가요? 그리고 쓰던 소파도 가져가 주시나요? ... 약간의 비용이 든다고요? 그 정도는 괜찮아요. 마지막으로 하나만, 오늘 주문하면 얼마나 기다려야 하나요? ... 2주요? 저한테 괜찮네요. 토요일에 가서 몇 개 앉아 볼게요. 감사합니다!", "struct": [["1️⃣ 인사", "가게 확인 + 원하는 가구 선언"], ["2️⃣ 질문", "① 패브릭 재고 → 크기 조건"], ["3️⃣ 질문", "② 배송 포함 여부"], ["4️⃣ 질문", "③ 쓰던 소파 수거"], ["5️⃣ 마무리", "④ 대기 기간 + 방문 예고"]], "scoring": [["원하는 걸 먼저", "문제가 무엇을 염두에 뒀는지 점원에게 말하라고 했어요. 2인용 패브릭 소파라고 첫 문장에서 못 박으면 조건을 놓치지 않습니다 ✅"], ["숫자로 조건 걸기", "160센티 미만이라는 숫자 하나가 거실이 좁다는 말보다 훨씬 구체적이에요 📏 가구·가전 롤플레이에서 점수를 버는 가장 쉬운 방법입니다"], ["가구만의 질문", "배송 포함 여부와 기존 가구 수거는 가구점에서만 나오는 질문이에요 🏠 주제에 딱 맞는 질문을 넣어야 준비된 답변으로 들립니다"], ["방문 예고 마무리", "토요일에 앉아 보러 가겠다는 마무리가 통화를 다음 행동으로 이어 줘요 😊 감사 인사만 하고 끊는 것보다 한 수 위입니다"]], "expr": [["be in the market for ~", "~을 사려고 알아보다", "구매 의사를 밝히는 고급 표현 🔑"], ["a two-seater sofa", "2인용 소파", "원하는 물건을 특정하는 명사 ✨"], ["What do you have in stock?", "어떤 재고가 있나요?", "가구점 문의 1번 질문 🏠"], ["fabric rather than leather", "가죽 말고 패브릭으로", "조건을 좁히는 대비 표현 📏"], ["under a hundred and sixty centimeters", "160센티 미만으로", "숫자로 조건을 못 박기 📏"], ["Is delivery included?", "배송은 포함인가요?", "배송 질문 기본형 ⏰"], ["take the old one away", "쓰던 것을 수거해 가다", "가구 구매 필수 질문 ✅"], ["for a small fee", "약간의 비용으로", "조건부 승낙을 받는 표현 💳"], ["How long is the wait?", "얼마나 기다려야 하나요?", "대기 기간 질문 기본형 ⏰"], ["That works for me.", "저한테 괜찮네요.", "롤플레이 영화 편 재활용 🔁 ✅"], ["sit on a few", "몇 개 앉아 보다", "매장 방문을 예고하는 마무리 😊"]], "audio": "audio/3_롤플레이/3-040 14. 가구(Furniture)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-040 14. 가구(Furniture)_정보 요청.mp3"}, {"id": "3-041", "cat": "roleplay", "catName": "롤플레이 질문", "num": 14, "topic": "가구", "topicEn": "Furniture", "type": "문제 해결", "badge": "41 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. There is a problem with the furniture you ordered. It has just arrived, but it is not the item you purchased. Call the store, describe the mix-up, and offer two or three ways to resolve it.", "enA": "Hello, I'm calling about a delivery that just arrived. Last Tuesday I ordered a five-tier walnut bookshelf — the order number ends in 407. What the driver brought is a white three-tier one, and it's still in the box, unopened.\n\nI'm guessing the labels got mixed up at the warehouse. Here's what I'd suggest. First, could you send the right one and pick this one up at the same time? That way I only have to wait at home once.\n\nIf the walnut one is out of stock, please tell me today, because I'd rather cancel and get a refund than wait a month. And if it's only delayed, could you take something off the price for the trouble? Just let me know — my books are sitting on the floor right now.", "koQ": "주문한 가구가 방금 도착했는데, 구매한 물건이 아닙니다. 매장에 전화해 무엇이 잘못되었는지 설명하고, 해결할 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 방금 도착한 배송 건으로 전화드렸어요. 지난주 화요일에 5단 월넛 책장을 주문했는데요, 주문번호 끝자리가 407이에요. 그런데 기사님이 가져다주신 건 3단 화이트 책장이에요. 아직 박스도 안 뜯고 그대로 두었고요.\n\n아마 창고에서 라벨이 뒤바뀐 것 같은데요. 이렇게 하면 어떨까요. 우선, 제대로 된 걸 보내 주시면서 이건 그때 같이 가져가 주실 수 있을까요? 그러면 제가 집에서 한 번만 기다리면 되니까요.\n\n월넛이 재고가 없다면 오늘 안에 알려 주세요. 한 달을 기다리느니 취소하고 환불받는 편이 나을 것 같아서요. 그리고 단순히 늦어지는 거라면, 번거롭게 된 만큼 값을 조금 빼 주실 수 있을까요? 알려만 주세요. 지금 책들이 다 바닥에 놓여 있거든요.", "struct": [["1️⃣ 확인", "주문 내역 + 도착한 물건 대조"], ["2️⃣ 추정", "창고에서 라벨이 뒤바뀜"], ["3️⃣ 요구", "① 교환 + 동시 회수"], ["4️⃣ 대안", "② 재고 없으면 취소·환불"], ["5️⃣ 마무리", "③ 지연 시 가격 조정 + 기한"]], "scoring": [["대조해서 말하기", "주문한 것과 온 것을 나란히 놓고 말하면 문제가 한 번에 전달돼요 📏 5단 월넛과 3단 화이트처럼 차이를 구체적으로 찍어 주세요"], ["미개봉 강조", "박스를 뜯지 않았다는 한 줄이 교환 요구의 가장 강한 무기예요 ✅ 상대가 거절할 구실을 미리 없애 두는 장치입니다"], ["상대 편의 넣기", "가져다주면서 같이 가져가 달라는 제안은 나도 상대도 편해요 ⏰ 내 요구에 상대의 이득을 얹으면 받아들여질 확률이 올라갑니다"], ["기한 요구하기", "오늘 안에 알려 달라고 기한을 못 박아야 대안이 흐지부지되지 않아요 💳 롤플레이 헬스장 편에서도 같은 기법을 썼습니다 🔁"]], "expr": [["a five-tier walnut bookshelf", "5단 월넛 책장", "돌발 가구 편 walnut 재활용 🔁 ✨"], ["the order number ends in ~", "주문번호 끝자리가 ~", "근거를 제시하는 실전 표현 📏"], ["in the box, unopened", "박스째 미개봉으로", "교환 자격을 미리 확보 ✅"], ["the labels got mixed up", "라벨이 뒤바뀌다", "롤플레이 음식 편 재활용 🔁 🧩"], ["Here's what I'd suggest", "이렇게 하면 어떨까요", "대안 나열 직전의 신호탄 🔁 🔑"], ["pick up at the same time", "그때 같이 회수하다", "한 번에 처리하자는 제안 ⏰"], ["out of stock", "재고가 없는", "in stock의 반대말 세트 🔑"], ["cancel and get a refund", "취소하고 환불받다", "두 번째 대안 필수 표현 💳"], ["take something off the price", "값을 조금 빼 주다", "보상 요구의 구어체 표현 💳"], ["Just let me know", "알려만 주세요", "선택권을 넘기는 마무리 🔁 ✅"], ["sitting on the floor", "바닥에 놓여 있는", "급한 이유를 그림으로 보여 주기 📏"]], "audio": "audio/3_롤플레이/3-041 14. 가구(Furniture)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-041 14. 가구(Furniture)_문제 해결.mp3"}, {"id": "3-042", "cat": "roleplay", "catName": "롤플레이 질문", "num": 14, "topic": "가구", "topicEn": "Furniture", "type": "과거 경험", "badge": "42 과거 경험", "enQ": "That's the end of the situation. Have you ever had trouble with something you purchased for your home? What was wrong with it, and how did you sort it out? Give me as many details as you can.", "enA": "Oh, this reminds me of the robot vacuum I bought last spring. I'd saved up for it, and I had this picture in my head of coming home every day to a spotless floor.\n\nReality hit fast. On day one it got tangled in the fringe of my rug and stopped. Then it couldn't get over the threshold into the bedroom, so it just bumped into it. And at three in the morning it started beeping in the hallway, out of battery. I was ready to return it.\n\nBut before I did, I called the store. The staff member told me I'd never turned on the no-go zone setting, and that they'd send me a small ramp for the threshold free of charge. Both were sorted in three days, and it's been quiet since. Since then, I always call before I hit the return button.", "koQ": "집을 위해 산 물건에 문제가 있었던 적이 있나요? 무엇이 문제였고 어떻게 해결했는지 최대한 자세히 말해주세요.", "koA": "아, 작년 봄에 산 로봇청소기가 생각나네요. 돈을 모아서 산 거였고, 매일 집에 오면 바닥이 티 없이 깨끗할 거라는 그림을 머릿속에 그리고 있었죠.\n\n그런데 현실은 금방 왔어요. 첫날부터 러그 술에 감겨서 멈춰 버렸고요. 그다음엔 침실 문턱을 못 넘고 부딪히기만 했고요. 새벽 3시에는 복도에서 배터리가 다 됐다고 삑삑거리기 시작했어요. 반품할 마음까지 먹었어요.\n\n그런데 그러기 전에 매장에 전화를 해 봤어요. 직원분이 제가 진입 금지 구역 설정을 한 번도 안 켰다고 알려 주셨고, 문턱용 작은 경사판도 무료로 보내 주시겠다고 했어요. 사흘 만에 둘 다 해결됐고, 그 뒤로는 조용해요. 그 후로는 반품 버튼을 누르기 전에 꼭 전화부터 해요.", "struct": [["1️⃣ 도입", "돈 모아 산 로봇청소기 · 기대"], ["2️⃣ 사건", "러그에 감김 · 문턱 못 넘음"], ["3️⃣ 절정", "새벽 3시 배터리 경고음"], ["4️⃣ 해결", "매장 전화 → 설정 + 경사판"], ["5️⃣ 마무리", "반품 전에 전화하는 나만의 규칙"]], "scoring": [["무엇이 문제였나", "What was wrong with it을 묻고 있어요. 러그·문턱·새벽 경고음처럼 문제를 세 개로 나누면 답이 저절로 길어집니다 📏"], ["기대와 현실", "티 없는 바닥을 상상했다는 도입이 있어야 Reality hit fast가 살아나요 🎭 기대를 먼저 깔고 무너뜨리는 것이 경험담의 기본 골격입니다"], ["반전 해결", "반품하려다 전화 한 통으로 해결됐다는 반전이 이야기를 기억에 남게 만들어요 😆 사건이 크게 번지지 않아도 충분히 좋은 경험담이 됩니다"], ["규칙으로 닫기", "반품 버튼을 누르기 전에 먼저 전화한다는 마무리가 나만의 규칙이 돼요 ✅ 롤플레이 과거경험 유형은 이 한 줄로 마감하면 안정적입니다"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["save up for ~", "~을 위해 돈을 모으다", "서베이 콘서트 편 재활용 🔁 💳"], ["a spotless floor", "티 없이 깨끗한 바닥", "기대를 그리는 명사구 ✨"], ["Reality hit fast.", "현실은 금방 왔어요.", "롤플레이 여가 편 재활용 🔁 🎭"], ["get tangled in ~", "~에 감기다", "사고 장면의 핵심 동사 🧩"], ["get over the threshold", "문턱을 넘다", "문제를 구체화하는 표현 📏"], ["out of battery", "배터리가 다 된", "롤플레이 MP3 편 재활용 🔁 🔋"], ["be ready to return it", "반품할 마음을 먹다", "감정의 정점을 행동으로 💪"], ["the no-go zone setting", "진입 금지 구역 설정", "해결의 열쇠가 된 명사 🔑"], ["free of charge", "무료로", "좋은 결말을 알리는 표현 ✅"], ["hit the return button", "반품 버튼을 누르다", "교훈 마무리의 행동 동사 😊"]], "audio": "audio/3_롤플레이/3-042 14. 가구(Furniture)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-042 14. 가구(Furniture)_과거 경험.mp3"}, {"id": "3-043", "cat": "roleplay", "catName": "롤플레이 질문", "num": 15, "topic": "거주지·집", "topicEn": "Home", "type": "정보 요청", "badge": "43 정보 요청", "enQ": "I would like to give you a situation and ask you to act it out. A family member has asked for your help in getting a party ready. Call that person and have a brief conversation, asking three or four questions about the party.", "enA": "Hey Mom, it's me. I got your message about the family dinner — count me in, of course. But before I just show up, let me get the details straight, so I don't bring the wrong thing again. Do you have a minute?\n\nFirst, when exactly is it, and what time should I be there? ... Saturday at five? Got it. And how many are we expecting? ... Twelve? That's more than last year.\n\nSecond, what do you want me to handle? I can do the shopping on my way over, or cook one dish — my kimchi fried rice, if you want something easy. ... Both? Of course. And one last thing — should I bring extra chairs? We were short last time and Uncle ended up on the sofa. ... I'll bring four, then. See you Saturday!", "koQ": "가족 중 한 명이 파티 준비를 도와달라고 부탁했습니다. 그 가족에게 전화해 파티에 대해 3~4가지 질문을 하며 짧은 대화를 나눠보세요.", "koA": "엄마, 나야. 가족 저녁 모임 얘기 문자 봤어. 나야 당연히 가지. 근데 그냥 가기 전에 몇 가지만 확실히 해 두려고. 또 엉뚱한 거 사 가면 안 되니까. 잠깐 통화 괜찮아?\n\n우선, 정확히 언제야? 그리고 몇 시까지 가면 돼? ... 토요일 5시? 알겠어. 그리고 몇 명이나 오는 거야? ... 열두 명? 작년보다 많네.\n\n두 번째로, 내가 뭘 맡으면 좋을까? 가는 길에 장을 봐 가도 되고, 아니면 한 가지 요리를 해 가도 돼. 간단한 게 좋으면 내 김치볶음밥으로 하고. ... 둘 다? 그래, 알았어. 마지막으로 하나만, 의자 좀 더 가져갈까? 지난번에 모자라서 삼촌이 소파에 앉으셨잖아. ... 그럼 네 개 가져갈게. 토요일에 봐!", "struct": [["1️⃣ 인사", "부탁 수락 + 질문 예고"], ["2️⃣ 질문", "① 날짜·시간 확인"], ["3️⃣ 질문", "② 참석 인원 확인"], ["4️⃣ 질문", "③ 내가 맡을 역할"], ["5️⃣ 마무리", "④ 의자 준비 + 약속 확정"]], "scoring": [["가족이라 반말", "상대가 가족이라 Hey Mom, it’s me처럼 편한 말투가 자연스러워요 💬 가게에 거는 전화와 톤을 구분하는 것도 채점 요소입니다"], ["질문 네 칸", "시간 · 인원 · 내 역할 · 준비물. 파티 준비 질문은 이 네 칸으로 나누면 3~4개 요구가 저절로 채워지고 순서도 헷갈리지 않아요 📏"], ["내가 먼저 제안", "뭘 할까 묻지만 말고 장보기와 요리 중에 고르라고 두 개를 제시하세요 ✅ 도움을 주는 쪽이 선택지를 주면 대화가 훨씬 매끄러워집니다"], ["지난번 언급하기", "지난번에 의자가 모자랐다는 한 줄이 나를 진짜 그 집안 사람처럼 만들어 줘요 🏠 경험 한 스푼이 롤플레이를 연기에서 대화로 바꿉니다"]], "expr": [["Count me in.", "나도 갈게.", "초대 수락 1순위, 공원·공연 편 재활용 🔁 🔥"], ["let me get the details straight", "세부 사항을 확실히 해 두다", "질문을 예고하는 고급 표현 🔑"], ["When exactly is it?", "정확히 언제야?", "일정 질문에 exactly 한 스푼 ⏰"], ["How many are we expecting?", "몇 명이나 오는 거야?", "인원 질문 기본형 🏠"], ["What do you want me to handle?", "내가 뭘 맡으면 돼?", "역할 분담 질문의 정답 문형 ✅"], ["do the shopping", "장을 보다", "집안일 어휘, 돌발 집안일 편 연결 🔁"], ["cook one dish", "요리 한 가지를 하다", "분담을 구체화하는 표현 🍳"], ["kimchi fried rice", "김치볶음밥", "서베이 요리 편 재활용 🔁 🍳"], ["extra chairs", "여분의 의자", "집 모임 준비의 현실 디테일 🏠"], ["be short", "모자라다", "부족을 말하는 짧은 형용사 📏"], ["See you Saturday!", "토요일에 봐!", "약속 확정형 종료 시그널 🔁 ✅"]], "audio": "audio/3_롤플레이/3-043 15. 거주지·집(Home)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-043 15. 거주지·집(Home)_정보 요청.mp3"}, {"id": "3-044", "cat": "roleplay", "catName": "롤플레이 질문", "num": 15, "topic": "거주지·집", "topicEn": "Home", "type": "문제 해결", "badge": "44 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You planned to have guests over for dinner at your place, but your kitchen plumbing has suddenly broken down. Call your guests, describe the situation, and offer two or three other ideas for where or how to eat together.", "enA": "Hey, it's me. I've got some bad news about tonight. The kitchen sink backed up this afternoon — there's water all over the floor, and the plumber can't come until tomorrow morning. So cooking at my place is out.\n\nHere's what I'm thinking. First, come over anyway and we'll order in. The kitchen is the only room that's a mess, and we can eat in the living room like always.\n\nIf that sounds grim, let's move it to the kimchi stew place in my alley — five minutes away, they know me, and dinner is on me for the trouble. Or we push it to next Friday and I'll cook properly. Whichever works for everyone — just let me know by four.", "koQ": "집에서 저녁 식사 모임을 열려고 했는데 주방 배관에 갑자기 문제가 생겼습니다. 손님들에게 전화해 상황을 설명하고, 어디서 어떻게 함께 식사할지 2~3가지 대안을 제안해 보세요.", "koA": "안녕, 나야. 오늘 저녁 일로 안 좋은 소식이 있어. 오후에 주방 싱크대가 막혀 버렸어. 바닥이 온통 물바다고, 설비 기사님은 내일 아침에나 오실 수 있대. 그래서 우리 집에서 요리하는 건 어렵게 됐어.\n\n내 생각은 이래. 우선, 그냥 와도 돼. 대신 시켜 먹자. 엉망인 건 주방뿐이고, 거실에서 늘 하던 대로 먹으면 되니까.\n\n그게 별로면, 우리 골목에 있는 김치찌개집으로 옮기자. 걸어서 5분이고, 사장님이 나를 잘 아셔. 그리고 번거롭게 한 값으로 저녁은 내가 살게. 아니면 다음 주 금요일로 미루고 그때 제대로 요리해 줄게. 다들 편한 쪽으로 하자. 네 시까지만 알려 줘.", "struct": [["1️⃣ 통보", "오늘 저녁 계획 변경 알림"], ["2️⃣ 상황", "싱크대 막힘 · 내일 아침 수리"], ["3️⃣ 대안", "① 그대로 와서 배달 음식"], ["4️⃣ 대안", "② 골목 김치찌개집으로 이동"], ["5️⃣ 마무리", "③ 다음 주로 연기 + 기한"]], "scoring": [["망한 범위 한정", "엉망인 건 주방뿐이라는 한 줄이 그냥 와도 된다는 첫 대안을 살려 줘요 😊 피해를 부풀려 말하면 대안 세 개가 한꺼번에 무너집니다"], ["세 대안의 결", "집에서 배달 · 밖에서 식사 · 다음 주로 연기. 장소와 시점을 각각 다르게 두면 2~3가지 요구가 확실히 채워집니다 ✅"], ["보상 한 줄", "번거롭게 한 값으로 저녁을 사겠다는 한 줄이 미안함을 행동으로 바꿔 줘요 💳 사과만 반복하는 답변보다 훨씬 셉니다"], ["기한 못 박기", "네 시까지 알려 달라고 해야 여러 명에게 거는 전화가 정리돼요 ⏰ 손님이 여럿인 상황에서는 마감 시각이 특히 중요합니다"]], "expr": [["I've got some bad news", "안 좋은 소식이 있어", "문제해결 오프닝 1순위 🔁 💬"], ["back up (sink)", "(배수구가) 막히다", "배관 문제 묘사의 정답 동사 🔑"], ["all over the floor", "바닥 온통", "피해 범위를 그리는 표현 📏"], ["~ is out", "~은 어렵게 됐어", "불가능을 캐주얼하게 선언 ✨"], ["Here's what I'm thinking", "내 생각은 이래", "대안 나열 직전의 신호탄 🔁 🔑"], ["order in", "집으로 시켜 먹다", "eat out의 반대말 세트 🍳"], ["the only room that’s a mess", "엉망인 건 그 방뿐", "피해를 축소해 안심시키는 기술 😊"], ["move it to ~", "~로 옮기다", "장소 변경 제안 필수 동사 🏠"], ["dinner is on me", "저녁은 내가 살게", "롤플레이 MP3 편 재활용 🔁 💳"], ["push it to ~", "~로 미루다", "일정 연기 제안 구동사 ⏰"], ["Whichever works for everyone", "다들 편한 쪽으로", "롤플레이 문제해결 공통 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-044 15. 거주지·집(Home)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-044 15. 거주지·집(Home)_문제 해결.mp3"}, {"id": "3-045", "cat": "roleplay", "catName": "롤플레이 질문", "num": 15, "topic": "거주지·집", "topicEn": "Home", "type": "과거 경험", "badge": "45 과거 경험", "enQ": "That's the end of the situation. Have you ever purchased new furniture and regretted it once you got it home? What was the problem with it, and how did you handle things? Share everything you remember about the situation.", "enA": "Oh, this reminds me of a dining table I bought two years ago. I saw it in a photo — solid oak, six seats — and I ordered it without measuring anything. That was my first mistake.\n\nIt arrived, the delivery guys set it up, and the room just shrank. With the chairs pulled out, the fridge door wouldn't open all the way, and I had to turn sideways to get past it. I stood there thinking, what have I done.\n\nSending it back would have cost me eighty thousand won and two weeks, so I fixed it another way. I swapped the chairs for a bench on one side and pushed the table against the wall, and suddenly the room could breathe again. Since then, I tape the outline on the floor before I buy anything big.", "koQ": "새 가구를 샀는데 집에 가져온 후 후회한 적이 있나요? 무엇이 문제였고, 그 상황을 어떻게 해결했는지 기억나는 모든 것을 말해주세요.", "koA": "아, 2년 전에 산 식탁이 생각나네요. 사진으로 보고 반했거든요. 원목에 6인용이었어요. 그런데 치수는 하나도 안 재고 그냥 주문해 버렸죠. 그게 첫 번째 실수였어요.\n\n배송이 와서 기사님들이 설치해 주셨는데, 방이 그냥 확 줄어든 느낌이었어요. 의자를 빼면 냉장고 문이 끝까지 열리지 않았고, 옆으로 서서 지나가야 했어요. 그 자리에 서서 생각했죠. 내가 무슨 짓을 한 거지.\n\n반품하면 8만 원에 2주가 걸린다고 해서, 다른 방법으로 해결했어요. 한쪽 의자를 벤치로 바꾸고 식탁을 벽에 붙였더니, 갑자기 방이 다시 숨을 쉬더라고요. 그 후로는 큰 걸 사기 전에 바닥에 테이프로 크기를 그려 봐요.", "struct": [["1️⃣ 도입", "사진만 보고 산 6인용 원목 식탁"], ["2️⃣ 실수", "치수를 재지 않고 주문"], ["3️⃣ 사건", "냉장고 문 · 옆으로 지나가기"], ["4️⃣ 해결", "벤치로 교체 + 벽에 붙이기"], ["5️⃣ 마무리", "바닥에 테이프로 크기 그리는 습관"]], "scoring": [["후회의 원인부터", "치수를 안 쟀다는 한 줄이 이야기 전체의 원인이에요 📏 무엇이 문제였냐는 질문에 사실은 이 문장 하나로 답이 끝납니다"], ["디테일 하나", "냉장고 문이 끝까지 안 열렸다는 장면 하나가 좁다는 형용사 열 개보다 강해요 🏠 방이 작았다로 끝내면 채점자 머릿속에 아무 그림도 남지 않습니다"], ["반품 말고 해결", "돈과 시간을 따져 보고 다른 길을 찾았다는 전개가 how did you handle things의 정확한 답이에요 ✅"], ["재활용 주의", "서베이 집 편의 회색 소파는 인생 최고의 지출이었으니 후회 소재로 쓰면 안 돼요 🔁 시리즈 전체에서 캐릭터가 모순되지 않게 관리하세요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["solid oak", "원목 참나무", "가구 재질을 말하는 어휘 ✨"], ["without measuring anything", "치수를 하나도 안 재고", "후회의 원인을 한 구절로 📏"], ["my first mistake", "첫 번째 실수", "복선을 까는 문장, 헬스장 편과 같은 기법 🔁 🎭"], ["the room shrank", "방이 줄어든 느낌", "체감을 동사 하나로 그리기 🏠"], ["the fridge door wouldn't open", "냉장고 문이 안 열렸다", "문제를 증명하는 결정적 디테일 🔑"], ["turn sideways", "옆으로 서서 지나가다", "좁음을 몸으로 보여 주는 동사 😆"], ["fix it another way", "다른 방법으로 해결하다", "반품 대신 택한 길 ✅"], ["swap A for B", "A를 B로 바꾸다", "롤플레이 영화 편 재활용 🔁"], ["against the wall", "벽에 붙여서", "배치 변경을 말하는 전치사구 📏"], ["tape the outline on the floor", "바닥에 테이프로 크기를 그리다", "습관 마무리의 구체적 행동 ⏰"]], "audio": "audio/3_롤플레이/3-045 15. 거주지·집(Home)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-045 15. 거주지·집(Home)_과거 경험.mp3"}, {"id": "3-046", "cat": "roleplay", "catName": "롤플레이 질문", "num": 16, "topic": "여행", "topicEn": "Travel", "type": "정보 요청", "badge": "46 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You and your friend are planning to take a trip together. Call a travel agency and ask three or four questions about the trip you have in mind.", "enA": "Hi, is this the travel agency near the station? A friend and I are planning a three-day trip to Jeju next month, and we'd like to go through an agency this time. Can I ask a few questions?\n\nFirst, what packages do you have for early May? ... Flight and hotel together? That's exactly what we want. And what's the price range per person? ... Around four hundred thousand won? That's within our budget.\n\nSecond, is a rental car included, or do we book that ourselves? ... Optional? We'll take it — we want to drive around the coast. And one last thing — how late can we cancel without a fee? ... Two weeks before? Good to know. We'll come in this weekend to sign. Thank you!", "koQ": "친구와 함께 여행을 계획하고 있습니다. 여행사에 전화해 생각하고 있는 여행에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 근처에 있는 여행사 맞나요? 친구랑 다음 달에 제주도로 2박 3일 여행을 가려고 하는데, 이번에는 여행사를 통해서 가 보려고요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 5월 초로 어떤 패키지가 있나요? ... 항공과 숙소가 함께요? 저희가 원하던 게 딱 그거예요. 그리고 1인당 가격대는 어떻게 되나요? ... 40만 원 정도요? 저희 예산 안에 들어오네요.\n\n두 번째로, 렌터카도 포함인가요, 아니면 따로 예약해야 하나요? ... 선택 사항이요? 그럼 넣을게요. 해안도로를 좀 달려 보고 싶거든요. 마지막으로 하나만, 수수료 없이 언제까지 취소할 수 있나요? ... 2주 전까지요? 알아 둘게요. 이번 주말에 가서 계약할게요. 감사합니다!", "struct": [["1️⃣ 인사", "여행사 확인 + 여행 계획 설명"], ["2️⃣ 질문", "① 패키지 구성 → 가격대"], ["3️⃣ 질문", "② 렌터카 포함 여부"], ["4️⃣ 질문", "③ 취소 가능 시점"], ["5️⃣ 마무리", "방문 예고 + 감사 인사"]], "scoring": [["여행부터 특정", "문제가 생각 중인 여행에 대해 물으라고 했어요. 제주 2박 3일, 다음 달, 둘이라고 먼저 못 박아야 질문이 구체적으로 나옵니다 ✅"], ["돈 이야기 포함", "가격대를 묻고 예산 안이라고 반응하는 흐름은 여행사 통화에서 가장 현실적인 대목이에요 💳 숫자가 오가면 대화가 진짜처럼 들립니다"], ["여행만의 질문", "렌터카 포함 여부와 취소 마감은 여행사에서만 나오는 질문이에요 ✈️ 주제에 딱 맞는 질문 하나가 준비된 답변을 증명합니다"], ["방문 예고 마무리", "주말에 가서 계약하겠다는 마무리가 통화를 다음 행동으로 이어 줘요 🔁 감사 인사로만 끝내는 것보다 한 수 위인, 가구 편에서도 쓴 마감 기법입니다"]], "expr": [["A friend and I are planning ~", "친구와 저는 ~을 계획 중이에요", "동행을 밝히는 오프닝 🔑"], ["a three-day trip", "2박 3일 여행", "여행 기간을 부르는 정답 표현 🗺️"], ["go through an agency", "여행사를 통해 가다", "이번 상황을 규정하는 구문 ✨"], ["What packages do you have?", "어떤 패키지가 있나요?", "여행사 문의 1번 질문 ✈️"], ["flight and hotel together", "항공과 숙소가 함께", "패키지 구성을 말하는 표현 🗺️"], ["What's the price range?", "가격대가 어떻게 되나요?", "롤플레이 음식·음악 편 재활용 🔁 💳"], ["That's within our budget.", "저희 예산 안에 들어오네요.", "가격에 쓰는 긍정 리액션 ✅"], ["Is ~ included?", "~도 포함인가요?", "롤플레이 가구 편 재활용 🔁 📏"], ["optional", "선택 사항인", "포함 여부 답변의 핵심 형용사 🔑"], ["How late can we cancel?", "언제까지 취소할 수 있나요?", "실전형 마지막 질문 ⏰"], ["Good to know.", "알아 둘게요.", "정보를 받는 짧은 리액션 🔁 💬"]], "audio": "audio/3_롤플레이/3-046 16. 여행(Travel)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-046 16. 여행(Travel)_정보 요청.mp3"}, {"id": "3-047", "cat": "roleplay", "catName": "롤플레이 질문", "num": 16, "topic": "여행", "topicEn": "Travel", "type": "문제 해결", "badge": "47 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. The travel agency has contacted you to say that the trip you wanted is no longer available. Call your friend, leave a message describing the situation, and offer two or three ideas to deal with the problem.", "enA": "Hey, it's me. I know you're in a meeting, so I'll just leave this on your voicemail. The agency called an hour ago — the Jeju package is off. Their partner hotel overbooked, and there's nothing left for that weekend.\n\nDon't panic — I've already looked into a few things. First, they have the same package a week later, same price, and our flights would just shift. If you can move your days off, that's the easiest fix.\n\nSecond, if that weekend is fixed for you, they offered Busan instead — cheaper, and we'd take the KTX. Or, worst case, we cancel and get a full refund and plan it properly for the autumn. Have a think and call me back tonight — I'll be up.", "koQ": "여행사에서 원하던 여행이 불가능하다고 연락했습니다. 친구에게 전화해 메시지를 남기고, 상황을 설명한 뒤 문제를 해결할 2~3가지 방안을 제안해 보세요.", "koA": "안녕, 나야. 너 지금 회의 중인 거 아니까 음성 메시지로 남겨 둘게. 한 시간쯤 전에 여행사에서 전화가 왔는데, 제주 패키지가 취소됐대. 제휴 호텔에서 초과 예약이 나서 그 주말에는 남은 방이 없다더라고.\n\n당황하지 마. 내가 이미 몇 가지 알아봤어. 우선, 일주일 뒤에 같은 패키지가 있대. 가격도 같고, 항공편만 그만큼 밀리는 거야. 네가 휴가를 옮길 수 있으면 이게 제일 간단해.\n\n두 번째로, 그 주말이 꼭 고정이어야 한다면 대신 부산을 제안하더라. 더 저렴하고, KTX로 가면 되고. 아니면 최악의 경우에는 취소하고 전액 환불받은 다음, 가을에 제대로 계획하자. 생각해 보고 오늘 밤에 전화 줘. 나 안 자고 있을게.", "struct": [["1️⃣ 메시지", "음성 메시지임을 밝히기"], ["2️⃣ 상황", "패키지 취소 + 취소 사유"], ["3️⃣ 대안", "① 일주일 뒤 같은 패키지"], ["4️⃣ 대안", "② 부산으로 변경"], ["5️⃣ 마무리", "③ 전액 환불 + 회신 요청"]], "scoring": [["또 메시지 유형", "leave a message가 또 나왔어요. 세일 편과 같은 규칙이라 되묻기 리액션은 금지, 처음부터 끝까지 혼자 말합니다 🔁 🔑"], ["친구 톤으로", "가게에 남기는 메시지와 달리 상대가 친구예요. 이름을 밝히는 대신 Hey, it’s me로 시작하는 게 자연스럽습니다 💬"], ["안심 한 줄 먼저", "당황하지 마, 내가 알아봤어를 대안보다 먼저 넣으세요 😊 나쁜 소식 뒤에 바로 이 한 줄이 오면 답변의 인상이 완전히 달라집니다"], ["세 대안의 결", "날짜 변경 · 목적지 변경 · 전면 취소. 바꾸는 대상을 각각 다르게 두면 2~3가지 요구가 확실히 채워져요 ✅"]], "expr": [["leave this on your voicemail", "음성 메시지로 남기다", "메시지 유형 필수 표현 🔁 🔑"], ["I know you’re in a meeting", "너 회의 중인 거 알아", "메시지를 남기는 이유 한 줄 ⏰"], ["be off", "취소되다, 무산되다", "롤플레이 공원 편 재활용 🔁 😆"], ["overbook", "초과 예약을 받다", "숙소 문제의 정답 동사 🔑"], ["Don't panic", "당황하지 마", "상대를 안심시키는 완충 장치 😊"], ["look into ~", "~을 알아보다", "미리 준비했음을 보여 주는 동사 💪"], ["move your days off", "휴가를 옮기다", "일정 조정 제안 필수 표현 ⏰"], ["~ instead", "대신 ~으로", "대안을 얹는 가장 짧은 연결어 ✨"], ["worst case", "최악의 경우에는", "마지막 대안을 여는 표현 🔑"], ["a full refund", "전액 환불", "롤플레이 음식·영화 편 재활용 🔁 💳"], ["call me back tonight", "오늘 밤에 전화 줘", "메시지 마무리 공식 🔁 💬"]], "audio": "audio/3_롤플레이/3-047 16. 여행(Travel)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-047 16. 여행(Travel)_문제 해결.mp3"}, {"id": "3-048", "cat": "roleplay", "catName": "롤플레이 질문", "num": 16, "topic": "여행", "topicEn": "Travel", "type": "과거 경험", "badge": "48 과거 경험", "enQ": "That's the end of the situation. Think back to a time you ran into trouble while organizing a trip. What was the issue, and how did you handle it? Tell me the whole story from start to finish.", "enA": "Oh, this reminds me of my best friend's birthday last summer. We have a little tradition: every year I book a hotel for one night — a staycation — and we order far too much food.\n\nThat year I booked two months ahead and paid, with a confirmation email. But three days before, the hotel called: they had overbooked, and our room was gone. On a Saturday in August, nothing decent was left in the city — and it was supposed to be a surprise, so I couldn't even tell her.\n\nSo I pushed back. I told them my booking was confirmed and asked what they could do. They came back with a sister hotel two stations away, one grade up, same price, breakfast included. I took it in a heartbeat. She never knew until I told her that night. Since then, I always call to reconfirm a week before.", "koQ": "여행을 준비하면서 문제를 겪었던 때를 떠올려 보세요. 문제가 무엇이었고 어떻게 해결했나요? 처음부터 끝까지 이야기해 주세요.", "koA": "아, 작년 여름 절친 생일이 생각나네요. 저희한테는 작은 전통이 하나 있어요. 해마다 제가 호텔을 하루 잡아서 호캉스를 하고 음식을 잔뜩 시켜 먹거든요.\n\n그해에는 두 달 전에 예약하고 결제한 뒤 확인 메일까지 받아 뒀어요. 그런데 사흘 전에 호텔에서 전화가 왔어요. 초과 예약이 나서 저희 방이 없어졌대요. 8월 토요일이라 시내에 괜찮은 방은 하나도 없었고요. 게다가 깜짝 선물이어서 친구한테 말할 수도 없었어요.\n\n그래서 물러서지 않았어요. 예약이 확정된 건이라고 말씀드리고 어떻게 해 주실 수 있는지 물었죠. 그랬더니 두 정거장 떨어진 계열 호텔에, 한 등급 위 객실을, 같은 가격에, 조식까지 넣어 주시더라고요. 두말없이 받았죠. 친구는 그날 밤까지 전혀 몰랐고요. 그 후로는 일주일 전에 꼭 전화해서 재확인해요.", "struct": [["1️⃣ 도입", "절친 생일 호캉스 전통"], ["2️⃣ 사건", "사흘 전 초과 예약 통보"], ["3️⃣ 절정", "8월 토요일 · 깜짝 선물이라 말도 못 함"], ["4️⃣ 해결", "물러서지 않고 요구 → 계열 호텔 업그레이드"], ["5️⃣ 마무리", "일주일 전 재확인 전화 습관"]], "scoring": [["처음부터 끝까지", "문제가 from start to finish를 요구해요. 전통 → 예약 → 통보 → 요구 → 결과, 다섯 칸을 순서대로 채우면 됩니다 ✅"], ["압박 요소 추가", "8월 토요일이라 방이 없었다, 깜짝 선물이라 말도 못 했다. 압박을 두 겹으로 쌓으면 해결이 훨씬 값져 보여요 🎭"], ["요구가 해결", "가만히 기다린 게 아니라 확정 예약이라고 짚고 요구했다는 점이 핵심이에요 💪 운으로 풀린 이야기는 점수가 되지 않습니다"], ["보상은 구체적으로", "계열 호텔 · 한 등급 위 · 같은 가격 · 조식 포함. 보상을 네 개로 쪼개면 결말이 선명해져요 ✨ 잘 해결됐다로 뭉뚱그리지 마세요"]], "expr": [["This reminds me of ~", "~이 생각나네요", "과거경험 만능 오프닝 🔁 🔑"], ["a little tradition", "작은 전통", "서베이 국내여행 편 재활용 🔁 💕"], ["a staycation", "호캉스", "돌발 약속 편 재활용 🔁 🏠"], ["book two months ahead", "두 달 전에 예약하다", "준비성을 보여 주는 표현 ⏰"], ["overbook", "초과 예약을 받다", "이 이야기의 사건을 여는 동사 🔑"], ["be supposed to be a surprise", "깜짝 선물이어야 했다", "긴장을 한 단계 올리는 설정 🎭"], ["push back", "물러서지 않고 맞서다", "해결을 내 행동으로 만드는 동사 💪"], ["a sister hotel", "계열 호텔", "해결책을 구체화하는 명사 ✨"], ["one grade up", "한 등급 위로", "업그레이드를 말하는 짧은 표현 🔥"], ["in a heartbeat", "두말없이 바로", "롤플레이 여가·콘서트 편 재활용 🔁"], ["call to reconfirm", "전화해서 재확인하다", "습관 마무리의 행동 동사 ✅"]], "audio": "audio/3_롤플레이/3-048 16. 여행(Travel)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-048 16. 여행(Travel)_과거 경험.mp3"}, {"id": "3-049", "cat": "roleplay", "catName": "롤플레이 질문", "num": 17, "topic": "해외여행", "topicEn": "Overseas", "type": "정보 요청", "badge": "49 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are organizing a trip abroad and would like to learn more about the choices available. Call a travel agency and ask three or four questions to gather the information you need.", "enA": "Hi, is this the travel agency by the station? I'm planning a trip abroad next spring — Italy, if the budget allows — and I'd like to hear what my options are. Can I ask a few questions?\n\nFirst, do you do package tours for Italy, or is it mostly free travel with flights and hotels? ... Both? Good. What's the difference in price? ... About a million won? That's a lot, but I see why.\n\nSecond, is there a direct flight, or do we have to change planes? ... Thirteen hours direct? I'd rather pay for that. And one last thing — how much cheaper is the off-season? I've been saving up for two years, so timing matters. ... Twenty percent in November? Good to know. Thank you!", "koQ": "해외여행을 계획 중이고, 선택할 수 있는 옵션을 더 알아보고 싶습니다. 여행사에 전화해 필요한 정보를 얻기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 옆에 있는 여행사 맞나요? 내년 봄에 해외여행을 가려고 하는데요. 예산이 되면 이탈리아로요. 어떤 선택지가 있는지 들어 보고 싶어서 전화드렸어요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 이탈리아는 패키지 투어도 있나요, 아니면 주로 항공과 숙소만 잡는 자유여행인가요? ... 둘 다요? 좋네요. 두 방식의 가격 차이는 얼마나 되나요? ... 100만 원쯤이요? 크긴 한데 왜 그런지는 알겠어요.\n\n두 번째로, 직항이 있나요, 아니면 갈아타야 하나요? ... 직항으로 13시간이요? 저는 차라리 그 값을 내겠어요. 마지막으로 하나만, 비수기는 얼마나 더 저렴한가요? 2년째 돈을 모으고 있어서 시기가 중요하거든요. ... 11월이면 20퍼센트요? 알아 둘게요. 감사합니다!", "struct": [["1️⃣ 인사", "여행사 확인 + 해외여행 계획"], ["2️⃣ 질문", "① 패키지 vs 자유여행"], ["3️⃣ 질문", "② 두 방식의 가격 차이"], ["4️⃣ 질문", "③ 직항 여부"], ["5️⃣ 마무리", "④ 비수기 할인 + 감사 인사"]], "scoring": [["선택지 비교", "문제가 어떤 선택지가 있는지 알아보라고 했어요. 두 방식을 나란히 놓고 차이를 묻는 흐름이 이 페이지의 뼈대입니다 ✅"], ["예산을 이유로", "2년째 돈을 모았다는 한 줄이 비수기를 묻는 이유가 돼요 💳 질문마다 왜 묻는지가 붙으면 답변이 사람 이야기처럼 들립니다"], ["국내와 다른 질문", "직항 여부와 비수기 할인은 해외여행에서만 나오는 질문이에요 ✈️ 16번 국내 여행 편과 질문 소재가 겹치지 않게 골랐습니다 🔁"], ["숫자 리액션", "13시간, 20퍼센트처럼 상대가 준 숫자를 되받아 반응하면 알아들었다는 신호가 돼요 📊 정보요청 유형에서 문장 수를 버는 방법입니다"]], "expr": [["I'm planning a trip abroad", "해외여행을 계획 중이에요", "상황을 선언하는 오프닝 ✈️"], ["what my options are", "어떤 선택지가 있는지", "문제 속 표현 그대로 회수 ✅"], ["package tours", "패키지 투어", "해외여행 상담 필수 명사 🗺️"], ["free travel", "자유여행", "패키지와 대비되는 짝꿍 어휘 ✨"], ["What's the difference in price?", "가격 차이가 얼마나 되나요?", "비교 질문 기본형 💳"], ["a direct flight", "직항편", "항공 질문 1순위 명사 ✈️"], ["change planes", "비행기를 갈아타다", "경유를 말하는 동사구 🔑"], ["I'd rather pay for that", "차라리 그 값을 내겠어요", "선택을 밝히는 구문 💪"], ["the off-season", "비수기", "성수기와 짝을 이루는 어휘 📊"], ["save up", "돈을 모으다", "서베이 콘서트·롤플레이 가구 편 재활용 🔁 💳"], ["Good to know.", "알아 둘게요.", "정보를 받는 짧은 리액션 🔁 💬"]], "audio": "audio/3_롤플레이/3-049 17. 해외여행(Overseas)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-049 17. 해외여행(Overseas)_정보 요청.mp3"}, {"id": "3-050", "cat": "roleplay", "catName": "롤플레이 질문", "num": 17, "topic": "해외여행", "topicEn": "Overseas", "type": "문제 해결", "badge": "50 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You have just landed in another country, but your luggage never appeared at baggage claim. Speak with the airline staff, describe the situation, and offer two or three ways they could assist you.", "enA": "Excuse me, I need some help. I just came off the flight from Seoul, and my suitcase never came out at baggage claim. I waited until the belt stopped. Here's my baggage tag and my passport.\n\nHere's what I'd like to ask. First, could you file a report and check whether it's still in Seoul or already here somewhere? If you can tell me where it is right now, I can plan around it.\n\nSecond, if it comes tomorrow, could you deliver it to my hotel? I'd rather not come back to the airport. And since everything I own is in that bag, is there an allowance for basic necessities tonight — a toothbrush, a shirt? ... There is? Thank you. Please text me as soon as you know anything.", "koQ": "다른 나라에 도착했는데 짐이 수하물 찾는 곳에서 나오지 않았습니다. 항공사 직원에게 상황을 설명하고, 도와줄 수 있는 2~3가지 방법을 제안해 보세요.", "koA": "실례합니다, 도움이 좀 필요해서요. 방금 서울에서 오는 비행기에서 내렸는데, 제 캐리어가 수하물 찾는 곳에서 끝내 안 나왔어요. 벨트가 멈출 때까지 기다렸고요. 여기 제 수하물 표랑 여권입니다.\n\n이렇게 여쭤보고 싶어요. 우선, 분실 신고를 접수해 주시고 짐이 아직 서울에 있는지, 아니면 여기 어딘가에 있는지 확인해 주실 수 있을까요? 지금 어디 있는지만 알아도 제가 일정을 맞춰 볼 수 있거든요.\n\n두 번째로, 내일 도착한다면 제 호텔로 보내 주실 수 있나요? 공항까지 다시 오기는 좀 어려워서요. 그리고 제 짐이 전부 그 가방에 있어서, 오늘 밤 쓸 기본 생필품에 대한 지원이 있을까요? 칫솔이나 셔츠 같은 거요. ... 있다고요? 감사합니다. 뭐든 확인되는 대로 문자로 알려 주세요.", "struct": [["1️⃣ 접근", "도움 요청 + 상황 한 줄"], ["2️⃣ 사실", "탑승편 · 대기 · 수하물 표 제시"], ["3️⃣ 요구", "① 신고 접수 + 현재 위치 확인"], ["4️⃣ 요구", "② 호텔로 배송"], ["5️⃣ 마무리", "③ 생필품 지원 + 문자 안내 요청"]], "scoring": [["증거부터 내밀기", "수하물 표와 여권을 먼저 내미는 장면이 대화를 단번에 실무로 끌고 갑니다 📏 공항 컴플레인은 서류가 말을 대신해 줘요"], ["위치부터 확인", "언제 오냐보다 지금 어디 있냐를 먼저 물어야 답이 구체적으로 돌아와요 🔑 상대가 확인할 수 있는 것부터 묻는 게 요령입니다"], ["요구는 세 겹", "위치 확인 · 호텔 배송 · 생필품 지원. 성격이 다른 세 가지를 얹으면 2~3가지 요구가 확실히 채워집니다 ✅"], ["후속 연락 설계", "확인되는 대로 문자를 달라는 마무리가 상황을 끝까지 관리한다는 인상을 줘요 💬 롤플레이 문제해결의 공통 마감 기법입니다 🔁"]], "expr": [["come off the flight", "비행기에서 내리다", "도착 직후 상황을 말하는 동사구 ✈️"], ["never came out", "끝내 나오지 않았다", "분실을 사실로 말하는 표현 🔑"], ["baggage claim", "수하물 찾는 곳", "공항 필수 명사 🗺️"], ["a baggage tag", "수하물 표", "근거를 제시하는 소품 📏"], ["file a report", "신고를 접수하다", "롤플레이 세일 편 재활용 🔁 ✅"], ["where it is right now", "지금 어디 있는지", "가장 먼저 물어야 할 정보 🔑"], ["plan around ~", "~에 맞춰 일정을 짜다", "요청의 이유를 만드는 구문 ⏰"], ["deliver it to my hotel", "호텔로 보내 주다", "두 번째 요구 필수 표현 🏠"], ["an allowance", "(비용) 지원", "보상을 묻는 고급 명사 💳"], ["basic necessities", "기본 생필품", "서베이 쇼핑 편 daily necessities의 사촌 🔁"], ["Please text me", "문자로 알려 주세요", "후속 연락을 설계하는 마무리 💬"]], "audio": "audio/3_롤플레이/3-050 17. 해외여행(Overseas)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-050 17. 해외여행(Overseas)_문제 해결.mp3"}, {"id": "3-051", "cat": "roleplay", "catName": "롤플레이 질문", "num": 17, "topic": "해외여행", "topicEn": "Overseas", "type": "과거 경험", "badge": "51 과거 경험", "enQ": "That's the end of the situation. Tell me about a moment on one of your vacations when things did not go as planned. Describe what the problem was and how you dealt with it. Begin with where you were and who was with you, then walk me through everything that took place.", "enA": "This was my first trip abroad — Osaka, four days, with my best friend. We had the whole thing on a spreadsheet — which train, which street, which restaurant.\n\nWhat we hadn't planned was cash. I'd brought my card and ten thousand yen, assuming cards worked everywhere. They didn't. The places we'd circled — the standing sushi bar, the market stalls — were cash only, and by the second evening we were down to a few coins. Two ATMs rejected my card.\n\nSo we asked at the hotel desk. He laughed and said the convenience store ATM takes foreign cards — the one fifty meters away. It worked on the first try. We ate at that sushi bar an hour later, and it's still the best meal I've had. Since then, I get local cash at the airport first.", "koQ": "휴가 중에 무언가 계획대로 되지 않았던 때를 말해주세요. 문제가 무엇이었고 어떻게 대처했는지, 어디에 있었고 누구와 함께였는지부터 시작해 모든 일을 설명해 주세요.", "koA": "제 첫 해외여행이었어요. 오사카로 3박 4일, 절친이랑 갔죠. 일정은 스프레드시트로 다 짜 뒀었어요. 어느 전철을 타고 어느 식당에 갈지까지요.\n\n그런데 계획에 없던 게 현금이었어요. 카드랑 만 엔만 들고 갔거든요. 카드는 어디서든 되겠지 하고요. 그런데 아니었어요. 표시해 둔 가게들, 서서 먹는 초밥집이나 시장 노점은 전부 현금만 받더라고요. 둘째 날 저녁엔 동전 몇 개밖에 없었고, ATM 두 곳은 제 카드를 아예 인식하지 못했어요.\n\n그래서 호텔 프런트에 물어봤어요. 직원분이 웃으면서 편의점 ATM은 외국 카드가 된다고 하시더라고요. 50미터 거리에 있는 그 편의점이요. 한 번에 됐어요. 한 시간 뒤에 그 초밥집에서 먹었는데, 지금도 최고의 식사로 남아 있어요. 그 후로는 공항에서 현지 돈부터 뽑아요.", "struct": [["1️⃣ 배경", "오사카 · 절친 · 첫 해외여행"], ["2️⃣ 계획", "시간 단위로 짜 둔 일정표"], ["3️⃣ 사건", "현금만 받는 가게 · 동전만 남음"], ["4️⃣ 해결", "호텔 문의 → 편의점 ATM"], ["5️⃣ 마무리", "공항에서 먼저 환전하는 규칙"]], "scoring": [["어디서 누구와", "문제가 장소와 동행부터 말하라고 지정했어요. 오사카, 절친, 첫 해외라고 첫 문장에 깔면 요구를 바로 해결합니다 ✅"], ["소재 겹침 피하기", "휴가 중 문제는 날씨나 교통으로 가기 쉬운데, 그건 19번과 21번의 몫이에요 🔁 여기는 현금 문제로 갈라 두었습니다"], ["허탈함의 숫자", "50미터 거리에 답이 있었다는 숫자 하나가 이야기를 웃기게 만들어요 😆 고생담은 마지막에 한 번 웃겨야 기억에 남습니다"], ["망한 날의 반전", "결국 그날 저녁이 최고의 식사였다는 반전이 마무리를 살려 줘요 🔥 문제만 나열하고 끝내면 답변이 어둡게 닫힙니다"]], "expr": [["my first trip abroad", "첫 해외여행", "배경을 한 마디로 세팅 ✈️"], ["on a spreadsheet", "스프레드시트로 짜 둔", "계획형 성격을 보여 주는 디테일 📊"], ["assuming ~", "~라고 짐작하고", "실수의 원인을 말하는 분사구 🧩"], ["They didn't.", "그런데 아니었어요.", "짧은 한 문장으로 만드는 반전 🎭"], ["cash only", "현금만 받는", "이 이야기의 핵심 표현 💳"], ["be down to ~", "~밖에 안 남다", "궁지를 숫자로 그리는 구문 📏"], ["reject my card", "카드를 인식하지 못하다", "돌발 은행 편 재활용 🔁 💳"], ["the convenience store ATM", "편의점 ATM", "해결의 열쇠가 된 명사 🔑"], ["fifty meters away", "50미터 거리에", "허탈함을 살리는 숫자 😆"], ["on the first try", "한 번에", "해결 순간의 경쾌한 부사구 ✅"], ["get local cash at the airport", "공항에서 현지 돈을 뽑다", "습관 마무리의 행동 ⏰"]], "audio": "audio/3_롤플레이/3-051 17. 해외여행(Overseas)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-051 17. 해외여행(Overseas)_과거 경험.mp3"}, {"id": "3-052", "cat": "roleplay", "catName": "롤플레이 질문", "num": 18, "topic": "렌트카", "topicEn": "Car Rental", "type": "정보 요청", "badge": "52 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are spending your vacation in New York City and are now at a car rental office. You need a car, and you are talking with an employee there. Ask the employee three or four questions about renting a vehicle.", "enA": "Hi, I'd like to rent a car for four days. I'm on vacation here, and we're planning to drive upstate this weekend. Can I ask a few questions before I sign anything?\n\nFirst, what do you have available in a mid-size? ... An SUV for twenty dollars more? That might be better — we have three suitcases. And is insurance included, or is that extra? ... Extra? I'll take the full coverage, please.\n\nSecond, what's the fuel policy — do I bring it back full? ... Full to full, got it. And one last thing — can I drop it off at the airport instead of here? ... A one-way fee? How much? ... Forty dollars? That's fine. Let's go with that.", "koQ": "뉴욕에서 휴가를 보내는 중이고 지금 렌터카 사무실에 있습니다. 차가 필요한 상황에서 직원과 이야기하며 차량 대여에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 나흘 동안 차를 빌리고 싶어서요. 여기서 휴가 중인데, 이번 주말에 교외로 나가 보려고 하거든요. 계약하기 전에 몇 가지만 여쭤봐도 될까요?\n\n우선, 중형차로는 어떤 차가 있나요? ... 20달러만 더 내면 SUV가 있다고요? 그게 나을 수도 있겠네요. 캐리어가 세 개라서요. 그리고 보험은 포함인가요, 아니면 별도인가요? ... 별도요? 그럼 완전 보장으로 할게요.\n\n두 번째로, 주유 정책은 어떻게 되나요? 가득 채워서 반납하면 되나요? ... 만땅으로 받고 만땅으로 반납이요? 알겠습니다. 마지막으로 하나만, 여기 말고 공항에서 반납해도 되나요? ... 편도 수수료가 붙는다고요? 얼마인가요? ... 40달러요? 괜찮네요. 그렇게 할게요.", "struct": [["1️⃣ 인사", "대여 기간 + 사용 목적"], ["2️⃣ 질문", "① 차종 → 짐 조건"], ["3️⃣ 질문", "② 보험 포함 여부"], ["4️⃣ 질문", "③ 주유 정책"], ["5️⃣ 마무리", "④ 공항 반납 + 수수료 확인"]], "scoring": [["조건을 먼저", "나흘 · 교외 주행 · 캐리어 세 개. 조건을 먼저 깔면 직원이 추천할 근거가 생기고 질문도 자연스럽게 이어집니다 ✅"], ["렌터카 전용 어휘", "보험 · 주유 정책 · 편도 수수료는 렌터카에서만 나오는 세 가지예요 🔑 주제 전용 어휘 세 개면 준비된 답변으로 들립니다"], ["대면 상황 톤", "전화가 아니라 사무실에서 마주 보고 하는 대화예요 💬 Is this ~? 같은 전화 오프닝 대신 바로 용건으로 들어가세요"], ["결정으로 닫기", "40달러면 괜찮다, 그렇게 하겠다처럼 결정을 내리고 끝내야 상황이 해결돼요 ✅ 질문만 하고 끝내면 미완성 답변이 됩니다"]], "expr": [["rent a car", "차를 빌리다", "이 주제의 중심 동사 🗺️"], ["drive upstate", "교외로 차를 몰고 가다", "목적을 밝히는 표현 ✨"], ["What do you have available?", "어떤 차가 있나요?", "현장 문의 1번 질문 ✅"], ["a mid-size", "중형차", "차급을 부르는 어휘 📏"], ["Is insurance included?", "보험은 포함인가요?", "렌터카 필수 질문 💳"], ["extra", "별도인", "포함 여부 답변의 짝꿍 단어 🔑"], ["the full coverage", "완전 보장 보험", "선택을 명확히 하는 명사 💳"], ["the fuel policy", "주유 정책", "렌터카에서만 나오는 어휘 🔑"], ["full to full", "만땅 받고 만땅 반납", "주유 정책의 정답 표현 ✨"], ["drop it off", "반납하다", "반납 장소 질문 필수 구동사 ⏰"], ["a one-way fee", "편도 반납 수수료", "추가 비용을 묻는 명사 💳"]], "audio": "audio/3_롤플레이/3-052 18. 렌트카(Car Rental)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-052 18. 렌트카(Car Rental)_정보 요청.mp3"}, {"id": "3-053", "cat": "roleplay", "catName": "롤플레이 질문", "num": 18, "topic": "렌트카", "topicEn": "Car Rental", "type": "문제 해결", "badge": "53 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You may not be able to rent a car since you have neither an international driver's license nor an American one. Explain what your license says and offer two or three alternatives so you can still rent a car.", "enA": "I see — so without an international permit you can't hand me the keys. That's my mistake — I didn't know I needed one before I left. Let me tell you what my license says, and then maybe we can find a way.\n\nIt's a Korean driver's license, class two, valid until 2031. The front has my photo, my name in English, and the number. And the back has an English translation printed on it — here, you can see.\n\nSo, a few ideas. First, could you accept it with my passport as a second ID? Second, my friend has a valid international permit — could we put the rental in her name and add me as an additional driver? Or, if neither works, could you hold the car until tomorrow while I sort out the paperwork?", "koQ": "국제 면허증도 미국 면허증도 없어서 차를 빌리지 못할 수도 있습니다. 당신의 면허증에 무엇이 적혀 있는지 설명하고, 그래도 차를 빌릴 수 있도록 2~3가지 대안을 제안해 보세요.", "koA": "아, 그러니까 국제운전면허증이 없으면 차 키를 주실 수 없다는 말씀이시죠. 제 잘못이에요. 출국 전에 발급받아야 하는 줄 몰랐거든요. 제 면허증에 뭐라고 적혀 있는지 말씀드릴 테니, 방법이 있는지 같이 찾아봐 주시겠어요?\n\n한국 운전면허증이고, 2종이고, 2031년까지 유효해요. 앞면에는 제 사진과 영문 이름, 번호가 있고요. 뒷면에는 영문 번역이 인쇄되어 있어요. 여기, 보시면 나와 있습니다.\n\n그래서 몇 가지 제안을 드리고 싶어요. 우선, 여권을 보조 신분증으로 함께 제출하면 인정해 주실 수 있을까요? 두 번째로, 제 친구는 국제면허증이 유효해요. 대여를 친구 명의로 하고 저를 추가 운전자로 넣는 건 어떨까요? 둘 다 안 된다면, 제가 서류를 처리하는 동안 내일까지 차를 잡아 주실 수 있을까요?", "struct": [["1️⃣ 인정", "내 실수 인정 + 대화 열기"], ["2️⃣ 설명", "면허 종류 · 유효기간 · 영문 표기"], ["3️⃣ 대안", "① 여권을 보조 신분증으로"], ["4️⃣ 대안", "② 친구 명의 + 추가 운전자"], ["5️⃣ 마무리", "③ 내일까지 차량 보류 요청"]], "scoring": [["내 실수 인정", "규정을 몰랐던 건 내 잘못이라고 먼저 인정하면 직원이 방어적으로 굳지 않아요 😊 대안을 들어 줄 여지가 생깁니다"], ["문제 요구 회수", "면허증에 뭐라고 적혀 있는지 설명하라고 지정했어요. 종류 · 유효기간 · 영문 표기 세 가지로 나눠 말하면 됩니다 ✅"], ["대안 난이도 순", "여권 추가 → 친구 명의 → 하루 보류. 상대 부담이 작은 쪽부터 차례로 올라가면 셋 중 하나는 걸려요 💪 세 대안의 난이도를 다르게 두는 게 핵심입니다"], ["포기하지 않기", "안 된다는 말에 바로 돌아서지 않고 다른 길을 찾는 태도가 이 유형의 핵심이에요 🔑 여행 편 push back과 같은 기술입니다 🔁"]], "expr": [["an international permit", "국제운전면허증", "이 문제의 핵심 명사 🔑"], ["before I left", "출국 전에", "실수 시점을 밝히는 부사구 ⏰"], ["what my license says", "면허증에 뭐라고 적혀 있는지", "문제 속 표현 그대로 회수 ✅"], ["class two", "2종", "면허 종류를 말하는 표현 📏"], ["valid until ~", "~까지 유효한", "서류 설명 필수 형용사 ✨"], ["in English", "영문으로", "설득의 근거가 되는 한 마디 🔑"], ["an English translation", "영문 번역", "뒷면 표기를 설명하는 명사 📖"], ["as a second ID", "보조 신분증으로", "첫 번째 대안의 핵심 표현 💳"], ["in her name", "그 친구 명의로", "두 번째 대안의 핵심 구문 🧩"], ["an additional driver", "추가 운전자", "렌터카 계약 필수 어휘 ✨"], ["hold the car", "차를 잡아 두다", "세 번째 대안 동사 ⏰"]], "audio": "audio/3_롤플레이/3-053 18. 렌트카(Car Rental)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-053 18. 렌트카(Car Rental)_문제 해결.mp3"}, {"id": "3-054", "cat": "roleplay", "catName": "롤플레이 질문", "num": 18, "topic": "렌트카", "topicEn": "Car Rental", "type": "과거 경험", "badge": "54 과거 경험", "enQ": "That's the end of the situation. Have you ever rented a car on a trip? Why did you need to rent one? Did anything wild or terrible take place? What happened, and how did you resolve it? What makes the experience stick in your memory?", "enA": "Yes — Jeju, three years ago, with my best friend. We rented a car because the island is all coastal roads and the buses take forever.\n\nDay two, halfway around the west coast, we heard a noise and the car started pulling to one side. A flat tire. We opened the trunk for the spare — and there wasn't one. No spare, no jack, nothing. In the middle of nowhere, sea on one side, a field on the other.\n\nSo I called the roadside assistance number on the key ring. They said an hour and forty minutes. We bought coffee from a machine and sat on the wall watching the water. The man who came fixed it in ten minutes and told us where to eat. Since then, I check the trunk before I drive off.", "koQ": "여행을 위해 차를 렌트한 적이 있나요? 왜 렌트했고, 황당하거나 끔찍한 일이 있었나요? 무슨 일이 있었고 어떻게 해결했으며, 왜 그 경험이 기억에 남나요?", "koA": "네, 3년 전에 제주도에서요. 절친이랑 갔었어요. 섬이 전부 해안도로라 버스로는 한참 걸리거든요. 그래서 차를 빌렸죠.\n\n둘째 날, 서쪽 해안을 반쯤 돌았을 때였어요. 소리가 나더니 차가 한쪽으로 쏠리기 시작했어요. 타이어가 펑크 난 거였죠. 스페어를 꺼내려고 트렁크를 열었는데, 없더라고요. 스페어도, 잭도, 아무것도요. 한쪽은 바다, 한쪽은 밭인 허허벌판 한가운데에서요.\n\n그래서 키링에 적힌 긴급출동 번호로 전화했어요. 1시간 40분 걸린다고 하더라고요. 저희는 자판기 커피를 뽑아서 담벼락에 앉아 바다를 봤어요. 오신 기사님은 10분 만에 고쳐 주시고 어디서 먹으면 좋은지까지 알려 주셨고요. 그 후로는 출발하기 전에 트렁크부터 확인해요.", "struct": [["1️⃣ 이유", "해안도로 · 버스로는 무리"], ["2️⃣ 배경", "제주 · 절친 · 3년 전"], ["3️⃣ 사건", "서쪽 해안도로에서 펑크"], ["4️⃣ 절정", "스페어 없음 · 허허벌판"], ["5️⃣ 마무리", "긴급출동 10분 해결 + 트렁크 확인"]], "scoring": [["왜 빌렸는지", "문제가 Why did you need to rent one을 따로 물어요. 해안도로와 버스 배차라는 이유를 도입에 심어 두세요 ✅"], ["기다림도 장면", "1시간 40분을 자판기 커피와 담벼락으로 채우면 지루한 대기가 그림이 돼요 ✨ 비어 있는 시간에도 디테일을 넣으세요"], ["대비로 웃기기", "두 시간 가까이 기다렸는데 10분 만에 고쳐졌다는 대비가 왜 기억에 남냐는 질문의 답이 됩니다 😆 문제의 마지막 요구를 여기서 회수하세요"], ["소재 분리", "19번 ③은 자전거·버스·기차로 한정돼 있어요 🔁 자동차 이야기는 여기에 두고 그쪽은 따릉이로 갈랐습니다. 덱 전체에서 교통 소재가 겹치지 않게 관리하세요"]], "expr": [["coastal roads", "해안도로", "렌터카가 필요했던 이유 🗺️"], ["take forever", "한참 걸리다", "불편을 과장하는 구어체 😆"], ["the car started pulling", "차가 한쪽으로 쏠리다", "이상 징후 묘사 동사 🔑"], ["a flat tire", "펑크 난 타이어", "이 이야기의 사건 명사 🔑"], ["the spare", "스페어 타이어", "반전의 핵심 소품 📏"], ["in the middle of nowhere", "허허벌판 한가운데", "고립을 그리는 관용구 🔥"], ["roadside assistance", "긴급출동 서비스", "해결 절차의 정답 명사 ✅"], ["an hour and forty minutes", "1시간 40분", "기다림을 숫자로 ⏰"], ["sit on the wall", "담벼락에 앉다", "장면을 그리는 디테일 ✨"], ["fix it in ten minutes", "10분 만에 고치다", "대비로 웃음을 주는 표현 😆"], ["check the trunk", "트렁크를 확인하다", "교훈 마무리의 행동 동사 💪"]], "audio": "audio/3_롤플레이/3-054 18. 렌트카(Car Rental)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-054 18. 렌트카(Car Rental)_과거 경험.mp3"}, {"id": "3-055", "cat": "roleplay", "catName": "롤플레이 질문", "num": 19, "topic": "교통수단", "topicEn": "Transport", "type": "정보 요청", "badge": "55 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are organizing a weekend trip to a city nearby and would like to compare ways of getting there. Call the local travel information center and ask three or four questions to help you choose how to travel.", "enA": "Hi, is this the travel information center? I'm planning a weekend trip to Gyeongju next month, and I can't decide how to get there. Could you help me compare a few options?\n\nFirst, how long does the KTX take from Seoul, and how much is it one way? ... Two hours, about fifty thousand won? Okay. And what about the express bus? ... Four hours for half the price? That's the trade-off, then.\n\nSecond, which one would you recommend for a Saturday morning? ... The train sells out early? Good to know. And one last thing — once I'm there, how do I get around? Is it walkable, or should I rent a bike? ... Bike rental at the station? That settles it. Thank you!", "koQ": "근처 도시로 주말 여행을 계획 중이고 교통편을 비교해 보고 싶습니다. 지역 여행 안내 센터에 전화해 이동 방법을 정하는 데 도움이 될 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 여행 안내 센터 맞나요? 다음 달에 경주로 주말 여행을 가려고 하는데, 어떻게 갈지 결정을 못 하겠어서요. 몇 가지 비교 좀 도와주실 수 있을까요?\n\n우선, 서울에서 KTX로는 얼마나 걸리나요? 그리고 편도 요금은 얼마인가요? ... 두 시간에 5만 원 정도요? 알겠습니다. 그럼 고속버스는 어떤가요? ... 네 시간에 값은 절반이요? 그럼 그게 맞바꿈이네요.\n\n두 번째로, 토요일 아침이면 어느 쪽을 추천하시나요? ... 기차는 일찍 매진된다고요? 알아 둘게요. 마지막으로 하나만, 도착하면 현지에서는 어떻게 이동하나요? 걸어 다닐 만한가요, 아니면 자전거를 빌리는 게 나을까요? ... 역에서 자전거를 빌릴 수 있다고요? 그럼 정했어요. 감사합니다!", "struct": [["1️⃣ 인사", "안내센터 확인 + 비교 요청"], ["2️⃣ 질문", "① KTX 소요 시간·요금"], ["3️⃣ 질문", "② 고속버스와 비교"], ["4️⃣ 질문", "③ 토요일 아침 추천"], ["5️⃣ 마무리", "④ 현지 이동 수단 + 결정"]], "scoring": [["비교가 과제", "문제가 compare를 지정했어요. 한 수단만 캐묻지 말고 두 개를 나란히 놓고 시간과 요금을 맞붙여야 합니다 📊"], ["맞바꿈 정리하기", "두 시간 더 걸리는 대신 값은 절반이라는 정리를 한 문장으로 해 주세요 ✨ That’s the trade-off 한 마디면 비교가 완성됩니다"], ["추천 유도하기", "어느 쪽을 추천하냐고 물으면 상대가 길게 답하고 나는 리액션만 하면 돼요 💬 음악 편에서도 쓴 말 분량 벌기 기술입니다 🔁"], ["도착 후까지", "현지에서 어떻게 이동할지까지 묻는 네 번째 질문이 답변의 완성도를 한 단계 올려 줘요 🏃 계획이 끝까지 그려집니다"]], "expr": [["how to get there", "어떻게 갈지", "문제 속 표현 그대로 회수 ✅"], ["compare a few options", "몇 가지를 비교하다", "이 페이지의 핵심 동사 📊"], ["How long does it take?", "얼마나 걸리나요?", "소요 시간 질문 기본형 ⏰"], ["one way", "편도로", "요금 질문에 붙는 필수 표현 💳"], ["What about ~?", "~는 어떤가요?", "두 번째 선택지를 꺼내는 구문 🔑"], ["the express bus", "고속버스", "KTX와 짝을 이루는 어휘 🗺️"], ["That's the trade-off", "그게 맞바꿈이네요", "비교를 한 마디로 정리 ✨"], ["Which would you recommend?", "어느 쪽을 추천하세요?", "추천을 유도하는 질문 💬"], ["sell out early", "일찍 매진되다", "서베이 공연 편 재활용 🔁 🔥"], ["get around", "돌아다니다, 이동하다", "현지 이동을 묻는 구동사 🏃"], ["That settles it.", "그럼 정했어요.", "결정을 선언하는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-055 19. 교통수단(Transport)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-055 19. 교통수단(Transport)_정보 요청.mp3"}, {"id": "3-056", "cat": "roleplay", "catName": "롤플레이 질문", "num": 19, "topic": "교통수단", "topicEn": "Transport", "type": "문제 해결", "badge": "56 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You are at the bus terminal, but your bus has been delayed for over an hour. Speak with the staff, describe your situation, and offer two or three possible ways to handle it.", "enA": "Excuse me — I'm on the ten-thirty bus to Gangneung, and the board still says delayed. It's been over an hour now. Could you tell me what's actually going on? ... An accident on the highway? I see.\n\nHere's my situation: I'm meeting someone there at three, and at this rate I won't make it. So I was wondering — is there another company running the same route soon? I'd take a later seat with them if you could transfer my ticket.\n\nIf that's not possible, could you check the train from the station next door? I'd pay the difference and refund this one. Or, at the very least, could you tell me when it will actually leave, so I can give them a real time? Whichever you can do — I just need something solid.", "koQ": "버스 터미널에 있는데 타야 할 버스가 1시간 넘게 지연되고 있습니다. 직원에게 상황을 설명하고, 가능한 해결책을 2~3가지 제안해 보세요.", "koA": "실례합니다. 제가 강릉 가는 10시 30분 버스인데요, 전광판에는 아직도 지연이라고만 떠 있어요. 벌써 한 시간이 넘었고요. 정확히 무슨 일인지 알려 주실 수 있을까요? ... 고속도로에서 사고가 났다고요? 그렇군요.\n\n제 사정은 이래요. 거기서 세 시에 사람을 만나기로 했는데, 이대로 가면 못 맞출 것 같아요. 그래서 여쭤보는데요, 같은 노선을 곧 운행하는 다른 회사가 있나요? 표를 그쪽으로 넘겨 주실 수 있다면 더 늦은 차편이라도 타겠습니다.\n\n그게 안 된다면, 옆 역에서 출발하는 기차를 확인해 주실 수 있을까요? 차액은 제가 내고 이 표는 환불받을게요. 아니면 최소한 실제 출발 시각만이라도 알려 주세요. 그래야 제가 전화해서 정확한 시간을 말해 줄 수 있으니까요. 되는 쪽으로 해 주세요. 확실한 게 하나는 필요해서요.", "struct": [["1️⃣ 확인", "편명 · 지연 시간 · 사유 확인"], ["2️⃣ 사정", "세 시 약속 · 이대로면 지각"], ["3️⃣ 대안", "① 다른 회사로 표 이관"], ["4️⃣ 대안", "② 옆 역 기차 + 차액·환불"], ["5️⃣ 마무리", "③ 최소한 실제 출발 시각 확보"]], "scoring": [["사유부터 묻기", "화내기 전에 무슨 일인지부터 물으면 직원이 협조적으로 바뀌어요 🔑 사고 때문이라는 답을 받고 나서 요구로 넘어가세요"], ["늦으면 곤란", "세 시 약속이라는 한 줄이 요구의 근거가 돼요 ⏰ 이유 없는 재촉은 통하지 않지만, 이유가 있으면 직원도 움직입니다"], ["최소한의 요구", "다 안 되면 실제 출발 시각만이라도 달라는 마지막 요구가 현실적이에요 💪 대안 세 개의 난이도를 다르게 두는 게 핵심입니다"], ["현장형 마무리", "확실한 게 하나는 필요하다는 말이 감정 대신 목적을 앞세워 줘요 ✅ 영화 편 매표소 장면과 같은 태도입니다 🔁"]], "expr": [["the ten-thirty bus", "10시 30분 버스", "문제를 특정하는 표현 ⏰"], ["over an hour", "한 시간 넘게", "지연 정도를 못 박기 📏"], ["What's actually going on?", "정확히 무슨 일인가요?", "사실 확인 질문 🔑"], ["at this rate", "이대로 가면", "결과를 예고하는 구문 ✨"], ["So I was wondering", "그래서 여쭤보는데요", "롤플레이 여가 편 재활용 🔁 😊"], ["another company", "다른 회사", "첫 번째 대안의 핵심 명사 🗺️"], ["transfer my ticket", "표를 넘겨 주다", "대안을 구체화하는 동사 ✅"], ["pay the difference", "차액을 내다", "롤플레이 세일 편 재활용 🔁 💳"], ["refund this one", "이 표는 환불받다", "두 번째 대안 표현 💳"], ["when it will actually leave", "실제로 언제 출발하는지", "최소한의 요구 ⏰"], ["something solid", "확실한 것", "요구를 한 단어로 압축 💪"]], "audio": "audio/3_롤플레이/3-056 19. 교통수단(Transport)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-056 19. 교통수단(Transport)_문제 해결.mp3"}, {"id": "3-057", "cat": "roleplay", "catName": "롤플레이 질문", "num": 19, "topic": "교통수단", "topicEn": "Transport", "type": "과거 경험", "badge": "57 과거 경험", "enQ": "That's the end of the situation. Describe a time when things went wrong while you were traveling by bike, bus, or train. What was the issue, and how did you manage it? Walk me through everything that happened in detail.", "enA": "Oh, this reminds me of a Sunday last autumn. I'd taken a public rental bike — we call them Ttareungi — from my neighborhood down to the riverside park, about thirty minutes along the water.\n\nOn the way back, the back tire went flat. I was still twenty minutes from home, so I walked the bike the whole way, in cycling clothes, in front of everyone. And when I finally reached the rack, the app wouldn't accept the return — the bike was still on my account, charging by the minute.\n\nSo I stopped panicking and read the screen properly. There was a report a fault button buried in the menu. I filed it, took a photo of the tire, and called the service line. They cancelled the charge that evening. Since then, I squeeze both tires before I unlock anything.", "koQ": "자전거, 버스, 기차 같은 교통수단을 이용하다가 무언가 잘못되었던 때를 말해주세요. 문제가 무엇이었고 어떻게 대처했는지 자세히 설명해 주세요.", "koA": "아, 지난가을 어느 일요일이 생각나네요. 동네에서 공공 자전거를 빌려서, 저희는 따릉이라고 부르는데요, 강변 공원까지 물길을 따라 30분쯤 달려 내려갔어요.\n\n그런데 돌아오는 길에 뒷바퀴 바람이 빠져 버렸어요. 집까지 아직 20분이나 남았는데요. 결국 자전거복 차림으로 사람들이 다 보는 앞에서 자전거를 끌고 걸어왔어요. 게다가 겨우 거치대에 도착했더니 앱에서 반납이 안 되는 거예요. 자전거가 계속 제 계정에 잡혀 있어서 분 단위로 요금이 붙고 있었고요.\n\n그래서 당황하는 걸 멈추고 화면을 제대로 읽어 봤어요. 메뉴 안쪽에 고장 신고 버튼이 있더라고요. 신고를 접수하고 타이어 사진을 찍은 다음 고객센터에 전화했어요. 그날 저녁에 요금을 취소해 주셨고요. 그 후로는 잠금을 풀기 전에 타이어 두 개를 꼭 눌러 봐요.", "struct": [["1️⃣ 도입", "가을 일요일 · 따릉이 · 한강"], ["2️⃣ 사건", "돌아오는 길 뒷바퀴 펑크"], ["3️⃣ 절정", "20분을 끌고 감 + 반납 오류"], ["4️⃣ 해결", "고장 신고 → 사진 → 고객센터"], ["5️⃣ 마무리", "출발 전 타이어 확인 습관"]], "scoring": [["문제는 두 겹", "펑크와 반납 오류, 문제를 두 겹으로 쌓으면 이야기가 짧게 끝나지 않아요 📏 하나만으로는 in detail 요구를 못 채웁니다"], ["창피함도 소재", "자전거복 차림으로 20분을 끌고 갔다는 장면이 공감과 웃음을 동시에 줘요 😆 감정은 형용사보다 그림으로 보여 주세요"], ["침착함이 해결", "당황을 멈추고 화면을 제대로 읽었다는 한 줄이 해결을 내 행동으로 만들어 줍니다 💪 우연히 풀린 이야기는 점수가 되지 않아요"], ["수단 겹침 피하기", "18번 ③이 자동차였으니 여기는 자전거로 갈랐어요 🔁 문제가 애초에 자전거·버스·기차로 한정해 두었으니 그 안에서 고르면 됩니다"]], "expr": [["a public rental bike", "공공 자전거", "따릉이를 영어로 소개하는 표현 🗺️"], ["the riverside park", "강변 공원", "서베이 공원·조깅 편 재활용 🔁 🏃"], ["go flat", "바람이 빠지다", "펑크를 말하는 기본 동사 🔑"], ["walk the bike", "자전거를 끌고 가다", "장면을 그리는 동사구 😆"], ["in front of everyone", "사람들 다 보는 앞에서", "창피함을 얹는 표현 ✨"], ["the rack", "거치대", "공공 자전거 반납 장소 📏"], ["wouldn't accept the return", "반납이 되지 않았다", "wouldn't = 거부의 뉘앙스 🔁 🔑"], ["still on my account", "내 계정에 그대로", "요금이 계속 붙는 상황 💳"], ["report a fault", "고장을 신고하다", "해결의 열쇠가 된 표현 ✅"], ["cancel the charge", "요금을 취소하다", "결과를 알리는 동사 💳"], ["squeeze both tires", "타이어를 눌러 보다", "습관 마무리의 행동 💪"]], "audio": "audio/3_롤플레이/3-057 19. 교통수단(Transport)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-057 19. 교통수단(Transport)_과거 경험.mp3"}, {"id": "3-058", "cat": "roleplay", "catName": "롤플레이 질문", "num": 20, "topic": "지형", "topicEn": "Terrain", "type": "정보 요청", "badge": "58 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You will soon be visiting a friend who lives in another country. Call your friend and ask three or four questions about the geography of his or her country.", "enA": "Hey, it's me! So I'm actually coming — I booked the flight this morning. Before I pack, though, I want a picture of where you live. Can I ask you a few things about the place?\n\nFirst, what's the landscape like around the city? Is it flat, or do you have mountains nearby? ... Mountains on one side and the ocean on the other? That sounds like home, honestly — Seoul is the same, just with more buildings in between.\n\nSecond, is the city itself walkable, or is it hilly like Seoul? ... Mostly flat downtown? Good, my legs will thank you. And one last thing — is there anywhere close by for a day hike? Something with a view. ... Forty minutes by bus? Perfect, I'll bring proper shoes. Save a weekend for me.", "koQ": "곧 외국에 사는 친구를 만나러 갈 예정입니다. 친구에게 전화해 그 나라의 지형에 대해 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 나 진짜 가게 됐어. 오늘 아침에 비행기 표 끊었거든. 그런데 짐 싸기 전에 네가 사는 곳이 어떤 데인지 좀 그려 보고 싶어서. 그 동네에 대해 몇 가지만 물어봐도 돼?\n\n우선, 도시 주변 지형은 어때? 평평한 편이야, 아니면 근처에 산이 있어? ... 한쪽은 산이고 한쪽은 바다라고? 솔직히 우리 동네 같네. 서울도 딱 그런데, 사이에 건물이 더 많을 뿐이지.\n\n두 번째로, 도시 안은 걸어 다닐 만해? 아니면 서울처럼 언덕이 많아? ... 시내는 대체로 평평하다고? 다행이다, 내 다리가 고마워할 거야. 마지막으로 하나만, 근처에 당일로 다녀올 만한 등산 코스 있어? 전망 좋은 데로. ... 버스로 40분? 완벽하네. 신발 제대로 챙겨 갈게. 주말 하루는 비워 둬.", "struct": [["1️⃣ 인사", "방문 확정 + 질문 예고"], ["2️⃣ 질문", "① 도시 주변 지형"], ["3️⃣ 질문", "② 걸어 다닐 만한지"], ["4️⃣ 질문", "③ 근처 당일 등산 코스"], ["5️⃣ 마무리", "주말 약속 잡기"]], "scoring": [["지형에 집중", "문제가 the geography를 콕 집었어요. 날씨나 음식으로 새지 말고 산·바다·평지 같은 땅 이야기만 물으세요 🗺️"], ["서울과 비교하기", "언덕이 많냐고 물으면서 서울 이야기를 얹으면 질문이 훨씬 자연스러워져요 📏 돌발 지형 편에서 쓴 분지·산 설정을 그대로 가져왔습니다 🔁"], ["이유를 붙이기", "짐 싸기 전에 알고 싶다는 한 줄이 네 개의 질문 전부에 명분을 만들어 줍니다 ⏰ 이유 없는 질문은 면접처럼 들려요"], ["약속으로 닫기", "주말 하루 비워 두라는 마무리가 통화를 다음 행동으로 이어 줘요 ✅ 롤플레이 정보요청은 결론을 내고 끝내야 완성됩니다"]], "expr": [["Before I pack", "짐 싸기 전에", "질문의 이유를 만드는 부사구 ⏰"], ["the landscape", "지형, 풍경", "지형 주제 필수 명사 🗺️"], ["flat", "평평한", "지형 묘사 기본 형용사 📏"], ["mountains nearby", "근처의 산", "돌발 지형 편 재활용 🔁 🗺️"], ["the ocean", "바다", "삼면이 바다와 짝을 이루는 어휘 ✨"], ["That sounds like home", "우리 동네 같네", "공감을 담은 리액션 한 줄 💕"], ["walkable", "걸어 다닐 만한", "도시 지형을 한 단어로 🏃"], ["hilly", "언덕이 많은", "서울을 설명하는 형용사 📏"], ["a day hike", "당일 등산", "돌발 지형 편 국민 스포츠 연결 🔁 🏃"], ["with a view", "전망이 좋은", "조건을 붙이는 짧은 구문 ✨"], ["Save a weekend for me", "주말 하루는 비워 둬", "약속으로 닫는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-058 20. 지형(Terrain)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-058 20. 지형(Terrain)_정보 요청.mp3"}, {"id": "3-059", "cat": "roleplay", "catName": "롤플레이 질문", "num": 20, "topic": "지형", "topicEn": "Terrain", "type": "문제 해결", "badge": "59 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You planned to fly abroad to see your friend, but something has come up and you can no longer go. Call your friend, explain what happened, and offer two or three ideas to deal with the situation.", "enA": "Hey, it's me. I've got bad news about next month — I can't come. I went to check my passport last night, and it expires in October. Most countries want six months left on it, so they wouldn't even let me board.\n\nI'm so sorry. I know you'd taken the days off. Here's what I'm thinking. First, I can get it renewed in about two weeks and push the trip back to the end of next month — the flight change fee is mine to pay.\n\nSecond, if your days off can't move, why don't you come here instead? I'll cover the hotel, and you've never seen Seoul in autumn. Or, worst case, we save it for the winter and make it a longer trip. Just tell me which one and I'll start booking.", "koQ": "친구를 만나러 해외에 가려고 했는데 일이 생겨 갈 수 없게 되었습니다. 친구에게 전화해 무슨 일인지 설명하고, 상황을 해결할 2~3가지 방안을 제안해 보세요.", "koA": "안녕, 나야. 다음 달 일로 안 좋은 소식이 있어. 나 못 갈 것 같아. 어젯밤에 여권을 확인해 봤는데, 10월에 만료더라고. 대부분 나라가 6개월 이상 남아 있어야 한다고 해서, 아예 탑승도 못 시켜 준대.\n\n정말 미안해. 네가 휴가까지 낸 거 아는데. 내 생각은 이래. 우선, 2주 정도면 재발급받을 수 있으니까 여행을 다음 달 말로 미루는 거야. 항공권 변경 수수료는 내가 낼게.\n\n두 번째로, 네 휴가를 못 옮기겠으면 차라리 네가 여기로 오는 건 어때? 호텔은 내가 낼게. 너 가을 서울은 본 적 없잖아. 아니면 최악의 경우에는 겨울로 미뤄서 더 길게 잡자. 어느 쪽인지만 알려 줘. 내가 바로 예약할게.", "struct": [["1️⃣ 통보", "다음 달 방문 취소 소식"], ["2️⃣ 사유", "여권 만료 · 잔여 6개월 규정"], ["3️⃣ 대안", "① 재발급 후 월말로 연기"], ["4️⃣ 대안", "② 친구가 한국으로 오기"], ["5️⃣ 마무리", "③ 겨울에 길게 + 선택권 넘기기"]], "scoring": [["사유는 구체적", "여권이 10월 만료라 6개월 규정에 걸렸다는 설명이 못 가는 이유를 한 번에 납득시켜요 📏 급한 일이 생겼다로 뭉뚱그리지 마세요"], ["상대 손실 언급", "네가 휴가까지 냈다는 걸 먼저 짚으면 사과가 진심으로 들려요 💕 내 사정만 늘어놓는 답변과 인상이 완전히 달라집니다"], ["방향 뒤집기", "내가 못 가면 네가 오라는 대안이 이 페이지의 하이라이트예요 ✨ 같은 문제를 반대편에서 푸는 발상이 점수를 만듭니다"], ["비용은 내가", "변경 수수료와 호텔을 부담하겠다는 한 줄이 대안을 실현 가능하게 만들어요 💳 문제해결 유형의 공통 마감 기법입니다 🔁"]], "expr": [["I've got bad news", "안 좋은 소식이 있어", "문제해결 오프닝 1순위 🔁 💬"], ["expire", "(기한이) 만료되다", "이 문제의 핵심 동사 🔑"], ["six months left", "6개월 이상 남은", "여권 규정을 말하는 표현 📏"], ["let me board", "탑승시켜 주다", "결과를 설명하는 사역 동사 ✈️"], ["take the days off", "휴가를 내다", "롤플레이 여행 편 재활용 🔁 ⏰"], ["Here's what I'm thinking", "내 생각은 이래", "대안 나열 직전의 신호탄 🔁 🔑"], ["get it renewed", "재발급받다", "해결 절차의 핵심 표현 ✅"], ["push the trip back", "여행을 미루다", "롤플레이 집 편 push it to 재활용 🔁"], ["Why don't you come here?", "네가 여기로 오는 건 어때?", "방향을 뒤집는 대안 ✨"], ["worst case", "최악의 경우에는", "롤플레이 여행 편 재활용 🔁 🔑"], ["Just tell me which one", "어느 쪽인지만 알려 줘", "선택권을 넘기는 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-059 20. 지형(Terrain)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-059 20. 지형(Terrain)_문제 해결.mp3"}, {"id": "3-060", "cat": "roleplay", "catName": "롤플레이 질문", "num": 20, "topic": "지형", "topicEn": "Terrain", "type": "과거 경험", "badge": "60 과거 경험", "enQ": "That's the end of the situation. Share a memorable experience from a visit to another country. When and where did you travel? What was the place like? How did that country's geography differ from your own country's?", "enA": "This was Osaka, four years ago — my first time abroad, with my best friend. What struck me most wasn't the food or the neon. It was how flat it was.\n\nSeoul is a basin: wherever you stand there's a mountain in the background, and half the streets run uphill. Osaka had almost none of that. We walked for an hour and the ground never changed. The sky felt wider, because nothing was blocking it.\n\nThe water was different too. Seoul has one big river cutting through the middle; Osaka is laced with canals, small ones, right between the buildings. And people cycled everywhere — of course they did, on ground like that. Compared to home, it was a different kind of city, and I still think about that wide, flat sky.", "koQ": "다른 나라를 방문하며 겪은 기억에 남는 경험을 말해주세요. 언제 어디로 갔나요? 그곳은 어땠나요? 그 나라의 지형은 우리나라와 어떻게 달랐나요?", "koA": "4년 전 오사카였어요. 제 첫 해외여행이었고, 절친이랑 갔죠. 그런데 가장 인상 깊었던 건 음식도 네온사인도 아니었어요. 그 도시가 얼마나 평평한가였어요.\n\n서울은 분지잖아요. 어디에 서 있든 배경에 산이 보이고, 길의 절반은 오르막이고요. 오사카는 그런 게 거의 없었어요. 한 시간을 걸었는데 땅이 한 번도 달라지지 않더라고요. 하늘이 더 넓게 느껴졌어요. 가리는 게 없으니까요.\n\n물도 달랐어요. 서울은 큰 강 하나가 도시 한가운데를 가로지르는데, 오사카는 건물 사이사이로 작은 수로가 그물처럼 얽혀 있었어요. 그리고 다들 어디든 자전거로 다니더라고요. 그런 땅이면 당연하죠. 우리나라와 비교하면 완전히 다른 종류의 도시였어요. 저는 지금도 그 넓고 평평한 하늘이 생각나요.", "struct": [["1️⃣ 배경", "4년 전 오사카 · 절친 · 첫 해외여행"], ["2️⃣ 첫인상", "음식도 네온도 아닌 평지"], ["3️⃣ 비교", "① 서울 분지 · 산 · 오르막"], ["4️⃣ 비교", "② 한강 하나 vs 도심 수로"], ["5️⃣ 마무리", "생활의 차이 + 넓은 하늘"]], "scoring": [["질문 셋 회수", "언제·어디 / 그곳은 어땠나 / 지형이 어떻게 달랐나. 세 가지를 단락마다 하나씩 맡기면 빠짐없이 답하게 됩니다 ✅"], ["지형으로 답하기", "이 문제는 음식도 사람도 아닌 땅을 묻고 있어요 🗺️ 평지 · 산 · 물길 세 가지로만 비교해도 분량은 충분히 나옵니다"], ["감각으로 옮기기", "하늘이 더 넓게 느껴졌다는 문장이 평평하다는 사실을 감상으로 바꿔 줘요 ✨ 지형 답변이 지리 수업처럼 들리지 않게 해 줍니다"], ["생활까지 연결", "땅이 평평해서 다들 자전거를 탄다는 연결이 IH급 마무리예요 🏃 돌발 지형 편의 생활은 땅을 따라간다와 같은 논리입니다 🔁"]], "expr": [["What struck me most", "가장 인상 깊었던 건", "경험 도입의 세련된 변형 ✨"], ["how flat it was", "얼마나 평평한지", "지형 주제의 핵심 감상 📏"], ["a basin", "분지", "돌발 지형 편 재활용 🔁 🗺️"], ["a mountain in the background", "배경에 보이는 산", "서울을 그리는 한 컷 🗺️"], ["run uphill", "오르막으로 이어지다", "언덕 많은 도시 묘사 동사 🏃"], ["The sky felt wider", "하늘이 더 넓게 느껴졌다", "지형을 감각으로 옮긴 문장 ✨"], ["be laced with ~", "~이 그물처럼 얽힌", "수로 묘사 고급 표현 🔑"], ["canals", "운하, 수로", "오사카 지형 시그니처 명사 🗺️"], ["cycle everywhere", "어디든 자전거로 다니다", "지형이 생활을 바꾼 증거 🏃"], ["compared to ~", "~과 비교하면", "비교 마무리 공식 🔁 📊"], ["a different kind of city", "다른 종류의 도시", "결론을 한 마디로 ✅"]], "audio": "audio/3_롤플레이/3-060 20. 지형(Terrain)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-060 20. 지형(Terrain)_과거 경험.mp3"}, {"id": "3-061", "cat": "roleplay", "catName": "롤플레이 질문", "num": 21, "topic": "날씨", "topicEn": "Weather", "type": "정보 요청", "badge": "61 정보 요청", "enQ": "I'd like to give you a situation to act it out. You have come to a clothing store to find something appropriate for the coming season. Speak with the staff and ask three or four questions about which clothes suit different kinds of weather.", "enA": "Hi, could you help me for a minute? I'm looking for something for the coming season. It's still warm in the afternoon but cold in the mornings, and nothing in my closet works right now — I'm either too hot or too cold all day.\n\nFirst, what are people buying for this time of year? ... Light layers? That makes sense. Is there something I can throw on and take off easily? ... A knit jacket? Could I see it?\n\nSecond, what about the rainy days? Is this fabric water-repellent, or should I get something else for that? ... Water-repellent is enough for me. And one last thing — I wear business casual at work. Would this be too casual for the office? ... It works either way? That's perfect for me. I'll take it in navy.", "koQ": "다가오는 계절에 맞는 옷을 사려고 옷 가게에 왔습니다. 매장 직원과 이야기하며 여러 날씨에 알맞은 옷에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 잠깐 도움 좀 받을 수 있을까요? 다가오는 계절에 입을 걸 찾고 있어요. 낮에는 아직 따뜻한데 아침에는 쌀쌀하거든요. 지금 옷장에 있는 건 하나도 안 맞아요. 하루 종일 덥거나 춥거나 둘 중 하나예요.\n\n우선, 이맘때는 사람들이 주로 뭘 많이 사나요? ... 가볍게 겹쳐 입는 옷이요? 그럴 만하네요. 걸쳤다 벗었다 하기 편한 게 있을까요? ... 니트 재킷이요? 좀 볼 수 있을까요?\n\n두 번째로, 비 오는 날은 어떤가요? 이 소재는 발수가 되나요, 아니면 그런 날엔 다른 걸 사는 게 나을까요? ... 발수면 저한테는 충분해요. 마지막으로 하나만, 제가 회사에서는 비즈니스 캐주얼로 입거든요. 이건 출근용으로는 너무 캐주얼할까요? ... 어느 쪽이든 괜찮다고요? 저한테 딱이네요. 네이비로 할게요.", "struct": [["1️⃣ 접근", "직원에게 도움 요청 + 상황 설명"], ["2️⃣ 질문", "① 이 계절 인기 품목"], ["3️⃣ 질문", "② 일교차 대응 방식"], ["4️⃣ 질문", "③ 비 오는 날 소재"], ["5️⃣ 마무리", "④ 출근용으로 괜찮은지 + 결정"]], "scoring": [["날씨별로 나누기", "문제가 different kinds of weather를 지정했어요. 일교차 · 비 · 출근이라는 세 상황으로 나누면 질문이 저절로 나옵니다 ✅"], ["내 상황 먼저", "아침엔 춥고 낮엔 덥다는 한 줄이 직원이 추천할 근거예요 📏 옷 좀 보여 달라는 말로 시작하면 대화가 이어지지 않습니다"], ["대면 상황 톤", "전화가 아니라 매장에서 직원과 마주 본 대화예요 💬 렌터카 편과 마찬가지로 전화 오프닝 없이 바로 용건으로 들어가세요 🔁"], ["기능 어휘", "water-repellent 같은 단어 하나가 어휘 점수를 올려 줘요 ✨ 방수인지 발수인지 구분해 물으면 준비된 답변으로 들립니다"]], "expr": [["the coming season", "다가오는 계절", "문제 속 표현 그대로 회수 ✅"], ["cold in the mornings", "아침에는 쌀쌀한", "일교차를 설명하는 표현 📏"], ["What are people buying?", "요즘 뭘 많이 사나요?", "추천을 유도하는 질문 💬"], ["light layers", "가볍게 겹쳐 입는 옷", "환절기 옷차림 정답 어휘 ✨"], ["throw on and take off", "걸쳤다 벗었다 하다", "일교차 대응 동사 콤보 🔑"], ["the rainy days", "비 오는 날", "날씨별 질문의 두 번째 축 🔑"], ["water-repellent", "발수 기능이 있는", "방수와 구분되는 고급 어휘 📏"], ["business casual", "비즈니스 캐주얼", "돌발 패션 편 재활용 🔁 ✨"], ["too casual", "너무 캐주얼한", "착용 상황을 확인하는 표현 😊"], ["either way", "어느 쪽이든", "롤플레이 공연 편 재활용 🔁 ✅"], ["That's perfect for me", "저한테 딱이네요", "만족 리액션 🔁 ✅"]], "audio": "audio/3_롤플레이/3-061 21. 날씨(Weather)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-061 21. 날씨(Weather)_정보 요청.mp3"}, {"id": "3-062", "cat": "roleplay", "catName": "롤플레이 질문", "num": 21, "topic": "날씨", "topicEn": "Weather", "type": "문제 해결", "badge": "62 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You had a picnic planned for today, but heavy rain has just begun to fall. Call your friend, describe the situation, and offer two or three other activities you could do instead.", "enA": "Hey, it's me — are you looking outside? It's pouring. The forecast said cloudy, and now the river park is going to be a swamp. Even if it stops, the grass won't dry by noon. I don't think the picnic is happening today.\n\nBut I've already made the kimbap, so hear me out. First option: come to my place and we do an indoor picnic — blanket on the floor, the whole basket, a movie on. Honestly it might beat sitting on wet grass.\n\nSecond, if you want to actually go out, the art museum two stops away has a new exhibition, and there's a cafe inside. Or we just push it to next Saturday — the forecast looks clear, and the kimbap keeps a day. Whichever you prefer — I'm easy either way.", "koQ": "오늘 소풍을 갈 계획이었는데 비가 심하게 내리기 시작했습니다. 친구에게 전화해 상황을 설명하고, 대신 할 수 있는 다른 활동을 2~3가지 제안해 보세요.", "koA": "안녕, 나야. 지금 밖에 보고 있어? 비가 억수같이 와. 예보는 흐림이라더니, 이러면 한강공원은 완전 진창이 될 거야. 지금 그친다 해도 점심까지 잔디가 안 마를 거고. 오늘 소풍은 못 할 것 같아.\n\n그래도 김밥은 이미 싸 놨거든. 그러니까 내 말 좀 끝까지 들어 봐. 첫 번째 안은, 우리 집으로 와서 실내 피크닉을 하는 거야. 바닥에 돗자리 깔고, 도시락 그대로 펴고, 영화 하나 틀고. 솔직히 젖은 잔디에 앉아 있는 것보다 나을 수도 있어.\n\n두 번째로, 그래도 밖에 나가고 싶으면 두 정거장 거리에 있는 미술관에 새 전시가 열렸대. 안에 카페도 있고. 아니면 그냥 다음 주 토요일로 미루자. 그때는 예보가 맑더라고. 김밥은 하루쯤 괜찮고. 네가 좋은 쪽으로 해. 난 어느 쪽이든 괜찮아.", "struct": [["1️⃣ 통보", "폭우 확인 + 소풍 무산"], ["2️⃣ 완충", "김밥은 이미 쌌다는 한 줄"], ["3️⃣ 대안", "① 우리 집에서 실내 피크닉"], ["4️⃣ 대안", "② 두 정거장 거리 미술관"], ["5️⃣ 마무리", "③ 다음 주 토요일로 연기"]], "scoring": [["준비물 살리기", "김밥을 이미 쌌다는 한 줄이 실내 피크닉이라는 아이디어를 자연스럽게 만들어 줘요 🏠 대안은 상황에서 자라나야 합니다"], ["대안의 축", "집 · 밖 · 다음 주. 15번 집 편과 같은 세 축이지만 여기는 활동을 바꾸는 쪽으로 채웠어요 🔁 문제가 activities를 지정했거든요"], ["아이디어 한 방", "실내 피크닉처럼 이름을 붙인 대안 하나면 답변이 기억에 남아요 ✨ 그냥 집에서 놀자보다 훨씬 강하게 들립니다"], ["가볍게 닫기", "나는 어느 쪽이든 괜찮다는 마무리가 친구 사이 통화답게 들려요 ✅ 상대에게 부담을 주지 않는 마감 기법입니다"]], "expr": [["It's pouring", "비가 억수같이 와", "폭우를 말하는 구어체 🔑"], ["The forecast said ~", "예보는 ~라고 했는데", "예상과 현실의 대비 📏"], ["a swamp", "진창, 늪", "젖은 잔디밭을 과장하는 비유 😆"], ["~ is not happening", "~은 못 하겠어", "취소를 캐주얼하게 선언 ✨"], ["hear me out", "내 말 끝까지 들어 봐", "대안 나열 직전의 신호탄 🔑"], ["an indoor picnic", "실내 피크닉", "이 페이지의 아이디어 한 방 🏠"], ["blanket on the floor", "바닥에 돗자리를 깔고", "장면을 그리는 구문 ✨"], ["two stops away", "두 정거장 거리에", "롤플레이 여행 편 재활용 🔁 ⏰"], ["push it to ~", "~로 미루다", "롤플레이 집 편 재활용 🔁"], ["the forecast looks clear", "예보가 맑아", "연기 제안의 근거 ✅"], ["Whichever you prefer", "네가 좋은 쪽으로", "문제해결 공통 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-062 21. 날씨(Weather)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-062 21. 날씨(Weather)_문제 해결.mp3"}, {"id": "3-063", "cat": "roleplay", "catName": "롤플레이 질문", "num": 21, "topic": "날씨", "topicEn": "Weather", "type": "과거 경험", "badge": "63 과거 경험", "enQ": "That's the end of the situation. Have you ever been caught off guard by the weather and run into trouble? What took place? Who was with you? How did you get through the situation? Tell me the whole story of what the unexpected weather caused.", "enA": "This was Gangneung, last August, with my best friend. We'd gone for two nights — beach in the d
