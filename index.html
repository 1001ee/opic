마무리가 완성돼요 💬 약속 편 디저트 룰과 같은 기술이에요 🔁"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["no plan, no reservation", "무계획 · 무예약", "즉흥의 설렘 표현 ✨"], ["camp by ~", "~ 옆에 자리 잡다", "물가에서 오후 보내기 🗺️"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["pour", "(비가) 쏟아지다", "날씨 반전의 필수 동사 ✅"], ["sprint", "전력 질주하다", "다리 밑 대피 장면 동사 🏃"], ["soaked", "쫄딱 젖은", "비 맞은 상태 한 단어 😆"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["saying absolutely nothing", "아무 말 없이", "편한 사이의 증명 💕"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["The best plan is no plan.", "최고의 계획은 무계획", "이 페이지의 교훈 명언 💬"]], "audio": "audio/2_돌발/2-054 11. 여가(Free Time)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-054 11. 여가(Free Time)_과거 경험.mp3"}, {"id": "2-055", "cat": "unexpected", "catName": "돌발 질문", "num": 11, "topic": "여가", "topicEn": "Free Time", "type": "비교", "badge": "55 비교", "enQ": "Compare how you spend your free time now with how you spent it five or ten years ago. What has changed, and why? Tell me about the differences.", "enA": "Back then — five or six years ago, in my university days — free time meant going out. My friends and I used to roam the city until late: all-night movie marathons, karaoke until our voices died, and instant noodles at 3 a.m.\n\nThese days, it's a completely different story. My free time turned inward: jogging, cooking, YouTube on the sofa, lights out before midnight. Compared to those wild days, my evenings are way quieter — and I protect that quiet like treasure. What changed? My energy became something I budget, not something I burn.\n\nBut I have to admit, I miss that 3 a.m. recklessness sometimes. Back then we had energy but no money; now I have some money but no energy. Life is funny like that, if you ask me.", "koQ": "지금 여가 시간을 보내는 방식과 5년, 10년 전의 방식을 비교해주세요. 무엇이 변화했고, 그 이유는 무엇인가요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 5~6년 전 대학 시절에 여가는 곧 밖으로 나가는 거였어요. 친구들과 밤늦게까지 시내를 쏘다니곤 했죠. 밤샘 영화 마라톤, 목소리가 죽을 때까지 노래방, 그리고 새벽 3시의 라면까지요.\n\n요즘은 완전히 다른 이야기예요. 제 여가는 안쪽으로 방향을 틀었어요. 조깅, 요리, 소파에서 유튜브, 자정 전 소등. 그 격렬했던 시절과 비교하면 지금 저녁은 훨씬 조용해요. 그리고 그 조용함을 보물처럼 지키죠. 뭐가 변했냐면, 에너지가 태우는 게 아니라 아껴 쓰는 예산이 됐어요.\n\n하지만 인정할 건 인정해야죠. 가끔은 그 새벽 3시의 무모함이 그리워요. 그때는 에너지는 있는데 돈이 없었고, 지금은 돈은 좀 있는데 에너지가 없죠. 제 생각엔, 인생 참 웃겨요.", "struct": [["1️⃣ 과거", "밤샘 영화 · 노래방 · 새벽 라면"], ["2️⃣ 현재", "조깅 · 요리 · 자정 전 소등"], ["3️⃣ 대비", "밖으로 vs 안으로"], ["4️⃣ 이유", "에너지 = 태움 → 예산"], ["5️⃣ 마무리", "에너지와 돈의 아이러니"]], "scoring": [["방향 프레임", "밖으로(going out)에서 안으로(turn inward) — 방향 전환 하나로 5년의 변화가 정리돼요 ✅ 비교의 축은 단순할수록 강해요"], ["이유 한 줄", "질문의 why에는 에너지가 태우는 것에서 아껴 쓰는 예산이 됐다는 한 줄로 답해요 🔑 budget을 동사로 쓰는 게 어휘력 포인트죠"], ["현재 루틴 재활용", "조깅 · 요리 · 소파 유튜브 · 자정 소등 — 시리즈의 저녁 루틴이 비교의 현재 파트를 그대로 채워줘요 🔁 🎓"], ["아이러니 마무리", "그때는 에너지, 지금은 돈 — 둘 다는 없다는 아이러니 마무리가 웃음과 여운을 동시에 남겨요 😆 💬"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["roam", "쏘다니다", "대학 시절 밤거리 동사 🎭"], ["all-night", "밤샘의", "영화 마라톤 수식어 🌙"], ["until our voices died", "목소리가 죽을 때까지", "노래방 과장 유머 😆"], ["turn inward", "안으로 향하다", "여가 변화의 핵심 표현 🔑"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["budget", "예산처럼 아껴 쓰다", "에너지 관리 명동사 ✨"], ["way + 비교급", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["recklessness", "무모함", "그 시절을 한 단어로 💕"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-055 11. 여가(Free Time)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-055 11. 여가(Free Time)_비교.mp3"}, {"id": "2-056", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "묘사", "badge": "56 묘사", "enQ": "Tell me about your favorite TV program. What kind of show is it, and what is it about? Why do you enjoy watching it? Describe it in detail.", "enA": "My favorite TV program? Hands down, it's a cooking survival show where chefs battle with surprise ingredients. Each round, they open a mystery box and have to create a dish on the spot — total chaos, total fun.\n\nWhy do I enjoy it? For starters, the tension is unreal: timers beeping, pans flying, judges with poker faces. But my favorite part is the ideas — I steal little tricks for my own kitchen. My egg rolls finally stopped falling apart thanks to a heat-control tip from one episode!\n\nAnd honestly, the show taught me that cooking is thinking on your feet, not just following recipes. It's the one program I never skip — that's pretty much my TV happy place.", "koQ": "가장 좋아하는 TV 프로그램에 대해 말해주세요. 어떤 종류의 프로그램이고, 무엇에 관한 내용인가요? 왜 그것을 즐겨 보나요? 자세히 묘사해주세요.", "koA": "제가 가장 좋아하는 TV 프로그램이요? 두말할 것 없이 요리 서바이벌 쇼예요. 셰프들이 깜짝 재료로 대결하는 프로그램이죠. 매 라운드 미스터리 박스를 열고 그 자리에서 요리를 만들어내야 해요. 완전한 혼돈, 완전한 재미죠.\n\n왜 즐겨 보냐고요? 우선 긴장감이 장난이 아니에요. 삑삑거리는 타이머, 날아다니는 팬, 포커페이스 심사위원들. 그런데 제 최애 포인트는 아이디어예요. 제 주방을 위해 작은 기술들을 훔치거든요. 어느 에피소드의 불 조절 팁 덕분에 제 계란말이가 드디어 안 부서지게 됐다니까요!\n\n그리고 솔직히 이 쇼가 가르쳐줬어요. 요리는 레시피를 따라가는 게 아니라 순발력이라는 걸요. 절대 건너뛰지 않는 유일한 프로그램이에요. 이게 제 TV 힐링 스팟이죠.", "struct": [["1️⃣ 선언", "요리 서바이벌, hands down"], ["2️⃣ 소개", "미스터리 박스 즉석 대결"], ["3️⃣ 재미", "타이머 · 팬 · 포커페이스"], ["4️⃣ 효용", "주방 꿀팁 훔치기"], ["5️⃣ 마무리", "요리 = 순발력 배움"]], "scoring": [["3단 정석", "어떤 쇼인지 한 줄 정의 → 왜 재밌는지 → 내 삶에 뭘 주는지. 프로그램 묘사의 3단 정석 구조예요 ✅ 질문 순서 그대로죠"], ["감각 나열", "삑삑대는 타이머 · 날아다니는 팬 · 포커페이스 — 소리와 장면 셋이면 쇼의 긴장감이 그대로 전달돼요 ✨ 명사 나열의 힘이죠"], ["요리 편 연결", "주방 꿀팁을 훔친다는 포인트가 서베이 요리 편 캐릭터와 자연스럽게 이어져요 🔁 🎓 보는 취미가 하는 취미로 연결되는 구성!"], ["교훈 마무리", "요리는 순발력이라는 배움으로 닫으면 그냥 재밌다보다 한 급 위의 마무리가 돼요 🎓 프로그램 묘사에도 철학 한 스푼!"]], "expr": [["hands down", "두말할 것 없이", "최상급 확신 표현, 시리즈 개근 🔁 🔑"], ["battle", "대결하다", "서바이벌 쇼 소개 동사 🔥"], ["on the spot", "그 자리에서, 즉석에서", "약속 편과 다른 뜻으로 재등장 🔁 ✨"], ["for starters", "우선, 첫째로", "이유 나열 시작 신호 ✅"], ["unreal", "장난 아닌", "긴장감 강조 구어체 😆"], ["poker face", "포커페이스", "심사위원 묘사 한 단어 🎭"], ["steal tricks", "기술을 훔치다", "시청 = 배움 재치 표현 ✨"], ["thinking on your feet", "순발력", "쇼가 준 교훈 키워드 🔑"], ["never skip", "절대 건너뛰지 않다", "최애 증명 표현 ✅"], ["happy place", "힐링 스팟", "애정 마무리 표현 💕"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-056 12. TV(Television)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-056 12. TV(Television)_묘사.mp3"}, {"id": "2-057", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "습관", "badge": "57 습관", "enQ": "When and where do you usually watch TV, and how often do you watch it? What do you normally do while watching? Describe your TV watching habits.", "enA": "Truth time: my 'TV' is really a tag team of screens. On weekday evenings I mostly watch YouTube on the sofa, but real TV gets its moment on weekend evenings — that's when I binge my cooking show, usually two episodes back to back.\n\nWhere? Always the same spot: my gray sofa, lights half down, dinner tray on my lap. What do I do while watching? Eat, obviously — and during the boring parts I stretch, fold laundry, or reply in the group chat. Multitasking at its finest!\n\nHow often? Maybe four or five hours a week in total — and my golden rule applies here too: screens off at eleven, no exceptions. Good shows deserve fresh eyes, if you ask me. That's pretty much my TV routine.", "koQ": "보통 언제 어디서 TV를 보고, 얼마나 자주 시청하나요? TV를 보면서 주로 무엇을 하나요? 당신의 TV 시청 습관을 설명해주세요.", "koA": "솔직히 말하면 제 TV는 사실 화면들의 태그팀이에요. 평일 저녁엔 주로 소파에서 유튜브를 보지만, 진짜 TV는 주말 저녁에 등판해요. 그때 요리 쇼를 몰아보거든요. 보통 두 에피소드 연속으로요.\n\n어디서냐고요? 늘 같은 자리죠. 회색 소파, 반쯤 낮춘 조명, 무릎 위 저녁 쟁반. 보면서 뭘 하냐면, 당연히 먹고요. 지루한 부분에선 스트레칭하거나 빨래를 개거나 단톡방에 답장해요. 멀티태스킹의 정석이죠!\n\n얼마나 자주냐면, 다 합쳐서 일주일에 4~5시간쯤이에요. 여기에도 저의 황금률이 적용돼요. 11시엔 화면 끄기, 예외 없음. 제 생각에 좋은 쇼는 맑은 눈으로 봐야 하거든요. 이게 제 TV 루틴이에요.", "struct": [["1️⃣ 구분", "평일 유튜브, 주말 TV"], ["2️⃣ 장소", "소파 · 조명 · 저녁 쟁반"], ["3️⃣ 동시", "스트레칭 · 빨래 · 단톡"], ["4️⃣ 빈도", "주 4~5시간 총량제"], ["5️⃣ 규칙", "11시 스크린 오프 룰"]], "scoring": [["질문 4종 커버", "언제(주말 저녁) · 어디(소파) · 얼마나(주 4~5시간) · 보면서 뭘(멀티태스킹) — 네 의문사를 순서대로 전부 답해요 ✅"], ["정직 오프닝", "요즘 세대답게 진짜 TV는 주말용이라는 태그팀 프레임으로 솔직하게 시작하면 답변이 현실적으로 들려요 ✨ 기술 편과도 일관되죠 🔁"], ["장면 고정", "회색 소파 + 반쯤 낮춘 조명 + 저녁 쟁반 — 고정 장면 하나가 습관의 그림을 그려줘요 🌙 시리즈 소파의 재등장이에요 🔁"], ["룰 재활용", "11시 스크린 오프는 휴대폰 · 기술 편의 골든룰 그대로예요 🔁 🎓 어디서 물어도 같은 규칙 — 이 일관성이 IH 신뢰를 만들어요"]], "expr": [["tag team", "태그팀", "유튜브 + TV 관계 비유 ✨"], ["binge", "몰아보다", "TV 습관 필수 동사 🔥"], ["back to back", "연속으로", "두 편 연달아 시청 ✅"], ["lights half down", "반쯤 낮춘 조명", "시청 무드 디테일 🌙"], ["dinner tray", "저녁 쟁반", "소파 저녁 장면 소품 🍳"], ["multitasking", "멀티태스킹", "보면서 하는 일 요약 😆"], ["at its finest", "정석의, 최고봉의", "자기 유머 마무리 표현 ✨"], ["golden rule", "황금률", "습관 공식 단골, 11시 룰 🔁 🔑"], ["no exceptions", "예외 없이", "규칙 강조, 기술 습관 편 재활용 🔁 💪"], ["fresh eyes", "맑은 눈", "일찍 자는 이유 재치 표현 ✅"], ["that's pretty much ~", "그게 대충 ~예요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-057 12. TV(Television)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-057 12. TV(Television)_습관.mp3"}, {"id": "2-058", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "취향", "badge": "58 취향", "enQ": "What kinds of TV programs do you prefer - dramas, variety shows, or documentaries? Why do you like that type of program? Tell me the reasons.", "enA": "If I had to choose, variety shows win, no contest. After a long day, it's all about switching my brain off, and nothing does that like people being hilariously silly on screen.\n\nHere's my problem with dramas: one episode is never one episode. The cliffhanger grabs me, and suddenly it's 2 a.m. — a direct attack on my eleven o'clock rule! And documentaries? Don't get me wrong, they're brilliant — but after work, they feel like night school. I'd take laughing over learning any day... at least on weeknights.\n\nNothing beats laughing out loud with a bowl of ramyeon after a rough Monday. In a nutshell: dramas steal my sleep, documentaries feed my brain, but variety shows heal my soul.", "koQ": "드라마, 예능, 다큐멘터리 중 어떤 TV 프로그램을 선호하나요? 왜 그런 프로그램을 좋아하나요? 그 이유를 말해주세요.", "koA": "골라야 한다면 예능 승리예요. 고민할 것도 없죠. 긴 하루 끝엔 뇌 스위치 끄기가 핵심인데, 화면 속에서 사람들이 우스꽝스럽게 노는 것만큼 그걸 잘하는 게 없거든요.\n\n드라마의 문제는 이거예요. 한 편이 절대 한 편으로 안 끝나요. 클리프행어에 붙잡히면 어느새 새벽 2시죠. 저의 11시 룰에 대한 직접 공격이에요! 다큐멘터리요? 오해는 마세요. 훌륭하죠. 근데 퇴근 후엔 야간 학교처럼 느껴져요. 적어도 평일 밤엔 배움보다 웃음이 무조건 먼저예요.\n\n힘든 월요일 끝에 라면 한 그릇 들고 큰 소리로 웃는 것만 한 게 없어요. 한마디로, 드라마는 제 잠을 훔치고, 다큐는 제 뇌를 채우고, 예능은 제 영혼을 치유해요.", "struct": [["1️⃣ 선택", "예능 승리, no contest"], ["2️⃣ 핵심", "뇌 스위치 끄기"], ["3️⃣ 대비", "드라마 = 11시 룰 공격"], ["4️⃣ 양보", "다큐 훌륭, 그러나 야간 학교"], ["5️⃣ 명언", "잠 · 뇌 · 영혼 3단 대구"]], "scoring": [["3지선다 정석", "드라마 · 예능 · 다큐 셋 다 언급 후 하나 선택 — 인터넷 · 직업 취향 편과 같은 공식이라 이제 몸에 익었을 거예요 🔁 ✅"], ["탈락 사유 유머", "드라마는 11시 룰 공격, 다큐는 야간 학교 — 탈락 이유를 유머로 만들면 선택 이유가 두 배로 살아나요 😆 시리즈 룰 재활용까지 🔁"], ["장면 절정", "월요일 밤 라면 한 그릇과 폭소 — nothing beats 뒤에는 언제나 구체적인 장면 하나를 붙이세요 🔑 장면이 곧 근거예요"], ["3단 대구", "잠을 훔치고 · 뇌를 채우고 · 영혼을 치유한다 — 인터넷 취향 편 3단 대구의 TV 버전이에요 🔁 💬 시리즈 명언 공식의 완성형!"]], "expr": [["if I had to choose", "골라야 한다면", "3지선다 취향 도입 공식 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["switch my brain off", "뇌 스위치를 끄다", "돌발 인터넷 취향 편 재활용 🔁 ✨"], ["hilariously silly", "우스꽝스럽게 웃긴", "예능의 매력 압축 😆"], ["cliffhanger", "클리프행어, 궁금증 엔딩", "드라마 못 보는 이유 🎭"], ["a direct attack on ~", "~에 대한 직접 공격", "11시 룰 연결 유머 🔁 😆"], ["night school", "야간 학교", "다큐 = 숙제 계열 비유 🔁 🎓"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["heal my soul", "영혼을 치유하다", "3단 대구의 마지막 조각 💕"]], "audio": "audio/2_돌발/2-058 12. TV(Television)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-058 12. TV(Television)_취향.mp3"}, {"id": "2-059", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "과거 경험", "badge": "59 과거 경험", "enQ": "Tell me about a TV program you enjoyed watching when you were young. What was it about, and who did you watch it with? Why do you remember it?", "enA": "This reminds me of Sunday mornings when I was little. There was a cartoon block at nine, and my younger brother and I used to wake up early just for it — the only day we didn't need an alarm!\n\nBut here's the real memory: the weekly remote control war. He wanted robots, I wanted adventures, and we had exactly one TV. We'd wrestle over the remote, yell, negotiate — and guess what: we always ended up watching both, squeezed under one blanket, sharing a bowl of cereal. Mom's 'homework first!' from the kitchen was our closing credits.\n\nWhy do I remember it? Honestly, the cartoons were just okay. What I really remember is the warmth: the fighting, the blanket, the cereal. TV was just the excuse — the memory is us. We still tease each other about that remote!", "koQ": "어렸을 때 즐겨 봤던 TV 프로그램에 대해 말해주세요. 어떤 내용이었고, 누구와 함께 봤나요? 왜 그것이 기억에 남나요?", "koA": "어릴 적 일요일 아침이 떠오르네요. 9시에 만화 블록이 있었는데, 남동생과 저는 그것만을 위해 일찍 일어나곤 했어요. 알람이 필요 없는 유일한 날이었죠!\n\n근데 진짜 기억은 이거예요. 매주 벌어진 리모컨 전쟁이요. 동생은 로봇, 저는 모험물을 원했는데 TV는 딱 한 대였거든요. 리모컨을 두고 몸싸움하고, 소리 지르고, 협상했죠. 그런데 있잖아요, 결국엔 늘 둘 다 봤어요. 담요 하나에 껴 앉아서 시리얼 한 그릇을 나눠 먹으면서요. 부엌에서 들려오는 엄마의 숙제 먼저! 가 우리의 엔딩 크레딧이었죠.\n\n왜 기억에 남냐고요? 솔직히 만화는 그냥 그랬어요. 진짜 기억나는 건 온기예요. 싸움, 담요, 시리얼. TV는 핑계였고, 추억은 우리 남매죠. 지금도 그 리모컨 얘기로 서로 놀려요!", "struct": [["1️⃣ 도입", "일요일 9시 만화 블록"], ["2️⃣ 갈등", "로봇 vs 모험, TV 한 대"], ["3️⃣ 반전", "결국 담요 속 둘 다 시청"], ["4️⃣ 배경", "엄마의 숙제 먼저! 소리"], ["5️⃣ 마무리", "TV는 핑계, 추억은 남매"]], "scoring": [["기억의 재정의", "왜 기억에 남나 → 만화가 아니라 온기 때문. 질문을 한 번 뒤집는 답이 이 페이지의 격을 올려요 🔑 TV는 핑계였다는 한 줄이 핵심!"], ["남매 캐릭터", "냉장고 습격 남동생이 어린 시절 리모컨 전쟁 상대로 재등장해요 🔁 🎓 인물의 역사가 쌓일수록 시리즈가 진짜가 되죠"], ["소리 디테일", "부엌에서 들리는 숙제 먼저! — 엄마의 대사 한 줄이 그 시절 거실을 통째로 소환해요 💬 대사 인용은 회상의 특수효과예요"], ["현재 연결", "지금도 리모컨 얘기로 서로 놀린다는 마무리 — 과거의 경험을 현재로 잇는 시리즈 필승 패턴이에요 🔁 ✅"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["cartoon block", "만화 편성 블록", "일요일 아침 시대 소품 📖"], ["used to ~", "~하곤 했다", "어린 시절 회상 필수 문법 🔁 ✅"], ["remote control war", "리모컨 전쟁", "이 경험담의 심장 소재 🔥"], ["wrestle over ~", "~을 두고 몸싸움하다", "남매 싸움 생생 동사 😆"], ["end up ~ing", "결국 ~하게 되다", "반전 결말 필수 구문 ✅"], ["squeezed under one blanket", "담요 하나에 껴 앉아", "온기의 그림 한 장 💕"], ["closing credits", "엔딩 크레딧", "엄마 목소리 = 마무리 비유 ✨"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["warmth", "온기", "why remember의 정답 단어 😊"], ["tease", "놀리다", "현재로 잇는 마무리 동사 🔁"]], "audio": "audio/2_돌발/2-059 12. TV(Television)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-059 12. TV(Television)_과거 경험.mp3"}, {"id": "2-060", "cat": "unexpected", "catName": "돌발 질문", "num": 12, "topic": "TV", "topicEn": "Television", "type": "비교", "badge": "60 비교", "enQ": "Compare the way people watch TV today with the past. How have TV programs and watching habits changed with services like YouTube and Netflix? Tell me in detail.", "enA": "Back then, TV had a schedule and we obeyed it. Miss your show at eight? Gone — see you next week! The whole family gathered in the living room, we fought over the remote, and sat through every commercial like it was a national duty.\n\nThese days, it's a completely different story. With YouTube and Netflix, the schedule is us: we watch what we want, when we want, on whatever screen is closest. Binge-watching killed the weekly wait, algorithms replaced channel surfing, and 'did you watch it yet?' replaced 'did you see it last night?' Compared to the old days, it's way freer — but everyone watches alone now.\n\nI have to admit, I miss the living room crowd: one show, one couch, five opinions. TV got smarter, if you ask me — but watching got lonelier.", "koQ": "오늘날 사람들이 TV를 보는 방식과 과거를 비교해주세요. 유튜브나 넷플릭스 같은 서비스로 인해 TV 프로그램과 시청 습관은 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 TV에 편성표가 있었고 우리는 그걸 따랐어요. 8시 프로그램을 놓치면? 끝. 다음 주에 만나요! 온 가족이 거실에 모였고, 리모컨을 두고 싸웠고, 광고까지 국민 의무처럼 전부 앉아서 봤죠.\n\n요즘은 완전히 다른 이야기예요. 유튜브와 넷플릭스 덕분에 편성표는 우리 자신이 됐어요. 보고 싶은 걸, 보고 싶을 때, 제일 가까운 화면으로 보죠. 몰아보기가 일주일의 기다림을 없앴고, 알고리즘이 채널 돌리기를 대체했고, 어젯밤 그거 봤어?는 너 그거 아직 안 봤어?로 바뀌었어요. 예전과 비교하면 훨씬 자유롭죠. 다만 이제 모두가 혼자 봐요.\n\n인정할 건 인정해야죠. 거실의 북적임이 그리워요. 쇼 하나, 소파 하나, 의견 다섯. 제 생각에 TV는 더 똑똑해졌는데, 보는 일은 더 외로워졌어요.", "struct": [["1️⃣ 과거", "편성표 순종 · 거실 집합"], ["2️⃣ 장면", "광고까지 국민 의무 시청"], ["3️⃣ 현재", "유튜브 · 넷플릭스 · 몰아보기"], ["4️⃣ 대비", "자유로워진 만큼 혼자"], ["5️⃣ 마무리", "TV는 똑똑, 시청은 외로움"]], "scoring": [["주도권 프레임", "편성표가 우리를 지배 → 우리가 편성표가 됨. 주도권의 이동 하나로 TV의 역사가 정리돼요 ✅ 큰 비교는 프레임이 반이에요"], ["대사 대비", "어젯밤 그거 봤어? vs 너 아직 안 봤어? — 시대의 변화를 대사 한 쌍으로 보여주는 고급 기술이에요 💬 설명보다 대사가 강해요"], ["경험 편 연결", "거실 리모컨 전쟁과 온 가족 시청 — 바로 앞 경험 편 소재가 비교의 과거 파트로 그대로 이어져요 🔁 🎓 콤보 문제 대비 완벽!"], ["본질 마무리", "TV는 똑똑해졌지만 시청은 외로워졌다 — 기술 비교를 사람의 언어로 닫는 시리즈 공통 철학 마무리예요 💬 😊"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["obey the schedule", "편성표를 따르다", "본방 사수 시대 요약 ⏰"], ["fight over ~", "~을 두고 싸우다", "경험 편 리모컨 전쟁 재활용 🔁 😆"], ["sit through ~", "~을 끝까지 보다", "광고 시청 인내의 동사 ✅"], ["national duty", "국민 의무", "광고 시청 과장 유머 🎭"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["binge-watching", "몰아보기", "습관 편 binge의 명사형 🔁 🔥"], ["channel surfing", "채널 돌리기", "알고리즘과 대비되는 소품 🔑"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["way + 비교급", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-060 12. TV(Television)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-060 12. TV(Television)_비교.mp3"}, {"id": "2-061", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "묘사", "badge": "61 묘사", "enQ": "Describe the seasons in your country. What is the weather like in each season, and how clearly do the seasons change? Tell me in detail.", "enA": "That's an easy one — Korea is famous for its four distinct seasons, and trust me, they don't change quietly. Spring is short and sweet: cherry blossoms everywhere for about two weeks. Summer is hot, humid, and comes with a serious rainy season.\n\nThen comes my favorite: fall, with crisp air and an impossibly blue sky. And winter? Cold, dry, and windy — the season when the whole country zips up the same padded jackets. How clearly do they change? Honestly, my closet answers that question: I swap my entire wardrobe four times a year!\n\nThese days, for example, it's early fall — cool mornings, warm afternoons, perfect jogging weather. In short, Korean seasons are like four completely different countries taking turns — and that's pretty much the weather here.", "koQ": "당신의 나라의 계절을 묘사해주세요. 각 계절의 날씨는 어떻고, 계절 변화는 얼마나 뚜렷한가요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 한국은 뚜렷한 사계절로 유명한데, 정말이지 계절이 조용히 바뀌지 않아요. 봄은 짧고 달콤해요. 2주 정도 벚꽃이 사방에 피죠. 여름은 덥고 습하고, 본격적인 장마까지 함께 와요.\n\n그다음이 제 최애, 가을이에요. 바삭한 공기에 믿기 힘들 만큼 파란 하늘이죠. 겨울은요? 춥고 건조하고 바람 부는, 온 나라가 똑같은 패딩의 지퍼를 올리는 계절이에요. 계절 변화가 얼마나 뚜렷하냐고요? 솔직히 제 옷장이 그 질문에 답해요. 일 년에 네 번 옷장을 통째로 갈아엎거든요!\n\n예를 들어 요즘은 초가을이에요. 서늘한 아침, 따뜻한 오후, 완벽한 조깅 날씨죠. 요컨대 한국의 계절은 완전히 다른 네 나라가 번갈아 오는 것 같아요. 이게 한국 날씨예요.", "struct": [["1️⃣ 선언", "사계절, 조용히 안 바뀜"], ["2️⃣ 묘사", "벚꽃 봄 · 장마 여름"], ["3️⃣ 묘사2", "파란 가을 · 패딩 겨울"], ["4️⃣ 증거", "옷장 연 4회 갈아엎기"], ["5️⃣ 마무리", "네 나라가 번갈아 온다"]], "scoring": [["사계절 스케치", "봄 벚꽃 2주 · 여름 장마 · 가을 파란 하늘 · 겨울 패딩 — 계절마다 그림 하나씩만 붙이면 묘사가 완성돼요 ✅ 나열이 아니라 스케치예요"], ["옷장 증거", "얼마나 뚜렷한가에 옷장을 네 번 갈아엎는다로 답하는 게 이 페이지의 백미예요 🔑 추상적 질문엔 생활 증거가 정답이죠"], ["오늘 날씨 커버", "요즘은 초가을, 완벽한 조깅 날씨 — 오늘 날씨를 묻는 변형 질문까지 한 문장으로 대비해요 ✅ 묘사 두 문항을 한 페이지로 통합!"], ["비유 마무리", "네 나라가 번갈아 온다는 비유로 닫으면 사계절의 뚜렷함이 한 장면으로 남아요 ✨ 나라 규모 질문엔 비유 마무리가 정석이에요"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["four distinct seasons", "뚜렷한 사계절", "한국 날씨 소개 필수 표현 ✅"], ["humid", "습한", "한국 여름 한 단어 요약 🔥"], ["rainy season", "장마", "여름 묘사 필수 명사 ✅"], ["crisp", "바삭한, 상쾌한", "가을 공기 감각 형용사 ✨"], ["zip up", "지퍼를 올리다", "패딩 겨울 장면 동사, 패션 편 연결 🔁 😆"], ["My closet answers that.", "옷장이 답해준다", "뚜렷함을 증명하는 재치 답변 🔑"], ["swap", "갈아엎다, 교체하다", "옷장 교체 계절 증거 📏"], ["in short", "요컨대", "요약 신호어 ✅"], ["take turns", "번갈아 오다", "사계절 = 네 나라 비유 짝꿍 ✨"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-061 13. 날씨(Weather)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-061 13. 날씨(Weather)_묘사.mp3"}, {"id": "2-062", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "습관", "badge": "62 습관", "enQ": "How does the weather affect what you do? What do you usually do on rainy days or very hot days? Tell me how your daily routine changes with the weather.", "enA": "Honestly, the weather is my daily schedule manager — let me walk you through it. Every morning starts with the weather app, even before my first coffee. Sunny and cool? Everything goes as planned: evening jog, riverside walk, the usual.\n\nRainy days flip the script: the jog is cancelled, and by Korean law — well, almost — rain means kimchi pancakes! So I cook to the sound of rain and watch YouTube on my sofa. On very hot days, I become nocturnal: I hide indoors with iced americanos all day, and push my jog to a late-night walk by the river.\n\nBut here's my golden rule: weather can reschedule my plans, but it can't cancel them. Rain or heat, I just switch modes — indoor me, night me. That's pretty much how the sky runs my calendar, and it never gets old.", "koQ": "날씨는 당신이 하는 일에 어떤 영향을 주나요? 비 오는 날이나 아주 더운 날에는 주로 무엇을 하나요? 날씨에 따라 일과가 어떻게 달라지는지 말해주세요.", "koA": "솔직히 날씨는 제 일과 매니저예요. 차근차근 설명해드릴게요. 매일 아침은 첫 커피보다도 먼저 날씨 앱으로 시작해요. 맑고 선선하면 모든 게 계획대로죠. 저녁 조깅, 강변 산책, 늘 하던 대로요.\n\n비 오는 날엔 대본이 뒤집혀요. 조깅은 취소되고, 한국의 법칙상 — 뭐, 거의 법이죠 — 비는 곧 김치전이에요! 그래서 빗소리를 들으며 요리하고 소파에서 유튜브를 봐요. 아주 더운 날엔 저는 야행성이 돼요. 하루 종일 아아와 함께 실내에 숨어 있다가, 조깅을 늦은 밤 강변 산책으로 바꾸죠.\n\n그런데 저의 황금률이 있어요. 날씨는 제 계획을 미룰 수는 있지만 취소할 수는 없다는 거예요. 비가 오든 덥든 저는 모드만 바꿔요. 실내의 나, 밤의 나로요. 이게 하늘이 제 달력을 운영하는 방식이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "날씨 = 내 일과 매니저"], ["2️⃣ 맑음", "계획대로 — 조깅 · 산책"], ["3️⃣ 비", "조깅 취소 → 김치전 국룰"], ["4️⃣ 더위", "야행성 모드, 밤 산책 전환"], ["5️⃣ 규칙", "미루되 취소는 없다"]], "scoring": [["조건 분기", "맑음 → 기본 모드, 비 → 김치전 모드, 더위 → 야행성 모드. 날씨별 분기 구조가 이 질문의 정석 설계도예요 ✅"], ["K-문화 카드", "비 오는 날엔 김치전이 거의 법이라는 한 줄 — 문화 소개와 유머를 동시에 챙기는 최고의 소재예요 🍳 😆"], ["루틴 재활용", "저녁 조깅과 강변 산책이 날씨에 따라 변형되는 구조라, 시리즈 루틴이 그대로 재료가 돼요 🔁 🎓 새로 만들 것이 없죠"], ["철학 마무리", "날씨는 계획을 미루지만 취소하진 못한다 — 유연함과 꾸준함을 동시에 보여주는 golden rule 마무리예요 🔑 💬"]], "expr": [["schedule manager", "일과 매니저", "날씨 의인화 오프닝 비유 ✨"], ["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["as planned", "계획대로", "맑은 날 기본 모드 표현 ✅"], ["flip the script", "대본을 뒤집다", "비 오는 날 전환 신호 🎭"], ["kimchi pancakes", "김치전", "비 오는 날 국룰, K-문화 소개 🍳"], ["nocturnal", "야행성의", "더운 날 모드 한 단어 🌙"], ["push A to B", "A를 B로 미루다", "조깅 → 밤 산책 조정 동사 ⏰"], ["golden rule", "황금률", "습관 공식 단골 🔁 🔑"], ["reschedule", "일정을 다시 잡다", "미루되 취소는 없다의 핵심 ✅"], ["switch modes", "모드를 바꾸다", "여가 편 두 모드 프레임 재활용 🔁 🧩"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-062 13. 날씨(Weather)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-062 13. 날씨(Weather)_습관.mp3"}, {"id": "2-063", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "취향", "badge": "63 취향", "enQ": "Which season do you like the most, and why? What do you enjoy doing during that season? Tell me the reasons in detail.", "enA": "If I had to choose, fall wins — no contest. For me, it's all about that crisp air and the impossibly blue sky. Honestly, I think fall is the season the sky shows off.\n\nWhat do I enjoy? Everything I already love, but in its best version: jogging along the river without melting or freezing, picnics with my best friend under the changing leaves, and iced americano weather that finally makes sense. I'd take October over August any day. Don't get me wrong — summer has the beach and winter has that first-snow magic. But fall asks for nothing and gives everything.\n\nNothing beats an evening run through the golden trees with my playlist on. In a nutshell: spring is pretty, summer is exciting, winter is cozy — but fall is breathable. And breathing well is my favorite hobby!", "koQ": "어떤 계절을 가장 좋아하고, 그 이유는 무엇인가요? 그 계절에 무엇을 하는 것을 즐기나요? 그 이유를 자세히 말해주세요.", "koA": "골라야 한다면 가을 승리예요. 고민할 것도 없죠. 저한테 핵심은 그 바삭한 공기와 믿기 힘들 만큼 파란 하늘이에요. 솔직히 가을은 하늘이 실력 자랑하는 계절 같아요.\n\n뭘 즐기냐고요? 제가 이미 사랑하는 모든 것들의 최고 버전이요. 녹지도 얼지도 않고 강변을 조깅하고, 물드는 나뭇잎 아래서 절친과 피크닉을 하고, 드디어 아아가 어울리는 날씨죠. 8월보다는 무조건 10월이에요. 오해는 마세요. 여름엔 바다가 있고 겨울엔 첫눈의 마법이 있죠. 근데 가을은 아무것도 요구하지 않으면서 전부 다 줘요.\n\n플레이리스트 틀고 황금빛 나무 사이를 달리는 저녁 조깅만 한 게 없어요. 한마디로, 봄은 예쁘고 여름은 신나고 겨울은 포근하지만, 가을은 숨쉬기 좋아요. 그리고 숨 잘 쉬는 게 제 최애 취미거든요!", "struct": [["1️⃣ 선택", "가을 승리, no contest"], ["2️⃣ 핵심", "바삭한 공기 · 파란 하늘"], ["3️⃣ 활동", "조깅 · 피크닉 최고 버전"], ["4️⃣ 양보", "여름 바다 · 겨울 첫눈 인정"], ["5️⃣ 명언", "가을은 숨쉬기 좋은 계절"]], "scoring": [["최고 버전 프레임", "가을에 새로운 걸 하는 게 아니라, 하던 것들의 최고 버전을 즐긴다는 프레임 — 시리즈 루틴이 전부 근거가 돼요 🔁 ✅"], ["의인화 유머", "가을은 하늘이 실력 자랑하는 계절, 아무것도 요구하지 않고 전부 준다 — 계절 의인화 두 방이 답변의 개성이에요 ✨"], ["4계절 정리", "봄은 예쁘고 여름은 신나고 겨울은 포근하지만 — 나머지 계절을 한 단어씩 정리하고 가을만 문장을 주는 구조예요 🔑"], ["숨쉬기 마무리", "가을은 breathable, 그리고 숨 잘 쉬는 게 취미 — 엉뚱한 듯 사랑스러운 마무리가 웃음 포인트예요 😆 💬"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["show off", "실력 자랑하다", "가을 하늘 의인화 유머 ✨"], ["best version", "최고 버전", "좋아하는 것들의 업그레이드 프레임 ✅"], ["without melting or freezing", "녹지도 얼지도 않고", "가을 조깅의 이유 대구 😆"], ["A over B any day", "B보다 무조건 A", "10월 vs 8월 취향 공식 🔁"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["asks for nothing, gives everything", "요구 없이 다 준다", "가을 예찬 명언 재료 💬"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["breathable", "숨쉬기 좋은", "가을을 한 단어로 정의 🔑"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-063 13. 날씨(Weather)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-063 13. 날씨(Weather)_취향.mp3"}, {"id": "2-064", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "과거 경험", "badge": "64 과거 경험", "enQ": "Tell me about a memorable experience you had because of severe weather. What was the situation, and how did you handle it?", "enA": "This reminds me of last winter's snowstorm. I left work at six as usual, and out of nowhere, the snow got so heavy that my bus simply... never came. The app said 'delayed' for forty minutes straight, and the taxi lines were hopeless.\n\nSo I made a decision: I zipped up my padded jacket and just walked — a full hour to my place. And guess what: somewhere along the way, the annoyance melted. The whole neighborhood had turned into a snow globe — quiet streets, orange lamps, my footsteps making that perfect crunch. I even called my mom just to describe it!\n\nHow did I handle it? Warm clothes, slow steps, and a change of attitude — that's all it took. It worked out fine, and since then, I secretly hope for one big snow every winter. Some delays are gifts, honestly.", "koQ": "궂은 날씨 때문에 겪은 기억에 남는 경험에 대해 말해주세요. 어떤 상황이었고, 어떻게 대처했나요?", "koA": "작년 겨울 폭설이 떠오르네요. 여느 때처럼 6시에 퇴근했는데, 난데없이 눈이 너무 심해져서 버스가 그냥... 안 왔어요. 앱은 40분 내내 지연이라고만 떠 있고, 택시 줄은 가망이 없었죠.\n\n그래서 결단을 내렸어요. 패딩 지퍼를 끝까지 올리고 그냥 걸었어요. 집까지 꼬박 한 시간을요. 그런데 있잖아요, 걷다 보니 어느 순간 짜증이 녹아버렸어요. 온 동네가 스노우볼로 변해 있었거든요. 조용한 거리, 주황빛 가로등, 뽀드득 소리를 내는 제 발자국까지요. 이 풍경을 설명하려고 엄마한테 전화까지 걸었다니까요!\n\n어떻게 대처했냐고요? 따뜻한 옷, 느린 걸음, 그리고 태도 바꾸기. 그게 전부였어요. 결국 다 잘 풀렸고, 그 뒤로는 매년 겨울 큰 눈 한 번을 남몰래 기다려요. 어떤 지연은 선물이더라고요, 진짜로.", "struct": [["1️⃣ 상황", "폭설, 버스 실종 40분"], ["2️⃣ 결단", "패딩 지퍼 올리고 도보 1시간"], ["3️⃣ 반전", "짜증 → 동네가 스노우볼"], ["4️⃣ 감정", "엄마에게 풍경 중계 전화"], ["5️⃣ 교훈", "어떤 지연은 선물이다"]], "scoring": [["대처 3종", "어떻게 대처했나 → 따뜻한 옷, 느린 걸음, 태도 바꾸기. 물리적 대처 둘 + 마음 대처 하나가 완벽한 조합이에요 🔑"], ["감각 반전", "스노우볼 동네, 주황 가로등, 뽀드득 발소리 — 재난이 풍경으로 바뀌는 감각 묘사가 이 이야기의 심장이에요 ✨ 🎵"], ["엄마 전화 연결", "풍경을 중계하려고 엄마에게 전화하는 디테일 — 일요일 통화 캐릭터가 눈 오는 날에도 이어져요 🔁 💕"], ["교훈 명언", "어떤 지연은 선물이다 — 궂은 날씨 경험을 명언으로 닫으면 불평 대신 성숙함이 남아요 💬 🎓 since then 소원까지 귀엽죠"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["snowstorm", "폭설", "severe weather 대표 소재 ✅"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["hopeless", "가망 없는", "택시 줄 상황 한 단어 😆"], ["zip up", "지퍼를 올리다", "날씨 묘사 편 패딩 동사 재활용 🔁 💪"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["snow globe", "스노우볼", "눈 내린 동네 한 방 비유 ✨"], ["crunch", "뽀드득 (소리)", "눈길 감각 디테일 소리 🎵"], ["a change of attitude", "태도 바꾸기", "how did you handle의 핵심 답 🔑"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["Some delays are gifts.", "어떤 지연은 선물", "이 페이지의 교훈 명언 💬"]], "audio": "audio/2_돌발/2-064 13. 날씨(Weather)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-064 13. 날씨(Weather)_과거 경험.mp3"}, {"id": "2-065", "cat": "unexpected", "catName": "돌발 질문", "num": 13, "topic": "날씨", "topicEn": "Weather", "type": "비교", "badge": "65 비교", "enQ": "Compare the weather of your childhood with the weather these days. How has the climate in your country changed over time? Tell me about the differences.", "enA": "Back then, when I was a kid, the four seasons used to arrive like clockwork — each one got a fair three months. Spring meant long picnic weeks, and winter meant real snow: my brother and I built snowmen that survived for days.\n\nThese days, it's a completely different story. Spring and fall feel like guest appearances — blink and they're gone. Summer has become the main character: longer, hotter, with monsoon rains that fall all at once instead of softly. Compared to my childhood, the seasons are way more extreme, and honestly, that first snow feels rarer every year.\n\nI have to admit, this is one comparison where the past simply wins. We used to have four seasons taking turns; now it feels like two seasons fighting. I really miss those three-day snowmen, if you ask me.", "koQ": "어린 시절의 날씨와 요즘 날씨를 비교해주세요. 시간이 지나며 당신의 나라의 기후는 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 제가 어릴 땐 사계절이 시계처럼 정확하게 도착하곤 했어요. 각자 공평하게 석 달씩 가졌죠. 봄은 긴 소풍의 계절이었고, 겨울엔 진짜 눈이 왔어요. 남동생과 제가 만든 눈사람이 며칠씩 살아남았다니까요.\n\n요즘은 완전히 다른 이야기예요. 봄과 가을은 카메오 출연 같아요. 눈 깜빡하면 사라지죠. 여름이 주인공이 됐어요. 더 길고, 더 덥고, 부드럽게 내리는 대신 한꺼번에 쏟아지는 장마와 함께요. 어린 시절과 비교하면 계절이 훨씬 극단적이에요. 그리고 솔직히 첫눈이 해마다 더 귀해지는 느낌이에요.\n\n인정할 건 인정해야죠. 이건 과거가 그냥 이기는 비교예요. 예전엔 네 계절이 번갈아 왔는데, 지금은 두 계절이 싸우는 것 같아요. 제 생각엔, 그 3일짜리 눈사람이 정말 그리워요.", "struct": [["1️⃣ 과거", "시계처럼 공평한 사계절"], ["2️⃣ 장면", "며칠 살아남던 눈사람"], ["3️⃣ 현재", "봄가을 카메오 · 여름 주인공"], ["4️⃣ 대비", "넷의 순환 vs 둘의 싸움"], ["5️⃣ 마무리", "3일짜리 눈사람 그리움"]], "scoring": [["배역 프레임", "봄가을은 카메오, 여름은 주인공 — 기후 변화를 드라마 배역으로 번역하면 어려운 주제가 쉬워져요 🎭 ✨"], ["눈사람 증거", "며칠 살아남던 눈사람 vs 귀해진 첫눈 — 기후 변화를 어린 시절 소품 하나로 증명해요 🔑 남동생 캐릭터 재활용까지 🔁"], ["솔직한 판정", "이건 과거가 그냥 이기는 비교라는 선언 — 모든 비교가 균형일 필요는 없어요. 솔직한 판정도 IH다운 태도예요 ✅"], ["숫자 대비", "넷이 번갈아 오다 → 둘이 싸운다. 계절의 수를 숫자로 대비하면 변화가 한 문장에 담겨요 📊 💬"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["like clockwork", "시계처럼 정확하게", "약속 편 재활용, 계절 버전 🔁 ⏰"], ["guest appearance", "카메오 출연", "짧아진 봄가을 비유 🎭"], ["main character", "주인공", "길어진 여름 비유 짝꿍 🔥"], ["monsoon rains", "장마", "요즘 여름 묘사 필수 명사 ✅"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["way more ~", "훨씬 더 ~", "비교 강조 공식, 서베이 개근 🔁 💪"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"], ["the past simply wins", "과거의 완승", "기후 비교의 솔직한 한 줄 💬"]], "audio": "audio/2_돌발/2-065 13. 날씨(Weather)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-065 13. 날씨(Weather)_비교.mp3"}, {"id": "2-066", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "묘사", "badge": "66 묘사", "enQ": "Describe the geography of your country. Are there many mountains, rivers, or beaches? What does the land look like? Tell me in detail.", "enA": "That's an easy one — Korea is basically a mountain kingdom by the sea. About seventy percent of the land is mountains, and the country is a peninsula, so we're surrounded by water on three sides. Talk about having it all!\n\nPicture this: no matter where you stand in Seoul, you can see a mountain somewhere on the horizon. Rivers cut right through our biggest cities — the Han River in Seoul is so wide it feels like a sea. And the coasts? Each one has its own personality: the east has deep blue water and sunrises, the west has mudflats and sunsets.\n\nThat's why weekend hiking is practically a national sport here — grandmas in hiking gear will pass you on any trail, trust me. In short: mountains behind you, a river beside you, the sea around you — that's pretty much Korea.", "koQ": "당신의 나라의 지형을 묘사해주세요. 산, 강, 해변이 많이 있나요? 국토는 어떤 모습인가요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 한국은 한마디로 바다 옆의 산 왕국이에요. 국토의 70% 정도가 산이고, 반도라서 삼면이 물로 둘러싸여 있죠. 다 가진 나라랄까요!\n\n상상해보세요. 서울 어디에 서 있든 지평선 어딘가엔 산이 보여요. 강은 대도시 한가운데를 가로지르죠. 서울의 한강은 얼마나 넓은지 바다처럼 느껴질 정도예요. 해안은요? 저마다 성격이 있어요. 동쪽은 짙푸른 물과 일출, 서쪽은 갯벌과 노을이죠.\n\n그래서 주말 등산이 여기선 사실상 국민 스포츠예요. 어느 등산로에서든 등산 장비를 갖춘 할머니들이 저를 앞질러 가신다니까요, 진짜로요. 요컨대, 뒤에는 산, 옆에는 강, 주위엔 바다. 이게 한국이에요.", "struct": [["1️⃣ 선언", "바다 옆의 산 왕국"], ["2️⃣ 숫자", "산 70% · 삼면이 바다"], ["3️⃣ 묘사", "어디서든 산 · 바다 같은 한강"], ["4️⃣ 디테일", "동해 일출 vs 서해 노을"], ["5️⃣ 마무리", "산 · 강 · 바다 삼종 세트"]], "scoring": [["숫자 두 방", "산 70%, 삼면이 바다 — 숫자 두 개면 나라 지형 묘사의 뼈대가 완성돼요 📊 큰 주제일수록 숫자가 정리해줘요"], ["바다 성격 부여", "동해는 일출, 서해는 갯벌과 노을 — 해안마다 성격을 부여하면 단순 나열이 캐릭터 소개가 돼요 🎭 ✨"], ["할머니 디테일", "등산 장비 할머니가 나를 앞질러 간다 — 등산 = 국민 스포츠를 증명하는 유머 한 장면이에요 😆 관찰 디테일의 힘!"], ["위치 마무리", "뒤에는 산, 옆에는 강, 주위엔 바다 — 방향 3종 마무리가 지형 전체를 한 문장에 담아요 🗺️ 💬 활동 질문 변형까지 커버되죠"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["mountain kingdom", "산 왕국", "한국 지형 한 방 요약 비유 ✨"], ["peninsula", "반도", "지형 주제 필수 명사 ✅"], ["surrounded by ~", "~으로 둘러싸인", "삼면이 바다 필수 구문 🔑"], ["Talk about ~!", "~이 따로 없다!", "감탄 구어체 양념 😆"], ["Picture this:", "상상해보세요", "여가 편 재활용, 묘사 오프너 🔁 ✨"], ["cut through ~", "~을 가로지르다", "강과 도시 관계 동사 🗺️"], ["personality", "성격, 개성", "동해 vs 서해 의인화 🎭"], ["mudflat", "갯벌", "서해 디테일 어휘 ✅"], ["national sport", "국민 스포츠", "등산 문화 소개 유머 🏃"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-066 14. 지형(Terrain)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-066 14. 지형(Terrain)_묘사.mp3"}, {"id": "2-067", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "습관", "badge": "67 습관", "enQ": "What activities do you personally enjoy that are related to the geography around you? Do you go hiking or visit a nearby river or park? Tell me what you usually do.", "enA": "I'm lucky — my geography is basically my gym. Let me walk you through it. My go-to is the Han River, ten minutes away: evening jogs on weekdays, and on good weekends, long walks with coffee in hand. The river handles about ninety percent of my outdoor life!\n\nThe other ten percent belongs to the small mountain behind my neighborhood. Once or twice a month, usually on Sunday mornings, I take the gentle trail up — it's less hiking, more walking with a reward: the city view from the top never disappoints. I always send a photo to my mom from up there.\n\nAnd every season or so, I make a run for the east coast to see the actual sea. So river weekly, mountain monthly, sea quarterly — my golden rule of geography! That's pretty much my routine, and it never gets old.", "koQ": "주변 지형과 관련해 당신이 즐기는 활동은 무엇인가요? 하이킹을 가거나 근처 강이나 공원에 가나요? 주로 무엇을 하는지 말해주세요.", "koA": "전 운이 좋아요. 주변 지형이 사실상 제 헬스장이거든요. 차근차근 보여드릴게요. 제 단골은 10분 거리의 한강이에요. 평일엔 저녁 조깅, 날 좋은 주말엔 커피 들고 긴 산책을 하죠. 제 야외 생활의 90%는 강이 책임져요!\n\n나머지 10%는 동네 뒷산 몫이에요. 한 달에 한두 번, 주로 일요일 아침에 완만한 등산로로 올라가요. 등산이라기보단 보상이 있는 산책이죠. 정상에서 보는 도시 뷰는 절대 실망시키지 않거든요. 거기서 엄마한테 꼭 사진을 보내요.\n\n그리고 계절에 한 번쯤은 진짜 바다를 보러 동해안으로 달려가요. 그러니까 강은 매주, 산은 매달, 바다는 분기별. 저의 지형 황금률이에요! 이게 제 루틴이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 선언", "지형 = 나의 헬스장"], ["2️⃣ 강", "한강 90% — 조깅 · 산책"], ["3️⃣ 산", "뒷산 10% — 보상 산책"], ["4️⃣ 바다", "분기별 동해안 원정"], ["5️⃣ 마무리", "매주 · 매달 · 분기 공식"]], "scoring": [["퍼센트 분배", "강 90% · 산 10% · 바다 분기별 — 활동을 비율과 빈도로 정리하면 습관 질문의 구조가 저절로 서요 📊 ✅"], ["질문 예시 회수", "질문이 hiking과 river를 예시로 줬으니 정확히 그 둘로 답하되, 나만의 비율을 붙이는 게 요령이에요 🔑 예시는 힌트예요"], ["무대 총출동", "한강 조깅 · 커피 산책 · 엄마 사진 전송 — 시리즈 페르소나의 야외 생활이 지형 답변의 재료로 총출동해요 🔁 🎓"], ["빈도 마무리", "매주 강, 매달 산, 분기별 바다 — weekly · monthly · quarterly 빈도 3종 마무리가 어휘력까지 챙겨줘요 📏 💬"]], "expr": [["My geography is my gym.", "지형이 곧 헬스장", "이 페이지의 오프닝 비유 ✨"], ["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["go-to", "단골, 최우선 선택", "한강 = 단골 장소 표현 🔁 🗺️"], ["handle", "책임지다, 담당하다", "강이 야외 생활 90% 담당 💪"], ["gentle trail", "완만한 등산로", "가벼운 등산 묘사 어휘 ✅"], ["less A, more B", "A라기보단 B", "등산 아닌 보상 산책 구문 🔑"], ["never disappoints", "절대 실망시키지 않는다", "정상 뷰 보증 표현 ✨"], ["make a run for ~", "~으로 달려가다", "바다 원정 캐주얼 동사 🏃"], ["quarterly", "분기마다", "빈도 어휘 레벨업 📊"], ["golden rule", "황금률", "습관 공식 단골 🔁 🔑"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-067 14. 지형(Terrain)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-067 14. 지형(Terrain)_습관.mp3"}, {"id": "2-068", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "취향", "badge": "68 취향", "enQ": "Which type of place do you prefer to visit - the mountains, the sea, or the city? Why do you like that kind of place? Tell me the reasons.", "enA": "If I had to choose among the three, the sea wins — no contest. For me, it's all about that first moment when the horizon opens up: my shoulders drop, my breath slows, and my problems suddenly look very, very small.\n\nI'd pick the sea over the other two any day. Here's my logic: the city is where I live, so it can't be an escape. And mountains? Don't get me wrong — the view from the top is amazing, but the sea gives me the reward without the uphill invoice! Plus, waves are nature's noise cancelling — better than my earbuds, and I love my earbuds.\n\nNothing beats standing on an empty winter beach, coffee in hand, with that endless blue in front of me. In a nutshell: you climb the mountains, you survive the city — but the sea just hugs you back.", "koQ": "산, 바다, 도시 중 어떤 곳에 가는 것을 선호하나요? 왜 그런 장소를 좋아하나요? 그 이유를 말해주세요.", "koA": "셋 중에 골라야 한다면 바다 승리예요. 고민할 것도 없죠. 저한테 핵심은 수평선이 탁 열리는 그 첫 순간이에요. 어깨가 내려가고, 숨이 느려지고, 제 고민들이 갑자기 아주아주 작아 보이거든요.\n\n다른 둘보다는 무조건 바다예요. 제 논리는 이래요. 도시는 제가 사는 곳이라 탈출이 될 수 없어요. 그리고 산은요? 오해는 마세요. 정상에서 보는 풍경은 굉장하죠. 근데 바다는 오르막 청구서 없이 보상을 주잖아요! 게다가 파도는 자연의 노이즈 캔슬링이에요. 제 이어폰보다 나아요. 저 이어폰 사랑하는 사람인데도요.\n\n텅 빈 겨울 바다에 커피 들고 서서 끝없는 파랑을 마주하는 것만 한 게 없어요. 한마디로, 산은 올라가고 도시는 견디는 거지만, 바다는 그냥 안아줘요.", "struct": [["1️⃣ 선택", "바다 승리, no contest"], ["2️⃣ 핵심", "수평선에 작아지는 고민"], ["3️⃣ 논리", "도시 = 일상, 산 = 오르막"], ["4️⃣ 비유", "파도 = 자연의 노캔"], ["5️⃣ 명언", "바다는 그냥 안아준다"]], "scoring": [["몸의 반응", "어깨가 내려가고 숨이 느려진다 — 바다가 좋은 이유를 몸의 반응으로 보여주면 설명이 필요 없어요 ✨ 감각이 곧 근거예요"], ["탈락 사유 논리", "도시는 사는 곳이라 탈출 불가, 산은 오르막 청구서 — 두 선택지의 탈락 사유가 논리와 유머를 동시에 잡아요 😆 🔑"], ["노캔 연결", "파도는 자연의 노이즈 캔슬링 — 기술 취향 편 이어폰 최애 설정과 이어지는 고급 재활용이에요 🔁 🎓"], ["3단 대구", "산은 올라가고, 도시는 견디고, 바다는 안아준다 — 동사 세 개의 대구 마무리는 통째로 외울 가치가 있어요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "3지선다 취향 도입 공식 🔁 🔑"], ["no contest", "고민할 것도 없이", "확신 선언 공식 🔁 🔥"], ["the horizon opens up", "수평선이 열리다", "바다 첫 순간 묘사 ✨"], ["my shoulders drop", "어깨가 내려가다", "이완을 몸으로 보여주는 묘사 😊"], ["A over B any day", "B보다 무조건 A", "취향 공식, 서베이 개근 🔁 ✅"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["without the uphill invoice", "오르막 청구서 없이", "산 대비 바다 장점 유머 😆"], ["nature's noise cancelling", "자연의 노캔", "기술 취향 편 이어폰 연결 🔁 🎵"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["hug you back", "안아주다", "3단 대구의 마지막 조각 💕"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-068 14. 지형(Terrain)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-068 14. 지형(Terrain)_취향.mp3"}, {"id": "2-069", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "과거 경험", "badge": "69 과거 경험", "enQ": "Tell me about a special landscape you have seen in your country. Where was it, and what did it look like? Describe a memorable visit to that place.", "enA": "This reminds me of the most special landscape I've ever seen: the New Year sunrise at Gangneung, on the east coast. It was that famous midnight trip — my best friend called at twelve, and by dawn we were standing on a freezing beach with thousands of strangers.\n\nThe landscape itself? Unforgettable. The horizon was a straight, endless line between dark water and pale sky. Then, out of nowhere, this tiny orange dot appeared — and the whole beach held its breath. In two minutes, the sea turned from black to silver to gold. People counted down like it was midnight again, and someone's grandma shouted 'Happy New Year!' to the ocean.\n\nI've seen prettier photos, honestly — but no photo does justice to that moment. It worked out to be the best spontaneous decision of my life, and since then, the east sea horizon is my definition of 'special landscape'.", "koQ": "당신의 나라에서 본 특별한 지형에 대해 말해주세요. 어디였고, 어떤 모습이었나요? 그곳을 방문했던 기억에 남는 일을 묘사해주세요.", "koA": "제가 본 가장 특별한 지형이 떠오르네요. 동해안 강릉의 새해 일출이에요. 그 유명한 자정 여행이었죠. 절친이 12시에 전화했고, 동틀 무렵 우리는 수천 명의 낯선 사람들과 함께 꽁꽁 언 해변에 서 있었어요.\n\n풍경 자체는요? 잊을 수가 없어요. 수평선이 어두운 물과 옅은 하늘 사이의 곧고 끝없는 선이었어요. 그런데 난데없이 작은 주황 점이 나타났고, 해변 전체가 숨을 죽였죠. 2분 만에 바다가 검정에서 은빛으로, 금빛으로 변했어요. 사람들은 자정처럼 카운트다운을 했고, 어느 할머니는 바다를 향해 새해 복 많이 받으라고 외치셨어요.\n\n솔직히 더 예쁜 사진은 많이 봤어요. 근데 어떤 사진도 그 순간을 담아내진 못해요. 제 인생 최고의 즉흥 결정이 됐고, 그 뒤로 동해 수평선은 저에게 특별한 지형의 정의가 됐어요.", "struct": [["1️⃣ 선언", "강릉 새해 일출 수평선"], ["2️⃣ 배경", "자정 전화 → 새벽 해변"], ["3️⃣ 절정", "주황 점 → 검정 · 은 · 금"], ["4️⃣ 장면", "카운트다운 · 할머니 외침"], ["5️⃣ 마무리", "사진이 못 담는 순간"]], "scoring": [["3번째 각도", "강릉 일출 여행은 전화 편(출발 전화)에 이어 이번엔 일출 장면 자체로 — 같은 여행을 각도만 바꿔 세 번째 재활용해요 🔁 🎓"], ["색 3단 기술", "검정 → 은빛 → 금빛. 색의 변화 세 단계로 2분의 일출이 슬로모션처럼 묘사돼요 🌅 색 나열은 풍경 묘사의 필살기예요"], ["군중 디테일", "해변 전체가 숨죽이고, 할머니가 바다에 새해 인사를 외치는 장면 — 낯선 사람들이 풍경의 일부가 되는 고급 묘사예요 💓"], ["사진 마무리", "어떤 사진도 그 순간을 담지 못한다(do justice to) — 실물 예찬 마무리가 특별함을 최종 증명해요 💬 ✨"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["unforgettable", "잊을 수 없는", "특별함 한 단어 선언 ✨"], ["horizon", "수평선", "지형 주제 필수 명사 ✅"], ["out of nowhere", "난데없이", "반전 공식, 해 뜨는 순간까지 🔁 🎭"], ["hold its breath", "숨을 죽이다", "해변 전체 의인화 절정 💓"], ["black to silver to gold", "검정 → 은 → 금", "색 3단 변화 묘사 기술 🌅"], ["count down", "카운트다운하다", "새해 일출 장면 디테일 ⏰"], ["do justice to ~", "~을 제대로 담아내다", "사진 vs 실물 비교 고급 표현 🔑"], ["spontaneous", "즉흥적인", "자정 결정의 성격 한 단어 🔥"], ["work out", "~한 결과가 되다", "경험 마무리 공식 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식 🔁 💕"]], "audio": "audio/2_돌발/2-069 14. 지형(Terrain)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-069 14. 지형(Terrain)_과거 경험.mp3"}, {"id": "2-070", "cat": "unexpected", "catName": "돌발 질문", "num": 14, "topic": "지형", "topicEn": "Terrain", "type": "비교", "badge": "70 비교", "enQ": "Compare two different regions of your country. How are their geographical features different, and how do people live differently in each area? Tell me in detail.", "enA": "Let me compare the two regions I know best: Seoul and Gangneung. Seoul, where I live, is a basin city — a river cutting through the middle, mountains standing guard around it, and every square meter packed with buildings and people.\n\nGangneung, my favorite escape on the east coast, is a completely different story: the mountains suddenly end, and the land opens flat into the sea. Compared to Seoul's skyline, Gangneung's horizon is just... a line. And the lifestyle follows the land: Seoul people move fast, always checking the subway timer; Gangneung people move with the weather — surfers wait for waves, cafe owners chat with strangers, and nobody seems to run.\n\nI have to admit, each one fixes the other. When Seoul wears me out, Gangneung recharges me. My friend and I have a saying: Seoul runs on schedules, Gangneung runs on sunrises. Two lands, two clocks — one country.", "koQ": "당신의 나라의 서로 다른 두 지역을 비교해주세요. 지형적 특징이 어떻게 다르고, 각 지역 사람들의 생활은 어떻게 다른가요? 자세히 말해주세요.", "koA": "제가 가장 잘 아는 두 지역을 비교해볼게요. 서울과 강릉이요. 제가 사는 서울은 분지 도시예요. 강이 한가운데를 가로지르고, 산들이 주위를 지키고 서 있고, 1평방미터마다 건물과 사람이 꽉 차 있죠.\n\n제 최애 탈출지인 동해안의 강릉은 완전히 다른 이야기예요. 산이 갑자기 끝나면서 땅이 바다를 향해 평평하게 열려요. 서울의 스카이라인과 비교하면 강릉의 수평선은 그냥... 선 하나예요. 그리고 생활은 땅을 따라가요. 서울 사람들은 지하철 시간을 확인하며 빠르게 움직이고, 강릉 사람들은 날씨와 함께 움직여요. 서퍼들은 파도를 기다리고, 카페 사장님들은 낯선 이와 수다를 떨고, 아무도 뛰지 않는 것 같아요.\n\n인정할 건 인정해야죠. 둘은 서로를 고쳐줘요. 서울이 절 지치게 하면 강릉이 충전해주죠. 절친과 저에겐 이런 말이 있어요. 서울은 일정으로 돌아가고, 강릉은 일출로 돌아간다. 두 개의 땅, 두 개의 시계, 하나의 나라예요.", "struct": [["1️⃣ 선택", "서울 vs 강릉, 아는 두 곳"], ["2️⃣ 서울", "분지 · 한강 · 빽빽함"], ["3️⃣ 강릉", "산 끝 · 평지 · 수평선"], ["4️⃣ 생활", "지하철 시계 vs 파도 시계"], ["5️⃣ 마무리", "일정으로 vs 일출로"]], "scoring": [["아는 곳 원칙", "두 지역 비교는 사는 곳 + 최애 탈출지로 — 서울과 강릉 모두 시리즈 단골 무대라 디테일이 저절로 나와요 🔁 🎓"], ["명제 한 줄", "생활은 땅을 따라간다(The lifestyle follows the land) — 지형과 생활을 잇는 명제 하나가 질문 두 축을 연결해요 🔑"], ["사람 장면 대비", "지하철 시간 확인 vs 파도 기다리는 서퍼 — 지역 비교는 통계가 아니라 사람의 장면으로 붙이는 거예요 🎭 ✨"], ["시계 명언", "서울은 일정으로, 강릉은 일출로 돌아간다 — run on 대구에 두 땅, 두 시계, 한 나라 리듬 마무리까지 💬 🎓"]], "expr": [["basin", "분지", "서울 지형 한 단어 요약 ✅"], ["stand guard", "지키고 서 있다", "산 의인화 묘사 동사 🎭"], ["packed with ~", "~으로 꽉 찬", "기술 취향 편 packed 재활용 🔁 📏"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식의 지역 버전 🔁 💓"], ["open flat into ~", "~을 향해 평평하게 열리다", "강릉 지형 묘사 구문 🗺️"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["The lifestyle follows the land.", "생활은 땅을 따라간다", "지형 → 생활 연결 명제 🔑"], ["wear out", "지치게 하다", "서울살이 한 단어 동사 😆"], ["recharge", "재충전하다", "여가 편 재활용, 강릉의 역할 🔁 🔋"], ["run on ~", "~으로 돌아가다", "기술 편 재활용, 명언의 뼈대 🔁 ✨"], ["I have to admit", "인정할 수밖에 없다", "균형 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-070 14. 지형(Terrain)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-070 14. 지형(Terrain)_비교.mp3"}, {"id": "2-071", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "묘사", "badge": "71 묘사", "enQ": "Describe a beach you often go to or know well. Where is it located, and what does it look like? What can you see and do there? Tell me in detail.", "enA": "That's an easy one — my beach is in Gangneung, on the east coast, about two and a half hours from Seoul. It's my favorite escape, and by now I know it like my own neighborhood.\n\nWhat does it look like? A long stretch of pale sand, a pine forest standing right behind it like a green wall, and that famous deep blue East Sea water. The best part is the coffee street along the shore — Gangneung is Korea's coffee city, so you can literally hold a fresh hand-drip while your feet touch the sand.\n\nWhat can you do? Everything slow: sunrise watching, long walks with the waves chasing your shoes, fresh seafood at the market — and my personal ritual, beach ramyeon! In short, it's a beach that pairs the sea with coffee — that's pretty much my happy place by the water.", "koQ": "자주 가거나 잘 아는 해변을 묘사해주세요. 어디에 위치해 있고, 어떻게 생겼나요? 그곳에서 무엇을 보고 무엇을 할 수 있나요? 자세히 말해주세요.", "koA": "쉬운 질문이네요. 제 해변은 동해안 강릉에 있어요. 서울에서 두 시간 반 정도 거리죠. 제 최애 탈출지라서 이젠 우리 동네만큼 잘 알아요.\n\n어떻게 생겼냐면, 길게 뻗은 하얀 모래사장, 그 바로 뒤에 초록 벽처럼 서 있는 소나무 숲, 그리고 그 유명한 짙푸른 동해 바닷물이에요. 최고의 포인트는 해변을 따라 이어지는 커피 거리예요. 강릉은 한국의 커피 도시라서, 말 그대로 발은 모래에 닿은 채로 갓 내린 핸드드립을 들고 있을 수 있어요.\n\n뭘 할 수 있냐고요? 느린 것들 전부요. 일출 보기, 파도가 신발을 쫓아오는 긴 산책, 시장의 신선한 해산물, 그리고 저의 개인 의식인 해변 라면까지! 요컨대 바다와 커피를 페어링한 해변이에요. 이게 물가의 제 힐링 스팟이죠.", "struct": [["1️⃣ 선언", "강릉 해변, 2시간 반"], ["2️⃣ 묘사", "모래 · 소나무 벽 · 짙푸른 물"], ["3️⃣ 특색", "해변 커피 거리 페어링"], ["4️⃣ 활동", "일출 · 산책 · 해변 라면"], ["5️⃣ 마무리", "바다 + 커피 힐링 스팟"]], "scoring": [["3축 커버", "어디(강릉, 2시간 반) → 모습(모래 · 숲 · 물) → 무엇을(일출 · 산책 · 라면). 질문의 세 축을 순서대로 커버해요 ✅"], ["지역 특색 카드", "강릉 = 커피 도시, 발은 모래에 손은 핸드드립 — 아는 해변을 증명하는 건 지역 특색 디테일이에요 ☕ 🔑"], ["의인화 소품", "초록 벽 소나무 숲, 신발을 쫓아오는 파도 — 풍경에 동작을 주면 묘사가 살아 움직여요 ✨ 💕"], ["시리즈 지도 확장", "강릉은 일출 · 지형 편에 이어 이번엔 낮의 해변으로 — 한 도시를 여러 각도로 우려내는 시리즈 지도 기술이에요 🔁 🎓"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["escape", "탈출지", "도시인의 해변 한 단어 🔑"], ["a long stretch of ~", "길게 뻗은 ~", "해변 묘사 필수 구문 ✅"], ["pine forest", "소나무 숲", "동해안 해변 시그니처 소품 ✨"], ["like a green wall", "초록 벽처럼", "소나무 숲 직유 기술 🗺️"], ["coffee street", "커피 거리", "강릉 특색 디테일 ☕"], ["hand-drip", "핸드드립", "커피 도시 디테일 어휘 ☕"], ["waves chasing your shoes", "신발을 쫓는 파도", "해변 산책 장면 의인화 💕"], ["personal ritual", "개인 의식", "해변 라면 격 올리기 유머 😆"], ["pair A with B", "A와 B를 페어링하다", "바다 + 커피 조합 동사 ✨"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-071 15. 해변(Beach)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-071 15. 해변(Beach)_묘사.mp3"}, {"id": "2-072", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "습관", "badge": "72 습관", "enQ": "What do you usually do when you go to the beach? Who do you go with, and what do you bring? Describe a typical day at the beach from arrival to leaving.", "enA": "Beach days are best-friend days — we go once or twice a year, and we have a whole system. Let me walk you through it. Packing is minimal: a blanket, wireless earbuds, snacks, and sunscreen — which she always forgets and I always pack double!\n\nFirst stop on arrival: coffee from the beach cafe street — rules are rules in Gangneung. Then the long walk: one full hour along the water, talking about everything and nothing. After that comes my favorite part, which we call sea-gazing: we just sit on the blanket and stare at the waves like two grandmas. Deeply, deeply healing.\n\nLunch is seafood at the market or beach ramyeon if we're lazy. And before leaving, our non-negotiable ritual: one sunset photo, same pose every year. Coffee, walk, gaze, eat, photo — that's pretty much our beach formula, and it never gets old.", "koQ": "해변에 가면 주로 무엇을 하나요? 누구와 함께 가고, 무엇을 챙겨 가나요? 도착부터 떠날 때까지 해변에서의 일반적인 하루를 설명해주세요.", "koA": "해변 가는 날은 곧 절친의 날이에요. 일 년에 한두 번 가는데, 우리만의 시스템이 다 있어요. 차근차근 보여드릴게요. 짐은 최소한이에요. 담요, 무선 이어폰, 간식, 그리고 선크림. 선크림은 절친이 늘 까먹어서 제가 늘 두 개 챙기죠!\n\n도착하면 첫 코스는 해변 카페 거리의 커피예요. 강릉에선 규칙은 규칙이니까요. 그다음은 긴 산책이에요. 물가를 따라 꼬박 한 시간, 온갖 얘기와 아무 얘기도 아닌 얘기를 하면서요. 그다음이 제 최애 코스인데, 우리는 바다멍이라고 불러요. 담요에 앉아서 할머니 두 명처럼 파도만 바라보는 거예요. 깊이, 아주 깊이 힐링되죠.\n\n점심은 시장 해산물이나, 게으른 날엔 해변 라면이에요. 그리고 떠나기 전 타협 불가 의식이 있어요. 노을 사진 한 장, 매년 같은 포즈로요. 커피, 산책, 바다멍, 먹기, 사진. 이게 우리의 해변 공식이고, 전혀 질리지 않아요.", "struct": [["1️⃣ 동행", "절친과 연 1~2회 시스템"], ["2️⃣ 준비", "담요 · 이어폰 · 선크림 2개"], ["3️⃣ 순서", "커피 → 1시간 산책 → 바다멍"], ["4️⃣ 식사", "시장 해산물 or 해변 라면"], ["5️⃣ 의식", "매년 같은 포즈 노을 사진"]], "scoring": [["질문 3종 커버", "누구와(절친) → 무엇을 챙기나(담요 · 이어폰 · 선크림) → 도착부터 떠날 때까지(커피 → 산책 → 멍 → 식사 → 사진) 완벽 커버예요 ✅"], ["바다멍 카드", "sea-gazing이라는 나만의 번역어로 바다멍 문화를 소개해요 ✨ 할머니 두 명처럼이라는 직유가 웃음까지 챙기죠 😆"], ["절친 디테일", "선크림을 늘 까먹는 절친과 두 개 챙기는 나 — 관계의 역사가 담긴 준비물 디테일이 이야기를 진짜로 만들어요 💕 🔁"], ["공식 마무리", "커피, 산책, 멍, 먹기, 사진 — 하루를 다섯 단어의 공식으로 요약하는 마무리가 습관 답변의 정석이에요 🧩 💬"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["pack double", "두 개 챙기다", "절친 캐릭터 유머 디테일 😆"], ["sunscreen", "선크림", "해변 준비물 필수 어휘 ✅"], ["First stop:", "첫 코스는", "도착부터 순서 신호어 ⏰"], ["Rules are rules.", "규칙은 규칙", "강릉 커피 국룰 유머 ☕"], ["sea-gazing", "바다멍", "한국식 멍때리기 소개 ✨"], ["like two grandmas", "할머니 두 명처럼", "바다멍 자기 유머 직유 😆"], ["deeply healing", "깊이 힐링되는", "멍의 효용 한 마디 💕"], ["non-negotiable", "타협 불가의", "의식의 무게 고급 형용사 🔑"], ["formula", "공식", "하루 요약 명사 🧩"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-072 15. 해변(Beach)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-072 15. 해변(Beach)_습관.mp3"}, {"id": "2-073", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "취향", "badge": "73 취향", "enQ": "Why do you like going to the beach? What do you enjoy the most there - swimming, the scenery, or the food? Tell me the reasons in detail.", "enA": "If I had to choose among the three, the scenery wins — no contest. Full disclosure: my swimming is closer to organized splashing, so that one's out early! For me, it's all about what the sea does to my head.\n\nHere's the thing: the horizon is the only place my eyes can rest. In the city, everything is close — screens, buildings, faces. At the beach, I finally look at something endless, and my brain quietly unclenches. The sound helps too: waves are the one playlist I never skip. Don't get me wrong — beach food is glorious, and I take my seafood very seriously. But food I can find in Seoul; that horizon, I can't.\n\nNothing beats that first deep breath when the sea comes into view. In a nutshell: I don't go to the beach to do something — I go there to finally do nothing.", "koQ": "왜 해변에 가는 것을 좋아하나요? 수영, 풍경, 음식 중 그곳에서 무엇을 가장 즐기나요? 그 이유를 자세히 말해주세요.", "koA": "셋 중에 골라야 한다면 풍경 승리예요. 고민할 것도 없죠. 솔직히 고백하면 제 수영 실력은 조직적인 물장구에 가까워서, 수영은 일찌감치 탈락이에요! 저한테 핵심은 바다가 제 머릿속에 해주는 일이에요.\n\n이런 거예요. 수평선은 제 눈이 쉴 수 있는 유일한 곳이에요. 도시에선 모든 게 가까워요. 화면, 건물, 얼굴들. 해변에선 드디어 끝없는 걸 바라보게 되고, 그러면 뇌가 조용히 긴장을 풀어요. 소리도 한몫하죠. 파도는 제가 절대 건너뛰지 않는 유일한 플레이리스트거든요. 오해는 마세요. 해변 음식은 찬란하고, 저는 해산물을 아주 진지하게 대하는 사람이에요. 근데 음식은 서울에서도 찾을 수 있지만, 그 수평선은 못 찾잖아요.\n\n바다가 시야에 들어오는 순간의 그 첫 심호흡만 한 게 없어요. 한마디로, 저는 해변에 뭔가를 하러 가는 게 아니라, 드디어 아무것도 안 하러 가요.", "struct": [["1️⃣ 선택", "풍경 승리, no contest"], ["2️⃣ 탈락", "수영 = 조직적인 물장구"], ["3️⃣ 논리", "수평선 = 눈이 쉬는 곳"], ["4️⃣ 양보", "음식은 서울에도 있다"], ["5️⃣ 명언", "아무것도 안 하러 간다"]], "scoring": [["자학 유머 탈락", "수영은 조직적인 물장구라서 탈락 — 자기 폭로 유머로 선택지 하나를 지우면 겸손과 웃음을 동시에 챙겨요 😆"], ["희소성 논리", "음식은 서울에도 있지만 수평선은 없다 — 희소성으로 풍경을 고르는 논리가 이 답변의 등뼈예요 🔑 반박 불가죠"], ["감각 근거", "눈이 쉬고, 뇌가 풀리고, 파도는 스킵 없는 플레이리스트 — 풍경의 효용을 감각 세 개로 증명해요 ✨ 🎵"], ["무위 마무리", "뭔가를 하러 가는 게 아니라 아무것도 안 하러 간다 — 뒤집기 한 번으로 취향의 철학이 완성되는 마무리예요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "3지선다 취향 도입 공식 🔁 🔑"], ["Full disclosure:", "솔직히 고백하면", "자기 폭로 유머 오프너 😆"], ["organized splashing", "조직적인 물장구", "수영 실력 자학 유머 😆"], ["it's all about ~", "핵심은 ~이다", "취향 이유 공식 🔁 ✨"], ["rest my eyes", "눈을 쉬게 하다", "수평선의 효용 표현 ✅"], ["endless", "끝없는", "수평선 한 단어 요약 🔑"], ["unclench", "긴장을 풀다", "뇌가 풀리는 감각 동사 ✨"], ["the one playlist I never skip", "절대 안 넘기는 플레이리스트", "파도 소리 비유, TV 편 연결 🔁 🎵"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["nothing beats ~", "~만 한 게 없다", "취향 절정 공식 🔁 🔥"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-073 15. 해변(Beach)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-073 15. 해변(Beach)_취향.mp3"}, {"id": "2-074", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "과거 경험", "badge": "74 과거 경험", "enQ": "Tell me about a memorable experience you had at the beach. When and where was it, and who were you with? What happened? Tell me the whole story.", "enA": "This reminds me of a family beach trip when I was about ten — the east coast, midsummer, with my mom and my little brother. That day, my brother and I decided to build not a sandcastle, but a sand empire: walls, towers, even a moat. We worked on it all afternoon like two little engineers.\n\nThen, out of nowhere, one big wave came in and — you can guess what happened — thirty seconds, empire gone. My brother just stood there, and then came the loudest crying on that entire beach. But my mom saved the day with one line: 'The sea just checked your homework — it says build a bigger one.'\n\nSo we did — closer to the pines this time, twice as big, and it survived until sunset. It all worked out fine, and since then, that line is our family motto for every setback: rebuild it bigger. Honestly, the wave taught us more than the castle did.", "koQ": "해변에서 겪은 기억에 남는 경험에 대해 말해주세요. 언제 어디서였고, 누구와 함께였나요? 무슨 일이 있었나요? 전체 이야기를 들려주세요.", "koA": "열 살쯤의 가족 해변 여행이 떠오르네요. 동해안, 한여름, 엄마와 남동생과 함께였죠. 그날 동생과 저는 모래성이 아니라 모래 제국을 짓기로 했어요. 성벽, 탑, 심지어 해자까지요. 꼬마 엔지니어 둘처럼 오후 내내 작업했죠.\n\n그런데 난데없이 큰 파도 하나가 들어왔고, 무슨 일이 일어났을지 아시겠죠. 30초 만에 제국이 사라졌어요. 동생은 멍하니 서 있다가, 그 해변 전체에서 가장 큰 울음을 터뜨렸죠. 근데 엄마가 한 마디로 그날을 구하셨어요. 바다가 방금 너희 숙제 검사한 거야. 더 크게 지으라는 뜻이래.\n\n그래서 그렇게 했어요. 이번엔 소나무 쪽에 더 가까이, 두 배 더 크게요. 그리고 그 성은 노을까지 살아남았죠. 결국 다 잘 풀렸고, 그 뒤로 그 말은 모든 좌절에 대한 우리 가족의 모토가 됐어요. 더 크게 다시 지어라. 솔직히 성보다 파도가 더 많은 걸 가르쳐줬어요.", "struct": [["1️⃣ 배경", "열 살, 가족 동해 여행"], ["2️⃣ 전개", "모래성 아닌 모래 제국"], ["3️⃣ 반전", "파도 30초, 제국 소멸"], ["4️⃣ 절정", "엄마의 숙제 검사 한 마디"], ["5️⃣ 교훈", "더 크게 다시 지어라"]], "scoring": [["가족 총출동", "엄마와 남동생이 함께 나오는 첫 이야기 — TV 편 리모컨 전쟁의 남매가 해변에서도 이어져요 🔁 🎓 인물의 역사가 쌓이죠"], ["스케일 유머", "모래성이 아니라 성벽 · 탑 · 해자를 갖춘 모래 제국 — 스케일 과장 하나로 어린 날의 진지함이 살아나요 😆 ✨"], ["엄마 명언", "바다가 숙제 검사한 거야 — 울음을 웃음으로 바꾼 대사 한 줄이 이 이야기의 심장이에요 💬 대사 인용은 경험담의 특수효과죠"], ["모토 마무리", "더 크게 다시 지어라가 가족 모토가 됐다는 마무리 — 어린 날의 사건을 평생의 교훈으로 잇는 필승 패턴이에요 🔁 💕"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["sand empire", "모래 제국", "모래성 스케일업 유머 😆"], ["moat", "해자", "제국의 디테일 어휘 ✨"], ["like two little engineers", "꼬마 엔지니어처럼", "남매 작업 장면 직유 🧩"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😆"], ["save the day", "그날을 구하다", "엄마의 활약 필수 표현 💕"], ["check your homework", "숙제를 검사하다", "엄마 명언의 핵심 비유 💬"], ["setback", "좌절, 차질", "교훈 일반화 고급 명사 🔑"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식 🔁 🎓"]], "audio": "audio/2_돌발/2-074 15. 해변(Beach)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-074 15. 해변(Beach)_과거 경험.mp3"}, {"id": "2-075", "cat": "unexpected", "catName": "돌발 질문", "num": 15, "topic": "해변", "topicEn": "Beach", "type": "비교", "badge": "75 비교", "enQ": "Compare the beaches you visited as a child with the beaches these days. How have the facilities, the visitors, and the activities changed? Tell me in detail.", "enA": "Back then, the beach used to be beautifully simple. Facilities meant a rented parasol, a tube, and one snack stand selling everything. Visitors were families like mine — kids with sand empires, parents dozing under umbrellas. The main activity? Swimming until your lips turned blue.\n\nThese days, it's a completely different story. The parasols turned into beach cafes with ocean-view seats, and surfing schools stand where the tube rentals were. Compared to the old days, the visitors changed too: fewer screaming kids, way more couples hunting for the perfect photo. Honestly, half the beach comes for the camera now — swimming is almost optional!\n\nI have to admit, today's beaches are prettier and far more comfortable — I do love my beachside hand-drip. But sometimes I miss the old soundtrack: less shutter clicks, more kids screaming at the waves, if you ask me.", "koQ": "어렸을 때 갔던 해변과 요즘 해변을 비교해주세요. 시설, 방문객, 즐길 거리는 어떻게 변화했나요? 자세히 말해주세요.", "koA": "그때는 해변이 아름답게 단순했어요. 시설이라곤 빌린 파라솔, 튜브, 그리고 없는 게 없는 매점 하나가 전부였죠. 방문객은 우리 같은 가족들이었어요. 모래 제국을 짓는 아이들, 파라솔 아래서 조는 부모들이요. 주된 즐길 거리요? 입술이 파래질 때까지 수영하는 거였죠.\n\n요즘은 완전히 다른 이야기예요. 파라솔은 오션뷰 좌석의 해변 카페로 변했고, 튜브 대여점 자리엔 서핑 스쿨이 서 있어요. 예전과 비교하면 방문객도 달라졌어요. 소리 지르는 아이들은 줄고, 완벽한 사진을 사냥하는 커플들이 훨씬 많아졌죠. 솔직히 이젠 해변의 절반은 카메라 때문에 와요. 수영은 거의 선택 사항이에요!\n\n인정할 건 인정해야죠. 요즘 해변이 더 예쁘고 훨씬 편해요. 저도 해변 핸드드립을 사랑하고요. 근데 가끔은 옛날 사운드트랙이 그리워요. 제 생각엔, 셔터 소리는 줄고 파도에 소리 지르는 아이들이 더 많던 그 소리요.", "struct": [["1️⃣ 과거", "파라솔 · 튜브 · 매점 하나"], ["2️⃣ 장면", "입술 파래지는 수영"], ["3️⃣ 현재", "해변 카페 · 서핑 스쿨"], ["4️⃣ 방문객", "아이들 → 사진 커플"], ["5️⃣ 마무리", "옛 사운드트랙 그리움"]], "scoring": [["질문 3축 그대로", "시설(파라솔 → 카페) · 방문객(가족 → 커플) · 즐길 거리(수영 → 사진). 질문이 준 세 축을 그대로 비교 틀로 써요 ✅"], ["소품 대 소품", "튜브 대여점 자리에 서핑 스쿨 — 같은 자리의 소품 교체로 시대 변화를 보여주는 호텔 비교 편 기술이에요 🔁 🔑"], ["경험 편 연결", "모래 제국 짓는 아이들과 입술 파래지는 수영 — 바로 앞 경험 편의 어린 날이 비교의 과거 파트가 돼요 🔁 🎓"], ["소리 마무리", "셔터 소리보다 아이들 함성이 그립다 — 해변의 변화를 소리로 닫는 감각 마무리예요 🎵 😊 그리움 공식의 변주죠"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["parasol", "파라솔", "옛 해변 시설 대표 소품 ⏰"], ["doze", "졸다", "파라솔 아래 부모님 장면 😴"], ["until your lips turned blue", "입술이 파래질 때까지", "어린 날 수영 만국 공감 😆"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["surfing school", "서핑 스쿨", "요즘 해변 시설 디테일 ✅"], ["hunt for the perfect photo", "인생샷 사냥", "쇼핑 편 hunt 재활용 🔁 📸"], ["optional", "선택 사항인", "수영의 지위 변화 유머 😆"], ["soundtrack", "사운드트랙", "해변의 소리 비유 마무리 🎵"], ["I have to admit", "인정할 수밖에 없다", "그리움 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-075 15. 해변(Beach)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-075 15. 해변(Beach)_비교.mp3"}, {"id": "2-076", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "묘사", "badge": "76 묘사", "enQ": "Describe how the recycling system works in your country. What items do people recycle, and what is special about the system? Tell me in detail.", "enA": "Oh, you picked the right country — Korea takes recycling very seriously. It's not a suggestion here; it's practically a civic duty, and honestly, a bit of a national talent.\n\nSo how does it work? We sort everything: paper, plastic, glass, cans — each into its own bin. Food waste gets its own special bag, and general trash goes into pay-per-volume bags, so the more you throw away, the more you pay. Smart, right? The newest rule is my favorite: clear plastic bottles get their own bin, labels peeled off, caps separate.\n\nWhat's special? The peer pressure — I mean, the teamwork! Every apartment has a recycling station, neighbors sort side by side, and newcomers learn fast. As we like to joke: when you move to Korea, your first exam is trash day. That's pretty much our system!", "koQ": "당신의 나라의 재활용 시스템이 어떻게 운영되는지 설명해주세요. 사람들은 어떤 물품을 재활용하고, 그 시스템의 특별한 점은 무엇인가요? 자세히 말해주세요.", "koA": "오, 나라 하나는 제대로 고르셨네요. 한국은 재활용을 아주 진지하게 대하거든요. 여기서 재활용은 권유가 아니라 사실상 시민의 의무예요. 그리고 솔직히, 약간의 국가적 재능이기도 하죠.\n\n어떻게 운영되냐면, 우리는 전부 다 분류해요. 종이, 플라스틱, 유리, 캔을 각자의 수거함에요. 음식물 쓰레기는 전용 봉투가 따로 있고, 일반 쓰레기는 종량제 봉투에 담아요. 많이 버릴수록 많이 내는 거죠. 똑똑하지 않나요? 최신 규칙이 제 최애예요. 투명 페트병은 라벨을 떼고 뚜껑을 분리해서 전용 수거함에 넣거든요.\n\n특별한 점이요? 동료 압박 — 아니, 팀워크요! 아파트마다 분리수거장이 있어서 이웃들이 나란히 서서 분류하고, 새 이웃은 빠르게 배우게 돼요. 우리끼리 하는 농담처럼, 한국에 이사 오면 첫 시험은 분리수거 날이에요. 이게 우리 시스템이에요!", "struct": [["1️⃣ 선언", "재활용 = 시민의 의무"], ["2️⃣ 품목", "종이 · 플라스틱 · 유리 · 캔"], ["3️⃣ 특징", "종량제 + 음식물 전용 봉투"], ["4️⃣ 최신", "투명 페트 라벨 · 뚜껑 분리"], ["5️⃣ 마무리", "첫 시험은 분리수거 날"]], "scoring": [["시스템 3단", "무엇을(품목 나열) → 어떻게(종량제 · 전용 봉투) → 특별한 점(분리수거장 문화). 질문의 세 축을 순서대로 커버해요 ✅"], ["돈의 논리", "많이 버릴수록 많이 낸다 — 종량제를 한 문장으로 설명하면 시스템의 똑똑함이 바로 전달돼요 💳 Smart, right? 리액션까지!"], ["유머 두 방", "동료 압박 — 아니, 팀워크요! 와 첫 시험은 분리수거 날 — 자기 수정 유머와 과장 유머가 딱딱한 주제를 살려요 😆 ✨"], ["최신 디테일", "투명 페트 분리배출 같은 최신 규칙 하나가 이 답변을 진짜 요즘 한국 이야기로 만들어요 🔑 제도 주제는 최신 디테일이 생명!"]], "expr": [["take ~ seriously", "~을 진지하게 대하다", "해변 취향 편 재활용 표현 🔁 ✅"], ["civic duty", "시민의 의무", "재활용의 위상 한 단어 🔑"], ["sort", "분류하다", "재활용 주제 필수 동사 ✅"], ["pay-per-volume", "종량제", "한국 시스템 핵심 어휘 💳"], ["peel off", "떼어내다", "라벨 제거 필수 동사 ✅"], ["peer pressure", "동료 압박", "팀워크로 바꿔 말하는 유머 😆"], ["side by side", "나란히", "분리수거장 풍경 묘사 🧩"], ["newcomer", "새로 온 사람", "이웃 문화 소개 명사 😊"], ["trash day", "분리수거 날", "첫 시험 유머의 키워드 😆"], ["national talent", "국가적 재능", "과장 유머 오프닝 ✨"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-076 16. 재활용(Recycling)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-076 16. 재활용(Recycling)_묘사.mp3"}, {"id": "2-077", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "습관", "badge": "77 습관", "enQ": "How do you recycle at home? How often do you take out the recyclables, and where do you put them? Describe each step of your recycling routine.", "enA": "I have a whole assembly line at home — let me walk you through it. Step one happens at the sink: every bottle and container gets a quick rinse right after use. My golden rule: if it's dirty, it's not recycling, it's just trash in disguise!\n\nStep two is my four-bin corner next to the fridge: paper, plastic, cans-and-glass, and a special little box for clear bottles — labels peeled, caps off, bodies crushed flat. Then comes step three: every Tuesday evening, I carry everything down to the recycling station on my way out for my jog. Two birds, one stone!\n\nThe whole trip takes ten minutes, and I always come back with empty hands and a light heart. Sort, rinse, Tuesday — that's pretty much my system, and weirdly enough, it never gets old.", "koQ": "집에서 어떻게 재활용을 하나요? 얼마나 자주 재활용품을 내놓고, 어디에 버리나요? 재활용 루틴의 각 단계를 설명해주세요.", "koA": "저희 집엔 조립 라인이 하나 있어요. 차근차근 보여드릴게요. 1단계는 싱크대에서 일어나요. 모든 병과 용기는 쓰자마자 바로 헹궈요. 저의 황금률은, 더러우면 재활용이 아니라 변장한 쓰레기다예요!\n\n2단계는 냉장고 옆 4칸 코너예요. 종이, 플라스틱, 캔과 유리, 그리고 투명 페트병 전용 작은 상자죠. 라벨 떼고, 뚜껑 빼고, 몸통은 납작하게 찌그러뜨려서요. 그리고 3단계. 매주 화요일 저녁, 조깅하러 나가는 길에 전부 들고 내려가서 분리수거장에 버려요. 일석이조죠!\n\n전체 과정은 10분이면 끝나고, 저는 늘 빈손과 가벼운 마음으로 돌아와요. 분류, 헹굼, 화요일. 이게 제 시스템이고, 이상하게도 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "집안의 조립 라인 비유"], ["2️⃣ 1단계", "쓰자마자 싱크대 헹굼"], ["3️⃣ 2단계", "냉장고 옆 4칸 분리 코너"], ["4️⃣ 3단계", "화요일 조깅길에 배출"], ["5️⃣ 마무리", "분류 · 헹굼 · 화요일"]], "scoring": [["단계 번호제", "Step one · two · three로 번호를 붙이면 each step을 설명하라는 질문에 정확히 응답하는 구조가 돼요 ✅ 번호는 최고의 이정표예요"], ["룰 네이밍", "더러우면 변장한 쓰레기 — 헹굼 원칙에 재치 있는 이름을 붙이면 평범한 루틴이 나만의 철학이 돼요 😆 🔑"], ["동선 결합", "화요일 배출을 조깅 나가는 길에 묶는 디테일 — 시리즈 조깅 루틴과 결합돼 일석이조 표현까지 자연스럽게 나와요 🔁 🏃"], ["3단어 요약", "분류, 헹굼, 화요일(Sort, rinse, Tuesday) — 루틴 전체를 세 단어로 압축하는 마무리가 습관 답변의 정석이에요 🧩 💬"]], "expr": [["assembly line", "조립 라인", "루틴을 공장에 비유 ✨"], ["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["rinse", "헹구다", "재활용 루틴 필수 동사 ✅"], ["golden rule", "황금률", "습관 공식 단골 🔁 🔑"], ["trash in disguise", "변장한 쓰레기", "헹굼 룰의 재치 표현 😆"], ["crush flat", "납작하게 찌그러뜨리다", "페트병 처리 동사 💪"], ["on my way out", "나가는 길에", "조깅과 묶는 동선 표현 🏃"], ["Two birds, one stone!", "일석이조", "루틴 결합의 필수 관용구 ✅"], ["empty hands, light heart", "빈손과 가벼운 마음", "배출 후 기분 대구 표현 💕"], ["weirdly enough", "이상하게도", "솔직 양념 부사구 😊"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-077 16. 재활용(Recycling)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-077 16. 재활용(Recycling)_습관.mp3"}, {"id": "2-078", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "취향", "badge": "78 취향", "enQ": "Which items do you pay the most attention to when recycling, and why? What do you think is the most important part of recycling? Tell me your thoughts.", "enA": "If I had to choose, clear plastic bottles get my full attention — no contest. My water and soda bottles go through a whole spa routine: label peeled, cap off, body rinsed and crushed. It's a three-step ceremony!\n\nWhy them? Because clear plastic is the star student of recycling — it can actually become new bottles, even clothing fiber. Don't get me wrong, I sort everything carefully. But with clear bottles, one lazy label can ruin the whole batch, so the small steps really matter. That's exactly why I think the most important part of recycling isn't the sorting — it's the prep: a quick rinse before anything goes in the bin.\n\nMy little philosophy? Recycling isn't throwing away — it's sending things back to work. In a nutshell: a clean bottle gets a second life; a dirty one just gets a funeral.", "koQ": "재활용할 때 어떤 품목에 가장 신경을 쓰고, 그 이유는 무엇인가요? 재활용에서 가장 중요한 부분이 무엇이라고 생각하나요? 당신의 생각을 말해주세요.", "koA": "골라야 한다면 투명 페트병에 제일 신경 써요. 고민할 것도 없죠. 제 물병과 음료수병은 스파 코스를 통째로 거쳐요. 라벨 떼고, 뚜껑 빼고, 몸통 헹구고 찌그러뜨리고. 3단계 의식이라니까요!\n\n왜 페트병이냐고요? 투명 플라스틱은 재활용계의 모범생이거든요. 진짜로 새 병이 되고, 심지어 옷의 섬유도 될 수 있어요. 오해는 마세요. 저는 전부 다 신경 써서 분류해요. 근데 투명 페트는 게으른 라벨 하나가 전체를 망칠 수 있어서, 작은 단계들이 정말 중요해요. 그래서 저는 재활용에서 가장 중요한 부분이 분류가 아니라 준비라고 생각해요. 수거함에 넣기 전의 재빠른 헹굼이요.\n\n저의 작은 철학이요? 재활용은 버리기가 아니라 다시 일하러 보내기예요. 한마디로, 깨끗한 병은 두 번째 삶을 얻고, 더러운 병은 그냥 장례식을 치러요.", "struct": [["1️⃣ 선택", "투명 페트병, no contest"], ["2️⃣ 의식", "라벨 · 뚜껑 · 헹굼 · 압착"], ["3️⃣ 이유", "새 병 · 옷 섬유가 되는 모범생"], ["4️⃣ 핵심", "중요한 건 분류보다 준비"], ["5️⃣ 명언", "버리기 아닌 돌려보내기"]], "scoring": [["질문 두 축", "어떤 품목에(투명 페트) + 가장 중요한 부분(준비 · 헹굼) — 두 질문에 각각 명확한 답 하나씩을 배치하는 구조예요 ✅"], ["의인화 유머", "페트병의 스파 코스, 재활용계의 모범생 — 물건 의인화 두 방이 무미건조한 주제에 캐릭터를 입혀요 😆 ✨"], ["지식 한 스푼", "투명 페트가 옷 섬유가 된다는 지식 디테일 — 신경 쓰는 이유에 근거가 생기고 답변의 격이 올라가요 🔑 🎓"], ["삶과 장례식", "깨끗한 병은 두 번째 삶, 더러운 병은 장례식 — 대비 명언 마무리가 생각을 묻는 질문의 정답이에요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["pay attention to ~", "~에 신경 쓰다", "질문 속 표현 그대로 회수 ✅"], ["spa routine", "스파 코스", "페트병 관리 과장 유머 😆"], ["star student", "모범생", "투명 페트 의인화 비유 ✨"], ["clothing fiber", "옷 섬유", "재활용 지식 디테일 🔑"], ["Don't get me wrong", "오해는 마세요", "양보 공식, 서베이 개근 🔁 😊"], ["ruin the whole batch", "전체를 망치다", "라벨 하나의 나비효과 💪"], ["prep", "준비, 사전 작업", "가장 중요한 부분의 답 🔑"], ["send things back to work", "다시 일하러 보내다", "재활용 재정의 명언 재료 💬"], ["second life", "두 번째 삶", "깨끗한 병의 보상 💕"], ["in a nutshell", "한마디로", "요약 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-078 16. 재활용(Recycling)_취향.mp3", "label": "취향", "qaudio": "audio_q/2_돌발/2-078 16. 재활용(Recycling)_취향.mp3"}, {"id": "2-079", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "과거 경험", "badge": "79 과거 경험", "enQ": "Tell me about a memorable experience you had while recycling. What happened, and how did you deal with it? Why was it special?", "enA": "This reminds me of my very first trash day after moving into my current place. I walked down to the recycling station feeling confident — and froze. Six different bins, signs everywhere, and my bag of mixed-up recyclables suddenly felt like a failed exam.\n\nWhile I stood there panicking, out of nowhere, the elderly gentleman from next door appeared with his perfectly sorted cart. Without a word, he gave me a full demonstration: bottle caps here, labels there, boxes flattened just so. A complete masterclass! I followed along like a nervous student, and guess what — I passed.\n\nHow did I deal with it? I simply accepted the help and said thank you about ten times. It worked out fine — and it was special because that's how I met my neighbors. Since then, Tuesdays mean a little chat with the old couple next door!", "koQ": "재활용을 하면서 겪은 기억에 남는 경험에 대해 말해주세요. 무슨 일이 있었고, 어떻게 대처했나요? 왜 그것이 특별했나요?", "koA": "지금 집으로 이사 온 뒤 첫 분리수거 날이 떠오르네요. 자신만만하게 분리수거장으로 내려갔다가, 그대로 얼어붙었어요. 수거함이 여섯 개에, 사방이 안내문이고, 뒤죽박죽 섞인 제 재활용품 봉투가 갑자기 낙제한 시험지처럼 느껴지더라고요.\n\n제가 서서 허둥대고 있는데, 난데없이 옆집 할아버지가 완벽하게 분류된 카트를 끌고 나타나셨어요. 그리고 말없이 풀코스 시범을 보여주셨죠. 병뚜껑은 여기, 라벨은 저기, 상자는 이렇게 납작하게. 완전한 마스터클래스였어요! 저는 긴장한 학생처럼 따라 했고, 있잖아요, 합격했어요.\n\n어떻게 대처했냐고요? 그냥 도움을 받아들이고 감사하다는 말을 열 번쯤 했어요. 결국 다 잘 풀렸고, 특별했던 이유는 그렇게 이웃을 만났기 때문이에요. 그 뒤로 화요일은 옆집 노부부와의 짧은 수다 시간이 됐어요!", "struct": [["1️⃣ 상황", "이사 후 첫 분리수거 날"], ["2️⃣ 위기", "수거함 6개 앞에서 얼음"], ["3️⃣ 반전", "옆집 할아버지의 시범"], ["4️⃣ 대처", "도움 수용 + 감사 열 번"], ["5️⃣ 특별", "재활용이 맺어준 이웃"]], "scoring": [["시험 은유 연결", "묘사 편의 첫 시험은 분리수거 농담이 여기서 낙제한 시험지 → 합격으로 이어져요 🔁 🎓 주제 안 은유 재활용의 정석!"], ["노부부 등장", "캐논의 옆집 노부부가 드디어 이야기의 주인공으로 — 시리즈 인물의 첫 만남 장면을 채워주는 페이지예요 🔁 💕"], ["대처 = 수용", "어떻게 대처했나 → 그냥 도움을 받아들이고 열 번 감사했다. 겸손한 대처도 훌륭한 답이라는 걸 보여줘요 😊 🔑"], ["특별함 답변", "why special에 그렇게 이웃을 만났다로 답해요 — 사건보다 관계로 닫는 마무리가 경험담의 온도를 올려줘요 💕 💬"]], "expr": [["this reminds me of", "~이 떠오르다", "경험 도입 공식, 서베이 개근 🔁 🔑"], ["freeze", "얼어붙다", "기술 편과 다른 뜻으로 재등장 🔁 😆"], ["mixed-up", "뒤죽박죽인", "초보의 봉투 상태 묘사 ✅"], ["failed exam", "낙제한 시험지", "묘사 편 첫 시험 유머 연결 🔁 😆"], ["out of nowhere", "난데없이", "반전 공식, 서베이 개근 🔁 🎭"], ["demonstration", "시범", "할아버지의 마스터클래스 🎓"], ["flattened", "납작해진", "상자 처리 필수 형용사 💪"], ["masterclass", "마스터클래스", "시범의 격 올리기 유머 ✨"], ["guess what", "있잖아요, 세상에", "반전 공식, 서베이 개근 🔁 😊"], ["work out fine", "잘 풀리다", "경험 마무리 공식 🔁 ✅"], ["since then", "그 이후로", "교훈 연결 공식 🔁 💕"]], "audio": "audio/2_돌발/2-079 16. 재활용(Recycling)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/2_돌발/2-079 16. 재활용(Recycling)_과거 경험.mp3"}, {"id": "2-080", "cat": "unexpected", "catName": "돌발 질문", "num": 16, "topic": "재활용", "topicEn": "Recycling", "type": "비교", "badge": "80 비교", "enQ": "Compare recycling today with recycling in the past. How have the rules and the items people recycle changed over the years? Tell me about the differences.", "enA": "Back then, when I was little, recycling used to be beautifully simple — maybe too simple. Newspapers in one pile, bottles in another, and honestly, plenty of things just went into one big bag, no questions asked.\n\nThese days, it's a completely different story. The rules got serious: clear bottles separate from colored ones, labels off, caps off, food containers rinsed. The item list keeps growing too — batteries, light bulbs, even small electronics have their own boxes now. Compared to the old days, recycling went from a rough sport to an exact science — and the referees are your neighbors!\n\nI have to admit, the old way was easier on lazy days. But here's what I genuinely like: the kids downstairs sort better than adults did twenty years ago. The rules got stricter — and honestly, so did our conscience. That's progress, if you ask me.", "koQ": "오늘날의 재활용과 과거의 재활용을 비교해주세요. 시간이 지나며 규칙과 재활용 품목은 어떻게 변화했나요? 그 차이점에 대해 말해주세요.", "koA": "그때, 그러니까 제가 어릴 때 재활용은 아름답게 단순했어요. 어쩌면 너무 단순했죠. 신문은 이쪽 더미, 병은 저쪽 더미. 그리고 솔직히 많은 것들이 아무 질문 없이 큰 봉투 하나에 들어갔어요.\n\n요즘은 완전히 다른 이야기예요. 규칙이 진지해졌죠. 투명 병은 색깔 병과 분리하고, 라벨 떼고, 뚜껑 빼고, 음식 용기는 헹구고요. 품목 목록도 계속 늘어나요. 건전지, 전구, 심지어 소형 가전까지 이제 전용 수거함이 있어요. 예전과 비교하면 재활용은 거친 스포츠에서 정밀 과학이 됐어요. 그리고 심판은 이웃들이죠!\n\n인정할 건 인정해야죠. 게으른 날엔 옛날 방식이 편했어요. 근데 진심으로 좋아하는 점이 있어요. 아랫집 아이들이 20년 전 어른들보다 분류를 잘해요. 규칙이 엄격해진 만큼 양심도 엄격해졌죠. 제 생각엔 그게 발전이에요.", "struct": [["1️⃣ 과거", "큰 봉투 하나, 질문 없음"], ["2️⃣ 현재", "투명 분리 · 라벨 · 전용함"], ["3️⃣ 비유", "거친 스포츠 → 정밀 과학"], ["4️⃣ 장면", "아이들이 어른보다 잘함"], ["5️⃣ 마무리", "규칙과 양심이 함께 성장"]], "scoring": [["질문 두 축", "규칙의 변화(투명 분리 · 라벨)와 품목의 변화(건전지 · 전구 · 소형 가전) — 질문이 준 두 축을 각각 나열로 채워요 ✅"], ["비유 대비", "거친 스포츠에서 정밀 과학으로, 심판은 이웃 — 비유 한 쌍이 규칙 변화의 크기와 문화까지 담아요 ✨ 😆"], ["세대 장면", "아이들이 20년 전 어른보다 분류를 잘한다 — 세대 대비 장면 하나가 변화의 증거로 이보다 강할 수 없어요 📊 💕"], ["양심 마무리", "규칙이 엄격해진 만큼 양심도 엄격해졌다 — 제도 비교를 사람의 성장으로 닫는 시리즈 철학 마무리예요 💬 🎓"]], "expr": [["back then", "그때는", "비교 도입 공식, 서베이 공통 🔁 🧩"], ["used to ~", "~하곤 했다", "과거 습관 필수 문법 🔁 ✅"], ["no questions asked", "아무 질문 없이", "허술했던 과거 요약 관용구 😆"], ["completely different story", "완전히 다른 이야기", "현재 전환 공식, 비교의 심장 🔁 💓"], ["get serious", "진지해지다", "규칙 변화 한 마디 🔥"], ["compared to ~", "~과 비교하면", "비교 기본기, 서베이 공통 🔁 📊"], ["rough sport → exact science", "스포츠 → 과학", "변화를 담는 대비 비유 ✨"], ["referee", "심판", "이웃 = 심판 유머 😆"], ["conscience", "양심", "마무리의 핵심 명사 🔑"], ["progress", "발전", "변화 긍정 평가 단어 ✅"], ["I have to admit", "인정할 수밖에 없다", "균형 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-080 16. 재활용(Recycling)_비교.mp3", "label": "비교", "qaudio": "audio_q/2_돌발/2-080 16. 재활용(Recycling)_비교.mp3"}, {"id": "2-081", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "묘사", "badge": "81 묘사", "enQ": "Describe a piece of furniture you bought recently. What does it look like, and where did you buy it? Why did you get it?", "enA": "That's an easy one — a couple of months ago, I finally bought a small wooden side table for my gray sofa. It's a simple round one, about knee-high, in a warm walnut color with slim little legs. Nothing fancy, but it looks like it was born to stand next to that sofa.\n\nWhere did I get it? At the furniture floor of the mall near the station — I went in for jeans, and guess what, I came out with a table instead. Classic me! It was on display right at the entrance, and honestly, it was love at first sight.\n\nWhy did I get it? Pure necessity: my sofa evenings run on tea, books, and my phone, and they all used to live on the floor. Now everything has a home within arm's reach. Small table, big upgrade — that's pretty much my latest furniture story.", "koQ": "최근에 산 가구를 묘사해주세요. 어떻게 생겼고, 어디에서 샀나요? 왜 그것을 구매했나요?", "koA": "쉬운 질문이네요. 두어 달 전에 드디어 회색 소파 옆에 둘 작은 원목 사이드 테이블을 샀어요. 무릎 높이쯤 오는 심플한 원형인데, 따뜻한 월넛 색에 가느다란 다리가 달렸어요. 화려할 건 없지만, 그 소파 옆에 서 있으려고 태어난 것처럼 생겼죠.\n\n어디서 샀냐고요? 역 근처 쇼핑몰 가구 층에서요. 청바지 사러 들어갔다가, 있잖아요, 테이블을 들고 나왔어요. 정말 저다운 일이죠! 입구 바로 앞에 진열되어 있었는데, 솔직히 첫눈에 반했어요.\n\n왜 샀냐고요? 순수한 필요 때문이에요. 제 소파 저녁은 차, 책, 폰으로 돌아가는데, 그것들이 전부 바닥에 살고 있었거든요. 이제는 모든 게 팔 뻗으면 닿는 곳에 자기 집이 생겼어요. 작은 테이블, 큰 업그레이드. 이게 저의 최신 가구 이야기예요.", "struct": [["1️⃣ 선언", "소파 옆 원목 사이드 테이블"], ["2️⃣ 묘사", "원형 · 무릎 높이 · 월넛"], ["3️⃣ 장소", "역 쇼핑몰, 청바지 대신"], ["4️⃣ 이유", "차 · 책 · 폰의 새 집"], ["5️⃣ 마무리", "작은 테이블, 큰 업그레이드"]], "scoring": [["질문 3축 커버", "어떻게 생겼나(원형 · 무릎 높이 · 월넛) → 어디서(역 쇼핑몰) → 왜(바닥살이 물건들의 집) — 세 의문사를 순서대로 답해요 ✅"], ["쇼핑 편 연결", "청바지 사러 갔다가 딴 걸 사 온 사람 — 패션 경험 편의 코트 사건과 같은 캐릭터라 웃음이 두 배예요 🔁 😆"], ["의인화 애정", "소파 옆에 서려고 태어난 테이블 — 가구 묘사는 스펙이 아니라 애정 표현으로 하는 거예요 💕 ✨"], ["대구 마무리", "작은 테이블, 큰 업그레이드(Small table, big upgrade) — 크기 대비 대구가 구매의 만족을 한 줄로 증명해요 💬 ✅"]], "expr": [["That's an easy one", "쉬운 질문이네요", "리액션 도입 공식, 서베이 개근 🔁 😊"], ["side table", "사이드 테이블", "이 페이지의 주인공 가구 ✅"], ["knee-high", "무릎 높이의", "크기 감각 묘사 형용사 📏"], ["walnut", "월넛 (색)", "가구 색 고급 어휘 ✨"], ["born to stand next to ~", "~ 옆에 서려고 태어난", "가구 의인화 애정 표현 💕"], ["guess what", "있잖아요, 세상에", "청바지 → 테이블 반전 🔁 😆"], ["Classic me!", "정말 저다운 일!", "자기 유머 리액션 😆"], ["love at first sight", "첫눈에 반함", "구매 계기 관용구 💕"], ["within arm's reach", "팔 뻗으면 닿는", "테이블의 효용 표현 🔑"], ["run on ~", "~으로 돌아가다", "기술 편 재활용, 소파 저녁 🔁 ✨"], ["that's pretty much ~", "그게 대충 ~예요", "묘사 마무리 공식 🔁 ✅"]], "audio": "audio/2_돌발/2-081 17. 가구(Furniture)_묘사.mp3", "label": "묘사", "qaudio": "audio_q/2_돌발/2-081 17. 가구(Furniture)_묘사.mp3"}, {"id": "2-082", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "습관", "badge": "82 습관", "enQ": "How do you usually take care of the furniture in your home? How often do you clean or rearrange it? Tell me about your furniture care routine.", "enA": "My furniture care is simple but loyal — let me walk you through it. Every Saturday morning, before my coffee gets cold, I do a quick dust patrol: shelves, the TV stand, and my new side table all get a wipe-down. Ten minutes, done.\n\nThe sofa gets special treatment, of course — it's the family VIP. Once a week I flip and fluff the cushions so it doesn't develop a permanent dent shaped exactly like me! And my golden rule for the wooden table: any spill gets wiped on the spot — tea rings are tattoos, they never leave.\n\nAs for rearranging, twice a year: every spring and fall, I shift the sofa angle and move some small things around. It costs nothing, but the whole room feels brand-new. Dust weekly, flip weekly, rearrange seasonally — that's pretty much it, and it never gets old.", "koQ": "집에 있는 가구를 보통 어떻게 관리하나요? 얼마나 자주 닦거나 재배치하나요? 당신의 가구 관리 루틴에 대해 말해주세요.", "koA": "제 가구 관리는 단순하지만 충직해요. 차근차근 보여드릴게요. 매주 토요일 아침, 커피가 식기 전에 재빠른 먼지 순찰을 돌아요. 선반, TV 장식장, 그리고 새 사이드 테이블까지 전부 닦아줘요. 10분이면 끝나죠.\n\n소파는 물론 특별 대우예요. 우리 집 VIP니까요. 일주일에 한 번 쿠션을 뒤집고 두들겨서, 정확히 제 모양으로 파인 영구 자국이 생기지 않게 해요! 그리고 원목 테이블에 대한 저의 황금률은, 흘린 건 그 자리에서 바로 닦기예요. 찻잔 자국은 문신이거든요. 절대 안 지워져요.\n\n재배치는 일 년에 두 번이에요. 봄가을마다 소파 각도를 바꾸고 작은 것들을 옮겨요. 돈 한 푼 안 들지만 방 전체가 새것처럼 느껴지죠. 먼지는 매주, 쿠션도 매주, 재배치는 계절마다. 이게 다예요. 전혀 질리지 않아요.", "struct": [["1️⃣ 도입", "단순하지만 충직한 관리"], ["2️⃣ 매주", "토요일 아침 먼지 순찰"], ["3️⃣ 소파", "VIP — 쿠션 뒤집기"], ["4️⃣ 규칙", "흘리면 그 자리에서 닦기"], ["5️⃣ 계절", "봄가을 배치 바꾸기"]], "scoring": [["빈도 3단", "매주(먼지 · 쿠션) → 즉시(흘린 것) → 계절마다(재배치). how often 질문에 빈도 세 층으로 답하는 구조예요 ✅ 📊"], ["VIP 프레임", "소파는 우리 집 VIP, 내 모양으로 파인 영구 자국 방지 — 시리즈 최다 출연 가구다운 특별 대우가 웃음 포인트예요 🔁 😆"], ["문신 명언", "찻잔 자국은 문신이라 안 지워진다 — 즉시 닦기 룰에 이유를 다는 비유 한 줄이 관리 철학을 만들어요 💬 🔑"], ["공짜 새집", "재배치는 돈 한 푼 안 들지만 방이 새것 — 계절 재배치의 매력을 가성비 논리로 정리하는 마무리예요 ✨ 💳"]], "expr": [["let me walk you through", "차근차근 설명하다", "습관 도입 공식, 서베이 개근 🔁 🔑"], ["dust patrol", "먼지 순찰", "청소를 순찰에 비유 😆"], ["wipe-down", "닦아내기", "가구 관리 필수 명사 ✅"], ["flip and fluff", "뒤집고 두들기다", "쿠션 관리 동사 콤보 💪"], ["permanent dent", "영구 자국", "내 모양 자국 유머 😆"], ["golden rule", "황금률", "습관 공식 단골 🔁 🔑"], ["on the spot", "그 자리에서 바로", "TV 편에 이어 재등장 🔁 ✅"], ["Tea rings are tattoos.", "찻잔 자국은 문신", "즉시 닦기 룰의 명언 💬"], ["brand-new", "새것 같은", "재배치의 효과 형용사 ✨"], ["seasonally", "계절마다", "빈도 어휘 레벨업 📊"], ["it never gets old", "전혀 질리지 않아요", "습관 마무리 공식 🔁 😊"]], "audio": "audio/2_돌발/2-082 17. 가구(Furniture)_습관.mp3", "label": "습관", "qaudio": "audio_q/2_돌발/2-082 17. 가구(Furniture)_습관.mp3"}, {"id": "2-083", "cat": "unexpected", "catName": "돌발 질문", "num": 17, "topic": "가구", "topicEn": "Furniture", "type": "취향", "badge": "83 취향", "enQ": "What is your favorite piece of furniture at home, and why do you like it? Tell me about it in detail.", "enA": "If I had to choose, it's my gray sofa — no contest. If my home were a movie, that sofa would be the lead actor: three seats wide, soft fabric, deep enough to swallow you whole. It sits right across from the TV, with my new side table standing guard beside it.\n\nWhy do I love it? Because everything good in my day ends there. For me, it's all about that landing moment: after the jog, after the shower, I sink into my spot — the left corner, of course, which by now has memorized my shape. YouTube, my cooking show, naps, long calls with my best friend — that sofa hosts them all.\n\nHonestly, it's less furniture and more family. Nothing beats that first sink after a long day. In a nutshell: chairs are for sitting, beds are for sleeping — but my sofa is for living.", "koQ": "집에서 가장 좋아하는 가구는 무엇이고, 왜 그것을 좋아하나요? 그것에 대해 자세히 말해주세요.", "koA": "골라야 한다면 회색 소파예요. 고민할 것도 없죠. 우리 집이 영화라면 그 소파가 주연 배우예요. 3인용 너비에, 부드러운 패브릭, 사람을 통째로 삼킬 만큼 깊숙하죠. TV 정면에 자리 잡고 있고, 옆엔 새 사이드 테이블이 보초를 서요.\n\n왜 좋아하냐고요? 제 하루의 좋은 것들이 전부 거기서 끝나거든요. 저한테 핵심은 그 착지의 순간이에요. 조깅 후에, 샤워 후에, 제 자리에 푹 가라앉는 순간이요. 당연히 왼쪽 구석 자리인데, 이젠 제 모양을 다 외웠을 정도예요. 유튜브, 요리 쇼, 낮잠, 절친과의 긴 통화까지. 그 소파가 다 받아줘요.\n\n솔직히 가구라기보단 가족에 가까워요. 긴 하루 끝의 그 첫 착지만 한 게 없죠. 한마디로, 의자는 앉는 곳이고 침대는 자는 곳이지만, 제 소파는 사는 곳이에요.", "struct": [["1️⃣ 선택", "회색 소파, no contest"], ["2️⃣ 묘사", "3인용 · 패브릭 · TV 정면"], ["3️⃣ 핵심", "하루가 착지하는 자리"], ["4️⃣ 디테일", "내 모양 외운 왼쪽 구석"], ["5️⃣ 명언", "소파는 사는 곳이다"]], "scoring": [["주연 배우 선언", "시리즈 내내 등장한 회색 소파를 주연 배우로 선언 — 시청자(채점자)에겐 이미 아는 가구라 신뢰가 두 배예요 🔁 🎓"], ["착지 프레임", "조깅 후, 샤워 후 — 하루의 좋은 것들이 소파에서 끝난다는 착지 프레임이 좋아하는 이유를 구조로 만들어요 🔑 💕"], ["구석 디테일", "내 모양을 외운 왼쪽 구석 자리 — 단골 자리 디테일 하나가 가구와의 역사를 증명해요 😆 휴대폰 편 영구 자국과 짝꿍!"], ["3단 대구", "의자는 앉는 곳, 침대는 자는 곳, 소파는 사는 곳 — 가구 3종 대구 마무리는 통째로 외울 가치가 있어요 💬 🎓"]], "expr": [["if I had to choose", "골라야 한다면", "취향 도입 공식, 서베이 개근 🔁 🔑"], ["lead actor", "주연 배우", "시리즈 최다 출연 가구 비유 🔁 🎭"], ["swallow you whole", "통째
