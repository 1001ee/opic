, "문제 표현 그대로 회수 ✅ 세 번째 단락 도입 자리에 배치"], ["split the drive", "출발을 쪼개다", "대처법을 구체적인 동사 하나로 ✨ 막연함이 완전히 사라져요"], ["order the food in", "음식을 주문해 먹다", "돌발 휴일 편 완제품 차례상을 자연스럽게 옮긴 영어예요 🔁"], ["skip it and fly somewhere", "건너뛰고 해외로 가다", "가장 요즘다운 대처 ✈️ 한 줄로 시대 변화를 보여 줍니다"], ["doing it the hard way", "어렵게 하는 방식", "변화를 한 구로 요약해 주는 마무리 ⭐ 고난도 전용 표현"]], "audio": "audio/4_고난도/4-006 3. 명절(Holidays)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-006 3. 명절(Holidays)_이슈.mp3"}, {"id": "4-007", "cat": "advanced", "catName": "고난도 질문", "num": 4, "topic": "휴일·명절", "topicEn": "Days Off", "type": "비교", "badge": "07 비교", "enQ": "People celebrate many kinds of holidays throughout the year. Which holidays do you think bring people closer together? Why do those holidays have such a strong effect on relationships or communities?", "enA": "Hands down, the long ones — Chuseok and Seollal. It's not about the food; it's about the length. Three or four days forces people into the same room, and you can't get up after two hours the way you can at a dinner and still call it a proper visit.\n\nCompare that to Christmas here. It's one day, and it's a couples-and-friends thing — lovely, but it doesn't pull a family together. The other thing is that everyone is off at the same time. Nobody has to take a day off or check a calendar.\n\nThat's the real secret, I think. Relationships need boring time, not special time — sitting around after lunch with nothing to do. A short holiday gives you an event; a long one gives you hours. And hours are what close the distance — nothing else really does it.", "koQ": "사람들은 일 년 동안 다양한 휴일을 기념합니다. 어떤 휴일이 사람들을 더 가깝게 만든다고 생각하나요? 왜 그런 휴일이 관계나 공동체에 큰 영향을 준다고 생각하나요?", "koA": "고민할 것도 없이 긴 명절이요. 추석이랑 설날이죠. 음식 때문이 아니에요. 길이 때문이에요. 사흘, 나흘이면 사람들이 같은 방에 있을 수밖에 없어요. 저녁 약속처럼 두 시간 만에 일어나 놓고 제대로 만났다고 하기가 어렵죠.\n\n여기 크리스마스와 비교해 보면요. 하루짜리고 연인이나 친구들끼리 보내는 날이에요. 좋긴 한데 가족을 끌어모으지는 않아요. 또 하나는 다 같이 동시에 쉰다는 거예요. 아무도 따로 연차를 내거나 달력을 맞춰 볼 필요가 없죠.\n\n그게 진짜 비결인 것 같아요. 관계에는 특별한 시간이 아니라 심심한 시간이 필요하거든요. 점심 먹고 할 일 없이 둘러앉아 있는 시간이요. 짧은 휴일은 이벤트를 주고, 긴 휴일은 시간을 줘요. 그리고 거리를 좁히는 건 결국 시간이에요. 다른 건 잘 안 되더라고요.", "struct": [["1️⃣ 선택", "고민할 것도 없이 긴 명절 = 추석 · 설날"], ["2️⃣ 이유", "음식이 아니라 길이 때문! 사흘이면"], ["3️⃣ 대비", "크리스마스 = 하루 · 연인과 친구 중심"], ["4️⃣ 조건", "다 같이 동시에 쉼 → 연차가 필요 없음"], ["5️⃣ 통찰", "특별한 시간보다 심심한 시간 ⭐ 대구로"]], "scoring": [["왜에 답하기", "어떤 휴일이냐보다 왜냐가 본론이에요 🔑 길이와 동시성 두 축으로 이유를 대 주면 그걸로 충분합니다"], ["3번과 다른 각도", "3번은 명절에 무엇을 하나, 여기는 왜 관계를 가깝게 하나예요 🔁 활동을 또 나열하면 같은 답이 두 번 나온 셈이 되고 맙니다"], ["반례가 근거", "크리스마스를 반례로 세우면 주장이 저절로 증명돼요 ⭐ 하루짜리 · 연인 중심이라는 대비 하나면 충분하니 길게 쓰지 마세요"], ["심심한 시간", "특별한 시간이 아니라 심심한 시간이라는 뒤집기가 이 페이지의 승부처예요 ⭐ 고난도 점수는 결국 이런 한 줄에서 갈립니다"]], "expr": [["hands down", "고민할 것도 없이", "돌발 전화 편 재활용 🔁 망설임 없는 즉답형 오프닝이에요"], ["It's not about ~", "~ 때문이 아니다", "흔한 오해를 먼저 걷어내는 도입 🔑 주장이 또렷해집니다"], ["force people into the same room", "같은 방에 있게 만들다", "길이의 효과를 동사 하나로 ⭐ 이 답변의 핵심 근거가 돼요"], ["a couples-and-friends thing", "연인 · 친구들의 날", "문화적 성격을 명사구 하나로 압축해 주는 표현이에요 ✨"], ["pull a family together", "가족을 끌어모으다", "가깝게 만든다를 구동사로 💕 질문 표현을 그대로 회수해요"], ["at the same time", "동시에", "동시성이 이 페이지 주장의 두 번째 기둥이 되어 줍니다 🔑"], ["take a day off", "연차를 내다", "돌발 직업 편 재활용 🔁 직장인이라면 반드시 필수인 어휘"], ["boring time", "심심한 시간", "이 페이지를 살려 주는 결정적인 한 단어 ⭐ 반드시 쓰세요"], ["gives you an event ↔ hours", "이벤트 ↔ 시간", "대구로 만들어 둔 마무리 문장 ✨ 말의 리듬까지 같이 잡혀요"], ["close the distance", "거리를 좁히다", "관계 주제 마무리 전용 표현 💕 한 줄로 깔끔하게 닫아요"], ["Compare that to ~", "그것과 비교하면", "비교 유형 연결어 🔁 두 번째 단락 도입 자리에 배치하기"]], "audio": "audio/4_고난도/4-007 4. 휴일·명절(Days Off)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-007 4. 휴일·명절(Days Off)_비교.mp3"}, {"id": "4-008", "cat": "advanced", "catName": "고난도 질문", "num": 4, "topic": "휴일·명절", "topicEn": "Days Off", "type": "이슈", "badge": "08 이슈", "enQ": "These days, the news often talks about holidays as a chance for people to rest and recharge. Have you seen any stories about how holidays influence people's lives or routines? Why do you think taking time off during holidays is seen as important?", "enA": "I did see something about this — substitute holidays. When a public holiday falls on a weekend, we now get the Monday instead. It was all over the news, mostly because everyone was counting the long weekends on a calendar.\n\nThe other story that keeps coming back is unused annual leave. A lot of office workers leave days on the table every year, so companies now push people to use them. My own office sends a reminder in November, which tells you how bad it got.\n\nWhy does it matter? Because rest isn't a reward — it's part of the job. Personally, I notice it in myself: after a long weekend I come back sharper, and after a skipped one I just move slower. A day off isn't lost time. It's the reason the other days work.", "koQ": "요즘 뉴스는 휴일을 쉬고 재충전하는 기회로 다룹니다. 휴일이 삶이나 일상에 주는 영향을 다룬 이야기를 본 적 있나요? 왜 휴일에 쉬는 게 중요하다고 보나요?", "koA": "그런 뉴스 본 적 있어요. 대체공휴일이요. 공휴일이 주말과 겹치면 이제 월요일을 대신 쉬어요. 뉴스에 엄청 많이 나왔죠. 다들 달력 놓고 연휴를 세고 있었거든요.\n\n계속 다시 올라오는 다른 기사는 안 쓴 연차예요. 사무직 중에 해마다 연차를 남기는 사람이 많아서, 이제는 회사가 쓰라고 떠밀죠. 저희 회사도 11월이면 알림을 보내요. 상황이 어느 정도인지 알 만하죠.\n\n왜 중요하냐고요? 쉬는 건 보상이 아니라 일의 일부니까요. 개인적으로도 느껴요. 긴 연휴 뒤에는 머리가 더 잘 돌아가고, 건너뛴 다음엔 그냥 느려져요. 쉬는 날은 잃어버린 시간이 아니에요. 나머지 날들이 굴러가는 이유죠.", "struct": [["1️⃣ 뉴스", "대체공휴일 → 주말과 겹치면 월요일로"], ["2️⃣ 반응", "다들 달력 놓고 연휴 세기 😆 화제였음"], ["3️⃣ 기사", "안 쓴 연차 · 회사가 쓰라고 떠미는 중"], ["4️⃣ 사례", "우리 회사도 11월이면 알림 발송 ⏰"], ["5️⃣ 의견", "쉬는 건 보상이 아니라 일의 일부 ⭐"]], "scoring": [["뉴스 두 개", "봤냐는 질문엔 구체적인 기사 두 개로 🔑 대체공휴일과 안 쓴 연차, 이 두 개면 충분하고도 남습니다"], ["내 회사 사례", "뉴스만 말하면 남 얘기로 들려요 ⭐ 11월 알림처럼 내 주변 사례를 하나만 붙이면 본 적 있다가 실제로 증명됩니다"], ["의견은 분리", "마지막 질문이 왜 중요하냐입니다 ✅ Personally로 확실히 끊고 내 생각을 따로 얹어야 세 번째 질문까지 답한 것이 됩니다"], ["대구로 닫기", "쉬는 건 보상이 아니라 일의 일부 ⭐ 이런 대구 한 줄이 고난도 답변의 마무리 공식이에요. 4번 ①번 마무리와 같은 기술입니다 🔁"]], "expr": [["I did see something about ~", "그런 뉴스 본 적 있어요", "뉴스형 이슈 전용 오프닝 🔑 첫 문장에 바로 꺼내 쓰세요"], ["substitute holiday", "대체공휴일", "제도 이름을 그대로 📖 따로 설명을 붙일 필요가 전혀 없어요"], ["fall on a weekend", "주말과 겹치다", "겹친다를 동사 하나로 ✨ 제도 설명이 확 짧아지는 표현이죠"], ["be all over the news", "뉴스에 도배되다", "화제성을 보여 주는 관용구 💬 봤다는 증거까지 확보돼요"], ["count the long weekends", "연휴를 세다", "사람들 반응을 장면 하나로 😆 설명이 아예 필요 없어져요"], ["keep coming back", "계속 다시 올라오다", "반복 보도를 구동사 하나로 🔁 두 번째 기사 도입 자리에"], ["unused annual leave", "안 쓴 연차", "직장 뉴스의 핵심 명사구 🔑 그대로 통째로 외워 두면 좋아요"], ["leave days on the table", "연차를 남기다", "아깝게 흘려보낸다는 뉘앙스까지 같이 담긴 표현이에요 ⭐"], ["Why does it matter?", "왜 중요하냐면", "문제의 마지막 질문을 그대로 회수합니다 ✅ 3단락 도입용"], ["rest isn't a reward", "쉬는 건 보상이 아니다", "내 의견을 대구 한 줄로 압축 ⭐ 고난도 마무리 공식이죠"], ["come back sharper", "더 잘 돌아오다", "개인 경험으로 주장을 받쳐 주는 한마디예요 💪 신뢰도 상승"]], "audio": "audio/4_고난도/4-008 4. 휴일·명절(Days Off)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-008 4. 휴일·명절(Days Off)_이슈.mp3"}, {"id": "4-009", "cat": "advanced", "catName": "고난도 질문", "num": 5, "topic": "건강", "topicEn": "Health", "type": "비교", "badge": "09 비교", "enQ": "How did people in your country stay healthy when you were young, and how do they do it now? Tell me how the ways people maintain their health have changed over time.", "enA": "Back then, staying healthy wasn't a plan — it was just how life worked. People walked everywhere, climbed a mountain on Sundays, and ate whatever was on the table: rice, soup, a wall of side dishes. Nobody counted anything or called it exercise.\n\nThese days it's a completely different story. Health has become something you measure. Everyone wears a watch that counts steps and heart rate, follows a home workout, and stacks supplements on the shelf. We even book check-ups we used to skip, and my parents now check a sleep score too.\n\nCompared to back then, we know way more and move way less. The trade-off is clear: my parents never heard the word protein, but they walked an hour a day without calling it exercise. I have to admit the data helps. It just can't walk.", "koQ": "당신이 어릴 때 당신의 나라 사람들은 어떻게 건강을 유지했나요? 지금은 어떤가요? 건강 관리 방법이 어떻게 변했는지 말해 주세요.", "koA": "예전엔 건강 관리가 계획이 아니라 그냥 사는 방식이었어요. 다들 걸어 다녔고, 일요일이면 산에 올랐고, 상에 올라온 걸 먹었어요. 밥, 국, 줄줄이 늘어선 반찬이요. 아무도 뭘 세거나 운동이라고 부르지 않았고요.\n\n요즘은 완전히 다른 이야기예요. 건강이 측정하는 것이 됐거든요. 다들 걸음 수와 심박을 재는 시계를 차고, 홈트 영상을 따라 하고, 부엌 선반에 영양제를 쌓아 둬요. 예전엔 건너뛰던 검진도 예약하고요. 부모님도 아침이면 수면 점수를 확인하세요.\n\n예전과 비교하면 훨씬 많이 알고 훨씬 덜 움직여요. 얻고 잃은 게 바로 보이죠. 부모님은 단백질이라는 말도 모르셨지만 운동이라고 부르지 않으면서 하루 한 시간을 걸으셨어요. 데이터가 도움이 된다는 건 인정해요. 다만 대신 걸어 주지는 않죠.", "struct": [["1️⃣ 과거", "건강 관리 = 계획이 아니라 사는 방식"], ["2️⃣ 장면", "어디든 걷기 · 일요일 등산 · 집밥"], ["3️⃣ 현재", "측정의 시대 → 걸음 수 · 심박 · 검진"], ["4️⃣ 대비", "훨씬 많이 알고 훨씬 덜 움직임 ⭐"], ["5️⃣ 마무리", "데이터는 대신 걸어 주지 않는다 😊"]], "scoring": [["과거는 생활", "예전 건강법은 운동이 아니라 생활이었다로 열기 🔑 그 한 줄이 이 페이지 비교의 축을 통째로 만들어 줍니다"], ["측정이 키워드", "요즘을 한 단어로 묶으면 측정이에요 ⭐ 걸음 수 · 심박 · 검진처럼 재는 행위로 나열하면 현재가 아주 선명하게 잡히고 분량도 같이 채워집니다"], ["돌발 편과 구분", "돌발 20.건강 ⑤비교는 치료에서 예방으로가 축이었어요 🔁 여기는 측정과 데이터 축으로 가야 같은 답이 두 번 나오지 않습니다"], ["대신 걸어 주진", "데이터가 대신 걸어 주지는 않는다는 대구로 닫기 ⭐ 좋아졌다 나빠졌다 대신 역설을 남기면 확실히 고난도 답변으로 들립니다"]], "expr": [["Back then ↔ These days", "그때는 ↔ 요즘은", "돌발 비교 유형 기본 골격 🔁 이 둘만 세워도 절반은 완성"], ["how life worked", "그냥 사는 방식", "건강이 곧 일상이었다는 걸 한 구로 ⭐ 고난도 표현"], ["walk everywhere", "어디든 걸어 다니다", "과거 장면을 동사 하나로 ✨ 긴 설명이 필요 없어요"], ["a wall of side dishes", "줄줄이 늘어선 반찬", "한식 상차림을 한 컷으로 📖 문화 설명 점수까지"], ["count anything", "뭐든 숫자로 세다", "측정 시대와 대비되는 부정 표현 🔑 복선 역할이죠"], ["something you measure", "측정하는 것", "이 페이지의 핵심 한 구 ⭐ 현재를 정의해 줍니다"], ["count steps and heart rate", "걸음 수와 심박을 재다", "스마트워치를 명사 없이 설명 ✨ 훨씬 자연스러워요"], ["stack supplements", "영양제를 쌓아 두다", "요즘 부엌 풍경을 동사 하나로 ✨ 장면이 그려져요"], ["book a check-up", "건강검진을 예약하다", "롤플 병원 예약 편 재활용 🔁 제도 어휘로 유용해요"], ["The trade-off is ~", "대신 잃는 건 ~이다", "2번 ①번 재활용 🔁 고난도 전용 채점 포인트예요"], ["I have to admit", "인정할 수밖에 없다", "비교 유형 공통 마무리 🔁 한 스푼의 솔직함 담당"]], "audio": "audio/4_고난도/4-009 5. 건강(Health)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-009 5. 건강(Health)_비교.mp3"}, {"id": "4-010", "cat": "advanced", "catName": "고난도 질문", "num": 5, "topic": "건강", "topicEn": "Health", "type": "이슈", "badge": "10 이슈", "enQ": "Talk about some health-related news you have recently read or watched. What was it about? Do people often discuss that news, and what do they think about the issue?", "enA": "I did see something about this recently — ultra-processed food. The point wasn't sugar or fat. It was how far the food has travelled from its original form, and it was everywhere for about a month, which almost never happens with a food story.\n\nDo people talk about it? Constantly. My office turned into a label-reading club for a while — everyone flipping packets over at lunch to count the ingredients. Even the convenience store downstairs moved the protein snacks to the front and pushed the sweet ones to the back shelf.\n\nOpinions are split, though. Some call it another scare story that will pass in a year. Others quietly changed what they buy. Personally, I think the useful part wasn't the warning itself — it was that people finally started looking at what they actually eat instead of only counting calories.", "koQ": "최근에 읽거나 본 건강 관련 뉴스에 대해 말해 주세요. 어떤 내용이었나요? 사람들이 자주 이야기하나요? 그 문제를 어떻게 생각하나요?", "koA": "최근에 그런 뉴스 봤어요. 초가공식품이요. 설탕이나 지방이 핵심이 아니라, 그 음식이 원래 형태에서 얼마나 멀어졌느냐가 문제라는 거였죠. 한 달쯤은 어디서나 그 얘기였는데, 음식 기사가 그렇게까지 퍼지는 일은 거의 없거든요.\n\n사람들이 얘기하냐고요? 계속해요. 한동안 저희 사무실은 성분표 읽기 모임이 됐어요. 점심때마다 다들 봉지를 뒤집어서 원재료 개수를 세고 있었거든요. 아래층 편의점도 단백질 간식을 앞쪽 매대로 옮기고 단 과자는 뒤로 밀어 놨어요.\n\n그래도 의견은 갈려요. 또 하나의 공포 기사고 일 년이면 지나갈 거라는 사람도 있고, 조용히 장 보는 걸 바꾼 사람도 있어요. 개인적으로는 경고 자체보다, 사람들이 칼로리만 세는 대신 자기가 실제로 뭘 먹는지 들여다보기 시작했다는 게 진짜 소득이라고 봐요.", "struct": [["1️⃣ 뉴스", "초가공식품 → 원래 형태에서 멀어진 것"], ["2️⃣ 화제", "한 달 내내 어디서나 그 얘기 💬"], ["3️⃣ 반응", "사무실은 성분표 읽기 모임 · 봉지 뒤집기"], ["4️⃣ 변화", "편의점 매대까지 바뀜 → 영향의 증거"], ["5️⃣ 의견", "들여다보기 시작한 게 소득 ⭐ Personally"]], "scoring": [["뉴스는 하나만", "기사를 여러 개 늘어놓지 말고 하나를 깊게 파세요 🔑 무엇에 관한 뉴스였나에 배점이 몰려 있습니다"], ["반응이 본론", "자주 얘기하냐가 두 번째 질문이에요 ⭐ 사무실 · 편의점처럼 주변이 바뀐 장면을 대 주면 자주라는 말이 확실하게 증명됩니다"], ["양쪽 다 말하기", "사람들이 어떻게 생각하냐에는 갈린다로 답하세요 💬 한쪽 의견만 말하면 질문의 절반만 답한 셈이 되니 양쪽을 다 얹어 주셔야 합니다"], ["10번과 구분", "고난도 10.음식 ②이슈는 함께 먹기 뉴스예요 🔁 초가공식품은 건강 편 전용으로 남겨 두고 거기서 또 꺼내 쓰지 않도록 아껴 두세요"]], "expr": [["ultra-processed food", "초가공식품", "건강 뉴스 최신 키워드 🔑 그대로 쓰면 최신감까지"], ["far from its original form", "원래 형태에서 먼", "기사 요지를 한 구로 ⭐ 요약 능력을 증명해 줍니다"], ["be everywhere for a month", "한 달 내내 화제였다", "4번 ②번 all over the news 의 짝 표현이에요 🔁"], ["Do people talk about it?", "사람들이 얘기하나요", "문제 표현 그대로 회수 ✅ 두 번째 단락 도입용"], ["a label-reading club", "성분표 읽기 모임", "유행을 농담조 명사구로 😆 장면이 바로 그려져요"], ["flip a packet over", "봉지를 뒤집다", "행동 하나로 반응을 증명 ✨ 설명이 필요 없어요"], ["move ~ to the front", "~을 앞쪽으로 옮기다", "가게까지 바뀐 것 = 영향의 물리적 증거 📏"], ["Opinions are split", "의견이 갈리다", "이슈 유형 양면 제시 전용 ⭐ 꼭 넣어 주세요"], ["another scare story", "또 하나의 공포 기사", "반대편 의견을 명사구 하나로 💬 균형이 잡혀요"], ["quietly change what they buy", "조용히 장 보는 걸 바꾸다", "말이 아니라 행동으로 반응한 쪽 ✨ 대비가 살죠"], ["Personally, ~", "개인적으로는 ~", "뉴스형 이슈에서 의견을 분리하는 신호예요 ✅"]], "audio": "audio/4_고난도/4-010 5. 건강(Health)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-010 5. 건강(Health)_이슈.mp3"}, {"id": "4-011", "cat": "advanced", "catName": "고난도 질문", "num": 6, "topic": "헬스장", "topicEn": "Gym", "type": "비교", "badge": "11 비교", "enQ": "People go to the gym with many different goals. What are some typical goals people have when they exercise there? Why might one person focus on a certain goal more than others?", "enA": "People walk into a gym with three completely different goals. Some want to lose weight, some want to build muscle, and some — like me — just want their body to stop complaining by the end of the day, which is a lower bar than it sounds.\n\nWhat decides it is usually your life, not your personality. A student has time and wants to look different. An office worker has a stiff neck from eight hours in a chair and wants to keep it moving. Someone older wants to stay independent for as long as possible.\n\nThat's why one room can look like three rooms — the mirrors, the free weights, and the quiet corner with the mats. If I had to pick the most common goal these days, it's the third one. People come in to undo their desk, not to win anything.", "koQ": "사람들은 다양한 목표를 가지고 헬스장에 갑니다. 사람들이 헬스장에서 갖는 일반적인 목표는 무엇인가요? 왜 어떤 사람은 특정 목표에 더 집중할까요?", "koA": "사람들은 완전히 다른 세 목표를 가지고 헬스장에 들어와요. 누구는 살을 빼고, 누구는 몸을 만들고, 저 같은 사람은 그냥 하루가 끝날 때 몸이 아우성치지 않기를 바랄 뿐이에요. 말은 소박해 보여도 생각보다 어려운 목표죠.\n\n그걸 정하는 건 보통 성격이 아니라 삶이에요. 학생은 시간이 있고 달라 보이고 싶어 해요. 직장인은 여덟 시간 의자에 앉아 굳은 목을 데리고 와서 계속 움직이게 하고 싶어 하고요. 나이가 있는 분들은 가능한 한 오래 스스로 생활하는 상태를 지키고 싶어 하시고요.\n\n그래서 한 공간이 세 개처럼 보여요. 거울 앞, 프리웨이트 구역, 그리고 매트가 깔린 조용한 구석이요. 요즘 가장 흔한 목표를 굳이 고르라면 세 번째예요. 사람들은 뭘 이기러 오는 게 아니라 자기 책상을 되돌리러 오거든요.", "struct": [["1️⃣ 세 개", "살 빼기 · 몸 만들기 · 버티기 세 갈래"], ["2️⃣ 기준", "성격이 아니라 삶이 정함 → 학생 · 직장인"], ["3️⃣ 사례", "8시간 의자 → 굳은 목 → 계속 움직이려고"], ["4️⃣ 장면", "거울 앞 · 프리웨이트 · 조용한 구석"], ["5️⃣ 마무리", "요즘 제일 흔한 건 책상을 되돌리기 ⭐"]], "scoring": [["세 개로 열기", "목표를 세 개로 세우고 시작하기 🔑 두 개면 빈약하고 네 개가 되면 각각이 얇아져서 흐려지고 맙니다"], ["이유가 본론", "왜 사람마다 다른가가 두 번째 질문이에요 ⭐ 취향이 아니라 생활이 정한다로 답하면 단순한 나열이 아니라 분석하는 답변으로 들립니다"], ["롤플 편과 구분", "롤플레이 8.헬스장은 등록과 폐업 사건이었어요 🔁 여기서는 목표 이야기만 하고 그 사건은 꺼내지 마세요. 소재가 겹치면 손해입니다"], ["책상을 되돌리기", "undo your desk 한 줄이 이 페이지의 승부처예요 ⭐ 운동 목적을 사무직의 언어로 바꿔 놓은 표현이라 채점자 기억에 오래 남습니다"]], "expr": [["three completely different goals", "완전히 다른 세 목표", "세 개로 세우는 도입 🔑 답변 구조가 바로 잡혀요"], ["lose weight ↔ build muscle", "감량 ↔ 벌크업", "헬스장 목표의 기본 두 축 ✨ 대구로 붙여 쓰기"], ["stop complaining", "아우성을 멈추다", "몸이 아프다를 의인화로 😆 고난도 묘사 기술이죠"], ["What decides it is ~", "그걸 정하는 건 ~이다", "왜냐는 질문에 곧바로 답하는 구문이에요 🔑"], ["to look different", "달라 보이려고", "목적을 to부정사로 압축 📏 세 번 반복해도 좋아요"], ["a stiff neck", "굳은 목", "사무직 증상을 명사구 하나로 ✨ 공감까지 확보"], ["keep it moving", "계속 움직이게 하다", "치료가 아니라 유지라는 뉘앙스가 살아요 ⭐"], ["stay independent", "스스로 생활하다", "노년의 목표를 품위 있게 옮긴 표현이에요 💕"], ["the quiet corner with the mats", "매트 깔린 조용한 구석", "공간 묘사로 목표를 보여 주는 방식 🎭 고난도"], ["undo your desk", "책상을 되돌리다", "이 페이지의 결정적 한마디 ⭐ 반드시 쓰세요"], ["If I had to pick", "굳이 고르라면", "시리즈 공통 선택 구문 🔁 마무리 직전 자리에"]], "audio": "audio/4_고난도/4-011 6. 헬스장(Gym)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-011 6. 헬스장(Gym)_비교.mp3"}, {"id": "4-012", "cat": "advanced", "catName": "고난도 질문", "num": 6, "topic": "헬스장", "topicEn": "Gym", "type": "이슈", "badge": "12 이슈", "enQ": "Gyms have recently been in the news as places where people not only exercise but also build a community. Have you seen any stories about how gyms influence social life or daily routines? Why do you think more people treat gyms as social spaces these days?", "enA": "I have seen that, yes — mostly about running crews and climbing gyms. The reports said people sign up for the group, not the workout, and that bouldering gyms now have a waiting list on weekday evenings, which used to be unthinkable.\n\nWhy is that happening? Two reasons. More people live alone, and after work they want company that doesn't come with obligations. And apps make it one tap — you join a crew, show up on Thursday, and nobody asks for your number.\n\nPersonally, I get it. On my own I quit in three weeks. With people waiting at the river at seven, I go even when I don't want to. A gym used to be a room with machines. Now it's closer to a club that happens to have equipment.", "koQ": "최근 헬스장은 운동뿐 아니라 커뮤니티를 만드는 공간으로 뉴스에 나옵니다. 그런 이야기를 본 적 있나요? 왜 사람들이 헬스장을 사교 공간으로 여길까요?", "koA": "네, 그런 기사 봤어요. 주로 러닝 크루랑 클라이밍장 얘기였죠. 사람들이 운동이 아니라 모임에 등록한다는 내용이었고, 평일 저녁 볼더링장에는 이제 대기자 명단까지 생겼다고 하더라고요. 예전 같으면 상상도 못 할 일이죠.\n\n왜 그럴까요? 이유는 두 개라고 봐요. 혼자 사는 사람이 늘었고, 퇴근 후에 의무가 따라오지 않는 관계를 원하거든요. 그리고 앱이 그걸 한 번에 되게 만들어요. 크루에 가입하고, 목요일에 나가고, 아무도 전화번호를 묻지 않죠.\n\n개인적으로도 이해가 가요. 혼자서는 3주면 그만두거든요. 그런데 일곱 시에 강변에서 사람들이 기다리면 하기 싫은 날에도 나가게 돼요. 예전에 헬스장은 기계가 놓인 방이었어요. 지금은 장비가 있는 클럽에 더 가깝습니다.", "struct": [["1️⃣ 뉴스", "러닝 크루 · 클라이밍장 커뮤니티 기사"], ["2️⃣ 근거", "평일 저녁 대기 · 운동 아닌 모임에 등록"], ["3️⃣ 원인", "1인 가구 증가 + 의무 없는 관계 수요"], ["4️⃣ 장치", "앱으로 한 번에 가입 → 번호도 안 물음"], ["5️⃣ 의견", "혼자면 3주, 기다리면 계속 감 ⭐"]], "scoring": [["봤다 + 무엇을", "봤냐는 질문엔 러닝 크루처럼 이름을 대 주세요 🔑 막연히 봤다고만 하면 점수가 전혀 붙지 않습니다"], ["원인 두 개", "왜 그러냐가 마지막 질문이에요 ⭐ 1인 가구와 앱 두 개면 충분하고, 각각에 한 문장씩만 붙여 주면 답변 분량까지 딱 맞아떨어집니다"], ["4번 ②번과 짝", "뉴스형 이슈의 골격은 4번 ②번과 똑같아요 🔁 봤다 → 내용 → 원인 → Personally 순서를 그대로 가져다 쓰면 그걸로 충분합니다"], ["클럽이 된 방", "기계가 놓인 방에서 장비가 있는 클럽으로 ⭐ 이 대구 한 줄이 헬스장의 변화를 통째로 요약해 주는 이 페이지의 진짜 승부처입니다"]], "expr": [["running crew", "러닝 크루", "돌발 건강 편 재활용 🔁 요즘 운동 문화 핵심 명사"], ["sign up for the group", "모임에 등록하다", "기사 요지를 한 구로 ⭐ 대구까지 살리면 최고예요"], ["a waiting list", "대기자 명단", "인기를 숫자 없이 증명 📏 한 단어면 충분합니다"], ["Why is that happening?", "왜 그런 걸까요", "문제의 마지막 질문을 미리 회수 ✅ 3단락 도입용"], ["live alone", "혼자 살다", "1인 가구를 어렵지 않게 옮긴 표현이에요 🏠"], ["come with obligations", "의무가 따라오다", "느슨한 관계를 한 구로 ⭐ 고난도 어휘입니다"], ["make it one tap", "한 번에 되게 하다", "앱 시대를 동사로 ✨ 설명이 확 짧아져요"], ["On my own", "혼자서는", "개인 경험으로 넘어가는 신호예요 💪 의견 분리"], ["quit in three weeks", "3주 만에 그만두다", "숫자로 솔직함을 증명 📏 공감까지 얻습니다"], ["a room with machines", "기계가 놓인 방", "옛 헬스장을 한 구로 ⭐ 뒤 문장과 대구를 이뤄요"], ["even when I don't want to", "하기 싫은 날에도", "지속의 이유를 한 줄로 💕 마무리 직전 자리에"]], "audio": "audio/4_고난도/4-012 6. 헬스장(Gym)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-012 6. 헬스장(Gym)_이슈.mp3"}, {"id": "4-013", "cat": "advanced", "catName": "고난도 질문", "num": 7, "topic": "공원", "topicEn": "Parks", "type": "비교", "badge": "13 비교", "enQ": "Choose two well-known parks and compare them. How are the two parks similar, and how are they different? Which one do you prefer? Tell me how they differ.", "enA": "Let me take Hangang Park and Olympic Park. What they have in common is scale — both are big enough that you can't see the end of them — and both are free, which in a city like Seoul matters more than it sounds, because almost nothing else is.\n\nThe difference is what they're shaped for. Hangang is long and flat, laid along the river: running, cycling, fried chicken on a mat at ten at night. Olympic Park is hills, lawns and old sculptures, plus a dome that hosts concerts on the far side.\n\nSo one is for moving and the other is for staying. If I had to pick, Hangang — it's ten minutes from my place and I run there in the evening. But compared to Hangang, Olympic Park is where I'd go to actually sit down and do nothing.", "koQ": "잘 알려진 공원 두 곳을 골라 비교해 주세요. 두 공원은 어떤 점이 비슷하고 어떤 점이 다른가요? 어느 쪽을 더 좋아하나요?", "koA": "한강공원과 올림픽공원으로 할게요. 두 곳의 공통점은 규모예요. 둘 다 끝이 안 보일 만큼 크고, 게다가 둘 다 무료거든요. 서울 같은 도시에서 이건 생각보다 큰 장점이에요. 공짜인 공간이 거의 없으니까요.\n\n차이는 어떤 용도로 생긴 공간이냐예요. 한강은 강을 따라 길고 평평해요. 달리고, 자전거 타고, 밤 열 시에 돗자리 펴고 치킨을 먹는 곳이죠. 올림픽공원은 언덕과 잔디밭, 오래된 조각들, 그리고 저쪽 끝에 공연이 열리는 돔이 있는 곳이고요.\n\n그러니까 한쪽은 움직이는 곳이고 다른 한쪽은 머무는 곳이에요. 굳이 고르라면 한강이요. 집에서 10분이고 저녁마다 거기서 뛰거든요. 그래도 한강과 비교하면, 진짜로 앉아서 아무것도 안 하고 싶을 때 가는 곳은 올림픽공원이에요.", "struct": [["1️⃣ 선정", "한강공원 · 올림픽공원 두 곳을 지정"], ["2️⃣ 공통", "끝이 안 보이는 규모 + 무료라는 공통점"], ["3️⃣ 차이", "한강 = 길고 평평 · 러닝 · 밤 열 시 야식"], ["4️⃣ 대조", "올림픽공원 = 언덕 · 잔디 · 조각 · 돔 🔁"], ["5️⃣ 선호", "움직이는 곳 vs 머무는 곳 → 저는 한강"]], "scoring": [["두 곳 먼저", "어느 공원과 어느 공원인지 첫 문장에 못 박기 🔑 이름이 먼저 나와야 채점자가 따라올 수 있습니다"], ["공통 → 차이", "규모와 무료로 먼저 묶고 차이로 넘어가기 ⭐ 공통점 없이 차이만 늘어놓으면 그건 비교가 아니라 설명 두 개일 뿐입니다"], ["모양이 곧 용도", "길고 평평 vs 언덕과 잔디 ⭐ 지형만으로 용도가 갈린다는 축을 잡으면 그대로 분석이 되고 문장도 저절로 이어집니다"], ["서베이 편과 구분", "서베이 2.공원은 우리 동네 공원 묘사였어요 🔁 여기는 유명한 두 곳 비교라 각도가 다르니 동네 공원 이야기는 쓰지 마세요"]], "expr": [["What they have in common", "두 곳의 공통점은", "1번 ①번 재활용 🔁 비교는 공통점부터 묶고 시작"], ["can't see the end of it", "끝이 안 보이다", "규모를 숫자 없이 보여 주는 표현 📏 훨씬 쉬워요"], ["what they are shaped for", "어떤 용도로 생겼나", "차이의 축을 한 구로 ⭐ 이 페이지의 분석 포인트"], ["long and flat", "길고 평평한", "지형을 형용사 두 개로 ✨ 용도까지 같이 설명돼요"], ["fried chicken on a mat", "돗자리 위의 치킨", "한강 문화를 한 컷으로 📖 설명 없이도 통해요"], ["hills, lawns and sculptures", "언덕 · 잔디 · 조각", "명사 세 개 나열로 대비 📏 대구 구조가 살아요"], ["a dome that hosts concerts", "공연이 열리는 돔", "서베이 콘서트 편 재활용 🔁 설정이 이어집니다"], ["for moving ↔ for staying", "움직이는 곳 ↔ 머무는 곳", "두 공원을 한 대구로 압축 ⭐ 고난도 마무리 기술"], ["compared to ~", "~과 비교하면", "비교 유형 고정 연결어 🔁 마지막 단락 첫 문장에"], ["to actually sit down", "진짜로 앉아 있으려고", "선호를 뒤집는 한마디 😊 답이 입체적이 돼요"], ["it matters more than it sounds", "생각보다 큰 장점이다", "무료라는 평범한 사실에 무게를 얹는 구문 ⭐"]], "audio": "audio/4_고난도/4-013 7. 공원(Parks)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-013 7. 공원(Parks)_비교.mp3"}, {"id": "4-014", "cat": "advanced", "catName": "고난도 질문", "num": 7, "topic": "공원", "topicEn": "Parks", "type": "이슈", "badge": "14 이슈", "enQ": "Tell me about the problems parks are facing these days. What difficulties do they have, and what caused these concerns? How can these problems be solved, and what should people do?", "enA": "Two problems stand out — rubbish and bicycles. Delivery has moved outdoors, so on a summer night the grass is covered in plastic containers, and the city keeps taking bins away to stop people dumping household waste there, which only makes it worse.\n\nThe other one is traffic inside the park. Cyclists and walkers share the same strip, and at seven in the evening it's a near miss every hundred meters, especially where the path bends. What caused it is simple: the crowds doubled and the paths stayed the same width for ten years.\n\nIt can be fixed, though. Put sorting stations back at the exits instead of removing bins, and separate the lanes properly. And people have to carry their own rubbish out. A park is the one space nobody owns, which is why it needs everybody.", "koQ": "요즘 공원들이 겪는 문제에 대해 말해 주세요. 어떤 어려움이 있고 무엇이 그 문제를 만들었나요? 어떻게 해결할 수 있고 사람들은 무엇을 해야 할까요?", "koA": "눈에 띄는 문제는 두 개예요. 쓰레기와 자전거요. 배달이 밖으로 나오면서 여름밤이면 잔디밭이 플라스틱 용기로 덮이죠. 그런데 시는 생활 쓰레기를 버린다는 이유로 쓰레기통을 자꾸 치우는데, 그게 오히려 상황을 더 나쁘게 만들어요.\n\n다른 하나는 공원 안의 교통이에요. 자전거와 보행자가 같은 길을 나눠 쓰거든요. 저녁 일곱 시면 백 미터마다 아슬아슬한 순간이 생기죠. 길이 꺾이는 곳은 특히 그렇고요. 원인은 간단해요. 사람은 두 배가 됐는데 길은 10년째 그대로 그 폭이니까요.\n\n그래도 고칠 수 있어요. 쓰레기통을 없애는 대신 출구마다 분리수거 스테이션을 두고, 자전거 길과 산책로를 나누면 되죠. 그리고 자기 쓰레기는 자기가 들고 나가야죠. 공원은 아무도 소유하지 않은 유일한 공간이라 모두가 필요한 곳이거든요.", "struct": [["1️⃣ 두 개", "문제는 쓰레기와 자전거 두 가지 ✨"], ["2️⃣ 쓰레기", "배달 용기가 잔디를 덮음 + 쓰레기통 감소"], ["3️⃣ 충돌", "자전거와 보행자가 같은 길 → 백 미터마다"], ["4️⃣ 원인", "사람은 두 배, 길은 10년 전 그 폭"], ["5️⃣ 해결", "분리수거 · 길 분리 · 내 쓰레기는 내가 ✅"]], "scoring": [["문제 → 해결", "질문이 문제 · 원인 · 해결 세 덩어리예요 ✅ 단락마다 하나씩 맡기면 구조가 그대로 완성됩니다"], ["짝을 맞추기", "문제 두 개에 해결도 두 개 ⭐ 쓰레기에는 분리수거 스테이션, 자전거에는 길 분리처럼 하나씩 짝지으면 답이 아주 촘촘해집니다"], ["2번 ②번과 구분", "2번 ②이슈는 축제 주차와 소음이었어요 🔁 여기는 쓰레기와 자전거로 갈라 두었으니 소음 이야기는 아예 꺼내지 마세요"], ["사람이 할 일", "마지막 질문이 사람들은 무엇을 해야 하나입니다 ✅ 자기 쓰레기는 자기가 들고 나간다는 한 줄로 확실히 답하고 닫으세요"]], "expr": [["Two problems stand out", "문제 두 개가 두드러진다", "이슈 유형 도입 🔑 개수부터 못 박고 시작하세요"], ["plastic containers", "플라스틱 배달 용기", "쓰레기를 구체적인 명사로 📏 원인까지 보여 줘요"], ["take bins away", "쓰레기통을 치우다", "역설적인 행정 조치를 동사로 ⭐ 분석이 됩니다"], ["share the same strip", "같은 길을 나눠 쓰다", "충돌의 구조를 한 구로 ✨ 장면이 그려져요"], ["a near miss", "아슬아슬한 순간", "사고 직전을 명사구로 💬 위험을 과장 없이 전달"], ["every hundred meters", "백 미터마다", "빈도를 거리로 환산 📏 숫자가 설득력을 만들어요"], ["What caused it is ~", "원인은 ~이다", "문제의 두 번째 질문을 그대로 회수합니다 ✅"], ["stay the same width", "폭이 그대로다", "변하지 않은 쪽을 짚어 원인 완성 ⭐ 고난도"], ["sorting stations", "분리수거 스테이션", "해결책을 구체적인 시설로 ✅ 막연함이 사라져요"], ["separate the lanes", "길을 분리하다", "두 번째 해결책 ✅ 문제와 하나씩 짝을 맞추기"], ["the one space nobody owns", "아무도 소유하지 않은 공간", "공원을 정의하는 마무리 한 구 ⭐ 여운까지"]], "audio": "audio/4_고난도/4-014 7. 공원(Parks)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-014 7. 공원(Parks)_이슈.mp3"}, {"id": "4-015", "cat": "advanced", "catName": "고난도 질문", "num": 8, "topic": "여가 시간", "topicEn": "Free Time", "type": "비교", "badge": "15 비교", "enQ": "People enjoy all kinds of experiences in their free time. Which kinds of experiences do you think people enjoy most? What do you think shapes a person's preferences for free-time activities?", "enA": "I'd sort it into three kinds. Recovery — sleep, a series, doing nothing. Stimulation — travel, concerts, somewhere new. And achievement — a workout, a course, a side project nobody asked for. Most people move between all three depending on the week.\n\nWhat shapes the preference isn't personality, I think. It's what your job takes from you. If you talk all day, your free time goes quiet. If you sit still all day, you want noise and movement instead. Money and hours decide most of the rest, because every preference has a price.\n\nChildhood counts too. People who were dragged up mountains as kids end up hiking; people who grew up in a library end up reading. If I had to pick the most common one now, it's recovery. Everyone is tired. That's the honest answer.", "koQ": "사람들은 여가 시간에 다양한 경험을 즐깁니다. 사람들이 가장 즐긴다고 생각하는 경험은 어떤 종류인가요? 여가 취향은 무엇이 결정한다고 보나요?", "koA": "저는 세 가지로 나눠요. 회복형은 잠, 드라마, 아무것도 안 하기. 자극형은 여행, 공연, 안 가 본 곳이고요. 성취형은 운동, 수업, 아무도 시키지 않은 사이드 프로젝트 같은 거예요. 대부분은 그 주 컨디션에 따라 셋 사이를 오가고요.\n\n취향을 결정하는 건 성격이 아니라고 봐요. 일이 나한테서 무엇을 가져가느냐예요. 하루 종일 말을 하는 사람은 여가가 조용해지고, 하루 종일 앉아만 있는 사람은 반대로 소리와 움직임을 원하게 되죠. 나머지는 대부분 돈과 시간이 정해요. 모든 취향에는 가격이 붙으니까요.\n\n어릴 때 경험도 한몫해요. 어릴 때 산에 끌려다닌 사람은 결국 등산을 하고, 도서관에서 자란 사람은 결국 책을 읽어요. 요즘 가장 흔한 걸 굳이 고르라면 회복형이에요. 다들 피곤하거든요. 그게 솔직한 답입니다.", "struct": [["1️⃣ 분류", "회복형 · 자극형 · 성취형 세 갈래로"], ["2️⃣ 기준", "성격이 아니라 일이 가져가는 것이 정함"], ["3️⃣ 대비", "말 많이 하면 조용한 여가 · 앉으면 소음"], ["4️⃣ 배경", "어릴 때 경험도 한몫 → 산이면 등산"], ["5️⃣ 마무리", "제일 흔한 건 회복형. 다들 피곤해요 😊"]], "scoring": [["세 갈래 분류", "가장 즐기는 경험을 나열하지 말고 분류하세요 🔑 회복 · 자극 · 성취 세 개면 충분하고도 남습니다"], ["두 번째 질문", "취향을 무엇이 정하냐가 진짜 본론이에요 ⭐ 일이 가져가는 것으로 답하면 앞의 분류가 근거를 얻고 답 전체가 하나로 묶입니다"], ["대구로 예시", "말을 많이 하면 조용한 여가, 앉아 있으면 소음 ✨ 반대되는 두 예시를 붙이면 길게 설명하지 않아도 그대로 이해가 됩니다"], ["짧게 닫기", "다들 피곤하다는 한마디로 닫는 마무리 ⭐ 길게 정리하는 것보다 짧은 한 문장이 훨씬 오래 남는다는 걸 기억해 두세요"]], "expr": [["three kinds", "세 가지 종류", "분류로 여는 도입 🔑 고난도 답변의 기본 골격이죠"], ["recovery ↔ stimulation", "회복형 ↔ 자극형", "두 축을 대구로 세우기 ✨ 세 번째가 살아납니다"], ["a side project nobody asked for", "아무도 시키지 않은 일", "성취형을 농담으로 정의 😆 공감까지 얻어요"], ["What shapes ~ is ...", "~을 정하는 건 …이다", "문제의 두 번째 질문을 그대로 회수합니다 ✅"], ["what your job takes from you", "일이 가져가는 것", "이 페이지의 핵심 한 구 ⭐ 분석의 축이 됩니다"], ["talk all day", "하루 종일 말하다", "직업을 동사 하나로 압축 ✨ 예시가 짧아져요"], ["sit still all day", "하루 종일 앉아 있다", "앞 구와 대구를 이루는 반대 예시예요 ✨"], ["Money and hours", "돈과 시간", "현실 조건을 명사 두 개로 📏 군더더기가 없죠"], ["be dragged up mountains", "산에 끌려다니다", "어린 시절을 수동태 한 구로 😆 장면이 그려져요"], ["grow up in a library", "도서관에서 자라다", "앞 구와 짝을 이루는 과장 표현이에요 ✨"], ["Everyone is tired.", "다들 피곤해요", "짧은 문장 하나로 닫기 ⭐ 여운이 가장 길어요"]], "audio": "audio/4_고난도/4-015 8. 여가 시간(Free Time)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-015 8. 여가 시간(Free Time)_비교.mp3"}, {"id": "4-016", "cat": "advanced", "catName": "고난도 질문", "num": 8, "topic": "여가 시간", "topicEn": "Free Time", "type": "이슈", "badge": "16 이슈", "enQ": "Free time often comes up in the news as something that affects people's well-being. Have you come across any reports about how important having free time is? Why do you think free time can improve people's happiness or health?", "enA": "I did come across a few — mostly the four-day week trials. The reports said output stayed the same and people slept better, and that second part is what got shared everywhere, not the productivity figure the companies cared about.\n\nThe one that stuck with me was different, though. It said we have about the same free time as twenty years ago — it's just cut into pieces. Twenty minutes here, ten there, all of it with a phone in hand. The total looks fine on paper and feels like nothing in real life.\n\nWhy does free time matter? Because rest isn't only the absence of work — it's where you become a person again. Personally, one long evening does more for me than five broken ones. Free time doesn't work in fragments.", "koQ": "여가 시간은 삶의 질에 영향을 주는 것으로 뉴스에 자주 나옵니다. 그런 보도를 접한 적 있나요? 왜 여가 시간이 행복이나 건강에 도움이 된다고 보나요?", "koA": "그런 보도 몇 개 접했어요. 주로 주 4일제 실험 얘기였죠. 생산량은 그대로였고 사람들은 더 잘 잤다는 내용이었는데, 회사들이 신경 쓴 생산량 수치가 아니라 뒤쪽 이야기가 여기저기 퍼졌어요.\n\n그런데 제 기억에 남은 건 좀 다른 기사였어요. 우리가 가진 여가 시간 총량은 20년 전과 비슷한데, 그게 조각조각 잘려 있다는 거였거든요. 여기서 20분, 저기서 10분, 그 시간 내내 손에는 휴대폰이 들려 있고요. 총량은 멀쩡한데 실제로는 쉰 것 같지가 않아요.\n\n왜 여가가 중요하냐고요? 쉬는 게 단순히 일이 없는 상태가 아니라, 다시 사람이 되는 시간이기 때문이에요. 개인적으로는 긴 저녁 하나가 쪼개진 다섯 개보다 훨씬 나아요. 여가는 조각으로는 작동하지 않더라고요.", "struct": [["1️⃣ 뉴스", "주 4일제 실험 → 생산량 유지 · 수면 개선"], ["2️⃣ 확산", "그 뒷부분이 여기저기 퍼짐 💬 화제였음"], ["3️⃣ 기사", "여가 총량은 비슷한데 조각나 있다는 기사"], ["4️⃣ 장면", "여기서 20분 · 저기서 10분 · 손엔 폰"], ["5️⃣ 의견", "긴 저녁 하나 > 쪼개진 다섯 개 ⭐"]], "scoring": [["기사 두 개", "주 4일제와 조각난 시간 두 개면 충분해요 🔑 두 번째 기사가 이 답변의 진짜 무기가 되어 줍니다"], ["4번 ②번과 구분", "4번 ②이슈는 대체공휴일과 연차, 즉 제도 이야기였어요 🔁 여기는 여가의 질로 가야 같은 답이 두 번 나오지 않습니다"], ["왜에 답하기", "마지막 질문이 왜 도움이 되냐입니다 ✅ 일이 없는 상태가 아니라 다시 사람이 되는 시간이라는 정의로 답하면 아주 깔끔해요"], ["조각 이론", "여가는 조각으로는 작동하지 않는다 ⭐ 시간이 부족한 게 아니라 잘려 있다는 관점 하나가 이 페이지를 고난도로 올려 줍니다"]], "expr": [["I did come across ~", "그런 보도 접한 적 있어요", "뉴스형 이슈 오프닝의 변형 🔑 5번 ②번과 짝"], ["the four-day week trial", "주 4일제 실험", "제도 이름을 그대로 📖 최신 뉴스라는 신호까지"], ["output stayed the same", "생산량은 그대로였다", "결과를 한 문장으로 📏 기사 요지가 잡혀요"], ["get shared everywhere", "여기저기 퍼지다", "화제성을 동사로 💬 all over the news 의 짝 🔁"], ["stick with me", "기억에 남다", "두 번째 기사로 넘어가는 신호예요 ✨ 자연스럽죠"], ["cut into pieces", "조각조각 잘리다", "이 페이지의 핵심 한 구 ⭐ 반드시 쓰세요"], ["with a phone in hand", "손에 휴대폰을 든 채", "조각난 여가를 장면으로 📸 설명이 필요 없어요"], ["the absence of work", "일이 없는 상태", "쉼을 정의하며 뒤집는 구문 ⭐ 고난도 어휘예요"], ["become a person again", "다시 사람이 되다", "휴식의 의미를 한 구로 💕 여운이 남습니다"], ["five broken ones", "쪼개진 다섯 개", "앞의 긴 저녁 하나와 대구 ✨ 숫자로 대비하기"], ["work in fragments", "조각으로 작동하다", "마지막 한 줄 ⭐ 부정문으로 닫으면 강해져요"]], "audio": "audio/4_고난도/4-016 8. 여가 시간(Free Time)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-016 8. 여가 시간(Free Time)_이슈.mp3"}, {"id": "4-017", "cat": "advanced", "catName": "고난도 질문", "num": 9, "topic": "카페", "topicEn": "Cafés", "type": "비교", "badge": "17 비교", "enQ": "People visit cafés for all kinds of reasons. In what ways do people commonly use cafés? How are those ways alike, and how are they different?", "enA": "People use a café in three completely different ways. Some treat it as an office — laptop open, headphones on. Some treat it as a living room for meeting friends. And some come alone to stare out of the window for an hour, which is a perfectly good reason to buy a coffee.\n\nWhat they all have in common is strange when you think about it. Nobody owns the space, but everybody acts like they do. The coffee is really rent — four thousand won buys you a chair, a table and permission to stay.\n\nThe difference is time and noise. The laptop crowd needs a socket and silence and stays for hours. The meeting crowd is loud and leaves in one. If I had to name the trend, it's the third one growing. A café sells time, not coffee.", "koQ": "사람들은 다양한 이유로 카페에 갑니다. 사람들이 카페를 이용하는 일반적인 방식에는 어떤 것들이 있나요? 그 방식들은 어떻게 비슷하고 어떻게 다른가요?", "koA": "사람들은 카페를 완전히 다른 세 가지 방식으로 써요. 누구는 사무실처럼 쓰죠. 노트북 열고 헤드폰 끼고요. 누구는 친구를 만나는 거실처럼 쓰고요. 그리고 누구는 혼자 와서 한 시간쯤 창밖만 봐요. 커피 한 잔 값으로는 충분히 괜찮은 이유죠.\n\n세 방식의 공통점은 생각해 보면 좀 이상해요. 아무도 그 공간을 소유하지 않는데 다들 자기 공간처럼 굴거든요. 커피값이 사실은 자릿세예요. 사천 원이면 의자 하나, 테이블 하나, 그리고 머물러도 된다는 허락을 사는 거죠.\n\n차이는 시간과 소음이에요. 노트북 쪽은 콘센트와 조용함이 필요하고 몇 시간씩 있어요. 만나러 온 쪽은 시끄럽고 한 시간이면 나가고요. 요즘 흐름을 굳이 꼽자면 세 번째가 늘고 있어요. 카페가 파는 건 커피가 아니라 시간이에요.", "struct": [["1️⃣ 세 개", "사무실 · 거실 · 혼자 창밖 보기 세 방식"], ["2️⃣ 공통", "아무도 소유 안 하는데 자기 공간처럼"], ["3️⃣ 정의", "커피값 = 자릿세. 사천 원에 의자 하나"], ["4️⃣ 차이", "콘센트 + 몇 시간 ↔ 시끄럽고 한 시간"], ["5️⃣ 마무리", "카페가 파는 건 커피가 아니라 시간 ⭐"]], "scoring": [["세 가지 방식", "카페에 가는 이유가 아니라 쓰는 방식으로 나누세요 🔑 사무실 · 거실 · 혼자, 세 개면 충분하고도 남습니다"], ["공통점이 승부", "비슷한 점을 묻는 질문이 붙어 있어요 ⭐ 아무도 소유하지 않는데 다들 자기 공간처럼 쓴다는 역설 하나면 그 질문이 통째로 해결됩니다"], ["서베이 편과 구분", "서베이 1.카페는 단골 카페 Moon 이야기였어요 🔁 여기는 사람들 전체의 이용 방식이라 주어를 people 로 두고 일반화해서 말해야 합니다"], ["시간을 판다", "커피가 아니라 시간을 판다는 마무리가 이 페이지의 승부처예요 ⭐ 앞에서 깐 자릿세 이야기를 한 줄로 회수하니 구조까지 닫힙니다"]], "expr": [["three different ways", "완전히 다른 세 방식", "세 갈래 분류로 여는 도입 🔑 답변의 뼈대가 바로 잡혀 줍니다"], ["treat it as an office", "사무실처럼 쓰다", "용도를 동사구로 압축 ✨ 세 번 반복해서 쓰기 좋은 표현이에요"], ["a living room", "거실 같은 공간", "만남의 공간을 비유 하나로 💕 긴 설명이 아예 필요 없어져요"], ["stare out of the window", "창밖을 멍하니 보다", "혼자 오는 사람을 장면으로 🎭 묘사 점수까지 같이 확보돼요"], ["act like they do", "자기 것인 양 굴다", "공통점을 역설로 뒤집는 구문 ⭐ 고난도 분석의 표본입니다"], ["The coffee is really rent", "커피값이 곧 자릿세", "이 페이지의 결정적인 한 줄 ⭐ 이것만은 반드시 넣어 주세요"], ["a socket and silence", "콘센트와 조용함", "노트북 이용자의 조건을 명사 두 개로 📏 아주 깔끔해집니다"], ["stay for hours", "몇 시간씩 머무르다", "체류 시간을 동사 하나로 ⏰ 뒤 문장과 대비를 이뤄 줍니다"], ["leave in one", "한 시간이면 나가다", "앞 구와 짝을 이루는 대비 표현이에요 ✨ 리듬까지 살아나요"], ["If I had to name the trend", "흐름을 꼽자면", "요즘 경향을 덧붙이는 고난도 구문 ⭐ 답변에 깊이가 생겨요"], ["sell time, not coffee", "커피가 아니라 시간을 팔다", "대구로 닫는 마무리 ⭐ 시리즈 공통 마무리 기술이에요 🔁"]], "audio": "audio/4_고난도/4-017 9. 카페(Cafés)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-017 9. 카페(Cafés)_비교.mp3"}, {"id": "4-018", "cat": "advanced", "catName": "고난도 질문", "num": 9, "topic": "카페", "topicEn": "Cafés", "type": "이슈", "badge": "18 이슈", "enQ": "Think of a time you came across some news about cafés. What was the story about, and where did you see or read it? How did people respond to it, and what was your opinion?", "enA": "The one I remember was about long-stay customers — people who buy one americano and sit there for six hours with a laptop. I saw it as a news clip on YouTube, and the comments underneath were longer than the article itself, which tells you how raw the subject is.\n\nThe story said some cafés had started taping over the sockets or putting up a two-hour limit on the door. One owner said her afternoon turned into a study room with no sales at all, and she sounded more tired than angry about it.\n\nPeople split immediately. Owners said rent doesn't care how long you sit. Students said there is nowhere else to go. Personally, I think the fight is about the rule being unwritten. Put two hours on the door and nobody argues.", "koQ": "카페와 관련된 뉴스를 접했던 때를 떠올려 보세요. 어떤 내용이었고 어디서 봤나요? 사람들은 어떻게 반응했고 당신 생각은 어땠나요?", "koA": "기억에 남는 건 장시간 손님 얘기였어요. 아메리카노 한 잔 시켜 놓고 노트북으로 여섯 시간씩 앉아 있는 사람들이요. 유튜브 뉴스 클립으로 봤는데, 밑에 달린 댓글이 기사보다 길더라고요. 그만큼 예민한 주제라는 뜻이겠죠.\n\n기사에서는 콘센트를 테이프로 막거나 문에 두 시간 제한을 붙이기 시작한 카페들이 나왔어요. 한 사장님은 오후가 통째로 독서실이 되고 매출은 하나도 없다고 하셨는데, 화가 났다기보다 지쳐 보이셨어요.\n\n사람들은 바로 갈렸어요. 사장님들은 월세가 앉아 있는 시간을 봐주지 않는다고 했고, 학생들은 갈 데가 거기밖에 없다고 했죠. 개인적으로는 문제의 핵심이 규칙이 안 적혀 있다는 데 있다고 봐요. 문에 두 시간이라고 써 붙이면 아무도 안 싸워요.", "struct": [["1️⃣ 기사", "장시간 손님 → 한 잔에 여섯 시간"], ["2️⃣ 출처", "유튜브 뉴스 클립 💬 댓글이 기사보다 김"], ["3️⃣ 대응", "콘센트 막기 · 문에 두 시간 제한 붙이기"], ["4️⃣ 반응", "사장 = 월세 ↔ 학생 = 갈 데가 없음"], ["5️⃣ 의견", "핵심은 규칙이 안 적혀 있다는 것 ⭐"]], "scoring": [["어디서 봤나", "문제가 어디서 봤는지까지 묻습니다 ✅ 유튜브 뉴스 클립처럼 매체를 반드시 대 주셔야 점수가 붙어요"], ["양쪽 입장", "사람들이 어떻게 반응했냐가 세 번째 질문이에요 ⭐ 사장과 학생 두 입장을 한 문장씩 놓으면 갈렸다는 말이 그 자리에서 증명됩니다"], ["원인을 짚기", "의견을 말할 때 누가 옳다로 가면 얕아져요 🔑 규칙이 안 적혀 있다는 구조를 짚으면 편을 들지 않고도 훨씬 깊은 답이 됩니다"], ["9번 ①번과 짝", "①번에서 커피값은 자릿세라고 깔아 뒀어요 🔁 여기서 여섯 시간 손님 이야기가 나오면 두 페이지가 하나의 논리로 이어집니다"]], "expr": [["long-stay customers", "장시간 이용 손님", "사회 이슈를 명사구 하나로 🔑 기사 제목처럼 들리게 해 줘요"], ["sit there for six hours", "여섯 시간을 앉아 있다", "숫자로 문제를 못 박기 📏 설명보다 훨씬 강하게 박혀 줍니다"], ["a news clip on YouTube", "유튜브 뉴스 클립", "어디서 봤냐는 질문을 그대로 회수합니다 ✅ 반드시 넣으세요"], ["tape over the sockets", "콘센트를 막아 버리다", "가게의 대응을 장면으로 ✨ 현장 분위기까지 전해져 옵니다"], ["put up a two-hour limit", "두 시간 제한을 붙이다", "제도적 대응을 구체적인 동사로 ⏰ 막연함이 아예 없어져요"], ["turn into a study room", "독서실이 되어 버리다", "돌발 휴일 편 turn into 재활용 🔁 상황을 한 번에 압축"], ["People split immediately", "사람들이 바로 갈리다", "반응을 묻는 질문에 곧장 답하는 문장이에요 ⭐ 아주 유용해요"], ["rent doesn't care", "월세는 봐주지 않는다", "자영업자 입장을 의인화로 😆 한 줄이면 충분히 전달됩니다"], ["nowhere else to go", "갈 데가 거기밖에 없다", "반대편 입장까지 담기 💬 양면 제시의 기본이 되어 줍니다"], ["the rule being unwritten", "규칙이 안 적혀 있다는 것", "갈등의 원인을 한 구로 ⭐ 분석처럼 들리게 만드는 지점이죠"], ["Put two hours on the door", "문에 두 시간이라고 쓰기", "해결책을 아주 구체적인 행동으로 ✅ 깔끔하게 닫아 줍니다"]], "audio": "audio/4_고난도/4-018 9. 카페(Cafés)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-018 9. 카페(Cafés)_이슈.mp3"}, {"id": "4-019", "cat": "advanced", "catName": "고난도 질문", "num": 10, "topic": "음식", "topicEn": "Food", "type": "비교", "badge": "19 비교", "enQ": "People follow different diets for reasons like health, beliefs, or taste. What diets do you know about, and how are they different from each other? Why might someone pick one instead of another?", "enA": "Three come to mind. Vegetarian and vegan diets, which are usually about belief. Low-carb or keto, which is about the body. And the protein-first diet everyone at my gym follows, which is honestly about the mirror more than anything else.\n\nWhat separates them is the reason, not the food. Two people can eat the same salad for completely different motives. That's why arguing about diets goes nowhere — you are never really arguing about the plate, you are arguing about the reason behind it.\n\nWhy do people pick one? Whatever survives their week. Korean food looks vegetarian-friendly until you remember the anchovy stock and the fish sauce in the kimchi. In the end, the diet you actually keep is the one your life allows you to keep, not the one you admire.", "koQ": "사람들은 건강, 신념, 입맛 같은 이유로 서로 다른 식단을 선택합니다. 당신이 아는 식단에는 어떤 것들이 있고 서로 어떻게 다른가요? 왜 하나를 선택할까요?", "koA": "세 가지가 떠올라요. 채식과 비건 식단은 보통 신념의 문제고요. 저탄고지나 키토는 몸의 문제예요. 그리고 저희 헬스장 사람들이 다 하는 단백질 위주 식단은 솔직히 거울의 문제죠.\n\n이 식단들을 가르는 건 음식이 아니라 이유예요. 두 사람이 똑같은 샐러드를 먹어도 동기는 완전히 다를 수 있거든요. 그래서 식단 논쟁이 끝이 안 나요. 사실 접시를 두고 싸우는 게 아니라 그 뒤에 있는 이유를 두고 싸우는 거니까요.\n\n왜 하나를 고르냐고요? 자기 일주일을 버텨 내는 쪽으로 가요. 한식은 채식하기 좋아 보이지만 멸치 육수랑 김치 속 젓갈을 떠올리면 얘기가 달라지죠. 결국 실제로 지켜지는 식단은 동경하는 식단이 아니라 자기 생활이 허락하는 식단이에요.", "struct": [["1️⃣ 세 개", "채식 · 저탄고지 · 단백질 위주 세 가지"], ["2️⃣ 이유", "신념 · 몸 · 거울. 동기가 다르다는 축"], ["3️⃣ 핵심", "가르는 건 음식이 아니라 이유 ⭐"], ["4️⃣ 한국", "한식은 채식 같지만 멸치 육수와 젓갈"], ["5️⃣ 마무리", "지켜지는 식단 = 생활이 허락하는 식단 ⭐"]], "scoring": [["이유로 가르기", "식단 이름만 나열하면 단어장이 돼요 🔑 신념 · 몸 · 거울처럼 동기로 갈라야 분석하는 답변으로 들립니다"], ["같은 샐러드", "두 사람이 같은 샐러드를 다른 이유로 먹는다는 문장이 승부처예요 ⭐ 차이를 묻는 질문에 음식이 아니라 이유라고 답하는 순간 답이 한 단계 올라갑니다"], ["한식 디테일", "멸치 육수와 젓갈은 외국인이 모르는 디테일이에요 📖 이런 한 줄이 들어가면 교과서 답변과 실제로 겪은 사람의 답변이 갈립니다"], ["마지막 질문", "왜 하나를 고르냐가 세 번째 질문이에요 ✅ 생활이 허락하는 쪽이라는 한 줄로 답하면 앞의 분류까지 자연스럽게 회수됩니다"]], "expr": [["Three come to mind", "세 가지가 떠올라요", "분류형 답변의 도입 🔑 바로 세 단락으로 이어져 줍니다"], ["about belief ↔ about the body", "신념 ↔ 몸의 문제", "동기를 대구로 가르기 ⭐ 이 페이지 분석의 축이 되어 줘요"], ["about the mirror", "거울의 문제", "외모 목적을 농담조로 😆 셋째 축을 확실히 살려 줍니다"], ["What separates them is ~", "가르는 건 ~이다", "차이를 묻는 질문에 정면으로 답하는 구문이에요 🔑 필수죠"], ["for different motives", "서로 다른 동기로", "같은 행동, 다른 이유를 한 구로 ✨ 아주 깔끔하게 들려요"], ["go nowhere", "결론이 안 나다", "논쟁의 성격을 구동사 하나로 💬 고난도 표현 중 하나예요"], ["survive their week", "자기 일주일을 버티다", "지속 가능성을 동사로 ⭐ 이 답변의 결정적인 한마디입니다"], ["vegetarian-friendly", "채식하기 좋은", "형용사 하나로 오해를 세우고 뒤집습니다 ✨ 아주 유용해요"], ["the anchovy stock", "멸치 육수", "한식 디테일 📖 문화 설명 점수를 통째로 가져와 줍니다"], ["the fish sauce in the kimchi", "김치 속 젓갈", "앞 구와 짝을 이루는 두 번째 디테일이에요 📖 세트로 쓰기"], ["the diet you keep", "실제로 지켜지는 식단", "관계대명사로 압축한 마무리 ⭐ 여운까지 같이 남겨 줍니다"]], "audio": "audio/4_고난도/4-019 10. 음식(Food)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-019 10. 음식(Food)_비교.mp3"}, {"id": "4-020", "cat": "advanced", "catName": "고난도 질문", "num": 10, "topic": "음식", "topicEn": "Food", "type": "이슈", "badge": "20 이슈", "enQ": "Food often appears in the news as something that brings people together. Have you come across any stories about how sharing meals strengthens relationships or social bonds? Why do you think eating together remains such an important part of your culture?", "enA": "I did come across a piece on this — about the rise of eating alone. Half of the households in Seoul are one person now, and delivery does the rest, so the numbers look grim. But the same article said something I keep thinking about.\n\nIt said the phrase let's have a meal sometime hasn't disappeared at all. We just moved it from dinner to lunch, because nobody wants a three-hour company dinner any more. The meal shrank; it didn't vanish.\n\nWhy does it last? Because the word for family here is sikgu, which literally means the mouths that eat together. We even greet people by asking have you eaten. When the language is built on it, a trend can't remove it.", "koQ": "음식은 사람들을 모아 주는 것으로 뉴스에 자주 등장합니다. 함께 식사하는 것이 관계를 강화한다는 이야기를 접한 적 있나요? 왜 여전히 중요할까요?", "koA": "그런 기사 본 적 있어요. 혼밥이 늘고 있다는 내용이었죠. 서울은 이제 절반이 1인 가구고, 나머지는 배달이 해결해 주니까 숫자만 보면 암울하죠. 그런데 같은 기사에 계속 생각나는 대목이 있었어요.\n\n밥 한번 먹자는 말은 전혀 사라지지 않았대요. 다만 저녁에서 점심으로 옮겨 갔을 뿐이라고요. 이제 아무도 세 시간짜리 회식을 원하지 않으니까요. 식사가 줄어든 거지 없어진 게 아니에요.\n\n왜 계속되냐고요? 여기서 가족을 뜻하는 말이 식구거든요. 같이 밥 먹는 입이라는 뜻이에요. 인사도 밥 먹었냐고 물어보고요. 언어가 그 위에 지어져 있으면 유행이 그걸 없애지는 못해요.", "struct": [["1️⃣ 기사", "혼밥 증가 → 서울은 절반이 1인 가구"], ["2️⃣ 반전", "밥 한번 먹자는 말은 사라지지 않았다는 반전"], ["3️⃣ 이동", "저녁 회식 → 점심 모임. 줄었지 없어진 건"], ["4️⃣ 언어", "식구 = 같이 밥 먹는 입 📖 인사도 밥부터"], ["5️⃣ 마무리", "언어가 받치면 유행이 못 없앤다 ⭐"]], "scoring": [["5번 ②번과 구분", "초가공식품은 5.건강 ②번에서 이미 썼어요 🔁 여기는 함께 먹기 쪽으로만 가야 두 페이지가 안 겹칩니다"], ["반전 구조", "혼밥이 는다로 열고 그런데 말은 안 사라졌다로 뒤집기 ⭐ 이 반전 하나가 평범한 뉴스 요약을 분석하는 답변으로 바꿔 줍니다"], ["언어가 근거", "식구와 밥 먹었냐 두 가지가 이 답의 진짜 무기예요 📖 왜 중요하냐는 질문에 언어로 답하면 외운 티가 나지 않고 설득력도 훨씬 큽니다"], ["줄었지 없어진 건", "식사가 줄어든 거지 없어진 게 아니라는 대구 ⭐ 사라진다 남는다 같은 이분법을 피하는 이런 한 줄이 고난도 점수를 만들어 줍니다"]], "expr": [["the rise of eating alone", "혼밥의 증가", "혼밥을 기사 제목처럼 옮긴 명사구 🔑 그대로 가져다 쓰세요"], ["delivery does the rest", "나머지는 배달이 해결", "현상을 동사 하나로 압축 ✨ 긴 설명이 아예 필요 없어져요"], ["let's have a meal sometime", "밥 한번 먹자", "한국식 인사를 그대로 📖 문화 설명 점수의 핵심이 됩니다"], ["move it from dinner to lunch", "저녁에서 점심으로 옮기다", "변화의 방향을 한 구로 ⭐ 회식 문화까지 같이 담겨 줍니다"], ["a three-hour company dinner", "세 시간짜리 회식", "회식을 숫자와 함께 📏 길이가 곧 설명이 되어 주는 표현"], ["The meal shrank", "식사가 줄어들었다", "사라진 게 아니라 줄었다는 구분 ⭐ 이 답변 분석의 핵심"], ["sikgu", "식구", "한국어 단어를 그대로 소개 📖 뜻풀이와 세트로 쓰는 겁니다"], ["the mouths that eat together", "같이 밥 먹는 입", "식구의 직역 💕 이 페이지에서 가장 강한 한 줄이 됩니다"], ["have you eaten", "밥 먹었어요?", "인사를 인용으로 💬 언어 근거가 두 개로 늘어나 줍니다"], ["built on it", "그 위에 지어진", "언어와 문화의 관계를 한 구로 ⭐ 고난도 표현 중 하나죠"], ["a trend can't remove it", "유행이 없애지 못한다", "마지막 질문에 답하며 닫는 문장이에요 ✅ 아주 깔끔합니다"]], "audio": "audio/4_고난도/4-020 10. 음식(Food)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-020 10. 음식(Food)_이슈.mp3"}, {"id": "4-021", "cat": "advanced", "catName": "고난도 질문", "num": 11, "topic": "음악", "topicEn": "Music", "type": "비교", "badge": "21 비교", "enQ": "Choose two kinds of music or two musicians that you like and compare them. What do they have in common, and how are they different? Give me as many details as possible.", "enA": "Let me take IU and musical theater numbers — Cho Seung-woo, mostly. What they share is that the lyrics come first. Both of them sing a sentence, not a melody, and you can hear the punctuation, which is rarer than it sounds.\n\nThe difference is where they work. IU is an earphone artist. She belongs to a night bus, a walk along the river, the last ten minutes before sleep. Theater songs need a room and a thousand people or they sound oversized.\n\nSo the volume is the same but the direction is opposite. One comes inward, one pushes out. If I had to pick, IU — I hear her more often. But once a year a theater song does something to me that an earphone has never once managed to do.", "koQ": "당신이 좋아하는 두 음악이나 두 음악가를 골라 비교해 주세요. 공통점은 무엇이고 어떤 점이 다른가요? 가능한 한 자세히 말해 주세요.", "koA": "아이유와 뮤지컬 넘버로 할게요. 뮤지컬 쪽은 주로 조승우고요. 둘의 공통점은 가사가 먼저라는 거예요. 둘 다 멜로디가 아니라 문장을 부르거든요. 쉼표가 어디 있는지가 들려요. 생각보다 드문 일이에요.\n\n차이는 어디서 작동하느냐예요. 아이유는 이어폰 가수예요. 밤 버스, 강변 산책, 잠들기 전 마지막 10분에 어울리죠. 뮤지컬 넘버는 공간과 천 명의 관객이 있어야 해요. 없으면 과하게 들리고요.\n\n그러니까 볼륨은 같은데 방향이 반대예요. 하나는 안으로 들어오고 하나는 밖으로 밀어내죠. 굳이 고르라면 아이유예요. 훨씬 자주 듣거든요. 그래도 일 년에 한 번쯤은 뮤지컬 넘버가 이어폰이 못 하는 일을 해요.", "struct": [["1️⃣ 선정", "아이유 · 뮤지컬 넘버(조승우) 두 축으로"], ["2️⃣ 공통", "둘 다 가사가 먼저 · 문장을 부른다는 점"], ["3️⃣ 차이", "아이유 = 이어폰 가수 · 잠들기 전 10분"], ["4️⃣ 대조", "뮤지컬 = 공간과 천 명이 있어야 완성됨"], ["5️⃣ 마무리", "볼륨은 같고 방향이 반대 ⭐ 안 ↔ 밖"]], "scoring": [["두 축을 멀리", "비슷한 가수 둘을 고르면 할 말이 없어져요 🔑 이어폰과 극장처럼 최대한 멀리 떨어뜨려서 골라 주세요"], ["공통점 먼저", "가사가 먼저라는 공통점으로 묶고 시작하기 ⭐ 아주 다른 둘을 한 이야기로 만들어 주고 뒤에 나올 차이도 훨씬 선명해집니다"], ["장면으로 증명", "밤 버스 · 잠들기 전 10분 · 천 명의 관객 🎭 음악을 형용사로 설명하지 말고 그 음악이 어울리는 장면으로 보여 주는 게 고난도입니다"], ["12번과 구분", "12번 ①비교는 장르 두 개와 사람들의 선호예요 🔁 여기는 내가 좋아하는 아티스트 둘이라 주어가 나여야 두 페이지가 겹치지 않습니다"]], "expr": [["What they share is ~", "둘의 공통점은 ~이다", "공통점부터 묶는 비교 도입 🔁 1번 ①번과 똑같은 기술이죠"], ["sing a sentence, not a melody", "멜로디가 아니라 문장을", "가사 중심을 대구 하나로 ⭐ 아주 고급스럽게 들리는 표현"], ["hear the punctuation", "쉼표가 들리다", "노래를 듣는 방식을 감각으로 ✨ 묘사 점수까지 확보돼요"], ["an earphone artist", "이어폰 가수", "아티스트 성격을 명사구로 규정 🎵 딱 떨어지는 표현이에요"], ["belong to ~", "~에 어울리다", "음악과 장면을 연결해 주는 동사예요 🌙 아주 유용합니다"], ["the last ten minutes", "잠들기 전 마지막 10분", "장면을 숫자로 좁히기 📏 구체성이 확 올라가 줍니다"], ["a room and a thousand people", "공간과 천 명의 관객", "뮤지컬의 조건을 명사 두 개로 📏 앞과 대비가 살아나요"], ["sound oversized", "과하게 들리다", "안 맞을 때의 느낌을 형용사로 ✨ 아주 정확한 표현이죠"], ["come inward ↔ push out", "안으로 ↔ 밖으로", "이 페이지의 결정적인 대구 ⭐ 이것만은 반드시 넣으세요"], ["If I had to pick", "굳이 고르라면", "시리즈 공통 선택 구문 🔁 마무리 직전 자리에 배치해요"], ["once a year", "일 년에 한 번쯤", "빈도로 예외를 인정하는 마무리 😊 여유까지 생겨 줍니다"]], "audio": "audio/4_고난도/4-021 11. 음악(Music)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-021 11. 음악(Music)_비교.mp3"}, {"id": "4-022", "cat": "advanced", "catName": "고난도 질문", "num": 11, "topic": "음악", "topicEn": "Music", "type": "이슈", "badge": "22 이슈", "enQ": "Tell me about the music gadgets or equipment people are interested in these days. Why do people in your country like them? Which new products excite them, and why? Tell me what people say about them.", "enA": "Two things dominate right now — noise-cancelling earbuds and, oddly, record players. The earbuds are everywhere. On my line, half the carriage is wearing them before the train even moves, and the other half is reaching for theirs.\n\nWhy here, though? Because commuting eats an hour and a half of the day. You can't shorten it, so people turn it into a private room instead. What they're buying isn't sound quality. It's a wall.\n\nThe new products people get excited about are the ones with live translation and spatial audio — the ones that do something an app cannot. And vinyl came back for the opposite reason — you can hold it. Everyone says the same thing: one is for escaping, one is for owning.", "koQ": "요즘 사람들이 관심 갖는 음악 기기나 장비에 대해 말해 주세요. 왜 그것을 좋아하나요? 어떤 신제품이 화제이고 이유는 무엇인가요?", "koA": "요즘은 두 가지가 압도적이에요. 노이즈 캔슬링 이어폰이랑, 의외로 턴테이블이요. 이어폰은 어디에나 있어요. 제가 타는 노선은 열차가 출발하기도 전에 객차 절반이 이어폰을 끼고 있어요. 나머지 절반은 꺼내는 중이고요.\n\n왜 하필 여기냐고요? 출퇴근이 하루에 한 시간 반을 먹으니까요. 줄일 수는 없으니 사람들은 그걸 개인 공간으로 바꿔 버려요. 사람들이 사는 건 음질이 아니에요. 벽이에요.\n\n화제가 되는 신제품은 실시간 통역이나 공간 음향처럼 앱이 못 하는 걸 해 주는 것들이고요. LP는 정반대 이유로 돌아왔어요. 손에 쥘 수 있으니까요. 다들 같은 말을 해요. 하나는 도망가려고 사고, 하나는 갖고 싶어서 산다고요.", "struct": [["1️⃣ 두 개", "노이즈 캔슬링 이어폰 · 턴테이블 두 개"], ["2️⃣ 장면", "출발 전부터 객차 절반이 이어폰 착용"], ["3️⃣ 이유", "출퇴근 한 시간 반을 개인 공간으로 전환"], ["4️⃣ 핵심", "사는 건 음질이 아니라 벽 ⭐ 핵심 한 줄"], ["5️⃣ 마무리", "하나는 도망 · 하나는 소유 ⭐ 대구로"]], "scoring": [["질문이 네 개", "무엇을 · 왜 · 어떤 신제품 · 사람들이 뭐라 하나 ✅ 질문이 네 개예요. 단락마다 하나씩 맡겨 두세요"], ["왜 하필 한국", "왜 우리나라 사람들이 좋아하냐가 두 번째 질문이에요 ⭐ 출퇴근 한 시간 반이라는 조건을 대면 일반론이 아니라 이 나라의 답이 됩니다"], ["음질이 아니라 벽", "사는 건 음질이 아니라 벽이라는 한 줄이 승부처예요 ⭐ 제품 설명을 사람들의 동기로 바꿔 놓는 순간 답변이 한 단계 올라갑니다"], ["두 기기를 묶기", "이어폰과 LP는 정반대처럼 보이지만 🔁 도망과 소유라는 대구로 묶으면 나열이 아니라 분석이 되고 마무리까지 저절로 생깁니다"]], "expr": [["Two things dominate", "두 가지가 압도적이다", "개수부터 못 박는 도입 🔑 답변 구조가 바로 잡혀 줍니다"], ["noise-cancelling earbuds", "노이즈 캔슬링 이어폰", "기기 이름을 그대로 🔑 최신 어휘라 그 자체로 점수가 돼요"], ["half the carriage", "객차의 절반", "유행을 장면과 비율로 📏 통계보다 훨씬 잘 들려 줍니다"], ["commuting eats an hour", "출퇴근이 한 시간을 먹다", "시간을 잡아먹는다를 동사로 ⏰ 표현이 아주 생생해집니다"], ["turn it into a private room", "개인 공간으로 바꾸다", "이동 시간의 의미 전환을 한 구로 ⭐ 이게 바로 분석이죠"], ["It's a wall", "사는 건 벽이다", "이 페이지 최고의 한마디 ⭐ 짧아서 더 강하게 박힙니다"], ["get excited about ~", "~에 열광하다", "문제 표현을 그대로 회수합니다 ✅ 세 번째 질문 담당이죠"], ["live translation", "실시간 통역", "신제품 기능을 구체적으로 📏 최신감이 확 살아나 줍니다"], ["come back for the opposite", "정반대 이유로 돌아오다", "LP 부활을 대비로 설명 ⭐ 두 기기를 하나로 묶어 줍니다"], ["you can hold it", "손에 쥘 수 있다", "소유감을 아주 쉬운 말로 💕 설명이 전혀 필요 없어져요"], ["escaping ↔ owning", "도망 ↔ 소유", "대구로 닫는 마무리 ⭐ 네 질문이 한 줄로 묶여 버립니다"]], "audio": "audio/4_고난도/4-022 11. 음악(Music)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-022 11. 음악(Music)_이슈.mp3"}, {"id": "4-023", "cat": "advanced", "catName": "고난도 질문", "num": 12, "topic": "음악 장르", "topicEn": "Genres", "type": "비교", "badge": "23 비교", "enQ": "People are drawn to different types of music for different reasons. Name two kinds of music that you think are very different from each other. Why do you think people prefer one over the other?", "enA": "Trot and hip-hop — you couldn't put them further apart. Trot is a slow two-beat with a shaking voice, and it lives on tour buses and market speakers. Hip-hop is fast, crowded with words, and lives at festivals and in earphones on the way to work.\n\nBut here's the thing. Both of them are about enduring something. Trot takes the hard part and turns it into a song you can sway to. Hip-hop takes the same hard part and fights back at it. Same wound, opposite response.\n\nSo why do people choose one? I think it depends on what you want music to do for you. Some people want to be comforted, others want to be armed. Age matters less than people assume, and the mood you are in matters far more. It's the mood you go to music for.", "koQ": "사람들은 저마다의 이유로 서로 다른 음악에 끌립니다. 아주 다르다고 생각하는 두 종류의 음악을 말해 주세요. 왜 한쪽을 더 좋아할까요?", "koA": "트로트와 힙합이요. 이보다 멀리 떨어진 조합도 없을 거예요. 트로트는 느린 2박에 꺾는 목소리고, 관광버스와 시장 스피커에서 살아요. 힙합은 빠르고 말이 빽빽하게 들어차 있고, 페스티벌과 출근길 이어폰에서 살고요.\n\n그런데 재미있는 게 있어요. 둘 다 무언가를 견디는 이야기라는 점이에요. 트로트는 힘든 부분을 가져다가 흔들면서 부를 수 있는 노래로 만들어요. 힙합은 똑같은 힘든 부분을 가져다가 되받아치고요. 같은 상처, 정반대의 반응이죠.\n\n그럼 왜 한쪽을 고를까요? 음악이 나한테 무엇을 해 주길 바라느냐에 달렸다고 봐요. 누구는 위로받고 싶고, 누구는 무장하고 싶은 거죠. 나이는 사람들 생각만큼 중요하지 않아요. 그때 어떤 기분이냐가 훨씬 크죠. 결국 어떤 기분으로 음악을 찾느냐예요.", "struct": [["1️⃣ 선정", "트로트 · 힙합 — 이보다 먼 조합은 없음"], ["2️⃣ 대비", "느린 2박 · 관광버스 ↔ 빠른 랩 · 페스티벌"], ["3️⃣ 공통", "둘 다 무언가를 견디는 이야기라는 공통점"], ["4️⃣ 차이", "흔들며 견디기 ↔ 되받아치기. 같은 상처"], ["5️⃣ 마무리", "위로받고 싶은가 · 무장하고 싶은가 ⭐"]], "scoring": [["멀수록 좋다", "아주 다른 둘을 대라고 했으니 진짜 멀리 고르세요 🔑 트로트와 힙합이면 설명이 저절로 따라 나옵니다"], ["뜻밖의 공통점", "둘 다 견디는 이야기라는 공통점이 승부처예요 ⭐ 정반대인 둘을 한 뿌리로 묶으면 단순 비교가 분석으로 바뀌고 채점자가 귀를 기울입니다"], ["나이 말고 기분", "세대 차이로 설명하면 흔한 답이 돼요 🔑 위로받고 싶은가 무장하고 싶은가로 답하면 훨씬 신선하고 반박하기도 어렵습니다"], ["11번과 구분", "11번 ①비교는 내가 좋아하는 아티스트 둘이었어요 🔁 여기는 장르와 사람들의 선호라 주어를 people 로 두고 일반화해야 합니다"]], "expr": [["could not be further apart", "이보다 멀 수 없다", "두 장르의 거리를 과장으로 여는 도입 ⭐ 아주 강한 오프닝"], ["a slow two-beat", "느린 2박", "장르를 박자로 설명 🎵 음악 용어 하나면 충분해집니다"], ["a shaking voice", "꺾는 목소리", "트로트 창법을 한 구로 📖 문화 설명 점수까지 챙겨 줘요"], ["tour buses and market speakers", "관광버스와 시장 스피커", "장르가 사는 장소를 명사로 🎭 장면이 그대로 그려집니다"], ["crowded with words", "말이 빽빽하게 들어찬", "랩의 밀도를 형용사구로 ✨ 아주 정확한 묘사가 됩니다"], ["But here's the thing", "그런데 재미있는 게", "반전을 예고하는 전환 구문 🔑 공통점 도입 자리에 쓰기"], ["enduring something", "무언가를 견디는 것", "두 장르를 묶어 주는 한 구 ⭐ 이 페이지의 축이 됩니다"], ["turn it into a song", "노래로 만들어 버리다", "트로트의 방식을 동사로 ✨ 뒤 구와 대비를 이뤄 줍니다"], ["fight back at it", "되받아치다", "힙합의 방식을 동사로 💪 여기서 대구가 완성되어 줍니다"], ["to be comforted ↔ to be armed", "위로 ↔ 무장", "선호의 이유를 대구로 ⭐ 마지막 질문의 정답이 됩니다"], ["the mood you go to music for", "음악을 찾는 기분", "취향을 기분으로 정의하는 마무리 ⭐ 여운까지 남겨 줘요"]], "audio": "audio/4_고난도/4-023 12. 음악 장르(Genres)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-023 12. 음악 장르(Genres)_비교.mp3"}, {"id": "4-024", "cat": "advanced", "catName": "고난도 질문", "num": 12, "topic": "음악 장르", "topicEn": "Genres", "type": "이슈", "badge": "24 이슈", "enQ": "There has been news about music apps that automatically choose songs based on a person's mood. Have you seen or heard about this in the news? What is your opinion of these kinds of apps?", "enA": "I have seen that, yes. The apps read your heart rate from a watch, the time of day, even the weather, and build a playlist before you ask for one. The clip I watched called it a mood engine, which is a better name than the apps use themselves.\n\nDoes it work? Uncomfortably well. On a rainy Monday it hands me exactly the kind of song I would have chosen, which is impressive and slightly annoying. My actual favorite track this year came out of one of those lists, so I cannot pretend it does not work.\n\nHere's my problem with it, though. It gets better at what I already like, so my taste keeps narrowing. Anything genuinely new, I still had to find myself. The algorithm can match my mood. It just can't change it.", "koQ": "사람의 기분에 따라 자동으로 노래를 골라 주는 음악 앱에 대한 뉴스가 있었습니다. 이런 내용을 본 적 있나요? 이런 앱을 어떻게 생각하나요?", "koA": "네, 그런 뉴스 봤어요. 앱이 시계로 심박을 읽고, 시간대랑 날씨까지 보고, 내가 요청하기도 전에 플레이리스트를 만들어 준대요. 제가 본 영상에서는 그걸 기분 엔진이라고 부르던데, 앱들이 쓰는 이름보다 낫더라고요.\n\n잘 맞냐고요? 불편할 만큼 잘 맞아요. 비 오는 월요일이면 제가 골랐을 법한 노래를 그대로 꺼내 줘요. 대단하면서 살짝 얄밉죠. 사실 올해 제 최애곡도 그 리스트에서 나왔으니 효과가 없다고는 못 하겠어요.\n\n그래도 걸리는 게 있어요. 앱은 제가 이미 좋아하는 것만 점점 더 잘하게 돼요. 그래서 취향이 계속 좁아져요. 진짜 새로운 건 결국 제가 직접 찾아야 했고요. 알고리즘은 제 기분을 맞힐 수는 있어요. 다만 바꿔 주지는 못해요.", "struct": [["1️⃣ 뉴스", "심박 · 시간대 · 날씨를 읽고 자동 선곡"], ["2️⃣ 이름", "영상에서 부르던 이름 = 기분 엔진 💬"], ["3️⃣ 인정", "비 오는 월요일에 딱 맞는 곡 · 최애곡도"], ["4️⃣ 문제", "이미 좋아하는 것만 잘해서 취향이 좁아짐"], ["5️⃣ 마무리", "기분은 맞히지만 바꿔 주지는 못한다 ⭐"]], "scoring": [["봤다 + 이름", "기분 엔진처럼 기사 속 표현을 하나 가져오세요 🔑 봤다는 말이 그 자리에서 바로 증명되어 버립니다"], ["먼저 인정하기", "반대 의견부터 꺼내면 답이 뻣뻣해져요 ⭐ 불편할 만큼 잘 맞는다고 먼저 인정하면 뒤에 나올 비판이 훨씬 설득력 있게 들립니다"], ["돌발 편과 구분", "돌발 12.TV 편에서 유튜브 알고리즘을 이미 다뤘어요 🔁 여기는 음악 앱의 기분 추천에만 머물러야 같은 답이 두 번 나오지 않습니다"], ["기분은 못 바꿔", "기분을 맞히지만 바꿔 주지는 못한다는 대구가 승부처예요 ⭐ 좋다 나쁘다로 끝내지 않고 한계를 정확히 짚는 것이 고난도 의견입니다"]], "expr": [["read your heart rate", "심박을 읽어 내다", "기술을 동사 하나로 ✨ 어려운 설명이 아예 필요 없어져요"], ["build a playlist", "플레이리스트를 만들다", "앱 기능을 정확한 동사로 🎵 그대로 외워 두시면 좋습니다"], ["a mood engine", "기분 엔진", "기사 속 표현을 인용 💬 봤다는 증거가 그 자리에서 생겨요"], ["Uncomfortably well", "불편할 만큼 잘", "부사 하나로 평가를 뒤트는 고난도 표현이에요 ⭐ 유용해요"], ["impressive and annoying", "대단하면서 얄미운", "양가감정을 형용사 두 개로 😆 아주 자연스럽게 들립니다"], ["came out of one of those lists", "그 리스트에서 나왔다", "개인 경험으로 근거 보강 💪 설득력이 확 올라가 줍니다"], ["Here's my problem with it", "그래도 걸리는 건", "의견으로 넘어가는 전환 신호 🔑 여기서 반드시 끊어 주기"], ["better at what I already like", "이미 좋아하는 것만 잘하다", "알고리즘의 한계를 한 구로 ⭐ 분석처럼 들리게 해 줍니다"], ["keep narrowing", "계속 좁아지다", "취향의 변화를 동사로 📏 필터 버블을 쉬운 말로 푼 겁니다"], ["find it myself", "직접 찾아내다", "앱과 대비되는 내 행동 ✨ 여기서 대구가 완성되어 줍니다"], ["match ↔ change my mood", "맞히다 ↔ 바꾸다", "마지막 대구 ⭐ 이 페이지의 결정적인 마무리가 됩니다"]], "audio": "audio/4_고난도/4-024 12. 음악 장르(Genres)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-024 12. 음악 장르(Genres)_이슈.mp3"}, {"id": "4-025", "cat": "advanced", "catName": "고난도 질문", "num": 13, "topic": "국내여행", "topicEn": "Domestic", "type": "비교", "badge": "25 비교", "enQ": "How was traveling within your country different in your childhood compared to now? Do you think it has become easier or harder than before? Tell me how domestic travel has changed.", "enA": "Back then, a domestic trip meant four hours on a bus and everyone went to the same three places — Gyeongju, Seorak, Jeju. You booked by phone, stayed in whatever had a room left, and took maybe twenty photos the whole weekend because film was not free.\n\nThese days it's a completely different story. The train cut it to two hours, and you book a room from the platform on an app. People go to small towns nobody used to name — Tongyeong, Gangneung, Jeonju — mostly because a café there went viral.\n\nSo is it easier? Much. The trade-off is that a trip now starts with a saved map and ends with four hundred photos. I have to admit the old version left more behind. We remembered the rest stop better than the destination, and that says something.", "koQ": "어릴 때의 국내여행은 지금과 어떻게 달랐나요? 예전보다 쉬워졌다고 보나요, 어려워졌다고 보나요? 국내여행이 어떻게 변했는지 말해 주세요.", "koA": "예전에 국내여행이라고 하면 버스로 네 시간이었어요. 다들 같은 세 군데로 갔고요. 경주, 설악산, 제주요. 예약은 전화로 했고, 방이 남은 데면 아무 데나 묵었고, 주말 내내 사진은 스무 장쯤 찍었죠. 필름이 공짜가 아니었으니까요.\n\n요즘은 완전히 다른 이야기예요. 기차가 그 시간을 두 시간으로 줄였고, 플랫폼에서 앱으로 방을 잡아요. 예전엔 이름도 안 대던 소도시로 가고요. 통영, 강릉, 전주 같은 데요. 대개는 거기 카페 하나가 떴기 때문이죠.\n\n그래서 쉬워졌냐고요? 훨씬요. 대신 요즘 여행은 저장해 둔 지도에서 시작해서 사진 사백 장으로 끝나요. 예전 방식이 남기는 게 더 많았다는 건 인정할 수밖에 없어요. 그땐 목적지보다 휴게소를 더 잘 기억했거든요. 그게 뭔가를 말해 주죠.", "struct": [["1️⃣ 과거", "버스로 네 시간 · 다들 같은 세 군데로"], ["2️⃣ 방식", "전화로 예약 · 방 남은 데 아무 곳에"], ["3️⃣ 현재", "KTX 두 시간 → 플랫폼에서 앱 예약"], ["4️⃣ 이동", "소도시로 분산 · 카페 하나가 이유"], ["5️⃣ 마무리", "사진 400장 vs 기억나는 휴게소 ⭐"]], "scoring": [["서베이 편과 구분", "서베이 12.국내여행은 우리 가족이 차에 끼어 타던 이야기였어요 🔁 여기는 나라 전체의 변화라 주어가 people 이어야 합니다"], ["인프라로 가르기", "교통 · 예약 · 목적지 세 축으로 가르면 깔끔해요 ⭐ 네 시간에서 두 시간, 전화에서 앱, 세 군데에서 소도시로 옮겨 가는 구조가 그대로 보입니다"], ["쉬워졌냐에 답", "문제가 쉬워졌는지 어려워졌는지를 콕 집어 물어요 ✅ 훨씬 쉬워졌다고 먼저 답하고 그다음에 대신 잃은 것을 붙이는 순서가 안전합니다"], ["휴게소 마무리", "목적지보다 휴게소를 더 잘 기억했다는 한 줄이 승부처예요 ⭐ 편해졌다 불편했다를 넘어 무엇이 남았는지로 옮겨 가면 고난도로 들립니다"]], "expr": [["four hours on a bus", "버스로 네 시간", "과거를 시간으로 못 박기 📏 설명보다 훨씬 빠릅니다"], ["the same three places", "늘 같은 세 군데", "목적지 쏠림을 숫자로 ⭐ 뒤의 분산과 대비돼요"], ["book by phone", "전화로 예약하다", "앱 시대와 대비되는 과거 동사예요 ✨ 아주 선명해요"], ["whatever had a room left", "방이 남은 아무 데나", "선택지가 없던 시절을 한 구로 😆 웃음까지 얻어요"], ["cut it to two hours", "두 시간으로 줄이다", "KTX를 이름 없이 설명 📏 변화가 숫자로 보입니다"], ["book a room from the platform", "플랫폼에서 방을 잡다", "요즘 방식을 장면 하나로 ✨ 즉흥성까지 담겨요"], ["small towns nobody used to name", "이름도 안 대던 소도시", "목적지 분산을 한 구로 ⭐ 고난도 압축 표현이죠"], ["go viral", "입소문을 타다", "소도시가 뜨는 이유를 동사로 💬 요즘 어휘예요"], ["start with a saved map", "저장한 지도에서 시작", "계획 방식의 변화를 장면으로 🗺️ 아주 요즘답죠"], ["The trade-off is ~", "대신 잃는 건 ~이다", "비교 유형 고난도 채점 포인트 🔁 꼭 넣으세요"], ["I have to admit", "인정할 수밖에 없다", "시리즈 공통 비교 마무리 🔁 그리움 한 스푼 담당"]], "audio": "audio/4_고난도/4-025 13. 국내여행(Domestic)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-025 13. 국내여행(Domestic)_비교.mp3"}, {"id": "4-026", "cat": "advanced", "catName": "고난도 질문", "num": 13, "topic": "국내여행", "topicEn": "Domestic", "type": "이슈", "badge": "26 이슈", "enQ": "What concerns do travelers have these days? What are people most interested in, and what causes those concerns? Tell me what people talk about as the main issues of traveling.", "enA": "The one everybody talks about is price. A room by the sea that costs eighty thousand won in March triples in August, and people call it out online every summer without anything actually changing. Everyone complains and everyone still goes.\n\nWhat causes it is that we all travel in the same two weeks. Schools, companies and the weather line up perfectly, so demand lands on one fortnight and the whole country pays for it. None of it is anyone's fault, which is why it never gets fixed.\n\nThe second concern is newer. Small towns that went viral are now full of visitors and unhappy residents — narrow streets, parked cars, cameras at people's windows. What people ask for is simple enough: spread the season out and cap the crowds before the residents give up on their own town.", "koQ": "요즘 여행하는 사람들은 어떤 걱정을 하나요? 사람들이 가장 관심 갖는 것은 무엇이고 무엇이 그 걱정을 만드나요?", "koA": "다들 말하는 건 가격이에요. 3월에 8만 원 하던 바닷가 방이 8월이면 세 배가 돼요. 여름마다 사람들이 온라인에서 지적하지만 실제로 바뀌는 건 없어요. 다들 불평하면서 다들 가거든요.\n\n원인은 우리가 다 같은 2주에 여행을 간다는 거예요. 학교랑 회사랑 날씨가 완벽하게 맞아떨어지거든요. 그래서 수요가 딱 2주에 몰리고 나라 전체가 그 값을 치릅니다. 누구의 잘못도 아니라서 해결도 안 되는 거고요.\n\n두 번째 걱정은 좀 더 최근 거예요. 뜬 소도시들이 이제 관광객과 불만인 주민들로 가득해요. 좁은 골목, 주차된 차, 남의 집 창문 앞에 들이대는 카메라요. 사람들이 요구하는 건 간단해요. 주민들이 자기 동네를 포기하기 전에 시즌을 분산하고 인원을 제한하자는 거죠.", "struct": [["1️⃣ 걱정", "다들 말하는 건 결국 가격 하나 🔑"], ["2️⃣ 근거", "3월 8만 원 방이 8월엔 세 배로"], ["3️⃣ 원인", "원인은 모두가 같은 2주에 몰려서"], ["4️⃣ 둘째", "뜬 소도시 = 관광객과 불만인 주민"], ["5️⃣ 요구", "시즌 분산 · 인원 제한이 요구 ✅"]], "scoring": [["하나를 깊게", "가장 관심 있는 게 무엇이냐를 묻는 질문이에요 🔑 가격 하나를 골라 깊게 파는 편이 훨씬 유리하게 들립니다"], ["원인이 본론", "무엇이 그 걱정을 만드냐가 두 번째 질문이에요 ⭐ 모두가 같은 2주에 몰린다는 구조를 짚으면 불평이 아니라 분석하는 답변으로 들립니다"], ["둘째는 짧게", "두 번째 걱정은 오버투어리즘으로 짧게 붙이세요 💬 첫 번째를 깊게 파고 두 번째를 얹는 구성이 나열형보다 훨씬 안정적입니다"], ["2번 ②번과 구분", "2번 ②이슈는 우리 동네 축제의 주차와 소음이었어요 🔁 여기는 여행지 물가와 관광객 문제라 소음 이야기는 꺼내지 않는 게 좋습니다"]], "expr": [["The one everybody talks about", "다들 말하는 건", "가장 관심사를 묻는 질문에 바로 답하는 도입이에요 🔑"], ["triple in August", "8월이면 세 배가 되다", "가격 문제를 숫자 하나로 📏 설명이 필요 없어져요"], ["call it out online", "온라인에서 지적하다", "여론을 동사구로 💬 요즘 반응을 담아 주는 표현"], ["in the same two weeks", "똑같은 2주 동안", "원인을 기간으로 못 박기 📏 이 답의 핵심 근거죠"], ["line up perfectly", "완벽하게 맞아떨어지다", "세 조건이 겹치는 상황을 한 구로 ⭐ 분석입니다"], ["land on one fortnight", "2주에 몰리다", "수요 집중을 동사로 ✨ 아주 정확한 표현이에요"], ["go viral", "입소문을 타다", "13번 ①번 재활용 🔁 두 페이지가 이어지는 지점"], ["unhappy residents", "불만인 주민들", "오버투어리즘을 쉬운 명사구로 🏠 설명이 짧아져요"], ["cameras at the windows", "창문 앞의 카메라", "갈등을 장면 하나로 🎭 묘사 점수까지 확보돼요"], ["What people ask for", "사람들이 요구하는 건", "대책으로 넘어가는 신호 ✅ 세 번째 단락 도입용"], ["cap the crowds", "인원을 제한하다", "해결책을 구체적인 동사로 ✅ 막연함이 사라져요"]], "audio": "audio/4_고난도/4-026 13. 국내여행(Domestic)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-026 13. 국내여행(Domestic)_이슈.mp3"}, {"id": "4-027", "cat": "advanced", "catName": "고난도 질문", "num": 14, "topic": "해외여행", "topicEn": "Overseas", "type": "비교", "badge": "27 비교", "enQ": "How has overseas travel changed over the years? Do you think it is easier now than in the past, or more difficult? Why? Describe what traveling to other countries used to be like and what it is like today.", "enA": "Back then, going abroad meant a package tour. You followed a flag around a city, changed money at a counter, and carried one guidebook that the whole group shared. Calling home meant finding a payphone and hoping you had the right coins.\n\nThese days, almost nobody does that. Budget airlines made the ticket cheap, the booking takes four taps, and an eSIM puts a map in your hand before you land. You can eat where a stranger on YouTube ate last month, in a country you have never seen.\n\nSo is it easier? Yes and no. Booking got easier; deciding got harder. There are too many options, so people now spend more time planning than travelling. I have to admit the flag had one advantage — somebody else did the thinking.", "koQ": "해외여행은 시간이 지나며 어떻게 변했나요? 예전보다 쉬워졌다고 보나요, 어려워졌다고 보나요? 예전과 지금이 어떻게 다른지 설명해 주세요.", "koA": "예전에 해외에 나간다는 건 패키지여행을 뜻했어요. 도시를 돌며 깃발을 따라다녔고, 창구에서 환전했고, 단체가 같이 보는 가이드북 한 권을 들고 다녔죠. 집에 전화하려면 공중전화를 찾아서 동전이 맞기를 바라야 했고요.\n\n요즘은 그렇게 하는 사람이 거의 없어요. 저가 항공이 표를 싸게 만들었고, 예약은 네 번 누르면 끝나고, 이심이 착륙 전에 지도를 손에 쥐여 줘요. 한 번도 가 본 적 없는 나라에서 지난달 유튜브 속 낯선 사람이 먹은 데서 먹을 수도 있고요.\n\n그래서 쉬워졌냐고요? 반은 맞고 반은 아니에요. 예약은 쉬워졌는데 결정은 어려워졌거든요. 선택지가 너무 많아서 이제는 여행하는 시간보다 계획하는 시간이 더 길어요. 깃발에도 장점 하나는 있었어요. 생각은 남이 해 줬거든요.", "struct": [["1️⃣ 과거", "패키지여행 · 깃발 · 창구 환전이었음"], ["2️⃣ 장면", "단체가 같이 보던 가이드북 한 권뿐"], ["3️⃣ 현재", "저가 항공 · 네 번 터치 · 이심까지"], ["4️⃣ 역설", "예약은 쉬워지고 결정은 어려워짐 ⭐"], ["5️⃣ 마무리", "깃발의 장점 = 생각은 남이 해 줌 😆"]], "scoring": [["쉬워졌냐에 먼저", "문제가 쉬운지 어려운지를 직접 묻습니다 ✅ Yes and no 로 열면 양쪽을 다 말할 수 있어서 안전해요"], ["절차로 가르기", "항공 · 예약 · 정보 · 연결 네 가지 절차로 과거와 현재를 짝지으면 ⭐ 나열이 아니라 대응 구조가 되어 문장이 저절로 이어집니다"], ["예약 vs 결정", "예약은 쉬워지고 결정은 어려워졌다는 대구가 승부처예요 ⭐ 편해졌다로 끝내지 않고 새로 생긴 부담을 짚는 것이 고난도 답변입니다"], ["15번과 구분", "15번은 왜 해외에 나가는가, 즉 이유와 가치예요 🔁 여기는 방식의 변화만 다루고 여행의 의미 이야기는 15번에 남겨 두세요"]], "expr": [["a package tour", "패키지여행", "과거 방식을 명사구 하나로 ✈️ 그대로 쓰면 됩니다"], ["follow a flag", "깃발을 따라다니다", "패키지를 장면으로 🎭 설명 없이 바로 그려져요"], ["one guidebook", "가이드북 한 권", "정보가 귀하던 시절을 숫자로 📏 대비가 살아나요"], ["find a payphone", "공중전화를 찾다", "연결이 어렵던 시절을 동사로 ✨ 시대가 보입니다"], ["budget airlines", "저가 항공", "변화의 첫 원인을 명사로 ✈️ 반드시 넣어 주세요"], ["takes four taps", "네 번 누르면 끝나다", "간편함을 숫자로 📏 앱 시대를 압축해 줍니다"], ["an eSIM", "이심", "서베이 해외여행 편 재활용 🔁 최신 어휘라 유리해요"], ["Yes and no", "반은 맞고 반은 아니다", "쉬워졌냐는 질문에 균형 있게 답하는 구문이에요 ⭐"], ["Booking got easier", "예약은 쉬워졌다", "뒤 구와 짝을 이루는 대구의 앞부분이에요 ✨"], ["deciding got harder", "결정은 어려워졌다", "이 페이지의 결정적 한 줄 ⭐ 반드시 쓰세요"], ["plan more than travel", "여행보다 계획이 길다", "역설을 숫자 없이 보여 주는 마무리예요 ⭐ 강합니다"]], "audio": "audio/4_고난도/4-027 14. 해외여행(Overseas)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-027 14. 해외여행(Overseas)_비교.mp3"}, {"id": "4-028", "cat": "advanced", "catName": "고난도 질문", "num": 14, "topic": "해외여행", "topicEn": "Overseas", "type": "이슈", "badge": "28 이슈", "enQ": "What do people worry about when they plan a trip abroad? It could be hotel bookings, tourist spots, or the schedule. What is it, and how are those concerns being handled these days?", "enA": "The biggest worry is location, not price. A room can look perfect in the photos and still be forty minutes from anything. Photos show the room; nobody photographs the walk from the station at eleven at night with a suitcase behind you.\n\nThe second one is the schedule. People cram five places into one day because the flight was expensive, then spend the trip on trains instead of in places. That's how you come home more tired than when you left.\n\nHow is it handled now? Mostly by checking the map before the photos and reading the newest reviews only, since a place can change hands in a year. And a lot of people now book something cancellable and keep one day empty. That empty day is usually the part that saves the whole trip.", "koQ": "사람들은 해외여행을 준비할 때 무엇을 걱정하나요? 숙소 예약, 관광지, 일정 같은 것들이요. 요즘은 그 걱정을 어떻게 해결하나요?", "koA": "가장 큰 걱정은 가격이 아니라 위치예요. 사진으로는 완벽해 보여도 아무 데서나 40분 거리일 수 있거든요. 사진은 방을 보여 주지, 밤 11시에 캐리어를 끌고 역에서 걸어오는 길을 찍어 주지는 않으니까요.\n\n두 번째는 일정이에요. 항공권이 비쌌으니까 하루에 다섯 군데를 욱여넣고, 결국 여행 내내 장소가 아니라 기차 안에 있게 돼요. 그렇게 해서 떠날 때보다 더 지쳐서 돌아오는 거죠.\n\n요즘은 어떻게 해결하냐고요? 대개 사진보다 지도를 먼저 확인하고, 일 년이면 주인이 바뀌기도 하니까 최신 후기만 읽어요. 그리고 취소 가능한 걸로 잡아 두고 하루는 비워 두는 사람이 많아졌고요. 대개 그 빈 하루가 여행 전체를 살립니다.", "struct": [["1️⃣ 걱정", "가격이 아니라 위치가 걱정 1순위 🔑"], ["2️⃣ 이유", "사진은 방만 찍고 골목은 안 찍음"], ["3️⃣ 둘째", "하루 다섯 군데 → 결국 기차 안에서"], ["4️⃣ 대처", "대처는 사진보다 지도를 먼저 확인"], ["5️⃣ 마무리", "취소 가능 + 빈 하루 하나 남기기 ✅"]], "scoring": [["걱정 → 대처", "무엇을 걱정하나와 어떻게 해결하나, 두 덩어리예요 ✅ 단락을 그 순서로 나누면 구조가 그대로 완성됩니다"], ["예시를 고르기", "문제가 숙소 · 관광지 · 일정을 예시로 줬어요 🔑 셋 다 말하지 말고 숙소와 일정 두 개만 골라 깊게 파는 편이 훨씬 잘 들립니다"], ["위치라는 반전", "가격이 아니라 위치라고 뒤집는 첫 문장이 승부처예요 ⭐ 누구나 말하는 답을 한 번 비껴가면 그 순간부터 채점자가 귀를 기울입니다"], ["빈 하루 마무리", "하루를 비워 두라는 조언으로 닫으면 여운이 남아요 ⭐ 대처를 나열하고 끝내기보다 가장 좋은 하나를 마지막에 두는 편이 인상적입니다"]], "expr": [["The biggest worry is ~", "가장 큰 걱정은 ~이다", "무엇을 걱정하냐는 질문에 정면으로 답합니다 🔑"], ["forty minutes from anything", "어디서든 40분 거리", "위치 문제를 숫자로 📏 아주 구체적으로 들려요"], ["nobody photographs the walk", "걸어오는 길은 안 찍는다", "사진의 한계를 한 구로 ⭐ 고난도 통찰 표현이죠"], ["cram five places into one day", "하루에 다섯 군데를 넣다", "과욕 일정을 동사 하나로 ✨ 장면이 그려집니다"], ["on trains instead of in places", "장소가 아닌 기차 안에", "대구로 만든 역설 ⭐ 이 페이지의 결정적 한 줄"], ["more tired than when you left", "떠날 때보다 지쳐서", "결과를 비교로 보여 주는 마무리예요 💪 강합니다"], ["How is it handled now?", "요즘은 어떻게 해결하나", "문제 표현 그대로 회수 ✅ 세 번째 단락 도입용"], ["check the map before the photos", "사진보다 지도를 먼저", "대처를 순서로 바꿔 놓은 표현 🗺️ 아주 실용적이죠"], ["the newest reviews only", "최신 후기만", "정보 거르는 기준을 한 구로 📏 구체적이에요"], ["book something cancellable", "취소 가능한 걸로 잡다", "요즘 예약 습관을 동사구로 ✅ 최신감까지 챙겨요"], ["keep one day empty", "하루는 비워 두다", "이 페이지 최고의 대처법 ⭐ 마무리 자리에 쓰세요"]], "audio": "audio/4_고난도/4-028 14. 해외여행(Overseas)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-028 14. 해외여행(Overseas)_이슈.mp3"}, {"id": "4-029", "cat": "advanced", "catName": "고난도 질문", "num": 15, "topic": "해외여행 이유", "topicEn": "Reasons", "type": "비교", "badge": "29 비교", "enQ": "People go abroad for many different reasons. What are some typical reasons people travel overseas? Why do you think such trips are meaningful or valuable?", "enA": "Three reasons cover most of it. Some people go to rest — a beach, a hotel, nothing on the schedule. Some go to see — food, museums, a city they've read about. And some go to get away from their own life for a week, which is the most honest reason of the three.\n\nWhy does it matter, though? Because abroad you lose all your shortcuts. You can't read the signs, you don't know which queue is the right one, and you have to ask strangers for everything. That strips you down to how you actually behave.\n\nAnd the value shows up later. You come back and your own street looks different for about a week. In the end, a trip doesn't change the country you visited. It changes what you notice when you get home.", "koQ": "사람들은 다양한 이유로 해외에 나갑니다. 해외여행을 가는 일반적인 이유에는 어떤 것들이 있나요? 왜 그런 여행이 의미 있다고 보나요?", "koA": "이유는 세 가지면 거의 다 설명돼요. 누구는 쉬러 가요. 바다, 호텔, 일정 없음이죠. 누구는 보러 가고요. 음식, 미술관, 책에서 읽은 도시요. 그리고 누구는 일주일쯤 자기 삶에서 벗어나려고 가죠. 셋 중에 제일 솔직한 이유고요.\n\n그런데 그게 왜 의미가 있냐고요? 해외에서는 내가 쓰던 지름길이 다 사라지거든요. 간판을 못 읽고, 어느 줄이 맞는 줄인지 모르고, 뭐든 낯선 사람에게 물어봐야 해요. 그게 내가 실제로 어떻게 행동하는지를 벗겨 냅니다.\n\n그리고 가치는 나중에 드러나요. 돌아오면 일주일쯤은 내가 늘 걷던 거리가 달라 보이거든요. 결국 여행이 바꾸는 건 다녀온 나라가 아니에요. 집에 돌아왔을 때 무엇이 눈에 들어오는가를 바꾸죠.", "struct": [["1️⃣ 세 개", "쉬러 · 보러 · 벗어나려고 세 갈래"], ["2️⃣ 전환", "그런데 왜 의미가 있나로 넘어가기"], ["3️⃣ 근거", "해외에선 내 지름길이 전부 사라짐"], ["4️⃣ 효과", "실제로 어떻게 행동하는지 드러남 ⭐"], ["5️⃣ 마무리", "바뀌는 건 돌아온 뒤의 시선이라고"]], "scoring": [["14번과 구분", "14번은 해외여행 방식의 변화였어요 🔁 여기는 이유와 가치라서 앱이나 절차 이야기는 아예 빼야 합니다"], ["세 개로 분류", "일반적인 이유를 묻는 질문이에요 🔑 쉬러 · 보러 · 벗어나려고 세 개로 나누면 충분하고 네 개가 되면 각각이 얇아져서 흐려집니다"], ["왜가 본론", "왜 의미 있냐가 두 번째 질문이고 배점이 거기 있어요 ⭐ 지름길이 사라진다는 한 줄로 답하면 추상적인 감상 대신 구체적인 근거가 됩니다"], ["돌아온 뒤의 시선", "여행이 바꾸는 건 나라가 아니라 돌아온 뒤 눈에 들어오는 것 ⭐ 이 대구 한 줄이 이 페이지를 고난도로 올려 주는 승부처입니다"]], "expr": [["Three reasons cover most of it", "세 가지면 거의 다", "분류로 여는 도입 🔑 답변 구조가 바로 잡혀 줍니다"], ["to rest ↔ to see", "쉬러 ↔ 보러", "두 축을 대구로 세우기 ✨ 세 번째가 살아나요"], ["get away from their own life", "자기 삶에서 벗어나다", "세 번째 이유를 솔직하게 💕 공감까지 얻습니다"], ["Why does it matter?", "왜 의미가 있나요", "문제의 두 번째 질문을 그대로 회수합니다 ✅"], ["lose all your shortcuts", "지름길이 다 사라지다", "이 페이지의 핵심 한 구 ⭐ 반드시 넣어 주세요"], ["which queue is the right one", "어느 줄이 맞는 줄인지", "낯섦을 아주 사소한 장면으로 🎭 공감이 큽니다"], ["ask strangers for everything", "뭐든 낯선 사람에게", "무력함을 동사구로 ✨ 앞 구와 이어집니다"], ["strip you down to ~", "~까지 벗겨 내다", "고난도 구동사예요 ⭐ 의미를 설명해 주는 표현"], ["look different for a week", "일주일쯤 달라 보이다", "여행의 효과를 기간으로 📏 과장이 없어 좋아요"], ["In the end", "결국에는", "마무리로 넘어가는 시리즈 공통 신호예요 🔁"], ["what you notice at home", "집에서 눈에 들어오는 것", "이 답의 마지막 한 줄 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-029 15. 해외여행 이유(Reasons)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-029 15. 해외여행 이유(Reasons)_비교.mp3"}, {"id": "4-030", "cat": "advanced", "catName": "고난도 질문", "num": 15, "topic": "해외여행 이유", "topicEn": "Reasons", "type": "이슈", "badge": "30 이슈", "enQ": "There have recently been reports about some countries tightening visa rules for international travelers. Have you seen or heard about this in the news? How do you think visa or entry issues can affect people's travel plans?", "enA": "I did see that, yes. Europe is rolling out an online entry permit, and a few countries have added a tourist tax or tighter checks at the border. It came up everywhere last year because the dates kept getting pushed back and nobody knew when it would really start.\n\nHow does it change things? It kills the spontaneous trip. You used to be able to book a flight on Thursday and leave on Saturday. Now you apply first and wait, so the plan starts weeks before the plane does.\n\nAnd the money adds up. A permit, a tax, an extra photo — none of it is huge, but it lands on the traveller. Personally, I'm saving for Italy, so this is not somebody else's news. Borders are getting thicker again.", "koQ": "최근 일부 국가가 여행자 비자 규정을 강화한다는 보도가 있었습니다. 이런 내용을 본 적 있나요? 비자나 입국 문제가 여행 계획에 어떤 영향을 줄까요?", "koA": "네, 그런 보도 봤어요. 유럽이 온라인 입국 허가제를 도입하고 있고, 몇몇 나라는 관광세를 붙이거나 국경 심사를 강화했어요. 시행 날짜가 자꾸 미뤄지고 언제 진짜 시작될지 아무도 몰라서 작년에 여기저기서 그 얘기가 나왔죠.\n\n뭐가 달라지냐고요? 즉흥적인 여행이 사라져요. 예전엔 목요일에 항공권 끊고 토요일에 떠날 수 있었거든요. 이제는 먼저 신청하고 기다려야 해요. 그래서 계획이 비행기보다 몇 주 먼저 시작됩니다.\n\n그리고 돈도 쌓여요. 허가비, 관광세, 사진 한 장 추가. 하나하나는 크지 않은데 결국 여행자가 다 부담하죠. 개인적으로는 이탈리아 가려고 저축 중이라 남의 뉴스가 아니에요. 국경이 다시 두꺼워지고 있어요.", "struct": [["1️⃣ 뉴스", "유럽 온라인 입국 허가 · 관광세까지"], ["2️⃣ 화제", "시행일이 미뤄져 계속 보도된 이유"], ["3️⃣ 영향", "즉흥 여행이 사라짐 → 먼저 신청부터"], ["4️⃣ 비용", "허가비 · 관광세 · 사진까지 추가로"], ["5️⃣ 마무리", "국경이 다시 두꺼워지는 중이라고 ⭐"]], "scoring": [["봤다 + 사례", "봤냐는 질문엔 입국 허가 · 관광세처럼 사례를 대 주세요 🔑 막연히 봤다고만 하면 점수가 붙지 않습니다"], ["영향이 본론", "어떤 영향을 주냐가 두 번째 질문이고 배점도 거기예요 ⭐ 즉흥 여행이 사라진다는 한 줄로 답하면 추상적인 걱정보다 훨씬 구체적으로 들립니다"], ["내 일로 만들기", "이탈리아 저축 이야기는 서베이부터 이어진 설정이에요 🔁 남의 뉴스가 아니라고 붙이면 외운 티가 사라지고 답변에 진정성이 생깁니다"], ["두꺼워지는 국경", "국경이 다시 두꺼워지고 있다는 마무리가 승부처예요 ⭐ 불편하다로 끝내지 않고 흐름을 한 문장으로 요약하면 고난도 의견이 됩니다"]], "expr": [["an online entry permit", "온라인 입국 허가", "제도를 쉬운 명사구로 📖 이름을 몰라도 통합니다"], ["a tourist tax", "관광세", "두 번째 사례를 한 단어로 💳 최신 뉴스 어휘예요"], ["tighter checks at the border", "국경 심사 강화", "세 번째 사례까지 📏 봤다는 증거가 확실해져요"], ["keep getting pushed back", "자꾸 미뤄지다", "반복 보도의 이유를 구동사로 ⏰ 아주 자연스럽죠"], ["kill the spontaneous trip", "즉흥 여행을 없애다", "영향을 강한 동사 하나로 ⭐ 이 답의 핵심입니다"], ["apply first and wait", "먼저 신청하고 기다리다", "절차 변화를 동사 두 개로 ✨ 아주 간결해져요"], ["weeks before the plane", "비행기보다 몇 주 먼저", "계획이 앞당겨진 것을 대구로 📏 리듬까지 살아요"], ["the money adds up", "돈이 쌓이다", "작은 비용의 누적을 구동사로 💳 정확한 표현이죠"], ["it lands on the traveller", "여행자가 부담하다", "6번 land on 재활용 🔁 부담의 방향을 보여 줘요"], ["not somebody else's news", "남의 뉴스가 아니다", "개인 사정을 끌어오는 한 줄 💕 진정성이 생겨요"], ["Borders are getting thicker", "국경이 두꺼워지고 있다", "이 페이지의 마무리 한 줄 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-030 15. 해외여행 이유(Reasons)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-030 15. 해외여행 이유(Reasons)_이슈.mp3"}, {"id": "4-031", "cat": "advanced", "catName": "고난도 질문", "num": 16, "topic": "교통 수단", "topicEn": "Transport", "type": "비교", "badge": "31 비교", "enQ": "People in cities get around using different kinds of transportation. What are two common options, and how do they differ in cost, convenience, or environmental impact? Why might someone pick one instead of the other?", "enA": "The two everybody uses are the subway and a car, and on paper they couldn't be more different. But both are solving the same problem — your morning.\n\nOn cost, the subway is a flat fare under two thousand won and a transfer costs nothing. A car is fuel, insurance, and parking that costs more than the fuel. On convenience, the subway wins the clock — it comes on the dot and never sits in traffic. The car wins the second you have a child or a late meeting.\n\nOn the environment it is barely a contest: one train carries hundreds, a car carries one. If I had to pick, I take the subway all week. Still, people choose it for the door, not the price — what they pay for is the last five minutes.", "koQ": "도시 사람들은 다양한 교통수단으로 이동합니다. 흔히 쓰는 두 가지는 무엇이고 비용·편리함·환경 면에서 어떻게 다른가요?", "koA": "여기서 다들 쓰는 두 가지는 지하철과 자가용이에요. 서류상으로는 이보다 다를 수가 없죠. 그런데 둘 다 결국 같은 문제를 푸는 거예요. 제 아침이요.\n\n비용은요, 지하철은 2천 원도 안 되는 정액 요금이고 환승은 공짜예요. 차는 기름값에 보험에, 기름값보다 비싼 주차비까지요. 편리함은 시간으로 보면 지하철이 이겨요. 정각에 오고 막히는 데 갇히지도 않으니까요. 차는 아이가 생기거나 늦은 약속이 잡히는 순간 이기고요.\n\n환경은 겨룰 것도 없어요. 열차 한 대가 수백 명을 태우는데 차는 한 명을 태우거든요. 골라야 한다면 저는 주중 내내 지하철이에요. 그래도 사람들은 값이 아니라 문 때문에 골라요. 진짜로 값을 치르는 건 마지막 5분이거든요.", "struct": [["1️⃣ 대상", "두 수단부터 지하철 · 자가용 🚇"], ["2️⃣ 비용", "정액 요금 vs 기름 · 보험 · 주차"], ["3️⃣ 편의", "시간은 지하철 · 짐과 밤은 자가용"], ["4️⃣ 환경", "열차 한 대에 수백 명 vs 차엔 한 명"], ["5️⃣ 선택", "싸서가 아니라 문 때문에 고른다 ⭐"]], "scoring": [["세 축을 다 답", "문제가 비용 · 편리함 · 환경을 콕 집어 물어요 ✅ 세 축을 각각 한 덩어리로 끊어 답하면 빠뜨릴 일이 없습니다"], ["돌발 편과 구분", "돌발 21.교통 ③취향은 내 면허증이 서랍에 있다는 개인 이야기였어요 🔁 여기는 주어가 people 이라 도시 전체의 선택으로 올려야 고난도로 들립니다"], ["숫자로 못 박기", "정액 요금, 환승 무료, 주차가 기름값보다 비싸다처럼 숫자와 대비를 넣으면 📏 같은 내용도 훨씬 구체적으로 들리고 분량도 저절로 채워집니다"], ["마지막 뒤집기", "싸서 고르는 게 아니라 문 때문에 고른다는 한 줄이 승부처예요 ⭐ 비교를 값에서 심리로 옮기면 채점자가 기다리던 답이 나옵니다"]], "expr": [["couldn't be more different", "이보다 다를 수 없다", "비교 유형 고난도 오프너 🔁 두 대상을 벌려 놓아요"], ["a flat fare", "정액 요금", "요금 체계를 두 단어로 📏 비용 축의 시작입니다"], ["a transfer costs nothing", "환승이 공짜다", "우리 시스템의 강점을 한 구로 ⭐ 외국인이 놀라는 지점"], ["parking that costs more", "기름값보다 비싼 주차", "차 비용의 진짜 정체를 콕 💳 아주 설득력 있어요"], ["on the dot", "정각에", "돌발 교통 편 재활용 🔁 시간 정확성을 두 단어로"], ["never sit in traffic", "막히는 데 안 갇힌다", "편리함 축의 결정타 🚇 부정문이 더 강하게 들려요"], ["the second you have a child", "아이가 생기는 순간", "차가 이기는 조건을 장면으로 👶 공감이 아주 큽니다"], ["carry hundreds", "수백 명을 태우다", "환경 축을 숫자 하나로 📏 길게 설명할 필요가 없어요"], ["If I had to pick", "골라야 한다면", "시리즈 공통 선택 신호예요 🔁 결론으로 넘어갑니다"], ["choose it for the door", "문 때문에 고른다", "자가용을 고르는 진짜 이유 ✨ 아주 압축적입니다"], ["what they pay for is ~", "값을 치르는 건 ~다", "이 답의 마지막 한 줄 ⭐ 값을 심리로 바꿔 줍니다"]], "audio": "audio/4_고난도/4-031 16. 교통 수단(Transport)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-031 16. 교통 수단(Transport)_비교.mp3"}, {"id": "4-032", "cat": "advanced", "catName": "고난도 질문", "num": 16, "topic": "교통 수단", "topicEn": "Transport", "type": "이슈", "badge": "32 이슈", "enQ": "There have recently been reports about new high-speed train lines opening in some countries. Have you seen or heard about this in the news? How do you think high-speed trains could change the way people travel in the future?", "enA": "I did see something about this. A few countries are opening new lines, and ours is extending one to a coastal city that used to take four hours. The reports always use the same shot — an empty platform and a train sliding in exactly on schedule.\n\nWhat changes first is flying. Once a trip drops under two hours, people stop booking domestic flights, because the airport is an hour out of town and you have to be there ninety minutes early anyway. The train wins before it even moves.\n\nPersonally, I think the bigger change is where people live. If a city is fifty minutes from the office, it stops being far. The worry is the towns the line passes without stopping — every new station elsewhere makes them a little quieter.", "koQ": "최근 일부 나라에서 새 고속철 노선이 개통된다는 보도가 있었습니다. 고속철이 미래의 여행을 어떻게 바꿀 거라고 보나요?", "koA": "그 얘긴 저도 봤어요. 몇몇 나라가 새 노선을 개통하고 있고, 우리도 예전엔 네 시간 걸리던 해안 도시까지 노선을 늘리는 중이죠. 보도는 늘 같은 화면을 써요. 텅 빈 플랫폼에 열차가 정확히 시간 맞춰 들어오는 장면이요.\n\n가장 먼저 바뀌는 건 비행기예요. 이동이 두 시간 아래로 떨어지면 사람들은 국내선을 안 끊어요. 공항은 도심에서 한 시간 밖이고 어차피 90분 전에 가 있어야 하니까요. 기차는 출발하기도 전에 이미 이겨 있는 거죠.\n\n개인적으로는 더 큰 변화가 사는 곳이라고 봐요. 어떤 도시가 회사에서 50분이면 더는 멀지 않으니까요. 걱정되는 건 노선이 서지 않고 지나가는 동네들이에요. 다른 데 역이 하나 생길 때마다 그만큼 더 조용해지거든요.", "struct": [["1️⃣ 뉴스", "새 노선 개통 보도를 봤다고 먼저 🚄"], ["2️⃣ 장면", "빈 플랫폼 · 정시 도착 화면 하나"], ["3️⃣ 변화", "두 시간 아래로 가면 국내선이 준다"], ["4️⃣ 확장", "50분이면 멀지 않다 · 사는 곳 이동"], ["5️⃣ 우려", "서지 않고 지나가는 소도시의 그늘 ⭐"]], "scoring": [["13번과 구분", "13.국내여행 ①에서 이미 KTX 두 시간을 썼어요 🔁 여기는 과거가 아니라 미래와 새 노선이 주어입니다"], ["봤다고 먼저", "뉴스형은 봤는지부터 물어요 ✅ 세세한 사실을 외우기보다 늘 나오는 화면 하나를 묘사하는 편이 훨씬 쉽고 실제로 본 사람처럼 들립니다"], ["미래를 두 겹", "여행 방식과 사는 곳 두 겹으로 나눠서 말하면 ⭐ 빨라진다 한 겹으로 끝내는 답과 확실히 갈리고 분량도 애쓰지 않아도 채워집니다"], ["단점 한 줄", "서지 않고 지나가는 소도시 한 줄이 균형을 만들어요 ⚖️ 좋은 뉴스에도 잃는 쪽을 붙이는 습관이 고난도 답의 기본기입니다"]], "expr": [["I did see something about this", "그 얘긴 봤어요", "뉴스형 고난도 오프너 🔁 봤다를 먼저 못 박아요"], ["open a new line", "노선을 개통하다", "뉴스 내용을 세 단어로 🚄 정확한 표현입니다"], ["used to take four hours", "예전엔 네 시간 걸리던", "변화 폭을 시간으로 📏 설명보다 훨씬 빠릅니다"], ["the same shot", "늘 같은 화면", "봤다는 증거가 되는 한 구 📺 진짜처럼 들려요"], ["drop under two hours", "두 시간 아래로 내려가다", "기준선을 숫자로 못 박기 📏 뒤 논리가 깔끔해져요"], ["stop booking domestic flights", "국내선을 안 끊다", "가장 먼저 오는 변화를 한 구로 ✈️ 아주 구체적이죠"], ["an hour out of town", "도심에서 한 시간 밖", "공항의 약점을 거리로 📏 비교 근거가 생깁니다"], ["it stops being far", "더는 멀지 않다", "거리 감각의 변화를 동사로 ✨ 고난도다운 표현"], ["pass without stopping", "서지 않고 지나가다", "그늘을 한 구로 콕 ⭐ 균형을 만들어 주는 표현"], ["a little quieter", "그만큼 더 조용해진", "쇠퇴를 부드럽게 ✨ 단정하지 않아 세련돼요"], ["Personally, I think ~", "개인적으로는 ~", "뉴스형 의견 분리 신호 🔁 사실과 생각을 갈라요"]], "audio": "audio/4_고난도/4-032 16. 교통 수단(Transport)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-032 16. 교통 수단(Transport)_이슈.mp3"}, {"id": "4-033", "cat": "advanced", "catName": "고난도 질문", "num": 17, "topic": "지형", "topicEn": "Terrain", "type": "비교", "badge": "33 비교", "enQ": "Talk about a country whose geography is similar to or near your country. What geographical features does it have, and what changes has it gone through in recent years? Give me as many details as possible.", "enA": "The closest one is Japan, and the map is almost a copy of ours. Mountains over most of the land, a very long coastline, and the cities squeezed onto the flat parts. Both build up, not out, for the same reason.\n\nThe difference is underneath. Japan is a chain of islands sitting on an active fault, so they get volcanoes, hot springs and earthquake drills at school. Our mountains are old and quiet; theirs are still working.\n\nAs for recent changes, after the tsunami they raised sea walls along whole stretches of coast, changing how the shoreline looks. Inland, the
