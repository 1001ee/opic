 mountain villages are emptying — the young move out and the houses stay behind — and warmer winters keep shortening the snow season. The land decides the rest.", "koQ": "당신의 나라와 지형이 비슷하거나 가까운 나라에 대해 말해 주세요. 어떤 지형적 특징이 있고 최근 몇 년간 어떤 변화가 있었나요?", "koA": "가장 가까운 나라는 일본인데, 지도만 보면 우리랑 거의 판박이예요. 국토 대부분이 산이고, 해안선이 아주 길고, 도시는 평지에 몰려 있어요. 두 나라 다 같은 이유로 옆이 아니라 위로 올리고요.\n\n차이는 그 밑에 있어요. 일본은 활성 단층 위에 놓인 열도라서 화산과 온천이 있고, 초등학교에서 지진 대피 훈련을 해요. 우리 산은 늙고 조용한데, 저쪽 산은 아직 일을 하고 있는 셈이죠.\n\n최근 변화로 보면, 쓰나미 이후에 해안 곳곳의 방파제를 높였어요. 해안선 생김새 자체가 달라졌죠. 내륙에서는 산간 마을이 비어 가고요. 젊은 사람은 나가고 집만 남아요. 겨울이 따뜻해지면서 북쪽 눈 시즌도 계속 짧아지고 있고요. 결국 땅이 나머지를 정하는 거죠.", "struct": [["1️⃣ 대상", "가장 가깝고 가장 비슷한 나라, 일본"], ["2️⃣ 공통", "국토 대부분 산 · 아주 긴 해안선"], ["3️⃣ 차이", "열도 · 활성 단층 · 화산과 온천"], ["4️⃣ 변화", "쓰나미 이후 해안 방파제를 높임"], ["5️⃣ 변화", "산간 마을은 비고 눈은 짧아져 ⭐"]], "scoring": [["돌발 편과 구분", "돌발 14.지형은 우리나라 자체가 주어였어요 🔁 여기는 다른 나라라 공통점을 먼저 묶어야 합니다"], ["변화까지 답", "지형 특징만 말하고 끝내는 답이 가장 흔해요 ✅ 최근 몇 년의 변화를 묻는 뒷부분이 사실상 진짜 채점 구간이라 반드시 채워야 합니다"], ["두 겹의 변화", "사람이 만든 변화인 방파제와 저절로 생긴 변화인 인구 · 눈을 나눠 말하면 ⭐ 같은 분량으로도 답의 깊이가 두 배로 들립니다"], ["나라를 고정", "롤플레이 20.지형 ③도 일본(오사카)이었어요 🔁 다음 ②번이 방금 말한 나라를 이어받으니 여기서 일본으로 정했으면 끝까지 일본으로 가야 합니다"]], "expr": [["almost a copy of ours", "우리와 거의 판박이", "두 나라를 한 구로 묶기 🗺️ 공통점부터 잡는 순서"], ["mountains over most of the land", "국토 대부분이 산", "지형 특징 1번을 숫자 없이 📏 아주 자연스러워요"], ["squeezed onto the flat parts", "평지에 몰려 있는", "도시 분포를 동사 하나로 ⭐ 고난도 압축 표현이죠"], ["build up, not out", "옆이 아니라 위로", "결과까지 대구로 ✨ 리듬이 살아 기억에 남아요"], ["a chain of islands", "열도", "반도와 대비되는 핵심어 🗺️ 차이의 출발점입니다"], ["on an active fault", "활성 단층 위에", "화산 · 지진의 원인을 한 구로 ⭐ 수준이 확 올라가요"], ["still working", "아직 일하고 있는", "늙은 산과 대비되는 두 단어 ✨ 아주 감각적이죠"], ["raise sea walls", "방파제를 높이다", "사람이 만든 변화 📏 최근 변화 파트의 핵심어"], ["the houses stay behind", "집만 남는다", "인구 감소를 장면으로 🏚️ 통계보다 훨씬 선명해요"], ["shorten the snow season", "눈 시즌이 짧아지다", "기후 변화를 지역 사례로 ❄️ 과장 없이 좋습니다"], ["The land decides the rest.", "땅이 나머지를 정한다", "돌발 지형 편 재활용 🔁 마무리 한 줄을 담당해요"]], "audio": "audio/4_고난도/4-033 17. 지형(Terrain)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-033 17. 지형(Terrain)_비교.mp3"}, {"id": "4-034", "cat": "advanced", "catName": "고난도 질문", "num": 17, "topic": "지형", "topicEn": "Terrain", "type": "이슈", "badge": "34 이슈", "enQ": "Have you seen or read any news articles about the country you just talked about? What was the news - was it about the economy or political relations? What do you think about those articles?", "enA": "I do read about Japan, and honestly most of what I see is economic. The yen has been weak for a while now, so every other article is about prices, shopping, and record numbers of visitors going both ways.\n\nThe political side does show up in headlines too, usually about meetings and agreements. I read those more slowly. The tone changes a lot depending on which paper you open, so I try to read two before I decide anything.\n\nWhat I think is that the travel numbers say more than the headlines do. Millions of people crossing in both directions every single year is its own kind of news, and a fairly good one. It just moves more quietly than the front page does, so almost nobody sits down and writes it up that way.", "koQ": "방금 말한 나라의 뉴스 기사를 보거나 읽은 적이 있나요? 경제 뉴스였나요, 정치 관계 뉴스였나요? 그 기사들을 어떻게 생각하나요?", "koA": "일본 기사는 챙겨 보는 편인데, 솔직히 제가 보는 건 대부분 경제 쪽이에요. 엔화가 한동안 약세라서 두 기사 중 하나는 물가 얘기, 쇼핑 얘기, 양쪽으로 오간 역대 최다 방문객 얘기예요.\n\n정치 쪽도 헤드라인에 나오긴 해요. 보통 회담이나 합의 소식이고요. 그런 건 좀 천천히 읽어요. 어느 신문을 여느냐에 따라 논조가 꽤 달라서, 뭘 판단하기 전에 두 군데는 읽어 보려고 합니다.\n\n제 생각은 이래요. 오간 사람 수가 헤드라인보다 더 많은 걸 말해 준다고요. 해마다 수백만 명이 양쪽으로 건너간다는 건 그 자체로 하나의 뉴스고, 꽤 괜찮은 뉴스죠. 1면보다 훨씬 조용히 움직여서 아무도 그렇게 안 써 줄 뿐이에요.", "struct": [["1️⃣ 범위", "내가 보는 건 대부분 경제 쪽 기사"], ["2️⃣ 사례", "엔화 약세 · 물가 · 역대 최다 방문"], ["3️⃣ 정치", "헤드라인은 천천히 · 두 곳 비교"], ["4️⃣ 의견", "오간 숫자가 헤드라인보다 더 말해"], ["5️⃣ 마무리", "조용히 움직이는 뉴스도 있다 ⭐"]], "scoring": [["한쪽을 먼저", "경제냐 정치냐를 콕 집어 물어요 ✅ 경제 쪽을 주로 본다고 먼저 고른 뒤에 정치 기사를 짧게 붙이세요"], ["중립을 지켜", "국가 관계는 어느 편도 들지 않는 편이 안전해요 ⚖️ 신문마다 논조가 다르다는 한 줄이면 균형이 그대로 보이고 감점 요소도 사라집니다"], ["의견을 분리", "무엇을 봤는지와 어떻게 생각하는지를 섞으면 안 돼요 ✅ 본 것을 다 말한 뒤 생각을 따로 붙이면 구조가 훨씬 깔끔하게 들립니다"], ["17번과 짝", "①번에서 고른 나라를 그대로 이어받는 문제예요 🔁 여기서 나라를 바꾸면 앞 답과 어긋나니 일본이면 끝까지 일본으로 가야 합니다"]], "expr": [["most of what I see is ~", "내가 보는 건 대부분", "경제냐 정치냐를 먼저 고르기 ✅ 답이 안 흐려져요"], ["the yen has been weak", "엔화가 약세다", "경제 뉴스를 한 구로 💳 최신 어휘라 점수가 됩니다"], ["every other article", "두 기사 중 하나는", "빈도를 숫자 없이 📏 아주 자연스러운 과장이죠"], ["record numbers of visitors", "역대 최다 방문객", "뉴스 어휘 그대로 📏 봤다는 증거가 확실해져요"], ["going both ways", "양쪽으로 오가는", "한쪽 이야기로 안 끝내기 ⚖️ 균형이 생깁니다"], ["show up in headlines", "헤드라인에 등장하다", "정치 기사를 부드럽게 📺 단정하지 않아 안전해요"], ["I read those more slowly", "그런 건 천천히 읽어요", "태도를 한 문장으로 ✨ 신중함이 그대로 보여요"], ["depending on which paper", "어느 신문이냐에 따라", "논조 차이를 한 구로 ⚖️ 중립을 지키는 핵심 표현"], ["read two before I decide", "정하기 전에 둘을 읽다", "판단 습관을 장면으로 📖 아주 설득력 있어요"], ["say more than the headlines", "헤드라인보다 많은 걸", "의견 파트의 핵심 한 구 ⭐ 숫자 편을 들어 줍니다"], ["move quietly", "조용히 움직이다", "이 답의 마지막 한 줄 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-034 17. 지형(Terrain)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-034 17. 지형(Terrain)_이슈.mp3"}, {"id": "4-035", "cat": "advanced", "catName": "고난도 질문", "num": 18, "topic": "날씨", "topicEn": "Weather", "type": "비교", "badge": "35 비교", "enQ": "Weather varies greatly from country to country. Tell me about a country whose weather is very different from your country's. What would be enjoyable or challenging for someone living there?", "enA": "The one that couldn't be more different is Singapore. We get four seasons that take turns; they get one, and it runs all year — around thirty degrees, humid, with a downpour most afternoons that stops as fast as it starts.\n\nThe enjoyable part is how little you have to plan. Nobody owns a winter coat. There is no closet to swap twice a year, no heating bill, and no morning where the forecast picks your clothes for you.\n\nThe hard part is that nothing marks the time. Here the cold tells you the year is ending; there, December looks exactly like June. And the gap between the street and the air conditioning is brutal — sweating and shivering in the same hour. Seasons wear you out, but they hand you a reset button four times a year.", "koQ": "날씨는 나라마다 크게 다릅니다. 당신의 나라와 날씨가 아주 다른 나라와, 그곳에 사는 사람의 좋은 점과 힘든 점을 말해 주세요.", "koA": "이보다 다를 수 없는 곳은 싱가포르예요. 우리는 사계절이 번갈아 오는데 거긴 계절이 하나고 그게 일 년 내내 이어져요. 30도쯤에 습하고, 오후마다 비가 쏟아지는데 시작만큼 빨리 그쳐요.\n\n좋은 점은 계획할 게 거의 없다는 거예요. 겨울 코트를 가진 사람이 없어요. 일 년에 두 번 옷장을 갈아엎을 일도, 난방비도, 예보가 오늘 옷을 골라 주는 아침도 없고요.\n\n힘든 점은 시간을 표시해 주는 게 없다는 거예요. 여기선 추워지면 한 해가 끝나 간다는 걸 알잖아요. 거긴 12월이 딱 6월 같아요. 게다가 길바닥과 에어컨 사이 낙차가 지독해요. 같은 시간 안에 땀 흘리고 또 떨거든요. 사계절은 사람을 지치게 하지만 대신 1년에 네 번 리셋 버튼을 줘요.", "struct": [["1️⃣ 대상", "완전히 다른 곳으로 싱가포르 하나"], ["2️⃣ 대비", "사계절 번갈아 vs 계절이 하나뿐"], ["3️⃣ 장점", "겨울 코트 없음 · 옷장 갈 일 없음"], ["4️⃣ 단점", "12월이 6월 같아 시간이 안 흘러"], ["5️⃣ 마무리", "사계절은 리셋 버튼을 준다는 말 ⭐"]], "scoring": [["돌발을 뒤집어", "돌발 13.날씨 ①은 옷장이 답해 준다였어요 🔁 여기서는 옷장을 갈아엎을 일이 없다로 뒤집어 쓰세요"], ["두 쪽 다 답", "즐거운 점과 힘든 점을 같이 물어요 ✅ 한쪽만 말하고 끝내는 답이 흔하니 장점 뒤에 단점을 반드시 붙여야 절반짜리가 안 됩니다"], ["한 나라만", "여러 나라를 훑으면 어느 것도 구체적이지 않아요 ⭐ 한 곳만 골라 온도 · 비 · 옷장까지 장면으로 내려가는 편이 훨씬 세게 들립니다"], ["리셋 마무리", "사계절이 리셋 버튼을 준다는 한 줄이 승부처예요 ⭐ 좋다 나쁘다를 넘어 계절의 역할로 옮겨 가면 확실히 고난도로 들립니다"]], "expr": [["couldn't be more different", "이보다 다를 수 없다", "비교 유형 고난도 오프너 🔁 두 나라를 벌려 놓아요"], ["take turns", "번갈아 오다", "돌발 날씨 편 재활용 🔁 사계절을 두 단어로"], ["it runs all year", "일 년 내내 이어지다", "계절이 하나인 상태를 한 구로 📏 아주 간결하죠"], ["a downpour most afternoons", "오후마다 쏟아지는 비", "스콜을 이름 없이 설명 🌧️ 훨씬 자연스럽게 들려요"], ["stops as fast as it starts", "시작만큼 빨리 그친다", "대구 한 줄로 리듬 만들기 ✨ 기억에도 남습니다"], ["nobody owns a winter coat", "겨울 코트가 없다", "장점을 장면 하나로 🧥 설명보다 백배 빠릅니다"], ["no closet to swap", "옷장 갈아엎을 일 없다", "돌발의 옷장을 뒤집어 재활용 🔁 아주 영리한 수예요"], ["the forecast picks your clothes", "예보가 옷을 고른다", "우리 쪽 일상을 한 구로 ⭐ 대비가 확 살아나요"], ["nothing marks the time", "시간을 표시할 게 없다", "단점의 핵심 한 구 ⭐ 이 답의 승부처입니다"], ["sweating and shivering", "땀 흘리다 떨다", "실내외 낙차를 두 동사로 😆 아주 감각적이죠"], ["a reset button", "리셋 버튼", "마무리를 담당하는 비유 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-035 18. 날씨(Weather)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-035 18. 날씨(Weather)_비교.mp3"}, {"id": "4-036", "cat": "advanced", "catName": "고난도 질문", "num": 18, "topic": "날씨", "topicEn": "Weather", "type": "이슈", "badge": "36 이슈", "enQ": "Lately, the news has been full of stories about extreme weather, such as heatwaves and heavy rain. What kinds of stories have you recently seen or heard? How do you usually react when you hear about weather events like these?", "enA": "There has been a lot of it. Last summer we had the longest stretch on record of tropical nights — weeks where it never dropped below twenty-five after dark. Then the rain came all at once and flooded the underpasses across half the city.\n\nMy reaction has changed, though. The first few years I would stop and read the whole article and feel bad for an hour. Now I skim it and go straight to doing something — checking the drain outside, calling my mother on Sunday to ask whether her air conditioner is still working.\n\nWhat actually gets me is the word record. It shows up every summer now, and something that repeats every single year is not a record anymore — it is just the weather. That is the part I cannot unhear.", "koQ": "최근 폭염이나 폭우 같은 극한 날씨 뉴스가 많습니다. 어떤 이야기를 보거나 들었고, 이런 소식을 들으면 보통 어떻게 반응하나요?", "koA": "그런 뉴스가 정말 많았어요. 작년 여름엔 역대 가장 긴 열대야가 이어졌죠. 해가 지고도 몇 주 내내 25도 아래로 안 내려갔고요. 그러다 비가 한꺼번에 쏟아져서 도시 절반의 지하차도가 잠겼어요.\n\n다만 제 반응은 좀 바뀌었어요. 처음 몇 해는 하던 걸 멈추고 기사를 다 읽고 한 시간쯤 마음이 안 좋았거든요. 지금은 대충 훑고 바로 뭔가를 해요. 집 앞 배수구를 확인하고, 일요일에 엄마한테 전화해서 에어컨은 잘 돌아가냐고 묻고요.\n\n진짜로 걸리는 건 기록이라는 단어예요. 이제 여름마다 나오거든요. 해마다 반복되는 건 더는 기록이 아니라 그냥 날씨죠. 그 부분이 한 번 듣고 나면 잘 안 지워져요.", "struct": [["1️⃣ 사례", "역대 최장 열대야 · 기록적 폭우"], ["2️⃣ 장면", "한꺼번에 쏟아져 잠긴 도시 지하차도"], ["3️⃣ 반응", "예전엔 정독 · 지금은 훑고 행동"], ["4️⃣ 행동", "배수구 확인 · 일요일 엄마 통화"], ["5️⃣ 마무리", "매년 나오면 그건 기록이 아니다 ⭐"]], "scoring": [["반응까지 답", "무엇을 봤는지와 어떻게 반응하는지를 둘 다 물어요 ✅ 뉴스만 나열하고 끝내면 절반짜리 답이 됩니다"], ["돌발과 구분", "돌발 13.날씨 ④는 내가 겪은 폭설, 롤플레이 21.날씨 ③은 태풍이었어요 🔁 여기는 내 사건이 아니라 매년 반복되는 뉴스가 주어라 시점이 다릅니다"], ["변화를 넣어", "예전 반응과 지금 반응을 나눠서 말하면 ⭐ 놀랐다 한 마디로 끝나는 답과 확실히 갈리고 분량도 애쓰지 않아도 저절로 채워집니다"], ["기록 한 줄", "매년 나오는 기록은 더는 기록이 아니라는 한 줄이 승부처예요 ⭐ 감상 대신 관찰로 마무리하면 채점자가 기다리던 고난도 마무리가 됩니다"]], "expr": [["There has been a lot of it", "그런 게 정말 많았어요", "뉴스형 오프너 📺 봤다를 자연스럽게 못 박아요"], ["the longest stretch on record", "역대 가장 긴 기간", "뉴스 어휘 그대로 📏 마지막 한 줄과 이어집니다"], ["tropical nights", "열대야", "우리 여름 뉴스의 핵심어 🌡️ 딱 한 단어면 됩니다"], ["never drop below ~", "~ 아래로 안 내려가다", "폭염을 숫자로 못 박기 📏 체감이 확 살아나요"], ["come all at once", "한꺼번에 쏟아지다", "폭우를 동사구로 🌧️ 양보다 방식이 보입니다"], ["flood the underpasses", "지하차도가 잠기다", "피해를 장면 하나로 ⭐ 통계보다 훨씬 선명해요"], ["My reaction has changed", "반응이 바뀌었어요", "뒷부분으로 넘어가는 신호 ✅ 구조가 또렷해져요"], ["skim it", "대충 훑다", "달라진 태도를 두 단어로 ✨ 아주 솔직하게 들려요"], ["go straight to doing something", "바로 행동으로 옮기다", "반응을 행동으로 바꾸기 ⭐ 이 답의 채점 구간이죠"], ["It shows up every summer", "여름마다 등장한다", "반복을 한 문장으로 🔁 마무리를 준비해 줍니다"], ["is not a record anymore", "더는 기록이 아니다", "이 답의 마지막 한 줄 ⭐ 관찰로 끝내 여운이 깁니다"]], "audio": "audio/4_고난도/4-036 18. 날씨(Weather)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-036 18. 날씨(Weather)_이슈.mp3"}, {"id": "4-037", "cat": "advanced", "catName": "고난도 질문", "num": 19, "topic": "집", "topicEn": "Home", "type": "비교", "badge": "37 비교", "enQ": "How do you and your parents solve problems at home differently? When something goes wrong in your house, how do you handle it, and how do your parents handle problems in theirs? Tell me the similarities and differences.", "enA": "On paper we could not be more different. When something breaks here, my first move is my phone — I search the model number, watch somebody fix the same thing, and if that fails I book a technician through an app. I never open a wall.\n\nMy parents work the other way. My father goes for the toolbox in the drawer before anyone finishes the sentence. My mother makes one phone call — always to the same plumber who has been fixing that building for thirty years, or to somebody two floors down.\n\nWhere we overlap is timing: neither house lets a problem sit overnight. And honestly both of us end up calling someone — theirs has a name, mine has a rating. They fix things with a phone book; I fix things with a phone.", "koQ": "당신과 부모님은 집에서 생긴 문제를 어떻게 다르게 해결하나요? 비슷한 점과 다른 점을 말해 주세요.", "koA": "서류상으로는 저희가 이보다 다를 수 없어요. 여기서 뭔가 고장 나면 저는 제일 먼저 휴대폰을 들어요. 모델 번호를 검색하고, 같은 걸 고치는 영상을 보고, 그래도 안 되면 앱으로 기사님을 예약하죠. 벽은 절대 안 뚫고요.\n\n부모님은 반대로 하세요. 아빠는 말이 끝나기도 전에 서랍에서 공구함부터 꺼내세요. 엄마는 전화를 딱 한 통 하시고요. 그 건물을 30년째 봐 온 설비 아저씨나, 아래 두 층 사는 아는 분한테요.\n\n겹치는 건 속도예요. 두 집 다 문제를 하룻밤 넘기지 않아요. 그리고 솔직히 둘 다 결국은 누군가한테 전화를 걸어요. 부모님 쪽은 이름을 아는 사람이고, 제 쪽은 별점이 있는 사람일 뿐이죠. 부모님은 수첩으로 고치고 저는 폰으로 고치는 거예요.", "struct": [["1️⃣ 대비", "나는 검색 먼저 · 부모님은 손 먼저"], ["2️⃣ 본인", "영상 보고 안 되면 앱으로 예약 📱"], ["3️⃣ 부모", "아빠는 공구함 · 엄마는 전화 한 통"], ["4️⃣ 공통", "두 집 다 문제를 하룻밤 안 넘긴다 ⏰"], ["5️⃣ 마무리", "이름 아는 사람 vs 별점 있는 사람 ⭐"]], "scoring": [["비슷한 점 필수", "문제가 차이와 비슷한 점을 같이 물어요 ✅ 차이만 말하고 끝내는 답이 흔한데 그러면 절반짜리가 됩니다"], ["사건 아닌 방식", "서베이 14.집은 온돌 고장, 롤플레이 15.거주지는 싱크대 역류였어요 🔁 여기는 사건이 아니라 문제를 처리하는 방식을 물으니 습관으로 답하세요"], ["세 사람을 분리", "나 · 아빠 · 엄마를 각각 동사 하나로 잡으면 ⭐ 검색한다, 공구함을 꺼낸다, 전화를 건다처럼 세 장면이 되어 훨씬 또렷하게 들립니다"], ["대구로 마무리", "이름이 있는 사람과 별점이 있는 사람이라는 대구가 승부처예요 ⭐ 좋다 나쁘다가 아니라 무엇이 달라졌는지로 옮기면 고난도로 들립니다"]], "expr": [["could not be more different", "이보다 다를 수 없다", "비교 유형 고난도 오프너 🔁 두 쪽을 벌려 놓아요"], ["my first move is my phone", "제일 먼저 폰을 든다", "내 방식을 장면 하나로 📱 설명이 필요 없어요"], ["book a technician", "기사님을 예약하다", "요즘 방식의 핵심 동사 ✨ 아주 정확한 표현이죠"], ["I never open a wall", "벽은 절대 안 뚫는다", "한계를 웃기게 인정 😆 솔직해서 호감이 생겨요"], ["go for the toolbox", "공구함부터 꺼내다", "아빠를 동사 하나로 🔧 성격까지 같이 보입니다"], ["make one phone call", "전화를 한 통 하다", "엄마의 방식을 한 구로 ☎️ 대비가 아주 선명해요"], ["somebody two floors down", "아래 두 층 사는 분", "동네 관계망을 한 구로 🤝 공감이 아주 큽니다"], ["let a problem sit overnight", "문제를 하룻밤 넘기다", "공통점을 시간으로 📏 비슷한 점 파트의 핵심"], ["end up ~ing", "결국 ~하게 되다", "두 방식을 하나로 묶는 연결어 🔁 구조가 살아요"], ["theirs has a name", "그쪽은 이름이 있다", "차이를 한 구로 압축 ⭐ 고난도다운 마무리예요"], ["mine has a rating", "내 쪽은 별점이 있다", "앞 구와 짝을 이루는 대구 ✨ 리듬이 살아납니다"]], "audio": "audio/4_고난도/4-037 19. 집(Home)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-037 19. 집(Home)_비교.mp3"}, {"id": "4-038", "cat": "advanced", "catName": "고난도 질문", "num": 19, "topic": "집", "topicEn": "Home", "type": "이슈", "badge": "38 이슈", "enQ": "What problems do most people face when renting a house or an apartment? What are they worried about, and how do these issues affect their lives? How do people deal with them?", "enA": "The worry that comes first is the deposit. It is a large amount of money sitting in somebody else's account for two years, and everyone knows a story about getting it back late or only after a fight. That one fear shapes the whole search.\n\nThe second problem is repairs. A leak or mould starts an argument about whose job it is, and because tenants do not want to annoy the landlord, small things get left alone until they are expensive ones.\n\nHow it affects life is simple: people move every two years, never fully unpack, and stop treating the place as theirs. What people do about it is get practical — photograph everything on move-in day, keep it in writing instead of on the phone, and ask about renewal a few months early.", "koQ": "대부분의 사람들이 집이나 아파트를 세 얻을 때 어떤 문제를 겪나요? 무엇을 걱정하고 어떻게 해결하나요?", "koA": "가장 먼저 오는 걱정은 보증금이에요. 큰돈이 2년 동안 남의 계좌에 들어가 있는 거잖아요. 늦게 돌려받았다거나 한바탕하고 나서야 받았다는 이야기를 다들 하나씩 알고 있고요. 그 불안 하나가 집 구하는 과정을 다 좌우해요.\n\n두 번째 문제는 수리예요. 누수나 곰팡이가 생기면 누구 책임이냐로 실랑이가 시작돼요. 세입자는 집주인을 성가시게 하기 싫으니까 작은 건 그냥 두게 되고요. 그러다 결국 비싼 문제가 됩니다.\n\n삶에 미치는 영향은 단순해요. 2년마다 이사하고, 짐을 끝까지 안 풀고, 이 집을 내 집처럼 대하지 않게 되죠. 그래서 사람들은 아주 현실적으로 대처해요. 입주하는 날 전부 사진으로 찍어 두고, 통화 대신 문자로 남기고, 갱신할 건지 몇 달 전에 미리 물어봅니다.", "struct": [["1️⃣ 걱정", "1순위는 보증금 · 남의 계좌에 2년"], ["2️⃣ 문제", "누수 · 곰팡이는 책임 공방부터"], ["3️⃣ 심리", "집주인 눈치에 작은 건 그냥 둔다"], ["4️⃣ 영향", "2년마다 이사 · 짐을 끝까지 안 푼다"], ["5️⃣ 대처", "사진 · 문자 기록 · 갱신 미리 확인 ⭐"]], "scoring": [["네 갈래를 다 답", "문제 · 걱정 · 영향 · 대처를 한 번에 물어요 ✅ 네 덩어리로 끊어서 답하면 하나도 빠뜨릴 일이 없습니다"], ["20번과 구분", "20.거주지 ②는 뉴스로 보도되는 사회적 주거 문제예요 🔁 여기는 세입자 개인이 겪는 계약 문제라 주어가 사회가 아니라 사람들이어야 층위가 맞습니다"], ["두 가지면 충분", "보증금과 수리 두 가지만 잡아도 분량은 충분히 나와요 ⭐ 셋 이상 나열하면 각각이 얕아져서 오히려 점수가 떨어지기 쉽습니다"], ["대처는 셋으로", "사진 · 문자 · 갱신 확인처럼 구체적인 행동 세 개로 끝내면 ⭐ 조언이 선명해지고 답도 아주 깔끔하게 닫혀서 마무리가 좋습니다"]], "expr": [["sit in somebody else's account", "남의 계좌에 들어가 있다", "보증금을 장면으로 💳 불안의 정체가 보입니다"], ["get it back late", "늦게 돌려받다", "가장 흔한 사례를 한 구로 📏 아주 구체적이죠"], ["only after a fight", "한바탕하고 나서야", "분쟁을 아주 짧게 📏 길게 설명할 필요가 없어요"], ["whose job it is", "누구 책임이냐", "수리 분쟁의 핵심을 한 구로 ⭐ 아주 압축적입니다"], ["annoy the landlord", "집주인을 성가시게 하다", "세입자 심리를 동사로 ✨ 공감이 아주 큽니다"], ["get left alone", "그냥 방치되다", "결과를 수동태로 📏 책임을 흐리지 않아 좋아요"], ["never fully unpack", "짐을 끝까지 안 푼다", "영향을 장면 하나로 ⭐ 이 답의 승부처입니다"], ["treat the place as theirs", "내 집처럼 대하다", "심리 변화를 한 구로 ✨ 고난도다운 표현이에요"], ["photograph everything", "전부 사진으로 찍다", "대처 1번을 동사로 📸 바로 쓸 수 있는 조언이죠"], ["keep it in writing", "문자로 남기다", "대처 2번을 한 구로 ✅ 아주 실용적인 조언이죠"], ["ask about renewal early", "갱신을 미리 묻다", "대처 3번으로 마무리 ⭐ 세 개가 리듬을 만들어요"]], "audio": "audio/4_고난도/4-038 19. 집(Home)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-038 19. 집(Home)_이슈.mp3"}, {"id": "4-039", "cat": "advanced", "catName": "고난도 질문", "num": 20, "topic": "거주지·집", "topicEn": "Home", "type": "비교", "badge": "39 비교", "enQ": "People look for different things in a home. What do you think makes a home feel just right? Why does that matter so much to people?", "enA": "Everyone says space, but I think the real answer is light and quiet. A small room that gets the morning sun beats a big one that never does, and a neighbor who walks in heels above you can ruin an apartment that nobody could fault on paper.\n\nThe second thing is the route. Not the size — how the rooms line up. If you drop your bag, wash your hands and reach the kitchen without turning around twice, the place feels twice as big as the floor plan says.\n\nWhy it matters so much is that home is the only place that sees both ends of your day. Every small annoyance gets multiplied by three hundred and sixty-five. You do not notice a good home; you just stop bracing yourself at the door every evening.", "koQ": "사람들은 집에서 서로 다른 것을 중요하게 봅니다. 무엇이 집을 딱 알맞게 만든다고 생각하고, 왜 그게 중요할까요?", "koA": "다들 넓이라고 하는데, 진짜 답은 빛과 소음이라고 생각해요. 아침 해가 드는 작은 방이 해가 안 드는 큰 방보다 나아요. 위층에서 구두 신고 걷는 이웃 하나면 도면상 흠잡을 데 없는 집도 망가지고요.\n\n두 번째는 동선이에요. 크기가 아니라 방이 어떻게 이어지느냐요. 가방을 내려놓고 손을 씻고 두 번 되돌아가지 않고 주방까지 갈 수 있으면, 도면에 적힌 것보다 두 배는 넓게 느껴져요.\n\n이게 왜 그렇게 중요하냐면, 집은 하루의 시작과 끝을 다 보는 유일한 공간이거든요. 작은 불편 하나가 365를 곱해서 돌아와요. 좋은 집은 사실 눈에 안 띄어요. 그냥 저녁마다 현관에서 마음을 다잡지 않게 될 뿐이죠.", "struct": [["1️⃣ 주장", "넓이가 아니라 빛과 소음이 진짜 답"], ["2️⃣ 예시", "해 드는 작은 방 > 해 안 드는 큰 방"], ["3️⃣ 동선", "크기가 아니라 방이 이어지는 순서"], ["4️⃣ 이유", "하루의 시작과 끝을 다 보는 유일한 곳"], ["5️⃣ 마무리", "좋은 집은 아예 눈에 띄지 않는다 ⭐"]], "scoring": [["왜까지 답", "무엇이냐와 왜 중요하냐를 같이 물어요 ✅ 조건만 나열하고 끝내는 답이 흔한데 그러면 절반짜리입니다"], ["서베이와 구분", "서베이 14.집은 나는 거실에 산다는 개인 취향이었어요 🔁 여기는 주어가 people 이라 누구에게나 통하는 기준으로 올려야 고난도로 들립니다"], ["흔한 답 치우기", "다들 넓이라고 한다를 먼저 말하고 아니라고 뒤집으면 ⭐ 첫 문장부터 생각이 있는 답처럼 들리고 뒤 내용도 저절로 정리됩니다"], ["작게 내려가기", "빛 · 소음 · 동선처럼 작고 구체적인 것으로 내려갈수록 좋아요 ⭐ 편안함, 안정감 같은 큰 단어만 쓰면 누구 답인지 알 수 없게 됩니다"]], "expr": [["the real answer is ~", "진짜 답은 ~이다", "흔한 답을 먼저 치우는 오프너 ⭐ 아주 세련돼요"], ["get the morning sun", "아침 해가 들다", "채광을 한 구로 ☀️ 자연광보다 훨씬 그림이 돼요"], ["walk in heels above you", "위층에서 구두를 신고", "소음을 장면 하나로 😆 공감이 아주 크게 옵니다"], ["ruin an apartment", "집을 망치다", "작은 요인의 힘을 강한 동사로 ✨ 과장이 살아요"], ["how the rooms line up", "방이 이어지는 순서", "동선을 쉬운 말로 🧩 전문용어가 필요 없어요"], ["without turning around twice", "두 번 되돌아가지 않고", "좋은 동선을 장면으로 📏 아주 구체적입니다"], ["the floor plan", "도면, 평면도", "크기와 체감을 가르는 단어 📏 대비가 살아나요"], ["see both ends of your day", "하루의 양끝을 보다", "집의 정의를 한 구로 ⭐ 이 답의 승부처입니다"], ["multiplied by 365", "365를 곱하다", "중요한 이유를 숫자로 📏 설득력이 확 올라가요"], ["You do not notice ~", "~은 눈에 띄지 않는다", "좋은 것의 속성을 뒤집어 표현 ✨ 아주 고급스럽죠"], ["stop bracing yourself", "마음을 다잡지 않게 되다", "이 답의 마지막 한 줄 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-039 20. 거주지·집(Home)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-039 20. 거주지·집(Home)_비교.mp3"}, {"id": "4-040", "cat": "advanced", "catName": "고난도 질문", "num": 20, "topic": "거주지·집", "topicEn": "Home", "type": "이슈", "badge": "40 이슈", "enQ": "Housing problems are frequently covered in the news as a big concern in many communities. Have you seen any stories about housing issues that affect many people in your country? What solutions have been discussed in the news or proposed by local communities?", "enA": "This one is in the news constantly. The biggest story of the last few years has been deposit fraud — landlords taking more than the place was worth and young tenants losing everything they had saved. The reports all use the same shot: a stack of contracts spread out on a table.\n\nThe second story is cost. Young people spend a third of their pay on rent, so they move further and further out, commute longer, and plan everything else around that one number.\n\nAs for solutions, the news talks about making deposit insurance compulsory, opening the ownership records so anyone can check a building before signing, and building more public housing near the bigger stations. Personally, I think supply alone will not fix trust.", "koQ": "주거 문제는 뉴스에 자주 나옵니다. 당신 나라에서 많은 사람에게 영향을 주는 주거 문제와 논의된 해결책을 말해 주세요.", "koA": "이건 뉴스에 정말 자주 나와요. 최근 몇 년 가장 큰 이야기는 전세 사기였고요. 집주인이 집값보다 더 많은 보증금을 받고, 젊은 세입자들이 모아 둔 걸 다 잃었죠. 보도는 늘 같은 화면을 써요. 테이블 위에 쭉 펼쳐 놓은 계약서요.\n\n두 번째 이야기는 비용이에요. 젊은 사람들이 월급의 3분의 1을 집세로 내요. 그래서 점점 더 바깥으로 나가고, 출퇴근이 길어지고, 나머지 모든 걸 그 숫자 하나에 맞춰서 계획하게 되죠.\n\n해결책으로는, 보증보험을 의무화하자는 이야기, 등기 정보를 열어서 계약 전에 누구나 건물을 확인할 수 있게 하자는 이야기, 큰 역 근처에 공공주택을 더 짓자는 이야기가 나와요. 개인적으로는 공급만으로 신뢰가 회복되진 않는다고 봅니다.", "struct": [["1️⃣ 뉴스", "최근 몇 년 최대 이슈는 전세 사기"], ["2️⃣ 장면", "테이블에 펼쳐 놓은 계약서 화면 📺"], ["3️⃣ 둘째", "월급의 3분의 1이 집세로 나간다"], ["4️⃣ 해결", "보증보험 의무 · 등기 공개 · 공공주택"], ["5️⃣ 의견", "공급만으로 신뢰는 안 돌아온다 ⭐"]], "scoring": [["해결책이 핵심", "문제보다 해결책 쪽을 더 길게 물어요 ✅ 뉴스에서 논의된 방안 세 개는 반드시 미리 준비해 두세요"], ["19번과 구분", "19.집 ②는 세입자 개인이 겪는 계약 문제였어요 🔁 여기는 뉴스로 보도되는 사회 문제라 주어가 사회와 제도로 올라가야 두 답이 겹치지 않습니다"], ["세 개로 묶기", "보증보험 · 등기 공개 · 공공주택처럼 방안을 셋으로 묶으면 ⭐ 외우기도 쉽고 답도 구조가 잡혀서 훨씬 정돈되어 들립니다"], ["의견은 끝에", "본 것을 다 말한 뒤 개인적으로는으로 생각을 분리하세요 ✅ 공급만으로 신뢰는 안 돌아온다는 한 줄이면 의견 파트로 충분합니다"]], "expr": [["be in the news constantly", "뉴스에 계속 나오다", "뉴스형 오프너 📺 봤다를 자연스럽게 못 박아요"], ["deposit fraud", "전세 사기", "이슈 이름을 두 단어로 📏 정확한 뉴스 어휘예요"], ["more than the place was worth", "집값보다 많은", "사기 구조를 한 구로 ⭐ 설명이 아주 간결해져요"], ["lose everything they had saved", "모은 걸 다 잃다", "피해를 장면으로 📏 숫자보다 훨씬 선명합니다"], ["all use the same shot", "늘 같은 화면을 쓴다", "봤다는 증거가 되는 한 구 📺 진짜처럼 들려요"], ["a third of their pay", "월급의 3분의 1", "비용 문제를 비율로 📏 과장 없이 잘 전달돼요"], ["plan everything around ~", "~에 맞춰 다 계획하다", "영향을 한 구로 ⭐ 삶이 어떻게 눌리는지 보여요"], ["deposit insurance", "보증보험", "해결책 1번의 정확한 이름 ✅ 뉴스 어휘 그대로"], ["so anyone can check", "누구나 확인할 수 있게", "해결책 2번을 목적절로 ✨ 아주 자연스럽죠"], ["public housing", "공공주택", "해결책 3번을 두 단어로 🏢 세 개가 리듬을 만들어요"], ["supply alone will not ~", "공급만으로는 ~ 안 된다", "의견 파트의 마지막 한 줄 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-040 20. 거주지·집(Home)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-040 20. 거주지·집(Home)_이슈.mp3"}, {"id": "4-041", "cat": "advanced", "catName": "고난도 질문", "num": 21, "topic": "재활용", "topicEn": "Recycling", "type": "비교", "badge": "41 비교", "enQ": "How have recycling practices changed over the years? Are the items people recycle different from the past? Tell me about all the changes in your country's recycling system.", "enA": "Back then the list was short — paper, bottles, cans, and everything else went into one bag. Nobody rinsed anything, and nobody checked what the plastic was actually made of before throwing it out.\n\nThese days the list is a lot longer. Clear bottles go out on their own, film plastic has its own bag, and there are separate bins for batteries, light bulbs and old clothes downstairs. Bottles now arrive with no label at all so you do not have to peel one off.\n\nWhat changed the system was the rubbish we started making: delivery containers and padded parcels did not exist on the old list. The trade-off is that sorting now takes real attention — you have to know your plastics — but far less of it ends up buried in the ground.", "koQ": "재활용 관행은 수년간 어떻게 변했나요? 재활용하는 물품이 예전과 달라졌나요? 시스템의 변화를 말해 주세요.", "koA": "예전엔 목록이 짧았어요. 종이, 병, 캔이었고 나머지는 전부 한 봉투로 들어갔죠. 아무도 헹구지 않았고, 버리기 전에 그 플라스틱이 실제로 뭘로 만들어졌는지 확인하는 사람도 없었어요.\n\n요즘은 목록이 훨씬 길어요. 투명 페트병은 따로 나가고, 비닐은 자기 봉투가 있고, 건전지랑 형광등이랑 헌 옷은 아래층에 수거함이 따로 있어요. 생수병은 아예 라벨 없이 나와서 떼어낼 일도 없고요.\n\n시스템을 바꾼 건 우리가 새로 만들기 시작한 쓰레기예요. 배달 용기랑 완충재 택배 봉투는 예전 목록엔 아예 없던 거잖아요. 대신 잃은 건, 이제 분리배출이 진짜 신경을 써야 하는 일이 됐다는 거예요. 플라스틱 종류를 알아야 하거든요. 그래도 땅에 묻히는 양은 훨씬 줄었죠.", "struct": [["1️⃣ 과거", "목록은 짧고 나머지는 한 봉투로"], ["2️⃣ 태도", "헹구지도 않고 재질도 안 보던 시절"], ["3️⃣ 현재", "투명 페트 · 비닐 · 건전지 따로"], ["4️⃣ 제도", "무라벨 생수병 · 품목별 수거함"], ["5️⃣ 마무리", "신경은 늘고 묻히는 양은 줄어 ⭐"]], "scoring": [["품목을 콕 집어", "문제가 재활용 물품이 달라졌는지를 따로 물어요 ✅ 품목을 나열하는 부분이 사실상 진짜 채점 구간입니다"], ["돌발과 구분", "돌발 16.재활용 ⑤비교는 아무 질문 없이 버리던 시절에서 정확한 과학으로라는 태도의 변화였어요 🔁 여기는 품목과 제도로 가야 겹치지 않습니다"], ["원인을 넣어", "목록이 왜 길어졌는지를 배달 용기와 택배 완충재로 설명하면 ⭐ 변했다만 말하는 답과 확실히 갈리고 분량도 저절로 채워집니다"], ["맞바꿈 한 줄", "신경 쓸 일은 늘고 묻히는 양은 줄었다는 대구가 승부처예요 ⭐ 좋아졌다로 끝내지 말고 얻은 것과 잃은 것을 한 문장에 담으세요"]], "expr": [["the list was short", "목록이 짧았다", "과거를 한 구로 📏 품목 축의 출발점이 됩니다"], ["go into one bag", "한 봉투로 들어가다", "예전 방식을 장면으로 😆 대비가 확 살아나요"], ["nobody checked ~", "아무도 확인하지 않았다", "과거의 태도를 부정문으로 ✨ 아주 간결하죠"], ["go out on their own", "따로 나가다", "분리배출을 쉬운 말로 ♻️ 전문용어가 필요 없어요"], ["separate bins for ~", "~ 전용 수거함", "품목 확대를 한 구로 📏 예시를 붙이기 좋습니다"], ["with no label at all", "라벨이 아예 없는", "무라벨 생수병을 설명 없이 ⭐ 아주 요즘답죠"], ["peel off", "떼어내다", "돌발 재활용 편 재활용 🔁 손동작이 그려집니다"], ["padded parcels", "완충재 택배 봉투", "새로 생긴 쓰레기를 두 단어로 📦 아주 구체적이죠"], ["did not exist on the old list", "예전 목록엔 없던", "변화의 원인을 한 구로 ⭐ 이 답의 핵심입니다"], ["The trade-off is ~", "대신 잃는 건 ~이다", "비교 유형 고난도 채점 포인트 🔁 꼭 넣으세요"], ["know your plastics", "플라스틱 종류를 알다", "늘어난 부담을 한 구로 ✨ 위트까지 있습니다"]], "audio": "audio/4_고난도/4-041 21. 재활용(Recycling)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-041 21. 재활용(Recycling)_비교.mp3"}, {"id": "4-042", "cat": "advanced", "catName": "고난도 질문", "num": 21, "topic": "재활용", "topicEn": "Recycling", "type": "이슈", "badge": "42 이슈", "enQ": "Talk about some recent recycling-related issues in your country. What was the news about, and what does the media say about the problem? What is your opinion, and how does this issue affect the environment?", "enA": "The story that keeps coming back is how little of it actually gets recycled. We sort carefully, but a large share is burned or buried anyway, usually because one dirty container is enough to ruin the whole batch.\n\nThe media splits into two camps. One side blames the household — rinse it, crush it, read the label. The other side says the packaging was never recyclable to begin with, so the sorting was decided before we touched it.\n\nPersonally, I side with the second one. No amount of rinsing fixes a container made of three materials glued together. As for the environment, the cost lands in the same places every time — more burning, fuller landfills, and plastic breaking down into pieces too small to collect.", "koQ": "당신 나라의 최근 재활용 관련 문제를 말해 주세요. 언론은 뭐라고 하고, 당신 생각은 어떤가요? 환경에는 어떤 영향이 있나요?", "koA": "계속 돌아오는 이야기는 실제로 재활용되는 비율이 얼마나 낮은가예요. 우리는 꼼꼼히 분리하는데 상당 부분이 결국 태워지거나 묻혀요. 대개는 더러운 용기 하나면 그 묶음 전체를 망치기에 충분하기 때문이고요.\n\n언론은 두 진영으로 갈려요. 한쪽은 가정을 탓해요. 헹궈라, 찌그러뜨려라, 라벨을 봐라 하고요. 다른 쪽은 그 포장재가 애초에 재활용될 수 없는 물건이었다고 해요. 우리가 손대기도 전에 이미 정해져 있었다는 거죠.\n\n개인적으로는 두 번째 쪽이에요. 세 가지 재질을 붙여 만든 용기는 아무리 헹궈도 답이 없거든요. 환경으로 보면 비용은 매번 같은 곳으로 가요. 더 많은 소각, 더 꽉 찬 매립지, 그리고 주워 담기엔 너무 작게 부서진 플라스틱이요.", "struct": [["1️⃣ 이슈", "실제 재활용 비율이 낮다는 보도"], ["2️⃣ 원인", "더러운 용기 하나가 묶음을 망친다"], ["3️⃣ 언론", "가정 탓 vs 포장재 설계 탓 두 진영"], ["4️⃣ 의견", "세 재질을 붙였으면 헹궈도 소용없다"], ["5️⃣ 환경", "소각 · 매립 · 잘게 부서진 조각 ⭐"]], "scoring": [["네 갈래를 다 답", "뉴스 · 언론의 시각 · 내 의견 · 환경 영향을 한 번에 물어요 ✅ 반드시 네 덩어리로 끊어서 답하세요"], ["언론은 두 진영", "언론이 뭐라고 하느냐는 질문에는 한쪽만 옮기지 마세요 ⚖️ 두 진영으로 갈린다고 정리한 뒤 내 의견에서 한쪽을 고르면 구조가 아주 깔끔합니다"], ["21번과 이어서", "①번이 품목과 제도의 변화였으니 ②번은 그 제도가 실제로 작동하느냐로 이어집니다 🔁 같은 품목 나열을 반복하면 답이 두 번 나오는 셈이 됩니다"], ["환경은 세 개로", "소각 · 매립 · 미세 플라스틱 세 개로 닫으면 ⭐ 환경에 나쁘다는 막연한 마무리와 확실히 갈리고 여운도 훨씬 오래 남습니다"]], "expr": [["keep coming back", "계속 돌아오다", "반복 보도를 두 단어로 🔁 뉴스형 오프너입니다"], ["actually get recycled", "실제로 재활용되다", "쟁점을 한 구로 ⭐ actually 하나가 핵심이에요"], ["be burned or buried", "태워지거나 묻히다", "결과를 두 동사로 📏 아주 정확한 표현입니다"], ["ruin the whole batch", "묶음 전체를 망치다", "돌발 재활용 편 재활용 🔁 원인을 한 구로 잡아요"], ["split into two camps", "두 진영으로 갈리다", "언론 파트의 뼈대 ⚖️ 중립을 지켜 주는 표현"], ["blame the household", "가정을 탓하다", "한쪽 입장을 세 단어로 📏 아주 간결한 표현이죠"], ["never recyclable to begin with", "애초에 재활용 불가인", "반대쪽 입장을 한 구로 ⭐ 논점이 선명해집니다"], ["before we touched it", "우리가 손대기 전에", "책임의 시점을 한 구로 ✨ 아주 고급스러운 표현"], ["three materials glued together", "세 재질을 붙인", "내 의견의 근거를 장면으로 ⭐ 반박이 어려워요"], ["the cost lands in ~", "비용은 ~으로 떨어진다", "환경 영향 파트의 연결어 📏 구조가 살아납니다"], ["break down into pieces", "잘게 부서지다", "미세 플라스틱을 쉬운 말로 ⭐ 마지막 한 줄이에요"]], "audio": "audio/4_고난도/4-042 21. 재활용(Recycling)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-042 21. 재활용(Recycling)_이슈.mp3"}, {"id": "4-043", "cat": "advanced", "catName": "고난도 질문", "num": 22, "topic": "산업", "topicEn": "Industry", "type": "비교", "badge": "43 비교", "enQ": "Tell me about a rising industry in your country. Which industry do people talk about these days, and what is it about? How has it changed over the years compared to what it was before?", "enA": "The one everybody talks about is content — drama, film, music and webtoons. I'm preparing to move into the marketing side of it, so I get to watch the whole thing change from fairly close up.\n\nBack then it was a domestic business. Shows were made for the audience here, a few broadcasters decided what got made, and selling abroad was a bonus that happened a year later, if it happened at all.\n\nThese days it is a completely different story. A series is planned for everywhere at once, streaming releases it the same night in every country, and webtoons feed the whole pipeline with stories that already have readers. Budgets are several times bigger than they were ten years ago. The trade-off is that everything now rides on a few big titles each year.", "koQ": "당신 나라에서 떠오르는 산업에 대해 말해 주세요. 요즘 사람들은 어떤 산업을 이야기하고, 예전과 어떻게 달라졌나요?", "koA": "다 oduct that failed to meet people's expectations? What was the product, and why were people disappointed? How did people respond to the issue?", "enA": "The clearest example is the second season of a series half the country watched. People waited two years, the cast was all still there, and expectations could not have been higher.\n\nWhy people were disappointed is that it repeated the first one. The budget was visibly bigger, but the surprise was gone. Season one worked because nobody was watching yet, so it could take risks; season two played it safe because everybody was.\n\nHow people responded was loud and then quiet. Viewing numbers broke records in week one, the review scores dropped by half, and by week three nobody was talking about it. The studio answered by announcing a third season anyway. The numbers were fine; the conversation was not.", "koQ": "그 산업에서 사람들의 기대에 못 미친 신제품이 있었나요? 무엇이었고 왜 실망했으며 사람들은 어떻게 반응했나요?", "koA": "가장 분명한 예는 이 나라 절반이 본 시리즈의 두 번째 시즌이에요. 사람들이 2년을 기다렸고 배우도 그대로였으니까, 기대가 더 높을 수가 없었죠.\n\n왜 실망했냐면 첫 시즌을 반복했거든요. 제작비는 눈에 띄게 커졌는데 놀라움이 사라졌어요. 시즌 1은 아직 아무도 안 보고 있었으니까 모험을 할 수 있었고, 시즌 2는 다들 보고 있으니까 안전하게 간 거예요.\n\n반응은 요란했다가 조용해졌어요. 첫 주 시청 수치는 기록을 깼고, 리뷰 점수는 반토막이 났고, 3주째엔 아무도 그 얘길 안 하더라고요. 제작사는 시즌 3 발표로 답했고요. 숫자는 괜찮았어요. 대화가 안 괜찮았던 거죠.", "struct": [["1️⃣ 대상", "나라 절반이 본 시리즈의 시즌 2 🎬"], ["2️⃣ 기대", "2년을 기다렸고 배우도 그대로였다"], ["3️⃣ 이유", "제작비는 커졌는데 놀라움이 사라져"], ["4️⃣ 구조", "시즌 1은 모험 · 시즌 2는 안전하게"], ["5️⃣ 반응", "수치는 기록 · 3주 뒤엔 조용 ⭐"]], "scoring": [["세 갈래를 다 답", "무엇 · 왜 실망 · 어떻게 반응을 순서대로 물어요 ✅ 세 덩어리로 끊어 답하면 구조가 저절로 잡힙니다"], ["제목은 안 써도", "실제 작품명을 대지 않아도 절반이 본 시리즈의 시즌 2로 충분히 전달됩니다 ⭐ 이름을 기억하려 애쓰기보다 규모와 장면으로 설명하는 편이 훨씬 안전해요"], ["반응은 두 단계", "첫 주에 터지고 3주 뒤에 조용해졌다는 두 단계로 나누면 ⭐ 사람들이 실망했다 한 마디로 끝나는 답과 확실히 갈리고 분량도 채워집니다"], ["대구로 마무리", "숫자는 괜찮았고 대화가 안 괜찮았다는 마지막 대구가 승부처예요 ⭐ 성패를 수치가 아니라 화제성으로 옮기면 고난도로 들립니다"]], "expr": [["half the country watched", "나라 절반이 본", "규모를 한 구로 📏 제목 없이도 전달이 됩니다"], ["the cast was all still there", "배우가 그대로였다", "기대의 근거를 장면으로 ✨ 아주 구체적이죠"], ["could not have been higher", "더 높을 수가 없었다", "기대치를 최상급으로 ⭐ 뒤의 실망이 커집니다"], ["repeat the first one", "첫 편을 반복하다", "실망의 핵심을 세 단어로 📏 아주 명쾌한 표현"], ["the surprise was gone", "놀라움이 사라졌다", "제작비와 대비되는 한 구 ⭐ 이 답의 승부처예요"], ["nobody was watching yet", "아무도 안 보고 있었다", "시즌 1의 자유를 한 구로 ✨ 통찰이 느껴집니다"], ["play it safe", "안전하게 가다", "시즌 2를 동사구 하나로 🎯 아주 자연스럽죠"], ["break records", "기록을 깨다", "첫 주 반응을 두 단어로 📏 반전의 출발점입니다"], ["drop by half", "반토막이 나다", "평가 하락을 한 구로 📏 숫자가 있어 선명해요"], ["nobody was talking about it", "아무도 얘기하지 않았다", "식은 반응을 장면으로 ⭐ 조용함이 더 무섭습니다"], ["The numbers were fine.", "숫자는 괜찮았어요", "마지막 대구의 앞 절 ⭐ 여운이 가장 깁니다"]], "audio": "audio/4_고난도/4-044 22. 산업(Industry)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-044 22. 산업(Industry)_이슈.mp3"}]</script>
<script>
(function(){

function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }

const st = {cat:S.cat||'survey', topic:'all', type:'all', view:'all', q:'', id:null};
const avail = {};        // id -> 음성 파일 있음 true/false
const TIMING = {};       // id -> {arr, kind}  (timing.js 파일에서 로드)

const esc = s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const catColor = id=>`var(--c-${id})`;
const audioURL = x => x.audio.split('/').map(encodeURIComponent).join('/');
const timingURL = x => audioURL(x).replace(/\.mp3$/i,'.timing.js');

/* ---------- 필터 ---------- */
function inCat(){ return D.filter(x=>x.cat===st.cat); }
function filtered(){

  return inCat().filter(x=>
    (st.topic==='all' || String(x.num)===st.topic) &&
    (st.type==='all' || x.type===st.type) &&
    (st.view==='all' || (st.view==='star'&&S.star[x.id]) || (st.view==='todo'&&!S.mem[x.id]) || (st.view==='mem'&&S.mem[x.id]) || (st.view==='audio'&&avail[x.id]===true)) &&
    (!q || (x.enA+' '+x.enQ+' '+x.koA+' '+x.koQ+' '+x.topic+' '+x.topicEn).toLowerCase().includes(q))
  );
}

function renderTabs(){

function renderFilters(){
  document.documentElement.style.setProperty('--cc', catColor(st.cat));

  $('#topics').innerHTML = `<button class="chip" aria-pressed="${st.topic==='all'}" data-topic="all">전체</button>` +
    topics.map(t=>`<button class="chip" aria-pressed="${st.topic===String(t.num)}" data-topic="${t.num}">${esc(t.topic)}<span class="n">${items.filter(x=>x.num===t.num).length}</span></button>`).join('');

  $('#types').innerHTML = `<button class="chip" aria-pressed="${st.type==='all'}" data-type="all">전체</button>` +
    types.map((t,i)=>`<button class="chip" aria-pressed="${st.type===t}" data-type="${esc(t)}">${i+1}. ${esc(t)}<span class="n">${items.filter(x=>x.type===t&&(st.topic==='all'||String(x.num)===st.topic)).length}</span></button>`).join('');
  const V=[['all','모두'],['todo','안 외운 것'],['mem','외운 것'],['star','★ 즐겨찾기'],['audio','🔊 음성 있는 것']];
  $('#views').innerHTML = V.map(([k,l])=>`<button class="chip" style="--cc:var(--ink)" aria-pressed="${st.view===k}" data-view="${k}">${l}</button>`).join('');
}

/* ---------- 대본 텍스트 ---------- */
function exprPatterns(x){
  const out=[];
  x.expr.forEach(r=>{
    (r[0]||'').split(/\s*[\/·,]\s*|\s+or\s+/).forEach(p=>{
      p=p.replace(/~|…|\.\.\./g,' ').replace(/\(.*?\)/g,' ').replace(/\s+/g,' ').trim();
      if(p.length>=3) out.push(p);
    });
  });
  return out.sort((a,b)=>b.length-a.length);
}
function highlight(text, pats){
  let html=esc(text);
  pats.forEach(p=>{
    const src=esc(p).replace(/[.*+?^${}()|[\]\\]/g,'\\$&').replace(/'/g,"['’]");
    try{ html=html.replace(new RegExp('(?<![\\w>])('+src+')(?![\\w<])','gi'),'<mark>$1</mark>'); }catch(e){}
  });
  return html;
}
function initials(text){ return esc(text).replace(/([A-Za-z])([A-Za-z'’]+)/g,(m,a,b)=>a+b.replace(/[A-Za-z]/g,'_')); }
function paras(t){ return t.split(/\n/).map(s=>s.trim()).filter(Boolean); }
/* 문장 나누기 — tts.py 의 sentences() 와 같은 규칙 */
function splitSent(p){ return p.split(/(?<=[.!?])\s+/).filter(s=>s.trim()); }
function sentencesOf(t){ return paras(t).flatMap(splitSent); }
function words(t){ return (t.match(/[A-Za-z][A-Za-z'’-]*/g)||[]).length; }
function fmt(s){ if(!isFinite(s)) return '0:00'; s=Math.max(0,Math.round(s)); return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }

/* ---------- 문장 타이밍 ---------- */
window.OPIC_T = function(id, arr, kind){ TIMING[id]={arr, kind}; if(cur.x && cur.x.id===id) computeStarts(); };
function loadTiming(x){
  if(TIMING[x.id]) return;
  const old=document.getElementById('timingjs'); if(old) old.remove();
  const s=document.createElement('script'); s.id='timingjs'; s.src=timingURL(x);
  s.onerror=()=>{}; document.head.appendChild(s);
}
function computeStarts(){
  const x=cur.x; if(!x) return;
  const n=cur.sents.length, t=TIMING[x.id];
  const syncEl=$('#sync');
  if(t && t.arr.length===n){
    cur.starts=t.arr;
    if(syncEl) syncEl.textContent = t.kind==='exact' ? '문장 싱크: 정밀' : '문장 싱크: 자동 맞춤';
  } else if(P.duration){
    // 타이밍 파일이 없으면 글자 수 비율로 추정
    const w=cur.sents.map(s=>s.length+8), tot=w.reduce((a,b)=>a+b,0);
    let acc=0; cur.starts=w.map(v=>{ const s=acc/tot*P.duration; acc+=v; return s; });
    if(syncEl) syncEl.textContent='문장 싱크: 추정';
  }
}
function sentEls(){ return document.querySelectorAll('#en .s'); }
function setNow(i){
  if(i===cur.idx) return;
  const els=sentEls();
  if(els[cur.idx]) els[cur.idx].classList.remove('now');
  cur.idx=i;
  const el=els[i]; if(!el) return;
  el.classList.add('now');
  if(S.follow && !P.paused){
    const r=el.getBoundingClientRect(), top=($('#pcard')?.getBoundingClientRect().bottom||0)+10;
    if(r.top<top || r.bottom>window.innerHeight-40) window.scrollBy({top:r.top-top-window.innerHeight*0.25,behavior:'smooth'});
  }
}
function idxAt(t){
  const a=cur.starts; if(!a) return -1;
  let i=0; for(let k=0;k<a.length;k++){ if(a[k]<=t+0.08) i=k; else break; } return i;
}
function tick(){
  if(cur.starts){
    if(cur.lock>=0){
      const end = cur.starts[cur.lock+1] ?? P.duration;
      if(P.currentTime>=end-0.05 || P.currentTime<cur.starts[cur.lock]-0.3){ P.currentTime=cur.starts[cur.lock]; }
    }
    setNow(idxAt(P.currentTime));
  }
  if($('#fill')){ $('#fill').style.width=(P.duration?P.currentTime/P.duration*100:0)+'%'; $('#cur').textContent=fmt(P.currentTime); }
  if(!P.paused) requestAnimationFrame(tick);
}
function seekSent(i, play=true){
  if(!cur.starts || i<0 || i>=cur.starts.length) return;
  P.currentTime=cur.starts[i]+0.01; setNow(i);
  if(cur.lock>=0){ setLock(i); }
  if(play) P.play();
}
function setLock(i){
  const els=sentEls();
  els.forEach(e=>e.classList.remove('lock'));
  cur.lock=i;
  if(i>=0 && els[i]) els[i].classList.add('lock');
  const b=$('#slock'); if(b) b.classList.toggle('on-ok', i>=0);
}
function toggleLock(){
  if(!cur.starts) return;
  if(cur.lock>=0) setLock(-1);
  else { const i=cur.idx>=0?cur.idx:0; setLock(i); if(P.paused) seekSent(i); }
}

/* ---------- 오디오 ---------- */
function setPlayIcon(playing){
  const b=$('#play'); if(!b) return;
  b.innerHTML = playing ? '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>' : '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>';
}
function loadAudio(x){
  P.pause(); P.loop=false; P.dataset.id=x.id; stopQuestion();
  P.src=audioURL(x); P.playbackRate=S.speed; P.load();
  loadTiming(x);
}
P.addEventListener('loadedmetadata',()=>{
  markAvail(P.dataset.id,true);
  const b=$('#play'); if(b) b.disabled=false;
  if($('#dur')) $('#dur').textContent=fmt(P.duration);
  P.playbackRate=S.speed; computeStarts();
});
P.addEventListener('error',()=>{
  const id=P.dataset.id; if(!id) return; markAvail(id,false);
  const m=$('#pmsg'); if(m){ m.style.display='block'; m.innerHTML='<div class="notice">🔈 아직 이 스크립트의 음성 파일이 없어요. TTS 변환 후 이 페이지를 새로고침(F5)하면 자동으로 연결돼요.</div>'; }
  ['#play','#back5','#loop','#slock'].forEach(s=>{ const e=$(s); if(e) e.disabled=true; });
});
P.addEventListener('play',()=>{ if(!qChain) stopQuestion(); setPlayIcon(true); requestAnimationFrame(tick); });
P.addEventListener('pause',()=>setPlayIcon(false));
P.addEventListener('seeked',()=>{ if(P.paused) tick(); });
P.addEventListener('ended',()=>{ setPlayIcon(false); });
function togglePlay(){ if(!$('#play')||$('#play').disabled) return; P.paused?P.play():P.pause(); }

function markAvail(id,v){
  if(avail[id]===v) return; avail[id]=v;
  const d=document.querySelector(`[data-dot="${id}"]`); if(d) d.className='dot '+(v?'on':'off');
  renderStats();
}
/* 음성 파일이 있는지 백그라운드로 확인 */
function probeAll(){
  const q=D.filter(x=>avail[x.id]===undefined).sort((a,b)=>(a.cat===st.cat?0:1)-(b.cat===st.cat?0:1));
  let active=0;
  function next(){
    while(active<4 && q.length){
      const x=q.shift(); if(avail[x.id]!==undefined) continue; active++;
      const a=new Audio(); a.preload='metadata'; let done=false;
      const fin=v=>{ if(done) return; done=true; active--; markAvail(x.id,v); a.removeAttribute('src'); next(); };
      a.addEventListener('loadedmetadata',()=>fin(true)); a.addEventListener('error',()=>fin(false));
      setTimeout(()=>fin(false),8000);
      a.src=audioURL(x);
    }
  }
  next();
}

/* ---------- 녹음 ---------- */
let rec=null, recChunks=[], recStart=0, recTimer=null, recURL=null;
async function toggleRec(){
  const b=$('#recBtn');
  if(rec && rec.state==='recording'){ rec.stop(); return; }
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream); recChunks=[];
    rec.ondataavailable=e=>recChunks.push(e.data);
    rec.onstop=()=>{
      stream.getTracks().forEach(t=>t.stop()); clearInterval(recTimer);
      if(recURL) URL.revokeObjectURL(recURL);
      recURL=URL.createObjectURL(new Blob(recChunks,{type:rec.mimeType||'audio/webm'}));
      const o=$('#recOut'); if(o) o.innerHTML=`<audio controls src="${recURL}"></audio>`;
      if(b){ b.textContent='다시 녹음'; b.classList.remove('rec'); }
    };
    rec.start(); recStart=Date.now(); P.pause();
    b.textContent='■ 녹음 끝내기'; b.classList.add('rec');
    recTimer=setInterval(()=>{ const t=$('#recT'); if(t) t.textContent=fmt((Date.now()-recStart)/1000); },250);
  }catch(e){
    const o=$('#recOut'); if(o) o.innerHTML='<span class="meta">마이크를 쓸 수 없어요. 주소창 왼쪽 아이콘에서 마이크를 허용해 주세요 (Chrome·Edge 권장).</span>';
  }
}

/* ---------- 질문 듣기 (브라우저 내장 음성) ---------- */
const Q = new Audio(); Q.preload='none';
let qChain=false, qToken=0;
const qURL = x => (x.qaudio||'').split('/').map(encodeURIComponent).join('/');
function qBox(on){ const b=$('#enQ'); if(b) b.classList.toggle('speaking',on); const t=$('#sayQ'); if(t) t.textContent=on?'■ 멈추기':'🔊 질문 듣기'; }
function stopQuestion(){ qToken++; qChain=false; Q.pause(); if('speechSynthesis' in window) speechSynthesis.cancel(); qBox(false); }
function afterQuestion(x, chain){
  qBox(false);
  if(chain && P.dataset.id===x.id && avail[x.id]!==false){
    setTimeout(()=>{ if(qChain && P.dataset.id===x.id){ qChain=false; P.currentTime=0; P.play(); } else qChain=false; }, 1200);
  } else qChain=false;
}
/* 질문 재생: TTS 질문 음성 파일 → 없으면 브라우저 내장 음성 */
function playQuestion(x, chain){
  const playing = $('#enQ') && $('#enQ').classList.contains('speaking');
  stopQuestion(); if(playing && !chain) return;
  P.pause(); qChain=!!chain; const tok=++qToken; let fell=false;
  const fallback=()=>{ if(fell||tok!==qToken) return; fell=true; sayQuestion(x.enQ, ()=>{ if(tok===qToken) afterQuestion(x, qChain); }); };
  Q.onended=()=>{ if(tok===qToken) afterQuestion(x, qChain); };
  Q.onerror=fallback;
  qBox(true);
  if(!x.qaudio){ fallback(); return; }
  Q.src=qURL(x); Q.playbackRate=1;
  Q.play().catch(err=>{ if(err && err.name==='NotAllowedError') { qBox(false); qChain=false; } else fallback(); });
}
function sayQuestion(text, done){
  if(!('speechSynthesis' in window)){ done&&done(); return; }
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(text); u.lang='en-US'; u.rate=0.95;
  const vs=speechSynthesis.getVoices();
  const v=vs.find(v=>/en-US/i.test(v.lang)&&/natural|aria|jenny|guy|google/i.test(v.name)) || vs.find(v=>/en-US/i.test(v.lang));
  if(v) u.voice=v;
  u.onend=()=>{ done&&done(); };
  speechSynthesis.speak(u);
}

/* ---------- 이벤트 ---------- */
function bindDetail(x,L,i){
  $('#prev').onclick=()=>go(L[i-1]); $('#next').onclick=()=>go(L[i+1]);
  $('#star').onclick=()=>{ S.star[x.id]=!S.star[x.id]; if(!S.star[x.id]) delete S.star[x.id]; save(); refresh(false); };
  $('#mem').onclick=()=>toggleMem(x.id);
  $('#play').onclick=togglePlay;
  $('#back5').onclick=()=>{ P.currentTime=Math.max(0,P.currentTime-5); };
  $('#loop').onclick=toggleLoop;
  $('#slock').onclick=toggleLock;
  $('#follow').onclick=()=>{ S.follow=!S.follow; save(); $('#follow').classList.toggle('on-ok',S.follow); };
  $('#bar').onclick=e=>{ if(!P.duration) return; const r=e.currentTarget.getBoundingClientRect(); P.currentTime=(e.clientX-r.left)/r.width*P.duration; };
  $('#speed').onclick=e=>{ const r=e.target.dataset.rate; if(!r) return; S.speed=+r; P.playbackRate=S.speed; save(); $('#speed').querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.rate==r)); };
  $('#mode').onclick=e=>{ const m=e.target.dataset.mode; if(!m) return; S.mode=m; save(); keepAudio(()=>renderDetail()); };
  $('#hl').onclick=()=>{ S.hl=!S.hl; save(); $('#en').classList.toggle('nohl',!S.hl); $('#hl').textContent=S.hl?'형광펜 켜짐':'형광펜 꺼짐'; };
  $('#fsm').onclick=()=>setFs(-1); $('#fsp').onclick=()=>setFs(1);
  $('#koT').onclick=()=>{ S.ko=!S.ko; save(); $('#koBox').style.display=S.ko?'':'none'; $('#koT').textContent=S.ko?'접기':'펼치기'; };
  $('#sayQ').onclick=()=>playQuestion(x,false);
  $('#qa').onclick=()=>playQuestion(x,true);
  $('#recBtn').onclick=toggleRec;
  $('#en').onclick=e=>{
    if(S.mode==='hide'){ const p=e.target.closest('p'); if(p) p.classList.toggle('rev'); return; }
    const s=e.target.closest('.s'); if(s && avail[x.id]!==false) seekSent(+s.dataset.i);
  };
}
function keepAudio(fn){
  const t=P.currentTime, playing=!P.paused, id=P.dataset.id, lock=cur.lock;
  fn();
  if(P.dataset.id===id){ P.addEventListener('loadedmetadata',()=>{ P.currentTime=t; if(lock>=0) setLock(lock); if(playing) P.play(); else tick(); },{once:true}); }
}
function setFs(d){ S.fs=Math.min(24,Math.max(14,S.fs+d)); save(); $('#en').querySelectorAll('p').forEach(p=>p.style.fontSize=S.fs+'px'); }
function toggleLoop(){ P.loop=!P.loop; const b=$('#loop'); if(b) b.classList.toggle('on-ok',P.loop); }
function toggleMem(id){ S.mem[id]=!S.mem[id]; if(!S.mem[id]) delete S.mem[id]; save(); refresh(false); }
function go(x){ if(!x) return; st.id=x.id; refresh(true); window.scrollTo({top:0,behavior:'smooth'}); }
function refresh(withDetail){
  renderStats(); renderTabs(); renderFilters(); renderList();
  if(withDetail) renderDetail();
  else { const x=byId[st.id]; const s=$('#star'), m=$('#mem');
    if(s){ s.className='btn '+(S.star[x.id]?'on-star':''); s.textContent=(S.star[x.id]?'★':'☆')+' 즐겨찾기'; }
    if(m){ m.className='btn '+(S.mem[x.id]?'on-ok':''); m.textContent=S.mem[x.id]?'✓ 외웠어요':'외웠어요'; } }
  measure();
}

$('#tabs').onclick=e=>{ const b=e.target.closest('[data-cat]'); if(!b) return; st.cat=b.dataset.cat; st.topic='all'; st.type='all'; st.id=null; refresh(true); };
$('#topics').onclick=e=>{ const b=e.target.closest('[data-topic]'); if(!b) return; st.topic=b.dataset.topic; st.id=null; refresh(true); };
$('#types').onclick=e=>{ const b=e.target.closest('[data-type]'); if(!b) return; st.type=b.dataset.type; st.id=null; refresh(true); };
$('#views').onclick=e=>{ const b=e.target.closest('[data-view]'); if(!b) return; st.view=b.dataset.view; st.id=null; refresh(true); };
$('#list').onclick=e=>{ const b=e.target.closest('[data-id]'); if(!b) return; st.id=b.dataset.id; refresh(true); };
$('#moreTopics').onclick=()=>{ const t=$('#topics'); t.classList.toggle('collapsed'); $('#moreTopics').textContent=t.classList.contains('collapsed')?'주제 모두 보기 ▾':'접기 ▴'; measure(); };
let sTimer; $('#search').oninput=e=>{ clearTimeout(sTimer); sTimer=setTimeout(()=>{ st.q=e.target.value; st.id=null; refresh(true); },200); };
$('#randomBtn').onclick=()=>{ const L=filtered(); if(!L.length) return; const x=L[Math.floor(Math.random()*L.length)]; S.mode='hide'; save(); go(x); };
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey) return;
  const L=filtered(), i=L.findIndex(y=>y.id===st.id);
  if(e.code==='Space'){ e.preventDefault(); togglePlay(); }
  else if(e.key==='ArrowRight'){ go(L[i+1]); }
  else if(e.key==='ArrowLeft'){ go(L[i-1]); }
  else if(e.key==='ArrowDown'){ e.preventDefault(); seekSent(Math.max(0,cur.idx)+1, !P.paused); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); seekSent(Math.max(0,cur.idx-1), !P.paused); }
  else if(e.key==='s'||e.key==='S'){ toggleLock(); }
  else if(e.key==='h'||e.key==='H'){ S.mode=S.mode==='hide'?'full':'hide'; save(); keepAudio(()=>renderDetail()); }
  else if(e.key==='r'||e.key==='R'){ toggleLoop(); }
  else if(e.key==='m'||e.key==='M'){ if(st.id) toggleMem(st.id); }
  else if(e.key==='q'||e.key==='Q'){ if(st.id) playQuestion(byId[st.id],false); }
});
function measure(){}

/* 시작 */
if(S.last && byId[S.last]){ st.cat=byId[S.last].cat; st.id=S.last; }
refresh(true); probeAll();
if('speechSynthesis' in window) speechSynthesis.getVoices();
})();
</script>
