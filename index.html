, ["I'm not exaggerating", "과장이 아니라"], ["sound like a dying cat", "소리가 엉망이다"], ["defeated", "좌절한"], ["end up as ~", "결국 ~이 되어 버리다"], ["looking back", "돌아보면"], ["ever since then", "그때 이후로 쭉"]], "audio": "audio/3_롤플레이/3-021 7. 여가(Free Time)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-021 7. 여가(Free Time)_과거 경험.mp3"}, {"id": "3-022", "cat": "roleplay", "catName": "롤플레이 질문", "num": 8, "topic": "헬스장", "topicEn": "Gym", "type": "정보 요청", "badge": "22 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are considering signing up at a gym. Call the gym, describe what you are looking for, and ask three or four questions about membership plans, facilities, or classes before deciding to join.", "enA": "Hi, is this the gym near the subway station? I'm calling to ask about joining. I jog outside most evenings, but it's getting too cold, so I need somewhere to train through the winter. Can I ask a few questions?\n\nFirst, what membership plans do you have? ... Three months, six, and a year? Is there a monthly option as well? ... There is? Good. I'd rather start short and see how it goes.\n\nSecond, what's in the facility? I mainly need treadmills and a shower room. ... Twenty treadmills and a sauna? Nice. And one last thing — do you run group classes in the evening? I want a schedule so I actually show up. ... Spinning at eight? That's perfect for me. Thanks for your help!", "koQ": "헬스장 등록을 고민 중입니다. 헬스장에 전화해 상황을 설명하고, 회원권·시설·수업에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 지하철역 근처 헬스장 맞나요? 등록 관련해서 여쭤보려고 전화드렸어요. 저녁마다 밖에서 조깅을 하는데, 날이 추워져서 겨울 동안 운동할 곳을 찾고 있거든요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 회원권은 어떤 종류가 있나요? ... 3개월, 6개월, 1년이요? 혹시 한 달짜리도 있나요? ... 있다고요? 다행이네요. 저는 짧게 시작해서 어떤지 보고 싶거든요.\n\n두 번째로, 시설은 어떻게 되나요? 러닝머신이랑 샤워실만 있으면 되거든요. ... 러닝머신 20대에 사우나까지요? 좋네요. 마지막으로 하나만, 저녁에 하는 그룹 수업도 있나요? 시간표가 있어야 제가 진짜로 나갈 것 같아서요. ... 8시에 스피닝이요? 저한테 딱이네요. 감사합니다!", "struct": [["1️⃣ 인사", "전화 목적 + 등록 고민 설명"], ["2️⃣ 질문", "① 회원권 → 한 달권 확인"], ["3️⃣ 질문", "② 시설 → 만족 리액션"], ["4️⃣ 질문", "③ 그룹 수업 → 시간 확인"], ["5️⃣ 마무리", "스피닝 확정 + 감사 인사"]], "expr": [["Is this ~?", "혹시 ~ 맞나요?"], ["I'm calling to ask about ~", "~관련해 전화했어요"], ["It's getting too cold", "날이 너무 추워져서"], ["membership plans", "회원권 종류"], ["a monthly option", "한 달 단위 옵션"], ["start short", "짧게 시작하다"], ["What's in the facility?", "시설은 어떤가요?"], ["treadmill", "러닝머신"], ["group classes", "그룹 수업"], ["so I actually show up", "진짜로 나가게"], ["That's perfect for me.", "저한테 딱이네요."]], "audio": "audio/3_롤플레이/3-022 8. 헬스장(Gym)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-022 8. 헬스장(Gym)_정보 요청.mp3"}, {"id": "3-023", "cat": "roleplay", "catName": "롤플레이 질문", "num": 8, "topic": "헬스장", "topicEn": "Gym", "type": "문제 해결", "badge": "23 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You joined a gym, but after your first visit, it fell short of what you expected. Call the gym, describe what you are unhappy about, and propose two or three ways to cancel your membership or get a refund.", "enA": "Hello, I signed up last Friday and went for the first time yesterday. To be honest, it wasn't what I expected. The treadmill area was so crowded that I waited twenty minutes, two machines had out-of-order signs, and the shower room only had cold water.\n\nI understand that things break, but that's not what I paid for. So here's what I'd like to ask. First, could I cancel my membership and get a refund for the unused months? I used it once, so it should be straightforward.\n\nIf a full refund isn't possible, could you put my membership on hold until the machines and hot water are fixed? Or, I'd accept a transfer to your branch near my office. Let me know what you can do this week.", "koQ": "등록한 헬스장이 첫 방문에서 기대와 달랐습니다. 전화해 불만을 설명하고, 취소나 환불을 위한 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 제가 지난 금요일에 등록했는데 어제 처음 가 봤거든요. 솔직히 말씀드리면 기대했던 것과 달랐어요. 러닝머신 쪽이 너무 붐벼서 20분을 기다렸고, 기구 두 대에는 고장 안내문이 붙어 있었어요. 그리고 샤워실에는 찬물만 나왔고요.\n\n기계는 고장 날 수 있다는 걸 이해해요. 하지만 제가 돈을 낸 건 이런 게 아니잖아요. 그래서 이렇게 여쭤보고 싶어요. 우선, 회원권을 취소하고 쓰지 않은 개월 수만큼 환불받을 수 있을까요? 한 번밖에 이용하지 않았으니 간단할 것 같은데요.\n\n전액 환불이 어렵다면, 기구랑 온수가 고쳐질 때까지 회원권을 일시 정지해 주실 수 있을까요? 아니면 회사 근처에 있는 다른 지점으로 옮기는 것도 괜찮습니다. 가능한 방법을 알려 주세요. 이번 주 안에 정리하고 싶어요.", "struct": [["1️⃣ 확인", "등록일 + 첫 방문 사실"], ["2️⃣ 불만", "대기 20분 · 고장 기구 · 찬물"], ["3️⃣ 요구", "① 취소 + 미사용분 환불"], ["4️⃣ 대안", "② 회원권 일시 정지"], ["5️⃣ 마무리", "③ 다른 지점 이전 + 기한"]], "expr": [["sign up", "(회원으로) 등록하다"], ["It wasn't what I expected", "기대와 달랐어요"], ["an out-of-order sign", "고장 안내문"], ["That's not what I paid for", "이러려고 낸 돈이 아님"], ["cancel my membership", "회원권을 취소하다"], ["a refund for ~", "~에 대한 환불"], ["unused months", "쓰지 않은 개월 수"], ["straightforward", "간단한"], ["put ~ on hold", "~을 일시 정지하다"], ["a transfer to ~", "~로의 이전"], ["Let me know what you can do", "가능한 방법 알려 주세요"]], "audio": "audio/3_롤플레이/3-023 8. 헬스장(Gym)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-023 8. 헬스장(Gym)_문제 해결.mp3"}, {"id": "3-024", "cat": "roleplay", "catName": "롤플레이 질문", "num": 8, "topic": "헬스장", "topicEn": "Gym", "type": "과거 경험", "badge": "24 과거 경험", "enQ": "That's the end of the situation. Have you ever run into problems after joining a gym? What issues came up, and how did you resolve them? Walk me through the entire experience from start to finish in detail.", "enA": "Oh, this reminds me of my very first gym membership, years ago. The staff talked me into a one-year plan because it was half the monthly price. I paid the whole year in installments. I felt so smart that day.\n\nFast forward two months — I showed up on a Monday evening and the door was locked, with a single printed notice taped to the glass. The gym had closed down overnight. No call, no email, nothing. I was furious, and honestly, a little embarrassed.\n\nSo the next morning I called my credit card company, explained everything, and they stopped the remaining installments. It took three weeks of phone calls, but I got most of my money back. Since then, I never sign up for anything longer than three months.", "koQ": "헬스장에 등록한 후 문제를 겪은 적이 있나요? 어떤 문제였고 어떻게 해결했는지 처음부터 끝까지 자세히 설명해 주세요.", "koA": "아, 제 첫 헬스장 회원권이 생각나네요. 몇 년 전인데, 직원분이 1년 회원권을 하라고 저를 설득했어요. 월 단위로 끊는 것의 절반 가격이라면서요. 그래서 1년 치를 카드 할부로 결제했죠. 그날은 제가 정말 똑똑하다고 느꼈어요.\n\n그런데 두 달 뒤, 어느 월요일 저녁에 갔더니 문이 잠겨 있고 유리문에 안내문 한 장이 붙어 있는 거예요. 헬스장이 하룻밤 사이에 문을 닫았더라고요. 전화도, 메일도, 아무 연락도 없었어요. 정말 화가 났고, 솔직히 좀 창피하기도 했어요.\n\n그래서 다음 날 아침에 카드사에 전화해서 상황을 다 설명했더니, 남은 할부금을 멈춰 줬어요. 전화를 3주 정도 붙잡고 있어야 했지만 결국 돈은 대부분 돌려받았어요. 그 후로는 3개월보다 긴 회원권은 절대 끊지 않아요.", "struct": [["1️⃣ 도입", "첫 헬스장 · 1년 회원권 결제"], ["2️⃣ 복선", "반값이라는 말에 할부 결제"], ["3️⃣ 사건", "두 달 뒤 하룻밤 사이 폐업"], ["4️⃣ 해결", "카드사 연락 → 할부 정지"], ["5️⃣ 마무리", "3개월 초과 회원권 금지 규칙"]], "expr": [["talk me into ~", "~하도록 설득하다"], ["a one-year plan", "1년 회원권"], ["half the monthly price", "월 단위의 절반 가격"], ["in installments", "할부로"], ["Fast forward two months", "두 달 뒤로 감으면"], ["a single printed notice", "안내문 한 장"], ["close down overnight", "하룻밤 새 폐업하다"], ["I was furious", "정말 화가 났어요"], ["stop the installments", "할부를 중단하다"], ["get my money back", "돈을 돌려받다"], ["never longer than ~", "절대 ~보다 길게는"]], "audio": "audio/3_롤플레이/3-024 8. 헬스장(Gym)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-024 8. 헬스장(Gym)_과거 경험.mp3"}, {"id": "3-025", "cat": "roleplay", "catName": "롤플레이 질문", "num": 9, "topic": "공연", "topicEn": "Performance", "type": "정보 요청", "badge": "25 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your friend would like to watch a performance with you. Call your friend and ask three or four questions about the show and your friend's plan.", "enA": "Hey, it's me! I got your text about seeing a show together — count me in. You know I'm always up for anything in the theater district. But before we lock in the date, can I ask you a few things?\n\nFirst things first, what exactly are we seeing — a play or a musical? ... Oh, that one? I've heard about it. Is it at that small theater in Daehakro? ... Good, I love the intimate vibe there. And when is it, a weekend matinee or an evening show?\n\nSecond, have you booked the tickets already, or should I? Those shows sell out fast. ... You did? You're the best. Just send me your account number. One last thing — are we grabbing a quick bite before, or eating after? ... After works for me. See you Saturday!", "koQ": "친구가 당신과 공연을 보러 가고 싶어 합니다. 친구에게 전화해 공연과 친구의 계획에 대해 3~4가지 질문을 해보세요.", "koA": "안녕, 나야! 같이 공연 보자는 문자 봤어. 나도 갈게. 나 대학로 쪽은 뭐든 좋아하는 거 알잖아. 근데 날짜 정하기 전에 몇 가지만 물어봐도 돼?\n\n우선 제일 중요한 것부터. 정확히 뭘 보는 거야, 연극이야 뮤지컬이야? ... 아, 그거? 나도 들어 봤어. 대학로에 있는 그 작은 극장에서 하는 거 맞지? ... 좋다, 나 거기 아늑한 분위기 진짜 좋아해. 그리고 언제야? 주말 낮 공연이야, 저녁 공연이야?\n\n두 번째로, 표는 벌써 예매한 거야, 아니면 내가 할까? 그런 공연은 금방 매진되잖아. ... 이미 했다고? 너 최고다. 계좌번호만 보내 줘. 마지막으로 하나만, 보기 전에 간단히 뭐 좀 먹을까 아니면 끝나고 먹을까? ... 끝나고가 나도 좋아. 토요일에 보자!", "struct": [["1️⃣ 인사", "초대 수락 + 질문 예고"], ["2️⃣ 질문", "① 어떤 공연인지 → 극장 확인"], ["3️⃣ 질문", "② 날짜와 시간대 확인"], ["4️⃣ 질문", "③ 예매 여부 → 정산 방법"], ["5️⃣ 마무리", "④ 식사 계획 + 약속 확정"]], "expr": [["Count me in!", "나도 갈게!"], ["the theater district", "공연 거리, 극장가"], ["Can I ask you a few things?", "몇 가지 물어봐도 돼?"], ["first things first", "우선 중요한 것부터"], ["Oh, that one?", "아, 그거?"], ["intimate vibe", "아늑하고 친밀한 분위기"], ["a weekend matinee", "주말 낮 공연"], ["book the tickets", "표를 예매하다"], ["sell out fast", "금방 매진되다"], ["One last thing", "마지막으로 하나만"], ["grab a quick bite", "간단히 요기하다"]], "audio": "audio/3_롤플레이/3-025 9. 공연(Performance)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-025 9. 공연(Performance)_정보 요청.mp3"}, {"id": "3-026", "cat": "roleplay", "catName": "롤플레이 질문", "num": 9, "topic": "공연", "topicEn": "Performance", "type": "문제 해결", "badge": "26 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You planned to see the performance with your friend today, but you are so sick that you cannot even get out of bed. Call your friend, describe your condition, and offer two or three ideas to handle the situation.", "enA": "Hey, it's me. I hate to do this to you, but I've got bad news about tonight. I came down with something yesterday, and this morning I couldn't even get out of bed. My head is pounding, and the fever hasn't broken. I'm so sorry — I know you've been looking forward to this.\n\nHere's what I'm thinking. First, please go anyway. My brother lives ten minutes from the theater, so you could take him — I'll transfer the ticket to your phone right now.\n\nIf you'd rather not, could you call the box office and ask to exchange them for next weekend? Small theaters are usually flexible. And either way, the tickets are on me this time, and dinner too, once I can stand up. Just let me know which one works.", "koQ": "오늘 친구와 공연을 보기로 했는데 침대에서 일어나지 못할 만큼 아픕니다. 친구에게 전화해 상태를 설명하고, 2~3가지 대안을 제시해 보세요.", "koA": "안녕, 나야. 이런 말 하기 정말 미안한데, 오늘 저녁 일로 안 좋은 소식이 있어. 어제부터 몸살이 나더니 오늘 아침엔 침대에서 일어나지도 못하겠더라고. 머리는 지끈거리고 열도 안 떨어졌어. 정말 미안해. 네가 이거 얼마나 기다렸는지 아는데.\n\n내 생각은 이래. 우선, 너는 그냥 가. 우리 동생이 극장에서 10분 거리에 살거든. 걔를 데려가면 되잖아. 내 표는 지금 바로 네 폰으로 넘겨 줄게.\n\n그게 별로면, 매표소에 전화해서 다음 주말 회차로 바꿔 달라고 해 볼래? 소극장은 보통 유연하게 해 주더라고. 그리고 어느 쪽이든 이번 표값은 내가 낼게. 내가 일어날 수 있게 되면 저녁도 내가 살고. 어느 쪽이 좋은지 알려만 줘.", "struct": [["1️⃣ 사과", "취소 통보 + 미안한 마음"], ["2️⃣ 상태", "몸살 · 두통 · 못 일어남"], ["3️⃣ 대안", "① 동생과 대신 관람"], ["4️⃣ 대안", "② 다음 주말로 날짜 변경"], ["5️⃣ 마무리", "③ 표값 부담 + 선택권 넘기기"]], "expr": [["I hate to do this to you", "이런 말 하기 정말 미안해"], ["come down with something", "몸살이 나다"], ["can't get out of bed", "침대에서 못 일어나다"], ["pounding (head)", "지끈거리는"], ["look forward to ~", "~을 기대하다"], ["Here's what I'm thinking", "내 생각은 이래"], ["transfer the ticket", "티켓을 양도하다"], ["exchange them for ~", "~로 교환하다"], ["either way", "어느 쪽이든"], ["It's on me", "내가 낼게"], ["Just let me know", "알려만 줘"]], "audio": "audio/3_롤플레이/3-026 9. 공연(Performance)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-026 9. 공연(Performance)_문제 해결.mp3"}, {"id": "3-027", "cat": "roleplay", "catName": "롤플레이 질문", "num": 9, "topic": "공연", "topicEn": "Performance", "type": "과거 경험", "badge": "27 과거 경험", "enQ": "That's the end of the situation. Have you ever had to call off a plan or break a promise because you were sick or something urgent came up? When did it happen, and what did you do to sort out the problem?", "enA": "Oh, this reminds me of a night I still feel bad about. I had booked two tickets for a musical in Daehakro a month in advance, and my best friend and I had been counting down to it all month.\n\nThat evening I got home to change, and guess what — water was dripping from my ceiling. The washing machine upstairs had flooded, and half my living room floor was already soaked. Out of nowhere, I was standing there holding towels instead of a ticket.\n\nSo I called her from the middle of the mess, apologized, and sent her my ticket so she could take her sister. Then I called the building office, and a plumber was there within an hour. In the end it worked out fine — the theater let me swap my seat for the next weekend. Since then, I only buy tickets that can be transferred.", "koQ": "아프거나 급한 일이 생겨서 약속을 취소해야 했던 경험이 있나요? 언제 있었던 일이고, 문제를 해결하기 위해 무엇을 했는지 말해주세요.", "koA": "아, 지금도 미안한 마음이 남아 있는 저녁이 하나 생각나네요. 대학로 뮤지컬 표를 한 달 전에 두 장 예매해 뒀고, 절친이랑 저는 그날만 손꼽아 기다리고 있었어요.\n\n그날 저녁, 옷 갈아입으려고 집에 들어갔는데, 글쎄 천장에서 물이 뚝뚝 떨어지고 있는 거예요. 윗집 세탁기가 넘쳐서 거실 바닥 절반이 이미 흠뻑 젖어 있었고요. 난데없이 저는 티켓 대신 수건을 들고 서 있게 됐죠.\n\n그래서 그 난리통 속에서 친구에게 전화해 사과하고, 제 표를 보내 줘서 걔 동생이랑 가라고 했어요. 그다음 관리사무소에 전화했더니 한 시간 안에 설비 기사님이 오셨고요. 결국엔 잘 풀렸어요. 극장에서 다음 주말 회차로 자리를 바꿔 줬거든요. 그 후로 저는 양도가 되는 표만 예매해요.", "struct": [["1️⃣ 도입", "한 달 전 예매 · 손꼽아 기다림"], ["2️⃣ 사건", "귀가 직후 천장 누수 발견"], ["3️⃣ 절정", "거실 물바다 · 티켓 대신 수건"], ["4️⃣ 해결", "표 양도 + 관리사무소 연락"], ["5️⃣ 마무리", "양도 가능한 표만 예매하는 규칙"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["a month in advance", "한 달 전에 미리"], ["count down to ~", "~을 손꼽아 기다리다"], ["guess what", "그런데 있잖아요"], ["drip from the ceiling", "천장에서 물이 새다"], ["flood", "물이 넘치다"], ["soaked", "흠뻑 젖은"], ["out of nowhere", "난데없이"], ["within an hour", "한 시간 안에"], ["it worked out fine", "잘 풀렸어요"], ["can be transferred", "양도가 되는"]], "audio": "audio/3_롤플레이/3-027 9. 공연(Performance)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-027 9. 공연(Performance)_과거 경험.mp3"}, {"id": "3-028", "cat": "roleplay", "catName": "롤플레이 질문", "num": 10, "topic": "콘서트", "topicEn": "Concert", "type": "정보 요청", "badge": "28 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to purchase two concert tickets. Call the venue and ask three or four questions about how to buy the tickets.", "enA": "Hi, is this the box office at the dome in Olympic Park? I'm calling about the concert next month. I'd like to get two tickets, but I've never bought them through this venue before. Can I ask a few questions?\n\nFirst, how does it work? Online only, or can I buy them at the counter too? ... Online first, and whatever is left at the door? Good to know. And when do they go on sale? ... Eight p.m. sharp on Friday? I'll set an alarm.\n\nSecond, what are the seating options and the price range? ... Floor, first tier, and second tier? And is there a limit per person? ... Four? Then two is no problem. One last thing — do I get a mobile ticket, or do I pick them up at the venue? ... Mobile? That's perfect for me. Thanks for your help!", "koQ": "콘서트 티켓 2장을 사고 싶습니다. 공연장에 전화해 티켓 구매 방법에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 올림픽공원 돔 매표소 맞나요? 다음 달 콘서트 때문에 전화드렸어요. 티켓을 두 장 사고 싶은데, 이 공연장에서 예매해 본 적이 없어서요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 어떻게 진행되나요? 온라인으로만 파나요, 아니면 창구에서도 살 수 있나요? ... 온라인 먼저 열고, 남는 표를 현장에서 판다고요? 알아 둘게요. 그리고 판매는 언제 시작하나요? ... 금요일 저녁 8시 정각이요? 알람을 맞춰 놔야겠네요.\n\n두 번째로, 좌석 종류랑 가격대는 어떻게 되나요? ... 플로어석, 1층, 2층이요? 그리고 1인당 구매 한도가 있나요? ... 네 장이요? 그럼 두 장은 문제없겠네요. 마지막으로 하나만, 모바일 티켓으로 받나요, 아니면 공연장에서 수령하나요? ... 모바일이요? 저한테 딱이네요. 감사합니다!", "struct": [["1️⃣ 인사", "공연장 확인 + 두 장 구매 의사"], ["2️⃣ 질문", "① 구매 방법(온라인 · 현장)"], ["3️⃣ 질문", "② 판매 시작 시각 확인"], ["4️⃣ 질문", "③ 좌석·가격 → 1인 한도"], ["5️⃣ 마무리", "④ 수령 방법 + 감사 인사"]], "expr": [["Is this ~?", "혹시 ~ 맞나요?"], ["the box office", "매표소"], ["venue", "공연장"], ["Can I ask a few questions?", "몇 가지 여쭤봐도 될까요?"], ["go on sale", "판매가 시작되다"], ["eight p.m. sharp", "저녁 8시 정각에"], ["set an alarm", "알람을 맞추다"], ["seating options", "좌석 종류"], ["the price range", "가격대"], ["a limit per person", "1인 구매 한도"], ["a mobile ticket", "모바일 티켓"]], "audio": "audio/3_롤플레이/3-028 10. 콘서트(Concert)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-028 10. 콘서트(Concert)_정보 요청.mp3"}, {"id": "3-029", "cat": "roleplay", "catName": "롤플레이 질문", "num": 10, "topic": "콘서트", "topicEn": "Concert", "type": "문제 해결", "badge": "29 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You bought concert tickets and planned to attend with your friend, but right before the show, you became very sick. Call your friend, describe the situation, and offer two or three alternatives.", "enA": "Hey, it's me. Please don't hate me — I'm in bad shape. I've had chills and a fever since this afternoon, and the show starts in three hours. There's no way I can stand in a crowd tonight. And I'm the one holding both tickets, so let me sort this out.\n\nHere's what I can do. First, I'll send both tickets to your phone right now, and you take someone else — my brother would go in a heartbeat. You shouldn't lose the night because of me.\n\nIf you'd rather skip it, I'll call the venue and ask whether they take returns before six. Either way, grab a light stick or some merch for me, and we'll watch the fan clips together this weekend. Whichever works for you — just tell me before six.", "koQ": "콘서트 티켓을 사서 친구와 가기로 했는데, 공연 직전에 몸이 많이 아픕니다. 친구에게 전화해 상황을 설명하고 2~3가지 대안을 제시해 보세요.", "koA": "안녕, 나야. 나 미워하지 말아 줘. 상태가 말이 아니야. 오늘 오후부터 오한이 들고 열이 나는데, 공연은 세 시간 뒤 시작이잖아. 오늘 사람들 틈에 서 있는 건 도저히 못 하겠어. 게다가 티켓 두 장을 내가 다 갖고 있으니까, 이건 내가 정리할게.\n\n내가 할 수 있는 건 이래. 우선, 지금 바로 티켓 두 장을 네 폰으로 보낼게. 다른 사람이랑 가. 우리 동생은 두말없이 갈걸. 나 때문에 너까지 오늘 밤을 날릴 수는 없잖아.\n\n그냥 안 가는 게 낫다면, 내가 공연장에 전화해서 6시 전까지 취소를 받아 주는지 물어볼게. 어느 쪽이든 나 대신 응원봉이나 굿즈 하나만 사다 줘. 그리고 이번 주말에 팬들이 올린 영상 같이 보자. 편한 쪽으로 해. 6시 전에만 알려 줘.", "struct": [["1️⃣ 사과", "미안함 + 상태 예고"], ["2️⃣ 상태", "오한 · 열 + 공연 세 시간 전"], ["3️⃣ 대안", "① 티켓 두 장 전송 → 대체 동행"], ["4️⃣ 대안", "② 공연장에 취소 가능 여부 확인"], ["5️⃣ 마무리", "③ 굿즈 부탁 + 시간 못 박기"]], "expr": [["Please don't hate me", "미워하지 말아 줘"], ["in bad shape", "상태가 말이 아닌"], ["chills and a fever", "오한과 열"], ["There's no way ~", "도저히 ~할 수 없다"], ["Here's what I can do", "내가 할 수 있는 건"], ["send ~ to your phone", "~을 네 폰으로 보내다"], ["in a heartbeat", "두말없이 바로"], ["take returns", "취소를 받아 주다"], ["a light stick / merch", "응원봉 / 굿즈"], ["either way", "어느 쪽이든"], ["Whichever works for you", "편한 쪽으로"]], "audio": "audio/3_롤플레이/3-029 10. 콘서트(Concert)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-029 10. 콘서트(Concert)_문제 해결.mp3"}, {"id": "3-030", "cat": "roleplay", "catName": "롤플레이 질문", "num": 10, "topic": "콘서트", "topicEn": "Concert", "type": "과거 경험", "badge": "30 과거 경험", "enQ": "That's the end of the situation. Have you ever bought tickets or made plans and then had to call them off at the last moment because something came up? What was the problem, and how did you sort it out? Tell me the story in detail.", "enA": "Oh, this reminds me of the concert I never got to see. I had finally won a fierce ticketing war — two floor seats for the show I'd waited a whole year for. I was on cloud nine for about two weeks.\n\nThen, ten days before, my company announced a two-day workshop — same weekend, out of town, and no way out of it. I just sat there staring at the tickets. Honestly, I almost cried.\n\nSo I posted them in a fan group at face value, no markup, and guess who messaged me first — my best friend. She went with her sister, sent me thirty videos from the floor, and screamed into the phone during the encore. In the end, I caught the next tour's opening show. Since then, I check my work calendar before the ticket opens, not after.", "koQ": "티켓을 사거나 약속을 잡았다가 무슨 일이 생겨 막판에 취소해야 했던 경험이 있나요? 문제가 무엇이었고 어떻게 해결했는지 자세히 말해주세요.", "koA": "아, 끝내 못 본 콘서트가 하나 생각나네요. 치열한 티켓팅 전쟁에서 드디어 이겨서, 일 년을 기다린 공연의 플로어석을 두 장이나 잡았거든요. 한 2주 동안은 하늘을 나는 기분이었어요.\n\n그런데 공연 열흘 전에 회사에서 1박 2일 워크숍을 공지했어요. 하필 같은 주말에, 지방에서, 빠질 방법도 없이요. 저는 그냥 앉아서 티켓만 들여다봤어요. 솔직히 울 뻔했어요.\n\n그래서 팬 커뮤니티에 정가로, 웃돈 하나 없이 양도 글을 올렸는데, 제일 먼저 연락한 사람이 누구였는지 아세요? 제 절친이었어요. 걔는 자기 동생이랑 가서 플로어에서 찍은 영상을 서른 개나 보내 줬고, 앙코르 때는 전화에 대고 소리를 질렀죠. 결국 저는 다음 투어 첫 공연을 잡았어요. 그 후로는 티켓 오픈 전에 회사 일정부터 확인해요. 끝난 뒤가 아니라요.", "struct": [["1️⃣ 도입", "티켓팅 전쟁 승리 · 플로어석"], ["2️⃣ 사건", "열흘 전 회사 워크숍 공지"], ["3️⃣ 감정", "빠질 수 없음 · 울 뻔함"], ["4️⃣ 해결", "정가 양도 → 절친이 구매"], ["5️⃣ 마무리", "다음 투어 + 일정 확인 규칙"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["win the ticketing war", "티켓팅 전쟁에서 이기다"], ["on cloud nine", "하늘을 나는 기분인"], ["no way out of it", "도저히 빠질 수 없는"], ["I almost cried", "울 뻔했어요"], ["at face value", "정가에"], ["guess who", "누구였는지 아세요?"], ["scream into the phone", "전화에 대고 소리 지르다"], ["the next tour's opening show", "다음 투어 첫 공연"], ["In the end", "결국에는"], ["before, not after", "나중이 아니라 먼저"]], "audio": "audio/3_롤플레이/3-030 10. 콘서트(Concert)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-030 10. 콘서트(Concert)_과거 경험.mp3"}, {"id": "3-031", "cat": "roleplay", "catName": "롤플레이 질문", "num": 11, "topic": "영화", "topicEn": "Movies", "type": "정보 요청", "badge": "31 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to see a movie with your friend. Call the theater and ask three or four questions to get the information you need before buying tickets.", "enA": "Hi, is this the cinema next to the station? I'd like to catch a movie with a friend tonight, but I'd rather check a few things before I book. Do you have a minute?\n\nFirst, what's showing this evening after seven? ... The new mystery one? That's exactly what we wanted. And is it the subtitled version or dubbed? ... Subtitled? That works for us.\n\nSecond, are there two seats together left, ideally in the middle row? ... Only the front left? Then what about the nine o'clock show? ... Much better. And how much is a ticket on a weekday? ... Fourteen thousand each? Cheaper than I thought. One last thing — if we're running late, can we still get in after it starts? ... Ten minutes? Good to know. Thanks!", "koQ": "친구와 영화를 보고 싶습니다. 영화관에 전화해 티켓을 사기 전에 필요한 정보를 얻기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 옆에 있는 영화관 맞나요? 오늘 저녁에 친구랑 영화를 보려고 하는데, 예매하기 전에 몇 가지만 확인하고 싶어서요. 잠깐 시간 괜찮으세요?\n\n우선, 오늘 저녁 7시 이후에는 어떤 영화가 상영되나요? ... 새로 나온 미스터리 영화요? 저희가 보고 싶던 게 딱 그거예요. 그리고 그건 자막판인가요, 더빙판인가요? ... 자막이요? 저희한테 딱 좋네요.\n\n두 번째로, 붙어 있는 두 자리가 남아 있나요? 가운데 열이면 더 좋고요. ... 앞쪽 왼편만 남았다고요? 그러면 9시 회차는 어떤가요? ... 훨씬 낫네요. 그리고 평일에는 티켓이 얼마인가요? ... 한 장에 만 사천 원이요? 생각보다 저렴하네요. 마지막으로 하나만, 늦으면 시작한 뒤에도 입장할 수 있나요? ... 10분까지요? 알아 둘게요. 감사합니다!", "struct": [["1️⃣ 인사", "극장 확인 + 오늘 밤 관람 의사"], ["2️⃣ 질문", "① 상영작 → 자막 여부 확인"], ["3️⃣ 질문", "② 붙은 두 자리 → 회차 변경"], ["4️⃣ 질문", "③ 평일 저녁 티켓 가격"], ["5️⃣ 마무리", "④ 지각 시 입장 가능 여부 + 감사"]], "expr": [["catch a movie", "영화를 보다"], ["Do you have a minute?", "잠깐 시간 괜찮으세요?"], ["What's showing this evening?", "오늘 저녁엔 뭘 상영하나요?"], ["the subtitled version", "자막판"], ["That works for us.", "저희한테 딱 좋네요."], ["two seats together", "붙어 있는 두 자리"], ["in the middle row", "가운데 열에"], ["the nine o'clock show", "9시 회차"], ["How much is a ticket?", "티켓은 얼마인가요?"], ["Cheaper than I thought.", "생각보다 저렴하네요."], ["Can we still get in?", "그래도 입장 되나요?"]], "audio": "audio/3_롤플레이/3-031 11. 영화(Movies)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-031 11. 영화(Movies)_정보 요청.mp3"}, {"id": "3-032", "cat": "roleplay", "catName": "롤플레이 질문", "num": 11, "topic": "영화", "topicEn": "Movies", "type": "문제 해결", "badge": "32 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You have just gotten to the theater and discovered that the tickets they sold you are the wrong ones. Go to the ticket booth, describe the situation, and offer two or three ways to fix the problem.", "enA": "Excuse me, I'm sorry to bother you, but there's a problem with our tickets. I bought two here about twenty minutes ago for the eight o'clock mystery film, but the ones you printed are for the animation in theater four. You can see it right here on the receipt.\n\nI don't want to argue about it — I just want to see the movie we paid for. Here's what I'd suggest. First, could you simply swap them for the right screening? It starts in fifteen minutes, so there should still be time.\n\nIf that one is sold out, could you move us to the ten o'clock show instead? We'd be fine with that. And if neither works, we'd like a full refund, plus a voucher for another day. Whichever you can do fastest — the lights are about to go down.", "koQ": "영화관에 도착했는데 잘못된 티켓을 판매했다는 것을 알았습니다. 매표소에 가서 상황을 설명하고, 문제를 해결할 2~3가지 방법을 제안해 보세요.", "koA": "실례합니다, 번거롭게 해서 죄송한데 저희 티켓에 문제가 있어요. 20분쯤 전에 여기서 8시 미스터리 영화로 두 장을 샀는데, 발권해 주신 건 4관 애니메이션 표예요. 여기 영수증에 그대로 나와 있고요.\n\n따지려는 게 아니에요. 저희가 돈을 낸 영화를 보고 싶을 뿐이에요. 이렇게 하면 어떨까요. 우선, 제대로 된 회차로 그냥 바꿔 주실 수 있을까요? 15분 뒤 시작이니까 아직 시간이 있을 것 같은데요.\n\n그 회차가 매진이라면, 10시 회차로 옮겨 주실 수 있나요? 저희는 그것도 괜찮아요. 둘 다 안 된다면 전액 환불을 받고, 가능하면 다른 날 쓸 수 있는 교환권도 하나 받고 싶어요. 가장 빠르게 되는 방법으로 해 주세요. 곧 불이 꺼질 것 같아서요.", "struct": [["1️⃣ 접근", "정중한 오프닝 + 문제 선언"], ["2️⃣ 사실", "구매 시각 · 영화 · 영수증"], ["3️⃣ 요구", "① 제 회차로 교환"], ["4️⃣ 대안", "② 10시 회차 ③ 환불 + 교환권"], ["5️⃣ 마무리", "가장 빠른 방법 + 시간 압박"]], "expr": [["I'm sorry to bother you", "번거롭게 해 죄송해요"], ["There's a problem with ~", "~에 문제가 있어요"], ["the ones you printed", "발권해 주신 것"], ["on the receipt", "영수증에"], ["I don't want to argue", "따지려는 게 아니에요"], ["Here's what I'd suggest", "이렇게 하면 어떨까요"], ["swap A for B", "A를 B로 바꾸다"], ["the right screening", "제대로 된 회차"], ["sold out", "매진된"], ["a voucher", "교환권, 쿠폰"], ["Whichever you can do fastest", "가장 빠르게 되는 방법으로"]], "audio": "audio/3_롤플레이/3-032 11. 영화(Movies)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-032 11. 영화(Movies)_문제 해결.mp3"}, {"id": "3-033", "cat": "roleplay", "catName": "롤플레이 질문", "num": 11, "topic": "영화", "topicEn": "Movies", "type": "과거 경험", "badge": "33 과거 경험", "enQ": "That's the end of the situation. Have you ever made a reservation or bought tickets, only to have something go wrong? What was the issue, when did it happen, and how did you resolve it?", "enA": "Oh, this reminds me of a movie night last winter. I had booked two tickets on the theater's app a week earlier, for a film my best friend had been dying to see.\n\nWe met at the Hongdae branch, bought popcorn, and walked up to the gate — and the staff member told us our tickets were for the Gangnam branch. I had tapped the wrong location in the app without noticing. My heart dropped. Gangnam was forty minutes away.\n\nBut she was great about it. She told me the app allows cancellation up to thirty minutes before the show, and we had four minutes left. I cancelled right there, and we bought two seats for the next screening at the counter. We missed the trailers, but we saw the film. Since then, I always screenshot the branch name after I book.", "koQ": "예약을 하거나 티켓을 샀는데 무언가 잘못된 적이 있나요? 문제가 무엇이었고, 언제 일어난 일이며, 어떻게 해결했는지 말해주세요.", "koA": "아, 지난겨울 영화 보러 갔던 날이 생각나네요. 일주일 전에 영화관 앱으로 표를 두 장 예매해 뒀었어요. 절친이 정말 보고 싶어 하던 영화였거든요.\n\n홍대점에서 만나서 팝콘을 사고 입구까지 걸어갔는데, 직원분이 저희 표는 강남점 거라고 하시는 거예요. 제가 앱에서 지점을 잘못 누른 걸 모르고 있었던 거죠. 심장이 철렁했어요. 강남은 40분 거리였거든요.\n\n그런데 그 직원분이 정말 친절하셨어요. 앱에서 상영 30분 전까지는 취소가 된다고 알려 주셨는데, 마침 4분이 남아 있었어요. 바로 그 자리에서 취소하고, 카운터에서 다음 회차 두 자리를 샀죠. 예고편은 놓쳤지만 영화는 봤어요. 그 후로는 예매하면 꼭 지점 이름을 캡처해 둬요.", "struct": [["1️⃣ 도입", "일주일 전 앱으로 예매"], ["2️⃣ 사건", "입구에서 지점이 다름을 확인"], ["3️⃣ 감정", "심장 철렁 · 40분 거리"], ["4️⃣ 해결", "30분 규정 → 4분 남기고 취소"], ["5️⃣ 마무리", "다음 회차 관람 + 캡처 습관"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["be dying to see ~", "~을 몹시 보고 싶어 하다"], ["walk up to the gate", "입구까지 걸어가다"], ["tap the wrong location", "지점을 잘못 누르다"], ["without noticing", "모르는 사이에"], ["My heart dropped.", "심장이 철렁했어요."], ["allow cancellation up to ~", "~까지 취소가 되다"], ["with four minutes left", "4분 남기고"], ["the next screening", "다음 회차"], ["miss the trailers", "예고편을 놓치다"], ["screenshot ~", "~을 캡처해 두다"]], "audio": "audio/3_롤플레이/3-033 11. 영화(Movies)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-033 11. 영화(Movies)_과거 경험.mp3"}, {"id": "3-034", "cat": "roleplay", "catName": "롤플레이 질문", "num": 12, "topic": "음악", "topicEn": "Music", "type": "정보 요청", "badge": "34 정보 요청", "enQ": "I'd like to give you a situation to act it out. You would like to get new headphones for listening to music, but you cannot decide which type to buy. Call an electronics store and ask three or four questions about the different headphones they carry.", "enA": "Hi, is this the electronics store in the mall by the station? I'm calling to ask about headphones. I listen to music during my commute and while I work, but I honestly can't decide which type to go for.\n\nFirst, what do you carry — over-ear or in-ear? ... Both? Then which one do people usually pick for a crowded subway? ... Over-ear with noise cancelling? That makes sense.\n\nSecond, how long does the battery last on those? ... Thirty hours? That's more than enough for me. And what's the price range? ... Under two hundred thousand won for the basic model? That's not bad at all. One last thing — can I try them on in the store first? ... I can? Great, I'll stop by this weekend. Thank you!", "koQ": "음악 감상용 새 헤드폰을 사고 싶은데 어떤 종류를 골라야 할지 모르겠습니다. 전자제품 매장에 전화해 여러 헤드폰에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 옆 쇼핑몰에 있는 전자제품 매장 맞나요? 헤드폰 관련해서 전화드렸어요. 출퇴근길이랑 일할 때 음악을 듣는데, 솔직히 어떤 종류를 골라야 할지 모르겠더라고요.\n\n우선, 어떤 걸 취급하시나요? 오버이어인가요, 인이어인가요? ... 둘 다요? 그럼 사람 많은 지하철에서는 보통 어떤 걸 많이 고르나요? ... 노이즈 캔슬링 되는 오버이어요? 그럴 만하네요.\n\n두 번째로, 그건 배터리가 얼마나 가나요? ... 30시간이요? 저한테는 차고 넘치네요. 그리고 가격대는 어떻게 되나요? ... 기본형이 20만 원 아래요? 그 정도면 괜찮네요. 마지막으로 하나만, 매장에서 먼저 써 볼 수 있나요? ... 된다고요? 좋아요, 이번 주말에 들를게요. 감사합니다!", "struct": [["1️⃣ 인사", "매장 확인 + 사용 상황 설명"], ["2️⃣ 질문", "① 종류 → 지하철용 추천"], ["3️⃣ 질문", "② 배터리 지속 시간"], ["4️⃣ 질문", "③ 가격대 확인"], ["5️⃣ 마무리", "④ 매장 청음 가능 여부 + 방문 예고"]], "expr": [["I'm calling to ask about ~", "~관련해 전화했어요"], ["during my commute", "출퇴근길에"], ["which type to go for", "어떤 종류를 고를지"], ["over-ear / in-ear", "오버이어 / 인이어"], ["noise cancelling", "노이즈 캔슬링"], ["That makes sense.", "그럴 만하네요."], ["How long does it last?", "얼마나 가나요?"], ["more than enough", "차고 넘치는"], ["What's the price range?", "가격대가 어떻게 되나요?"], ["That's not bad at all.", "그 정도면 괜찮네요."], ["try them on in the store", "매장에서 착용해 보다"]], "audio": "audio/3_롤플레이/3-034 12. 음악(Music)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-034 12. 음악(Music)_정보 요청.mp3"}, {"id": "3-035", "cat": "roleplay", "catName": "롤플레이 질문", "num": 12, "topic": "음악", "topicEn": "Music", "type": "문제 해결", "badge": "35 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. While you are listening to music at home, your speakers suddenly go dead, and friends are coming over shortly to enjoy music with you. Call an electronics store, describe the situation, and ask about two or three possible fixes.", "enA": "Hello, I bought a Bluetooth speaker from your store last year, and it just went dead while I was playing music. No light, no sound, nothing. And here's the tricky part — friends are coming over in two hours to listen to music together.\n\nI've already tried the obvious things. I swapped the cable, plugged it into another outlet, and held the power button for ten seconds. Nothing worked.\n\nSo could you tell me what else I can try over the phone? And if it's really broken, do you have the same model in stock today? I could pick it up on my way home. Or if that's a hassle, could I rent something small just for tonight? Any of those would save me.", "koQ": "집에서 음악을 듣고 있는데 스피커가 갑자기 작동하지 않습니다. 곧 친구들이 음악을 들으러 옵니다. 전자제품 매장에 전화해 상황을 설명하고 2~3가지 해결 방법을 물어보세요.", "koA": "안녕하세요, 작년에 그 매장에서 블루투스 스피커를 샀는데요. 음악을 틀어 놓고 있는데 갑자기 먹통이 됐어요. 불도 안 들어오고, 소리도 없고, 아무 반응이 없어요. 그리고 곤란한 건 이거예요. 두 시간 뒤에 친구들이 음악 들으러 오기로 했거든요.\n\n기본적인 건 이미 다 해 봤어요. 케이블도 바꿔 보고, 다른 콘센트에도 꽂아 보고, 전원 버튼도 10초 동안 눌러 봤어요. 아무것도 안 되더라고요.\n\n그래서 전화로 또 뭘 해 볼 수 있는지 알려 주실 수 있을까요? 그리고 정말 고장이라면, 오늘 같은 모델 재고가 있나요? 퇴근길에 제가 찾아갈 수 있거든요. 아니면 그게 번거로우면, 오늘 하룻밤만 작은 걸 대여할 수는 없을까요? 어느 쪽이든 저한테는 큰 도움이 될 것 같아요.", "struct": [["1️⃣ 상황", "구매처 + 갑작스러운 고장"], ["2️⃣ 압박", "두 시간 뒤 친구들 방문"], ["3️⃣ 시도", "케이블 · 콘센트 · 전원 버튼"], ["4️⃣ 질문", "① 추가 점검 ② 당일 재고"], ["5️⃣ 마무리", "③ 하룻밤 대여 + 도움 요청"]], "expr": [["go dead", "먹통이 되다"], ["Here's the tricky part", "곤란한 건 이거예요"], ["come over", "(집에) 놀러 오다"], ["the obvious things", "기본적인 것들"], ["swap the cable", "케이블을 바꿔 보다"], ["hold the power button", "전원 버튼을 길게 누르다"], ["Nothing worked.", "아무것도 안 되더라고요."], ["What else can I try?", "또 뭘 해 볼까요?"], ["in stock", "재고가 있는"], ["pick it up", "직접 찾아가다"], ["if that's a hassle", "그게 번거로우면"]], "audio": "audio/3_롤플레이/3-035 12. 음악(Music)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-035 12. 음악(Music)_문제 해결.mp3"}, {"id": "3-036", "cat": "roleplay", "catName": "롤플레이 질문", "num": 12, "topic": "음악", "topicEn": "Music", "type": "과거 경험", "badge": "36 과거 경험", "enQ": "That's the end of the situation. Have you ever run into an unexpected problem at a concert? What took place, and how did you handle it? How did the experience make you feel?", "enA": "Oh, this reminds me of a concert two summers ago. I got to the venue an hour early, feeling great, and then — the app wouldn't load. My mobile ticket simply would not open at the gate.\n\nOut of nowhere, ten thousand people were on the same network and my data crawled. The staff said a screenshot wouldn't be accepted. I restarted the app, turned airplane mode on and off — no luck. Honestly, I started to panic, because I could already hear the opening song from outside.\n\nThen it hit me — the box office. I ran over, showed my ID and the card I'd paid with, and they looked up my booking and printed a paper ticket. I missed two songs, but I got in. I felt like crying and laughing at the same time. Since then, I always download the ticket the night before.", "koQ": "콘서트에 갔다가 예상치 못한 문제를 겪은 적이 있나요? 무슨 일이 있었고 어떻게 대처했나요? 그 경험에 대해 어떻게 느꼈나요?", "koA": "아, 재작년 여름 콘서트가 하나 생각나네요. 기분 좋게 한 시간이나 일찍 공연장에 도착했는데, 하필 앱이 안 열리는 거예요. 입구에서 모바일 티켓이 도무지 안 떴어요.\n\n난데없이 만 명이 같은 통신망에 몰리니까 데이터가 기어가더라고요. 직원분은 캡처는 인정이 안 된다고 하셨고요. 앱도 다시 켜 보고, 비행기 모드도 껐다 켜 봤는데 소용없었어요. 솔직히 당황하기 시작했어요. 밖에서 벌써 오프닝 곡이 들렸거든요.\n\n그때 문득 매표소가 떠올랐어요. 달려가서 신분증이랑 결제한 카드를 보여 드렸더니, 예매 내역을 조회해서 종이 티켓을 뽑아 주셨어요. 두 곡은 놓쳤지만 들어가긴 했죠. 울고 싶으면서 동시에 웃음이 나는 기분이었어요. 그 후로는 꼭 전날 밤에 티켓을 미리 받아 둬요.", "struct": [["1️⃣ 도입", "한 시간 일찍 도착 · 기분 최고"], ["2️⃣ 사건", "입구에서 모바일 티켓 안 열림"], ["3️⃣ 절정", "데이터 먹통 · 캡처 불가 · 오프닝 소리"], ["4️⃣ 해결", "매표소에서 신분증 + 카드 조회"], ["5️⃣ 마무리", "두 곡 놓침 + 전날 다운로드 규칙"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["wouldn't load", "열리지가 않았다"], ["a mobile ticket", "모바일 티켓"], ["out of nowhere", "난데없이"], ["my data crawled", "데이터가 기어갔다"], ["wouldn't be accepted", "인정이 안 된다"], ["no luck", "소용없었어요"], ["I started to panic", "당황하기 시작했어요"], ["Then it hit me", "그때 문득 떠올랐어요"], ["look up my booking", "예매 내역을 조회하다"], ["the night before", "전날 밤에"]], "audio": "audio/3_롤플레이/3-036 12. 음악(Music)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-036 12. 음악(Music)_과거 경험.mp3"}, {"id": "3-037", "cat": "roleplay", "catName": "롤플레이 질문", "num": 13, "topic": "세일", "topicEn": "Sale", "type": "정보 요청", "badge": "37 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. Your favorite store is holding a big sale, and you would like to learn more about it. Call the store and leave a message with three or four questions to get more details about the sale.", "enA": "Hi, this is Ryan. I'm a regular at your store — I was in last weekend. I just heard you're having a big sale next month, and I've got a few questions. It's after hours, so I'll leave them on the machine and you can get back to me.\n\nFirst, when does the sale start and end? I'd like to plan around it. Second, is it store-wide, or only selected items? I'm mostly after winter coats.\n\nThird, how big is the discount — is it a flat thirty percent, or does it depend on the item? And one last thing: do you hold items for regular customers before the sale opens? You have my number from my last order, so give me a call back whenever it's convenient. Thank you!", "koQ": "가장 좋아하는 가게에서 큰 세일을 합니다. 가게에 전화해 메시지를 남기고, 세일에 대해 더 알기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 저는 라이언이라고 합니다. 그 가게 단골이에요. 지난 주말에도 들렀고요. 다음 달에 큰 세일을 하신다고 들어서 몇 가지 여쭤보려고요. 영업시간이 끝난 시간이라 자동응답기에 질문을 남겨 둘게요. 편하실 때 연락 주세요.\n\n우선, 세일이 언제 시작해서 언제 끝나나요? 일정을 맞춰 보려고요. 두 번째로, 매장 전체 세일인가요, 아니면 일부 품목만인가요? 저는 주로 겨울 코트를 보고 있거든요.\n\n세 번째로, 할인 폭이 어느 정도인가요? 일괄 30퍼센트인가요, 아니면 품목마다 다른가요? 그리고 마지막으로 하나만, 세일이 열리기 전에 단골손님을 위해 물건을 빼 두기도 하시나요? 지난 주문 때 제 번호가 남아 있을 테니, 편하실 때 회신 전화 주세요. 감사합니다!", "struct": [["1️⃣ 인사", "이름 + 단골 소개 + 메시지 이유"], ["2️⃣ 질문", "① 세일 시작·종료 시점"], ["3️⃣ 질문", "② 전 품목인지 일부 품목인지"], ["4️⃣ 질문", "③ 할인 폭 확인"], ["5️⃣ 마무리", "④ 상품 예약 + 회신 요청"]], "expr": [["This is ~ (on the phone)", "(전화상) ~입니다"], ["a regular", "단골손님"], ["after hours", "영업시간이 끝난 뒤"], ["leave ~ on the machine", "자동응답기에 남기다"], ["When does it start and end?", "언제 시작하고 끝나나요?"], ["store-wide", "매장 전체의"], ["selected items", "일부 품목"], ["a flat thirty percent", "일괄 30퍼센트"], ["be after ~", "~을 노리다, 찾고 있다"], ["hold items", "물건을 빼 두다"], ["give me a call back", "회신 전화 주세요"]], "audio": "audio/3_롤플레이/3-037 13. 세일(Sale)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-037 13. 세일(Sale)_정보 요청.mp3"}, {"id": "3-038", "cat": "roleplay", "catName": "롤플레이 질문", "num": 13, "topic": "세일", "topicEn": "Sale", "type": "문제 해결", "badge": "38 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. After getting home with the clothes you purchased, you notice you were not charged the sale price. Call the store, describe what happened, and offer two or three ways to fix the problem.", "enA": "Hi, is this the clothing store in the mall? I bought two sweaters there about an hour ago, and when I got home I checked the receipt — I was charged the full price. The sign on the rack said thirty percent off, but it wasn't applied at the register.\n\nHere's what I'm thinking. The simplest fix would be to refund the difference to my card. I still have the receipt, the tags are on, and the transaction number is right here if you need it.\n\nIf you can't do that over the phone, I could come back tomorrow after work — though I'd rather not make the trip twice. Or, if it's easier for you, store credit for the difference would be fine too. Let me know which one works — I'll be home all evening.", "koQ": "구매한 옷을 가지고 집에 온 뒤, 세일 가격으로 계산되지 않은 것을 알았습니다. 매장에 전화해 상황을 설명하고, 문제를 해결할 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 혹시 쇼핑몰에 있는 옷 가게 맞나요? 한 시간쯤 전에 거기서 스웨터를 두 장 샀는데요, 집에 와서 영수증을 확인해 보니 정가로 결제가 됐더라고요. 진열대에는 30퍼센트 할인이라고 붙어 있었는데, 계산대에서 적용이 안 된 것 같아요.\n\n제 생각은 이래요. 제일 간단한 건 차액을 제 카드로 환불해 주시는 거예요. 영수증도 그대로 있고, 택도 안 뗐고, 거래 번호도 여기 있어요. 필요하시면 불러 드릴게요.\n\n전화로 처리가 어려우시면 제가 내일 퇴근하고 다시 갈 수는 있어요. 다만 같은 길을 두 번 가는 건 좀 그렇네요. 아니면 그쪽이 더 편하시다면 차액만큼 매장 적립금으로 주셔도 괜찮아요. 어느 쪽이 되는지 알려 주세요. 저녁 내내 집에 있을 거예요.", "struct": [["1️⃣ 확인", "매장 확인 + 한 시간 전 구매"], ["2️⃣ 문제", "정가 결제 · 30% 표시 미적용"], ["3️⃣ 요구", "① 카드로 차액 환불"], ["4️⃣ 대안", "② 내일 방문 ③ 매장 적립금"], ["5️⃣ 마무리", "선택권 넘기기 + 통화 가능 시간"]], "expr": [["check the receipt", "영수증을 확인하다"], ["be charged the full price", "정가로 결제되다"], ["thirty percent off", "30퍼센트 할인"], ["it wasn't applied", "적용이 안 됐어요"], ["Here's what I'm thinking", "제 생각은 이래요"], ["refund the difference", "차액을 환불하다"], ["the tags are on", "택이 그대로 있어요"], ["the transaction number", "거래 번호"], ["come back tomorrow", "내일 다시 가다"], ["store credit", "매장 적립금"], ["Let me know which one works", "어느 쪽이 되는지 알려 주세요"]], "audio": "audio/3_롤플레이/3-038 13. 세일(Sale)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-038 13. 세일(Sale)_문제 해결.mp3"}, {"id": "3-039", "cat": "roleplay", "catName": "롤플레이 질문", "num": 13, "topic": "세일", "topicEn": "Sale", "type": "과거 경험", "badge": "39 과거 경험", "enQ": "That's the end of the situation. Think back to a time you purchased something. What did you buy, and what happened with it? How did you manage the situation? Walk me through the steps you took to solve the problem.", "enA": "Oh, this reminds me of a monitor I bought during a year-end sale. It was half price, so I ordered it the night the sale opened.\n\nThe problem was the box. It came badly dented on one corner, and the driver had already left. I opened it anyway, plugged it in, and there it was — a bright patch of light bleeding out of that corner. My heart sank, because sale items usually mean no returns.\n\nSo here's what I did. I took photos of the box and the screen and filed a claim on the seller's page that night. They said it was the courier's fault, but I pointed out the damage was visible before I opened it. In the end they sent a replacement first and collected the old one. Since then, I open every box while the driver is still there.", "koQ": "무언가를 구매했던 때를 떠올려 보세요. 무엇을 샀고 그것과 무슨 일이 있었나요? 그 상황을 어떻게 해결했는지 절차를 하나씩 설명해 주세요.", "koA": "아, 연말 세일 때 샀던 모니터가 생각나네요. 반값이길래 세일이 열리는 날 밤에 바로 주문했어요.\n\n문제는 박스였어요. 한쪽 모서리가 심하게 찌그러진 채로 왔는데, 기사님은 이미 가신 뒤였죠. 그래도 열어서 전원을 켜 봤더니, 바로 그 모서리에서 빛이 밝게 새어 나오는 거예요. 마음이 내려앉았어요. 세일 상품은 보통 반품이 안 되니까요.\n\n그래서 이렇게 했어요. 박스랑 화면을 사진으로 찍어 두고 그날 밤에 판매처 페이지에 클레임을 접수했어요. 택배사 과실이라고 하시길래, 개봉 전부터 보이던 손상이라고 짚어 드렸죠. 결국 새 제품을 먼저 보내 주고 기존 것을 회수해 갔어요. 그 후로는 기사님이 계실 때 박스를 열어 봐요.", "struct": [["1️⃣ 도입", "연말 세일 · 반값 모니터 주문"], ["2️⃣ 사건", "찌그러진 박스 · 화면 빛 번짐"], ["3️⃣ 감정", "세일 상품 반품 불가 걱정"], ["4️⃣ 해결", "사진 → 클레임 접수 → 근거 반박"], ["5️⃣ 마무리", "선교환 + 기사님 앞 개봉 습관"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["a year-end sale", "연말 세일"], ["half price", "반값"], ["badly dented", "심하게 찌그러진"], ["a bright patch of light", "밝게 새어 나오는 빛"], ["My heart sank.", "마음이 내려앉았어요."], ["no returns", "반품 불가"], ["file a claim", "클레임을 접수하다"], ["the courier's fault", "택배사 과실"], ["send a replacement first", "새 제품을 먼저 보내 주다"], ["while the driver is still there", "기사님이 계실 때"]], "audio": "audio/3_롤플레이/3-039 13. 세일(Sale)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-039 13. 세일(Sale)_과거 경험.mp3"}, {"id": "3-040", "cat": "roleplay", "catName": "롤플레이 질문", "num": 14, "topic": "가구", "topicEn": "Furniture", "type": "정보 요청", "badge": "40 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are looking to buy some new furniture. Call a furniture store, tell the salesperson what you have in mind, and ask three or four questions about the pieces you want.", "enA": "Hi, is this the furniture store on the main road? I'm in the market for a two-seater sofa for my living room, and I'd like to ask a few things before I come by.\n\nFirst, what do you have in stock in fabric rather than leather? ... You do? Good. My living room is small, so it has to be under a hundred and sixty centimeters wide. Do you carry that size? ... A few models? Great.\n\nSecond, is delivery included, and would you take the old one away? ... For a small fee? That's fine. And one last thing — how long is the wait if I order today? ... Two weeks? That works for me. I'll come by on Saturday and sit on a few. Thanks for your help!", "koQ": "새 가구를 사려고 합니다. 가구점에 전화해 어떤 가구를 찾는지 점원에게 설명하고, 원하는 가구에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 큰길에 있는 가구점 맞나요? 거실에 놓을 2인용 소파를 알아보고 있는데, 방문하기 전에 몇 가지만 여쭤보려고요.\n\n우선, 가죽 말고 패브릭으로는 어떤 재고가 있나요? ... 있다고요? 좋네요. 저희 거실이 좁아서 폭이 160센티 미만이어야 하거든요. 그 정도 사이즈도 취급하시나요? ... 몇 가지 있다고요? 잘됐네요.\n\n두 번째로, 배송은 포함인가요? 그리고 쓰던 소파도 가져가 주시나요? ... 약간의 비용이 든다고요? 그 정도는 괜찮아요. 마지막으로 하나만, 오늘 주문하면 얼마나 기다려야 하나요? ... 2주요? 저한테 괜찮네요. 토요일에 가서 몇 개 앉아 볼게요. 감사합니다!", "struct": [["1️⃣ 인사", "가게 확인 + 원하는 가구 선언"], ["2️⃣ 질문", "① 패브릭 재고 → 크기 조건"], ["3️⃣ 질문", "② 배송 포함 여부"], ["4️⃣ 질문", "③ 쓰던 소파 수거"], ["5️⃣ 마무리", "④ 대기 기간 + 방문 예고"]], "expr": [["be in the market for ~", "~을 사려고 알아보다"], ["a two-seater sofa", "2인용 소파"], ["What do you have in stock?", "어떤 재고가 있나요?"], ["fabric rather than leather", "가죽 말고 패브릭으로"], ["under a hundred and sixty centimeters", "160센티 미만으로"], ["Is delivery included?", "배송은 포함인가요?"], ["take the old one away", "쓰던 것을 수거해 가다"], ["for a small fee", "약간의 비용으로"], ["How long is the wait?", "얼마나 기다려야 하나요?"], ["That works for me.", "저한테 괜찮네요."], ["sit on a few", "몇 개 앉아 보다"]], "audio": "audio/3_롤플레이/3-040 14. 가구(Furniture)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-040 14. 가구(Furniture)_정보 요청.mp3"}, {"id": "3-041", "cat": "roleplay", "catName": "롤플레이 질문", "num": 14, "topic": "가구", "topicEn": "Furniture", "type": "문제 해결", "badge": "41 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. There is a problem with the furniture you ordered. It has just arrived, but it is not the item you purchased. Call the store, describe the mix-up, and offer two or three ways to resolve it.", "enA": "Hello, I'm calling about a delivery that just arrived. Last Tuesday I ordered a five-tier walnut bookshelf — the order number ends in 407. What the driver brought is a white three-tier one, and it's still in the box, unopened.\n\nI'm guessing the labels got mixed up at the warehouse. Here's what I'd suggest. First, could you send the right one and pick this one up at the same time? That way I only have to wait at home once.\n\nIf the walnut one is out of stock, please tell me today, because I'd rather cancel and get a refund than wait a month. And if it's only delayed, could you take something off the price for the trouble? Just let me know — my books are sitting on the floor right now.", "koQ": "주문한 가구가 방금 도착했는데, 구매한 물건이 아닙니다. 매장에 전화해 무엇이 잘못되었는지 설명하고, 해결할 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 방금 도착한 배송 건으로 전화드렸어요. 지난주 화요일에 5단 월넛 책장을 주문했는데요, 주문번호 끝자리가 407이에요. 그런데 기사님이 가져다주신 건 3단 화이트 책장이에요. 아직 박스도 안 뜯고 그대로 두었고요.\n\n아마 창고에서 라벨이 뒤바뀐 것 같은데요. 이렇게 하면 어떨까요. 우선, 제대로 된 걸 보내 주시면서 이건 그때 같이 가져가 주실 수 있을까요? 그러면 제가 집에서 한 번만 기다리면 되니까요.\n\n월넛이 재고가 없다면 오늘 안에 알려 주세요. 한 달을 기다리느니 취소하고 환불받는 편이 나을 것 같아서요. 그리고 단순히 늦어지는 거라면, 번거롭게 된 만큼 값을 조금 빼 주실 수 있을까요? 알려만 주세요. 지금 책들이 다 바닥에 놓여 있거든요.", "struct": [["1️⃣ 확인", "주문 내역 + 도착한 물건 대조"], ["2️⃣ 추정", "창고에서 라벨이 뒤바뀜"], ["3️⃣ 요구", "① 교환 + 동시 회수"], ["4️⃣ 대안", "② 재고 없으면 취소·환불"], ["5️⃣ 마무리", "③ 지연 시 가격 조정 + 기한"]], "expr": [["a five-tier walnut bookshelf", "5단 월넛 책장"], ["the order number ends in ~", "주문번호 끝자리가 ~"], ["in the box, unopened", "박스째 미개봉으로"], ["the labels got mixed up", "라벨이 뒤바뀌다"], ["Here's what I'd suggest", "이렇게 하면 어떨까요"], ["pick up at the same time", "그때 같이 회수하다"], ["out of stock", "재고가 없는"], ["cancel and get a refund", "취소하고 환불받다"], ["take something off the price", "값을 조금 빼 주다"], ["Just let me know", "알려만 주세요"], ["sitting on the floor", "바닥에 놓여 있는"]], "audio": "audio/3_롤플레이/3-041 14. 가구(Furniture)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-041 14. 가구(Furniture)_문제 해결.mp3"}, {"id": "3-042", "cat": "roleplay", "catName": "롤플레이 질문", "num": 14, "topic": "가구", "topicEn": "Furniture", "type": "과거 경험", "badge": "42 과거 경험", "enQ": "That's the end of the situation. Have you ever had trouble with something you purchased for your home? What was wrong with it, and how did you sort it out? Give me as many details as you can.", "enA": "Oh, this reminds me of the robot vacuum I bought last spring. I'd saved up for it, and I had this picture in my head of coming home every day to a spotless floor.\n\nReality hit fast. On day one it got tangled in the fringe of my rug and stopped. Then it couldn't get over the threshold into the bedroom, so it just bumped into it. And at three in the morning it started beeping in the hallway, out of battery. I was ready to return it.\n\nBut before I did, I called the store. The staff member told me I'd never turned on the no-go zone setting, and that they'd send me a small ramp for the threshold free of charge. Both were sorted in three days, and it's been quiet since. Since then, I always call before I hit the return button.", "koQ": "집을 위해 산 물건에 문제가 있었던 적이 있나요? 무엇이 문제였고 어떻게 해결했는지 최대한 자세히 말해주세요.", "koA": "아, 작년 봄에 산 로봇청소기가 생각나네요. 돈을 모아서 산 거였고, 매일 집에 오면 바닥이 티 없이 깨끗할 거라는 그림을 머릿속에 그리고 있었죠.\n\n그런데 현실은 금방 왔어요. 첫날부터 러그 술에 감겨서 멈춰 버렸고요. 그다음엔 침실 문턱을 못 넘고 부딪히기만 했고요. 새벽 3시에는 복도에서 배터리가 다 됐다고 삑삑거리기 시작했어요. 반품할 마음까지 먹었어요.\n\n그런데 그러기 전에 매장에 전화를 해 봤어요. 직원분이 제가 진입 금지 구역 설정을 한 번도 안 켰다고 알려 주셨고, 문턱용 작은 경사판도 무료로 보내 주시겠다고 했어요. 사흘 만에 둘 다 해결됐고, 그 뒤로는 조용해요. 그 후로는 반품 버튼을 누르기 전에 꼭 전화부터 해요.", "struct": [["1️⃣ 도입", "돈 모아 산 로봇청소기 · 기대"], ["2️⃣ 사건", "러그에 감김 · 문턱 못 넘음"], ["3️⃣ 절정", "새벽 3시 배터리 경고음"], ["4️⃣ 해결", "매장 전화 → 설정 + 경사판"], ["5️⃣ 마무리", "반품 전에 전화하는 나만의 규칙"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["save up for ~", "~을 위해 돈을 모으다"], ["a spotless floor", "티 없이 깨끗한 바닥"], ["Reality hit fast.", "현실은 금방 왔어요."], ["get tangled in ~", "~에 감기다"], ["get over the threshold", "문턱을 넘다"], ["out of battery", "배터리가 다 된"], ["be ready to return it", "반품할 마음을 먹다"], ["the no-go zone setting", "진입 금지 구역 설정"], ["free of charge", "무료로"], ["hit the return button", "반품 버튼을 누르다"]], "audio": "audio/3_롤플레이/3-042 14. 가구(Furniture)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-042 14. 가구(Furniture)_과거 경험.mp3"}, {"id": "3-043", "cat": "roleplay", "catName": "롤플레이 질문", "num": 15, "topic": "거주지·집", "topicEn": "Home", "type": "정보 요청", "badge": "43 정보 요청", "enQ": "I would like to give you a situation and ask you to act it out. A family member has asked for your help in getting a party ready. Call that person and have a brief conversation, asking three or four questions about the party.", "enA": "Hey Mom, it's me. I got your message about the family dinner — count me in, of course. But before I just show up, let me get the details straight, so I don't bring the wrong thing again. Do you have a minute?\n\nFirst, when exactly is it, and what time should I be there? ... Saturday at five? Got it. And how many are we expecting? ... Twelve? That's more than last year.\n\nSecond, what do you want me to handle? I can do the shopping on my way over, or cook one dish — my kimchi fried rice, if you want something easy. ... Both? Of course. And one last thing — should I bring extra chairs? We were short last time and Uncle ended up on the sofa. ... I'll bring four, then. See you Saturday!", "koQ": "가족 중 한 명이 파티 준비를 도와달라고 부탁했습니다. 그 가족에게 전화해 파티에 대해 3~4가지 질문을 하며 짧은 대화를 나눠보세요.", "koA": "엄마, 나야. 가족 저녁 모임 얘기 문자 봤어. 나야 당연히 가지. 근데 그냥 가기 전에 몇 가지만 확실히 해 두려고. 또 엉뚱한 거 사 가면 안 되니까. 잠깐 통화 괜찮아?\n\n우선, 정확히 언제야? 그리고 몇 시까지 가면 돼? ... 토요일 5시? 알겠어. 그리고 몇 명이나 오는 거야? ... 열두 명? 작년보다 많네.\n\n두 번째로, 내가 뭘 맡으면 좋을까? 가는 길에 장을 봐 가도 되고, 아니면 한 가지 요리를 해 가도 돼. 간단한 게 좋으면 내 김치볶음밥으로 하고. ... 둘 다? 그래, 알았어. 마지막으로 하나만, 의자 좀 더 가져갈까? 지난번에 모자라서 삼촌이 소파에 앉으셨잖아. ... 그럼 네 개 가져갈게. 토요일에 봐!", "struct": [["1️⃣ 인사", "부탁 수락 + 질문 예고"], ["2️⃣ 질문", "① 날짜·시간 확인"], ["3️⃣ 질문", "② 참석 인원 확인"], ["4️⃣ 질문", "③ 내가 맡을 역할"], ["5️⃣ 마무리", "④ 의자 준비 + 약속 확정"]], "expr": [["Count me in.", "나도 갈게."], ["let me get the details straight", "세부 사항을 확실히 해 두다"], ["When exactly is it?", "정확히 언제야?"], ["How many are we expecting?", "몇 명이나 오는 거야?"], ["What do you want me to handle?", "내가 뭘 맡으면 돼?"], ["do the shopping", "장을 보다"], ["cook one dish", "요리 한 가지를 하다"], ["kimchi fried rice", "김치볶음밥"], ["extra chairs", "여분의 의자"], ["be short", "모자라다"], ["See you Saturday!", "토요일에 봐!"]], "audio": "audio/3_롤플레이/3-043 15. 거주지·집(Home)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-043 15. 거주지·집(Home)_정보 요청.mp3"}, {"id": "3-044", "cat": "roleplay", "catName": "롤플레이 질문", "num": 15, "topic": "거주지·집", "topicEn": "Home", "type": "문제 해결", "badge": "44 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You planned to have guests over for dinner at your place, but your kitchen plumbing has suddenly broken down. Call your guests, describe the situation, and offer two or three other ideas for where or how to eat together.", "enA": "Hey, it's me. I've got some bad news about tonight. The kitchen sink backed up this afternoon — there's water all over the floor, and the plumber can't come until tomorrow morning. So cooking at my place is out.\n\nHere's what I'm thinking. First, come over anyway and we'll order in. The kitchen is the only room that's a mess, and we can eat in the living room like always.\n\nIf that sounds grim, let's move it to the kimchi stew place in my alley — five minutes away, they know me, and dinner is on me for the trouble. Or we push it to next Friday and I'll cook properly. Whichever works for everyone — just let me know by four.", "koQ": "집에서 저녁 식사 모임을 열려고 했는데 주방 배관에 갑자기 문제가 생겼습니다. 손님들에게 전화해 상황을 설명하고, 어디서 어떻게 함께 식사할지 2~3가지 대안을 제안해 보세요.", "koA": "안녕, 나야. 오늘 저녁 일로 안 좋은 소식이 있어. 오후에 주방 싱크대가 막혀 버렸어. 바닥이 온통 물바다고, 설비 기사님은 내일 아침에나 오실 수 있대. 그래서 우리 집에서 요리하는 건 어렵게 됐어.\n\n내 생각은 이래. 우선, 그냥 와도 돼. 대신 시켜 먹자. 엉망인 건 주방뿐이고, 거실에서 늘 하던 대로 먹으면 되니까.\n\n그게 별로면, 우리 골목에 있는 김치찌개집으로 옮기자. 걸어서 5분이고, 사장님이 나를 잘 아셔. 그리고 번거롭게 한 값으로 저녁은 내가 살게. 아니면 다음 주 금요일로 미루고 그때 제대로 요리해 줄게. 다들 편한 쪽으로 하자. 네 시까지만 알려 줘.", "struct": [["1️⃣ 통보", "오늘 저녁 계획 변경 알림"], ["2️⃣ 상황", "싱크대 막힘 · 내일 아침 수리"], ["3️⃣ 대안", "① 그대로 와서 배달 음식"], ["4️⃣ 대안", "② 골목 김치찌개집으로 이동"], ["5️⃣ 마무리", "③ 다음 주로 연기 + 기한"]], "expr": [["I've got some bad news", "안 좋은 소식이 있어"], ["back up (sink)", "(배수구가) 막히다"], ["all over the floor", "바닥 온통"], ["~ is out", "~은 어렵게 됐어"], ["Here's what I'm thinking", "내 생각은 이래"], ["order in", "집으로 시켜 먹다"], ["the only room that’s a mess", "엉망인 건 그 방뿐"], ["move it to ~", "~로 옮기다"], ["dinner is on me", "저녁은 내가 살게"], ["push it to ~", "~로 미루다"], ["Whichever works for everyone", "다들 편한 쪽으로"]], "audio": "audio/3_롤플레이/3-044 15. 거주지·집(Home)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-044 15. 거주지·집(Home)_문제 해결.mp3"}, {"id": "3-045", "cat": "roleplay", "catName": "롤플레이 질문", "num": 15, "topic": "거주지·집", "topicEn": "Home", "type": "과거 경험", "badge": "45 과거 경험", "enQ": "That's the end of the situation. Have you ever purchased new furniture and regretted it once you got it home? What was the problem with it, and how did you handle things? Share everything you remember about the situation.", "enA": "Oh, this reminds me of a dining table I bought two years ago. I saw it in a photo — solid oak, six seats — and I ordered it without measuring anything. That was my first mistake.\n\nIt arrived, the delivery guys set it up, and the room just shrank. With the chairs pulled out, the fridge door wouldn't open all the way, and I had to turn sideways to get past it. I stood there thinking, what have I done.\n\nSending it back would have cost me eighty thousand won and two weeks, so I fixed it another way. I swapped the chairs for a bench on one side and pushed the table against the wall, and suddenly the room could breathe again. Since then, I tape the outline on the floor before I buy anything big.", "koQ": "새 가구를 샀는데 집에 가져온 후 후회한 적이 있나요? 무엇이 문제였고, 그 상황을 어떻게 해결했는지 기억나는 모든 것을 말해주세요.", "koA": "아, 2년 전에 산 식탁이 생각나네요. 사진으로 보고 반했거든요. 원목에 6인용이었어요. 그런데 치수는 하나도 안 재고 그냥 주문해 버렸죠. 그게 첫 번째 실수였어요.\n\n배송이 와서 기사님들이 설치해 주셨는데, 방이 그냥 확 줄어든 느낌이었어요. 의자를 빼면 냉장고 문이 끝까지 열리지 않았고, 옆으로 서서 지나가야 했어요. 그 자리에 서서 생각했죠. 내가 무슨 짓을 한 거지.\n\n반품하면 8만 원에 2주가 걸린다고 해서, 다른 방법으로 해결했어요. 한쪽 의자를 벤치로 바꾸고 식탁을 벽에 붙였더니, 갑자기 방이 다시 숨을 쉬더라고요. 그 후로는 큰 걸 사기 전에 바닥에 테이프로 크기를 그려 봐요.", "struct": [["1️⃣ 도입", "사진만 보고 산 6인용 원목 식탁"], ["2️⃣ 실수", "치수를 재지 않고 주문"], ["3️⃣ 사건", "냉장고 문 · 옆으로 지나가기"], ["4️⃣ 해결", "벤치로 교체 + 벽에 붙이기"], ["5️⃣ 마무리", "바닥에 테이프로 크기 그리는 습관"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["solid oak", "원목 참나무"], ["without measuring anything", "치수를 하나도 안 재고"], ["my first mistake", "첫 번째 실수"], ["the room shrank", "방이 줄어든 느낌"], ["the fridge door wouldn't open", "냉장고 문이 안 열렸다"], ["turn sideways", "옆으로 서서 지나가다"], ["fix it another way", "다른 방법으로 해결하다"], ["swap A for B", "A를 B로 바꾸다"], ["against the wall", "벽에 붙여서"], ["tape the outline on the floor", "바닥에 테이프로 크기를 그리다"]], "audio": "audio/3_롤플레이/3-045 15. 거주지·집(Home)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-045 15. 거주지·집(Home)_과거 경험.mp3"}, {"id": "3-046", "cat": "roleplay", "catName": "롤플레이 질문", "num": 16, "topic": "여행", "topicEn": "Travel", "type": "정보 요청", "badge": "46 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You and your friend are planning to take a trip together. Call a travel agency and ask three or four questions about the trip you have in mind.", "enA": "Hi, is this the travel agency near the station? A friend and I are planning a three-day trip to Jeju next month, and we'd like to go through an agency this time. Can I ask a few questions?\n\nFirst, what packages do you have for early May? ... Flight and hotel together? That's exactly what we want. And what's the price range per person? ... Around four hundred thousand won? That's within our budget.\n\nSecond, is a rental car included, or do we book that ourselves? ... Optional? We'll take it — we want to drive around the coast. And one last thing — how late can we cancel without a fee? ... Two weeks before? Good to know. We'll come in this weekend to sign. Thank you!", "koQ": "친구와 함께 여행을 계획하고 있습니다. 여행사에 전화해 생각하고 있는 여행에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 근처에 있는 여행사 맞나요? 친구랑 다음 달에 제주도로 2박 3일 여행을 가려고 하는데, 이번에는 여행사를 통해서 가 보려고요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 5월 초로 어떤 패키지가 있나요? ... 항공과 숙소가 함께요? 저희가 원하던 게 딱 그거예요. 그리고 1인당 가격대는 어떻게 되나요? ... 40만 원 정도요? 저희 예산 안에 들어오네요.\n\n두 번째로, 렌터카도 포함인가요, 아니면 따로 예약해야 하나요? ... 선택 사항이요? 그럼 넣을게요. 해안도로를 좀 달려 보고 싶거든요. 마지막으로 하나만, 수수료 없이 언제까지 취소할 수 있나요? ... 2주 전까지요? 알아 둘게요. 이번 주말에 가서 계약할게요. 감사합니다!", "struct": [["1️⃣ 인사", "여행사 확인 + 여행 계획 설명"], ["2️⃣ 질문", "① 패키지 구성 → 가격대"], ["3️⃣ 질문", "② 렌터카 포함 여부"], ["4️⃣ 질문", "③ 취소 가능 시점"], ["5️⃣ 마무리", "방문 예고 + 감사 인사"]], "expr": [["A friend and I are planning ~", "친구와 저는 ~을 계획 중이에요"], ["a three-day trip", "2박 3일 여행"], ["go through an agency", "여행사를 통해 가다"], ["What packages do you have?", "어떤 패키지가 있나요?"], ["flight and hotel together", "항공과 숙소가 함께"], ["What's the price range?", "가격대가 어떻게 되나요?"], ["That's within our budget.", "저희 예산 안에 들어오네요."], ["Is ~ included?", "~도 포함인가요?"], ["optional", "선택 사항인"], ["How late can we cancel?", "언제까지 취소할 수 있나요?"], ["Good to know.", "알아 둘게요."]], "audio": "audio/3_롤플레이/3-046 16. 여행(Travel)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-046 16. 여행(Travel)_정보 요청.mp3"}, {"id": "3-047", "cat": "roleplay", "catName": "롤플레이 질문", "num": 16, "topic": "여행", "topicEn": "Travel", "type": "문제 해결", "badge": "47 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. The travel agency has contacted you to say that the trip you wanted is no longer available. Call your friend, leave a message describing the situation, and offer two or three ideas to deal with the problem.", "enA": "Hey, it's me. I know you're in a meeting, so I'll just leave this on your voicemail. The agency called an hour ago — the Jeju package is off. Their partner hotel overbooked, and there's nothing left for that weekend.\n\nDon't panic — I've already looked into a few things. First, they have the same package a week later, same price, and our flights would just shift. If you can move your days off, that's the easiest fix.\n\nSecond, if that weekend is fixed for you, they offered Busan instead — cheaper, and we'd take the KTX. Or, worst case, we cancel and get a full refund and plan it properly for the autumn. Have a think and call me back tonight — I'll be up.", "koQ": "여행사에서 원하던 여행이 불가능하다고 연락했습니다. 친구에게 전화해 메시지를 남기고, 상황을 설명한 뒤 문제를 해결할 2~3가지 방안을 제안해 보세요.", "koA": "안녕, 나야. 너 지금 회의 중인 거 아니까 음성 메시지로 남겨 둘게. 한 시간쯤 전에 여행사에서 전화가 왔는데, 제주 패키지가 취소됐대. 제휴 호텔에서 초과 예약이 나서 그 주말에는 남은 방이 없다더라고.\n\n당황하지 마. 내가 이미 몇 가지 알아봤어. 우선, 일주일 뒤에 같은 패키지가 있대. 가격도 같고, 항공편만 그만큼 밀리는 거야. 네가 휴가를 옮길 수 있으면 이게 제일 간단해.\n\n두 번째로, 그 주말이 꼭 고정이어야 한다면 대신 부산을 제안하더라. 더 저렴하고, KTX로 가면 되고. 아니면 최악의 경우에는 취소하고 전액 환불받은 다음, 가을에 제대로 계획하자. 생각해 보고 오늘 밤에 전화 줘. 나 안 자고 있을게.", "struct": [["1️⃣ 메시지", "음성 메시지임을 밝히기"], ["2️⃣ 상황", "패키지 취소 + 취소 사유"], ["3️⃣ 대안", "① 일주일 뒤 같은 패키지"], ["4️⃣ 대안", "② 부산으로 변경"], ["5️⃣ 마무리", "③ 전액 환불 + 회신 요청"]], "expr": [["leave this on your voicemail", "음성 메시지로 남기다"], ["I know you’re in a meeting", "너 회의 중인 거 알아"], ["be off", "취소되다, 무산되다"], ["overbook", "초과 예약을 받다"], ["Don't panic", "당황하지 마"], ["look into ~", "~을 알아보다"], ["move your days off", "휴가를 옮기다"], ["~ instead", "대신 ~으로"], ["worst case", "최악의 경우에는"], ["a full refund", "전액 환불"], ["call me back tonight", "오늘 밤에 전화 줘"]], "audio": "audio/3_롤플레이/3-047 16. 여행(Travel)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-047 16. 여행(Travel)_문제 해결.mp3"}, {"id": "3-048", "cat": "roleplay", "catName": "롤플레이 질문", "num": 16, "topic": "여행", "topicEn": "Travel", "type": "과거 경험", "badge": "48 과거 경험", "enQ": "That's the end of the situation. Think back to a time you ran into trouble while organizing a trip. What was the issue, and how did you handle it? Tell me the whole story from start to finish.", "enA": "Oh, this reminds me of my best friend's birthday last summer. We have a little tradition: every year I book a hotel for one night — a staycation — and we order far too much food.\n\nThat year I booked two months ahead and paid, with a confirmation email. But three days before, the hotel called: they had overbooked, and our room was gone. On a Saturday in August, nothing decent was left in the city — and it was supposed to be a surprise, so I couldn't even tell her.\n\nSo I pushed back. I told them my booking was confirmed and asked what they could do. They came back with a sister hotel two stations away, one grade up, same price, breakfast included. I took it in a heartbeat. She never knew until I told her that night. Since then, I always call to reconfirm a week before.", "koQ": "여행을 준비하면서 문제를 겪었던 때를 떠올려 보세요. 문제가 무엇이었고 어떻게 해결했나요? 처음부터 끝까지 이야기해 주세요.", "koA": "아, 작년 여름 절친 생일이 생각나네요. 저희한테는 작은 전통이 하나 있어요. 해마다 제가 호텔을 하루 잡아서 호캉스를 하고 음식을 잔뜩 시켜 먹거든요.\n\n그해에는 두 달 전에 예약하고 결제한 뒤 확인 메일까지 받아 뒀어요. 그런데 사흘 전에 호텔에서 전화가 왔어요. 초과 예약이 나서 저희 방이 없어졌대요. 8월 토요일이라 시내에 괜찮은 방은 하나도 없었고요. 게다가 깜짝 선물이어서 친구한테 말할 수도 없었어요.\n\n그래서 물러서지 않았어요. 예약이 확정된 건이라고 말씀드리고 어떻게 해 주실 수 있는지 물었죠. 그랬더니 두 정거장 떨어진 계열 호텔에, 한 등급 위 객실을, 같은 가격에, 조식까지 넣어 주시더라고요. 두말없이 받았죠. 친구는 그날 밤까지 전혀 몰랐고요. 그 후로는 일주일 전에 꼭 전화해서 재확인해요.", "struct": [["1️⃣ 도입", "절친 생일 호캉스 전통"], ["2️⃣ 사건", "사흘 전 초과 예약 통보"], ["3️⃣ 절정", "8월 토요일 · 깜짝 선물이라 말도 못 함"], ["4️⃣ 해결", "물러서지 않고 요구 → 계열 호텔 업그레이드"], ["5️⃣ 마무리", "일주일 전 재확인 전화 습관"]], "expr": [["This reminds me of ~", "~이 생각나네요"], ["a little tradition", "작은 전통"], ["a staycation", "호캉스"], ["book two months ahead", "두 달 전에 예약하다"], ["overbook", "초과 예약을 받다"], ["be supposed to be a surprise", "깜짝 선물이어야 했다"], ["push back", "물러서지 않고 맞서다"], ["a sister hotel", "계열 호텔"], ["one grade up", "한 등급 위로"], ["in a heartbeat", "두말없이 바로"], ["call to reconfirm", "전화해서 재확인하다"]], "audio": "audio/3_롤플레이/3-048 16. 여행(Travel)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-048 16. 여행(Travel)_과거 경험.mp3"}, {"id": "3-049", "cat": "roleplay", "catName": "롤플레이 질문", "num": 17, "topic": "해외여행", "topicEn": "Overseas", "type": "정보 요청", "badge": "49 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are organizing a trip abroad and would like to learn more about the choices available. Call a travel agency and ask three or four questions to gather the information you need.", "enA": "Hi, is this the travel agency by the station? I'm planning a trip abroad next spring — Italy, if the budget allows — and I'd like to hear what my options are. Can I ask a few questions?\n\nFirst, do you do package tours for Italy, or is it mostly free travel with flights and hotels? ... Both? Good. What's the difference in price? ... About a million won? That's a lot, but I see why.\n\nSecond, is there a direct flight, or do we have to change planes? ... Thirteen hours direct? I'd rather pay for that. And one last thing — how much cheaper is the off-season? I've been saving up for two years, so timing matters. ... Twenty percent in November? Good to know. Thank you!", "koQ": "해외여행을 계획 중이고, 선택할 수 있는 옵션을 더 알아보고 싶습니다. 여행사에 전화해 필요한 정보를 얻기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 옆에 있는 여행사 맞나요? 내년 봄에 해외여행을 가려고 하는데요. 예산이 되면 이탈리아로요. 어떤 선택지가 있는지 들어 보고 싶어서 전화드렸어요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 이탈리아는 패키지 투어도 있나요, 아니면 주로 항공과 숙소만 잡는 자유여행인가요? ... 둘 다요? 좋네요. 두 방식의 가격 차이는 얼마나 되나요? ... 100만 원쯤이요? 크긴 한데 왜 그런지는 알겠어요.\n\n두 번째로, 직항이 있나요, 아니면 갈아타야 하나요? ... 직항으로 13시간이요? 저는 차라리 그 값을 내겠어요. 마지막으로 하나만, 비수기는 얼마나 더 저렴한가요? 2년째 돈을 모으고 있어서 시기가 중요하거든요. ... 11월이면 20퍼센트요? 알아 둘게요. 감사합니다!", "struct": [["1️⃣ 인사", "여행사 확인 + 해외여행 계획"], ["2️⃣ 질문", "① 패키지 vs 자유여행"], ["3️⃣ 질문", "② 두 방식의 가격 차이"], ["4️⃣ 질문", "③ 직항 여부"], ["5️⃣ 마무리", "④ 비수기 할인 + 감사 인사"]], "expr": [["I'm planning a trip abroad", "해외여행을 계획 중이에요"], ["what my options are", "어떤 선택지가 있는지"], ["package tours", "패키지 투어"], ["free travel", "자유여행"], ["What's the difference in price?", "가격 차이가 얼마나 되나요?"], ["a direct flight", "직항편"], ["change planes", "비행기를 갈아타다"], ["I'd rather pay for that", "차라리 그 값을 내겠어요"], ["the off-season", "비수기"], ["save up", "돈을 모으다"], ["Good to know.", "알아 둘게요."]], "audio": "audio/3_롤플레이/3-049 17. 해외여행(Overseas)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-049 17. 해외여행(Overseas)_정보 요청.mp3"}, {"id": "3-050", "cat": "roleplay", "catName": "롤플레이 질문", "num": 17, "topic": "해외여행", "topicEn": "Overseas", "type": "문제 해결", "badge": "50 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You have just landed in another country, but your luggage never appeared at baggage claim. Speak with the airline staff, describe the situation, and offer two or three ways they could assist you.", "enA": "Excuse me, I need some help. I just came off the flight from Seoul, and my suitcase never came out at baggage claim. I waited until the belt stopped. Here's my baggage tag and my passport.\n\nHere's what I'd like to ask. First, could you file a report and check whether it's still in Seoul or already here somewhere? If you can tell me where it is right now, I can plan around it.\n\nSecond, if it comes tomorrow, could you deliver it to my hotel? I'd rather not come back to the airport. And since everything I own is in that bag, is there an allowance for basic necessities tonight — a toothbrush, a shirt? ... There is? Thank you. Please text me as soon as you know anything.", "koQ": "다른 나라에 도착했는데 짐이 수하물 찾는 곳에서 나오지 않았습니다. 항공사 직원에게 상황을 설명하고, 도와줄 수 있는 2~3가지 방법을 제안해 보세요.", "koA": "실례합니다, 도움이 좀 필요해서요. 방금 서울에서 오는 비행기에서 내렸는데, 제 캐리어가 수하물 찾는 곳에서 끝내 안 나왔어요. 벨트가 멈출 때까지 기다렸고요. 여기 제 수하물 표랑 여권입니다.\n\n이렇게 여쭤보고 싶어요. 우선, 분실 신고를 접수해 주시고 짐이 아직 서울에 있는지, 아니면 여기 어딘가에 있는지 확인해 주실 수 있을까요? 지금 어디 있는지만 알아도 제가 일정을 맞춰 볼 수 있거든요.\n\n두 번째로, 내일 도착한다면 제 호텔로 보내 주실 수 있나요? 공항까지 다시 오기는 좀 어려워서요. 그리고 제 짐이 전부 그 가방에 있어서, 오늘 밤 쓸 기본 생필품에 대한 지원이 있을까요? 칫솔이나 셔츠 같은 거요. ... 있다고요? 감사합니다. 뭐든 확인되는 대로 문자로 알려 주세요.", "struct": [["1️⃣ 접근", "도움 요청 + 상황 한 줄"], ["2️⃣ 사실", "탑승편 · 대기 · 수하물 표 제시"], ["3️⃣ 요구", "① 신고 접수 + 현재 위치 확인"], ["4️⃣ 요구", "② 호텔로 배송"], ["5️⃣ 마무리", "③ 생필품 지원 + 문자 안내 요청"]], "expr": [["come off the flight", "비행기에서 내리다"], ["never came out", "끝내 나오지 않았다"], ["baggage claim", "수하물 찾는 곳"], ["a baggage tag", "수하물 표"], ["file a report", "신고를 접수하다"], ["where it is right now", "지금 어디 있는지"], ["plan around ~", "~에 맞춰 일정을 짜다"], ["deliver it to my hotel", "호텔로 보내 주다"], ["an allowance", "(비용) 지원"], ["basic necessities", "기본 생필품"], ["Please text me", "문자로 알려 주세요"]], "audio": "audio/3_롤플레이/3-050 17. 해외여행(Overseas)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-050 17. 해외여행(Overseas)_문제 해결.mp3"}, {"id": "3-051", "cat": "roleplay", "catName": "롤플레이 질문", "num": 17, "topic": "해외여행", "topicEn": "Overseas", "type": "과거 경험", "badge": "51 과거 경험", "enQ": "That's the end of the situation. Tell me about a moment on one of your vacations when things did not go as planned. Describe what the problem was and how you dealt with it. Begin with where you were and who was with you, then walk me through everything that took place.", "enA": "This was my first trip abroad — Osaka, four days, with my best friend. We had the whole thing on a spreadsheet — which train, which street, which restaurant.\n\nWhat we hadn't planned was cash. I'd brought my card and ten thousand yen, assuming cards worked everywhere. They didn't. The places we'd circled — the standing sushi bar, the market stalls — were cash only, and by the second evening we were down to a few coins. Two ATMs rejected my card.\n\nSo we asked at the hotel desk. He laughed and said the convenience store ATM takes foreign cards — the one fifty meters away. It worked on the first try. We ate at that sushi bar an hour later, and it's still the best meal I've had. Since then, I get local cash at the airport first.", "koQ": "휴가 중에 무언가 계획대로 되지 않았던 때를 말해주세요. 문제가 무엇이었고 어떻게 대처했는지, 어디에 있었고 누구와 함께였는지부터 시작해 모든 일을 설명해 주세요.", "koA": "제 첫 해외여행이었어요. 오사카로 3박 4일, 절친이랑 갔죠. 일정은 스프레드시트로 다 짜 뒀었어요. 어느 전철을 타고 어느 식당에 갈지까지요.\n\n그런데 계획에 없던 게 현금이었어요. 카드랑 만 엔만 들고 갔거든요. 카드는 어디서든 되겠지 하고요. 그런데 아니었어요. 표시해 둔 가게들, 서서 먹는 초밥집이나 시장 노점은 전부 현금만 받더라고요. 둘째 날 저녁엔 동전 몇 개밖에 없었고, ATM 두 곳은 제 카드를 아예 인식하지 못했어요.\n\n그래서 호텔 프런트에 물어봤어요. 직원분이 웃으면서 편의점 ATM은 외국 카드가 된다고 하시더라고요. 50미터 거리에 있는 그 편의점이요. 한 번에 됐어요. 한 시간 뒤에 그 초밥집에서 먹었는데, 지금도 최고의 식사로 남아 있어요. 그 후로는 공항에서 현지 돈부터 뽑아요.", "struct": [["1️⃣ 배경", "오사카 · 절친 · 첫 해외여행"], ["2️⃣ 계획", "시간 단위로 짜 둔 일정표"], ["3️⃣ 사건", "현금만 받는 가게 · 동전만 남음"], ["4️⃣ 해결", "호텔 문의 → 편의점 ATM"], ["5️⃣ 마무리", "공항에서 먼저 환전하는 규칙"]], "expr": [["my first trip abroad", "첫 해외여행"], ["on a spreadsheet", "스프레드시트로 짜 둔"], ["assuming ~", "~라고 짐작하고"], ["They didn't.", "그런데 아니었어요."], ["cash only", "현금만 받는"], ["be down to ~", "~밖에 안 남다"], ["reject my card", "카드를 인식하지 못하다"], ["the convenience store ATM", "편의점 ATM"], ["fifty meters away", "50미터 거리에"], ["on the first try", "한 번에"], ["get local cash at the airport", "공항에서 현지 돈을 뽑다"]], "audio": "audio/3_롤플레이/3-051 17. 해외여행(Overseas)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-051 17. 해외여행(Overseas)_과거 경험.mp3"}, {"id": "3-052", "cat": "roleplay", "catName": "롤플레이 질문", "num": 18, "topic": "렌트카", "topicEn": "Car Rental", "type": "정보 요청", "badge": "52 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You are spending your vacation in New York City and are now at a car rental office. You need a car, and you are talking with an employee there. Ask the employee three or four questions about renting a vehicle.", "enA": "Hi, I'd like to rent a car for four days. I'm on vacation here, and we're planning to drive upstate this weekend. Can I ask a few questions before I sign anything?\n\nFirst, what do you have available in a mid-size? ... An SUV for twenty dollars more? That might be better — we have three suitcases. And is insurance included, or is that extra? ... Extra? I'll take the full coverage, please.\n\nSecond, what's the fuel policy — do I bring it back full? ... Full to full, got it. And one last thing — can I drop it off at the airport instead of here? ... A one-way fee? How much? ... Forty dollars? That's fine. Let's go with that.", "koQ": "뉴욕에서 휴가를 보내는 중이고 지금 렌터카 사무실에 있습니다. 차가 필요한 상황에서 직원과 이야기하며 차량 대여에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 나흘 동안 차를 빌리고 싶어서요. 여기서 휴가 중인데, 이번 주말에 교외로 나가 보려고 하거든요. 계약하기 전에 몇 가지만 여쭤봐도 될까요?\n\n우선, 중형차로는 어떤 차가 있나요? ... 20달러만 더 내면 SUV가 있다고요? 그게 나을 수도 있겠네요. 캐리어가 세 개라서요. 그리고 보험은 포함인가요, 아니면 별도인가요? ... 별도요? 그럼 완전 보장으로 할게요.\n\n두 번째로, 주유 정책은 어떻게 되나요? 가득 채워서 반납하면 되나요? ... 만땅으로 받고 만땅으로 반납이요? 알겠습니다. 마지막으로 하나만, 여기 말고 공항에서 반납해도 되나요? ... 편도 수수료가 붙는다고요? 얼마인가요? ... 40달러요? 괜찮네요. 그렇게 할게요.", "struct": [["1️⃣ 인사", "대여 기간 + 사용 목적"], ["2️⃣ 질문", "① 차종 → 짐 조건"], ["3️⃣ 질문", "② 보험 포함 여부"], ["4️⃣ 질문", "③ 주유 정책"], ["5️⃣ 마무리", "④ 공항 반납 + 수수료 확인"]], "expr": [["rent a car", "차를 빌리다"], ["drive upstate", "교외로 차를 몰고 가다"], ["What do you have available?", "어떤 차가 있나요?"], ["a mid-size", "중형차"], ["Is insurance included?", "보험은 포함인가요?"], ["extra", "별도인"], ["the full coverage", "완전 보장 보험"], ["the fuel policy", "주유 정책"], ["full to full", "만땅 받고 만땅 반납"], ["drop it off", "반납하다"], ["a one-way fee", "편도 반납 수수료"]], "audio": "audio/3_롤플레이/3-052 18. 렌트카(Car Rental)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-052 18. 렌트카(Car Rental)_정보 요청.mp3"}, {"id": "3-053", "cat": "roleplay", "catName": "롤플레이 질문", "num": 18, "topic": "렌트카", "topicEn": "Car Rental", "type": "문제 해결", "badge": "53 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You may not be able to rent a car since you have neither an international driver's license nor an American one. Explain what your license says and offer two or three alternatives so you can still rent a car.", "enA": "I see — so without an international permit you can't hand me the keys. That's my mistake — I didn't know I needed one before I left. Let me tell you what my license says, and then maybe we can find a way.\n\nIt's a Korean driver's license, class two, valid until 2031. The front has my photo, my name in English, and the number. And the back has an English translation printed on it — here, you can see.\n\nSo, a few ideas. First, could you accept it with my passport as a second ID? Second, my friend has a valid international permit — could we put the rental in her name and add me as an additional driver? Or, if neither works, could you hold the car until tomorrow while I sort out the paperwork?", "koQ": "국제 면허증도 미국 면허증도 없어서 차를 빌리지 못할 수도 있습니다. 당신의 면허증에 무엇이 적혀 있는지 설명하고, 그래도 차를 빌릴 수 있도록 2~3가지 대안을 제안해 보세요.", "koA": "아, 그러니까 국제운전면허증이 없으면 차 키를 주실 수 없다는 말씀이시죠. 제 잘못이에요. 출국 전에 발급받아야 하는 줄 몰랐거든요. 제 면허증에 뭐라고 적혀 있는지 말씀드릴 테니, 방법이 있는지 같이 찾아봐 주시겠어요?\n\n한국 운전면허증이고, 2종이고, 2031년까지 유효해요. 앞면에는 제 사진과 영문 이름, 번호가 있고요. 뒷면에는 영문 번역이 인쇄되어 있어요. 여기, 보시면 나와 있습니다.\n\n그래서 몇 가지 제안을 드리고 싶어요. 우선, 여권을 보조 신분증으로 함께 제출하면 인정해 주실 수 있을까요? 두 번째로, 제 친구는 국제면허증이 유효해요. 대여를 친구 명의로 하고 저를 추가 운전자로 넣는 건 어떨까요? 둘 다 안 된다면, 제가 서류를 처리하는 동안 내일까지 차를 잡아 주실 수 있을까요?", "struct": [["1️⃣ 인정", "내 실수 인정 + 대화 열기"], ["2️⃣ 설명", "면허 종류 · 유효기간 · 영문 표기"], ["3️⃣ 대안", "① 여권을 보조 신분증으로"], ["4️⃣ 대안", "② 친구 명의 + 추가 운전자"], ["5️⃣ 마무리", "③ 내일까지 차량 보류 요청"]], "expr": [["an international permit", "국제운전면허증"], ["before I left", "출국 전에"], ["what my license says", "면허증에 뭐라고 적혀 있는지"], ["class two", "2종"], ["valid until ~", "~까지 유효한"], ["in English", "영문으로"], ["an English translation", "영문 번역"], ["as a second ID", "보조 신분증으로"], ["in her name", "그 친구 명의로"], ["an additional driver", "추가 운전자"], ["hold the car", "차를 잡아 두다"]], "audio": "audio/3_롤플레이/3-053 18. 렌트카(Car Rental)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-053 18. 렌트카(Car Rental)_문제 해결.mp3"}, {"id": "3-054", "cat": "roleplay", "catName": "롤플레이 질문", "num": 18, "topic": "렌트카", "topicEn": "Car Rental", "type": "과거 경험", "badge": "54 과거 경험", "enQ": "That's the end of the situation. Have you ever rented a car on a trip? Why did you need to rent one? Did anything wild or terrible take place? What happened, and how did you resolve it? What makes the experience stick in your memory?", "enA": "Yes — Jeju, three years ago, with my best friend. We rented a car because the island is all coastal roads and the buses take forever.\n\nDay two, halfway around the west coast, we heard a noise and the car started pulling to one side. A flat tire. We opened the trunk for the spare — and there wasn't one. No spare, no jack, nothing. In the middle of nowhere, sea on one side, a field on the other.\n\nSo I called the roadside assistance number on the key ring. They said an hour and forty minutes. We bought coffee from a machine and sat on the wall watching the water. The man who came fixed it in ten minutes and told us where to eat. Since then, I check the trunk before I drive off.", "koQ": "여행을 위해 차를 렌트한 적이 있나요? 왜 렌트했고, 황당하거나 끔찍한 일이 있었나요? 무슨 일이 있었고 어떻게 해결했으며, 왜 그 경험이 기억에 남나요?", "koA": "네, 3년 전에 제주도에서요. 절친이랑 갔었어요. 섬이 전부 해안도로라 버스로는 한참 걸리거든요. 그래서 차를 빌렸죠.\n\n둘째 날, 서쪽 해안을 반쯤 돌았을 때였어요. 소리가 나더니 차가 한쪽으로 쏠리기 시작했어요. 타이어가 펑크 난 거였죠. 스페어를 꺼내려고 트렁크를 열었는데, 없더라고요. 스페어도, 잭도, 아무것도요. 한쪽은 바다, 한쪽은 밭인 허허벌판 한가운데에서요.\n\n그래서 키링에 적힌 긴급출동 번호로 전화했어요. 1시간 40분 걸린다고 하더라고요. 저희는 자판기 커피를 뽑아서 담벼락에 앉아 바다를 봤어요. 오신 기사님은 10분 만에 고쳐 주시고 어디서 먹으면 좋은지까지 알려 주셨고요. 그 후로는 출발하기 전에 트렁크부터 확인해요.", "struct": [["1️⃣ 이유", "해안도로 · 버스로는 무리"], ["2️⃣ 배경", "제주 · 절친 · 3년 전"], ["3️⃣ 사건", "서쪽 해안도로에서 펑크"], ["4️⃣ 절정", "스페어 없음 · 허허벌판"], ["5️⃣ 마무리", "긴급출동 10분 해결 + 트렁크 확인"]], "expr": [["coastal roads", "해안도로"], ["take forever", "한참 걸리다"], ["the car started pulling", "차가 한쪽으로 쏠리다"], ["a flat tire", "펑크 난 타이어"], ["the spare", "스페어 타이어"], ["in the middle of nowhere", "허허벌판 한가운데"], ["roadside assistance", "긴급출동 서비스"], ["an hour and forty minutes", "1시간 40분"], ["sit on the wall", "담벼락에 앉다"], ["fix it in ten minutes", "10분 만에 고치다"], ["check the trunk", "트렁크를 확인하다"]], "audio": "audio/3_롤플레이/3-054 18. 렌트카(Car Rental)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-054 18. 렌트카(Car Rental)_과거 경험.mp3"}, {"id": "3-055", "cat": "roleplay", "catName": "롤플레이 질문", "num": 19, "topic": "교통수단", "topicEn": "Transport", "type": "정보 요청", "badge": "55 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are organizing a weekend trip to a city nearby and would like to compare ways of getting there. Call the local travel information center and ask three or four questions to help you choose how to travel.", "enA": "Hi, is this the travel information center? I'm planning a weekend trip to Gyeongju next month, and I can't decide how to get there. Could you help me compare a few options?\n\nFirst, how long does the KTX take from Seoul, and how much is it one way? ... Two hours, about fifty thousand won? Okay. And what about the express bus? ... Four hours for half the price? That's the trade-off, then.\n\nSecond, which one would you recommend for a Saturday morning? ... The train sells out early? Good to know. And one last thing — once I'm there, how do I get around? Is it walkable, or should I rent a bike? ... Bike rental at the station? That settles it. Thank you!", "koQ": "근처 도시로 주말 여행을 계획 중이고 교통편을 비교해 보고 싶습니다. 지역 여행 안내 센터에 전화해 이동 방법을 정하는 데 도움이 될 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 여행 안내 센터 맞나요? 다음 달에 경주로 주말 여행을 가려고 하는데, 어떻게 갈지 결정을 못 하겠어서요. 몇 가지 비교 좀 도와주실 수 있을까요?\n\n우선, 서울에서 KTX로는 얼마나 걸리나요? 그리고 편도 요금은 얼마인가요? ... 두 시간에 5만 원 정도요? 알겠습니다. 그럼 고속버스는 어떤가요? ... 네 시간에 값은 절반이요? 그럼 그게 맞바꿈이네요.\n\n두 번째로, 토요일 아침이면 어느 쪽을 추천하시나요? ... 기차는 일찍 매진된다고요? 알아 둘게요. 마지막으로 하나만, 도착하면 현지에서는 어떻게 이동하나요? 걸어 다닐 만한가요, 아니면 자전거를 빌리는 게 나을까요? ... 역에서 자전거를 빌릴 수 있다고요? 그럼 정했어요. 감사합니다!", "struct": [["1️⃣ 인사", "안내센터 확인 + 비교 요청"], ["2️⃣ 질문", "① KTX 소요 시간·요금"], ["3️⃣ 질문", "② 고속버스와 비교"], ["4️⃣ 질문", "③ 토요일 아침 추천"], ["5️⃣ 마무리", "④ 현지 이동 수단 + 결정"]], "expr": [["how to get there", "어떻게 갈지"], ["compare a few options", "몇 가지를 비교하다"], ["How long does it take?", "얼마나 걸리나요?"], ["one way", "편도로"], ["What about ~?", "~는 어떤가요?"], ["the express bus", "고속버스"], ["That's the trade-off", "그게 맞바꿈이네요"], ["Which would you recommend?", "어느 쪽을 추천하세요?"], ["sell out early", "일찍 매진되다"], ["get around", "돌아다니다, 이동하다"], ["That settles it.", "그럼 정했어요."]], "audio": "audio/3_롤플레이/3-055 19. 교통수단(Transport)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-055 19. 교통수단(Transport)_정보 요청.mp3"}, {"id": "3-056", "cat": "roleplay", "catName": "롤플레이 질문", "num": 19, "topic": "교통수단", "topicEn": "Transport", "type": "문제 해결", "badge": "56 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. You are at the bus terminal, but your bus has been delayed for over an hour. Speak with the staff, describe your situation, and offer two or three possible ways to handle it.", "enA": "Excuse me — I'm on the ten-thirty bus to Gangneung, and the board still says delayed. It's been over an hour now. Could you tell me what's actually going on? ... An accident on the highway? I see.\n\nHere's my situation: I'm meeting someone there at three, and at this rate I won't make it. So I was wondering — is there another company running the same route soon? I'd take a later seat with them if you could transfer my ticket.\n\nIf that's not possible, could you check the train from the station next door? I'd pay the difference and refund this one. Or, at the very least, could you tell me when it will actually leave, so I can give them a real time? Whichever you can do — I just need something solid.", "koQ": "버스 터미널에 있는데 타야 할 버스가 1시간 넘게 지연되고 있습니다. 직원에게 상황을 설명하고, 가능한 해결책을 2~3가지 제안해 보세요.", "koA": "실례합니다. 제가 강릉 가는 10시 30분 버스인데요, 전광판에는 아직도 지연이라고만 떠 있어요. 벌써 한 시간이 넘었고요. 정확히 무슨 일인지 알려 주실 수 있을까요? ... 고속도로에서 사고가 났다고요? 그렇군요.\n\n제 사정은 이래요. 거기서 세 시에 사람을 만나기로 했는데, 이대로 가면 못 맞출 것 같아요. 그래서 여쭤보는데요, 같은 노선을 곧 운행하는 다른 회사가 있나요? 표를 그쪽으로 넘겨 주실 수 있다면 더 늦은 차편이라도 타겠습니다.\n\n그게 안 된다면, 옆 역에서 출발하는 기차를 확인해 주실 수 있을까요? 차액은 제가 내고 이 표는 환불받을게요. 아니면 최소한 실제 출발 시각만이라도 알려 주세요. 그래야 제가 전화해서 정확한 시간을 말해 줄 수 있으니까요. 되는 쪽으로 해 주세요. 확실한 게 하나는 필요해서요.", "struct": [["1️⃣ 확인", "편명 · 지연 시간 · 사유 확인"], ["2️⃣ 사정", "세 시 약속 · 이대로면 지각"], ["3️⃣ 대안", "① 다른 회사로 표 이관"], ["4️⃣ 대안", "② 옆 역 기차 + 차액·환불"], ["5️⃣ 마무리", "③ 최소한 실제 출발 시각 확보"]], "expr": [["the ten-thirty bus", "10시 30분 버스"], ["over an hour", "한 시간 넘게"], ["What's actually going on?", "정확히 무슨 일인가요?"], ["at this rate", "이대로 가면"], ["So I was wondering", "그래서 여쭤보는데요"], ["another company", "다른 회사"], ["transfer my ticket", "표를 넘겨 주다"], ["pay the difference", "차액을 내다"], ["refund this one",
