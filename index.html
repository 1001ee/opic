ay, coffee street in the evening. Classic summer plan.\n\nOn the second morning, a typhoon was moving up the coast. The beach was closed off by nine, the wind was bending the pine trees, and then the app told us our train home had been cancelled. We were standing in the lobby with our bags, nowhere to be.\n\nSo I called the front desk and begged for one more night. They had one room left, a small one, and we took it. We spent the whole day cafe-hopping in the rain, and that's how I found my favorite cafe in the city. Since then, I check the typhoon path before I book anything in August.", "koQ": "예상치 못한 날씨 때문에 곤란을 겪은 적이 있나요? 무슨 일이 있었고 누구와 함께였나요? 그 상황을 어떻게 해결했나요? 날씨 때문에 일어난 모든 일을 말해주세요.", "koA": "작년 8월 강릉이었어요. 절친이랑 2박으로 갔었죠. 낮에는 바다, 저녁에는 커피 거리. 여름 여행의 정석이었어요.\n\n그런데 둘째 날 아침에 태풍이 해안을 따라 북상 중이라고 하더라고요. 아홉 시에는 해변이 전면 통제됐고, 바람에 소나무가 휘청거렸어요. 그러더니 앱에서 돌아가는 기차가 결항됐다고 알려 주는 거예요. 저희는 가방을 든 채 로비에 서 있었어요. 갈 데가 없었죠.\n\n그래서 프런트에 전화해서 하루만 더 묵게 해 달라고 사정했어요. 마침 작은 방이 하나 남아 있어서 바로 잡았고요. 그날은 비를 맞으며 하루 종일 카페 순례를 했는데, 그러다 제 최애 카페를 찾았어요. 그 후로는 8월에 뭘 예약하기 전에 태풍 경로부터 확인해요.", "struct": [["1️⃣ 배경", "작년 8월 강릉 · 절친 · 2박"], ["2️⃣ 사건", "태풍 북상 · 해변 전면 통제"], ["3️⃣ 절정", "기차 결항 · 로비에서 갈 곳 없음"], ["4️⃣ 해결", "프런트에 부탁 → 남은 방 하나"], ["5️⃣ 마무리", "카페 순례 + 태풍 경로 확인 습관"]], "scoring": [["네 질문 회수", "무슨 일 · 누구와 · 어떻게 헤쳐 나갔나 · 결과까지, 문제가 네 가지를 물어요. 단락마다 하나씩 맡기면 됩니다 ✅"], ["소재 겹침 피하기", "돌발 날씨 편이 폭설 퇴근길이었으니 여기는 태풍 여행으로 갈랐어요 🔁 같은 주제라도 날씨 종류를 매번 바꿔 주세요"], ["바람을 그림으로", "소나무가 휘었다는 한 줄이 바람이 셌다는 형용사보다 훨씬 세게 들려요 🔥 날씨는 형용사 말고 움직인 것으로 보여 주세요"], ["망한 날의 반전", "그 덕에 최애 카페를 찾았다는 반전이 마무리를 살려 줘요 ☕ 고생담은 마지막 한 줄에서 뒤집으면 기억에 남습니다"]], "expr": [["coffee street", "커피 거리", "서베이 해변 편 재활용 🔁 ☕"], ["Classic summer plan", "여름 여행의 정석", "배경을 한 마디로 요약 ✨"], ["a typhoon was moving up", "태풍이 북상 중이었다", "기상 상황 묘사 필수 표현 🔑"], ["be closed off", "통제되다", "해변 폐쇄를 말하는 수동태 📏"], ["bend the pine trees", "소나무를 휘게 하다", "바람 세기를 그림으로 🔥"], ["be cancelled", "결항되다, 취소되다", "사건을 알리는 수동태 ✅"], ["nowhere to be", "갈 데가 없는", "막막함을 압축한 표현 😆"], ["beg for one more night", "하루만 더 묵게 해 달라고 하다", "해결 행동의 동사 💪"], ["one room left", "남은 방 하나", "아슬아슬함을 숫자로 📏"], ["cafe-hopping", "카페 순례", "비 오는 날의 해결책 ☕"], ["check the typhoon path", "태풍 경로를 확인하다", "습관 마무리의 행동 ⏰"]], "audio": "audio/3_롤플레이/3-063 21. 날씨(Weather)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-063 21. 날씨(Weather)_과거 경험.mp3"}, {"id": "3-064", "cat": "roleplay", "catName": "롤플레이 질문", "num": 22, "topic": "병원 예약", "topicEn": "Appointment", "type": "정보 요청", "badge": "64 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You need to schedule a visit to the doctor. Call the doctor's office and ask three or four questions to set up an appointment.", "enA": "Hi, is this the clinic near the station? I'd like to book a check-up — just the annual one. I've never been to your clinic before, so can I ask a few questions first? I'd rather not turn up unprepared.\n\nFirst, what times do you have next week? I work weekdays, so ideally early morning or a Saturday. ... Saturdays until noon, and eight a.m. on weekdays? I'll take a weekday slot, then — I'd rather get it over with before work.\n\nSecond, do I need to fast beforehand? ... From ten the night before? Good to know. And how long does it take in total? ... About an hour? That's manageable. One last thing — is it covered by insurance, or do I pay out of pocket? ... Partly covered? Fine. Let's book Thursday the twelfth, eight in the morning.", "koQ": "병원 예약을 하려고 합니다. 병원에 전화해 예약을 잡기 위한 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 역 근처에 있는 병원 맞나요? 건강검진을 예약하고 싶어서요. 해마다 받는 기본 검진으로요. 제가 이 병원은 처음이라, 몇 가지만 먼저 여쭤봐도 될까요? 아무것도 모르고 가고 싶지는 않아서요.\n\n우선, 다음 주에는 어떤 시간대가 되나요? 제가 평일에 일을 해서 이른 아침이나 토요일이면 좋거든요. ... 토요일은 정오까지, 평일은 오전 8시도 된다고요? 그럼 평일로 할게요. 출근 전에 해치우는 게 편해서요.\n\n두 번째로, 금식을 해야 하나요? ... 전날 밤 10시부터요? 알아 둘게요. 그리고 전체적으로 얼마나 걸리나요? ... 한 시간이요? 그 정도면 괜찮네요. 마지막으로 하나만, 보험이 적용되나요, 아니면 자비로 내야 하나요? ... 일부 적용이요? 좋아요. 그럼 12일 목요일 아침 여덟 시로 예약할게요.", "struct": [["1️⃣ 인사", "병원 확인 + 검진 예약 의사"], ["2️⃣ 질문", "① 다음 주 예약 가능 시간대"], ["3️⃣ 질문", "② 검진 전 금식 여부"], ["4️⃣ 질문", "③ 총 소요 시간"], ["5️⃣ 마무리", "④ 보험 적용 + 날짜 확정"]], "scoring": [["첫 방문 밝히기", "이 병원은 처음이라는 한 줄이 네 가지 질문 전부에 명분을 만들어 줘요 ✅ 단골이면 물을 필요가 없는 것들이니까요"], ["직장인 조건", "평일에 일한다는 조건을 깔면 이른 아침이냐 토요일이냐로 질문이 저절로 좁혀져요 ⏰ 조건 없는 질문은 돌아오는 답도 두루뭉술합니다"], ["병원만의 질문", "금식 여부와 보험 적용은 병원에서만 나오는 질문이에요 🔑 주제에 딱 맞는 질문 두 개면 준비된 답변으로 들립니다"], ["날짜로 닫기", "12일 목요일로 하겠다며 날짜를 확정하고 끝내야 상황이 해결돼요 ✅ 질문만 하고 끊으면 미완성 답변이 됩니다"]], "expr": [["book a check-up", "건강검진을 예약하다", "병원 예약의 핵심 동사 ✅"], ["the annual one", "해마다 받는 그것", "검진 종류를 짧게 특정 📏"], ["Can I ask a few questions?", "몇 가지 여쭤봐도 될까요?", "질문 시작을 알리는 신호 🔁 🔑"], ["What times do you have?", "어떤 시간대가 되나요?", "예약 문의 1번 질문 ⏰"], ["early morning", "이른 아침", "직장인 예약 조건 어휘 ⏰"], ["fast beforehand", "미리 금식하다", "검진 전 준비 필수 동사 🔑"], ["from ten the night before", "전날 밤 10시부터", "시점을 못 박는 표현 📏"], ["How long does it take?", "얼마나 걸리나요?", "롤플레이 교통 편 재활용 🔁 ⏰"], ["manageable", "감당할 만한", "부담 정도를 말하는 형용사 ✨"], ["be covered by insurance", "보험이 적용되다", "비용 질문의 정답 표현 💳"], ["out of pocket", "자비로", "보험과 짝을 이루는 표현 💳"]], "audio": "audio/3_롤플레이/3-064 22. 병원 예약(Appointment)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-064 22. 병원 예약(Appointment)_정보 요청.mp3"}, {"id": "3-065", "cat": "roleplay", "catName": "롤플레이 질문", "num": 22, "topic": "병원 예약", "topicEn": "Appointment", "type": "문제 해결", "badge": "65 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You had an appointment scheduled with your doctor, but something has come up and you cannot go. Call the office, describe your situation, and ask two or three questions to move the appointment.", "enA": "Hi, this is about my appointment on Thursday at eight — the check-up. Something's come up at work: a client meeting got moved onto that exact morning, and I can't get out of it. I'd like to move the appointment, so I have a few questions.\n\nFirst, what's your earliest opening next week? ... Tuesday and Friday? Could I take the eight a.m. slot on Friday? I can be in and out before work starts, and the clinic is on my way anyway.\n\nSecond, is there a cancellation fee if I change it this late? ... Only within twenty-four hours? Good, I'm outside that. And one last thing — could you put me on a waiting list in case something opens sooner? ... You'll text me? Thank you, that's very helpful. I'll keep my phone on.", "koQ": "병원 예약이 되어 있는데 일이 생겨 갈 수 없습니다. 병원에 전화해 상황을 설명하고, 예약을 옮기기 위해 2~3가지 질문을 해보세요.", "koA": "안녕하세요, 목요일 여덟 시 제 예약 건으로 전화드렸어요. 건강검진이요. 회사에 일이 생겼는데, 고객 미팅이 하필 그날 아침으로 옮겨졌어요. 빠질 수가 없는 자리라서요. 예약을 옮기고 싶은데 몇 가지만 여쭤볼게요.\n\n우선, 다음 주에 가장 빠른 자리가 언제인가요? ... 화요일이랑 금요일이요? 금요일 오전 8시 자리로 할 수 있을까요? 출근 전에 잠깐 들렀다 나올 수 있을 것 같아서요. 어차피 출근길에 있기도 하고요.\n\n두 번째로, 이렇게 임박해서 바꾸면 취소 수수료가 있나요? ... 24시간 이내일 때만이요? 다행이네요, 저는 해당이 안 되겠어요. 마지막으로 하나만, 더 빨리 자리가 나면 대기자 명단에 올려 주실 수 있을까요? ... 문자를 주신다고요? 감사합니다. 정말 도움이 됐어요. 전화 켜 두고 있을게요.", "struct": [["1️⃣ 확인", "예약 건 특정 + 변경 의사"], ["2️⃣ 사유", "고객 미팅이 그 시간으로 이동"], ["3️⃣ 질문", "① 다음 주 가장 빠른 자리"], ["4️⃣ 질문", "② 취소 수수료 여부"], ["5️⃣ 마무리", "③ 대기자 명단 요청 + 감사"]], "scoring": [["제안 말고 질문", "문제가 ask two or three questions라고 지정했어요. 대안을 제시하는 게 아니라 전부 의문문으로 만들어야 요구에 맞습니다 ✅"], ["예약부터 특정", "목요일 아홉 시 검진이라고 먼저 말해야 상대가 기록을 찾을 수 있어요 ⏰ 병원이나 매장 통화는 시각부터 대는 게 기본입니다"], ["수수료 확인", "취소 수수료를 묻는 질문 하나가 답변을 현실적으로 만들어 줘요 💳 실제로 전화하면 반드시 나오는 대목이거든요"], ["대기자 명단", "더 빨리 자리가 나면 연락 달라는 마지막 질문이 적극적인 인상을 줍니다 🔁 여가 편에서도 쓴 한 수 위의 마무리예요"]], "expr": [["my appointment on ~", "~에 있는 제 예약", "예약 건을 특정하는 표현 ⏰"], ["Something's come up", "일이 좀 생겼어요", "문제 속 표현 그대로 회수 ✅"], ["get moved onto ~", "~로 옮겨지다", "일정 충돌을 설명하는 수동태 🔑"], ["can't get out of it", "빠질 수가 없다", "롤플레이 콘서트 편 재활용 🔁 💪"], ["move the appointment", "예약을 옮기다", "이 문제의 핵심 동사 🔑"], ["your earliest opening", "가장 빠른 빈 자리", "재예약 질문 1순위 ⏰"], ["the eight a.m. slot", "오전 8시 자리", "시간대를 부르는 명사 📏"], ["in and out", "잠깐 들렀다 나오는", "짧게 끝낸다는 관용구 ✨"], ["a cancellation fee", "취소 수수료", "변경 조건 필수 질문 💳"], ["put me on a waiting list", "대기자 명단에 올려 주다", "롤플레이 여가 편 재활용 🔁 ✅"], ["That's very helpful", "정말 도움이 됐어요", "감사 리액션 한 단계 위 😊"]], "audio": "audio/3_롤플레이/3-065 22. 병원 예약(Appointment)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-065 22. 병원 예약(Appointment)_문제 해결.mp3"}, {"id": "3-066", "cat": "roleplay", "catName": "롤플레이 질문", "num": 22, "topic": "병원 예약", "topicEn": "Appointment", "type": "과거 경험", "badge": "66 과거 경험", "enQ": "That's the end of the situation. Describe a time you had to call off an appointment for some reason. What happened, and why did you need to cancel? How did you manage the situation?", "enA": "This reminds me of the day I had an internet installation booked. I'd just moved in, the engineer was coming on a Wednesday afternoon, and I'd taken a half day off work for it.\n\nThat morning, my team lead told me a client was coming in at two, and my half day was gone. I called the provider from the stairwell and cancelled three hours before. The woman was kind about it — and then she told me the next slot was ten days away.\n\nTen days with no internet. So I asked if there was anything on a weekend, and it turned out they do Saturday installations — just not on the booking page. I took the following Saturday and lived off my phone's hotspot until then. Since then, I book every installation on a Saturday, no exceptions.", "koQ": "어떤 이유로 예약을 취소해야 했던 경험을 말해주세요. 무슨 일이 있었고 왜 취소해야 했나요? 그 상황을 어떻게 해결했나요?", "koA": "인터넷 설치를 예약해 둔 날이 생각나네요. 막 이사를 한 참이었고, 수요일 오후에 기사님이 오시기로 해서 그날 반차까지 써 뒀었어요.\n\n그런데 그날 아침에 팀장님이 두 시에 고객이 온다고 하시는 거예요. 반차가 그대로 날아갔죠. 저는 비상계단에서 통신사에 전화해서 세 시간 전에 취소했어요. 상담사분은 이해해 주셨고요. 그런데 다음 가능한 자리가 열흘 뒤라고 하시더라고요.\n\n열흘 동안 인터넷 없이요. 그래서 혹시 주말에 되는 거라도 있냐고 물어봤더니, 토요일 설치를 하긴 하는데 예약 페이지에는 안 올라온다는 거예요. 저는 바로 다음 토요일로 잡았고, 그때까지는 휴대폰 핫스팟으로 버텼어요. 그 후로는 설치 예약은 무조건 토요일로 잡아요. 예외 없이요.", "struct": [["1️⃣ 도입", "이사 후 인터넷 설치 예약 · 반차"], ["2️⃣ 사건", "당일 아침 반차가 취소됨"], ["3️⃣ 절정", "세 시간 전 취소 → 다음 자리 열흘 뒤"], ["4️⃣ 해결", "주말 설치 옵션을 직접 물어 확보"], ["5️⃣ 마무리", "핫스팟으로 버팀 + 토요일 규칙"]], "scoring": [["왜 취소했는지", "문제가 why did you need to cancel을 따로 물어요. 반차가 취소됐다는 이유를 한 문장으로 못 박으세요 ✅"], ["병원 밖 소재", "appointment는 병원만 뜻하는 게 아니에요 🔁 23번 ③이 병원 예약 취소를 맡고 있어서 여기는 설치 기사 방문으로 갈랐습니다"], ["물어봐서 해결", "주말에 되는 게 있냐고 물어본 덕에 숨은 옵션을 찾았다는 전개가 how did you manage의 정확한 답이에요 💪"], ["규칙으로 닫기", "이제는 설치 예약을 무조건 토요일로 잡는다는 마무리가 Since then 공식을 완성해 줍니다 ✨ 다음엔 이러겠다가 아니라 지금도 지키는 규칙으로 말하세요"]], "expr": [["an internet installation", "인터넷 설치", "돌발 인터넷 편 연결 🔁 🔑"], ["take a half day off", "반차를 쓰다", "직장인 필수 표현 ⏰"], ["My half day was gone", "반차가 날아갔어요", "상황 반전을 한 문장으로 😆"], ["cancel three hours before", "세 시간 전에 취소하다", "막판 취소를 숫자로 📏"], ["be kind about it", "이해해 주다", "상대 반응을 짧게 전하는 표현 💕"], ["the next slot", "다음 가능한 자리", "재예약의 핵심 명사 ⏰"], ["ten days away", "열흘 뒤인", "기다림을 숫자로 📏"], ["anything on a weekend", "주말에 되는 거라도", "대안을 찾아내는 질문 ✅"], ["not on the booking page", "예약 페이지에는 없는", "숨은 옵션을 설명하는 구문 🧩"], ["live off ~", "~으로 버티다", "임시 방편을 말하는 구동사 💪"], ["no exceptions", "예외 없이", "돌발 건강 편 재활용 🔁 ✨"]], "audio": "audio/3_롤플레이/3-066 22. 병원 예약(Appointment)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-066 22. 병원 예약(Appointment)_과거 경험.mp3"}, {"id": "3-067", "cat": "roleplay", "catName": "롤플레이 질문", "num": 23, "topic": "예약 변경", "topicEn": "Rescheduling", "type": "정보 요청", "badge": "67 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You would like to schedule a doctor's appointment. Call the doctor's office, describe your situation, and ask three or four questions about setting up the visit.", "enA": "Hi, is this the family clinic on the second floor? I'd like to see a doctor, hopefully today. I've had a sore throat since yesterday and it's gotten worse — I could barely talk in this morning's meeting. Can I ask a few things?\n\nFirst, do you take walk-ins, or is it appointment only? ... Walk-ins if there's room? And how long is the wait right now? ... About forty minutes? That's fine, I'd rather wait than leave it another day.\n\nSecond, when do you stop taking patients in the evening? I finish work at six. ... Last registration at seven? I can make that. And one last thing — what should I bring? Just my ID and insurance card? ... That's it? Good, that's easy. I'll see you around six thirty, then.", "koQ": "병원 예약을 하고 싶습니다. 병원에 전화해 상황을 설명하고, 예약을 잡기 위해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 2층에 있는 가정의학과 맞나요? 오늘 중으로 진료를 받고 싶어서요. 어제부터 목이 아팠는데 더 심해졌어요. 오늘 아침 회의 때는 말도 겨우 했고요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 예약 없이 가도 되나요, 아니면 예약제로만 운영하시나요? ... 자리가 있으면 바로 볼 수 있다고요? 그럼 지금 대기는 얼마나 되나요? ... 40분쯤이요? 그 정도면 괜찮아요. 하루 더 두느니 기다리는 게 낫죠.\n\n두 번째로, 저녁에는 접수를 몇 시까지 받으시나요? 제가 여섯 시에 퇴근하거든요. ... 접수 마감이 일곱 시요? 그건 맞출 수 있겠네요. 마지막으로 하나만, 뭘 가져가면 되나요? 신분증이랑 보험증만 있으면 될까요? ... 그거면 된다고요? 간단하네요. 그럼 여섯 시 반쯤에 갈게요.", "struct": [["1️⃣ 인사", "병원 확인 + 오늘 진료 희망"], ["2️⃣ 질문", "① 예약 없이 가능한지"], ["3️⃣ 질문", "② 현재 대기 시간"], ["4️⃣ 질문", "③ 저녁 접수 마감 시각"], ["5️⃣ 마무리", "④ 준비물 + 방문 시각 확정"]], "scoring": [["22번과 구분", "같은 병원 예약이지만 22번은 미리 잡는 건강검진, 여기는 오늘 당장 가는 진료예요 🔁 상황이 다르면 질문도 달라집니다"], ["증상 한 줄", "어제부터 아팠고 심해졌다는 한 줄이 오늘 가야 하는 이유를 만들어 줘요 📏 describe your situation 요구를 여기서 회수합니다"], ["실전형 질문", "예약 없이 되나요, 접수는 몇 시까지인가요는 실제로 전화하면 꼭 묻는 것들이에요 🔑 교과서 질문보다 점수가 잘 나옵니다"], ["시각으로 닫기", "여섯 시 반쯤 가겠다고 시각을 못 박으면 통화가 예약처럼 마무리돼요 ⏰ 감사 인사만 하고 끊으면 예약이 잡혔는지 채점자가 알 수 없습니다"]], "expr": [["see a doctor", "진료를 받다", "병원 방문의 기본 동사 ✅"], ["a sore throat", "목이 아픈 것", "증상을 말하는 필수 명사 🔑"], ["get worse", "더 나빠지다", "상태 변화를 말하는 구동사 📏"], ["Do you take walk-ins?", "예약 없이 가도 되나요?", "병원 문의 실전 질문 🔑"], ["appointment only", "예약제로만", "walk-in과 짝을 이루는 표현 ✨"], ["How long is the wait?", "대기가 얼마나 되나요?", "대기 시간 질문 기본형 ⏰"], ["stop taking patients", "접수를 마감하다", "마감 시각 질문의 핵심 동사 ⏰"], ["last registration", "접수 마감", "시간을 부르는 명사 📏"], ["What should I bring?", "뭘 가져가면 되나요?", "준비물 질문 기본형 ✅"], ["insurance card", "보험증", "병원 준비물 필수 명사 💳"], ["I'll see you around ~", "~쯤에 갈게요", "방문 시각을 못 박는 마무리 ⏰"]], "audio": "audio/3_롤플레이/3-067 23. 예약 변경(Rescheduling)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-067 23. 예약 변경(Rescheduling)_정보 요청.mp3"}, {"id": "3-068", "cat": "roleplay", "catName": "롤플레이 질문", "num": 23, "topic": "예약 변경", "topicEn": "Rescheduling", "type": "문제 해결", "badge": "68 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You scheduled an appointment with your doctor, but something has come up and you cannot make it. Call the office, explain why, and ask a few questions to set a new date.", "enA": "Hi, I have an appointment this Friday with Dr. Kim, and unfortunately I can't make it. I've just been put on a two-week business trip — I fly out Thursday night and I'm back on the twentieth. I only found out this morning.\n\nSo I'd like to set a new date, and I have a couple of questions. First, what's open the week I get back? ... The twenty-second or the twenty-fourth? Could I take the later one, in the afternoon?\n\nSecond, my prescription runs out next week. Is there any way to extend it without coming in — a phone consultation, maybe? ... You can issue it once? That would really help. And should I confirm again when I land? ... I'll call on the twenty-first. Thank you.", "koQ": "병원 예약을 했는데 일이 생겨 갈 수 없게 되었습니다. 병원에 전화해 이유를 설명하고, 새 날짜를 잡기 위해 몇 가지 질문을 해보세요.", "koA": "안녕하세요, 이번 주 금요일에 김 선생님 진료 예약이 있는데요, 아쉽게도 못 갈 것 같아서요. 방금 2주짜리 출장이 잡혔거든요. 목요일 밤에 출국해서 20일에 돌아옵니다. 저도 오늘 아침에야 알았어요.\n\n그래서 새 날짜를 잡고 싶은데, 몇 가지만 여쭤볼게요. 우선, 제가 돌아오는 주에는 언제 자리가 있나요? ... 22일이나 24일이요? 더 늦은 쪽으로, 오후 시간에 할 수 있을까요?\n\n두 번째로, 제 처방약이 다음 주면 떨어지는데요. 병원에 오지 않고 연장할 방법이 있을까요? 전화 진료 같은 걸로요. ... 한 번은 발행해 주실 수 있다고요? 그러면 정말 도움이 되겠어요. 그리고 돌아오면 확인 연락을 드릴까요? ... 21일에 전화드릴게요. 정리해 주셔서 감사합니다.", "struct": [["1️⃣ 통보", "금요일 예약 불참 알림"], ["2️⃣ 사유", "2주 출장 · 목요일 출국"], ["3️⃣ 질문", "① 복귀 주에 자리가 있는지"], ["4️⃣ 질문", "② 처방 연장 가능한지"], ["5️⃣ 마무리", "③ 확인 연락 시점 + 감사"]], "scoring": [["사유가 다르다", "22번은 회의가 겹쳐 며칠 뒤로 옮기는 상황, 여기는 2주 자리를 비우는 출장이에요 🔁 부재 기간이 길면 질문의 성격도 달라집니다"], ["기간을 숫자로", "목요일 출국, 20일 복귀라고 못 박으면 상대가 바로 날짜를 제안할 수 있어요 📏 며칠 비운다고만 하면 대화가 한 번 더 돌아갑니다"], ["약까지 챙기기", "약이 떨어진다는 문제를 함께 꺼내는 게 이 페이지의 핵심이에요 🔑 일정만 옮기고 끝내면 2주 공백이 그대로 남습니다"], ["후속 절차", "돌아와서 확인 전화를 드리겠다는 마무리가 예약을 확정해 줘요 ✅ 롤플레이 문제해결의 공통 마감 기법입니다 🔁"]], "expr": [["an appointment this Friday", "이번 주 금요일 예약", "예약 건을 특정하는 표현 ⏰"], ["I can't make it", "못 갈 것 같아요", "불참을 알리는 기본 문장 ✅"], ["be put on a business trip", "출장이 잡히다", "사유를 말하는 수동태 🔑"], ["fly out", "출국하다", "일정을 그리는 구동사 ✈️"], ["set a new date", "새 날짜를 잡다", "문제 속 표현 그대로 회수 ✅"], ["What's open ~?", "~에는 자리가 있나요?", "재예약 질문 기본형 ⏰"], ["the later one", "더 늦은 쪽", "두 선택지 중 고르는 표현 ✨"], ["run out", "떨어지다, 소진되다", "롤플레이 MP3 편 재활용 🔁 🔋"], ["extend it", "연장하다", "처방 연장 요청의 핵심 동사 🔑"], ["a phone consultation", "전화 진료", "대안을 구체화하는 명사 💬"], ["Should I confirm ~?", "확인 연락을 드릴까요?", "후속 절차를 챙기는 질문 ✅"]], "audio": "audio/3_롤플레이/3-068 23. 예약 변경(Rescheduling)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-068 23. 예약 변경(Rescheduling)_문제 해결.mp3"}, {"id": "3-069", "cat": "roleplay", "catName": "롤플레이 질문", "num": 23, "topic": "예약 변경", "topicEn": "Rescheduling", "type": "과거 경험", "badge": "69 과거 경험", "enQ": "That's the end of the situation. Tell me about a time you were forced to cancel an appointment. What was the reason, and what happened? How did you sort things out?", "enA": "This reminds me of a check-up I kept running away from. I'd booked one for a Friday morning in March, and it had been on my calendar for two months.\n\nThen, two days before, our team got a deadline moved up to that same week. I cancelled the morning of — I remember standing outside the office at eight, phone in hand, feeling a bit guilty about it. The receptionist just said no problem and offered me the next opening. It was three months later.\n\nSo I had my annual check-up in June instead of March, which sounds small but bothered me all spring. How did I sort it out? I changed the system, honestly. Since then, I book check-ups for the first slot of the day, and I take a full day off so nothing can move it.", "koQ": "어쩔 수 없이 예약을 취소해야 했던 때에 대해 말해주세요. 이유가 무엇이었고 무슨 일이 있었나요? 그 상황을 어떻게 정리했나요?", "koA": "제가 자꾸 미루기만 했던 건강검진이 생각나네요. 3월 금요일 아침으로 예약해 뒀었고, 두 달 전부터 일정표에 잡혀 있던 거였어요.\n\n그런데 이틀 전에 저희 팀 마감이 그 주로 앞당겨졌어요. 결국 당일 아침에 취소했죠. 여덟 시에 회사 앞에 서서 전화기를 든 채로, 좀 미안한 기분이 들었던 게 아직도 기억나요. 접수하시는 분은 괜찮다고 하시면서 다음 가능한 자리를 알려 주셨는데, 석 달 뒤더라고요.\n\n그래서 3월에 받았어야 할 연례 검진을 6월에 받았어요. 별거 아닌 것 같지만 봄 내내 신경이 쓰이더라고요. 어떻게 정리했냐면, 솔직히 방식 자체를 바꿨어요. 그 후로는 검진을 그날의 첫 자리로 잡고, 하루 연차를 써요. 아무것도 그 일정을 못 밀게요.", "struct": [["1️⃣ 도입", "두 달 전 잡아 둔 3월 검진"], ["2️⃣ 사건", "이틀 전 마감이 앞당겨짐"], ["3️⃣ 절정", "당일 아침 취소 · 미안한 마음"], ["4️⃣ 결과", "다음 자리가 석 달 뒤"], ["5️⃣ 마무리", "첫 타임 예약 + 하루 연차 규칙"]], "scoring": [["이유와 결과", "문제가 이유와 벌어진 일을 함께 물어요. 마감이 앞당겨졌다는 이유와 석 달이 밀렸다는 결과를 짝지어 말하세요 ✅"], ["감정 한 스푼", "전화기를 들고 회사 앞에 서 있었다는 장면과 조금 미안했다는 감정이 이야기를 사람 것으로 만들어 줘요 💕 사실만 나열하면 보고서처럼 들립니다"], ["해결은 시스템", "다시 예약했다로 끝내지 말고 예약 방식 자체를 바꿨다고 답하는 게 how did you sort things out의 상급 답변이에요 💪"], ["22번과 짝", "22번 ③은 설치 기사 방문, 여기는 병원 검진이에요 🔁 같은 취소 이야기라도 예약의 종류를 갈라 두었습니다"]], "expr": [["keep running away from ~", "~을 자꾸 피하다", "미루는 습관을 그리는 구문 😆"], ["be on my calendar", "일정표에 잡혀 있다", "예약 상태를 말하는 표현 ⏰"], ["a deadline moved up", "마감이 앞당겨지다", "취소 사유의 핵심 표현 🔑"], ["the morning of", "당일 아침에", "막판 취소를 못 박는 표현 📏"], ["phone in hand", "전화기를 든 채", "장면을 그리는 분사구 ✨"], ["a bit guilty", "조금 미안한", "감정을 솔직하게 담은 형용사 💕"], ["the next opening", "다음 가능한 자리", "재예약 필수 명사 ⏰"], ["three months later", "석 달 뒤", "결과를 숫자로 보여 주기 📊"], ["bother me", "신경 쓰이게 하다", "여운을 말하는 동사 🧩"], ["the first slot of the day", "그날의 첫 자리", "교훈 마무리의 구체적 행동 ✅"], ["take a full day off", "하루 연차를 쓰다", "22번 반차와 짝을 이루는 표현 🔁 ⏰"]], "audio": "audio/3_롤플레이/3-069 23. 예약 변경(Rescheduling)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-069 23. 예약 변경(Rescheduling)_과거 경험.mp3"}, {"id": "3-070", "cat": "roleplay", "catName": "롤플레이 질문", "num": 24, "topic": "미용실", "topicEn": "Hair Salon", "type": "정보 요청", "badge": "70 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. A special event is coming up, and you would like to get your hair styled for it. Call a hair salon, describe your situation, and ask three or four questions about booking a visit and having your hair done.", "enA": "Hi, is this the salon on the main street? I've got a wedding to go to in two weeks — my best friend's — and I'd like to get my hair done that morning. Can I ask a few questions?\n\nFirst, do you open early on Saturdays? The ceremony is at noon, so I'd need to be finished by ten. ... You open at eight? Perfect. And how long does a styling take? ... About an hour? That works.\n\nSecond, can I request a specific designer? Someone did my hair here last spring and I liked it. ... You'll check the schedule? Thank you. And one last thing — should I bring a photo of the style I want? ... Definitely? I'll put a few together. Let's book the Saturday at eight thirty.", "koQ": "곧 특별한 행사가 있어서 머리를 하려고 합니다. 미용실에 전화해 상황을 설명하고, 예약과 시술에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 큰길에 있는 미용실 맞나요? 2주 뒤에 결혼식에 가야 하거든요. 절친 결혼식이에요. 그날 아침에 머리를 하고 싶어서 전화드렸어요. 몇 가지만 여쭤봐도 될까요?\n\n우선, 토요일에는 일찍 여시나요? 예식이 정오라서 10시까지는 끝나야 하거든요. ... 여덟 시에 여신다고요? 딱 좋네요. 그리고 스타일링은 얼마나 걸리나요? ... 한 시간쯤이요? 그 정도면 되겠어요.\n\n두 번째로, 디자이너를 지정할 수 있나요? 작년 봄에 여기서 머리를 했는데 마음에 들었거든요. ... 일정을 확인해 주신다고요? 감사합니다. 마지막으로 하나만, 원하는 스타일 사진을 가져가는 게 좋을까요? ... 꼭 가져오라고요? 몇 장 모아 갈게요. 그럼 토요일 8시 반으로 예약할게요.", "struct": [["1️⃣ 인사", "결혼식 참석 + 시술 희망"], ["2️⃣ 질문", "① 토요일 오픈 시각"], ["3️⃣ 질문", "② 스타일링 소요 시간"], ["4️⃣ 질문", "③ 디자이너 지정 가능 여부"], ["5️⃣ 마무리", "④ 사진 지참 + 예약 확정"]], "scoring": [["행사부터 말하기", "결혼식이 정오라는 사실 하나가 오픈 시각과 소요 시간 질문의 근거가 돼요 ✅ 상황을 설명하라는 요구도 여기서 해결됩니다"], ["시간 역산하기", "10시까지 끝나야 한다고 역산해서 말하면 예약이 훨씬 구체적으로 잡혀요 ⏰ 롤플레이에서 숫자는 늘 두 개 이상 넣으세요"], ["미용실만의 질문", "디자이너 지정과 사진 지참은 미용실에서만 나오는 질문이에요 🔑 주제 전용 질문 두 개면 준비된 답변으로 들립니다"], ["예약 확정 마무리", "토요일 8시 반으로 하겠다며 예약을 확정하고 끝내야 상황이 해결돼요 ✅ 정보요청 유형의 공통 마감 기법입니다 🔁"]], "expr": [["I've got a wedding to go to", "갈 결혼식이 있어요", "상황을 밝히는 오프닝 💕"], ["get my hair done", "머리를 하다", "이 주제의 중심 표현 ✅"], ["Do you open early?", "일찍 여시나요?", "시간대 확인 질문 ⏰"], ["be finished by ~", "~까지는 끝나다", "마감 시각을 못 박는 구문 ⏰"], ["How long does it take?", "얼마나 걸리나요?", "소요 시간 질문 🔁 ⏰"], ["a styling", "스타일링 시술", "미용실 서비스 명사 ✨"], ["request a specific designer", "특정 디자이너를 지정하다", "미용실 예약 필수 표현 🔑"], ["check the schedule", "일정을 확인하다", "상대 답변을 받는 동사 📏"], ["bring a photo", "사진을 가져가다", "실전 팁이 된 질문 📸"], ["put a few together", "몇 장 모아 두다", "준비를 약속하는 구동사 ✅"], ["Let's book ~", "~로 예약할게요", "예약 확정 마무리 ✅"]], "audio": "audio/3_롤플레이/3-070 24. 미용실(Hair Salon)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-070 24. 미용실(Hair Salon)_정보 요청.mp3"}, {"id": "3-071", "cat": "roleplay", "catName": "롤플레이 질문", "num": 24, "topic": "미용실", "topicEn": "Hair Salon", "type": "문제 해결", "badge": "71 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You had your hair done at a salon, but the result is not what you hoped for. Call the salon, describe what you are unhappy with, and offer two or three ways to fix the issue, such as redoing the style or getting your money back.", "enA": "Hi, I was in this morning for a cut — the ten o'clock appointment. I don't want to make a big deal of it, but the front is much shorter than what I asked for. I brought a photo, and it really isn't that.\n\nHere's what I'd like to ask. Could I come back today and have someone even it out? Even just the fringe would help. I have a wedding on Saturday and I'd rather not wear a hat to it.\n\nIf it can't be fixed until it grows, could I get a partial refund — or a free trim next time? Either would be fine. I'm not angry, I just don't want to leave it like this. Let me know what you can do this week.", "koQ": "미용실에서 머리를 했는데 결과가 마음에 들지 않습니다. 미용실에 전화해 무엇이 불만인지 설명하고, 다시 해 주거나 환불받는 등 2~3가지 해결 방법을 제안해 보세요.", "koA": "안녕하세요, 제가 오늘 아침에 커트하러 갔었는데요. 열 시 예약이었어요. 크게 문제 삼으려는 건 아닌데, 앞쪽이 제가 요청한 것보다 훨씬 짧게 나와서요. 사진까지 가져갔는데, 솔직히 그 사진이랑은 많이 달라요.\n\n이렇게 여쭤보고 싶어요. 오늘 다시 가서 고르게 다듬어 주실 수 있을까요? 앞머리만이라도 손봐 주시면 도움이 될 것 같아요. 토요일에 결혼식이 있는데 모자를 쓰고 갈 수는 없잖아요.\n\n자랄 때까지는 손을 못 대는 거라면, 부분 환불을 받을 수 있을까요? 아니면 다음에 무료로 손질해 주시는 것도 괜찮고요. 어느 쪽이든 저는 괜찮아요. 화가 난 건 아니에요. 다만 이대로 두고 싶지가 않아서요. 이번 주 안에 가능한 방법을 알려 주세요.", "struct": [["1️⃣ 접근", "오늘 아침 예약 건 특정"], ["2️⃣ 불만", "앞쪽이 요청보다 짧음 · 사진과 다름"], ["3️⃣ 요구", "① 오늘 다시 와서 수정"], ["4️⃣ 대안", "② 부분 환불 ③ 무료 손질"], ["5️⃣ 마무리", "감정 대신 목적 + 기한"]], "scoring": [["부드럽게 열기", "크게 문제 삼으려는 게 아니라는 한 줄이 미용실처럼 사람 손이 들어간 서비스에서는 특히 중요해요 😊"], ["근거는 사진", "사진을 가져갔는데 그것과 다르다는 말이 감정 대신 근거로 말하게 해 줘요 📏 짧다는 주관적 판단보다 훨씬 셉니다"], ["급한 이유", "토요일에 결혼식이 있다는 한 줄이 오늘 안에 수정해 달라는 요구의 근거예요 ⏰ 24번 ①번 설정을 그대로 이어서 씁니다 🔁"], ["요구 → 차선책", "오늘 수정 → 부분 환불 → 무료 손질. 상대 부담이 작은 쪽으로 단계를 낮추면 협상이 됩니다 ✅ 세 대안의 난이도를 다르게 두는 게 핵심이에요"]], "expr": [["I was in this morning", "오늘 아침에 갔었어요", "방문 시점을 특정하는 표현 ⏰"], ["I don't want to make a big deal", "크게 문제 삼으려는 건 아니에요", "불만을 부드럽게 여는 문장 😊"], ["much shorter than ~", "~보다 훨씬 짧은", "불만을 사실로 말하기 📏"], ["what I asked for", "제가 요청한 것", "근거를 가리키는 명사절 🔑"], ["even it out", "고르게 다듬다", "수정 요청의 핵심 동사 ✅"], ["the fringe", "앞머리", "미용실 부위 명사 ✨"], ["a partial refund", "부분 환불", "롤플레이 영화 편 full refund의 짝 🔁 💳"], ["a free trim", "무료 손질", "세 번째 대안 명사 💳"], ["Either would be fine", "어느 쪽이든 괜찮아요", "선택권을 넘기는 표현 🔁 ✅"], ["I'm not angry", "화가 난 건 아니에요", "감정 대신 목적을 앞세우기 💪"], ["Let me know what you can do", "가능한 방법을 알려 주세요", "롤플레이 헬스장 편 재활용 🔁 ✅"]], "audio": "audio/3_롤플레이/3-071 24. 미용실(Hair Salon)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-071 24. 미용실(Hair Salon)_문제 해결.mp3"}, {"id": "3-072", "cat": "roleplay", "catName": "롤플레이 질문", "num": 24, "topic": "미용실", "topicEn": "Hair Salon", "type": "과거 경험", "badge": "72 과거 경험", "enQ": "That's the end of the situation. Have you ever had an unpleasant experience at a hair salon? What took place, and how did you handle it? Walk me through the whole experience from start to finish in detail.", "enA": "Oh, this reminds me of a color I got a few years ago. It was spring, I wanted a light brown, and I brought a photo like a responsible adult. What came out was orange.\n\nI noticed it while the designer was blow-drying it, and the whole room could tell from my face. Apparently my hair had been dyed dark before, so the new color lifted unevenly — that's the explanation I got, while I stared at a stranger in the mirror.\n\nTo be fair, she fixed it. She offered to tone it down right there, free of charge, and I sat in that chair for another three hours — five in total. It came out close to the photo in the end. Since then, I bring three photos instead of one, and I mention what my hair has been through.", "koQ": "미용실에서 좋지 않은 경험을 한 적이 있나요? 무슨 일이 있었고 어떻게 대처했나요? 처음부터 끝까지 자세히 설명해 주세요.", "koA": "아, 몇 해 전에 했던 염색이 생각나네요. 봄이었고, 저는 밝은 갈색을 원했어요. 어른답게 사진까지 챙겨 갔고요. 그런데 나온 색은 오렌지였어요.\n\n디자이너분이 드라이해 주실 때 알아챘는데, 제 표정만 보고도 가게 전체가 눈치챘을 거예요. 알고 보니 제 머리가 예전에 어둡게 염색되어 있어서 새 색이 고르게 빠지지 않았대요. 거울 속 낯선 사람을 보면서 들은 설명이었죠.\n\n그래도 공평하게 말하면, 그분이 해결해 주셨어요. 그 자리에서 무료로 톤을 낮춰 주시겠다고 하셨고, 저는 그 의자에 세 시간을 더 앉아 있었어요. 다 합쳐서 다섯 시간이요. 결국 사진과 비슷하게 나오긴 했어요. 그 후로는 사진을 한 장이 아니라 세 장 가져가고, 제 머리가 그동안 어떤 시술을 거쳤는지도 꼭 말해요.", "struct": [["1️⃣ 도입", "몇 해 전 봄 · 밝은 갈색 희망"], ["2️⃣ 사건", "나온 색은 오렌지"], ["3️⃣ 원인", "이전 어두운 염색 · 고르지 않게 빠짐"], ["4️⃣ 해결", "무료 톤 다운 · 세 시간 추가"], ["5️⃣ 마무리", "사진 세 장 + 시술 이력 설명"]], "scoring": [["처음부터 끝까지", "문제가 from start to finish를 요구해요. 기대 → 결과 → 원인 → 해결 → 규칙, 다섯 칸을 순서대로 채우면 됩니다 ✅"], ["②번과 구분", "②번은 커트, 여기는 염색이에요 🔁 같은 주제 안에서 시술 종류를 갈라야 두 페이지가 서로 다른 이야기가 됩니다"], ["원인까지 설명", "왜 그렇게 나왔는지 원인을 한 줄 넣으면 답변이 불평에서 이야기로 바뀌어요 📏 전문 표현을 쓸 기회이기도 합니다"], ["시간으로 고생", "세 시간을 더 앉아 있었다, 다 합쳐 다섯 시간이라는 숫자가 고생을 형용사 없이 전달해 줘요 ⏰ 힘들었다는 말은 한 번도 안 나오지만 다 전달됩니다"]], "expr": [["a light brown", "밝은 갈색", "원하는 색을 말하는 표현 ✨"], ["like a responsible adult", "어른답게", "자기 유머 한 스푼 😆"], ["What came out was ~", "나온 건 ~였어요", "결과를 반전으로 던지는 구문 🎭"], ["blow-dry", "드라이해 주다", "미용실 장면 동사 ✅"], ["the whole room could tell", "온 가게가 눈치챘다", "표정을 장면으로 그리기 😆"], ["be dyed dark", "어둡게 염색되어 있다", "원인을 설명하는 수동태 🔑"], ["lift unevenly", "색이 고르지 않게 빠지다", "염색 전문 표현 📏"], ["tone it down", "톤을 낮추다", "해결 시술의 핵심 동사 ✅"], ["free of charge", "무료로", "롤플레이 가구 편 재활용 🔁 💳"], ["another three hours", "세 시간을 더", "고생을 숫자로 ⏰"], ["what my hair has been through", "내 머리가 겪어 온 것", "교훈 마무리의 재치 있는 표현 💬"]], "audio": "audio/3_롤플레이/3-072 24. 미용실(Hair Salon)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-072 24. 미용실(Hair Salon)_과거 경험.mp3"}, {"id": "3-073", "cat": "roleplay", "catName": "롤플레이 질문", "num": 25, "topic": "ID 카드", "topicEn": "ID Card", "type": "정보 요청", "badge": "73 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You need a new company ID card. Call the person in charge, describe your situation, and ask three or four questions about the application process for the new card.", "enA": "Hi, is this the general affairs team? This is Ryan from marketing. I need a new ID card — I'm afraid I've lost mine, probably on the subway last Friday. Can I ask a few questions about the application process?\n\nFirst, what do I need to submit? A form, a photo, anything else? ... A passport-sized photo and an online form? Where do I find the form? ... On the intranet under HR? Got it.\n\nSecond, how long does it take? ... Five working days? And what do I do in the meantime — is there a temporary pass I can use at the gate? ... I can borrow a visitor card? That helps. One last thing — is there a fee for a reissue? ... Ten thousand won? Fine, I'll come by this afternoon.", "koQ": "회사에서 발급하는 ID 카드를 새로 받아야 합니다. 담당자에게 전화해 상황을 설명하고, 발급 절차에 대해 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 혹시 총무팀 맞나요? 저는 마케팅팀 라이언입니다. ID 카드를 새로 발급받아야 해서요. 아무래도 제가 잃어버린 것 같아요. 지난 금요일 지하철에서요. 발급 절차에 대해 몇 가지만 여쭤봐도 될까요?\n\n우선, 뭘 제출해야 하나요? 신청서랑 사진, 그 외에 또 필요한 게 있을까요? ... 여권 규격 사진이랑 온라인 신청서요? 신청서는 어디서 찾나요? ... 사내망 인사팀 메뉴에요? 알겠습니다.\n\n두 번째로, 발급까지 얼마나 걸리나요? ... 영업일로 5일이요? 그럼 그동안은 어떻게 하나요? 출입구에서 쓸 임시 출입증 같은 게 있을까요? ... 방문증을 빌릴 수 있다고요? 다행이네요. 마지막으로 하나만, 재발급에 비용이 드나요? ... 만 원이요? 괜찮습니다. 오늘 오후에 들를게요.", "struct": [["1️⃣ 인사", "소속·이름 + 분실 상황 설명"], ["2️⃣ 질문", "① 제출 서류"], ["3️⃣ 질문", "② 발급 소요 기간"], ["4️⃣ 질문", "③ 그동안 쓸 임시 출입증"], ["5️⃣ 마무리", "④ 비용 확인 + 방문 예고"]], "scoring": [["사내 통화 톤", "회사 담당자에게 거는 전화라 소속과 이름부터 밝히는 게 기본이에요 💬 가게에 거는 전화와는 오프닝이 다릅니다"], ["공백까지 묻기", "발급까지 닷새 동안 어떻게 출입하느냐는 질문이 이 페이지의 하이라이트예요 🔑 절차만 묻고 끝내면 현실감이 떨어집니다"], ["절차는 네 칸", "서류 · 기간 · 임시 대안 · 비용. 발급 문의는 이 네 칸으로 나누면 3~4개 요구가 저절로 채워져요 📏"], ["방문으로 닫기", "오후에 들르겠다는 마무리가 통화를 다음 행동으로 이어 줘요 ✅ 질문만 하고 끊는 것보다 한 수 위인, 정보요청 유형의 공통 마감 기법입니다 🔁"]], "expr": [["This is ~ from ~", "저는 ~팀의 ~입니다", "사내 통화 자기소개 공식 🔁 💬"], ["lose mine", "제 것을 잃어버리다", "상황을 밝히는 동사 🔑"], ["the application process", "발급 절차", "문제 속 표현 그대로 회수 ✅"], ["What do I need to submit?", "뭘 제출해야 하나요?", "절차 문의 1번 질문 📏"], ["a passport-sized photo", "여권 규격 사진", "서류 준비물 필수 명사 📸"], ["the intranet", "사내망", "회사 상황 전용 어휘 ✨"], ["five working days", "영업일 기준 5일", "소요 기간을 부르는 표현 ⏰"], ["in the meantime", "그동안에는", "롤플레이 MP3 편 재활용 🔁 ⏰"], ["a temporary pass", "임시 출입증", "공백을 메우는 대안 명사 🔑"], ["Is there a fee?", "비용이 드나요?", "비용 질문 기본형 💳"], ["a reissue", "재발급", "이 주제의 핵심 명사 ✅"]], "audio": "audio/3_롤플레이/3-073 25. ID 카드(ID Card)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-073 25. ID 카드(ID Card)_정보 요청.mp3"}, {"id": "3-074", "cat": "roleplay", "catName": "롤플레이 질문", "num": 25, "topic": "ID 카드", "topicEn": "ID Card", "type": "문제 해결", "badge": "74 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You have found an error on your ID card. Contact the person in charge, describe the issue, and ask for a replacement. Then offer two or three ideas to get the problem fixed quickly.", "enA": "Hi, it's Ryan from marketing again. My new ID card arrived this morning, but there's a mistake on it. My name is spelled wrong — it says Kin instead of Kim — and the department still says Sales, which I left in March.\n\nCould I get a replacement, please? And here's what I'd suggest to make it quick. First, could you reuse the photo I already submitted? That should save a few days.\n\nSecond, could someone check the file before it goes to the printer this time? I'm happy to confirm the spelling by email right now. And if a new card takes another week, could I keep this one for the gate in the meantime? It still opens the door. Let me know what works.", "koQ": "ID 카드에 문제가 있는 것을 발견했습니다. 담당자에게 연락해 무엇이 잘못됐는지 설명하고 새 카드를 요청한 뒤, 빠르게 해결할 2~3가지 방법을 제안해 보세요.", "koA": "안녕하세요, 마케팅팀 라이언입니다. 오늘 아침에 새 ID 카드를 받았는데요, 거기에 오류가 있어서요. 제 이름 철자가 틀렸어요. Kim이 아니라 Kin으로 되어 있고요. 그리고 부서도 아직 영업팀으로 되어 있는데, 저는 3월에 옮겼거든요.\n\n새 카드로 다시 만들어 주실 수 있을까요? 그리고 빨리 처리되도록 이렇게 하면 어떨까 싶어요. 우선, 제가 이미 제출한 사진을 그대로 쓰시면 어떨까요? 그러면 며칠은 줄일 수 있을 것 같아서요.\n\n두 번째로, 이번에는 인쇄에 넘어가기 전에 파일을 한 번 확인해 주실 수 있을까요? 철자는 제가 지금 바로 메일로 확인해 드릴게요. 그리고 새 카드가 또 일주일 걸린다면, 그동안은 이 카드를 출입용으로 계속 써도 될까요? 문은 열리거든요. 가능한 방법을 알려 주세요.", "struct": [["1️⃣ 확인", "소속·이름 + 카드 수령 사실"], ["2️⃣ 오류", "이름 철자 + 옛 부서 표기"], ["3️⃣ 요구", "① 재발급 + 사진 재사용"], ["4️⃣ 제안", "② 인쇄 전 철자 확인"], ["5️⃣ 마무리", "③ 기존 카드 임시 사용 + 선택권"]], "scoring": [["오류는 두 개", "이름 철자와 부서 표기, 오류를 두 개 대면 재발급 요구가 훨씬 단단해져요 📏 하나만 말하면 그냥 쓰라는 답이 돌아옵니다"], ["빠르게 하는 법", "문제가 fixed quickly를 지정했어요. 사진 재사용처럼 시간을 줄이는 제안이어야 요구에 정확히 맞습니다 ⏰"], ["내 일도 하기", "철자를 메일로 확인해 드리겠다는 한 줄이 상대 부담을 덜어 줘요 💪 요구만 하는 답변과 인상이 완전히 달라집니다"], ["공백 메우기", "새 카드가 나올 때까지 기존 카드를 쓰게 해 달라는 마지막 제안이 현실적이에요 🔁 같은 주제 ①번에서도 이 공백을 다뤘습니다"]], "expr": [["There's a mistake on it", "거기에 오류가 있어요", "문제를 여는 문장 🔑"], ["be spelled wrong", "철자가 틀리다", "이 페이지의 핵심 표현 📏"], ["instead of ~", "~이 아니라", "오류를 대조해 보여 주기 ✨"], ["a replacement", "교체 카드, 재발급", "요구를 한 단어로 ✅"], ["Here's what I'd suggest", "이렇게 하면 어떨까요", "롤플레이 영화 편 재활용 🔁 🔑"], ["reuse the photo", "사진을 그대로 쓰다", "속도를 높이는 제안 📸"], ["save a few days", "며칠을 줄이다", "제안의 이득을 말하기 ⏰"], ["before it goes to the printer", "인쇄에 넘어가기 전에", "재발 방지 제안 🔑"], ["confirm the spelling", "철자를 확인해 주다", "내가 할 일을 자청하기 💪"], ["in the meantime", "그동안에는", "25번 ①번과 짝을 이루는 표현 🔁 ⏰"], ["Let me know what works", "가능한 방법을 알려 주세요", "선택권을 넘기는 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-074 25. ID 카드(ID Card)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-074 25. ID 카드(ID Card)_문제 해결.mp3"}, {"id": "3-075", "cat": "roleplay", "catName": "롤플레이 질문", "num": 25, "topic": "ID 카드", "topicEn": "ID Card", "type": "과거 경험", "badge": "75 과거 경험", "enQ": "That's the end of the situation. Have you ever run into difficulties while getting an ID card issued? What went wrong, and how did you manage it? Walk me through the whole experience from start to finish in detail.", "enA": "Oh, this reminds me of my very first company ID. I'd just joined, and on day two they asked for a passport-sized photo. I had one in my wallet from two years earlier, so I handed that over, feeling efficient.\n\nIt came back the next day. The background wasn't white — it was a soft grey — and my glasses had a reflection across one lens. So I dug out another old photo, and that one got rejected too: too old to match my face, apparently.\n\nBy then I'd been there a week and was still signing in as a visitor every morning. So at lunch I walked to a photo studio two blocks away, paid eight thousand won, and had proper ones in twenty minutes. The card came three days later. Since then, I keep four spare photos in my desk drawer.", "koQ": "ID 카드를 발급받으면서 어려움을 겪은 적이 있나요? 무엇이 문제였고 어떻게 해결했는지 처음부터 끝까지 자세히 설명해 주세요.", "koA": "아, 제 첫 회사 사원증이 생각나네요. 막 입사했을 때인데, 이틀째 되는 날 여권 규격 사진을 달라고 하시더라고요. 지갑에 2년 전 사진이 있길래 그걸 드렸어요. 스스로 참 효율적이라고 생각하면서요.\n\n그런데 다음 날 반려되어 돌아왔어요. 배경이 흰색이 아니라 연한 회색이었고, 안경 한쪽에 반사가 들어가 있다는 거였죠. 그래서 또 다른 예전 사진을 찾아서 냈는데, 그것도 반려됐어요. 이번에는 사진이 너무 오래돼서 얼굴과 안 맞는다고요.\n\n그때쯤엔 입사 일주일째였는데도 매일 아침 방문객으로 출입 등록을 하고 있었어요. 그래서 점심시간에 두 블록 떨어진 사진관에 걸어가서 8천 원을 내고 20분 만에 제대로 된 사진을 받았어요. 카드는 사흘 뒤에 나왔고요. 그 후로는 책상 서랍에 여분 사진을 네 장씩 넣어 둬요.", "struct": [["1️⃣ 도입", "입사 직후 · 지갑 속 옛 사진"], ["2️⃣ 반려", "배경 색 + 안경 반사"], ["3️⃣ 재반려", "너무 오래된 사진"], ["4️⃣ 고생", "일주일간 방문객으로 출입"], ["5️⃣ 마무리", "점심시간 사진관 + 여분 사진 규칙"]], "scoring": [["반려는 두 번", "한 번에 끝내지 말고 두 번 반려당하게 만드세요 📏 문제가 from start to finish를 요구하니 단계가 있어야 분량이 나옵니다"], ["사유 구체적", "배경이 회색이었다, 안경에 반사가 있었다처럼 사유를 눈에 보이게 말하면 이야기가 살아나요 ✨ 서류가 반려됐다로 끝내지 마세요"], ["고생을 장면으로", "일주일 내내 방문객으로 출입 등록을 했다는 한 줄이 불편함을 설명 없이 전달해요 🔑 힘들었다는 말보다 훨씬 셉니다"], ["20분의 반전", "며칠을 끌던 일이 점심시간 20분에 끝났다는 대비가 마무리를 웃기게 만들어 줘요 😆 고생담은 마지막에 한 번 뒤집으세요"]], "expr": [["a passport-sized photo", "여권 규격 사진", "25번 ①번과 짝을 이루는 명사 🔁 📸"], ["feeling efficient", "효율적이라고 생각하며", "자기 유머 한 스푼 😆"], ["come back", "반려되어 돌아오다", "서류 반려를 말하는 구동사 🔑"], ["The background wasn't white", "배경이 흰색이 아니었다", "반려 사유를 사실로 📏"], ["a reflection", "(렌즈의) 반사", "두 번째 반려 사유 ✨"], ["get rejected", "반려되다", "반복되는 실패를 알리는 수동태 💪"], ["too old to match ~", "~와 맞지 않을 만큼 오래된", "세 번째 사유를 압축 😆"], ["sign in as a visitor", "방문객으로 출입 등록하다", "고생을 그림으로 보여 주기 🔑"], ["a photo studio", "사진관", "해결 장면의 핵심 명사 📸"], ["in twenty minutes", "20분 만에", "해결 속도를 숫자로 ⏰"], ["spare photos", "여분의 사진", "습관 마무리의 구체적 행동 ✅"]], "audio": "audio/3_롤플레이/3-075 25. ID 카드(ID Card)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-075 25. ID 카드(ID Card)_과거 경험.mp3"}, {"id": "3-076", "cat": "roleplay", "catName": "롤플레이 질문", "num": 26, "topic": "파티", "topicEn": "Party", "type": "정보 요청", "badge": "76 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. A relative has called to ask for your help with preparing a big party. Call your relative back and ask three or four questions to figure out what you need to do for the event.", "enA": "Hi, Auntie, it's me — I got your message about Grandad's seventieth. Of course I'll help. But it sounds bigger than last time, so let me get the details straight first.\n\nFirst, how many are coming, and where is it? ... Forty people, at a restaurant in Suwon? Okay, that is bigger. And what time should I be there? ... Two hours early to set up? Noted.\n\nSecond, what are you putting me in charge of? ... The photos and the slideshow? I can do that. Do you want old family photos in it? ... You'll send them by Friday? Then one last thing — who else is helping, so I know who to coordinate with? ... My cousin? Great, I'll message him tonight.", "koQ": "친척이 큰 파티 준비를 도와달라고 전화했습니다. 그 친척에게 다시 전화해 파티를 위해 무엇을 해야 하는지 알기 위해 3~4가지 질문을 해보세요.", "koA": "이모, 저예요. 할아버지 칠순 관련해서 남기신 메시지 봤어요. 당연히 도와야죠. 그런데 지난번보다 규모가 클 것 같아서, 먼저 몇 가지만 확실히 해 둘게요.\n\n우선, 몇 분이나 오시고 어디서 하나요? ... 마흔 분에, 수원에 있는 식당이요? 확실히 크네요. 그리고 저는 몇 시까지 가면 될까요? ... 두 시간 일찍 가서 준비하면 되나요? 알겠습니다.\n\n두 번째로, 저한테는 뭘 맡기실 건가요? ... 사진이랑 슬라이드 영상이요? 그건 제가 할 수 있어요. 옛날 가족사진도 넣을까요? ... 금요일까지 보내 주신다고요? 그럼 마지막으로 하나만, 또 누가 같이 준비하나요? 손발을 맞춰야 해서요. ... 사촌 형이요? 좋아요, 오늘 밤에 연락해 볼게요.", "struct": [["1️⃣ 인사", "회신 + 돕겠다는 수락"], ["2️⃣ 질문", "① 인원과 장소"], ["3️⃣ 질문", "② 도착 시각"], ["4️⃣ 질문", "③ 내가 맡을 역할"], ["5️⃣ 마무리", "④ 함께 준비할 사람 + 연락 약속"]], "scoring": [["15번과 구분", "15번은 엄마 집 가족 저녁, 여기는 마흔 명이 모이는 친척의 큰 행사예요 🔁 규모가 다르면 묻는 것도 달라집니다"], ["규모부터 묻기", "몇 명이냐는 질문 하나가 나머지 세 질문의 방향을 정해 줘요 🏠 큰 행사는 인원이 기준이라 장소도 시간도 역할도 거기서 갈라집니다"], ["협업자 확인", "또 누가 돕느냐는 질문은 15번에는 없던 규모형 질문이에요 💪 혼자 하는 일이 아니라는 걸 아는 사람의 질문입니다"], ["행동으로 닫기", "오늘 밤에 사촌에게 연락하겠다는 마무리가 통화를 실제 준비로 이어 줘요 ✅ 돕겠다는 말이 행동으로 바뀌는 지점입니다"]], "expr": [["I got your message", "메시지 봤어요", "회신 전화 오프닝 🔁 💬"], ["let me get the details straight", "세부 사항을 확실히 해 두다", "15번 집 편 재활용 🔁 🔑"], ["How many are coming?", "몇 분이나 오시나요?", "규모 질문 기본형 🏠"], ["set up", "준비하다, 세팅하다", "행사 준비 필수 구동사 ✅"], ["put ~ in charge of", "~에게 ~을 맡기다", "역할 분담 핵심 구문 🔑"], ["the slideshow", "슬라이드 영상", "큰 행사 전용 소품 ✨"], ["old family photos", "옛날 가족사진", "준비물을 구체화하는 명사 📸"], ["by Friday", "금요일까지", "기한을 못 박는 표현 ⏰"], ["Who else is helping?", "또 누가 돕나요?", "15번 집 편에 없던 규모형 질문 🔁"], ["coordinate with ~", "~와 손발을 맞추다", "협업을 말하는 동사 💪"], ["I'll message him tonight", "오늘 밤에 연락할게요", "행동으로 닫는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-076 26. 파티(Party)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-076 26. 파티(Party)_정보 요청.mp3"}, {"id": "3-077", "cat": "roleplay", "catName": "롤플레이 질문", "num": 26, "topic": "파티", "topicEn": "Party", "type": "문제 해결", "badge": "77 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. You have found out that you must work on the day of the party, so you cannot be there. Contact your relative and leave a message explaining the situation, then offer two or three ways you can still help with the preparations even though you cannot attend.", "enA": "Auntie, it's me. I know you're at the market, so I'll leave this as a message. I've just found out I have to work on Saturday — a client visit I can't move. I'm so sorry; I really wanted to be there.\n\nBut I can still help, just not on the day. First, I'll finish the slideshow by Thursday night and send it to my cousin so he can play it.\n\nSecond, I can pick up the cake and the flowers on Friday and drop them at your place on my way home. And if you still need hands on Saturday morning, I could come early and help set up before I go in. Call me back tonight and tell me what's most useful.", "koQ": "파티 당일에 일을 해야 해서 참석할 수 없게 되었습니다. 친척에게 연락해 메시지로 상황을 설명하고, 참석은 못 하더라도 준비를 도울 수 있는 2~3가지 방법을 제안해 보세요.", "koA": "이모, 저예요. 지금 시장에 계신 거 알아서 메시지로 남겨 둘게요. 토요일에 일을 해야 한다는 걸 방금 알았어요. 고객사 방문이 잡혔는데 제가 옮길 수가 없어요. 정말 죄송해요. 꼭 가고 싶었는데요.\n\n그래도 도울 수는 있어요. 당일에만 못 갈 뿐이니까요. 우선, 슬라이드 영상은 목요일 밤까지 다 만들어서 사촌 형한테 보내 놓을게요. 형이 틀면 되니까요.\n\n두 번째로, 금요일에 케이크랑 꽃을 찾아서 퇴근길에 이모 댁에 두고 갈게요. 그리고 토요일 아침에도 일손이 필요하시면, 제가 일찍 가서 출근 전에 세팅을 도울 수 있어요. 오늘 밤에 전화 주셔서 어느 게 제일 도움이 될지 알려 주세요.", "struct": [["1️⃣ 메시지", "음성 메시지임을 밝히기"], ["2️⃣ 사유", "토요일 근무 · 옮길 수 없음"], ["3️⃣ 대안", "① 목요일까지 슬라이드 완성"], ["4️⃣ 대안", "② 금요일 케이크·꽃 수령"], ["5️⃣ 마무리", "③ 당일 아침 세팅 + 회신 요청"]], "scoring": [["세 번째 메시지", "leave a message 유형이 세 번째예요 🔁 13번은 가게, 16번은 친구, 여기는 어른이라 정중함이 한 단계 올라갑니다"], ["전환 한 문장", "당일에만 못 갈 뿐 도울 수는 있다는 한 문장이 사과를 제안으로 바꿔 줘요 🔑 문제가 요구하는 건 결국 이 전환입니다"], ["기한 붙이기", "목요일 밤까지, 금요일에처럼 각 대안에 기한을 붙이면 말뿐인 제안이 아니게 돼요 ⏰ 도움은 시점이 있어야 진짜입니다"], ["회신 요청", "무엇이 가장 도움이 될지 알려 달라며 회신을 요청해야 메시지가 완결돼요 💬 상대에게 선택권을 넘기는 마무리입니다"]], "expr": [["I know you're at ~", "지금 ~에 계신 거 알아요", "메시지를 남기는 이유 🔁 ⏰"], ["leave this as a message", "메시지로 남기다", "메시지 유형 필수 표현 🔁 🔑"], ["I have to work", "일을 해야 해요", "문제 속 표현 그대로 회수 ✅"], ["I can't move it", "옮길 수가 없어요", "불가피함을 말하는 구문 💪"], ["I can still help", "그래도 도울 수는 있어요", "이 페이지의 전환 문장 🔑"], ["just not on the day", "당일에만 못 할 뿐", "조건을 좁히는 표현 ✨"], ["finish ~ by ~", "~까지 ~을 끝내다", "기한을 붙인 약속 ⏰"], ["pick up the cake", "케이크를 찾아오다", "준비를 돕는 구체적 행동 🍳"], ["on my way home", "퇴근길에", "롤플레이 카페 편 재활용 🔁"], ["need hands", "일손이 필요하다", "도움을 부르는 관용구 💪"], ["Call me back tonight", "오늘 밤에 전화 주세요", "메시지 마무리 공식 🔁 💬"]], "audio": "audio/3_롤플레이/3-077 26. 파티(Party)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-077 26. 파티(Party)_문제 해결.mp3"}, {"id": "3-078", "cat": "roleplay", "catName": "롤플레이 질문", "num": 26, "topic": "파티", "topicEn": "Party", "type": "과거 경험", "badge": "78 과거 경험", "enQ": "That's the end of the situation. Describe a time you had the chance to help your family or friends. Think back to when you were able to lend them a hand. What was the problem, and what kind of help did you give? How did things turn out in the end? Share as many details as you can.", "enA": "This reminds me of the weekend I helped my mom switch to a smartphone. She'd used a folder phone for years and kept saying she was too old to learn — which wasn't true. She was just nervous.\n\nSo one Saturday I went over with her new phone. The problem wasn't the phone; it was that everything assumed she already knew something. I spent the afternoon setting it up — big text, her contacts, three apps and nothing else on the home screen.\n\nThen I did the part she still talks about: I wrote her a notebook, step by step, with screenshots taped in. Two months later she sent me a photo of her own garden, with a filter on it. In the end, the notebook mattered more than the phone.", "koQ": "가족이나 친구를 도울 수 있었던 때를 말해주세요. 문제가 무엇이었고 어떤 도움을 주었나요? 결국 어떻게 되었는지 최대한 자세히 설명해 주세요.", "koA": "엄마가 스마트폰으로 바꾸시던 주말이 생각나네요. 몇 년 동안 폴더폰을 쓰셨는데, 늘 이 나이에 무슨 배우냐고 하셨거든요. 사실은 그게 아니었어요. 그냥 겁이 나셨던 거죠.\n\n그래서 어느 토요일에 새 폰을 들고 본가에 갔어요. 문제는 폰이 아니었어요. 모든 게 엄마가 뭔가를 이미 안다고 전제하고 있다는 게 문제였죠. 저는 오후 내내 설정을 해 드렸어요. 글씨를 크게 하고, 연락처를 옮기고, 홈 화면에는 앱 세 개만 남기고요.\n\n그리고 엄마가 지금도 얘기하시는 걸 했어요. 사용법 노트를 만들어 드렸거든요. 한 단계씩, 화면 캡처를 오려 붙여서요. 두 달 뒤에 엄마가 직접 가꾸신 텃밭 사진을 보내 주셨어요. 필터까지 넣어서요. 결국 그 노트가 폰보다 중요했던 것 같아요.", "struct": [["1️⃣ 도입", "엄마의 스마트폰 전환"], ["2️⃣ 문제", "기기가 아니라 전제된 지식"], ["3️⃣ 도움", "큰 글씨 · 연락처 · 앱 세 개"], ["4️⃣ 핵심", "캡처를 붙인 사용법 노트"], ["5️⃣ 마무리", "두 달 뒤 필터 넣은 사진"]], "scoring": [["문제 다시 보기", "기기가 어려운 게 아니라 다 안다고 전제하는 게 문제였다는 시각이 답변의 격을 한 단계 올려 줘요 🔑"], ["도움은 구체적", "큰 글씨, 연락처, 앱 세 개. 무엇을 도왔는지 눈에 보이게 말해야 what kind of help에 답이 됩니다 ✅"], ["결과로 증명", "두 달 뒤 엄마가 필터 넣은 사진을 보냈다는 장면이 how did things turn out의 답이에요 ✨ 잘됐다는 말보다 훨씬 셉니다"], ["마음도 한 줄", "노트가 폰보다 중요했다는 마무리가 이야기를 따뜻하게 닫아 줘요 💕 도움 이야기는 마지막 한 줄에서 마음이 보여야 합니다"]], "expr": [["switch to ~", "~으로 바꾸다", "기기 교체를 말하는 동사 🔑"], ["a folder phone", "폴더폰", "서베이 휴대폰 편 재활용 🔁 🔋"], ["too old to learn", "배우기엔 나이가 많다", "상대의 말을 인용하는 구문 💬"], ["She was just nervous", "그냥 겁이 나셨던 거예요", "진짜 이유를 짚는 한 줄 ✨"], ["The problem wasn't ~", "문제는 ~이 아니었다", "원인을 뒤집는 구문 🔑"], ["assume ~", "~을 안다고 전제하다", "롤플레이 해외여행 편 재활용 🔁 🧩"], ["set it up", "설정해 주다", "도움의 내용을 말하는 구동사 ✅"], ["big text", "큰 글씨", "배려를 보여 주는 디테일 📏"], ["write her a notebook", "노트를 만들어 드리다", "이 이야기의 핵심 행동 📖"], ["screenshots taped in", "화면 캡처를 오려 붙인", "정성을 그림으로 보여 주기 ✨"], ["In the end", "결국에는", "결말을 여는 전환 시그널 🔁 ✅"]], "audio": "audio/3_롤플레이/3-078 26. 파티(Party)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-078 26. 파티(Party)_과거 경험.mp3"}, {"id": "3-079", "cat": "roleplay", "catName": "롤플레이 질문", "num": 27, "topic": "휴일·명절", "topicEn": "Holidays", "type": "정보 요청", "badge": "79 정보 요청", "enQ": "I'd like to give you a situation to act it out. You are browsing a gift shop for something special for the holiday coming up. Speak with the shop assistant and ask three or four questions to help you pick out the right gift.", "enA": "Hi, could you help me for a minute? Chuseok is coming up, and I need a gift for my parents — something a bit nicer than the usual gift set. I don't really know where to start — I've bought the same thing three years running.\n\nFirst, what's popular this year? ... Health supplements and hanwoo beef sets? Those are the safe ones, aren't they. Is there anything less predictable? ... A tea set? Now that's interesting.\n\nSecond, what's the price range on those? ... Between eighty and a hundred and fifty thousand? That works. And one last thing — do you do gift wrapping here, and can you deliver it to another city? My parents are in Daejeon. ... Two days ahead? Let's do that. I'll pick one out now and come back to you.", "koQ": "다가오는 명절을 위해 특별한 선물을 찾으러 선물 가게에 왔습니다. 점원과 이야기하며 알맞은 선물을 고르는 데 도움이 될 3~4가지 질문을 해보세요.", "koA": "안녕하세요, 잠깐 도움 좀 받을 수 있을까요? 곧 추석이라서 부모님 선물을 하나 찾고 있어요. 늘 하던 선물 세트보다는 조금 더 괜찮은 걸로요. 어디서부터 봐야 할지 모르겠어요. 3년 내리 같은 걸 사 드렸거든요.\n\n우선, 올해는 뭐가 인기인가요? ... 건강 보조식품이랑 한우 세트요? 그건 가장 무난한 쪽이죠. 혹시 좀 덜 뻔한 것도 있을까요? ... 다기 세트요? 그건 좀 흥미롭네요.\n\n두 번째로, 그런 건 가격대가 어떻게 되나요? ... 8만 원에서 15만 원 사이요? 괜찮네요. 마지막으로 하나만, 여기서 선물 포장도 해 주시나요? 그리고 다른 지역으로 배송도 되나요? 부모님이 대전에 계셔서요. ... 이틀 전에만 맡기면 된다고요? 그렇게 할게요. 지금 하나 골라서 다시 말씀드릴게요.", "struct": [["1️⃣ 접근", "점원에게 도움 요청 + 상황"], ["2️⃣ 질문", "① 올해 인기 품목"], ["3️⃣ 질문", "② 덜 뻔한 선택지"], ["4️⃣ 질문", "③ 가격대"], ["5️⃣ 마무리", "④ 포장·배송 + 결정"]], "scoring": [["받는 사람부터", "부모님 선물이라는 사실 하나가 점원이 추천할 기준이 돼요 ✅ 선물 좀 보여 달라는 말로는 대화가 이어지지 않습니다"], ["뻔한 것 거르기", "안전한 선택지를 듣고 덜 뻔한 걸 다시 묻는 흐름이 질문 두 개를 자연스럽게 만들어 줘요 ✨ 취향까지 드러나고요"], ["명절 어휘", "한우 세트와 건강 보조식품은 한국 명절 선물의 정답 어휘예요 🔑 우리말 고유명사를 영어로 풀어 주는 연습이 되고, 문화 소개는 채점에서 늘 유리합니다"], ["포장·배송까지", "포장과 타지 배송까지 묻는 네 번째 질문이 선물을 실제로 보내는 그림을 완성해 줘요 ⏰ 고르는 데서 멈추지 말고 전달까지 물어보세요"]], "expr": [["Chuseok is coming up", "곧 추석이에요", "돌발 휴일 편 재활용 🔁 ✨"], ["a gift for my parents", "부모님 선물", "상황을 특정하는 명사구 💕"], ["the usual gift set", "늘 하던 선물 세트", "평범함을 가리키는 표현 📏"], ["What's popular?", "뭐가 인기인가요?", "추천을 유도하는 질문 🔁 💬"], ["health supplements", "건강 보조식품", "명절 선물 필수 어휘 🔑"], ["hanwoo beef set", "한우 세트", "한국 명절 문화 소개 🍳"], ["less predictable", "덜 뻔한", "취향을 드러내는 비교급 ✨"], ["What's the price range?", "가격대가 어떻게 되나요?", "시리즈 개근 질문 🔁 💳"], ["gift wrapping", "선물 포장", "선물 가게 전용 어휘 💕"], ["deliver it to ~", "~로 배송해 주다", "롤플레이 가구 편 재활용 🔁 ⏰"], ["Let's do that", "그렇게 할게요", "결정을 선언하는 마무리 ✅"]], "audio": "audio/3_롤플레이/3-079 27. 휴일·명절(Holidays)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-079 27. 휴일·명절(Holidays)_정보 요청.mp3"}, {"id": "3-080", "cat": "roleplay", "catName": "롤플레이 질문", "num": 27, "topic": "휴일·명절", "topicEn": "Holidays", "type": "문제 해결", "badge": "80 문제 해결", "enQ": "I'm sorry, but there's a problem I need you to resolve. While on holiday, you accidentally left your suitcase behind on the train. Call the railway company, describe your problem, and ask two or three questions to get assistance.", "enA": "Hi, I need some help — I left my suitcase on the train. It was the KTX from Busan, the eleven-forty, and I got off at Seoul Station twenty minutes ago. It was in the luggage rack by door four, car seven.\n\nFirst, where does lost property end up on that line? Does it stay on board, or does someone collect it? ... It goes to the lost and found at the last stop? So that would be Haengsin.\n\nSecond, how long do you hold it? ... Seven days? Good. And can you send it to me instead, if I pay the courier? I'm back at work tomorrow and Haengsin is an hour away. ... You can? Then what do I need — the ticket and my ID? I have both. Thank you so much.", "koQ": "휴일에 실수로 기차에 여행 가방을 두고 내렸습니다. 철도 회사에 전화해 문제를 설명하고, 도움을 받기 위해 2~3가지 질문을 해보세요.", "koA": "안녕하세요, 도움이 좀 필요해서요. 제가 기차에 여행 가방을 두고 내렸어요. 부산에서 오는 11시 40분 KTX였고, 20분쯤 전에 서울역에서 내렸습니다. 가방은 7호차 4번 출입문 옆 짐 선반에 있었어요.\n\n우선, 그 노선에서 분실물은 어디로 가나요? 기차에 그대로 실려 가나요, 아니면 누가 수거하나요? ... 종착역 분실물 센터로 간다고요? 그럼 행신이겠네요.\n\n두 번째로, 보관은 얼마나 해 주시나요? ... 7일이요? 다행이네요. 그리고 제가 택배비를 내면 저한테 보내 주실 수도 있나요? 내일부터 다시 출근이라 행신까지는 한 시간이 걸려서요. ... 가능하다고요? 그럼 뭐가 필요할까요? 승차권이랑 신분증이요? 둘 다 있습니다. 정말 감사합니다.", "struct": [["1️⃣ 접근", "도움 요청 + 분실 사실"], ["2️⃣ 사실", "열차·시각·호차·선반 위치"], ["3️⃣ 질문", "① 분실물이 어디로 가는지"], ["4️⃣ 질문", "② 보관 기간"], ["5️⃣ 마무리", "③ 택배 발송 + 준비물 확인"]], "scoring": [["17번과 구분", "17번 수하물 분실은 공항에서 직접 요구하는 상황, 여기는 전화로 질문하는 상황이에요 🔁 문제가 ask questions를 지정했습니다"], ["좌표를 주기", "열차 시각 · 호차 · 선반 위치까지 대면 상대가 바로 찾으러 갈 수 있어요 📏 분실물 신고는 결국 좌표 싸움입니다"], ["비용 자청하기", "택배비는 제가 내겠다는 한 줄이 요청을 훨씬 받아들이기 쉽게 만들어 줘요 💳 롤플레이 전반에서 통하는 기법입니다 🔁"], ["준비물로 닫기", "뭐가 필요하냐는 마지막 질문이 다음 단계를 확정해 줘요 ✅ 승차권과 신분증까지 챙겨 두는 것이 이 상황의 진짜 마무리입니다"]], "expr": [["leave ~ on the train", "~을 기차에 두고 내리다", "문제 속 표현 그대로 회수 ✅"], ["the eleven-forty", "11시 40분 열차", "롤플레이 교통 편 재활용 🔁 ⏰"], ["the luggage rack", "짐 선반", "위치를 특정하는 명사 📏"], ["car seven", "7호차", "근거를 구체화하는 표현 📏"], ["lost property", "분실물", "이 페이지의 핵심 명사 🔑"], ["end up", "결국 ~로 가다", "행방을 묻는 구동사 🧩"], ["the lost and found", "분실물 센터", "실전 필수 어휘 ✅"], ["How long do you hold it?", "얼마나 보관하나요?", "보관 기간 질문 ⏰"], ["Can you send it to me?", "보내 주실 수 있나요?", "두 번째 요구 표현 💳"], ["the courier", "택배", "비용을 자청하는 명사 💳"], ["What do I need?", "뭐가 필요한가요?", "준비물 질문 기본형 🔁 ✅"]], "audio": "audio/3_롤플레이/3-080 27. 휴일·명절(Holidays)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-080 27. 휴일·명절(Holidays)_문제 해결.mp3"}, {"id": "3-081", "cat": "roleplay", "catName": "롤플레이 질문", "num": 27, "topic": "휴일·명절", "topicEn": "Holidays", "type": "과거 경험", "badge": "81 과거 경험", "enQ": "That's the end of the situation. Has there ever been a holiday when your plans suddenly had to change completely? How did everything work out in the end?", "enA": "Oh, this reminds me of a Seollal a few years ago. Every year the whole clan goes to my grandmother's place in the countryside, and I'd already booked the train — those tickets go on sale a month ahead and vanish in minutes.\n\nThen, two days before, my aunt called: they'd decided not to gather that year. Just like that, a plan I'd been arranging for a month was gone, and so were my tickets. I cancelled them that night, feeling a bit flat about it.\n\nSo it ended up being the three of us — me and my parents — in our own kitchen. We made rice cake soup together, did the bows over a video call, and went for a walk around the neighborhood in the afternoon. In the end, it was the quietest Seollal I've had, and honestly, still my favorite one.", "koQ": "갑자기 계획을 완전히 바꿔야 했던 명절이나 휴일이 있었나요? 결국 어떻게 되었나요?", "koA": "아, 몇 해 전 설날이 생각나네요. 해마다 온 친척이 시골 할머니 댁에 모이거든요. 그래서 저도 기차표를 미리 예매해 뒀었죠. 그 표는 한 달 전에 열리는데 몇 분 만에 사라지거든요.\n\n그런데 이틀 전에 이모한테 전화가 왔어요. 그해에는 모이지 않기로 했다고요. 그렇게 한순간에, 한 달 동안 맞춰 온 계획이 없어졌어요. 제 기차표도요. 그날 밤에 표를 취소하면서 좀 김이 새더라고요.\n\n그래서 결국 저희 셋이었어요. 저랑 부모님이요. 우리 집 부엌에서요. 셋이 같이 떡국을 끓이고, 영상통화로 세배를 하고, 오후에는 동네를 한 바퀴 걸었어요. 결국 제가 보낸 설 중에 가장 조용한 설이었는데요, 솔직히 지금도 제일 좋았던 설로 남아 있어요.", "struct": [["1️⃣ 배경", "해마다 시골 할머니 댁 · 기차표"], ["2️⃣ 사건", "이틀 전 모임 취소 통보"], ["3️⃣ 감정", "한 달 준비 무산 · 표 취소"], ["4️⃣ 전환", "부모님과 셋이 집에서"], ["5️⃣ 마무리", "영상통화 세배 + 가장 좋았던 설"]], "scoring": [["두 질문만", "문제가 짧아요. 계획이 어떻게 바뀌었는지와 결국 어떻게 됐는지, 두 가지만 확실히 답하면 충분합니다 ✅"], ["갑작스러움", "이틀 전이라는 시점과 한 달 전에 예매한 표의 대비가 suddenly를 그림으로 보여 줘요 📏 갑자기라는 단어를 쓸 필요가 없어집니다"], ["돌발 편과 연결", "떡국 · 세배 · 온 친척은 돌발 휴일 편에서 이미 익힌 어휘예요 🔁 문화 어휘를 재활용하면 준비 시간이 절반으로 줄어듭니다"], ["반전으로 닫기", "가장 조용했지만 지금도 제일 좋았던 설이라는 마무리가 결국 어떻게 됐냐에 답하면서 여운을 남겨요 💕 망한 계획이 좋은 결말로 뒤집히는 구조예요"]], "expr": [["Seollal", "설날", "돌발 휴일 편 재활용 🔁 ✅"], ["the whole clan", "온 친척", "돌발 휴일 편 재활용 🔁 🏠"], ["book the train", "기차표를 예매하다", "명절 귀성 필수 동사 ⏰"], ["vanish in minutes", "몇 분 만에 사라지다", "명절 표 전쟁을 한 마디로 🔥"], ["two days before", "이틀 전에", "갑작스러움을 못 박는 표현 📏"], ["Just like that", "그렇게 한순간에", "전환을 강조하는 구어체 🎭"], ["cancel them", "표를 취소하다", "결과를 알리는 동사 ✅"], ["feeling a bit flat", "좀 김이 새서", "감정을 담백하게 담은 표현 😆"], ["rice cake soup", "떡국", "돌발 휴일 편 재활용 🔁 🍳"], ["do the bows over a video call", "영상통화로 세배하다", "돌발 휴일 비교 편 연결 🔁 💬"], ["still my favorite one", "지금도 제일 좋았던", "반전으로 닫는 마무리 💕"]], "audio": "audio/3_롤플레이/3-081 27. 휴일·명절(Holidays)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-081 27. 휴일·명절(Holidays)_과거 경험.mp3"}, {"id": "3-082", "cat": "roleplay", "catName": "롤플레이 질문", "num": 28, "topic": "잡지 인터뷰", "topicEn": "Interview", "type": "정보 요청", "badge": "82 정보 요청", "enQ": "I'd like to give you a situation and ask you to act it out. You have been assigned to write an in-depth magazine interview with a celebrity. Call the celebrity's agent, describe your idea, and then ask three or four thoughtful questions that show the celebrity's personality, values, or latest projects.", "enA": "Hi, is this Mr. Lee's office? This is Ryan from the culture desk at Monthly Seoul. I'm putting together an in-depth interview with him — not a promotional piece, a proper long read. Could I run my questions past you?\n\nHere's the angle: he's been on stage for twenty years, and I want to ask what's kept him there. So, first — what does he do on the days he doesn't want to perform?\n\nSecond, what would he tell the twenty-two-year-old who first walked into a rehearsal room? And third, about the new production — what made him say yes to this one? One last thing: is there anything he'd rather not be asked? I'd rather know now.", "koQ": "유명 연예인과의 심층 인터뷰를 잡지에 싣게 되었습니다. 연예인의 에이전트에게 전화해 기획을 설명하고, 그 사람의 성격·가치관·최근 작품이 드러날 만한 사려 깊은 질문 3~4가지를 해보세요.", "koA": "안녕하세요, 이 선생님 사무실 맞나요? 저는 월간 서울 문화부의 라이언입니다. 선생님과의 심층 인터뷰를 기획하고 있어서 연락드렸어요. 홍보성 기사가 아니라 제대로 된 장문 인터뷰로요. 제가 준비한 질문을 미리 보여 드려도 될까요?\n\n기획 방향은 이렇습니다. 선생님이 20년 동안 무대에 서 오셨는데, 무엇이 그분을 그 자리에 붙잡아 두었는지를 여쭙고 싶어요. 그래서 첫 질문은, 무대에 서고 싶지 않은 날에는 어떻게 하시는지입니다.\n\n두 번째로, 처음 연습실 문을 열고 들어갔던 스물두 살의 자신에게 뭐라고 말해 주고 싶으신지 여쭙고 싶고요. 세 번째는 이번 신작에 대해서인데, 이 작품은 왜 하겠다고 하셨는지요. 마지막으로 하나만, 혹시 여쭙지 않았으면 하는 내용이 있을까요? 미리 알고 가는 편이 좋아서요.", "struct": [["1️⃣ 인사", "소속·이름 + 기획 설명"], ["2️⃣ 방향", "20년 무대 · 무엇이 붙잡았나"], ["3️⃣ 질문", "① 하기 싫은 날엔 어떻게 하는지"], ["4️⃣ 질문", "② 스물두 살의 자신에게"], ["5️⃣ 마무리", "③ 신작 수락 이유 + 금기 확인"]], "scoring": [["질문의 대상", "에이전트에게 정보를 묻는 게 아니라, 연예인에게 할 인터뷰 질문을 미리 보여 주는 상황이에요 🔑 다른 정보요청 페이지와 결정적으로 다릅니다"], ["세 축을 나눠", "성격 · 가치관 · 최근 작품. 문제가 이 세 가지를 지정했으니 질문 하나씩 배정하면 그대로 정답이 됩니다 ✅"], ["질문의 깊이", "몇 작품 하셨나요 같은 건 검색하면 나와요 📏 하기 싫은 날엔 어떻게 하시냐처럼 답이 궁금해지는 질문이 thoughtful입니다"], ["예의 한 질문", "묻지 말아야 할 게 있는지 확인하는 마지막 질문이 프로답게 들려요 😊 상대를 배려하는 태도가 이 유형의 숨은 점수입니다"]], "expr": [["This is ~ from ~", "저는 ~의 ~입니다", "25번 ①번 재활용, 업무 통화 오프닝 🔁 💬"], ["the culture desk", "문화부", "잡지사 소속을 말하는 명사 ✨"], ["put together ~", "~을 기획하다", "기획을 설명하는 구동사 🔑"], ["not a promotional piece", "홍보성 기사가 아닌", "기획 성격을 규정하는 표현 📏"], ["a long read", "심층 장문 기사", "인터뷰 형식을 부르는 어휘 📖"], ["run ~ past you", "~을 미리 보여 드리다", "사전 검토를 요청하는 관용구 ✅"], ["Here's the angle", "기획 방향은 이렇습니다", "기획 의도를 여는 신호탄 🔑"], ["What's kept him there?", "무엇이 그를 붙잡았나", "가치관을 묻는 질문 설계 💕"], ["What would he tell ~?", "~에게 뭐라고 할까요", "성격을 끌어내는 질문 🎭"], ["What made him say yes?", "왜 하겠다고 하셨나요", "최근 작품을 묻는 정답 문형 🎬"], ["he'd rather not be asked", "질문받고 싶지 않은 것", "예의를 보여 주는 마지막 질문 😊"]], "audio": "audio/3_롤플레이/3-082 28. 잡지 인터뷰(Interview)_정보 요청.mp3", "label": "정보 요청", "qaudio": "audio_q/3_롤플레이/3-082 28. 잡지 인터뷰(Interview)_정보 요청.mp3"}, {"id": "3-083", "cat": "roleplay", "catName": "롤플레이 질문", "num": 28, "topic": "잡지 인터뷰", "topicEn": "Interview", "type": "문제 해결", "badge": "83 문제 해결", "enQ": "I'm sorry, but there is a problem that you need to resolve. After the article came out, you found several major errors in the printed interview. Call the editor, share your concerns, and suggest two or three professional ways to address the situation, such as publishing a correction or revising the online version.", "enA": "Hi, it's Ryan. I've gone through the printed version of the interview, and there are a few errors I need to flag. His debut year is off by two, a quote is attributed to the wrong production, and his co-star's name is misspelled.\n\nI'm not pointing fingers — I know how fast it went to print. But he trusted us with that piece, so here's what I'd suggest. First, could we run a correction in the next issue?\n\nSecond, the online version goes up Friday — could we fix it before it publishes and add a correction note at the bottom? That's the one people actually read. And third, I'd like to send him a note myself. Let me know which you can approve today.", "koQ": "인터뷰 기사가 나온 뒤 인쇄된 지면에서 중요한 오류 몇 가지를 발견했습니다. 편집자에게 전화해 우려를 전하고, 정정 보도나 온라인판 수정처럼 전문적인 해결 방법을 2~3가지 제안해 보세요.", "koA": "안녕하세요, 라이언입니다. 인터뷰 기사 인쇄본을 처음부터 다 읽어 봤는데요, 짚어 드려야 할 오류가 몇 개 있어요. 데뷔 연도가 2년 차이가 나고, 인용문 하나가 다른 작품의 것으로 실렸고, 상대 배우 이름 철자가 틀렸습니다.\n\n누구 탓을 하려는 게 아니에요. 얼마나 급하게 인쇄에 넘어갔는지 아니까요. 다만 그분이 저희를 믿고 응해 주신 인터뷰잖아요. 그래서 이렇게 하면 어떨까 싶습니다. 우선, 다음 호에 정정 보도를 낼 수 있을까요?\n\n두 번째로, 온라인판이 금요일에 올라가는데요, 게시되기 전에 수정하고 하단에 정정 안내문을 붙이면 어떨까요? 사람들이 실제로 읽는 건 그쪽이니까요. 세 번째로, 그분께는 제가 직접 연락을 드리고 싶습니다. 오늘 중으로 어디까지 가능한지 알려 주세요.", "struct": [["1️⃣ 확인", "지면 검토 + 오류 발견"], ["2️⃣ 사실", "데뷔 연도 · 인용 · 이름 철자"], ["3️⃣ 대안", "① 다음 호 정정 보도"], ["4️⃣ 대안", "② 온라인판 사전 수정"], ["5️⃣ 마무리", "③ 본인에게 연락 + 승인 요청"]], "scoring": [["오류는 세 개", "연도 · 인용 · 철자. 오류를 세 개로 나눠 대면 정정 요구가 감정이 아니라 사실이 돼요 📏 몇 군데 틀렸다로 뭉뚱그리지 마세요"], ["탓하지 않기", "탓하려는 게 아니라는 한 줄이 같은 팀에게 문제를 꺼낼 때 특히 중요해요 💪 25번 ②번에서도 쓴 태도입니다 🔁"], ["전문적 방법", "문제가 professional ways를 지정했어요. 정정 보도와 온라인판 수정처럼 업계에서 실제로 쓰는 방법이어야 합니다 ✅"], ["승인으로 닫기", "어디까지 승인 가능한지 오늘 알려 달라는 마무리가 결정권자에게 거는 통화답게 들려요 ⏰ 기한을 붙이는 것도 잊지 마세요"]], "expr": [["the printed version", "인쇄된 지면", "온라인판과 대비되는 명사 📖"], ["there are a few errors", "오류가 몇 개 있어요", "문제를 여는 문장 🔑"], ["flag ~", "~을 짚어 알리다", "업무 상황 전용 동사 ✨"], ["be off by two", "2년 차이가 나다", "오류를 숫자로 특정 📏"], ["be attributed to ~", "~의 것으로 잘못 실리다", "인용 오류 전문 표현 🔑"], ["misspell", "철자를 틀리게 쓰다", "25번 ②번과 짝을 이루는 동사 🔁"], ["I'm not pointing fingers", "누구 탓을 하려는 게 아니에요", "감정 대신 목적을 앞세우기 🔁 💪"], ["run a correction", "정정 보도를 내다", "이 페이지의 핵심 표현 ✅"], ["the online version", "온라인판", "두 번째 대안의 무대 💬"], ["a correction note", "정정 안내문", "대안을 구체화하는 명사 📏"], ["Let me know which you can approve", "어디까지 가능한지 알려 주세요", "결정권자에게 넘기는 마무리 🔁 ✅"]], "audio": "audio/3_롤플레이/3-083 28. 잡지 인터뷰(Interview)_문제 해결.mp3", "label": "문제 해결", "qaudio": "audio_q/3_롤플레이/3-083 28. 잡지 인터뷰(Interview)_문제 해결.mp3"}, {"id": "3-084", "cat": "roleplay", "catName": "롤플레이 질문", "num": 28, "topic": "잡지 인터뷰", "topicEn": "Interview", "type": "과거 경험", "badge": "84 과거 경험", "enQ": "That's the end of the situation. Tell me about a time you met a celebrity face to face. What was the occasion, how did you interact with the person, and what effect did it have on you afterward? Give me as many details as possible.", "enA": "Oh, this reminds me of a night at a small theater in Daehakro, about three years ago. A hundred seats, and I was in the front row — close enough to see every expression.\n\nAfter the show, the cast came out into the lobby to see the audience off. I hadn't expected that at all. The lead actor was standing by the door shaking hands, and suddenly it was my turn and I had nothing prepared.\n\nAll I managed was it was really good tonight — five words, in a voice I didn't recognize. He held my hand for a second and said, it's cold out, get home safely. That's the whole story. But ever since, I've looked for small productions instead of big ones, because that lobby is where I understood what a theater is for.", "koQ": "연예인을 직접 만났던 경험을 말해주세요. 어떤 자리였고, 어떻게 이야기를 나눴으며, 그 경험이 이후에 어떤 영향을 주었는지 최대한 자세히 설명해 주세요.", "koA": "아, 3년쯤 전에 대학로 소극장에서 있었던 밤이 생각나네요. 백 석짜리 극장이었고, 저는 맨 앞줄에 앉아 있었어요. 배우들 표정이 하나하나 다 보일 만큼 가까웠죠.\n\n공연이 끝나고 배우들이 로비로 나와서 관객들을 배웅해 주더라고요. 전혀 예상하지 못했어요. 주연 배우분이 문 옆에 서서 한 명씩 악수를 해 주고 계셨는데, 어느새 제 차례가 됐고 저는 준비한 말이 하나도 없었어요.\n\n겨우 한 말이 오늘 정말 좋았어요, 이 한마디였어요. 제 목소리 같지도 않은 목소리로요. 그분은 잠깐 제 손을 잡고 이렇게 말씀하셨어요. 밖이 추우니 조심히 들어가세요. 그게 다예요. 그런데 그 후로 저는 큰 공연보다 소극장 작품을 찾아보게 됐어요. 극장이 왜 있는 건지 그 로비에서 알게 됐거든요.", "struct": [["1️⃣ 배경", "3년 전 대학로 소극장 · 맨 앞줄"], ["2️⃣ 사건", "공연 후 배우들이 로비 배웅"], ["3️⃣ 절정", "내 차례 · 준비한 말이 없음"], ["4️⃣ 대화", "다섯 마디 · 손을 잡아 준 배우"], ["5️⃣ 마무리", "그 후로 소극장을 찾게 됨"]], "scoring": [["세 질문 회수", "어떤 자리였나 · 어떻게 교류했나 · 이후에 어떤 영향이 있었나. 세 가지를 단락마다 하나씩 맡기면 됩니다 ✅"], ["짧아도 된다", "다섯 마디밖에 못 했다는 것 자체가 좋은 이야기예요 😆 대화가 길어야 만남이 되는 건 아닙니다. 당황했던 그대로가 제일 진짜 같아요"], ["영향이 핵심", "그 뒤로 소극장을 찾게 됐다는 마지막 단락이 what effect did it have에 대한 답이에요 ✅ 만남만 묘사하고 끝내면 절반만 답한 겁니다"], ["시리즈 마무리", "대학로 소극장과 맨 앞줄은 서베이 공연 편에서 시작된 설정이에요 🔁 🎭 롤플레이의 마지막 페이지가 첫 덱과 이어지며 닫힙니다"]], "expr": [["a small theater", "소극장", "서베이 공연 편 재활용 🔁 🎭"], ["in the front row", "맨 앞줄에", "서베이 공연 편 재활용 🔁 ✨"], ["see the audience off", "관객을 배웅하다", "이 이야기의 결정적 장면 💕"], ["I hadn't expected that", "전혀 예상하지 못했어요", "반전을 담담하게 알리기 🎭"], ["it was my turn", "제 차례가 됐어요", "긴장을 한 문장으로 😆"], ["nothing prepared", "준비한 말이 하나도 없는", "당황을 압축한 표현 📏"], ["All I managed was ~", "겨우 한 말은 ~였어요", "겸연쩍음을 담은 구문 😆"], ["in a voice I didn't recognize", "내 목소리 같지 않은 목소리로", "긴장을 감각으로 옮기기 ✨"], ["hold my hand", "손을 잡아 주다", "장면을 그리는 동사 💕"], ["get home safely", "조심히 들어가세요", "그날의 한 마디 🌙"], ["ever since", "그 후로 쭉", "영향을 말하는 마무리 시그널 🔁 ✅"]], "audio": "audio/3_롤플레이/3-084 28. 잡지 인터뷰(Interview)_과거 경험.mp3", "label": "과거 경험", "qaudio": "audio_q/3_롤플레이/3-084 28. 잡지 인터뷰(Interview)_과거 경험.mp3"}, {"id": "4-001", "cat": "advanced", "catName": "고난도 질문", "num": 1, "topic": "가족·친구", "topicEn": "Family", "type": "비교", "badge": "01 비교", "enQ": "Choose two of your friends or family members. How are they similar, and how are they different? Describe each person in detail.", "enA": "Let me take two friends of mine, Youngho and Minsu. We met at university, about ten years ago. On paper they couldn't be more different, but they have one thing in common — whenever something goes wrong for me, both of them show up with food.\n\nYoungho wears everything on his face. He calls at ten at night to tell me he's already outside my building, and by midnight we're in some place he found that afternoon. Minsu is the complete opposite — flat voice, two-word texts, and he plans everything a week ahead.\n\nBut Minsu is the one who sends me the map link before I ask, and he's the one who talks me out of a bad decision. So one of them matches my energy and the other one cools it down. If I had to pick, I'd say both. Two Younghos and I'd never sleep.", "koQ": "친구나 가족 중 두 명을 골라 주세요. 두 사람은 어떤 점이 비슷하고 어떤 점이 다른가요? 각각을 자세히 묘사해 주세요.", "koA": "제 친구 두 명, 영호랑 민수로 할게요. 대학에서 만나 10년쯤 된 사이예요. 겉보기엔 둘만큼 다른 사람도 없는데 딱 하나 닮은 게 있어요. 저한테 무슨 일이 생기면 둘 다 음식을 들고 나타난다는 거요.\n\n영호는 감정이 얼굴에 다 드러나요. 밤 10시에 전화해서 벌써 저희 집 앞에 나와 있다고 하고, 자정쯤이면 그날 오후에 자기가 찾아낸 가게에 앉아 있죠. 민수는 정반대예요. 목소리에 굴곡이 없고 문자는 두 단어고, 뭐든 일주일 전에 계획합니다.\n\n그런데 묻기도 전에 지도 링크를 보내 주는 것도 민수고, 제가 이상한 결정을 하려고 하면 말려 주는 것도 민수예요. 한 명은 제 기분에 맞춰 주고 다른 한 명은 식혀 주는 거죠. 굳이 고르라면 둘 다라고 답할래요. 영호가 둘이면 잠을 못 잘 거예요.", "struct": [["1️⃣ 선정", "비교할 친구 두 명 = 영호 · 민수"], ["2️⃣ 공통", "겉은 정반대 → 공통점은 음식 💕"], ["3️⃣ 차이", "영호 = 감정형 😆 밤 10시 전화"], ["4️⃣ 대조", "민수 = 계획형 · 두 단어 문자"], ["5️⃣ 마무리", "고르는 척 → 둘 다! 농담으로 닫기 😊"]], "scoring": [["두 명 먼저", "누구와 누구인지 첫 문장에 못 박기 🔑 채점자 머릿속에 두 사람이 서야 뒤가 따라옵니다. 짧은 한국 이름은 그대로 써도 OK"], ["공통점 하나", "차이만 나열 = 밋밋한 목록 😊 다른데 딱 하나 닮았다로 먼저 묶어 주세요. 두 사람이 한 이야기 안으로 들어오고 뒤에 올 차이가 확 선명해집니다"], ["장면으로 증명", "성격은 형용사가 아니라 장면! 🎭 밤 10시 전화 · 두 단어 문자처럼 행동을 하나씩 붙이면 describe in detail 요구가 저절로 채워져요"], ["고르라면", "한쪽 고르는 척 → 둘 다 필요로 뒤집기 ✅ 문제는 고르라고 한 적이 없어요. 가장 안전하면서도 인상적으로 남는 고난도 마무리 패턴입니다"]], "expr": [["on paper", "겉보기에는", "겉보기엔 이렇다 → 뒤에 올 반전을 미리 까는 장치 🔑 첫 문장 전용"], ["couldn't be more different", "이보다 다를 수 없다", "비교 유형 최강 오프닝 ⭐ 다르다를 최상급 한 방으로 끝내는 문장"], ["have one thing in common", "딱 하나 공통점이 있다", "차이 나열 전에 공통점부터! 밋밋한 목록이 이야기로 바뀌는 지점 🔑"], ["show up with food", "먹을 걸 들고 나타나다", "착하다는 말 없이 행동 한 컷으로 두 사람을 동시 설명 💕 IH식 묘사법"], ["wear everything on his face", "감정이 얼굴에 다 드러나다", "감정이 풍부하다 → 얼굴 한 컷으로 🎭 형용사를 대신하는 관용구"], ["be already outside", "벌써 밖에 나와 있다", "즉흥적인 성격을 장면 하나로 증명 ✨ 따로 설명할 필요가 없어요"], ["the complete opposite", "정반대", "돌발 전화 편 재활용 🔁 A에서 B로 넘어가는 대조 스위치 역할"], ["two-word texts", "두 단어짜리 문자", "무뚝뚝하다 → 문자 길이라는 숫자로 📏 형용사보다 훨씬 강해요"], ["send me the map link", "지도 링크를 보내 주다", "꼼꼼하다 대신 묻기 전에 링크 ⭐ 성격을 행동으로 바꾼 묘사법"], ["talk ~ out of ...", "~을 말려서 …을 막다", "말리다를 한 단어로 못 옮길 때 ⭐ 고난도 구동사 1순위예요"], ["match my energy", "내 기분에 맞춰 주다", "요즘 원어민 실사용 표현 ✨ 한 번만 써도 확 자연스러워져요"]], "audio": "audio/4_고난도/4-001 1. 가족·친구(Family)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-001 1. 가족·친구(Family)_비교.mp3"}, {"id": "4-002", "cat": "advanced", "catName": "고난도 질문", "num": 1, "topic": "가족·친구", "topicEn": "Family", "type": "이슈", "badge": "02 이슈", "enQ": "What do you usually talk about when you spend time with your friends or family? Which topic comes up most often? What was your most recent conversation with them like? Describe a typical conversation in detail.", "enA": "Honestly, it depends on who I'm with. With my friends it's food, work complaints and whatever show everyone is watching. With my family it's the boring stuff that matters — who's moving, whose kid started school, what we're eating on Sunday.\n\nBut the topic that comes up most often is work. Everyone I know is either thinking about switching jobs or trying to talk somebody out of it. It surfaces within ten minutes, every single time, no matter how we start.\n\nThe last one was my Sunday call with my mom. I finally told her I'm moving toward content marketing, and there was a three-second pause before she asked whether it pays more. That's a typical conversation in my family — one real question, then straight back to what I had for dinner.", "koQ": "친구나 가족과 함께 있을 때 보통 무슨 이야기를 하나요? 어떤 주제가 가장 자주 나오나요? 가장 최근에 나눈 대화는 어땠는지 자세히 말해 주세요.", "koA": "솔직히 누구랑 있느냐에 따라 달라요. 친구들이랑은 먹는 얘기, 회사 불만, 다들 보고 있는 드라마 얘기를 해요. 가족이랑은 시시하지만 중요한 얘기를 하죠. 누가 이사 가는지, 누구네 아이가 학교에 갔는지, 일요일엔 뭘 먹을지 같은 거요.\n\n그중에서 가장 자주 나오는 주제는 일이에요. 제 주변 사람들은 다 이직을 고민 중이거나 누군가를 말리고 있는 쪽이거든요. 어떻게 시작한 대화든 10분 안에 반드시 그 얘기가 올라와요.\n\n가장 최근 대화는 일요일 엄마와의 통화였어요. 콘텐츠 마케팅 쪽으로 옮겨 볼 생각이라고 드디어 말씀드렸는데, 3초쯤 정적이 흐르더니 그게 돈은 더 되냐고 물으시더라고요. 저희 집 대화가 딱 이래요. 진짜 질문 하나 던지고 곧바로 저녁 뭐 먹었냐로 돌아갑니다.", "struct": [["1️⃣ 분류", "상대에 따라 갈림 → 친구 · 가족"], ["2️⃣ 빈도", "가장 자주 나오는 건 일 얘기 하나!"], ["3️⃣ 근거", "10분 안에 반드시 등장 ⏰ 숫자로 증명"], ["4️⃣ 최근", "일요일 엄마 통화 · 3초 정적 한 장면"], ["5️⃣ 전형", "진짜 질문 하나 → 곧바로 딴소리 😊"]], "scoring": [["질문이 네 개", "무엇을 · 가장 자주 · 가장 최근 · 전형적인 대화 ✅ 질문이 네 개예요. 단락마다 하나씩 맡겨 두면 빠뜨릴 일이 없습니다"], ["둘로 갈라라", "친구 + 가족을 한 덩어리로 = 뭉개진 답 🔑 상대에 따라 다르다로 먼저 갈라 두면 문장 두 개로 대화 지형이 정리되고 분량까지 자연스럽게 늘어납니다"], ["숫자가 증거", "가장 자주라는 말만으론 증명 불가 📏 10분 안에 · 3초 정적처럼 숫자를 대는 순간 지어낸 말이 아니라 실제로 겪은 말로 들리기 시작해요"], ["일요일 통화", "엄마와의 일요일 통화 = 서베이 · 돌발에서 이미 굳은 설정 🔁 네 덱 내내 같은 사람이 말하는 것처럼 들려야 답변 전체의 신뢰도가 올라갑니다"]], "expr": [["it depends on who I'm with", "누구랑 있느냐에 따라 달라요", "친구 · 가족 둘로 가르며 여는 도입 🔑 답 전체 지도가 잡혀요"], ["work complaints", "회사 불만", "친구 대화 기본 소재 💬 명사 두 개로 주제를 압축하는 방식"], ["the boring stuff that matters", "시시하지만 중요한 얘기", "시시한데 중요하다는 모순을 한 구에 ⭐ 고난도 표현 1순위"], ["whose kid started school", "누구네 아이가 입학했는지", "이런 명사절 3개 나열 📏 문장 하나가 단락 하나 몫을 해요"], ["the topic that comes up most", "가장 자주 나오는 주제", "문제 표현 그대로 되돌려 주기 ✅ 질문 회수 신호가 됩니다"], ["think about switching jobs", "이직을 고민하다", "돌발 직업 편 재활용 🔁 이직을 자연스럽게 옮긴 표준 구문"], ["talk somebody out of it", "누군가를 말리다", "1번 ①번 구동사를 목적어만 바꿔 재등장 🔁 짝으로 외우기"], ["within ten minutes", "10분 안에", "자주 대신 숫자 📏 지어낸 말이 아니라고 들리기 시작해요"], ["The last one was ~", "가장 최근 건 ~였어요", "가장 최근 대화 질문에 즉답하는 신호탄 🔑 단락 첫 문장용"], ["a three-second pause", "3초간의 정적", "엄마 반응을 초 단위로 💬 설명 없이 장면이 그대로 그려져요"], ["straight back to ~", "곧바로 ~로 돌아가다", "전형적인 대화 요구를 마지막 한 줄로 회수 ✅ 깔끔한 마무리"]], "audio": "audio/4_고난도/4-002 1. 가족·친구(Family)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-002 1. 가족·친구(Family)_이슈.mp3"}, {"id": "4-003", "cat": "advanced", "catName": "고난도 질문", "num": 2, "topic": "모임", "topicEn": "Gathering", "type": "비교", "badge": "03 비교", "enQ": "How were gatherings and celebrations different when you were a child compared to now? How do people get together these days? Tell me how gatherings have changed over the years.", "enA": "Back then, a celebration meant somebody's living room. Birthdays, housewarmings, first-birthday parties — all of it happened at home. One mother did all the cooking while twenty people squeezed onto the floor around one low table that was never big enough.\n\nThese days it's a completely different story. We book a restaurant or a party room, we settle the date in a group chat, and everyone splits the bill on an app before the plates are cleared. Nobody cooks, nobody washes up, and nobody sleeps over.\n\nCompared to back then, gatherings are way smaller and much shorter — three hours, one group photo, and home. The trade-off is that they're easier to arrange but just as easy to cancel, so people meet more often and remember less. I have to admit I miss the floor and the noise. Not the dishes.", "koQ": "어릴 때의 모임과 기념 행사는 지금과 어떻게 달랐나요? 요즘 사람들은 어떻게 모이나요? 모임이 그동안 어떻게 변했는지 말해 주세요.", "koA": "예전에 잔치라고 하면 그건 곧 누군가의 거실이었어요. 생일이든 집들이든 돌잔치든 전부 집에서 했죠. 엄마 한 분이 음식을 다 하시는 동안 스무 명이 낮은 상 주위 바닥에 끼어 앉았어요. 한 번도 넉넉했던 적이 없는 상이었죠.\n\n요즘은 완전히 다른 이야기예요. 식당이나 파티룸을 예약하고, 날짜는 단톡방에서 정하고, 접시를 치우기도 전에 앱으로 계산을 나눠요. 아무도 요리하지도, 설거지하지도, 자고 가지도 않습니다.\n\n예전과 비교하면 모임은 훨씬 작아졌고 훨씬 짧아졌어요. 세 시간, 단체 사진 한 장, 그리고 귀가예요. 대신 잡기 쉬워진 만큼 취소하기도 쉬워져서, 사람들은 더 자주 만나고 덜 기억해요. 그 바닥의 북적임이 그립긴 하다고 인정할 수밖에 없네요. 설거지는 빼고요.", "struct": [["1️⃣ 과거", "옛날 잔치 = 누군가의 거실 🏠 정의로 열기"], ["2️⃣ 장면", "엄마 한 분 + 바닥에 낀 스무 명"], ["3️⃣ 현재", "식당 예약 → 단톡방 조율 → 앱 정산"], ["4️⃣ 대비", "작고 짧아진 대신 취소도 쉬움 ⭐"], ["5️⃣ 마무리", "북적임은 그립다. 설거지는 아니고요 😆"]], "scoring": [["명절은 빼기", "고난도 3번 · 4번이 명절 전용 주제 🔑 여기서 차례상과 세배를 써 버리면 정작 그 주제에 가서 할 말이 사라집니다"], ["장면 두 컷", "변화는 형용사가 아니라 대응되는 두 장면! 🎭 바닥에 낀 스무 명 ↔ 앱으로 나눠 내는 계산을 나란히 놓으면 길게 설명하지 않아도 몇십 년이 한 번에 건너뜁니다"], ["trade-off", "좋아졌다 · 나빠졌다로 끝나면 IM ⭐ 잡기 쉬워진 만큼 취소도 쉬워졌다처럼 얻은 것과 잃은 것을 한 문장에 같이 담아야 고난도 답변이 됩니다"], ["그리움 마무리", "비교는 그리움 한 스푼으로 닫는 게 시리즈 공식 🔁 단, 설거지는 빼고요 같은 농담 한 줄을 꼭 붙여 줘야 신파로 빠지지 않고 가볍게 닫힙니다"]], "expr": [["Back then ↔ These days", "그때는 ↔ 요즘은", "돌발 비교 유형 기본 골격 🔁 이 둘만 세워도 절반은 완성"], ["a celebration meant ~", "잔치라고 하면 ~였다", "비교를 정의 문장으로 열기 ⭐ 나열보다 훨씬 정돈돼 들려요"], ["housewarming", "집들이", "집들이 🏠 한국식 모임 주제에서 거의 매번 나오는 필수 어휘"], ["first-birthday party", "돌잔치", "돌잔치 📖 이렇게만 옮기면 설명 없이 바로 통하는 표준 번역"], ["squeeze onto the floor", "바닥에 끼어 앉다", "좌식 문화를 동사 하나로 ✨ 길게 설명할 필요가 없어져요"], ["a completely different story", "완전히 다른 이야기", "돌발 비교 편 재활용 🔁 과거 → 현재 전환 신호 자리에 배치"], ["settle the date in a group chat", "단톡방에서 날짜를 정하다", "단톡방의 표준 영어 💬 요즘 모임을 증명해 주는 핵심 장면"], ["split the bill on an app", "앱으로 더치페이하다", "더치페이를 콩글리시 없이 💳 앱까지 붙이면 시대감까지 잡혀요"], ["compared to ~", "~과 비교하면", "비교 유형 고정 연결어 🔁 마지막 단락 첫 문장 자리에 배치"], ["The trade-off is ~", "대신 잃는 건 ~이다", "얻은 것 + 잃은 것을 한 문장에 ⭐ 고난도 전용 채점 포인트"], ["I have to admit", "인정할 수밖에 없다", "예전이 그립다고 인정하며 닫기 🔁 시리즈 공통 마무리 표현"]], "audio": "audio/4_고난도/4-003 2. 모임(Gathering)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-003 2. 모임(Gathering)_비교.mp3"}, {"id": "4-004", "cat": "advanced", "catName": "고난도 질문", "num": 2, "topic": "모임", "topicEn": "Gathering", "type": "이슈", "badge": "04 이슈", "enQ": "What complaints or concerns do people in your community have about gatherings and celebrations? Maybe they are unhappy about traffic or noise. Tell me what worries people about such events.", "enA": "That one's easy — parking and noise, in that order. My neighborhood is quiet and mostly residential, so the moment there's a festival down at the river park, the side streets fill up and the people who actually live there can't get home.\n\nThe noise is the bigger complaint though. Outdoor events run until eleven, and the sound carries straight up into the apartments. Older residents will put up with one night, but if it's a three-day festival, the complaints start on day two.\n\nWhat it boils down to is warning. When the district office sends a notice a week ahead and sets a hard finish time, almost nobody minds. The flip side is that these events keep the local shops alive, so nobody really wants them gone. People just want them to end when they said they would.", "koQ": "당신의 지역 사회 사람들은 모임과 기념 행사에 대해 어떤 불만이나 우려를 가지고 있나요? 사람들이 그런 행사에 대해 무엇을 걱정하는지 말해 주세요.", "koA": "그건 쉬워요. 주차랑 소음이에요. 순서까지 딱 그렇고요. 저희 동네는 조용한 주택가라 강변 공원에서 축제가 열리는 순간 골목이 차로 꽉 차서 정작 거기 사는 사람이 집에 못 들어가요.\n\n그래도 불만이 더 큰 쪽은 소음이에요. 야외 행사는 11시까지 이어지는데 그 소리가 아파트 위쪽으로 그대로 올라가거든요. 어르신들도 하루는 참아 주시는데 사흘짜리 축제면 이틀째부터 민원이 들어갑니다.\n\n결국 핵심은 예고예요. 구청에서 일주일 전에 안내문을 돌리고 종료 시간을 못 박아 두면 대부분은 문제 삼지 않아요. 반대로 보면 이런 행사가 동네 가게를 먹여 살리니까 아무도 없애자고는 하지 않습니다. 말한 시간에 제대로 끝내 주기만 바라는 거죠.", "struct": [["1️⃣ 두 개", "불만은 주차 · 소음 두 개 ✨ 순서까지"], ["2️⃣ 주차", "강변 축제 → 골목이 꽉 참 → 못 들어감"], ["3️⃣ 소음", "11시까지 ⏰ 사흘이면 이틀째부터 민원"], ["4️⃣ 원인", "결국 예고 부족 → 안내문이면 해결"], ["5️⃣ 균형", "없애자는 게 아니라 제시간에 끝내자 ⭐"]], "scoring": [["불만은 두 개", "문제가 교통 · 소음을 예시로 먼저 던져 줬어요 🔑 그 둘을 그대로 받아 답변 뼈대로 삼으면 말하는 중간에 길을 잃지 않습니다"], ["경중을 가르기", "두 개를 나란히 놓기만 하면 목록 ⭐ 그래도 더 큰 쪽은 소음이라고 순위를 매기는 한마디가 들어가야 단순 나열이 아니라 분석으로 들립니다"], ["해결까지 말하기", "이슈 유형은 어떻게 다루냐까지 묻는 경우가 많아요 ✅ 안내문 · 종료 시간 같은 구체적 장치를 대 주면 걱정만 늘어놓는 답변과 점수가 확실히 갈립니다"], ["양면으로 닫기", "가게에는 돈이 되니 없애자는 건 아니다 🔁 이 마무리가 이 페이지의 승부처예요. 고난도는 한쪽 편만 드는 답보다 양면을 보는 답이 항상 높게 갑니다"]], "expr": [["in that order", "순서까지 그대로", "두 개를 셀 때 뒤에 붙이기 ✨ 순위까지 말해 주는 한마디"], ["mostly residential", "거의 주택가인", "동네 성격을 형용사 하나로 🏠 뒤에 올 불만이 정당해져요"], ["the side streets fill up", "골목이 차로 차다", "주차난을 힘들다 대신 장면으로 📏 골목이 꽉 찬다는 한 컷"], ["the bigger complaint", "더 큰 불만", "두 불만의 경중 가르기 🔑 이 한 줄로 나열이 분석이 돼요"], ["run until eleven", "11시까지 이어지다", "몇 시까지인지 숫자로 ⏰ 불만이 구체적으로 들리기 시작해요"], ["carry straight up", "그대로 위로 퍼지다", "소리가 위층으로 올라가는 경로를 동사 하나로 ✨ 압축 묘사"], ["put up with ~", "~을 참고 견디다", "참고 견디다 🔑 민원 주제라면 반드시 한 번은 나오는 구동사"], ["the complaints start", "민원이 들어가기 시작하다", "민원이 언제부터 터지는지 시점 표시 💬 이슈 유형 전용 표현"], ["What it boils down to", "결국 핵심은 ~이다", "늘어놓은 불만을 원인 하나로 수렴 ⭐ 고급 요약 구문 1순위"], ["a hard finish time", "못 박은 종료 시간", "해결책을 막연히 대신 장치 하나로 ✅ 안내문과 세트로 사용"], ["The flip side is ~", "반대로 보면 ~이다", "반대편 사정까지 보여 주며 닫기 ⭐ 한쪽 편만 드는 답 압도"]], "audio": "audio/4_고난도/4-004 2. 모임(Gathering)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-004 2. 모임(Gathering)_이슈.mp3"}, {"id": "4-005", "cat": "advanced", "catName": "고난도 질문", "num": 3, "topic": "명절", "topicEn": "Holidays", "type": "비교", "badge": "05 비교", "enQ": "Talk about the holidays in your country. What do people usually do during them? Describe the holiday activities people enjoy in detail.", "enA": "We have two big ones — Seollal in winter and Chuseok in autumn. Both work the same way: everybody drives to their hometown on the same day, the family gathers at the eldest son's place, and the kitchen turns into a factory.\n\nWhat changes is the menu. Seollal is rice cake soup — eat a bowl and you're one year older — plus New Year's bows and lucky money for the kids. Chuseok is half-moon rice cakes, fruit on the table, and the full moon outside.\n\nAfter the food, the pattern is identical. The grown-ups nap, the cousins play yut, and somebody loses at cards and won't let it go. If I had to pick, Seollal — I like the fresh-start feeling. But both are really about the same thing: too much food and people you see twice a year.", "koQ": "당신의 나라에 있는 명절에 대해 말해 주세요. 사람들은 보통 명절에 무엇을 하나요? 사람들이 즐기는 명절 활동을 자세히 설명해 주세요.", "koA": "큰 명절이 두 개예요. 겨울의 설날과 가을의 추석이요. 돌아가는 방식은 똑같아요. 다들 같은 날에 고향으로 차를 몰고, 가족이 큰집에 모이고, 부엌은 공장으로 변합니다.\n\n달라지는 건 메뉴예요. 설날은 떡국이에요. 한 그릇 먹으면 한 살 더 먹는 거죠. 거기에 세배와 세뱃돈이 붙고요. 추석은 송편과 상에 올리는 과일, 그리고 창밖의 보름달이에요.\n\n밥을 먹고 나면 패턴은 완전히 같아요. 어른들은 낮잠을 자고, 사촌들은 윷놀이를 하고, 누군가는 화투에서 지고 그걸 계속 곱씹죠. 굳이 고르라면 설날이요. 새 출발하는 기분이 좋거든요. 그래도 둘 다 결국 같은 얘기예요. 너무 많은 음식, 그리고 일 년에 두 번 보는 사람들.", "struct": [["1️⃣ 두 개", "겨울 설날 · 가을 추석 두 개부터"], ["2️⃣ 공통", "같은 날 귀성 → 큰집 → 부엌은 공장 🔁"], ["3️⃣ 설날", "떡국 = 한 살 더 + 세배 · 세뱃돈"], ["4️⃣ 추석", "송편 · 과일 · 보름달 → 낮잠과 윷놀이"], ["5️⃣ 마무리", "고르라면 설날! 결국 음식과 사람 😊"]], "scoring": [["두 개로 시작", "명절이 몇 개냐부터 못 박기 🔑 설날 · 추석 두 개로 세워 두면 단락이 저절로 나뉘고 분량까지 같이 채워집니다"], ["같음 → 다름", "구조는 같고 메뉴만 다르다로 묶어 주기 ⭐ 나열이 아니라 분석으로 들리는 지점이에요. 이 문제에 비교 배지가 붙은 이유이기도 합니다"], ["문화어 그대로", "떡국 · 세배 · 송편 · 윷놀이 📖 번역만 붙여 그대로 쓰면 문화 설명 점수를 통째로 가져올 수 있어요. 돌발 휴일 편에서 이미 쓴 세트입니다 🔁"], ["두 번 보는 사람", "일 년에 두 번 보는 사람들 😊 이 한마디가 명절의 본질을 찌르는 마무리예요. 유머와 통찰을 한 줄에 같이 챙기는 고난도 방법입니다"]], "expr": [["two big ones", "큰 명절 두 개", "두 개로 먼저 세우고 여는 도입 🔑 답변의 뼈대가 바로 잡혀요"], ["gather at ~", "~에 모이다", "돌발 휴일 편 재활용 🔁 귀성을 동사 하나로 처리하는 방법"], ["turn into a factory", "공장으로 변하다", "돌발 휴일 편 재활용 🔁 명절 부엌 풍경을 한 컷으로 압축"], ["rice cake soup", "떡국", "떡국 📖 설명을 따로 붙이지 않아도 바로 통하는 표준 번역"], ["one year older", "한 살 더 먹는", "한국식 나이 문화를 한 구로 ✨ 문화 설명 점수까지 확보돼요"], ["New Year's bow", "세배", "세배 🎓 절하는 동작까지 같이 떠오르게 해 주는 번역이에요"], ["lucky money", "세뱃돈", "세뱃돈 💳 돈 봉투 문화를 어색함 하나 없이 옮긴 표현이죠"], ["half-moon rice cake", "송편", "송편 📖 모양으로 풀어낸 번역이라 설명이 아예 필요 없어요"], ["play yut", "윷놀이를 하다", "윷놀이 🧩 명절 놀이는 이 표현 하나만 알아도 충분합니다"], ["the fresh-start feeling", "새 출발의 기분", "돌발 휴일 편 재활용 🔁 설날을 고르는 이유 자리에 사용해요"], ["both are about the same thing", "둘 다 결국 같은 것", "갈라 놓은 둘을 다시 묶어 주는 마무리 ⭐ 고난도 전용 기술"]], "audio": "audio/4_고난도/4-005 3. 명절(Holidays)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-005 3. 명절(Holidays)_비교.mp3"}, {"id": "4-006", "cat": "advanced", "catName": "고난도 질문", "num": 3, "topic": "명절", "topicEn": "Holidays", "type": "이슈", "badge": "06 이슈", "enQ": "What kinds of problems or concerns do people in your country have during holidays? What causes them, and how do people deal with those issues?", "enA": "Three things, in that order — traffic, the cooking, and the questions. A four-hour drive turns into ten, because everybody leaves on the same morning. There's no way around it — the whole country moves on the same weekend, and it has been that way forever.\n\nThe cooking is what people actually argue about. It still lands on the women in a lot of families, and two days in the kitchen for a meal that takes twenty minutes wears people out. Then the relatives start — job, marriage, when are you buying a house.\n\nSo how do people deal with it? They split the drive — leave at four in the morning, or a day late. Many families now order the food in. And some just skip it and fly somewhere. The holiday is still there. People have only stopped doing it the hard way.", "koQ": "당신의 나라 사람들은 명절에 어떤 문제나 우려를 가지고 있나요? 무엇이 그 문제를 만들고, 사람들은 그것을 어떻게 다루나요?", "koA": "세 가지예요. 순서까지 그대로고요. 교통, 음식 준비, 그리고 질문이요. 네 시간 거리가 열 시간이 돼요. 다들 같은 날 아침에 출발하니까요. 피할 방법이 없어요. 나라 전체가 같은 주말에 움직이거든요. 예전부터 쭉 그랬고요.\n\n사람들이 실제로 다투는 건 음식 준비예요. 아직도 많은 집에서 여자들 몫으로 떨어지고, 20분이면 끝나는 식사를 위해 이틀을 부엌에서 보내면 지칠 수밖에 없죠. 그러고 나면 친척들 질문이 시작돼요. 직장, 결혼, 집은 언제 사냐.\n\n그럼 어떻게 대처하냐고요? 출발을 쪼개요. 새벽 네 시에 나가거나 하루 늦게 가거나요. 요즘은 음식을 주문하는 집도 많고요. 아예 건너뛰고 해외로 나가는 사람도 있어요. 명절은 그대로 있어요. 다만 어렵게 하는 방식을 그만둔 거죠.", "struct": [["1️⃣ 세 개", "교통 · 음식 준비 · 친척 질문 순서대로"], ["2️⃣ 교통", "4시간 → 10시간. 다 같은 날 아침 출발"], ["3️⃣ 음식", "아직 여자들 몫 · 이틀 준비 vs 20분"], ["4️⃣ 질문", "직장 · 결혼 · 집은 언제 사냐 😆"], ["5️⃣ 대처", "출발 쪼개기 · 음식 주문 · 해외로 ✈️"]], "scoring": [["원인과 대처", "문제 · 원인 · 대처 세 가지를 묻고 있어요 ✅ 단락마다 하나씩 맡겨 두면 그대로 답이 완성됩니다"], ["세 개로 못 박기", "교통 · 음식 · 질문 세 개로 세우고 순서까지 매기기 🔑 목록으로 들리느냐 분석으로 들리느냐가 바로 이 한 줄에서 갈립니다"], ["대처가 절반", "걱정만 늘어놓으면 반만 답한 거예요 ⭐ 출발 쪼개기 · 음식 주문 · 해외처럼 구체적인 대처를 대 주면 점수가 확실히 갈립니다"], ["3번 ①번과 짝", "①번이 명절에 무엇을 하나였다면 여기는 그 뒷면이에요 🔁 같은 소재를 문제의 각도로 뒤집어 쓰는 것이 고난도 이슈 유형입니다"]], "expr": [["in that order", "순서까지 그대로", "2번 ②번 재활용 🔁 순위까지 붙여 주는 짧고 강한 한마디"], ["turn into ten", "열 시간이 되다", "4 → 10 숫자 대비 하나로 정체를 그대로 증명해 줍니다 📏"], ["the whole country moves", "나라 전체가 움직이다", "민족 대이동을 한 문장으로 ⭐ 고난도 압축 표현의 표본이죠"], ["land on ~", "~의 몫으로 떨어지다", "부담이 누구에게 가는지를 동사로 🔑 아주 고급스러운 표현"], ["wear people out", "사람을 지치게 하다", "힘들다 대신 쓰는 구동사 💪 원인까지 함께 담아내 줍니다"], ["when are you buying a house", "집은 언제 사냐", "잔소리를 인용으로 그대로 💬 웃음 포인트까지 같이 확보"], ["How do people deal with it?", "어떻게 대처하나요?"
