ime", "동시에"], ["take a day off", "연차를 내다"], ["boring time", "심심한 시간"], ["gives you an event ↔ hours", "이벤트 ↔ 시간"], ["close the distance", "거리를 좁히다"], ["Compare that to ~", "그것과 비교하면"]], "audio": "audio/4_고난도/4-007 4. 휴일·명절(Days Off)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-007 4. 휴일·명절(Days Off)_비교.mp3"}, {"id": "4-008", "cat": "advanced", "catName": "고난도 질문", "num": 4, "topic": "휴일·명절", "topicEn": "Days Off", "type": "이슈", "badge": "08 이슈", "enQ": "These days, the news often talks about holidays as a chance for people to rest and recharge. Have you seen any stories about how holidays influence people's lives or routines? Why do you think taking time off during holidays is seen as important?", "enA": "I did see something about this — substitute holidays. When a public holiday falls on a weekend, we now get the Monday instead. It was all over the news, mostly because everyone was counting the long weekends on a calendar.\n\nThe other story that keeps coming back is unused annual leave. A lot of office workers leave days on the table every year, so companies now push people to use them. My own office sends a reminder in November, which tells you how bad it got.\n\nWhy does it matter? Because rest isn't a reward — it's part of the job. Personally, I notice it in myself: after a long weekend I come back sharper, and after a skipped one I just move slower. A day off isn't lost time. It's the reason the other days work.", "koQ": "요즘 뉴스는 휴일을 쉬고 재충전하는 기회로 다룹니다. 휴일이 삶이나 일상에 주는 영향을 다룬 이야기를 본 적 있나요? 왜 휴일에 쉬는 게 중요하다고 보나요?", "koA": "그런 뉴스 본 적 있어요. 대체공휴일이요. 공휴일이 주말과 겹치면 이제 월요일을 대신 쉬어요. 뉴스에 엄청 많이 나왔죠. 다들 달력 놓고 연휴를 세고 있었거든요.\n\n계속 다시 올라오는 다른 기사는 안 쓴 연차예요. 사무직 중에 해마다 연차를 남기는 사람이 많아서, 이제는 회사가 쓰라고 떠밀죠. 저희 회사도 11월이면 알림을 보내요. 상황이 어느 정도인지 알 만하죠.\n\n왜 중요하냐고요? 쉬는 건 보상이 아니라 일의 일부니까요. 개인적으로도 느껴요. 긴 연휴 뒤에는 머리가 더 잘 돌아가고, 건너뛴 다음엔 그냥 느려져요. 쉬는 날은 잃어버린 시간이 아니에요. 나머지 날들이 굴러가는 이유죠.", "struct": [["1️⃣ 뉴스", "대체공휴일 → 주말과 겹치면 월요일로"], ["2️⃣ 반응", "다들 달력 놓고 연휴 세기 😆 화제였음"], ["3️⃣ 기사", "안 쓴 연차 · 회사가 쓰라고 떠미는 중"], ["4️⃣ 사례", "우리 회사도 11월이면 알림 발송 ⏰"], ["5️⃣ 의견", "쉬는 건 보상이 아니라 일의 일부 ⭐"]], "expr": [["I did see something about ~", "그런 뉴스 본 적 있어요"], ["substitute holiday", "대체공휴일"], ["fall on a weekend", "주말과 겹치다"], ["be all over the news", "뉴스에 도배되다"], ["count the long weekends", "연휴를 세다"], ["keep coming back", "계속 다시 올라오다"], ["unused annual leave", "안 쓴 연차"], ["leave days on the table", "연차를 남기다"], ["Why does it matter?", "왜 중요하냐면"], ["rest isn't a reward", "쉬는 건 보상이 아니다"], ["come back sharper", "더 잘 돌아오다"]], "audio": "audio/4_고난도/4-008 4. 휴일·명절(Days Off)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-008 4. 휴일·명절(Days Off)_이슈.mp3"}, {"id": "4-009", "cat": "advanced", "catName": "고난도 질문", "num": 5, "topic": "건강", "topicEn": "Health", "type": "비교", "badge": "09 비교", "enQ": "How did people in your country stay healthy when you were young, and how do they do it now? Tell me how the ways people maintain their health have changed over time.", "enA": "Back then, staying healthy wasn't a plan — it was just how life worked. People walked everywhere, climbed a mountain on Sundays, and ate whatever was on the table: rice, soup, a wall of side dishes. Nobody counted anything or called it exercise.\n\nThese days it's a completely different story. Health has become something you measure. Everyone wears a watch that counts steps and heart rate, follows a home workout, and stacks supplements on the shelf. We even book check-ups we used to skip, and my parents now check a sleep score too.\n\nCompared to back then, we know way more and move way less. The trade-off is clear: my parents never heard the word protein, but they walked an hour a day without calling it exercise. I have to admit the data helps. It just can't walk.", "koQ": "당신이 어릴 때 당신의 나라 사람들은 어떻게 건강을 유지했나요? 지금은 어떤가요? 건강 관리 방법이 어떻게 변했는지 말해 주세요.", "koA": "예전엔 건강 관리가 계획이 아니라 그냥 사는 방식이었어요. 다들 걸어 다녔고, 일요일이면 산에 올랐고, 상에 올라온 걸 먹었어요. 밥, 국, 줄줄이 늘어선 반찬이요. 아무도 뭘 세거나 운동이라고 부르지 않았고요.\n\n요즘은 완전히 다른 이야기예요. 건강이 측정하는 것이 됐거든요. 다들 걸음 수와 심박을 재는 시계를 차고, 홈트 영상을 따라 하고, 부엌 선반에 영양제를 쌓아 둬요. 예전엔 건너뛰던 검진도 예약하고요. 부모님도 아침이면 수면 점수를 확인하세요.\n\n예전과 비교하면 훨씬 많이 알고 훨씬 덜 움직여요. 얻고 잃은 게 바로 보이죠. 부모님은 단백질이라는 말도 모르셨지만 운동이라고 부르지 않으면서 하루 한 시간을 걸으셨어요. 데이터가 도움이 된다는 건 인정해요. 다만 대신 걸어 주지는 않죠.", "struct": [["1️⃣ 과거", "건강 관리 = 계획이 아니라 사는 방식"], ["2️⃣ 장면", "어디든 걷기 · 일요일 등산 · 집밥"], ["3️⃣ 현재", "측정의 시대 → 걸음 수 · 심박 · 검진"], ["4️⃣ 대비", "훨씬 많이 알고 훨씬 덜 움직임 ⭐"], ["5️⃣ 마무리", "데이터는 대신 걸어 주지 않는다 😊"]], "expr": [["Back then ↔ These days", "그때는 ↔ 요즘은"], ["how life worked", "그냥 사는 방식"], ["walk everywhere", "어디든 걸어 다니다"], ["a wall of side dishes", "줄줄이 늘어선 반찬"], ["count anything", "뭐든 숫자로 세다"], ["something you measure", "측정하는 것"], ["count steps and heart rate", "걸음 수와 심박을 재다"], ["stack supplements", "영양제를 쌓아 두다"], ["book a check-up", "건강검진을 예약하다"], ["The trade-off is ~", "대신 잃는 건 ~이다"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/4_고난도/4-009 5. 건강(Health)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-009 5. 건강(Health)_비교.mp3"}, {"id": "4-010", "cat": "advanced", "catName": "고난도 질문", "num": 5, "topic": "건강", "topicEn": "Health", "type": "이슈", "badge": "10 이슈", "enQ": "Talk about some health-related news you have recently read or watched. What was it about? Do people often discuss that news, and what do they think about the issue?", "enA": "I did see something about this recently — ultra-processed food. The point wasn't sugar or fat. It was how far the food has travelled from its original form, and it was everywhere for about a month, which almost never happens with a food story.\n\nDo people talk about it? Constantly. My office turned into a label-reading club for a while — everyone flipping packets over at lunch to count the ingredients. Even the convenience store downstairs moved the protein snacks to the front and pushed the sweet ones to the back shelf.\n\nOpinions are split, though. Some call it another scare story that will pass in a year. Others quietly changed what they buy. Personally, I think the useful part wasn't the warning itself — it was that people finally started looking at what they actually eat instead of only counting calories.", "koQ": "최근에 읽거나 본 건강 관련 뉴스에 대해 말해 주세요. 어떤 내용이었나요? 사람들이 자주 이야기하나요? 그 문제를 어떻게 생각하나요?", "koA": "최근에 그런 뉴스 봤어요. 초가공식품이요. 설탕이나 지방이 핵심이 아니라, 그 음식이 원래 형태에서 얼마나 멀어졌느냐가 문제라는 거였죠. 한 달쯤은 어디서나 그 얘기였는데, 음식 기사가 그렇게까지 퍼지는 일은 거의 없거든요.\n\n사람들이 얘기하냐고요? 계속해요. 한동안 저희 사무실은 성분표 읽기 모임이 됐어요. 점심때마다 다들 봉지를 뒤집어서 원재료 개수를 세고 있었거든요. 아래층 편의점도 단백질 간식을 앞쪽 매대로 옮기고 단 과자는 뒤로 밀어 놨어요.\n\n그래도 의견은 갈려요. 또 하나의 공포 기사고 일 년이면 지나갈 거라는 사람도 있고, 조용히 장 보는 걸 바꾼 사람도 있어요. 개인적으로는 경고 자체보다, 사람들이 칼로리만 세는 대신 자기가 실제로 뭘 먹는지 들여다보기 시작했다는 게 진짜 소득이라고 봐요.", "struct": [["1️⃣ 뉴스", "초가공식품 → 원래 형태에서 멀어진 것"], ["2️⃣ 화제", "한 달 내내 어디서나 그 얘기 💬"], ["3️⃣ 반응", "사무실은 성분표 읽기 모임 · 봉지 뒤집기"], ["4️⃣ 변화", "편의점 매대까지 바뀜 → 영향의 증거"], ["5️⃣ 의견", "들여다보기 시작한 게 소득 ⭐ Personally"]], "expr": [["ultra-processed food", "초가공식품"], ["far from its original form", "원래 형태에서 먼"], ["be everywhere for a month", "한 달 내내 화제였다"], ["Do people talk about it?", "사람들이 얘기하나요"], ["a label-reading club", "성분표 읽기 모임"], ["flip a packet over", "봉지를 뒤집다"], ["move ~ to the front", "~을 앞쪽으로 옮기다"], ["Opinions are split", "의견이 갈리다"], ["another scare story", "또 하나의 공포 기사"], ["quietly change what they buy", "조용히 장 보는 걸 바꾸다"], ["Personally, ~", "개인적으로는 ~"]], "audio": "audio/4_고난도/4-010 5. 건강(Health)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-010 5. 건강(Health)_이슈.mp3"}, {"id": "4-011", "cat": "advanced", "catName": "고난도 질문", "num": 6, "topic": "헬스장", "topicEn": "Gym", "type": "비교", "badge": "11 비교", "enQ": "People go to the gym with many different goals. What are some typical goals people have when they exercise there? Why might one person focus on a certain goal more than others?", "enA": "People walk into a gym with three completely different goals. Some want to lose weight, some want to build muscle, and some — like me — just want their body to stop complaining by the end of the day, which is a lower bar than it sounds.\n\nWhat decides it is usually your life, not your personality. A student has time and wants to look different. An office worker has a stiff neck from eight hours in a chair and wants to keep it moving. Someone older wants to stay independent for as long as possible.\n\nThat's why one room can look like three rooms — the mirrors, the free weights, and the quiet corner with the mats. If I had to pick the most common goal these days, it's the third one. People come in to undo their desk, not to win anything.", "koQ": "사람들은 다양한 목표를 가지고 헬스장에 갑니다. 사람들이 헬스장에서 갖는 일반적인 목표는 무엇인가요? 왜 어떤 사람은 특정 목표에 더 집중할까요?", "koA": "사람들은 완전히 다른 세 목표를 가지고 헬스장에 들어와요. 누구는 살을 빼고, 누구는 몸을 만들고, 저 같은 사람은 그냥 하루가 끝날 때 몸이 아우성치지 않기를 바랄 뿐이에요. 말은 소박해 보여도 생각보다 어려운 목표죠.\n\n그걸 정하는 건 보통 성격이 아니라 삶이에요. 학생은 시간이 있고 달라 보이고 싶어 해요. 직장인은 여덟 시간 의자에 앉아 굳은 목을 데리고 와서 계속 움직이게 하고 싶어 하고요. 나이가 있는 분들은 가능한 한 오래 스스로 생활하는 상태를 지키고 싶어 하시고요.\n\n그래서 한 공간이 세 개처럼 보여요. 거울 앞, 프리웨이트 구역, 그리고 매트가 깔린 조용한 구석이요. 요즘 가장 흔한 목표를 굳이 고르라면 세 번째예요. 사람들은 뭘 이기러 오는 게 아니라 자기 책상을 되돌리러 오거든요.", "struct": [["1️⃣ 세 개", "살 빼기 · 몸 만들기 · 버티기 세 갈래"], ["2️⃣ 기준", "성격이 아니라 삶이 정함 → 학생 · 직장인"], ["3️⃣ 사례", "8시간 의자 → 굳은 목 → 계속 움직이려고"], ["4️⃣ 장면", "거울 앞 · 프리웨이트 · 조용한 구석"], ["5️⃣ 마무리", "요즘 제일 흔한 건 책상을 되돌리기 ⭐"]], "expr": [["three completely different goals", "완전히 다른 세 목표"], ["lose weight ↔ build muscle", "감량 ↔ 벌크업"], ["stop complaining", "아우성을 멈추다"], ["What decides it is ~", "그걸 정하는 건 ~이다"], ["to look different", "달라 보이려고"], ["a stiff neck", "굳은 목"], ["keep it moving", "계속 움직이게 하다"], ["stay independent", "스스로 생활하다"], ["the quiet corner with the mats", "매트 깔린 조용한 구석"], ["undo your desk", "책상을 되돌리다"], ["If I had to pick", "굳이 고르라면"]], "audio": "audio/4_고난도/4-011 6. 헬스장(Gym)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-011 6. 헬스장(Gym)_비교.mp3"}, {"id": "4-012", "cat": "advanced", "catName": "고난도 질문", "num": 6, "topic": "헬스장", "topicEn": "Gym", "type": "이슈", "badge": "12 이슈", "enQ": "Gyms have recently been in the news as places where people not only exercise but also build a community. Have you seen any stories about how gyms influence social life or daily routines? Why do you think more people treat gyms as social spaces these days?", "enA": "I have seen that, yes — mostly about running crews and climbing gyms. The reports said people sign up for the group, not the workout, and that bouldering gyms now have a waiting list on weekday evenings, which used to be unthinkable.\n\nWhy is that happening? Two reasons. More people live alone, and after work they want company that doesn't come with obligations. And apps make it one tap — you join a crew, show up on Thursday, and nobody asks for your number.\n\nPersonally, I get it. On my own I quit in three weeks. With people waiting at the river at seven, I go even when I don't want to. A gym used to be a room with machines. Now it's closer to a club that happens to have equipment.", "koQ": "최근 헬스장은 운동뿐 아니라 커뮤니티를 만드는 공간으로 뉴스에 나옵니다. 그런 이야기를 본 적 있나요? 왜 사람들이 헬스장을 사교 공간으로 여길까요?", "koA": "네, 그런 기사 봤어요. 주로 러닝 크루랑 클라이밍장 얘기였죠. 사람들이 운동이 아니라 모임에 등록한다는 내용이었고, 평일 저녁 볼더링장에는 이제 대기자 명단까지 생겼다고 하더라고요. 예전 같으면 상상도 못 할 일이죠.\n\n왜 그럴까요? 이유는 두 개라고 봐요. 혼자 사는 사람이 늘었고, 퇴근 후에 의무가 따라오지 않는 관계를 원하거든요. 그리고 앱이 그걸 한 번에 되게 만들어요. 크루에 가입하고, 목요일에 나가고, 아무도 전화번호를 묻지 않죠.\n\n개인적으로도 이해가 가요. 혼자서는 3주면 그만두거든요. 그런데 일곱 시에 강변에서 사람들이 기다리면 하기 싫은 날에도 나가게 돼요. 예전에 헬스장은 기계가 놓인 방이었어요. 지금은 장비가 있는 클럽에 더 가깝습니다.", "struct": [["1️⃣ 뉴스", "러닝 크루 · 클라이밍장 커뮤니티 기사"], ["2️⃣ 근거", "평일 저녁 대기 · 운동 아닌 모임에 등록"], ["3️⃣ 원인", "1인 가구 증가 + 의무 없는 관계 수요"], ["4️⃣ 장치", "앱으로 한 번에 가입 → 번호도 안 물음"], ["5️⃣ 의견", "혼자면 3주, 기다리면 계속 감 ⭐"]], "expr": [["running crew", "러닝 크루"], ["sign up for the group", "모임에 등록하다"], ["a waiting list", "대기자 명단"], ["Why is that happening?", "왜 그런 걸까요"], ["live alone", "혼자 살다"], ["come with obligations", "의무가 따라오다"], ["make it one tap", "한 번에 되게 하다"], ["On my own", "혼자서는"], ["quit in three weeks", "3주 만에 그만두다"], ["a room with machines", "기계가 놓인 방"], ["even when I don't want to", "하기 싫은 날에도"]], "audio": "audio/4_고난도/4-012 6. 헬스장(Gym)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-012 6. 헬스장(Gym)_이슈.mp3"}, {"id": "4-013", "cat": "advanced", "catName": "고난도 질문", "num": 7, "topic": "공원", "topicEn": "Parks", "type": "비교", "badge": "13 비교", "enQ": "Choose two well-known parks and compare them. How are the two parks similar, and how are they different? Which one do you prefer? Tell me how they differ.", "enA": "Let me take Hangang Park and Olympic Park. What they have in common is scale — both are big enough that you can't see the end of them — and both are free, which in a city like Seoul matters more than it sounds, because almost nothing else is.\n\nThe difference is what they're shaped for. Hangang is long and flat, laid along the river: running, cycling, fried chicken on a mat at ten at night. Olympic Park is hills, lawns and old sculptures, plus a dome that hosts concerts on the far side.\n\nSo one is for moving and the other is for staying. If I had to pick, Hangang — it's ten minutes from my place and I run there in the evening. But compared to Hangang, Olympic Park is where I'd go to actually sit down and do nothing.", "koQ": "잘 알려진 공원 두 곳을 골라 비교해 주세요. 두 공원은 어떤 점이 비슷하고 어떤 점이 다른가요? 어느 쪽을 더 좋아하나요?", "koA": "한강공원과 올림픽공원으로 할게요. 두 곳의 공통점은 규모예요. 둘 다 끝이 안 보일 만큼 크고, 게다가 둘 다 무료거든요. 서울 같은 도시에서 이건 생각보다 큰 장점이에요. 공짜인 공간이 거의 없으니까요.\n\n차이는 어떤 용도로 생긴 공간이냐예요. 한강은 강을 따라 길고 평평해요. 달리고, 자전거 타고, 밤 열 시에 돗자리 펴고 치킨을 먹는 곳이죠. 올림픽공원은 언덕과 잔디밭, 오래된 조각들, 그리고 저쪽 끝에 공연이 열리는 돔이 있는 곳이고요.\n\n그러니까 한쪽은 움직이는 곳이고 다른 한쪽은 머무는 곳이에요. 굳이 고르라면 한강이요. 집에서 10분이고 저녁마다 거기서 뛰거든요. 그래도 한강과 비교하면, 진짜로 앉아서 아무것도 안 하고 싶을 때 가는 곳은 올림픽공원이에요.", "struct": [["1️⃣ 선정", "한강공원 · 올림픽공원 두 곳을 지정"], ["2️⃣ 공통", "끝이 안 보이는 규모 + 무료라는 공통점"], ["3️⃣ 차이", "한강 = 길고 평평 · 러닝 · 밤 열 시 야식"], ["4️⃣ 대조", "올림픽공원 = 언덕 · 잔디 · 조각 · 돔 🔁"], ["5️⃣ 선호", "움직이는 곳 vs 머무는 곳 → 저는 한강"]], "expr": [["What they have in common", "두 곳의 공통점은"], ["can't see the end of it", "끝이 안 보이다"], ["what they are shaped for", "어떤 용도로 생겼나"], ["long and flat", "길고 평평한"], ["fried chicken on a mat", "돗자리 위의 치킨"], ["hills, lawns and sculptures", "언덕 · 잔디 · 조각"], ["a dome that hosts concerts", "공연이 열리는 돔"], ["for moving ↔ for staying", "움직이는 곳 ↔ 머무는 곳"], ["compared to ~", "~과 비교하면"], ["to actually sit down", "진짜로 앉아 있으려고"], ["it matters more than it sounds", "생각보다 큰 장점이다"]], "audio": "audio/4_고난도/4-013 7. 공원(Parks)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-013 7. 공원(Parks)_비교.mp3"}, {"id": "4-014", "cat": "advanced", "catName": "고난도 질문", "num": 7, "topic": "공원", "topicEn": "Parks", "type": "이슈", "badge": "14 이슈", "enQ": "Tell me about the problems parks are facing these days. What difficulties do they have, and what caused these concerns? How can these problems be solved, and what should people do?", "enA": "Two problems stand out — rubbish and bicycles. Delivery has moved outdoors, so on a summer night the grass is covered in plastic containers, and the city keeps taking bins away to stop people dumping household waste there, which only makes it worse.\n\nThe other one is traffic inside the park. Cyclists and walkers share the same strip, and at seven in the evening it's a near miss every hundred meters, especially where the path bends. What caused it is simple: the crowds doubled and the paths stayed the same width for ten years.\n\nIt can be fixed, though. Put sorting stations back at the exits instead of removing bins, and separate the lanes properly. And people have to carry their own rubbish out. A park is the one space nobody owns, which is why it needs everybody.", "koQ": "요즘 공원들이 겪는 문제에 대해 말해 주세요. 어떤 어려움이 있고 무엇이 그 문제를 만들었나요? 어떻게 해결할 수 있고 사람들은 무엇을 해야 할까요?", "koA": "눈에 띄는 문제는 두 개예요. 쓰레기와 자전거요. 배달이 밖으로 나오면서 여름밤이면 잔디밭이 플라스틱 용기로 덮이죠. 그런데 시는 생활 쓰레기를 버린다는 이유로 쓰레기통을 자꾸 치우는데, 그게 오히려 상황을 더 나쁘게 만들어요.\n\n다른 하나는 공원 안의 교통이에요. 자전거와 보행자가 같은 길을 나눠 쓰거든요. 저녁 일곱 시면 백 미터마다 아슬아슬한 순간이 생기죠. 길이 꺾이는 곳은 특히 그렇고요. 원인은 간단해요. 사람은 두 배가 됐는데 길은 10년째 그대로 그 폭이니까요.\n\n그래도 고칠 수 있어요. 쓰레기통을 없애는 대신 출구마다 분리수거 스테이션을 두고, 자전거 길과 산책로를 나누면 되죠. 그리고 자기 쓰레기는 자기가 들고 나가야죠. 공원은 아무도 소유하지 않은 유일한 공간이라 모두가 필요한 곳이거든요.", "struct": [["1️⃣ 두 개", "문제는 쓰레기와 자전거 두 가지 ✨"], ["2️⃣ 쓰레기", "배달 용기가 잔디를 덮음 + 쓰레기통 감소"], ["3️⃣ 충돌", "자전거와 보행자가 같은 길 → 백 미터마다"], ["4️⃣ 원인", "사람은 두 배, 길은 10년 전 그 폭"], ["5️⃣ 해결", "분리수거 · 길 분리 · 내 쓰레기는 내가 ✅"]], "expr": [["Two problems stand out", "문제 두 개가 두드러진다"], ["plastic containers", "플라스틱 배달 용기"], ["take bins away", "쓰레기통을 치우다"], ["share the same strip", "같은 길을 나눠 쓰다"], ["a near miss", "아슬아슬한 순간"], ["every hundred meters", "백 미터마다"], ["What caused it is ~", "원인은 ~이다"], ["stay the same width", "폭이 그대로다"], ["sorting stations", "분리수거 스테이션"], ["separate the lanes", "길을 분리하다"], ["the one space nobody owns", "아무도 소유하지 않은 공간"]], "audio": "audio/4_고난도/4-014 7. 공원(Parks)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-014 7. 공원(Parks)_이슈.mp3"}, {"id": "4-015", "cat": "advanced", "catName": "고난도 질문", "num": 8, "topic": "여가 시간", "topicEn": "Free Time", "type": "비교", "badge": "15 비교", "enQ": "People enjoy all kinds of experiences in their free time. Which kinds of experiences do you think people enjoy most? What do you think shapes a person's preferences for free-time activities?", "enA": "I'd sort it into three kinds. Recovery — sleep, a series, doing nothing. Stimulation — travel, concerts, somewhere new. And achievement — a workout, a course, a side project nobody asked for. Most people move between all three depending on the week.\n\nWhat shapes the preference isn't personality, I think. It's what your job takes from you. If you talk all day, your free time goes quiet. If you sit still all day, you want noise and movement instead. Money and hours decide most of the rest, because every preference has a price.\n\nChildhood counts too. People who were dragged up mountains as kids end up hiking; people who grew up in a library end up reading. If I had to pick the most common one now, it's recovery. Everyone is tired. That's the honest answer.", "koQ": "사람들은 여가 시간에 다양한 경험을 즐깁니다. 사람들이 가장 즐긴다고 생각하는 경험은 어떤 종류인가요? 여가 취향은 무엇이 결정한다고 보나요?", "koA": "저는 세 가지로 나눠요. 회복형은 잠, 드라마, 아무것도 안 하기. 자극형은 여행, 공연, 안 가 본 곳이고요. 성취형은 운동, 수업, 아무도 시키지 않은 사이드 프로젝트 같은 거예요. 대부분은 그 주 컨디션에 따라 셋 사이를 오가고요.\n\n취향을 결정하는 건 성격이 아니라고 봐요. 일이 나한테서 무엇을 가져가느냐예요. 하루 종일 말을 하는 사람은 여가가 조용해지고, 하루 종일 앉아만 있는 사람은 반대로 소리와 움직임을 원하게 되죠. 나머지는 대부분 돈과 시간이 정해요. 모든 취향에는 가격이 붙으니까요.\n\n어릴 때 경험도 한몫해요. 어릴 때 산에 끌려다닌 사람은 결국 등산을 하고, 도서관에서 자란 사람은 결국 책을 읽어요. 요즘 가장 흔한 걸 굳이 고르라면 회복형이에요. 다들 피곤하거든요. 그게 솔직한 답입니다.", "struct": [["1️⃣ 분류", "회복형 · 자극형 · 성취형 세 갈래로"], ["2️⃣ 기준", "성격이 아니라 일이 가져가는 것이 정함"], ["3️⃣ 대비", "말 많이 하면 조용한 여가 · 앉으면 소음"], ["4️⃣ 배경", "어릴 때 경험도 한몫 → 산이면 등산"], ["5️⃣ 마무리", "제일 흔한 건 회복형. 다들 피곤해요 😊"]], "expr": [["three kinds", "세 가지 종류"], ["recovery ↔ stimulation", "회복형 ↔ 자극형"], ["a side project nobody asked for", "아무도 시키지 않은 일"], ["What shapes ~ is ...", "~을 정하는 건 …이다"], ["what your job takes from you", "일이 가져가는 것"], ["talk all day", "하루 종일 말하다"], ["sit still all day", "하루 종일 앉아 있다"], ["Money and hours", "돈과 시간"], ["be dragged up mountains", "산에 끌려다니다"], ["grow up in a library", "도서관에서 자라다"], ["Everyone is tired.", "다들 피곤해요"]], "audio": "audio/4_고난도/4-015 8. 여가 시간(Free Time)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-015 8. 여가 시간(Free Time)_비교.mp3"}, {"id": "4-016", "cat": "advanced", "catName": "고난도 질문", "num": 8, "topic": "여가 시간", "topicEn": "Free Time", "type": "이슈", "badge": "16 이슈", "enQ": "Free time often comes up in the news as something that affects people's well-being. Have you come across any reports about how important having free time is? Why do you think free time can improve people's happiness or health?", "enA": "I did come across a few — mostly the four-day week trials. The reports said output stayed the same and people slept better, and that second part is what got shared everywhere, not the productivity figure the companies cared about.\n\nThe one that stuck with me was different, though. It said we have about the same free time as twenty years ago — it's just cut into pieces. Twenty minutes here, ten there, all of it with a phone in hand. The total looks fine on paper and feels like nothing in real life.\n\nWhy does free time matter? Because rest isn't only the absence of work — it's where you become a person again. Personally, one long evening does more for me than five broken ones. Free time doesn't work in fragments.", "koQ": "여가 시간은 삶의 질에 영향을 주는 것으로 뉴스에 자주 나옵니다. 그런 보도를 접한 적 있나요? 왜 여가 시간이 행복이나 건강에 도움이 된다고 보나요?", "koA": "그런 보도 몇 개 접했어요. 주로 주 4일제 실험 얘기였죠. 생산량은 그대로였고 사람들은 더 잘 잤다는 내용이었는데, 회사들이 신경 쓴 생산량 수치가 아니라 뒤쪽 이야기가 여기저기 퍼졌어요.\n\n그런데 제 기억에 남은 건 좀 다른 기사였어요. 우리가 가진 여가 시간 총량은 20년 전과 비슷한데, 그게 조각조각 잘려 있다는 거였거든요. 여기서 20분, 저기서 10분, 그 시간 내내 손에는 휴대폰이 들려 있고요. 총량은 멀쩡한데 실제로는 쉰 것 같지가 않아요.\n\n왜 여가가 중요하냐고요? 쉬는 게 단순히 일이 없는 상태가 아니라, 다시 사람이 되는 시간이기 때문이에요. 개인적으로는 긴 저녁 하나가 쪼개진 다섯 개보다 훨씬 나아요. 여가는 조각으로는 작동하지 않더라고요.", "struct": [["1️⃣ 뉴스", "주 4일제 실험 → 생산량 유지 · 수면 개선"], ["2️⃣ 확산", "그 뒷부분이 여기저기 퍼짐 💬 화제였음"], ["3️⃣ 기사", "여가 총량은 비슷한데 조각나 있다는 기사"], ["4️⃣ 장면", "여기서 20분 · 저기서 10분 · 손엔 폰"], ["5️⃣ 의견", "긴 저녁 하나 > 쪼개진 다섯 개 ⭐"]], "expr": [["I did come across ~", "그런 보도 접한 적 있어요"], ["the four-day week trial", "주 4일제 실험"], ["output stayed the same", "생산량은 그대로였다"], ["get shared everywhere", "여기저기 퍼지다"], ["stick with me", "기억에 남다"], ["cut into pieces", "조각조각 잘리다"], ["with a phone in hand", "손에 휴대폰을 든 채"], ["the absence of work", "일이 없는 상태"], ["become a person again", "다시 사람이 되다"], ["five broken ones", "쪼개진 다섯 개"], ["work in fragments", "조각으로 작동하다"]], "audio": "audio/4_고난도/4-016 8. 여가 시간(Free Time)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-016 8. 여가 시간(Free Time)_이슈.mp3"}, {"id": "4-017", "cat": "advanced", "catName": "고난도 질문", "num": 9, "topic": "카페", "topicEn": "Cafés", "type": "비교", "badge": "17 비교", "enQ": "People visit cafés for all kinds of reasons. In what ways do people commonly use cafés? How are those ways alike, and how are they different?", "enA": "People use a café in three completely different ways. Some treat it as an office — laptop open, headphones on. Some treat it as a living room for meeting friends. And some come alone to stare out of the window for an hour, which is a perfectly good reason to buy a coffee.\n\nWhat they all have in common is strange when you think about it. Nobody owns the space, but everybody acts like they do. The coffee is really rent — four thousand won buys you a chair, a table and permission to stay.\n\nThe difference is time and noise. The laptop crowd needs a socket and silence and stays for hours. The meeting crowd is loud and leaves in one. If I had to name the trend, it's the third one growing. A café sells time, not coffee.", "koQ": "사람들은 다양한 이유로 카페에 갑니다. 사람들이 카페를 이용하는 일반적인 방식에는 어떤 것들이 있나요? 그 방식들은 어떻게 비슷하고 어떻게 다른가요?", "koA": "사람들은 카페를 완전히 다른 세 가지 방식으로 써요. 누구는 사무실처럼 쓰죠. 노트북 열고 헤드폰 끼고요. 누구는 친구를 만나는 거실처럼 쓰고요. 그리고 누구는 혼자 와서 한 시간쯤 창밖만 봐요. 커피 한 잔 값으로는 충분히 괜찮은 이유죠.\n\n세 방식의 공통점은 생각해 보면 좀 이상해요. 아무도 그 공간을 소유하지 않는데 다들 자기 공간처럼 굴거든요. 커피값이 사실은 자릿세예요. 사천 원이면 의자 하나, 테이블 하나, 그리고 머물러도 된다는 허락을 사는 거죠.\n\n차이는 시간과 소음이에요. 노트북 쪽은 콘센트와 조용함이 필요하고 몇 시간씩 있어요. 만나러 온 쪽은 시끄럽고 한 시간이면 나가고요. 요즘 흐름을 굳이 꼽자면 세 번째가 늘고 있어요. 카페가 파는 건 커피가 아니라 시간이에요.", "struct": [["1️⃣ 세 개", "사무실 · 거실 · 혼자 창밖 보기 세 방식"], ["2️⃣ 공통", "아무도 소유 안 하는데 자기 공간처럼"], ["3️⃣ 정의", "커피값 = 자릿세. 사천 원에 의자 하나"], ["4️⃣ 차이", "콘센트 + 몇 시간 ↔ 시끄럽고 한 시간"], ["5️⃣ 마무리", "카페가 파는 건 커피가 아니라 시간 ⭐"]], "expr": [["three different ways", "완전히 다른 세 방식"], ["treat it as an office", "사무실처럼 쓰다"], ["a living room", "거실 같은 공간"], ["stare out of the window", "창밖을 멍하니 보다"], ["act like they do", "자기 것인 양 굴다"], ["The coffee is really rent", "커피값이 곧 자릿세"], ["a socket and silence", "콘센트와 조용함"], ["stay for hours", "몇 시간씩 머무르다"], ["leave in one", "한 시간이면 나가다"], ["If I had to name the trend", "흐름을 꼽자면"], ["sell time, not coffee", "커피가 아니라 시간을 팔다"]], "audio": "audio/4_고난도/4-017 9. 카페(Cafés)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-017 9. 카페(Cafés)_비교.mp3"}, {"id": "4-018", "cat": "advanced", "catName": "고난도 질문", "num": 9, "topic": "카페", "topicEn": "Cafés", "type": "이슈", "badge": "18 이슈", "enQ": "Think of a time you came across some news about cafés. What was the story about, and where did you see or read it? How did people respond to it, and what was your opinion?", "enA": "The one I remember was about long-stay customers — people who buy one americano and sit there for six hours with a laptop. I saw it as a news clip on YouTube, and the comments underneath were longer than the article itself, which tells you how raw the subject is.\n\nThe story said some cafés had started taping over the sockets or putting up a two-hour limit on the door. One owner said her afternoon turned into a study room with no sales at all, and she sounded more tired than angry about it.\n\nPeople split immediately. Owners said rent doesn't care how long you sit. Students said there is nowhere else to go. Personally, I think the fight is about the rule being unwritten. Put two hours on the door and nobody argues.", "koQ": "카페와 관련된 뉴스를 접했던 때를 떠올려 보세요. 어떤 내용이었고 어디서 봤나요? 사람들은 어떻게 반응했고 당신 생각은 어땠나요?", "koA": "기억에 남는 건 장시간 손님 얘기였어요. 아메리카노 한 잔 시켜 놓고 노트북으로 여섯 시간씩 앉아 있는 사람들이요. 유튜브 뉴스 클립으로 봤는데, 밑에 달린 댓글이 기사보다 길더라고요. 그만큼 예민한 주제라는 뜻이겠죠.\n\n기사에서는 콘센트를 테이프로 막거나 문에 두 시간 제한을 붙이기 시작한 카페들이 나왔어요. 한 사장님은 오후가 통째로 독서실이 되고 매출은 하나도 없다고 하셨는데, 화가 났다기보다 지쳐 보이셨어요.\n\n사람들은 바로 갈렸어요. 사장님들은 월세가 앉아 있는 시간을 봐주지 않는다고 했고, 학생들은 갈 데가 거기밖에 없다고 했죠. 개인적으로는 문제의 핵심이 규칙이 안 적혀 있다는 데 있다고 봐요. 문에 두 시간이라고 써 붙이면 아무도 안 싸워요.", "struct": [["1️⃣ 기사", "장시간 손님 → 한 잔에 여섯 시간"], ["2️⃣ 출처", "유튜브 뉴스 클립 💬 댓글이 기사보다 김"], ["3️⃣ 대응", "콘센트 막기 · 문에 두 시간 제한 붙이기"], ["4️⃣ 반응", "사장 = 월세 ↔ 학생 = 갈 데가 없음"], ["5️⃣ 의견", "핵심은 규칙이 안 적혀 있다는 것 ⭐"]], "expr": [["long-stay customers", "장시간 이용 손님"], ["sit there for six hours", "여섯 시간을 앉아 있다"], ["a news clip on YouTube", "유튜브 뉴스 클립"], ["tape over the sockets", "콘센트를 막아 버리다"], ["put up a two-hour limit", "두 시간 제한을 붙이다"], ["turn into a study room", "독서실이 되어 버리다"], ["People split immediately", "사람들이 바로 갈리다"], ["rent doesn't care", "월세는 봐주지 않는다"], ["nowhere else to go", "갈 데가 거기밖에 없다"], ["the rule being unwritten", "규칙이 안 적혀 있다는 것"], ["Put two hours on the door", "문에 두 시간이라고 쓰기"]], "audio": "audio/4_고난도/4-018 9. 카페(Cafés)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-018 9. 카페(Cafés)_이슈.mp3"}, {"id": "4-019", "cat": "advanced", "catName": "고난도 질문", "num": 10, "topic": "음식", "topicEn": "Food", "type": "비교", "badge": "19 비교", "enQ": "People follow different diets for reasons like health, beliefs, or taste. What diets do you know about, and how are they different from each other? Why might someone pick one instead of another?", "enA": "Three come to mind. Vegetarian and vegan diets, which are usually about belief. Low-carb or keto, which is about the body. And the protein-first diet everyone at my gym follows, which is honestly about the mirror more than anything else.\n\nWhat separates them is the reason, not the food. Two people can eat the same salad for completely different motives. That's why arguing about diets goes nowhere — you are never really arguing about the plate, you are arguing about the reason behind it.\n\nWhy do people pick one? Whatever survives their week. Korean food looks vegetarian-friendly until you remember the anchovy stock and the fish sauce in the kimchi. In the end, the diet you actually keep is the one your life allows you to keep, not the one you admire.", "koQ": "사람들은 건강, 신념, 입맛 같은 이유로 서로 다른 식단을 선택합니다. 당신이 아는 식단에는 어떤 것들이 있고 서로 어떻게 다른가요? 왜 하나를 선택할까요?", "koA": "세 가지가 떠올라요. 채식과 비건 식단은 보통 신념의 문제고요. 저탄고지나 키토는 몸의 문제예요. 그리고 저희 헬스장 사람들이 다 하는 단백질 위주 식단은 솔직히 거울의 문제죠.\n\n이 식단들을 가르는 건 음식이 아니라 이유예요. 두 사람이 똑같은 샐러드를 먹어도 동기는 완전히 다를 수 있거든요. 그래서 식단 논쟁이 끝이 안 나요. 사실 접시를 두고 싸우는 게 아니라 그 뒤에 있는 이유를 두고 싸우는 거니까요.\n\n왜 하나를 고르냐고요? 자기 일주일을 버텨 내는 쪽으로 가요. 한식은 채식하기 좋아 보이지만 멸치 육수랑 김치 속 젓갈을 떠올리면 얘기가 달라지죠. 결국 실제로 지켜지는 식단은 동경하는 식단이 아니라 자기 생활이 허락하는 식단이에요.", "struct": [["1️⃣ 세 개", "채식 · 저탄고지 · 단백질 위주 세 가지"], ["2️⃣ 이유", "신념 · 몸 · 거울. 동기가 다르다는 축"], ["3️⃣ 핵심", "가르는 건 음식이 아니라 이유 ⭐"], ["4️⃣ 한국", "한식은 채식 같지만 멸치 육수와 젓갈"], ["5️⃣ 마무리", "지켜지는 식단 = 생활이 허락하는 식단 ⭐"]], "expr": [["Three come to mind", "세 가지가 떠올라요"], ["about belief ↔ about the body", "신념 ↔ 몸의 문제"], ["about the mirror", "거울의 문제"], ["What separates them is ~", "가르는 건 ~이다"], ["for different motives", "서로 다른 동기로"], ["go nowhere", "결론이 안 나다"], ["survive their week", "자기 일주일을 버티다"], ["vegetarian-friendly", "채식하기 좋은"], ["the anchovy stock", "멸치 육수"], ["the fish sauce in the kimchi", "김치 속 젓갈"], ["the diet you keep", "실제로 지켜지는 식단"]], "audio": "audio/4_고난도/4-019 10. 음식(Food)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-019 10. 음식(Food)_비교.mp3"}, {"id": "4-020", "cat": "advanced", "catName": "고난도 질문", "num": 10, "topic": "음식", "topicEn": "Food", "type": "이슈", "badge": "20 이슈", "enQ": "Food often appears in the news as something that brings people together. Have you come across any stories about how sharing meals strengthens relationships or social bonds? Why do you think eating together remains such an important part of your culture?", "enA": "I did come across a piece on this — about the rise of eating alone. Half of the households in Seoul are one person now, and delivery does the rest, so the numbers look grim. But the same article said something I keep thinking about.\n\nIt said the phrase let's have a meal sometime hasn't disappeared at all. We just moved it from dinner to lunch, because nobody wants a three-hour company dinner any more. The meal shrank; it didn't vanish.\n\nWhy does it last? Because the word for family here is sikgu, which literally means the mouths that eat together. We even greet people by asking have you eaten. When the language is built on it, a trend can't remove it.", "koQ": "음식은 사람들을 모아 주는 것으로 뉴스에 자주 등장합니다. 함께 식사하는 것이 관계를 강화한다는 이야기를 접한 적 있나요? 왜 여전히 중요할까요?", "koA": "그런 기사 본 적 있어요. 혼밥이 늘고 있다는 내용이었죠. 서울은 이제 절반이 1인 가구고, 나머지는 배달이 해결해 주니까 숫자만 보면 암울하죠. 그런데 같은 기사에 계속 생각나는 대목이 있었어요.\n\n밥 한번 먹자는 말은 전혀 사라지지 않았대요. 다만 저녁에서 점심으로 옮겨 갔을 뿐이라고요. 이제 아무도 세 시간짜리 회식을 원하지 않으니까요. 식사가 줄어든 거지 없어진 게 아니에요.\n\n왜 계속되냐고요? 여기서 가족을 뜻하는 말이 식구거든요. 같이 밥 먹는 입이라는 뜻이에요. 인사도 밥 먹었냐고 물어보고요. 언어가 그 위에 지어져 있으면 유행이 그걸 없애지는 못해요.", "struct": [["1️⃣ 기사", "혼밥 증가 → 서울은 절반이 1인 가구"], ["2️⃣ 반전", "밥 한번 먹자는 말은 사라지지 않았다는 반전"], ["3️⃣ 이동", "저녁 회식 → 점심 모임. 줄었지 없어진 건"], ["4️⃣ 언어", "식구 = 같이 밥 먹는 입 📖 인사도 밥부터"], ["5️⃣ 마무리", "언어가 받치면 유행이 못 없앤다 ⭐"]], "expr": [["the rise of eating alone", "혼밥의 증가"], ["delivery does the rest", "나머지는 배달이 해결"], ["let's have a meal sometime", "밥 한번 먹자"], ["move it from dinner to lunch", "저녁에서 점심으로 옮기다"], ["a three-hour company dinner", "세 시간짜리 회식"], ["The meal shrank", "식사가 줄어들었다"], ["sikgu", "식구"], ["the mouths that eat together", "같이 밥 먹는 입"], ["have you eaten", "밥 먹었어요?"], ["built on it", "그 위에 지어진"], ["a trend can't remove it", "유행이 없애지 못한다"]], "audio": "audio/4_고난도/4-020 10. 음식(Food)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-020 10. 음식(Food)_이슈.mp3"}, {"id": "4-021", "cat": "advanced", "catName": "고난도 질문", "num": 11, "topic": "음악", "topicEn": "Music", "type": "비교", "badge": "21 비교", "enQ": "Choose two kinds of music or two musicians that you like and compare them. What do they have in common, and how are they different? Give me as many details as possible.", "enA": "Let me take IU and musical theater numbers — Cho Seung-woo, mostly. What they share is that the lyrics come first. Both of them sing a sentence, not a melody, and you can hear the punctuation, which is rarer than it sounds.\n\nThe difference is where they work. IU is an earphone artist. She belongs to a night bus, a walk along the river, the last ten minutes before sleep. Theater songs need a room and a thousand people or they sound oversized.\n\nSo the volume is the same but the direction is opposite. One comes inward, one pushes out. If I had to pick, IU — I hear her more often. But once a year a theater song does something to me that an earphone has never once managed to do.", "koQ": "당신이 좋아하는 두 음악이나 두 음악가를 골라 비교해 주세요. 공통점은 무엇이고 어떤 점이 다른가요? 가능한 한 자세히 말해 주세요.", "koA": "아이유와 뮤지컬 넘버로 할게요. 뮤지컬 쪽은 주로 조승우고요. 둘의 공통점은 가사가 먼저라는 거예요. 둘 다 멜로디가 아니라 문장을 부르거든요. 쉼표가 어디 있는지가 들려요. 생각보다 드문 일이에요.\n\n차이는 어디서 작동하느냐예요. 아이유는 이어폰 가수예요. 밤 버스, 강변 산책, 잠들기 전 마지막 10분에 어울리죠. 뮤지컬 넘버는 공간과 천 명의 관객이 있어야 해요. 없으면 과하게 들리고요.\n\n그러니까 볼륨은 같은데 방향이 반대예요. 하나는 안으로 들어오고 하나는 밖으로 밀어내죠. 굳이 고르라면 아이유예요. 훨씬 자주 듣거든요. 그래도 일 년에 한 번쯤은 뮤지컬 넘버가 이어폰이 못 하는 일을 해요.", "struct": [["1️⃣ 선정", "아이유 · 뮤지컬 넘버(조승우) 두 축으로"], ["2️⃣ 공통", "둘 다 가사가 먼저 · 문장을 부른다는 점"], ["3️⃣ 차이", "아이유 = 이어폰 가수 · 잠들기 전 10분"], ["4️⃣ 대조", "뮤지컬 = 공간과 천 명이 있어야 완성됨"], ["5️⃣ 마무리", "볼륨은 같고 방향이 반대 ⭐ 안 ↔ 밖"]], "expr": [["What they share is ~", "둘의 공통점은 ~이다"], ["sing a sentence, not a melody", "멜로디가 아니라 문장을"], ["hear the punctuation", "쉼표가 들리다"], ["an earphone artist", "이어폰 가수"], ["belong to ~", "~에 어울리다"], ["the last ten minutes", "잠들기 전 마지막 10분"], ["a room and a thousand people", "공간과 천 명의 관객"], ["sound oversized", "과하게 들리다"], ["come inward ↔ push out", "안으로 ↔ 밖으로"], ["If I had to pick", "굳이 고르라면"], ["once a year", "일 년에 한 번쯤"]], "audio": "audio/4_고난도/4-021 11. 음악(Music)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-021 11. 음악(Music)_비교.mp3"}, {"id": "4-022", "cat": "advanced", "catName": "고난도 질문", "num": 11, "topic": "음악", "topicEn": "Music", "type": "이슈", "badge": "22 이슈", "enQ": "Tell me about the music gadgets or equipment people are interested in these days. Why do people in your country like them? Which new products excite them, and why? Tell me what people say about them.", "enA": "Two things dominate right now — noise-cancelling earbuds and, oddly, record players. The earbuds are everywhere. On my line, half the carriage is wearing them before the train even moves, and the other half is reaching for theirs.\n\nWhy here, though? Because commuting eats an hour and a half of the day. You can't shorten it, so people turn it into a private room instead. What they're buying isn't sound quality. It's a wall.\n\nThe new products people get excited about are the ones with live translation and spatial audio — the ones that do something an app cannot. And vinyl came back for the opposite reason — you can hold it. Everyone says the same thing: one is for escaping, one is for owning.", "koQ": "요즘 사람들이 관심 갖는 음악 기기나 장비에 대해 말해 주세요. 왜 그것을 좋아하나요? 어떤 신제품이 화제이고 이유는 무엇인가요?", "koA": "요즘은 두 가지가 압도적이에요. 노이즈 캔슬링 이어폰이랑, 의외로 턴테이블이요. 이어폰은 어디에나 있어요. 제가 타는 노선은 열차가 출발하기도 전에 객차 절반이 이어폰을 끼고 있어요. 나머지 절반은 꺼내는 중이고요.\n\n왜 하필 여기냐고요? 출퇴근이 하루에 한 시간 반을 먹으니까요. 줄일 수는 없으니 사람들은 그걸 개인 공간으로 바꿔 버려요. 사람들이 사는 건 음질이 아니에요. 벽이에요.\n\n화제가 되는 신제품은 실시간 통역이나 공간 음향처럼 앱이 못 하는 걸 해 주는 것들이고요. LP는 정반대 이유로 돌아왔어요. 손에 쥘 수 있으니까요. 다들 같은 말을 해요. 하나는 도망가려고 사고, 하나는 갖고 싶어서 산다고요.", "struct": [["1️⃣ 두 개", "노이즈 캔슬링 이어폰 · 턴테이블 두 개"], ["2️⃣ 장면", "출발 전부터 객차 절반이 이어폰 착용"], ["3️⃣ 이유", "출퇴근 한 시간 반을 개인 공간으로 전환"], ["4️⃣ 핵심", "사는 건 음질이 아니라 벽 ⭐ 핵심 한 줄"], ["5️⃣ 마무리", "하나는 도망 · 하나는 소유 ⭐ 대구로"]], "expr": [["Two things dominate", "두 가지가 압도적이다"], ["noise-cancelling earbuds", "노이즈 캔슬링 이어폰"], ["half the carriage", "객차의 절반"], ["commuting eats an hour", "출퇴근이 한 시간을 먹다"], ["turn it into a private room", "개인 공간으로 바꾸다"], ["It's a wall", "사는 건 벽이다"], ["get excited about ~", "~에 열광하다"], ["live translation", "실시간 통역"], ["come back for the opposite", "정반대 이유로 돌아오다"], ["you can hold it", "손에 쥘 수 있다"], ["escaping ↔ owning", "도망 ↔ 소유"]], "audio": "audio/4_고난도/4-022 11. 음악(Music)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-022 11. 음악(Music)_이슈.mp3"}, {"id": "4-023", "cat": "advanced", "catName": "고난도 질문", "num": 12, "topic": "음악 장르", "topicEn": "Genres", "type": "비교", "badge": "23 비교", "enQ": "People are drawn to different types of music for different reasons. Name two kinds of music that you think are very different from each other. Why do you think people prefer one over the other?", "enA": "Trot and hip-hop — you couldn't put them further apart. Trot is a slow two-beat with a shaking voice, and it lives on tour buses and market speakers. Hip-hop is fast, crowded with words, and lives at festivals and in earphones on the way to work.\n\nBut here's the thing. Both of them are about enduring something. Trot takes the hard part and turns it into a song you can sway to. Hip-hop takes the same hard part and fights back at it. Same wound, opposite response.\n\nSo why do people choose one? I think it depends on what you want music to do for you. Some people want to be comforted, others want to be armed. Age matters less than people assume, and the mood you are in matters far more. It's the mood you go to music for.", "koQ": "사람들은 저마다의 이유로 서로 다른 음악에 끌립니다. 아주 다르다고 생각하는 두 종류의 음악을 말해 주세요. 왜 한쪽을 더 좋아할까요?", "koA": "트로트와 힙합이요. 이보다 멀리 떨어진 조합도 없을 거예요. 트로트는 느린 2박에 꺾는 목소리고, 관광버스와 시장 스피커에서 살아요. 힙합은 빠르고 말이 빽빽하게 들어차 있고, 페스티벌과 출근길 이어폰에서 살고요.\n\n그런데 재미있는 게 있어요. 둘 다 무언가를 견디는 이야기라는 점이에요. 트로트는 힘든 부분을 가져다가 흔들면서 부를 수 있는 노래로 만들어요. 힙합은 똑같은 힘든 부분을 가져다가 되받아치고요. 같은 상처, 정반대의 반응이죠.\n\n그럼 왜 한쪽을 고를까요? 음악이 나한테 무엇을 해 주길 바라느냐에 달렸다고 봐요. 누구는 위로받고 싶고, 누구는 무장하고 싶은 거죠. 나이는 사람들 생각만큼 중요하지 않아요. 그때 어떤 기분이냐가 훨씬 크죠. 결국 어떤 기분으로 음악을 찾느냐예요.", "struct": [["1️⃣ 선정", "트로트 · 힙합 — 이보다 먼 조합은 없음"], ["2️⃣ 대비", "느린 2박 · 관광버스 ↔ 빠른 랩 · 페스티벌"], ["3️⃣ 공통", "둘 다 무언가를 견디는 이야기라는 공통점"], ["4️⃣ 차이", "흔들며 견디기 ↔ 되받아치기. 같은 상처"], ["5️⃣ 마무리", "위로받고 싶은가 · 무장하고 싶은가 ⭐"]], "expr": [["could not be further apart", "이보다 멀 수 없다"], ["a slow two-beat", "느린 2박"], ["a shaking voice", "꺾는 목소리"], ["tour buses and market speakers", "관광버스와 시장 스피커"], ["crowded with words", "말이 빽빽하게 들어찬"], ["But here's the thing", "그런데 재미있는 게"], ["enduring something", "무언가를 견디는 것"], ["turn it into a song", "노래로 만들어 버리다"], ["fight back at it", "되받아치다"], ["to be comforted ↔ to be armed", "위로 ↔ 무장"], ["the mood you go to music for", "음악을 찾는 기분"]], "audio": "audio/4_고난도/4-023 12. 음악 장르(Genres)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-023 12. 음악 장르(Genres)_비교.mp3"}, {"id": "4-024", "cat": "advanced", "catName": "고난도 질문", "num": 12, "topic": "음악 장르", "topicEn": "Genres", "type": "이슈", "badge": "24 이슈", "enQ": "There has been news about music apps that automatically choose songs based on a person's mood. Have you seen or heard about this in the news? What is your opinion of these kinds of apps?", "enA": "I have seen that, yes. The apps read your heart rate from a watch, the time of day, even the weather, and build a playlist before you ask for one. The clip I watched called it a mood engine, which is a better name than the apps use themselves.\n\nDoes it work? Uncomfortably well. On a rainy Monday it hands me exactly the kind of song I would have chosen, which is impressive and slightly annoying. My actual favorite track this year came out of one of those lists, so I cannot pretend it does not work.\n\nHere's my problem with it, though. It gets better at what I already like, so my taste keeps narrowing. Anything genuinely new, I still had to find myself. The algorithm can match my mood. It just can't change it.", "koQ": "사람의 기분에 따라 자동으로 노래를 골라 주는 음악 앱에 대한 뉴스가 있었습니다. 이런 내용을 본 적 있나요? 이런 앱을 어떻게 생각하나요?", "koA": "네, 그런 뉴스 봤어요. 앱이 시계로 심박을 읽고, 시간대랑 날씨까지 보고, 내가 요청하기도 전에 플레이리스트를 만들어 준대요. 제가 본 영상에서는 그걸 기분 엔진이라고 부르던데, 앱들이 쓰는 이름보다 낫더라고요.\n\n잘 맞냐고요? 불편할 만큼 잘 맞아요. 비 오는 월요일이면 제가 골랐을 법한 노래를 그대로 꺼내 줘요. 대단하면서 살짝 얄밉죠. 사실 올해 제 최애곡도 그 리스트에서 나왔으니 효과가 없다고는 못 하겠어요.\n\n그래도 걸리는 게 있어요. 앱은 제가 이미 좋아하는 것만 점점 더 잘하게 돼요. 그래서 취향이 계속 좁아져요. 진짜 새로운 건 결국 제가 직접 찾아야 했고요. 알고리즘은 제 기분을 맞힐 수는 있어요. 다만 바꿔 주지는 못해요.", "struct": [["1️⃣ 뉴스", "심박 · 시간대 · 날씨를 읽고 자동 선곡"], ["2️⃣ 이름", "영상에서 부르던 이름 = 기분 엔진 💬"], ["3️⃣ 인정", "비 오는 월요일에 딱 맞는 곡 · 최애곡도"], ["4️⃣ 문제", "이미 좋아하는 것만 잘해서 취향이 좁아짐"], ["5️⃣ 마무리", "기분은 맞히지만 바꿔 주지는 못한다 ⭐"]], "expr": [["read your heart rate", "심박을 읽어 내다"], ["build a playlist", "플레이리스트를 만들다"], ["a mood engine", "기분 엔진"], ["Uncomfortably well", "불편할 만큼 잘"], ["impressive and annoying", "대단하면서 얄미운"], ["came out of one of those lists", "그 리스트에서 나왔다"], ["Here's my problem with it", "그래도 걸리는 건"], ["better at what I already like", "이미 좋아하는 것만 잘하다"], ["keep narrowing", "계속 좁아지다"], ["find it myself", "직접 찾아내다"], ["match ↔ change my mood", "맞히다 ↔ 바꾸다"]], "audio": "audio/4_고난도/4-024 12. 음악 장르(Genres)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-024 12. 음악 장르(Genres)_이슈.mp3"}, {"id": "4-025", "cat": "advanced", "catName": "고난도 질문", "num": 13, "topic": "국내여행", "topicEn": "Domestic", "type": "비교", "badge": "25 비교", "enQ": "How was traveling within your country different in your childhood compared to now? Do you think it has become easier or harder than before? Tell me how domestic travel has changed.", "enA": "Back then, a domestic trip meant four hours on a bus and everyone went to the same three places — Gyeongju, Seorak, Jeju. You booked by phone, stayed in whatever had a room left, and took maybe twenty photos the whole weekend because film was not free.\n\nThese days it's a completely different story. The train cut it to two hours, and you book a room from the platform on an app. People go to small towns nobody used to name — Tongyeong, Gangneung, Jeonju — mostly because a café there went viral.\n\nSo is it easier? Much. The trade-off is that a trip now starts with a saved map and ends with four hundred photos. I have to admit the old version left more behind. We remembered the rest stop better than the destination, and that says something.", "koQ": "어릴 때의 국내여행은 지금과 어떻게 달랐나요? 예전보다 쉬워졌다고 보나요, 어려워졌다고 보나요? 국내여행이 어떻게 변했는지 말해 주세요.", "koA": "예전에 국내여행이라고 하면 버스로 네 시간이었어요. 다들 같은 세 군데로 갔고요. 경주, 설악산, 제주요. 예약은 전화로 했고, 방이 남은 데면 아무 데나 묵었고, 주말 내내 사진은 스무 장쯤 찍었죠. 필름이 공짜가 아니었으니까요.\n\n요즘은 완전히 다른 이야기예요. 기차가 그 시간을 두 시간으로 줄였고, 플랫폼에서 앱으로 방을 잡아요. 예전엔 이름도 안 대던 소도시로 가고요. 통영, 강릉, 전주 같은 데요. 대개는 거기 카페 하나가 떴기 때문이죠.\n\n그래서 쉬워졌냐고요? 훨씬요. 대신 요즘 여행은 저장해 둔 지도에서 시작해서 사진 사백 장으로 끝나요. 예전 방식이 남기는 게 더 많았다는 건 인정할 수밖에 없어요. 그땐 목적지보다 휴게소를 더 잘 기억했거든요. 그게 뭔가를 말해 주죠.", "struct": [["1️⃣ 과거", "버스로 네 시간 · 다들 같은 세 군데로"], ["2️⃣ 방식", "전화로 예약 · 방 남은 데 아무 곳에"], ["3️⃣ 현재", "KTX 두 시간 → 플랫폼에서 앱 예약"], ["4️⃣ 이동", "소도시로 분산 · 카페 하나가 이유"], ["5️⃣ 마무리", "사진 400장 vs 기억나는 휴게소 ⭐"]], "expr": [["four hours on a bus", "버스로 네 시간"], ["the same three places", "늘 같은 세 군데"], ["book by phone", "전화로 예약하다"], ["whatever had a room left", "방이 남은 아무 데나"], ["cut it to two hours", "두 시간으로 줄이다"], ["book a room from the platform", "플랫폼에서 방을 잡다"], ["small towns nobody used to name", "이름도 안 대던 소도시"], ["go viral", "입소문을 타다"], ["start with a saved map", "저장한 지도에서 시작"], ["The trade-off is ~", "대신 잃는 건 ~이다"], ["I have to admit", "인정할 수밖에 없다"]], "audio": "audio/4_고난도/4-025 13. 국내여행(Domestic)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-025 13. 국내여행(Domestic)_비교.mp3"}, {"id": "4-026", "cat": "advanced", "catName": "고난도 질문", "num": 13, "topic": "국내여행", "topicEn": "Domestic", "type": "이슈", "badge": "26 이슈", "enQ": "What concerns do travelers have these days? What are people most interested in, and what causes those concerns? Tell me what people talk about as the main issues of traveling.", "enA": "The one everybody talks about is price. A room by the sea that costs eighty thousand won in March triples in August, and people call it out online every summer without anything actually changing. Everyone complains and everyone still goes.\n\nWhat causes it is that we all travel in the same two weeks. Schools, companies and the weather line up perfectly, so demand lands on one fortnight and the whole country pays for it. None of it is anyone's fault, which is why it never gets fixed.\n\nThe second concern is newer. Small towns that went viral are now full of visitors and unhappy residents — narrow streets, parked cars, cameras at people's windows. What people ask for is simple enough: spread the season out and cap the crowds before the residents give up on their own town.", "koQ": "요즘 여행하는 사람들은 어떤 걱정을 하나요? 사람들이 가장 관심 갖는 것은 무엇이고 무엇이 그 걱정을 만드나요?", "koA": "다들 말하는 건 가격이에요. 3월에 8만 원 하던 바닷가 방이 8월이면 세 배가 돼요. 여름마다 사람들이 온라인에서 지적하지만 실제로 바뀌는 건 없어요. 다들 불평하면서 다들 가거든요.\n\n원인은 우리가 다 같은 2주에 여행을 간다는 거예요. 학교랑 회사랑 날씨가 완벽하게 맞아떨어지거든요. 그래서 수요가 딱 2주에 몰리고 나라 전체가 그 값을 치릅니다. 누구의 잘못도 아니라서 해결도 안 되는 거고요.\n\n두 번째 걱정은 좀 더 최근 거예요. 뜬 소도시들이 이제 관광객과 불만인 주민들로 가득해요. 좁은 골목, 주차된 차, 남의 집 창문 앞에 들이대는 카메라요. 사람들이 요구하는 건 간단해요. 주민들이 자기 동네를 포기하기 전에 시즌을 분산하고 인원을 제한하자는 거죠.", "struct": [["1️⃣ 걱정", "다들 말하는 건 결국 가격 하나 🔑"], ["2️⃣ 근거", "3월 8만 원 방이 8월엔 세 배로"], ["3️⃣ 원인", "원인은 모두가 같은 2주에 몰려서"], ["4️⃣ 둘째", "뜬 소도시 = 관광객과 불만인 주민"], ["5️⃣ 요구", "시즌 분산 · 인원 제한이 요구 ✅"]], "expr": [["The one everybody talks about", "다들 말하는 건"], ["triple in August", "8월이면 세 배가 되다"], ["call it out online", "온라인에서 지적하다"], ["in the same two weeks", "똑같은 2주 동안"], ["line up perfectly", "완벽하게 맞아떨어지다"], ["land on one fortnight", "2주에 몰리다"], ["go viral", "입소문을 타다"], ["unhappy residents", "불만인 주민들"], ["cameras at the windows", "창문 앞의 카메라"], ["What people ask for", "사람들이 요구하는 건"], ["cap the crowds", "인원을 제한하다"]], "audio": "audio/4_고난도/4-026 13. 국내여행(Domestic)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-026 13. 국내여행(Domestic)_이슈.mp3"}, {"id": "4-027", "cat": "advanced", "catName": "고난도 질문", "num": 14, "topic": "해외여행", "topicEn": "Overseas", "type": "비교", "badge": "27 비교", "enQ": "How has overseas travel changed over the years? Do you think it is easier now than in the past, or more difficult? Why? Describe what traveling to other countries used to be like and what it is like today.", "enA": "Back then, going abroad meant a package tour. You followed a flag around a city, changed money at a counter, and carried one guidebook that the whole group shared. Calling home meant finding a payphone and hoping you had the right coins.\n\nThese days, almost nobody does that. Budget airlines made the ticket cheap, the booking takes four taps, and an eSIM puts a map in your hand before you land. You can eat where a stranger on YouTube ate last month, in a country you have never seen.\n\nSo is it easier? Yes and no. Booking got easier; deciding got harder. There are too many options, so people now spend more time planning than travelling. I have to admit the flag had one advantage — somebody else did the thinking.", "koQ": "해외여행은 시간이 지나며 어떻게 변했나요? 예전보다 쉬워졌다고 보나요, 어려워졌다고 보나요? 예전과 지금이 어떻게 다른지 설명해 주세요.", "koA": "예전에 해외에 나간다는 건 패키지여행을 뜻했어요. 도시를 돌며 깃발을 따라다녔고, 창구에서 환전했고, 단체가 같이 보는 가이드북 한 권을 들고 다녔죠. 집에 전화하려면 공중전화를 찾아서 동전이 맞기를 바라야 했고요.\n\n요즘은 그렇게 하는 사람이 거의 없어요. 저가 항공이 표를 싸게 만들었고, 예약은 네 번 누르면 끝나고, 이심이 착륙 전에 지도를 손에 쥐여 줘요. 한 번도 가 본 적 없는 나라에서 지난달 유튜브 속 낯선 사람이 먹은 데서 먹을 수도 있고요.\n\n그래서 쉬워졌냐고요? 반은 맞고 반은 아니에요. 예약은 쉬워졌는데 결정은 어려워졌거든요. 선택지가 너무 많아서 이제는 여행하는 시간보다 계획하는 시간이 더 길어요. 깃발에도 장점 하나는 있었어요. 생각은 남이 해 줬거든요.", "struct": [["1️⃣ 과거", "패키지여행 · 깃발 · 창구 환전이었음"], ["2️⃣ 장면", "단체가 같이 보던 가이드북 한 권뿐"], ["3️⃣ 현재", "저가 항공 · 네 번 터치 · 이심까지"], ["4️⃣ 역설", "예약은 쉬워지고 결정은 어려워짐 ⭐"], ["5️⃣ 마무리", "깃발의 장점 = 생각은 남이 해 줌 😆"]], "expr": [["a package tour", "패키지여행"], ["follow a flag", "깃발을 따라다니다"], ["one guidebook", "가이드북 한 권"], ["find a payphone", "공중전화를 찾다"], ["budget airlines", "저가 항공"], ["takes four taps", "네 번 누르면 끝나다"], ["an eSIM", "이심"], ["Yes and no", "반은 맞고 반은 아니다"], ["Booking got easier", "예약은 쉬워졌다"], ["deciding got harder", "결정은 어려워졌다"], ["plan more than travel", "여행보다 계획이 길다"]], "audio": "audio/4_고난도/4-027 14. 해외여행(Overseas)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-027 14. 해외여행(Overseas)_비교.mp3"}, {"id": "4-028", "cat": "advanced", "catName": "고난도 질문", "num": 14, "topic": "해외여행", "topicEn": "Overseas", "type": "이슈", "badge": "28 이슈", "enQ": "What do people worry about when they plan a trip abroad? It could be hotel bookings, tourist spots, or the schedule. What is it, and how are those concerns being handled these days?", "enA": "The biggest worry is location, not price. A room can look perfect in the photos and still be forty minutes from anything. Photos show the room; nobody photographs the walk from the station at eleven at night with a suitcase behind you.\n\nThe second one is the schedule. People cram five places into one day because the flight was expensive, then spend the trip on trains instead of in places. That's how you come home more tired than when you left.\n\nHow is it handled now? Mostly by checking the map before the photos and reading the newest reviews only, since a place can change hands in a year. And a lot of people now book something cancellable and keep one day empty. That empty day is usually the part that saves the whole trip.", "koQ": "사람들은 해외여행을 준비할 때 무엇을 걱정하나요? 숙소 예약, 관광지, 일정 같은 것들이요. 요즘은 그 걱정을 어떻게 해결하나요?", "koA": "가장 큰 걱정은 가격이 아니라 위치예요. 사진으로는 완벽해 보여도 아무 데서나 40분 거리일 수 있거든요. 사진은 방을 보여 주지, 밤 11시에 캐리어를 끌고 역에서 걸어오는 길을 찍어 주지는 않으니까요.\n\n두 번째는 일정이에요. 항공권이 비쌌으니까 하루에 다섯 군데를 욱여넣고, 결국 여행 내내 장소가 아니라 기차 안에 있게 돼요. 그렇게 해서 떠날 때보다 더 지쳐서 돌아오는 거죠.\n\n요즘은 어떻게 해결하냐고요? 대개 사진보다 지도를 먼저 확인하고, 일 년이면 주인이 바뀌기도 하니까 최신 후기만 읽어요. 그리고 취소 가능한 걸로 잡아 두고 하루는 비워 두는 사람이 많아졌고요. 대개 그 빈 하루가 여행 전체를 살립니다.", "struct": [["1️⃣ 걱정", "가격이 아니라 위치가 걱정 1순위 🔑"], ["2️⃣ 이유", "사진은 방만 찍고 골목은 안 찍음"], ["3️⃣ 둘째", "하루 다섯 군데 → 결국 기차 안에서"], ["4️⃣ 대처", "대처는 사진보다 지도를 먼저 확인"], ["5️⃣ 마무리", "취소 가능 + 빈 하루 하나 남기기 ✅"]], "expr": [["The biggest worry is ~", "가장 큰 걱정은 ~이다"], ["forty minutes from anything", "어디서든 40분 거리"], ["nobody photographs the walk", "걸어오는 길은 안 찍는다"], ["cram five places into one day", "하루에 다섯 군데를 넣다"], ["on trains instead of in places", "장소가 아닌 기차 안에"], ["more tired than when you left", "떠날 때보다 지쳐서"], ["How is it handled now?", "요즘은 어떻게 해결하나"], ["check the map before the photos", "사진보다 지도를 먼저"], ["the newest reviews only", "최신 후기만"], ["book something cancellable", "취소 가능한 걸로 잡다"], ["keep one day empty", "하루는 비워 두다"]], "audio": "audio/4_고난도/4-028 14. 해외여행(Overseas)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-028 14. 해외여행(Overseas)_이슈.mp3"}, {"id": "4-029", "cat": "advanced", "catName": "고난도 질문", "num": 15, "topic": "해외여행 이유", "topicEn": "Reasons", "type": "비교", "badge": "29 비교", "enQ": "People go abroad for many different reasons. What are some typical reasons people travel overseas? Why do you think such trips are meaningful or valuable?", "enA": "Three reasons cover most of it. Some people go to rest — a beach, a hotel, nothing on the schedule. Some go to see — food, museums, a city they've read about. And some go to get away from their own life for a week, which is the most honest reason of the three.\n\nWhy does it matter, though? Because abroad you lose all your shortcuts. You can't read the signs, you don't know which queue is the right one, and you have to ask strangers for everything. That strips you down to how you actually behave.\n\nAnd the value shows up later. You come back and your own street looks different for about a week. In the end, a trip doesn't change the country you visited. It changes what you notice when you get home.", "koQ": "사람들은 다양한 이유로 해외에 나갑니다. 해외여행을 가는 일반적인 이유에는 어떤 것들이 있나요? 왜 그런 여행이 의미 있다고 보나요?", "koA": "이유는 세 가지면 거의 다 설명돼요. 누구는 쉬러 가요. 바다, 호텔, 일정 없음이죠. 누구는 보러 가고요. 음식, 미술관, 책에서 읽은 도시요. 그리고 누구는 일주일쯤 자기 삶에서 벗어나려고 가죠. 셋 중에 제일 솔직한 이유고요.\n\n그런데 그게 왜 의미가 있냐고요? 해외에서는 내가 쓰던 지름길이 다 사라지거든요. 간판을 못 읽고, 어느 줄이 맞는 줄인지 모르고, 뭐든 낯선 사람에게 물어봐야 해요. 그게 내가 실제로 어떻게 행동하는지를 벗겨 냅니다.\n\n그리고 가치는 나중에 드러나요. 돌아오면 일주일쯤은 내가 늘 걷던 거리가 달라 보이거든요. 결국 여행이 바꾸는 건 다녀온 나라가 아니에요. 집에 돌아왔을 때 무엇이 눈에 들어오는가를 바꾸죠.", "struct": [["1️⃣ 세 개", "쉬러 · 보러 · 벗어나려고 세 갈래"], ["2️⃣ 전환", "그런데 왜 의미가 있나로 넘어가기"], ["3️⃣ 근거", "해외에선 내 지름길이 전부 사라짐"], ["4️⃣ 효과", "실제로 어떻게 행동하는지 드러남 ⭐"], ["5️⃣ 마무리", "바뀌는 건 돌아온 뒤의 시선이라고"]], "expr": [["Three reasons cover most of it", "세 가지면 거의 다"], ["to rest ↔ to see", "쉬러 ↔ 보러"], ["get away from their own life", "자기 삶에서 벗어나다"], ["Why does it matter?", "왜 의미가 있나요"], ["lose all your shortcuts", "지름길이 다 사라지다"], ["which queue is the right one", "어느 줄이 맞는 줄인지"], ["ask strangers for everything", "뭐든 낯선 사람에게"], ["strip you down to ~", "~까지 벗겨 내다"], ["look different for a week", "일주일쯤 달라 보이다"], ["In the end", "결국에는"], ["what you notice at home", "집에서 눈에 들어오는 것"]], "audio": "audio/4_고난도/4-029 15. 해외여행 이유(Reasons)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-029 15. 해외여행 이유(Reasons)_비교.mp3"}, {"id": "4-030", "cat": "advanced", "catName": "고난도 질문", "num": 15, "topic": "해외여행 이유", "topicEn": "Reasons", "type": "이슈", "badge": "30 이슈", "enQ": "There have recently been reports about some countries tightening visa rules for international travelers. Have you seen or heard about this in the news? How do you think visa or entry issues can affect people's travel plans?", "enA": "I did see that, yes. Europe is rolling out an online entry permit, and a few countries have added a tourist tax or tighter checks at the border. It came up everywhere last year because the dates kept getting pushed back and nobody knew when it would really start.\n\nHow does it change things? It kills the spontaneous trip. You used to be able to book a flight on Thursday and leave on Saturday. Now you apply first and wait, so the plan starts weeks before the plane does.\n\nAnd the money adds up. A permit, a tax, an extra photo — none of it is huge, but it lands on the traveller. Personally, I'm saving for Italy, so this is not somebody else's news. Borders are getting thicker again.", "koQ": "최근 일부 국가가 여행자 비자 규정을 강화한다는 보도가 있었습니다. 이런 내용을 본 적 있나요? 비자나 입국 문제가 여행 계획에 어떤 영향을 줄까요?", "koA": "네, 그런 보도 봤어요. 유럽이 온라인 입국 허가제를 도입하고 있고, 몇몇 나라는 관광세를 붙이거나 국경 심사를 강화했어요. 시행 날짜가 자꾸 미뤄지고 언제 진짜 시작될지 아무도 몰라서 작년에 여기저기서 그 얘기가 나왔죠.\n\n뭐가 달라지냐고요? 즉흥적인 여행이 사라져요. 예전엔 목요일에 항공권 끊고 토요일에 떠날 수 있었거든요. 이제는 먼저 신청하고 기다려야 해요. 그래서 계획이 비행기보다 몇 주 먼저 시작됩니다.\n\n그리고 돈도 쌓여요. 허가비, 관광세, 사진 한 장 추가. 하나하나는 크지 않은데 결국 여행자가 다 부담하죠. 개인적으로는 이탈리아 가려고 저축 중이라 남의 뉴스가 아니에요. 국경이 다시 두꺼워지고 있어요.", "struct": [["1️⃣ 뉴스", "유럽 온라인 입국 허가 · 관광세까지"], ["2️⃣ 화제", "시행일이 미뤄져 계속 보도된 이유"], ["3️⃣ 영향", "즉흥 여행이 사라짐 → 먼저 신청부터"], ["4️⃣ 비용", "허가비 · 관광세 · 사진까지 추가로"], ["5️⃣ 마무리", "국경이 다시 두꺼워지는 중이라고 ⭐"]], "expr": [["an online entry permit", "온라인 입국 허가"], ["a tourist tax", "관광세"], ["tighter checks at the border", "국경 심사 강화"], ["keep getting pushed back", "자꾸 미뤄지다"], ["kill the spontaneous trip", "즉흥 여행을 없애다"], ["apply first and wait", "먼저 신청하고 기다리다"], ["weeks before the plane", "비행기보다 몇 주 먼저"], ["the money adds up", "돈이 쌓이다"], ["it lands on the traveller", "여행자가 부담하다"], ["not somebody else's news", "남의 뉴스가 아니다"], ["Borders are getting thicker", "국경이 두꺼워지고 있다"]], "audio": "audio/4_고난도/4-030 15. 해외여행 이유(Reasons)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-030 15. 해외여행 이유(Reasons)_이슈.mp3"}, {"id": "4-031", "cat": "advanced", "catName": "고난도 질문", "num": 16, "topic": "교통 수단", "topicEn": "Transport", "type": "비교", "badge": "31 비교", "enQ": "People in cities get around using different kinds of transportation. What are two common options, and how do they differ in cost, convenience, or environmental impact? Why might someone pick one instead of the other?", "enA": "The two everybody uses are the subway and a car, and on paper they couldn't be more different. But both are solving the same problem — your morning.\n\nOn cost, the subway is a flat fare under two thousand won and a transfer costs nothing. A car is fuel, insurance, and parking that costs more than the fuel. On convenience, the subway wins the clock — it comes on the dot and never sits in traffic. The car wins the second you have a child or a late meeting.\n\nOn the environment it is barely a contest: one train carries hundreds, a car carries one. If I had to pick, I take the subway all week. Still, people choose it for the door, not the price — what they pay for is the last five minutes.", "koQ": "도시 사람들은 다양한 교통수단으로 이동합니다. 흔히 쓰는 두 가지는 무엇이고 비용·편리함·환경 면에서 어떻게 다른가요?", "koA": "여기서 다들 쓰는 두 가지는 지하철과 자가용이에요. 서류상으로는 이보다 다를 수가 없죠. 그런데 둘 다 결국 같은 문제를 푸는 거예요. 제 아침이요.\n\n비용은요, 지하철은 2천 원도 안 되는 정액 요금이고 환승은 공짜예요. 차는 기름값에 보험에, 기름값보다 비싼 주차비까지요. 편리함은 시간으로 보면 지하철이 이겨요. 정각에 오고 막히는 데 갇히지도 않으니까요. 차는 아이가 생기거나 늦은 약속이 잡히는 순간 이기고요.\n\n환경은 겨룰 것도 없어요. 열차 한 대가 수백 명을 태우는데 차는 한 명을 태우거든요. 골라야 한다면 저는 주중 내내 지하철이에요. 그래도 사람들은 값이 아니라 문 때문에 골라요. 진짜로 값을 치르는 건 마지막 5분이거든요.", "struct": [["1️⃣ 대상", "두 수단부터 지하철 · 자가용 🚇"], ["2️⃣ 비용", "정액 요금 vs 기름 · 보험 · 주차"], ["3️⃣ 편의", "시간은 지하철 · 짐과 밤은 자가용"], ["4️⃣ 환경", "열차 한 대에 수백 명 vs 차엔 한 명"], ["5️⃣ 선택", "싸서가 아니라 문 때문에 고른다 ⭐"]], "expr": [["couldn't be more different", "이보다 다를 수 없다"], ["a flat fare", "정액 요금"], ["a transfer costs nothing", "환승이 공짜다"], ["parking that costs more", "기름값보다 비싼 주차"], ["on the dot", "정각에"], ["never sit in traffic", "막히는 데 안 갇힌다"], ["the second you have a child", "아이가 생기는 순간"], ["carry hundreds", "수백 명을 태우다"], ["If I had to pick", "골라야 한다면"], ["choose it for the door", "문 때문에 고른다"], ["what they pay for is ~", "값을 치르는 건 ~다"]], "audio": "audio/4_고난도/4-031 16. 교통 수단(Transport)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-031 16. 교통 수단(Transport)_비교.mp3"}, {"id": "4-032", "cat": "advanced", "catName": "고난도 질문", "num": 16, "topic": "교통 수단", "topicEn": "Transport", "type": "이슈", "badge": "32 이슈", "enQ": "There have recently been reports about new high-speed train lines opening in some countries. Have you seen or heard about this in the news? How do you think high-speed trains could change the way people travel in the future?", "enA": "I did see something about this. A few countries are opening new lines, and ours is extending one to a coastal city that used to take four hours. The reports always use the same shot — an empty platform and a train sliding in exactly on schedule.\n\nWhat changes first is flying. Once a trip drops under two hours, people stop booking domestic flights, because the airport is an hour out of town and you have to be there ninety minutes early anyway. The train wins before it even moves.\n\nPersonally, I think the bigger change is where people live. If a city is fifty minutes from the office, it stops being far. The worry is the towns the line passes without stopping — every new station elsewhere makes them a little quieter.", "koQ": "최근 일부 나라에서 새 고속철 노선이 개통된다는 보도가 있었습니다. 고속철이 미래의 여행을 어떻게 바꿀 거라고 보나요?", "koA": "그 얘긴 저도 봤어요. 몇몇 나라가 새 노선을 개통하고 있고, 우리도 예전엔 네 시간 걸리던 해안 도시까지 노선을 늘리는 중이죠. 보도는 늘 같은 화면을 써요. 텅 빈 플랫폼에 열차가 정확히 시간 맞춰 들어오는 장면이요.\n\n가장 먼저 바뀌는 건 비행기예요. 이동이 두 시간 아래로 떨어지면 사람들은 국내선을 안 끊어요. 공항은 도심에서 한 시간 밖이고 어차피 90분 전에 가 있어야 하니까요. 기차는 출발하기도 전에 이미 이겨 있는 거죠.\n\n개인적으로는 더 큰 변화가 사는 곳이라고 봐요. 어떤 도시가 회사에서 50분이면 더는 멀지 않으니까요. 걱정되는 건 노선이 서지 않고 지나가는 동네들이에요. 다른 데 역이 하나 생길 때마다 그만큼 더 조용해지거든요.", "struct": [["1️⃣ 뉴스", "새 노선 개통 보도를 봤다고 먼저 🚄"], ["2️⃣ 장면", "빈 플랫폼 · 정시 도착 화면 하나"], ["3️⃣ 변화", "두 시간 아래로 가면 국내선이 준다"], ["4️⃣ 확장", "50분이면 멀지 않다 · 사는 곳 이동"], ["5️⃣ 우려", "서지 않고 지나가는 소도시의 그늘 ⭐"]], "expr": [["I did see something about this", "그 얘긴 봤어요"], ["open a new line", "노선을 개통하다"], ["used to take four hours", "예전엔 네 시간 걸리던"], ["the same shot", "늘 같은 화면"], ["drop under two hours", "두 시간 아래로 내려가다"], ["stop booking domestic flights", "국내선을 안 끊다"], ["an hour out of town", "도심에서 한 시간 밖"], ["it stops being far", "더는 멀지 않다"], ["pass without stopping", "서지 않고 지나가다"], ["a little quieter", "그만큼 더 조용해진"], ["Personally, I think ~", "개인적으로는 ~"]], "audio": "audio/4_고난도/4-032 16. 교통 수단(Transport)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-032 16. 교통 수단(Transport)_이슈.mp3"}, {"id": "4-033", "cat": "advanced", "catName": "고난도 질문", "num": 17, "topic": "지형", "topicEn": "Terrain", "type": "비교", "badge": "33 비교", "enQ": "Talk about a country whose geography is similar to or near your country. What geographical features does it have, and what changes has it gone through in recent years? Give me as many details as possible.", "enA": "The closest one is Japan, and the map is almost a copy of ours. Mountains over most of the land, a very long coastline, and the cities squeezed onto the flat parts. Both build up, not out, for the same reason.\n\nThe difference is underneath. Japan is a chain of islands sitting on an active fault, so they get volcanoes, hot springs and earthquake drills at school. Our mountains are old and quiet; theirs are still working.\n\nAs for recent changes, after the tsunami they raised sea walls along whole stretches of coast, changing how the shoreline looks. Inland, the mountain villages are emptying — the young move out and the houses stay behind — and warmer winters keep shortening the snow season. The land decides the rest.", "koQ": "당신의 나라와 지형이 비슷하거나 가까운 나라에 대해 말해 주세요. 어떤 지형적 특징이 있고 최근 몇 년간 어떤 변화가 있었나요?", "koA": "가장 가까운 나라는 일본인데, 지도만 보면 우리랑 거의 판박이예요. 국토 대부분이 산이고, 해안선이 아주 길고, 도시는 평지에 몰려 있어요. 두 나라 다 같은 이유로 옆이 아니라 위로 올리고요.\n\n차이는 그 밑에 있어요. 일본은 활성 단층 위에 놓인 열도라서 화산과 온천이 있고, 초등학교에서 지진 대피 훈련을 해요. 우리 산은 늙고 조용한데, 저쪽 산은 아직 일을 하고 있는 셈이죠.\n\n최근 변화로 보면, 쓰나미 이후에 해안 곳곳의 방파제를 높였어요. 해안선 생김새 자체가 달라졌죠. 내륙에서는 산간 마을이 비어 가고요. 젊은 사람은 나가고 집만 남아요. 겨울이 따뜻해지면서 북쪽 눈 시즌도 계속 짧아지고 있고요. 결국 땅이 나머지를 정하는 거죠.", "struct": [["1️⃣ 대상", "가장 가깝고 가장 비슷한 나라, 일본"], ["2️⃣ 공통", "국토 대부분 산 · 아주 긴 해안선"], ["3️⃣ 차이", "열도 · 활성 단층 · 화산과 온천"], ["4️⃣ 변화", "쓰나미 이후 해안 방파제를 높임"], ["5️⃣ 변화", "산간 마을은 비고 눈은 짧아져 ⭐"]], "expr": [["almost a copy of ours", "우리와 거의 판박이"], ["mountains over most of the land", "국토 대부분이 산"], ["squeezed onto the flat parts", "평지에 몰려 있는"], ["build up, not out", "옆이 아니라 위로"], ["a chain of islands", "열도"], ["on an active fault", "활성 단층 위에"], ["still working", "아직 일하고 있는"], ["raise sea walls", "방파제를 높이다"], ["the houses stay behind", "집만 남는다"], ["shorten the snow season", "눈 시즌이 짧아지다"], ["The land decides the rest.", "땅이 나머지를 정한다"]], "audio": "audio/4_고난도/4-033 17. 지형(Terrain)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-033 17. 지형(Terrain)_비교.mp3"}, {"id": "4-034", "cat": "advanced", "catName": "고난도 질문", "num": 17, "topic": "지형", "topicEn": "Terrain", "type": "이슈", "badge": "34 이슈", "enQ": "Have you seen or read any news articles about the country you just talked about? What was the news - was it about the economy or political relations? What do you think about those articles?", "enA": "I do read about Japan, and honestly most of what I see is economic. The yen has been weak for a while now, so every other article is about prices, shopping, and record numbers of visitors going both ways.\n\nThe political side does show up in headlines too, usually about meetings and agreements. I read those more slowly. The tone changes a lot depending on which paper you open, so I try to read two before I decide anything.\n\nWhat I think is that the travel numbers say more than the headlines do. Millions of people crossing in both directions every single year is its own kind of news, and a fairly good one. It just moves more quietly than the front page does, so almost nobody sits down and writes it up that way.", "koQ": "방금 말한 나라의 뉴스 기사를 보거나 읽은 적이 있나요? 경제 뉴스였나요, 정치 관계 뉴스였나요? 그 기사들을 어떻게 생각하나요?", "koA": "일본 기사는 챙겨 보는 편인데, 솔직히 제가 보는 건 대부분 경제 쪽이에요. 엔화가 한동안 약세라서 두 기사 중 하나는 물가 얘기, 쇼핑 얘기, 양쪽으로 오간 역대 최다 방문객 얘기예요.\n\n정치 쪽도 헤드라인에 나오긴 해요. 보통 회담이나 합의 소식이고요. 그런 건 좀 천천히 읽어요. 어느 신문을 여느냐에 따라 논조가 꽤 달라서, 뭘 판단하기 전에 두 군데는 읽어 보려고 합니다.\n\n제 생각은 이래요. 오간 사람 수가 헤드라인보다 더 많은 걸 말해 준다고요. 해마다 수백만 명이 양쪽으로 건너간다는 건 그 자체로 하나의 뉴스고, 꽤 괜찮은 뉴스죠. 1면보다 훨씬 조용히 움직여서 아무도 그렇게 안 써 줄 뿐이에요.", "struct": [["1️⃣ 범위", "내가 보는 건 대부분 경제 쪽 기사"], ["2️⃣ 사례", "엔화 약세 · 물가 · 역대 최다 방문"], ["3️⃣ 정치", "헤드라인은 천천히 · 두 곳 비교"], ["4️⃣ 의견", "오간 숫자가 헤드라인보다 더 말해"], ["5️⃣ 마무리", "조용히 움직이는 뉴스도 있다 ⭐"]], "expr": [["most of what I see is ~", "내가 보는 건 대부분"], ["the yen has been weak", "엔화가 약세다"], ["every other article", "두 기사 중 하나는"], ["record numbers of visitors", "역대 최다 방문객"], ["going both ways", "양쪽으로 오가는"], ["show up in headlines", "헤드라인에 등장하다"], ["I read those more slowly", "그런 건 천천히 읽어요"], ["depending on which paper", "어느 신문이냐에 따라"], ["read two before I decide", "정하기 전에 둘을 읽다"], ["say more than the headlines", "헤드라인보다 많은 걸"], ["move quietly", "조용히 움직이다"]], "audio": "audio/4_고난도/4-034 17. 지형(Terrain)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-034 17. 지형(Terrain)_이슈.mp3"}, {"id": "4-035", "cat": "advanced", "catName": "고난도 질문", "num": 18, "topic": "날씨", "topicEn": "Weather", "type": "비교", "badge": "35 비교", "enQ": "Weather varies greatly from country to country. Tell me about a country whose weather is very different from your country's. What would be enjoyable or challenging for someone living there?", "enA": "The one that couldn't be more different is Singapore. We get four seasons that take turns; they get one, and it runs all year — around thirty degrees, humid, with a downpour most afternoons that stops as fast as it starts.\n\nThe enjoyable part is how little you have to plan. Nobody owns a winter coat. There is no closet to swap twice a year, no heating bill, and no morning where the forecast picks your clothes for you.\n\nThe hard part is that nothing marks the time. Here the cold tells you the year is ending; there, December looks exactly like June. And the gap between the street and the air conditioning is brutal — sweating and shivering in the same hour. Seasons wear you out, but they hand you a reset button four times a year.", "koQ": "날씨는 나라마다 크게 다릅니다. 당신의 나라와 날씨가 아주 다른 나라와, 그곳에 사는 사람의 좋은 점과 힘든 점을 말해 주세요.", "koA": "이보다 다를 수 없는 곳은 싱가포르예요. 우리는 사계절이 번갈아 오는데 거긴 계절이 하나고 그게 일 년 내내 이어져요. 30도쯤에 습하고, 오후마다 비가 쏟아지는데 시작만큼 빨리 그쳐요.\n\n좋은 점은 계획할 게 거의 없다는 거예요. 겨울 코트를 가진 사람이 없어요. 일 년에 두 번 옷장을 갈아엎을 일도, 난방비도, 예보가 오늘 옷을 골라 주는 아침도 없고요.\n\n힘든 점은 시간을 표시해 주는 게 없다는 거예요. 여기선 추워지면 한 해가 끝나 간다는 걸 알잖아요. 거긴 12월이 딱 6월 같아요. 게다가 길바닥과 에어컨 사이 낙차가 지독해요. 같은 시간 안에 땀 흘리고 또 떨거든요. 사계절은 사람을 지치게 하지만 대신 1년에 네 번 리셋 버튼을 줘요.", "struct": [["1️⃣ 대상", "완전히 다른 곳으로 싱가포르 하나"], ["2️⃣ 대비", "사계절 번갈아 vs 계절이 하나뿐"], ["3️⃣ 장점", "겨울 코트 없음 · 옷장 갈 일 없음"], ["4️⃣ 단점", "12월이 6월 같아 시간이 안 흘러"], ["5️⃣ 마무리", "사계절은 리셋 버튼을 준다는 말 ⭐"]], "expr": [["couldn't be more different", "이보다 다를 수 없다"], ["take turns", "번갈아 오다"], ["it runs all year", "일 년 내내 이어지다"], ["a downpour most afternoons", "오후마다 쏟아지는 비"], ["stops as fast as it starts", "시작만큼 빨리 그친다"], ["nobody owns a winter coat", "겨울 코트가 없다"], ["no closet to swap", "옷장 갈아엎을 일 없다"], ["the forecast picks your clothes", "예보가 옷을 고른다"], ["nothing marks the time", "시간을 표시할 게 없다"], ["sweating and shivering", "땀 흘리다 떨다"], ["a reset button", "리셋 버튼"]], "audio": "audio/4_고난도/4-035 18. 날씨(Weather)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-035 18. 날씨(Weather)_비교.mp3"}, {"id": "4-036", "cat": "advanced", "catName": "고난도 질문", "num": 18, "topic": "날씨", "topicEn": "Weather", "type": "이슈", "badge": "36 이슈", "enQ": "Lately, the news has been full of stories about extreme weather, such as heatwaves and heavy rain. What kinds of stories have you recently seen or heard? How do you usually react when you hear about weather events like these?", "enA": "There has been a lot of it. Last summer we had the longest stretch on record of tropical nights — weeks where it never dropped below twenty-five after dark. Then the rain came all at once and flooded the underpasses across half the city.\n\nMy reaction has changed, though. The first few years I would stop and read the whole article and feel bad for an hour. Now I skim it and go straight to doing something — checking the drain outside, calling my mother on Sunday to ask whether her air conditioner is still working.\n\nWhat actually gets me is the word record. It shows up every summer now, and something that repeats every single year is not a record anymore — it is just the weather. That is the part I cannot unhear.", "koQ": "최근 폭염이나 폭우 같은 극한 날씨 뉴스가 많습니다. 어떤 이야기를 보거나 들었고, 이런 소식을 들으면 보통 어떻게 반응하나요?", "koA": "그런 뉴스가 정말 많았어요. 작년 여름엔 역대 가장 긴 열대야가 이어졌죠. 해가 지고도 몇 주 내내 25도 아래로 안 내려갔고요. 그러다 비가 한꺼번에 쏟아져서 도시 절반의 지하차도가 잠겼어요.\n\n다만 제 반응은 좀 바뀌었어요. 처음 몇 해는 하던 걸 멈추고 기사를 다 읽고 한 시간쯤 마음이 안 좋았거든요. 지금은 대충 훑고 바로 뭔가를 해요. 집 앞 배수구를 확인하고, 일요일에 엄마한테 전화해서 에어컨은 잘 돌아가냐고 묻고요.\n\n진짜로 걸리는 건 기록이라는 단어예요. 이제 여름마다 나오거든요. 해마다 반복되는 건 더는 기록이 아니라 그냥 날씨죠. 그 부분이 한 번 듣고 나면 잘 안 지워져요.", "struct": [["1️⃣ 사례", "역대 최장 열대야 · 기록적 폭우"], ["2️⃣ 장면", "한꺼번에 쏟아져 잠긴 도시 지하차도"], ["3️⃣ 반응", "예전엔 정독 · 지금은 훑고 행동"], ["4️⃣ 행동", "배수구 확인 · 일요일 엄마 통화"], ["5️⃣ 마무리", "매년 나오면 그건 기록이 아니다 ⭐"]], "expr": [["There has been a lot of it", "그런 게 정말 많았어요"], ["the longest stretch on record", "역대 가장 긴 기간"], ["tropical nights", "열대야"], ["never drop below ~", "~ 아래로 안 내려가다"], ["come all at once", "한꺼번에 쏟아지다"], ["flood the underpasses", "지하차도가 잠기다"], ["My reaction has changed", "반응이 바뀌었어요"], ["skim it", "대충 훑다"], ["go straight to doing something", "바로 행동으로 옮기다"], ["It shows up every summer", "여름마다 등장한다"], ["is not a record anymore", "더는 기록이 아니다"]], "audio": "audio/4_고난도/4-036 18. 날씨(Weather)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-036 18. 날씨(Weather)_이슈.mp3"}, {"id": "4-037", "cat": "advanced", "catName": "고난도 질문", "num": 19, "topic": "집", "topicEn": "Home", "type": "비교", "badge": "37 비교", "enQ": "How do you and your parents solve problems at home differently? When something goes wrong in your house, how do you handle it, and how do your parents handle problems in theirs? Tell me the similarities and differences.", "enA": "On paper we could not be more different. When something breaks here, my first move is my phone — I search the model number, watch somebody fix the same thing, and if that fails I book a technician through an app. I never open a wall.\n\nMy parents work the other way. My father goes for the toolbox in the drawer before anyone finishes the sentence. My mother makes one phone call — always to the same plumber who has been fixing that building for thirty years, or to somebody two floors down.\n\nWhere we overlap is timing: neither house lets a problem sit overnight. And honestly both of us end up calling someone — theirs has a name, mine has a rating. They fix things with a phone book; I fix things with a phone.", "koQ": "당신과 부모님은 집에서 생긴 문제를 어떻게 다르게 해결하나요? 비슷한 점과 다른 점을 말해 주세요.", "koA": "서류상으로는 저희가 이보다 다를 수 없어요. 여기서 뭔가 고장 나면 저는 제일 먼저 휴대폰을 들어요. 모델 번호를 검색하고, 같은 걸 고치는 영상을 보고, 그래도 안 되면 앱으로 기사님을 예약하죠. 벽은 절대 안 뚫고요.\n\n부모님은 반대로 하세요. 아빠는 말이 끝나기도 전에 서랍에서 공구함부터 꺼내세요. 엄마는 전화를 딱 한 통 하시고요. 그 건물을 30년째 봐 온 설비 아저씨나, 아래 두 층 사는 아는 분한테요.\n\n겹치는 건 속도예요. 두 집 다 문제를 하룻밤 넘기지 않아요. 그리고 솔직히 둘 다 결국은 누군가한테 전화를 걸어요. 부모님 쪽은 이름을 아는 사람이고, 제 쪽은 별점이 있는 사람일 뿐이죠. 부모님은 수첩으로 고치고 저는 폰으로 고치는 거예요.", "struct": [["1️⃣ 대비", "나는 검색 먼저 · 부모님은 손 먼저"], ["2️⃣ 본인", "영상 보고 안 되면 앱으로 예약 📱"], ["3️⃣ 부모", "아빠는 공구함 · 엄마는 전화 한 통"], ["4️⃣ 공통", "두 집 다 문제를 하룻밤 안 넘긴다 ⏰"], ["5️⃣ 마무리", "이름 아는 사람 vs 별점 있는 사람 ⭐"]], "expr": [["could not be more different", "이보다 다를 수 없다"], ["my first move is my phone", "제일 먼저 폰을 든다"], ["book a technician", "기사님을 예약하다"], ["I never open a wall", "벽은 절대 안 뚫는다"], ["go for the toolbox", "공구함부터 꺼내다"], ["make one phone call", "전화를 한 통 하다"], ["somebody two floors down", "아래 두 층 사는 분"], ["let a problem sit overnight", "문제를 하룻밤 넘기다"], ["end up ~ing", "결국 ~하게 되다"], ["theirs has a name", "그쪽은 이름이 있다"], ["mine has a rating", "내 쪽은 별점이 있다"]], "audio": "audio/4_고난도/4-037 19. 집(Home)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-037 19. 집(Home)_비교.mp3"}, {"id": "4-038", "cat": "advanced", "catName": "고난도 질문", "num": 19, "topic": "집", "topicEn": "Home", "type": "이슈", "badge": "38 이슈", "enQ": "What problems do most people face when renting a house or an apartment? What are they worried about, and how do these issues affect their lives? How do people deal with them?", "enA": "The worry that comes first is the deposit. It is a large amount of money sitting in somebody else's account for two years, and everyone knows a story about getting it back late or only after a fight. That one fear shapes the whole search.\n\nThe second problem is repairs. A leak or mould starts an argument about whose job it is, and because tenants do not want to annoy the landlord, small things get left alone until they are expensive ones.\n\nHow it affects life is simple: people move every two years, never fully unpack, and stop treating the place as theirs. What people do about it is get practical — photograph everything on move-in day, keep it in writing instead of on the phone, and ask about renewal a few months early.", "koQ": "대부분의 사람들이 집이나 아파트를 세 얻을 때 어떤 문제를 겪나요? 무엇을 걱정하고 어떻게 해결하나요?", "koA": "가장 먼저 오는 걱정은 보증금이에요. 큰돈이 2년 동안 남의 계좌에 들어가 있는 거잖아요. 늦게 돌려받았다거나 한바탕하고 나서야 받았다는 이야기를 다들 하나씩 알고 있고요. 그 불안 하나가 집 구하는 과정을 다 좌우해요.\n\n두 번째 문제는 수리예요. 누수나 곰팡이가 생기면 누구 책임이냐로 실랑이가 시작돼요. 세입자는 집주인을 성가시게 하기 싫으니까 작은 건 그냥 두게 되고요. 그러다 결국 비싼 문제가 됩니다.\n\n삶에 미치는 영향은 단순해요. 2년마다 이사하고, 짐을 끝까지 안 풀고, 이 집을 내 집처럼 대하지 않게 되죠. 그래서 사람들은 아주 현실적으로 대처해요. 입주하는 날 전부 사진으로 찍어 두고, 통화 대신 문자로 남기고, 갱신할 건지 몇 달 전에 미리 물어봅니다.", "struct": [["1️⃣ 걱정", "1순위는 보증금 · 남의 계좌에 2년"], ["2️⃣ 문제", "누수 · 곰팡이는 책임 공방부터"], ["3️⃣ 심리", "집주인 눈치에 작은 건 그냥 둔다"], ["4️⃣ 영향", "2년마다 이사 · 짐을 끝까지 안 푼다"], ["5️⃣ 대처", "사진 · 문자 기록 · 갱신 미리 확인 ⭐"]], "expr": [["sit in somebody else's account", "남의 계좌에 들어가 있다"], ["get it back late", "늦게 돌려받다"], ["only after a fight", "한바탕하고 나서야"], ["whose job it is", "누구 책임이냐"], ["annoy the landlord", "집주인을 성가시게 하다"], ["get left alone", "그냥 방치되다"], ["never fully unpack", "짐을 끝까지 안 푼다"], ["treat the place as theirs", "내 집처럼 대하다"], ["photograph everything", "전부 사진으로 찍다"], ["keep it in writing", "문자로 남기다"], ["ask about renewal early", "갱신을 미리 묻다"]], "audio": "audio/4_고난도/4-038 19. 집(Home)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-038 19. 집(Home)_이슈.mp3"}, {"id": "4-039", "cat": "advanced", "catName": "고난도 질문", "num": 20, "topic": "거주지·집", "topicEn": "Home", "type": "비교", "badge": "39 비교", "enQ": "People look for different things in a home. What do you think makes a home feel just right? Why does that matter so much to people?", "enA": "Everyone says space, but I think the real answer is light and quiet. A small room that gets the morning sun beats a big one that never does, and a neighbor who walks in heels above you can ruin an apartment that nobody could fault on paper.\n\nThe second thing is the route. Not the size — how the rooms line up. If you drop your bag, wash your hands and reach the kitchen without turning around twice, the place feels twice as big as the floor plan says.\n\nWhy it matters so much is that home is the only place that sees both ends of your day. Every small annoyance gets multiplied by three hundred and sixty-five. You do not notice a good home; you just stop bracing yourself at the door every evening.", "koQ": "사람들은 집에서 서로 다른 것을 중요하게 봅니다. 무엇이 집을 딱 알맞게 만든다고 생각하고, 왜 그게 중요할까요?", "koA": "다들 넓이라고 하는데, 진짜 답은 빛과 소음이라고 생각해요. 아침 해가 드는 작은 방이 해가 안 드는 큰 방보다 나아요. 위층에서 구두 신고 걷는 이웃 하나면 도면상 흠잡을 데 없는 집도 망가지고요.\n\n두 번째는 동선이에요. 크기가 아니라 방이 어떻게 이어지느냐요. 가방을 내려놓고 손을 씻고 두 번 되돌아가지 않고 주방까지 갈 수 있으면, 도면에 적힌 것보다 두 배는 넓게 느껴져요.\n\n이게 왜 그렇게 중요하냐면, 집은 하루의 시작과 끝을 다 보는 유일한 공간이거든요. 작은 불편 하나가 365를 곱해서 돌아와요. 좋은 집은 사실 눈에 안 띄어요. 그냥 저녁마다 현관에서 마음을 다잡지 않게 될 뿐이죠.", "struct": [["1️⃣ 주장", "넓이가 아니라 빛과 소음이 진짜 답"], ["2️⃣ 예시", "해 드는 작은 방 > 해 안 드는 큰 방"], ["3️⃣ 동선", "크기가 아니라 방이 이어지는 순서"], ["4️⃣ 이유", "하루의 시작과 끝을 다 보는 유일한 곳"], ["5️⃣ 마무리", "좋은 집은 아예 눈에 띄지 않는다 ⭐"]], "expr": [["the real answer is ~", "진짜 답은 ~이다"], ["get the morning sun", "아침 해가 들다"], ["walk in heels above you", "위층에서 구두를 신고"], ["ruin an apartment", "집을 망치다"], ["how the rooms line up", "방이 이어지는 순서"], ["without turning around twice", "두 번 되돌아가지 않고"], ["the floor plan", "도면, 평면도"], ["see both ends of your day", "하루의 양끝을 보다"], ["multiplied by 365", "365를 곱하다"], ["You do not notice ~", "~은 눈에 띄지 않는다"], ["stop bracing yourself", "마음을 다잡지 않게 되다"]], "audio": "audio/4_고난도/4-039 20. 거주지·집(Home)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-039 20. 거주지·집(Home)_비교.mp3"}, {"id": "4-040", "cat": "advanced", "catName": "고난도 질문", "num": 20, "topic": "거주지·집", "topicEn": "Home", "type": "이슈", "badge": "40 이슈", "enQ": "Housing problems are frequently covered in the news as a big concern in many communities. Have you seen any stories about housing issues that affect many people in your country? What solutions have been discussed in the news or proposed by local communities?", "enA": "This one is in the news constantly. The biggest story of the last few years has been deposit fraud — landlords taking more than the place was worth and young tenants losing everything they had saved. The reports all use the same shot: a stack of contracts spread out on a table.\n\nThe second story is cost. Young people spend a third of their pay on rent, so they move further and further out, commute longer, and plan everything else around that one number.\n\nAs for solutions, the news talks about making deposit insurance compulsory, opening the ownership records so anyone can check a building before signing, and building more public housing near the bigger stations. Personally, I think supply alone will not fix trust.", "koQ": "주거 문제는 뉴스에 자주 나옵니다. 당신 나라에서 많은 사람에게 영향을 주는 주거 문제와 논의된 해결책을 말해 주세요.", "koA": "이건 뉴스에 정말 자주 나와요. 최근 몇 년 가장 큰 이야기는 전세 사기였고요. 집주인이 집값보다 더 많은 보증금을 받고, 젊은 세입자들이 모아 둔 걸 다 잃었죠. 보도는 늘 같은 화면을 써요. 테이블 위에 쭉 펼쳐 놓은 계약서요.\n\n두 번째 이야기는 비용이에요. 젊은 사람들이 월급의 3분의 1을 집세로 내요. 그래서 점점 더 바깥으로 나가고, 출퇴근이 길어지고, 나머지 모든 걸 그 숫자 하나에 맞춰서 계획하게 되죠.\n\n해결책으로는, 보증보험을 의무화하자는 이야기, 등기 정보를 열어서 계약 전에 누구나 건물을 확인할 수 있게 하자는 이야기, 큰 역 근처에 공공주택을 더 짓자는 이야기가 나와요. 개인적으로는 공급만으로 신뢰가 회복되진 않는다고 봅니다.", "struct": [["1️⃣ 뉴스", "최근 몇 년 최대 이슈는 전세 사기"], ["2️⃣ 장면", "테이블에 펼쳐 놓은 계약서 화면 📺"], ["3️⃣ 둘째", "월급의 3분의 1이 집세로 나간다"], ["4️⃣ 해결", "보증보험 의무 · 등기 공개 · 공공주택"], ["5️⃣ 의견", "공급만으로 신뢰는 안 돌아온다 ⭐"]], "expr": [["be in the news constantly", "뉴스에 계속 나오다"], ["deposit fraud", "전세 사기"], ["more than the place was worth", "집값보다 많은"], ["lose everything they had saved", "모은 걸 다 잃다"], ["all use the same shot", "늘 같은 화면을 쓴다"], ["a third of their pay", "월급의 3분의 1"], ["plan everything around ~", "~에 맞춰 다 계획하다"], ["deposit insurance", "보증보험"], ["so anyone can check", "누구나 확인할 수 있게"], ["public housing", "공공주택"], ["supply alone will not ~", "공급만으로는 ~ 안 된다"]], "audio": "audio/4_고난도/4-040 20. 거주지·집(Home)_이슈.mp3", "label": "이슈", "qaudio": "audio_q/4_고난도/4-040 20. 거주지·집(Home)_이슈.mp3"}, {"id": "4-041", "cat": "advanced", "catName": "고난도 질문", "num": 21, "topic": "재활용", "topicEn": "Recycling", "type": "비교", "badge": "41 비교", "enQ": "How have recycling practices changed over the years? Are the items people recycle different from the past? Tell me about all the changes in your country's recycling system.", "enA": "Back then the list was short — paper, bottles, cans, and everything else went into one bag. Nobody rinsed anything, and nobody checked what the plastic was actually made of before throwing it out.\n\nThese days the list is a lot longer. Clear bottles go out on their own, film plastic has its own bag, and there are separate bins for batteries, light bulbs and old clothes downstairs. Bottles now arrive with no label at all so you do not have to peel one off.\n\nWhat changed the system was the rubbish we started making: delivery containers and padded parcels did not exist on the old list. The trade-off is that sorting now takes real attention — you have to know your plastics — but far less of it ends up buried in the ground.", "koQ": "재활용 관행은 수년간 어떻게 변했나요? 재활용하는 물품이 예전과 달라졌나요? 시스템의 변화를 말해 주세요.", "koA": "예전엔 목록이 짧았어요. 종이, 병, 캔이었고 나머지는 전부 한 봉투로 들어갔죠. 아무도 헹구지 않았고, 버리기 전에 그 플라스틱이 실제로 뭘로 만들어졌는지 확인하는 사람도 없었어요.\n\n요즘은 목록이 훨씬 길어요. 투명 페트병은 따로 나가고, 비닐은 자기 봉투가 있고, 건전지랑 형광등이랑 헌 옷은 아래층에 수거함이 따로 있어요. 생수병은 아예 라벨 없이 나와서 떼어낼 일도 없고요.\n\n시스템을 바꾼 건 우리가 새로 만들기 시작한 쓰레기예요. 배달 용기랑 완충재 택배 봉투는 예전 목록엔 아예 없던 거잖아요. 대신 잃은 건, 이제 분리배출이 진짜 신경을 써야 하는 일이 됐다는 거예요. 플라스틱 종류를 알아야 하거든요. 그래도 땅에 묻히는 양은 훨씬 줄었죠.", "struct": [["1️⃣ 과거", "목록은 짧고 나머지는 한 봉투로"], ["2️⃣ 태도", "헹구지도 않고 재질도 안 보던 시절"], ["3️⃣ 현재", "투명 페트 · 비닐 · 건전지 따로"], ["4️⃣ 제도", "무라벨 생수병 · 품목별 수거함"], ["5️⃣ 마무리", "신경은 늘고 묻히는 양은 줄어 ⭐"]], "expr": [["the list was short", "목록이 짧았다"], ["go into one bag", "한 봉투로 들어가다"], ["nobody checked ~", "아무도 확인하지 않았다"], ["go out on their own", "따로 나가다"], ["separate bins for ~", "~ 전용 수거함"], ["with no label at all", "라벨이 아예 없는"], ["peel off", "떼어내다"], ["padded parcels", "완충재 택배 봉투"], ["did not exist on the old list", "예전 목록엔 없던"], ["The trade-off is ~", "대신 잃는 건 ~이다"], ["know your plastics", "플라스틱 종류를 알다"]], "audio": "audio/4_고난도/4-041 21. 재활용(Recycling)_비교.mp3", "label": "비교", "qaudio": "audio_q/4_고난도/4-041 21. 재활용(Recycling)_비교.mp3"}, {"id": "4-042", "cat": "advanced", "catName": "고난도 질문", "num": 21, "topic": "재활용", "topicEn": "Recycling", "type": "이슈", "badge": "42 이슈", "enQ": "Talk about some recent recycling-related issues in your country. What was the news about, and what does the media say about the problem? What is your opinion, and how does this issue affect the environment?", "enA": "The story that keeps coming back is how little of it actually gets recycled. We sort carefully, but a large share is burned or buried anyway, usually because one dirty container is enough to ruin the whole batch.\n\nThe media splits into two camps. One side blames the household — rinse it, crush it, read the label. The other side says the packaging was never recyclable to begin with, so the sorting was decided before we touched it.\n\nPersonally, I side with the second one. No amount of rinsing fixes a container made of three materials glued together. As for the environment, the cost lands in the same places every time — more burning, fuller landfills, and plastic breaking down into pieces too small to collect.", "koQ": "당신 나라의 최근 재활용
